<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
  display: none;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const DURATION = 40;
const COUNTDOWN = 'COUNTDOWN';
const PLAYING = 'PLAYING';
const PAUSED = 'PAUSED';
const REFIRE_HOLD = 'REFIRE_HOLD';
const ENDED = 'ENDED';
const TAU = Math.PI * 2;
const Y_AXIS = new THREE.Vector3(0, 1, 0);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, v) => {
  const x = clamp((v - a) / (b - a), 0, 1);
  return x * x * (3 - 2 * x);
};
function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let random = mulberry32(42);
const audioRandom = mulberry32(4242);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.70;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03060d);
scene.fog = new THREE.FogExp2(0x111927, 0.00265);
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);

function canvasTexture(width, height, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  draw(canvas.getContext('2d'), width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.encoding = THREE.sRGBEncoding;
  texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return texture;
}

const glowTexture = canvasTexture(128, 128, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.08, 'rgba(255,255,255,.95)');
  g.addColorStop(0.28, 'rgba(255,255,255,.25)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});
const poolTexture = canvasTexture(256, 256, (ctx, w, h) => {
  const g = ctx.createRadialGradient(w / 2, h / 2, 2, w / 2, h / 2, w / 2);
  g.addColorStop(0, 'rgba(220,235,255,.8)');
  g.addColorStop(0.35, 'rgba(170,205,255,.42)');
  g.addColorStop(1, 'rgba(90,130,200,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});

function makeSky() {
  const texture = canvasTexture(2048, 1024, (ctx, w, h) => {
    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, '#01030a');
    gradient.addColorStop(0.48, '#050a16');
    gradient.addColorStop(0.72, '#0b1220');
    gradient.addColorStop(1, '#02050a');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);
    const city = ctx.createRadialGradient(w * 0.2, h * 0.62, 0, w * 0.2, h * 0.62, w * 0.22);
    city.addColorStop(0, 'rgba(135,75,38,.22)');
    city.addColorStop(0.45, 'rgba(90,48,32,.09)');
    city.addColorStop(1, 'rgba(20,15,25,0)');
    ctx.fillStyle = city;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 650; i++) {
      const x = random() * w;
      const y = random() * h * 0.57;
      const a = 0.15 + random() * 0.65;
      const r = random() < 0.04 ? 1.25 : 0.55;
      ctx.fillStyle = `rgba(190,210,235,${a})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }
    const mx = w * 0.73, my = h * 0.265, mr = 30;
    const mg = ctx.createRadialGradient(mx, my, mr * 0.2, mx, my, mr * 3.4);
    mg.addColorStop(0, 'rgba(180,200,225,.18)');
    mg.addColorStop(1, 'rgba(120,160,210,0)');
    ctx.fillStyle = mg;
    ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    ctx.fillStyle = '#a9b6c9';
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, TAU);
    ctx.fill();
    ctx.fillStyle = 'rgba(80,95,120,.22)';
    ctx.beginPath();
    ctx.arc(mx - 9, my + 6, 7, 0, TAU);
    ctx.arc(mx + 10, my - 8, 5, 0, TAU);
    ctx.fill();
  });
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(1850, 48, 24),
    new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide, fog: false, depthWrite: false })
  );
  sky.rotation.y = 1.1;
  sky.renderOrder = -100;
  scene.add(sky);
}
makeSky();

function makeEnvironment() {
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x050811);
  const panelGeo = new THREE.PlaneGeometry(9, 4);
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * TAU;
    const material = new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(3.5, 4.0, 5.0), side: THREE.DoubleSide });
    const panel = new THREE.Mesh(panelGeo, material);
    panel.position.set(Math.cos(a) * 24, 13 + (i % 2) * 8, Math.sin(a) * 24);
    panel.lookAt(0, 0, 0);
    envScene.add(panel);
  }
  const top = new THREE.Mesh(new THREE.PlaneGeometry(22, 22), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(0.35, 0.45, 0.75), side: THREE.DoubleSide }));
  top.position.y = 30;
  top.rotation.x = Math.PI / 2;
  envScene.add(top);
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileCubemapShader();
  const target = pmrem.fromScene(envScene, 0.035, 0.1, 100);
  scene.environment = target.texture;
  pmrem.dispose();
}
makeEnvironment();

const trackPoints = [
  [0, 0, 0], [200, 0, 0], [320, 5, 60], [340, 12, 180],
  [260, 20, 260], [120, 15, 240], [60, 8, 320], [-80, 4, 340],
  [-200, 0, 260], [-240, 0, 120], [-160, 0, 40], [-80, 0, 0]
].map(p => new THREE.Vector3(p[0], p[1], p[2]));
const circuit = new THREE.CatmullRomCurve3(trackPoints, true, 'centripetal');
circuit.arcLengthDivisions = 4096;
circuit.updateArcLengths();
const L = circuit.getLength();
const TRACK_SAMPLES = 4096;
const trackPositions = [];
const trackTangents = [];
const trackNormals = [];
for (let i = 0; i < TRACK_SAMPLES; i++) {
  const u = i / TRACK_SAMPLES;
  const p = circuit.getPointAt(u);
  const t = circuit.getTangentAt(u).normalize();
  trackPositions.push(p);
  trackTangents.push(t);
  trackNormals.push(new THREE.Vector3().crossVectors(t, Y_AXIS).normalize());
}
function wrapDistance(s) {
  return ((s % L) + L) % L;
}
function trackAt(s) {
  const f = wrapDistance(s) / L * TRACK_SAMPLES;
  const i = Math.floor(f) % TRACK_SAMPLES;
  const j = (i + 1) % TRACK_SAMPLES;
  const a = f - Math.floor(f);
  const p = trackPositions[i].clone().lerp(trackPositions[j], a);
  const t = trackTangents[i].clone().lerp(trackTangents[j], a).normalize();
  const n = new THREE.Vector3().crossVectors(t, Y_AXIS).normalize();
  const up = new THREE.Vector3().crossVectors(n, t).normalize();
  return { p, t, n, up };
}
function basisQuaternion(track) {
  return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(track.t, track.up, track.n));
}
function signedCurvature(s, look = 5) {
  const a = trackAt(s - look).t;
  const b = trackAt(s + look).t;
  const cross = new THREE.Vector3().crossVectors(a, b);
  return Math.atan2(cross.y, clamp(a.dot(b), -1, 1)) / (look * 2);
}

const checkpointRows = [
  [0,-8.0,-2.50,-16.0,2.50], [1,-8.0,-2.50,-16.0,2.50],
  [2,-8.0,-2.50,-16.0,2.50], [3,-8.0,-2.50,-16.0,2.50],
  [4,-2.3,-2.31,-11.5,2.36], [5,14.8,-1.46,3.1,1.65],
  [6,42.8,-0.47,29.8,0.76], [7,81.1,0.00,68.2,0.10],
  [8,128.9,0.00,115.9,0.00], [9,185.1,0.00,172.2,0.00],
  [10,248.1,0.00,235.3,0.00], [11,310.5,0.00,297.8,0.00],
  [12,354.6,0.00,342.1,0.00], [13,403.8,0.00,391.4,0.00],
  [14,456.5,0.00,444.4,0.00], [15,500.6,0.00,488.6,0.00],
  [16,553.0,0.00,541.2,0.00], [17,590.7,0.00,579.2,0.00],
  [18,627.7,0.00,616.4,0.00], [19,674.3,0.00,663.2,0.00],
  [20,716.6,0.00,705.7,0.00], [21,744.7,0.00,734.0,0.00],
  [22,782.0,0.00,771.5,0.00], [23,821.0,0.00,810.8,0.00],
  [24,855.1,0.00,845.1,0.00], [25,899.0,0.00,889.1,0.00],
  [26,951.7,0.00,942.1,0.00], [27,1007.7,0.00,998.2,0.00],
  [28,1069.6,0.00,1060.3,0.00], [29,1131.7,0.00,1122.5,0.00],
  [30,1194.2,0.00,1185.1,0.00], [31,1252.2,0.00,1243.1,0.00],
  [32,1289.7,0.00,1280.7,0.00], [33,1333.9,0.00,1324.9,0.00],
  [34,1387.1,-0.87,1380.4,1.62], [35,1447.7,-1.20,1446.1,3.40],
  [36,1514.0,-1.20,1516.7,3.40], [37,1583.6,-1.20,1587.1,3.40],
  [38,1649.5,-1.20,1653.4,3.40], [39,1710.4,-1.20,1714.9,3.40],
  [40,1766.3,-1.20,1771.1,3.40]
];
function makePCHIP(column) {
  const n = checkpointRows.length;
  const xs = checkpointRows.map(r => r[0]);
  const ys = checkpointRows.map(r => r[column]);
  const h = [], delta = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) {
    h[i] = xs[i + 1] - xs[i];
    delta[i] = (ys[i + 1] - ys[i]) / h[i];
  }
  function endpoint(h0, h1, d0, d1) {
    let v = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(v) !== Math.sign(d0)) v = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(v) > Math.abs(3 * d0)) v = 3 * d0;
    return v;
  }
  m[0] = endpoint(h[0], h[1], delta[0], delta[1]);
  m[n - 1] = endpoint(h[n - 2], h[n - 3], delta[n - 2], delta[n - 3]);
  for (let i = 1; i < n - 1; i++) {
    if (delta[i - 1] * delta[i] > 0) {
      const w1 = 2 * h[i] + h[i - 1];
      const w2 = h[i] + 2 * h[i - 1];
      m[i] = (w1 + w2) / (w1 / delta[i - 1] + w2 / delta[i]);
    }
  }
  return function(time, derivative = 0) {
    const t = clamp(time, 0, DURATION);
    let i = clamp(Math.floor(t), 0, n - 2);
    if (t >= DURATION) i = n - 2;
    const u = (t - xs[i]) / h[i];
    if (derivative === 1) {
      return ((6 * u * u - 6 * u) * ys[i] + (3 * u * u - 4 * u + 1) * h[i] * m[i] +
        (-6 * u * u + 6 * u) * ys[i + 1] + (3 * u * u - 2 * u) * h[i] * m[i + 1]) / h[i];
    }
    if (derivative === 2) {
      return ((12 * u - 6) * ys[i] + (6 * u - 4) * h[i] * m[i] +
        (-12 * u + 6) * ys[i + 1] + (6 * u - 2) * h[i] * m[i + 1]) / (h[i] * h[i]);
    }
    return (2 * u * u * u - 3 * u * u + 1) * ys[i] + (u * u * u - 2 * u * u + u) * h[i] * m[i] +
      (-2 * u * u * u + 3 * u * u) * ys[i + 1] + (u * u * u - u * u) * h[i] * m[i + 1];
  };
}
const motion = [1, 2, 3, 4].map(column => makePCHIP(column));
function motionState(car, time) {
  const k = car * 2;
  return { s: motion[k](time), d: motion[k + 1](time), speed: motion[k](time, 1), acceleration: motion[k](time, 2) };
}
function crossingTime(car) {
  let lo = 30, hi = 40;
  for (let i = 0; i < 48; i++) {
    const mid = (lo + hi) * 0.5;
    if (motionState(car, mid).s < L) lo = mid;
    else hi = mid;
  }
  return (lo + hi) * 0.5;
}
const BLUE_FINISH = crossingTime(1);
const RED_FINISH = crossingTime(0);
function carKinematics(car, time) {
  const state = motionState(car, time);
  const track = trackAt(state.s);
  const position = track.p.clone().addScaledVector(track.n, state.d);
  return Object.assign(state, { track, position });
}
function localPointAt(car, time, x, y, z) {
  const k = carKinematics(car, time);
  return k.position.clone().addScaledVector(k.track.t, x).addScaledVector(k.track.up, y).addScaledVector(k.track.n, z);
}

const unitBox = new THREE.BoxGeometry(1, 1, 1);
const unitCylinder = new THREE.CylinderGeometry(1, 1, 1, 12, 1, false);
function box(parent, material, sx, sy, sz, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(unitBox, material);
  mesh.scale.set(sx, sy, sz);
  mesh.position.set(x, y, z);
  parent.add(mesh);
  return mesh;
}
function beam(parent, material, a, b, radius = 0.025) {
  const direction = b.clone().sub(a);
  const mesh = new THREE.Mesh(unitCylinder, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.scale.set(radius, direction.length(), radius);
  mesh.quaternion.setFromUnitVectors(Y_AXIS, direction.normalize());
  parent.add(mesh);
  return mesh;
}
function prismXZ(points, bottom, top, material) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: top - bottom, bevelEnabled: false, curveSegments: 1 });
  geometry.rotateX(Math.PI / 2);
  geometry.translate(0, top, 0);
  const mesh = new THREE.Mesh(geometry, material);
  return mesh;
}
function panelXY(points, z, thickness, material) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, { depth: thickness, bevelEnabled: false, curveSegments: 1 });
  geometry.translate(0, 0, z - thickness / 2);
  return new THREE.Mesh(geometry, material);
}
function loftX(sections, material, radialSegments = 12) {
  const vertices = [], indices = [];
  for (const section of sections) {
    for (let j = 0; j < radialSegments; j++) {
      const a = j / radialSegments * TAU;

function makeTerrain() {
  const geometry = new THREE.PlaneGeometry(1500, 1300, 72, 64);
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(40, 0, 180);
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i), z = position.getZ(i);
    let best = 0, bestD2 = Infinity;
    for (let j = 0; j < TRACK_SAMPLES; j += 32) {
      const p = trackPositions[j];
      const d2 = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z);
      if (d2 < bestD2) { bestD2 = d2; best = j; }
    }
    for (let j = best - 32; j <= best + 32; j += 4) {
      const p = trackPositions[(j + TRACK_SAMPLES) % TRACK_SAMPLES];
      const d2 = (p.x - x) * (p.x - x) + (p.z - z) * (p.z - z);
      if (d2 < bestD2) { bestD2 = d2; best = (j + TRACK_SAMPLES) % TRACK_SAMPLES; }
    }
    const distance = Math.sqrt(bestD2);
    const elevation = trackPositions[best].y;
    const hills = (Math.sin(x * 0.011 + z * 0.006) + Math.sin(z * 0.018 - x * 0.004) * 0.55) * 14;
    const rolling = smoothstep(16, 180, distance) * hills;
    const y = elevation - 0.22 - Math.min(9, distance * 0.018) + rolling;
    position.setY(i, y);
  }
  geometry.computeVertexNormals();
  const terrain = new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0x030609, roughness: 0.98, metalness: 0.02, envMapIntensity: 0.08 }));
  terrain.receiveShadow = true;
  scene.add(terrain);
}

      const sourcePosition = k.position.clone().add(new THREE.Vector3(0, 0.48, 0));
      this.position(voice.panner, sourcePosition);
      const line = sourcePosition.clone().sub(camera.position);
      const distance = Math.max(0.1, line.length());
      line.divideScalar(distance);
      const lateralSpeed = motion[car * 2 + 1](time, 1);
      const velocity = k.track.t.clone().multiplyScalar(k.speed).addScaledVector(k.track.n, lateralSpeed);
      const doppler = nearCut ? 1 : clamp((343 + cameraVelocity.dot(line)) / (343 + velocity.dot(line)), 0.84, 1.18);
      for (const item of voice.oscillators) this.param(item.oscillator.frequency, firing * item.harmonic * doppler, 0.012);
      const throttle = clamp(0.3 + k.acceleration * 0.075, 0.06, 1);
      const rpmLevel = clamp((gearbox.rpm - 5000) / 7000, 0, 1);
      const onboard = car === 1 && time >= 15 && time < 20;
      const level = (0.036 + throttle * 0.047 + rpmLevel * 0.018) * gearbox.dip * (onboard ? 1.5 : 1);
      this.param(voice.engineGain.gain, level);
      this.param(voice.engineFilter.frequency, (onboard ? 1450 : 4300 + throttle * 1900) * doppler);
      this.param(voice.engineNoiseFilter.frequency, (750 + gearbox.rpm * 0.13) * doppler);
      this.param(voice.turbo.frequency, (1100 + gearbox.rpm * 0.44) * doppler);
      this.param(voice.turboGain.gain, (0.001 + rpmLevel * rpmLevel * 0.013) * (0.4 + throttle * 0.6));
      const speedLevel = clamp(k.speed / 90, 0, 1);
      this.param(voice.hissFilter.frequency, 650 + k.speed * 22);
      this.param(voice.hissGain.gain, 0.004 + speedLevel * 0.032);
      const launch = smoothstep(3, 3.12, time) * (1 - smoothstep(4.55, 5, time));
      const braking = clamp(-k.acceleration / 8.5, 0, 1);
      const cornerLoad = clamp(Math.abs(signedCurvature(k.s)) * k.speed * k.speed / 11, 0, 1);
      const squeal = launch * 0.025 + braking * (0.25 + cornerLoad * 0.75) * 0.019 + cornerLoad * braking * 0.008;
      this.param(voice.squeal.frequency, (650 + k.speed * 10 + cornerLoad * 240) * doppler);
      this.param(voice.squealGain.gain, squeal);
      this.param(voice.brakeGain.gain, braking * braking * braking * 0.0055);
      const sparking = k.speed > 200 / 3.6 || k.acceleration < -4.2;
      const crackle = Math.pow(Math.max(0, Math.sin(TAU * 27 * time + voice.phase)), 5);
      this.param(voice.sparkGain.gain, sparking ? 0.003 + crackle * 0.012 : 0, 0.008);
    }
    const swell = smoothstep(33, BLUE_FINISH, time);
    const roar = smoothstep(BLUE_FINISH, BLUE_FINISH + 0.22, time) * (1 - 0.35 * smoothstep(38, 40, time));
    this.param(this.crowdGain.gain, 0.008 + swell * 0.022 + roar * 0.06);
    this.param(this.crowdFilter.frequency, 650 + swell * 500 + roar * 1100);
    const wind = time >= 15 && time < 20 ? clamp(motionState(1, time).speed / 90, 0, 1) : 0;
    this.param(this.windGain.gain, wind * 0.036);
    this.param(this.windFilter.frequency, 550 + wind * 1150);
    if (allowEvents && time > previousTime) {
      for (const event of this.events) {
        if (event.time > previousTime && event.time <= time) {
          if (event.type === 'beep') this.beep(event.index);
          else if (event.type === 'drs') this.click(localPointAt(1, event.time, -2.25, 0.95, 0), event.open, false, event.open ? 1.35 : 0.9);
          else if (event.type === 'shutter') this.click(event.position, true, true, event.rate);
        }
      }
    }
  }
}
const sound = audioContext ? new RaceAudio(audioContext) : null;

const countdownElement = document.getElementById('countdown');
const scrubber = document.getElementById('scrubber');
const toggleButton = document.getElementById('btn-toggle');
const refireButton = document.getElementById('btn-refire');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const speedPills = Array.from(document.querySelectorAll('.speed-pill'));
let playbackState = COUNTDOWN;
let playbackSpeed = 1.0;
let simTime = 0.000;
let countdownElapsed = 0;
let holdElapsed = 0;
let lastTimestamp = null;
let isScrubbing = false;

function setTogglePlaying(playing) {
  iconPause.style.display = playing ? '' : 'none';
  iconPlay.style.display = playing ? 'none' : '';
  toggleButton.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}
function hideCountdown() {
  countdownElement.style.display = 'none';
  countdownElement.textContent = '';
}
function updateCountdown() {
  countdownElement.style.display = 'block';
  countdownElement.textContent = countdownElapsed < 1 ? '3' : (countdownElapsed < 2 ? '2' : '1');
}
function stopSound() {
  if (sound) sound.silence();
}

toggleButton.addEventListener('click', () => {
  if (playbackState === PLAYING) {
    playbackState = PAUSED;
    setTogglePlaying(false);
    stopSound();
  } else if (playbackState === COUNTDOWN || playbackState === REFIRE_HOLD) {
    hideCountdown();
    simTime = 0.000;
    scrubber.value = '0';
    playbackState = PAUSED;
    setTogglePlaying(false);
    stopSound();
    renderAt(simTime);
  } else if (playbackState === PAUSED) {
    hideCountdown();
    playbackState = PLAYING;
    setTogglePlaying(true);
  } else if (playbackState === ENDED) {
    hideCountdown();
    simTime = 0.000;
    scrubber.value = '0';
    playbackState = PLAYING;
    setTogglePlaying(true);
    stopSound();
    renderAt(simTime);
  }
});
refireButton.addEventListener('click', () => {
  hideCountdown();
  simTime = 0.000;
  scrubber.value = '0';
  countdownElapsed = 0;
  holdElapsed = 0;
  playbackState = REFIRE_HOLD;
  setTogglePlaying(true);
  stopSound();
  renderAt(simTime);
});
for (const pill of speedPills) {
  pill.addEventListener('click', () => {
    playbackSpeed = parseFloat(pill.dataset.speed);
    for (const other of speedPills) {
      const active = other === pill;
      other.classList.toggle('is-active', active);
      other.setAttribute('aria-checked', active ? 'true' : 'false');
    }
  });
}
scrubber.addEventListener('pointerdown', () => { isScrubbing = true; });
window.addEventListener('pointerup', () => { isScrubbing = false; });
window.addEventListener('pointercancel', () => { isScrubbing = false; });
scrubber.addEventListener('input', () => {
  hideCountdown();
  simTime = parseFloat(scrubber.value);
  playbackState = PAUSED;
  setTogglePlaying(false);
  stopSound();
  renderAt(simTime);
});
window.addEventListener('resize', () => {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderAt(simTime);
});

function animationFrame(timestamp) {
  if (lastTimestamp === null) {
    lastTimestamp = timestamp;
    if (playbackState === COUNTDOWN) {
      countdownElapsed = 0;
      updateCountdown();
    } else hideCountdown();
    requestAnimationFrame(animationFrame);
    return;
  }
  const rawDt = Math.max(0, (timestamp - lastTimestamp) / 1000);
  const dt = Math.min(rawDt, 0.1);
  lastTimestamp = timestamp;
  const previousTime = simTime;
  let advanced = false;
  if (playbackState === COUNTDOWN) {
    countdownElapsed += dt;
    if (countdownElapsed >= 3.000) {
      hideCountdown();
      playbackState = PLAYING;
      setTogglePlaying(true);
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      advanced = true;
    } else {
      simTime = 0.000;
      scrubber.value = '0';
      updateCountdown();
    }
  } else if (playbackState === REFIRE_HOLD) {
    hideCountdown();
    holdElapsed += dt;
    if (holdElapsed >= 1.000) {
      playbackState = PLAYING;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      advanced = true;
    }
  } else if (playbackState === PLAYING) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    scrubber.value = simTime.toFixed(3);
    advanced = true;
    if (simTime >= DURATION) {
      simTime = DURATION;
      scrubber.value = DURATION.toFixed(3);
      playbackState = ENDED;
      setTogglePlaying(false);
    }
  }
  renderAt(simTime);
  if (sound) sound.update(simTime, previousTime, advanced, playbackState === PLAYING, isScrubbing);
  requestAnimationFrame(animationFrame);
}

setTogglePlaying(true);
renderAt(0.000);
requestAnimationFrame(animationFrame);
</script>
</body>
</html>
