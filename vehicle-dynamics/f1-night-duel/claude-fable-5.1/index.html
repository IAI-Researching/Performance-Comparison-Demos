<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ============================================================
   F1 NIGHT DUEL — single-file Three.js r128 simulation
   Everything below is a pure function of simTime (deterministic).
   ============================================================ */
const DURATION = 40;
const SEED = 42;
const AUDIO_SEED = 4242;

// ---------- Seeded PRNG (Mulberry32) ----------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(SEED);                 // simulation / geometry PRNG
const rnd = () => rng();
const rndRange = (a, b) => a + (b - a) * rng();
function hash2(x, y) {                      // deterministic integer hash -> [0,1)
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function valueNoise(x, y, period) {         // tileable value noise, period in cells
  const xi = Math.floor(x), yi = Math.floor(y);
  const fx = x - xi, fy = y - yi;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const w = (ix, iy) => hash2(((ix % period) + period) % period, ((iy % period) + period) % period);
  const a = w(xi, yi), b = w(xi + 1, yi), c = w(xi, yi + 1), d = w(xi + 1, yi + 1);
  return (a + (b - a) * sx) * (1 - sy) + (c + (d - c) * sx) * sy;
}
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }

// ---------- Monotone cubic (Fritsch–Carlson / PCHIP) ----------
function pchip(xs, ys) {
  const n = xs.length;
  const h = new Array(n - 1), del = new Array(n - 1);
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; del[i] = (ys[i + 1] - ys[i]) / h[i]; }
  const m = new Array(n).fill(0);
  for (let i = 1; i < n - 1; i++) {
    if (del[i - 1] * del[i] > 0) {
      const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1];
      m[i] = (w1 + w2) / (w1 / del[i - 1] + w2 / del[i]);
    } else m[i] = 0;
  }
  function endSlope(h0, h1, d0, d1) {
    let d = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (Math.sign(d) !== Math.sign(d0)) d = 0;
    else if (Math.sign(d0) !== Math.sign(d1) && Math.abs(d) > 3 * Math.abs(d0)) d = 3 * d0;
    return d;
  }
  m[0] = endSlope(h[0], h[1], del[0], del[1]);
  m[n - 1] = endSlope(h[n - 2], h[n - 3], del[n - 2], del[n - 3]);
  function seg(t) {
    let lo = 0, hi = n - 2;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (xs[mid] <= t) lo = mid; else hi = mid - 1; }
    return lo;
  }
  const x0 = xs[0], x1 = xs[n - 1];
  return {
    at(t) {
      t = t < x0 ? x0 : (t > x1 ? x1 : t); const i = seg(t); const hh = h[i], u = (t - xs[i]) / hh, u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * hh * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * hh * m[i + 1];
    },
    d1(t) {
      t = t < x0 ? x0 : (t > x1 ? x1 : t); const i = seg(t); const hh = h[i], u = (t - xs[i]) / hh, u2 = u * u;
      return ((6 * u2 - 6 * u) * ys[i] + (3 * u2 - 4 * u + 1) * hh * m[i] + (-6 * u2 + 6 * u) * ys[i + 1] + (3 * u2 - 2 * u) * hh * m[i + 1]) / hh;
    },
    d2(t) {
      t = t < x0 ? x0 : (t > x1 ? x1 : t); const i = seg(t); const hh = h[i], u = (t - xs[i]) / hh;
      return ((12 * u - 6) * ys[i] + (6 * u - 4) * hh * m[i] + (-12 * u + 6) * ys[i + 1] + (6 * u - 2) * hh * m[i + 1]) / (hh * hh);
    }
  };
}

// ---------- Standardised checkpoint table: t, sR, dR, sB, dB ----------
const CHECKPOINTS = [
  [0, -8.0, -2.50, -16.0, 2.50], [1, -8.0, -2.50, -16.0, 2.50], [2, -8.0, -2.50, -16.0, 2.50], [3, -8.0, -2.50, -16.0, 2.50],
  [4, -2.3, -2.31, -11.5, 2.36], [5, 14.8, -1.46, 3.1, 1.65], [6, 42.8, -0.47, 29.8, 0.76], [7, 81.1, 0.00, 68.2, 0.10],
  [8, 128.9, 0, 115.9, 0], [9, 185.1, 0, 172.2, 0], [10, 248.1, 0, 235.3, 0], [11, 310.5, 0, 297.8, 0],
  [12, 354.6, 0, 342.1, 0], [13, 403.8, 0, 391.4, 0], [14, 456.5, 0, 444.4, 0], [15, 500.6, 0, 488.6, 0],
  [16, 553.0, 0, 541.2, 0], [17, 590.7, 0, 579.2, 0], [18, 627.7, 0, 616.4, 0], [19, 674.3, 0, 663.2, 0],
  [20, 716.6, 0, 705.7, 0], [21, 744.7, 0, 734.0, 0], [22, 782.0, 0, 771.5, 0], [23, 821.0, 0, 810.8, 0],
  [24, 855.1, 0, 845.1, 0], [25, 899.0, 0, 889.1, 0], [26, 951.7, 0, 942.1, 0], [27, 1007.7, 0, 998.2, 0],
  [28, 1069.6, 0, 1060.3, 0], [29, 1131.7, 0, 1122.5, 0], [30, 1194.2, 0, 1185.1, 0], [31, 1252.2, 0, 1243.1, 0],
  [32, 1289.7, 0, 1280.7, 0], [33, 1333.9, 0, 1324.9, 0], [34, 1387.1, -0.87, 1380.4, 1.62], [35, 1447.7, -1.20, 1446.1, 3.40],
  [36, 1514.0, -1.20, 1516.7, 3.40], [37, 1583.6, -1.20, 1587.1, 3.40], [38, 1649.5, -1.20, 1653.4, 3.40],
  [39, 1710.4, -1.20, 1714.9, 3.40], [40, 1766.3, -1.20, 1771.1, 3.40]
];
const CK_T = CHECKPOINTS.map(r => r[0]);
const PATH_R = { s: pchip(CK_T, CHECKPOINTS.map(r => r[1])), d: pchip(CK_T, CHECKPOINTS.map(r => r[2])) };
const PATH_B = { s: pchip(CK_T, CHECKPOINTS.map(r => r[3])), d: pchip(CK_T, CHECKPOINTS.map(r => r[4])) };

// ---------- Circuit centreline ----------
const CONTROL_POINTS = [
  [0, 0, 0], [200, 0, 0], [320, 5, 60], [340, 12, 180], [260, 20, 260], [120, 15, 240],
  [60, 8, 320], [-80, 4, 340], [-200, 0, 260], [-240, 0, 120], [-160, 0, 40], [-80, 0, 0]
];
const centreCurve = new THREE.CatmullRomCurve3(CONTROL_POINTS.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, 'centripetal');
centreCurve.arcLengthDivisions = 4000;
const TRACK_LEN = centreCurve.getLength();    // ≈ 1551.65 m
const TN = 4096;                               // arc-length samples
const trkPos = new Float64Array(TN * 3), trkTan = new Float64Array(TN * 3), trkCurv = new Float64Array(TN);
(function buildTrackTable() {
  const p = new THREE.Vector3(), t = new THREE.Vector3();
  for (let i = 0; i < TN; i++) {
    const u = i / TN;
    centreCurve.getPointAt(u, p); centreCurve.getTangentAt(u, t); t.normalize();
    trkPos[i * 3] = p.x; trkPos[i * 3 + 1] = p.y; trkPos[i * 3 + 2] = p.z;
    trkTan[i * 3] = t.x; trkTan[i * 3 + 1] = t.y; trkTan[i * 3 + 2] = t.z;
  }
  const ds = TRACK_LEN / TN, raw = new Float64Array(TN);
  for (let i = 0; i < TN; i++) {
    const j = (i + 1) % TN;
    const ax = trkTan[i * 3], az = trkTan[i * 3 + 2], bx = trkTan[j * 3], bz = trkTan[j * 3 + 2];
    raw[i] = -(az * bx - ax * bz) / ds;      // signed: + = right-hand turn
  }
  const W = 10;
  for (let i = 0; i < TN; i++) { let s = 0; for (let k = -W; k <= W; k++) s += raw[(i + k + TN) % TN]; trkCurv[i] = s / (2 * W + 1); }
})();
function wrapS(s) { let u = s / TRACK_LEN; u -= Math.floor(u); return u * TRACK_LEN; }
// Track frame at arc-length s: pos, tan (unit, with slope), nrm (right-hand, horizontal), up, curv
function makeFrame() { return { pos: new THREE.Vector3(), tan: new THREE.Vector3(), nrm: new THREE.Vector3(), up: new THREE.Vector3(), curv: 0 }; }
function trackAt(s, out) {
  let u = s / TRACK_LEN; u -= Math.floor(u);
  const f = u * TN; let i = Math.floor(f); const w = f - i; i = i % TN; const j = (i + 1) % TN;
  const i3 = i * 3, j3 = j * 3;
  out.pos.set(trkPos[i3] + (trkPos[j3] - trkPos[i3]) * w, trkPos[i3 + 1] + (trkPos[j3 + 1] - trkPos[i3 + 1]) * w, trkPos[i3 + 2] + (trkPos[j3 + 2] - trkPos[i3 + 2]) * w);
  out.tan.set(trkTan[i3] + (trkTan[j3] - trkTan[i3]) * w, trkTan[i3 + 1] + (trkTan[j3 + 1] - trkTan[i3 + 1]) * w, trkTan[i3 + 2] + (trkTan[j3 + 2] - trkTan[i3 + 2]) * w).normalize();
  out.nrm.set(-out.tan.z, 0, out.tan.x).normalize();
  out.up.crossVectors(out.nrm, out.tan).normalize();
  out.curv = trkCurv[i] + (trkCurv[j] - trkCurv[i]) * w;
  return out;
}
const _tf = makeFrame();
function trackPoint(s, d, h) {               // new Vector3 at C(s) + d*n + h*up(0,1,0)
  trackAt(s, _tf);
  return new THREE.Vector3(_tf.pos.x + _tf.nrm.x * d, _tf.pos.y + h, _tf.pos.z + _tf.nrm.z * d);
}

// ---------- Geometry helpers ----------
function mergeGeometries(geoms) {
  let nv = 0, ni = 0, hasUv = true;
  for (const g of geoms) { nv += g.attributes.position.count; ni += g.index ? g.index.count : g.attributes.position.count; if (!g.attributes.uv) hasUv = false; }
  const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), uv = hasUv ? new Float32Array(nv * 2) : null;
  const idx = new (nv > 65535 ? Uint32Array : Uint16Array)(ni);
  let vo = 0, io = 0;
  for (const g of geoms) {
    if (!g.attributes.normal) g.computeVertexNormals();
    const p = g.attributes.position, n = g.attributes.normal, c = p.count;
    pos.set(p.array.subarray(0, c * 3), vo * 3); nor.set(n.array.subarray(0, c * 3), vo * 3);
    if (uv) uv.set(g.attributes.uv.array.subarray(0, c * 2), vo * 2);
    if (g.index) { const ia = g.index.array; for (let k = 0; k < ia.length; k++) idx[io + k] = ia[k] + vo; io += ia.length; }
    else { for (let k = 0; k < c; k++) idx[io + k] = k + vo; io += c; }
    vo += c;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  if (uv) out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}
function bakeMesh(mesh) { mesh.updateMatrix(); const g = mesh.geometry.clone(); g.applyMatrix4(mesh.matrix); return g; }
function mergeMeshes(meshes, material) { const m = new THREE.Mesh(mergeGeometries(meshes.map(bakeMesh)), material); return m; }

// Loft a closed outline through sections along X. sections: [{x, pts:[[y,z],...]}], equal point counts.
function loft(sections, opts) {
  opts = opts || {};
  const N = sections[0].pts.length, R = sections.length;
  const pos = [], uv = [], idx = [];
  const xmin = Math.min(...sections.map(s => s.x)), xmax = Math.max(...sections.map(s => s.x));
  for (let r = 0; r < R; r++) {
    const sec = sections[r];
    for (let i = 0; i <= N; i++) { const p = sec.pts[i % N]; pos.push(sec.x, p[0], p[1]); uv.push((sec.x - xmin) / ((xmax - xmin) || 1), i / N); }
  }
  for (let r = 0; r < R - 1; r++) for (let i = 0; i < N; i++) {
    const a = r * (N + 1) + i, b = a + 1, c = a + (N + 1), d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  // orientation check: face normal of a mid-ring quad vs outward direction
  const r0 = Math.floor((R - 1) / 2), s0 = sections[r0];
  let cy = 0, cz = 0; for (const p of s0.pts) { cy += p[0]; cz += p[1]; } cy /= N; cz /= N;
  const i0 = r0 * (N + 1), ia = i0 + (N >> 1), ib = ia + 1, ic = ia + N + 1;
  const A = new THREE.Vector3(pos[ia * 3], pos[ia * 3 + 1], pos[ia * 3 + 2]);
  const B = new THREE.Vector3(pos[ib * 3], pos[ib * 3 + 1], pos[ib * 3 + 2]);
  const C = new THREE.Vector3(pos[ic * 3], pos[ic * 3 + 1], pos[ic * 3 + 2]);
  const fn = new THREE.Vector3().subVectors(C, A).cross(new THREE.Vector3().subVectors(B, A));
  const outward = new THREE.Vector3(0, A.y - cy, A.z - cz);
  let flip = fn.dot(outward) < 0;
  if (flip) for (let k = 0; k < idx.length; k += 3) { const t = idx[k + 1]; idx[k + 1] = idx[k + 2]; idx[k + 2] = t; }
  // caps
  const addCap = (r, dirSign) => {
    const sec = sections[r]; let cy2 = 0, cz2 = 0; for (const p of sec.pts) { cy2 += p[0]; cz2 += p[1]; } cy2 /= N; cz2 /= N;
    const ci = pos.length / 3; pos.push(sec.x, cy2, cz2); uv.push(r === 0 ? 0 : 1, 0.5);
    for (let i = 0; i < N; i++) {
      const a = r * (N + 1) + i, b = r * (N + 1) + i + 1;
      // orientation: want normal along dirSign * x
      const pa = new THREE.Vector3(pos[a * 3], pos[a * 3 + 1], pos[a * 3 + 2]), pb = new THREE.Vector3(pos[b * 3], pos[b * 3 + 1], pos[b * 3 + 2]), pc = new THREE.Vector3(sec.x, cy2, cz2);
      const nrm = new THREE.Vector3().subVectors(pb, pa).cross(new THREE.Vector3().subVectors(pc, pa));
      if (nrm.x * dirSign >= 0) idx.push(a, b, ci); else idx.push(b, a, ci);
    }
  };
  if (opts.capStart) addCap(0, -1);
  if (opts.capEnd) addCap(R - 1, 1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  // merge seam normals
  const nrm = g.attributes.normal;

function ribbon(ranges, dL, dR, yOff, vScale, opts) {

        const fa = a / across, d = dL + (dR - dL) * fa;
        const yl = typeof yOff === 'function' ? yOff(fa) : yOff;
        pos.push(f.pos.x + f.nrm.x * d, f.pos.y + yl, f.pos.z + f.nrm.z * d);

      pos.push(x, f.pos.y + y0, z, x, f.pos.y + y1, z);

const coneUniforms = { uFogDensity: { value: FOG_DENSITY }, uIntensity: { value: 0.11 }, uColor: { value: new THREE.Color(0.55, 0.66, 0.9) } };
(function buildMasts() {
  const poles = [], heads = [], panels = [];
  const coneMat = new THREE.ShaderMaterial({
    uniforms: coneUniforms,
    vertexShader: `
      varying float vT; varying float vRim; varying float vFog;
      uniform float uFogDensity;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vT = position.y / 32.7 + 0.5;
        vec3 n = normalize(normalMatrix * normal);
        vRim = abs(dot(n, normalize(-mv.xyz)));
        float dd = length(mv.xyz);
        vFog = exp(-uFogDensity * uFogDensity * dd * dd);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      varying float vT; varying float vRim; varying float vFog;
      uniform float uIntensity; uniform vec3 uColor;
      void main() {
        float along = pow(clamp(vT, 0.0, 1.0), 2.2);
        float a = uIntensity * along * (0.25 + 0.75 * vRim) * vFog;
        gl_FragColor = vec4(uColor * a, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide
  });
  const coneGeo = new THREE.CylinderGeometry(1.4, 21, 32.7, 28, 1, true);
  const up = new THREE.Vector3(0, 1, 0);
  for (const m of masts) {

    const toTrack = m.target.clone().sub(m.lamp).normalize();
    const yaw = Math.atan2(toTrack.x, toTrack.z);
    const head = new THREE.BoxGeometry(3.8, 1.1, 0.5); head.rotateY(yaw); head.translate(m.lamp.x, m.lamp.y, m.lamp.z); heads.push(head);
    const frame = new THREE.BoxGeometry(0.3, 2.2, 0.3); frame.translate(m.lamp.x, m.lamp.y - 0.4, m.lamp.z); heads.push(frame);
    const panel = new THREE.PlaneGeometry(3.5, 0.95);

  playbackSpeed = parseFloat(p.getAttribute('data-speed'));
  pills.forEach(q => { const on = q === p; q.classList.toggle('is-active', on); q.setAttribute('aria-checked', on ? 'true' : 'false'); });
}));
scrubber.addEventListener('input', () => {
  hideCountdown();
  simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
  setState('PAUSED'); setPlayIcon(false);
  AUDIO.onSeek(simTime);
  renderAt(simTime);
});
window.addEventListener('pointerdown', () => AUDIO.resume());
window.addEventListener('keydown', () => AUDIO.resume());

// initial resting scene, then the countdown starts on the first animation frame
showCountdown('3');
renderAt(0);
function frame(now) {
  requestAnimationFrame(frame);
  const nowS = now / 1000;
  const dt = lastFrameTime === null ? 0 : Math.min(nowS - lastFrameTime, 0.1);
  lastFrameTime = nowS;
  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3) { hideCountdown(); setState('PLAYING'); setPlayIcon(true); }
    else showCountdown(countdownElapsed < 1 ? '3' : (countdownElapsed < 2 ? '2' : '1'));
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1) setState('PLAYING');
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    scrubber.value = simTime.toFixed(3);
    if (simTime >= DURATION) {
      simTime = DURATION; scrubber.value = DURATION.toFixed(3);
      renderAt(simTime);
      setState('ENDED'); setPlayIcon(false);
      AUDIO.update(simTime, dt, state);
      return;
    }
  }
  renderAt(simTime);
  AUDIO.update(simTime, dt, state);
}
requestAnimationFrame(frame);
</script>
</body>
