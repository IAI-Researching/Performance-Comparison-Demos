html, body {

  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);

}

#dock {

  height: 44px;

  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);

  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;

  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

  height: 28px;

  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  border: 1px solid transparent;

  color: rgba(255, 255, 255, 0.6);

  font-weight: 500;

      position(v.pan,st.pos.clone().addScaledVector(st.up,.42));
      const j=firstAfter(changes[i],t+.0000001)-1,last=changes[i][j],gear=last?last.gear:0;
      const bottom=gear?gearEdges[gear-1]-2.8:0,top=gear<7?gearEdges[gear]:75.8,range=clamp((st.v-bottom)/(top-bottom));
      let rpm=gear?8150+3650*range:5250+6400*range;
      const idle=(1-smooth(1,14,st.v))*(140*Math.sin(t*27+i)+91*Math.sin(t*41.7+i*2));
      rpm+=idle+smooth(2.4,2.94,t)*(1-smooth(3.45,4.48,t))*2210;
      const transient=last?Math.exp(-Math.max(0,t-last.time)/(last.up?.068:.108)):0;
      rpm+=last?(last.up?-830:1020)*transient:0;
      const firing=clamp(rpm,4900,12050)*.05*doppler,load=clamp(.42+st.a*.037,.12,1),speed=clamp(st.v/72);
      const vol=(.145+.104*load+.070*speed)*(1-(last&&last.up?.53*transient:0));
      v.engine.gain.value=vol*(onboard?1.12:1);
      v.harmonics.forEach((h,k)=>{h.osc.frequency.value=firing*(k+1);});
      v.tone.frequency.value=(770+speed*1300+load*2700)*doppler;
      v.ear.frequency.value=onboard?3050:Math.max(3200,14000-camera.position.distanceTo(st.pos)*19);
      v.induction.gain.value=.024+.047*load;v.turbo.osc.frequency.value=(1180+rpm*.122)*doppler;
      v.turbo.amp.gain.value=.0025+.011*speed*load;
      v.roadHiss.gain.value=(.016+.115*speed)*speed;
      const spin=t>=3&&t<5?Math.sin((t-3)*PI/2):0,braking=clamp((-st.a-7)/19);
      const corner=clamp(Math.abs(st.k)*st.v*st.v/26),squeal=spin*.84+braking*.50+corner*.18;
      v.tread.frequency.value=(720+255*braking+104*Math.sin(t*14+i))*doppler;
      v.tyre.osc.frequency.value=(560+134*squeal+27*Math.sin(t*49+i))*doppler;
      v.tyre.amp.gain.value=.049*squeal;v.wet.gain.value=.085*squeal;
      v.scrape.gain.value=.37*sparkLoad(st,t,i);
      v.brake.osc.frequency.value=(2220+speed*580)*doppler;v.brake.amp.gain.value=.0095*braking*braking;
      v.wind.gain.value=onboard?.22*speed:.004*speed;
    });
    const swell=smooth(33,36.45,t),roar=t>=FINISH?Math.exp(-(t-FINISH)*.24):0;
    crowd.gain.value=(.041+.117*swell+.30*roar)*(1+.064*Math.sin(t*6.17));
    cheer.gain.value=.005+.034*swell+.075*roar;crowdFilter.frequency.value=850+680*swell+580*roar;
    breeze.gain.value=.023+.006*Math.sin(t*.67);
    const nearest=mod(Math.round((states[0].s-mastStart)/mastStep),mastCount);
    position(humPos,lampLocations[nearest]);hum.amp.gain.value=.016;
    if(previous<t){for(let k=firstAfter(events,previous);k<events.length&&events[k].time<=t;k++)if(events[k].time>previous)shotSound(events[k]);}
  }
  return {audible,soundAt};
}
const audio=audioContext?synthesize(audioContext):null;

const COUNTDOWN='COUNTDOWN',PLAYING='PLAYING',PAUSED='PAUSED',REFIRE_HOLD='REFIRE_HOLD',ENDED='ENDED';
const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle'),pauseIcon=document.getElementById('icon-pause'),playIcon=document.getElementById('icon-play');
const pills=[...document.querySelectorAll('.speed-pill')];
let state=COUNTDOWN,simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,lastWall=null;
function stateTo(next){
  state=next;
  const paused=next===PAUSED||next===ENDED;
  toggle.setAttribute('aria-label',paused?'Play':'Pause');pauseIcon.style.display=paused?'none':'block';playIcon.style.display=paused?'block':'none';
  countdown.style.display=next===COUNTDOWN?'block':'none';
  countdown.textContent=next===COUNTDOWN?String(3-Math.min(2,Math.floor(countdownElapsed))):'';
  if(audio)audio.audible(next===PLAYING);
}
function drawTime(value){
  simTime=clamp(value,0,DURATION);scrubber.value=simTime===0?'0':simTime.toFixed(3);renderAt(simTime);
}
toggle.addEventListener('click',()=>{
  lastWall=performance.now();
  if(state===PLAYING||state===COUNTDOWN||state===REFIRE_HOLD){stateTo(PAUSED);return;}
  if(state===ENDED)drawTime(0);
  stateTo(PLAYING);if(audio)audio.soundAt(simTime,simTime,viewState);
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  countdownElapsed=0;holdElapsed=0;stateTo(REFIRE_HOLD);drawTime(0);lastWall=performance.now();
});
pills.forEach(pill=>pill.addEventListener('click',()=>{
  playbackSpeed=parseFloat(pill.dataset.speed);
  pills.forEach(p=>{const active=p===pill;p.classList.toggle('is-active',active);p.setAttribute('aria-checked',String(active));});
}));
scrubber.addEventListener('pointerdown',()=>{stateTo(PAUSED);lastWall=performance.now();});
scrubber.addEventListener('input',()=>{stateTo(PAUSED);drawTime(parseFloat(scrubber.value));lastWall=performance.now();});
window.addEventListener('resize',()=>{
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderAt(simTime);
});
function advance(dt){
  const before=simTime;
  drawTime(Math.min(DURATION,simTime+dt*playbackSpeed));
  if(simTime>=DURATION){stateTo(ENDED);return;}
  if(audio)audio.soundAt(simTime,before,viewState);
}
function tick(now){
  const rawDt=lastWall===null?0:Math.max(0,(now-lastWall)/1000),dt=Math.min(rawDt,.1);lastWall=now;
  if(state===COUNTDOWN){
    countdownElapsed+=dt;
    if(countdownElapsed>=3){stateTo(PLAYING);advance(countdownElapsed-3);}
    else countdown.textContent=String(3-Math.floor(countdownElapsed));
  }else if(state===REFIRE_HOLD){
    holdElapsed+=rawDt;
    if(holdElapsed>=1){stateTo(PLAYING);advance(Math.min(dt,holdElapsed-1));}
  }else if(state===PLAYING)advance(dt);
  requestAnimationFrame(tick);
}
// Warm the programs for the later shots before the resting frame starts the clock.
renderer.compile(scene,camera);
stateTo(COUNTDOWN);drawTime(0);requestAnimationFrame(tick);
})();
</script>
