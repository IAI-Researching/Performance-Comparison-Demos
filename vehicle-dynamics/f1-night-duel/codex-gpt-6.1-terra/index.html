<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>F1 Night Duel</title>
<style>
*, *::before, *::after {

}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;

  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

  left: 50%;

  z-index: 100;

  height: 44px;

  padding: 0 14px;

  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

  height: 18px;

  background: rgba(255, 255, 255, 0.12);
}

  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;

}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

  align-items: center;
  gap: 4px;
  flex-shrink: 0;

  height: 24px;
  padding: 0;

  align-items: center;
  justify-content: center;

  color: rgba(255, 255, 255, 0.6);

  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);

  background: rgba(255, 255, 255, 0.18);

  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}

</head>

<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

      <path d="M8 5v14l11-7z"/>

    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

    if(holdElapsed>=1){setState(PLAYING);const prev=simTime;simTime=Math.min(DURATION,(holdElapsed-1)*playbackSpeed);fireCrossed(prev,simTime);scrubber.value=simTime.toFixed(3);}
  } else if(state===PLAYING){
    const prev=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);scrubber.value=simTime.toFixed(3);fireCrossed(prev,simTime);
    if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);currentStates=renderAt(simTime);updateAudio(simTime,currentStates);setState(ENDED);}
  }
  if(state===PLAYING){currentStates=renderAt(simTime);updateAudio(simTime,currentStates);}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
})();
</script>
