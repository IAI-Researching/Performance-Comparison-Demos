<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Night Duel: Floodlit Two-Car Sprint to the Line</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;

  appearance: none;
  -webkit-appearance: none;
}

  width: 1px;

  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;

  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);

}

  -webkit-appearance: none;

  width: 12px;

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script>
(function() {
  'use strict';

  // =========================================================================
  // 1. DETERMINISTIC SEEDED PRNGs (SIMULATION = 42, AUDIO = 4242)
  // =========================================================================
  function createMulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      let t = (a += 0x6D2B79F5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashFloat(idx, salt) {
    let h = (Math.imul(idx ^ 0x9E3779B9, 0x85EBCA6B) + Math.imul(salt ^ 0xC2B2AE35, 0x27D4EB2F)) >>> 0;
    h ^= h >>> 16;
    h = Math.imul(h, 0x7FEB352D) >>> 0;
    h ^= h >>> 15;
    h = Math.imul(h, 0x846CA68B) >>> 0;
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  const simRand = createMulberry32(42);
  const audioRand = createMulberry32(4242);

  const DURATION = 40;
  const WORLD_UP = new THREE.Vector3(0, 1, 0);

  // =========================================================================
  // 2. RENDERER, SCENE & CAMERA SETUP
  // =========================================================================
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.85;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  // Dark blue-grey humid night haze (strictly darker than #1a2230)
  scene.fog = new THREE.FogExp2(0x101622, 0.00185);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);

  // =========================================================================
  // 3. PMREM NIGHT ENVIRONMENT MAP (IN-MEMORY)
  // =========================================================================
  function buildNightEnvironment() {
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileCubemapShader();

    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x04070e);

    // Subtle horizon ring glow
    const horizonGeo = new THREE.CylinderGeometry(80, 80, 18, 32, 1, true);
    const horizonMat = new THREE.MeshBasicMaterial({
      color: 0x162238,
      side: THREE.BackSide
    });
    const horizonMesh = new THREE.Mesh(horizonGeo, horizonMat);
    horizonMesh.position.y = 6;
    envScene.add(horizonMesh);

    // Bright floodlight panels in virtual environment for crisp paint/visor reflections
    const panelGeo = new THREE.PlaneGeometry(14, 5);
    const coolPanelMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(6.0, 6.5, 7.5), side: THREE.DoubleSide });
    const warmPanelMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.5, 2.2, 1.2), side: THREE.DoubleSide });

    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      const panel = new THREE.Mesh(panelGeo, i % 4 === 0 ? warmPanelMat : coolPanelMat);
      panel.position.set(Math.cos(angle) * 45, 24 + (i % 2) * 8, Math.sin(angle) * 45);
      panel.lookAt(0, 0, 0);
      envScene.add(panel);
    }

    // Overhead strip reflection for clearcoat highlights
    const topStrip = new THREE.Mesh(new THREE.PlaneGeometry(60, 4), new THREE.MeshBasicMaterial({
      color: new THREE.Color(4.5, 5.0, 6.0),
      side: THREE.DoubleSide
    }));
    topStrip.position.set(0, 42, 0);
    topStrip.rotation.x = Math.PI * 0.5;
    envScene.add(topStrip);

    const envRT = pmremGenerator.fromScene(envScene, 0.02);
    scene.environment = envRT.texture;
    pmremGenerator.dispose();
  }
  buildNightEnvironment();

  // =========================================================================
  // 4. CIRCUIT SPLINE & PRE-SAMPLED ARC-LENGTH TABLE
  // =========================================================================
  const circuitControlPoints = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(200, 0, 0),
    new THREE.Vector3(320, 5, 60),
    new THREE.Vector3(340, 12, 180),
    new THREE.Vector3(260, 20, 260),
    new THREE.Vector3(120, 15, 240),
    new THREE.Vector3(60, 8, 320),
    new THREE.Vector3(-80, 4, 340),
    new THREE.Vector3(-200, 0, 260),
    new THREE.Vector3(-240, 0, 120),
    new THREE.Vector3(-160, 0, 40),
    new THREE.Vector3(-80, 0, 0)
  ];

  const trackCurve = new THREE.CatmullRomCurve3(circuitControlPoints, true, 'centripetal');
  trackCurve.arcLengthDivisions = 4000;
  trackCurve.updateArcLengths();
  const TRACK_LENGTH = trackCurve.getLength(); // ~1551.65 m

  const TRACK_SAMPLES = 3072;
  const trackTable = new Array(TRACK_SAMPLES);

  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const u = i / TRACK_SAMPLES;
    const pos = trackCurve.getPointAt(u);
    const tan = trackCurve.getTangentAt(u).normalize();
    const norm = new THREE.Vector3().crossVectors(tan, WORLD_UP).normalize();
    const roadUp = new THREE.Vector3().crossVectors(norm, tan).normalize();
    trackTable[i] = { pos, tan, norm, up: roadUp, curv: 0 };
  }

  for (let i = 0; i < TRACK_SAMPLES; i++) {
    const prev = trackTable[(i - 4 + TRACK_SAMPLES) % TRACK_SAMPLES].tan;
    const next = trackTable[(i + 4) % TRACK_SAMPLES].tan;
    const dTan = new THREE.Vector3().subVectors(next, prev);
    const ds = (8 / TRACK_SAMPLES) * TRACK_LENGTH;
    // Positive curv = right-hand turn (+norm), Negative curv = left-hand turn (-norm)
    trackTable[i].curv = dTan.dot(trackTable[i].norm) / ds;
  }

  function wrapS(s) {
    return ((s % TRACK_LENGTH) + TRACK_LENGTH) % TRACK_LENGTH;
  }

  function sampleTrack(s) {
    const sw = wrapS(s);
    const fIdx = (sw / TRACK_LENGTH) * TRACK_SAMPLES;
    const i0 = Math.floor(fIdx) % TRACK_SAMPLES;
    const i1 = (i0 + 1) % TRACK_SAMPLES;
    const w = fIdx - Math.floor(fIdx);
    const a = trackTable[i0];
    const b = trackTable[i1];

    const pos = a.pos.clone().lerp(b.pos, w);
    const tan = a.tan.clone().lerp(b.tan, w).normalize();
    const norm = a.norm.clone().lerp(b.norm, w).normalize();
    const up = a.up.clone().lerp(b.up, w).normalize();
    const curv = a.curv * (1 - w) + b.curv * w;
    return { pos, tan, norm, up, curv };
  }

  function C_at(s) {
    return sampleTrack(s).pos;
  }
  function N_at(s) {
    return sampleTrack(s).norm;
  }
  function T_at(s) {
    return sampleTrack(s).tan;
  }

  // =========================================================================
  // 5. STANDARDIZED CAR MOTION (MONOTONE CUBIC HERMITE / PCHIP SPLINE)
  // =========================================================================
  const MOTION_TABLE = [
    [0, -8.0, -2.50, -16.0, 2.50],
    [1, -8.0, -2.50, -16.0, 2.50],
    [2, -8.0, -2.50, -16.0, 2.50],
    [3, -8.0, -2.50, -16.0, 2.50],
    [4, -2.3, -2.31, -11.5, 2.36],
    [5, 14.8, -1.46, 3.1, 1.65],
    [6, 42.8, -0.47, 29.8, 0.76],
    [7, 81.1, 0.00, 68.2, 0.10],
    [8, 128.9, 0.00, 115.9, 0.00],
    [9, 185.1, 0.00, 172.2, 0.00],
    [10, 248.1, 0.00, 235.3, 0.00],
    [11, 310.5, 0.00, 297.8, 0.00],
    [12, 354.6, 0.00, 342.1, 0.00],
    [13, 403.8, 0.00, 391.4, 0.00],
    [14, 456.5, 0.00, 444.4, 0.00],
    [15, 500.6, 0.00, 488.6, 0.00],
    [16, 553.0, 0.00, 541.2, 0.00],
    [17, 590.7, 0.00, 579.2, 0.00],
    [18, 627.7, 0.00, 616.4, 0.00],
    [19, 674.3, 0.00, 663.2, 0.00],
    [20, 716.6, 0.00, 705.7, 0.00],
    [21, 744.7, 0.00, 734.0, 0.00],
    [22, 782.0, 0.00, 771.5, 0.00],
    [23, 821.0, 0.00, 810.8, 0.00],
    [24, 855.1, 0.00, 845.1, 0.00],
    [25, 899.0, 0.00, 889.1, 0.00],
    [26, 951.7, 0.00, 942.1, 0.00],
    [27, 1007.7, 0.00, 998.2, 0.00],
    [28, 1069.6, 0.00, 1060.3, 0.00],
    [29, 1131.7, 0.00, 1122.5, 0.00],
    [30, 1194.2, 0.00, 1185.1, 0.00],
    [31, 1252.2, 0.00, 1243.1, 0.00],
    [32, 1289.7, 0.00, 1280.7, 0.00],
    [33, 1333.9, 0.00, 1324.9, 0.00],
    [34, 1387.1, -0.87, 1380.4, 1.62],
    [35, 1447.7, -1.20, 1446.1, 3.40],
    [36, 1514.0, -1.20, 1516.7, 3.40],
    [37, 1583.6, -1.20, 1587.1, 3.40],
    [38, 1649.5, -1.20, 1653.4, 3.40],
    [39, 1710.4, -1.20, 1714.9, 3.40],
    [40, 1766.3, -1.20, 1771.1, 3.40]
  ];

  function createPCHIP(values) {
    const n = values.length;
    const delta = new Array(n - 1);
    for (let i = 0; i < n - 1; i++) {
      delta[i] = values[i + 1] - values[i];
    }
    const m = new Array(n).fill(0);
    m[0] = delta[0];
    m[n - 1] = delta[n - 2];
    for (let i = 1; i < n - 1; i++) {
      if (delta[i - 1] * delta[i] > 0) {
        m[i] = (2 * delta[i - 1] * delta[i]) / (delta[i - 1] + delta[i]);
      } else {
        m[i] = 0;
      }
    }
    return function(t) {
      const tc = Math.max(0, Math.min(n - 1, t));
      const i = Math.min(n - 2, Math.floor(tc));
      const u = tc - i;
      const u2 = u * u;
      const u3 = u2 * u;
      const y0 = values[i], y1 = values[i + 1];
      const m0 = m[i], m1 = m[i + 1];

      const val = (2 * u3 - 3 * u2 + 1) * y0 +
                  (u3 - 2 * u2 + u) * m0 +
                  (-2 * u3 + 3 * u2) * y1 +
                  (u3 - u2) * m1;

      const vel = (6 * u2 - 6 * u) * y0 +
                  (3 * u2 - 4 * u + 1) * m0 +
                  (-6 * u2 + 6 * u) * y1 +
                  (3 * u2 - 2 * u) * m1;

      const acc = (12 * u - 6) * y0 +
                  (6 * u - 4) * m0 +
                  (-12 * u + 6) * y1 +
                  (6 * u - 2) * m1;

      return { val, vel, acc };
    };
  }

  const evalSR = createPCHIP(MOTION_TABLE.map(r => r[1]));
  const evalDR = createPCHIP(MOTION_TABLE.map(r => r[2]));
  const evalSB = createPCHIP(MOTION_TABLE.map(r => r[3]));
  const evalDB = createPCHIP(MOTION_TABLE.map(r => r[4]));

  function getCarKinematics(isBlue, simTime) {
    const evalS = isBlue ? evalSB : evalSR;
    const evalD = isBlue ? evalDB : evalDR;
    const t = Math.max(0, Math.min(DURATION, simTime));
    const sObj = evalS(t);
    const dObj = evalD(t);

    // Smooth central-difference acceleration for pitch & thermal brake glow
    const dt = 0.2;
    const vPrev = evalS(Math.max(0, t - dt)).vel;
    const vNext = evalS(Math.min(DURATION, t + dt)).vel;
    const smoothAcc = (vNext - vPrev) / (2 * dt);

    // Thermal brake disc glow (6-point lookback quadrature over 1.0s cooling window)
    let brakeHeat = 0;
    const weights = [0.28, 0.24, 0.19, 0.14, 0.09, 0.06];
    for (let k = 0; k < 6; k++) {
      const tk = Math.max(0, t - k * 0.18);
      const vp = evalS(Math.max(0, tk - 0.18)).vel;
      const vn = evalS(Math.min(DURATION, tk + 0.18)).vel;
      const ak = (vn - vp) / 0.36;
      if (ak < -1.5) {
        brakeHeat += Math.min(1.0, (-ak - 1.5) / 14.0) * weights[k];
      }
    }
    // Faint disc glow during post-finish lift-off cool-down [36.49, 40]
    if (t >= 36.49) {
      const coolFade = Math.min(1, (t - 36.49) / 0.6) * (1 - 0.3 * ((t - 36.49) / 3.51));
      brakeHeat = Math.max(brakeHeat, 0.28 * coolFade);
    }

    const trk = sampleTrack(sObj.val);
    const worldPos = trk.pos.clone().addScaledVector(trk.norm, dObj.val);

    // Heading includes lateral lane-change angle atan2(dDot, speed)
    const latAngle = sObj.vel > 1.0 ? Math.atan2(dObj.vel, sObj.vel) : 0;
    const forward = trk.tan.clone().applyAxisAngle(trk.up, -latAngle).normalize();
    const right = new THREE.Vector3().crossVectors(forward, trk.up).normalize();

    return {
      s: sObj.val,
      d: dObj.val,
      speed: sObj.vel,
      acc: sObj.acc,
      smoothAcc,
      dVel: dObj.vel,
      brakeGlow: Math.min(1.0, brakeHeat * 1.25),
      worldPos,
      forward,
      right,
      up: trk.up,
      curv: trk.curv,
      latAngle
    };
  }

  // =========================================================================
  // 6. PROCEDURAL IN-MEMORY TEXTURES
  // =========================================================================
  function createAsphaltTextures() {
    const size = 512;
    const diffCanvas = document.createElement('canvas');
    diffCanvas.width = size;
    diffCanvas.height = size;
    const dCtx = diffCanvas.getContext('2d');

    const roughCanvas = document.createElement('canvas');
    roughCanvas.width = size;
    roughCanvas.height = size;
    const rCtx = roughCanvas.getContext('2d');

    const bumpCanvas = document.createElement('canvas');
    bumpCanvas.width = size;
    bumpCanvas.height = size;
    const bCtx = bumpCanvas.getContext('2d');

    const dImg = dCtx.createImageData(size, size);
    const rImg = rCtx.createImageData(size, size);
    const bImg = bCtx.createImageData(size, size);

    for (let y = 0; y < size; y++) {
      const uCross = y / size; // across road width
      // Darker rubbered-in racing groove & damp patches
      const groove = Math.exp(-Math.pow((uCross - 0.5) * 3.2, 2));
      for (let x = 0; x < size; x++) {
        const idx = (y * size + x) * 4;
        const n1 = simRand();
        const n2 = simRand();
        const puddle = 0.5 + 0.5 * Math.sin(x * 0.049 + y * 0.037) * Math.cos(x * 0.024 - y * 0.061);

        // Keep base asphalt very dark so unlit areas have sRGB luminance < 15%
        const baseVal = 11 + n1 * 9 - groove * 3;
        dImg.data[idx] = baseVal;
        dImg.data[idx + 1] = baseVal + 1;
        dImg.data[idx + 2] = baseVal + 3;
        dImg.data[idx + 3] = 255;

        // Low roughness for damp wet sheen
        const rVal = Math.max(24, Math.min(115, 52 - puddle * 26 - groove * 12 + (n2 - 0.5) * 24));
        rImg.data[idx] = rVal;
        rImg.data[idx + 1] = rVal;
        rImg.data[idx + 2] = rVal;
        rImg.data[idx + 3] = 255;

        const bVal = Math.floor(128 + (n1 - 0.5) * 90);
        bImg.data[idx] = bVal;
        bImg.data[idx + 1] = bVal;
        bImg.data[idx + 2] = bVal;
        bImg.data[idx + 3] = 255;
      }
    }
    dCtx.putImageData(dImg, 0, 0);
    rCtx.putImageData(rImg, 0, 0);
    bCtx.putImageData(bImg, 0, 0);

    // Crisp white track edge lines on diffuse & roughness
    dCtx.fillStyle = '#d8dee9';
    dCtx.fillRect(0, 8, size, 9);
    dCtx.fillRect(0, size - 17, size, 9);

    rCtx.fillStyle = '#555555';
    rCtx.fillRect(0, 8, size, 9);
    rCtx.fillRect(0, size - 17, size, 9);

    const diffTex = new THREE.CanvasTexture(diffCanvas);
    diffTex.wrapS = THREE.RepeatWrapping;
    diffTex.wrapT = THREE.ClampToEdgeWrapping;
    diffTex.anisotropy = 8;
    diffTex.encoding = THREE.sRGBEncoding;

    const roughTex = new THREE.CanvasTexture(roughCanvas);
    roughTex.wrapS = THREE.RepeatWrapping;
    roughTex.wrapT = THREE.ClampToEdgeWrapping;
    roughTex.anisotropy = 8;

    const bumpTex = new THREE.CanvasTexture(bumpCanvas);
    bumpTex.wrapS = THREE.RepeatWrapping;
    bumpTex.wrapT = THREE.RepeatWrapping;
    bumpTex.anisotropy = 8;

    return { diffTex, roughTex, bumpTex };
  }

  function createCarbonTexture() {
    const c = document.createElement('canvas');
    c.width = 64;
    c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#14161b';
    ctx.fillRect(0, 0, 64, 64);
    for (let y = 0; y < 64; y += 4) {
      for (let x = 0; x < 64; x += 4) {
        const shift = ((x + y) / 4) % 2 === 0;
        ctx.fillStyle = shift ? '#232730' : '#0f1116';
        ctx.fillRect(x, y, 3, 3);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(12, 12);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createCarDecalTexture(bgHex, stripeHex, accentHex, numberStr) {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const ctx = c.getContext('2d');

    ctx.fillStyle = bgHex;
    ctx.fillRect(0, 0, 512, 512);

    // Center & outer racing stripes
    ctx.fillStyle = stripeHex;
    ctx.fillRect(0, 226, 512, 60);
    ctx.fillStyle = accentHex;
    ctx.fillRect(0, 212, 512, 8);
    ctx.fillRect(0, 292, 512, 8);

    // Crisp number roundel badge
    ctx.fillStyle = '#0d1017';
    ctx.beginPath();
    ctx.arc(256, 256, 118, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = 10;
    ctx.strokeStyle = stripeHex;
    ctx.stroke();

    ctx.save();
    ctx.translate(256, 256);
    ctx.font = 'italic 900 132px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = stripeHex;
    ctx.fillText(numberStr, 0, 6);
    ctx.restore();

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createTyreSidewallTexture(stripeColorHex) {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#101215';
    ctx.fillRect(0, 0, 256, 256);

    const cx = 128, cy = 128;
    // Subtle rubber sidewall radial ribs
    ctx.strokeStyle = '#181b20';
    ctx.lineWidth = 2;
    for (let i = 0; i < 48; i++) {
      const a = (i / 48) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 68, cy + Math.sin(a) * 68);
      ctx.lineTo(cx + Math.cos(a) * 120, cy + Math.sin(a) * 120);
      ctx.stroke();
    }

    // Plain coloured tyre sidewall band (no lettering)
    ctx.strokeStyle = stripeColorHex;
    ctx.lineWidth = 11;
    ctx.beginPath();
    ctx.arc(cx, cy, 94, 0, Math.PI * 2);
    ctx.stroke();

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createSoftRadialSprite(r, g, b, hardness) {
    const c = document.createElement('canvas');
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
    grad.addColorStop(0.0, `rgba(${r},${g},${b},1.0)`);
    grad.addColorStop(hardness || 0.35, `rgba(${r},${g},${b},0.55)`);
    grad.addColorStop(0.7, `rgba(${r},${g},${b},0.12)`);
    grad.addColorStop(1.0, `rgba(${r},${g},${b},0.0)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createChequeredTexture() {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 64;
    const ctx = c.getContext('2d');
    const cols = 16, rows = 4;
    const cw = c.width / cols, ch = c.height / rows;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#e8ecf2' : '#12151c';
        ctx.fillRect(x * cw, y * ch, cw, ch);
      }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const asphaltTextures = createAsphaltTextures();
  const carbonTex = createCarbonTexture();
  const glowSpriteCool = createSoftRadialSprite(225, 240, 255, 0.28);
  const glowSpriteRed = createSoftRadialSprite(255, 38, 28, 0.35);
  const glowSpriteGreen = createSoftRadialSprite(30, 255, 95, 0.35);
  const smokeSpriteTex = createSoftRadialSprite(215, 228, 245, 0.42);
  const sparkSpriteTex = createSoftRadialSprite(255, 210, 110, 0.30);

  // =========================================================================
  // 7. OPAQUE NIGHT SKY DOME (DEEP BLUE-BLACK, STARS, MOON, HORIZON CITY GLOW)
  // =========================================================================
  function buildNightSky() {
    const skyCanvas = document.createElement('canvas');
    skyCanvas.width = 2048;
    skyCanvas.height = 1024;
    const ctx = skyCanvas.getContext('2d');

    // Deep night gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, 1024);
    skyGrad.addColorStop(0.0, '#020308');
    skyGrad.addColorStop(0.32, '#040710');
    skyGrad.addColorStop(0.46, '#080e1a');
    skyGrad.addColorStop(0.51, '#0d1524');
    skyGrad.addColorStop(0.55, '#070a10');
    skyGrad.addColorStop(1.0, '#040508');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, 2048, 1024);

    // Faint warm city glow on one horizon (around u = 0.22)
    const cityGrad = ctx.createRadialGradient(450, 512, 10, 450, 520, 380);
    cityGrad.addColorStop(0.0, 'rgba(68, 42, 24, 0.42)');
    cityGrad.addColorStop(0.45, 'rgba(42, 26, 18, 0.18)');
    cityGrad.addColorStop(1.0, 'rgba(10, 14, 24, 0.0)');
    ctx.fillStyle = cityGrad;
    ctx.fillRect(0, 250, 1000, 450);

    // Procedural stars above horizon (y < 495)
    for (let i = 0; i < 1400; i++) {
      const sx = simRand() * 2048;
      const sy = Math.pow(simRand(), 1.35) * 485;
      const br = 0.25 + simRand() * 0.75;
      const r = simRand() < 0.7 ? 1.1 : 1.7;
      const tint = simRand();
      const col = tint < 0.3 ? `rgba(205,225,255,${br})` : (tint < 0.8 ? `rgba(245,248,255,${br})` : `rgba(255,232,205,${br})`);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Crisp Moon & subtle halo high in the night sky
    const mx = 1480, my = 240;
    const moonHalo = ctx.createRadialGradient(mx, my, 8, mx, my, 95);
    moonHalo.addColorStop(0.0, 'rgba(210, 228, 255, 0.45)');
    moonHalo.addColorStop(0.3, 'rgba(140, 175, 225, 0.14)');
    moonHalo.addColorStop(1.0, 'rgba(20, 30, 50, 0.0)');
    ctx.fillStyle = moonHalo;
    ctx.beginPath();
    ctx.arc(mx, my, 95, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#dde8fa';
    ctx.beginPath();
    ctx.arc(mx, my, 15, 0, Math.PI * 2);
    ctx.fill();

    // Subtle dark mare craters on moon
    ctx.fillStyle = 'rgba(130, 148, 175, 0.35)';
    ctx.beginPath();
    ctx.arc(mx - 4, my - 3, 5, 0, Math.PI * 2);
    ctx.arc(mx + 5, my + 4, 4, 0, Math.PI * 2);
    ctx.fill();

    const skyTex = new THREE.CanvasTexture(skyCanvas);
    skyTex.encoding = THREE.sRGBEncoding;

    // Set scene.background AND a large sky dome outside fog
    scene.background = new THREE.Color(0x060911);
    const skyGeo = new THREE.SphereGeometry(2300, 48, 32);
    const skyMat = new THREE.MeshBasicMaterial({
      map: skyTex,
      side: THREE.BackSide,
      fog: false,
      depthWrite: false
    });
    const skyDome = new THREE.Mesh(skyGeo, skyMat);
    scene.add(skyDome);
  }
  buildNightSky();

  // =========================================================================
  // 8. FLOODLIGHT MAST POSITIONS (USED FOR BAKED ROAD POOLS & 3D MASTS)
  // =========================================================================
  const NUM_MASTS = 24;
  const mastList = [];
  for (let i = 0; i < NUM_MASTS; i++) {
    const s = (i + 0.35) * (TRACK_LENGTH / NUM_MASTS);
    const side = (i % 2 === 0) ? 1 : -1;
    const d = side * 10.6;
    const trk = sampleTrack(s);
    const basePos = trk.pos.clone().addScaledVector(trk.norm, d);
    const headPos = basePos.clone().add(new THREE.Vector3(0, 30.0, 0)).addScaledVector(trk.norm, -side * 2.4);
    const poolCenter = trk.pos.clone().addScaledVector(trk.norm, side * 1.2);
    mastList.push({ s, side, basePos, headPos, poolCenter, norm: trk.norm.clone(), tan: trk.tan.clone() });
  }

  function evaluateFloodlightPoolFactor(worldPt, sCoord) {
    let pool = 0;
    for (let i = 0; i < mastList.length; i++) {
      const m = mastList[i];
      let ds = Math.abs(sCoord - m.s);
      if (ds > TRACK_LENGTH * 0.5) ds = TRACK_LENGTH - ds;
      if (ds < 55) {
        const dx = worldPt.x - m.poolCenter.x;
        const dz = worldPt.z - m.poolCenter.z;
        const dist2 = dx * dx + dz * dz;
        // Concentrated pool under mast (~24m radius) with dark gaps between masts
        pool += Math.exp(-dist2 / (22.0 * 22.0));
      }
    }
    // Start/finish gantry & pit-lane floodlight boost around s = -25..25
    let dsStart = wrapS(sCoord);
    if (dsStart > TRACK_LENGTH * 0.5) dsStart -= TRACK_LENGTH;
    if (Math.abs(dsStart) < 35) {
      pool += 0.35 * Math.exp(-(dsStart * dsStart) / (24 * 24));
    }
    return Math.min(1.35, pool);
  }

  // =========================================================================
  // 9. CIRCUIT ROAD, KERBS, BARRIERS, FENCING, TERRAIN, GANTRY & GRANDSTAND
  // =========================================================================
  const gantryRedPods = [];
  const gantryGreenPods = [];
  const gantryRedSprites = [];
  const gantryGreenSprites = [];

  function buildTrackAndEnvironment() {
    const N = 1200; // Longitudinal segments around the 1551.65 m lap (~1.29 m per step)
    const W_COLS = 8; // Cross-sectional subdivisions across the 14 m road width
    const HALF_ROAD = 7.0;

    // 9.1 ASPHALT ROAD RIBBON (14 m wide = ±7 m along n)
    const roadVerts = [];
    const roadNormals = [];
    const roadUVs = [];
    const roadColors = [];
    const roadIndices = [];

    for (let i = 0; i <= N; i++) {
      const s = (i / N) * TRACK_LENGTH;
      const trk = sampleTrack(s);
      for (let j = 0; j <= W_COLS; j++) {
        const vFrac = j / W_COLS;
        const d = (vFrac - 0.5) * 2 * HALF_ROAD;
        const pt = trk.pos.clone().addScaledVector(trk.norm, d);
        roadVerts.push(pt.x, pt.y, pt.z);
        roadNormals.push(trk.up.x, trk.up.y, trk.up.z);
        roadUVs.push(s * 0.08, vFrac);

        // Bake floodlight pools into vertex colors: bright pools under masts, near-black between them
        const pool = evaluateFloodlightPoolFactor(pt, s);
        const lum = 0.08 + 0.92 * Math.pow(Math.min(1.0, pool), 1.25);
        roadColors.push(lum * 0.92, lum * 0.96, lum * 1.05);
      }
    }

    const stride = W_COLS + 1;
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < W_COLS; j++) {
        const a = i * stride + j;
        const b = (i + 1) * stride + j;
        const c = (i + 1) * stride + (j + 1);
        const d = i * stride + (j + 1);
        roadIndices.push(a, b, d, b, c, d);
      }
    }

    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(roadVerts, 3));
    roadGeo.setAttribute('normal', new THREE.Float32BufferAttribute(roadNormals, 3));
    roadGeo.setAttribute('uv', new THREE.Float32BufferAttribute(roadUVs, 2));
    roadGeo.setAttribute('color', new THREE.Float32BufferAttribute(roadColors, 3));
    roadGeo.setIndex(roadIndices);

    const roadMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      vertexColors: true,
      map: asphaltTextures.diffTex,
      roughnessMap: asphaltTextures.roughTex,
      bumpMap: asphaltTextures.bumpTex,
      bumpScale: 0.012,
      roughness: 0.24,
      metalness: 0.10,
      envMapIntensity: 0.85
    });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    // 9.2 RED-AND-WHITE CORNER KERBS
    const kerbVerts = [];
    const kerbNormals = [];
    const kerbColors = [];
    const kerbIndices = [];
    let kerbVertCount = 0;

    function addKerbStrip(s0, s1, sideSign) {
      const steps = Math.max(4, Math.ceil((s1 - s0) / 1.2));
      for (let i = 0; i < steps; i++) {
        const sa = s0 + (i / steps) * (s1 - s0);
        const sb = s0 + ((i + 1) / steps) * (s1 - s0);
        const ta = sampleTrack(sa);
        const tb = sampleTrack(sb);

        const dInner = sideSign * 6.85;
        const dOuter = sideSign * 7.85;

        const p0 = ta.pos.clone().addScaledVector(ta.norm, dInner).addScaledVector(ta.up, 0.02);
        const p1 = ta.pos.clone().addScaledVector(ta.norm, dOuter).addScaledVector(ta.up, 0.065);
        const p2 = tb.pos.clone().addScaledVector(tb.norm, dOuter).addScaledVector(tb.up, 0.065);
        const p3 = tb.pos.clone().addScaledVector(tb.norm, dInner).addScaledVector(tb.up, 0.02);

        const pool = evaluateFloodlightPoolFactor(p0, sa);
        const shade = 0.14 + 0.86 * Math.min(1.0, pool);
        const isRed = (Math.floor(sa / 1.25) % 2) === 0;
        const cr = (isRed ? 0.82 : 0.90) * shade;
        const cg = (isRed ? 0.09 : 0.92) * shade;
        const cb = (isRed ? 0.12 : 0.95) * shade;

        const pts = [p0, p1, p2, p3];
        for (let k = 0; k < 4; k++) {
          kerbVerts.push(pts[k].x, pts[k].y, pts[k].z);
          kerbNormals.push(ta.up.x, ta.up.y, ta.up.z);
          kerbColors.push(cr, cg, cb);
        }
        kerbIndices.push(
          kerbVertCount, kerbVertCount + 1, kerbVertCount + 2,
          kerbVertCount, kerbVertCount + 2, kerbVertCount + 3
        );
        kerbVertCount += 4;
      }
    }

    // Place kerbs automatically on all corners along the circuit
    for (let s = 30; s < TRACK_LENGTH - 30; s += 15) {
      const trk = sampleTrack(s);
      if (Math.abs(trk.curv) > 0.0038) {
        const insideSign = trk.curv > 0 ? 1 : -1;
        addKerbStrip(s, s + 15, insideSign);
        addKerbStrip(s, s + 15, -insideSign);
      }
    }

    const kerbGeo = new THREE.BufferGeometry();
    kerbGeo.setAttribute('position', new THREE.Float32BufferAttribute(kerbVerts, 3));
    kerbGeo.setAttribute('normal', new THREE.Float32BufferAttribute(kerbNormals, 3));
    kerbGeo.setAttribute('color', new THREE.Float32BufferAttribute(kerbColors, 3));
    kerbGeo.setIndex(kerbIndices);
    const kerbMesh = new THREE.Mesh(kerbGeo, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.4,
      metalness: 0.05
    }));
    kerbMesh.receiveShadow = true;
    scene.add(kerbMesh);

    // 9.3 CONTINUOUS BARRIERS (±9 m) & GALVANISED CATCH FENCING
    const barrierVerts = [], barrierNormals = [], barrierColors = [], barrierIndices = [];
    const fenceVerts = [], fenceNormals = [], fenceColors = [], fenceIndices = [];
    let bVCount = 0, fVCount = 0;

    const B_STEPS = 600;
    for (let sideIdx = 0; sideIdx < 2; sideIdx++) {
      const side = sideIdx === 0 ? 1 : -1;
      const dBarrier = side * 9.0;
      for (let i = 0; i <= B_STEPS; i++) {
        const s = (i / B_STEPS) * TRACK_LENGTH;
        const trk = sampleTrack(s);
        const base = trk.pos.clone().addScaledVector(trk.norm, dBarrier);
        const topB = base.clone().addScaledVector(trk.up, 1.05);
        const topF = base.clone().addScaledVector(trk.up, 4.1).addScaledVector(trk.norm, -side * 0.35);

        const nIn = trk.norm.clone().multiplyScalar(-side);
        const pool = evaluateFloodlightPoolFactor(base, s);
        const shade = 0.08 + 0.65 * Math.min(1.0, pool);

        // Tecpro/Armco barrier with blue/white/silver alternating sections
        const stripe = (Math.floor(s / 6) % 2 === 0) ? 1.0 : 0.72;
        barrierVerts.push(base.x, base.y, base.z, topB.x, topB.y, topB.z);
        barrierNormals.push(nIn.x, nIn.y, nIn.z, nIn.x, nIn.y, nIn.z);
        barrierColors.push(
          0.22 * shade * stripe, 0.25 * shade * stripe, 0.30 * shade * stripe,
          0.28 * shade * stripe, 0.32 * shade * stripe, 0.38 * shade * stripe
        );

        // Catch fence above barrier
        fenceVerts.push(topB.x, topB.y, topB.z, topF.x, topF.y, topF.z);
        fenceNormals.push(nIn.x, nIn.y, nIn.z, nIn.x, nIn.y, nIn.z);
        const fShade = 0.06 + 0.45 * Math.min(1.0, pool);
        fenceColors.push(fShade, fShade * 1.05, fShade * 1.12, fShade * 0.7, fShade * 0.75, fShade * 0.82);

        if (i < B_STEPS) {
          const b0 = bVCount + i * 2;
          barrierIndices.push(b0, b0 + 1, b0 + 2, b0 + 1, b0 + 3, b0 + 2);
          const f0 = fVCount + i * 2;
          fenceIndices.push(f0, f0 + 1, f0 + 2, f0 + 1, f0 + 3, f0 + 2);
        }
      }
      bVCount += (B_STEPS + 1) * 2;
      fVCount += (B_STEPS + 1) * 2;
    }

    const barrierGeo = new THREE.BufferGeometry();
    barrierGeo.setAttribute('position', new THREE.Float32BufferAttribute(barrierVerts, 3));
    barrierGeo.setAttribute('normal', new THREE.Float32BufferAttribute(barrierNormals, 3));
    barrierGeo.setAttribute('color', new THREE.Float32BufferAttribute(barrierColors, 3));
    barrierGeo.setIndex(barrierIndices);
    const barrierMesh = new THREE.Mesh(barrierGeo, new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.42,
      metalness: 0.65,
      side: THREE.DoubleSide
    }));
    scene.add(barrierMesh);

    // Wire-mesh texture for galvanised catch fencing
    const fenceCanvas = document.createElement('canvas');
    fenceCanvas.width = 64;
    fenceCanvas.height = 64;
    const fCtx = fenceCanvas.getContext('2d');
    fCtx.clearRect(0, 0, 64, 64);
    fCtx.strokeStyle = 'rgba(185, 198, 215, 0.55)';
    fCtx.lineWidth = 1.5;
    for (let k = -64; k < 128; k += 8) {
      fCtx.beginPath();
      fCtx.moveTo(k, 0);
      fCtx.lineTo(k + 64, 64);
      fCtx.moveTo(k + 64, 0);
      fCtx.lineTo(k, 64);
      fCtx.stroke();
    }
    // Vertical fence posts on texture
    fCtx.fillStyle = 'rgba(160, 172, 188, 0.92)';
    fCtx.fillRect(0, 0, 4, 64);
    fCtx.fillRect(0, 0, 64, 3);
    fCtx.fillRect(0, 30, 64, 2);

    const fenceTex = new THREE.CanvasTexture(fenceCanvas);
    fenceTex.wrapS = THREE.RepeatWrapping;
    fenceTex.wrapT = THREE.RepeatWrapping;
    const fenceUVs = [];
    for (let sideIdx = 0; sideIdx < 2; sideIdx++) {
      for (let i = 0; i <= B_STEPS; i++) {
        const u = (i / B_STEPS) * 260;
        fenceUVs.push(u, 0, u, 1);
      }
    }
    const fenceGeo = new THREE.BufferGeometry();
    fenceGeo.setAttribute('position', new THREE.Float32BufferAttribute(fenceVerts, 3));
    fenceGeo.setAttribute('normal', new THREE.Float32BufferAttribute(fenceNormals, 3));
    fenceGeo.setAttribute('color', new THREE.Float32BufferAttribute(fenceColors, 3));
    fenceGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fenceUVs, 2));
    fenceGeo.setIndex(fenceIndices);
    const fenceMesh = new THREE.Mesh(fenceGeo, new THREE.MeshStandardMaterial({
      map: fenceTex,
      vertexColors: true,
      transparent: true,
      alphaTest: 0.15,
      roughness: 0.38,
      metalness: 0.75,
      side: THREE.DoubleSide
    }));
    scene.add(fenceMesh);

    // 9.4 TERRAIN & ROLLING DARK HILLS AROUND TRACK
    const T_RINGS = [7.0, 9.2, 22.0, 60.0, 145.0, 320.0];
    const T_STEPS = 320;
    const terrVerts = [], terrNormals = [], terrColors = [], terrIndices = [];

    for (let sideIdx = 0; sideIdx < 2; sideIdx++) {
      const side = sideIdx === 0 ? 1 : -1;
      const baseVOffset = terrVerts.length / 3;
      for (let i = 0; i <= T_STEPS; i++) {
        const s = (i / T_STEPS) * TRACK_LENGTH;
        const trk = sampleTrack(s);
        for (let r = 0; r < T_RINGS.length; r++) {
          const dist = T_RINGS[r];
          const pt = trk.pos.clone().addScaledVector(trk.norm, side * dist);
          let h = -0.04;
          if (r >= 2) {
            const hillWave = Math.sin(s * 0.012 + side * 1.4) * Math.cos(s * 0.007 - side * 0.7);
            const hillWave2 = Math.sin(s * 0.029 + r * 1.1);
            if (side < 0 && r >= 3) {
              // Outer hills can rise dramatically
              h = Math.max(0, (dist - 18) * 0.16 * (0.65 + 0.5 * hillWave + 0.25 * hillWave2));
            } else {
              // Inner infield gentle rolling mounds so aerial cameras aren't blocked
              h = Math.min(8.0, Math.max(-1.5, (dist - 16) * 0.045 * (0.4 + 0.6 * hillWave)));
            }
          }
          pt.y += h;
          terrVerts.push(pt.x, pt.y, pt.z);
          terrNormals.push(0, 1, 0);

          const pool = r <= 1 ? evaluateFloodlightPoolFactor(pt, s) : 0;
          const lum = r <= 1 ? (0.04 + 0.18 * pool) : 0.025;
          terrColors.push(lum * 0.75, lum * 0.90, lum * 0.82);
        }
      }
      const ringCount = T_RINGS.length;
      for (let i = 0; i < T_STEPS; i++) {
        for (let r = 0; r < ringCount - 1; r++) {
          const a = baseVOffset + i * ringCount + r;
          const b = baseVOffset + (i + 1) * ringCount + r;
          const c = baseVOffset + (i + 1) * ringCount + (r + 1);
          const d = baseVOffset + i * ringCount + (r + 1);
          if (side > 0) {
            terrIndices.push(a, b, d, b, c, d);
          } else {
            terrIndices.push(a, d, b, b, d, c);
          }
        }
      }
    }

    const terrGeo = new THREE.BufferGeometry();
    terrGeo.setAttribute('position', new THREE.Float32BufferAttribute(terrVerts, 3));
    terrGeo.setAttribute('normal', new THREE.Float32BufferAttribute(terrNormals, 3));
    terrGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrColors, 3));
    terrGeo.setIndex(terrIndices);
    terrGeo.computeVertexNormals();
    const terrMesh = new THREE.Mesh(terrGeo, new THREE.MeshStandardMaterial({

  // =========================================================================
  // 11. DETAILED FORMULA 1 SINGLE-SEATER BUILDER (80+ SHAPED MESHES PER CAR)
  // =========================================================================
  function buildF1Car(config) {
    const root = new THREE.Group();
    const chassis = new THREE.Group(); // Pitches & rolls on suspension
    root.add(chassis);

    // Materials
    const paintMat = new THREE.MeshStandardMaterial({
      color: config.bodyColor,

    });
    const decalMat = new THREE.MeshStandardMaterial({
      map: createCarDecalTexture(config.bodyHex, config.accentHex, config.trimHex, config.numberStr),
      metalness: 0.32,
      roughness: 0.18,
      envMapIntensity: 1.35
    });
    const accentMat = new THREE.MeshStandardMaterial({
      color: config.accentColor,
      metalness: 0.35,
      roughness: 0.20,
      envMapIntensity: 1.25
    });
    const carbonMat = new THREE.MeshStandardMaterial({
      color: 0x1a1d24,
      map: carbonTex,
      roughness: 0.34,
      metalness: 0.25,
      envMapIntensity: 0.9
    });
    const suspMat = new THREE.MeshStandardMaterial({
      color: 0x14171d,
      roughness: 0.28,
      metalness: 0.55
    });
    const metalAlloyMat = new THREE.MeshStandardMaterial({
      color: 0x9aa4b4,
      roughness: 0.22,
      metalness: 0.88,
      envMapIntensity: 1.3
    });
    const visorMat = new THREE.MeshStandardMaterial({
      color: config.visorColor,
      roughness: 0.05,
      metalness: 0.95,
      envMapIntensity: 2.2
    });
    const rainLightMat = new THREE.MeshStandardMaterial({
      color: 0x380404,
      emissive: 0xff1100,
      emissiveIntensity: 0.0,
      roughness: 0.15
    });
    const brakeDiscMat = new THREE.MeshStandardMaterial({
      color: 0x2a2626,
      emissive: 0xff5500,
      emissiveIntensity: 0.0,
      roughness: 0.35,
      metalness: 0.5
    });

    // Helper to add shadows to every car mesh
    function addPart(parent, geo, mat, pos, rot, scale) {
      const m = new THREE.Mesh(geo, mat);
      if (pos) m.position.set(pos[0], pos[1], pos[2]);
      if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
      if (scale) m.scale.set(scale[0], scale[1], scale[2]);
      m.castShadow = true;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    // -----------------------------------------------------------------------
    // A. FLOOR, RAISED FLOOR EDGES, SKID BLOCK & REAR DIFFUSER (7 meshes)
    // -----------------------------------------------------------------------
    const floorShape = new THREE.Shape();
    floorShape.moveTo(1.25, -0.58);
    floorShape.lineTo(0.85, -0.92);
    floorShape.lineTo(-1.35, -0.90);
    floorShape.lineTo(-2.15, -0.56);
    floorShape.lineTo(-2.15, 0.56);
    floorShape.lineTo(-1.35, 0.90);
    floorShape.lineTo(0.85, 0.92);
    floorShape.lineTo(1.25, 0.58);
    floorShape.closePath();

    const floorGeo = new THREE.ExtrudeGeometry(floorShape, { depth: 0.032, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.01, bevelSegments: 2 });
    floorGeo.rotateX(Math.PI * 0.5);
    addPart(chassis, floorGeo, carbonMat, [0, 0.065, 0]);

    [-1, 1].forEach(s => {
      addPart(chassis, new THREE.BoxGeometry(2.15, 0.048, 0.05), carbonMat, [-0.25, 0.088, s * 0.905]);
      addPart(chassis, new THREE.BoxGeometry(0.65, 0.075, 0.025), carbonMat, [0.75, 0.095, s * 0.86], [0, s * 0.14, 0]);

    addPart(chassis, new THREE.BoxGeometry(2.9, 0.015, 0.30), metalAlloyMat, [-0.25, 0.028, 0]);

    addPart(chassis, new THREE.BoxGeometry(0.75, 0.18, 1.12), carbonMat, [-2.12, 0.15, 0], [0, 0, -0.18]);
    [-0.32, 0.32].forEach(z => {
      addPart(chassis, new THREE.BoxGeometry(0.70, 0.17, 0.024), carbonMat, [-2.14, 0.14, z], [0, 0, -0.16]);

    // -----------------------------------------------------------------------
    // B. SLENDER NOSE & MONOCOQUE WITH COCKPIT (8 meshes)
    // -----------------------------------------------------------------------
    // Note: carefully profiled so in Shot 4 (camera at x=-0.22, y=1.25) all bodywork stays <= 23.5% from bottom of frame!

    noseTipGeo.scale(1.5, 0.52, 0.95);
    addPart(chassis, noseTipGeo, accentMat, [2.42, 0.095, 0]);

    // Forward monocoque bulkhead (x = +0.35 to +1.10, y up to 0.56)
    const monoFrontGeo = new THREE.CylinderGeometry(0.24, 0.33, 0.82, 16);

    // Main monocoque survival cell around cockpit (x = -0.60 to +0.42)

      const rodGeo = new THREE.CylinderGeometry(0.012, 0.012, rodLen, 8);
      rodGeo.rotateX(Math.PI * 0.5);
