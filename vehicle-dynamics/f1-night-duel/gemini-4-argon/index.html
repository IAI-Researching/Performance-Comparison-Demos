  function updateClosedFormParticles(simTime, kinR, kinB) {
    // A. Mist, Launch Smoke & Hairpin Lockup Smoke
    const MIST_LIFE = 0.95;
    for (let i = 0; i < MAX_MIST_PARTICLES; i++) {
      const idx3 = i * 3;
      const isBlue = (i % 2) === 1;
      const isLockupSlot = (!isBlue && i < 64);

      const phi = (i / MAX_MIST_PARTICLES);
      const cycle = Math.floor((simTime - phi * MIST_LIFE) / MIST_LIFE);
      const tEmit = (cycle + phi) * MIST_LIFE;
      const age = simTime - tEmit;

      if (tEmit < 3.0 || age < 0 || age > MIST_LIFE) {
        mistPositions[idx3] = 0;
        mistPositions[idx3 + 1] = -500;
        mistPositions[idx3 + 2] = 0;
        continue;
      }

      const emitKin = getCarKinematics(isBlue, tEmit);
      const spd = emitKin.speed;

      // Check if this slot is for the red car's hairpin inside front-left tyre lockup puff [19.8, 21.6]
      const inHairpinLockup = isLockupSlot && (tEmit >= 19.85 && tEmit <= 21.55);
      const inLaunchWheelspin = (tEmit >= 3.0 && tEmit <= 5.8);

      if (!inHairpinLockup && !inLaunchWheelspin && spd < 7.0) {
        mistPositions[idx3] = 0;
        mistPositions[idx3 + 1] = -500;
        mistPositions[idx3 + 2] = 0;
        continue;
      }

      const r1 = hashFloat(i + cycle * 997, 11);
      const r2 = hashFloat(i + cycle * 997, 23);
      const r3 = hashFloat(i + cycle * 997, 37);

      let localX, localY, localZ, upVel, sideSpread, backDrift, br;
      if (inHairpinLockup) {
        // Inside front tyre at left-hand hairpin = front-left wheel (x = +1.80, z = -0.84)
        localX = 1.80;
        localY = 0.14;
        localZ = -0.86;
        upVel = 0.9 + r1 * 1.1;
        sideSpread = -0.8 - r2 * 1.6;
        backDrift = 2.5 + r3 * 3.5;
        br = 0.88 * (1.0 - age / MIST_LIFE);
      } else if (inLaunchWheelspin) {
        // Spinning rear tyres throwing dense tyre smoke + water mist
        const wheelSide = (r1 < 0.5 ? -1 : 1);
        localX = -1.85;
        localY = 0.18;
        localZ = wheelSide * (0.78 + (r2 - 0.5) * 0.25);
        upVel = 1.15 + r3 * 1.4;
        sideSpread = wheelSide * (0.6 + r2 * 1.8);
        backDrift = 3.0 + r1 * 5.0;
        br = 0.72 * (1.0 - age / MIST_LIFE);
      } else {
        // Damp track rooster-tail spray plume behind diffuser & rear wheels
        const sprayFactor = Math.min(1.0, (spd - 7.0) / 48.0);
        if (r1 > sprayFactor * 0.95) {
          mistPositions[idx3] = 0;
          mistPositions[idx3 + 1] = -500;
          mistPositions[idx3 + 2] = 0;
          continue;
        }
        localX = -2.35 - r2 * 0.6;
        localY = 0.22 + r3 * 0.25;
        localZ = (r1 - 0.5) * 1.65;
        upVel = (1.1 + r2 * 1.8) * (0.45 + 0.55 * sprayFactor);
        sideSpread = (r1 - 0.5) * 3.6;
        backDrift = 4.0 + r3 * 6.0;
        br = (0.28 + 0.34 * sprayFactor) * (1.0 - age / MIST_LIFE);
      }

      const px = emitKin.worldPos.x +
                 emitKin.forward.x * (localX - backDrift * age) +
                 emitKin.right.x * (localZ + sideSpread * age) +
                 emitKin.up.x * (localY + upVel * age);
      const py = emitKin.worldPos.y +
                 emitKin.forward.y * (localX - backDrift * age) +
                 emitKin.right.y * (localZ + sideSpread * age) +
                 emitKin.up.y * (localY + upVel * age);
      const pz = emitKin.worldPos.z +
                 emitKin.forward.z * (localX - backDrift * age) +
                 emitKin.right.z * (localZ + sideSpread * age) +
                 emitKin.up.z * (localY + upVel * age);

      mistPositions[idx3] = px;
      mistPositions[idx3 + 1] = py;
      mistPositions[idx3 + 2] = pz;

      // Tint spray slightly red near the car's blinking rear rain light
      const rainTint = (age < 0.22 && ((tEmit * 4) % 1 < 0.5)) ? 0.35 : 0.0;
      mistColors[idx3] = br * (0.78 + rainTint);
      mistColors[idx3 + 1] = br * (0.85 - rainTint * 0.3);
      mistColors[idx3 + 2] = br * (0.96 - rainTint * 0.4);
    }
    mistGeo.attributes.position.needsUpdate = true;
    mistGeo.attributes.color.needsUpdate = true;

    // B. Titanium Skid-Block Sparks (when speed > 200 km/h = 55.56 m/s OR hard braking acc < -7.0 m/s²)
    const SPARK_LIFE = 0.36;
    for (let i = 0; i < MAX_SPARKS; i++) {
      const idx6 = i * 6;
      const isBlue = (i % 2) === 1;
      const phi = i / MAX_SPARKS;
      const cycle = Math.floor((simTime - phi * SPARK_LIFE) / SPARK_LIFE);
      const tEmit = (cycle + phi) * SPARK_LIFE;
      const age = simTime - tEmit;

      if (tEmit < 3.5 || age < 0 || age > SPARK_LIFE) {
        sparkPositions[idx6] = sparkPositions[idx6 + 3] = 0;
        sparkPositions[idx6 + 1] = sparkPositions[idx6 + 4] = -500;
        sparkPositions[idx6 + 2] = sparkPositions[idx6 + 5] = 0;
        continue;
      }

      const emitKin = getCarKinematics(isBlue, tEmit);
      const highSpeed = emitKin.speed > 55.2; // > 200 km/h
      const hardBraking = emitKin.smoothAcc < -6.8;

      if (!highSpeed && !hardBraking) {
        sparkPositions[idx6] = sparkPositions[idx6 + 3] = 0;
        sparkPositions[idx6 + 1] = sparkPositions[idx6 + 4] = -500;
        sparkPositions[idx6 + 2] = sparkPositions[idx6 + 5] = 0;
        continue;
      }

      const r1 = hashFloat(i + cycle * 613, 53);
      const r2 = hashFloat(i + cycle * 613, 71);
      const r3 = hashFloat(i + cycle * 613, 89);

      const intensity = Math.max(
        highSpeed ? Math.min(1.0, (emitKin.speed - 54.0) / 10.0) : 0,
        hardBraking ? Math.min(1.0, (-emitKin.smoothAcc - 6.0) / 8.0) : 0
      );
      if (r1 > intensity) {
        sparkPositions[idx6] = sparkPositions[idx6 + 3] = 0;
        sparkPositions[idx6 + 1] = sparkPositions[idx6 + 4] = -500;
        sparkPositions[idx6 + 2] = sparkPositions[idx6 + 5] = 0;
        continue;
      }

      // Ballistic trajectory with bounce off wet asphalt
      const backSpeed = 14.0 + r2 * 12.0;
      const sideSpeed = (r3 - 0.5) * 6.5;
      const hBounce = Math.abs(Math.sin(age * 16.0 + r1 * 3.0)) * (0.38 * (1.0 - age / SPARK_LIFE) + 0.04);

      const dtStreak = 0.024;
      const ageTail = Math.max(0, age - dtStreak);
      const hTail = Math.abs(Math.sin(ageTail * 16.0 + r1 * 3.0)) * (0.38 * (1.0 - ageTail / SPARK_LIFE) + 0.04);

      const sx0 = emitKin.worldPos.x + emitKin.forward.x * (-1.4 - backSpeed * age) + emitKin.right.x * sideSpeed * age + emitKin.up.x * hBounce;
      const sy0 = emitKin.worldPos.y + emitKin.forward.y * (-1.4 - backSpeed * age) + emitKin.right.y * sideSpeed * age + emitKin.up.y * hBounce;
      const sz0 = emitKin.worldPos.z + emitKin.forward.z * (-1.4 - backSpeed * age) + emitKin.right.z * sideSpeed * age + emitKin.up.z * hBounce;

      const sx1 = emitKin.worldPos.x + emitKin.forward.x * (-1.4 - backSpeed * ageTail) + emitKin.right.x * sideSpeed * ageTail + emitKin.up.x * hTail;
      const sy1 = emitKin.worldPos.y + emitKin.forward.y * (-1.4 - backSpeed * ageTail) + emitKin.right.y * sideSpeed * ageTail + emitKin.up.y * hTail;
      const sz1 = emitKin.worldPos.z + emitKin.forward.z * (-1.4 - backSpeed * ageTail) + emitKin.right.z * sideSpeed * ageTail + emitKin.up.z * hTail;

      sparkPositions[idx6] = sx0;
      sparkPositions[idx6 + 1] = sy0;
      sparkPositions[idx6 + 2] = sz0;
      sparkPositions[idx6 + 3] = sx1;
      sparkPositions[idx6 + 4] = sy1;
      sparkPositions[idx6 + 5] = sz1;

      const fade = 1.0 - age / SPARK_LIFE;
      sparkColors[idx6] = 1.0;
      sparkColors[idx6 + 1] = 0.78 * fade + 0.15;
      sparkColors[idx6 + 2] = 0.32 * fade;
      sparkColors[idx6 + 3] = 0.95 * fade;
      sparkColors[idx6 + 4] = 0.42 * fade;
      sparkColors[idx6 + 5] = 0.08 * fade;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;

    // C. Grid Exhaust Heat Shimmer (simTime <= 4.5s)
    if (simTime <= 4.5) {
      shimmerPoints.visible = true;
      const fade = simTime < 3.2 ? 1.0 : Math.max(0, 1.0 - (simTime - 3.2) / 1.3);
      shimmerMat.opacity = 0.14 * fade;
      for (let i = 0; i < MAX_SHIMMER; i++) {
        const kin = (i % 2 === 0) ? kinR : kinB;
        const phase = ((simTime * 1.4 + i * 0.17) % 1.0);
        const wobbleX = Math.sin(simTime * 9.0 + i * 1.7) * 0.18 * phase;
        const wobbleZ = Math.cos(simTime * 7.5 + i * 2.3) * 0.22 * phase;
        const p = kin.worldPos.clone()
          .addScaledVector(kin.forward, -2.35 - phase * 1.4 + wobbleX)
          .addScaledVector(kin.right, wobbleZ)
          .addScaledVector(kin.up, 0.38 + phase * 1.65);
        shimmerPositions[i * 3] = p.x;
        shimmerPositions[i * 3 + 1] = p.y;
        shimmerPositions[i * 3 + 2] = p.z;
      }
      shimmerGeo.attributes.position.needsUpdate = true;
    } else {
      shimmerPoints.visible = false;
    }

    // D. Grandstand Camera Flashes (simTime >= 36.490s)
    if (simTime >= 36.490) {
      flashPoints.visible = true;
      const dtFinish = simTime - 36.490;
      for (let i = 0; i < NUM_FLASHES; i++) {
        const fm = flashMeta[i];
        const localT = (dtFinish + fm.phase) % fm.period;
        if (localT < 0.065) {
          const br = 1.0 - localT / 0.065;
          flashPositions[i * 3] = fm.x;
          flashPositions[i * 3 + 1] = fm.y;
          flashPositions[i * 3 + 2] = fm.z;
          flashColors[i * 3] = br;
          flashColors[i * 3 + 1] = br * 0.98;
          flashColors[i * 3 + 2] = br * 1.0;
        } else {
          flashPositions[i * 3] = 0;
          flashPositions[i * 3 + 1] = -500;
          flashPositions[i * 3 + 2] = 0;
        }
      }
      flashGeo.attributes.position.needsUpdate = true;
      flashGeo.attributes.color.needsUpdate = true;
    } else {
      flashPoints.visible = false;
    }
  }

  // =========================================================================
  // 13. PURE DETERMINISTIC RENDER FUNCTION: renderAt(simTime)
  // =========================================================================
  const _m4 = new THREE.Matrix4();

  function poseCar(carObj, kin, isBlue, simTime) {
    carObj.root.position.copy(kin.worldPos);

    // Orient root along car's forward, up, right basis (+X forward, +Y up, +Z right)
    _m4.makeBasis(kin.forward, kin.up, kin.right);
    carObj.root.quaternion.setFromRotationMatrix(_m4);

    // Body pitch under acceleration/braking and roll in corners
    const pitchAngle = THREE.MathUtils.clamp(-kin.smoothAcc * 0.0022, -0.028, 0.022);
    const latAccel = kin.speed * kin.speed * kin.curv;
    const rollAngle = THREE.MathUtils.clamp(-latAccel * 0.00055, -0.032, 0.032);
    carObj.chassis.rotation.set(rollAngle, 0, pitchAngle);

    // Wheel spin by distance travelled (s / wheelRadius)
    const wheelRadius = 0.36;
    let spinAngle = -(kin.s - (isBlue ? -16.0 : -8.0)) / wheelRadius;
    // Extra rear wheelspin slip during launch [3.0, 5.2]
    if (simTime > 3.0 && simTime < 5.2) {
      const slipT = simTime - 3.0;
      spinAngle -= Math.sin(slipT * 14.0) * 1.8;
    }
    carObj.spinGroups.forEach(sg => {
      sg.rotation.set(0, 0, spinAngle);
    });

    // Front wheel steering into corners + lane changes
    const steerAngle = THREE.MathUtils.clamp(-kin.curv * 4.5 - kin.latAngle * 0.85, -0.34, 0.34);
    carObj.steerGroups.forEach(stg => {
      stg.rotation.set(0, steerAngle, 0);
    });

    // Rear rain light blinks at 4 Hz of simTime
    const rainBlink = ((simTime * 4.0) % 1.0) < 0.5;
    carObj.rainLightMat.emissiveIntensity = rainBlink ? 2.8 : 0.08;
    carObj.rainGlowSprite.material.opacity = rainBlink ? 0.85 : 0.04;

    // Brake disc orange glow in proportion to deceleration
    carObj.brakeDiscMat.emissiveIntensity = kin.brakeGlow * 3.2;

    // Movable DRS upper rear-wing flap (Blue car opens from simTime = 33.500 until finish line at 36.490)
    let drsOpenFactor = 0.0;
    if (isBlue && simTime >= 33.500 && simTime < 36.490) {
      const rampIn = Math.min(1.0, (simTime - 33.500) / 0.15);
      const rampOut = Math.min(1.0, (36.490 - simTime) / 0.12);
      drsOpenFactor = Math.min(rampIn, rampOut);
    }
    carObj.drsFlap.rotation.z = 0.42 * (1.0 - drsOpenFactor) + 0.02 * drsOpenFactor;
  }

  function updateStartGantryLights(simTime) {
    // 1. Five red lights come on one at a time at 0.5, 1.0, 1.5, 2.0, 2.5 and all go out at 3.000
    for (let i = 0; i < 5; i++) {
      const redOn = (simTime >= (i + 1) * 0.5) && (simTime < 3.000);
      gantryRedPods[i].emissive.setHex(redOn ? 0xff1a12 : 0x000000);
      gantryRedPods[i].emissiveIntensity = redOn ? 2.5 : 0.0;
      gantryRedSprites[i].material.opacity = redOn ? 0.92 : 0.0;
    }

    // 2. Green lights flash at 5 Hz after blue car crosses finish line at simTime = 36.490
    const greenFlash = (simTime >= 36.490) && (((simTime - 36.490) * 5.0) % 1.0 < 0.5);
    for (let i = 0; i < 5; i++) {
      gantryGreenPods[i].emissive.setHex(greenFlash ? 0x16ff55 : 0x000000);
      gantryGreenPods[i].emissiveIntensity = greenFlash ? 2.5 : 0.0;
      gantryGreenSprites[i].material.opacity = greenFlash ? 0.90 : 0.0;
    }
  }

  function updateBroadcastCamera(simTime, kinR, kinB) {
    // Body centres of both cars (+0.45m above floor reference point)
    const centerR = kinR.worldPos.clone().add(new THREE.Vector3(0, 0.45, 0));
    const centerB = kinB.worldPos.clone().add(new THREE.Vector3(0, 0.45, 0));
    const MID = centerR.clone().add(centerB).multiplyScalar(0.5);

    let camPos = new THREE.Vector3();
    let lookTarget = new THREE.Vector3();
    let baseFov = 35;
    let isOnboard = false;

    if (simTime < 5.0) {
      // Shot 1: [0, 5) Grid, from behind
      camPos.set(-34, 2.6, 0);
      lookTarget.set(0, 3.0, 0);
      baseFov = 35;
    } else if (simTime < 11.0) {
      // Shot 2: [5, 11) Chase behind blue: C(sB - 9) + dB·n + (0, 2.4, 0) -> C(sB + 14) + (0, 0.9, 0)
      const cBack = sampleTrack(kinB.s - 9.0);
      camPos.copy(cBack.pos).addScaledVector(cBack.norm, kinB.d).add(new THREE.Vector3(0, 2.4, 0));
      const cAhead = sampleTrack(kinB.s + 14.0);
      lookTarget.copy(cAhead.pos).add(new THREE.Vector3(0, 0.9, 0));
      baseFov = 50;
    } else if (simTime < 15.0) {
      // Shot 3: [11, 15) Trackside, uphill sweep: C(400) - 18·n(400) + (0, 5, 0) -> MID
      const t400 = sampleTrack(400.0);
      camPos.copy(t400.pos).addScaledVector(t400.norm, -18.0).add(new THREE.Vector3(0, 5.0, 0));
      lookTarget.copy(MID);
      baseFov = 24;
    } else if (simTime < 20.0) {
      // Shot 4: [15, 20) Blue onboard (T-cam): 1.25m above floor, 0.2m behind roll hoop, rigid with car
      isOnboard = true;
      const localCam = new THREE.Vector3(-0.22, 1.25, 0.0);
      const localTarget = new THREE.Vector3(40.0, 0.60, 0.0);
      blueCar.root.updateMatrixWorld(true);
      camPos.copy(localCam).applyMatrix4(blueCar.root.matrixWorld);
      lookTarget.copy(localTarget).applyMatrix4(blueCar.root.matrixWorld);
      baseFov = 75;
    } else if (simTime < 24.0) {
      // Shot 5: [20, 24) Trackside, hairpin: C(725) + 20·n(725) + (0, 3, 0) -> MID
      const t725 = sampleTrack(725.0);
      camPos.copy(t725.pos).addScaledVector(t725.norm, 20.0).add(new THREE.Vector3(0, 3.0, 0));
      lookTarget.copy(MID);
      baseFov = 28;
    } else if (simTime < 30.0) {
      // Shot 6: [24, 30) Aerial: (-80, 120, 150) -> MID
      camPos.set(-80, 120, 150);
      lookTarget.copy(MID);
      baseFov = 30;
    } else if (simTime < 34.0) {
      // Shot 7: [30, 34) Trackside, final corner: C(1300) - 12·n(1300) + (0, 1.2, 0) -> MID
      const t1300 = sampleTrack(1300.0);
      camPos.copy(t1300.pos).addScaledVector(t1300.norm, -12.0).add(new THREE.Vector3(0, 1.2, 0));
      lookTarget.copy(MID);
      baseFov = 30;
    } else {
      // Shot 8: [34, 40] Finish line: (-20, 4.5, 15) -> MID
      camPos.set(-20, 4.5, 15);
      lookTarget.copy(MID);
      baseFov = 32;
    }

    // Preserve horizontal FOV in portrait aspect ratios (e.g. 1280x1340) so both cars stay inside frame
    const aspect = camera.aspect || (window.innerWidth / Math.max(1, window.innerHeight));
    let effectiveFov = baseFov;
    if (!isOnboard && aspect < 1.77) {
      const tanHalfV = Math.tan(THREE.MathUtils.degToRad(baseFov) * 0.5);
      const scale = Math.min(1.86, 1.7778 / Math.max(0.85, aspect));
      effectiveFov = THREE.MathUtils.radToDeg(2.0 * Math.atan(tanHalfV * scale));
    }

    camera.fov = effectiveFov;
    camera.position.copy(camPos);
    if (isOnboard) {
      camera.up.copy(kinB.up);
    } else {
      camera.up.set(0, 1, 0);
    }
    camera.lookAt(lookTarget);
    camera.updateProjectionMatrix();

    // Update shadow-casting action lights around MID & nearest floodlight masts
    actionKeyLight.position.set(MID.x + 12, MID.y + 28, MID.z + 10);
    actionKeyLight.target.position.copy(MID);
    actionKeyLight.target.updateMatrixWorld();

    carRimLight.position.set(MID.x - kinR.forward.x * 5, MID.y + 4.5, MID.z - kinR.forward.z * 5);

    // Snap the 3 active mast point lights to the 3 floodlight masts closest to MID
    let bestIdx = 0;
    let bestDist = Infinity;
    for (let i = 0; i < mastList.length; i++) {
      const d2 = mastList[i].poolCenter.distanceToSquared(MID);
      if (d2 < bestDist) {
        bestDist = d2;
        bestIdx = i;
      }
    }
    for (let k = -1; k <= 1; k++) {
      const m = mastList[(bestIdx + k + mastList.length) % mastList.length];
      activeMastLights[k + 1].position.copy(m.headPos);
    }

    return { camPos, lookTarget, isOnboard };
  }

  let currentKinR = null;
  let currentKinB = null;
  let currentCamInfo = null;

  function renderAt(simTime) {
    const t = Math.max(0, Math.min(DURATION, simTime));
    const kinR = getCarKinematics(false, t);
    const kinB = getCarKinematics(true, t);

    poseCar(redCar, kinR, false, t);
    poseCar(blueCar, kinB, true, t);
    updateStartGantryLights(t);
    updateClosedFormParticles(t, kinR, kinB);
    const camInfo = updateBroadcastCamera(t, kinR, kinB);

    currentKinR = kinR;
    currentKinB = kinB;
    currentCamInfo = camInfo;

    renderer.render(scene, camera);
  }

  // =========================================================================
  // 14. SYNTHESIZED WEB AUDIO API ENGINE (NO EXTERNAL AUDIO FILES, SEED 4242)
  // =========================================================================
  const GEAR_SPEEDS = [0, 10, 21, 31, 41, 50, 58, 65, 80];

  function computeEngineGearAndRPM(speed, acc, simTime, isBlue) {
    // Grid idle & launch rev-up before lights out (simTime < 3.0)
    if (simTime < 3.0) {
      const burble = Math.sin(simTime * 44.0 + (isBlue ? 1.8 : 0.0)) * 220 +
                     Math.sin(simTime * 29.0) * 140;
      let baseRpm = 4700 + burble;
      if (simTime >= 2.35) {
        const revBuild = Math.min(1.0, (simTime - 2.35) / 0.55);
        baseRpm = 4700 + revBuild * 5900 + Math.sin(simTime * 95.0) * 180;
      }
      return { gear: 1, rpm: baseRpm, shiftDip: 1.0 };
    }

    // Launch wheelspin flare [3.0, 4.6]
    if (simTime < 4.6) {
      const flare = Math.sin((simTime - 3.0) * 5.5) * 900;
      return { gear: 1, rpm: 9800 + flare + speed * 75, shiftDip: 1.0 };
    }

    let gear = 1;
    for (let g = 1; g < GEAR_SPEEDS.length - 1; g++) {
      if (speed >= GEAR_SPEEDS[g]) gear = g + 1;
    }
    const vMin = GEAR_SPEEDS[gear - 1];
    const vMax = GEAR_SPEEDS[gear];
    const frac = THREE.MathUtils.clamp((speed - vMin) / Math.max(1, vMax - vMin), 0, 1);
    let rpm = 6600 + frac * 5100;

    // Brief pitch/volume dip near gear shift speed thresholds
    let shiftDip = 1.0;
    for (let g = 1; g < GEAR_SPEEDS.length - 1; g++) {
      const dist = Math.abs(speed - GEAR_SPEEDS[g]);
      if (dist < 0.85) {
        if (acc > 1.0) {
          // Upshift ignition cut dip
          shiftDip = 0.35 + 0.65 * (dist / 0.85);
          rpm -= (1.0 - dist / 0.85) * 380;
        } else if (acc < -2.0) {
          // Downshift throttle blip
          rpm += (1.0 - dist / 0.85) * 650;
        }
      }
    }
    return { gear, rpm: THREE.MathUtils.clamp(rpm, 5000, 12100), shiftDip };
  }

  let audioCtx = null;
  let audioInitialized = false;
  let masterGain = null;
  let activeOneShots = [];
  let carAudioR = null;
  let carAudioB = null;
  let crowdGain = null;
  let crowdFilter = null;
  let humGain = null;
  let breezeGain = null;
  let onboardWindGain = null;

  function createSeededNoiseBuffer(ctx, durationSec, mode) {
    const sampleRate = ctx.sampleRate;
    const len = Math.floor(sampleRate * durationSec);
    const buffer = ctx.createBuffer(1, len, sampleRate);
    const data = buffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < len; i++) {
      const white = audioRand() * 2 - 1;
      if (mode === 'pink') {
        b0 = 0.99765 * b0 + white * 0.0990460;
        b1 = 0.96300 * b1 + white * 0.2965164;
        b2 = 0.57000 * b2 + white * 1.0526913;
        data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.18;
      } else {
        data[i] = white * 0.5;
      }
    }
    return buffer;
  }

  function createDistortionCurve(amount) {
    const n = 256;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i * 2) / n - 1;
      curve[i] = ((3 + amount) * x * 20 * (Math.PI / 180)) / (Math.PI + amount * Math.abs(x));
    }
    return curve;
  }

  function buildCarAudioVoice(ctx, dest, noiseBuf, isBlue) {
    const panner = ctx.createStereoPanner();
    const distGain = ctx.createGain();
    distGain.gain.value = 0.0;
    panner.connect(distGain);
    distGain.connect(dest);

    // Engine harmonic filter & waveshaper
    const engFilter = ctx.createBiquadFilter();
    engFilter.type = 'lowpass';
    engFilter.frequency.value = 1200;
    engFilter.Q.value = 1.6;

    const shaper = ctx.createWaveShaper();
    shaper.curve = createDistortionCurve(isBlue ? 24 : 32);

    const engGain = ctx.createGain();
    engGain.gain.value = 0.25;
    shaper.connect(engFilter);
    engFilter.connect(engGain);
    engGain.connect(panner);

    // 3 V6 oscillators (sub-growl 0.5x, firing fundamental 1.0x, 2nd harmonic 2.0x)
    const oscSub = ctx.createOscillator();
    oscSub.type = 'sawtooth';
    const subGain = ctx.createGain();
    subGain.gain.value = isBlue ? 0.28 : 0.38; // Red has deeper sub growl
    oscSub.connect(subGain);
    subGain.connect(shaper);

    const oscFund = ctx.createOscillator();
    oscFund.type = 'sawtooth';
    const fundGain = ctx.createGain();
    fundGain.gain.value = 0.52;
    oscFund.connect(fundGain);
    fundGain.connect(shaper);

    const oscHarm = ctx.createOscillator();
    oscHarm.type = isBlue ? 'square' : 'triangle';
    const harmGain = ctx.createGain();
    harmGain.gain.value = isBlue ? 0.34 : 0.24; // Blue has brighter upper harmonic
    oscHarm.connect(harmGain);
    harmGain.connect(shaper);

    // Turbocharger whistle oscillator
    const oscTurbo = ctx.createOscillator();
    oscTurbo.type = 'sine';
    const turboGain = ctx.createGain();
    turboGain.gain.value = 0.0;
    oscTurbo.connect(turboGain);
    turboGain.connect(panner);

    // Wet road spray hiss (bandpass noise)
    const hissSrc = ctx.createBufferSource();
    hissSrc.buffer = noiseBuf;
    hissSrc.loop = true;
    const hissFilter = ctx.createBiquadFilter();
    hissFilter.type = 'bandpass';
    hissFilter.frequency.value = 2400;
    hissFilter.Q.value = 0.9;
    const hissGain = ctx.createGain();
    hissGain.gain.value = 0.0;
    hissSrc.connect(hissFilter);
    hissFilter.connect(hissGain);
    hissGain.connect(panner);

    // Tyre wheelspin / cornering squeal
    const squealOsc = ctx.createOscillator();
    squealOsc.type = 'triangle';
    const squealFilter = ctx.createBiquadFilter();
    squealFilter.type = 'bandpass';
    squealFilter.frequency.value = 950;
    squealFilter.Q.value = 4.5;
    const squealGain = ctx.createGain();
    squealGain.gain.value = 0.0;
    squealOsc.connect(squealFilter);
    squealFilter.connect(squealGain);
    squealGain.connect(panner);

    // Titanium skid-block spark crackle & brake disc squeal
    const sparkSrc = ctx.createBufferSource();
    sparkSrc.buffer = noiseBuf;
    sparkSrc.loop = true;
    const sparkFilter = ctx.createBiquadFilter();
    sparkFilter.type = 'highpass';
    sparkFilter.frequency.value = 3900;
    const sparkGain = ctx.createGain();
    sparkGain.gain.value = 0.0;
    sparkSrc.connect(sparkFilter);
    sparkFilter.connect(sparkGain);
    sparkGain.connect(panner);

    const brakeOsc = ctx.createOscillator();
    brakeOsc.type = 'sine';
    brakeOsc.frequency.value = isBlue ? 4750 : 4480;
    const brakeGain = ctx.createGain();
    brakeGain.gain.value = 0.0;
    brakeOsc.connect(brakeGain);
    brakeGain.connect(panner);

    oscSub.start();
    oscFund.start();
    oscHarm.start();
    oscTurbo.start();
    hissSrc.start();
    squealOsc.start();
    sparkSrc.start();
    brakeOsc.start();

    return {
      panner, distGain, engFilter, engGain,
      oscSub, oscFund, oscHarm, oscTurbo, turboGain,
      hissGain, hissFilter, squealOsc, squealGain,
      sparkGain, brakeGain
    };
  }

  function initAudio() {
    if (audioInitialized) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
      audioInitialized = true;

      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.005;
      compressor.release.value = 0.12;
      compressor.connect(audioCtx.destination);

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);

      const pinkBuf = createSeededNoiseBuffer(audioCtx, 3.0, 'pink');
      const whiteBuf = createSeededNoiseBuffer(audioCtx, 2.5, 'white');

      carAudioR = buildCarAudioVoice(audioCtx, masterGain, whiteBuf, false);
      carAudioB = buildCarAudioVoice(audioCtx, masterGain, whiteBuf, true);

      // Night Ambience: Crowd murmur + finish roar
      const crowdSrc = audioCtx.createBufferSource();
      crowdSrc.buffer = pinkBuf;
      crowdSrc.loop = true;
      crowdFilter = audioCtx.createBiquadFilter();
      crowdFilter.type = 'bandpass';
      crowdFilter.frequency.value = 520;
      crowdFilter.Q.value = 0.8;
      crowdGain = audioCtx.createGain();
      crowdGain.gain.value = 0.04;
      crowdSrc.connect(crowdFilter);
      crowdFilter.connect(crowdGain);
      crowdGain.connect(masterGain);
      crowdSrc.start();

      // Floodlight electrical ballast hum (100 Hz)
      const humOsc = audioCtx.createOscillator();
      humOsc.type = 'sawtooth';
      humOsc.frequency.value = 100;
      const humFilter = audioCtx.createBiquadFilter();
      humFilter.type = 'lowpass';
      humFilter.frequency.value = 180;
      humGain = audioCtx.createGain();
      humGain.gain.value = 0.015;
      humOsc.connect(humFilter);
      humFilter.connect(humGain);
      humGain.connect(masterGain);
      humOsc.start();

      // Humid night breeze
      const breezeSrc = audioCtx.createBufferSource();
      breezeSrc.buffer = pinkBuf;
      breezeSrc.loop = true;
      const breezeFilter = audioCtx.createBiquadFilter();
      breezeFilter.type = 'lowpass';
      breezeFilter.frequency.value = 340;
      breezeGain = audioCtx.createGain();
      breezeGain.gain.value = 0.025;
      breezeSrc.connect(breezeFilter);
      breezeFilter.connect(breezeGain);
      breezeGain.connect(masterGain);
      breezeSrc.start();

      // Shot 4 Onboard Cockpit Wind Roar
      const windSrc = audioCtx.createBufferSource();
      windSrc.buffer = pinkBuf;
      windSrc.loop = true;
      const windFilter = audioCtx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 420;
      windFilter.Q.value = 0.7;
      onboardWindGain = audioCtx.createGain();
      onboardWindGain.gain.value = 0.0;
      windSrc.connect(windFilter);
      windFilter.connect(onboardWindGain);
      onboardWindGain.connect(masterGain);
      windSrc.start();

      audioCtx.resume().catch(() => {});
    } catch (e) {
      // Ignore if Web Audio blocked until gesture
    }
  }

  function resumeAudioOnGesture() {
    if (!audioInitialized) initAudio();
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  }
  window.addEventListener('pointerdown', resumeAudioOnGesture, { passive: true });
  window.addEventListener('keydown', resumeAudioOnGesture, { passive: true });
  initAudio();

  function stopAllOneShots() {
    while (activeOneShots.length > 0) {
      const node = activeOneShots.pop();
      try { node.stop(); } catch (e) {}
    }
  }

  function triggerStartLightBeep() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, now);
    g.gain.setValueAtTime(0.18, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.15);
    activeOneShots.push(osc);
  }

  function triggerDrsClick(isOpen) {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(isOpen ? 1650 : 1120, now);
    osc.frequency.exponentialRampToValueAtTime(isOpen ? 420 : 280, now + 0.045);
    g.gain.setValueAtTime(isOpen ? 0.14 : 0.09, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.055);
    activeOneShots.push(osc);
  }

  function triggerShutterClick() {
    if (!audioCtx || audioCtx.state !== 'running') return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(3200 + audioRand() * 900, now);
    g.gain.setValueAtTime(0.045, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.018);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 0.02);
    activeOneShots.push(osc);
  }

  function updateCarVoiceAtTime(voice, kin, isBlue, simTime, camInfo, now) {
    const camPos = camInfo.camPos;
    const toCar = new THREE.Vector3().subVectors(kin.worldPos, camPos);
    const dist = Math.max(2.0, toCar.length());
    const dirToCar = toCar.clone().divideScalar(dist);

    // Camera right vector for stereo panning
    const camFwd = new THREE.Vector3().subVectors(camInfo.lookTarget, camPos).normalize();
    const camRight = new THREE.Vector3().crossVectors(camFwd, WORLD_UP).normalize();
    const pan = (camInfo.isOnboard && isBlue) ? 0.0 : THREE.MathUtils.clamp(dirToCar.dot(camRight) * 0.85, -0.9, 0.9);
    voice.panner.pan.setTargetAtTime(pan, now, 0.02);

    // Doppler pitch shift from line-of-sight velocity relative to camera
    let doppler = 1.0;
    if (!(camInfo.isOnboard && isBlue) && !(simTime >= 5.0 && simTime < 11.0)) {
      const carVelVec = kin.forward.clone().multiplyScalar(kin.speed);
      const radialSpeed = -carVelVec.dot(dirToCar); // positive when approaching camera
      doppler = THREE.MathUtils.clamp(343.0 / (343.0 - radialSpeed), 0.68, 1.48);
    }

    // Distance attenuation
    const atten = (camInfo.isOnboard && isBlue) ? 0.95 : THREE.MathUtils.clamp(14.0 / (dist + 8.0), 0.05, 0.85);
    voice.distGain.gain.setTargetAtTime(atten, now, 0.02);

    const gInfo = computeEngineGearAndRPM(kin.speed, kin.smoothAcc, simTime, isBlue);
    const f0 = ((gInfo.rpm / 60.0) * 3.0) * doppler * (isBlue ? 1.03 : 0.98);

    voice.oscSub.frequency.setTargetAtTime(f0 * 0.5, now, 0.015);
    voice.oscFund.frequency.setTargetAtTime(f0, now, 0.015);
    voice.oscHarm.frequency.setTargetAtTime(f0 * 2.0, now, 0.015);
    voice.oscTurbo.frequency.setTargetAtTime((1650 + (gInfo.rpm - 5000) * 0.42) * doppler, now, 0.02);

    // Filter brightness & volume respond to throttle/acceleration + onboard cockpit low-pass in Shot 4
    const throttle = simTime < 3.0 ? (simTime > 2.4 ? 0.75 : 0.28) : THREE.MathUtils.clamp(0.45 + kin.smoothAcc * 0.06, 0.22, 1.0);
    const cutoff = (camInfo.isOnboard && isBlue) ? 1350 : (650 + throttle * 2400 + (gInfo.rpm - 5000) * 0.2);
    voice.engFilter.frequency.setTargetAtTime(cutoff, now, 0.02);
    voice.engGain.gain.setTargetAtTime((0.18 + throttle * 0.22) * gInfo.shiftDip, now, 0.015);
    voice.turboGain.gain.setTargetAtTime(simTime < 3.0 ? 0.005 : (0.015 + throttle * 0.028), now, 0.02);

    // Wet road spray hiss rises with speed
    const hissLvl = THREE.MathUtils.clamp((kin.speed - 4.0) / 68.0, 0.0, 1.0) * 0.16;
    voice.hissGain.gain.setTargetAtTime(hissLvl, now, 0.03);
    voice.hissFilter.frequency.setTargetAtTime(1800 + kin.speed * 22, now, 0.03);

    // Launch wheelspin screech [3.0, 5.0] + hairpin/braking tyre squeal
    let squealLvl = 0.0;
    if (simTime >= 3.0 && simTime <= 5.0) {
      squealLvl = Math.sin(((simTime - 3.0) / 2.0) * Math.PI) * 0.09;
    } else if (kin.smoothAcc < -7.5 || Math.abs(kin.curv) * kin.speed > 0.22) {
      squealLvl = 0.045;
    }
    voice.squealOsc.frequency.setTargetAtTime((820 + kin.speed * 4.5) * doppler, now, 0.02);
    voice.squealGain.gain.setTargetAtTime(squealLvl, now, 0.025);

    // Skid-block sparks metallic scrape & hardest braking disc squeal
    const sparking = (kin.speed > 55.2 || kin.smoothAcc < -7.0) && simTime > 3.5;
    voice.sparkGain.gain.setTargetAtTime(sparking ? 0.085 : 0.0, now, 0.02);
    voice.brakeGain.gain.setTargetAtTime(kin.smoothAcc < -10.5 ? 0.024 : 0.0, now, 0.025);
  }

  function updateAudioFrame(simTime, prevSimTime, isForwardPlaying) {
    if (!audioInitialized || !audioCtx) return;
    const now = audioCtx.currentTime;

    if (!isForwardPlaying) {
      masterGain.gain.setTargetAtTime(0.0, now, 0.012); // Fade to silence within 50ms
      return;
    }

    masterGain.gain.setTargetAtTime(0.75, now, 0.02);

    if (currentKinR && currentKinB && currentCamInfo) {
      updateCarVoiceAtTime(carAudioR, currentKinR, false, simTime, currentCamInfo, now);
      updateCarVoiceAtTime(carAudioB, currentKinB, true, simTime, currentCamInfo, now);

      // Shot 4 onboard wind roar
      onboardWindGain.gain.setTargetAtTime(currentCamInfo.isOnboard ? 0.14 : 0.0, now, 0.03);

      // Crowd swells on final straight (simTime >= 33) and roars at finish (simTime >= 36.49)
      let cLvl = 0.035;
      let cFreq = 500;
      if (simTime >= 33.0) {
        const swell = Math.min(1.0, (simTime - 33.0) / 3.49);
        cLvl = 0.035 + swell * 0.09;
        cFreq = 500 + swell * 350;
      }
      if (simTime >= 36.49) {
        cLvl = 0.20 * Math.max(0.4, 1.0 - (simTime - 36.49) * 0.12);
        cFreq = 980;
      }
      crowdGain.gain.setTargetAtTime(cLvl, now, 0.04);
      crowdFilter.frequency.setTargetAtTime(cFreq, now, 0.04);
    }

    // Trigger one-shot sounds ONLY when forward playback crosses event timestamps
    if (prevSimTime !== null && simTime > prevSimTime && (simTime - prevSimTime) < 0.5) {
      // Five start light beeps at 0.5, 1.0, 1.5, 2.0, 2.5
      const lightTimes = [0.5, 1.0, 1.5, 2.0, 2.5];
      for (let i = 0; i < lightTimes.length; i++) {
        if (prevSimTime < lightTimes[i] && simTime >= lightTimes[i]) {
          triggerStartLightBeep();
        }
      }
      // DRS open mechanical click at 33.500 and close click at 36.490
      if (prevSimTime < 33.500 && simTime >= 33.500) {
        triggerDrsClick(true);
      }
      if (prevSimTime < 36.490 && simTime >= 36.490) {
        triggerDrsClick(false);
      }
      // Grandstand camera shutter clicks after finish line
      if (simTime >= 36.490 && Math.floor(prevSimTime * 9) !== Math.floor(simTime * 9)) {
        triggerShutterClick();
      }
    }
  }

  // =========================================================================
  // 15. 5-STATE PLAYBACK STATE MACHINE & DOCK UI CONTROLS
  // =========================================================================
  const countdownEl = document.getElementById('countdown');
  const btnRefire = document.getElementById('btn-refire');
  const btnToggle = document.getElementById('btn-toggle');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const scrubber = document.getElementById('scrubber');
  const speedPills = Array.from(document.querySelectorAll('.speed-pill'));

  const STATE_COUNTDOWN = 'COUNTDOWN';
  const STATE_PLAYING = 'PLAYING';
  const STATE_PAUSED = 'PAUSED';
  const STATE_REFIRE_HOLD = 'REFIRE_HOLD';
  const STATE_ENDED = 'ENDED';

  let playbackState = STATE_COUNTDOWN;
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.000;
  let holdElapsed = 0.000;
  let lastWallTime = null;
  let isScrubbing = false;

  function setToggleIcon(showPause) {
    if (showPause) {
      iconPause.style.display = '';
      iconPlay.style.display = 'none';
      btnToggle.setAttribute('aria-label', 'Pause');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = '';
      btnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }

  // Render initial resting scene (simTime = 0.000) immediately at startup
  renderAt(0.000);

  // Play / Pause Toggle (#btn-toggle)
  btnToggle.addEventListener('click', () => {
    resumeAudioOnGesture();
    if (playbackState === STATE_PLAYING) {
      playbackState = STATE_PAUSED;
      setToggleIcon(false);
      stopAllOneShots();
      updateAudioFrame(simTime, null, false);
    } else if (playbackState === STATE_COUNTDOWN || playbackState === STATE_REFIRE_HOLD) {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0';
      playbackState = STATE_PAUSED;
      setToggleIcon(false);
      stopAllOneShots();
      renderAt(0.000);
      updateAudioFrame(simTime, null, false);
    } else if (playbackState === STATE_PAUSED) {
      playbackState = STATE_PLAYING;
      setToggleIcon(true);
    } else if (playbackState === STATE_ENDED) {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0.000';
      playbackState = STATE_PLAYING;
      setToggleIcon(true);
      renderAt(0.000);
    }
  });

  // Silent Re-Fire (#btn-refire -> REFIRE_HOLD State)
  btnRefire.addEventListener('click', () => {
    resumeAudioOnGesture();
    stopAllOneShots();
    hideCountdown();
    simTime = 0.000;
    scrubber.value = '0';
    holdElapsed = 0.000;
    playbackState = STATE_REFIRE_HOLD;
    setToggleIcon(true);
    renderAt(0.000);
    updateAudioFrame(0.000, null, false);
  });

  // Speed Selector Pills (.speed-pill)
  speedPills.forEach(pill => {
    pill.addEventListener('click', () => {
      resumeAudioOnGesture();
      const spd = parseFloat(pill.getAttribute('data-speed'));
      if (!isNaN(spd)) {
        playbackSpeed = spd;
      }
      speedPills.forEach(p => {
        const active = (p === pill);
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  // Scrubbing Slider (#scrubber)
  scrubber.addEventListener('pointerdown', () => {
    isScrubbing = true;
    stopAllOneShots();
    updateAudioFrame(simTime, null, false);
  });
  window.addEventListener('pointerup', () => {
    isScrubbing = false;
  });

  scrubber.addEventListener('input', () => {
    hideCountdown();
    stopAllOneShots();
    simTime = Math.max(0, Math.min(DURATION, parseFloat(scrubber.value) || 0));
    playbackState = STATE_PAUSED;
    setToggleIcon(false);
    renderAt(simTime);
    updateAudioFrame(simTime, null, false);
  });

  // Window Resize Handler
  window.addEventListener('resize', () => {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
    renderAt(simTime);
  });

  // Main Animation Loop
  function onAnimationFrame(nowMs) {
    requestAnimationFrame(onAnimationFrame);

    if (lastWallTime === null) {
      // First RAF callback after initial resting scene rendered: start COUNTDOWN at countdownElapsed = 0
      lastWallTime = nowMs;
      countdownElapsed = 0.000;
      return;
    }

    const rawDt = Math.max(0, (nowMs - lastWallTime) * 0.001);
    lastWallTime = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (playbackState === STATE_COUNTDOWN) {
      countdownElapsed += dt;
      if (countdownElapsed < 3.000) {
        countdownEl.style.display = 'block';
        if (countdownElapsed < 1.000) {
          countdownEl.textContent = '3';
        } else if (countdownElapsed < 2.000) {
          countdownEl.textContent = '2';
        } else {
          countdownEl.textContent = '1';
        }
        simTime = 0.000;
        scrubber.value = '0';
        updateAudioFrame(0.000, null, false);
      } else {
        hideCountdown();
        playbackState = STATE_PLAYING;
        setToggleIcon(true);
        const prevT = 0.000;
        const overDt = Math.min(0.1, countdownElapsed - 3.000);
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        updateAudioFrame(simTime, prevT, !isScrubbing);
      }
    } else if (playbackState === STATE_REFIRE_HOLD) {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        playbackState = STATE_PLAYING;
        setToggleIcon(true);
        const prevT = 0.000;
        const overDt = Math.min(0.1, holdElapsed - 1.000);
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        updateAudioFrame(simTime, prevT, !isScrubbing);
      } else {
        updateAudioFrame(0.000, null, false);
      }
    } else if (playbackState === STATE_PLAYING) {
      const prevSimTime = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAt(DURATION);
        playbackState = STATE_ENDED;
        setToggleIcon(false);
        stopAllOneShots();
        updateAudioFrame(DURATION, null, false);
      } else {
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        updateAudioFrame(simTime, prevSimTime, !isScrubbing);
      }
    } else {
      // PAUSED or ENDED
      updateAudioFrame(simTime, null, false);
    }
  }

  requestAnimationFrame(onAnimationFrame);
})();
</script>
</body>
</html>
