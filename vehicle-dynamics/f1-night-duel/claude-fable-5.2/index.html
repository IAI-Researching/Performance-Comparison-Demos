<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* ==========================================================================
   F1 NIGHT DUEL — deterministic, analytic (pure function of simTime) replay
   ========================================================================== */
const DURATION = 40;
const SEED = 42;
const TAU = Math.PI * 2;

/* ---------- seeded PRNG (Mulberry32, seed 42): the only source of randomness in the simulation ---------- */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
/* static table of seeded randoms: particles index into it, so every particle
   state is a closed-form function of (index, simTime) */
const RT_N = 65536;
const RT = new Float32Array(RT_N);
for (let i = 0; i < RT_N; i++) RT[i] = rand();
function rnd(i, k) { return RT[(Math.imul(i, 2654435761) + Math.imul(k, 40503) + k * 7919) & 65535]; }
function rr(a, b) { return a + (b - a) * rand(); }

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
/* r128 has no colour management: author colours as sRGB hex, hand the renderer linear values */
const sC = (hex) => new THREE.Color(hex).convertSRGBToLinear();
const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = sat((x - a) / (b - a)); return t * t * (3 - 2 * t); };

/* ---------- circuit centreline ---------- */
const TRACK_PTS = [[0, 0, 0], [200, 0, 0], [320, 5, 60], [340, 12, 180], [260, 20, 260], [120, 15, 240],
  [60, 8, 320], [-80, 4, 340], [-200, 0, 260], [-240, 0, 120], [-160, 0, 40], [-80, 0, 0]];
const trackCurve = new THREE.CatmullRomCurve3(TRACK_PTS.map((p) => new THREE.Vector3(p[0], p[1], p[2])), true, 'centripetal');

const NS = 8192;                       // uniform arc-length samples
let LAP = 0;                           // lap length (≈1551.65 m)
const TPX = new Float64Array(NS + 1), TPY = new Float64Array(NS + 1), TPZ = new Float64Array(NS + 1);
const TTX = new Float64Array(NS + 1), TTY = new Float64Array(NS + 1), TTZ = new Float64Array(NS + 1);
const TKA = new Float64Array(NS + 1);  // smoothed signed plan curvature (+ = right-hander)
(function buildTrackTable() {
  const NU = 24000, cum = new Float64Array(NU + 1), v = new THREE.Vector3(), p = new THREE.Vector3();
  trackCurve.getPoint(0, p);
  for (let i = 1; i <= NU; i++) { trackCurve.getPoint(i / NU, v); cum[i] = cum[i - 1] + v.distanceTo(p); p.copy(v); }
  LAP = cum[NU];
  let j = 0;
  const a = new THREE.Vector3(), b = new THREE.Vector3();
  for (let i = 0; i <= NS; i++) {
    const s = (i % NS) * LAP / NS;
    while (j < NU - 1 && cum[j + 1] < s) j++;
    if (i === NS) j = 0;
    const f = (s - cum[j]) / Math.max(1e-9, cum[j + 1] - cum[j]);
    const u = (j + f) / NU;
    trackCurve.getPoint(u, v);
    TPX[i] = v.x; TPY[i] = v.y; TPZ[i] = v.z;
    const du = 0.25 / NU;
    trackCurve.getPoint(u - du < 0 ? u - du + 1 : u - du, a);
    trackCurve.getPoint(u + du > 1 ? u + du - 1 : u + du, b);
    b.sub(a).normalize();
    TTX[i] = b.x; TTY[i] = b.y; TTZ[i] = b.z;
  }
  const raw = new Float64Array(NS), ds = LAP / NS;
  for (let i = 0; i < NS; i++) {
    const k = (i + 1) % NS;
    const cr = TTX[i] * TTZ[k] - TTZ[i] * TTX[k];
    raw[i] = Math.asin(clamp(cr, -1, 1)) / ds;
  }
  const W = 40;                         // ±7.5 m box smoothing, applied twice
  let tmp = new Float64Array(NS);
  for (let pass = 0; pass < 2; pass++) {
    const src = pass === 0 ? raw : tmp.slice();
    for (let i = 0; i < NS; i++) { let acc = 0; for (let q = -W; q <= W; q++) acc += src[(i + q + NS) % NS]; tmp[i] = acc / (2 * W + 1); }
  }
  for (let i = 0; i <= NS; i++) TKA[i] = tmp[i % NS];
})();

/* C(s), T(s), n(s): position, unit tangent, right-hand normal n = normalize(T × (0,1,0)) */
function trackAt(s, o) {
  let f = s / LAP; f -= Math.floor(f); f *= NS;
  let i = Math.floor(f); if (i >= NS) i = NS - 1;
  const a = f - i, j = i + 1;
  o.x = TPX[i] + (TPX[j] - TPX[i]) * a; o.y = TPY[i] + (TPY[j] - TPY[i]) * a; o.z = TPZ[i] + (TPZ[j] - TPZ[i]) * a;
  let tx = TTX[i] + (TTX[j] - TTX[i]) * a, ty = TTY[i] + (TTY[j] - TTY[i]) * a, tz = TTZ[i] + (TTZ[j] - TTZ[i]) * a;
  const il = 1 / Math.sqrt(tx * tx + ty * ty + tz * tz);
  tx *= il; ty *= il; tz *= il;
  o.tx = tx; o.ty = ty; o.tz = tz;
  const nl = 1 / Math.sqrt(tx * tx + tz * tz);
  o.nx = -tz * nl; o.nz = tx * nl;
  o.k = TKA[i] + (TKA[j] - TKA[i]) * a;
  return o;
}
function mkT() { return { x: 0, y: 0, z: 0, tx: 1, ty: 0, tz: 0, nx: 0, nz: 1, k: 0 }; }
const _tk = mkT();
/* world point C(s) + d·n(s) + (0,h,0) */
function trackPoint(s, d, h, out) {
  trackAt(s, _tk);
  return out.set(_tk.x + _tk.nx * d, _tk.y + h, _tk.z + _tk.nz * d);
}

/* ---------- standardized car motion: checkpoint table + PCHIP ---------- */
/* rows: simTime (index), sR, dR, sB, dB */
const CHECK = [
  [-8.0, -2.50, -16.0, 2.50], [-8.0, -2.50, -16.0, 2.50], [-8.0, -2.50, -16.0, 2.50], [-8.0, -2.50, -16.0, 2.50],
  [-2.3, -2.31, -11.5, 2.36], [14.8, -1.46, 3.1, 1.65], [42.8, -0.47, 29.8, 0.76], [81.1, 0.00, 68.2, 0.10],
  [128.9, 0, 115.9, 0], [185.1, 0, 172.2, 0], [248.1, 0, 235.3, 0], [310.5, 0, 297.8, 0],
  [354.6, 0, 342.1, 0], [403.8, 0, 391.4, 0], [456.5, 0, 444.4, 0], [500.6, 0, 488.6, 0],
  [553.0, 0, 541.2, 0], [590.7, 0, 579.2, 0], [627.7, 0, 616.4, 0], [674.3, 0, 663.2, 0],
  [716.6, 0, 705.7, 0], [744.7, 0, 734.0, 0], [782.0, 0, 771.5, 0], [821.0, 0, 810.8, 0],
  [855.1, 0, 845.1, 0], [899.0, 0, 889.1, 0], [951.7, 0, 942.1, 0], [1007.7, 0, 998.2, 0],
  [1069.6, 0, 1060.3, 0], [1131.7, 0, 1122.5, 0], [1194.2, 0, 1185.1, 0], [1252.2, 0, 1243.1, 0],
  [1289.7, 0, 1280.7, 0], [1333.9, 0, 1324.9, 0], [1387.1, -0.87, 1380.4, 1.62], [1447.7, -1.20, 1446.1, 3.40],
  [1514.0, -1.20, 1516.7, 3.40], [1583.6, -1.20, 1587.1, 3.40], [1649.5, -1.20, 1653.4, 3.40],
  [1710.4, -1.20, 1714.9, 3.40], [1766.3, -1.20, 1771.1, 3.40]
];
function pchipSlopes(y) {
  const n = y.length, d = [], m = new Float64Array(n);
  for (let k = 0; k < n - 1; k++) d.push(y[k + 1] - y[k]);
  const end = (d0, d1) => {
    let s = (3 * d0 - d1) / 2;
    if (s * d0 <= 0) s = 0; else if (d0 * d1 <= 0 && Math.abs(s) > 3 * Math.abs(d0)) s = 3 * d0;
    return s;
  };
  m[0] = end(d[0], d[1]); m[n - 1] = end(d[n - 2], d[n - 3]);
  for (let k = 1; k < n - 1; k++) m[k] = d[k - 1] * d[k] <= 0 ? 0 : 2 * d[k - 1] * d[k] / (d[k - 1] + d[k]);
  return m;
}
function mkCol(c) { const y = Float64Array.from(CHECK.map((r) => r[c])); return { y: y, m: pchipSlopes(y) }; }
const COLS = [[mkCol(0), mkCol(1)], [mkCol(2), mkCol(3)]];   // [car][s|d]   car 0 = red #7, car 1 = blue #23
const _pe = [0, 0, 0];
function pchip(col, t, o) {            // o = [value, d/dt, d2/dt2]
  const n = col.y.length;
  if (t <= 0) { o[0] = col.y[0]; o[1] = col.m[0]; o[2] = 0; return o; }
  if (t >= n - 1) { o[0] = col.y[n - 1]; o[1] = col.m[n - 1]; o[2] = 0; return o; }
  const k = Math.floor(t), u = t - k, u2 = u * u, u3 = u2 * u;
  const y0 = col.y[k], y1 = col.y[k + 1], m0 = col.m[k], m1 = col.m[k + 1];
  o[0] = (2 * u3 - 3 * u2 + 1) * y0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * y1 + (u3 - u2) * m1;
  o[1] = (6 * u2 - 6 * u) * (y0 - y1) + (3 * u2 - 4 * u + 1) * m0 + (3 * u2 - 2 * u) * m1;
  o[2] = (12 * u - 6) * (y0 - y1) + (6 * u - 4) * m0 + (6 * u - 2) * m1;
  return o;
}
const carS = (c, t) => pchip(COLS[c][0], t, _pe)[0];
const carV = (c, t) => pchip(COLS[c][0], t, _pe)[1];
const carD = (c, t) => pchip(COLS[c][1], t, _pe)[0];
const carDV = (c, t) => pchip(COLS[c][1], t, _pe)[1];
/* longitudinal acceleration, box-filtered over 0.2 s so pitch / glow / sound do not snap at the spline knots */
const carA = (c, t) => (carV(c, t + 0.1) - carV(c, t - 0.1)) / 0.2;

/* event times derived from the table */
function solveS(c, target, t0, t1) { for (let i = 0; i < 50; i++) { const tm = (t0 + t1) / 2; if (carS(c, tm) < target) t0 = tm; else t1 = tm; } return (t0 + t1) / 2; }
const T_LIGHTS_OUT = 3.0;
const T_DRS_OPEN = 33.5;
let T_FINISH_B = 36.49, T_FINISH_R = 36.54;

/* ---------- car pose (pure function of simTime) ---------- */
const WHEEL_R = 0.36, WHEELBASE = 3.6;
const _kt = mkT();
function carFrame(c, t, o) {
  /* position, forward F (direction of travel, pitched to gradient), right R (horizontal), up U */
  const s = carS(c, t), v = carV(c, t), d = carD(c, t), dv = carDV(c, t);
  trackAt(s, _kt);
  o.s = s; o.v = v; o.d = d;
  o.px = _kt.x + _kt.nx * d; o.py = _kt.y; o.pz = _kt.z + _kt.nz * d;
  const w = v + 0.5;
  let fx = _kt.tx * w + _kt.nx * dv, fy = _kt.ty * w, fz = _kt.tz * w + _kt.nz * dv;
  const il = 1 / Math.sqrt(fx * fx + fy * fy + fz * fz); fx *= il; fy *= il; fz *= il;
  const rl = 1 / Math.sqrt(fx * fx + fz * fz);
  o.fx = fx; o.fy = fy; o.fz = fz;
  o.rx = -fz * rl; o.ry = 0; o.rz = fx * rl;
  o.ux = o.ry * fz - o.rz * fy; o.uy = o.rz * fx - o.rx * fz; o.uz = o.rx * fy - o.ry * fx;
  o.k = _kt.k; o.psi = Math.atan2(fz, fx);
  return o;
}
function mkFrame() { return { s: 0, v: 0, d: 0, px: 0, py: 0, pz: 0, fx: 1, fy: 0, fz: 0, rx: 0, ry: 0, rz: 1, ux: 0, uy: 1, uz: 0, k: 0, psi: 0 }; }
const _fa = mkFrame(), _fb = mkFrame();
function yawRate(c, t) {
  const h = 0.06;
  const a = carFrame(c, t - h, _fa).psi, b = carFrame(c, t + h, _fb).psi;
  let dpsi = b - a; if (dpsi > Math.PI) dpsi -= TAU; if (dpsi < -Math.PI) dpsi += TAU;
  return dpsi / (2 * h);
}
/* rear wheelspin during the launch: extra rear-wheel angular speed (rad/s) and its closed-form integral */
const SPIN_A = [26, 36];               // the blue car lights up its rears more and gets the slower start
function spinRate(c, t) { if (t <= 3 || t >= 5) return 0; const x = t - 3; const q = Math.sin(Math.PI * x / 2); return SPIN_A[c] * q * q * (1 - 0.25 * x); }
function spinAngle(c, t) {             // ∫ spinRate
  const x = clamp(t - 3, 0, 2), A = SPIN_A[c], P = Math.PI;
  const I1 = x / 2 - Math.sin(P * x) / (2 * P);
  const I2 = x * x / 4 - (x * Math.sin(P * x) / (2 * P) + (Math.cos(P * x) - 1) / (2 * P * P));
  return A * (I1 - 0.25 * I2);
}

/* ---------- 1/240 s precomputed tables (brake temperature, gearbox, emission states) ---------- */
const HZ = 240, NTAB = DURATION * HZ + 1;
const TAB = [0, 1].map(() => ({
  px: new Float32Array(NTAB), py: new Float32Array(NTAB), pz: new Float32Array(NTAB),
  fx: new Float32Array(NTAB), fy: new Float32Array(NTAB), fz: new Float32Array(NTAB),
  rx: new Float32Array(NTAB), rz: new Float32Array(NTAB), s: new Float32Array(NTAB),
  v: new Float32Array(NTAB), a: new Float32Array(NTAB), brake: new Float32Array(NTAB),
  alat: new Float32Array(NTAB), spark: new Float32Array(NTAB),
  gear: new Uint8Array(NTAB), shiftT: new Float32Array(NTAB), shiftDir: new Int8Array(NTAB)
}));
const GEAR_VMAX = [14.5, 21.5, 29, 36.5, 44.5, 53.5, 63.5, 78];
(function buildTables() {
  T_FINISH_B = solveS(1, LAP, 35, 38); T_FINISH_R = solveS(0, LAP, 35, 38);
  const f = mkFrame();
  for (let c = 0; c < 2; c++) {
    const T = TAB[c]; let brake = 0, gear = 1, shiftT = -10, shiftDir = 0;
    for (let i = 0; i < NTAB; i++) {
      const t = i / HZ;
      carFrame(c, t, f);
      T.px[i] = f.px; T.py[i] = f.py; T.pz[i] = f.pz; T.fx[i] = f.fx; T.fy[i] = f.fy; T.fz[i] = f.fz; T.rx[i] = f.rx; T.rz[i] = f.rz;
      const v = f.v, a = carA(c, t);
      T.v[i] = v; T.a[i] = a; T.s[i] = f.s;
      T.alat[i] = v * yawRate(c, t);
      /* brake disc temperature 0..1: heats in proportion to deceleration, cools exponentially */
      const target = sat((-a - 1.5) / 30) * (0.35 + 0.65 * sat(v / 30));
      const tau = target > brake ? 0.10 : 0.85;
      brake += (target - brake) * (1 - Math.exp(-1 / (HZ * tau)));
      T.brake[i] = brake;
      /* skid-block sparks: above 200 km/h (55.56 m/s) or braking hard */
      T.spark[i] = Math.max(sstep(54.6, 57.2, v), sstep(20, 30, -a) * sat(v / 25));
      /* audio-only 8-speed gearbox with hysteresis */

  EVENTS.sort((a, b) => a.t - b.t);

  /* --- engine model: audio-only 8-speed gearbox (precomputed at 1/240 s), launch revs, shift dips / blips --- */
  function engineState(c, t, o) {
    const T = TAB[c], j = tabIdx(t), v = carV(c, t), a = tabLerp(T.a, t), g = T.gear[j], ds = t - T.shiftT[j], dir = T.shiftDir[j];
    const vw = v + spinRate(c, t) * WHEEL_R * 0.9;
    let rpm = 11800 * vw / GEAR_VMAX[g - 1], dip = 1;
    if (ds >= 0 && ds < 0.35) {
      if (dir > 0) { rpm = lerp(11800 * vw / GEAR_VMAX[g - 2], rpm, sstep(0, 0.07, ds)); dip = 1 - 0.6 * Math.exp(-ds / 0.05); }
      else if (dir < 0) { rpm = lerp(11800 * vw / GEAR_VMAX[g], rpm, sstep(0, 0.05, ds)) * (1 + 0.08 * Math.exp(-ds / 0.09)); dip = 1 + 0.3 * Math.exp(-ds / 0.09); }
    }
    let hold = 4950 + 170 * Math.sin(t * 21 + c * 2.1) + 90 * Math.sin(t * 34.7 + c);
    if (t >= 2.5) hold = lerp(hold, 10400 + 260 * Math.sin(t * 58 + c), sstep(2.5, 2.93, t));
    if (t >= 3.0) hold = lerp(10400, 4900, sstep(3.0, 4.7, t));
    o.rpm = clamp(Math.max(rpm, hold), 4800, 12200);
    o.thr = t < 3 ? (t < 2.5 ? 0.14 : lerp(0.14, 0.9, sstep(2.5, 2.9, t))) : sstep(-3, 4, a);
    o.dip = dip; o.v = v; o.a = a; o.alat = tabLerp(T.alat, t);
    o.spin = spinRate(c, t) / SPIN_A[c]; o.spark = tabLerp(T.spark, t) * (rnd(Math.floor(t * 8), 41 + c) > 0.42 ? 1 : 0.2);
    return o;
  }
  const _es = {};
  A.frame = function (prevT, t, playing) {
    if (!ctx) return;
    const now = ctx.currentTime;
    if (playing !== A.playing) {
      A.playing = playing;
      master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now);
      master.gain.linearRampToValueAtTime(playing ? 1 : 0, now + (playing ? 0.03 : 0.04));
      if (!playing) { live.forEach((n) => { try { n.stop(now + 0.04); } catch (e) {} }); }
    }
    if (!playing) return;
    /* one-shots crossed by forward playback */
    if (t > prevT && t - prevT < 0.5) for (let i = 0; i < EVENTS.length; i++) { const e = EVENTS[i]; if (e.t > prevT && e.t <= t) e.f(); else if (e.t > t) break; }
    /* listener = active camera (jumps on every cut) */
    const L = ctx.listener, cp = camera.position, onboard = camShot === 3, moving = camShot === 1 || camShot === 3;
    camera.getWorldDirection(_cv);
    if (L.positionX) {
      L.positionX.setValueAtTime(cp.x, now); L.positionY.setValueAtTime(cp.y, now); L.positionZ.setValueAtTime(cp.z, now);
      L.forwardX.setValueAtTime(_cv.x, now); L.forwardY.setValueAtTime(_cv.y, now); L.forwardZ.setValueAtTime(_cv.z, now);
      L.upX.setValueAtTime(camera.up.x, now); L.upY.setValueAtTime(camera.up.y, now); L.upZ.setValueAtTime(camera.up.z, now);
    } else { L.setPosition(cp.x, cp.y, cp.z); L.setOrientation(_cv.x, _cv.y, _cv.z, camera.up.x, camera.up.y, camera.up.z); }
    const B = CS[1].f, lvx = moving ? B.fx * B.v : 0, lvy = moving ? B.fy * B.v : 0, lvz = moving ? B.fz * B.v : 0;
    for (let c = 0; c < 2; c++) {
      const E = ENG[c], f = CS[c].f, s = engineState(c, t, _es);
      const px = f.px - f.fx * 0.6, py = f.py + 0.5, pz = f.pz - f.fz * 0.6;
      setPos(E.pan, px, py, pz, now);
      /* Doppler from the car's velocity relative to the camera */
      let rx = px - cp.x, ry = py - cp.y, rz = pz - cp.z; const rl = Math.max(0.5, Math.sqrt(rx * rx + ry * ry + rz * rz)); rx /= rl; ry /= rl; rz /= rl;
      const vs = (f.fx * rx + f.fy * ry + f.fz * rz) * f.v, vl = lvx * rx + lvy * ry + lvz * rz;
      const dop = clamp((343 + vl) / (343 + vs), 0.62, 1.6);
      const rn = sat((s.rpm - 4800) / 7400), f0 = s.rpm / 60 * 3 * dop * (c ? 0.965 : 1.0);
      for (let k = 0; k < E.oscs.length; k++) set(E.oscs[k].o.frequency, f0 * E.oscs[k].m, now, 0.012);
      set(E.lp.frequency, (650 + 900 * rn + 5200 * s.thr * (0.35 + 0.65 * rn)) * (c ? 0.9 : 1.1), now);
      const eg = (0.16 + 0.42 * s.thr + 0.14 * rn) * s.dip;
      set(E.eg.gain, eg, now, 0.012);
      set(E.lfo.frequency, s.rpm / 60 / (c ? 9 : 8), now); set(E.lfoG.gain, eg * 0.55 * (1 - sstep(5300, 7600, s.rpm)), now);
      set(E.raspF.frequency, clamp(f0 * 2.4, 200, 6000), now); set(E.raspG.gain, 0.05 + 0.2 * s.thr, now);
      set(E.wh.frequency, (2500 + 6300 * rn) * dop, now); set(E.whG.gain, 0.016 * rn * rn * (0.25 + 0.75 * s.thr), now);
      const sp = sat(s.v / 70);
      set(E.hissG.gain, 0.085 * Math.pow(sp, 1.4), now); set(E.hissF.frequency, 2400 + 2600 * sp, now);
      const bc = Math.max(sstep(20, 38, -s.a), sstep(24, 40, Math.abs(s.alat))) * sat(s.v / 15), ws = t > 3 && t < 5 ? s.spin : 0;
      set(E.sqF.frequency, (ws > bc * 0.6 ? 2250 + 260 * Math.sin(t * 9 + c) : 1120 + 90 * Math.sin(t * 6.3 + c)) * dop, now);
      set(E.sqG.gain, 0.2 * ws + 0.085 * bc, now);
      set(E.crG.gain, 0.3 * s.spark, now);
      set(E.bs.frequency, (c ? 2950 : 3150) * dop * (1 + 0.01 * Math.sin(t * 40)), now); set(E.bsG.gain, 0.02 * sstep(30, 41, -s.a) * sat(s.v / 20), now);
      const cab = c === 1 && onboard;
      set(E.cab.frequency, cab ? 1500 : 20000, now, 0.01); set(E.out.gain, cab ? 1.55 : 1.0, now);
      if (c === 1) { const w = onboard ? sat(s.v / 70) : 0; set(windG.gain, 0.3 * w * w, now); set(windF.frequency, 380 + 500 * w, now); }
    }
    /* crowd: murmur → swell on the final straight → roar at the finish */
    const swell = sstep(33, 36.2, t), fin = t >= T_FINISH_B ? Math.min(1, (t - T_FINISH_B) / 0.35) * (1 - 0.45 * sstep(T_FINISH_B + 1.5, 40, t)) : 0;
    set(crowdG.gain, 0.28 + 0.5 * swell + 0.45 * fin, now, 0.05); set(roarG.gain, 0.05 * swell + 0.42 * fin, now, 0.05);
  };
  A.ok = true;
  return A;
})();

/* ==========================================================================
   Timeline state machine + dock controls
   ========================================================================== */
const elCountdown = document.getElementById('countdown');
const elScrubber = document.getElementById('scrubber');
const elToggle = document.getElementById('btn-toggle');
const elRefire = document.getElementById('btn-refire');
const elIconPause = document.getElementById('icon-pause');
const elIconPlay = document.getElementById('icon-play');
const elPills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

let state = 'COUNTDOWN';            // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
let simTime = 0;
let playbackSpeed = 1.0;
let countdownElapsed = 0;
let holdElapsed = 0;
let lastTs = null;
let needsRender = false;

function hideCountdown() { elCountdown.style.display = 'none'; elCountdown.textContent = ''; }
function showCountdown(txt) { if (elCountdown.textContent !== txt) elCountdown.textContent = txt; if (elCountdown.style.display !== 'block') elCountdown.style.display = 'block'; }
function setToggleIcon(showPause) {
  elIconPause.style.display = showPause ? 'block' : 'none';
  elIconPlay.style.display = showPause ? 'none' : 'block';
  elToggle.setAttribute('aria-label', showPause ? 'Pause' : 'Play');
}

function tick(ts) {
  requestAnimationFrame(tick);
  const rawDt = lastTs === null ? 0 : (ts - lastTs) / 1000;
  lastTs = ts;
  const dt = Math.min(Math.max(rawDt, 0), 0.1);
  const prev = simTime;
  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3.0) { hideCountdown(); state = 'PLAYING'; }
    else showCountdown(countdownElapsed < 1.0 ? '3' : countdownElapsed < 2.0 ? '2' : '1');
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1.0) state = 'PLAYING';
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    elScrubber.value = simTime.toFixed(3);
    renderAt(simTime);
    needsRender = false;
    if (simTime >= DURATION) {
      simTime = DURATION;
      elScrubber.value = DURATION.toFixed(3);
      state = 'ENDED';
      setToggleIcon(false);
    }
  }
  if (needsRender) { needsRender = false; renderAt(simTime); }
  AUDIO.frame && AUDIO.frame(prev, simTime, state === 'PLAYING');
}

elToggle.addEventListener('click', function () {
  if (state === 'PLAYING') { state = 'PAUSED'; setToggleIcon(false); }
  else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') { hideCountdown(); simTime = 0; state = 'PAUSED'; setToggleIcon(false); }
  else if (state === 'PAUSED') { state = 'PLAYING'; setToggleIcon(true); }
  else if (state === 'ENDED') { hideCountdown(); simTime = 0; elScrubber.value = '0'; state = 'PLAYING'; setToggleIcon(true); renderAt(0); }
});

elPills.forEach(function (pill) {
  pill.addEventListener('click', function () {
    playbackSpeed = parseFloat(pill.getAttribute('data-speed'));
    elPills.forEach(function (p) { const on = p === pill; p.classList.toggle('is-active', on); p.setAttribute('aria-checked', on ? 'true' : 'false'); });
  });
});

elScrubber.addEventListener('input', function () {
  hideCountdown();
  const v = parseFloat(elScrubber.value);
  simTime = clamp(isFinite(v) ? v : 0, 0, DURATION);
  state = 'PAUSED';
  setToggleIcon(false);
  renderAt(simTime);
  needsRender = false;
});

elRefire.addEventListener('click', function () {
  hideCountdown();
  simTime = 0;
  elScrubber.value = '0';
  renderAt(0);
  needsRender = false;
  setToggleIcon(true);
  holdElapsed = 0;
  countdownElapsed = 0;
  state = 'REFIRE_HOLD';
});

window.addEventListener('resize', function () {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
  camera.updateProjectionMatrix();
  starsMat.uniforms.uPR.value = renderer.getPixelRatio();
  needsRender = true;
  if (state !== 'PLAYING') renderAt(simTime);
});

/* initial resting scene (simTime = 0), then the countdown starts on the first animation frame after it */
renderAt(0);
requestAnimationFrame(function (ts) {
  lastTs = ts;
  countdownElapsed = 0;
  state = 'COUNTDOWN';
  showCountdown('3');
  requestAnimationFrame(tick);
});
</script>
</body>
