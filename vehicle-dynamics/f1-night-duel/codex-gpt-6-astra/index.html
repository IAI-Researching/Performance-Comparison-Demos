<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// Everything below is generated locally. World and effects use seed 42; audio
// has an independent stream. Rendering has no accumulated simulation state.
const DURATION = 40;
function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(42);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const smooth = (a,b,x) => { const u=clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const UP = V(0,1,0);
const linearColor = c => new THREE.Color(c).convertSRGBToLinear();

const checkpoints = [
 [-8,-2.50,-16,2.50],[-8,-2.50,-16,2.50],[-8,-2.50,-16,2.50],[-8,-2.50,-16,2.50],
 [-2.3,-2.31,-11.5,2.36],[14.8,-1.46,3.1,1.65],[42.8,-.47,29.8,.76],[81.1,0,68.2,.10],
 [128.9,0,115.9,0],[185.1,0,172.2,0],[248.1,0,235.3,0],[310.5,0,297.8,0],
 [354.6,0,342.1,0],[403.8,0,391.4,0],[456.5,0,444.4,0],[500.6,0,488.6,0],
 [553,0,541.2,0],[590.7,0,579.2,0],[627.7,0,616.4,0],[674.3,0,663.2,0],
 [716.6,0,705.7,0],[744.7,0,734,0],[782,0,771.5,0],[821,0,810.8,0],
 [855.1,0,845.1,0],[899,0,889.1,0],[951.7,0,942.1,0],[1007.7,0,998.2,0],
 [1069.6,0,1060.3,0],[1131.7,0,1122.5,0],[1194.2,0,1185.1,0],[1252.2,0,1243.1,0],
 [1289.7,0,1280.7,0],[1333.9,0,1324.9,0],[1387.1,-.87,1380.4,1.62],
 [1447.7,-1.2,1446.1,3.4],[1514,-1.2,1516.7,3.4],[1583.6,-1.2,1587.1,3.4],
 [1649.5,-1.2,1653.4,3.4],[1710.4,-1.2,1714.9,3.4],[1766.3,-1.2,1771.1,3.4]
];
// Uniform-knot Fritsch–Carlson/PCHIP, including shape-preserving endpoint slopes.
function pchip(values) {
  const n=values.length, delta=values.slice(1).map((v,i)=>v-values[i]), m=new Float64Array(n);
  for(let i=1;i<n-1;i++) m[i]=delta[i-1]*delta[i]>0 ? 2*delta[i-1]*delta[i]/(delta[i-1]+delta[i]) : 0;
  function endpoint(a,b) { const q=(3*a-b)/2; return q*a<=0 ? 0 : a*b<0 && Math.abs(q)>3*Math.abs(a) ? 3*a : q; }
  m[0]=endpoint(delta[0],delta[1]); m[n-1]=endpoint(delta[n-2],delta[n-3]);
  return t => {
    t=clamp(t,0,DURATION);
    const i=Math.min(n-2,Math.floor(t)), u=t-i;
    const a=2*values[i]-2*values[i+1]+m[i]+m[i+1];
    const b=-3*values[i]+3*values[i+1]-2*m[i]-m[i+1];
    return {value:((a*u+b)*u+m[i])*u+values[i], velocity:(3*a*u+2*b)*u+m[i], acceleration:6*a*u+2*b};
  };
}
const channels = [0,1,2,3].map(c=>pchip(checkpoints.map(r=>r[c])));
const points = [[0,0,0],[200,0,0],[320,5,60],[340,12,180],[260,20,260],[120,15,240],[60,8,320],[-80,4,340],[-200,0,260],[-240,0,120],[-160,0,40],[-80,0,0]].map(p=>V(...p));
const circuit = new THREE.CatmullRomCurve3(points, true, 'centripetal');
circuit.arcLengthDivisions=8192;
circuit.updateArcLengths();
const L=circuit.getLength(), FINISH=1551.65, TABLE_SIZE=8192;
const trackPositions=[], trackTangents=[];
for(let i=0;i<=TABLE_SIZE;i++) {trackPositions.push(circuit.getPointAt(i/TABLE_SIZE));trackTangents.push(circuit.getTangentAt(i/TABLE_SIZE).normalize());}
function track(s) {
  const u=((s%L)+L)%L/L*TABLE_SIZE, i=Math.floor(u), f=u-i;
  const p=trackPositions[i].clone().lerp(trackPositions[i+1],f);
  const tangent=trackTangents[i].clone().lerp(trackTangents[i+1],f).normalize();
  const normal=V(tangent.z*-1,0,tangent.x).normalize();
  const up=normal.clone().cross(tangent).normalize();
  return {p,tangent,normal,up};
}
function at(s,d=0,h=0) {const f=track(s); return f.p.addScaledVector(f.normal,d).addScaledVector(f.up,h);}
function carState(t,id) {
  const a=channels[id*2](t), b=channels[id*2+1](t), f=track(a.value);
  const before=track(a.value-1).tangent, after=track(a.value+1).tangent;
  const curvature=(after.z*before.x-after.x*before.z)/2;
  const heading=f.tangent.clone().multiplyScalar(Math.max(.001,a.velocity)).addScaledVector(f.normal,b.velocity).normalize();
  if(a.velocity<.001) heading.copy(f.tangent);
  const right=V(-heading.z,0,heading.x).normalize(), up=right.clone().cross(heading).normalize();
  return {s:a.value,d:b.value,v:a.velocity,a:a.acceleration,curvature,heading,right,up,
    p:f.p.addScaledVector(f.normal,b.value),velocity:f.tangent.clone().multiplyScalar(a.velocity).addScaledVector(f.normal,b.velocity)};
}
function crossing(id) {let a=36,b=37; for(let i=0;i<45;i++){const m=(a+b)/2; if(channels[id*2](m).value<FINISH)a=m;else b=m;}return (a+b)/2;}
const BLUE_FINISH=crossing(1), RED_FINISH=crossing(0);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.78;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#050810');
scene.fog=new THREE.FogExp2('#101724',.0033);
const camera=new THREE.PerspectiveCamera(35,window.innerWidth/window.innerHeight,.1,3000);

function canvasTexture(w,h,draw) {
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'),w,h);
  const texture=new THREE.CanvasTexture(c); texture.encoding=THREE.sRGBEncoding; texture.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return texture;
}
const glowTexture=canvasTexture(128,128,(c,w,h)=>{
  const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.08,'rgba(220,237,255,.85)');g.addColorStop(.25,'rgba(160,197,230,.22)');g.addColorStop(1,'rgba(100,160,225,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
});
const smokeTexture=canvasTexture(128,128,(c,w,h)=>{
  const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(220,230,240,.55)');g.addColorStop(.4,'rgba(200,215,230,.25)');g.addColorStop(1,'rgba(160,180,210,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
});
const carbonTexture=canvasTexture(64,64,(c)=>{
  c.fillStyle='#15171b';c.fillRect(0,0,64,64);
  for(let y=0;y<64;y+=8)for(let x=0;x<64;x+=8){c.fillStyle=(x/8+y/8)%2?'#252a2f':'#0b0e12';c.fillRect(x,y,7,7);c.strokeStyle='#34393d';c.lineWidth=.5;for(let k=1;k<7;k+=2){c.beginPath();if((x/8+y/8)%2){c.moveTo(x+k,y);c.lineTo(x+k,y+7);}else{c.moveTo(x,y+k);c.lineTo(x+7,y+k);}c.stroke();}}
});
carbonTexture.wrapS=carbonTexture.wrapT=THREE.RepeatWrapping;carbonTexture.repeat.set(5,5);
const asphaltTexture=canvasTexture(256,256,(c,w,h)=>{
  const data=c.createImageData(w,h);
  for(let i=0;i<w*h;i++){const a=85+random()*30;data.data[i*4]=a;data.data[i*4+1]=a+2;data.data[i*4+2]=a+6;data.data[i*4+3]=255;}c.putImageData(data,0,0);
  for(let i=0;i<140;i++){c.fillStyle='rgba(185,202,218,'+(random()*.12)+')';c.fillRect(random()*w,random()*h,20+random()*100,.3+random());}
});
asphaltTexture.wrapS=asphaltTexture.wrapT=THREE.RepeatWrapping;
const rubberTexture=canvasTexture(128,128,(c,w,h)=>{
  c.fillStyle='#242427';c.fillRect(0,0,w,h);for(let i=0;i<1300;i++){c.fillStyle=random()>.5?'#2c2d30':'#1c1c1f';c.fillRect(random()*w,random()*h,1,2);}for(let i=0;i<8;i++){c.strokeStyle='#303034';c.beginPath();c.arc(64,64,39+i*2,0,Math.PI*2);c.stroke();}
});

// An in-memory night studio supplies crisp rectangular reflections, without HDR assets.
const envScene=new THREE.Scene();envScene.background=new THREE.Color('#070c16');
for(let i=0;i<12;i++) {
  const a=i*Math.PI*2/12, panel=new THREE.Mesh(new THREE.PlaneGeometry(2.8,.55),new THREE.MeshBasicMaterial({color:new THREE.Color(1.5,1.8,2.2)}));
  panel.position.set(Math.cos(a)*9,3+(i%3)*2,Math.sin(a)*9);panel.lookAt(0,0,0);envScene.add(panel);
}
const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileCubemapShader();
const environment=pmrem.fromScene(envScene,.015,.1,100);scene.environment=environment.texture;pmrem.dispose();
envScene.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose();}});

const materials={
  carbon:new THREE.MeshPhysicalMaterial({color:0x62686e,map:carbonTexture,metalness:.6,roughness:.32,clearcoat:.6,envMapIntensity:.6}),
  rubber:new THREE.MeshStandardMaterial({color:0x343438,map:rubberTexture,roughness:.88,metalness:0}),
  black:new THREE.MeshStandardMaterial({color:0x020305,roughness:.64}),
  silver:new THREE.MeshStandardMaterial({color:0x9ca6b4,metalness:.85,roughness:.23}),
  darkMetal:new THREE.MeshStandardMaterial({color:0x262c35,metalness:.8,roughness:.4}),
  white:new THREE.MeshPhysicalMaterial({color:0xb9c3ce,metalness:.35,roughness:.28,clearcoat:1}),
  barrier:new THREE.MeshStandardMaterial({color:linearColor('#616b7a'),metalness:.7,roughness:.47,envMapIntensity:.25}),
  redKerb:new THREE.MeshStandardMaterial({color:linearColor('#b22b35'),roughness:.42,metalness:.15}),
  lamp:new THREE.MeshBasicMaterial({color:new THREE.Color(3.4,3.8,4.4),toneMapped:false}),
  softLamp:new THREE.MeshBasicMaterial({color:0x6d8b9f}),
  stripe:new THREE.MeshBasicMaterial({color:0xb8beb8,fog:true})
};
const unitBox=new THREE.BoxGeometry(1,1,1);
function mesh(parent,geometry,material,name) {const m=new THREE.Mesh(geometry,material);if(name)m.name=name;m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function box(parent,x,y,z,sx,sy,sz,mat,name) {const m=mesh(parent,unitBox,mat,name);m.position.set(x,y,z);m.scale.set(sx,sy,sz);return m;}
function rod(parent,a,b,r,mat,name,segments=7) {const delta=b.clone().sub(a), m=mesh(parent,new THREE.CylinderGeometry(r,r,delta.length(),segments),mat,name);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(UP,delta.normalize());return m;}
function tube(parent,path,r,mat,name) {return mesh(parent,new THREE.TubeGeometry(new THREE.CatmullRomCurve3(path),32,r,7,false),mat,name);}
function sprite(parent,p,size,opacity=.3,color=0xb6d3ff) {const m=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTexture,color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,fog:true}));m.position.copy(p);m.scale.set(size,size,1);parent.add(m);return m;}
function loft(parent,sections,mat,name,segments=16,power=1) {
  const positions=[],indices=[];
  for(const q of sections)for(let j=0;j<segments;j++){const a=j/segments*Math.PI*2,cs=Math.cos(a),sn=Math.sin(a);positions.push(q[0],q[1]+Math.sign(cs)*Math.pow(Math.abs(cs),power)*q[3],(q[4]||0)+Math.sign(sn)*Math.pow(Math.abs(sn),power)*q[2]);}
  for(let i=0;i<sections.length-1;i++)for(let j=0;j<segments;j++){const a=i*segments+j,b=i*segments+(j+1)%segments;indices.push(a,b,a+segments,b,b+segments,a+segments);}
  for(let j=1;j<segments-1;j++){indices.push(0,j+1,j);const a=(sections.length-1)*segments;indices.push(a,a+j,a+j+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();
  return mesh(parent,g,mat,name);
}

// Opaque procedural sky, with a sparse star field, moon and distant sodium glow.
const skyTexture=canvasTexture(2048,1024,(c,w,h)=>{
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#02040b');g.addColorStop(.42,'#080f1e');g.addColorStop(.53,'#18202c');g.addColorStop(.65,'#070c13');g.addColorStop(1,'#03060b');c.fillStyle=g;c.fillRect(0,0,w,h);
  const city=c.createRadialGradient(1370,535,0,1370,535,300);city.addColorStop(0,'rgba(124,72,34,.18)');city.addColorStop(1,'rgba(50,33,24,0)');c.fillStyle=city;c.fillRect(0,0,w,h);
  for(let i=0;i<650;i++){const x=random()*w,y=random()*490,r=.3+random()*.9;c.fillStyle='rgba(173,195,223,'+(.15+random()*.5)+')';c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
  const x=350,y=250,halo=c.createRadialGradient(x,y,5,x,y,70);halo.addColorStop(0,'rgba(166,191,218,.12)');halo.addColorStop(1,'rgba(166,191,218,0)');c.fillStyle=halo;c.fillRect(x-70,y-70,140,140);
  c.fillStyle='#a2afbe';c.beginPath();c.arc(x,y,10,0,Math.PI*2);c.fill();for(let i=0;i<22;i++){const a=random()*Math.PI*2,r=random()*8;c.fillStyle='rgba(42,55,74,.2)';c.beginPath();c.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,.3+random()*2,0,Math.PI*2);c.fill();}
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(2200,48,24),new THREE.MeshBasicMaterial({map:skyTexture,side:THREE.BackSide,depthWrite:false,fog:false,toneMapped:false}));sky.rotation.y=-.5;scene.add(sky);
scene.add(new THREE.AmbientLight(0x7187a8,.08));
const moon=new THREE.DirectionalLight(0x587ba9,.10);moon.position.set(-100,170,-120);scene.add(moon);

// Road ribbons share the exact arc-length frame. Light pools are part of the
// surface shader, leaving genuinely dark asphalt between the 72 m mast spacing.
const MAST_COUNT=Math.round(L/72), MAST_STEP=L/MAST_COUNT;
const roadMaterial=new THREE.MeshStandardMaterial({color:linearColor('#343b44'),map:asphaltTexture,roughness:.23,metalness:.35,envMapIntensity:.10});
roadMaterial.onBeforeCompile=shader=>{

    const harmonics=[];
    for(let j=0;j<4;j++){
      const osc=ctx.createOscillator(),g=gain((id===0?[.28,.12,.075,.035]:[.24,.16,.04,.06])[j]);osc.type=j===0?'sawtooth':'sine';osc.frequency.value=260*(j+1);osc.connect(g);g.connect(engine);osc.start();harmonics.push({osc,g});
    }
    const turbo=ctx.createOscillator(),turboGain=gain();turbo.type='sine';turbo.frequency.value=2100;turbo.connect(turboGain);turboGain.connect(lowpass);turbo.start();
    const exhaust=noise(lowpass,'bandpass',1000),wet=noise(pan,'highpass',2200),squeal=noise(pan,'bandpass',1550),scrape=noise(pan,'highpass',3500),wind=noise(lowpass,'lowpass',700);
    const brake=ctx.createOscillator(),brakeGain=gain();brake.type='sine';brake.frequency.value=3700;brake.connect(brakeGain);brakeGain.connect(pan);brake.start();
    return {pan,engine,lowpass,harmonics,turbo,turboGain,exhaust,wet,squeal,scrape,wind,brake,brakeGain};
  });
  const crowdPan=panner(V(45,4,-19),35),crowd=noise(crowdPan,'bandpass',640),breeze=noise(master,'lowpass',420,.009);
  const humPan=panner(V(0,25,-11),40),hum=ctx.createOscillator(),humGain=gain(.008);hum.type='sine';hum.frequency.value=100;hum.connect(humGain);humGain.connect(humPan);hum.start();
  const oneShots=new Set();let audible=false;
  function stopOneShots(){for(const node of oneShots){try{node.stop();}catch(e){}}oneShots.clear();}
  function silence(){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(0,ctx.currentTime,.008);stopOneShots();audible=false;}
  function oneShot(kind,position){
    if(ctx.state!=='running')return;
    const now=ctx.currentTime,g=gain(),duration=kind==='beep'?.10:kind==='open'?.065:kind==='close'?.045:.035;
    let src;
    if(kind==='beep'){src=ctx.createOscillator();src.type='sine';src.frequency.value=880;g.gain.setValueAtTime(.09,now);}
    else {src=ctx.createBufferSource();src.buffer=buffer;const f=filter('highpass',kind==='shutter'?1800:850);src.connect(f);f.connect(g);g.gain.setValueAtTime(kind==='open'?.13:.065,now);}
    if(kind==='beep')src.connect(g);
    const pan=position?panner(position,25):null;g.connect(pan||master);g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    oneShots.add(src);src.onended=()=>{oneShots.delete(src);src.disconnect();g.disconnect();if(pan)pan.disconnect();};src.start(now);src.stop(now+duration+.01);
  }
  const events=[.5,1,1.5,2,2.5].map(time=>({time,kind:'beep'}));events.push({time:33.5,kind:'open'},{time:BLUE_FINISH,kind:'close'});
  flashEvents.forEach(e=>events.push({time:e.time,kind:'shutter',p:e.p}));events.sort((a,b)=>a.time-b.time);
  function update(t,previous,playing,dragging){
    if(!playing||dragging){if(audible||oneShots.size)silence();return;}
    if(!audible){master.gain.setTargetAtTime(.68,ctx.currentTime,.012);audible=true;}
    const frame=renderedState&&renderedState.t===t?renderedState:{red:carState(t,0),blue:carState(t,1),view:cameraPose(t)};
    const view=frame.view,listener=ctx.listener;setPosition(listener,view.position);
    const forward=view.target.clone().sub(view.position).normalize(),up=camera.up;
    if(listener.forwardX){for(const [key,val] of [['forwardX',forward.x],['forwardY',forward.y],['forwardZ',forward.z],['upX',up.x],['upY',up.y],['upZ',up.z]])listener[key].setValueAtTime(val,ctx.currentTime);}else listener.setOrientation(forward.x,forward.y,forward.z,up.x,up.y,up.z);
    const earlier=cameraPose(Math.max(0,t-.002)),later=cameraPose(Math.min(DURATION,t+.002));
    const cameraVelocity=earlier.shot===view.shot&&later.shot===view.shot?later.position.clone().sub(earlier.position).multiplyScalar(1/Math.max(.001,Math.min(DURATION,t+.002)-Math.max(0,t-.002))):V();
    [frame.red,frame.blue].forEach((st,id)=>{
      const v=voices[id],toward=st.p.clone().sub(view.position).normalize();
      const doppler=clamp((343+cameraVelocity.dot(toward))/(343+st.velocity.dot(toward)),.65,1.55);
      const stateRPM=engineRPM(t,st,id),rpm=typeof stateRPM==='number'?stateRPM:stateRPM.rpm,dip=typeof stateRPM==='number'?1:stateRPM.dip;
      const throttle=t<3?.35:clamp(.40+st.a*.045,.16,1),onboard=view.shot===4&&id===1;
      setPosition(v.pan,st.p.clone().add(V(0,.6,0)));
      v.harmonics.forEach((h,j)=>setParam(h.osc.frequency,rpm/20*(j+1)*doppler*(id===0?1.004:.997)));
      setParam(v.engine.gain,(.13+throttle*.16)*dip*(onboard?1.18:1)*(1+.028*Math.sin(t*39+id)));
      setParam(v.lowpass.frequency,onboard?2100:2400+throttle*4200);
      setParam(v.turbo.frequency,(1600+rpm*.27)*doppler);setParam(v.turboGain.gain,.004+throttle*.012);
      setParam(v.exhaust.g.gain,.025+throttle*.028);setParam(v.exhaust.f.frequency,500+rpm*.08);
      setParam(v.wet.g.gain,clamp(st.v/70,0,1)*.09);setParam(v.wet.f.frequency,1600+st.v*25);
      const launch=t>=3&&t<5?(1-smooth(3.6,5,t))*.10:0,load=Math.abs(st.curvature)*st.v*st.v;
      setParam(v.squeal.g.gain,launch+clamp(-st.a/25,0,1)*.035+clamp(load/28,0,1)*.018);
      setParam(v.squeal.f.frequency,1200+st.v*12+Math.sin(t*27)*60);
      setParam(v.scrape.g.gain,sparkIntensity(st,t)*(.02+.025*Math.pow(Math.sin(t*137+id),8)));
      setParam(v.brakeGain.gain,clamp((-st.a-12)/15,0,1)*.008);setParam(v.brake.frequency,(3300+st.v*8)*doppler);
      setParam(v.wind.g.gain,onboard?clamp(st.v/60,0,1)*.12:.003);
    });
    setParam(crowd.g.gain,.022+smooth(33,36.4,t)*.045+smooth(BLUE_FINISH,BLUE_FINISH+.4,t)*.10);
    setParam(crowd.f.frequency,450+smooth(33,37,t)*600+Math.sin(t*2.7)*50);
    setParam(breeze.g.gain,.008+.002*Math.sin(t*.8));
    const near=at(Math.round(frame.blue.s/MAST_STEP)*MAST_STEP,-11,27);setPosition(humPan,near);
    if(previous<t)for(const e of events)if(previous<e.time&&t>=e.time)oneShot(e.kind,e.p||(e.kind==='open'||e.kind==='close'?frame.blue.p:null));
  }
  return {update,silence,resume};
})();

// The five-state transport uses clamped wall time only for playback and holds.
// No physics or visual effect reads that wall clock.
const STATES=Object.freeze({COUNTDOWN:'COUNTDOWN',PLAYING:'PLAYING',PAUSED:'PAUSED',REFIRE_HOLD:'REFIRE_HOLD',ENDED:'ENDED'});
let state=STATES.COUNTDOWN,simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,previousStamp=null,scrubbing=false;
const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber'),toggle=document.getElementById('btn-toggle');
const pauseIcon=document.getElementById('icon-pause'),playIcon=document.getElementById('icon-play');
function hideCountdown(){countdown.style.display='none';countdown.textContent='';}
function syncTransport(){
  const running=state===STATES.PLAYING||state===STATES.COUNTDOWN||state===STATES.REFIRE_HOLD;
  pauseIcon.style.display=running?'block':'none';playIcon.style.display=running?'none':'block';toggle.setAttribute('aria-label',running?'Pause':'Play');
  if(state!==STATES.PLAYING)audioSystem.silence();
}
toggle.addEventListener('click',()=>{
  audioSystem.resume();previousStamp=performance.now();
  if(state===STATES.PLAYING)state=STATES.PAUSED;
  else if(state===STATES.COUNTDOWN||state===STATES.REFIRE_HOLD){hideCountdown();simTime=0;scrubber.value='0';state=STATES.PAUSED;renderAt(0);}
  else if(state===STATES.ENDED){hideCountdown();simTime=0;scrubber.value='0';state=STATES.PLAYING;renderAt(0);}
  else state=STATES.PLAYING;
  syncTransport();
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  audioSystem.resume();audioSystem.silence();hideCountdown();countdownElapsed=0;holdElapsed=0;simTime=0;scrubber.value='0';state=STATES.REFIRE_HOLD;previousStamp=performance.now();renderAt(0);syncTransport();
});
document.querySelectorAll('.speed-pill').forEach(pill=>pill.addEventListener('click',()=>{
  playbackSpeed=parseFloat(pill.dataset.speed);
  document.querySelectorAll('.speed-pill').forEach(p=>{const selected=p===pill;p.classList.toggle('is-active',selected);p.setAttribute('aria-checked',String(selected));});
}));
scrubber.addEventListener('pointerdown',()=>{scrubbing=true;audioSystem.silence();});
window.addEventListener('pointerup',()=>{scrubbing=false;});window.addEventListener('pointercancel',()=>{scrubbing=false;});
scrubber.addEventListener('input',()=>{
  hideCountdown();countdownElapsed=0;holdElapsed=0;simTime=clamp(parseFloat(scrubber.value)||0,0,DURATION);state=STATES.PAUSED;audioSystem.silence();renderAt(simTime);syncTransport();
});
window.addEventListener('resize',()=>{
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
  for(const m of particleMaterials)m.uniforms.pixelHeight.value=window.innerHeight;
  renderAt(simTime);
});
function frame(stamp){
  if(previousStamp===null){previousStamp=stamp;if(state===STATES.COUNTDOWN){countdownElapsed=0;countdown.style.display='block';countdown.textContent='3';}requestAnimationFrame(frame);return;}
  const dt=Math.min(Math.max(0,(stamp-previousStamp)/1000),.1);previousStamp=stamp;
  if(state===STATES.COUNTDOWN){
    countdownElapsed+=dt;
    if(countdownElapsed<3){countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed));simTime=0;scrubber.value='0';}
    else {hideCountdown();state=STATES.PLAYING;syncTransport();}
  }else if(state===STATES.REFIRE_HOLD){
    holdElapsed+=dt;
    if(holdElapsed>=1){state=STATES.PLAYING;syncTransport();}
  }
  if(state===STATES.PLAYING){
    const previous=simTime;simTime=Math.min(DURATION,simTime+dt*playbackSpeed);scrubber.value=simTime.toFixed(3);renderAt(simTime);
    if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);state=STATES.ENDED;syncTransport();}
    audioSystem.update(simTime,previous,state===STATES.PLAYING,scrubbing);
  }
  requestAnimationFrame(frame);
}
// A small read-only inspection surface is useful for deterministic regression
// checks. It adds no controls, labels or other DOM content.
window.NightDuel=Object.freeze({
  renderAt,carState,cameraPose,circuitLength:L,finishTimes:Object.freeze({blue:BLUE_FINISH,red:RED_FINISH}),
  get playback(){return {state,simTime,playbackSpeed,countdownElapsed,holdElapsed};},
  get meshCounts(){return cars.map(c=>{let n=0;c.root.traverse(o=>{if(o.isMesh)n++;});return n;});}
});
syncTransport();renderAt(0);requestAnimationFrame(frame);
</script>
