<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(() => {
const DURATION = 40;
const FINISH = 1551.65;
const TAU = Math.PI * 2;
const V = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);
const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
const mix = (a,b,t) => a+(b-a)*t;
const smooth = (a,b,x) => { const u=clamp((x-a)/(b-a),0,1); return u*u*(3-2*u); };
function mulberry32(a) {
  return () => { let t=a+=0x6D2B79F5; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
}
const random=mulberry32(42);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x101925,0.0033);
scene.fog.color.convertSRGBToLinear();
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,3000);

// Shape-preserving cubics give position and its two derivatives directly.
const checkpoints=[
[-8,-2.50,-16,2.50],[-8,-2.50,-16,2.50],[-8,-2.50,-16,2.50],[-8,-2.50,-16,2.50],
[-2.3,-2.31,-11.5,2.36],[14.8,-1.46,3.1,1.65],[42.8,-.47,29.8,.76],[81.1,0,68.2,.10],
[128.9,0,115.9,0],[185.1,0,172.2,0],[248.1,0,235.3,0],[310.5,0,297.8,0],
[354.6,0,342.1,0],[403.8,0,391.4,0],[456.5,0,444.4,0],[500.6,0,488.6,0],
[553,0,541.2,0],[590.7,0,579.2,0],[627.7,0,616.4,0],[674.3,0,663.2,0],
[716.6,0,705.7,0],[744.7,0,734,0],[782,0,771.5,0],[821,0,810.8,0],
[855.1,0,845.1,0],[899,0,889.1,0],[951.7,0,942.1,0],[1007.7,0,998.2,0],
[1069.6,0,1060.3,0],[1131.7,0,1122.5,0],[1194.2,0,1185.1,0],[1252.2,0,1243.1,0],
[1289.7,0,1280.7,0],[1333.9,0,1324.9,0],[1387.1,-.87,1380.4,1.62],
[1447.7,-1.20,1446.1,3.40],[1514,-1.20,1516.7,3.40],[1583.6,-1.20,1587.1,3.40],
[1649.5,-1.20,1653.4,3.40],[1710.4,-1.20,1714.9,3.40],[1766.3,-1.20,1771.1,3.40]
];
function makePchip(column) {
  const y=checkpoints.map(r=>r[column]), d=y.slice(1).map((v,i)=>v-y[i]), m=new Float64Array(y.length);
  for(let i=1;i<y.length-1;i++) m[i]=d[i-1]*d[i]>0 ? 2*d[i-1]*d[i]/(d[i-1]+d[i]):0;
  function endpoint(a,b) { let v=(3*a-b)/2; if(v*a<=0) return 0; if(a*b<0 && Math.abs(v)>3*Math.abs(a)) return 3*a; return v; }
  m[0]=endpoint(d[0],d[1]); m[y.length-1]=endpoint(d[d.length-1],d[d.length-2]);

    t=clamp(t,0,DURATION); const i=Math.min(39,Math.floor(t)), u=t-i;
    const a=2*y[i]-2*y[i+1]+m[i]+m[i+1], b=-3*y[i]+3*y[i+1]-2*m[i]-m[i+1];
    return {value:((a*u+b)*u+m[i])*u+y[i],v:(3*a*u+2*b)*u+m[i],a:6*a*u+2*b};
  };
}
const splines=[0,1,2,3].map(makePchip);
function crossing(fn,value) { let a=35,b=38; for(let i=0;i<45;i++){ const m=(a+b)/2; if(fn(m).value<value)a=m;else b=m; } return (a+b)/2; }
const blueFinish=crossing(splines[2],FINISH), redFinish=crossing(splines[0],FINISH);
const points=[[0,0,0],[200,0,0],[320,5,60],[340,12,180],[260,20,260],[120,15,240],[60,8,320],[-80,4,340],[-200,0,260],[-240,0,120],[-160,0,40],[-80,0,0]].map(p=>V(...p));
const curve=new THREE.CatmullRomCurve3(points,true,'centripetal');
curve.arcLengthDivisions=8192;
curve.updateArcLengths();
const L=curve.getLength(), NS=4096, samples=[];
for(let i=0;i<=NS;i++) {
  const p=curve.getPointAt(i/NS),t=curve.getTangentAt(i/NS).normalize(),n=V().crossVectors(t,V(0,1,0)).normalize();
  samples.push({p,t,n});
}
function track(s) {
  const u=((s%L+L)%L)/L*NS, i=Math.floor(u), f=u-i, a=samples[i], b=samples[i+1];
  const p=a.p.clone().lerp(b.p,f), t=a.t.clone().lerp(b.t,f).normalize(),n=V().crossVectors(t,V(0,1,0)).normalize();
  return {p,t,n,up:V().crossVectors(n,t).normalize()};
}
function roadPoint(s,d=0,h=0) { const r=track(s);return r.p.addScaledVector(r.n,d).addScaledVector(r.up,h); }
function motion(id,t) {
  const x=splines[id*2](t), d=splines[id*2+1](t), r=track(x.value);
  const before=track(x.value-1).t,after=track(x.value+1).t;
  const curvature=after.clone().sub(before).dot(r.n)/2;
  return {s:x.value,d:d.value,v:x.v,a:x.a,dv:d.v,p:r.p.clone().addScaledVector(r.n,d.value).addScaledVector(r.up,.13),t:r.t,n:r.n,up:r.up,curvature};
}

// All bitmap resources are drawn on detached, in-memory helper canvases.
function canvasTexture(w,h,paint) {
  const c=document.createElement('canvas');c.width=w;c.height=h;paint(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;
}
const sky=canvasTexture(2048,1024,(c,w,h)=>{
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#02040a');g.addColorStop(.48,'#080f1d');g.addColorStop(.58,'#10141d');g.addColorStop(1,'#05070c');c.fillStyle=g;c.fillRect(0,0,w,h);
  const glow=c.createRadialGradient(370,530,0,370,530,280);glow.addColorStop(0,'rgba(91,53,29,.2)');glow.addColorStop(1,'rgba(18,17,24,0)');c.fillStyle=glow;c.fillRect(0,0,w,h);
  for(let i=0;i<1050;i++){let x=random()*w,y=random()*470; c.fillStyle='rgba(185,207,236,'+(.05+random()*.37)+')';const r=.35+random()*.85;c.fillRect(x,y,r,r);}
  const mg=c.createRadialGradient(1500,292,1,1500,292,44);mg.addColorStop(0,'rgba(146,170,194,.23)');mg.addColorStop(1,'rgba(30,45,63,0)');c.fillStyle=mg;c.fillRect(1450,240,100,105);
  c.fillStyle='#a7b7c6';c.beginPath();c.arc(1500,292,8,0,TAU);c.fill();
  c.fillStyle='rgba(61,77,97,.4)';for(let i=0;i<14;i++){c.beginPath();c.arc(1495+random()*10,287+random()*10,.5+random()*1.4,0,TAU);c.fill();}
});
sky.mapping=THREE.EquirectangularReflectionMapping;scene.background=sky;
const grain=canvasTexture(512,512,(c,w,h)=>{
  const im=c.createImageData(w,h);for(let i=0;i<im.data.length;i+=4){const v=65+random()*65;im.data[i]=v*.9;im.data[i+1]=v*.95;im.data[i+2]=v;im.data[i+3]=255;}c.putImageData(im,0,0);
  c.strokeStyle='rgba(9,12,17,.3)';c.lineWidth=.7;for(let i=0;i<70;i++){let x=random()*w,y=random()*h;c.beginPath();c.moveTo(x,y);c.lineTo(x+random()*24-12,y+30+random()*60);c.stroke();}
});
grain.wrapS=grain.wrapT=THREE.RepeatWrapping;grain.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
const carbonTex=canvasTexture(128,128,(c,w,h)=>{
  c.fillStyle='#151922';c.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=8)for(let x=0;x<w;x+=8){const g=c.createLinearGradient(x,y,x+8,y+8);g.addColorStop(0,(x+y)%16?'#292d36':'#0b0e14');g.addColorStop(.5,(x+y)%16?'#161a21':'#303540');g.addColorStop(1,'#12151b');c.fillStyle=g;c.fillRect(x,y,8,8);c.strokeStyle='rgba(100,108,122,.15)';c.beginPath();c.moveTo(x,y);c.lineTo(x+7,y+7);c.stroke();}
});
carbonTex.wrapS=carbonTex.wrapT=THREE.RepeatWrapping;carbonTex.repeat.set(7,4);
const rubberTex=canvasTexture(256,64,(c,w,h)=>{
  c.fillStyle='#111419';c.fillRect(0,0,w,h);for(let i=0;i<1800;i++){c.fillStyle=random()>.5?'rgba(48,51,55,.28)':'rgba(0,0,0,.25)';c.fillRect(random()*w,random()*h,1,1);}c.strokeStyle='#22252a';for(let i=4;i<64;i+=12){c.beginPath();c.moveTo(0,i);c.lineTo(w,i);c.stroke();}
});
rubberTex.wrapS=rubberTex.wrapT=THREE.RepeatWrapping;
const glowTex=canvasTexture(128,128,(c,w,h)=>{
  const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.1,'rgba(240,248,255,.7)');g.addColorStop(.3,'rgba(195,220,255,.14)');g.addColorStop(1,'rgba(170,210,255,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
});
const mistTex=canvasTexture(128,128,(c,w,h)=>{
  const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(230,238,247,.3)');g.addColorStop(.35,'rgba(186,204,224,.17)');g.addColorStop(1,'rgba(100,135,180,0)');c.fillStyle=g;c.fillRect(0,0,w,h);
});
const shadowTex=canvasTexture(128,128,(c,w,h)=>{const g=c.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(0,0,0,.8)');g.addColorStop(.6,'rgba(0,0,0,.5)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,w,h);});

// One PMREM capture of a night studio with long rectangular light banks.
const envScene=new THREE.Scene();envScene.background=new THREE.Color(0x050912);
for(let i=0;i<10;i++){
  const panel=new THREE.Mesh(new THREE.PlaneGeometry(3,12),new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(1.7,1.8,2.0),side:THREE.DoubleSide}));
  const a=i/10*TAU;panel.position.set(Math.cos(a)*16,5+(i%3)*4,Math.sin(a)*16);panel.lookAt(0,1,0);envScene.add(panel);
}
const pmrem=new THREE.PMREMGenerator(renderer);pmrem.compileCubemapShader();
const envTarget=pmrem.fromScene(envScene,.04,.1,100);scene.environment=envTarget.texture;pmrem.dispose();
envScene.traverse(o=>{if(o.isMesh){o.geometry.dispose();o.material.dispose();}});
const mat={
  carbon:new THREE.MeshPhysicalMaterial({color:0x171b24,map:carbonTex,roughness:.37,metalness:.65,clearcoat:.4,envMapIntensity:.5}),
  rubber:new THREE.MeshStandardMaterial({color:0x111216,map:rubberTex,roughness:.83,metalness:.05,envMapIntensity:.16}),
  metal:new THREE.MeshStandardMaterial({color:0x7b8594,metalness:.88,roughness:.28,envMapIntensity:.8}),
  darkMetal:new THREE.MeshStandardMaterial({color:0x242c37,metalness:.8,roughness:.4}),
  barrier:new THREE.MeshStandardMaterial({color:0x505e6b,metalness:.65,roughness:.36,envMapIntensity:.3}),
  concrete:new THREE.MeshStandardMaterial({color:0x202630,roughness:.9}),
  line:new THREE.MeshStandardMaterial({color:0xb7c2c9,roughness:.46,metalness:.05,emissive:0x111821,emissiveIntensity:.15}),
  kerbRed:new THREE.MeshStandardMaterial({color:0x8d1427,roughness:.4,metalness:.1}),
  kerbWhite:new THREE.MeshStandardMaterial({color:0x92979d,roughness:.4,metalness:.1}),
  lamps:new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(2.5,3.1,3.9)}),
  dark:new THREE.MeshStandardMaterial({color:0x05070c,roughness:.62,metalness:.2})
};
// Pack static geometry by material, keeping the scene's draw calls bounded.
const batches=new Map();
function batch(geometry,material,position=V(),quaternion=null,scale=null){
  const m=new THREE.Matrix4().compose(position,quaternion||new THREE.Quaternion(),scale||V(1,1,1));
  let g=geometry.index?geometry.toNonIndexed():geometry.clone();g.applyMatrix4(m);
  if(!batches.has(material))batches.set(material,[]);batches.get(material).push(g);return g;
}
function flushBatches(){
  for(const [material,gs] of batches){
    let n=0;for(const g of gs)n+=g.attributes.position.count;
    const p=new Float32Array(n*3),norm=new Float32Array(n*3),uv=new Float32Array(n*2);let o=0;
    for(const g of gs){p.set(g.attributes.position.array,o*3);norm.set(g.attributes.normal.array,o*3);if(g.attributes.uv)uv.set(g.attributes.uv.array,o*2);o+=g.attributes.position.count;g.dispose();}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('normal',new THREE.BufferAttribute(norm,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.computeBoundingSphere();
    const mesh=new THREE.Mesh(g,material);mesh.receiveShadow=true;scene.add(mesh);
  }batches.clear();
}
const unitBox=new THREE.BoxGeometry(1,1,1),unitCylinder=new THREE.CylinderGeometry(1,1,1,7);
function staticBox(pos,scale,material,quat=null){batch(unitBox,material,pos,quat,scale);}
function staticRod(a,b,r,material){const delta=b.clone().sub(a);batch(unitCylinder,material,a.clone().add(b).multiplyScalar(.5),new THREE.Quaternion().setFromUnitVectors(V(0,1,0),delta.clone().normalize()),V(r,delta.length(),r));}
function frameQuaternion(r){return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(r.t,r.up,r.n));}
function strip(d0,d1,height=0,start=0,end=L,steps=1200,withLight=false){
  const p=[],uv=[],colors=[],index=[];
  for(let i=0;i<=steps;i++){
    const s=mix(start,end,i/steps),r=track(s);
    const light=.025+.975*Math.exp(-.5*Math.pow((((s+36)%72+72)%72-36)/15,2));
    for(const d of [d0,d1]){const v=r.p.clone().addScaledVector(r.n,d).addScaledVector(r.up,height);p.push(v.x,v.y,v.z);uv.push((d+7)/4,s/5);colors.push(light,light,light);}
    if(i<steps){const j=2*i;index.push(j,j+1,j+2,j+1,j+3,j+2);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));if(withLight)g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));g.setIndex(index);g.computeVertexNormals();return g;

function loft(sections,segments=16){
  const p=[],uv=[],idx=[];

    const a=sections[i];for(let j=0;j<=segments;j++){const angle=j/segments*TAU;p.push(a.x,a.y+Math.cos(angle)*a.h,(a.z||0)+Math.sin(angle)*a.w);uv.push(j/segments,i/(sections.length-1));}
  }
  for(let i=0;i<sections.length-1;i++)for(let j=0;j<segments;j++){const a=i*(segments+1)+j,b=a+segments+1;idx.push(a,a+1,b,a+1,b+1,b);}
  for(const end of [0,sections.length-1]){const a=sections[end],k=p.length/3;p.push(a.x,a.y,a.z||0);uv.push(.5,.5);for(let j=0;j<segments;j++){const v=end*(segments+1)+j;if(end===0)idx.push(k,v+1,v);else idx.push(k,v,v+1);}}

}

      const hum2=c.createOscillator(),hum2Gain=c.createGain();hum2.type='sine';hum2.frequency.value=200;hum2Gain.gain.value=.002;hum2.connect(hum2Gain).connect(this.master);hum2.start();
      c.resume().catch(()=>{});
    }catch(e){this.ctx=null;}
  }
  resume(){if(this.ctx&&this.ctx.state!=='running')this.ctx.resume().catch(()=>{});}
  panner(ref=6,rolloff=.85){const p=this.ctx.createPanner();p.panningModel='HRTF';p.distanceModel='inverse';p.refDistance=ref;p.rolloffFactor=rolloff;p.maxDistance=900;p.coneInnerAngle=360;return p;}
  place(p,v){if(p.positionX){p.positionX.value=v.x;p.positionY.value=v.y;p.positionZ.value=v.z;}else p.setPosition(v.x,v.y,v.z);}
  noiseVoice(type,frequency,q,destination,brown=false){
    const c=this.ctx,source=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();
    source.buffer=brown?this.brown:this.noise;source.loop=true;filter.type=type;filter.frequency.value=frequency;filter.Q.value=q;gain.gain.value=0;
    source.connect(filter).connect(gain).connect(destination);source.start();return {source,filter,gain};
  }
  gear(v){return [12,24,35,44,52,59,66].reduce((g,threshold)=>g+(v>=threshold?1:0),1);}
  makeEngine(id){
    const c=this.ctx,panner=this.panner();panner.connect(this.master);
    const gain=c.createGain(),filter=c.createBiquadFilter();filter.type='lowpass';filter.frequency.value=5000;filter.Q.value=.6;gain.gain.value=.1;gain.connect(filter).connect(panner);
    const voices=[];
    for(let h=1;h<=4;h++){
      const osc=c.createOscillator(),level=c.createGain();osc.type=h===1?'sawtooth':h===4?'triangle':'sine';
      level.gain.value=(id?[.060,.045,.025,.018]:[.076,.029,.019,.013])[h-1];osc.frequency.value=300*h;
      osc.connect(level).connect(gain);osc.start();voices.push({osc,h});
    }
    const turbo=c.createOscillator(),tg=c.createGain();turbo.type='sine';turbo.frequency.value=2500;tg.gain.value=.006;turbo.connect(tg).connect(gain);turbo.start();
    const combustion=this.noiseVoice('bandpass',750,.6,gain),wet=this.noiseVoice('highpass',1700,.5,panner),squeal=this.noiseVoice('bandpass',1100,2.4,panner),scrape=this.noiseVoice('highpass',2900,.8,panner);
    const tyreOsc=c.createOscillator(),tyreGain=c.createGain();tyreOsc.type='triangle';tyreOsc.frequency.value=870;tyreGain.gain.value=0;tyreOsc.connect(tyreGain).connect(panner);tyreOsc.start();
    return {panner,gain,filter,voices,turbo,tg,combustion,wet,squeal,scrape,tyreOsc,tyreGain,id};
  }
  activeState(active){
    if(!this.ctx)return;this.active=active;const now=this.ctx.currentTime,g=this.master.gain;
    const current=this.ctx.state==='running'?g.value:0;
    g.cancelScheduledValues(now);g.setValueAtTime(current,now);g.linearRampToValueAtTime(active?.62:0,now+.035);
    if(!active){for(const entry of this.oneShots){const level=entry.gain.gain.value;entry.gain.gain.cancelScheduledValues(now);entry.gain.gain.setValueAtTime(level,now);entry.gain.gain.linearRampToValueAtTime(0,now+.03);for(const src of entry.sources){try{src.stop(now+.035);}catch(e){}}}this.oneShots.clear();}
  }
  target(param,value){param.setTargetAtTime(value,this.ctx.currentTime,.018);}
  update(t,red,blue,shot){
    if(!this.ctx)return;const c=this.ctx,listener=c.listener;
    const forward=camera.getWorldDirection(V()),up=V(0,1,0).applyQuaternion(camera.quaternion);
    if(listener.positionX){
      listener.positionX.value=camera.position.x;listener.positionY.value=camera.position.y;listener.positionZ.value=camera.position.z;
      listener.forwardX.value=forward.x;listener.forwardY.value=forward.y;listener.forwardZ.value=forward.z;
      listener.upX.value=up.x;listener.upY.value=up.y;listener.upZ.value=up.z;
    }else {listener.setPosition(camera.position.x,camera.position.y,camera.position.z);listener.setOrientation(forward.x,forward.y,forward.z,up.x,up.y,up.z);}
    const t0=Math.max(0,t-.006),t1=Math.min(40,t+.006);
    let cameraVelocity=V();
    if(shotAt(t0)===shot&&shotAt(t1)===shot&&t1>t0)cameraVelocity=cameraAt(t1).pos.sub(cameraAt(t0).pos).multiplyScalar(1/(t1-t0));
    const states=[red,blue];
    for(let id=0;id<2;id++){
      const e=this.engines[id],m=states[id],gear=this.gear(m.v),limits=[0,12,24,35,44,52,59,66,78];
      let rpm=5000+clamp((m.v-limits[gear-1])/(limits[gear]-limits[gear-1]),0,1)*6800;
      if(t<3)rpm=5200+180*Math.sin(t*29+id*2)+130*Math.sin(t*47)+smooth(2.35,2.96,t)*3600;
      let dip=0,blip=0;for(const s of this.shiftTimes[id]){const age=t-s.t;if(age>=0&&age<.16){if(s.up)dip=Math.max(dip,Math.exp(-age*24));else blip=Math.max(blip,Math.exp(-age*28));}}
      rpm*=1-.13*dip+.15*blip;
      const relative=m.t.clone().multiplyScalar(m.v).addScaledVector(m.n,m.dv).sub(cameraVelocity),direction=m.p.clone().sub(camera.position).normalize();
      const doppler=343/(343+clamp(relative.dot(direction),-120,160));
      const firing=rpm/20*doppler,throttle=clamp(.48+m.a/25,.12,1);
      for(const v of e.voices)this.target(v.osc.frequency,firing*v.h*(1+id*.003));
      this.target(e.turbo.frequency,(1600+rpm*.32)*doppler);
      this.target(e.tg.gain,.015*throttle);
      const onboard=shot===4&&id===1;
      this.target(e.gain.gain,(onboard?.95:.72)*(1-.28*dip)*(.6+throttle*.65));
      this.target(e.filter.frequency,onboard?2300:1800+throttle*4200);
      this.target(e.combustion.gain.gain,.035+throttle*.045);this.target(e.combustion.filter.frequency,420+rpm*.08);
      this.place(e.panner,m.p.clone().add(V(0,.3,0)));e.panner.refDistance=onboard?10:6;
      this.target(e.wet.gain.gain,clamp(m.v/72,0,1)*.061);this.target(e.wet.filter.frequency,1000+m.v*30);
      const launch=t>3&&t<5?(1-smooth(3.8,5,t))*.7:0;
      const braking=clamp((-m.a-7)/32,0,1),corner=clamp(Math.abs(m.curvature)*m.v*m.v/40,0,.65);
      const lock=id===0?smooth(20,20.15,t)*(1-smooth(20.6,20.95,t)):.0;
      this.target(e.squeal.gain.gain,.035*(braking*.7+corner*.4+launch+lock));
      this.target(e.squeal.filter.frequency,730+corner*650+launch*700);
      this.target(e.tyreOsc.frequency,(740+braking*290+launch*550)*doppler);
      this.target(e.tyreGain.gain,(braking*.005+launch*.009+lock*.008));
      this.target(e.scrape.gain.gain,sparksAt(m)*(.009+.01*(.5+.5*Math.sin(t*153+id))));
    }
    this.target(this.wind.gain.gain,shot===4?.055*clamp(blue.v/65,0,1):.006);
    const finale=smooth(33,36.5,t),roar=smooth(blueFinish,blueFinish+.25,t);
    this.target(this.crowd.gain.gain,.046+finale*.09+roar*.24);this.target(this.crowd.filter.frequency,650+roar*1000);
    this.target(this.breeze.gain.gain,.023+.006*Math.sin(t*.6));
  }
  oneShot(event){
    if(!this.ctx||!this.active||this.ctx.state!=='running')return;
    const c=this.ctx,now=c.currentTime,gain=c.createGain(),sources=[],kind=event.kind;
    let duration=kind==='beep'?.13:kind==='close'?.045:kind==='shutter'?.055:.075;
    gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(kind==='beep'?.08:kind==='shutter'?.022:.065,now+.003);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);
    if(kind==='beep'){
      const osc=c.createOscillator();osc.type='sine';osc.frequency.value=710+event.index*55;osc.connect(gain);sources.push(osc);
    }else{
      const noise=c.createBufferSource(),hp=c.createBiquadFilter();noise.buffer=this.noise;hp.type='highpass';hp.frequency.value=kind==='shutter'?800:2300;noise.connect(hp).connect(gain);sources.push(noise);
      const clack=c.createOscillator(),clackGain=c.createGain();clack.type='triangle';clack.frequency.setValueAtTime(kind==='shutter'?180:730,now);clack.frequency.exponentialRampToValueAtTime(80,now+duration);clackGain.gain.value=.22;clack.connect(clackGain).connect(gain);sources.push(clack);
    }
    if(event.position){const p=this.panner(8,.8);this.place(p,event.position);gain.connect(p).connect(this.master);}else gain.connect(this.master);
    const entry={sources,gain};this.oneShots.add(entry);
    sources.forEach((s,i)=>{s.start(now, s.buffer?(event.index||0)*.017%2:undefined);s.stop(now+duration+.01);if(i===0)s.onended=()=>{this.oneShots.delete(entry);gain.disconnect();};});
  }
}
const sound=new RaceAudio();
const soundEvents=[.5,1,1.5,2,2.5].map((time,index)=>({time,index,kind:'beep'}));
soundEvents.push({time:33.5,kind:'open',position:roadPoint(splines[2](33.5).value,splines[3](33.5).value,.8)}, {time:blueFinish,kind:'close',position:roadPoint(FINISH,3.4,.8)});
flashes.forEach((f,index)=>soundEvents.push({time:f.when,index,kind:'shutter',position:f.sprite.position.clone()}));soundEvents.sort((a,b)=>a.time-b.time);
function unlockAudio(){sound.resume();}
window.addEventListener('pointerdown',unlockAudio,{once:true});window.addEventListener('keydown',unlockAudio,{once:true});

// Exactly five states. Countdown and refire hold use clamped wall time;
// all visual state and sound event crossings use only the simulation clock.
const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle'),playIcon=document.getElementById('icon-play'),pauseIcon=document.getElementById('icon-pause');
function hideCountdown(){countdown.style.display='none';countdown.textContent='';}
function setState(next){
  playbackState=next;const running=next==='PLAYING'||next==='COUNTDOWN'||next==='REFIRE_HOLD';
  playIcon.style.display=running?'none':'block';pauseIcon.style.display=running?'block':'none';toggle.setAttribute('aria-label',running?'Pause':'Play');
  sound.activeState(next==='PLAYING');
}
toggle.addEventListener('click',()=>{
  if(playbackState==='PLAYING'){setState('PAUSED');}
  else if(playbackState==='COUNTDOWN'||playbackState==='REFIRE_HOLD'){hideCountdown();simTime=0;scrubber.value='0';countdownElapsed=0;holdElapsed=0;setState('PAUSED');renderAt(0);}
  else if(playbackState==='PAUSED'){hideCountdown();setState('PLAYING');}
  else {hideCountdown();simTime=0;scrubber.value='0';renderAt(0);setState('PLAYING');}
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  hideCountdown();countdownElapsed=0;holdElapsed=0;simTime=0;scrubber.value='0';setState('REFIRE_HOLD');renderAt(0);
});
const pills=Array.from(document.querySelectorAll('.speed-pill'));
for(const pill of pills)pill.addEventListener('click',()=>{
  playbackSpeed=parseFloat(pill.dataset.speed);
  for(const p of pills){const active=p===pill;p.classList.toggle('is-active',active);p.setAttribute('aria-checked',String(active));}
});
scrubber.addEventListener('pointerdown',()=>{hideCountdown();setState('PAUSED');});
scrubber.addEventListener('input',()=>{
  hideCountdown();countdownElapsed=0;holdElapsed=0;simTime=clamp(parseFloat(scrubber.value)||0,0,DURATION);setState('PAUSED');renderAt(simTime);
});
window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.setSize(window.innerWidth,window.innerHeight,false);renderAt(simTime);
});
renderAt(0);
let previousWall=null;
function frame(wall){
  const dt=previousWall===null?0:Math.min(Math.max((wall-previousWall)/1000,0),.1);previousWall=wall;
  const previousSim=simTime;
  if(playbackState==='COUNTDOWN'){
    countdownElapsed+=dt;simTime=0;scrubber.value='0';
    if(countdownElapsed<3-1e-9){countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed+1e-9));}
    else{hideCountdown();setState('PLAYING');}
  }else if(playbackState==='REFIRE_HOLD'){
    holdElapsed+=dt;hideCountdown();simTime=0;scrubber.value='0';if(holdElapsed>=1-1e-9)setState('PLAYING');
  }
  if(playbackState==='PLAYING'){
    simTime=Math.min(DURATION,simTime+dt*playbackSpeed);if(DURATION-simTime<1e-9)simTime=DURATION;scrubber.value=simTime.toFixed(3);
    for(const event of soundEvents)if(previousSim<event.time&&simTime>=event.time)sound.oneShot(event);
    if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);setState('ENDED');}
  }
  renderAt(simTime);sound.update(simTime,rendered.red,rendered.blue,rendered.shot);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// A small read-only inspection surface, with no on-screen instrumentation.
window.NightDuel=Object.freeze({
  renderAt,motion,cameraAt,track,
  get simTime(){return simTime;},get state(){return playbackState;},get speed(){return playbackSpeed;},
  get lapLength(){return L;},blueFinish,redFinish,
  get meshCounts(){return cars.map(c=>{let n=0;c.root.traverse(o=>{if(o.isMesh)n++;});return n;});},
  get renderInfo(){return {calls:renderer.info.render.calls,triangles:renderer.info.render.triangles};}
});
})();
