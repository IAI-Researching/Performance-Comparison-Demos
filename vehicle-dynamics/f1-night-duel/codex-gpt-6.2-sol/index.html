<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  const DURATION = 40;
  const TAU = 2 * Math.PI;
  const FLOOR = 0.055;
  const TYRE_RADIUS = 0.36;
  const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
  const UP = v3(0, 1, 0);
  const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
  const mix = (a, b, f) => a + (b - a) * f;
  const wrap = (x, period) => ((x % period) + period) % period;
  function smooth(a, b, x) {
    const f = clamp((x - a) / (b - a));
    return f * f * (3 - 2 * f);
  }
  function mulberry32(seed) {
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let word = Math.imul(seed ^ seed >>> 15, 1 | seed);
      word ^= word + Math.imul(word ^ word >>> 7, 61 | word);
      return ((word ^ word >>> 14) >>> 0) / 4294967296;
    };
  }
  const random = mulberry32(42);
  const srgb = hex => new THREE.Color(hex).convertSRGBToLinear();

  const renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById('stage'), antialias: true, alpha: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.92;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);
  const fogDensity = 0.00445;
  scene.fog = new THREE.FogExp2(0x101722, fogDensity);

  const points = [
    [0,0,0], [200,0,0], [320,5,60], [340,12,180], [260,20,260], [120,15,240],
    [60,8,320], [-80,4,340], [-200,0,260], [-240,0,120], [-160,0,40], [-80,0,0]
  ].map(p => v3(...p));
  const centreline = new THREE.CatmullRomCurve3(points, true, 'centripetal');
  centreline.arcLengthDivisions = 12000;
  const L = centreline.getLength();
  const TRACK_SAMPLES = 6144;
  const trackPositions = Array.from({length: TRACK_SAMPLES},
    (_, i) => centreline.getPointAt(i / TRACK_SAMPLES));
  const trackTangents = trackPositions.map((_, i) =>
    trackPositions[(i + 1) % TRACK_SAMPLES].clone()
      .sub(trackPositions[(i + TRACK_SAMPLES - 1) % TRACK_SAMPLES]).normalize());
  const trackNormals = trackTangents.map(tangent => tangent.clone().cross(UP).normalize());
  const trackCurvatures = trackTangents.map((tangent, i) => {
    const prev = trackTangents[(i + TRACK_SAMPLES - 2) % TRACK_SAMPLES];
    const next = trackTangents[(i + 2) % TRACK_SAMPLES];
    return next.clone().sub(prev).dot(trackNormals[i]) * TRACK_SAMPLES / (4 * L);
  });
  const trackFrame = () => ({ c: v3(), t: v3(), n: v3(), k: 0 });
  function track(s, frame) {
    const u = wrap(s, L) * TRACK_SAMPLES / L;
    const i = Math.floor(u) % TRACK_SAMPLES;
    const j = (i + 1) % TRACK_SAMPLES;
    const f = u - Math.floor(u);
    frame.c.copy(trackPositions[i]).lerp(trackPositions[j], f);
    frame.t.copy(trackTangents[i]).lerp(trackTangents[j], f).normalize();
    frame.n.copy(trackNormals[i]).lerp(trackNormals[j], f).normalize();
    frame.k = mix(trackCurvatures[i], trackCurvatures[j], f);
    return frame;
  }
  const constructionFrame = trackFrame();
  function trackPoint(s, d = 0, h = 0) {
    const {c, n} = track(s, constructionFrame);
    return c.clone().addScaledVector(n, d).addScaledVector(UP, h);
  }

  // Each row is s and d for car 7, then s and d for car 23, in metres.
  const checkpoints = [
    [-8,-2.50,-16,2.50], [-8,-2.50,-16,2.50], [-8,-2.50,-16,2.50], [-8,-2.50,-16,2.50],
    [-2.3,-2.31,-11.5,2.36], [14.8,-1.46,3.1,1.65], [42.8,-0.47,29.8,0.76],
    [81.1,0,68.2,0.10], [128.9,0,115.9,0], [185.1,0,172.2,0], [248.1,0,235.3,0],
    [310.5,0,297.8,0], [354.6,0,342.1,0], [403.8,0,391.4,0], [456.5,0,444.4,0],
    [500.6,0,488.6,0], [553,0,541.2,0], [590.7,0,579.2,0], [627.7,0,616.4,0],
    [674.3,0,663.2,0], [716.6,0,705.7,0], [744.7,0,734,0], [782,0,771.5,0],
    [821,0,810.8,0], [855.1,0,845.1,0], [899,0,889.1,0], [951.7,0,942.1,0],
    [1007.7,0,998.2,0], [1069.6,0,1060.3,0], [1131.7,0,1122.5,0], [1194.2,0,1185.1,0],
    [1252.2,0,1243.1,0], [1289.7,0,1280.7,0], [1333.9,0,1324.9,0],
    [1387.1,-0.87,1380.4,1.62], [1447.7,-1.20,1446.1,3.40], [1514,-1.20,1516.7,3.40],
    [1583.6,-1.20,1587.1,3.40], [1649.5,-1.20,1653.4,3.40], [1710.4,-1.20,1714.9,3.40],
    [1766.3,-1.20,1771.1,3.40]
  ];
  function pchip(values) {
    const delta = values.slice(1).map((value, i) => value - values[i]);
    function endSlope(a, b) {
      const m = (3 * a - b) / 2;
      if (m * a <= 0) return 0;
      return a * b <= 0 && Math.abs(m) > 3 * Math.abs(a) ? 3 * a : m;
    }
    const m = values.map((_, i) => {
      if (i === 0) return endSlope(delta[0], delta[1]);
      if (i === values.length - 1) return endSlope(delta[i - 1], delta[i - 2]);
      const a = delta[i - 1], b = delta[i];
      return a * b > 0 ? (2 * a * b) / (a + b) : 0;
    });
    return delta.map((d, i) => [values[i], m[i], 3*d - 2*m[i] - m[i+1], m[i] + m[i+1] - 2*d]);
  }
  const paths = [0,1,2,3].map(column => pchip(checkpoints.map(row => row[column])));
  function pathAt(path, t, out) {
    const i = Math.min(Math.floor(t), DURATION - 1);
    const u = t - i;
    const [a,b,c,d] = path[i];
    out.value = a + u * (b + u * (c + u * d));
    out.velocity = b + u * (2 * c + 3 * d * u);
    out.acceleration = 2 * c + 6 * d * u;
    return out;
  }
  function crossing(path, distance, lo, hi) {
    const result = {};
    for (let i = 0; i < 42; i++) {
      const mid = (lo + hi) / 2;
      if (pathAt(path, mid, result).value < distance) lo = mid;
      else hi = mid;
    }
    return (lo + hi) / 2;
  }
  const FINISH = crossing(paths[2], L, 36, 37);
  const DRS_START = 33.5;
  const ROLL_HOOP = -0.76;
  const movingState = () => ({
    ...trackFrame(), longitudinal: {}, lateral: {}, position: v3(), heading: v3(),
    right: v3(), up: v3(), orientation: new THREE.Quaternion(), bodyOrientation: new THREE.Quaternion(),
    s: 0, d: 0, speed: 0, acceleration: 0, pitch: 0, roll: 0, corner: 0, brake: 0, skid: 0
  });
  const basis = new THREE.Matrix4();
  const bodyEuler = new THREE.Euler();
  const brakeSample = {};
  function carAt(car, t, state) {
    const longitudinalPath = paths[2 * car];
    const s = pathAt(longitudinalPath, t, state.longitudinal);
    const d = pathAt(paths[2 * car + 1], t, state.lateral);
    track(s.value, state);
    state.s = s.value;
    state.d = d.value;
    state.speed = s.velocity;
    state.acceleration = s.acceleration;
    state.position.copy(state.c).addScaledVector(state.n, d.value);
    state.heading.copy(state.t).multiplyScalar(Math.max(0.2, s.velocity * (1 - d.value * state.k)))
      .addScaledVector(state.n, d.velocity).normalize();
    state.right.copy(state.heading).cross(UP).normalize();
    state.up.copy(state.right).cross(state.heading).normalize();
    state.orientation.setFromRotationMatrix(basis.makeBasis(state.heading, state.up, state.right));
    state.corner = clamp(state.k * s.velocity * s.velocity, -36, 36);
    state.pitch = clamp(s.acceleration * 0.00090, -0.019, 0.016);
    state.roll = clamp(state.corner * -0.00093, -0.026, 0.026);
    state.bodyOrientation.setFromEuler(bodyEuler.set(state.roll, 0, state.pitch));
    state.bodyOrientation.premultiply(state.orientation);
    let brake = 0;
    for (let age = 0; age <= 0.9; age += 0.12) {
      const a = pathAt(longitudinalPath, Math.max(0, t - age), brakeSample).acceleration;
      brake = Math.max(brake, smooth(3.5, 24, -a) * Math.exp(-3.8 * age));
    }
    state.brake = brake;
    state.skid = Math.max(smooth(55.5556, 65, state.speed) * 0.73,
      smooth(10, 25, -state.acceleration));
    return state;
  }

  function texture(width, height, draw, color = true) {
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const ctx = canvas.getContext('2d');
    draw(ctx, width, height);
    const map = new THREE.CanvasTexture(canvas);
    map.encoding = color ? THREE.sRGBEncoding : THREE.LinearEncoding;
    map.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return map;
  }
  function standard(hex, properties = {}) {
    return new THREE.MeshStandardMaterial({ color: srgb(hex), ...properties });
  }
  function radiant(r, g, b, properties = {}) {
    return new THREE.MeshBasicMaterial({ color: new THREE.Color(r,g,b), ...properties });
  }
  function mesh(parent, name, geometry, material, x = 0, y = 0, z = 0) {
    const part = new THREE.Mesh(geometry, material);
    part.name = name;
    part.position.set(x,y,z);
    parent.add(part);
    return part;
  }
  function box(parent, name, material, x, y, z, w, h, d) {
    return mesh(parent, name, new THREE.BoxGeometry(w,h,d), material, x,y,z);
  }
  const baseBox = new THREE.BoxGeometry(1,1,1);
  const instancePose = new THREE.Object3D();
  function instances(parent, geometry, material, items, name) {
    const batch = new THREE.InstancedMesh(geometry, material, items.length);
    batch.name = name;
    batch.frustumCulled = false;
    items.forEach(({x,y,z,w,h,d,yaw = 0,roll = 0,color}, i) => {
      instancePose.position.set(x,y,z);
      instancePose.rotation.set(0,yaw,roll);
      instancePose.scale.set(w,h,d);
      instancePose.updateMatrix();
      batch.setMatrixAt(i, instancePose.matrix);
      if (color) batch.setColorAt(i, color);
    });
    parent.add(batch);
    return batch;
  }

  // The sky is drawn in world directions so stars and the moon stay fixed across cuts.
  const starMap = texture(2048, 1024, (ctx, w, h) => {
    ctx.fillStyle = '#000';
    ctx.fillRect(0,0,w,h);
    for (let i = 0; i < 1250; i++) {
      const x = random() * w, y = (0.04 + 0.465 * Math.sqrt(random())) * h;
      const value = Math.pow(random(), 5) * 0.70 + 0.06;
      const white = random() > 0.32;
      ctx.fillStyle = white ? 'rgba(197,218,255,' + value + ')'
        : 'rgba(255,215,180,' + value + ')';
      const size = value > 0.57 ? 1.65 : 0.92;
      ctx.fillRect(x,y,size,size);
    }
  }, false);
  starMap.wrapS = THREE.RepeatWrapping;
  const sky = mesh(scene, 'Night sky', new THREE.SphereGeometry(1450, 32, 20),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, toneMapped: false,
      uniforms: { stars: {value: starMap}, moon: {value: v3(1,0.188,-0.15).normalize()} },
      vertexShader: `
        varying vec3 ray;
        void main() {
          ray = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D stars;
        uniform vec3 moon;
        varying vec3 ray;
        float grain(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7)) + 42.0) * 43758.5453);
        }
        void main() {
          vec3 p = normalize(ray);
          float horizon = exp(-max(p.y, 0.0) * 11.0);
          vec3 rgb = mix(vec3(0.00225, 0.0034, 0.0074), vec3(0.009, 0.014, 0.023), horizon);
          float city = pow(max(0.0, dot(normalize(p.xz), normalize(vec2(0.82, -0.73)))), 8.0);
          rgb += vec3(0.023, 0.012, 0.0044) * city * exp(-abs(p.y - 0.012) * 22.0);
          float longitude = atan(p.z,p.x) / 6.283185307 + 0.5;
          float latitude = asin(clamp(p.y,-1.0,1.0)) / 3.14159265 + 0.5;
          rgb += texture2D(stars, vec2(longitude,latitude)).rgb * 0.21 * smoothstep(0.008,0.16,p.y);
          vec3 moonX = normalize(cross(vec3(0.0,1.0,0.0), moon));
          vec2 m = vec2(dot(p, moonX), dot(p, cross(moon,moonX)));
          float mask = step(0.0,dot(p,moon));
          float r = length(m);
          float halo = exp(-r * 45.0) * mask;
          rgb += vec3(0.012, 0.021, 0.038) * halo;
          float disc = (1.0 - smoothstep(0.0079,0.0087,r)) * mask;
          float maria = 0.66 + 0.13 * sin(770.0*m.x + sin(540.0*m.y))
                             + 0.1 * sin(850.0*m.y - 650.0*m.x);
          float craters = grain(floor(m * 1550.0)) * 0.11;
          rgb = mix(rgb, vec3(0.50, 0.59, 0.65) * (maria + craters), disc);
          gl_FragColor = vec4(rgb,1.0);
          #include <encodings_fragment>
        }
      `
    }));
  sky.renderOrder = -20;
  sky.frustumCulled = false;

  // Reflect the hard overhead panels in paint, wet asphalt, and visor glass.
  const reflectionStage = new THREE.Scene();
  reflectionStage.background = new THREE.Color(0.021, 0.029, 0.052);
  [
    [1,9,-5, 3.2,1.45, 5.4,6.0,7.1],
    [-6,8,1, 1.6,3.8, 3.4,4.0,5.5],
    [6,5,6, 2.5,0.54, 3.9,4.5,5.2],
    [-3,4,-8, 6.0,0.16, 1.25,0.74,0.35],
    [1,1,9, 8.0,0.22, 0.56,0.81,1.22],
    [1,-8,1, 16,8, 0.013,0.018,0.026]
  ].forEach(([x,y,z,w,h,r,g,b]) => {
    const panel = mesh(reflectionStage, 'Reflection panel', new THREE.PlaneGeometry(w,h),
      radiant(r,g,b,{toneMapped:false}), x,y,z);
    panel.lookAt(0,0,0);
  });
  const pmrem = new THREE.PMREMGenerator(renderer);
  const environment = pmrem.fromScene(reflectionStage, 0.015, 0.1, 65);
  scene.environment = environment.texture;
  pmrem.dispose();
  reflectionStage.traverse(object => {
    if (object.isMesh) {
      object.geometry.dispose();
      object.material.dispose();
    }
  });

  const MASTS = 22;
  const MAST_STEP = L / MASTS;
  const MAST_PHASE = 23;
  function poolAt(s) {
    const q = wrap(s - MAST_PHASE + MAST_STEP / 2, MAST_STEP) - MAST_STEP / 2;
    return Math.exp(-Math.pow(q / 20, 2));
  }
  function strip(start, end, step, profile, name, material, decorate) {
    const count = Math.ceil((end - start) / step);
    const verts = [], uv = [], colors = [], frames = [], indices = [];
    for (let i = 0; i <= count; i++) {
      const s = mix(start, end, i / count);
      const {c,t,n,k} = track(s, constructionFrame);
      profile.forEach(([d,h], j) => {

      if (!active || context.state !== 'running') return;
      const now = context.currentTime;
      const value = (param,v) => param.setTargetAtTime(v,now,.015);
      updateListener(t,now);
      const inCar = currentShot === 3;
      const launch = smooth(3,3.18,t)*(1-smooth(4.0,5.0,t));
      const rev = smooth(2.5,2.98,t)*(1-smooth(3.43,4.25,t));
      for (let i = 0; i < 2; i++) {
        const source = engines[i], state = i === 0 ? stateR : stateB;
        sourcePosition.copy(state.position).addScaledVector(state.heading,-1.17).addScaledVector(UP,.56);
        positionAudio(source.panner,sourcePosition,now);
        soundDirection.copy(camera.position).sub(sourcePosition);
        const range = soundDirection.length();
        soundDirection.normalize();
        const realSpeed = Math.hypot(state.speed*(1-state.d*state.k),state.lateral.velocity);
        const radialSpeed = realSpeed*state.heading.dot(soundDirection);
        const doppler = clamp((343-cameraVelocity.dot(soundDirection))/(343-radialSpeed),.76,1.31);
        const g = gear(state.speed);
        const ratio = clamp((state.speed-shiftPoints[g])/(shiftPoints[g+1]-shiftPoints[g]));
        const burble = 92*Math.sin(t*36.8+i*2.1) + 67*Math.sin(t*51.1+i*3.8);
        let rpm = (g === 0 ? 5200 + 6550*ratio : 8000 + 3900*ratio);
        const eventIndex = firstEmission(gearEvents[i],t+.000001)-1;
        const event = gearEvents[i][eventIndex];
        const shifted = event ? Math.exp(-(t-event.t)/.076) : 0;
        if (event) rpm += (event.up ? -870 : 890)*shifted;
        rpm = Math.max(rpm,5200+rev*4250);
        if (state.speed < 5) rpm += burble*(1-smooth(0,5,state.speed))*(1-.65*rev);
        const rpmRatio = (rpm-5000)/7000;
        const lift = 1-.49*smooth(FINISH,FINISH+.65,t);
        const throttle = (t < 3 ? .16 + rev*.82 : clamp(.43+state.acceleration*.039,.09,.98))*lift;
        const firing = rpm*.05*doppler*(i ? 1.018 : .993);
        source.harmonics.forEach((osc,j) => value(osc.frequency,firing*ratios[j]));
        const load = .32 + .68*throttle;
        const cockpit = inCar && i === 1;
        value(source.volume.gain,(.104+.142*load)*(1-.31*shifted) *
          (cockpit ? 1.25 : 1) * (1+.095*Math.sin(t*41.7+i*5)*(1-smooth(0,7,state.speed))));
        value(source.growl.frequency,930 + 2720*load + 590*rpmRatio);
        value(source.exhaust.volume.gain,.24+.24*throttle);
        value(source.exhaust.tone.frequency,firing*(1.11+throttle*.22));
        value(source.turbo.frequency,(1530 + rpmRatio*1530)*doppler);
        value(source.turboGain.gain,smooth(.15,.85,rpmRatio)*(.004+.023*throttle));
        value(source.cabin.frequency,cockpit ? 1020 + 310*throttle : 5640/(1+.0085*range));
        const tyreSpeed = state.speed/72;
        value(source.road.volume.gain,.103*smooth(0,1,tyreSpeed));
        value(source.road.tone.frequency,1000 + 1800*tyreSpeed);
        value(source.road.source.playbackRate,(.84+.30*tyreSpeed)*doppler);
        const braking = smooth(8,28,-state.acceleration);
        const scrub = smooth(9,30,Math.abs(state.corner))*smooth(8,22,state.speed);
        const squeal = Math.max(launch*(i === 1 ? .96 : .79),.72*braking,.44*scrub);
        value(source.squeal.frequency,(470 + 59*Math.sin(t*13.5+i) + 210*squeal)*doppler);
        value(source.squealGain.gain,.035*squeal*squeal);
        value(source.screech.tone.frequency,950 + 470*squeal);
        value(source.screech.volume.gain,.078*squeal);
        const ticks = sparkTicks[i];
        let tick = firstEmission(ticks,t-.095), metal = 0;
        for (; tick < ticks.length && ticks[tick].t <= t; tick++) {
          metal += Math.exp(-(t-ticks[tick].t)*43);
        }
        value(source.scrape.volume.gain,.085*clamp(metal));
        value(source.scrape.tone.frequency,(2050+470*Math.sin(t*101))*doppler);
        value(source.brake.frequency,(1150+250*braking)*doppler);
        value(source.brakeGain.gain,.013*smooth(.64,1,braking));
      }
      const swell = smooth(33,35.8,t);
      const cheer = smooth(FINISH-.005,FINISH+.16,t)*(1-.45*smooth(FINISH+.36,40,t));
      value(crowdLow.volume.gain,.077+.084*swell+.29*cheer);
      value(crowdHigh.volume.gain,.030+.073*swell+.38*cheer);
      value(crowdHigh.tone.frequency,822+284*cheer);
      value(breeze.volume.gain,.034+.014*Math.sin(t*1.07));
      value(breeze.tone.frequency,453 + 135*Math.sin(t*.78+.46));
      value(onboardWind.volume.gain,inCar ? .097+.18*smooth(13,66,stateB.speed) : 0);
      value(onboardWind.tone.frequency,805 + stateB.speed*21);
      const near = wrap(Math.round((stateB.s-MAST_PHASE)/MAST_STEP),MASTS);
      positionAudio(humPlace,lampPositions[near],now);
      value(buzz.gain,.020);
    }
    function envelope(g,peak,now,duration) {
      g.gain.setValueAtTime(.0001,now);
      g.gain.exponentialRampToValueAtTime(peak,now+.0032);
      g.gain.exponentialRampToValueAtTime(.0001,now+duration);
    }
    function playOne(source,g,panner,now,duration,offset) {
      ringing.add(source);
      source.onended = () => {
        ringing.delete(source);
        source.disconnect();
        g.disconnect();
        if (panner) panner.disconnect();
      };
      if (offset === undefined) source.start(now);
      else source.start(now,offset);
      source.stop(now+duration+.008);
    }
    const events = [1,2,3,4,5].map(i => ({t:i*.5,kind:'beep',i}));
    events.push({t:DRS_START,kind:'open'},{t:FINISH,kind:'close'});
    flashEvents.forEach((flash,i) => events.push({t:flash.t,kind:'shutter',flash,
      variation:.82+.36*audioRandom(),offset:(i*.127 + audioRandom()*.16)%2.7}));
    events.sort((a,b) => a.t-b.t);
    function playEvents(from,t) {
      if (!active || context.state !== 'running') return;
      for (let i = firstEmission(events,from); i < events.length && events[i].t <= t; i++) {
        const e = events[i];
        if (e.t <= from) continue;
        const now = context.currentTime+.003;
        if (e.kind === 'beep') {
          const panner = spatial(master,17,.41);
          const lamp = v3(2,5.23,(e.i-3)*.975);
          positionAudio(panner,lamp,now);
          const g = gain(panner);
          const note = context.createOscillator();
          note.type = 'sine';
          note.frequency.setValueAtTime(582+21*e.i,now);
          note.frequency.exponentialRampToValueAtTime(526+18*e.i,now+.10);
          note.connect(g);
          envelope(g,.098,now,.14);
          playOne(note,g,panner,now,.14);
        } else {
          const shutter = e.kind === 'shutter';
          const panner = shutter ? spatial(master,14,.83) : spatial(master,7,.67);
          positionAudio(panner,shutter ? e.flash : carAt(1,e.t,sampleBlue).position,now);
          const duration = shutter ? .035+e.variation*.027 : e.kind === 'open' ? .084 : .059;
          const g = gain(panner);
          const click = context.createBufferSource();
          const shaping = filter(g,'bandpass',shutter ? 1640*e.variation : 1930,shutter ? 2.0 : 3.4);
          click.buffer = noiseBuffer;
          click.connect(shaping);
          envelope(g,shutter ? .094 : e.kind === 'open' ? .40 : .21,now,duration);
          playOne(click,g,panner,now,duration,shutter ? e.offset : .91);
        }
      }
    }
    return {setActive,update,playEvents};
  }

  const COUNTDOWN = 'COUNTDOWN', PLAYING = 'PLAYING', PAUSED = 'PAUSED';
  const REFIRE_HOLD = 'REFIRE_HOLD', ENDED = 'ENDED';
  const countdown = document.getElementById('countdown');
  const scrubber = document.getElementById('scrubber');
  const toggle = document.getElementById('btn-toggle');
  const refire = document.getElementById('btn-refire');
  const playIcon = document.getElementById('icon-play');
  const pauseIcon = document.getElementById('icon-pause');
  const speedPills = Array.from(document.querySelectorAll('.speed-pill'));
  const drawingSize = new THREE.Vector2();
  const audio = makeAudio();
  let state = COUNTDOWN;
  let simTime = 0, playbackSpeed = 1;
  let countdownElapsed = 0, holdStarted = 0, lastFrame = null;
  let scrubPointer = null;

  function setCountdown(text) {
    if (countdown.textContent !== text) countdown.textContent = text;
    const display = text ? 'block' : 'none';
    if (countdown.style.display !== display) countdown.style.display = display;
  }
  function stateTo(next) {
    state = next;
    const running = next === PLAYING || next === COUNTDOWN || next === REFIRE_HOLD;
    playIcon.style.display = running ? 'none' : 'block';
    pauseIcon.style.display = running ? 'block' : 'none';
    toggle.setAttribute('aria-label',running ? 'Pause' : 'Play');
    if (next !== COUNTDOWN) setCountdown('');
    audio.setActive(next === PLAYING && scrubPointer === null);
  }
  function restartFrame() {
    simTime = 0;
    scrubber.value = '0';
    renderAt(0);
  }
  function advance(wallStep) {
    const previous = simTime;
    simTime = Math.min(DURATION,simTime + wallStep*playbackSpeed);
    scrubber.value = simTime.toFixed(3);
    renderAt(simTime);
    audio.update(simTime);
    audio.playEvents(previous,simTime);
    if (simTime === DURATION) stateTo(ENDED);
  }
  function frame(timestamp) {
    const dt = lastFrame === null ? 0 : clamp((timestamp-lastFrame)/1000,0,.1);
    lastFrame = timestamp;
    if (state === COUNTDOWN) {
      countdownElapsed += dt;
      if (countdownElapsed < 3) setCountdown(String(3-Math.floor(countdownElapsed)));
      else {
        stateTo(PLAYING);
        advance(countdownElapsed-3);
      }
    } else if (state === REFIRE_HOLD) {
      const elapsed = (timestamp-holdStarted)/1000;
      if (elapsed >= 1) {
        stateTo(PLAYING);
        advance(Math.min(dt,elapsed-1));
      }
    } else if (state === PLAYING) advance(dt);
    requestAnimationFrame(frame);
  }

  toggle.addEventListener('click',() => {
    if (state === PAUSED || state === ENDED) {
      if (state === ENDED) restartFrame();
      lastFrame = performance.now();
      stateTo(PLAYING);
    } else stateTo(PAUSED);
  });
  refire.addEventListener('click',() => {
    holdStarted = performance.now();
    stateTo(REFIRE_HOLD);
    restartFrame();
  });
  for (const pill of speedPills) pill.addEventListener('click',() => {
    playbackSpeed = Number(pill.dataset.speed);
    for (const option of speedPills) {
      const selected = option === pill;
      option.classList.toggle('is-active',selected);
      option.setAttribute('aria-checked',String(selected));
    }
  });
  scrubber.addEventListener('pointerdown',event => {
    scrubPointer = event.pointerId;
    stateTo(PAUSED);
  });
  function releaseScrubber(event) {
    if (event.pointerId !== scrubPointer) return;
    scrubPointer = null;
    audio.setActive(state === PLAYING);
  }
  window.addEventListener('pointerup',releaseScrubber);
  window.addEventListener('pointercancel',releaseScrubber);
  scrubber.addEventListener('input',() => {
    stateTo(PAUSED);
    simTime = parseFloat(scrubber.value);
    renderAt(simTime);
  });
  function resize() {
    viewportAspect = window.innerWidth / window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
    renderer.setSize(window.innerWidth,window.innerHeight,false);
    viewportPixels.value = renderer.getDrawingBufferSize(drawingSize).y;
    renderAt(simTime);
  }
  window.addEventListener('resize',resize);
  setCountdown('');
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
