<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;

  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;

  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}

  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* ================= Circuit ================= */
const CTRL = [
  [0, 0, 0], [200, 0, 0], [320, 5, 60], [340, 12, 180], [260, 20, 260],
  [120, 15, 240], [60, 8, 320], [-80, 4, 340], [-200, 0, 260],

  const up = new THREE.Vector3(0, 1, 0);

    const u = i / NS;

    const t = curve.getTangentAt(u).normalize();

const C = s => frameAt(s).p;
const nrm = s => frameAt(s).n;

const BLUE_FINISH = findCross(sBf, FINISH_S);

/* ================= Procedural textures (in-memory canvases) ================= */
function mkCanvas(w, h, draw) {

  c.width = w; c.height = h;

const asphaltTex = mkTex(mkCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#141519'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5200; i++) {
    const v = 14 + rng() * 30;
    g.fillStyle = 'rgba(' + (v | 0) + ',' + (v | 0) + ',' + ((v + 4) | 0) + ',' + (0.25 + rng() * 0.5) + ')';
    g.fillRect(rng() * w, rng() * h, 1 + rng() * 2, 1 + rng() * 2);
  }
  for (let i = 0; i < 26; i++) {
    g.fillStyle = 'rgba(30,33,42,' + (0.05 + rng() * 0.08) + ')';
    g.fillRect(rng() * w, 0, 2 + rng() * 7, h);

const carbonTex = mkTex(mkCanvas(64, 64, (g, w, h) => {

  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
    const odd = (x + y) % 2 === 0;
    const gr = g.createLinearGradient(x * 8, y * 8, x * 8 + 8, y * 8 + 8);
    if (odd) { gr.addColorStop(0, '#1c1f26'); gr.addColorStop(1, '#0a0b0e'); }
    else { gr.addColorStop(0, '#0a0b0e'); gr.addColorStop(1, '#171a20'); }

const checkerTex = mkTex(mkCanvas(256, 64, (g, w, h) => {

const gridBoxTex = mkTex(mkCanvas(128, 256, (g, w, h) => {

/* ================= Geometry helpers ================= */
function mergeGeoms(list) {
  let total = 0;
  const prepped = list.map(g => {
    const ng = g.index ? g.toNonIndexed() : g;
    total += ng.attributes.position.count;
    return ng;
  });
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3),
    uv = new Float32Array(total * 2), col = new Float32Array(total * 3);
  let o = 0;
  for (const g of prepped) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array, o * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array, o * 2);
    if (g.attributes.color) col.set(g.attributes.color.array, o * 3);
    else col.fill(1, o * 3, (o + n) * 3);
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}
function bakeTransform(geo, pos, quat, scale) {
  const m = new THREE.Matrix4().compose(
    pos || new THREE.Vector3(),
    quat || new THREE.Quaternion(),
    scale || new THREE.Vector3(1, 1, 1));
  geo.applyMatrix4(m);
  return geo;
}
function flatRibbon(s0, s1, step, dA, dB, yOff, colorFn, uvS, uvD) {
  const rows = [];
  for (let s = s0; s <= s1 + 1e-6; s += step) rows.push(Math.min(s, s1));
  const nR = rows.length;
  const pos = new Float32Array(nR * 2 * 3), nor = new Float32Array(nR * 2 * 3),
    uv = new Float32Array(nR * 2 * 2), col = new Float32Array(nR * 2 * 3);
  const idx = [];
  for (let i = 0; i < nR; i++) {
    const f = frameAt(rows[i]);
    for (let j = 0; j < 2; j++) {
      const d = j === 0 ? dA : dB;
      const vi = (i * 2 + j);
      pos[vi * 3] = f.p.x + f.n.x * d;
      pos[vi * 3 + 1] = f.p.y + yOff;
      pos[vi * 3 + 2] = f.p.z + f.n.z * d;
      nor[vi * 3] = 0; nor[vi * 3 + 1] = 1; nor[vi * 3 + 2] = 0;
      uv[vi * 2] = (rows[i] - s0) / uvS;
      uv[vi * 2 + 1] = (d - dA) / uvD;
      const c = colorFn ? colorFn(rows[i], d) : [1, 1, 1];
      col[vi * 3] = c[0]; col[vi * 3 + 1] = c[1]; col[vi * 3 + 2] = c[2];
    }
    if (i < nR - 1) {
      const a = i * 2;
      idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.setIndex(idx);
  return g;
}
function wallRibbon(s0, s1, step, d, y0, y1, uvS, uvD, flip) {
  const rows = [];
  for (let s = s0; s <= s1 + 1e-6; s += step) rows.push(Math.min(s, s1));
  const nR = rows.length;
  const pos = new Float32Array(nR * 2 * 3), nor = new Float32Array(nR * 2 * 3), uv = new Float32Array(nR * 2 * 2);
  const idx = [];
  for (let i = 0; i < nR; i++) {
    const f = frameAt(rows[i]);
    for (let j = 0; j < 2; j++) {
      const vi = i * 2 + j;
      pos[vi * 3] = f.p.x + f.n.x * d;
      pos[vi * 3 + 1] = f.p.y + (j === 0 ? y0 : y1);
      pos[vi * 3 + 2] = f.p.z + f.n.z * d;
      const sgn = flip ? -1 : 1;
      nor[vi * 3] = f.n.x * sgn; nor[vi * 3 + 1] = 0; nor[vi * 3 + 2] = f.n.z * sgn;
      uv[vi * 2] = (rows[i] - s0) / uvS;
      uv[vi * 2 + 1] = j;
    }
    if (i < nR - 1) {
      const a = i * 2;
      if (flip) idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      else idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}
function trackQuad(sC, dC, len, wid, yOff) {
  const f = frameAt(sC);
  const pos = new Float32Array(12), uv = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
  const corners = [[-len / 2, -wid / 2], [len / 2, -wid / 2], [-len / 2, wid / 2], [len / 2, wid / 2]];
  for (let i = 0; i < 4; i++) {
    const [ds, dd] = corners[i];
    pos[i * 3] = f.p.x + f.t.x * ds + f.n.x * (dC + dd);
    pos[i * 3 + 1] = f.p.y + yOff;
    pos[i * 3 + 2] = f.p.z + f.t.z * ds + f.n.z * (dC + dd);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setIndex([0, 2, 1, 1, 2, 3]);
  g.computeVertexNormals();
  return g;
}

const MASTS = [];
{
  const count = Math.round(L / 70);
  for (let i = 0; i < count; i++) {
    const s = 30 + i * (L / count);
    const side = i % 2 === 0 ? 1 : -1;
    const f = frameAt(s);
    const base = f.p.clone().addScaledVector(f.n, side * 11.5);
    const lamp = base.clone(); lamp.y += 29;
    const target = f.p.clone().addScaledVector(f.n, side * 1.5);
    MASTS.push({ s, side, base, lamp, target });
  }
}
function wrapDelta(a, b) {
  let d = Math.abs(modL(a) - modL(b));
  return Math.min(d, L - d);
}
function poolAt(s, d) {
  let p = 0;
  for (const m of MASTS) {
    const da = wrapDelta(s, m.s);
    if (da > 45) continue;
    const dd = d - m.side * 2.5;
    p += Math.exp(-(da * da) / (17 * 17) - (dd * dd) / (8.5 * 8.5)) * 1.15;
  }
  const ws = modL(s);
  if (ws < 225 || ws > L - 45) p += 0.30 * Math.exp(-((d - 5.5) * (d - 5.5)) / 40);
  return p;
}
const roadColor = (s, d) => {
  const c = 0.30 + poolAt(s, d) * 1.55;
  return [c * 0.92, c * 0.97, c * 1.10];
};

function loft(stations, radial) {
  radial = radial || 12;
  const nSt = stations.length;
  const pos = [], uv = [], idx = [];
  for (let i = 0; i < nSt; i++) {
    const st = stations[i];
    const yc = (st.y0 + st.y1) / 2, hh = Math.max(0.004, (st.y1 - st.y0) / 2);
    for (let k = 0; k < radial; k++) {
      const th = k / radial * TAU;
      const sz = Math.sin(th), cy = Math.cos(th);
      const z = st.w * Math.sign(sz) * Math.pow(Math.abs(sz), 0.72) + (st.zc || 0);
      const y = yc + hh * Math.sign(cy) * Math.pow(Math.abs(cy), 0.72);
      pos.push(st.x, y, z);
      uv.push(i / (nSt - 1) * 3, k / radial);
    }
  }
  for (let i = 0; i < nSt - 1; i++) for (let k = 0; k < radial; k++) {
    const a = i * radial + k, b = i * radial + (k + 1) % radial;
    const c = (i + 1) * radial + k, d = (i + 1) * radial + (k + 1) % radial;
    idx.push(a, c, b, b, c, d);
  }
  const capStart = pos.length / 3;
  pos.push(stations[0].x, (stations[0].y0 + stations[0].y1) / 2, stations[0].zc || 0);
  uv.push(0, 0.5);
  const capEnd = pos.length / 3;
  pos.push(stations[nSt - 1].x, (stations[nSt - 1].y0 + stations[nSt - 1].y1) / 2, stations[nSt - 1].zc || 0);
  uv.push(3, 0.5);
  for (let k = 0; k < radial; k++) {
    idx.push(capStart, (k + 1) % radial, k);
    const base = (nSt - 1) * radial;
    idx.push(capEnd, base + k, base + (k + 1) % radial);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uv), 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function wingElement(chord, thick, span, sweep, pitch) {
  const g = new THREE.BoxGeometry(chord, thick, span, 6, 1, 8);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const z = p.getZ(i);
    const u = Math.abs(z) / (span / 2);
    p.setX(i, p.getX(i) + sweep * u * u);
    p.setY(i, p.getY(i) + 0.045 * u * u * u);
  }
  g.computeVertexNormals();
  g.rotateZ(pitch);
  return g;
}
function tube(a, b, r) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r, r, len, 6);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return bakeTransform(g, new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5), q);
}

function makePoints(n, color, blending, baseSize) {
  const pos = new Float32Array(n * 3), siz = new Float32Array(n), alp = new Float32Array(n);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alp, 1).setUsage(THREE.DynamicDrawUsage));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uMap: { value: puffTex }, uColor: { value: new THREE.Color(color) } },
    vertexShader: `
      attribute float aSize; attribute float aAlpha; varying float vA;
      void main(){
        vA = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (280.0 / max(1.0, -mv.z));
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D uMap; uniform vec3 uColor; varying float vA;
      void main(){
        vec4 t = texture2D(uMap, gl_PointCoord);
        gl_FragColor = vec4(uColor, t.a * vA);
        if (gl_FragColor.a < 0.004) discard;
      }`,
    transparent: true, depthWrite: false, blending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);

    events.push({ t: 33.5, type: 'drsOpen' });
    events.push({ t: BLUE_FINISH, type: 'drsClose' });
    for (let i = 0; i < 34; i++) events.push({ t: BLUE_FINISH + arng() * 2.6, type: 'shutter' });
    events.sort((a, b) => a.t - b.t);
    ok = true;
  }
  function oneShot(type) {
    if (!ok) return;
    const t0 = ctx.currentTime;
    const g = gainNode(0);
    g.connect(master);
    let dur = 0.1, srcs = [];
    if (type === 'beep') {
      const o = ctx.createOscillator();
      o.type = 'square'; o.frequency.value = 840;
      const f = biquad('lowpass', 2400, 1);
      o.connect(f); f.connect(g);
      g.gain.setValueAtTime(0.14, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.09);
      dur = 0.1; srcs = [o];
    } else if (type === 'drsOpen' || type === 'drsClose') {
      const n = ctx.createBufferSource(); n.buffer = nbuf;
      const f = biquad('highpass', type === 'drsOpen' ? 1800 : 1200, 1);
      n.connect(f); f.connect(g);
      const v = type === 'drsOpen' ? 0.22 : 0.12;
      g.gain.setValueAtTime(v, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.045);
      dur = 0.05; srcs = [n];
    } else if (type === 'shutter') {
      const n = ctx.createBufferSource(); n.buffer = nbuf;
      const f = biquad('highpass', 4000, 1);
      n.connect(f); f.connect(g);
      g.gain.setValueAtTime(0.05 + arng() * 0.04, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.02);
      dur = 0.025; srcs = [n];
    }
    for (const s of srcs) {
      s.start(t0); s.stop(t0 + dur + 0.02);
      activeOneShots.push(s);
      s.onended = () => {
        const i = activeOneShots.indexOf(s);
        if (i >= 0) activeOneShots.splice(i, 1);
      };
    }
  }
  function stopOneShots() {
    for (const s of activeOneShots) { try { s.stop(); } catch (e) { } }
    activeOneShots.length = 0;
  }
  function setActive(on) {
    if (!ok) return;
    master.gain.setTargetAtTime(on ? 0.9 : 0.0, ctx.currentTime, 0.015);
    if (!on) stopOneShots();
  }
  function gearFor(v) {
    for (let i = 0; i < 8; i++) if (v < GEARS[i + 1]) return i;
    return 7;
  }
  const _dir = new THREE.Vector3(), _cv = new THREE.Vector3();
  function frame(t, dtSim, playing) {
    if (!ok) return;
    const shot = shotIndex(t);
    const camPos = camera.position;
    if (prevT >= 0 && dtSim > 0 && dtSim < 0.3) {
      camVel.subVectors(camPos, prevCam).divideScalar(dtSim);
      if (camVel.length() > 250) camVel.set(0, 0, 0);
    } else camVel.set(0, 0, 0);
    prevCam.copy(camPos); prevT = t;
    const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    const lis = ctx.listener;
    if (lis.positionX) {
      lis.positionX.value = camPos.x; lis.positionY.value = camPos.y; lis.positionZ.value = camPos.z;
      lis.forwardX.value = fw.x; lis.forwardY.value = fw.y; lis.forwardZ.value = fw.z;
      lis.upX.value = up.x; lis.upY.value = up.y; lis.upZ.value = up.z;
    } else {
      lis.setPosition(camPos.x, camPos.y, camPos.z);
      lis.setOrientation(fw.x, fw.y, fw.z, up.x, up.y, up.z);
    }
    for (let idx = 0; idx < 2; idx++) {
      const E = cars[idx];
      const pose = idx === 0 ? poseR : poseB;
      const st = pose.st;
      const v = Math.max(0, st.v);
      const gear = gearFor(v);
      if (playing && dtSim > 0 && dtSim < 0.3) {
        if (gear > lastGear[idx]) shiftT[idx] = t;
        if (gear < lastGear[idx]) blipT[idx] = t;
      }
      lastGear[idx] = gear;
      const shiftEnv = clamp(1 - (t - shiftT[idx]) / 0.22, 0, 1);
      const blipEnv = clamp(1 - (t - blipT[idx]) / 0.16, 0, 1);
      let rpm;
      if (t < 3) {
        rpm = 5000 + smoothstep(2.5, 2.97, t) * 4500 + Math.sin(t * 31 + idx * 2) * 180;
      } else if (t < 4.6) {
        rpm = 11400 + Math.sin(t * 47 + idx) * 250;
      } else {
        const lo = GEARS[gear], hi = GEARS[gear + 1];
        rpm = 5000 + clamp((v - lo) / (hi - lo), 0, 1) * 7000;
      }
      rpm *= 1 - 0.16 * shiftEnv;
      rpm += 1500 * blipEnv;
      _cv.copy(pose.f.t).multiplyScalar(st.v);
      _dir.subVectors(pose.pos, camPos);
      const dist = Math.max(0.5, _dir.length());
      _dir.divideScalar(dist);
      const vrel = _cv.dot(_dir) - camVel.dot(_dir);
      const dop = clamp(343 / (343 + vrel), 0.82, 1.22);
      const f0 = rpm / 60 * 3 * dop;
      for (const os of E.oscs) os.o.frequency.setTargetAtTime(f0 * os.mult, ctx.currentTime, 0.02);
      const thr = clamp(st.a / 11, 0, 1);
      const lift = t > BLUE_FINISH ? 0.45 : 1;
      const rpmN = clamp((rpm - 5000) / 7000, 0, 1);
      let vol;
      if (t < 3) vol = 0.10 + smoothstep(2.5, 2.97, t) * 0.12;
      else vol = (0.14 + rpmN * 0.16 + thr * 0.12) * lift;
      vol *= 1 - 0.35 * shiftEnv;
      if (idx === 1 && shot === 4) vol *= 1.5;
      E.vg.gain.setTargetAtTime(vol, ctx.currentTime, 0.03);
      const idle = t < 3.2 ? 0.35 : 0.06;
      E.lfoG.gain.setTargetAtTime(vol * idle, ctx.currentTime, 0.05);
      const cutoff = (idx === 1 && shot === 4) ? 850 : 2600 + thr * 3800 + rpmN * 1600;
      E.lp.frequency.setTargetAtTime(cutoff, ctx.currentTime, 0.04);
      E.nb.frequency.setTargetAtTime(f0 * 4, ctx.currentTime, 0.03);
      E.turbo.frequency.setTargetAtTime(1900 + rpmN * 4600, ctx.currentTime, 0.05);
      E.turboG.gain.setTargetAtTime(0.004 + rpmN * 0.018 * (0.4 + thr), ctx.currentTime, 0.05);
      E.pan.setPosition(pose.pos.x, pose.pos.y + 0.4, pose.pos.z);
      E.hb.frequency.setTargetAtTime(900 + v * 26, ctx.currentTime, 0.05);
      E.hg.gain.setTargetAtTime(Math.pow(clamp(v / 75, 0, 1), 1.5) * 0.11, ctx.currentTime, 0.05);
      const spinGate = smoothstep(3.0, 3.15, t) * (1 - smoothstep(4.4, 5.0, t));
      E.spb.frequency.setTargetAtTime(2300 + Math.sin(t * 40 + idx * 3) * 350, ctx.currentTime, 0.02);
      E.spg.gain.setTargetAtTime(spinGate * 0.10, ctx.currentTime, 0.03);
      const bg = brakeGlow(t, idx);
      const corner = clamp(Math.abs(pose.f.k) * st.v * st.v / 550, 0, 1);
      E.sg.gain.setTargetAtTime((bg * 0.055 + corner * 0.045) * clamp(v / 20, 0, 1), ctx.currentTime, 0.04);
      const spk = sparkActive(st) && t > 3.2 ? 1 : 0;
      E.kg.gain.setTargetAtTime(spk * (0.035 + 0.03 * Math.abs(Math.sin(t * 53 + idx * 7))), ctx.currentTime, 0.02);
      E.sqg.gain.setTargetAtTime(clamp((-st.a - 15) / 22, 0, 1) * 0.022, ctx.currentTime, 0.04);
    }
    const swell = 1 + 1.6 * smoothstep(33, BLUE_FINISH, t);
    const roar = t >= BLUE_FINISH ? 1 + 3.2 * Math.exp(-(t - BLUE_FINISH) / 1.3) : 1;
    crowd.g.gain.setTargetAtTime(0.030 * swell * roar, ctx.currentTime, 0.08);
    crowd.f.frequency.setTargetAtTime(300 + 90 * Math.sin(t * 0.7) + (roar > 1.2 ? 160 : 0), ctx.currentTime, 0.1);
    wind.g.gain.setTargetAtTime(shot === 4 ? 0.02 + clamp(poseB.st.v / 80, 0, 1) * 0.15 : 0.012, ctx.currentTime, 0.08);
    wind.f.frequency.setTargetAtTime(shot === 4 ? 620 : 380, ctx.currentTime, 0.1);
    if (playing && dtSim > 0) {
      for (const ev of events) {
        if (ev.t > lastSim && ev.t <= t) oneShot(ev.type);
      }
    }
    lastSim = t;
  }
  function resetSim(t) { lastSim = t; prevT = -1; lastGear = [0, 0]; shiftT = [-9, -9]; blipT = [-9, -9]; }
  function unlock() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  if (ctx) {
    init();
    ctx.resume().catch(() => { });
  }
  return { frame, setActive, resetSim, unlock };
})();

/* ================= Playback state machine ================= */
const elCountdown = document.getElementById('countdown');
const elScrubber = document.getElementById('scrubber');
const elToggle = document.getElementById('btn-toggle');
const elRefire = document.getElementById('btn-refire');
const elIconPlay = document.getElementById('icon-play');
const elIconPause = document.getElementById('icon-pause');
const pills = Array.from(document.querySelectorAll('.speed-pill'));

let state = 'INIT';
let simTime = 0;
let playbackSpeed = 1.0;
let countdownElapsed = 0;
let holdElapsed = 0;
let lastTs = -1;

function showPlayingIcons() {
  elIconPlay.style.display = 'none';
  elIconPause.style.display = '';
  elToggle.setAttribute('aria-label', 'Pause');
}
function showPausedIcons() {
  elIconPlay.style.display = '';
  elIconPause.style.display = 'none';
  elToggle.setAttribute('aria-label', 'Play');
}
function hideCountdown() {
  elCountdown.style.display = 'none';
  elCountdown.textContent = '';
}
function enterPlaying() {
  state = 'PLAYING';
  showPlayingIcons();
  AudioSys.setActive(true);
}
function enterPaused() {
  state = 'PAUSED';
  showPausedIcons();
  AudioSys.setActive(false);
}
elToggle.addEventListener('click', () => {
  if (state === 'PLAYING') {
    enterPaused();
  } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
    hideCountdown();
    simTime = 0;
    elScrubber.value = '0';
    renderAt(0);
    AudioSys.resetSim(0);
    enterPaused();
  } else if (state === 'PAUSED') {
    enterPlaying();
  } else if (state === 'ENDED') {
    simTime = 0;
    elScrubber.value = '0';
    hideCountdown();
    AudioSys.resetSim(0);
    renderAt(0);
    enterPlaying();
  }
});
elRefire.addEventListener('click', () => {
  hideCountdown();
  simTime = 0;
  countdownElapsed = 0;
  holdElapsed = 0;
  elScrubber.value = '0';
  renderAt(0);
  AudioSys.resetSim(0);
  AudioSys.setActive(false);
  showPlayingIcons();
  state = 'REFIRE_HOLD';
});
elScrubber.addEventListener('input', () => {
  hideCountdown();
  simTime = clamp(parseFloat(elScrubber.value) || 0, 0, DURATION);
  renderAt(simTime);
  AudioSys.resetSim(simTime);
  enterPaused();
});
for (const pill of pills) {
  pill.addEventListener('click', () => {
    playbackSpeed = parseFloat(pill.dataset.speed);
    for (const p of pills) {
      const on = p === pill;
      p.classList.toggle('is-active', on);
      p.setAttribute('aria-checked', on ? 'true' : 'false');
    }
  });
}
window.addEventListener('pointerdown', () => AudioSys.unlock());
window.addEventListener('keydown', () => AudioSys.unlock());
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderAt(simTime);
});

/* ================= Boot & main loop ================= */
renderAt(0);
AudioSys.resetSim(0);
function loop(ts) {
  requestAnimationFrame(loop);
  if (lastTs < 0) { lastTs = ts; }
  const dt = Math.min(Math.max((ts - lastTs) / 1000, 0), 0.1);
  lastTs = ts;
  if (state === 'INIT') {
    state = 'COUNTDOWN';
    countdownElapsed = 0;
    elCountdown.style.display = 'block';
    elCountdown.textContent = '3';
    AudioSys.setActive(false);
    return;
  }
  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3.0) {
      hideCountdown();
      enterPlaying();
    } else {
      elCountdown.style.display = 'block';
      elCountdown.textContent = countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1';
      elScrubber.value = '0';
    }
    return;
  }
  if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1.0) enterPlaying();
    return;
  }
  if (state === 'PLAYING') {
    const prev = simTime;
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    elScrubber.value = simTime.toFixed(3);
    renderAt(simTime);
    AudioSys.frame(simTime, simTime - prev, true);
    if (simTime >= DURATION) {
      simTime = DURATION;
      elScrubber.value = DURATION.toFixed(3);
      renderAt(simTime);
      state = 'ENDED';
      showPausedIcons();
      AudioSys.setActive(false);
    }
    return;
  }
}
requestAnimationFrame(loop);
</script>
