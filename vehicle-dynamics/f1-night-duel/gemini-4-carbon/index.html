<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script>
(function () {
  'use strict';

  const DURATION = 40;
  const SUBSTEP_HZ = 240;
  const TOTAL_SUBSTEPS = DURATION * SUBSTEP_HZ; // 9600

  // ============================================================================
  // 1. DETERMINISTIC PRNG & HASHING (Seed 42 for Simulation, Seed 4242 for Audio)
  // ============================================================================
  function createPRNG(seed) {
    let state = seed >>> 0;
    return function () {
      state = (state + 0x6D2B79F5) >>> 0;
      let t = Math.imul(state ^ (state >>> 15), 1 | state);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashFloat(seed, a, b, c) {
    let h = (seed ^ Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2147483647)) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function smoothstep(e0, e1, x) {
    const t = clamp((x - e0) / (e1 - e0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  const simRand = createPRNG(42);

  // ============================================================================
  // 2. MONOTONE CUBIC HERMITE SPLINE (FRITSCH-CARLSON / PCHIP)
  // ============================================================================
  class PchipSpline {
    constructor(ys) {
      const n = ys.length;
      this.ys = ys;
      const deltas = new Float64Array(n - 1);
      for (let i = 0; i < n - 1; i++) deltas[i] = ys[i + 1] - ys[i];

      const m = new Float64Array(n);
      for (let i = 1; i < n - 1; i++) {
        const d0 = deltas[i - 1];
        const d1 = deltas[i];
        if (d0 * d1 <= 0) {
          m[i] = 0;
        } else {
          m[i] = (2 * d0 * d1) / (d0 + d1);
        }
      }
      const endSlope = (d0, d1) => {
        const s = (3 * d0 - d1) * 0.5;
        if (s * d0 <= 0) return 0;
        if (d0 * d1 <= 0 && Math.abs(s) > Math.abs(3 * d0)) return 3 * d0;
        return s;
      };
      m[0] = endSlope(deltas[0], deltas[1]);
      m[n - 1] = endSlope(deltas[n - 2], deltas[n - 3]);
      this.m = m;
    }

    eval(t) {
      const n = this.ys.length;
      if (t <= 0) return { val: this.ys[0], vel: this.m[0], acc: 0 };
      if (t >= n - 1) return { val: this.ys[n - 1], vel: this.m[n - 1], acc: 0 };
      const i = Math.min(Math.floor(t), n - 2);
      const u = t - i;
      const u2 = u * u;
      const u3 = u2 * u;
      const y0 = this.ys[i], y1 = this.ys[i + 1];
      const m0 = this.m[i], m1 = this.m[i + 1];
      const val = (2 * u3 - 3 * u2 + 1) * y0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * y1 + (u3 - u2) * m1;
      const vel = (6 * u2 - 6 * u) * y0 + (3 * u2 - 4 * u + 1) * m0 + (-6 * u2 + 6 * u) * y1 + (3 * u2 - 2 * u) * m1;
      const acc = (12 * u - 6) * y0 + (6 * u - 4) * m0 + (-12 * u + 6) * y1 + (6 * u - 2) * m1;
      return { val, vel, acc };
    }
  }

  // Standardized car motion checkpoint table (0..40s inclusive)
  const CHECKPOINTS = [
    [-8.0, -2.50, -16.0, 2.50],
    [-8.0, -2.50, -16.0, 2.50],
    [-8.0, -2.50, -16.0, 2.50],
    [-8.0, -2.50, -16.0, 2.50],
    [-2.3, -2.31, -11.5, 2.36],
    [14.8, -1.46, 3.1, 1.65],
    [42.8, -0.47, 29.8, 0.76],
    [81.1, 0.00, 68.2, 0.10],
    [128.9, 0.00, 115.9, 0.00],
    [185.1, 0.00, 172.2, 0.00],
    [248.1, 0.00, 235.3, 0.00],
    [310.5, 0.00, 297.8, 0.00],
    [354.6, 0.00, 342.1, 0.00],
    [403.8, 0.00, 391.4, 0.00],
    [456.5, 0.00, 444.4, 0.00],
    [500.6, 0.00, 488.6, 0.00],
    [553.0, 0.00, 541.2, 0.00],
    [590.7, 0.00, 579.2, 0.00],
    [627.7, 0.00, 616.4, 0.00],
    [674.3, 0.00, 663.2, 0.00],
    [716.6, 0.00, 705.7, 0.00],
    [744.7, 0.00, 734.0, 0.00],
    [782.0, 0.00, 771.5, 0.00],
    [821.0, 0.00, 810.8, 0.00],
    [855.1, 0.00, 845.1, 0.00],
    [899.0, 0.00, 889.1, 0.00],
    [951.7, 0.00, 942.1, 0.00],
    [1007.7, 0.00, 998.2, 0.00],
    [1069.6, 0.00, 1060.3, 0.00],
    [1131.7, 0.00, 1122.5, 0.00],
    [1194.2, 0.00, 1185.1, 0.00],
    [1252.2, 0.00, 1243.1, 0.00],
    [1289.7, 0.00, 1280.7, 0.00],
    [1333.9, 0.00, 1324.9, 0.00],
    [1387.1, -0.87, 1380.4, 1.62],
    [1447.7, -1.20, 1446.1, 3.40],
    [1514.0, -1.20, 1516.7, 3.40],
    [1583.6, -1.20, 1587.1, 3.40],
    [1649.5, -1.20, 1653.4, 3.40],
    [1710.4, -1.20, 1714.9, 3.40],
    [1766.3, -1.20, 1771.1, 3.40]
  ];

  const splineSR = new PchipSpline(CHECKPOINTS.map(r => r[0]));
  const splineDR = new PchipSpline(CHECKPOINTS.map(r => r[1]));
  const splineSB = new PchipSpline(CHECKPOINTS.map(r => r[2]));
  const splineDB = new PchipSpline(CHECKPOINTS.map(r => r[3]));

  // ============================================================================
  // 3. CIRCUIT SPLINE & DENSE ARC-LENGTH LOOKUP TABLE (>= 4,096 SAMPLES)
  // ============================================================================
  const TRACK_CONTROL_POINTS = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(200, 0, 0),
    new THREE.Vector3(320, 5, 60),
    new THREE.Vector3(340, 12, 180),
    new THREE.Vector3(260, 20, 260),
    new THREE.Vector3(120, 15, 240),
    new THREE.Vector3(60, 8, 320),
    new THREE.Vector3(-80, 4, 340),
    new THREE.Vector3(-200, 0, 260),
    new THREE.Vector3(-240, 0, 120),
    new THREE.Vector3(-160, 0, 40),
    new THREE.Vector3(-80, 0, 0)
  ];

  const trackCurve = new THREE.CatmullRomCurve3(TRACK_CONTROL_POINTS, true, 'centripetal');
  trackCurve.arcLengthDivisions = 4096;
  trackCurve.updateArcLengths();
  const LAP_LENGTH = trackCurve.getLength(); // ~ 1551.6525 m

  const TRACK_SAMPLES = 4096;
  const trackPosX = new Float32Array(TRACK_SAMPLES);
  const trackPosY = new Float32Array(TRACK_SAMPLES);
  const trackPosZ = new Float32Array(TRACK_SAMPLES);
  const trackTanX = new Float32Array(TRACK_SAMPLES);
  const trackTanY = new Float32Array(TRACK_SAMPLES);
  const trackTanZ = new Float32Array(TRACK_SAMPLES);
  const trackNrmX = new Float32Array(TRACK_SAMPLES);
  const trackNrmZ = new Float32Array(TRACK_SAMPLES);
  const trackCurv = new Float32Array(TRACK_SAMPLES);

  const WORLD_UP = new THREE.Vector3(0, 1, 0);
  (function buildTrackTable() {
    const p = new THREE.Vector3();
    const pm = new THREE.Vector3();
    const pp = new THREE.Vector3();
    const t = new THREE.Vector3();
    for (let i = 0; i < TRACK_SAMPLES; i++) {
      const u = i / TRACK_SAMPLES;
      trackCurve.getPointAt(u, p);
      const um = ((i - 1 + TRACK_SAMPLES) % TRACK_SAMPLES) / TRACK_SAMPLES;
      const up = ((i + 1) % TRACK_SAMPLES) / TRACK_SAMPLES;
      trackCurve.getPointAt(um, pm);
      trackCurve.getPointAt(up, pp);
      t.subVectors(pp, pm).normalize();

      trackPosX[i] = p.x;
      trackPosY[i] = p.y;
      trackPosZ[i] = p.z;
      trackTanX[i] = t.x;
      trackTanY[i] = t.y;
      trackTanZ[i] = t.z;

      // n(s) = normalize(T(s) x (0, 1, 0)) = (-Tz, 0, Tx) / hypot(Tx, Tz)
      const nx = -t.z;
      const nz = t.x;
      const nl = Math.hypot(nx, nz) || 1;
      trackNrmX[i] = nx / nl;
      trackNrmZ[i] = nz / nl;
    }
    const ds = (LAP_LENGTH / TRACK_SAMPLES) * 8;
    for (let i = 0; i < TRACK_SAMPLES; i++) {
      const im = (i - 4 + TRACK_SAMPLES) % TRACK_SAMPLES;
      const ip = (i + 4) % TRACK_SAMPLES;
      const dtx = (trackTanX[ip] - trackTanX[im]) / ds;
      const dtz = (trackTanZ[ip] - trackTanZ[im]) / ds;
      // Positive curvature = right-hand turn (+n), negative = left-hand turn (-n)
      trackCurv[i] = dtx * trackNrmX[i] + dtz * trackNrmZ[i];
    }
  })();

  function wrapS(s) {
    let m = s % LAP_LENGTH;
    if (m < 0) m += LAP_LENGTH;
    return m;
  }

  function sampleTrack(s, out) {
    const sm = wrapS(s);
    const fIdx = (sm / LAP_LENGTH) * TRACK_SAMPLES;
    const i0 = Math.floor(fIdx) % TRACK_SAMPLES;
    const i1 = (i0 + 1) % TRACK_SAMPLES;
    const f = fIdx - Math.floor(fIdx);

    const cx = trackPosX[i0] + (trackPosX[i1] - trackPosX[i0]) * f;
    const cy = trackPosY[i0] + (trackPosY[i1] - trackPosY[i0]) * f;
    const cz = trackPosZ[i0] + (trackPosZ[i1] - trackPosZ[i0]) * f;

    let tx = trackTanX[i0] + (trackTanX[i1] - trackTanX[i0]) * f;
    let ty = trackTanY[i0] + (trackTanY[i1] - trackTanY[i0]) * f;
    let tz = trackTanZ[i0] + (trackTanZ[i1] - trackTanZ[i0]) * f;
    const tl = Math.hypot(tx, ty, tz) || 1;
    tx /= tl; ty /= tl; tz /= tl;

    let nx = -tz;
    let nz = tx;
    const nl = Math.hypot(nx, nz) || 1;
    nx /= nl; nz /= nl;

    const curv = trackCurv[i0] + (trackCurv[i1] - trackCurv[i0]) * f;

    if (!out) out = {};
    out.cx = cx; out.cy = cy; out.cz = cz;
    out.tx = tx; out.ty = ty; out.tz = tz;
    out.nx = nx; out.ny = 0; out.nz = nz;
    out.curv = curv;
    return out;
  }

  // Exact finish crossing time lookup
  function findCrossingTime(splineS, targetS) {
    let lo = 34.0, hi = 38.0;
    for (let iter = 0; iter < 40; iter++) {
      const mid = (lo + hi) * 0.5;
      if (splineS.eval(mid).val < targetS) lo = mid;
      else hi = mid;
    }
    return (lo + hi) * 0.5;
  }
  const BLUE_FINISH_TIME = findCrossingTime(splineSB, LAP_LENGTH); // ~36.493
  const RED_FINISH_TIME = findCrossingTime(splineSR, LAP_LENGTH);  // ~36.540

  // ============================================================================
  // 4. PRECOMPUTED 1/240s DETERMINISTIC CAR STATE ARRAYS (FOR INSTANT SCRUBBING)
  // ============================================================================
  function buildCarStateTable(splineS, splineD, isRed) {
    const N = TOTAL_SUBSTEPS + 1;
    const dt = 1 / SUBSTEP_HZ;
    const data = {
      s: new Float32Array(N),
      d: new Float32Array(N),
      vs: new Float32Array(N),
      vd: new Float32Array(N),
      acc: new Float32Array(N),
      accSmooth: new Float32Array(N),
      px: new Float32Array(N),
      py: new Float32Array(N),
      pz: new Float32Array(N),
      fx: new Float32Array(N),
      fy: new Float32Array(N),
      fz: new Float32Array(N),
      rx: new Float32Array(N),
      ry: new Float32Array(N),
      rz: new Float32Array(N),
      ux: new Float32Array(N),
      uy: new Float32Array(N),
      uz: new Float32Array(N),
      curv: new Float32Array(N),
      steer: new Float32Array(N),
      pitch: new Float32Array(N),
      roll: new Float32Array(N),
      spinF: new Float32Array(N),
      spinR: new Float32Array(N),
      brakeGlow: new Float32Array(N),
      sparkRate: new Float32Array(N),
      wheelspin: new Float32Array(N),
      gear: new Uint8Array(N),
      rpm: new Float32Array(N),
      shiftDip: new Float32Array(N),
      downBlip: new Float32Array(N),
      throttle: new Float32Array(N)
    };

    const ts = {};
    let spinF = 0;
    let spinR = 0;
    let brakeHeat = 0;
    let pitchFilt = 0;
    let rollFilt = 0;
    let currentGear = 1;
    let shiftTimer = -10;
    let blipTimer = -10;

    // 8-speed gear max speeds (m/s), slightly distinct offset between cars
    const ratioScale = isRed ? 1.0 : 1.018;
    const gearMaxSpeed = [0, 23, 33, 41.5, 49, 55.5, 61.5, 67.0, 76.0].map(v => v * ratioScale);
    const gearMinSpeed = [0, 0, 20.5, 29.5, 37.5, 44.5, 51.0, 56.5, 62.5].map(v => v * ratioScale);

    for (let i = 0; i < N; i++) {
      const t = i * dt;
      const es = splineS.eval(t);
      const ed = splineD.eval(t);

      // Smooth central difference of velocity for mechanical/thermal smoothness
      const vMinus = splineS.eval(Math.max(0, t - 0.16)).vel;
      const vPlus = splineS.eval(Math.min(DURATION, t + 0.16)).vel;
      const accSm = (vPlus - vMinus) / 0.32;

      sampleTrack(es.val, ts);
      const px = ts.cx + ed.val * ts.nx;
      const py = ts.cy;
      const pz = ts.cz + ed.val * ts.nz;

      let fx = ts.tx, fy = ts.ty, fz = ts.tz;
      if (es.vel > 0.5) {
        fx = ts.tx * es.vel + ts.nx * ed.vel;
        fy = ts.ty * es.vel;
        fz = ts.tz * es.vel + ts.nz * ed.vel;
        const fl = Math.hypot(fx, fy, fz) || 1;
        fx /= fl; fy /= fl; fz /= fl;
      }
      // Right = normalize(Forward x WORLD_UP) = (-fz, 0, fx)
      let rx = -fz, ry = 0, rz = fx;
      const rl = Math.hypot(rx, rz) || 1;
      rx /= rl; rz /= rl;
      // Up = Right x Forward
      const ux = ry * fz - rz * fy;
      const uy = rz * fx - rx * fz;
      const uz = rx * fy - ry * fx;

      data.s[i] = es.val;
      data.d[i] = ed.val;
      data.vs[i] = es.vel;
      data.vd[i] = ed.vel;
      data.acc[i] = es.acc;
      data.accSmooth[i] = accSm;
      data.px[i] = px; data.py[i] = py; data.pz[i] = pz;
      data.fx[i] = fx; data.fy[i] = fy; data.fz[i] = fz;
      data.rx[i] = rx; data.ry[i] = ry; data.rz[i] = rz;
      data.ux[i] = ux; data.uy[i] = uy; data.uz[i] = uz;
      data.curv[i] = ts.curv;

      // Steering angle (Ackermann approximation: wheelbase 3.6m * curvature + lane change)
      const laneRate = es.vel > 2 ? (ed.vel / Math.max(8, es.vel)) * 0.45 : 0;
      const targetSteer = clamp(-(ts.curv * 3.6 * 1.9 + laneRate), -0.40, 0.40);
      data.steer[i] = targetSteer;

      // Chassis pitch (dive on braking, slight lift on accel) & outward roll in corners
      const targetPitch = clamp(accSm * 0.00085, -0.022, 0.016);
      const latAccel = es.vel * es.vel * ts.curv;
      const targetRoll = clamp(-latAccel * 0.00055, -0.026, 0.026);
      pitchFilt += (targetPitch - pitchFilt) * Math.min(1, dt * 10);
      rollFilt += (targetRoll - rollFilt) * Math.min(1, dt * 10);
      data.pitch[i] = pitchFilt;
      data.roll[i] = rollFilt;

      // Launch wheelspin between 3.0s and 5.3s (Blue gets more wheelspin at launch)
      let ws = 0;
      if (t >= 3.0 && t <= 5.4) {
        const uws = (t - 3.0) / 2.4;
        ws = Math.sin(uws * Math.PI) * (1 - uws * 0.45) * (isRed ? 0.85 : 1.15);
      }
      data.wheelspin[i] = ws;

      // Wheel rotation (radius = 0.36m)
      if (i > 0) {
        const dsStep = es.vel * dt;
        // Slight front-inside lockup drag on Red car entering hairpin (20.1..20.9s)
        const lockFactor = (isRed && t > 20.05 && t < 20.95) ? 0.55 : 1.0;
        spinF += (dsStep / 0.36) * lockFactor;
        spinR += (dsStep + ws * 16.0 * dt) / 0.36;
      }
      data.spinF[i] = spinF;
      data.spinR[i] = spinR;

      // Brake disc thermal glow
      const decel = Math.max(0, -accSm);
      if (decel > 2.5 && es.vel > 8) {
        const heatIn = clamp((decel - 2.5) / 24, 0, 1.3) * clamp(es.vel / 42, 0.35, 1.2);
        brakeHeat = clamp(brakeHeat + heatIn * dt * 3.4, 0, 1);
      } else {
        // Cool down exponentially; maintain faint warm glow after finish as specified
        const floorGlow = t >= BLUE_FINISH_TIME ? 0.24 * (1 - smoothstep(37.0, 40.5, t) * 0.45) : 0;
        brakeHeat = Math.max(floorGlow, brakeHeat * Math.exp(-dt / 0.85));
        if (t >= BLUE_FINISH_TIME && t < BLUE_FINISH_TIME + 0.8 && brakeHeat < 0.22) {
          brakeHeat = lerp(brakeHeat, 0.22, dt * 4);
        }
      }
      data.brakeGlow[i] = brakeHeat;

      // Sparks when above 200 km/h (55.56 m/s) or braking hard
      const speedKmh = es.vel * 3.6;
      const highSpeedSpark = smoothstep(198, 222, speedKmh) * (t > 36.8 ? 0.35 : 0.9);
      const brakeSpark = smoothstep(13, 26, decel) * smoothstep(120, 165, speedKmh);
      data.sparkRate[i] = clamp(highSpeedSpark + brakeSpark, 0, 1);

      // Audio 8-speed gearbox & RPM
      if (t < 3.0) {
        currentGear = 1;
        // Lumpy idle burble on grid, revving up as 5th light comes on (t = 2.5s)
        const idleWobble = Math.sin(t * (isRed ? 27 : 31)) * 170 + Math.sin(t * (isRed ? 43 : 39)) * 110;
        const revUp = smoothstep(2.42, 2.95, t);
        data.rpm[i] = lerp(4250 + idleWobble, isRed ? 10700 : 10950, revUp);
        data.gear[i] = 1;
        data.throttle[i] = lerp(0.14, 0.88, revUp);
        data.shiftDip[i] = 0;
        data.downBlip[i] = 0;
      } else {
        const effSpeed = es.vel + ws * 13.0;
        if (currentGear < 8 && effSpeed > gearMaxSpeed[currentGear] && (t - shiftTimer) > 0.28) {
          currentGear++;
          shiftTimer = t;
        } else if (currentGear > 1 && effSpeed < gearMinSpeed[currentGear] && (t - blipTimer) > 0.22) {
          currentGear--;
          blipTimer = t;
        }
        const gLo = gearMinSpeed[currentGear] * 0.72;
        const gHi = gearMaxSpeed[currentGear];
        const uGear = clamp((effSpeed - gLo) / Math.max(8, gHi - gLo), 0, 1.04);
        let rpm = lerp(6400, 12050, uGear);
        const sinceUp = t - shiftTimer;
        const sinceDn = t - blipTimer;
        let dip = 0, blip = 0;
        if (sinceUp >= 0 && sinceUp < 0.085) {
          dip = Math.sin((sinceUp / 0.085) * Math.PI);
          rpm -= dip * 650;
        }
        if (sinceDn >= 0 && sinceDn < 0.11) {
          blip = Math.sin((sinceDn / 0.11) * Math.PI);
          rpm += blip * 850;
        }
        let thr = clamp(0.55 + accSm * 0.045, 0.08, 1.0);
        if (t > BLUE_FINISH_TIME) thr = clamp(0.18 - smoothstep(36.5, 39.5, t) * 0.08, 0.08, 0.3);
        data.gear[i] = currentGear;
        data.rpm[i] = clamp(rpm, 4000, 12400);
        data.shiftDip[i] = dip;
        data.downBlip[i] = blip;
        data.throttle[i] = thr;
      }
    }
    return data;
  }

  const redTable = buildCarStateTable(splineSR, splineDR, true);
  const blueTable = buildCarStateTable(splineSB, splineDB, false);

  function sampleCarState(tbl, simTime, out) {
    const t = clamp(simTime, 0, DURATION);
    const fIdx = t * SUBSTEP_HZ;
    const i0 = Math.min(Math.floor(fIdx), TOTAL_SUBSTEPS - 1);
    const i1 = i0 + 1;
    const f = fIdx - i0;
    if (!out) out = {};

    out.s = lerp(tbl.s[i0], tbl.s[i1], f);
    out.d = lerp(tbl.d[i0], tbl.d[i1], f);
    out.vs = lerp(tbl.vs[i0], tbl.vs[i1], f);
    out.vd = lerp(tbl.vd[i0], tbl.vd[i1], f);
    out.acc = lerp(tbl.acc[i0], tbl.acc[i1], f);
    out.accSmooth = lerp(tbl.accSmooth[i0], tbl.accSmooth[i1], f);

    out.px = lerp(tbl.px[i0], tbl.px[i1], f);
    out.py = lerp(tbl.py[i0], tbl.py[i1], f);
    out.pz = lerp(tbl.pz[i0], tbl.pz[i1], f);

    let fx = lerp(tbl.fx[i0], tbl.fx[i1], f);
    let fy = lerp(tbl.fy[i0], tbl.fy[i1], f);
    let fz = lerp(tbl.fz[i0], tbl.fz[i1], f);
    const fl = Math.hypot(fx, fy, fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;

    let rx = -fz, ry = 0, rz = fx;
    const rl = Math.hypot(rx, rz) || 1;
    rx /= rl; rz /= rl;
    const ux = ry * fz - rz * fy;
    const uy = rz * fx - rx * fz;
    const uz = rx * fy - ry * fx;

    out.fx = fx; out.fy = fy; out.fz = fz;
    out.rx = rx; out.ry = ry; out.rz = rz;
    out.ux = ux; out.uy = uy; out.uz = uz;

    out.curv = lerp(tbl.curv[i0], tbl.curv[i1], f);
    out.steer = lerp(tbl.steer[i0], tbl.steer[i1], f);
    out.pitch = lerp(tbl.pitch[i0], tbl.pitch[i1], f);
    out.roll = lerp(tbl.roll[i0], tbl.roll[i1], f);
    out.spinF = lerp(tbl.spinF[i0], tbl.spinF[i1], f);
    out.spinR = lerp(tbl.spinR[i0], tbl.spinR[i1], f);
    out.brakeGlow = lerp(tbl.brakeGlow[i0], tbl.brakeGlow[i1], f);
    out.sparkRate = lerp(tbl.sparkRate[i0], tbl.sparkRate[i1], f);
    out.wheelspin = lerp(tbl.wheelspin[i0], tbl.wheelspin[i1], f);
    out.gear = tbl.gear[i0];
    out.rpm = lerp(tbl.rpm[i0], tbl.rpm[i1], f);
    out.shiftDip = lerp(tbl.shiftDip[i0], tbl.shiftDip[i1], f);
    out.downBlip = lerp(tbl.downBlip[i0], tbl.downBlip[i1], f);
    out.throttle = lerp(tbl.throttle[i0], tbl.throttle[i1], f);
    return out;
  }

  // ============================================================================
  // 5. THREE.JS RENDERER, SCENE, CAMERA & PMREM NIGHT ENVIRONMENT
  // ============================================================================
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.86;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x04070d);
  // Humid night haze: dark blue-grey exponential fog (strictly darker than #1a2230)
  scene.fog = new THREE.FogExp2(0x0c121b, 0.0021);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);

  // Build PMREM Environment Map from an in-memory floodlit night scene
  const envMapTexture = (function buildNightEnvMap() {
    const pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileCubemapShader();
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x050811);

    // Subtle dark ground hemisphere
    const groundGeo = new THREE.SphereGeometry(40, 24, 16, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5);
    const groundMat = new THREE.MeshBasicMaterial({ color: 0x050609, side: THREE.BackSide });
    envScene.add(new THREE.Mesh(groundGeo, groundMat));

    // Faint horizon band
    const horGeo = new THREE.CylinderGeometry(38, 38, 8, 32, 1, true);
    const horMat = new THREE.MeshBasicMaterial({ color: 0x101928, side: THREE.BackSide });
    envScene.add(new THREE.Mesh(horGeo, horMat));

    // Bright floodlight reflector panels in upper hemisphere for crisp clearcoat streaks
    const panelGeo = new THREE.PlaneGeometry(7.5, 2.2);
    const panelMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const warmMat = new THREE.MeshBasicMaterial({ color: 0xffd7a8, side: THREE.DoubleSide });
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + 0.3;
      const elev = 0.55 + (i % 2) * 0.32;
      const r = 26;
      const m = new THREE.Mesh(panelGeo, i === 3 ? warmMat : panelMat);
      m.position.set(Math.cos(ang) * Math.cos(elev) * r, Math.sin(elev) * r, Math.sin(ang) * Math.cos(elev) * r);
      m.lookAt(0, 0, 0);
      envScene.add(m);
    }

    const rt = pmrem.fromScene(envScene, 0.025);
    pmrem.dispose();
    return rt.texture;
  })();
  scene.environment = envMapTexture;

  // ============================================================================
  // 6. IN-MEMORY PROCEDURAL TEXTURES (ALL DETACHED CANVASES, ZERO EXTERNAL ASSETS)
  // ============================================================================
  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  // 6.1 Opaque Night Sky Texture (deep blue-black gradient, stars, moon, warm city horizon glow)
  const skyDomeMesh = (function buildNightSkyDome() {
    const c = makeCanvas(2048, 1024);
    const ctx = c.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 0, 1024);
    grad.addColorStop(0.00, '#020409');
    grad.addColorStop(0.28, '#040812');
    grad.addColorStop(0.46, '#08101e');
    grad.addColorStop(0.51, '#0e1726');
    grad.addColorStop(0.55, '#070b12');
    grad.addColorStop(1.00, '#030508');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2048, 1024);

    // Faint warm city glow on one horizon (+X / +Z azimuth)
    const cityGlow = ctx.createRadialGradient(540, 512, 10, 540, 520, 420);
    cityGlow.addColorStop(0.0, 'rgba(185, 110, 52, 0.24)');
    cityGlow.addColorStop(0.4, 'rgba(120, 72, 38, 0.10)');
    cityGlow.addColorStop(1.0, 'rgba(15, 20, 32, 0.0)');
    ctx.fillStyle = cityGlow;
    ctx.fillRect(0, 200, 1200, 450);

    // Seeded procedural stars in upper sky (y < 500)
    const skyPrng = createPRNG(4201);
    for (let i = 0; i < 1500; i++) {
      const x = skyPrng() * 2048;
      const v = Math.pow(skyPrng(), 1.35) * 0.47; // avoid thick horizon haze
      const y = v * 1024;
      const mag = Math.pow(skyPrng(), 2.6);
      const radius = 0.45 + mag * 1.35;
      const alpha = 0.22 + mag * 0.72;
      const tint = skyPrng();
      if (tint < 0.25) ctx.fillStyle = `rgba(195, 218, 255, ${alpha.toFixed(3)})`;
      else if (tint < 0.42) ctx.fillStyle = `rgba(255, 232, 205, ${alpha.toFixed(3)})`;
      else ctx.fillStyle = `rgba(235, 242, 255, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Moon & subtle humid halo in upper night sky
    const mx = 1480, my = 290;
    const moonHalo = ctx.createRadialGradient(mx, my, 8, mx, my, 110);
    moonHalo.addColorStop(0.0, 'rgba(210, 228, 255, 0.42)');
    moonHalo.addColorStop(0.25, 'rgba(140, 175, 225, 0.14)');
    moonHalo.addColorStop(1.0, 'rgba(20, 32, 55, 0.0)');
    ctx.fillStyle = moonHalo;
    ctx.beginPath();
    ctx.arc(mx, my, 110, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#dce8fa';
    ctx.beginPath();
    ctx.arc(mx, my, 13, 0, Math.PI * 2);
    ctx.fill();
    // Subtle lunar mare shading
    ctx.fillStyle = 'rgba(145, 162, 190, 0.35)';
    ctx.beginPath();
    ctx.arc(mx - 3, my - 2, 5, 0, Math.PI * 2);
    ctx.arc(mx + 4, my + 3, 3.5, 0, Math.PI * 2);
    ctx.fill();

    const tex = new THREE.CanvasTexture(c);
    tex.encoding = THREE.sRGBEncoding;
    const geo = new THREE.SphereGeometry(2200, 48, 32);
    const mat = new THREE.MeshBasicMaterial({
      map: tex,
      side: THREE.BackSide,
      fog: false,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.renderOrder = -1000;
    mesh.frustumCulled = false;
    scene.add(mesh);
    return mesh;
  })();

  // 6.2 Floodlight Mast Schedule (placed every ~64.65m around the 1551.65m circuit, alternating sides)
  const NUM_MASTS = 24;
  const floodMasts = [];
  (function planFloodMasts() {
    // Fixed camera positions to ensure no mast pole ever blocks a broadcast shot
    const camGuards = [
      { s: 400, side: -1 },
      { s: 725, side: 1 },
      { s: 1300, side: -1 },
      { s: 1532, side: 1 }
    ];
    for (let i = 0; i < NUM_MASTS; i++) {
      let s = (i + 0.35) * (LAP_LENGTH / NUM_MASTS);
      let side = (i % 2 === 0) ? 1 : -1;
      for (const g of camGuards) {
        const ds = Math.abs(((s - g.s + LAP_LENGTH * 1.5) % LAP_LENGTH) - LAP_LENGTH * 0.5);
        if (ds < 16 && side === g.side) {
          s += 18;
        }
      }
      const ts = sampleTrack(s);
      const dPole = side * 11.2;
      const dHead = side * 7.8;
      const headHeight = 29.5;
      floodMasts.push({
        s: wrapS(s),
        side,
        poleX: ts.cx + ts.nx * dPole,
        poleY: ts.cy,
        poleZ: ts.cz + ts.nz * dPole,
        headX: ts.cx + ts.nx * dHead,
        headY: ts.cy + headHeight,
        headZ: ts.cz + ts.nz * dHead,
        aimX: ts.cx - ts.nx * side * 1.2,
        aimY: ts.cy,
        aimZ: ts.cz - ts.nz * side * 1.2,
        nx: ts.nx,
        nz: ts.nz
      });
    }
  })();

  // 6.3 Damp Asphalt Grain & Roughness Textures + Baked Circuit Floodlight Pool Map
  const asphaltDetailMaps = (function buildAsphaltTextures() {
    // High-frequency damp asphalt micro-grain & wet streak roughness map (tiled)
    const sz = 512;
    const cRough = makeCanvas(sz, sz);
    const ctxR = cRough.getContext('2d');
    const imgR = ctxR.createImageData(sz, sz);
    const cBump = makeCanvas(sz, sz);
    const ctxB = cBump.getContext('2d');
    const imgB = ctxB.createImageData(sz, sz);
    const prng = createPRNG(4202);

    // Wet patches along racing line
    for (let y = 0; y < sz; y++) {
      const uCross = y / sz; // 0..1 across road width
      const racingLineWet = Math.exp(-Math.pow((uCross - 0.5) * 3.2, 2)) * 0.08;
      for (let x = 0; x < sz; x++) {
        const idx = (y * sz + x) * 4;
        const grain = prng();
        const puddleWave = Math.sin(x * 0.045 + Math.sin(y * 0.07) * 2.0) * Math.cos(y * 0.055 - x * 0.02);
        // Low roughness (0.14..0.34) for wet sheen that stretches floodlight & car-light highlights
        const roughVal = clamp(0.24 - racingLineWet + puddleWave * 0.055 + (grain - 0.5) * 0.08, 0.11, 0.38);
        const rv = Math.round(roughVal * 255);
        imgR.data[idx] = rv;
        imgR.data[idx + 1] = rv;
        imgR.data[idx + 2] = rv;
        imgR.data[idx + 3] = 255;

        const bv = Math.round(clamp(128 + (grain - 0.5) * 140 + puddleWave * 22, 0, 255));
        imgB.data[idx] = bv;
        imgB.data[idx + 1] = bv;
        imgB.data[idx + 2] = bv;
        imgB.data[idx + 3] = 255;
      }
    }
    ctxR.putImageData(imgR, 0, 0);
    ctxB.putImageData(imgB, 0, 0);

    const roughTex = new THREE.CanvasTexture(cRough);
    roughTex.wrapS = roughTex.wrapT = THREE.RepeatWrapping;
    roughTex.repeat.set(220, 3);

    const bumpTex = new THREE.CanvasTexture(cBump);
    bumpTex.wrapS = bumpTex.wrapT = THREE.RepeatWrapping;
    bumpTex.repeat.set(220, 3);

    // Circuit-wide baked floodlight pool texture (u = s / L, v = (d + 7)/14)
    // Produces bright pools under each mast and near-black (< 14% sRGB) asphalt in the gaps!
    const wPool = 1024, hPool = 64;
    const cPool = makeCanvas(wPool, hPool);
    const ctxP = cPool.getContext('2d');
    const imgP = ctxP.createImageData(wPool, hPool);
    const prng2 = createPRNG(4203);

    for (let y = 0; y < hPool; y++) {
      const d = ((y + 0.5) / hPool - 0.5) * 14.0; // -7..+7m
      // White painted track edge lines at +/- 6.65m
      const edgeLine = (Math.abs(Math.abs(d) - 6.62) < 0.16) ? 1.0 : 0.0;
      // Subtle darker rubbered racing line
      const rubber = 1.0 - Math.exp(-Math.pow(d / 2.6, 2)) * 0.16;

      for (let x = 0; x < wPool; x++) {
        const s = (x / wPool) * LAP_LENGTH;
        let poolSum = 0.0;
        for (let m = 0; m < floodMasts.length; m++) {
          const mast = floodMasts[m];
          let ds = s - mast.s;
          if (ds > LAP_LENGTH * 0.5) ds -= LAP_LENGTH;
          if (ds < -LAP_LENGTH * 0.5) ds += LAP_LENGTH;
          if (Math.abs(ds) < 55) {
            const dd = d - mast.side * 1.4;
            const atten = Math.exp(-(ds * ds) / (2 * 15.5 * 15.5) - (dd * dd) / (2 * 6.8 * 6.8));
            poolSum += atten;
          }
        }
        // Subtle boost near start/finish gantry & grandstand (s near 0..120 or > 1510)
        const dsMain = s > 1490 ? s - LAP_LENGTH : s;
        if (dsMain > -35 && dsMain < 140) {
          poolSum += 0.18 * Math.exp(-Math.pow((dsMain - 40) / 80, 2));
        }

        const nse = (prng2() - 0.5) * 0.015;
        // Base unlit damp asphalt is very dark (#111419 -> sRGB ~8%), rising in floodlight pools
        const baseLum = clamp((0.055 + poolSum * 0.27 + nse) * rubber, 0.04, 0.42);
        let r = baseLum * 0.92;
        let g = baseLum * 0.97;
        let b = baseLum * 1.08;

        if (edgeLine > 0) {
          const lineLum = clamp(0.22 + poolSum * 0.68, 0.18, 0.92);
          r = lineLum * 0.95;
          g = lineLum * 0.97;
          b = lineLum * 1.0;
        }

        const idx = (y * wPool + x) * 4;
        imgP.data[idx] = Math.round(clamp(r, 0, 1) * 255);
        imgP.data[idx + 1] = Math.round(clamp(g, 0, 1) * 255);
        imgP.data[idx + 2] = Math.round(clamp(b, 0, 1) * 255);
        imgP.data[idx + 3] = 255;
      }
    }
    ctxP.putImageData(imgP, 0, 0);
    const poolTex = new THREE.CanvasTexture(cPool);
    poolTex.encoding = THREE.sRGBEncoding;
    poolTex.wrapS = THREE.RepeatWrapping;
    poolTex.wrapT = THREE.ClampToEdgeWrapping;

    // Subtle emissive pool map so distant road pools read clearly through night haze
    const cEmiss = makeCanvas(wPool, hPool);
    const ctxE = cEmiss.getContext('2d');
    const imgE = ctxE.createImageData(wPool, hPool);
    for (let i = 0; i < imgP.data.length; i += 4) {
      // Nonlinear curve so dark gaps stay near zero while mast pools glow gently
      const vR = Math.pow(imgP.data[i] / 255, 1.85) * 0.72;
      const vG = Math.pow(imgP.data[i + 1] / 255, 1.85) * 0.76;
      const vB = Math.pow(imgP.data[i + 2] / 255, 1.85) * 0.86;
      imgE.data[i] = Math.round(clamp(vR, 0, 1) * 255);
      imgE.data[i + 1] = Math.round(clamp(vG, 0, 1) * 255);
      imgE.data[i + 2] = Math.round(clamp(vB, 0, 1) * 255);
      imgE.data[i + 3] = 255;
    }
    ctxE.putImageData(imgE, 0, 0);
    const emissTex = new THREE.CanvasTexture(cEmiss);
    emissTex.encoding = THREE.sRGBEncoding;
    emissTex.wrapS = THREE.RepeatWrapping;
    emissTex.wrapT = THREE.ClampToEdgeWrapping;

    return { roughTex, bumpTex, poolTex, emissTex };
  })();

  // 6.4 Carbon Fibre 2x2 Twill Texture
  const carbonTextures = (function buildCarbonTextures() {
    const c = makeCanvas(64, 64);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#14171c';
    ctx.fillRect(0, 0, 64, 64);
    for (let y = 0; y < 64; y += 4) {
      for (let x = 0; x < 64; x += 4) {
        const shift = ((x / 4 + y / 4) % 2 === 0);
        ctx.fillStyle = shift ? '#252a33' : '#101318';
        ctx.fillRect(x, y, 3, 3);
      }
    }
    const map = new THREE.CanvasTexture(c);
    map.encoding = THREE.sRGBEncoding;
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(18, 18);

    const bump = new THREE.CanvasTexture(c);
    bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
    bump.repeat.set(18, 18);

  // ============================================================================
  // 7. BUFFER GEOMETRY MERGER HELPER (Three.js r128 compatible)
  // ============================================================================
  function mergeBufferGeometries(geometries) {
    let totalVerts = 0;
    let totalIndices = 0;
    let hasUV = true;
    let hasColor = false;

    const prepared = geometries.map(g => {
      const geom = g.index ? g : g.clone();
      if (!geom.attributes.normal) geom.computeVertexNormals();
      if (!geom.attributes.uv) hasUV = false;
      if (geom.attributes.color) hasColor = true;
      totalVerts += geom.attributes.position.count;
      totalIndices += geom.index ? geom.index.count : geom.attributes.position.count;
      return geom;
    });

    const posArr = new Float32Array(totalVerts * 3);
    const nrmArr = new Float32Array(totalVerts * 3);
    const uvArr = hasUV ? new Float32Array(totalVerts * 2) : null;
    const colArr = hasColor ? new Float32Array(totalVerts * 3) : null;
    const idxArr = totalVerts > 65535 ? new Uint32Array(totalIndices) : new Uint16Array(totalIndices);

    let vOffset = 0;
    let iOffset = 0;
    for (const g of prepared) {
      const pos = g.attributes.position.array;
      const nrm = g.attributes.normal.array;
      const count = g.attributes.position.count;
      posArr.set(pos, vOffset * 3);
      nrmArr.set(nrm, vOffset * 3);
      if (hasUV) uvArr.set(g.attributes.uv.array, vOffset * 2);
      if (hasColor) {
        if (g.attributes.color) colArr.set(g.attributes.color.array, vOffset * 3);
        else colArr.fill(1, vOffset * 3, (vOffset + count) * 3);
      }
      if (g.index) {
        const idx = g.index.array;
        for (let k = 0; k < idx.length; k++) idxArr[iOffset + k] = idx[k] + vOffset;
        iOffset += idx.length;
      } else {
        for (let k = 0; k < count; k++) idxArr[iOffset + k] = k + vOffset;
        iOffset += count;
      }
      vOffset += count;
    }

    const merged = new THREE.BufferGeometry();
    merged.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    merged.setAttribute('normal', new THREE.BufferAttribute(nrmArr, 3));
    if (hasUV) merged.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
    if (hasColor) merged.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    merged.setIndex(new THREE.BufferAttribute(idxArr, 1));
    return merged;
  }

  // ============================================================================
  // 8. CIRCUIT, ROAD, KERBS, BARRIERS, FENCING, GANTRY, GRANDSTAND & HILLS
  // ============================================================================
  let startLightPodMeshes = [];
  let startLightFlares = [];
  let startGantrySpot = null;

  (function buildCircuitAndWorld() {
    const RINGS = 1024;
    const ROAD_HALF_W = 7.0; // 14m wide asphalt (+/- 7m along n)

    // 8.1 Damp Asphalt Road Mesh (14m wide with cross-profile subdivisions)
    const COLS = 8;
    const roadVerts = new Float32Array((RINGS + 1) * (COLS + 1) * 3);
    const roadNrms = new Float32Array((RINGS + 1) * (COLS + 1) * 3);
    const roadUVs = new Float32Array((RINGS + 1) * (COLS + 1) * 2);
    const roadIndices = new Uint32Array(RINGS * COLS * 6);
    const ts = {};

    for (let i = 0; i <= RINGS; i++) {
      const u = i / RINGS;
      const s = u * LAP_LENGTH;
      sampleTrack(s, ts);
      for (let j = 0; j <= COLS; j++) {
        const v = j / COLS;
        const d = (v - 0.5) * 2 * ROAD_HALF_W;
        // Slight realistic 2cm crown in middle for drainage
        const crown = (1 - Math.pow((v - 0.5) * 2, 2)) * 0.025;
        const idx = i * (COLS + 1) + j;
        roadVerts[idx * 3] = ts.cx + ts.nx * d;
        roadVerts[idx * 3 + 1] = ts.cy + crown;
        roadVerts[idx * 3 + 2] = ts.cz + ts.nz * d;
        roadNrms[idx * 3] = 0;
        roadNrms[idx * 3 + 1] = 1;
        roadNrms[idx * 3 + 2] = 0;
        roadUVs[idx * 2] = u;
        roadUVs[idx * 2 + 1] = v;
      }
    }
    let ptr = 0;
    for (let i = 0; i < RINGS; i++) {
      for (let j = 0; j < COLS; j++) {
        const a = i * (COLS + 1) + j;
        const b = a + 1;
        const c = (i + 1) * (COLS + 1) + j;
        const d = c + 1;
        roadIndices[ptr++] = a; roadIndices[ptr++] = b; roadIndices[ptr++] = c;
        roadIndices[ptr++] = b; roadIndices[ptr++] = d; roadIndices[ptr++] = c;
      }
    }
    const roadGeo = new THREE.BufferGeometry();
    roadGeo.setAttribute('position', new THREE.BufferAttribute(roadVerts, 3));
    roadGeo.setAttribute('normal', new THREE.BufferAttribute(roadNrms, 3));
    roadGeo.setAttribute('uv', new THREE.BufferAttribute(roadUVs, 2));
    roadGeo.setIndex(new THREE.BufferAttribute(roadIndices, 1));
    roadGeo.computeVertexNormals();

    const roadMat = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      map: asphaltDetailMaps.poolTex,
      emissive: 0x9ab8e8,
      emissiveMap: asphaltDetailMaps.emissTex,
      emissiveIntensity: 0.28,
      roughnessMap: asphaltDetailMaps.roughTex,
      roughness: 0.92,
      metalness: 0.08,
      bumpMap: asphaltDetailMaps.bumpTex,
      bumpScale: 0.012,
      envMap: envMapTexture,
      envMapIntensity: 0.75
    });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    // 8.2 Asphalt Run-Off Verge (+/- 7m to +/- 9.2m) & Dark Rolling Hills Terrain
    const vergeVerts = [];
    const vergeNrms = [];
    const vergeColors = [];
    const vergeIdx = [];

    // Outer offset distances from centreline (left & right ribbons expanding into rolling hills)
    const hillOffsets = [7.0, 9.2, 16.0, 34.0, 75.0, 160.0, 340.0, 620.0];
    const T_RINGS = 320;
    const H_COLS = hillOffsets.length;

    for (const side of [-1, 1]) {
      const baseV = vergeVerts.length / 3;
      for (let i = 0; i <= T_RINGS; i++) {
        const u = i / T_RINGS;
        const s = u * LAP_LENGTH;
        sampleTrack(s, ts);
        for (let j = 0; j < H_COLS; j++) {
          const dist = hillOffsets[j];
          const d = side * dist;
          const wx = ts.cx + ts.nx * d;
          const wz = ts.cz + ts.nz * d;

          let wy = ts.cy - 0.03;
          if (dist <= 9.2) {
            // Flat run-off apron between road edge and barrier
            wy = ts.cy - 0.02;
          } else {
            // Smoothly blend from track elevation into dark rolling hills (suppressing inside loop overlap)
            const blend = smoothstep(14.0, 95.0, dist);
            const insideLoop = (side > 0 && dist > 30); // +n points outward or inward? Let's check: track loops counter-clockwise/clockwise!
            // Actually track goes (0,0)->(200,0)->(340,180)->(-80,340)->(-240,120)->(0,0): counter-clockwise in XZ (+X then +Z),
            // so +n = (-Tz, 0, Tx) at (0,0) is +Z (INSIDE the loop!), and -n is -Z (OUTSIDE the loop!).
            const maxD = side > 0 ? Math.min(dist, 58.0) : dist;
            const effX = ts.cx + ts.nx * side * maxD;
            const effZ = ts.cz + ts.nz * side * maxD;
            const hillWave = (
              Math.sin(effX * 0.0085 + 0.7) * Math.cos(effZ * 0.0075 - 0.4) * 26 +
              Math.sin(effX * 0.019 - effZ * 0.015 + 1.9) * 12 +
              16
            );
            if (side > 0) {
              // Infield gently undulates without poking over opposite side of circuit
              const infieldWave = Math.sin(effX * 0.02 + effZ * 0.02) * 2.2 - 1.2;
              wy = lerp(ts.cy - 0.05, Math.min(ts.cy + 2.5, 4.0 + infieldWave), smoothstep(12, 45, maxD));
            } else {
              // Outfield rises into dramatic dark hills around the circuit
              // Keep clear near grandstand (-Z main straight)
              const nearMain = (effZ < 15 && effZ > -55 && effX > -70 && effX < 185) ? 0.08 : 1.0;
              wy = ts.cy - 0.1 + blend * hillWave * nearMain;
            }
          }
          vergeVerts.push(wx, wy, wz);
          vergeNrms.push(0, 1, 0);

          // Dark grass/verge color (unlit terrain fades into darkness)
          const isApron = dist <= 9.2;
          if (isApron) {
            vergeColors.push(0.055, 0.068, 0.062);
          } else {
            const darkFactor = 1.0 - smoothstep(12, 220, dist) * 0.65;
            vergeColors.push(0.032 * darkFactor, 0.044 * darkFactor, 0.038 * darkFactor);
          }
        }
      }
      for (let i = 0; i < T_RINGS; i++) {
        for (let j = 0; j < H_COLS - 1; j++) {
          // On inside (+side), cap triangulation once maxD clamps
          if (side > 0 && j >= 4) continue;
          const a = baseV + i * H_COLS + j;
          const b = a + 1;
          const c = baseV + (i + 1) * H_COLS + j;
          const d = c + 1;
          if (side > 0) {
            vergeIdx.push(a, b, c, b, d, c);
          } else {
            vergeIdx.push(a, c, b, b, c, d);
          }
        }
      }
    }
    // Center infield ground patch covering central island seamlessly
    const infieldGeo = new THREE.PlaneGeometry(520, 380, 40, 30);
    infieldGeo.rotateX(-Math.PI / 2);
    const inPos = infieldGeo.attributes.position;
    const inCol = new Float32Array(inPos.count * 3);
    for (let k = 0; k < inPos.count; k++) {
      const ix = inPos.getX(k) + 45;
      const iz = inPos.getZ(k) + 170;
      const iy = -1.8 + Math.sin(ix * 0.018) * Math.cos(iz * 0.018) * 1.4;
      inPos.setXYZ(k, ix, iy, iz);
      inCol[k * 3] = 0.025;
      inCol[k * 3 + 1] = 0.034;
      inCol[k * 3 + 2] = 0.030;
    }
    infieldGeo.setAttribute('color', new THREE.BufferAttribute(inCol, 3));
    infieldGeo.computeVertexNormals();

    const terrainGeo = new THREE.BufferGeometry();
    terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(vergeVerts, 3));
    terrainGeo.setAttribute('normal', new THREE.Float32BufferAttribute(vergeNrms, 3));
    terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(vergeColors, 3));
    terrainGeo.setIndex(vergeIdx);
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.95,
      metalness: 0.0,
      envMapIntensity: 0.12
    });
    scene.add(new THREE.Mesh(terrainGeo, terrainMat));
    scene.add(new THREE.Mesh(infieldGeo, terrainMat));

    // 8.3 Red-and-White Serrated Corner Kerbs
    const kerbGeos = [];
    const KERB_SEGS = 1280;
    const dsKerb = LAP_LENGTH / KERB_SEGS;
    for (let i = 0; i < KERB_SEGS; i++) {
      const s0 = i * dsKerb;
      const s1 = (i + 1) * dsKerb;
      const t0 = sampleTrack(s0);
      const t1 = sampleTrack(s1);
      const absC = Math.abs(t0.curv);
      if (absC < 0.0036) continue;

      // Place kerb on inside apex and outside exit of corners
      const insideSide = t0.curv > 0 ? 1 : -1;
      for (const kSide of [insideSide, -insideSide]) {
        if (kSide === -insideSide && absC < 0.0048) continue;
        const isRedBlock = (Math.floor(s0 / 1.65) % 2 === 0);
        const col = isRedBlock ? [0.76, 0.09, 0.14] : [0.86, 0.88, 0.91];

        const dInner = kSide * 6.82;
        const dOuter = kSide * 7.85;
        const p0i = [t0.cx + t0.nx * dInner, t0.cy + 0.015, t0.cz + t0.nz * dInner];
        const p0o = [t0.cx + t0.nx * dOuter, t0.cy + 0.065, t0.cz + t0.nz * dOuter];
        const p1i = [t1.cx + t1.nx * dInner, t1.cy + 0.015, t1.cz + t1.nz * dInner];
        const p1o = [t1.cx + t1.nx * dOuter, t1.cy + 0.065, t1.cz + t1.nz * dOuter];

        const g = new THREE.BufferGeometry();
        const pos = new Float32Array([
          ...p0i, ...p0o, ...p1i, ...p1o
        ]);
        const cols = new Float32Array([
          ...col, ...col, ...col, ...col
        ]);
        g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
        g.setIndex(kSide > 0 ? [0, 1, 2, 1, 3, 2] : [0, 2, 1, 1, 2, 3]);
        g.computeVertexNormals();
        kerbGeos.push(g);
      }
    }
    if (kerbGeos.length > 0) {
      const kerbMesh = new THREE.Mesh(
        mergeBufferGeometries(kerbGeos),
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.36,
          metalness: 0.05,
          envMap: envMapTexture,
          envMapIntensity: 0.45
        })
      );
      kerbMesh.receiveShadow = true;
      scene.add(kerbMesh);
    }

    // 8.4 Chequered Start/Finish Line at s = 0 & Two Painted Grid Boxes (s=-8 d=-2.5, s=-16 d=+2.5)
    (function buildStartFinishAndGridMarkings() {

    // 8.5 Continuous Painted Steel Barriers (+/- 9.0m) & Galvanised Catch Fencing
    (function buildBarriersAndFencing() {
      const B_RINGS = 512;
      const barrierVerts = [];
      const barrierUVs = [];
      const barrierCols = [];
      const barrierIdx = [];

      const fenceVerts = [];
      const fenceUVs = [];
      const fenceIdx = [];

      const postGeos = [];
      const postProto = new THREE.BoxGeometry(0.11, 1.0, 0.11);

      // Camera sightline slots where catch-fence height dips for broadcast marshal openings
      function getFenceHeight(s, side) {
        // Shot 3: s=400, side=-1 | Shot 5: s=725, side=+1 | Shot 7: s=1300, side=-1 | Shot 8: main straight +1
        const checkSlot = (center, halfW, targetSide) => {
          if (side !== targetSide) return false;
          const ds = Math.abs(((s - center + LAP_LENGTH * 1.5) % LAP_LENGTH) - LAP_LENGTH * 0.5);
          return ds < halfW;
        };
        if (checkSlot(400, 34, -1)) return 0.72;
        if (checkSlot(725, 34, 1)) return 0.72;
        if (checkSlot(1300, 38, -1)) return 0.68;
        if (checkSlot(1538, 42, 1)) return 0.75; // pit wall / finish camera opening
        return 3.25;
      }

      for (const side of [-1, 1]) {
        const dBar = side * 9.0;
        const bBase = barrierVerts.length / 3;
        const fBase = fenceVerts.length / 3;

        for (let i = 0; i <= B_RINGS; i++) {
          const u = i / B_RINGS;
          const s = u * LAP_LENGTH;
          sampleTrack(s, ts);

          const bx = ts.cx + ts.nx * dBar;
          const by = ts.cy;
          const bz = ts.cz + ts.nz * dBar;
          const barH = (Math.abs(((s - 1300 + LAP_LENGTH * 1.5) % LAP_LENGTH) - LAP_LENGTH * 0.5) < 40 && side === -1) ? 0.66 : 0.78;

          // Triple-rail profile (bottom, mid-indent, top)
          const dShift = -side * 0.08;
          barrierVerts.push(
            bx, by - 0.05, bz,
            bx + ts.nx * dShift, by + barH * 0.5, bz + ts.nz * dShift,
            bx, by + barH, bz
          );
          barrierUVs.push(u * 180, 0, u * 180, 0.5, u * 180, 1);

          // Painted steel barrier with blue/white motorsport chevron blocks on corners
          const stripe = (Math.floor(s / 6.0) % 2 === 0);
          const cTop = stripe ? [0.16, 0.22, 0.32] : [0.58, 0.62, 0.68];
          const cBot = [0.22, 0.25, 0.30];
          barrierCols.push(...cBot, ...cTop, ...cTop);

          // Catch fence above barrier
          const fH = getFenceHeight(s, side);
          fenceVerts.push(bx, by + barH, bz, bx, by + fH, bz);
          fenceUVs.push(u * 260, 0, u * 260, Math.max(0.05, (fH - barH) * 0.8));

          // Galvanised fence stanchion posts every ~12m (where fence is full height)
          if (i < B_RINGS && i % 4 === 0 && fH > 1.5) {
            const pg = postProto.clone();
            pg.scale(1, fH, 1);
            pg.translate(bx + ts.nx * side * 0.08, by + fH * 0.5, bz + ts.nz * side * 0.08);
            postGeos.push(pg);
          }
        }

        for (let i = 0; i < B_RINGS; i++) {
          for (let r = 0; r < 2; r++) {
            const a = bBase + i * 3 + r;
            const b = a + 1;
            const c = bBase + (i + 1) * 3 + r;
            const d = c + 1;
            if (side > 0) barrierIdx.push(a, c, b, b, c, d);
            else barrierIdx.push(a, b, c, b, d, c);
          }
          const fa = fBase + i * 2;
          const fb = fa + 1;
          const fc = fBase + (i + 1) * 2;
          const fd = fc + 1;
          fenceIdx.push(fa, fb, fc, fb, fd, fc);
        }
      }

      const barGeo = new THREE.BufferGeometry();
      barGeo.setAttribute('position', new THREE.Float32BufferAttribute(barrierVerts, 3));
      barGeo.setAttribute('uv', new THREE.Float32BufferAttribute(barrierUVs, 2));
      barGeo.setAttribute('color', new THREE.Float32BufferAttribute(barrierCols, 3));
      barGeo.setIndex(barrierIdx);
      barGeo.computeVertexNormals();

      const barMat = new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.38,
        metalness: 0.62,
        side: THREE.DoubleSide,
        envMap: envMapTexture,
        envMapIntensity: 0.65
      });
      scene.add(new THREE.Mesh(barGeo, barMat));

      const fGeo = new THREE.BufferGeometry();
      fGeo.setAttribute('position', new THREE.Float32BufferAttribute(fenceVerts, 3));
      fGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fenceUVs, 2));
      fGeo.setIndex(fenceIdx);
      fGeo.computeVertexNormals();

      const fMat = new THREE.MeshStandardMaterial({
        map: fenceTexture,
        transparent: true,
        opacity: 0.78,
        roughness: 0.45,
        metalness: 0.75,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      scene.add(new THREE.Mesh(fGeo, fMat));

      if (postGeos.length > 0) {
        const postMesh = new THREE.Mesh(
          mergeBufferGeometries(postGeos),
          new THREE.MeshStandardMaterial({ color: 0x525b68, roughness: 0.42, metalness: 0.78 })
        );
        scene.add(postMesh);
      }
    })();

  // ============================================================================
  // 9. HIGH-DETAIL FORMULA 1 SINGLE-SEATER BUILDER (> 100 SHAPED MESHES PER CAR)
  // ============================================================================
  function createLoftedBodyGeometry(sections) {
    // sections: array of { x, yBot, yTop, halfWBot, halfWTop, u }
    const RING_VERTS = 13;
    const numSec = sections.length;
    const totalVerts = numSec * RING_VERTS + 2;
    const pos = new Float32Array(totalVerts * 3);
    const uvs = new Float32Array(totalVerts * 2);
    const indices = [];
    const dxSign = (sections[numSec - 1].x >= sections[0].x) ? 1 : -1;

    for (let s = 0; s < numSec; s++) {
      const sec = sections[s];
      const yMid = (sec.yBot + sec.yTop) * 0.5;
      const yHalf = Math.max(0.005, (sec.yTop - sec.yBot) * 0.5);
      for (let k = 0; k < RING_VERTS; k++) {
        const v = k / (RING_VERTS - 1);
        const ang = (v - 0.5) * Math.PI * 2; // -PI..+PI around cross-section (0 = top center)
        const ca = Math.cos(ang);
        const sa = Math.sin(ang);
        const topFactor = clamp((ca + 1) * 0.5, 0, 1);
        const hw = lerp(sec.halfWBot, sec.halfWTop, topFactor);
        const py = yMid + Math.sign(ca) * Math.pow(Math.abs(ca), 0.78) * yHalf;
        const pz = Math.sign(sa) * Math.pow(Math.abs(sa), 0.82) * hw;

        const idx = s * RING_VERTS + k;
        pos[idx * 3] = sec.x;
        pos[idx * 3 + 1] = py;
        pos[idx * 3 + 2] = pz;
        uvs[idx * 2] = sec.u !== undefined ? sec.u : (s / (numSec - 1));
        uvs[idx * 2 + 1] = v;
      }
    }

    // Endcap centers at s = 0 and s = numSec - 1
    const cStart = numSec * RING_VERTS;
    const cEnd = cStart + 1;
    pos[cStart * 3] = sections[0].x;
    pos[cStart * 3 + 1] = (sections[0].yBot + sections[0].yTop) * 0.5;
    pos[cStart * 3 + 2] = 0;
    uvs[cStart * 2] = 0; uvs[cStart * 2 + 1] = 0.5;

    pos[cEnd * 3] = sections[numSec - 1].x;
    pos[cEnd * 3 + 1] = (sections[numSec - 1].yBot + sections[numSec - 1].yTop) * 0.5;
    pos[cEnd * 3 + 2] = 0;
    uvs[cEnd * 2] = 1; uvs[cEnd * 2 + 1] = 0.5;

    for (let s = 0; s < numSec - 1; s++) {
      for (let k = 0; k < RING_VERTS - 1; k++) {
        const a = s * RING_VERTS + k;
        const b = a + 1;
        const c = (s + 1) * RING_VERTS + k;
        const d = c + 1;
        if (dxSign > 0) {
          indices.push(a, b, c, b, d, c);
        } else {
          indices.push(a, c, b, b, c, d);
        }
      }
    }
    const lastBase = (numSec - 1) * RING_VERTS;
    for (let k = 0; k < RING_VERTS - 1; k++) {
      if (dxSign > 0) {
        indices.push(cStart, k + 1, k);
        indices.push(cEnd, lastBase + k, lastBase + k + 1);
      } else {
        indices.push(cStart, k, k + 1);
        indices.push(cEnd, lastBase + k + 1, lastBase + k);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  function createStrutMesh(p0, p1, radius, material) {
    const v0 = new THREE.Vector3(...p0);
    const v1 = new THREE.Vector3(...p1);
    const dir = new THREE.Vector3().subVectors(v1, v0);
    const len = dir.length();
    const geo = new THREE.CylinderGeometry(radius, radius, len, 8);
    // Flatten slightly for aero wishbone cross-section
    geo.scale(1.8, 1.0, 0.55);
    const mesh = new THREE.Mesh(geo, material);
    mesh.position.copy(v0).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(WORLD_UP, dir.normalize());
    mesh.castShadow = true;
    return mesh;
  }

    // -------------------------------------------------------------------------

    function makeFrontWingElement(xCenter, yBase, chord, thick, mat, pitchAngle) {
      const segs = 16;
      const geo = new THREE.BoxGeometry(chord, thick, 1.92, 2, 1, segs);
      const pa = geo.attributes.position;
      for (let k = 0; k < pa.count; k++) {
        const vx = pa.getX(k);
        const vy = pa.getY(k);
        const vz = pa.getZ(k);
        const az = Math.abs(vz);
        // Swept gull-wing F1 front wing contour
        const sweepBack = -Math.pow(az / 0.96, 1.65) * 0.19;
        const gullLift = Math.sin(clamp(az / 0.96, 0, 1) * Math.PI) * 0.025;
        const rx = vx * Math.cos(pitchAngle) - vy * Math.sin(pitchAngle);
        const ry = vx * Math.sin(pitchAngle) + vy * Math.cos(pitchAngle);
        pa.setXYZ(k, xCenter + rx + sweepBack, yBase + ry + gullLift, vz);

      geo.computeVertexNormals();
      return new THREE.Mesh(geo, mat);

  const mastSpotA = createTrackingMastSpot();

  const NUM_PUFFS = 960;

    let role = 0;

      role = 2; // Hairpin front-left tyre lockup puff (Red) + slipstream spray

    puffSlotMeta.push({

  const puffGeo = new THREE.BufferGeometry();

  const puffShaderMat = new THREE.ShaderMaterial({
    uniforms: {
      uTex: { value: puffTexture },

      uFogColor: { value: new THREE.Color(0x0c121b) },
      uFogDensity: { value: 0.0021 }
    },
    vertexShader: `
      attribute float aSize;
      attribute float aAlpha;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vFogDepth;
      uniform float uScale;
      void main() {
        vColor = color;
        vAlpha = aAlpha;
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        vFogDepth = -mvPos.z;
        gl_Position = projectionMatrix * mvPos;
        gl_PointSize = clamp(aSize * (uScale / max(0.5, -mvPos.z)), 0.0, 260.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D uTex;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      varying vec3 vColor;
      varying float vAlpha;
      varying float vFogDepth;
      void main() {
        if (vAlpha <= 0.002) discard;
        vec4 texel = texture2D(uTex, gl_PointCoord);
        float alpha = texel.a * vAlpha;
        if (alpha <= 0.002) discard;
        float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * vFogDepth * vFogDepth);
        vec3 col = mix(vColor * texel.rgb, uFogColor, clamp(fogFactor, 0.0, 1.0));
        gl_FragColor = vec4(col, alpha);
      }
    `,
    vertexColors: true,
    transparent: true,
    depthWrite: false
  });

  // 11.2 Titanium Skid-Block Sparks (320 velocity-stretched glowing streak segments)

  const sparkLines = new THREE.LineSegments(

  sparkLines.frustumCulled = false;

  // 11.3 Grandstand Camera Flashes (96 seeded stadium seat flash positions)
  const NUM_FLASHES = 96;
  const flashMeta = [];
  const flashPrng = createPRNG(4299);
  for (let i = 0; i < NUM_FLASHES; i++) {
    const tier = Math.floor(flashPrng() * 11);
    const fx = -40 + flashPrng() * 188;
    const fy = 1.2 + tier * 0.85 + flashPrng() * 0.4;
    const fz = -13.0 - tier * 1.42;

  const flashColors = new Float32Array(NUM_FLASHES * 3);
  const flashSizes = new Float32Array(NUM_FLASHES);
  const flashAlphas = new Float32Array(NUM_FLASHES);
  for (let i = 0; i < NUM_FLASHES; i++) {
    flashPositions[i * 3] = flashMeta[i].x;
    flashPositions[i * 3 + 1] = flashMeta[i].y;
    flashPositions[i * 3 + 2] = flashMeta[i].z;
    flashColors[i * 3] = 1.0;
    flashColors[i * 3 + 1] = 0.97;
    flashColors[i * 3 + 2] = 0.92;

  flashGeo.setAttribute('position', new THREE.BufferAttribute(flashPositions, 3));
  flashGeo.setAttribute('color', new THREE.BufferAttribute(flashColors, 3));
  flashGeo.setAttribute('aSize', new THREE.BufferAttribute(flashSizes, 1));
  flashGeo.setAttribute('aAlpha', new THREE.BufferAttribute(flashAlphas, 1));

  const flashMat = puffShaderMat.clone();
  flashMat.uniforms = {

  };
  flashMat.blending = THREE.AdditiveBlending;

  // Scratch state objects to avoid per-frame GC allocations
  const emitState = {};
  const stateR = {};
