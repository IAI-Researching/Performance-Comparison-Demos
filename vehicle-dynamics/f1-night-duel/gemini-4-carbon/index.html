  function updateClosedFormParticles(simTime, rainLightOn) {
    // A. Update Spray, Smoke, Heat Shimmer & Hairpin Lockup Puffs
    for (let i = 0; i < NUM_PUFFS; i++) {
      const m = puffSlotMeta[i];
      const cycle = Math.floor((simTime - m.phase) / m.life);
      const tEmit = cycle * m.life + m.phase;
      const age = simTime - tEmit;
      const uAge = age / m.life;

      if (tEmit < -0.5 || age < 0 || uAge >= 1) {
        puffAlphas[i] = 0;
        puffSizes[i] = 0;
        continue;
      }

      const tbl = m.isRed ? redTable : blueTable;
      sampleCarState(tbl, Math.max(0, tEmit), emitState);
      const r0 = hashFloat(42, i, cycle, 1);
      const r1 = hashFloat(42, i, cycle, 2);
      const r2 = hashFloat(42, i, cycle, 3);
      const r3 = hashFloat(42, i, cycle, 4);

      let px = 0, py = -500, pz = 0, size = 0, alpha = 0;
      let cr = 0.62, cg = 0.70, cb = 0.84;

      if (m.role === 2) {
        // Dedicated Red Car Front-Left Unloaded Inside Tyre Lockup Smoke into Hairpin (t = 19.95..21.25)
        if (tEmit >= 19.95 && tEmit <= 21.25) {
          const lockEnv = Math.sin(clamp((tEmit - 19.95) / 1.30, 0, 1) * Math.PI);
          // Front-left contact patch: +1.80m fwd, -0.85m right
          const ox = emitState.px + emitState.fx * 1.80 - emitState.rx * 0.86;
          const oy = emitState.py + 0.08;
          const oz = emitState.pz + emitState.fz * 1.80 - emitState.rz * 0.86;
          const drift = emitState.vs * 0.32 * age;
          px = ox + emitState.fx * drift - emitState.rx * (0.35 + r0 * 1.2) * age + (r1 - 0.5) * 0.8 * age;
          py = oy + (0.45 + r2 * 0.9) * age;
          pz = oz + emitState.fz * drift - emitState.rz * (0.35 + r0 * 1.2) * age + (r3 - 0.5) * 0.8 * age;
          size = 0.55 + uAge * 2.6;
          alpha = lockEnv * (1 - uAge) * (1 - uAge) * 0.52;
          cr = 0.82; cg = 0.86; cb = 0.92;
        }
      } else if (m.role === 1 && tEmit < 3.05) {
        // Grid Heat Shimmer & Hot Exhaust Wisp rising behind each stationary car (0..3s)
        const ox = emitState.px - emitState.fx * (2.15 + r0 * 0.35) + emitState.rx * ((r1 - 0.5) * 0.45);
        const oy = emitState.py + 0.36 + r2 * 0.14;
        const oz = emitState.pz - emitState.fz * (2.15 + r0 * 0.35) + emitState.rz * ((r1 - 0.5) * 0.45);
        const shimmerSway = Math.sin(simTime * 7.5 + i * 0.7) * 0.14 * uAge;
        px = ox - emitState.fx * (0.55 * age) + emitState.rx * shimmerSway;
        py = oy + (0.95 + r3 * 0.65) * age;
        pz = oz - emitState.fz * (0.55 * age) + emitState.rz * shimmerSway;
        size = 0.48 + uAge * 1.35;
        alpha = Math.sin(uAge * Math.PI) * 0.11;
        cr = 0.72; cg = 0.78; cb = 0.88;
        if (rainLightOn && uAge < 0.45) {
          cr = 0.95; cg = 0.32; cb = 0.36;
          alpha *= 1.35;
        }
      } else if (emitState.wheelspin > 0.04 && (m.role === 1 || r3 < 0.55)) {
        // Launch Wheelspin Tyre Smoke & Damp Mist (3.0s .. 5.4s) from left & right rear tyres
        const side = (i % 4 < 2) ? -1 : 1;
        const ox = emitState.px - emitState.fx * 1.85 + emitState.rx * (side * 0.80 + (r0 - 0.5) * 0.24);
        const oy = emitState.py + 0.10;
        const oz = emitState.pz - emitState.fz * 1.85 + emitState.rz * (side * 0.80 + (r0 - 0.5) * 0.24);
        const kickBack = (4.5 + r1 * 5.5) * emitState.wheelspin;
        px = ox + (emitState.fx * (emitState.vs * 0.22 - kickBack) + emitState.rx * (side * 0.6 + (r2 - 0.5) * 1.8)) * age;
        py = oy + (0.55 + r1 * 1.15) * age;
        pz = oz + (emitState.fz * (emitState.vs * 0.22 - kickBack) + emitState.rz * (side * 0.6 + (r2 - 0.5) * 1.8)) * age;
        size = 0.65 + uAge * 3.1;
        alpha = clamp(emitState.wheelspin * 0.48, 0, 0.52) * Math.pow(1 - uAge, 1.45);
        cr = 0.80; cg = 0.84; cb = 0.90;
      } else if (emitState.vs > 7.5) {
        // Damp-Track Rooster-Tail Water Spray Plume behind diffuser & rear tyres
        const spFactor = smoothstep(7.5, 48.0, emitState.vs);
        const srcSpan = (r0 < 0.45) ? ((r1 - 0.5) * 0.75) : ((r0 < 0.72 ? -0.80 : 0.80) + (r1 - 0.5) * 0.26);
        const ox = emitState.px - emitState.fx * (2.15 + r2 * 0.55) + emitState.rx * srcSpan;
        const oy = emitState.py + 0.14 + r3 * 0.18;
        const oz = emitState.pz - emitState.fz * (2.15 + r2 * 0.55) + emitState.rz * srcSpan;

        // Spray gets carried forward slowly by turbulent wake with strong drag
        const wakeDrag = (1 - Math.exp(-age * 2.8)) / 2.8;
        const carry = emitState.vs * 0.46 * wakeDrag;
        const spread = (r1 - 0.5) * 2.6 * age;
        const roosterLift = (1.15 + spFactor * 1.65 + r2 * 0.95) * wakeDrag + 0.22 * age;

        px = ox + emitState.fx * carry + emitState.rx * spread;
        py = oy + roosterLift;
        pz = oz + emitState.fz * carry + emitState.rz * spread;
        size = 0.75 + uAge * (2.8 + spFactor * 2.9);
        alpha = spFactor * 0.21 * Math.sin(Math.min(1, uAge * 4.5) * Math.PI * 0.5) * Math.pow(1 - uAge, 1.35);

        // Glows cool blue-white under floodlights, with red backscatter near blinking rain light
        cr = 0.64; cg = 0.74; cb = 0.90;
        const curCar = m.isRed ? stateR : stateB;
        const distCarSq = (px - curCar.px) * (px - curCar.px) + (pz - curCar.pz) * (pz - curCar.pz);
        if (rainLightOn && distCarSq < 36) {
          const rBlend = (1 - distCarSq / 36) * 0.65;
          cr = lerp(cr, 1.0, rBlend);
          cg = lerp(cg, 0.22, rBlend);
          cb = lerp(cb, 0.28, rBlend);
        }
      }

      puffPositions[i * 3] = px;
      puffPositions[i * 3 + 1] = py;
      puffPositions[i * 3 + 2] = pz;
      puffColors[i * 3] = cr;
      puffColors[i * 3 + 1] = cg;
      puffColors[i * 3 + 2] = cb;
      puffSizes[i] = size;
      puffAlphas[i] = alpha;
    }
    puffGeo.attributes.position.needsUpdate = true;
    puffGeo.attributes.color.needsUpdate = true;
    puffGeo.attributes.aSize.needsUpdate = true;
    puffGeo.attributes.aAlpha.needsUpdate = true;

    // B. Update Titanium Skid-Block Sparks (Ballistic + Wet-Road Bounce)
    for (let i = 0; i < NUM_SPARKS; i++) {
      const m = sparkMeta[i];
      const cycle = Math.floor((simTime - m.phase) / m.life);
      const tEmit = cycle * m.life + m.phase;
      const age = simTime - tEmit;
      const uAge = age / m.life;
      const base = i * 6;

      if (tEmit < 3.2 || age < 0 || uAge >= 1) {
        sparkPos.fill(0, base, base + 6);
        sparkCol.fill(0, base, base + 6);
        continue;
      }

      const tbl = m.isRed ? redTable : blueTable;
      sampleCarState(tbl, tEmit, emitState);
      const triggerRand = hashFloat(42, i + 5000, cycle, 0);
      if (triggerRand > emitState.sparkRate) {
        sparkPos.fill(0, base, base + 6);
        sparkCol.fill(0, base, base + 6);
        continue;
      }

      const r1 = hashFloat(42, i + 5000, cycle, 1);
      const r2 = hashFloat(42, i + 5000, cycle, 2);
      const r3 = hashFloat(42, i + 5000, cycle, 3);

      // Emit from titanium skid block under floor
      const ox = emitState.px - emitState.fx * (0.9 + r1 * 1.1) + emitState.rx * ((r2 - 0.5) * 0.34);
      const oy = emitState.py + 0.04;
      const oz = emitState.pz - emitState.fz * (0.9 + r1 * 1.1) + emitState.rz * ((r2 - 0.5) * 0.34);

      const vx = emitState.fx * (emitState.vs * 0.68 - r1 * 6.0) + emitState.rx * ((r2 - 0.5) * 7.5);
      const vy0 = 1.3 + r3 * 2.8;
      const vz = emitState.fz * (emitState.vs * 0.68 - r1 * 6.0) + emitState.rz * ((r2 - 0.5) * 7.5);

      const evalSparkPos = (tAge) => {
        const sx = ox + vx * tAge;
        const sz = oz + vz * tAge;
        const roadY = emitState.py + emitState.fy * (emitState.vs * 0.68 * tAge) + 0.02;
        let sy = oy + vy0 * tAge - 4.9 * tAge * tAge;
        if (sy < roadY) {
          sy = roadY + Math.abs(roadY - sy) * 0.48;
        }
        return [sx, sy, sz];
      };

      const pHead = evalSparkPos(age);
      const pTail = evalSparkPos(Math.max(0, age - 0.020));

      sparkPos[base] = pHead[0];
      sparkPos[base + 1] = pHead[1];
      sparkPos[base + 2] = pHead[2];
      sparkPos[base + 3] = pTail[0];
      sparkPos[base + 4] = pTail[1];
      sparkPos[base + 5] = pTail[2];

      const fade = Math.pow(1 - uAge, 0.75);
      // Bright yellow-white head, glowing orange tail
      sparkCol[base] = 1.0 * fade;
      sparkCol[base + 1] = 0.86 * fade;
      sparkCol[base + 2] = 0.42 * fade;
      sparkCol[base + 3] = 1.0 * fade * 0.65;
      sparkCol[base + 4] = 0.36 * fade * 0.65;
      sparkCol[base + 5] = 0.05 * fade * 0.65;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;

    // C. Update Grandstand Camera Flashes (simTime >= BLUE_FINISH_TIME - 0.15)
    const flashActive = simTime >= (BLUE_FINISH_TIME - 0.15);
    const burstEnvelope = flashActive ? (1.0 - smoothstep(38.2, 40.4, simTime) * 0.45) : 0.0;
    for (let i = 0; i < NUM_FLASHES; i++) {
      if (!flashActive) {
        flashAlphas[i] = 0;
        flashSizes[i] = 0;
        continue;
      }
      const fm = flashMeta[i];
      const cyc = Math.floor((simTime + fm.phase) / fm.period);
      const sub = (simTime + fm.phase) - cyc * fm.period;
      const fire = hashFloat(4299, i, cyc, 7) < (0.42 * burstEnvelope);
      if (fire && sub < 0.085) {
        const env = 1.0 - (sub / 0.085);
        flashAlphas[i] = env * env;
        flashSizes[i] = 1.8 + env * 2.6;
      } else {
        flashAlphas[i] = 0;
        flashSizes[i] = 0;
      }
    }
    flashGeo.attributes.aSize.needsUpdate = true;
    flashGeo.attributes.aAlpha.needsUpdate = true;
  }

  // ============================================================================
  // 12. POSE CARS, LIGHTS, START GANTRY & EXACT 8-SHOT BROADCAST CAMERA
  // ============================================================================
  const mat4Scratch = new THREE.Matrix4();
  const vecX = new THREE.Vector3();
  const vecY = new THREE.Vector3();
  const vecZ = new THREE.Vector3();
  const camPosScratch = new THREE.Vector3();
  const camTargetScratch = new THREE.Vector3();
  const camUpScratch = new THREE.Vector3();
  const trackSampleA = {};
  const trackSampleB = {};

  function poseCarVisuals(carObj, st, rainOn, drsOpenFactor) {
    carObj.root.position.set(st.px, st.py, st.pz);
    vecX.set(st.fx, st.fy, st.fz);
    vecY.set(st.ux, st.uy, st.uz);
    vecZ.set(st.rx, st.ry, st.rz);
    mat4Scratch.makeBasis(vecX, vecY, vecZ);
    carObj.root.quaternion.setFromRotationMatrix(mat4Scratch);

    // Subtle pitch under acceleration/braking & roll in corners
    carObj.bodyRig.rotation.set(st.roll, 0, st.pitch);

    // Front wheel steering & steering wheel rotation
    carObj.wheelFL.upright.rotation.y = st.steer;
    carObj.wheelFR.upright.rotation.y = st.steer;
    carObj.steerWheelGroup.rotation.x = -st.steer * 2.4;

    // Wheel spin around local Z axis (+X forward x +Y up => -Z spin rolls forward!)
    carObj.wheelFL.spinGroup.rotation.z = -st.spinF;
    carObj.wheelFR.spinGroup.rotation.z = -st.spinF;
    carObj.wheelRL.spinGroup.rotation.z = -st.spinR;
    carObj.wheelRR.spinGroup.rotation.z = -st.spinR;

    // Brake disc orange glow proportional to deceleration thermal heat
    carObj.brakeRotorMat.emissiveIntensity = st.brakeGlow * 3.2;
    carObj.roadBrakeGlow.material.opacity = st.brakeGlow * 0.22;

    // Movable DRS upper rear-wing flap
    carObj.drsPivot.rotation.z = lerp(0.44, 0.05, drsOpenFactor);

    // 4 Hz rear rain light blink
    carObj.rainLightMesh.material.color.setHex(rainOn ? 0xff1824 : 0x260508);
    carObj.rainFlare.material.opacity = rainOn ? 0.92 : 0.0;
    carObj.roadRainGlow.material.opacity = rainOn ? 0.20 : 0.0;
  }

  function computeEffectiveFov(baseFovDeg, aspect, isOnboardShot4) {
    // Keep Shot 4 at 75 deg so onboard bodywork stays strictly in the bottom quarter of the frame;
    // for all external shots, preserve at least the 16:9 horizontal FOV on portrait viewports (e.g. 1280x1340)
    if (isOnboardShot4) return baseFovDeg;
    const refAspect = 16 / 9;
    if (aspect >= refAspect) return baseFovDeg;
    const tanHalf = Math.tan(THREE.MathUtils.degToRad(baseFovDeg) * 0.5) * (refAspect / aspect);
    return THREE.MathUtils.radToDeg(2 * Math.atan(tanHalf));
  }

  function evaluateCameraShot(simTime, stR, stB, aspect, outPos, outTarget, outUp) {
    // MID is the midpoint between the two cars' body centres (0.45m above floor)
    const midX = (stR.px + stB.px) * 0.5;
    const midY = (stR.py + stB.py) * 0.5 + 0.45;
    const midZ = (stR.pz + stB.pz) * 0.5;

    outUp.set(0, 1, 0);
    let baseFov = 35;
    let shotId = 1;

    if (simTime < 5.0) {
      // 1. Grid, from behind [0, 5)
      shotId = 1;
      outPos.set(-34, 2.6, 0);
      outTarget.set(0, 3.0, 0);
      baseFov = 35;
    } else if (simTime < 11.0) {
      // 2. Chase behind blue [5, 11): C(sB - 9) + dB*n + (0, 2.4, 0) -> C(sB + 14) + (0, 0.9, 0), FOV 50
      shotId = 2;
      sampleTrack(stB.s - 9.0, trackSampleA);
      sampleTrack(stB.s + 14.0, trackSampleB);
      outPos.set(
        trackSampleA.cx + stB.d * trackSampleA.nx,
        trackSampleA.cy + 2.4,
        trackSampleA.cz + stB.d * trackSampleA.nz
      );
      outTarget.set(trackSampleB.cx, trackSampleB.cy + 0.9, trackSampleB.cz);
      baseFov = 50;
    } else if (simTime < 15.0) {
      // 3. Trackside, uphill sweep [11, 15): fixed C(400) - 18*n(400) + (0, 5, 0) -> MID, FOV 24
      shotId = 3;
      sampleTrack(400.0, trackSampleA);
      outPos.set(
        trackSampleA.cx - 18.0 * trackSampleA.nx,
        trackSampleA.cy + 5.0,
        trackSampleA.cz - 18.0 * trackSampleA.nz
      );
      outTarget.set(midX, midY, midZ);
      baseFov = 24;
    } else if (simTime < 20.0) {
      // 4. Blue onboard (T-cam) [15, 20): above blue car's roll hoop, 1.25m above floor & 0.2m behind hoop,
      //    moving and rotating rigidly with the car; look 40m ahead along heading, 0.6m above road, FOV 75
      shotId = 4;
      // Roll hoop is at x_local = -0.10m => 0.2m behind hoop is x_local = -0.30m, y_local = 1.25m
      outPos.set(
        stB.px - stB.fx * 0.30 + stB.ux * 1.25,
        stB.py - stB.fy * 0.30 + stB.uy * 1.25,
        stB.pz - stB.fz * 0.30 + stB.uz * 1.25
      );
      outTarget.set(
        stB.px + stB.fx * 40.0 + stB.ux * 0.60,
        stB.py + stB.fy * 40.0 + stB.uy * 0.60,
        stB.pz + stB.fz * 40.0 + stB.uz * 0.60
      );
      outUp.set(stB.ux, stB.uy, stB.uz);
      baseFov = 75;
    } else if (simTime < 24.0) {
      // 5. Trackside, hairpin [20, 24): fixed C(725) + 20*n(725) + (0, 3, 0) -> MID, FOV 28
      shotId = 5;
      sampleTrack(725.0, trackSampleA);
      outPos.set(
        trackSampleA.cx + 20.0 * trackSampleA.nx,
        trackSampleA.cy + 3.0,
        trackSampleA.cz + 20.0 * trackSampleA.nz
      );
      outTarget.set(midX, midY, midZ);
      baseFov = 28;
    } else if (simTime < 30.0) {
      // 6. Aerial [24, 30): fixed (-80, 120, 150) -> MID, FOV 30
      shotId = 6;
      outPos.set(-80, 120, 150);
      outTarget.set(midX, midY, midZ);
      baseFov = 30;
    } else if (simTime < 34.0) {
      // 7. Trackside, final corner [30, 34): fixed C(1300) - 12*n(1300) + (0, 1.2, 0) -> MID, FOV 30
      shotId = 7;
      sampleTrack(1300.0, trackSampleA);
      outPos.set(
        trackSampleA.cx - 12.0 * trackSampleA.nx,
        trackSampleA.cy + 1.2,
        trackSampleA.cz - 12.0 * trackSampleA.nz
      );
      outTarget.set(midX, midY, midZ);
      baseFov = 30;
    } else {
      // 8. Finish line [34, 40]: fixed (-20, 4.5, 15) -> MID, FOV 32
      shotId = 8;
      outPos.set(-20, 4.5, 15);
      outTarget.set(midX, midY, midZ);
      baseFov = 32;
    }

    const fov = computeEffectiveFov(baseFov, aspect, shotId === 4);
    return { shotId, fov };
  }

  function updateStartGantryLights(simTime) {
    // Five red lights come on at 0.5, 1.0, 1.5, 2.0, 2.5 and all go out at 3.000.
    // At finish (simTime >= BLUE_FINISH_TIME), flash green at 5 Hz.
    const isGreenPhase = simTime >= BLUE_FINISH_TIME;
    const greenFlashOn = isGreenPhase && (Math.floor((simTime - BLUE_FINISH_TIME) * 10) % 2 === 0);

    for (let i = 0; i < 5; i++) {
      const mat = startLightPodMeshes[i];
      const flare = startLightFlares[i];
      if (simTime < 3.0) {
        const redOn = simTime >= (i + 1) * 0.5;
        mat.color.setHex(redOn ? 0xff1622 : 0x190b0d);
        mat.emissive.setHex(redOn ? 0xff1622 : 0x000000);
        mat.emissiveIntensity = redOn ? 2.4 : 0.0;
        flare.material.color.setHex(0xff1a26);
        flare.material.opacity = redOn ? 0.88 : 0.0;
      } else if (isGreenPhase) {
        mat.color.setHex(greenFlashOn ? 0x18ff58 : 0x0a1c10);
        mat.emissive.setHex(greenFlashOn ? 0x18ff58 : 0x000000);
        mat.emissiveIntensity = greenFlashOn ? 2.6 : 0.0;
        flare.material.color.setHex(0x22ff64);
        flare.material.opacity = greenFlashOn ? 0.90 : 0.0;
      } else {
        mat.color.setHex(0x16181e);
        mat.emissive.setHex(0x000000);
        mat.emissiveIntensity = 0.0;
        flare.material.opacity = 0.0;
      }
    }
  }

  function updateDynamicActionLights(stR, stB) {
    const midS = wrapS((stR.s + stB.s) * 0.5);
    const midX = (stR.px + stB.px) * 0.5;
    const midY = (stR.py + stB.py) * 0.5;
    const midZ = (stR.pz + stB.pz) * 0.5;

    // Pick the two closest floodlight masts along arc-length to cast real pools & car shadows
    let best1 = 0, best2 = 1;
    let d1 = 1e9, d2 = 1e9;
    for (let i = 0; i < floodMasts.length; i++) {
      let ds = Math.abs(floodMasts[i].s - midS);
      if (ds > LAP_LENGTH * 0.5) ds = LAP_LENGTH - ds;
      if (ds < d1) {
        d2 = d1; best2 = best1;
        d1 = ds; best1 = i;
      } else if (ds < d2) {
        d2 = ds; best2 = i;
      }
    }

    const mA = floodMasts[best1];
    const mB = floodMasts[best2];
    mastSpotA.position.set(mA.headX, mA.headY, mA.headZ);
    mastSpotA.target.position.set(mA.aimX, mA.aimY, mA.aimZ);
    mastSpotA.intensity = 2.05 * smoothstep(74, 14, d1);

    mastSpotB.position.set(mB.headX, mB.headY, mB.headZ);
    mastSpotB.target.position.set(mB.aimX, mB.aimY, mB.aimZ);
    mastSpotB.intensity = 1.95 * smoothstep(74, 14, d2);

    // Subtle overhead key light travelling with the cars so red & blue paint never go pitch-black between masts
    actionKeyLight.position.set(midX - stR.fx * 6 + stR.rx * 8, midY + 19, midZ - stR.fz * 6 + stR.rz * 8);
    actionKeyLight.target.position.set(midX, midY, midZ);

    // Ahead point light for stretched wet specular road highlights
    sampleTrack(midS + 32, trackSampleA);
    wetRoadSpecLight.position.set(trackSampleA.cx, trackSampleA.cy + 14, trackSampleA.cz);
  }

  let currentShotId = 1;

  function renderAt(simTime) {
    const t = clamp(simTime, 0, DURATION);

    sampleCarState(redTable, t, stateR);
    sampleCarState(blueTable, t, stateB);

    // Rain lights blink at 4 Hz of simTime
    const rainOn = (Math.floor(t * 8) % 2) === 0;

    // Blue car opens DRS flap from simTime = 33.500 until it crosses the finish line (~36.493)
    const blueDrs = smoothstep(33.500, 33.640, t) * (1.0 - smoothstep(BLUE_FINISH_TIME - 0.04, BLUE_FINISH_TIME + 0.12, t));

    poseCarVisuals(redCar, stateR, rainOn, 0.0);
    poseCarVisuals(blueCar, stateB, rainOn, blueDrs);

    updateStartGantryLights(t);
    updateDynamicActionLights(stateR, stateB);
    updateClosedFormParticles(t, rainOn);

    // Camera pure function of simTime
    const aspect = (window.innerWidth || 1920) / Math.max(1, window.innerHeight || 1080);
    const shotInfo = evaluateCameraShot(t, stateR, stateB, aspect, camPosScratch, camTargetScratch, camUpScratch);
    currentShotId = shotInfo.shotId;

    camera.position.copy(camPosScratch);
    camera.up.copy(camUpScratch);
    camera.lookAt(camTargetScratch);
    if (Math.abs(camera.fov - shotInfo.fov) > 1e-4 || Math.abs(camera.aspect - aspect) > 1e-4) {
      camera.fov = shotInfo.fov;
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
    }

    // Keep opaque night sky sphere centred on camera
    skyDomeMesh.position.copy(camera.position);

    renderer.render(scene, camera);
  }

  // ============================================================================
  // 13. WEB AUDIO SYNTHESIZER (SEED 4242, NO EXTERNAL AUDIO, NO MUSIC)
  // ============================================================================
  const audioEngine = (function createAudioEngine() {
    const audioPrng = createPRNG(4242);
    let ctx = null;
    let masterGain = null;
    let compressor = null;
    let redVoice = null;
    let blueVoice = null;
    let ambienceNodes = null;
    let whiteBuffer = null;
    let pinkBuffer = null;
    let activeOneShots = [];
    let isAudible = false;

    // Precompute deterministic shutter-click timestamps in [36.35, 39.8] using seed 4242
    const shutterTimes = [];
    {
      let st = 36.35;
      while (st < 39.85) {
        shutterTimes.push(st);
        st += 0.055 + audioPrng() * 0.16;
      }
    }

    const startBeepTimes = [0.5, 1.0, 1.5, 2.0, 2.5];

    function createNoiseBuffers(context) {
      const rate = context.sampleRate;
      const len = rate * 2;
      whiteBuffer = context.createBuffer(1, len, rate);
      pinkBuffer = context.createBuffer(1, len, rate);
      const wData = whiteBuffer.getChannelData(0);
      const pData = pinkBuffer.getChannelData(0);

      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = audioPrng() * 2 - 1;
        wData[i] = w;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        pData[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    }

    function makeLoopSource(context, buffer) {
      const src = context.createBufferSource();
      src.buffer = buffer;
      src.loop = true;
      src.start(0);
      return src;
    }

    function createCarVoice(context, dest, isRed) {
      // 3D spatial panner for trackside sweeps & distance falloff
      const panner = context.createPanner();
      panner.panningModel = 'equalpower';
      panner.distanceModel = 'inverse';
      panner.refDistance = 9.5;
      panner.maxDistance = 650;
      panner.rolloffFactor = 1.15;
      panner.connect(dest);

      const carBus = context.createGain();
      carBus.gain.value = 0.52;

      // Cockpit / exhaust low-pass filter (also switches to onboard cockpit filter in Shot 4)
      const toneFilter = context.createBiquadFilter();
      toneFilter.type = 'lowpass';
      toneFilter.frequency.value = 3200;
      toneFilter.Q.value = 1.2;

      carBus.connect(toneFilter);
      toneFilter.connect(panner);

      // Turbo-hybrid V6 oscillators: distinguishable harmonic balance between Red (#7) and Blue (#23)
      const osc1 = context.createOscillator();
      osc1.type = 'sawtooth';
      const g1 = context.createGain();
      g1.gain.value = isRed ? 0.24 : 0.19;

      const osc2 = context.createOscillator();
      osc2.type = isRed ? 'triangle' : 'sawtooth';
      const g2 = context.createGain();
      g2.gain.value = isRed ? 0.17 : 0.14;

      const osc3 = context.createOscillator();
      osc3.type = 'sawtooth';
      const g3 = context.createGain();
      g3.gain.value = isRed ? 0.11 : 0.18;

      // MGU-H / Turbo whistle oscillator
      const oscTurbo = context.createOscillator();
      oscTurbo.type = 'sine';
      const gTurbo = context.createGain();
      gTurbo.gain.value = 0.02;

      osc1.connect(g1); g1.connect(carBus);
      osc2.connect(g2); g2.connect(carBus);
      osc3.connect(g3); g3.connect(carBus);
      oscTurbo.connect(gTurbo); gTurbo.connect(carBus);
      osc1.start(); osc2.start(); osc3.start(); oscTurbo.start();

      // Filtered exhaust rasp noise
      const exhNoise = makeLoopSource(context, pinkBuffer);
      const exhFilter = context.createBiquadFilter();
      exhFilter.type = 'bandpass';
      exhFilter.frequency.value = 600;
      exhFilter.Q.value = 2.0;
      const gExh = context.createGain();
      gExh.gain.value = 0.16;
      exhNoise.connect(exhFilter); exhFilter.connect(gExh); gExh.connect(carBus);

      // Wet-road tyre hiss
      const wetSrc = makeLoopSource(context, whiteBuffer);
      const wetFilter = context.createBiquadFilter();
      wetFilter.type = 'bandpass';
      wetFilter.frequency.value = 2600;
      wetFilter.Q.value = 0.85;
      const gWet = context.createGain();
      gWet.gain.value = 0.0;
      wetSrc.connect(wetFilter); wetFilter.connect(gWet); gWet.connect(panner);

      // Wheelspin screech & wet braking / hairpin cornering squeal
      const squealSrc = makeLoopSource(context, whiteBuffer);
      const squealFilter = context.createBiquadFilter();
      squealFilter.type = 'bandpass';
      squealFilter.frequency.value = 1050;
      squealFilter.Q.value = 6.5;
      const gSqueal = context.createGain();
      gSqueal.gain.value = 0.0;
      squealSrc.connect(squealFilter); squealFilter.connect(gSqueal); gSqueal.connect(panner);

      // Titanium sparks metallic crackle scrape + faint high brake-disc squeal
      const sparkSrc = makeLoopSource(context, whiteBuffer);
      const sparkFilter = context.createBiquadFilter();
      sparkFilter.type = 'highpass';
      sparkFilter.frequency.value = 3900;
      const gSpark = context.createGain();
      gSpark.gain.value = 0.0;
      sparkSrc.connect(sparkFilter); sparkFilter.connect(gSpark); gSpark.connect(panner);

      const brakeSqOsc = context.createOscillator();
      brakeSqOsc.type = 'sine';
      brakeSqOsc.frequency.value = isRed ? 4520 : 4780;
      const gBrakeSq = context.createGain();
      gBrakeSq.gain.value = 0.0;
      brakeSqOsc.connect(gBrakeSq); gBrakeSq.connect(panner);
      brakeSqOsc.start();

      return {
        isRed, panner, carBus, toneFilter,
        osc1, osc2, osc3, oscTurbo, gTurbo,
        exhFilter, gExh,
        wetFilter, gWet,
        squealFilter, gSqueal,
        gSpark, gBrakeSq
      };
    }

    function init() {
      if (ctx) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      try {
        ctx = new AudioCtx();
      } catch (e) {
        return;
      }

      createNoiseBuffers(ctx);

      compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -10;
      compressor.knee.value = 14;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.003;
      compressor.release.value = 0.16;
      compressor.connect(ctx.destination);

      masterGain = ctx.createGain();
      masterGain.gain.value = 0.0;
      masterGain.connect(compressor);

      redVoice = createCarVoice(ctx, masterGain, true);
      blueVoice = createCarVoice(ctx, masterGain, false);

      // Night Ambience: Grandstand crowd (3D positioned), Floodlight hum, Humid breeze, Onboard Shot 4 wind
      const crowdPanner = ctx.createPanner();
      crowdPanner.panningModel = 'equalpower';
      crowdPanner.distanceModel = 'inverse';
      crowdPanner.refDistance = 24;
      crowdPanner.maxDistance = 600;
      crowdPanner.rolloffFactor = 0.85;
      if (crowdPanner.positionX) {
        crowdPanner.positionX.value = 42;
        crowdPanner.positionY.value = 7;
        crowdPanner.positionZ.value = -21;
      } else {
        crowdPanner.setPosition(42, 7, -21);
      }
      crowdPanner.connect(masterGain);

      const crowdSrc = makeLoopSource(ctx, pinkBuffer);
      const crowdFilter = ctx.createBiquadFilter();
      crowdFilter.type = 'bandpass';
      crowdFilter.frequency.value = 540;
      crowdFilter.Q.value = 0.75;
      const crowdGain = ctx.createGain();
      crowdGain.gain.value = 0.06;
      crowdSrc.connect(crowdFilter); crowdFilter.connect(crowdGain); crowdGain.connect(crowdPanner);

      // Low electrical hum from floodlights (100Hz + 200Hz)
      const humOsc1 = ctx.createOscillator();
      humOsc1.type = 'sine';
      humOsc1.frequency.value = 100;
      const humOsc2 = ctx.createOscillator();
      humOsc2.type = 'triangle';
      humOsc2.frequency.value = 200;
      const humGain = ctx.createGain();
      humGain.gain.value = 0.012;
      humOsc1.connect(humGain); humOsc2.connect(humGain); humGain.connect(masterGain);
      humOsc1.start(); humOsc2.start();

      // Light humid night breeze + Shot 4 onboard wind roar
      const breezeSrc = makeLoopSource(ctx, pinkBuffer);
      const breezeFilter = ctx.createBiquadFilter();
      breezeFilter.type = 'lowpass';
      breezeFilter.frequency.value = 340;
      const breezeGain = ctx.createGain();
      breezeGain.gain.value = 0.025;
      breezeSrc.connect(breezeFilter); breezeFilter.connect(breezeGain); breezeGain.connect(masterGain);

      ambienceNodes = { crowdFilter, crowdGain, breezeFilter, breezeGain };
    }

    function resumeContext() {
      if (!ctx) init();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }

    function stopAllOneShots() {
      if (!ctx) return;
      for (const node of activeOneShots) {
        try { node.stop(); } catch (e) {}
        try { node.disconnect(); } catch (e) {}
      }
      activeOneShots.length = 0;
    }

    function setPlayingState(shouldPlay) {
      if (!ctx || !masterGain) return;
      const now = ctx.currentTime;
      if (shouldPlay && !isAudible) {
        isAudible = true;
        resumeContext();
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0.82, now + 0.04);
      } else if (!shouldPlay && isAudible) {
        isAudible = false;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now);
        masterGain.gain.linearRampToValueAtTime(0.0, now + 0.038); // strictly within 50 ms
        stopAllOneShots();
      }
    }

    function registerOneShot(node) {
      activeOneShots.push(node);
      node.onended = () => {
        const idx = activeOneShots.indexOf(node);
        if (idx >= 0) activeOneShots.splice(idx, 1);
      };
    }

    function triggerStartLightBeep() {
      if (!ctx || !isAudible) return;
      const t0 = ctx.currentTime;
      const osc = ctx.createOscillator();
      const oscH = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      oscH.type = 'triangle';
      oscH.frequency.value = 1760;

      const gh = ctx.createGain();
      gh.gain.value = 0.18;
      oscH.connect(gh);
      gh.connect(g);
      osc.connect(g);

      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.16, t0 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.145);
      g.connect(masterGain);

      osc.start(t0);
      oscH.start(t0);
      osc.stop(t0 + 0.155);
      oscH.stop(t0 + 0.155);
      registerOneShot(osc);
      registerOneShot(oscH);
    }

    function triggerDrsClick(isOpen) {
      if (!ctx || !isAudible) return;
      const t0 = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = whiteBuffer;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(isOpen ? 2400 : 1450, t0);
      bp.Q.value = 3.5;
      const g = ctx.createGain();
      const peak = isOpen ? 0.22 : 0.12;
      g.gain.setValueAtTime(peak, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + (isOpen ? 0.045 : 0.038));
      src.connect(bp);
      bp.connect(g);
      g.connect(masterGain);
      src.start(t0);
      src.stop(t0 + 0.055);
      registerOneShot(src);
    }

    function triggerCameraShutter(variation) {
      if (!ctx || !isAudible) return;
      const t0 = ctx.currentTime;
      const src = ctx.createBufferSource();
      src.buffer = whiteBuffer;
      const hp = ctx.createBiquadFilter();
      hp.type = 'bandpass';
      hp.frequency.value = 3400 + variation * 1400;
      hp.Q.value = 2.2;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.055, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 0.024);
      src.connect(hp);
      hp.connect(g);
      g.connect(masterGain);
      src.start(t0);
      src.stop(t0 + 0.03);
      registerOneShot(src);
    }

    function setPannerPos(panner, x, y, z, t) {
      if (panner.positionX) {
        panner.positionX.setTargetAtTime(x, t, 0.015);
        panner.positionY.setTargetAtTime(y, t, 0.015);
        panner.positionZ.setTargetAtTime(z, t, 0.015);
      } else {
        panner.setPosition(x, y, z);
      }
    }

    const prevCamPos = new THREE.Vector3();
    const nextCamPos = new THREE.Vector3();
    const dummyTgt = new THREE.Vector3();
    const dummyUp = new THREE.Vector3();
    const stPrevB = {};
    const stNextB = {};
    const stPrevR = {};
    const stNextR = {};

    function updateContinuousVoice(voice, st, camPos, camVel, shotId, simTime, now) {
      setPannerPos(voice.panner, st.px, st.py + 0.45, st.pz, now);

      // Compute 3D car velocity and radial Doppler relative to active camera
      const vCarX = st.fx * st.vs;
      const vCarY = st.fy * st.vs;
      const vCarZ = st.fz * st.vs;

      const toCamX = camPos.x - st.px;
      const toCamY = camPos.y - (st.py + 0.45);
      const toCamZ = camPos.z - st.pz;
      const dist = Math.hypot(toCamX, toCamY, toCamZ) || 1;

      const relVx = vCarX - camVel.x;
      const relVy = vCarY - camVel.y;
      const relVz = vCarZ - camVel.z;
      const vRadial = clamp((relVx * toCamX + relVy * toCamY + relVz * toCamZ) / dist, -95, 95);
      const doppler = (shotId === 4 && !voice.isRed) ? 1.0 : (343.0 / (343.0 - vRadial));

      // V6 1.6L 4-stroke firing fundamental = (RPM / 60) * 3
      const f0 = Math.max(80, (st.rpm / 60) * 3.0 * doppler);
      voice.osc1.frequency.setTargetAtTime(f0, now, 0.014);
      voice.osc2.frequency.setTargetAtTime(f0 * (voice.isRed ? 1.5 : 2.0), now, 0.014);
      voice.osc3.frequency.setTargetAtTime(f0 * (voice.isRed ? 2.0 : 3.0), now, 0.014);

      const turboFreq = (1550 + st.rpm * (voice.isRed ? 0.24 : 0.29)) * doppler;
      voice.oscTurbo.frequency.setTargetAtTime(turboFreq, now, 0.02);
      voice.gTurbo.gain.setTargetAtTime(0.012 + st.throttle * 0.036 * smoothstep(5500, 11500, st.rpm), now, 0.02);

      voice.exhFilter.frequency.setTargetAtTime(clamp(f0 * 2.4, 240, 4200), now, 0.02);

      // Brighter & louder under acceleration, softer on lift-off; brief cut on upshift; cockpit LPF in Shot 4
      const shiftMute = 1.0 - st.shiftDip * 0.62 + st.downBlip * 0.22;
      const isOnboardSelf = (shotId === 4 && !voice.isRed);
      let cutoff = lerp(1250, 5600, st.throttle);
      if (isOnboardSelf) cutoff = lerp(1050, 2150, st.throttle); // Cockpit low-pass filter!
      voice.toneFilter.frequency.setTargetAtTime(cutoff, now, 0.02);

      const baseVol = (0.28 + st.throttle * 0.42) * shiftMute * (isOnboardSelf ? 1.25 : 1.0);
      voice.carBus.gain.setTargetAtTime(baseVol, now, 0.018);

      // Wet-road tyre hiss rising with speed
      const speedNorm = clamp(st.vs / 70.0, 0, 1);
      voice.gWet.gain.setTargetAtTime(speedNorm * speedNorm * 0.22, now, 0.025);
      voice.wetFilter.frequency.setTargetAtTime((1900 + speedNorm * 1900) * doppler, now, 0.025);

      // Launch wheelspin screech (3..5s) + wet braking / hairpin cornering squeal
      const decel = Math.max(0, -st.accSmooth);
      const latLoad = Math.abs(st.vs * st.vs * st.curv);
      const cornerSlip = smoothstep(22, 52, latLoad) * 0.55;
      const brakeSlip = smoothstep(16, 34, decel) * 0.65;
      const slipTotal = clamp(st.wheelspin * 0.95 + cornerSlip + brakeSlip, 0, 1);
      voice.gSqueal.gain.setTargetAtTime(slipTotal * 0.14, now, 0.02);
      voice.squealFilter.frequency.setTargetAtTime((920 + st.wheelspin * 420 + cornerSlip * 240) * doppler, now, 0.02);

      // Crackling metallic spark scrape + faint high brake-disc squeal under hardest braking
      const crackleMod = 0.55 + 0.45 * Math.sin(simTime * 97 + (voice.isRed ? 0 : 2.1)) * Math.cos(simTime * 163);
      voice.gSpark.gain.setTargetAtTime(st.sparkRate * crackleMod * 0.15, now, 0.012);
      voice.gBrakeSq.gain.setTargetAtTime(smoothstep(21, 35, decel) * smoothstep(15, 35, st.vs) * 0.022, now, 0.02);
    }

    const camVelVec = new THREE.Vector3();
    const fwdDir = new THREE.Vector3();

    function updateFrame(simTime, prevSimTime, isPlayingForward) {
      if (!ctx || !isAudible) return;
      const now = ctx.currentTime;

      // Update 3D Listener position & orientation from active camera
      const listener = ctx.listener;
      camera.getWorldDirection(fwdDir);
      if (listener.positionX) {
        listener.positionX.setValueAtTime(camera.position.x, now);
        listener.positionY.setValueAtTime(camera.position.y, now);
        listener.positionZ.setValueAtTime(camera.position.z, now);
        listener.forwardX.setValueAtTime(fwdDir.x, now);
        listener.forwardY.setValueAtTime(fwdDir.y, now);
        listener.forwardZ.setValueAtTime(fwdDir.z, now);
        listener.upX.setValueAtTime(camera.up.x, now);
        listener.upY.setValueAtTime(camera.up.y, now);
        listener.upZ.setValueAtTime(camera.up.z, now);
      } else {
        listener.setPosition(camera.position.x, camera.position.y, camera.position.z);
        listener.setOrientation(fwdDir.x, fwdDir.y, fwdDir.z, camera.up.x, camera.up.y, camera.up.z);
      }

      // Compute camera velocity within current shot (zero across hard cuts & fixed shots)
      const eps = 0.015;
      const tA = Math.max(0, simTime - eps);
      const tB = Math.min(DURATION, simTime + eps);
      sampleCarState(redTable, tA, stPrevR); sampleCarState(blueTable, tA, stPrevB);
      sampleCarState(redTable, tB, stNextR); sampleCarState(blueTable, tB, stNextB);
      const sA = evaluateCameraShot(tA, stPrevR, stPrevB, camera.aspect, prevCamPos, dummyTgt, dummyUp);
      const sB = evaluateCameraShot(tB, stNextR, stNextB, camera.aspect, nextCamPos, dummyTgt, dummyUp);
      if (sA.shotId === currentShotId && sB.shotId === currentShotId && (tB - tA) > 1e-4) {
        camVelVec.subVectors(nextCamPos, prevCamPos).divideScalar(tB - tA);
      } else {
        camVelVec.set(0, 0, 0);
      }

      updateContinuousVoice(redVoice, stateR, camera.position, camVelVec, currentShotId, simTime, now);
      updateContinuousVoice(blueVoice, stateB, camera.position, camVelVec, currentShotId, simTime, now);

      // Night Ambience: Crowd murmur swells from t=33 onto straight and roars at finish (~36.49)
      const straightSwell = smoothstep(33.0, 36.2, simTime);
      const finishRoar = smoothstep(BLUE_FINISH_TIME - 0.15, BLUE_FINISH_TIME + 0.45, simTime) * (1 - smoothstep(38.2, 40.2, simTime) * 0.35);
      const crowdLevel = 0.045 + straightSwell * 0.14 + finishRoar * 0.28;
      ambienceNodes.crowdGain.gain.setTargetAtTime(crowdLevel, now, 0.04);
      ambienceNodes.crowdFilter.frequency.setTargetAtTime(480 + straightSwell * 260 + finishRoar * 420, now, 0.04);

      // Humid night breeze + Shot 4 cockpit wind roar
      if (currentShotId === 4) {
        const wNorm = clamp(stateB.vs / 65, 0, 1);
        ambienceNodes.breezeGain.gain.setTargetAtTime(0.03 + wNorm * 0.18, now, 0.03);
        ambienceNodes.breezeFilter.frequency.setTargetAtTime(420 + wNorm * 950, now, 0.03);
      } else {
        ambienceNodes.breezeGain.gain.setTargetAtTime(0.022, now, 0.04);
        ambienceNodes.breezeFilter.frequency.setTargetAtTime(320, now, 0.04);
      }

      // One-Shot Events (triggered strictly when forward PLAYING carries simTime across event time)
      if (isPlayingForward && prevSimTime !== null && simTime > prevSimTime) {
        for (let i = 0; i < startBeepTimes.length; i++) {
          const bt = startBeepTimes[i];
          if (prevSimTime < bt && simTime >= bt) triggerStartLightBeep();
        }
        if (prevSimTime < 33.500 && simTime >= 33.500) {
          triggerDrsClick(true);
        }
        if (prevSimTime < BLUE_FINISH_TIME && simTime >= BLUE_FINISH_TIME) {
          triggerDrsClick(false);
        }
        for (let i = 0; i < shutterTimes.length; i++) {
          const st = shutterTimes[i];
          if (prevSimTime < st && simTime >= st) {
            triggerCameraShutter((i % 7) / 7);
          }
        }
      }
    }

    return {
      init,
      resumeContext,
      setPlayingState,
      stopAllOneShots,
      updateFrame
    };
  })();

  // Start AudioContext immediately at load and again on first pointerdown or keydown
  audioEngine.init();
  audioEngine.resumeContext();
  const unlockAudio = () => {
    audioEngine.resumeContext();
  };
  window.addEventListener('pointerdown', unlockAudio, { passive: true });
  window.addEventListener('keydown', unlockAudio, { passive: true });

  // ============================================================================
  // 14. 5-STATE PLAYBACK MACHINE & CANONICAL BOTTOM DOCK CONTROLS
  // ============================================================================
  const elCountdown = document.getElementById('countdown');
  const elBtnRefire = document.getElementById('btn-refire');
  const elBtnToggle = document.getElementById('btn-toggle');
  const elIconPause = document.getElementById('icon-pause');
  const elIconPlay = document.getElementById('icon-play');
  const elScrubber = document.getElementById('scrubber');
  const elSpeedPills = Array.from(document.querySelectorAll('.speed-pill'));

  let appState = 'COUNTDOWN'; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.000;
  let holdElapsed = 0.000;
  let isScrubbing = false;
  let lastRafTime = null;
  let countdownStarted = false;

  function setToggleButtonVisual(showPauseIcon) {
    if (showPauseIcon) {
      elIconPause.style.display = '';
      elIconPlay.style.display = 'none';
      elBtnToggle.setAttribute('aria-label', 'Pause');
    } else {
      elIconPause.style.display = 'none';
      elIconPlay.style.display = '';
      elBtnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    elCountdown.style.display = 'none';
    elCountdown.textContent = '';
  }

  function syncAudioGate() {
    const shouldHear = (appState === 'PLAYING' && !isScrubbing);
    audioEngine.setPlayingState(shouldHear);
  }

  // Play / Pause Toggle (#btn-toggle)
  elBtnToggle.addEventListener('click', () => {
    if (appState === 'PLAYING') {
      appState = 'PAUSED';
      setToggleButtonVisual(false);
      syncAudioGate();
    } else if (appState === 'COUNTDOWN' || appState === 'REFIRE_HOLD') {
      hideCountdown();
      simTime = 0.000;
      elScrubber.value = '0';
      appState = 'PAUSED';
      setToggleButtonVisual(false);
      syncAudioGate();
      renderAt(0.000);
    } else if (appState === 'PAUSED') {
      appState = 'PLAYING';
      setToggleButtonVisual(true);
      syncAudioGate();
    } else if (appState === 'ENDED') {
      hideCountdown();
      simTime = 0.000;
      elScrubber.value = '0.000';
      appState = 'PLAYING';
      setToggleButtonVisual(true);
      syncAudioGate();
      renderAt(0.000);
    }
  });

  // Speed Selector Pills (.speed-pill)
  elSpeedPills.forEach(pill => {
    pill.addEventListener('click', () => {
      const spd = parseFloat(pill.getAttribute('data-speed'));
      if (!Number.isFinite(spd)) return;
      playbackSpeed = spd;
      elSpeedPills.forEach(p => {
        const active = (p === pill);
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  // Scrubbing Slider (#scrubber)
  elScrubber.addEventListener('pointerdown', () => {
    isScrubbing = true;
    syncAudioGate();
  });
  window.addEventListener('pointerup', () => {
    if (isScrubbing) {
      isScrubbing = false;
      syncAudioGate();
    }
  });
  window.addEventListener('pointercancel', () => {
    if (isScrubbing) {
      isScrubbing = false;
      syncAudioGate();
    }
  });

  elScrubber.addEventListener('input', () => {
    hideCountdown();
    simTime = clamp(parseFloat(elScrubber.value) || 0, 0, DURATION);
    appState = 'PAUSED';
    setToggleButtonVisual(false);
    syncAudioGate();
    renderAt(simTime);
  });

  // Silent Re-Fire (#btn-refire -> REFIRE_HOLD State)
  elBtnRefire.addEventListener('click', () => {
    audioEngine.stopAllOneShots();
    hideCountdown();
    simTime = 0.000;
    elScrubber.value = '0';
    holdElapsed = 0.000;
    appState = 'REFIRE_HOLD';
    setToggleButtonVisual(true);
    syncAudioGate();
    renderAt(0.000);
  });

  // Responsive Resize Handler
  window.addEventListener('resize', () => {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    puffShaderMat.uniforms.uScale.value = window.innerHeight * 0.5;
    renderAt(simTime);
  });

  // Render initial resting scene (simTime = 0.000) BEFORE scheduling first RAF
  elCountdown.style.display = 'block';
  elCountdown.textContent = '3';
  elScrubber.value = '0';
  setToggleButtonVisual(true);
  renderAt(0.000);

  // Main Animation Loop
  function onFrame(nowMs) {
    requestAnimationFrame(onFrame);

    if (!countdownStarted) {
      // First RAF callback after initial resting scene has rendered: start COUNTDOWN at 0.000
      countdownStarted = true;
      lastRafTime = nowMs;
      if (appState === 'COUNTDOWN') {
        countdownElapsed = 0.000;
        elCountdown.style.display = 'block';
        elCountdown.textContent = '3';
      }
      return;
    }

    const rawDt = Math.max(0, (nowMs - lastRafTime) * 0.001);
    lastRafTime = nowMs;
    const dt = Math.min(rawDt, 0.1);

    if (appState === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.000) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '3';
        simTime = 0.000;
        elScrubber.value = '0';
        renderAt(0.000);
      } else if (countdownElapsed < 2.000) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '2';
        simTime = 0.000;
        elScrubber.value = '0';
        renderAt(0.000);
      } else if (countdownElapsed < 3.000) {
        elCountdown.style.display = 'block';
        elCountdown.textContent = '1';
        simTime = 0.000;
        elScrubber.value = '0';
        renderAt(0.000);
      } else {
        hideCountdown();
        appState = 'PLAYING';
        syncAudioGate();
        const overDt = Math.max(0, countdownElapsed - 3.000);
        const prevT = 0.000;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        audioEngine.updateFrame(simTime, prevT, true);
      }
    } else if (appState === 'REFIRE_HOLD') {
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        appState = 'PLAYING';
        syncAudioGate();
        const overDt = Math.max(0, holdElapsed - 1.000);
        const prevT = 0.000;
        simTime = Math.min(DURATION, overDt * playbackSpeed);
        elScrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        audioEngine.updateFrame(simTime, prevT, true);
      } else {
        renderAt(0.000);
      }
    } else if (appState === 'PLAYING') {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        renderAt(DURATION);
        audioEngine.updateFrame(DURATION, prevT, true);
        appState = 'ENDED';
        setToggleButtonVisual(false);
        syncAudioGate();
      } else {
        elScrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        audioEngine.updateFrame(simTime, prevT, true);
      }
    }
  }

  requestAnimationFrame(onFrame);
})();
</script>
</body>
</html>
