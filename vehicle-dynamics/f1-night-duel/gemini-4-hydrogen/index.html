    addPart(new THREE.TubeGeometry(haloHoopCurve, 18, 0.026, 8, false), carbonMat);

    // 4. Sculpted Sidepods with Radiator Inlets, Undercut & Wing Mirrors
    for (const s of [-1, 1]) {
      const spSections = [
        { x: -1.65, ring: makeRoundedRectRing(0.24, s * 0.22, 0.14, 0.10, 16) },
        { x: -1.10, ring: makeRoundedRectRing(0.29, s * 0.34, 0.18, 0.17, 16) },
        { x: -0.55, ring: makeRoundedRectRing(0.35, s * 0.45, 0.21, 0.24, 16) },
        { x: 0.00,  ring: makeRoundedRectRing(0.37, s * 0.47, 0.20, 0.25, 16) },
        { x: 0.38,  ring: makeRoundedRectRing(0.42, s * 0.45, 0.16, 0.23, 16) },
        { x: 0.52,  ring: makeRoundedRectRing(0.48, s * 0.44, 0.05, 0.21, 16) }
      ];
      addPart(createLoftedGeometry(spSections), liverySideMat);
      addPart(new THREE.BoxGeometry(0.12, 0.21, 0.34), darkMat, 0.36, 0.40, s * 0.44);
      addPart(new THREE.BoxGeometry(0.38, 0.28, 0.024), carbonMat, 0.68, 0.19, s * 0.58, 0, s * 0.14, 0);
      addPart(new THREE.BoxGeometry(0.04, 0.018, 0.24), carbonMat, 0.62, 0.56, s * 0.38, s * 0.18, 0, 0);
      addPart(new THREE.BoxGeometry(0.14, 0.065, 0.16), paintMat, 0.62, 0.59, s * 0.51);
      addPart(new THREE.PlaneGeometry(0.13, 0.05), mirrorGlassMat, 0.548, 0.59, s * 0.51, 0, -Math.PI * 0.5, 0);
    }

    // 5. Airbox, Roll Hoop, T-Cam, Tapering Engine Cover & Shark Fin
    const airboxGeo = new THREE.CylinderGeometry(0.13, 0.19, 0.42, 14);
    airboxGeo.rotateZ(Math.PI * 0.5);
    airboxGeo.scale(1, 1.15, 0.85);
    addPart(airboxGeo, paintMat, -0.04, 0.80, 0);
    const inletGeo = new THREE.CircleGeometry(0.11, 14);
    inletGeo.rotateY(Math.PI * 0.5);
    addPart(inletGeo, darkMat, 0.175, 0.81, 0);
    addPart(new THREE.BoxGeometry(0.14, 0.04, 0.055), carbonMat, 0.05, 0.96, 0);
    addPart(new THREE.BoxGeometry(0.08, 0.028, 0.34), carbonMat, 0.05, 0.985, 0);

    const engSections = [
      { x: -1.85, ring: makeRoundedRectRing(0.32, 0, 0.12, 0.07, 16) },
      { x: -1.25, ring: makeRoundedRectRing(0.46, 0, 0.21, 0.15, 16) },
      { x: -0.60, ring: makeRoundedRectRing(0.56, 0, 0.27, 0.21, 16) },
      { x: 0.02,  ring: makeRoundedRectRing(0.62, 0, 0.30, 0.23, 16) }
    ];
    addPart(createLoftedGeometry(engSections), paintMat);

    const finShape = new THREE.Shape();
    finShape.moveTo(-1.78, 0.42);
    finShape.lineTo(-0.08, 0.91);
    finShape.lineTo(-0.08, 0.65);
    finShape.lineTo(-1.78, 0.32);
    finShape.closePath();
    const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.022, bevelEnabled: false });
    finGeo.translate(0, 0, -0.011);
    const fUv = finGeo.attributes.uv;
    const fPos = finGeo.attributes.position;
    for (let i = 0; i < fUv.count; i++) {
      fUv.setXY(i, (fPos.getX(i) + 1.8) / 1.75, (fPos.getY(i) - 0.3) / 0.65);
    }
    addPart(finGeo, liverySideMat);

    // 6. Floor with Raised Edges, Venturi Strakes & Rear Diffuser + Exhaust
    addPart(new THREE.BoxGeometry(2.85, 0.025, 1.56), carbonMat, -0.45, 0.042, 0);
    for (const s of [-1, 1]) {
      addPart(new THREE.BoxGeometry(2.15, 0.045, 0.11), carbonMat, -0.42, 0.068, s * 0.81, s * -0.22, 0, 0);
      addPart(new THREE.BoxGeometry(1.10, 0.025, 0.04), accentPaintMat, -0.30, 0.088, s * 0.83);
    }
    addPart(new THREE.BoxGeometry(0.68, 0.028, 1.08), carbonMat, -2.18, 0.135, 0, 0, 0, -0.28);
    for (const sz of [-0.42, -0.15, 0.15, 0.42]) {
      addPart(new THREE.BoxGeometry(0.64, 0.17, 0.018), carbonMat, -2.18, 0.13, sz);
    }
    const exGeo = new THREE.CylinderGeometry(0.055, 0.062, 0.45, 12);
    exGeo.rotateZ(Math.PI * 0.5);
    addPart(exGeo, new THREE.MeshStandardMaterial({ color: srgbColor(0x6e6860), roughness: 0.32, metalness: 0.9 }), -2.18, 0.34, 0);

    // 7. Rear Wing (2-element + DRS flap + louvred endplates), Beam Wing & Rain Light
    addPart(new THREE.BoxGeometry(0.42, 0.42, 0.026), carbonMat, -2.15, 0.56, 0);
    addPart(makeWingAirfoil(0.96, 0.22, 0.024, 0.018, 0), carbonMat, -2.30, 0.41, 0, 0, 0, -0.22);
    addPart(makeWingAirfoil(1.02, 0.28, 0.032, 0.026, 0), paintMat, -2.26, 0.72, 0, 0, 0, -0.28);

    const drsPivot = new THREE.Group();
    drsPivot.position.set(-2.55, 0.935, 0);
    bodyInner.add(drsPivot);
    const drsFlap = new THREE.Mesh(makeWingAirfoil(1.00, 0.22, 0.022, 0.015, 0), accentPaintMat);
    drsFlap.position.set(0.18, -0.11, 0);
    drsFlap.rotation.z = -0.58;
    drsFlap.castShadow = true;
    drsPivot.add(drsFlap);

    const rwEndShape = new THREE.Shape();
    rwEndShape.moveTo(0, 0);
    rwEndShape.lineTo(0.62, 0.06);
    rwEndShape.lineTo(0.60, 0.62);
    rwEndShape.lineTo(0.06, 0.62);
    rwEndShape.quadraticCurveTo(-0.02, 0.35, 0, 0);
    const rwEndGeo = new THREE.ExtrudeGeometry(rwEndShape, { depth: 0.022, bevelEnabled: false });
    rwEndGeo.translate(0, 0, -0.011);
    for (const s of [-1, 1]) {
      addPart(rwEndGeo, paintMat, -2.62, 0.35, s * 0.515);
      for (let l = 0; l < 3; l++) {
        addPart(new THREE.BoxGeometry(0.14, 0.016, 0.036), accentPaintMat, -2.42 + l * 0.05, 0.84 - l * 0.045, s * 0.515, 0, 0, -0.45);
      }
    }

    addPart(new THREE.BoxGeometry(0.45, 0.14, 0.14), carbonMat, -2.46, 0.22, 0);
    const rainLightMat = new THREE.MeshBasicMaterial({ color: srgbColor(0xff1414) });
    addPart(new THREE.BoxGeometry(0.04, 0.11, 0.065), rainLightMat, -2.69, 0.22, 0);
    const rainGlowMat = new THREE.SpriteMaterial({
      map: glowTex,
      color: srgbColor(0xff2020),
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const rainGlow = new THREE.Sprite(rainGlowMat);
    rainGlow.position.set(-2.74, 0.22, 0);
    rainGlow.scale.set(1.2, 1.2, 1);
    bodyInner.add(rainGlow);

    // 8. Exposed Front & Rear Suspension Wishbones & Push-Rods
    for (const s of [-1, 1]) {
      addPart(makeTubeArm(new THREE.Vector3(1.94, 0.39, s * 0.15), new THREE.Vector3(1.80, 0.44, s * 0.72), 0.015), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(1.56, 0.38, s * 0.17), new THREE.Vector3(1.80, 0.44, s * 0.72), 0.015), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(1.92, 0.21, s * 0.15), new THREE.Vector3(1.80, 0.25, s * 0.72), 0.016), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(1.58, 0.21, s * 0.17), new THREE.Vector3(1.80, 0.25, s * 0.72), 0.016), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(1.60, 0.43, s * 0.16), new THREE.Vector3(1.80, 0.26, s * 0.70), 0.013), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(1.74, 0.31, s * 0.17), new THREE.Vector3(1.72, 0.32, s * 0.72), 0.012), carbonMat);

      addPart(makeTubeArm(new THREE.Vector3(-1.60, 0.39, s * 0.15), new THREE.Vector3(-1.80, 0.43, s * 0.64), 0.015), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(-1.98, 0.38, s * 0.12), new THREE.Vector3(-1.80, 0.43, s * 0.64), 0.015), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(-1.62, 0.21, s * 0.15), new THREE.Vector3(-1.80, 0.24, s * 0.64), 0.016), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(-2.02, 0.21, s * 0.12), new THREE.Vector3(-1.80, 0.24, s * 0.64), 0.016), carbonMat);
      addPart(makeTubeArm(new THREE.Vector3(-1.58, 0.42, s * 0.16), new THREE.Vector3(-1.80, 0.25, s * 0.62), 0.013), carbonMat);
    }

    // 9. Four Open Wheels
    const wheelConfigs = [
      { name: 'FL', x: 1.80, z: -0.845, w: 0.31, side: -1, front: true },
      { name: 'FR', x: 1.80, z: 0.845,  w: 0.31, side: 1,  front: true },
      { name: 'RL', x: -1.80, z: -0.80, w: 0.40, side: -1, front: false },
      { name: 'RR', x: -1.80, z: 0.80,  w: 0.40, side: 1,  front: false }
    ];

    const tyreSideMat = new THREE.MeshStandardMaterial({
      map: createTyreSidewallTexture(cfg.tyreBandCss),
      roughness: 0.62,
      metalness: 0.05,
      envMapIntensity: 0.35
    });
    const tyreTreadMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x141518),
      roughness: 0.42,
      metalness: 0.08,
      envMapIntensity: 0.55
    });
    const rimMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x2e343e),
      roughness: 0.28,
      metalness: 0.88,
      envMapIntensity: 1.1
    });
    const nutMat = new THREE.MeshStandardMaterial({
      color: srgbColor(cfg.nutHex),
      roughness: 0.25,
      metalness: 0.85
    });
    const caliperMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0xb8c0cc),
      roughness: 0.35,
      metalness: 0.8
    });

    const steerHubs = [];
    const wheelSpins = [];
    const brakeDiscMats = [];
    const brakeGlowSprites = [];

    for (const wc of wheelConfigs) {
      const steerHub = new THREE.Group();
      steerHub.position.set(wc.x, WHEEL_RADIUS, wc.z);
      root.add(steerHub);
      if (wc.front) steerHubs.push(steerHub);

      const discMat = new THREE.MeshStandardMaterial({
        color: srgbColor(0x3a3e44),
        emissive: srgbColor(0xff5200),
        emissiveIntensity: 0,
        roughness: 0.35,
        metalness: 0.85
      });
      brakeDiscMats.push(discMat);

      const discGeo = new THREE.CylinderGeometry(0.185, 0.185, 0.032, 24);
      discGeo.rotateX(Math.PI * 0.5);
      const disc = new THREE.Mesh(discGeo, discMat);
      disc.position.z = -wc.side * 0.035;
      steerHub.add(disc);

      const bgMat = new THREE.SpriteMaterial({
        map: glowTex,
        color: srgbColor(0xff5a00),
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const bg = new THREE.Sprite(bgMat);
      bg.position.z = wc.side * 0.04;
      bg.scale.set(0.65, 0.65, 1);
      steerHub.add(bg);
      brakeGlowSprites.push(bgMat);

      const caliper = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.065), caliperMat);
      caliper.position.set(-0.14, 0.08, -wc.side * 0.03);
      steerHub.add(caliper);

      const duct = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.24, 0.04), carbonMat);
      duct.position.set(0.03, 0, -wc.side * (wc.w * 0.5 + 0.02));
      steerHub.add(duct);

      const spinGroup = new THREE.Group();
      steerHub.add(spinGroup);
      wheelSpins.push({ group: spinGroup, front: wc.front });

      const hw = wc.w * 0.5;
      const treadGeo = new THREE.CylinderGeometry(WHEEL_RADIUS, WHEEL_RADIUS, wc.w * 0.88, 32, 1, true);
      treadGeo.rotateX(Math.PI * 0.5);
      const tread = new THREE.Mesh(treadGeo, tyreTreadMat);
      tread.castShadow = true;
      tread.receiveShadow = true;
      spinGroup.add(tread);

      const sideRingGeo = new THREE.RingGeometry(0.228, WHEEL_RADIUS, 32);
      const outerSide = new THREE.Mesh(sideRingGeo, tyreSideMat);
      outerSide.position.z = wc.side * (hw * 0.94);
      if (wc.side < 0) outerSide.rotation.y = Math.PI;
      spinGroup.add(outerSide);

      const innerSide = new THREE.Mesh(sideRingGeo, tyreTreadMat);
      innerSide.position.z = -wc.side * (hw * 0.94);
      if (wc.side > 0) innerSide.rotation.y = Math.PI;
      spinGroup.add(innerSide);

      const shoulderGeo = new THREE.TorusGeometry(WHEEL_RADIUS - 0.022, 0.022, 8, 28);
      for (const sz of [-1, 1]) {
        const sh = new THREE.Mesh(shoulderGeo, tyreTreadMat);
        sh.position.z = sz * (hw * 0.86);
        spinGroup.add(sh);
      }

      const rimBarrelGeo = new THREE.CylinderGeometry(0.23, 0.23, wc.w * 0.82, 24, 1, true);
      rimBarrelGeo.rotateX(Math.PI * 0.5);
      const rimBarrelMat = rimMat.clone();
      rimBarrelMat.side = THREE.DoubleSide;
      spinGroup.add(new THREE.Mesh(rimBarrelGeo, rimBarrelMat));

      for (let sp = 0; sp < 7; sp++) {
        const ang = (sp / 7) * Math.PI * 2;
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.022, 0.018), rimMat);
        spoke.position.set(Math.cos(ang) * 0.11, Math.sin(ang) * 0.11, wc.side * (hw * 0.62));
        spoke.rotation.z = ang;
        spinGroup.add(spoke);
      }

      const hubCyl = new THREE.CylinderGeometry(0.055, 0.06, 0.08, 12);
      hubCyl.rotateX(Math.PI * 0.5);
      const hubMesh = new THREE.Mesh(hubCyl, rimMat);
      hubMesh.position.z = wc.side * (hw * 0.58);
      spinGroup.add(hubMesh);

      const nutGeo = new THREE.CylinderGeometry(0.036, 0.036, 0.045, 6);
      nutGeo.rotateX(Math.PI * 0.5);
      const nutMesh = new THREE.Mesh(nutGeo, nutMat);
      nutMesh.position.z = wc.side * (hw * 0.72);
      spinGroup.add(nutMesh);
    }

    scene.add(root);

    return {
      root,
      bodyGroup,
      steerHubs,
      steerWheel: steerGroup,
      wheelSpins,
      drsPivot,
      rainLightMat,
      rainGlowMat,
      brakeDiscMats,
      brakeGlowSprites
    };
  }

  const carRed = buildF1Car({
    paintHex: 0xc8102e,
    paintCss: '#c8102e',
    accentHex: 0xf0f2f6,
    accentCss: '#f0f2f6',
    number: 7,
    helmetHex: 0xf2f4f8,
    visorHex: 0xd83020,
    tyreBandCss: '#d81e2c',
    nutHex: 0xd9383a
  });

  const carBlue = buildF1Car({
    paintHex: 0x1546c8,
    paintCss: '#1546c8',
    accentHex: 0xd8e0ec,
    accentCss: '#d8e0ec',
    number: 23,
    helmetHex: 0x102868,
    visorHex: 0x20a8ff,
    tyreBandCss: '#e5b818',
    nutHex: 0x3b82f6
  });

  // ---------------------------------------------------------------------------
  // 13. Closed-Form Particle Effects (Spray, Smoke, Sparks, Heat Shimmer, Flashes)
  // ---------------------------------------------------------------------------
  function createSoftPointsLayer(maxCount, tex, blending) {
    const pos = new Float32Array(maxCount * 3);
    const col = new Float32Array(maxCount * 3);
    const size = new Float32Array(maxCount);
    const alpha = new Float32Array(maxCount);

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: blending || THREE.NormalBlending,
      uniforms: THREE.UniformsUtils.merge([
        THREE.UniformsLib.fog,
        {
          uMap: { value: tex },
          uScale: { value: window.innerHeight * 0.5 }
        }
      ]),
      vertexShader: `
        attribute vec3 aColor;
        attribute float aSize;
        attribute float aAlpha;
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uScale;
        #include <fog_pars_vertex>
        void main() {
          vColor = aColor;
          vAlpha = aAlpha;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = aAlpha > 0.002 ? clamp(aSize * uScale / max(1.0, -mvPosition.z), 1.0, 190.0) : 0.0;
          gl_Position = projectionMatrix * mvPosition;
          #include <fog_vertex>
        }
      `,
      fragmentShader: `
        uniform sampler2D uMap;
        varying vec3 vColor;
        varying float vAlpha;
        #include <fog_pars_fragment>
        void main() {
          if (vAlpha <= 0.002) discard;
          vec4 tex = texture2D(uMap, gl_PointCoord);
          float a = tex.a * vAlpha;
          if (a <= 0.002) discard;
          gl_FragColor = vec4(vColor * tex.rgb, a);
          #include <fog_fragment>
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }
      `
    });
    mat.fog = true;
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    scene.add(pts);
    return { geo, mat, pos, col, size, alpha, count: maxCount };
  }

  const SPRAY_COUNT = 640;
  const spraySlots = [];
  for (let i = 0; i < SPRAY_COUNT; i++) {
    spraySlots.push({
      car: i < 320 ? 0 : 1,
      emitter: i % 5,
      life: 0.45 + simRng() * 0.65,
      phase: simRng(),
      vx: (simRng() - 0.5) * 2.6,
      vy: 0.75 + simRng() * 2.2,
      vz: (simRng() - 0.5) * 2.8,
      baseSize: 0.9 + simRng() * 1.4
    });
  }
  const sprayLayer = createSoftPointsLayer(SPRAY_COUNT, mistTex, THREE.NormalBlending);

  const SMOKE_COUNT = 240;
  const smokeSlots = [];
  for (let i = 0; i < SMOKE_COUNT; i++) {
    let mode;
    if (i < 120) mode = 0;
    else if (i < 170) mode = 1;
    else mode = 2;
    smokeSlots.push({
      mode,
      car: mode === 1 ? 0 : (i % 2),
      side: (i % 4 < 2) ? -1 : 1,
      tEmitFixed: mode === 0 ? (3.02 + simRng() * 2.05) : (mode === 1 ? (19.65 + simRng() * 0.85) : 0),
      life: mode === 0 ? (1.1 + simRng() * 0.8) : (mode === 1 ? (0.85 + simRng() * 0.65) : (0.35 + simRng() * 0.28)),
      phase: simRng(),
      vx: (simRng() - 0.5) * 1.4,
      vy: 0.45 + simRng() * 1.15,
      vz: (simRng() - 0.5) * 1.6,
      baseSize: mode === 2 ? (0.45 + simRng() * 0.4) : (0.85 + simRng() * 1.0)
    });
  }
  const smokeLayer = createSoftPointsLayer(SMOKE_COUNT, mistTex, THREE.NormalBlending);

  const SPARK_COUNT = 260;
  const sparkSlots = [];
  for (let i = 0; i < SPARK_COUNT; i++) {
    sparkSlots.push({
      car: i % 2,
      life: 0.18 + simRng() * 0.24,
      phase: simRng(),
      burstSeed: simRng() * 100,
      vx: -3 - simRng() * 10,
      vy: 0.5 + simRng() * 4.2,
      vz: (simRng() - 0.5) * 4.5,
      zOff: (simRng() - 0.5) * 0.35
    });
  }
  const sparkPos = new Float32Array(SPARK_COUNT * 6);
  const sparkCol = new Float32Array(SPARK_COUNT * 6);
  const sparkGeo = new THREE.BufferGeometry();
  sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
  sparkGeo.setAttribute('color', new THREE.BufferAttribute(sparkCol, 3));
  const sparkMat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const sparkLines = new THREE.LineSegments(sparkGeo, sparkMat);
  sparkLines.frustumCulled = false;
  scene.add(sparkLines);

  const FLASH_COUNT = 48;
  const flashEvents = [];
  const flashSprites = [];
  for (let i = 0; i < FLASH_COUNT; i++) {
    const row = Math.floor(simRng() * 10);
    const fx = -20 + simRng() * 100;
    const fy = 2.4 + row * 0.85;
    const fz = -18.2 - row * 1.7;
    const tBias = Math.pow(simRng(), 1.35);
    const tTrigger = BLUE_FINISH_TIME + 0.04 + tBias * (39.75 - BLUE_FINISH_TIME);
    const fMat = new THREE.SpriteMaterial({
      map: glowTex,
      color: srgbColor(0xeef6ff),
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const sp = new THREE.Sprite(fMat);
    sp.position.set(fx, fy, fz);
    const sc = 2.4 + simRng() * 2.2;
    sp.scale.set(sc, sc, 1);
    scene.add(sp);
    flashEvents.push({ tTrigger, dur: 0.08 + simRng() * 0.06, x: fx, y: fy, z: fz });
    flashSprites.push(fMat);
  }
  flashEvents.sort((a, b) => a.tTrigger - b.tTrigger);

  function getMastIllumAt(s) {
    let illum = 0.18;
    for (let k = 0; k < masts.length; k++) {
      const ds = wrapTrackDist(s, masts[k].s);
      if (Math.abs(ds) < 42) {
        illum += 0.85 * Math.exp(-(ds * ds) / (20 * 20));
      }
    }
    return clamp(illum, 0.16, 1.15);
  }

  // ---------------------------------------------------------------------------
  // 14. Car State Evaluation & Pure renderAt(simTime)
  // ---------------------------------------------------------------------------
  const tmpSampleR = makeTrackSample();
  const tmpSampleB = makeTrackSample();
  const tmpSampleEmit = makeTrackSample();
  const tmpSampleCam = makeTrackSample();

  const carStateR = {
    s: -8, d: -2.5, vs: 0, vd: 0, acc: 0, smoothAcc: 0,
    pos: new THREE.Vector3(), fwd: new THREE.Vector3(), nrm: new THREE.Vector3(), up: new THREE.Vector3(),
    vel: new THREE.Vector3(), basis: new THREE.Matrix4()
  };
  const carStateB = {
    s: -16, d: 2.5, vs: 0, vd: 0, acc: 0, smoothAcc: 0,
    pos: new THREE.Vector3(), fwd: new THREE.Vector3(), nrm: new THREE.Vector3(), up: new THREE.Vector3(),
    vel: new THREE.Vector3(), basis: new THREE.Matrix4()
  };

  function evalCarKinematics(t, evalS, evalD, samp, outState) {
    const resS = evalS(t);
    const resD = evalD(t);
    outState.s = resS.val;
    outState.vs = resS.vel;
    outState.acc = resS.acc;
    outState.smoothAcc = getSmoothAccel(evalS, t);
    outState.d = resD.val;
    outState.vd = resD.vel;

    sampleTrack(outState.s, samp);
    outState.pos.copy(samp.pos).addScaledVector(samp.nrm, outState.d);
    outState.nrm.copy(samp.nrm);

    const roadUp = outState.up.crossVectors(samp.nrm, samp.tan).normalize();
    if (outState.vs > 0.5) {
      outState.fwd.copy(samp.tan).multiplyScalar(outState.vs).addScaledVector(samp.nrm, outState.vd).normalize();
    } else {
      outState.fwd.copy(samp.tan);
    }
    const right = new THREE.Vector3().crossVectors(outState.fwd, roadUp).normalize();
    outState.up.crossVectors(right, outState.fwd).normalize();

    outState.vel.copy(samp.tan).multiplyScalar(outState.vs).addScaledVector(samp.nrm, outState.vd);
    outState.basis.makeBasis(outState.fwd, outState.up, right);
    outState.curv = samp.curv;
  }

  function getBrakeGlowLevel(evalS, t) {
    if (t <= 3.0) return 0;
    const d0 = Math.max(0, -getSmoothAccel(evalS, t));
    const d1 = Math.max(0, -getSmoothAccel(evalS, Math.max(0, t - 0.28)));
    const d2 = Math.max(0, -getSmoothAccel(evalS, Math.max(0, t - 0.56)));
    const decel = Math.max(d0, d1 * 0.62, d2 * 0.28);
    return clamp((decel - 2.0) / 28.0, 0, 1.0);
  }

  function updateCarMesh(carMesh, st, evalS, t, isBlue) {
    carMesh.root.position.copy(st.pos);
    carMesh.root.quaternion.setFromRotationMatrix(st.basis);

    const pitch = clamp(st.smoothAcc * 0.00055, -0.022, 0.015);
    const latAcc = st.vs * st.vs * st.curv;
    const roll = -clamp(latAcc * 0.0012, -0.028, 0.028);
    carMesh.bodyGroup.rotation.set(roll, 0, pitch);

    const steerAngle = clamp(Math.atan(3.6 * st.curv + (st.vs > 4 ? st.vd / st.vs * 0.35 : 0)), -0.35, 0.35);
    for (const hub of carMesh.steerHubs) {
      hub.rotation.y = -steerAngle;
    }
    carMesh.steerWheel.rotation.x = steerAngle * 1.4;

    const sStart = isBlue ? -16.0 : -8.0;
    const dist = Math.max(0, st.s - sStart);
    const launchSlip = (t > 3.0 && t < 5.0) ? Math.sin(((t - 3.0) / 2.0) * Math.PI) * 18.0 : 0;
    const spinFront = -dist / WHEEL_RADIUS;
    const spinRear = -(dist + launchSlip) / WHEEL_RADIUS;
    for (const ws of carMesh.wheelSpins) {
      ws.group.rotation.z = ws.front ? spinFront : spinRear;
    }

    const rainOn = ((t * 4.0) % 1.0) < 0.5;
    carMesh.rainLightMat.color.copy(srgbColor(rainOn ? 0xff1e1e : 0x260404));
    carMesh.rainGlowMat.opacity = rainOn ? 0.85 : 0.0;

    const heat = getBrakeGlowLevel(evalS, t);
    const glowColor = new THREE.Color().setRGB(heat * 3.8, heat * heat * 1.25, heat * heat * heat * 0.18);
    for (let i = 0; i < carMesh.brakeDiscMats.length; i++) {
      carMesh.brakeDiscMats[i].emissive.copy(glowColor);
      carMesh.brakeDiscMats[i].emissiveIntensity = 1.0;
      carMesh.brakeGlowSprites[i].opacity = heat * 0.55;
    }

    let drsOpen = 0;
    if (isBlue) {
      const openRamp = smoothstep(33.50, 33.62, t);
      const closeRamp = 1.0 - smoothstep(BLUE_FINISH_TIME - 0.02, BLUE_FINISH_TIME + 0.10, t);
      drsOpen = openRamp * closeRamp;
    }
    carMesh.drsPivot.rotation.z = -drsOpen * 0.52;
  }

  function updateParticles(t) {
    const pos = sprayLayer.pos, col = sprayLayer.col, sz = sprayLayer.size, alp = sprayLayer.alpha;
    const tmpPos = new THREE.Vector3();
    const emitOffsets = [
      [-1.85, 0.20, -0.84],
      [-1.85, 0.20, 0.84],
      [-2.15, 0.22, -0.80],
      [-2.15, 0.22, 0.80],
      [-2.35, 0.28, 0.0]
    ];

    for (let i = 0; i < SPRAY_COUNT; i++) {
      const sl = spraySlots[i];
      const life = sl.life;
      const cycle = Math.floor((t + sl.phase * life) / life);
      const tEmit = cycle * life - sl.phase * life;
      const age = t - tEmit;

      if (tEmit < 3.15 || age < 0 || age >= life) {
        alp[i] = 0;
        continue;
      }
      const isBlue = sl.car === 1;
      const evS = isBlue ? evalSB : evalSR;
      const evD = isBlue ? evalDB : evalDR;
      const sE = evS(tEmit);
      if (sE.vel < 8.0) {
        alp[i] = 0;
        continue;
      }
      const dE = evD(tEmit).val;
      sampleTrack(sE.val, tmpSampleEmit);
      const right = tmpSampleEmit.nrm;
      const fwd = tmpSampleEmit.tan;
      const up = new THREE.Vector3().crossVectors(right, fwd).normalize();

      const eo = emitOffsets[sl.emitter];
      tmpPos.copy(tmpSampleEmit.pos)
        .addScaledVector(right, dE + eo[2])
        .addScaledVector(fwd, eo[0])
        .addScaledVector(up, eo[1]);

      const spdFactor = clamp(sE.vel / 65.0, 0.2, 1.15);
      const dragFwd = sE.vel * 0.26 * (1 - Math.exp(-age * 2.2));
      const py = tmpPos.y + (sl.vy * spdFactor * age - 3.6 * age * age);
      const minY = tmpSampleEmit.pos.y + 0.08;
      pos[i * 3] = tmpPos.x + fwd.x * dragFwd + right.x * (sl.vz * age) + sl.vx * age;
      pos[i * 3 + 1] = py < minY ? minY : py;
      pos[i * 3 + 2] = tmpPos.z + fwd.z * dragFwd + right.z * (sl.vz * age) + sl.vx * age;

      const uLife = age / life;
      sz[i] = (sl.baseSize + uLife * 2.6) * (0.45 + 0.75 * spdFactor);
      const illum = getMastIllumAt(sE.val);
      const fade = Math.sin(uLife * Math.PI);
      const rainOn = sl.emitter === 4 && ((t * 4.0) % 1.0) < 0.5 && age < 0.25;
      if (rainOn) {
        col[i * 3] = 0.95; col[i * 3 + 1] = 0.16; col[i * 3 + 2] = 0.16;
        alp[i] = fade * 0.30 * spdFactor;
      } else {
        const b = 0.22 + illum * 0.62;
        col[i * 3] = b * 0.85; col[i * 3 + 1] = b * 0.92; col[i * 3 + 2] = b;
        alp[i] = fade * (0.11 + illum * 0.18) * spdFactor;
      }
    }
    sprayLayer.geo.attributes.position.needsUpdate = true;
    sprayLayer.geo.attributes.aColor.needsUpdate = true;
    sprayLayer.geo.attributes.aSize.needsUpdate = true;
    sprayLayer.geo.attributes.aAlpha.needsUpdate = true;

    const spos = smokeLayer.pos, scol = smokeLayer.col, ssz = smokeLayer.size, salp = smokeLayer.alpha;
    for (let i = 0; i < SMOKE_COUNT; i++) {
      const sl = smokeSlots[i];
      if (sl.mode === 2) {
        const life = sl.life;
        const cycle = Math.floor((t + sl.phase * life) / life);
        const tEmit = cycle * life - sl.phase * life;
        const age = t - tEmit;
        const st = sl.car === 0 ? carStateR : carStateB;
        const fade = Math.sin((age / life) * Math.PI);
        const wobble = Math.sin(t * 28.0 + i * 1.9) * 0.11;
        spos[i * 3] = st.pos.x - st.fwd.x * (2.5 + age * 1.4) + st.nrm.x * wobble;
        spos[i * 3 + 1] = st.pos.y + 0.38 + age * 1.85;
        spos[i * 3 + 2] = st.pos.z - st.fwd.z * (2.5 + age * 1.4) + st.nrm.z * wobble;
        ssz[i] = sl.baseSize + age * 0.9;
        scol[i * 3] = 0.55; scol[i * 3 + 1] = 0.62; scol[i * 3 + 2] = 0.72;
        const lowSpdVis = 1.0 - smoothstep(10, 45, st.vs);
        salp[i] = fade * 0.10 * (0.35 + 0.65 * lowSpdVis);
        continue;
      }

      const age = t - sl.tEmitFixed;
      if (age < 0 || age >= sl.life) {
        salp[i] = 0;
        continue;
      }
      const u = age / sl.life;
      if (sl.mode === 0) {
        const evS = sl.car === 0 ? evalSR : evalSB;
        const evD = sl.car === 0 ? evalDR : evalDB;
        const sE = evS(sl.tEmitFixed);
        const dE = evD(sl.tEmitFixed).val;
        sampleTrack(sE.val, tmpSampleEmit);
        const right = tmpSampleEmit.nrm;
        const fwd = tmpSampleEmit.tan;
        spos[i * 3] = tmpSampleEmit.pos.x + right.x * (dE + sl.side * 0.80) - fwd.x * 1.80 + sl.vx * age;
        spos[i * 3 + 1] = tmpSampleEmit.pos.y + 0.15 + sl.vy * age;
        spos[i * 3 + 2] = tmpSampleEmit.pos.z + right.z * (dE + sl.side * 0.80) - fwd.z * 1.80 + sl.vz * age;
        ssz[i] = sl.baseSize + u * 2.8;
        const lum = 0.62 + 0.25 * (1 - u);
        scol[i * 3] = lum * 0.92; scol[i * 3 + 1] = lum * 0.95; scol[i * 3 + 2] = lum;
        salp[i] = Math.sin(u * Math.PI) * 0.34;
      } else {
        const sE = evalSR(sl.tEmitFixed);
        const dE = evalDR(sl.tEmitFixed).val;
        sampleTrack(sE.val, tmpSampleEmit);
        const right = tmpSampleEmit.nrm;
        const fwd = tmpSampleEmit.tan;
        spos[i * 3] = tmpSampleEmit.pos.x + right.x * (dE - 0.84) + fwd.x * 1.80 + sl.vx * age;
        spos[i * 3 + 1] = tmpSampleEmit.pos.y + 0.16 + sl.vy * age * 0.9;
        spos[i * 3 + 2] = tmpSampleEmit.pos.z + right.z * (dE - 0.84) + fwd.z * 1.80 + sl.vz * age;
        ssz[i] = 0.75 + u * 2.3;
        scol[i * 3] = 0.78; scol[i * 3 + 1] = 0.82; scol[i * 3 + 2] = 0.88;
        salp[i] = Math.sin(u * Math.PI) * 0.44;
      }
    }
    smokeLayer.geo.attributes.position.needsUpdate = true;
    smokeLayer.geo.attributes.aColor.needsUpdate = true;
    smokeLayer.geo.attributes.aSize.needsUpdate = true;
    smokeLayer.geo.attributes.aAlpha.needsUpdate = true;

    for (let i = 0; i < SPARK_COUNT; i++) {
      const sl = sparkSlots[i];
      const life = sl.life;
      const cycle = Math.floor((t + sl.phase * life) / life);
      const tEmit = cycle * life - sl.phase * life;
      const age = t - tEmit;

      const idx6 = i * 6;
      if (tEmit < 3.2 || age < 0 || age >= life) {
        sparkPos[idx6 + 1] = -999; sparkPos[idx6 + 4] = -999;
        continue;
      }

      const evS = sl.car === 0 ? evalSR : evalSB;
      const evD = sl.car === 0 ? evalDR : evalDB;
      const sE = evS(tEmit);
      const accE = getSmoothAccel(evS, tEmit);
      const sparkTrigger = (sE.vel > 55.56) || (accE < -14.0);
      const burstWave = Math.sin(tEmit * 17.0 + sl.burstSeed) * Math.cos(tEmit * 7.3 + sl.car);
      if (!sparkTrigger || burstWave < -0.22) {
        sparkPos[idx6 + 1] = -999; sparkPos[idx6 + 4] = -999;
        continue;
      }

      const dE = evD(tEmit).val;
      sampleTrack(sE.val, tmpSampleEmit);
      const right = tmpSampleEmit.nrm;
      const fwd = tmpSampleEmit.tan;

      const ox = tmpSampleEmit.pos.x + right.x * (dE + sl.zOff) - fwd.x * 0.9;
      const oy = tmpSampleEmit.pos.y + 0.04;
      const oz = tmpSampleEmit.pos.z + right.z * (dE + sl.zOff) - fwd.z * 0.9;

      const evalSpark = (tau, outArr, off) => {
        const dragDist = sE.vel * 0.35 * tau + sl.vx * tau;
        let yRel = sl.vy * tau - 4.9 * tau * tau;
        if (yRel < 0) yRel = Math.abs(yRel) * 0.42;
        outArr[off] = ox + fwd.x * dragDist + right.x * sl.vz * tau;
        outArr[off + 1] = oy + yRel;
        outArr[off + 2] = oz + fwd.z * dragDist + right.z * sl.vz * tau;
      };

      const tailAge = Math.max(0, age - 0.028);
      evalSpark(age, sparkPos, idx6);
      evalSpark(tailAge, sparkPos, idx6 + 3);

      const u = age / life;
      const bright = 1.0 - u;
      sparkCol[idx6] = 1.0 * bright;
      sparkCol[idx6 + 1] = (0.85 - 0.45 * u) * bright;
      sparkCol[idx6 + 2] = (0.45 - 0.40 * u) * bright;
      sparkCol[idx6 + 3] = 0.85 * bright;
      sparkCol[idx6 + 4] = 0.32 * bright;
      sparkCol[idx6 + 5] = 0.02 * bright;
    }
    sparkGeo.attributes.position.needsUpdate = true;
    sparkGeo.attributes.color.needsUpdate = true;

    for (let i = 0; i < FLASH_COUNT; i++) {
      const fe = flashEvents[i];
      const age = t - fe.tTrigger;
      if (age >= 0 && age < fe.dur) {
        const s = Math.sin((age / fe.dur) * Math.PI);
        flashSprites[i].opacity = s * s * 0.95;
      } else {
        flashSprites[i].opacity = 0;
      }
    }
  }

  // ---------------------------------------------------------------------------
  // 15. Broadcast Camera Schedule (Pure Function of simTime, Hard Cuts)
  // ---------------------------------------------------------------------------
  const camPos = new THREE.Vector3();
  const camLook = new THREE.Vector3();
  const prevCamPos = new THREE.Vector3();
  const camVel = new THREE.Vector3();
  let currentShot = 1;

  function computeCameraPose(t, outPos, outLook, outUp) {
    evalCarKinematics(t, evalSR, evalDR, tmpSampleR, carStateR);
    evalCarKinematics(t, evalSB, evalDB, tmpSampleB, carStateB);
    const midX = 0.5 * (carStateR.pos.x + carStateB.pos.x);
    const midY = 0.5 * (carStateR.pos.y + carStateB.pos.y) + 0.45;
    const midZ = 0.5 * (carStateR.pos.z + carStateB.pos.z);

    outUp.set(0, 1, 0);
    let baseFov = 35;
    let shot = 1;

    if (t < 5) {
      shot = 1;
      outPos.set(-34, 2.6, 0);
      outLook.set(0, 3.0, 0);
      baseFov = 35;
    } else if (t < 11) {
      shot = 2;
      sampleTrack(carStateB.s - 9, tmpSampleCam);
      outPos.copy(tmpSampleCam.pos).addScaledVector(tmpSampleCam.nrm, carStateB.d);
      outPos.y += 2.4;
      sampleTrack(carStateB.s + 14, tmpSampleCam);
      outLook.copy(tmpSampleCam.pos);
      outLook.y += 0.9;
      baseFov = 50;
    } else if (t < 15) {
      shot = 3;
      sampleTrack(400, tmpSampleCam);
      outPos.copy(tmpSampleCam.pos).addScaledVector(tmpSampleCam.nrm, -18);
      outPos.y += 5.0;
      outLook.set(midX, midY, midZ);
      baseFov = 24;
    } else if (t < 20) {
      shot = 4;
      const localCam = new THREE.Vector3(-0.15, 1.25, 0);
      carBlue.root.updateMatrixWorld(true);
      localCam.applyMatrix4(carBlue.bodyGroup.matrixWorld);
      outPos.copy(localCam);

      const localTarget = new THREE.Vector3(40.0, 0.6, 0);
      localTarget.applyMatrix4(carBlue.root.matrixWorld);
      outLook.copy(localTarget);

      outUp.set(0, 1, 0).transformDirection(carBlue.bodyGroup.matrixWorld);
      baseFov = 75;
    } else if (t < 24) {
      shot = 5;
      sampleTrack(725, tmpSampleCam);
      outPos.copy(tmpSampleCam.pos).addScaledVector(tmpSampleCam.nrm, 20);
      outPos.y += 3.0;
      outLook.set(midX, midY, midZ);
      baseFov = 28;
    } else if (t < 30) {
      shot = 6;
      outPos.set(-80, 120, 150);
      outLook.set(midX, midY, midZ);
      baseFov = 30;
    } else if (t < 34) {
      shot = 7;
      sampleTrack(1300, tmpSampleCam);
      outPos.copy(tmpSampleCam.pos).addScaledVector(tmpSampleCam.nrm, -12);
      outPos.y += 1.2;
      outLook.set(midX, midY, midZ);
      baseFov = 30;
    } else {
      shot = 8;
      outPos.set(-20, 4.5, 15);
      outLook.set(midX, midY, midZ);
      baseFov = 32;
    }

    const aspect = camera.aspect || 1;
    const refAspect = 16 / 9;
    let effectiveFov = baseFov;
    if (shot !== 4 && aspect < refAspect) {
      effectiveFov = THREE.MathUtils.radToDeg(
        2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(baseFov) * 0.5) * (refAspect / aspect))
      );
    }
    return { shot, fov: effectiveFov };
  }

  function updateLightsAt(t) {
    const midPos = new THREE.Vector3().addVectors(carStateR.pos, carStateB.pos).multiplyScalar(0.5);
    const midS = 0.5 * (carStateR.s + carStateB.s);

    const sorted = masts.map(m => ({
      mast: m,
      ds: Math.abs(wrapTrackDist(midS, m.s))
    })).sort((a, b) => a.ds - b.ds);

    const keyMast = sorted[0].mast;
    const keyDir = new THREE.Vector3().subVectors(keyMast.head, keyMast.target).normalize();
    keyShadowLight.position.copy(midPos).addScaledVector(keyDir, 38);
    keyShadowLight.target.position.copy(midPos);
    keyShadowLight.target.updateMatrixWorld();

    for (let i = 0; i < 3; i++) {
      const item = sorted[i];
      const sl = localMastLights[i];
      sl.position.copy(item.mast.head);
      sl.target.position.copy(item.mast.target);
      sl.target.updateMatrixWorld();
      sl.intensity = 3.2 * (1.0 - smoothstep(45, 95, item.ds));
    }

    const rainOn = ((t * 4.0) % 1.0) < 0.5;
    rainPointR.position.copy(carStateR.pos).addScaledVector(carStateR.fwd, -2.9).add(new THREE.Vector3(0, 0.35, 0));
    rainPointB.position.copy(carStateB.pos).addScaledVector(carStateB.fwd, -2.9).add(new THREE.Vector3(0, 0.35, 0));
    rainPointR.intensity = rainOn ? 1.8 : 0;
    rainPointB.intensity = rainOn ? 1.8 : 0;

    const finishActive = t >= BLUE_FINISH_TIME;
    const greenFlashOn = finishActive && (((t - BLUE_FINISH_TIME) * 10.0) % 2.0 < 1.0);
    for (let i = 0; i < 5; i++) {
      const litRed = (t < 3.0) && (t >= (i + 1) * 0.5);
      if (finishActive) {
        gantryLights[i].color.copy(srgbColor(greenFlashOn ? 0x20ff55 : 0x051808));
        gantryGlows[i].color.copy(srgbColor(0x20ff55));
        gantryGlows[i].opacity = greenFlashOn ? 0.95 : 0;
      } else if (litRed) {
        gantryLights[i].color.copy(srgbColor(0xff1e1e));
        gantryGlows[i].color.copy(srgbColor(0xff1e1e));
        gantryGlows[i].opacity = 0.95;
      } else {
        gantryLights[i].color.copy(srgbColor(0x160707));
        gantryGlows[i].opacity = 0;
      }
    }
  }

  const camUp = new THREE.Vector3(0, 1, 0);
  const camTmpLook = new THREE.Vector3();
  const camTmpUp = new THREE.Vector3();

  function renderAt(t) {
    const tc = clamp(t, 0, DURATION);

    evalCarKinematics(tc, evalSR, evalDR, tmpSampleR, carStateR);
    evalCarKinematics(tc, evalSB, evalDB, tmpSampleB, carStateB);
    updateCarMesh(carRed, carStateR, evalSR, tc, false);
    updateCarMesh(carBlue, carStateB, evalSB, tc, true);

    const camInfo = computeCameraPose(tc, camPos, camLook, camUp);
    currentShot = camInfo.shot;
    camera.fov = camInfo.fov;
    camera.position.copy(camPos);
    camera.up.copy(camUp);
    camera.lookAt(camLook);
    camera.updateProjectionMatrix();

    if (tc < DURATION - 0.02 && (currentShot === 2 || currentShot === 4)) {
      computeCameraPose(tc + 0.02, prevCamPos, camTmpLook, camTmpUp);
      camVel.subVectors(prevCamPos, camPos).multiplyScalar(50.0);
    } else {
      camVel.set(0, 0, 0);
    }

    skyDome.position.copy(camPos);

    updateLightsAt(tc);
    updateParticles(tc);

    renderer.render(scene, camera);
  }

  // ---------------------------------------------------------------------------
  // 16. Web Audio Synthesizer (Seed 4242, No Music, Read-Only over simTime)
  // ---------------------------------------------------------------------------
  let audioCtx = null;
  let audioMaster = null;
  let audioBuilt = false;
  const activeOneShots = new Set();
  let lastAudioSimTime = -1;
  let isScrubbing = false;

  const audioVoices = {
    red: null,
    blue: null,
    windGain: null,
    windFilter: null,
    crowdGain: null,
    crowdFilter: null,
    humGain: null,
    breezeGain: null
  };

  function createNoiseBuffer(ctx, seconds, seededRng) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      ch[i] = seededRng() * 2 - 1;
    }
    return buf;
  }

  function createPinkNoiseBuffer(ctx, seconds, seededRng) {
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const ch = buf.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < len; i++) {
      const white = seededRng() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      ch[i] = clamp((b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11, -1, 1);
      b6 = white * 0.115926;
    }
    return buf;
  }

  function setListenerPose(listener, pos, fwd, up) {
    if ('positionX' in listener) {
      listener.positionX.value = pos.x;
      listener.positionY.value = pos.y;
      listener.positionZ.value = pos.z;
      listener.forwardX.value = fwd.x;
      listener.forwardY.value = fwd.y;
      listener.forwardZ.value = fwd.z;
      listener.upX.value = up.x;
      listener.upY.value = up.y;
      listener.upZ.value = up.z;
    } else if (listener.setPosition) {
      listener.setPosition(pos.x, pos.y, pos.z);
      listener.setOrientation(fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
    }
  }

  function setPannerPos(panner, pos) {
    if ('positionX' in panner) {
      panner.positionX.value = pos.x;
      panner.positionY.value = pos.y;
      panner.positionZ.value = pos.z;
    } else if (panner.setPosition) {
      panner.setPosition(pos.x, pos.y, pos.z);
    }
  }

  function buildCarAudioVoice(ctx, dest, whiteBuf, pinkBuf, profile) {
    const panner = ctx.createPanner();
    panner.panningModel = 'HRTF';
    panner.distanceModel = 'inverse';
    panner.refDistance = 12;
    panner.maxDistance = 900;
    panner.rolloffFactor = 1.15;
    panner.connect(dest);

    const engFilter = ctx.createBiquadFilter();
    engFilter.type = 'lowpass';
    engFilter.frequency.value = 1800;
    engFilter.Q.value = 1.4;

    const cockpitFilter = ctx.createBiquadFilter();
    cockpitFilter.type = 'lowpass';
    cockpitFilter.frequency.value = 20000;
    cockpitFilter.Q.value = 0.7;

    const engMaster = ctx.createGain();
    engMaster.gain.value = 0;

    const formant = ctx.createBiquadFilter();
    formant.type = 'peaking';
    formant.frequency.value = profile.formantFreq;
    formant.Q.value = 2.0;
    formant.gain.value = 4.5;

    engFilter.connect(formant);
    formant.connect(cockpitFilter);
    cockpitFilter.connect(engMaster);
    engMaster.connect(panner);

    const oscSpecs = [
      { type: 'sawtooth', mult: 0.5, g: profile.g05 },
      { type: 'sawtooth', mult: 1.0, g: profile.g10 },
      { type: 'triangle', mult: 1.5, g: profile.g15 },
      { type: 'sawtooth', mult: 2.0, g: profile.g20 },
      { type: 'sine',     mult: 3.0, g: profile.g30 }
    ];
    const oscs = oscSpecs.map(sp => {
      const o = ctx.createOscillator();
      o.type = sp.type;
      const g = ctx.createGain();
      g.gain.value = sp.g;
      o.connect(g);
      g.connect(engFilter);
      o.start();
      return { osc: o, mult: sp.mult };
    });

    const turboOsc = ctx.createOscillator();
    turboOsc.type = 'sine';
    const turboGain = ctx.createGain();
    turboGain.gain.value = 0;
    turboOsc.connect(turboGain);
    turboGain.connect(cockpitFilter);
    turboOsc.start();

    const exhSrc = ctx.createBufferSource();
    exhSrc.buffer = pinkBuf;
    exhSrc.loop = true;
    const exhFilter = ctx.createBiquadFilter();
    exhFilter.type = 'bandpass';
    exhFilter.frequency.value = 700;
    exhFilter.Q.value = 1.5;
    const exhGain = ctx.createGain();
    exhGain.gain.value = 0;
    exhSrc.connect(exhFilter);
    exhFilter.connect(exhGain);
    exhGain.connect(engFilter);
    exhSrc.start();

    const wetSrc = ctx.createBufferSource();
    wetSrc.buffer = whiteBuf;
    wetSrc.loop = true;
    const wetFilter = ctx.createBiquadFilter();
    wetFilter.type = 'bandpass';
    wetFilter.frequency.value = 1550;
    wetFilter.Q.value = 0.7;
    const wetGain = ctx.createGain();
    wetGain.gain.value = 0;
    wetSrc.connect(wetFilter);
    wetFilter.connect(wetGain);
    wetGain.connect(panner);
    wetSrc.start();

    const squealSrc = ctx.createBufferSource();
    squealSrc.buffer = whiteBuf;
    squealSrc.loop = true;
    const squealFilter = ctx.createBiquadFilter();
    squealFilter.type = 'bandpass';
    squealFilter.frequency.value = 1050;
    squealFilter.Q.value = 6.5;
    const squealGain = ctx.createGain();
    squealGain.gain.value = 0;
    squealSrc.connect(squealFilter);
    squealFilter.connect(squealGain);
    squealGain.connect(panner);
    squealSrc.start();

    const sparkSrc = ctx.createBufferSource();
    sparkSrc.buffer = whiteBuf;
    sparkSrc.loop = true;
    const sparkFilter = ctx.createBiquadFilter();
    sparkFilter.type = 'highpass';
    sparkFilter.frequency.value = 3400;
    const sparkGain = ctx.createGain();
    sparkGain.gain.value = 0;
    sparkSrc.connect(sparkFilter);
    sparkFilter.connect(sparkGain);
    sparkGain.connect(panner);
    sparkSrc.start();

    const brakeOsc = ctx.createOscillator();
    brakeOsc.type = 'triangle';
    brakeOsc.frequency.value = 2650;
    const brakeGain = ctx.createGain();
    brakeGain.gain.value = 0;
    brakeOsc.connect(brakeGain);
    brakeGain.connect(panner);
    brakeOsc.start();

    return {
      profile, panner, oscs, engFilter, cockpitFilter, engMaster,
      turboOsc, turboGain, exhFilter, exhGain,
      wetFilter, wetGain, squealFilter, squealGain, sparkGain, brakeOsc, brakeGain
    };
  }

  function initAudioContext() {
    if (audioBuilt && audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();

    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -14;
    compressor.knee.value = 12;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.14;
    compressor.connect(audioCtx.destination);

    audioMaster = audioCtx.createGain();
    audioMaster.gain.value = 0;
    audioMaster.connect(compressor);

    const whiteBuf = createNoiseBuffer(audioCtx, 2.0, audioRng);
    const pinkBuf = createPinkNoiseBuffer(audioCtx, 2.5, audioRng);
    audioVoices.whiteBuf = whiteBuf;
    audioVoices.pinkBuf = pinkBuf;

    audioVoices.red = buildCarAudioVoice(audioCtx, audioMaster, whiteBuf, pinkBuf, {
      pitchBias: 1.0,
      formantFreq: 640,
      g05: 0.30, g10: 0.42, g15: 0.16, g20: 0.22, g30: 0.08,
      turboBase: 2800
    });
    audioVoices.blue = buildCarAudioVoice(audioCtx, audioMaster, whiteBuf, pinkBuf, {
      pitchBias: 1.045,
      formantFreq: 940,
      g05: 0.20, g10: 0.38, g15: 0.28, g20: 0.26, g30: 0.12,
      turboBase: 3250
    });

    const windSrc = audioCtx.createBufferSource();
    windSrc.buffer = pinkBuf;
    windSrc.loop = true;
    const windFilter = audioCtx.createBiquadFilter();
    windFilter.type = 'bandpass';
    windFilter.frequency.value = 420;
    windFilter.Q.value = 0.65;
    const windGain = audioCtx.createGain();
    windGain.gain.value = 0;
    windSrc.connect(windFilter);
    windFilter.connect(windGain);
    windGain.connect(audioMaster);
    windSrc.start();
    audioVoices.windGain = windGain;
    audioVoices.windFilter = windFilter;

    const crowdPanner = audioCtx.createPanner();
    crowdPanner.panningModel = 'equalpower';
    crowdPanner.distanceModel = 'inverse';
    crowdPanner.refDistance = 35;
    crowdPanner.maxDistance = 1200;
    crowdPanner.rolloffFactor = 0.85;
    setPannerPos(crowdPanner, new THREE.Vector3(30, 6, -26));
    crowdPanner.connect(audioMaster);

    const crowdSrc = audioCtx.createBufferSource();
    crowdSrc.buffer = pinkBuf;
    crowdSrc.loop = true;
    const crowdFilter = audioCtx.createBiquadFilter();
    crowdFilter.type = 'bandpass';
    crowdFilter.frequency.value = 520;
    crowdFilter.Q.value = 0.55;
    const crowdGain = audioCtx.createGain();
    crowdGain.gain.value = 0;
    crowdSrc.connect(crowdFilter);
    crowdFilter.connect(crowdGain);
    crowdGain.connect(crowdPanner);
    crowdSrc.start();
    audioVoices.crowdGain = crowdGain;
    audioVoices.crowdFilter = crowdFilter;

    const humOsc1 = audioCtx.createOscillator();
    humOsc1.type = 'sine';
    humOsc1.frequency.value = 120;
    const humOsc2 = audioCtx.createOscillator();
    humOsc2.type = 'sine';
    humOsc2.frequency.value = 240;
    const humGain = audioCtx.createGain();
    humGain.gain.value = 0;
    humOsc1.connect(humGain);
    humOsc2.connect(humGain);
    humGain.connect(audioMaster);
    humOsc1.start();
    humOsc2.start();
    audioVoices.humGain = humGain;

    const breezeSrc = audioCtx.createBufferSource();
    breezeSrc.buffer = pinkBuf;
    breezeSrc.loop = true;
    const breezeFilter = audioCtx.createBiquadFilter();
    breezeFilter.type = 'lowpass';
    breezeFilter.frequency.value = 340;
    const breezeGain = audioCtx.createGain();
    breezeGain.gain.value = 0;
    breezeSrc.connect(breezeFilter);
    breezeFilter.connect(breezeGain);
    breezeGain.connect(audioMaster);
    breezeSrc.start();
    audioVoices.breezeGain = breezeGain;

    audioBuilt = true;
    audioCtx.resume().catch(() => {});
  }

  function registerOneShot(node, endDelaySec) {
    activeOneShots.add(node);
    node.onended = () => {
      activeOneShots.delete(node);
      try { node.disconnect(); } catch (_) {}
    };
    node.stop(audioCtx.currentTime + endDelaySec);
  }

  function stopAllOneShots() {
    for (const node of activeOneShots) {
      try { node.stop(); } catch (_) {}
      try { node.disconnect(); } catch (_) {}
    }
    activeOneShots.clear();
  }

  function triggerBeep() {
    if (!audioBuilt || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(880, now);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(0.16, now + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);
    osc.connect(g);
    g.connect(audioMaster);
    osc.start(now);
    registerOneShot(osc, 0.14);
  }

  function triggerDrsClick(isOpen) {
    if (!audioBuilt || !audioCtx || !audioVoices.whiteBuf) return;
    const now = audioCtx.currentTime;
    const src = audioCtx.createBufferSource();
    src.buffer = audioVoices.whiteBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.setValueAtTime(isOpen ? 1950 : 1150, now);
    flt.Q.value = 3.5;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(isOpen ? 0.28 : 0.15, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.045);
    src.connect(flt);
    flt.connect(g);
    g.connect(audioMaster);
    src.start(now);
    registerOneShot(src, 0.05);
  }

  function triggerShutterClick(fx, fy, fz) {
    if (!audioBuilt || !audioCtx || !audioVoices.whiteBuf) return;
    const now = audioCtx.currentTime;
    const pan = audioCtx.createPanner();
    pan.panningModel = 'equalpower';
    pan.refDistance = 25;
    setPannerPos(pan, new THREE.Vector3(fx, fy, fz));
    pan.connect(audioMaster);

    const src = audioCtx.createBufferSource();
    src.buffer = audioVoices.whiteBuf;
    const flt = audioCtx.createBiquadFilter();
    flt.type = 'highpass';
    flt.frequency.value = 3600;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);
    src.connect(flt);
    flt.connect(g);
    g.connect(pan);
    src.start(now);
    registerOneShot(src, 0.03);
  }

  const GEAR_THRESHOLDS = [0, 22, 31, 39, 47, 54, 61, 68, 82];

  function evalEngineRpmAndShift(v, acc, t) {
    if (t < 3.0) {
      const idleBurble = 4850 + Math.sin(t * 14.0) * 180 + Math.sin(t * 23.0) * 90;
      const revUp = smoothstep(2.35, 2.98, t);
      return { rpm: idleBurble + revUp * 5900, shiftDip: 1.0, throttle: 0.25 + revUp * 0.65 };
    }
    let gear = 1;
    for (let g = 1; g <= 8; g++) {
      if (v >= GEAR_THRESHOLDS[g - 1]) gear = g;
    }
    const vLo = GEAR_THRESHOLDS[gear - 1];
    const vHi = GEAR_THRESHOLDS[gear];
    const frac = clamp((v - vLo) / Math.max(1, vHi - vLo), 0, 1);

    let rpm = gear === 1 ? (5400 + frac * 6800) : (8400 + frac * 3800);
    let shiftDip = 1.0;

    if (gear > 1 && v - vLo < 1.1) {
      const u = (v - vLo) / 1.1;
      if (acc >= -2) {
        shiftDip = 0.62 + 0.38 * u;
      } else {
        rpm += Math.sin(u * Math.PI) * 1400;
      }
    }
    const throttle = clamp((acc + 8.0) / 22.0, 0.18, 1.0);
    return { rpm: clamp(rpm, 4500, 12500), shiftDip, throttle };
  }

  function updateCarVoice(voice, st, t, isOnboardSelf) {
    const now = audioCtx.currentTime;
    setPannerPos(voice.panner, new THREE.Vector3(st.pos.x, st.pos.y + 0.5, st.pos.z));

    const toCam = new THREE.Vector3().subVectors(camPos, st.pos);
    const dist = Math.max(0.5, toCam.length());
    toCam.divideScalar(dist);
    const relSpeed = new THREE.Vector3().subVectors(st.vel, camVel).dot(toCam);
    const doppler = clamp(343.0 / Math.max(120, 343.0 - relSpeed), 0.72, 1.38);

    const eng = evalEngineRpmAndShift(st.vs, st.smoothAcc, t);
    const fireHz = (eng.rpm / 60.0) * 3.0 * voice.profile.pitchBias * doppler;

    for (let i = 0; i < voice.oscs.length; i++) {
      voice.oscs[i].osc.frequency.setTargetAtTime(clamp(fireHz * voice.oscs[i].mult, 25, 16000), now, 0.015);
    }

    const cutoff = (950 + eng.throttle * 2650) * (isOnboardSelf ? 0.65 : 1.0);
    voice.engFilter.frequency.setTargetAtTime(cutoff, now, 0.02);
    voice.cockpitFilter.frequency.setTargetAtTime(isOnboardSelf ? 1350 : 19500, now, 0.02);

    const baseLevel = (0.14 + eng.throttle * 0.16) * eng.shiftDip * (isOnboardSelf ? 1.55 : 1.0);
    voice.engMaster.gain.setTargetAtTime(baseLevel, now, 0.015);

    const turboHz = (voice.profile.turboBase + (eng.rpm - 4500) * 0.52) * doppler;
    voice.turboOsc.frequency.setTargetAtTime(clamp(turboHz, 500, 14000), now, 0.02);
    voice.turboGain.gain.setTargetAtTime(0.012 + eng.throttle * 0.028 * clamp((eng.rpm - 5000) / 7000, 0, 1), now, 0.02);

    voice.exhFilter.frequency.setTargetAtTime(clamp(fireHz * 2.1, 180, 5000), now, 0.02);
    voice.exhGain.gain.setTargetAtTime(0.05 + eng.throttle * 0.10, now, 0.02);

    const spdNorm = clamp(st.vs / 70.0, 0, 1.1);
    voice.wetFilter.frequency.setTargetAtTime(900 + spdNorm * 1400, now, 0.02);
    voice.wetGain.gain.setTargetAtTime(Math.pow(spdNorm, 1.35) * 0.14, now, 0.02);

    const launchSlip = (t > 3.02 && t < 5.05) ? Math.sin(((t - 3.02) / 2.03) * Math.PI) * 0.13 : 0;
    const latLoad = clamp((Math.abs(st.vs * st.vs * st.curv) - 10.0) / 24.0, 0, 1);
    const brakeLoad = clamp((-st.smoothAcc - 14.0) / 22.0, 0, 1);
    const wetSqueal = Math.max(launchSlip, Math.max(latLoad * 0.075, brakeLoad * 0.085));
    voice.squealFilter.frequency.setTargetAtTime(launchSlip > 0.02 ? 1180 * doppler : 890 * doppler, now, 0.02);
    voice.squealGain.gain.setTargetAtTime(wetSqueal, now, 0.02);

    const sparking = (t > 3.2) && ((st.vs > 55.56) || (st.smoothAcc < -14.0));
    voice.sparkGain.gain.setTargetAtTime(sparking ? 0.055 : 0, now, 0.015);

    const hardBrake = clamp((-st.smoothAcc - 22.0) / 14.0, 0, 1);
    voice.brakeOsc.frequency.setTargetAtTime(2580 * doppler, now, 0.02);
    voice.brakeGain.gain.setTargetAtTime(hardBrake * 0.025, now, 0.02);
  }

  function updateAudio(t, prevT, isPlayingActive) {
    if (!audioCtx) return;
    if (!audioBuilt) {
      if (isPlayingActive) {
        try { initAudioContext(); } catch (_) {}
      }
      if (!audioBuilt) return;
    }
    if (!audioMaster) return;
    const now = audioCtx.currentTime;

    if (!isPlayingActive || isScrubbing) {
      audioMaster.gain.setTargetAtTime(0, now, 0.012);
      stopAllOneShots();
      lastAudioSimTime = -1;
      return;
    }

    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }

    audioMaster.gain.setTargetAtTime(0.85, now, 0.018);

    const camFwd = new THREE.Vector3().subVectors(camLook, camPos).normalize();
    setListenerPose(audioCtx.listener, camPos, camFwd, camUp);

    updateCarVoice(audioVoices.red, carStateR, t, false);
    updateCarVoice(audioVoices.blue, carStateB, t, currentShot === 4);

    const windLevel = currentShot === 4 ? clamp(Math.pow(carStateB.vs / 70.0, 1.5) * 0.16, 0, 0.18) : 0;
    audioVoices.windGain.gain.setTargetAtTime(windLevel, now, 0.02);
    audioVoices.windFilter.frequency.setTargetAtTime(300 + carStateB.vs * 8.0, now, 0.02);

    const swell = smoothstep(33.0, BLUE_FINISH_TIME, t) * 0.18;
    const roar = smoothstep(BLUE_FINISH_TIME - 0.05, BLUE_FINISH_TIME + 0.35, t) * (1.0 - smoothstep(38.2, 40.0, t) * 0.45) * 0.45;
    audioVoices.crowdGain.gain.setTargetAtTime(0.03 + swell + roar, now, 0.04);
    audioVoices.crowdFilter.frequency.setTargetAtTime(480 + roar * 1100, now, 0.05);

    audioVoices.humGain.gain.setTargetAtTime(0.012, now, 0.04);
    audioVoices.breezeGain.gain.setTargetAtTime(0.022, now, 0.04);

    if (lastAudioSimTime >= 0 && t > lastAudioSimTime && t - lastAudioSimTime < 0.35) {
      const p0 = lastAudioSimTime;
      for (const bt of [0.5, 1.0, 1.5, 2.0, 2.5]) {
        if (p0 < bt && t >= bt) triggerBeep();
      }
      if (p0 < 33.500 && t >= 33.500) triggerDrsClick(true);
      if (p0 < BLUE_FINISH_TIME && t >= BLUE_FINISH_TIME) triggerDrsClick(false);

      for (let i = 0; i < flashEvents.length; i++) {
        const fe = flashEvents[i];
        if (p0 < fe.tTrigger && t >= fe.tTrigger) {
          triggerShutterClick(fe.x, fe.y, fe.z);
        }
      }
    }
    lastAudioSimTime = t;
  }

  try {
    initAudioContext();
  } catch (_) {}
  const unlockAudio = () => {
    if (!audioCtx) {
      try { initAudioContext(); } catch (_) {}
    } else if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
  };
  window.addEventListener('pointerdown', unlockAudio);
  window.addEventListener('keydown', unlockAudio);

  // ---------------------------------------------------------------------------
  // 17. Playback State Machine & Canonical Dock Wiring
  // ---------------------------------------------------------------------------
  const countdownEl = document.getElementById('countdown');
  const btnRefire = document.getElementById('btn-refire');
  const btnToggle = document.getElementById('btn-toggle');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const speedPills = Array.from(document.querySelectorAll('.speed-pill'));
  const scrubber = document.getElementById('scrubber');

  let state = 'COUNTDOWN';
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let firstRaf = true;
  let lastTs = 0;

  function setToggleIcon(showPause) {
    if (showPause) {
      iconPause.style.display = '';
      iconPlay.style.display = 'none';
      btnToggle.setAttribute('aria-label', 'Pause');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = '';
      btnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }

  btnToggle.addEventListener('click', () => {
    unlockAudio();
    isScrubbing = false;
    if (state === 'PLAYING') {
      state = 'PAUSED';
      setToggleIcon(false);
      updateAudio(simTime, simTime, false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = '0';
      state = 'PAUSED';
      setToggleIcon(false);
      updateAudio(simTime, simTime, false);
    } else if (state === 'PAUSED') {
      state = 'PLAYING';
      setToggleIcon(true);
      lastAudioSimTime = simTime;
      updateAudio(simTime, simTime, true);
    } else if (state === 'ENDED') {
      hideCountdown();
      simTime = 0.0;
      scrubber.value = '0';
      state = 'PLAYING';
      setToggleIcon(true);
      renderAt(0);
      lastAudioSimTime = 0;
      updateAudio(0, 0, true);
    }
  });

  speedPills.forEach(pill => {
    pill.addEventListener('click', () => {
      unlockAudio();
      playbackSpeed = parseFloat(pill.dataset.speed);
      speedPills.forEach(p => {
        const active = p === pill;
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  scrubber.addEventListener('pointerdown', () => {
    isScrubbing = true;
    updateAudio(simTime, simTime, false);
  });
  window.addEventListener('pointerup', () => {
    if (isScrubbing) {
      isScrubbing = false;
    }
  });
  window.addEventListener('pointercancel', () => {
    if (isScrubbing) {
      isScrubbing = false;
    }
  });

  scrubber.addEventListener('input', () => {
    unlockAudio();
    if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
    }
    simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
    state = 'PAUSED';
    setToggleIcon(false);
    renderAt(simTime);
    updateAudio(simTime, simTime, false);
  });

  btnRefire.addEventListener('click', () => {
    unlockAudio();
    isScrubbing = false;
    hideCountdown();
    simTime = 0.0;
    holdElapsed = 0.0;
    scrubber.value = '0';
    state = 'REFIRE_HOLD';
    setToggleIcon(true);
    renderAt(0);
    updateAudio(0, 0, false);
  });

  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    camera.aspect = w / h;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    sprayLayer.mat.uniforms.uScale.value = h * 0.5;
    smokeLayer.mat.uniforms.uScale.value = h * 0.5;
    renderAt(simTime);
  });

  renderAt(0);

  function tick(ts) {
    if (firstRaf) {
      firstRaf = false;
      lastTs = ts;
      countdownElapsed = 0;
      renderAt(simTime);
      requestAnimationFrame(tick);
      return;
    }

    const rawDt = Math.max(0, (ts - lastTs) * 0.001);
    lastTs = ts;
    const dt = Math.min(rawDt, 0.1);

    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '3';
      } else if (countdownElapsed < 2.0) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '2';
      } else if (countdownElapsed < 3.0) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '1';
      } else {
        hideCountdown();
        state = 'PLAYING';
        lastAudioSimTime = 0;
        simTime = Math.min(DURATION, dt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        updateAudio(simTime, 0, true);
      }
      if (state === 'COUNTDOWN') {
        renderAt(0);
        updateAudio(0, 0, false);
      }
    } else if (state === 'REFIRE_HOLD') {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.0) {
        state = 'PLAYING';
        lastAudioSimTime = 0;
        simTime = Math.min(DURATION, dt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        updateAudio(simTime, 0, true);
      } else {
        renderAt(0);
        updateAudio(0, 0, false);
      }
    } else if (state === 'PLAYING') {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAt(DURATION);
        state = 'ENDED';
        setToggleIcon(false);
        updateAudio(DURATION, DURATION, false);
      } else {
        updateAudio(simTime, prevT, true);
      }
    } else {
      updateAudio(simTime, simTime, false);
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
