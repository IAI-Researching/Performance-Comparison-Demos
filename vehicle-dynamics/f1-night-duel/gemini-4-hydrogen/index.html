<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  const DURATION = 40;
  const WHEEL_RADIUS = 0.36;

  // ---------------------------------------------------------------------------
  // 1. Seeded Deterministic PRNG (Mulberry32)
  // ---------------------------------------------------------------------------
  function createPRNG(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const simRng = createPRNG(42);
  const audioRng = createPRNG(4242);

  function srgbColor(hex) {
    return new THREE.Color(hex).convertSRGBToLinear();
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }

  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // ---------------------------------------------------------------------------
  // 2. Circuit Spline & Arc-Length Lookup Table
  // ---------------------------------------------------------------------------
  const CIRCUIT_POINTS = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(200, 0, 0),
    new THREE.Vector3(320, 5, 60),
    new THREE.Vector3(340, 12, 180),
    new THREE.Vector3(260, 20, 260),
    new THREE.Vector3(120, 15, 240),
    new THREE.Vector3(60, 8, 320),
    new THREE.Vector3(-80, 4, 340),
    new THREE.Vector3(-200, 0, 260),
    new THREE.Vector3(-240, 0, 120),
    new THREE.Vector3(-160, 0, 40),
    new THREE.Vector3(-80, 0, 0)
  ];

  const circuitCurve = new THREE.CatmullRomCurve3(CIRCUIT_POINTS, true, 'centripetal');
  const TRACK_SAMPLES = 4000;
  const trackPos = new Float32Array((TRACK_SAMPLES + 1) * 3);
  const trackTan = new Float32Array((TRACK_SAMPLES + 1) * 3);
  const trackNrm = new Float32Array((TRACK_SAMPLES + 1) * 3);
  const trackArc = new Float32Array(TRACK_SAMPLES + 1);
  const trackCurv = new Float32Array(TRACK_SAMPLES + 1);

  (function buildTrackTable() {
    const tmp = new THREE.Vector3();
    const prev = new THREE.Vector3();
    for (let i = 0; i <= TRACK_SAMPLES; i++) {
      circuitCurve.getPoint(i / TRACK_SAMPLES, tmp);
      trackPos[i * 3] = tmp.x;
      trackPos[i * 3 + 1] = tmp.y;
      trackPos[i * 3 + 2] = tmp.z;
      if (i > 0) {
        trackArc[i] = trackArc[i - 1] + tmp.distanceTo(prev);
      }
      prev.copy(tmp);
    }
    const L = trackArc[TRACK_SAMPLES];
    for (let i = 0; i <= TRACK_SAMPLES; i++) {
      const i0 = (i - 1 + TRACK_SAMPLES) % TRACK_SAMPLES;
      const i1 = (i + 1) % TRACK_SAMPLES;
      const dx = trackPos[i1 * 3] - trackPos[i0 * 3];
      const dy = trackPos[i1 * 3 + 1] - trackPos[i0 * 3 + 1];
      const dz = trackPos[i1 * 3 + 2] - trackPos[i0 * 3 + 2];
      const len = Math.hypot(dx, dy, dz) || 1;
      const tx = dx / len, ty = dy / len, tz = dz / len;
      trackTan[i * 3] = tx;
      trackTan[i * 3 + 1] = ty;
      trackTan[i * 3 + 2] = tz;

      // n(s) = normalize(T(s) x (0, 1, 0)) = normalize(-tz, 0, tx)
      const nLen = Math.hypot(-tz, tx) || 1;
      trackNrm[i * 3] = -tz / nLen;
      trackNrm[i * 3 + 1] = 0;
      trackNrm[i * 3 + 2] = tx / nLen;
    }
    for (let i = 0; i <= TRACK_SAMPLES; i++) {
      const i0 = (i - 3 + TRACK_SAMPLES) % TRACK_SAMPLES;
      const i1 = (i + 3) % TRACK_SAMPLES;
      const ds = (6 / TRACK_SAMPLES) * L;
      const tx0 = trackTan[i0 * 3], tz0 = trackTan[i0 * 3 + 2];
      const tx1 = trackTan[i1 * 3], tz1 = trackTan[i1 * 3 + 2];
      trackCurv[i] = (tx0 * tz1 - tz0 * tx1) / ds;
    }
  })();

  const TRACK_LENGTH = trackArc[TRACK_SAMPLES];

  function modTrack(s) {
    let r = s % TRACK_LENGTH;
    if (r < 0) r += TRACK_LENGTH;
    return r;
  }

  function wrapTrackDist(a, b) {
    let d = (a - b) % TRACK_LENGTH;
    if (d > TRACK_LENGTH * 0.5) d -= TRACK_LENGTH;
    if (d < -TRACK_LENGTH * 0.5) d += TRACK_LENGTH;
    return d;
  }

  function sampleTrack(s, out) {
    const sw = modTrack(s);
    let lo = 0, hi = TRACK_SAMPLES - 1;
    while (lo < hi) {
      const mid = (lo + hi + 1) >>> 1;
      if (trackArc[mid] <= sw) lo = mid;
      else hi = mid - 1;
    }
    const denom = trackArc[lo + 1] - trackArc[lo];
    const f = denom > 0 ? (sw - trackArc[lo]) / denom : 0;
    const j0 = lo * 3, j1 = (lo + 1) * 3;
    out.pos.set(
      trackPos[j0] + (trackPos[j1] - trackPos[j0]) * f,
      trackPos[j0 + 1] + (trackPos[j1 + 1] - trackPos[j0 + 1]) * f,
      trackPos[j0 + 2] + (trackPos[j1 + 2] - trackPos[j0 + 2]) * f
    );
    out.tan.set(
      trackTan[j0] + (trackTan[j1] - trackTan[j0]) * f,
      trackTan[j0 + 1] + (trackTan[j1 + 1] - trackTan[j0 + 1]) * f,
      trackTan[j0 + 2] + (trackTan[j1 + 2] - trackTan[j0 + 2]) * f
    ).normalize();
    out.nrm.set(
      trackNrm[j0] + (trackNrm[j1] - trackNrm[j0]) * f,
      0,
      trackNrm[j0 + 2] + (trackNrm[j1 + 2] - trackNrm[j0 + 2]) * f
    ).normalize();
    out.curv = trackCurv[lo] + (trackCurv[lo + 1] - trackCurv[lo]) * f;
    return out;
  }

  function makeTrackSample() {
    return {
      pos: new THREE.Vector3(),
      tan: new THREE.Vector3(),
      nrm: new THREE.Vector3(),
      curv: 0
    };
  }

  // ---------------------------------------------------------------------------
  // 3. Monotone Cubic Hermite (PCHIP) Trajectory Table
  // ---------------------------------------------------------------------------
  const CHECKPOINTS = [
    [0, -8.0, -2.50, -16.0, 2.50],
    [1, -8.0, -2.50, -16.0, 2.50],
    [2, -8.0, -2.50, -16.0, 2.50],
    [3, -8.0, -2.50, -16.0, 2.50],
    [4, -2.3, -2.31, -11.5, 2.36],
    [5, 14.8, -1.46, 3.1, 1.65],
    [6, 42.8, -0.47, 29.8, 0.76],
    [7, 81.1, 0.00, 68.2, 0.10],
    [8, 128.9, 0.00, 115.9, 0.00],
    [9, 185.1, 0.00, 172.2, 0.00],
    [10, 248.1, 0.00, 235.3, 0.00],
    [11, 310.5, 0.00, 297.8, 0.00],
    [12, 354.6, 0.00, 342.1, 0.00],
    [13, 403.8, 0.00, 391.4, 0.00],
    [14, 456.5, 0.00, 444.4, 0.00],
    [15, 500.6, 0.00, 488.6, 0.00],
    [16, 553.0, 0.00, 541.2, 0.00],
    [17, 590.7, 0.00, 579.2, 0.00],
    [18, 627.7, 0.00, 616.4, 0.00],
    [19, 674.3, 0.00, 663.2, 0.00],
    [20, 716.6, 0.00, 705.7, 0.00],
    [21, 744.7, 0.00, 734.0, 0.00],
    [22, 782.0, 0.00, 771.5, 0.00],
    [23, 821.0, 0.00, 810.8, 0.00],
    [24, 855.1, 0.00, 845.1, 0.00],
    [25, 899.0, 0.00, 889.1, 0.00],
    [26, 951.7, 0.00, 942.1, 0.00],
    [27, 1007.7, 0.00, 998.2, 0.00],
    [28, 1069.6, 0.00, 1060.3, 0.00],
    [29, 1131.7, 0.00, 1122.5, 0.00],
    [30, 1194.2, 0.00, 1185.1, 0.00],
    [31, 1252.2, 0.00, 1243.1, 0.00],
    [32, 1289.7, 0.00, 1280.7, 0.00],
    [33, 1333.9, 0.00, 1324.9, 0.00],
    [34, 1387.1, -0.87, 1380.4, 1.62],
    [35, 1447.7, -1.20, 1446.1, 3.40],
    [36, 1514.0, -1.20, 1516.7, 3.40],
    [37, 1583.6, -1.20, 1587.1, 3.40],
    [38, 1649.5, -1.20, 1653.4, 3.40],
    [39, 1710.4, -1.20, 1714.9, 3.40],
    [40, 1766.3, -1.20, 1771.1, 3.40]
  ];

  function createPchip(col) {
    const ys = CHECKPOINTS.map(r => r[col]);
    const n = ys.length;
    const d = new Array(n - 1);
    for (let i = 0; i < n - 1; i++) d[i] = ys[i + 1] - ys[i];
    const m = new Array(n).fill(0);
    for (let i = 1; i < n - 1; i++) {
      if (d[i - 1] * d[i] > 0) {
        m[i] = 2.0 / (1.0 / d[i - 1] + 1.0 / d[i]);
      } else {
        m[i] = 0;
      }
    }
    m[0] = d[0] !== 0 ? (3 * d[0] - d[1]) * 0.5 : 0;
    if (m[0] * d[0] <= 0) m[0] = 0;
    else if (Math.abs(m[0]) > 3 * Math.abs(d[0])) m[0] = 3 * d[0];

    m[n - 1] = d[n - 2] !== 0 ? (3 * d[n - 2] - d[n - 3]) * 0.5 : 0;
    if (m[n - 1] * d[n - 2] <= 0) m[n - 1] = 0;
    else if (Math.abs(m[n - 1]) > 3 * Math.abs(d[n - 2])) m[n - 1] = 3 * d[n - 2];

    return function evalAt(t) {
      const tc = clamp(t, 0, DURATION);
      const i = Math.min(n - 2, Math.floor(tc));
      const h = tc - i;
      const h2 = h * h, h3 = h2 * h;
      const val = (2 * h3 - 3 * h2 + 1) * ys[i] + (h3 - 2 * h2 + h) * m[i] + (-2 * h3 + 3 * h2) * ys[i + 1] + (h3 - h2) * m[i + 1];
      const vel = (6 * h2 - 6 * h) * ys[i] + (3 * h2 - 4 * h + 1) * m[i] + (-6 * h2 + 6 * h) * ys[i + 1] + (3 * h2 - 2 * h) * m[i + 1];
      const acc = (12 * h - 6) * ys[i] + (6 * h - 4) * m[i] + (-12 * h + 6) * ys[i + 1] + (6 * h - 2) * m[i + 1];
      return { val, vel, acc };
    };
  }

  const evalSR = createPchip(1);
  const evalDR = createPchip(2);
  const evalSB = createPchip(3);
  const evalDB = createPchip(4);

  const BLUE_FINISH_TIME = (function () {
    let lo = 36.0, hi = 37.0;
    for (let k = 0; k < 40; k++) {
      const mid = 0.5 * (lo + hi);
      if (evalSB(mid).val < TRACK_LENGTH) lo = mid;
      else hi = mid;
    }
    return 0.5 * (lo + hi);
  })();

  function getSmoothAccel(evalS, t) {
    if (t <= 3.0) return 0;
    const t0 = Math.max(3.0, t - 0.18);
    const t1 = Math.min(DURATION, t + 0.18);
    const dt = t1 - t0;
    if (dt < 0.01) return evalS(t).acc;
    return (evalS(t1).vel - evalS(t0).vel) / dt;
  }

  // ---------------------------------------------------------------------------
  // 4. Renderer, Scene & Camera
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.88;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = srgbColor(0x05080f);
  const fogColor = srgbColor(0x111722);
  scene.fog = new THREE.FogExp2(0x000000, 0.0021);
  scene.fog.color.copy(fogColor);

  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);

  // ---------------------------------------------------------------------------
  // 5. Procedural Textures & Night PMREM Environment
  // ---------------------------------------------------------------------------
  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    return c;
  }

  function createAsphaltTextures() {
    const size = 512;
    const cColor = makeCanvas(size, size);
    const gColor = cColor.getContext('2d');
    const cRough = makeCanvas(size, size);
    const gRough = cRough.getContext('2d');
    const cBump = makeCanvas(size, size);
    const gBump = cBump.getContext('2d');

    gColor.fillStyle = '#252830';
    gColor.fillRect(0, 0, size, size);
    gRough.fillStyle = '#686868';
    gRough.fillRect(0, 0, size, size);
    gBump.fillStyle = '#808080';
    gBump.fillRect(0, 0, size, size);

    for (let i = 0; i < 42; i++) {
      const px = simRng() * size;
      const py = simRng() * size;
      const rx = 28 + simRng() * 70;
      const ry = 40 + simRng() * 110;
      const grad = gRough.createRadialGradient(px, py, 2, px, py, Math.max(rx, ry));
      grad.addColorStop(0, 'rgba(24, 24, 24, 0.80)');
      grad.addColorStop(1, 'rgba(110, 110, 110, 0)');
      gRough.fillStyle = grad;
      gRough.beginPath();
      gRough.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2);
      gRough.fill();

      const cGrad = gColor.createRadialGradient(px, py, 2, px, py, Math.max(rx, ry));
      cGrad.addColorStop(0, 'rgba(15, 18, 24, 0.50)');
      cGrad.addColorStop(1, 'rgba(37, 40, 48, 0)');
      gColor.fillStyle = cGrad;
      gColor.beginPath();
      gColor.ellipse(px, py, rx, ry, 0, 0, Math.PI * 2);
      gColor.fill();
    }

    for (let i = 0; i < 16000; i++) {
      const x = (simRng() * size) | 0;
      const y = (simRng() * size) | 0;
      const v = simRng();
      const s = v > 0.85 ? 2 : 1;
      const lum = v > 0.6 ? (44 + (v * 24) | 0) : (20 + (v * 18) | 0);
      gColor.fillStyle = `rgb(${lum},${lum + 1},${lum + 4})`;
      gColor.fillRect(x, y, s, s);
      const bLum = (90 + v * 85) | 0;
      gBump.fillStyle = `rgb(${bLum},${bLum},${bLum})`;
      gBump.fillRect(x, y, s, s);
    }

    const rubberGrad = gColor.createLinearGradient(0, 0, size, 0);
    rubberGrad.addColorStop(0, 'rgba(0,0,0,0)');
    rubberGrad.addColorStop(0.32, 'rgba(8,9,12,0.32)');
    rubberGrad.addColorStop(0.5, 'rgba(6,7,9,0.42)');
    rubberGrad.addColorStop(0.68, 'rgba(8,9,12,0.32)');
    rubberGrad.addColorStop(1, 'rgba(0,0,0,0)');
    gColor.fillStyle = rubberGrad;
    gColor.fillRect(0, 0, size, size);

    gColor.fillStyle = '#dde2ea';
    gColor.fillRect(4, 0, 7, size);
    gColor.fillRect(size - 11, 0, 7, size);

    const map = new THREE.CanvasTexture(cColor);
    map.wrapS = THREE.ClampToEdgeWrapping;
    map.wrapT = THREE.RepeatWrapping;
    map.anisotropy = 8;
    map.encoding = THREE.sRGBEncoding;

    const roughnessMap = new THREE.CanvasTexture(cRough);
    roughnessMap.wrapS = THREE.ClampToEdgeWrapping;
    roughnessMap.wrapT = THREE.RepeatWrapping;
    roughnessMap.anisotropy = 4;

    const bumpMap = new THREE.CanvasTexture(cBump);
    bumpMap.wrapS = THREE.ClampToEdgeWrapping;
    bumpMap.wrapT = THREE.RepeatWrapping;

    return { map, roughnessMap, bumpMap };

  function createCarbonTextures() {
    const size = 64;
    const c = makeCanvas(size, size);
    const g = c.getContext('2d');
    const cb = makeCanvas(size, size);
    const gb = cb.getContext('2d');
    g.fillStyle = '#13151a';
    g.fillRect(0, 0, size, size);
    gb.fillStyle = '#606060';
    gb.fillRect(0, 0, size, size);

    const step = 8;
    for (let y = 0; y < size; y += step) {
      for (let x = 0; x < size; x += step) {
        const phase = ((x + y) / step) % 2 === 0;
        g.fillStyle = phase ? '#20242c' : '#111317';
        g.fillRect(x, y, step - 1, step - 1);
        gb.fillStyle = phase ? '#b0b0b0' : '#404040';
        gb.fillRect(x, y, step - 1, step - 1);
      }
    }
    const map = new THREE.CanvasTexture(c);
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(8, 8);
    map.encoding = THREE.sRGBEncoding;
    const bumpMap = new THREE.CanvasTexture(cb);
    bumpMap.wrapS = bumpMap.wrapT = THREE.RepeatWrapping;
    bumpMap.repeat.set(8, 8);
    return { map, bumpMap };
  }

  function createTyreSidewallTexture(bandHex) {

  function createFenceTexture() {

  function createChequeredTexture() {

  function createNightEnvMap() {

  // ---------------------------------------------------------------------------
  // 6. Night Sky Dome (Stars, Moon & Faint Warm Horizon City Glow)
  // ---------------------------------------------------------------------------
  function buildSkyDome() {
    const geo = new THREE.SphereGeometry(2200, 48, 32);
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      fog: false,
      uniforms: {
        uMoonDir: { value: new THREE.Vector3(-0.55, 0.34, -0.76).normalize() },
        uCityDir: { value: new THREE.Vector3(0.85, 0.0, 0.52).normalize() }
      },
      vertexShader: `
        varying vec3 vWorldDir;
        void main() {
          vWorldDir = normalize(position);
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vWorldDir;
        uniform vec3 uMoonDir;
        uniform vec3 uCityDir;

        float hash21(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        void main() {
          vec3 d = normalize(vWorldDir);
          float y = clamp(d.y, -0.2, 1.0);

          vec3 zenith = vec3(0.002, 0.004, 0.011);
          vec3 horizon = vec3(0.005, 0.009, 0.017);
          vec3 col = mix(horizon, zenith, pow(clamp(y * 1.6, 0.0, 1.0), 0.7));

          float cityAz = max(0.0, dot(normalize(vec3(d.x, 0.0, d.z)), uCityDir));
          float cityBand = exp(-abs(y - 0.01) * 18.0) * pow(cityAz, 3.0);
          col += vec3(0.038, 0.016, 0.006) * cityBand;

          float hGlow = exp(-max(y, 0.0) * 14.0) * 0.32;
          col += vec3(0.005, 0.008, 0.015) * hGlow;

          if (y > 0.03) {
            float phi = atan(d.z, d.x);
            float theta = asin(clamp(d.y, -1.0, 1.0));
            vec2 grid = vec2(phi * 48.0, theta * 48.0);
            vec2 id = floor(grid);
            vec2 gv = fract(grid) - 0.5;
            float rnd = hash21(id);
            if (rnd > 0.945) {
              vec2 off = vec2(hash21(id + 13.7), hash21(id + 29.1)) - 0.5;
              float dist = length(gv - off * 0.55);
              float star = smoothstep(0.09, 0.0, dist);
              float horizonFade = smoothstep(0.03, 0.25, y);
              float tint = hash21(id + 71.3);
              vec3 sCol = mix(vec3(0.65, 0.78, 1.0), vec3(1.0, 0.92, 0.8), tint);
              col += sCol * star * horizonFade * (0.25 + 0.55 * fract(rnd * 97.1));
            }
          }

          float mCos = dot(d, uMoonDir);
          float halo = pow(max(mCos, 0.0), 48.0) * 0.09 + pow(max(mCos, 0.0), 8.0) * 0.014;
          col += vec3(0.32, 0.44, 0.68) * halo;
          if (mCos > 0.9996) {
            float edge = smoothstep(0.9996, 0.99978, mCos);
            float maria = 0.84 + 0.16 * sin(d.x * 290.0 + d.y * 170.0) * cos(d.z * 230.0);
            col = mix(col, vec3(0.75, 0.82, 0.95) * maria, edge);
          }

          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }
      `
    });
    const mesh = new THREE.Mesh(geo, mat);
    scene.add(mesh);
    return mesh;
  }

  const skyDome = buildSkyDome();

  // ---------------------------------------------------------------------------
  // 7. Floodlight Masts Data & Baked Road Pool LightMap
  // ---------------------------------------------------------------------------
  const MAST_COUNT = 24;
  const masts = [];
  (function initMasts() {
    const sSamp = makeTrackSample();
    for (let i = 0; i < MAST_COUNT; i++) {
      const s = modTrack(16 + i * (TRACK_LENGTH / MAST_COUNT));
      sampleTrack(s, sSamp);
      const side = (i % 2 === 0) ? 1 : -1;
      const base = sSamp.pos.clone().addScaledVector(sSamp.nrm, side * 14.2);
      const head = base.clone().addScaledVector(sSamp.nrm, -side * 4.5).add(new THREE.Vector3(0, 30.0, 0));
      const target = sSamp.pos.clone().addScaledVector(sSamp.nrm, side * 1.2);
      masts.push({ index: i, s, side, base, head, target });
    }
  })();

  function createTrackPoolLightMap() {
    const W = 2048, H = 64;
    const data = new Uint8Array(W * H * 4);
    const sSamp = makeTrackSample();

    for (let x = 0; x < W; x++) {
      const s = (x / W) * TRACK_LENGTH;
      sampleTrack(s, sSamp);
      for (let y = 0; y < H; y++) {
        const d = ((y / (H - 1)) * 2 - 1) * 10.0;
        let pool = 0.045;
        for (let k = 0; k < masts.length; k++) {
          const m = masts[k];
          const ds = wrapTrackDist(s, m.s);
          if (Math.abs(ds) > 46) continue;
          const dd = d - m.side * 1.2;
          const dist2 = (ds * ds) / (19.5 * 19.5) + (dd * dd) / (11.5 * 11.5);
          pool += 0.92 * Math.exp(-dist2 * 1.35);
        }
        pool = clamp(pool, 0, 1.0);
        const r = Math.min(255, (pool * 228) | 0);
        const g = Math.min(255, (pool * 240) | 0);
        const b = Math.min(255, (pool * 255) | 0);
        const idx = (y * W + x) * 4;
        data[idx] = r;
        data[idx + 1] = g;
        data[idx + 2] = b;
        data[idx + 3] = 255;
      }
    }

    const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearFilter;
    tex.needsUpdate = true;
    return tex;
  }

  const trackLightMap = createTrackPoolLightMap();

  // ---------------------------------------------------------------------------
  // 8. Circuit Road, Verge, Kerbs, Barriers, Catch Fence, Gantry, Grandstand & Terrain
  // ---------------------------------------------------------------------------
  function buildTrackRibbon(dMin, dMax, yOffset, segs, uvRepeatLen, mapWidthToUV) {
    const pos = [];
    const nrm = [];
    const uv = [];
    const uv2 = [];
    const idx = [];
    const sSamp = makeTrackSample();
    const p = new THREE.Vector3();

    for (let i = 0; i <= segs; i++) {
      const s = (i / segs) * TRACK_LENGTH;
      sampleTrack(s, sSamp);
      const up = new THREE.Vector3().crossVectors(sSamp.nrm, sSamp.tan).normalize();

      for (let j = 0; j < 2; j++) {
        const d = j === 0 ? dMin : dMax;
        p.copy(sSamp.pos).addScaledVector(sSamp.nrm, d).addScaledVector(up, yOffset);
        pos.push(p.x, p.y, p.z);
        nrm.push(up.x, up.y, up.z);
        if (mapWidthToUV) {
          uv.push(j, s / uvRepeatLen);
        } else {
          uv.push(s / uvRepeatLen, j);
        }
        uv2.push(s / TRACK_LENGTH, (d + 10) / 20);
      }
    }
    for (let i = 0; i < segs; i++) {
      const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
      idx.push(a, c, b, b, c, d);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setAttribute('uv2', new THREE.Float32BufferAttribute(uv2, 2));
    geo.setIndex(idx);
    return geo;
  }

  function buildTrackAndSurroundings() {
    const roadGeo = buildTrackRibbon(-7.0, 7.0, 0.0, 1200, 14.0, true);
    const roadMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0xffffff),
      map: asphaltTex.map,
      roughnessMap: asphaltTex.roughnessMap,
      bumpMap: asphaltTex.bumpMap,
      bumpScale: 0.015,
      lightMap: trackLightMap,
      lightMapIntensity: 2.0,
      roughness: 0.52,
      metalness: 0.14,
      envMapIntensity: 0.42
    });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
    roadMesh.receiveShadow = true;
    scene.add(roadMesh);

    const vergeMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x161920),
      roughness: 0.85,
      metalness: 0.05,
      lightMap: trackLightMap,
      lightMapIntensity: 1.15,
      envMapIntensity: 0.12
    });
    for (const [d0, d1] of [[-9.3, -7.0], [7.0, 9.3]]) {
      const vGeo = buildTrackRibbon(d0, d1, -0.012, 600, 10.0, false);
      const m = new THREE.Mesh(vGeo, vergeMat);
      m.receiveShadow = true;
      scene.add(m);
    }

    const sfGeo = new THREE.PlaneGeometry(2.1, 13.7);
    sfGeo.rotateX(-Math.PI / 2);
    {
      const pAttr = sfGeo.attributes.position;
      const uv2Arr = new Float32Array(pAttr.count * 2);
      for (let vi = 0; vi < pAttr.count; vi++) {
        uv2Arr[vi * 2] = modTrack(pAttr.getX(vi)) / TRACK_LENGTH;
        uv2Arr[vi * 2 + 1] = clamp(0.5 + pAttr.getZ(vi) / 20.0, 0, 1);
      }
      sfGeo.setAttribute('uv2', new THREE.BufferAttribute(uv2Arr, 2));
    }
    const sfMat = new THREE.MeshStandardMaterial({
      map: chequeredTex,
      lightMap: trackLightMap,
      lightMapIntensity: 1.85,
      roughness: 0.42,
      metalness: 0.08,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2
    });
    const sfMesh = new THREE.Mesh(sfGeo, sfMat);
    sfMesh.position.set(0, 0.008, 0);
    sfMesh.receiveShadow = true;
    scene.add(sfMesh);

    const gridMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0xdbe0e8),
      lightMap: trackLightMap,
      lightMapIntensity: 1.85,
      roughness: 0.45,
      polygonOffset: true,
      polygonOffsetFactor: -2,
      polygonOffsetUnits: -2
    });
    const gridBoxes = [
      { s: -8.0, d: -2.50 },
      { s: -16.0, d: 2.50 }
    ];
    const gSamp = makeTrackSample();
    for (const gb of gridBoxes) {
      sampleTrack(gb.s + 2.85, gSamp);
      const boxGroup = new THREE.Group();
      boxGroup.position.copy(gSamp.pos).addScaledVector(gSamp.nrm, gb.d);
      boxGroup.position.y += 0.008;
      boxGroup.rotation.y = Math.atan2(-gSamp.tan.z, gSamp.tan.x);

      const uBox = modTrack(gb.s + 2.85) / TRACK_LENGTH;
      const vBox = clamp(0.5 + gb.d / 20.0, 0, 1);
      const setPlaneUv2 = (geo, w, h) => {
        const arr = new Float32Array(geo.attributes.position.count * 2);
        for (let vi = 0; vi < geo.attributes.position.count; vi++) {
          arr[vi * 2] = uBox;
          arr[vi * 2 + 1] = vBox;
        }
        geo.setAttribute('uv2', new THREE.BufferAttribute(arr, 2));
      };

      const frontGeo = new THREE.PlaneGeometry(0.16, 2.25);
      setPlaneUv2(frontGeo);
      const frontLine = new THREE.Mesh(frontGeo, gridMat);
      frontLine.rotation.x = -Math.PI / 2;
      boxGroup.add(frontLine);

      for (const side of [-1, 1]) {
        const sideGeo = new THREE.PlaneGeometry(1.15, 0.14);
        setPlaneUv2(sideGeo);
        const sideLine = new THREE.Mesh(sideGeo, gridMat);
        sideLine.rotation.x = -Math.PI / 2;
        sideLine.position.set(-0.55, 0, side * 1.06);
        boxGroup.add(sideLine);
      }
      scene.add(boxGroup);
    }

    const kerbSpans = [
      [190, 230, 1],
      [295, 375, 1], [340, 390, -1],
      [445, 515, 1],
      [560, 625, 1], [595, 645, -1],
      [690, 775, -1], [745, 790, 1],
      [800, 855, 1], [820, 870, -1],
      [945, 1005, 1],
      [1095, 1145, 1],
      [1235, 1325, 1], [1280, 1345, -1],
      [1445, 1500, 1]
    ];
    const kerbMat = new THREE.MeshStandardMaterial({
      map: kerbTex,
      roughness: 0.48,
      metalness: 0.05,
      lightMap: trackLightMap,
      lightMapIntensity: 1.35
    });
    const kSamp = makeTrackSample();
    for (const [sA, sB, side] of kerbSpans) {
      const len = sB - sA;
      const segs = Math.max(8, Math.round(len / 1.5));
      const pos = [], nrm = [], uv = [], uv2 = [], idx = [];
      for (let i = 0; i <= segs; i++) {
        const s = sA + (i / segs) * len;
        sampleTrack(s, kSamp);
        const up = new THREE.Vector3().crossVectors(kSamp.nrm, kSamp.tan).normalize();
        const innerD = side * 6.95;
        const midD = side * 7.25;
        const outerD = side * 7.80;
        const p0 = kSamp.pos.clone().addScaledVector(kSamp.nrm, innerD);
        const p1 = kSamp.pos.clone().addScaledVector(kSamp.nrm, midD).addScaledVector(up, 0.055);
        const p2 = kSamp.pos.clone().addScaledVector(kSamp.nrm, outerD).addScaledVector(up, 0.02);
        pos.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
        nrm.push(up.x, up.y, up.z, up.x, up.y, up.z, up.x, up.y, up.z);
        const u = (s - sA) / 2.2;
        uv.push(u, 0, u, 0.5, u, 1);
        const u2 = modTrack(s) / TRACK_LENGTH;
        uv2.push(u2, (innerD + 10) / 20, u2, (midD + 10) / 20, u2, (outerD + 10) / 20);
      }
      for (let i = 0; i < segs; i++) {
        const a = i * 3;
        if (side > 0) {
          idx.push(a, a + 3, a + 1, a + 1, a + 3, a + 4);
          idx.push(a + 1, a + 4, a + 2, a + 2, a + 4, a + 5);
        } else {
          idx.push(a, a + 1, a + 3, a + 1, a + 4, a + 3);
          idx.push(a + 1, a + 2, a + 4, a + 2, a + 5, a + 4);
        }
      }
      const kGeo = new THREE.BufferGeometry();
      kGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      kGeo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
      kGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      kGeo.setAttribute('uv2', new THREE.Float32BufferAttribute(uv2, 2));
      kGeo.setIndex(idx);
      const km = new THREE.Mesh(kGeo, kerbMat);
      km.receiveShadow = true;
      scene.add(km);
    }

    const barrierMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x4b5360),
      roughness: 0.45,
      metalness: 0.65,
      lightMap: trackLightMap,
      lightMapIntensity: 1.35,
      envMapIntensity: 0.65,
      side: THREE.DoubleSide
    });
    const bSamp = makeTrackSample();
    const BARRIER_SEGS = 600;
    for (const side of [-1, 1]) {
      const pos = [], nrm = [], uv = [], uv2 = [], idx = [];
      const d = side * 9.15;
      for (let i = 0; i <= BARRIER_SEGS; i++) {
        const s = (i / BARRIER_SEGS) * TRACK_LENGTH;
        sampleTrack(s, bSamp);
        const pBase = bSamp.pos.clone().addScaledVector(bSamp.nrm, d);
        const pTop = pBase.clone().add(new THREE.Vector3(0, 0.78, 0));
        const nx = -side * bSamp.nrm.x, nz = -side * bSamp.nrm.z;
        pos.push(pBase.x, pBase.y, pBase.z, pTop.x, pTop.y, pTop.z);
        nrm.push(nx, 0, nz, nx, 0, nz);
        uv.push(s / 4, 0, s / 4, 1);
        const u2 = s / TRACK_LENGTH;
        uv2.push(u2, (d + 10) / 20, u2, (d + 10) / 20);
      }
      for (let i = 0; i < BARRIER_SEGS; i++) {
        const a = i * 2;
        if (side > 0) idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        else idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
      }
      const bGeo = new THREE.BufferGeometry();
      bGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      bGeo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
      bGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      bGeo.setAttribute('uv2', new THREE.Float32BufferAttribute(uv2, 2));

      scene.add(new THREE.Mesh(bGeo, barrierMat));
    }

    const postGeo = new THREE.CylinderGeometry(0.055, 0.065, 2.55, 6);
    const postMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x7c8694),
      roughness: 0.35,
      metalness: 0.85,
      envMapIntensity: 0.85
    });
    const postInterval = 5.5;
    const numPostsPerSide = Math.floor(TRACK_LENGTH / postInterval);
    const postMatrices = [];
    for (const side of [-1, 1]) {
      for (let i = 0; i < numPostsPerSide; i++) {
        const s = i * postInterval;
        if (side === -1 && Math.abs(wrapTrackDist(s, 400)) < 16) continue;
        if (side === 1 && Math.abs(wrapTrackDist(s, 725)) < 16) continue;
        if (side === -1 && Math.abs(wrapTrackDist(s, 1300)) < 16) continue;
        sampleTrack(s, bSamp);
        const m = new THREE.Matrix4();
        const p = bSamp.pos.clone().addScaledVector(bSamp.nrm, side * 9.25);
        p.y += 1.28;
        m.makeTranslation(p.x, p.y, p.z);
        postMatrices.push(m);
      }
    }
    const postInst = new THREE.InstancedMesh(postGeo, postMat, postMatrices.length);
    for (let i = 0; i < postMatrices.length; i++) postInst.setMatrixAt(i, postMatrices[i]);
    scene.add(postInst);

    const fenceMat = new THREE.MeshStandardMaterial({
      map: fenceTex,
      color: srgbColor(0x98a6ba),
      transparent: true,
      alphaTest: 0.25,
      opacity: 0.65,
      roughness: 0.35,
      metalness: 0.8,
      side: THREE.DoubleSide
    });
    const fenceSegs = 400;
    const fPos = [], fNrm = [], fUv = [], fIdx = [];
    let fVertCount = 0;
    for (const side of [-1, 1]) {
      const d = side * 9.22;
      for (let i = 0; i < fenceSegs; i++) {
        const s0 = (i / fenceSegs) * TRACK_LENGTH;
        const s1 = ((i + 1) / fenceSegs) * TRACK_LENGTH;
        const sMid = 0.5 * (s0 + s1);
        if (side === -1 && Math.abs(wrapTrackDist(sMid, 400)) < 16) continue;
        if (side === 1 && Math.abs(wrapTrackDist(sMid, 725)) < 16) continue;
        if (side === -1 && Math.abs(wrapTrackDist(sMid, 1300)) < 16) continue;

        sampleTrack(s0, bSamp);
        const p0 = bSamp.pos.clone().addScaledVector(bSamp.nrm, d);
        const nx0 = -side * bSamp.nrm.x, nz0 = -side * bSamp.nrm.z;
        sampleTrack(s1, bSamp);
        const p1 = bSamp.pos.clone().addScaledVector(bSamp.nrm, d);
        const nx1 = -side * bSamp.nrm.x, nz1 = -side * bSamp.nrm.z;

        fPos.push(
          p0.x, p0.y + 0.78, p0.z,
          p0.x, p0.y + 2.52, p0.z,
          p1.x, p1.y + 0.78, p1.z,
          p1.x, p1.y + 2.52, p1.z
        );
        fNrm.push(nx0, 0, nz0, nx0, 0, nz0, nx1, 0, nz1, nx1, 0, nz1);
        const u0 = s0 * 1.4, u1 = s1 * 1.4;
        fUv.push(u0, 0, u0, 2.2, u1, 0, u1, 2.2);
        const b = fVertCount;
        fIdx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
        fVertCount += 4;
      }
    }
    const fGeo = new THREE.BufferGeometry();
    fGeo.setAttribute('position', new THREE.Float32BufferAttribute(fPos, 3));
    fGeo.setAttribute('normal', new THREE.Float32BufferAttribute(fNrm, 3));
    fGeo.setAttribute('uv', new THREE.Float32BufferAttribute(fUv, 2));
    fGeo.setIndex(fIdx);
    scene.add(new THREE.Mesh(fGeo, fenceMat));

    // Pit wall on +Z side of main straight
    const pitWallGeo = new THREE.BoxGeometry(220, 1.05, 0.45);
    const pitWallMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x2a303a),
      roughness: 0.55,

    });
    const pitWall = new THREE.Mesh(pitWallGeo, pitWallMat);
    pitWall.position.set(58, 0.525, 8.35);
    pitWall.receiveShadow = true;
    scene.add(pitWall);

    const pitBldg = new THREE.Mesh(
      new THREE.BoxGeometry(150, 7.5, 12),

    );
    pitBldg.position.set(78, 3.75, 29);
    scene.add(pitBldg);
    const pitStrip = new THREE.Mesh(
      new THREE.BoxGeometry(148, 0.35, 0.4),

    pitStrip.position.set(78, 4.2, 22.8);

    // Grandstand on -Z side of main straight
    const gsGroup = new THREE.Group();

    const gsRoofMat = new THREE.MeshStandardMaterial({ color: srgbColor(0x232934), roughness: 0.5, metalness: 0.5 });
    const gsStripMat = new THREE.MeshBasicMaterial({ color: srgbColor(0xbcd2ff) });
    for (let row = 0; row < 10; row++) {
      const tier = new THREE.Mesh(new THREE.BoxGeometry(108, 0.85, 1.8), gsConcreteMat);
      tier.position.set(30, 1.2 + row * 0.85, -18.5 - row * 1.7);

    }
    const gsRoof = new THREE.Mesh(new THREE.BoxGeometry(112, 0.4, 21), gsRoofMat);
    gsRoof.position.set(30, 13.8, -27);

    gsGroup.add(gsRoof);
    const gsLightStrip = new THREE.Mesh(new THREE.BoxGeometry(106, 0.25, 0.35), gsStripMat);
    gsLightStrip.position.set(30, 12.1, -17.2);
    gsGroup.add(gsLightStrip);
    for (let p = 0; p <= 6; p++) {

      col.position.set(-22 + p * 17.3, 7, -35.8);

    }
    const specGeo = new THREE.BoxGeometry(0.42, 0.72, 0.36);
    const specMat = new THREE.MeshStandardMaterial({ color: srgbColor(0x3a4354), roughness: 0.85 });
    const specCount = 520;
    const specInst = new THREE.InstancedMesh(specGeo, specMat, specCount);
    const tmpM = new THREE.Matrix4();
    const tmpC = new THREE.Color();
    for (let i = 0; i < specCount; i++) {
      const row = Math.floor(simRng() * 10);
      const sx = -21 + simRng() * 102;
      const sy = 1.95 + row * 0.85;
      const sz = -18.3 - row * 1.7;
      tmpM.makeTranslation(sx, sy, sz);
      specInst.setMatrixAt(i, tmpM);
      const shade = 0.22 + simRng() * 0.45;
      tmpC.setRGB(shade * 0.8, shade * 0.88, shade).convertSRGBToLinear();
      specInst.setColorAt(i, tmpC);
    }
    specInst.instanceColor.needsUpdate = true;
    gsGroup.add(specInst);
    scene.add(gsGroup);

    // Terrain following track elevation and rolling into dark hills
    const tWidth = 1050, tDepth = 950;
    const nx = 135, nz = 120;
    const tGeo = new THREE.PlaneGeometry(tWidth, tDepth, nx, nz);
    tGeo.rotateX(-Math.PI / 2);
    const tPos = tGeo.attributes.position;
    const tUv2 = new Float32Array(tPos.count * 2);

    const subSamples = [];
    const subCount = 400;
    const tsTmp = makeTrackSample();
    for (let i = 0; i < subCount; i++) {
      const s = (i / subCount) * TRACK_LENGTH;
      sampleTrack(s, tsTmp);
      subSamples.push({ s, x: tsTmp.pos.x, y: tsTmp.pos.y, z: tsTmp.pos.z });
    }

    for (let i = 0; i < tPos.count; i++) {
      const vx = tPos.getX(i) + 40;
      const vz = tPos.getZ(i) + 165;
      tPos.setX(i, vx);
      tPos.setZ(i, vz);

      let bestD2 = Infinity;
      let bestY = 0;
      let bestS = 0;
      for (let k = 0; k < subCount; k++) {
        const ss = subSamples[k];
        const dx = vx - ss.x, dz = vz - ss.z;
        const d2 = dx * dx + dz * dz;
        if (d2 < bestD2) {
          bestD2 = d2;
          bestY = ss.y;
          bestS = ss.s;
        }
      }
      const dist = Math.sqrt(bestD2);
      const hill = (
        18 * Math.sin(vx * 0.0085 + 0.4) * Math.cos(vz * 0.009 - 0.3) +
        11 * Math.sin((vx + vz) * 0.015) +
        6 * Math.cos(vx * 0.025 - vz * 0.021) +
        Math.max(0, (dist - 160) * 0.14)
      );
      const blend = smoothstep(12, 85, dist);
      let vy;
      if (dist < 10.5) {
        vy = bestY - 0.32;
      } else {
        vy = bestY - 0.15 + blend * (hill + 6);
      }
      if (vx > -80 && vx < 190 && vz > -50 && vz < 45) {
        const padBlendX = Math.min(smoothstep(-80, -50, vx), 1.0 - smoothstep(160, 190, vx));
        const padBlendZ = Math.min(smoothstep(-50, -36, vz), 1.0 - smoothstep(32, 45, vz));
        const padW = padBlendX * padBlendZ;
        vy = vy * (1 - padW) + (-0.18) * padW;
      }
      if (vx > -140 && vx < 0 && vz > 90 && vz < 210) {
        vy = Math.min(vy, 28);
      }
      tPos.setY(i, vy);

      const nearFactor = 1.0 - smoothstep(9.0, 26.0, dist);
      tUv2[i * 2] = bestS / TRACK_LENGTH;
      tUv2[i * 2 + 1] = nearFactor > 0.05 ? 0.5 : 0.0;
    }
    tGeo.setAttribute('uv2', new THREE.BufferAttribute(tUv2, 2));
    tGeo.computeVertexNormals();
    const tMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x0b0e12),
      roughness: 0.96,
      metalness: 0.0,
      envMapIntensity: 0.08
    });
    const terrain = new THREE.Mesh(tGeo, tMat);
    terrain.receiveShadow = true;
    scene.add(terrain);
  }

  (function buildFloodlightMasts() {
    const mastMat = new THREE.MeshStandardMaterial({
      color: srgbColor(0x46505e),
      roughness: 0.42,
      metalness: 0.78
    });
    const headMat = new THREE.MeshStandardMaterial({

    });

      color: new THREE.Color(3.2, 3.6, 4.2)
    });

    const coneGeo = new THREE.ConeGeometry(13.5, 31.0, 24, 1, true);
    coneGeo.translate(0, -15.5, 0);
    const coneMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      uniforms: THREE.UniformsUtils.merge([
        THREE.UniformsLib.fog,
        {
          uColor: { value: srgbColor(0xaecbff) }
        }
      ]),
      vertexShader: `
        varying vec3 vLocal;
        varying vec3 vNormalView;
        varying vec3 vViewPos;
        #include <fog_pars_vertex>
        void main() {
          vLocal = position;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPos = -mvPosition.xyz;
          vNormalView = normalize(normalMatrix * normal);
          gl_Position = projectionMatrix * mvPosition;
          #include <fog_vertex>
        }
      `,
      fragmentShader: `
        varying vec3 vLocal;
        varying vec3 vNormalView;
        varying vec3 vViewPos;
        uniform vec3 uColor;
        #include <fog_pars_fragment>
        void main() {
          float h = clamp(-vLocal.y / 31.0, 0.0, 1.0);
          float verticalFade = smoothstep(0.0, 0.14, h) * pow(1.0 - h, 1.45);
          vec3 vDir = normalize(vViewPos);
          float edgeFade = pow(abs(dot(normalize(vNormalView), vDir)), 1.6);
          float alpha = verticalFade * edgeFade * 0.055;
          gl_FragColor = vec4(uColor * alpha * 1.4, alpha);
          #include <fog_fragment>
          #include <tonemapping_fragment>
          #include <encodings_fragment>
        }
      `
    });
    coneMat.fog = true;

    const poleGeo = new THREE.CylinderGeometry(0.18, 0.36, 30.2, 8);
    const armGeo = new THREE.BoxGeometry(0.35, 0.35, 5.2);
    const housingGeo = new THREE.BoxGeometry(2.6, 1.25, 0.55);
    const lampFaceGeo = new THREE.PlaneGeometry(2.35, 1.05);

    const upVec = new THREE.Vector3(0, 1, 0);
    const tmpDir = new THREE.Vector3();
    const tmpQuat = new THREE.Quaternion();

    for (let i = 0; i < masts.length; i++) {
      const m = masts[i];
      const mastGroup = new THREE.Group();

      const pole = new THREE.Mesh(poleGeo, mastMat);
      pole.position.set(m.base.x, m.base.y + 15.1, m.base.z);
      mastGroup.add(pole);

      const armMid = new THREE.Vector3().addVectors(m.base, new THREE.Vector3(0, 30.0, 0)).lerp(m.head, 0.5);
      const arm = new THREE.Mesh(armGeo, mastMat);
      arm.position.copy(armMid);
      arm.lookAt(m.head);
      mastGroup.add(arm);

      const headGroup = new THREE.Group();
      headGroup.position.copy(m.head);
      headGroup.lookAt(m.target);

      const housing = new THREE.Mesh(housingGeo, headMat);
      housing.position.z = -0.25;
      headGroup.add(housing);

      const lampFace = new THREE.Mesh(lampFaceGeo, lampMat);
      lampFace.position.z = 0.05;
      headGroup.add(lampFace);
      mastGroup.add(headGroup);

      const halo = new THREE.Sprite(new THREE.SpriteMaterial({
        map: glowTex,
        color: srgbColor(0xcde2ff),
        transparent: true,
        opacity: 0.72,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      }));
      halo.position.copy(m.head);
      halo.scale.set(16, 16, 1);
      mastGroup.add(halo);

      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.position.copy(m.head);
      tmpDir.subVectors(m.head, m.target).normalize();
      tmpQuat.setFromUnitVectors(upVec, tmpDir);
      cone.quaternion.copy(tmpQuat);
      mastGroup.add(cone);

      scene.add(mastGroup);
    }
  })();

  // ---------------------------------------------------------------------------
  // 12. Detailed Formula 1 Car Builder (>= 80 Separate Shaped Meshes Each)
  // ---------------------------------------------------------------------------
  function createLoftedGeometry(sections) {
    const ringLen = sections[0].ring.length;
    const pos = [];
    const uv = [];
    const idx = [];
    const nSec = sections.length;

    for (let s = 0; s < nSec; s++) {
      const sec = sections[s];
      const u = s / (nSec - 1);
      for (let r = 0; r < ringLen; r++) {
        const pt = sec.ring[r];
        pos.push(sec.x, pt[0], pt[1]);
        uv.push(u, r / (ringLen - 1));
      }
    }
    for (let s = 0; s < nSec - 1; s++) {
      for (let r = 0; r < ringLen - 1; r++) {
        const a = s * ringLen + r;
        const b = a + 1;
        const c = (s + 1) * ringLen + r;
        const d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    geo.computeVertexNormals();
    return geo;
  }

  function makeRoundedRectRing(yc, zc, hy, hz, ptsPerLoop) {
    const ring = [];
    for (let i = 0; i < ptsPerLoop; i++) {
      const a = (i / (ptsPerLoop - 1)) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      const sy = Math.sign(sa) * Math.pow(Math.abs(sa), 0.68) * hy;
      const sz = Math.sign(ca) * Math.pow(Math.abs(ca), 0.68) * hz;
      ring.push([yc + sy, zc + sz]);
    }
    return ring;
  }

  function makeWingAirfoil(span, chord, thickness, camber, sweepBack) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.quadraticCurveTo(chord * 0.35, thickness + camber, chord, camber * 0.4);
    shape.quadraticCurveTo(chord * 0.45, -thickness * 0.25, 0, 0);
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: span,
      bevelEnabled: false,
      curveSegments: 10,
      steps: 1
    });
    geo.translate(0, 0, -span * 0.5);
    if (sweepBack !== 0) {
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const zAbs = Math.abs(p.getZ(i));
        p.setX(i, p.getX(i) - zAbs * sweepBack);
      }
    }
    geo.scale(-1, 1, 1);
    geo.computeVertexNormals();
    return geo;
  }

  function makeTubeArm(pA, pB, radius) {
    const curve = new THREE.LineCurve3(pA, pB);
    return new THREE.TubeGeometry(curve, 2, radius, 8, false);
  }

  function buildF1Car(cfg) {
    const root = new THREE.Group();
    const bodyGroup = new THREE.Group();
    bodyGroup.position.set(0, 0.25, 0);
    const bodyInner = new THREE.Group();

    const paintMat = new THREE.MeshPhysicalMaterial({

    const noseLiveryMat = new THREE.MeshPhysicalMaterial({

    const mirrorGlassMat = new THREE.MeshStandardMaterial({

    const visorMat = new THREE.MeshPhysicalMaterial({

    const helmetMat = new THREE.MeshPhysicalMaterial({

      roughness: 0.18,
      clearcoat: 1.0,

    });

    function addPart(geo, mat, px, py, pz, rx, ry, rz, parent) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(px || 0, py || 0, pz || 0);
      if (rx) m.rotation.x = rx;
      if (ry) m.rotation.y = ry;
      if (rz) m.rotation.z = rz;
      m.castShadow = true;
      m.receiveShadow = true;
      (parent || bodyInner).add(m);
      return m;
    }

    // 1. Multi-element Front Wing (4 stacked elements + endplates + diveplanes)
    addPart(makeWingAirfoil(1.94, 0.26, 0.028, 0.015, 0.09), carbonMat, 2.74, 0.085, 0);
    addPart(makeWingAirfoil(1.92, 0.20, 0.022, 0.018, 0.10), paintMat, 2.52, 0.115, 0, 0, 0, -0.14);
    addPart(makeWingAirfoil(1.90, 0.18, 0.018, 0.016, 0.11), accentPaintMat, 2.34, 0.155, 0, 0, 0, -0.26);
    addPart(makeWingAirfoil(1.88, 0.15, 0.016, 0.014, 0.12), paintMat, 2.18, 0.200, 0, 0, 0, -0.38);

    const fwEndShape = new THREE.Shape();

    // 3. Monocoque Tub, Open Cockpit, Halo, Driver & Steering Wheel
    const frontTubSec = [

    addPart(new THREE.BoxGeometry(0.85, 0.22, 0.48), carbonMat, 0.50, 0.16, 0);

    const visorGeo = new THREE.CylinderGeometry(0.140, 0.140, 0.068, 16, 1, true, -0.95, 1.9);

    addPart(new THREE.CylinderGeometry(0.018, 0.018, 0.32, 8), carbonMat, 0.78, 0.45, 0, 0, 0, Math.PI * 0.42);
    const steerGroup = new THREE.Group();

    steerGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.11, 0.22), carbonMat));
    const wheelScreen = new THREE.Mesh(

    const haloCenterCurve = new THREE.CatmullRomCurve3([

    addPart(new THREE.TubeGeometry(haloCenterCurve, 8, 0.024, 8, false), carbonMat);
    const haloHoopCurve = new THREE.CatmullRomCurve3([
