<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Night Duel</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);

  height: 4px;

  padding: 0;
  flex-shrink: 0;

  outline: none;

  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}

  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">

      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>

    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>

  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

/* =====================================================================
   0. CONSTANTS, SEEDED PRNG, MATH HELPERS
   ===================================================================== */
const DURATION = 40;
const SIM_SEED = 42;
const AUDIO_SEED = 4242;

function mulberry32(seed) {
  let a = seed >>> 0;

    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}
// The single simulation generator (seed 42). Everything procedural is drawn from it
// once, in a fixed order, at startup; renderAt() never consumes randomness.
const rng = mulberry32(SIM_SEED);
const rand = () => rng();
const randRange = (a, b) => a + (b - a) * rng();
const RT_N = 16384, RT_MASK = RT_N - 1;
const RT = new Float32Array(RT_N);
for (let i = 0; i < RT_N; i++) RT[i] = rng();

const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const hash1 = (i) => RT[i & RT_MASK];
const hash2 = (i, j) => RT[(Math.imul(i, 73856093) ^ Math.imul(j, 19349663)) & RT_MASK];
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash1(i), hash1(i + 1), u); }
function noise2(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(i, j), hash2(i + 1, j), ux), lerp(hash2(i, j + 1), hash2(i + 1, j + 1), ux), uy);
}
function fbm2(x, y, oct) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let o = 0; o < oct; o++) { s += a * noise2(x * f + o * 17.31, y * f - o * 9.17); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}
// tileable value noise on a period-P lattice (for repeating textures)
function tnoise(x, y, P, o) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const i0 = ((i % P) + P) % P, j0 = ((j % P) + P) % P, i1 = (i0 + 1) % P, j1 = (j0 + 1) % P;
  const q = o * 977;
  return lerp(lerp(hash2(i0 + q, j0), hash2(i1 + q, j0), ux), lerp(hash2(i0 + q, j1), hash2(i1 + q, j1), ux), uy);
}
function tfbm(u, v, P, oct) {
  let s = 0, a = 0.5, n = 0, p = P;
  for (let o = 0; o < oct; o++) { s += a * tnoise(u * p, v * p, p, o); n += a; a *= 0.5; p *= 2; }
  return s / n;
}
const lin = (hex) => new THREE.Color(hex).convertSRGBToLinear();

/* =====================================================================
   1. CIRCUIT: centripetal Catmull-Rom, arc-length table
   ===================================================================== */
const TRACK_POINTS = [[0, 0, 0], [200, 0, 0], [320, 5, 60], [340, 12, 180], [260, 20, 260], [120, 15, 240],
  [60, 8, 320], [-80, 4, 340], [-200, 0, 260], [-240, 0, 120], [-160, 0, 40], [-80, 0, 0]];
const trackCurve = new THREE.CatmullRomCurve3(TRACK_POINTS.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, 'centripetal');
trackCurve.arcLengthDivisions = 4000;               // >= 2000 samples for the arc-length lookup
const L = trackCurve.getLength();                   // ~1551.65 m
const NSEG = Math.round(L / 0.5);
const dS = L / NSEG;
const TP = new Float32Array((NSEG + 1) * 3);
const TT = new Float32Array((NSEG + 1) * 3);
const TK = new Float32Array(NSEG + 1);
(function buildTrackTable() {
  const v = new THREE.Vector3();
  for (let i = 0; i < NSEG; i++) {
    trackCurve.getPointAt(i / NSEG, v);             // C(s) with u = s / L
    TP[i * 3] = v.x; TP[i * 3 + 1] = v.y; TP[i * 3 + 2] = v.z;
  }
  TP[NSEG * 3] = TP[0]; TP[NSEG * 3 + 1] = TP[1]; TP[NSEG * 3 + 2] = TP[2];
  for (let i = 0; i < NSEG; i++) {
    const a = ((i - 1 + NSEG) % NSEG) * 3, b = ((i + 1) % NSEG) * 3;
    const tx = TP[b] - TP[a], ty = TP[b + 1] - TP[a + 1], tz = TP[b + 2] - TP[a + 2];
    const l = Math.hypot(tx, ty, tz) || 1;
    TT[i * 3] = tx / l; TT[i * 3 + 1] = ty / l; TT[i * 3 + 2] = tz / l;
  }
  TT[NSEG * 3] = TT[0]; TT[NSEG * 3 + 1] = TT[1]; TT[NSEG * 3 + 2] = TT[2];
  const K = 6;
  for (let i = 0; i < NSEG; i++) {
    const a = ((i - K + NSEG) % NSEG) * 3, b = ((i + K) % NSEG) * 3;
    const tx = TT[i * 3], tz = TT[i * 3 + 2], hl = Math.hypot(tx, tz) || 1;
    const nx = -tz / hl, nz = tx / hl;
    TK[i] = ((TT[b] - TT[a]) * nx + (TT[b + 2] - TT[a + 2]) * nz) / (2 * K * dS);
  }
  TK[NSEG] = TK[0];
})();

// C(s), T(s), n(s) = normalize(T x Y), signed curvature (+ = right-hander)
function trackAt(s, o) {
  let u = s % L; if (u < 0) u += L;
  const f = u / dS; let i = Math.floor(f), w = f - i;
  if (i >= NSEG) { i = NSEG - 1; w = 1; }
  const a = i * 3, b = a + 3;
  o.px = TP[a] + (TP[b] - TP[a]) * w;
  o.py = TP[a + 1] + (TP[b + 1] - TP[a + 1]) * w;
  o.pz = TP[a + 2] + (TP[b + 2] - TP[a + 2]) * w;
  let tx = TT[a] + (TT[b] - TT[a]) * w, ty = TT[a + 1] + (TT[b + 1] - TT[a + 1]) * w, tz = TT[a + 2] + (TT[b + 2] - TT[a + 2]) * w;
  const tl = Math.hypot(tx, ty, tz) || 1; tx /= tl; ty /= tl; tz /= tl;
  o.tx = tx; o.ty = ty; o.tz = tz;
  const hl = Math.hypot(tx, tz) || 1;
  o.nx = -tz / hl; o.nz = tx / hl;
  o.k = TK[i] + (TK[i + 1] - TK[i]) * w;
  return o;
}
const newTS = () => ({ px: 0, py: 0, pz: 0, tx: 1, ty: 0, tz: 0, nx: 0, nz: 1, k: 0 });
const TS = newTS(), TS2 = newTS();
const modL = (s) => { let u = s % L; if (u < 0) u += L; return u; };

/* =====================================================================
   2. STANDARDISED CAR MOTION: PCHIP through the checkpoint table
   ===================================================================== */
const MOTION = [
  [0, -8.0, -2.50, -16.0, 2.50], [1, -8.0, -2.50, -16.0, 2.50], [2, -8.0, -2.50, -16.0, 2.50], [3, -8.0, -2.50, -16.0, 2.50],
  [4, -2.3, -2.31, -11.5, 2.36], [5, 14.8, -1.46, 3.1, 1.65], [6, 42.8, -0.47, 29.8, 0.76], [7, 81.1, 0.00, 68.2, 0.10],
  [8, 128.9, 0, 115.9, 0], [9, 185.1, 0, 172.2, 0], [10, 248.1, 0, 235.3, 0], [11, 310.5, 0, 297.8, 0],
  [12, 354.6, 0, 342.1, 0], [13, 403.8, 0, 391.4, 0], [14, 456.5, 0, 444.4, 0], [15, 500.6, 0, 488.6, 0],
  [16, 553.0, 0, 541.2, 0], [17, 590.7, 0, 579.2, 0], [18, 627.7, 0, 616.4, 0], [19, 674.3, 0, 663.2, 0],
  [20, 716.6, 0, 705.7, 0], [21, 744.7, 0, 734.0, 0], [22, 782.0, 0, 771.5, 0], [23, 821.0, 0, 810.8, 0],
  [24, 855.1, 0, 845.1, 0], [25, 899.0, 0, 889.1, 0], [26, 951.7, 0, 942.1, 0], [27, 1007.7, 0, 998.2, 0],
  [28, 1069.6, 0, 1060.3, 0], [29, 1131.7, 0, 1122.5, 0], [30, 1194.2, 0, 1185.1, 0], [31, 1252.2, 0, 1243.1, 0],
  [32, 1289.7, 0, 1280.7, 0], [33, 1333.9, 0, 1324.9, 0], [34, 1387.1, -0.87, 1380.4, 1.62], [35, 1447.7, -1.20, 1446.1, 3.40],
  [36, 1514.0, -1.20, 1516.7, 3.40], [37, 1583.6, -1.20, 1587.1, 3.40], [38, 1649.5, -1.20, 1653.4, 3.40],
  [39, 1710.4, -1.20, 1714.9, 3.40], [40, 1766.3, -1.20, 1771.1, 3.40]
];
function pchipColumn(c) {
  const y = MOTION.map(r => r[c]), n = y.length, d = [], m = new Array(n).fill(0);
  for (let k = 0; k < n - 1; k++) d.push(y[k + 1] - y[k]);
  for (let k = 1; k < n - 1; k++) m[k] = (d[k - 1] * d[k] > 0) ? 2 / (1 / d[k - 1] + 1 / d[k]) : 0;   // Fritsch-Carlson harmonic mean (uniform h)
  const edge = (d0, d1) => { const mm = (3 * d0 - d1) / 2; if (mm * d0 <= 0) return 0; if (d0 * d1 < 0 && Math.abs(mm) > Math.abs(3 * d0)) return 3 * d0; return mm; };
  m[0] = edge(d[0], d[1]); m[n - 1] = edge(d[n - 2], d[n - 3]);
  return { y, m };
}
const COL_SR = pchipColumn(1), COL_DR = pchipColumn(2), COL_SB = pchipColumn(3), COL_DB = pchipColumn(4);
const PC = { v: 0, d1: 0, d2: 0 };
function pchip(col, t, o) {
  const tc = clamp(t, 0, 40);
  const k = Math.min(Math.floor(tc), 39), u = tc - k, u2 = u * u, u3 = u2 * u;
  const y0 = col.y[k], y1 = col.y[k + 1], m0 = col.m[k], m1 = col.m[k + 1];
  o.v = (2 * u3 - 3 * u2 + 1) * y0 + (u3 - 2 * u2 + u) * m0 + (-2 * u3 + 3 * u2) * y1 + (u3 - u2) * m1;
  o.d1 = (6 * u2 - 6 * u) * y0 + (3 * u2 - 4 * u + 1) * m0 + (-6 * u2 + 6 * u) * y1 + (3 * u2 - 2 * u) * m1;
  o.d2 = (12 * u - 6) * y0 + (6 * u - 4) * m0 + (-12 * u + 6) * y1 + (6 * u - 2) * m1;
  return o;
}
const sOf = (id, t) => pchip(id ? COL_SB : COL_SR, t, PC).v;
function solveCrossing(id, target, a, b) {
  for (let i = 0; i < 64; i++) { const m = (a + b) / 2; if (sOf(id, m) < target) a = m; else b = m; }
  return (a + b) / 2;
}
const T_FINISH_R = solveCrossing(0, L, 34, 39);   // ~36.54
const T_FINISH_B = solveCrossing(1, L, 34, 39);   // ~36.49
const T_DRS_OPEN = 33.5;

const WHEEL_R = 0.36, WHEELBASE = 3.6;
function newKin() {
  return { s: 0, v: 0, a: 0, d: 0, dv: 0, da: 0, x: 0, y: 0, z: 0, fx: 1, fy: 0, fz: 0, ux: 0, uy: 1, uz: 0, rx: 0, ry: 0, rz: 1,
    vx: 0, vy: 0, vz: 0, k: 0, latAcc: 0 };
}
// Pure function of time: position, orientation frame and derivatives of a car.
function carKinematics(id, t, o) {
  pchip(id ? COL_SB : COL_SR, t, PC); o.s = PC.v; o.v = PC.d1; o.a = PC.d2;
  pchip(id ? COL_DB : COL_DR, t, PC); o.d = PC.v; o.dv = PC.d1; o.da = PC.d2;
  trackAt(o.s, TS2);
  o.x = TS2.px + TS2.nx * o.d; o.y = TS2.py; o.z = TS2.pz + TS2.nz * o.d;
  const vs = o.v + 0.3;
  let fx = TS2.tx * vs + TS2.nx * o.dv, fy = TS2.ty * vs, fz = TS2.tz * vs + TS2.nz * o.dv;
  const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
  let rx = -fz, rz = fx; const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
  o.fx = fx; o.fy = fy; o.fz = fz; o.rx = rx; o.ry = 0; o.rz = rz;
  o.ux = -rz * fy; o.uy = rz * fx - rx * fz; o.uz = rx * fy;   // up = right x forward
  o.vx = TS2.tx * o.v + TS2.nx * o.dv; o.vy = TS2.ty * o.v; o.vz = TS2.tz * o.v + TS2.nz * o.dv;

}
function localToWorld(k, lx, ly, lz, out) {
  out.x = k.x + k.fx * lx + k.ux * ly + k.rx * lz;
  out.y = k.y + k.fy * lx + k.uy * ly + k.ry * lz;
  out.z = k.z + k.fz * lx + k.uz * ly + k.rz * lz;
  return out;
}
// launch wheelspin envelope (blue gets the slower, spinning start)
function wheelspin(id, t) {
  const end = id ? 5.2 : 4.6;
  return smoothstep(3.0, 3.12, t) * (1 - smoothstep(end - 1.0, end, t)) * (id ? 1.0 : 0.8);
}
// skid-block spark emission strength: > 200 km/h or hard braking, modulated by track bumps
function sparkIntensity(id, k) {
  const fast = smoothstep(54.5, 60, k.v);
  const brake = smoothstep(20, 34, -k.a);
  const bump = smoothstep(0.42, 0.74, noise1(k.s / 10.5 + id * 37.1));
  return clamp(Math.max(fast, brake * 0.9) * (0.2 + 0.8 * bump), 0, 1);
}

/* ----- precomputed 1/240 s timelines (deterministic, from the table) ----- */
const PHYS_HZ = 240, NSTEP = DURATION * PHYS_HZ + 1;
const BRAKE_HEAT = [new Float32Array(NSTEP), new Float32Array(NSTEP)];
const GEAR = [new Int8Array(NSTEP), new Int8Array(NSTEP)];
const SHIFTS = [[], []];
const GEAR_VTOP = [24, 33, 41, 49, 56, 63, 70, 80];   // m/s at 12,000 rpm
(function precomputeTimelines() {
  for (let id = 0; id < 2; id++) {
    let T = 0, g = 0, lastShift = -1;
    for (let i = 0; i < NSTEP; i++) {
      const t = i / PHYS_HZ;
      pchip(id ? COL_SB : COL_SR, t, PC);
      const v = PC.d1, a = PC.d2;
      const P = Math.max(0, -a) * Math.max(v, 0);
      T += (P / 650 - T / 1.15) / PHYS_HZ;
      BRAKE_HEAT[id][i] = T;
      if (t >= 3.0) {
        const rpm = 12000 * v / GEAR_VTOP[g];
        if (rpm > 11750 && g < 7 && t - lastShift > 0.25) { g++; lastShift = t; SHIFTS[id].push([t, 1]); }
        else if (g > 0 && rpm < 7900 && 12000 * v / GEAR_VTOP[g - 1] < 11300 && t - lastShift > 0.18) { g--; lastShift = t; SHIFTS[id].push([t, -1]); }
      }
      GEAR[id][i] = g;
    }
  }

    if (simTime >= DURATION) {
      simTime = DURATION; ui.scrubber.value = DURATION.toFixed(3);
      state = 'ENDED'; showIcons(false);
    }
  }
  if (needsRender) { renderAt(simTime); needsRender = false; }
  Sound.setActive(state === 'PLAYING' && !scrubbing);
  Sound.update(simTime, KIN, CAM.shot);
}

// startup: warm up every shader program (including effects that only appear later), then render the
// resting scene at simTime 0; the countdown starts on the next animation frame.
renderAt(4.0);
CARS.forEach(function (c) { c.M.blur.visible = true; });
renderer.compile(scene, camera);
renderAt(0);
requestAnimationFrame(frame);
})();
</script>
</body>
