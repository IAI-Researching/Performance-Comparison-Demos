<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Night Duel — Floodlit Two-Car Sprint to the Line</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;

  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}

/* --- supporting rules (no geometry of the canonical dock is overridden) --- */
html { color-scheme: dark; }
#dock button svg { display: block; flex: 0 0 auto; }
#dock button:focus-visible { outline: 2px solid rgba(255,255,255,0.5); outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>

  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   F1 NIGHT DUEL — floodlit two-car sprint to the line
   Single file, single external dependency (three.js r128 UMD).
   Everything else (textures, geometry, particles, audio) is generated at
   runtime from a seeded PRNG so any simTime renders identically.
   ========================================================================= */
(function () {
'use strict';

/* ------------------------------------------------------------------ *
 * 0. Deterministic pseudo-random numbers (never Math.random)
 * ------------------------------------------------------------------ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rngSim = mulberry32(42);      // simulation / geometry / particles
const rngAudio = mulberry32(4242);  // audio noise buffers only

const rand = (r, a, b) => a + (b - a) * r();
const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
const mod = (a, n) => ((a % n) + n) % n;
const TAU = Math.PI * 2;

/* ------------------------------------------------------------------ *
 * 1. Monotone cubic Hermite (PCHIP / Fritsch–Carlson) interpolation
 *    Used for every column of the checkpoint table; analytic first and
 *    second derivatives give speed and acceleration directly.
 * ------------------------------------------------------------------ */
function pchip(xs, ys) {
  const n = xs.length;
  const h = new Array(n - 1), del = new Array(n - 1);
  for (let i = 0; i < n - 1; i++) {
    h[i] = xs[i + 1] - xs[i];
    del[i] = (ys[i + 1] - ys[i]) / h[i];
  }
  const d = new Array(n).fill(0);
  const endSlope = (h0, h1, d0, d1) => {
    let m = ((2 * h0 + h1) * d0 - h0 * d1) / (h0 + h1);
    if (m * d0 <= 0) m = 0;
    else if (d0 * d1 <= 0 && Math.abs(m) > Math.abs(3 * d0)) m = 3 * d0;
    return m;
  };
  if (n === 2) {
    d[0] = d[1] = del[0];
  } else {
    for (let i = 1; i < n - 1; i++) {
      if (del[i - 1] * del[i] <= 0) d[i] = 0;
      else {
        const w1 = 2 * h[i] + h[i - 1];
        const w2 = h[i] + 2 * h[i - 1];
        d[i] = (w1 + w2) / (w1 / del[i - 1] + w2 / del[i]);
      }
    }
    d[0] = endSlope(h[0], h[1], del[0], del[1]);
    d[n - 1] = endSlope(h[n - 2], h[n - 3], del[n - 2], del[n - 3]);
  }
  return {
    xs: xs, ys: ys, h: h, d: d, n: n,
    /* value, 1st derivative and 2nd derivative at x */
    eval: function (x) {
      if (x <= this.xs[0]) return { v: this.ys[0], d: this.d[0], dd: 0 };
      if (x >= this.xs[this.n - 1]) return { v: this.ys[this.n - 1], d: this.d[this.n - 1], dd: 0 };
      let i = 0;
      while (i < this.n - 2 && x > this.xs[i + 1]) i++;
      const hh = this.h[i];
      const u = (x - this.xs[i]) / hh;
      const u2 = u * u, u3 = u2 * u;
      const y0 = this.ys[i], y1 = this.ys[i + 1];
      const m0 = this.d[i], m1 = this.d[i + 1];
      const v = (2 * u3 - 3 * u2 + 1) * y0 + (u3 - 2 * u2 + u) * hh * m0 +
                (-2 * u3 + 3 * u2) * y1 + (u3 - u2) * hh * m1;
      const dv = ((6 * u2 - 6 * u) * y0 + (3 * u2 - 4 * u + 1) * hh * m0 +
                 (-6 * u2 + 6 * u) * y1 + (3 * u2 - 2 * u) * hh * m1) / hh;
      const ddv = ((12 * u - 6) * y0 + (6 * u - 4) * hh * m0 +
                  (-12 * u + 6) * y1 + (6 * u - 2) * hh * m1) / (hh * hh);
      return { v: v, d: dv, dd: ddv };
    }
  };
}

/* ------------------------------------------------------------------ *
 * 2. Checkpoint table — the single source of truth for car motion
 * ------------------------------------------------------------------ */
const TABLE = [
  [0,  -8.0, -2.50, -16.0,  2.50],
  [1,  -8.0, -2.50, -16.0,  2.50],
  [2,  -8.0, -2.50, -16.0,  2.50],
  [3,  -8.0, -2.50, -16.0,  2.50],
  [4,  -2.3, -2.31, -11.5,  2.36],
  [5,  14.8, -1.46,   3.1,  1.65],
  [6,  42.8, -0.47,  29.8,  0.76],
  [7,  81.1,  0.00,  68.2,  0.10],
  [8, 128.9,  0.00, 115.9,  0.00],
  [9, 185.1,  0.00, 172.2,  0.00],
  [10, 248.1, 0.00, 235.3, 0.00],
  [11, 310.5, 0.00, 297.8, 0.00],
  [12, 354.6, 0.00, 342.1, 0.00],
  [13, 403.8, 0.00, 391.4, 0.00],
  [14, 456.5, 0.00, 444.4, 0.00],
  [15, 500.6, 0.00, 488.6, 0.00],
  [16, 553.0, 0.00, 541.2, 0.00],
  [17, 590.7, 0.00, 579.2, 0.00],
  [18, 627.7, 0.00, 616.4, 0.00],
  [19, 674.3, 0.00, 663.2, 0.00],
  [20, 716.6, 0.00, 705.7, 0.00],
  [21, 744.7, 0.00, 734.0, 0.00],
  [22, 782.0, 0.00, 771.5, 0.00],
  [23, 821.0, 0.00, 810.8, 0.00],
  [24, 855.1, 0.00, 845.1, 0.00],
  [25, 899.0, 0.00, 889.1, 0.00],
  [26, 951.7, 0.00, 942.1, 0.00],
  [27, 1007.7, 0.00, 998.2, 0.00],
  [28, 1069.6, 0.00, 1060.3, 0.00],
  [29, 1131.7, 0.00, 1122.5, 0.00],
  [30, 1194.2, 0.00, 1185.1, 0.00],
  [31, 1252.2, 0.00, 1243.1, 0.00],
  [32, 1289.7, 0.00, 1280.7, 0.00],
  [33, 1333.9, 0.00, 1324.9, 0.00],
  [34, 1387.1, -0.87, 1380.4,  1.62],
  [35, 1447.7, -1.20, 1446.1,  3.40],
  [36, 1514.0, -1.20, 1516.7,  3.40],
  [37, 1583.6, -1.20, 1587.1,  3.40],
  [38, 1649.5, -1.20, 1653.4,  3.40],
  [39, 1710.4, -1.20, 1714.9,  3.40],
  [40, 1766.3, -1.20, 1771.1,  3.40]
];
const TX = TABLE.map(r => r[0]);
const splineR = pchip(TX, TABLE.map(r => r[1]));
const splineDR = pchip(TX, TABLE.map(r => r[2]));
const splineB = pchip(TX, TABLE.map(r => r[3]));
const splineDB = pchip(TX, TABLE.map(r => r[4]));

/* ------------------------------------------------------------------ *
 * 3. Circuit: CatmullRomCurve3 + dense arc-length lookup
 * ------------------------------------------------------------------ */
const TRACK_POINTS = [
  new THREE.Vector3(0, 0, 0), new THREE.Vector3(200, 0, 0),
  new THREE.Vector3(320, 5, 60), new THREE.Vector3(340, 12, 180),
  new THREE.Vector3(260, 20, 260), new THREE.Vector3(120, 15, 240),
  new THREE.Vector3(60, 8, 320), new THREE.Vector3(-80, 4, 340),
  new THREE.Vector3(-200, 0, 260), new THREE.Vector3(-240, 0, 120),
  new THREE.Vector3(-160, 0, 40), new THREE.Vector3(-80, 0, 0)
];
const curve = new THREE.CatmullRomCurve3(TRACK_POINTS, true, 'centripetal');
const L = curve.getLength();               // closed lap length (≈1552 m)
const ARC_N = 4096;                        // arc-length lookup samples
const ARC = new Array(ARC_N + 1);
for (let i = 0; i <= ARC_N; i++) {
  ARC[i] = curve.getPointAt(i / ARC_N);
}
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3();

/* centreline point at arc-length s (wraps) */
function C(s, out) {
  const o = out || new THREE.Vector3();
  const u = mod(s, L) / L * ARC_N;
  const i = Math.min(ARC_N - 1, Math.floor(u));
  const f = u - i;
  o.copy(ARC[i]).lerp(ARC[i + 1], f);
  return o;
}
/* unit tangent at arc-length s */
function T(s, out) {
  const o = out || new THREE.Vector3();
  const u = mod(s, L) / L * ARC_N;
  const i = Math.min(ARC_N - 1, Math.floor(u));
  _v1.copy(ARC[i]);
  _v2.copy(ARC[i + 1]);
  o.copy(_v2).sub(_v1).normalize();
  return o;
}
/* right-hand normal n(s) = normalize(T x up) */
const UP = new THREE.Vector3(0, 1, 0);
function N(s, out) {
  const o = out || new THREE.Vector3();
  T(s, o);
  return o.cross(UP).normalize();
}
/* signed curvature (1/m) about the right-hand normal */
function curvature(s) {
  const d = 4.0;
  const a = T(s - d, new THREE.Vector3());
  const b = T(s + d, new THREE.Vector3());
  const n = N(s, new THREE.Vector3());
  const ang = Math.asin(clamp(b.clone().sub(a).normalize().dot(n), -1, 1));
  return ang / (2 * d);
}

/* ------------------------------------------------------------------ *
 * 4. Renderer, scene, camera
 * ------------------------------------------------------------------ */

/* three.js r128 performs no automatic colour management: every authored sRGB
   hex is converted into the linear working space by hand */
function SC(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }
function SCs(hex, k) { return new THREE.Color(hex).convertSRGBToLinear().multiplyScalar(k); }
const _v3 = new THREE.Vector3();

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
  canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(SC(0x06080d), 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(SC(0x141b26), 0.00215);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 3000);
camera.position.set(-34, 2.6, 0);

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

/* ------------------------------------------------------------------ *
 * 5. Procedural texture factory (all canvases stay detached in memory)
 * ------------------------------------------------------------------ */
function cv(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c: c, x: c.getContext('2d') };
}
function tex(canvas, repeatX, repeatY, srgb) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeatX) t.repeat.set(repeatX, repeatY || repeatX);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* asphalt: damp grain + tar patches */
function asphaltTexture() {
  const o = cv(512, 512), x = o.x;
  x.fillStyle = '#14161b'; x.fillRect(0, 0, 512, 512);
  const img = x.getImageData(0, 0, 512, 512), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rngSim() - 0.5) * 34;
    d[i] = clamp(d[i] + n, 0, 255);
    d[i + 1] = clamp(d[i + 1] + n, 0, 255);
    d[i + 2] = clamp(d[i + 2] + n * 1.1, 0, 255);
  }
  x.putImageData(img, 0, 0);
  for (let i = 0; i < 90; i++) {
    const px = rngSim() * 512, py = rngSim() * 512, r = 8 + rngSim() * 54;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    const a = 0.05 + rngSim() * 0.09;
    g.addColorStop(0, 'rgba(60,64,72,' + a.toFixed(3) + ')');
    g.addColorStop(1, 'rgba(60,64,72,0)');
    x.fillStyle = g; x.beginPath(); x.arc(px, py, r, 0, TAU); x.fill();
  }
  for (let i = 0; i < 26; i++) {
    x.strokeStyle = 'rgba(8,9,12,' + (0.10 + rngSim() * 0.2).toFixed(3) + ')';
    x.lineWidth = 1 + rngSim() * 2.4;
    x.beginPath();
    let px = rngSim() * 512, py = rngSim() * 512;
    x.moveTo(px, py);
    for (let k = 0; k < 5; k++) { px += (rngSim() - 0.5) * 120; py += (rngSim() - 0.5) * 120; x.lineTo(px, py); }
    x.stroke();
  }
  return o.c;
}
/* wet roughness variation: elongated streaks along the driving direction.
   Kept shallow on purpose — a wide roughness swing turns the asphalt into a
   mirror that reflects the floodlight panels as hard rectangles. */
function asphaltRoughTexture() {
  const o = cv(256, 256), x = o.x;
  x.fillStyle = '#d4d4d4'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 190; i++) {
    const px = rngSim() * 256, py = rngSim() * 256, w = 2 + rngSim() * 9, h = 14 + rngSim() * 70;
    const g = x.createLinearGradient(px, py, px, py + h);
    const v = Math.floor(96 + rngSim() * 92);
    g.addColorStop(0, 'rgba(' + v + ',' + v + ',' + v + ',0.5)');
    g.addColorStop(1, 'rgba(' + v + ',' + v + ',' + v + ',0)');
    x.fillStyle = g; x.fillRect(px, py, w, h);
  }
  const img = x.getImageData(0, 0, 256, 256), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rngSim() - 0.5) * 16;
    d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  x.putImageData(img, 0, 0);
  return o.c;
}
/* carbon fibre twill */
function carbonTexture() {
  const o = cv(256, 256), x = o.x;
  x.fillStyle = '#0c0d10'; x.fillRect(0, 0, 256, 256);
  const cell = 16;
  for (let gy = 0; gy < 256 / cell; gy++) {
    for (let gx = 0; gx < 256 / cell; gx++) {
      const up = ((gx + gy) & 1) === 0;
      const g = x.createLinearGradient(gx * cell, gy * cell,
        up ? (gx + 1) * cell : gx * cell, up ? gy * cell : (gy + 1) * cell);
      g.addColorStop(0, '#101319');
      g.addColorStop(0.5, up ? '#333a45' : '#242a33');
      g.addColorStop(1, '#0c0d10');
      x.fillStyle = g;
      x.fillRect(gx * cell, gy * cell, cell, cell);
    }
  }
  const img = x.getImageData(0, 0, 256, 256), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rngSim() - 0.5) * 16;
    d[i] = clamp(d[i] + n, 0, 255); d[i + 1] = clamp(d[i + 1] + n, 0, 255); d[i + 2] = clamp(d[i + 2] + n, 0, 255);
  }
  x.putImageData(img, 0, 0);

/* equirectangular night sky */
function skyTexture() {
  const W = 2048, H = 1024;

/* ------------------------------------------------------------------ *
 * 7. Circuit construction helpers
 * ------------------------------------------------------------------ */
const ROAD_HALF = 7.0;

/* generic ribbon between two lateral offsets along the centreline */
function ribbon(o) {
  const steps = o.steps || 512;
  const s0 = o.s0 || 0, s1 = (o.s1 === undefined) ? L : o.s1;
  const pos = [], nor = [], uvs = [], idx = [], cols = [];
  const p = new THREE.Vector3(), nrm = new THREE.Vector3(), tan = new THREE.Vector3();
  const vi = new THREE.Vector3(), vo = new THREE.Vector3();
  for (let i = 0; i <= steps; i++) {
    const f = i / steps;
    const s = s0 + (s1 - s0) * f;
    C(s, p); N(s, nrm); T(s, tan);
    const y = o.y ? o.y(s) : 0;
    const offI = typeof o.inner === 'function' ? o.inner(s) : o.inner;
    const offO = typeof o.outer === 'function' ? o.outer(s) : o.outer;
    vi.copy(p).addScaledVector(nrm, offI).addScaledVector(UP, y);
    vo.copy(p).addScaledVector(nrm, offO).addScaledVector(UP, y);
    const nx = nrm.clone().cross(tan).normalize();
    pos.push(vi.x, vi.y, vi.z, vo.x, vo.y, vo.z);
    nor.push(nx.x, nx.y, nx.z, nx.x, nx.y, nx.z);
    const v = (s / L);
    uvs.push(0, v, 1, v);
    if (o.color) {
      const c0 = o.color(s, 0), c1 = o.color(s, 1);
      cols.push(c0[0], c0[1], c0[2], c1[0], c1[1], c1[2]);
    }
    if (i < steps) {
      const a = i * 2;
      if (offO >= offI) idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
      else idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  if (o.color) g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  return g;
}

/* kerbs: red/white on the inside of every meaningful corner */
const kerbRanges = (function () {
  const step = 2.0;
  const n = Math.floor(L / step);
  const ks = new Array(n);
  for (let i = 0; i < n; i++) ks[i] = curvature(i * step);
  const ranges = [];
  let cur = null;
  for (let i = 0; i < n; i++) {
    const k = ks[i];
    const strong = Math.abs(k) > 0.0042;
    if (strong && !cur) cur = { a: i, side: k > 0 ? 1 : -1 };
    else if (strong && cur && Math.sign(k) !== cur.side) { cur.b = i; ranges.push(cur); cur = { a: i, side: k > 0 ? 1 : -1 }; }
    else if (!strong && cur) { cur.b = i; ranges.push(cur); cur = null; }
  }
  if (cur) { cur.b = n; ranges.push(cur); }
  return ranges.filter(r => (r.b - r.a) * step > 12);
})();
const matKerb = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.42, metalness: 0.05 });
for (const r of kerbRanges) {
  const s0 = r.a * 2.0 - 2, s1 = r.b * 2.0 + 2;
  const side = r.side;
  const inner = side * ROAD_HALF, outer = side * (ROAD_HALF + 0.95);
  const g = ribbon({
    steps: Math.max(24, Math.round((s1 - s0) / 0.9)), s0: s0, s1: s1,
    inner: inner, outer: outer,
    y: (s) => 0.055 + 0.02 * Math.sin((s / 2.4) * Math.PI),
    color: (s) => {
      const blk = Math.floor(s / 2.4) & 1;
      return blk ? [0.58, 0.58, 0.61] : [0.40, 0.022, 0.030];
    }
  });
  const m = new THREE.Mesh(g, matKerb);
  m.receiveShadow = true;
  scene.add(m);
  /* kerb shadow/edge strip on the asphalt side */
  const g2 = ribbon({
    steps: Math.max(24, Math.round((s1 - s0) / 1.2)), s0: s0, s1: s1,
    inner: side * (ROAD_HALF - 0.55), outer: inner, y: () => 0.014,
    color: () => [0.05, 0.05, 0.06]
  });
  scene.add(new THREE.Mesh(g2, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.55 })));
}

/* ------------------------------------------------------------------ *

 * ------------------------------------------------------------------ */
const MASTS = [];
{
  let s = 42, side = 1;
  while (s < L - 25) {
    MASTS.push({ s: s, side: side });
    s += 60 + rngSim() * 20;
    side = -side;

}
const matMast = new THREE.MeshStandardMaterial({ color: SC(0x2c3138), roughness: 0.72, metalness: 0.55 });
const matLamp = new THREE.MeshBasicMaterial({ color: SCs(0xfff6e2, 2.6) });
const matLampHousing = new THREE.MeshStandardMaterial({ color: SC(0x14171c), roughness: 0.6, metalness: 0.5 });
const glowTex = tex(radialSprite('rgba(255,246,224,0.95)', 'rgba(255,232,190,0.35)', 128), 0, 0, true);
glowTex.wrapS = glowTex.wrapT = THREE.ClampToEdgeWrapping;
const matGlow = new THREE.SpriteMaterial({ map: glowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false });

const coneMat = new THREE.MeshBasicMaterial({
  vertexColors: true, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending,
  depthWrite: false, side: THREE.DoubleSide, fog: false
});
for (const m of MASTS) {
  const base = C(m.s, new THREE.Vector3());
  const n = N(m.s, new THREE.Vector3());
  const head = base.clone().addScaledVector(n, m.side * 11.2).setY(base.y + 30);
  /* pole */
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.55, 30, 10), matMast);
  pole.position.copy(base).addScaledVector(n, m.side * 11.2).setY(base.y + 15);
  pole.castShadow = false;
  scene.add(pole);
  /* head */
  const headG = new THREE.BoxGeometry(5.0, 0.7, 2.4);
  const headM = new THREE.Mesh(headG, matLampHousing);
  headM.position.copy(head);
  headM.lookAt(base);
  scene.add(headM);
  /* lamp faces */
  for (let i = 0; i < 4; i++) {
    const lamp = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 1.7), matLamp);
    lamp.position.set(-1.75 + i * 1.17, -0.4, 0);
    lamp.rotation.x = -Math.PI / 2;
    headM.add(lamp);
  }
  /* glow sprite */
  const glow = new THREE.Sprite(matGlow);
  glow.scale.set(13, 9, 1);
  glow.position.copy(head).setY(head.y - 0.6);
  scene.add(glow);
  /* haze cone */
  const target = base.clone().addScaledVector(n, m.side * 1.5).setY(base.y + 0.2);
  const h = head.distanceTo(target);
  const coneG = new THREE.ConeGeometry(9.5, h, 22, 1, true);
  const cols = [], pos = coneG.getAttribute('position');
  for (let i = 0; i < pos.count; i++) {
    const t = (pos.getY(i) + h / 2) / h;   /* 0 base → 1 apex */
    const a = Math.pow(t, 2.1) * 0.5;

/* baked pools of floodlight on the damp road.
   The pool profile varies across the width of the road, so the surface has to
   be sampled laterally as well as along the lap — a two-vertex ribbon would
   only ever carry the colour of the road edges. */
const POOL_LANES = 11;
const poolGeo = (function () {
  const steps = 1400, lanes = POOL_LANES;
  const pos = [], nor = [], idx = [], cols = [];
  const p = new THREE.Vector3(), nrm = new THREE.Vector3(), tan = new THREE.Vector3();
  for (let i = 0; i <= steps; i++) {
    const s = (i / steps) * L;
    C(s, p); N(s, nrm); T(s, tan);
    const nx = nrm.clone().cross(tan).normalize();
    for (let j = 0; j <= lanes; j++) {
      const off = -ROAD_HALF + (j / lanes) * (ROAD_HALF * 2);
      pos.push(p.x + nrm.x * off, p.y + 0.022, p.z + nrm.z * off);
      nor.push(nx.x, nx.y, nx.z);
      let I = 0;
      for (const m of MASTS) {
        let ds = s - m.s;
        ds = mod(ds + L / 2, L) - L / 2;
        const dd = off - m.side * 1.6;
        const r = (ds * ds) / (13.5 * 13.5) + (dd * dd) / (6.8 * 6.8);
        if (r < 1) { const f = 1 - r; I += f * f * f * 0.95; }
      }
      I = Math.min(I, 1.0);
      cols.push(I * 0.92, I * 0.90, I * 0.84);
    }
  }
  const row = lanes + 1;
  for (let i = 0; i < steps; i++) {
    for (let j = 0; j < lanes; j++) {
      const a = i * row + j;
      idx.push(a, a + 1, a + row, a + 1, a + row + 1, a + row);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  g.setIndex(idx);
  g.computeBoundingSphere();
  return g;
})();

{
  /* coarse track sample for nearest-point queries */
  const NS = 420;
  const sp = [];
  for (let i = 0; i < NS; i++) {
    const p = C(i / NS * L, new THREE.Vector3());
    sp.push(p.x, p.z, p.y);
  }
  const hillNoise = (x, z) => {
    let h = 0, a = 1, f = 0.0032;
    for (let o = 0; o < 5; o++) {
      h += a * (Math.sin(x * f * 1.7 + o * 2.1) * Math.cos(z * f * 1.3 + o * 1.7)
              + 0.6 * Math.sin((x + z) * f * 2.6 + o * 3.3));
      a *= 0.52; f *= 2.15;
    }
    return h;
  };
  const TER = 1500, GN = 90;
  const pos = [], idx = [];
  for (let j = 0; j <= GN; j++) {
    for (let i = 0; i <= GN; i++) {
      const x = -TER / 2 + TER * i / GN, z = -TER / 2 + TER * j / GN;
      let best = 1e18, by = 0;
      for (let k = 0; k < NS; k++) {
        const dx = x - sp[k * 3], dz = z - sp[k * 3 + 1];
        const d2 = dx * dx + dz * dz;
        if (d2 < best) { best = d2; by = sp[k * 3 + 2]; }
      }
      const dist = Math.sqrt(best);
      const near = smoothstep(34, 130, dist);
      const h = by * (1 - near) + (by + hillNoise(x, z) * 26 + 6) * near;
      pos.push(x, h - 0.35, z);
    }
  }
  for (let j = 0; j < GN; j++) {
    for (let i = 0; i < GN; i++) {
      const a = j * (GN + 1) + i;
      idx.push(a, a + GN + 1, a + 1, a + 1, a + GN + 1, a + GN + 2);
    }
  }

  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const matTerrain = new THREE.MeshStandardMaterial({ color: SC(0x0d1016), roughness: 1.0, metalness: 0.0 });

/* ------------------------------------------------------------------ *
 * 14. Lofting helper — sculpts the bodywork from cross-sections
 * ------------------------------------------------------------------ */
function sectionPts(st, segs) {
  const pts = [];
  const n = st.n || 4.2;
  const e = 2 / n;
  const closed = st.open !== true;
  const a0 = closed ? 0 : Math.PI;
  const a1 = TAU;
  const count = closed ? segs : segs + 1;
  for (let i = 0; i < count; i++) {
    const th = a0 + (a1 - a0) * (i / segs);
    const c = Math.cos(th), s = Math.sin(th);
    const z = st.hw * Math.sign(c) * Math.pow(Math.abs(c), e);
    let y = st.hh * Math.sign(s) * Math.pow(Math.abs(s), e);
    if (st.dip && s > 0) y -= st.dip * Math.pow(Math.max(0, c), 2) * Math.pow(s, 0.55);
    if (st.hole && s > 0) {
      const w = Math.max(0, 1 - Math.pow(Math.abs(c) / st.hole, 4));
      y -= st.dipTop * w;
    }
    pts.push(z, st.cy + y);
  }
  return pts;
}
function loft(stations, segs, capStart, capEnd) {
  segs = segs || 18;
  const rings = stations.map(st => sectionPts(st, segs));
  const per = rings[0].length / 2;
  const pos = [], uv = [], idx = [];
  /* stations may run forwards or backwards along X — wind the shell outward
     for whichever direction the profile was authored in */
  const forward = stations[stations.length - 1].x >= stations[0].x;
  for (let i = 0; i < stations.length; i++) {
    const st = stations[i], r = rings[i];
    for (let j = 0; j < per; j++) {
      pos.push(st.x, r[j * 2 + 1], r[j * 2]);
      uv.push(j / (per - 1), i / (stations.length - 1));
    }
  }
  for (let i = 0; i < stations.length - 1; i++) {
    for (let j = 0; j < per - 1; j++) {
      const a = i * per + j;
      if (forward) idx.push(a, a + per, a + 1, a + 1, a + per, a + per + 1);
      else idx.push(a, a + 1, a + per, a + 1, a + per + 1, a + per);
    }
  }
  const capRing = (ri, flip) => {
    const st = stations[ri], r = rings[ri];
    let cz = 0, cy = 0;
    for (let j = 0; j < per; j++) { cz += r[j * 2]; cy += r[j * 2 + 1]; }
    cz /= per; cy /= per;
    const centre = pos.length / 3;
    pos.push(st.x, cy, cz); uv.push(0.5, 0.5);
    const base = ri * per;
    for (let j = 0; j < per - 1; j++) {
      if (flip) idx.push(centre, base + j + 1, base + j);
      else idx.push(centre, base + j, base + j + 1);
    }
  };
  if (capStart) capRing(0, !forward);
  if (capEnd) capRing(stations.length - 1, forward);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function tubeMesh(a, b, r, mat, seg) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r, r, len, seg || 8, 1);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  return m;
}
function pathTube(pts, r, mat, tub) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])), false, 'catmullrom', 0.2);
  const g = new THREE.TubeGeometry(curve, tub || 18, r, 7, false);
  return new THREE.Mesh(g, mat);
}

 * ------------------------------------------------------------------ */
function makePoints(count, map, additive) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const size = new Float32Array(count);
  const alpha = new Float32Array(count);
  const col = new Float32Array(count * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 4000);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uMap: { value: map } },
    vertexShader: [
      'attribute float aSize; attribute float aAlpha; attribute vec3 aColor;',
      'varying float vAlpha; varying vec3 vColor;',
      'void main() {',
      '  vAlpha = aAlpha; vColor = aColor;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = aSize * (320.0 / max(0.001, -mv.z));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uMap;',
      'varying float vAlpha; varying vec3 vColor;',
      'void main() {',
      '  vec4 t = texture2D(uMap, gl_PointCoord);',
      '  float a = t.a * vAlpha;',
      '  if (a < 0.004) discard;',
      '  gl_FragColor = vec4(vColor, a);',
      '}'
    ].join('\n'),
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
  });
  const pts = new THREE.Points(geo, mat);
  pts.frustumCulled = false;
  scene.add(pts);
  return {
    pts: pts, geo: geo, pos: pos, size: size, alpha: alpha, col: col, count: count,
    set: function (i, x, y, z, s, a, r, g, b) {
      pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
      size[i] = s; alpha[i] = a; col[i * 3] = r; col[i * 3 + 1] = g; col[i * 3 + 2] = b;
    }
  };
}

      crowd.f.frequency.setTargetAtTime(560 + swell * 180 + roarT * 420, t, 0.3);
      /* breeze */
      breeze.g.gain.setTargetAtTime(0.014 + 0.010 * (0.5 + 0.5 * Math.sin(simTime * 0.7)), t, 0.4);
    }
  };
})();

/* ------------------------------------------------------------------ *
 * 22. Particle emission — closed form functions of simTime
 * ------------------------------------------------------------------ */
const _kin = {
  s: 0, v: 0, a: 0, d: 0,
  pos: new THREE.Vector3(), fwd: new THREE.Vector3(),
  right: new THREE.Vector3(), up: new THREE.Vector3()
};
function kinAt(splineS, splineD, time, out) {
  const si = splineS.eval(clamp(time, 0, 40));
  const d = splineD.eval(clamp(time, 0, 40)).v;
  const s = si.v;
  C(s, out.pos); N(s, out.right); T(s, out.fwd);
  out.pos.addScaledVector(out.right, d);
  out.up.copy(out.right).cross(out.fwd).normalize();
  out.right.copy(out.fwd).cross(UP).normalize();
  out.s = s; out.v = si.d; out.a = si.dd; out.d = d;
  return out;
}
const SPRAY_CFG = { slots: 26, gens: 11, period: 0.05, life: 0.62 };
const SMOKE_CFG = { slots: 18, gens: 9, period: 0.07, life: 1.05 };
const SPARK_CFG = { slots: 22, gens: 6, period: 0.035, life: 0.55 };
const SHIM_CFG = { slots: 14, gens: 5, period: 0.13, life: 1.5 };

function emitStream(sys, sd, splineS, splineD, t, cfg, kind) {
  const P = cfg.period, life = cfg.life;
  for (let k = 0; k < cfg.slots; k++) {
    const phase = (k + 0.5) / cfg.slots;
    const eBase = Math.floor((t - phase * P) / P) * P + phase * P;
    for (let g = 0; g < cfg.gens; g++) {
      const idx = k + g * cfg.slots;
      if (idx >= sys.count) break;
      const e = eBase - g * P;
      const age = t - e;
      if (age < 0 || age > life) { sys.set(idx, 0, -9999, 0, 0, 0, 0, 0, 0); continue; }
      kinAt(splineS, splineD, e, _kin);
      const j = sd[idx];
      const spd = _kin.v;
      let x, y, z, size, alpha, cr, cg, cb;
      if (kind === 'spray') {
        const boost = smoothstep(2.9, 3.25, e) * (1 - smoothstep(4.4, 6.2, e)) * 0.6;
        const inten = clamp(spd / 22, 0, 1) * 0.75 + boost;
        if (inten <= 0.01) { sys.set(idx, 0, -9999, 0, 0, 0, 0, 0, 0); continue; }
        x = _kin.pos.x + _kin.fwd.x * -1.72 + _kin.right.x * (j.jx * 0.72);
        y = _kin.pos.y + 0.035;
        z = _kin.pos.z + _kin.fwd.z * -1.72 + _kin.right.z * (j.jx * 0.72);
        const vx = -_kin.fwd.x * (2.0 + spd * 0.11) + _kin.right.x * (j.jx * 2.0);
        const vz = -_kin.fwd.z * (2.0 + spd * 0.11) + _kin.right.z * (j.jx * 2.0);
        const vy = 1.5 + j.jy * 1.5;
        x += vx * age; z += vz * age; y += vy * age - 1.6 * age * age;
        size = (0.30 + age * 0.55) * j.sc;
        alpha = Math.pow(1 - age / life, 1.4) * (0.30 + 0.32 * inten);
        cr = 0.62; cg = 0.68; cb = 0.78;
      } else if (kind === 'smoke') {
        const inten = smoothstep(2.95, 3.3, e) * (1 - smoothstep(3.9, 6.0, e));
        if (inten <= 0.01) { sys.set(idx, 0, -9999, 0, 0, 0, 0, 0, 0); continue; }
        x = _kin.pos.x + _kin.fwd.x * -1.7 + _kin.right.x * (j.jx * 0.8);
        y = _kin.pos.y + 0.10;
        z = _kin.pos.z + _kin.fwd.z * -1.7 + _kin.right.z * (j.jx * 0.8);
        const vx = -_kin.fwd.x * 1.3 + _kin.right.x * (j.jx * 1.3);
        const vz = -_kin.fwd.z * 1.3 + _kin.right.z * (j.jx * 1.3);
        x += vx * age; z += vz * age; y += (1.1 + j.jy * 1.1) * age;
        size = (0.7 + age * 2.1) * j.sc;
        alpha = Math.pow(1 - age / life, 1.7) * 0.34 * inten;
        cr = 0.66; cg = 0.68; cb = 0.72;
      } else if (kind === 'spark') {
        const hot = (spd > 55.5 || _kin.a < -8.5) && spd > 12;
        if (!hot) { sys.set(idx, 0, -9999, 0, 0, 0, 0, 0, 0); continue; }
        x = _kin.pos.x + _kin.fwd.x * -1.25 + _kin.right.x * (j.jx * 0.55);
        y = _kin.pos.y + 0.02;
        z = _kin.pos.z + _kin.fwd.z * -1.25 + _kin.right.z * (j.jx * 0.55);
        const vx = -_kin.fwd.x * (3.0 + j.jy * 5.5) + _kin.right.x * (j.jx * 3.2);
        const vz = -_kin.fwd.z * (3.0 + j.jy * 5.5) + _kin.right.z * (j.jx * 3.2);
        x += vx * age; z += vz * age;
        y += (2.6 + j.jy * 2.4) * age - 9.8 * age * age * 0.5;
        if (y < _kin.pos.y - 0.2) y = _kin.pos.y - 0.2;
        size = (0.10 + j.jy * 0.09);
        alpha = Math.pow(1 - age / life, 1.5);
        cr = 1.0; cg = 0.55 + 0.35 * j.jy; cb = 0.16;
      } else { /* shimmer */
        const inten = (e < 9) ? (1 - smoothstep(3.0, 6.8, e)) : 0;
        if (inten <= 0.01) { sys.set(idx, 0, -9999, 0, 0, 0, 0, 0, 0); continue; }
        x = _kin.pos.x - _kin.fwd.x * (2.2 + j.jy * 0.9) + _kin.right.x * (j.jx * 0.7);
        y = _kin.pos.y + 0.30 + j.jy * 0.3;
        z = _kin.pos.z - _kin.fwd.z * (2.2 + j.jy * 0.9) + _kin.right.z * (j.jx * 0.7);
        const wob = Math.sin(age * 6.0 + j.jx * 9.0) * 0.12;
        x += _kin.right.x * wob; z += _kin.right.z * wob;
        y += (0.55 + j.jy * 0.5) * age;
        size = (0.5 + age * 1.5) * j.sc;
        alpha = Math.sin(Math.PI * clamp(age / life, 0, 1)) * 0.17 * inten;
        cr = 0.58; cg = 0.63; cb = 0.72;
      }
      sys.set(idx, x, y, z, size, alpha, cr, cg, cb);
    }
  }
  sys.geo.getAttribute('position').needsUpdate = true;
  sys.geo.getAttribute('aSize').needsUpdate = true;
  sys.geo.getAttribute('aAlpha').needsUpdate = true;
  sys.geo.getAttribute('aColor').needsUpdate = true;
}

/* ------------------------------------------------------------------ *
 * 23. renderAt(simTime) — fully deterministic
 * ------------------------------------------------------------------ */
const camDir = new THREE.Vector3(), camUpV = new THREE.Vector3();
let lastShot = -1;
function brakeGlow(t, splineS) {
  let acc = 0;
  for (let k = 0; k < 22; k++) {
    const tt = t - k * 0.05;
    if (tt < 0) break;
    const a = splineS.eval(tt).dd;
    acc += Math.max(0, -a) * Math.exp(-k * 0.05 / 0.40);
  }
  return clamp(acc * 0.075, 0, 1);
}
function renderAt(t) {
  t = clamp(t, 0, 40);
  const kinR = poseCar(carRed, carKinematics(splineR, splineDR, t));
  const kinB = poseCar(carBlue, carKinematics(splineB, splineDB, t));

  /* DRS: the blue car opens the flap from 33.500 until it crosses the line */
  const drsOpen = smoothstep(33.50, 33.85, t) * (1 - smoothstep(36.40, 36.49, t));
  carBlue.userData.drs.rotation.z = -0.95 * drsOpen;
  carRed.userData.drs.rotation.z = 0;

  /* brake disc glow */
  const gR = brakeGlow(t, splineR), gB = brakeGlow(t, splineB);
  carRed.userData.discMat.emissiveIntensity = gR * 3.0;
  carBlue.userData.discMat.emissiveIntensity = gB * 3.0;

  /* rain lights blink at 4 Hz of simTime */
  const rainOn = (t * 4) % 1 < 0.5;
  carRed.userData.rain.material.color.copy(rainOn ? SCs(0xff2412, 2.0) : SC(0x360609));
  carBlue.userData.rain.material.color.copy(rainOn ? SCs(0xff2412, 2.0) : SC(0x360609));

  /* start gantry lights */
  const gl = gantry.userData.lights;
  const greenPhase = t >= 36.49;
  const greenFlash = greenPhase ? (((t - 36.49) * 5) % 1 < 0.5) : false;
  for (let i = 0; i < 5; i++) {
    let on = false, col = SC(0x2a0608), gcol = SC(0xff3020);
    if (greenPhase) { on = greenFlash; col = on ? SCs(0x2bff5a, 2.2) : SC(0x062112); gcol = SC(0x40ff70); }
    else if (t < 3.0 && t >= 0.5 * (i + 1)) { on = true; col = SCs(0xff2a18, 2.2); }
    gl[i].lens.color.copy(col);
    gl[i].repeater.color.copy(col);
    gl[i].glow.opacity = on ? 0.8 : 0;
    gl[i].glow.color.copy(on ? gcol : SC(0x000000));
  }

  /* grandstand camera flashes */
  for (const f of flashSprites) {
    const d = Math.abs(t - f.t);
    f.sp.material.opacity = d < 0.075 ? (1 - d / 0.075) * 0.95 : 0;
  }

  /* particles */
  emitStream(spraySys[0], seedData[0].spray, splineR, splineDR, t, SPRAY_CFG, 'spray');
  emitStream(spraySys[1], seedData[1].spray, splineB, splineDB, t, SPRAY_CFG, 'spray');
  emitStream(smokeSys[0], seedData[0].smoke, splineR, splineDR, t, SMOKE_CFG, 'smoke');
  emitStream(smokeSys[1], seedData[1].smoke, splineB, splineDB, t, SMOKE_CFG, 'smoke');
  emitStream(sparkSys[0], seedData[0].spark, splineR, splineDR, t, SPARK_CFG, 'spark');
  emitStream(sparkSys[1], seedData[1].spark, splineB, splineDB, t, SPARK_CFG, 'spark');
  emitStream(shimmerSys[0], seedData[0].shimmer, splineR, splineDR, t, SHIM_CFG, 'shimmer');
  emitStream(shimmerSys[1], seedData[1].shimmer, splineB, splineDB, t, SHIM_CFG, 'shimmer');

  /* camera */
  lastShot = applyCamera(t, kinR, kinB);
  camDir.copy(camTgt).sub(camPos).normalize();
  camUpV.copy(camUp);

  /* travelling lights */
  const mid = kinR.pos.clone().add(kinB.pos).multiplyScalar(0.5);
  keySpot.position.set(mid.x - kinB.fwd.x * 13, mid.y + 17.5, mid.z - kinB.fwd.z * 13);
  keyTarget.position.copy(mid);
  carLightR.position.set(kinR.pos.x + kinR.fwd.x * 0.6, kinR.pos.y + 3.6, kinR.pos.z + kinR.fwd.z * 0.6);
  carLightB.position.set(kinB.pos.x + kinB.fwd.x * 0.6, kinB.pos.y + 3.6, kinB.pos.z + kinB.fwd.z * 0.6);

  renderer.render(scene, camera);
}

/* ------------------------------------------------------------------ *
 * 24. Playback state machine
 * ------------------------------------------------------------------ */
const DURATION = 40;
const elCountdown = document.getElementById('countdown');
const elScrub = document.getElementById('scrubber');
const btnToggle = document.getElementById('btn-toggle');
const btnRefire = document.getElementById('btn-refire');
const iconPause = document.getElementById('icon-pause');
const iconPlay = document.getElementById('icon-play');
const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

let simTime = 0;
let playbackSpeed = 1.0;
let state = 'COUNTDOWN';
let countdownElapsed = 0;
let holdElapsed = 0;
let lastNow = 0;
let haveNow = false;

function showCountdown(txt) {
  elCountdown.style.display = 'block';
  elCountdown.textContent = txt;
}
function hideCountdown() {
  elCountdown.style.display = 'none';
  elCountdown.textContent = '';
}
function setPlayingIcons(playing) {
  iconPause.style.display = playing ? 'block' : 'none';
  iconPlay.style.display = playing ? 'none' : 'block';
  btnToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
}

/* one-shot events, triggered only when forward playback crosses them */
const ONE_SHOTS = [
  { t: 0.5, fn: 'light' }, { t: 1.0, fn: 'light' }, { t: 1.5, fn: 'light' },
  { t: 2.0, fn: 'light' }, { t: 2.5, fn: 'light' },
  { t: 33.5, fn: 'drsOpen' },
  { t: 36.49, fn: 'drsClose' },
  { t: 36.49, fn: 'finish' }
];
const SHUTTER_TIMES = flashSprites.map(f => f.t).filter(t => t < 37.9).sort(function (a, b) { return a - b; });

function fireEvents(prev, now) {
  if (now <= prev) return;
  for (const e of ONE_SHOTS) {
    if (prev < e.t && now >= e.t) AudioSys.events[e.fn]();
  }
  for (const st of SHUTTER_TIMES) {
    if (prev < st && now >= st) AudioSys.events.shutter();
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!haveNow) { haveNow = true; lastNow = now; }
  const rawDt = (now - lastNow) / 1000;
  lastNow = now;
  const dt = Math.min(rawDt, 0.1);
  const prevSim = simTime;

  if (state === 'COUNTDOWN') {
    countdownElapsed += dt;
    if (countdownElapsed >= 3.0) {
      hideCountdown();
      state = 'PLAYING';
      setPlayingIcons(true);
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    } else {
      simTime = 0;
      /* the epsilon keeps the digit boundary aligned with the wall-clock
         second despite floating point accumulation of dt */
      showCountdown(String(3 - Math.floor(countdownElapsed + 1e-6)));
    }
  } else if (state === 'PLAYING') {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    if (simTime >= DURATION) {
      simTime = DURATION;
      state = 'ENDED';
      setPlayingIcons(false);
      AudioSys.setAudible(false);
    }
  } else if (state === 'REFIRE_HOLD') {
    holdElapsed += dt;
    if (holdElapsed >= 1.0) {
      state = 'PLAYING';
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    }
  }

  elScrub.value = simTime.toFixed(3);
  renderAt(simTime);

  if (state === 'PLAYING') {
    fireEvents(prevSim, simTime);
    const kinR = carRed.userData.kin, kinB = carBlue.userData.kin;
    AudioSys.update(simTime, state, lastShot, camPos, camDir, camUpV, kinR, kinB, splineR, splineB);
    AudioSys.setAudible(true);
  } else {
    AudioSys.setAudible(false);
  }
}

/* ------------------------------------------------------------------ *
 * 25. UI wiring
 * ------------------------------------------------------------------ */
btnToggle.addEventListener('click', function () {
  if (state === 'PLAYING') {
    state = 'PAUSED';
    setPlayingIcons(false);
  } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
    hideCountdown();
    countdownElapsed = 0; holdElapsed = 0;
    simTime = 0;
    elScrub.value = '0';
    state = 'PAUSED';
    setPlayingIcons(false);
    renderAt(0);
  } else if (state === 'PAUSED') {
    state = 'PLAYING';
    setPlayingIcons(true);
  } else if (state === 'ENDED') {
    simTime = 0;
    elScrub.value = '0';
    state = 'PLAYING';
    setPlayingIcons(true);
    renderAt(0);
  }
  AudioSys.setAudible(state === 'PLAYING');
});
btnRefire.addEventListener('click', function () {
  hideCountdown();
  countdownElapsed = 0; holdElapsed = 0;
  simTime = 0;
  elScrub.value = '0';
  state = 'REFIRE_HOLD';
  setPlayingIcons(true);
  renderAt(0);
  AudioSys.setAudible(false);
});
for (const p of pills) {
  p.addEventListener('click', function () {
    playbackSpeed = parseFloat(p.getAttribute('data-speed')) || 1.0;
    for (const q of pills) {
      const on = q === p;
      q.classList.toggle('is-active', on);
      q.setAttribute('aria-checked', on ? 'true' : 'false');
    }
  });
}
elScrub.addEventListener('input', function () {
  if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
    hideCountdown();
    countdownElapsed = 0; holdElapsed = 0;
  }
  const v = parseFloat(elScrub.value);
  simTime = isNaN(v) ? 0 : clamp(v, 0, DURATION);
  state = 'PAUSED';
  setPlayingIcons(false);
  renderAt(simTime);
  AudioSys.setAudible(false);
});
elScrub.addEventListener('pointerdown', function () {
  AudioSys.setAudible(false);
});

/* ------------------------------------------------------------------ *
 * 26. Boot
 * ------------------------------------------------------------------ */
AudioSys.init();
window.addEventListener('pointerdown', function () { AudioSys.resume(); }, { passive: true });
window.addEventListener('keydown', function () { AudioSys.resume(); }, { passive: true });
renderAt(0);
requestAnimationFrame(frame);

})();
</script>
</body>
