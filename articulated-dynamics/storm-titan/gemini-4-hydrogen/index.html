    const leftArmRes = poseLimbPair(torsoPos.clone().addScaledVector(localUp, 0.16).addScaledVector(localRight, -0.22), 'upperArmL', 'forearmL', 'handL', 0.28, 0.26, armAngL, elbowAngL);

    let slashBoost = 0;
    for (const s of STRIKES) {
      const dt = t - s.t;
      if (dt > -0.22 && dt < 0.22) {
        slashBoost = Math.sin(((dt + 0.22) / 0.44) * Math.PI) * 2.1;
      }
    }
    const armAngR = Math.sin(phase) * 0.85 * strideAmp - 0.35 + slashBoost;
    const elbowAngR = 0.55 - slashBoost * 0.2;
    const rightArmRes = poseLimbPair(torsoPos.clone().addScaledVector(localUp, 0.16).addScaledVector(localRight, 0.22), 'upperArmR', 'forearmR', 'handR', 0.28, 0.26, armAngR, elbowAngR);

    const cloakAnchor = torsoPos.clone().addScaledVector(localUp, 0.18).addScaledVector(localFwd, -0.16);
    const cloakFlutter = Math.sin(t * 14.0) * 0.18;
    const cloakQuat = rootQuat.clone().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, -0.55 - clamp(speed * 0.04, 0, 0.6) + cloakFlutter)));
    outStruct.parts.cloak.pos.copy(cloakAnchor);
    outStruct.parts.cloak.quat.copy(cloakQuat);

    outStruct.chestPos.copy(torsoPos);
    outStruct.launcherPos.copy(leftArmRes.endPos);
    outStruct.bladeTipPos.copy(rightArmRes.endPos).addScaledVector(localFwd, 0.85);
    outStruct.bladeVel.copy(vel).addScaledVector(localUp, -slashBoost * 8.0);
  }

  const RAGDOLL_START = 19.000;
  const RAGDOLL_END = 21.500;
  const RAGDOLL_STEPS = Math.round((RAGDOLL_END - RAGDOLL_START) / FIXED_DT);
  const ragdollStepsCache = new Array(RAGDOLL_STEPS + 1);
  let ragdollMaxSimulatedStep = -1;
  const ragdollRestCenter = new THREE.Vector3(-19.2, terrainHeight(-19.2, -9.6) + 1.0, -9.6);

  const RAGDOLL_STICKS = [
    [2, 1, 0.44], [1, 0, 0.38], [2, 0, 0.80],
    [1, 3, 0.22], [1, 6, 0.22], [3, 6, 0.42],
    [2, 3, 0.50], [2, 6, 0.50],
    [3, 4, 0.28], [4, 5, 0.26],
    [6, 7, 0.28], [7, 8, 0.26],
    [2, 9, 0.42], [9, 10, 0.42],
    [2, 11, 0.42], [11, 12, 0.42],
    [9, 11, 0.24]
  ];

  const ragdollCur = new Float32Array(COUNTS.ragdollPoints * 3);
  const ragdollPrev = new Float32Array(COUNTS.ragdollPoints * 3);
  const ragdollImpactTimes = [];

  function initRagdoll() {
    const startPose = createHunterPoseStruct();
    evaluateProceduralHunterPose(RAGDOLL_START, startPose);
    const p = startPose.parts;
    const pts = [
      p.head.pos,
      p.torso.pos,
      p.pelvis.pos,
      p.torso.pos.clone().add(new THREE.Vector3(0, 0.16, -0.21)),
      p.forearmL.pos.clone().add(new THREE.Vector3(0, 0.13, 0)),
      p.handL.pos,
      p.torso.pos.clone().add(new THREE.Vector3(0, 0.16, 0.21)),
      p.forearmR.pos.clone().add(new THREE.Vector3(0, 0.13, 0)),
      p.handR.pos,
      p.shinL.pos.clone().add(new THREE.Vector3(0, 0.21, 0)),
      p.footL.pos,
      p.shinR.pos.clone().add(new THREE.Vector3(0, 0.21, 0)),
      p.footR.pos
    ];
    const rRng = mulberry32(1900);
    for (let i = 0; i < COUNTS.ragdollPoints; i++) {
      const x = pts[i].x;
      const y = pts[i].y;
      const z = pts[i].z;
      ragdollCur[i * 3] = x;
      ragdollCur[i * 3 + 1] = y;
      ragdollCur[i * 3 + 2] = z;
      const spinX = (y - p.pelvis.pos.y) * 4.5 + (rRng() - 0.5) * 2.2;
      const spinY = -(x - p.pelvis.pos.x) * 3.0 + (rRng() - 0.5) * 1.5;
      const spinZ = (rRng() - 0.5) * 3.0;
      ragdollPrev[i * 3] = x - (-14.0 + spinX) * FIXED_DT;
      ragdollPrev[i * 3 + 1] = y - (9.0 + spinY) * FIXED_DT;
      ragdollPrev[i * 3 + 2] = z - (-6.0 + spinZ) * FIXED_DT;
    }
    ragdollStepsCache[0] = new Float32Array(ragdollCur);
    ragdollMaxSimulatedStep = 0;

    stepRagdollTo(RAGDOLL_STEPS);
    const endState = ragdollStepsCache[RAGDOLL_STEPS];
    ragdollRestCenter.set(
      endState[2 * 3],
      terrainHeight(endState[2 * 3], endState[2 * 3 + 2]) + 1.05,
      endState[2 * 3 + 2]
    );
  }

  function stepRagdollTo(targetStep) {
    const clamped = Math.min(RAGDOLL_STEPS, Math.max(0, targetStep));
    const gTerm = -9.81 * FIXED_DT * FIXED_DT;
    while (ragdollMaxSimulatedStep < clamped) {
      const nextStep = ragdollMaxSimulatedStep + 1;
      let hitThisStep = false;
      for (let i = 0; i < COUNTS.ragdollPoints; i++) {
        const b = i * 3;
        const x = ragdollCur[b], y = ragdollCur[b + 1], z = ragdollCur[b + 2];
        const vx = (x - ragdollPrev[b]) * 0.9988;
        const vy = (y - ragdollPrev[b + 1]) * 0.9988;
        const vz = (z - ragdollPrev[b + 2]) * 0.9988;
        ragdollPrev[b] = x;
        ragdollPrev[b + 1] = y;
        ragdollPrev[b + 2] = z;
        ragdollCur[b] = x + vx;
        ragdollCur[b + 1] = y + vy + gTerm;
        ragdollCur[b + 2] = z + vz;
      }

      for (let iter = 0; iter < 10; iter++) {
        for (let s = 0; s < RAGDOLL_STICKS.length; s++) {
          const [ia, ib, rest] = RAGDOLL_STICKS[s];
          const a = ia * 3, b = ib * 3;
          const dx = ragdollCur[b] - ragdollCur[a];
          const dy = ragdollCur[b + 1] - ragdollCur[a + 1];
          const dz = ragdollCur[b + 2] - ragdollCur[a + 2];
          const d = Math.hypot(dx, dy, dz);
          if (d > 1e-5) {
            if (s === RAGDOLL_STICKS.length - 1 && d >= rest) continue;
            const diff = (d - rest) / d * 0.5;
            ragdollCur[a] += dx * diff;
            ragdollCur[a + 1] += dy * diff;
            ragdollCur[a + 2] += dz * diff;
            ragdollCur[b] -= dx * diff;
            ragdollCur[b + 1] -= dy * diff;
            ragdollCur[b + 2] -= dz * diff;
          }
        }

        for (let i = 0; i < COUNTS.ragdollPoints; i++) {
          const b = i * 3;
          const gy = terrainHeight(ragdollCur[b], ragdollCur[b + 2]) + 0.12;
          if (ragdollCur[b + 1] < gy) {
            const vy = ragdollCur[b + 1] - ragdollPrev[b + 1];
            if (iter === 0 && vy < -0.008) hitThisStep = true;
            ragdollCur[b + 1] = gy;
            const vx = ragdollCur[b] - ragdollPrev[b];
            const vz = ragdollCur[b + 2] - ragdollPrev[b + 2];
            ragdollPrev[b] = ragdollCur[b] - vx * 0.88;
            ragdollPrev[b + 2] = ragdollCur[b + 2] - vz * 0.88;
            if (iter === 9 && vy < -0.002) {
              ragdollPrev[b + 1] = gy + vy * 0.25;
            }
          }
        }
      }

      if (hitThisStep) {
        const tHit = RAGDOLL_START + nextStep * FIXED_DT;
        if (ragdollImpactTimes.length === 0 || tHit - ragdollImpactTimes[ragdollImpactTimes.length - 1] > 0.16) {
          ragdollImpactTimes.push(tHit);
        }
      }

      ragdollStepsCache[nextStep] = new Float32Array(ragdollCur);
      ragdollMaxSimulatedStep = nextStep;
    }
  }

  function evaluateRagdollPoseAt(t, outStruct) {
    const fStep = clamp((t - RAGDOLL_START) / FIXED_DT, 0, RAGDOLL_STEPS);
    const s0 = Math.floor(fStep);
    const s1 = Math.min(RAGDOLL_STEPS, s0 + 1);
    const alpha = fStep - s0;
    const p0 = ragdollStepsCache[s0];
    const p1 = ragdollStepsCache[s1];

    const pts = [];
    for (let i = 0; i < COUNTS.ragdollPoints; i++) {
      const b = i * 3;
      pts.push(new THREE.Vector3(
        lerp(p0[b], p1[b], alpha),
        lerp(p0[b + 1], p1[b + 1], alpha),
        lerp(p0[b + 2], p1[b + 2], alpha)
      ));
    }

    const torsoSide = new THREE.Vector3().subVectors(pts[6], pts[3]).normalize();
    function segPose(name, a, b) {
      outStruct.parts[name].pos.lerpVectors(a, b, 0.5);
      quatFromSegment(a, b, torsoSide, outStruct.parts[name].quat);
    }

    segPose('pelvis', pts[2], pts[1]);
    outStruct.parts.pelvis.pos.copy(pts[2]);
    segPose('torso', pts[2], pts[1]);
    segPose('head', pts[1], pts[0]);
    outStruct.parts.head.pos.copy(pts[0]);

    segPose('upperArmL', pts[3], pts[4]);
    segPose('forearmL', pts[4], pts[5]);
    outStruct.parts.handL.pos.copy(pts[5]);
    outStruct.parts.handL.quat.copy(outStruct.parts.forearmL.quat);

    segPose('upperArmR', pts[6], pts[7]);
    segPose('forearmR', pts[7], pts[8]);
    outStruct.parts.handR.pos.copy(pts[8]);
    outStruct.parts.handR.quat.copy(outStruct.parts.forearmR.quat);

    segPose('thighL', pts[2], pts[9]);
    segPose('shinL', pts[9], pts[10]);
    outStruct.parts.footL.pos.copy(pts[10]);
    outStruct.parts.footL.quat.copy(outStruct.parts.shinL.quat);

    segPose('thighR', pts[2], pts[11]);
    segPose('shinR', pts[11], pts[12]);
    outStruct.parts.footR.pos.copy(pts[12]);
    outStruct.parts.footR.quat.copy(outStruct.parts.shinR.quat);

    outStruct.parts.cloak.pos.copy(pts[1]);
    outStruct.parts.cloak.quat.copy(outStruct.parts.torso.quat);

    outStruct.chestPos.copy(pts[1]);
    outStruct.launcherPos.copy(pts[5]);
    outStruct.bladeTipPos.copy(pts[8]);
    outStruct.bladeVel.set(-5, 0, -2);
  }

  initRagdoll();

  const hunterPose = createHunterPoseStruct();
  const hunterBlendA = createHunterPoseStruct();
  const hunterBlendB = createHunterPoseStruct();

  function evaluateHunterPose(t, outStruct) {
    if (t >= RAGDOLL_START && t <= RAGDOLL_END) {
      evaluateRagdollPoseAt(t, outStruct);
    } else if (t > RAGDOLL_END && t < 22.500) {
      const alpha = smoothstep(RAGDOLL_END, 22.500, t);
      evaluateRagdollPoseAt(RAGDOLL_END, hunterBlendA);
      evaluateProceduralHunterPose(t, hunterBlendB);
      for (const name of HUNTER_PART_NAMES) {
        outStruct.parts[name].pos.lerpVectors(hunterBlendA.parts[name].pos, hunterBlendB.parts[name].pos, alpha);
        outStruct.parts[name].quat.copy(hunterBlendA.parts[name].quat).slerp(hunterBlendB.parts[name].quat, alpha);
      }
      outStruct.chestPos.lerpVectors(hunterBlendA.chestPos, hunterBlendB.chestPos, alpha);
      outStruct.launcherPos.lerpVectors(hunterBlendA.launcherPos, hunterBlendB.launcherPos, alpha);
      outStruct.bladeTipPos.lerpVectors(hunterBlendA.bladeTipPos, hunterBlendB.bladeTipPos, alpha);
      outStruct.bladeVel.copy(hunterBlendB.bladeVel);
    } else {
      evaluateProceduralHunterPose(t, outStruct);
    }
  }

  // =========================================================================
  // 8. VERLET TETHERS (3 ROPES x 32 POINTS AT 1/240 s WITH CAPSULE COLLISION)
  // =========================================================================
  const TETHER_SPECS = [
    { tFire: 3.000, tAttach: 3.300, tRelease: 5.600, tEnd: 6.200, boneName: 'shinL', localOffset: new THREE.Vector3(0, 0.8, 0) },
    { tFire: 9.000, tAttach: 9.300, tRelease: 12.400, tEnd: 13.000, boneName: 'forearmR', localOffset: new THREE.Vector3(0, -1.0, 0) },
    { tFire: 23.500, tAttach: 23.800, tRelease: 31.500, tEnd: 32.100, boneName: 'chest', localOffset: new THREE.Vector3(-2.3, 2.2, 0) }
  ];

  const tetherMeshes = TETHER_SPECS.map((spec) => {
    const N = COUNTS.ropePoints;
    const sides = 5;
    const geo = new THREE.BufferGeometry();
    const verts = new Float32Array(N * sides * 3);
    const idxs = [];
    for (let i = 0; i < N - 1; i++) {
      for (let s = 0; s < sides; s++) {
        const a = i * sides + s;
        const b = i * sides + (s + 1) % sides;
        const c = (i + 1) * sides + s;
        const d = (i + 1) * sides + (s + 1) % sides;
        idxs.push(a, c, b, b, c, d);
      }
    }
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.setIndex(idxs);
    const mat = new THREE.MeshBasicMaterial({ color: 0x99ecff, toneMapped: false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    mesh.frustumCulled = false;
    scene.add(mesh);

    const totalSteps = Math.round((spec.tEnd - spec.tFire) / FIXED_DT);
    return {
      spec,
      mesh,
      geo,
      verts,
      totalSteps,
      cache: new Array(totalSteps + 1),
      maxStep: -1,
      cur: new Float32Array(N * 3),
      prev: new Float32Array(N * 3),
      constLen: 14.0
    };
  });

  function closestPointOnSegment(p, a, b, out) {
    const abx = b.x - a.x, aby = b.y - a.y, abz = b.z - a.z;
    const lenSq = abx * abx + aby * aby + abz * abz;
    if (lenSq < 1e-8) return out.copy(a);
    const t = clamp(((p.x - a.x) * abx + (p.y - a.y) * aby + (p.z - a.z) * abz) / lenSq, 0, 1);
    return out.set(a.x + abx * t, a.y + aby * t, a.z + abz * t);
  }

  const ropePoseT = createPoseState();
  const ropePoseH = createHunterPoseStruct();

  function stepTetherTo(tm, targetStep) {
    const clamped = Math.min(tm.totalSteps, Math.max(0, targetStep));
    const N = COUNTS.ropePoints;
    const spec = tm.spec;

    if (tm.maxStep < 0) {
      evaluateHunterPose(spec.tFire, ropePoseH);
      const p0 = ropePoseH.launcherPos;
      for (let i = 0; i < N; i++) {
        tm.cur[i * 3] = p0.x;
        tm.cur[i * 3 + 1] = p0.y;
        tm.cur[i * 3 + 2] = p0.z;
        tm.prev[i * 3] = p0.x;
        tm.prev[i * 3 + 1] = p0.y;
        tm.prev[i * 3 + 2] = p0.z;
      }
      tm.cache[0] = new Float32Array(tm.cur);
      tm.maxStep = 0;
    }

    const boneIdx = BONE_INDEX[spec.boneName];
    const capsuleBones = [BONE_INDEX.shinL, BONE_INDEX.thighL, BONE_INDEX.forearmR, BONE_INDEX.upperArmR, BONE_INDEX.chest, BONE_INDEX.pelvis];
    const tmpP = new THREE.Vector3();
    const tmpC = new THREE.Vector3();

    while (tm.maxStep < clamped) {
      const nextStep = tm.maxStep + 1;
      const t = spec.tFire + nextStep * FIXED_DT;
      evaluateTitanPose(t, ropePoseT);
      evaluateHunterPose(t, ropePoseH);

      const launcher = ropePoseH.launcherPos;
      const bone = ropePoseT.bones[boneIdx];
      const anchor = spec.localOffset.clone().applyQuaternion(bone.quat).add(bone.center);

      const directDist = launcher.distanceTo(anchor);
      let segLen;
      const isFlying = t < spec.tAttach;
      const isAttached = t >= spec.tAttach && t < spec.tRelease;

      if (isFlying) {
        const u = (t - spec.tFire) / (spec.tAttach - spec.tFire);
        segLen = Math.max(0.05, (directDist * u) / (N - 1));
      } else if (isAttached) {
        if (spec.boneName === 'shinL' && t >= 3.3 && t <= 5.0) {
          const distNow = launcher.distanceTo(anchor);
          const wrapBonus = smoothstep(3.3, 5.0, t) * 11.2;
          segLen = Math.max(0.15, (distNow + wrapBonus) / (N - 1));
        } else {
          segLen = Math.max(0.10, (directDist * 1.02) / (N - 1));
        }
      } else {
        segLen = Math.max(0.15, tm.constLen / (N - 1));
      }
      if (isAttached) tm.constLen = segLen * (N - 1);

      const gx = 16.0 * FIXED_DT * FIXED_DT;
      const gy = -9.81 * FIXED_DT * FIXED_DT;
      for (let i = 1; i < N - 1; i++) {
        const b = i * 3;
        const x = tm.cur[b], y = tm.cur[b + 1], z = tm.cur[b + 2];
        const vx = (x - tm.prev[b]) * 0.996;
        const vy = (y - tm.prev[b + 1]) * 0.996;
        const vz = (z - tm.prev[b + 2]) * 0.996;
        tm.prev[b] = x;
        tm.prev[b + 1] = y;
        tm.prev[b + 2] = z;
        tm.cur[b] = x + vx + gx;
        tm.cur[b + 1] = y + vy + gy;
        tm.cur[b + 2] = z + vz;
      }

      if (!isFlying && !isAttached) {
        const b = (N - 1) * 3;
        const x = tm.cur[b], y = tm.cur[b + 1], z = tm.cur[b + 2];
        const vx = (x - tm.prev[b]) * 0.992;
        const vy = (y - tm.prev[b + 1]) * 0.992;
        const vz = (z - tm.prev[b + 2]) * 0.992;
        tm.prev[b] = x; tm.prev[b + 1] = y; tm.prev[b + 2] = z;
        tm.cur[b] = x + vx + gx; tm.cur[b + 1] = y + vy + gy; tm.cur[b + 2] = z + vz;
      }

      for (let iter = 0; iter < 8; iter++) {
        tm.cur[0] = launcher.x; tm.cur[1] = launcher.y; tm.cur[2] = launcher.z;
        if (isFlying) {
          const u = (t - spec.tFire) / (spec.tAttach - spec.tFire);
          const tip = tmpP.lerpVectors(launcher, anchor, u);
          tm.cur[(N - 1) * 3] = tip.x; tm.cur[(N - 1) * 3 + 1] = tip.y; tm.cur[(N - 1) * 3 + 2] = tip.z;
        } else if (isAttached) {
          tm.cur[(N - 1) * 3] = anchor.x; tm.cur[(N - 1) * 3 + 1] = anchor.y; tm.cur[(N - 1) * 3 + 2] = anchor.z;
        }

        for (let i = 0; i < N - 1; i++) {
          const a = i * 3, b = (i + 1) * 3;
          const dx = tm.cur[b] - tm.cur[a];
          const dy = tm.cur[b + 1] - tm.cur[a + 1];
          const dz = tm.cur[b + 2] - tm.cur[a + 2];
          const d = Math.hypot(dx, dy, dz);
          if (d > 1e-5) {
            const diff = (d - segLen) / d;
            const wA = i === 0 ? 0 : 0.5;
            const wB = (i + 1 === N - 1 && (isFlying || isAttached)) ? 0 : (i === 0 ? 1.0 : 0.5);
            if (wA + wB > 0) {
              tm.cur[a] += dx * diff * wA;
              tm.cur[a + 1] += dy * diff * wA;
              tm.cur[a + 2] += dz * diff * wA;
              tm.cur[b] -= dx * diff * wB;
              tm.cur[b + 1] -= dy * diff * wB;
              tm.cur[b + 2] -= dz * diff * wB;
            }
          }
        }

        for (let i = 1; i < N - 1; i++) {
          const idx = i * 3;
          tmpP.set(tm.cur[idx], tm.cur[idx + 1], tm.cur[idx + 2]);
          for (let cb = 0; cb < capsuleBones.length; cb++) {
            const bn = ropePoseT.bones[capsuleBones[cb]];
            if (bn.charge <= 0 && t > 30.0) continue;
            closestPointOnSegment(tmpP, bn.start, bn.end, tmpC);
            const dist = tmpP.distanceTo(tmpC);
            const rad = bn.radius * 0.92;
            if (dist < rad) {
              if (dist > 1e-4) {
                tmpP.sub(tmpC).multiplyScalar(rad / dist).add(tmpC);
              } else {
                tmpP.y += rad;
              }
            }
          }
          const gy = terrainHeight(tmpP.x, tmpP.z) + 0.05;
          if (tmpP.y < gy) tmpP.y = gy;
          tm.cur[idx] = tmpP.x; tm.cur[idx + 1] = tmpP.y; tm.cur[idx + 2] = tmpP.z;
        }
      }

      tm.cache[nextStep] = new Float32Array(tm.cur);
      tm.maxStep = nextStep;
    }
  }

  function updateTetherMeshes(motionTime) {
    const N = COUNTS.ropePoints;
    const sides = 5;
    const r = 0.042;
    const p = new THREE.Vector3();
    const tang = new THREE.Vector3();
    const nrm = new THREE.Vector3();
    const binrm = new THREE.Vector3();

    for (let m = 0; m < tetherMeshes.length; m++) {
      const tm = tetherMeshes[m];
      const spec = tm.spec;
      if (motionTime < spec.tFire || motionTime >= spec.tEnd) {
        tm.mesh.visible = false;
        continue;
      }
      tm.mesh.visible = true;
      const fStep = clamp((motionTime - spec.tFire) / FIXED_DT, 0, tm.totalSteps);
      const s0 = Math.floor(fStep);
      const s1 = Math.min(tm.totalSteps, s0 + 1);
      stepTetherTo(tm, s1);
      const a0 = tm.cache[s0];
      const a1 = tm.cache[s1];
      const alpha = fStep - s0;

      for (let i = 0; i < N; i++) {
        const b = i * 3;
        p.set(lerp(a0[b], a1[b], alpha), lerp(a0[b + 1], a1[b + 1], alpha), lerp(a0[b + 2], a1[b + 2], alpha));
        const iPrev = Math.max(0, i - 1) * 3;
        const iNext = Math.min(N - 1, i + 1) * 3;
        tang.set(
          lerp(a0[iNext], a1[iNext], alpha) - lerp(a0[iPrev], a1[iPrev], alpha),
          lerp(a0[iNext + 1], a1[iNext + 1], alpha) - lerp(a0[iPrev + 1], a1[iPrev + 1], alpha),
          lerp(a0[iNext + 2], a1[iNext + 2], alpha) - lerp(a0[iPrev + 2], a1[iPrev + 2], alpha)
        );
        if (tang.lengthSq() < 1e-6) tang.set(1, 0, 0);
        tang.normalize();
        nrm.set(0, 1, 0).cross(tang);
        if (nrm.lengthSq() < 1e-4) nrm.set(1, 0, 0).cross(tang);
        nrm.normalize();
        binrm.crossVectors(tang, nrm).normalize();

        for (let s = 0; s < sides; s++) {
          const ang = (s / sides) * Math.PI * 2;
          const vIdx = (i * sides + s) * 3;
          tm.verts[vIdx] = p.x + (nrm.x * Math.cos(ang) + binrm.x * Math.sin(ang)) * r;
          tm.verts[vIdx + 1] = p.y + (nrm.y * Math.cos(ang) + binrm.y * Math.sin(ang)) * r;
          tm.verts[vIdx + 2] = p.z + (nrm.z * Math.cos(ang) + binrm.z * Math.sin(ang)) * r;
        }
      }
      tm.geo.attributes.position.needsUpdate = true;
    }
  }

  // =========================================================================
  // 9. STRIKE SPARKS (80 PER STRIKE), SLAM CLODS & COLLAPSE DUST PUFFS
  // =========================================================================
  const SPARKS_PER_STRIKE = 80;
  const TOTAL_SPARKS = STRIKES.length * SPARKS_PER_STRIKE;
  const sparkData = [];
  const sparkPoseH = createHunterPoseStruct();

  (function initSparks() {
    const spRng = mulberry32(5511);
    for (let si = 0; si < STRIKES.length; si++) {
      const s = STRIKES[si];
      evaluateHunterPose(s.t, sparkPoseH);
      const origin = sparkPoseH.bladeTipPos.clone();
      const baseDir = sparkPoseH.bladeVel.clone();
      if (baseDir.lengthSq() < 0.2) baseDir.set(1, 0.5, 0);
      baseDir.normalize();

      for (let k = 0; k < SPARKS_PER_STRIKE; k++) {
        const dir = baseDir.clone().add(new THREE.Vector3(
          (spRng() - 0.5) * 1.15,
          (spRng() - 0.3) * 1.05 + 0.2,
          (spRng() - 0.5) * 1.15
        )).normalize();
        const speed = lerp(12, 34, spRng());
        sparkData.push({
          tStart: s.t,
          origin,
          vel: dir.multiplyScalar(speed),
          life: lerp(0.45, 0.78, spRng())
        });
      }
    }
  })();

  const sparkGeo = new THREE.BoxGeometry(0.06, 0.06, 0.52);
  const sparkMat = new THREE.MeshBasicMaterial({ color: 0xffd27d, toneMapped: false });
  const sparkInst = new THREE.InstancedMesh(sparkGeo, sparkMat, TOTAL_SPARKS);
  sparkInst.frustumCulled = false;
  scene.add(sparkInst);

  const CLOD_COUNT = 130;
  const clods = [];
  (function initClods() {
    const cRng = mulberry32(7500);
    for (let i = 0; i < CLOD_COUNT; i++) {
      const ang = cRng() * Math.PI * 2;
      const rad = lerp(0.8, 3.8, cRng());
      const vHoriz = lerp(6, 22, cRng());
      const vUp = lerp(7, 19, cRng());
      clods.push({
        origin: new THREE.Vector3(SLAM_TARGET.x + Math.cos(ang) * rad, SLAM_TARGET.y + 0.2, SLAM_TARGET.z + Math.sin(ang) * rad),
        vel: new THREE.Vector3(Math.cos(ang) * vHoriz, vUp, Math.sin(ang) * vHoriz),
        scale: lerp(0.18, 0.55, cRng()),
        isGrass: i % 3 === 0,
        spin: new THREE.Vector3(cRng() * 8, cRng() * 8, cRng() * 8)
      });
    }
  })();
  const clodGeo = new THREE.DodecahedronGeometry(0.5, 0);
  const clodMat = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0.02, color: 0xffffff });
  const clodInst = new THREE.InstancedMesh(clodGeo, clodMat, CLOD_COUNT);
  for (let i = 0; i < CLOD_COUNT; i++) {
    clodInst.setColorAt(i, new THREE.Color(clods[i].isGrass ? 0x2f5425 : 0x241d17));
  }
  clodInst.instanceColor.needsUpdate = true;
  clodInst.frustumCulled = false;
  scene.add(clodInst);

  const dustTex = createSoftParticleTexture();
  const dustGroup = new THREE.Group();
  scene.add(dustGroup);
  const dustSprites = [];
  for (let i = 0; i < BOULDER_LAND_SLOTS; i++) {
    const mat = new THREE.SpriteMaterial({
      map: dustTex,
      color: 0x3b4554,
      transparent: true,
      opacity: 0,
      depthWrite: false
    });
    const sp = new THREE.Sprite(mat);
    sp.visible = false;
    dustGroup.add(sp);
    dustSprites.push({ sp, mat, landVec: boulderLandUniformArray[i] });
  }

  // =========================================================================
  // 10. CAMERA SYSTEM (EXACT 7-SHOT SCHEDULE + RULE OF THIRDS + TRAUMA SHAKE)
  // =========================================================================
  const camSmoothedPoseH = createHunterPoseStruct();

  function getSmoothedH(simTime) {
    const out = new THREE.Vector3();
    for (let k = 0; k < 8; k++) {
      const tk = Math.max(0, simTime - k * 0.05);
      const mk = getMotionTime(tk);
      evaluateHunterPose(mk, camSmoothedPoseH);
      out.add(camSmoothedPoseH.chestPos);
    }
    return out.multiplyScalar(1 / 8);
  }

  function composeThirdsFrame(camPos, pLL, pUR, pTop, baseFov, aspect) {
    const d1 = new THREE.Vector3().subVectors(pLL, camPos).normalize();
    const d2 = new THREE.Vector3().subVectors(pUR, camPos).normalize();
    const fwd = new THREE.Vector3().addVectors(d1, d2).normalize();
    const right = new THREE.Vector3().crossVectors(fwd, _upY).normalize();
    const up = new THREE.Vector3().crossVectors(right, fwd).normalize();

    const pts = pTop ? [pLL, pUR, pTop] : [pLL, pUR];
    let minY = 99, maxY = -99;
    for (let i = 0; i < pts.length; i++) {
      const dp = new THREE.Vector3().subVectors(pts[i], camPos).normalize();
      const ya = dp.dot(up);
      if (ya < minY) minY = ya;
      if (ya > maxY) maxY = ya;
    }
    const yMid = 0.5 * (minY + maxY);
    fwd.addScaledVector(up, yMid * 0.85).normalize();
    right.crossVectors(fwd, _upY).normalize();
    up.crossVectors(right, fwd).normalize();

    let reqTanY = Math.tan(THREE.MathUtils.degToRad(baseFov) * 0.5);
    for (let i = 0; i < pts.length; i++) {
      const d = new THREE.Vector3().subVectors(pts[i], camPos);
      const z = d.dot(fwd);
      if (z > 0.2) {
        reqTanY = Math.max(reqTanY, Math.abs(d.dot(up)) / (z * 0.86), Math.abs(d.dot(right)) / (z * 0.86 * aspect));
      }
    }
    const finalFov = Math.min(92.0, THREE.MathUtils.radToDeg(2 * Math.atan(reqTanY)));
    return { lookAt: camPos.clone().addScaledVector(fwd, 30.0), fov: finalFov };
  }

  function updateCamera(simTime, motionTime, poseT, poseH) {
    const H = poseH.chestPos.clone();
    const Hs = getSmoothedH(simTime);
    const TC = poseT.bones[BONE_INDEX.chest].center.clone();
    const MID = new THREE.Vector3().addVectors(H, TC).multiplyScalar(0.5);

    const hPrev = getHunterTrajectoryPos(Math.max(0, motionTime - 0.02), new THREE.Vector3());
    const hNext = getHunterTrajectoryPos(Math.min(DURATION, motionTime + 0.02), new THREE.Vector3());
    const vH = hNext.distanceTo(hPrev) / 0.04;

    const aspect = camera.aspect;
    const camPos = new THREE.Vector3();
    let lookAt = new THREE.Vector3();
    let fov = 40;

    if (simTime < 3.0) {
      camPos.set(-70, 6, 50);
      lookAt.copy(MID);
      fov = 40;
    } else if (simTime < 9.0) {
      const dirHoriz = new THREE.Vector3(Hs.x - TC.x, 0, Hs.z - TC.z);
      if (dirHoriz.lengthSq() < 1e-4) dirHoriz.set(-1, 0, 0);
      dirHoriz.normalize();
      camPos.copy(Hs).addScaledVector(dirHoriz, 9.0).add(new THREE.Vector3(0, 3, 0));
      fov = 55 + Math.min(12, 0.4 * vH);
      const targetW1 = poseT.weakPoints[0];
      const urTarget = simTime < 5.3 ? targetW1 : TC;
      const composed = composeThirdsFrame(camPos, H, urTarget, TC, fov, aspect);
      lookAt.copy(composed.lookAt);
      fov = composed.fov;
    } else if (simTime < 16.0) {
      const angRad = THREE.MathUtils.degToRad(200 + 6 * (simTime - 9));
      const pg = poseT.pelvisGround;
      camPos.set(pg.x + 55 * Math.cos(angRad), 12, pg.z + 55 * Math.sin(angRad));
      lookAt.copy(TC).multiplyScalar(0.6).addScaledVector(Hs, 0.4);
      fov = 45;
    } else if (simTime < 22.5) {
      camPos.set(-14, 1.5, -46);
      lookAt.copy(MID);
      fov = 42;
    } else if (simTime < 29.5) {
      const velDir = new THREE.Vector3().subVectors(hNext, hPrev);
      if (velDir.lengthSq() < 1e-4) velDir.subVectors(poseT.weakPoints[2], H);
      velDir.normalize();
      if (simTime >= 27.0) {
        velDir.set(Math.max(0.25, velDir.x), velDir.y * 0.3, velDir.z).normalize();
      }
      camPos.copy(Hs).addScaledVector(velDir, -6.0).add(new THREE.Vector3(0, 2, 0));
      fov = 60 + Math.min(12, 0.4 * vH);
      const W3 = poseT.weakPoints[2];
      const composed = composeThirdsFrame(camPos, H, W3, TC, fov, aspect);
      lookAt.copy(composed.lookAt);
      fov = composed.fov;
    } else if (simTime < 36.0) {
      camPos.set(-74, 25, -60);
      lookAt.set(16, 14, 0);
      fov = 38;
    } else {
      const dt = simTime - 36.0;
      camPos.copy(H).add(new THREE.Vector3(-8 - 2 * dt, 2 + 0.5 * dt, 6));
      lookAt.copy(H).add(new THREE.Vector3(0, 1, 0));
      fov = 35;
    }

    if (aspect < 1.25) {
      fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fov) * 0.5) * (1.42 / aspect)));
    }

    const trauma = getTrauma(simTime);
    const tSq = trauma * trauma;
    const nx = smoothNoise1D(simTime * 17.0, 11);
    const ny = smoothNoise1D(simTime * 17.0, 23);
    const nz = smoothNoise1D(simTime * 17.0, 37);
    const rx = smoothNoise1D(simTime * 19.0, 41);
    const ry = smoothNoise1D(simTime * 19.0, 53);
    const rz = smoothNoise1D(simTime * 19.0, 67);

    camera.fov = fov;
    camera.updateProjectionMatrix();
    camera.position.copy(camPos);
    camera.lookAt(lookAt);

    if (tSq > 1e-5) {
      camera.translateX(nx * 0.6 * tSq);
      camera.translateY(ny * 0.6 * tSq);
      camera.translateZ(nz * 0.35 * tSq);
      const maxRot = THREE.MathUtils.degToRad(2.5) * tSq;
      camera.rotateX(rx * maxRot);
      camera.rotateY(ry * maxRot);
      camera.rotateZ(rz * maxRot);
    }
    camera.updateMatrixWorld();

    postMaterial.uniforms.uTraumaSq.value = tSq;
  }

  // =========================================================================
  // 11. WORLD-ANCHORED ORTHOGRAPHIC HUD PASS (INSIDE #stage, WORDLESS)
  // =========================================================================
  const hudScene = new THREE.Scene();
  const hudCamera = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);
  const glyphAtlas = createGlyphAtlas();

  function makeHudQuad(colorHex, opacity = 1.0) {
    const geo = new THREE.PlaneGeometry(1, 1);
    const col = new THREE.Color(colorHex).convertSRGBToLinear();
    const mat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity, depthTest: false, depthWrite: false, toneMapped: false });
    const mesh = new THREE.Mesh(geo, mat);
    hudScene.add(mesh);
    return { mesh, mat, col };
  }

  const hpBg = makeHudQuad(0x0b0e14, 0.78);
  const hpBorder = makeHudQuad(0x6c7c96, 0.55);
  const hpTrail = makeHudQuad(0xffd9a0, 0.85);
  const hpFill = makeHudQuad(0xd93832, 0.95);

  const stagBg = makeHudQuad(0x0b0e14, 0.78);
  const stagFill = makeHudQuad(0xe8a828, 0.95);

  const wpBrackets = [0, 1, 2].map(() => {
    const segs = [];
    for (let k = 0; k < 8; k++) segs.push(makeHudQuad(0xffb833, 0.9));
    return segs;
  });

  const arrowGeo = new THREE.BufferGeometry();
  arrowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, 11, 0,
    -8, -9, 0,
    8, -9, 0
  ]), 3));
  const arrowMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0xff5a36).convertSRGBToLinear(),
    transparent: true,
    opacity: 0.95,
    depthTest: false,
    depthWrite: false,
    toneMapped: false
  });
  const arrowMesh = new THREE.Mesh(arrowGeo, arrowMat);
  arrowMesh.visible = false;
  hudScene.add(arrowMesh);

  const dmgNumbers = STRIKES.map((s) => {
    const str = String(s.dmg);
    const digits = [];
    for (let i = 0; i < str.length; i++) {
      const ch = parseInt(str[i], 10);
      const geo = new THREE.PlaneGeometry(24, 30);
      const u0 = ch / 10;
      const u1 = (ch + 1) / 10;
      const uvs = geo.attributes.uv;
      uvs.setXY(0, u0, 1);
      uvs.setXY(1, u1, 1);
      uvs.setXY(2, u0, 0);
      uvs.setXY(3, u1, 0);
      const mat = new THREE.MeshBasicMaterial({
        map: glyphAtlas,
        transparent: true,
        opacity: 0,
        depthTest: false,
        depthWrite: false,
        toneMapped: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.visible = false;
      hudScene.add(mesh);
      digits.push({ mesh, mat });
    }
    return { strike: s, digits };
  });

  const hudProjVec = new THREE.Vector3();

  function projectToScreen(worldPos, w, h) {
    const viewZ = hudProjVec.copy(worldPos).applyMatrix4(camera.matrixWorldInverse).z;
    const behind = viewZ > -0.05;
    hudProjVec.copy(worldPos).project(camera);
    let sx = (hudProjVec.x * 0.5 + 0.5) * w;
    let sy = (hudProjVec.y * 0.5 + 0.5) * h;
    if (behind) {
      sx = w - sx;
      sy = h - sy;
    }
    return { sx, sy, behind, dist: Math.max(1, -viewZ) };
  }

  function updateHUD(simTime, poseT) {
    const w = window.innerWidth;
    const h = window.innerHeight;
    hudCamera.right = w;
    hudCamera.top = h;
    hudCamera.updateProjectionMatrix();

    let hp = BOSS_MAX_HP;
    let trailHp = BOSS_MAX_HP;
    let stagger = 0;
    let lastStrikeTime = -99;

    for (let i = 0; i < STRIKES.length; i++) {
      const s = STRIKES[i];
      if (simTime >= s.t) {
        const preHp = hp;
        hp = Math.max(0, hp - s.dmg);
        const dt = simTime - s.t;
        trailHp = dt < 0.600 ? lerp(preHp, hp, dt / 0.600) : hp;
        stagger = s.stagAfter;
        lastStrikeTime = s.t;
      }
    }

    let stagPulse = 0;
    if (simTime >= 12.000 && simTime < 16.000) {
      stagger = simTime >= 15.000 ? lerp(100, 0, (simTime - 15.000) / 1.000) : 100;
      stagPulse = 0.5 + 0.5 * Math.sin(simTime * 18.0);
    }

    const barW = Math.min(500, w * 0.44);
    const barH = 10;
    const barY = h - Math.max(28, h * 0.045);
    const cx = w * 0.5;

    function placeBar(item, x, y, bw, bh, z) {
      item.mesh.position.set(x, y, z);
      item.mesh.scale.set(Math.max(0.001, bw), bh, 1);
    }

    placeBar(hpBorder, cx, barY, barW + 4, barH + 4, 0);
    placeBar(hpBg, cx, barY, barW, barH, 1);
    const trailW = barW * (trailHp / BOSS_MAX_HP);
    placeBar(hpTrail, cx - (barW - trailW) * 0.5, barY, trailW, barH, 2);
    hpTrail.mesh.visible = trailW > 0.5;
    const fillW = barW * (hp / BOSS_MAX_HP);
    placeBar(hpFill, cx - (barW - fillW) * 0.5, barY, fillW, barH, 3);
    hpFill.mesh.visible = fillW > 0.5;
    const strikeFlash = (simTime - lastStrikeTime >= 0 && simTime - lastStrikeTime < 0.14) ? 1 : 0;
    hpFill.mat.color.setHex(strikeFlash ? 0xffffff : 0xd93832).convertSRGBToLinear();

    const stagH = 5;
    const stagY = barY - 13;
    placeBar(stagBg, cx, stagY, barW, stagH, 1);
    const stagW = barW * (stagger / 100);
    placeBar(stagFill, cx - (barW - stagW) * 0.5, stagY, stagW, stagH, 2);
    stagFill.mesh.visible = stagW > 0.5;
    stagFill.mat.color.setHex(stagPulse > 0.5 ? 0xfff0aa : 0xe8a828).convertSRGBToLinear();

    const currentTargetWp = simTime < 5.0 ? 0 : (simTime < 12.0 ? 1 : (simTime >= 25.0 && simTime < 29.5 ? 2 : -1));
    const wpVisible = [
      simTime < 5.000,
      simTime < 12.000,
      simTime >= 25.000 && simTime < 29.500
    ];

    for (let i = 0; i < 3; i++) {
      const segs = wpBrackets[i];
      if (!wpVisible[i]) {
        for (let k = 0; k < 8; k++) segs[k].mesh.visible = false;
        continue;
      }
      const proj = projectToScreen(poseT.weakPoints[i], w, h);
      const onScreen = !proj.behind && proj.sx > 12 && proj.sx < w - 12 && proj.sy > 94 && proj.sy < h - 12;
      if (!onScreen) {
        for (let k = 0; k < 8; k++) segs[k].mesh.visible = false;
        continue;
      }
      const isTarget = i === currentTargetWp;
      const rad = clamp(920 / proj.dist, 16, 52);
      const arm = Math.max(6, rad * 0.36);
      const thick = isTarget ? 2.6 : 1.7;
      const colHex = isTarget ? 0xffe488 : 0xd98022;
      const alpha = isTarget ? 0.96 : 0.45;

      const corners = [[-1, 1], [1, 1], [-1, -1], [1, -1]];
      for (let c = 0; c < 4; c++) {
        const [sxSign, sySign] = corners[c];
        const cornerX = proj.sx + sxSign * rad;
        const cornerY = proj.sy + sySign * rad;
        const hSeg = segs[c * 2];
        const vSeg = segs[c * 2 + 1];
        hSeg.mesh.visible = true;
        vSeg.mesh.visible = true;
        hSeg.mat.color.setHex(colHex).convertSRGBToLinear();
        vSeg.mat.color.setHex(colHex).convertSRGBToLinear();
        hSeg.mat.opacity = alpha;
        vSeg.mat.opacity = alpha;
        hSeg.mesh.position.set(cornerX - sxSign * arm * 0.5, cornerY, 4);
        hSeg.mesh.scale.set(arm, thick, 1);
        vSeg.mesh.position.set(cornerX, cornerY - sySign * arm * 0.5, 4);
        vSeg.mesh.scale.set(thick, arm, 1);
      }
    }

    let threatPt = null;
    let isAttackThreat = false;
    if (simTime >= 6.000 && simTime < 7.500) {
      const pFistR = projectToScreen(poseT.bones[BONE_INDEX.fistR].center, w, h);
      if (pFistR.behind || pFistR.sx < 16 || pFistR.sx > w - 16 || pFistR.sy < 96 || pFistR.sy > h - 16) {
        threatPt = pFistR;
        isAttackThreat = true;
      }
    } else if (simTime >= 17.000 && simTime < 19.300) {
      const pFistL = projectToScreen(poseT.bones[BONE_INDEX.fistL].center, w, h);
      if (pFistL.behind || pFistL.sx < 16 || pFistL.sx > w - 16 || pFistL.sy < 96 || pFistL.sy > h - 16) {
        threatPt = pFistL;
        isAttackThreat = true;
      }
    }
    if (!threatPt && simTime < 30.800) {
      const pChest = projectToScreen(poseT.bones[BONE_INDEX.chest].center, w, h);
      if (pChest.behind || pChest.sx < 12 || pChest.sx > w - 12 || pChest.sy < 94 || pChest.sy > h - 12) {
        threatPt = pChest;
      }
    }
    if (threatPt) {
      const cx0 = w * 0.5;
      const cy0 = (h + 90) * 0.5;
      let dx = threatPt.sx - cx0;
      let dy = threatPt.sy - cy0;
      const dLen = Math.hypot(dx, dy);
      if (dLen > 1e-3) { dx /= dLen; dy /= dLen; } else { dx = 1; dy = 0; }
      const marginX = w * 0.5 - 28;
      const marginYTop = h - 28 - cy0;
      const marginYBot = cy0 - 104;
      const tx = Math.abs(dx) > 1e-4 ? marginX / Math.abs(dx) : 1e9;
      const ty = dy > 1e-4 ? marginYTop / dy : (dy < -1e-4 ? marginYBot / -dy : 1e9);
      const tEdge = Math.min(tx, ty);
      arrowMesh.visible = true;
      arrowMesh.position.set(cx0 + dx * tEdge, cy0 + dy * tEdge, 5);
      arrowMesh.rotation.z = Math.atan2(dy, dx) - Math.PI * 0.5;
      arrowMat.color.setHex(isAttackThreat ? 0xff4228 : 0x7bc8ff).convertSRGBToLinear();
    } else {
      arrowMesh.visible = false;
    }

    for (let i = 0; i < dmgNumbers.length; i++) {
      const dn = dmgNumbers[i];
      const dt = simTime - dn.strike.t;
      if (dt < 0 || dt >= 0.900) {
        for (let k = 0; k < dn.digits.length; k++) dn.digits[k].mesh.visible = false;
        continue;
      }
      const proj = projectToScreen(poseT.weakPoints[dn.strike.wp], w, h);
      if (proj.behind) {
        for (let k = 0; k < dn.digits.length; k++) dn.digits[k].mesh.visible = false;
        continue;
      }
      const rise = 60 * easeOutCubic(dt / 0.900);
      const alpha = dt < 0.45 ? 1.0 : 1.0 - (dt - 0.45) / 0.45;
      const pop = dt < 0.12 ? lerp(1.35, 1.0, dt / 0.12) : 1.0;
      const sy = clamp(proj.sy + rise, 108, h - 48);
      const sx = clamp(proj.sx, 48, w - 48);
      const spacing = 19 * pop;
      const totalW = (dn.digits.length - 1) * spacing;
      for (let k = 0; k < dn.digits.length; k++) {
        const dg = dn.digits[k];
        dg.mesh.visible = true;
        dg.mesh.position.set(sx - totalW * 0.5 + k * spacing, sy, 6);
        dg.mesh.scale.set(pop, pop, 1);
        dg.mat.opacity = alpha;
      }
    }
  }

  // =========================================================================
  // 12. WEB AUDIO SYNTHESIS ENGINE (SEED 4242, ZERO AUDIO FILES/MUSIC)
  // =========================================================================
  const AudioEngine = (() => {
    let ctx = null;
    let masterGain = null;
    let stormDuckGain = null;
    let compressor = null;
    let whiteBuf = null;
    let pinkBuf = null;

    let windFilter = null, windGain = null;
    let rainFilter = null, rainGain = null;
    let rumbleOsc = null, rumbleNoiseFilter = null, rumbleGain = null, rumblePanner = null;
    let crackleFilter = null, crackleHumOsc = null, crackleGain = null, cracklePanner = null;
    let reelOsc = null, reelGain = null, reelPanner = null;
    let whooshFilter = null, whooshGain = null, whooshPanner = null;

    const activeOneShots = new Set();
    let initialized = false;
    let isMuted = true;

    function createNoiseBuffer(audioCtx, lengthSec, isPink) {
      const sr = audioCtx.sampleRate;
      const len = Math.floor(sr * lengthSec);
      const buf = audioCtx.createBuffer(1, len, sr);
      const data = buf.getChannelData(0);
      const aRng = mulberry32(AUDIO_SEED + (isPink ? 77 : 13));
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = aRng() * 2 - 1;
        if (!isPink) {
          data[i] = w;
        } else {
          b0 = 0.99886 * b0 + w * 0.0555179;
          b1 = 0.99332 * b1 + w * 0.0750759;
          b2 = 0.96900 * b2 + w * 0.1538520;
          b3 = 0.86650 * b3 + w * 0.3104856;
          b4 = 0.55000 * b4 + w * 0.5329522;
          b5 = -0.7616 * b5 - w * 0.0168980;
          data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
          b6 = w * 0.115926;
        }
      }
      return buf;
    }

    function makePanner() {
      const p = ctx.createPanner();
      p.panningModel = 'HRTF';
      p.distanceModel = 'inverse';
      p.refDistance = 14;
      p.maxDistance = 260;
      p.rolloffFactor = 0.85;
      return p;
    }

    function setPannerPos(panner, v) {
      if (!panner) return;
      if (panner.positionX) {
        panner.positionX.value = v.x;
        panner.positionY.value = v.y;
        panner.positionZ.value = v.z;
      } else if (panner.setPosition) {
        panner.setPosition(v.x, v.y, v.z);
      }
    }

    function updateListener() {
      if (!ctx || !ctx.listener) return;
      const l = ctx.listener;
      const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
      if (l.positionX) {
        l.positionX.value = camera.position.x;
        l.positionY.value = camera.position.y;
        l.positionZ.value = camera.position.z;
        l.forwardX.value = fwd.x; l.forwardY.value = fwd.y; l.forwardZ.value = fwd.z;
        l.upX.value = up.x; l.upY.value = up.y; l.upZ.value = up.z;
      } else if (l.setPosition) {
        l.setPosition(camera.position.x, camera.position.y, camera.position.z);
        l.setOrientation(fwd.x, fwd.y, fwd.z, up.x, up.y, up.z);
      }
    }

    function init() {
      if (initialized) return;
      initialized = true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
        ctx.resume().catch(() => {});

        compressor = ctx.createDynamicsCompressor();
        compressor.threshold.value = -14;
        compressor.knee.value = 12;
        compressor.ratio.value = 6;
        compressor.attack.value = 0.003;
        compressor.release.value = 0.16;

        masterGain = ctx.createGain();
        masterGain.gain.value = 0;

        stormDuckGain = ctx.createGain();
        stormDuckGain.gain.value = 1.0;

        stormDuckGain.connect(masterGain);
        masterGain.connect(compressor);
        compressor.connect(ctx.destination);

        whiteBuf = createNoiseBuffer(ctx, 3.0, false);
        pinkBuf = createNoiseBuffer(ctx, 4.0, true);

        const windSrc = ctx.createBufferSource();
        windSrc.buffer = pinkBuf;
        windSrc.loop = true;
        windFilter = ctx.createBiquadFilter();
        windFilter.type = 'bandpass';
        windFilter.frequency.value = 340;
        windFilter.Q.value = 1.1;
        windGain = ctx.createGain();
        windGain.gain.value = 0.24;
        windSrc.connect(windFilter).connect(windGain).connect(stormDuckGain);
        windSrc.start();

        const rainSrc = ctx.createBufferSource();
        rainSrc.buffer = whiteBuf;
        rainSrc.loop = true;
        rainFilter = ctx.createBiquadFilter();
        rainFilter.type = 'bandpass';
        rainFilter.frequency.value = 2400;
        rainFilter.Q.value = 0.65;
        rainGain = ctx.createGain();
        rainGain.gain.value = 0.12;
        rainSrc.connect(rainFilter).connect(rainGain).connect(stormDuckGain);
        rainSrc.start();

        rumblePanner = makePanner();
        rumblePanner.connect(masterGain);
        rumbleGain = ctx.createGain();
        rumbleGain.gain.value = 0;
        rumbleGain.connect(rumblePanner);
        rumbleOsc = ctx.createOscillator();
        rumbleOsc.type = 'triangle';
        rumbleOsc.frequency.value = 42;
        const rumbleNoiseSrc = ctx.createBufferSource();
        rumbleNoiseSrc.buffer = pinkBuf;
        rumbleNoiseSrc.loop = true;
        rumbleNoiseFilter = ctx.createBiquadFilter();
        rumbleNoiseFilter.type = 'lowpass';
        rumbleNoiseFilter.frequency.value = 95;
        rumbleOsc.connect(rumbleGain);
        rumbleNoiseSrc.connect(rumbleNoiseFilter).connect(rumbleGain);
        rumbleOsc.start();
        rumbleNoiseSrc.start();

        cracklePanner = makePanner();
        cracklePanner.connect(masterGain);
        crackleGain = ctx.createGain();
        crackleGain.gain.value = 0;
        crackleGain.connect(cracklePanner);
        crackleHumOsc = ctx.createOscillator();
        crackleHumOsc.type = 'sawtooth';
        crackleHumOsc.frequency.value = 115;
        const humFilter = ctx.createBiquadFilter();
        humFilter.type = 'lowpass';
        humFilter.frequency.value = 380;
        const crackleNoiseSrc = ctx.createBufferSource();
        crackleNoiseSrc.buffer = whiteBuf;
        crackleNoiseSrc.loop = true;
        crackleFilter = ctx.createBiquadFilter();
        crackleFilter.type = 'bandpass';
        crackleFilter.frequency.value = 3200;
        crackleFilter.Q.value = 1.6;
        crackleHumOsc.connect(humFilter).connect(crackleGain);
        crackleNoiseSrc.connect(crackleFilter).connect(crackleGain);
        crackleHumOsc.start();
        crackleNoiseSrc.start();

        reelPanner = makePanner();
        reelPanner.connect(masterGain);
        reelGain = ctx.createGain();
        reelGain.gain.value = 0;
        reelGain.connect(reelPanner);
        reelOsc = ctx.createOscillator();
        reelOsc.type = 'sine';
        reelOsc.frequency.value = 420;
        reelOsc.connect(reelGain);
        reelOsc.start();

        whooshPanner = makePanner();
        whooshPanner.connect(masterGain);
        whooshGain = ctx.createGain();
        whooshGain.gain.value = 0;
        whooshGain.connect(whooshPanner);
        const whooshSrc = ctx.createBufferSource();
        whooshSrc.buffer = pinkBuf;
        whooshSrc.loop = true;
        whooshFilter = ctx.createBiquadFilter();
        whooshFilter.type = 'bandpass';
        whooshFilter.frequency.value = 600;
        whooshFilter.Q.value = 1.4;
        whooshSrc.connect(whooshFilter).connect(whooshGain);
        whooshSrc.start();
      } catch (_) {
        ctx = null;
      }
    }

    function resume() {
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }

    function stopAllOneShots() {
      if (!ctx) return;
      const now = ctx.currentTime;
      for (const item of activeOneShots) {
        try {
          item.gain.gain.cancelScheduledValues(now);
          item.gain.gain.setValueAtTime(0, now);
          for (const node of item.nodes) node.stop(now + 0.01);
        } catch (_) {}
      }
      activeOneShots.clear();
    }

    function registerOneShot(gainNode, nodes, endTime) {
      const entry = { gain: gainNode, nodes };
      activeOneShots.add(entry);
      const ms = Math.max(50, (endTime - ctx.currentTime) * 1000 + 80);
      setTimeout(() => { activeOneShots.delete(entry); }, ms);
    }

    function playThud(pos, fStart, fEnd, dur, vol, noiseVol) {
      if (!ctx || isMuted) return;
      const now = ctx.currentTime;
      const panner = makePanner();
      setPannerPos(panner, pos);
      panner.connect(masterGain);
      const g = ctx.createGain();
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      g.connect(panner);

      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(fStart, now);
      osc.frequency.exponentialRampToValueAtTime(fEnd, now + dur * 0.7);
      osc.connect(g);
      osc.start(now);
      osc.stop(now + dur);

      const nSrc = ctx.createBufferSource();
      nSrc.buffer = pinkBuf;
      const nFil = ctx.createBiquadFilter();
      nFil.type = 'lowpass';
      nFil.frequency.value = 260;
      const nGain = ctx.createGain();
      nGain.gain.setValueAtTime(noiseVol, now);
      nGain.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.8);
      nSrc.connect(nFil).connect(nGain).connect(panner);
      nSrc.start(now);
      nSrc.stop(now + dur);

      registerOneShot(g, [osc, nSrc], now + dur);
    }

    function playTetherSnap(pos, isAttach) {
      if (!ctx || isMuted) return;
      const now = ctx.currentTime;
      const panner = makePanner();
      setPannerPos(panner, pos);
      panner.connect(masterGain);
      const g = ctx.createGain();
      const dur = isAttach ? 0.14 : 0.10;
      g.gain.setValueAtTime(isAttach ? 0.28 : 0.32, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      g.connect(panner);

      const osc = ctx.createOscillator();
      osc.type = isAttach ? 'triangle' : 'sawtooth';
      osc.frequency.setValueAtTime(isAttach ? 1850 : 1400, now);
      osc.frequency.exponentialRampToValueAtTime(isAttach ? 1200 : 240, now + dur);
      osc.connect(g);
      osc.start(now);
      osc.stop(now + dur);
      registerOneShot(g, [osc], now + dur);
    }

    function playStrike(pos, idx, hitStopDur) {
      if (!ctx || isMuted) return;
      const now = ctx.currentTime;
      const pitches = [520, 660, 840, 1080];
      const f = pitches[idx % pitches.length];

      stormDuckGain.gain.cancelScheduledValues(now);
      stormDuckGain.gain.setValueAtTime(0.25, now);
      stormDuckGain.gain.setValueAtTime(0.25, now + hitStopDur);
      stormDuckGain.gain.linearRampToValueAtTime(1.0, now + hitStopDur + 0.16);

      const panner = makePanner();
      setPannerPos(panner, pos);
      panner.connect(masterGain);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.45, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      g.connect(panner);

      const osc1 = ctx.createOscillator();
      osc1.type = 'triangle';
      osc1.frequency.setValueAtTime(f, now);
      osc1.frequency.exponentialRampToValueAtTime(f * 0.72, now + 0.35);

      const osc2 = ctx.createOscillator();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(f * 2.41, now);
      osc2.connect(g);
      osc1.connect(g);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.42);
      osc2.stop(now + 0.42);
      registerOneShot(g, [osc1, osc2], now + 0.42);
    }

    function playThunder(strikePos, intensity) {
      if (!ctx || isMuted) return;
      const dist = camera.position.distanceTo(strikePos);
      const delay = dist / 340.0;
      const start = ctx.currentTime + delay;
      const dur = 2.6;

      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, start);
      g.gain.linearRampToValueAtTime(0.55 * intensity, start + 0.03);
      g.gain.exponentialRampToValueAtTime(0.22 * intensity, start + 0.25);
      g.gain.exponentialRampToValueAtTime(0.001, start + dur);
      g.connect(masterGain);

      const nSrc = ctx.createBufferSource();
      nSrc.buffer = pinkBuf;
      const nFil = ctx.createBiquadFilter();
      nFil.type = 'lowpass';
      nFil.frequency.setValueAtTime(1800, start);
      nFil.frequency.exponentialRampToValueAtTime(85, start + 1.4);
      nSrc.connect(nFil).connect(g);
      nSrc.start(start);
      nSrc.stop(start + dur);
      registerOneShot(g, [nSrc], start + dur);
    }

    function playBoneFailWhine(pos) {
      if (!ctx || isMuted) return;
      const now = ctx.currentTime;
      const panner = makePanner();
      setPannerPos(panner, pos);
      panner.connect(masterGain);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.18, now);
      g.gain.setValueAtTime(0.18, now + 0.38);
      g.gain.linearRampToValueAtTime(0.0, now + 0.42);
      g.connect(panner);

      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(760, now);
      osc.frequency.exponentialRampToValueAtTime(85, now + 0.40);
      osc.connect(g);
      osc.start(now);
      osc.stop(now + 0.42);
      registerOneShot(g, [osc], now + 0.42);
    }

    let lastBoulderThudWallTime = 0;

    function updateContinuous(shouldBeAudible, simTime, wetness, poseT, poseH, avgCharge, maxLimbSpeed, hunterSpeed) {
      if (!ctx) return;
      const now = ctx.currentTime;
      const targetMaster = shouldBeAudible ? 0.85 : 0.0;
      if (!shouldBeAudible && !isMuted) {
        stopAllOneShots();
      }
      isMuted = !shouldBeAudible;
      masterGain.gain.setTargetAtTime(targetMaster, now, 0.012);

      if (!shouldBeAudible) return;
      updateListener();

      const gust = 0.5 + 0.5 * Math.sin(simTime * 0.45 + Math.sin(simTime * 0.17));
      windFilter.frequency.setTargetAtTime(260 + gust * 380, now, 0.05);
      windGain.gain.setTargetAtTime(0.16 + gust * 0.14, now, 0.05);
      rainFilter.frequency.setTargetAtTime(lerp(2400, 1250, wetness), now, 0.05);
      rainGain.gain.setTargetAtTime(lerp(0.10, 0.19, wetness), now, 0.05);

      const chestPos = poseT.bones[BONE_INDEX.chest].center;
      setPannerPos(rumblePanner, chestPos);
      setPannerPos(cracklePanner, chestPos);
      const speedNorm = clamp(maxLimbSpeed / 12.0, 0, 1.4);
      const aliveFactor = avgCharge > 0.02 ? 1 : 0;
      rumbleOsc.frequency.setTargetAtTime(32 + speedNorm * 22, now, 0.04);
      rumbleNoiseFilter.frequency.setTargetAtTime(55 + speedNorm * 90, now, 0.04);
      rumbleGain.gain.setTargetAtTime(aliveFactor * (0.04 + speedNorm * 0.24), now, 0.04);

      crackleFilter.frequency.setTargetAtTime(1600 + avgCharge * 1800, now, 0.04);
      crackleHumOsc.frequency.setTargetAtTime(95 + avgCharge * 35, now, 0.04);
      crackleGain.gain.setTargetAtTime(clamp(avgCharge * 0.11, 0, 0.25), now, 0.04);

      setPannerPos(reelPanner, poseH.chestPos);
      setPannerPos(whooshPanner, poseH.chestPos);
      const tetherAttached =
        (simTime >= 3.3 && simTime < 5.6) ||
        (simTime >= 9.3 && simTime < 12.4) ||
        (simTime >= 23.8 && simTime < 31.5);
      reelOsc.frequency.setTargetAtTime(280 + hunterSpeed * 28, now, 0.03);
      reelGain.gain.setTargetAtTime(tetherAttached ? 0.055 : 0.0, now, 0.03);

      const whooshLevel = clamp((hunterSpeed - 3.5) / 22.0, 0, 0.22);
      whooshFilter.frequency.setTargetAtTime(350 + hunterSpeed * 42, now, 0.03);
      whooshGain.gain.setTargetAtTime(whooshLevel, now, 0.03);
    }

    function triggerCrossedEvents(prevT, curT, poseT, poseH) {
      if (!ctx || isMuted || curT <= prevT) return;
      const crossed = (evT) => prevT < evT && evT <= curT;

      const ffs = [
        [1.000, BONE_INDEX.footL], [2.500, BONE_INDEX.footR],
        [4.000, BONE_INDEX.footL], [5.500, BONE_INDEX.footR]
      ];
      for (const [ft, bi] of ffs) {
        if (crossed(ft)) playThud(poseT.bones[bi].center, 85, 28, 0.36, 0.45, 0.18);
      }

      if (crossed(7.500)) playThud(SLAM_TARGET, 115, 22, 0.72, 0.85, 0.45);
      if (crossed(13.000)) playThud(poseT.bones[BONE_INDEX.shinL].start, 95, 24, 0.58, 0.65, 0.32);
      if (crossed(19.000)) playThud(poseH.chestPos, 150, 42, 0.28, 0.55, 0.35);

      for (const ts of TETHER_SPECS) {
        if (crossed(ts.tFire)) playTetherSnap(poseH.launcherPos, false);
        if (crossed(ts.tAttach)) playTetherSnap(poseT.bones[BONE_INDEX[ts.boneName]].center, true);
      }

      for (let i = 0; i < STRIKES.length; i++) {
        if (crossed(STRIKES[i].t)) playStrike(poseT.weakPoints[STRIKES[i].wp], i, STRIKES[i].hitStop);
      }

      for (const sk of SKY_STRIKES) {
        if (crossed(sk.t)) playThunder(sk.pos, sk.intensity);
      }

      for (const rt of ragdollImpactTimes) {
        if (crossed(rt)) playThud(poseH.chestPos, 95, 38, 0.16, 0.24, 0.12);
      }

      const boneGroups = [
        [29.700, BONE_INDEX.head], [30.200, BONE_INDEX.upperArmR], [30.800, BONE_INDEX.chest],
        [31.400, BONE_INDEX.spine], [32.000, BONE_INDEX.pelvis], [32.600, BONE_INDEX.thighL]
      ];
      for (const [bt, bi] of boneGroups) {
        if (crossed(bt)) playBoneFailWhine(poseT.bones[bi].center);
      }

      const wallNow = performance.now();
      if (curT > 30.0 && curT < 36.0 && wallNow - lastBoulderThudWallTime > 45) {
        for (let i = 0; i < boulders.length; i++) {
          const b = boulders[i];
          if (crossed(b.landTime)) {
            playThud(b.landPos, 72, 26, 0.24, 0.22, 0.14);
            lastBoulderThudWallTime = wallNow;
            break;
          }
        }
      }
    }

    return { init, resume, updateContinuous, triggerCrossedEvents, stopAllOneShots };
  })();

  AudioEngine.init();
  const unlockAudio = () => {
    AudioEngine.init();
    AudioEngine.resume();
  };
  window.addEventListener('pointerdown', unlockAudio, { passive: true });
  window.addEventListener('keydown', unlockAudio, { passive: true });

  // =========================================================================
  // 13. MAIN FRAME EVALUATION (`renderAt(simTime)`)
  // =========================================================================
  const _mat4 = new THREE.Matrix4();
  const _posTmp = new THREE.Vector3();
  const _quatTmp = new THREE.Quaternion();
  const _scaleTmp = new THREE.Vector3();

  const STATIC_SHOCKWAVES = [
    { t: 1.000, getPos: (p) => p.bones[BONE_INDEX.footL].center, s: 0.45 },
    { t: 2.500, getPos: (p) => p.bones[BONE_INDEX.footR].center, s: 0.45 },
    { t: 4.000, getPos: (p) => p.bones[BONE_INDEX.footL].center, s: 0.45 },
    { t: 5.500, getPos: (p) => p.bones[BONE_INDEX.footR].center, s: 0.45 },
    { t: 7.500, getPos: () => SLAM_TARGET, s: 1.00 },
    { t: 13.000, getPos: (p) => p.bones[BONE_INDEX.shinL].start, s: 0.72 }
  ];
  (function bakeStaticShockwaves() {
    const tmpP = createPoseState();
    for (let i = 0; i < STATIC_SHOCKWAVES.length; i++) {
      const sw = STATIC_SHOCKWAVES[i];
      evaluateTitanPose(sw.t, tmpP);
      const pt = sw.getPos(tmpP);
      shockWaveUniformArray[i].set(pt.x, pt.z, sw.t, sw.s);
    }
    for (let i = 0; i < 10 && i + 6 < MAX_SHOCKWAVES; i++) {
      const bl = boulderLandUniformArray[i];
      shockWaveUniformArray[i + 6].set(bl.x, bl.y, bl.z, 0.28);
    }
  })();

  const boulderWorldPos = new Array(boulders.length).fill(null).map(() => new THREE.Vector3());

  function renderAt(simTime, prevSimTime, allowTriggerAudio) {
    const motionTime = getMotionTime(simTime);
    const wetness = getWetness(simTime);
    const skyFlash = getSkyFlash(simTime);

    evaluateTitanPose(motionTime, titanPose);
    evaluateTitanPose(Math.max(0, motionTime - 0.03), titanPosePrev);
    evaluateHunterPose(motionTime, hunterPose);

    let maxLimbSpeed = 0;
    let chargeSum = 0;
    for (let i = 0; i < BONE_NAMES.length; i++) {
      chargeSum += titanPose.bones[i].charge;
      const spd = titanPose.bones[i].end.distanceTo(titanPosePrev.bones[i].end) / 0.03;
      if (spd > maxLimbSpeed) maxLimbSpeed = spd;
    }
    const avgCharge = chargeSum / BONE_NAMES.length;

    const hPrev = getHunterTrajectoryPos(Math.max(0, motionTime - 0.03), _vA);
    const hNext = getHunterTrajectoryPos(Math.min(DURATION, motionTime + 0.03), _vB);
    const hunterSpeed = hNext.distanceTo(hPrev) / 0.06;

    // Wetness response: roughness 0.90 -> 0.35, stronger specular env reflections, darker wet surfaces
    const wetRough = lerp(0.90, 0.35, wetness);
    const wetEnv = lerp(0.25, 1.45, wetness);
    const wetDark = lerp(1.0, 0.62, wetness);
    plateauMat.roughness = wetRough;
    plateauMat.envMapIntensity = wetEnv;
    plateauMat.color.setRGB(wetDark, wetDark, wetDark);

    const tick20Hz = Math.floor(motionTime * 20);
    const flicker = 0.72 + 0.56 * hashInt(tick20Hz * 17 + 5);
    for (let v = 0; v < 4; v++) {
      const m = boulderVariants[v].mat;
      m.roughness = wetRough;
      m.envMapIntensity = wetEnv;
      m.color.setRGB(wetDark, wetDark, wetDark);
    }

    for (let i = 0; i < hunterMaterials.length; i++) {
      const hm = hunterMaterials[i];
      hm.mat.roughness = lerp(hm.baseRough, Math.min(hm.baseRough, 0.35), wetness);
      hm.mat.envMapIntensity = lerp(0.35, 1.45, wetness);
      const dk = lerp(1.0, 0.72, wetness);
      hm.mat.color.copy(hm.baseColor).multiplyScalar(dk);
    }

    for (const name of HUNTER_PART_NAMES) {
      const mesh = hunterParts[name];
      const p = hunterPose.parts[name];
      mesh.position.copy(p.pos);
      mesh.quaternion.copy(p.quat);
    }

    // Boulders & per-boulder ore glow driven by parent bone charge
    for (let i = 0; i < boulders.length; i++) {
      const b = boulders[i];
      if (motionTime < b.releaseTime) {
        evalBoulderTransformAt(b, titanPose, motionTime, _posTmp, _quatTmp);
      } else {
        getCollapseBoulderTransform(b, motionTime, _posTmp, _quatTmp);
      }
      boulderWorldPos[i].copy(_posTmp);
      _mat4.compose(_posTmp, _quatTmp, b.scale);
      const bv = boulderVariants[b.variantIdx];
      bv.mesh.setMatrixAt(b.slotIdx, _mat4);
      const boneCh = titanPose.bones[b.boneIndex].charge;
      bv.oreAttr.setX(b.slotIdx, boneCh > 0.01 ? (0.15 + 1.05 * boneCh * flicker) : 0.0);
    }
    for (let v = 0; v < 4; v++) {
      boulderVariants[v].mesh.instanceMatrix.needsUpdate = true;
      boulderVariants[v].oreAttr.needsUpdate = true;
    }

    // Weak points
    const wpBreakTimes = [5.000, 12.000, 29.500];
    const wpStrikeTimes = [[5.000], [12.000], [27.000, 29.500]];
    for (let i = 0; i < 3; i++) {
      const mesh = wpMeshes[i];
      const mat = wpMaterials[i];
      const pl = wpLights[i];
      if (i === 2 && motionTime >= COLLAPSE_GROUPS.chest) {
        mesh.visible = false;
        pl.intensity = 0;
        continue;
      }
      mesh.visible = true;
      mesh.position.copy(titanPose.weakPoints[i]);
      pl.position.copy(titanPose.weakPoints[i]);

      let flash = 0;
      for (const st of wpStrikeTimes[i]) {
        const dt = simTime - st;
        if (dt >= 0 && dt < 0.25) flash = Math.max(flash, 1 - dt / 0.25);
      }
      const broken = simTime >= wpBreakTimes[i] + 0.22;
      const exposed = i !== 2 || motionTime >= 25.000;

      if (flash > 0) {
        mat.color.setHex(0xffffff);
        mat.emissive.setHex(0xffffff);
        mat.emissiveIntensity = 8.0 * flash + 2.0;
        pl.color.setHex(0xffffff);
        pl.intensity = 5.0 * flash;
      } else if (broken) {
        mat.color.setHex(0x181a20);
        mat.emissive.setHex(0x000000);
        mat.emissiveIntensity = 0;
        pl.intensity = 0;
      } else {
        const pulse = 2.6 + 0.7 * Math.sin(simTime * 5.0 + i);
        mat.color.setHex(0xffaa22);
        mat.emissive.setHex(0xff7b00);
        mat.emissiveIntensity = exposed ? pulse : 0.9;
        pl.color.setHex(0xff8811);
        pl.intensity = exposed ? 2.2 : 0.3;
      }
    }

    // Binding Lightning Arcs (56 arcs flickering at 20 Hz from motionTime)
    const perp1 = _vC;
    const perp2 = _vD;
    const dirArc = new THREE.Vector3();
    const curPt = new THREE.Vector3();
    const nxtPt = new THREE.Vector3();

    for (let aIdx = 0; aIdx < COUNTS.arcs; aIdx++) {
      const pair = arcPairs[aIdx];
      const charge = titanPose.bones[pair.boneIndex].charge;
      const active = charge > 0.02;

      const pa = boulderWorldPos[pair.a];
      const pb = boulderWorldPos[pair.b];
      dirArc.subVectors(pb, pa);
      const len = dirArc.length();
      if (len > 1e-4) dirArc.multiplyScalar(1 / len);

      perp1.set(0, 1, 0).cross(dirArc);
      if (perp1.lengthSq() < 1e-4) perp1.set(1, 0, 0).cross(dirArc);
      perp1.normalize();
      perp2.crossVectors(dirArc, perp1).normalize();

      const segSeed = tick20Hz * 131 + aIdx * 37;
      const arcVis = active && hashInt(segSeed + 3) < clamp(charge * 0.92, 0.15, 1.0);
      const w = arcVis ? (0.045 + 0.045 * charge) : 0.0;
      const br = arcVis ? (0.85 + 1.15 * charge) : 0.0;

      for (let s = 0; s < ARC_SEGS; s++) {
        const u0 = s / ARC_SEGS;
        const u1 = (s + 1) / ARC_SEGS;
        const env0 = Math.sin(u0 * Math.PI);
        const env1 = Math.sin(u1 * Math.PI);

        const j0x = (hashInt(segSeed + s * 7 + 1) - 0.5) * 1.45 * env0;
        const j0y = (hashInt(segSeed + s * 7 + 2) - 0.5) * 1.45 * env0;
        const j1x = (hashInt(segSeed + (s + 1) * 7 + 1) - 0.5) * 1.45 * env1;
        const j1y = (hashInt(segSeed + (s + 1) * 7 + 2) - 0.5) * 1.45 * env1;

        curPt.lerpVectors(pa, pb, u0).addScaledVector(perp1, j0x).addScaledVector(perp2, j0y);
        nxtPt.lerpVectors(pa, pb, u1).addScaledVector(perp1, j1x).addScaledVector(perp2, j1y);

        const baseV = (aIdx * ARC_SEGS + s) * 8;
        const writeV = (off, vx, vy, vz, cr, cg, cb) => {
          const i3 = (baseV + off) * 3;
          arcVerts[i3] = vx; arcVerts[i3 + 1] = vy; arcVerts[i3 + 2] = vz;
          arcCols[i3] = cr; arcCols[i3 + 1] = cg; arcCols[i3 + 2] = cb;
        };

        const cr = 0.55 * br, cg = 0.85 * br, cb = 1.65 * br;
        writeV(0, curPt.x + perp1.x * w, curPt.y + perp1.y * w, curPt.z + perp1.z * w, cr, cg, cb);
        writeV(1, curPt.x - perp1.x * w, curPt.y - perp1.y * w, curPt.z - perp1.z * w, cr, cg, cb);
        writeV(2, nxtPt.x + perp1.x * w, nxtPt.y + perp1.y * w, nxtPt.z + perp1.z * w, cr, cg, cb);
        writeV(3, nxtPt.x - perp1.x * w, nxtPt.y - perp1.y * w, nxtPt.z - perp1.z * w, cr, cg, cb);
        writeV(4, curPt.x + perp2.x * w, curPt.y + perp2.y * w, curPt.z + perp2.z * w, cr, cg, cb);
        writeV(5, curPt.x - perp2.x * w, curPt.y - perp2.y * w, curPt.z - perp2.z * w, cr, cg, cb);
        writeV(6, nxtPt.x + perp2.x * w, nxtPt.y + perp2.y * w, nxtPt.z + perp2.z * w, cr, cg, cb);
        writeV(7, nxtPt.x - perp2.x * w, nxtPt.y - perp2.y * w, nxtPt.z - perp2.z * w, cr, cg, cb);
      }
    }
    arcPosBuf.needsUpdate = true;
    arcColBuf.needsUpdate = true;

    const lightBones = [BONE_INDEX.chest, BONE_INDEX.fistL, BONE_INDEX.fistR, BONE_INDEX.shinL];
    const arcStrengthVec = grassUniforms.uArcStrength.value;
    for (let i = 0; i < 4; i++) {
      const bn = titanPose.bones[lightBones[i]];
      arcLightPositions[i].copy(bn.center);
      const st = bn.charge * flicker;
      arcPointLights[i].position.copy(bn.center);
      arcPointLights[i].intensity = st * 2.8;
      if (i === 0) arcStrengthVec.x = st;
      else if (i === 1) arcStrengthVec.y = st;
      else if (i === 2) arcStrengthVec.z = st;
      else arcStrengthVec.w = st;
    }

    for (let i = 0; i < skyBolts.length; i++) {
      const sb = skyBolts[i];
      const dt = simTime - sb.t;
      const vis = dt >= 0 && dt < 0.250;
      sb.mesh.visible = vis;
      if (vis) {
        sb.mat.opacity = (dt < 0.08 || (dt > 0.13 && dt < 0.21)) ? 1.0 : 0.45;
      }
    }

    skyUniforms.uTime.value = motionTime;
    skyUniforms.uFlash.value = skyFlash;
    skyUniforms.uWetness.value = wetness;
    skyFlashLight.intensity = skyFlash * 3.4;
    scene.fog.color.copy(baseFogColor).lerp(flashFogColor, clamp(skyFlash * 0.55, 0, 0.75));
    grassUniforms.uFogColor.value.copy(scene.fog.color);

    updateCamera(simTime, motionTime, titanPose, hunterPose);

    grassUniforms.uMotionTime.value = motionTime;
    grassUniforms.uWetness.value = wetness;
    grassUniforms.uSkyFlash.value = skyFlash;
    grassUniforms.uSweepState.value.set(titanPose.pelvisGround.x, titanPose.pelvisGround.z, 18.5, 1);

    rainUniforms.uMotionTime.value = motionTime;
    rainUniforms.uCamPos.value.copy(camera.position);
    rainUniforms.uSkyFlash.value = skyFlash;

    updateTetherMeshes(motionTime);

    for (let i = 0; i < TOTAL_SPARKS; i++) {
      const sp = sparkData[i];
      const dt = simTime - sp.tStart;
      if (dt < 0 || dt >= sp.life) {
        _scaleTmp.set(0, 0, 0);
        _mat4.compose(_posTmp.set(0, -100, 0), _quatTmp.identity(), _scaleTmp);
        sparkInst.setMatrixAt(i, _mat4);
        continue;
      }
      _posTmp.set(
        sp.origin.x + sp.vel.x * dt,
        sp.origin.y + sp.vel.y * dt - 0.5 * 14.0 * dt * dt,
        sp.origin.z + sp.vel.z * dt
      );
      _vA.set(sp.vel.x, sp.vel.y - 14.0 * dt, sp.vel.z);
      const spd = _vA.length();
      if (spd > 1e-4) _vA.multiplyScalar(1 / spd);
      _quatTmp.setFromUnitVectors(new THREE.Vector3(0, 0, 1), _vA);
      const fade = 1 - dt / sp.life;
      _scaleTmp.set(fade, fade, fade * clamp(spd * 0.06, 0.4, 2.2));
      _mat4.compose(_posTmp, _quatTmp, _scaleTmp);
      sparkInst.setMatrixAt(i, _mat4);
    }
    sparkInst.instanceMatrix.needsUpdate = true;

    const slamDt = motionTime - 7.500;
    for (let i = 0; i < CLOD_COUNT; i++) {
      const c = clods[i];
      if (slamDt < 0 || slamDt > 3.2) {
        _scaleTmp.set(0, 0, 0);
        _mat4.compose(_posTmp.set(0, -100, 0), _quatTmp.identity(), _scaleTmp);
        clodInst.setMatrixAt(i, _mat4);
        continue;
      }
      const cx = c.origin.x + c.vel.x * slamDt;
      const cz = c.origin.z + c.vel.z * slamDt;
      const gy = terrainHeight(cx, cz);
      const cy = c.origin.y + c.vel.y * slamDt - 0.5 * 11.5 * slamDt * slamDt;
      _scaleTmp.setScalar(cy < gy ? 0 : c.scale);
      _posTmp.set(cx, Math.max(gy, cy), cz);
      _quatTmp.setFromEuler(new THREE.Euler(c.spin.x * slamDt, c.spin.y * slamDt, c.spin.z * slamDt));
      _mat4.compose(_posTmp, _quatTmp, _scaleTmp);
      clodInst.setMatrixAt(i, _mat4);
    }
    clodInst.instanceMatrix.needsUpdate = true;

    for (let i = 0; i < dustSprites.length; i++) {
      const ds = dustSprites[i];
      const dt = motionTime - ds.landVec.z;
      if (dt < 0 || dt > 1.8) {
        ds.sp.visible = false;
      } else {
        ds.sp.visible = true;
        const u = dt / 1.8;
        const sc = lerp(ds.landVec.w * 1.4, ds.landVec.w * 5.2, easeOutCubic(u));
        ds.sp.position.set(ds.landVec.x, terrainHeight(ds.landVec.x, ds.landVec.y) + sc * 0.25, ds.landVec.y);
        ds.sp.scale.set(sc, sc * 0.65, 1);
        ds.mat.opacity = (1 - u) * 0.45;
      }
    }

    updateHUD(simTime, titanPose);

    renderer.setRenderTarget(renderTarget);
    renderer.autoClear = true;
    renderer.render(scene, camera);

    renderer.setRenderTarget(null);
    renderer.autoClear = false;
    renderer.clear();
    renderer.render(postScene, postCamera);
    renderer.clearDepth();
    renderer.render(hudScene, hudCamera);

    const shouldPlayAudio = (simState === 'PLAYING') && !isScrubbing;
    AudioEngine.updateContinuous(shouldPlayAudio, simTime, wetness, titanPose, hunterPose, avgCharge, maxLimbSpeed, hunterSpeed);
    if (allowTriggerAudio && shouldPlayAudio) {
      AudioEngine.triggerCrossedEvents(prevSimTime, simTime, titanPose, hunterPose);
    }
  }

  // =========================================================================
  // 14. PLAYBACK STATE MACHINE & DOCK CONTROLS
  // =========================================================================
  const countdownEl = document.getElementById('countdown');
  const btnRefire = document.getElementById('btn-refire');
  const btnToggle = document.getElementById('btn-toggle');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const speedPills = Array.from(document.querySelectorAll('.speed-pill'));
  const scrubber = document.getElementById('scrubber');

  let simState = 'COUNTDOWN';
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;
  let holdElapsed = 0;
  let lastFrameMs = null;
  let isScrubbing = false;

  function setToggleVisual(isPlayingOrCounting) {
    if (isPlayingOrCounting) {
      iconPause.style.display = '';
      iconPlay.style.display = 'none';
      btnToggle.setAttribute('aria-label', 'Pause');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = '';
      btnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }

  btnToggle.addEventListener('click', () => {
    AudioEngine.resume();
    if (simState === 'PLAYING') {
      simState = 'PAUSED';
      setToggleVisual(false);
      AudioEngine.stopAllOneShots();
    } else if (simState === 'COUNTDOWN' || simState === 'REFIRE_HOLD') {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0';
      simState = 'PAUSED';
      setToggleVisual(false);
      AudioEngine.stopAllOneShots();
      renderAt(simTime, simTime, false);
    } else if (simState === 'PAUSED') {
      simState = 'PLAYING';
      setToggleVisual(true);
    } else if (simState === 'ENDED') {
      simTime = 0.000;
      scrubber.value = '0';
      hideCountdown();
      simState = 'PLAYING';
      setToggleVisual(true);
      renderAt(simTime, simTime, false);
    }
  });

  speedPills.forEach((pill) => {
    pill.addEventListener('click', () => {
      playbackSpeed = parseFloat(pill.dataset.speed);
      speedPills.forEach((p) => {
        const active = p === pill;
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  scrubber.addEventListener('pointerdown', () => {
    isScrubbing = true;
    AudioEngine.stopAllOneShots();
  });
  window.addEventListener('pointerup', () => { isScrubbing = false; });

  scrubber.addEventListener('input', () => {
    if (simState === 'COUNTDOWN' || simState === 'REFIRE_HOLD') {
      hideCountdown();
    }
    simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
    simState = 'PAUSED';
    setToggleVisual(false);
    AudioEngine.stopAllOneShots();
    renderAt(simTime, simTime, false);
  });

  btnRefire.addEventListener('click', () => {
    AudioEngine.resume();
    AudioEngine.stopAllOneShots();
    hideCountdown();
    simTime = 0.000;
    scrubber.value = '0';
    holdElapsed = 0;
    simState = 'REFIRE_HOLD';
    setToggleVisual(true);
    renderAt(0.000, 0.000, false);
  });

  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();

    rtWidth = Math.max(1, Math.floor(w * dpr));
    rtHeight = Math.max(1, Math.floor(h * dpr));
    renderTarget.dispose();
    renderTarget = makeRenderTarget(rtWidth, rtHeight);
    postMaterial.uniforms.tDiffuse.value = renderTarget.texture;
    postMaterial.uniforms.uResolution.value.set(rtWidth, rtHeight);

    renderAt(simTime, simTime, false);
  });

  countdownEl.style.display = 'block';
  countdownEl.textContent = '3';
  renderAt(0.000, 0.000, false);

  function tick(nowMs) {
    requestAnimationFrame(tick);
    if (lastFrameMs === null) {
      lastFrameMs = nowMs;
      return;
    }
    const dt = Math.min((nowMs - lastFrameMs) / 1000, 0.1);
    lastFrameMs = nowMs;

    if (simState === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.000) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '3';
      } else if (countdownElapsed < 2.000) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '2';
      } else if (countdownElapsed < 3.000) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '1';
      } else {
        hideCountdown();
        simState = 'PLAYING';
        setToggleVisual(true);
        const prev = simTime;
        simTime = Math.min(DURATION, (countdownElapsed - 3.000) * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime, prev, true);
        return;
      }
      renderAt(0.000, 0.000, false);
    } else if (simState === 'REFIRE_HOLD') {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        simState = 'PLAYING';
        setToggleVisual(true);
        const prev = simTime;
        simTime = Math.min(DURATION, (holdElapsed - 1.000) * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime, prev, true);
        return;
      }
      renderAt(0.000, 0.000, false);
    } else if (simState === 'PLAYING') {
      const prev = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      renderAt(simTime, prev, true);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        simState = 'ENDED';
        setToggleVisual(false);
        AudioEngine.stopAllOneShots();
      }
    } else {
      renderAt(simTime, simTime, false);
    }
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
