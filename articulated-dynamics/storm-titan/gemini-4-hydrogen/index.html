<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Titan</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  const DURATION = 40;
  const FIXED_DT = 1 / 240;
  const SIM_SEED = 42;
  const AUDIO_SEED = 4242;

  const COUNTS = {
    grassBlades: 100000,
    rainStreaks: 20000,
    boulders: 144,
    arcs: 56,
    ropePoints: 32,
    ragdollPoints: 13
  };

  window.BENCH_REPORT = {
    counts: {
      grassBlades: COUNTS.grassBlades,
      rainStreaks: COUNTS.rainStreaks,
      boulders: COUNTS.boulders,
      arcs: COUNTS.arcs,
      ropePoints: COUNTS.ropePoints,
      ragdollPoints: COUNTS.ragdollPoints
    },
    systems: {
      titanSkeleton: 'full',
      grass: 'full',
      rainAndWetness: 'full',
      tethers: 'full',
      combatHitStop: 'full',
      ragdollBlend: 'full',
      camera: 'full',
      hud: 'full',
      audio: 'full',
      collapse: 'full'
    },
    simplifications: [],
    testedInBrowser: false,
    measuredFps: null
  };

  // =========================================================================
  // 1. DETERMINISTIC PRNG & MATH HELPERS (SEEDED ONLY)
  // =========================================================================
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashInt(n) {
    let x = (n | 0) ^ 0x9e3779b9;
    x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
    x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }

  function hash2(x, y) {
    return hashInt((x * 374761393 + y * 668265263) | 0);
  }

  function smoothNoise1D(x, seed) {
    const i = Math.floor(x);
    const f = x - i;
    const u = f * f * (3 - 2 * f);
    const a = hash2(i, seed) * 2 - 1;
    const b = hash2(i + 1, seed) * 2 - 1;
    return a + (b - a) * u;
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function smoothstep(a, b, x) {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function easeOutCubic(t) {
    const u = 1 - clamp(t, 0, 1);
    return 1 - u * u * u;
  }

  function easeInOutCubic(t) {
    const x = clamp(t, 0, 1);
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  const rng = mulberry32(SIM_SEED);

  // =========================================================================
  // 2. EVENT TABLE, MOTION TIME, TRAUMA, WETNESS & SKY LIGHTNING
  // =========================================================================
  const BOSS_MAX_HP = 2000;

  const STRIKES = [
    { t: 5.000, hitStop: 0.100, dmg: 400, wp: 0, stagAfter: 50, breaks: true },
    { t: 12.000, hitStop: 0.100, dmg: 600, wp: 1, stagAfter: 100, breaks: true },
    { t: 27.000, hitStop: 0.100, dmg: 500, wp: 2, stagAfter: 50, breaks: false },
    { t: 29.500, hitStop: 0.200, dmg: 500, wp: 2, stagAfter: 0, breaks: true }
  ];

  const TRAUMA_EVENTS = [
    { t: 1.000, val: 0.25 },
    { t: 2.500, val: 0.25 },
    { t: 4.000, val: 0.25 },
    { t: 5.000, val: 0.45 },
    { t: 5.500, val: 0.25 },
    { t: 7.500, val: 0.90 },
    { t: 8.200, val: 0.30 },
    { t: 12.000, val: 0.55 },
    { t: 13.000, val: 0.70 },
    { t: 19.000, val: 0.80 },
    { t: 25.000, val: 0.50 },
    { t: 27.000, val: 0.60 },
    { t: 29.500, val: 1.00 },
    { t: 31.500, val: 0.20 },
    { t: 33.000, val: 0.30 }
  ];

  const SKY_STRIKES = [
    { t: 8.200, pos: new THREE.Vector3(64, 0, -54), isTitanHead: false, intensity: 1.0 },
    { t: 25.000, pos: new THREE.Vector3(16, 38.5, 0), isTitanHead: true, intensity: 1.55 },
    { t: 33.000, pos: new THREE.Vector3(110, 0, 72), isTitanHead: false, intensity: 0.85 }
  ];

  const COLLAPSE_GROUPS = {
    head: 29.700,
    arms: 30.200,
    chest: 30.800,
    spine: 31.400,
    pelvis: 32.000,
    legs: 32.600
  };

  function getMotionTime(simTime) {
    const t = clamp(simTime, 0, DURATION);
    for (let i = 0; i < STRIKES.length; i++) {
      const s = STRIKES[i];
      const catchEnd = s.t + s.hitStop + 0.300;
      if (t >= s.t && t < s.t + s.hitStop) {
        return s.t;
      }
      if (t >= s.t + s.hitStop && t < catchEnd) {
        const u = (t - (s.t + s.hitStop)) / 0.300;
        return s.t + u * (s.hitStop + 0.300);
      }
    }
    return t;
  }

  function getTrauma(simTime) {
    let tr = 0;
    let lastT = 0;
    for (let i = 0; i < TRAUMA_EVENTS.length; i++) {
      const ev = TRAUMA_EVENTS[i];
      if (simTime < ev.t) break;
      tr = Math.max(0, tr - 0.8 * (ev.t - lastT));
      tr = Math.min(1, tr + ev.val);
      lastT = ev.t;
    }
    tr = Math.max(0, tr - 0.8 * Math.max(0, simTime - lastT));
    return clamp(tr, 0, 1);
  }

  function getWetness(simTime) {
    return clamp(simTime / 30.0, 0, 1);
  }

  function getSkyFlash(simTime) {
    let flash = 0;
    for (let i = 0; i < SKY_STRIKES.length; i++) {
      const s = SKY_STRIKES[i];
      const dt = simTime - s.t;
      if (dt >= 0 && dt < 0.400) {
        const pulse = dt < 0.08
          ? 1.0
          : (dt < 0.14 ? 0.55 : (dt < 0.20 ? 0.85 : Math.pow(Math.max(0, 1 - (dt - 0.20) / 0.20), 1.6)));
        flash = Math.max(flash, pulse * s.intensity);
      }
    }
    return flash;
  }

  // =========================================================================
  // 3. TERRAIN HEIGHT & DETACHED PROCEDURAL TEXTURES
  // =========================================================================
  function terrainHeight(x, z) {
    const r = Math.hypot(x, z);
    const edge = smoothstep(88, 92, r);
    const hills =
      0.24 * Math.sin(x * 0.055 + 0.4) * Math.cos(z * 0.052 - 0.2) +
      0.16 * Math.sin((x + z) * 0.095 + 1.1) +
      0.11 * Math.cos((x - z) * 0.14 - 0.7);
    const h = clamp(hills, -0.55, 0.55);
    if (r <= 90) return h * (1 - 0.5 * edge);
    const cliff = Math.min(48, (r - 90) * 1.45 + 0.08 * (r - 90) * (r - 90));
    return h * 0.5 - cliff;
  }

  const SLAM_TARGET = new THREE.Vector3(-4.0, terrainHeight(-4.0, -5.0), -5.0);

  function createPlateauTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');
    const img = ctx.createImageData(512, 512);
    const d = img.data;
    const tRng = mulberry32(101);
    for (let y = 0; y < 512; y++) {
      for (let x = 0; x < 512; x++) {
        const idx = (y * 512 + x) * 4;
        const n1 = Math.sin(x * 0.049) * Math.cos(y * 0.049);
        const n2 = Math.sin((x + y) * 0.147) * 0.5;
        const grain = (tRng() - 0.5) * 24;
        const moss = smoothstep(-0.3, 0.6, n1 + n2);
        d[idx] = clamp(Math.round(30 + moss * 14 + grain * 0.4), 10, 80);
        d[idx + 1] = clamp(Math.round(37 + moss * 24 + grain * 0.5), 14, 95);
        d[idx + 2] = clamp(Math.round(28 + moss * 10 + grain * 0.35), 10, 75);
        d[idx + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(20, 20);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createBoulderTextures() {
    const albedoCanvas = document.createElement('canvas');
    albedoCanvas.width = 256;
    albedoCanvas.height = 256;
    const actx = albedoCanvas.getContext('2d');

    const oreCanvas = document.createElement('canvas');
    oreCanvas.width = 256;
    oreCanvas.height = 256;
    const octx = oreCanvas.getContext('2d');

    actx.fillStyle = '#20242c';
    actx.fillRect(0, 0, 256, 256);
    octx.fillStyle = '#000000';
    octx.fillRect(0, 0, 256, 256);

    const bRng = mulberry32(777);
    for (let i = 0; i < 650; i++) {
      const px = bRng() * 256;
      const py = bRng() * 256;
      const rad = 2 + bRng() * 14;
      const v = Math.floor(24 + bRng() * 26);
      actx.fillStyle = `rgba(${v},${v + 3},${v + 8},0.22)`;
      actx.beginPath();
      actx.arc(px, py, rad, 0, Math.PI * 2);
      actx.fill();
    }

    for (let c = 0; c < 34; c++) {
      let cx = bRng() * 256;
      let cy = bRng() * 256;
      let ang = bRng() * Math.PI * 2;
      const isOre = c < 18;
      actx.strokeStyle = '#0d1016';
      actx.lineWidth = 1.2 + bRng() * 2.0;
      octx.strokeStyle = isOre ? 'rgba(65, 170, 255, 0.90)' : 'rgba(20, 75, 140, 0.25)';
      octx.lineWidth = isOre ? 1.5 + bRng() * 1.4 : 0.8;
      actx.beginPath();
      octx.beginPath();
      actx.moveTo(cx, cy);
      octx.moveTo(cx, cy);
      const steps = 6 + Math.floor(bRng() * 7);
      for (let s = 0; s < steps; s++) {
        ang += (bRng() - 0.5) * 1.1;
        const len = 8 + bRng() * 16;
        cx += Math.cos(ang) * len;
        cy += Math.sin(ang) * len;
        actx.lineTo(cx, cy);
        octx.lineTo(cx, cy);
      }
      actx.stroke();
      octx.stroke();
    }

    const map = new THREE.CanvasTexture(albedoCanvas);
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.encoding = THREE.sRGBEncoding;

    const emissiveMap = new THREE.CanvasTexture(oreCanvas);
    emissiveMap.wrapS = emissiveMap.wrapT = THREE.RepeatWrapping;
    emissiveMap.encoding = THREE.sRGBEncoding;
    return { map, emissiveMap };
  }

  function createGlyphAtlas() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, 512, 64);
    ctx.font = '800 46px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const cellW = 51.2;
    for (let i = 0; i < 10; i++) {
      const cx = (i + 0.5) * cellW;
      const cy = 34;
      ctx.lineWidth = 6;
      ctx.strokeStyle = 'rgba(0, 0, 0, 0.85)';
      ctx.strokeText(String(i), cx, cy);
      ctx.fillStyle = '#fff3d1';
      ctx.fillText(String(i), cx, cy);
    }
    const tex = new THREE.CanvasTexture(canvas);
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  function createSoftParticleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(220,230,245,0.55)');
    g.addColorStop(1, 'rgba(180,200,220,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
    const tex = new THREE.CanvasTexture(canvas);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  // =========================================================================
  // 4. RENDERER, SCENES, POST-PROCESSING, ENVIRONMENT MAP & LIGHTING
  // =========================================================================
  const canvasEl = document.getElementById('stage');
  const renderer = new THREE.WebGLRenderer({ canvas: canvasEl, antialias: true, alpha: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  const scene = new THREE.Scene();
  const baseFogColor = new THREE.Color(0x131a26);
  const flashFogColor = new THREE.Color(0x526b8c);
  scene.fog = new THREE.FogExp2(0x131a26, 0.0044);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 2000);

  const gl = renderer.getContext();
  const isWebGL2 = renderer.capabilities.isWebGL2;
  const supportsHalfFloatRT = isWebGL2
    ? !!(gl.getExtension('EXT_color_buffer_float') || gl.getExtension('EXT_color_buffer_half_float'))
    : !!(gl.getExtension('OES_texture_half_float') && gl.getExtension('OES_texture_half_float_linear') && gl.getExtension('EXT_color_buffer_half_float'));

  function makeRenderTarget(w, h) {
    return new THREE.WebGLRenderTarget(w, h, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      format: THREE.RGBAFormat,
      type: supportsHalfFloatRT ? THREE.HalfFloatType : THREE.UnsignedByteType,
      depthBuffer: true,
      stencilBuffer: false
    });
  }

  let rtWidth = Math.max(1, Math.floor(window.innerWidth * renderer.getPixelRatio()));
  let rtHeight = Math.max(1, Math.floor(window.innerHeight * renderer.getPixelRatio()));
  let renderTarget = makeRenderTarget(rtWidth, rtHeight);

  const postScene = new THREE.Scene();
  const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMaterial = new THREE.ShaderMaterial({
    toneMapped: false,
    depthTest: false,
    depthWrite: false,
    uniforms: {
      tDiffuse: { value: renderTarget.texture },
      uResolution: { value: new THREE.Vector2(rtWidth, rtHeight) },
      uTraumaSq: { value: 0.0 },
      uExposure: { value: 1.05 },
      uIsHDR: { value: supportsHalfFloatRT ? 1.0 : 0.0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform vec2 uResolution;
      uniform float uTraumaSq;
      uniform float uExposure;
      uniform float uIsHDR;
      varying vec2 vUv;

      vec3 ACESFilmic(vec3 x) {
        x *= 0.6;
        float a = 2.51;
        float b = 0.03;
        float c = 2.43;
        float d = 0.59;
        float e = 0.14;
        return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
      }

      vec3 linearToSRGB(vec3 c) {
        vec3 lo = c * 12.92;
        vec3 hi = 1.055 * pow(max(c, vec3(1e-5)), vec3(1.0 / 2.4)) - 0.055;
        return mix(lo, hi, step(vec3(0.0031308), c));
      }

      void main() {
        vec2 centered = vUv - 0.5;
        float dist = length(centered) * 2.0;
        vec2 dir = dist > 1e-4 ? centered / (dist * 0.5) : vec2(0.0);
        float shiftPx = 6.0 * uTraumaSq * clamp(dist, 0.0, 1.4);
        vec2 offset = (dir * shiftPx) / uResolution;

        float r = texture2D(tDiffuse, clamp(vUv + offset, 0.001, 0.999)).r;
        float g = texture2D(tDiffuse, vUv).g;
        float b = texture2D(tDiffuse, clamp(vUv - offset, 0.001, 0.999)).b;

  (function buildStormEnv() {

  const skyUniforms = {

    side: THREE.BackSide,

    fragmentShader: `
      uniform float uTime;
      uniform float uFlash;
      uniform float uWetness;
      varying vec3 vWorldDir;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }
      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }
      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int i = 0; i < 4; i++) {
          v += a * noise(p);
          p = p * 2.04 + vec2(17.1, 9.2);

      void main() {
        vec3 d = normalize(vWorldDir);
        float elev = max(d.y, 0.015);
        vec2 cloudUv = d.xz / (elev + 0.28) * 1.45 - vec2(uTime * 0.055, uTime * 0.012);
        float c1 = fbm(cloudUv);
        float c2 = fbm(cloudUv * 2.1 - vec2(uTime * 0.09, 0.0));

        vec3 cloudCol = vec3(0.065, 0.095, 0.155);

      }

  });
  const skyMesh = new THREE.Mesh(skyGeo, skyMat);

  const hemiLight = new THREE.HemisphereLight(0x526b92, 0x151822, 0.23);

  // =========================================================================

  const plateauTex = createPlateauTexture();
  const plateauGeo = new THREE.RingGeometry(0.001, 128, 128, 48);

  const MAX_SHOCKWAVES = 16;
  const shockWaveUniformArray = Array.from({ length: MAX_SHOCKWAVES }, () => new THREE.Vector4(0, 0, -999, 0));
  const BOULDER_LAND_SLOTS = 24;
  const boulderLandUniformArray = Array.from({ length: BOULDER_LAND_SLOTS }, () => new THREE.Vector4(0, 0, 999, 0));

  const grassUniforms = {
    uMotionTime: { value: 0 },
    uWetness: { value: 0 },

  (function buildGrass() {
    const segs = 4;
    const positions = [];
    const hFracs = [];
    const normals = [];
    const indices = [];
    for (let s = 0; s < segs; s++) {
      const t = s / segs;
      const w = 0.068 * (1 - t * 0.85);
      const y = t;
      const curveZ = t * t * 0.14;
      positions.push(-w, y, curveZ, w, y, curveZ);
      hFracs.push(t, t);
      normals.push(0, 0.35, 0.94, 0, 0.35, 0.94);
      if (s < segs - 1) {
        const b = s * 2;
        indices.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
      }

    positions.push(0, 1.0, 0.17);
    hFracs.push(1.0);
    normals.push(0, 0.4, 0.92);
    const bLast = (segs - 1) * 2;
    indices.push(bLast, bLast + 1, bLast + 2);

    const instGeo = new THREE.InstancedBufferGeometry();
    instGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    instGeo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    instGeo.setAttribute('aFrac', new THREE.Float32BufferAttribute(hFracs, 1));
    instGeo.setIndex(indices);

    const N = COUNTS.grassBlades;
    const aOffset = new Float32Array(N * 4);
    const aProps = new Float32Array(N * 4);

    for (let i = 0; i < N; i++) {
      let gx, gz;
      if (i < N * 0.52) {
        const ang = rng() * Math.PI * 2;
        const rad = Math.sqrt(rng()) * 88.2;
        gx = Math.cos(ang) * rad;
        gz = Math.sin(ang) * rad;
      } else {
        gx = lerp(-54, 48, rng());
        gz = lerp(-34, 34, rng());
        const r = Math.hypot(gx, gz);
        if (r > 88.2) {
          const s = 87.5 / r;
          gx *= s;
          gz *= s;
        }
      }
      const gy = terrainHeight(gx, gz);
      const base = i * 4;
      aOffset[base] = gx;
      aOffset[base + 1] = gy;
      aOffset[base + 2] = gz;
      aOffset[base + 3] = rng() * Math.PI * 2;

      aProps[base] = lerp(0.40, 0.90, rng());
      aProps[base + 1] = lerp(0.12, 0.36, rng());
      aProps[base + 2] = rng() * Math.PI * 2;

    instGeo.setAttribute('aProps', new THREE.InstancedBufferAttribute(aProps, 4));

    const grassMat = new THREE.ShaderMaterial({
      side: THREE.DoubleSide,
      toneMapped: false,
      uniforms: grassUniforms,
      vertexShader: `
        attribute float aFrac;
        attribute vec4 aOffset;
        attribute vec4 aProps;

        uniform float uMotionTime;
        uniform vec4 uShockwaves[${MAX_SHOCKWAVES}];
        uniform vec4 uSweepState;
        uniform vec4 uBoulderLands[${BOULDER_LAND_SLOTS}];

        varying float vFrac;
        varying float vTint;
        varying vec3 vWorldPos;
        varying vec3 vNormalW;

        void main() {
          float yaw = aOffset.w;
          float height = aProps.x;
          float lean = aProps.y;
          float phase = aProps.z;

          vec3 local = position;
          local.y *= height;
          local.z *= height;

          float c = cos(yaw);
          float s = sin(yaw);
          vec3 rotated = vec3(local.x * c - local.z * s, local.y, local.x * s + local.z * c);
          vec3 rotNorm = normalize(vec3(normal.x * c - normal.z * s, normal.y, normal.x * s + normal.z * c));

          vec3 root = aOffset.xyz;
          float bendW = aFrac * aFrac;

          // Travelling wind sway along +X
          float gust = sin(root.x * 0.13 - uMotionTime * 3.1 + root.z * 0.07) * 0.55
                     + sin(root.x * 0.34 - uMotionTime * 5.8 + phase) * 0.30
                     + 0.45;
          float windPush = (lean + max(0.0, gust) * 0.42) * height;
          rotated.x += windPush * bendW;
          rotated.y -= windPush * 0.22 * bendW;

          // Shockwave radial pushes (30 m/s ring, 4 m front, 1.5 s recovery)
          vec2 shockPush = vec2(0.0);
          float flatten = 0.0;
          for (int i = 0; i < ${MAX_SHOCKWAVES}; i++) {
            vec4 sw = uShockwaves[i];
            float age = uMotionTime - sw.z;
            if (age >= 0.0 && age < 5.0 && sw.w > 0.01) {
              vec2 dXZ = root.xz - sw.xy;
              float dist = length(dXZ);
              float hitTime = dist / 30.0;
              if (age >= hitTime) {
                float sinceHit = age - hitTime;
                float frontEnv = clamp(sinceHit / (4.0 / 30.0), 0.0, 1.0);
                float recEnv = max(0.0, 1.0 - max(0.0, sinceHit - 0.10) / 1.5);
                float maxRange = 18.0 + sw.w * 42.0;
                float distFade = clamp(1.0 - dist / maxRange, 0.0, 1.0);
                float amt = frontEnv * recEnv * distFade * sw.w;
                if (amt > 0.001) {
                  vec2 dir = dist > 0.05 ? dXZ / dist : vec2(1.0, 0.0);
                  shockPush += dir * amt;
                  flatten = max(flatten, amt);
                }
              }
            }
          }

          // Left-arm sweep flattening path (18.500 - 19.300, unwrapped clockwise +1.03 -> +3.93 rad)
          if (uMotionTime >= 18.5 && uMotionTime <= 21.0) {
            vec2 swPt = root.xz - uSweepState.xy;
            float rArm = length(swPt);
            if (rArm > 4.0 && rArm < 18.5) {
              float ang = atan(swPt.y, swPt.x);
              float angUnwrapped = ang < -0.5 ? ang + 6.283185 : ang;
              float angNorm = (angUnwrapped - 1.0) / 3.0;
              if (angNorm >= 0.0 && angNorm <= 1.05) {
                float passTime = 18.5 + angNorm * 0.8;
                if (uMotionTime >= passTime) {
                  float sAge = uMotionTime - passTime;
                  float sRec = max(0.0, 1.0 - sAge / 1.5);
                  vec2 sDir = normalize(vec2(-swPt.y, swPt.x) + swPt * 0.35);
                  shockPush += sDir * sRec * 0.92;
                  flatten = max(flatten, sRec * 0.95);
                }
              }
            }
          }

          // Fallen collapse boulders keep grass beneath/around them permanently flattened
          for (int i = 0; i < ${BOULDER_LAND_SLOTS}; i++) {
            vec4 bl = uBoulderLands[i];
            if (uMotionTime >= bl.z && bl.w > 0.1) {
              vec2 dB = root.xz - bl.xy;
              float distB = length(dB);
              if (distB < bl.w * 1.45) {
                float bAmt = smoothstep(bl.w * 1.45, bl.w * 0.4, distB);
                vec2 bDir = distB > 0.05 ? dB / distB : vec2(1.0, 0.0);
                shockPush += bDir * bAmt * 0.95;
                flatten = max(flatten, bAmt * 0.95);
              }
            }
          }

          if (flatten > 0.001) {
            float pushLen = length(shockPush);
            vec2 pDir = pushLen > 1e-4 ? shockPush / pushLen : vec2(1.0, 0.0);
            float fClamped = clamp(flatten, 0.0, 0.95);
            rotated.xz += pDir * (aFrac * height * 0.92 * fClamped);
            rotated.y *= (1.0 - 0.86 * fClamped * aFrac);
          }

          vec3 worldPos = root + rotated;
          vFrac = aFrac;
          vTint = aProps.w;
          vWorldPos = worldPos;
          vNormalW = normalize(mix(rotNorm, vec3(0.0, 1.0, 0.0), 0.35 + 0.5 * flatten));

          gl_Position = projectionMatrix * viewMatrix * vec4(worldPos, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uWetness;
        uniform float uSkyFlash;
        uniform vec3 uFogColor;
        uniform float uFogDensity;
        uniform vec3 uLightDir;
        uniform vec3 uArcPos[4];
        uniform vec4 uArcStrength;

        varying float vFrac;
        varying float vTint;
        varying vec3 vWorldPos;
        varying vec3 vNormalW;

        void main() {
          vec3 rootCol = mix(vec3(0.025, 0.055, 0.028), vec3(0.038, 0.075, 0.032), vTint);
          vec3 tipCol = mix(vec3(0.085, 0.165, 0.065), vec3(0.125, 0.215, 0.088), vTint);
          vec3 albedo = mix(rootCol, tipCol, smoothstep(0.15, 0.95, vFrac));
          albedo *= mix(1.0, 0.68, uWetness);

          vec3 N = normalize(vNormalW);
          vec3 V = normalize(cameraPosition - vWorldPos);
          float ndl = max(dot(N, uLightDir), 0.0);
          float wrap = max(0.0, dot(N, uLightDir) * 0.5 + 0.5);

          vec3 lit = albedo * (vec3(0.04, 0.055, 0.08) + vec3(0.45, 0.60, 0.85) * (0.28 * wrap + 0.65 * ndl));
          lit += albedo * vec3(0.48, 0.68, 1.0) * uSkyFlash * 0.85;

          for (int i = 0; i < 4; i++) {
            float st = i == 0 ? uArcStrength.x : (i == 1 ? uArcStrength.y : (i == 2 ? uArcStrength.z : uArcStrength.w));
            if (st > 0.01) {
              vec3 dL = uArcPos[i] - vWorldPos;
              float d2 = dot(dL, dL);
              float atten = st / (1.0 + d2 * 0.018);
              lit += albedo * vec3(0.32, 0.72, 1.35) * atten * 1.4;
              vec3 H = normalize(normalize(dL) + V);
              float spec = pow(max(dot(N, H), 1e-4), mix(12.0, 48.0, uWetness));
              lit += vec3(0.35, 0.75, 1.3) * spec * atten * (0.1 + 0.55 * uWetness);
            }
          }

          vec3 Hk = normalize(uLightDir + V);
          float kSpec = pow(max(dot(N, Hk), 1e-4), mix(10.0, 52.0, uWetness));
          lit += vec3(0.5, 0.65, 0.9) * kSpec * (0.04 + 0.38 * uWetness) * vFrac;

          float dist = length(cameraPosition - vWorldPos);
          float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
          lit = mix(lit, uFogColor, clamp(fogFactor, 0.0, 1.0));

          gl_FragColor = vec4(lit, 1.0);
        }
      `
    });

    const grassMesh = new THREE.Mesh(instGeo, grassMat);
    grassMesh.frustumCulled = false;
    scene.add(grassMesh);
  })();

  const rainUniforms = {
    uMotionTime: { value: 0 },
    uCamPos: { value: new THREE.Vector3() },
    uSkyFlash: { value: 0 }
  };
  (function buildRain() {
    const N = COUNTS.rainStreaks;
    const baseGeo = new THREE.PlaneGeometry(0.018, 1.45);
    const instGeo = new THREE.InstancedBufferGeometry();
    instGeo.setAttribute('position', baseGeo.attributes.position);
    instGeo.setAttribute('uv', baseGeo.attributes.uv);
    instGeo.setIndex(baseGeo.index);

    const aSeed = new Float32Array(N * 4);
    for (let i = 0; i < N; i++) {
      aSeed[i * 4] = rng() * 76 - 38;
      aSeed[i * 4 + 1] = rng() * 42;
      aSeed[i * 4 + 2] = rng() * 76 - 38;
      aSeed[i * 4 + 3] = 0.75 + rng() * 0.6;
    }
    instGeo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(aSeed, 4));
    instGeo.instanceCount = N;

    const rainMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      toneMapped: false,
      uniforms: rainUniforms,
      vertexShader: `
        attribute vec4 aSeed;
        uniform float uMotionTime;
        uniform vec3 uCamPos;
        varying vec2 vUv;
        varying float vVis;

        void main() {
          vUv = uv;
          vec3 vel = vec3(14.0, -24.25, 0.0);
          vec3 box = vec3(76.0, 42.0, 76.0);
          vec3 minB = vec3(uCamPos.x - 38.0, 0.0, uCamPos.z - 38.0);
          vec3 rel = mod(aSeed.xyz + vel * uMotionTime - minB, box) + minB;

          vec3 dir = normalize(vel);
          vec3 toCam = normalize(cameraPosition - rel);
          vec3 side = normalize(cross(dir, toCam));

        uniform float uSkyFlash;
        varying vec2 vUv;
        varying float vVis;

          float alpha = fadeY * vVis * (0.20 + 0.25 * uSkyFlash);
          gl_FragColor = vec4(vec3(0.55, 0.72, 0.95) * alpha, alpha);
        }
      `
    });
    const rainMesh = new THREE.Mesh(instGeo, rainMat);
    rainMesh.frustumCulled = false;
    scene.add(rainMesh);

    const S = 550;
    const sBase = new THREE.PlaneGeometry(1, 1);
    sBase.rotateX(-Math.PI / 2);
    const sGeo = new THREE.InstancedBufferGeometry();
    sGeo.setAttribute('position', sBase.attributes.position);
    sGeo.setAttribute('uv', sBase.attributes.uv);
    sGeo.setIndex(sBase.index);
    const sSeed = new Float32Array(S * 4);
    for (let i = 0; i < S; i++) {
      sSeed[i * 4] = rng() * 34 - 17;
      sSeed[i * 4 + 1] = rng() * 34 - 17;
      sSeed[i * 4 + 2] = rng();
      sSeed[i * 4 + 3] = 2.6 + rng() * 1.6;

    const sMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      toneMapped: false,
      uniforms: rainUniforms,
      vertexShader: `
        attribute vec4 aSplash;
        uniform float uMotionTime;
        uniform vec3 uCamPos;
        varying vec2 vUv;
        varying float vPhase;

        void main() {
          vUv = uv;

          vec2 jitter = vec2(sin(cellIdx * 12.989 + aSplash.x), cos(cellIdx * 78.233 + aSplash.y)) * 1.5;

          float r = length(xz);
          float h = 0.24 * sin(xz.x * 0.055 + 0.4) * cos(xz.y * 0.052 - 0.2)
                  + 0.16 * sin((xz.x + xz.y) * 0.095 + 1.1)
                  + 0.11 * cos((xz.x - xz.y) * 0.14 - 0.7);

          vPhase = (1.0 - cyc) * step(r, 89.0);

      `,
      fragmentShader: `
        varying vec2 vUv;
        varying float vPhase;
        void main() {
          float d = length(vUv - 0.5) * 2.0;
          float ring = smoothstep(0.65, 0.85, d) * (1.0 - smoothstep(0.85, 1.0, d));
          float a = ring * vPhase * 0.38;
          gl_FragColor = vec4(vec3(0.6, 0.78, 1.0) * a, a);
        }
      `
    });
    const splashMesh = new THREE.Mesh(sGeo, sMat);
    splashMesh.frustumCulled = false;
    scene.add(splashMesh);
  })();

  // =========================================================================
  // 6. TITAN SKELETON (16 NAMED BONES), IK, BOULDERS, WEAK POINTS, LIGHTNING
  // =========================================================================
  const BONE_NAMES = [
    'pelvis', 'spine', 'chest', 'head',
    'upperArmL', 'forearmL', 'fistL',
    'upperArmR', 'forearmR', 'fistR',
    'thighL', 'shinL', 'footL',
    'thighR', 'shinR', 'footR'
  ];
  const BONE_INDEX = {};
  BONE_NAMES.forEach((n, i) => { BONE_INDEX[n] = i; });

  const BONE_GROUP = {
    pelvis: 'pelvis',
    spine: 'spine',
    chest: 'chest',
    head: 'head',
    upperArmL: 'arms', forearmL: 'arms', fistL: 'arms',
    upperArmR: 'arms', forearmR: 'arms', fistR: 'arms',
    thighL: 'legs', shinL: 'legs', footL: 'legs',
    thighR: 'legs', shinR: 'legs', footR: 'legs'
  };

  const _vA = new THREE.Vector3();
  const _vB = new THREE.Vector3();
  const _vC = new THREE.Vector3();
  const _vD = new THREE.Vector3();
  const _qA = new THREE.Quaternion();
  const _mA = new THREE.Matrix4();
  const _upY = new THREE.Vector3(0, 1, 0);

  function solveTwoBoneIK(root, target, l1, l2, bendHint, outJoint, outEnd) {
    _vA.subVectors(target, root);
    let dist = _vA.length();
    const minD = Math.abs(l1 - l2) + 0.05;
    const maxD = (l1 + l2) - 0.05;
    if (dist < 1e-4) _vA.set(0, -1, 0);
    else _vA.multiplyScalar(1 / dist);
    dist = clamp(dist, minD, maxD);

    outEnd.copy(root).addScaledVector(_vA, dist);

    const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
    const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));

    _vB.copy(bendHint).addScaledVector(_vA, -bendHint.dot(_vA));
    if (_vB.lengthSq() < 1e-6) _vB.set(0, 0, 1);
    _vB.normalize();

    outJoint.copy(root)
      .addScaledVector(_vA, l1 * cosA)
      .addScaledVector(_vB, l1 * sinA);
  }

  function quatFromSegment(pStart, pEnd, upRef, outQuat) {
    const dir = _vC.subVectors(pEnd, pStart);
    if (dir.lengthSq() < 1e-8) {
      outQuat.identity();
      return;
    }
    dir.normalize();
    const xAxis = _vD.crossVectors(upRef, dir);
    if (xAxis.lengthSq() < 1e-6) {
      xAxis.set(1, 0, 0).cross(dir);
    }
    xAxis.normalize();
    const zAxis = _vB.crossVectors(xAxis, dir).normalize();
    _mA.makeBasis(xAxis, dir, zAxis);
    outQuat.setFromRotationMatrix(_mA);
  }

  function createPoseState() {
    return {
      bones: BONE_NAMES.map(() => ({
        start: new THREE.Vector3(),
        end: new THREE.Vector3(),
        center: new THREE.Vector3(),
        quat: new THREE.Quaternion(),
        charge: 1.0,
        radius: 2.2
      })),
      weakPoints: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()],
      pelvisGround: new THREE.Vector3(),
      chestPartAmount: 0
    };
  }

  function evaluateTitanPose(t, outPose) {
    let px = 40;
    let pz = 0;
    let py = 17.8;
    let torsoPitch = 0.06;
    let torsoYaw = 0;
    let torsoRoll = 0;
    let headPitch = 0.08;

    const footPosL = new THREE.Vector3();
    const footPosR = new THREE.Vector3();
    const stepHeight = 2.6;

    if (t < 6.0) {
      px = 40 - 4 * t;
      const ffTimes = [1.0, 2.5, 4.0, 5.5];
      let sink = 0;
      let swayZ = 0;
      for (let i = 0; i < ffTimes.length; i++) {
        const dt = t - ffTimes[i];
        if (dt >= 0 && dt < 0.7) {
          const p = Math.sin(Math.min(1, dt / 0.25) * Math.PI * 0.5) * Math.exp(-dt * 3.8);
          sink += p * 1.45;
          swayZ += (i % 2 === 0 ? 1 : -1) * p * 1.1;
        }
      }
      py = 17.6 - sink;
      pz = swayZ + 0.55 * Math.sin(t * Math.PI / 1.5);
      torsoYaw = 0.18 * Math.sin(t * Math.PI / 1.5 - 0.2);
      torsoRoll = 0.08 * Math.sin(t * Math.PI / 1.5);

      if (t < 1.0) {
        const u = easeInOutCubic(t / 1.0);
        footPosL.set(lerp(42.5, 33.5, u), Math.sin(u * Math.PI) * stepHeight, 4.1);
      } else if (t < 2.6) {
        footPosL.set(33.5, 0, 4.1);
      } else if (t < 4.0) {
        const u = easeInOutCubic((t - 2.6) / 1.4);
        footPosL.set(lerp(33.5, 21.5, u), Math.sin(u * Math.PI) * stepHeight, 4.1);
      } else if (t < 5.5) {
        footPosL.set(21.5, 0, 4.1);
      } else {
        const u = easeInOutCubic((t - 5.5) / 0.5);
        footPosL.set(lerp(21.5, 16.2, u), Math.sin(u * Math.PI) * 1.4, 4.2);
      }

      if (t < 1.1) {
        footPosR.set(37.5, 0, -4.1);
      } else if (t < 2.5) {
        const u = easeInOutCubic((t - 1.1) / 1.4);
        footPosR.set(lerp(37.5, 27.5, u), Math.sin(u * Math.PI) * stepHeight, -4.1);
      } else if (t < 4.1) {
        footPosR.set(27.5, 0, -4.1);
      } else if (t < 5.5) {
        const u = easeInOutCubic((t - 4.1) / 1.4);
        footPosR.set(lerp(27.5, 15.5, u), Math.sin(u * Math.PI) * stepHeight, -4.2);
      } else {
        footPosR.set(15.5, 0, -4.2);
      }
    } else {
      px = 16.0;
      footPosL.set(16.2, 0, 4.2);
      footPosR.set(15.5, 0, -4.2);

      if (t < 7.5) {
        const u = smoothstep(6.0, 7.2, t);
        const slam = smoothstep(7.2, 7.5, t);
        py = lerp(17.6, 18.4, u) - slam * 5.8;
        torsoPitch = lerp(0.06, -0.20, u) + slam * 0.92;
        torsoYaw = lerp(0, -0.45, u) + slam * 0.85;
      } else if (t < 10.5) {
        const rec = smoothstep(7.5, 8.0, t) * 0.6;
        py = 12.6 + rec;
        torsoPitch = 0.74 - rec * 0.05;
        torsoYaw = 0.40;
      } else if (t < 12.0) {
        const u = easeInOutCubic((t - 10.5) / 1.5);
        py = lerp(13.2, 17.8, u);
        torsoPitch = lerp(0.70, -0.05, u);
        torsoYaw = lerp(0.40, -0.22, u);
      } else if (t < 16.0) {
        const drop = smoothstep(12.0, 13.0, t);
        const rise = smoothstep(15.0, 16.0, t);
        const k = drop * (1 - rise);
        px = 16.0 + k * 2.4;
        py = lerp(17.8, 10.8, k);
        torsoPitch = lerp(0.05, 0.42, k) - smoothstep(12.0, 12.4, t) * (1 - smoothstep(12.4, 13.0, t)) * 0.35;
        headPitch = 0.08 + k * 0.55;
        footPosL.set(16.2 + k * 5.5, k * 1.4, 4.2);
      } else if (t < 19.3) {
        const wu = smoothstep(17.0, 18.5, t);
        const sw = smoothstep(18.5, 19.3, t);
        py = 17.6 - wu * 1.6 - Math.sin(sw * Math.PI) * 3.8;
        torsoPitch = 0.06 + wu * 0.15 + Math.sin(sw * Math.PI) * 0.42;
        torsoYaw = wu * 0.72 - sw * 1.45;
      } else if (t < 22.5) {
        const rec = smoothstep(19.3, 21.0, t);
        py = lerp(16.0, 17.8, rec);
        torsoPitch = lerp(0.25, 0.08, rec);
        torsoYaw = lerp(-0.73, 0.0, rec);
      } else if (t < 29.7) {
        const skyHit = smoothstep(25.0, 25.25, t) * (1 - smoothstep(25.35, 26.2, t));
        const s1 = smoothstep(27.0, 27.15, t) * (1 - smoothstep(27.2, 27.8, t));
        const s2 = smoothstep(29.5, 29.7, t);
        py = 17.8 - skyHit * 0.6 - s1 * 0.5 - s2 * 0.8;
        torsoPitch = 0.08 - skyHit * 0.25 + s1 * 0.18 - s2 * 0.22;
        headPitch = 0.08 - skyHit * 0.48;
        torsoYaw = 0.05 * Math.sin(t * 1.8);
      } else {
        const slump = smoothstep(29.7, 32.6, t);
        px = 16.0 + slump * 2.8;
        py = 17.0 - slump * 5.2;
        torsoPitch = -0.14 + slump * 0.68;
        headPitch = 0.2 + slump * 0.5;
      }
    }

    footPosL.y += terrainHeight(footPosL.x, footPosL.z) + 0.55;
    footPosR.y += terrainHeight(footPosR.x, footPosR.z) + 0.55;
    outPose.pelvisGround.set(px, terrainHeight(px, pz), pz);

    const pelvisPos = new THREE.Vector3(px, terrainHeight(px, pz) + py, pz);
    const spineStart = pelvisPos.clone().add(new THREE.Vector3(0, 1.2, 0));

    const torsoEuler = new THREE.Euler(torsoRoll, torsoYaw, torsoPitch, 'YXZ');
    const torsoQuat = new THREE.Quaternion().setFromEuler(torsoEuler);
    const fwdDir = new THREE.Vector3(-1, 0, 0).applyQuaternion(torsoQuat).normalize();
    const upDir = new THREE.Vector3(0, 1, 0).applyQuaternion(torsoQuat).normalize();
    const leftDir = new THREE.Vector3(0, 0, 1).applyQuaternion(torsoQuat).normalize();

    const spineEnd = spineStart.clone().addScaledVector(upDir, 4.6);
    const chestStart = spineEnd.clone();
    const chestEnd = chestStart.clone().addScaledVector(upDir, 6.2);
    const neckPos = chestEnd.clone().addScaledVector(upDir, 1.0);
    const headEnd = neckPos.clone().addScaledVector(
      new THREE.Vector3(-Math.sin(headPitch), Math.cos(headPitch), 0).applyQuaternion(torsoQuat).normalize(),
      4.5
    );

    const shoulderL = chestStart.clone().addScaledVector(upDir, 4.8).addScaledVector(leftDir, 8.0);
    const shoulderR = chestStart.clone().addScaledVector(upDir, 4.8).addScaledVector(leftDir, -8.0);
    const hipL = pelvisPos.clone().addScaledVector(leftDir, 3.6).add(new THREE.Vector3(0, -0.5, 0));
    const hipR = pelvisPos.clone().addScaledVector(leftDir, -3.6).add(new THREE.Vector3(0, -0.5, 0));

    const handTargetL = new THREE.Vector3();
    const handTargetR = new THREE.Vector3();

    if (t < 6.0) {
      const phaseL = Math.sin((t - 0.25) * Math.PI / 1.5);
      const phaseR = -phaseL;
      handTargetL.copy(shoulderL).addScaledVector(upDir, -14.2).addScaledVector(fwdDir, 3.8 * phaseL).addScaledVector(leftDir, 1.6);
      handTargetR.copy(shoulderR).addScaledVector(upDir, -14.2).addScaledVector(fwdDir, 3.8 * phaseR).addScaledVector(leftDir, -1.6);
    } else if (t < 7.5) {
      const u = smoothstep(6.0, 7.2, t);
      const slam = smoothstep(7.2, 7.5, t);
      const raised = shoulderR.clone().add(new THREE.Vector3(3.0, 12.5, -2.5));
      const restR = shoulderR.clone().addScaledVector(upDir, -14.0).addScaledVector(fwdDir, 2.0);
      const slamEnd = SLAM_TARGET.clone().add(new THREE.Vector3(0, 1.4, 0));
      if (t < 7.2) handTargetR.lerpVectors(restR, raised, u);
      else handTargetR.lerpVectors(raised, slamEnd, slam * slam);

      handTargetL.copy(shoulderL).addScaledVector(upDir, -13.5).addScaledVector(fwdDir, -2.5).addScaledVector(leftDir, 2.5);
    } else if (t < 10.5) {
      handTargetR.copy(SLAM_TARGET).add(new THREE.Vector3(0, 1.4, 0));
      handTargetL.copy(shoulderL).addScaledVector(upDir, -12.5).addScaledVector(fwdDir, -2.0).addScaledVector(leftDir, 2.5);
    } else if (t < 12.0) {
      const u = easeInOutCubic((t - 10.5) / 1.5);
      const planted = SLAM_TARGET.clone().add(new THREE.Vector3(0, 1.4, 0));
      const lifted = new THREE.Vector3(12.5, 29.0, -10.5);
      handTargetR.lerpVectors(planted, lifted, u);
      handTargetL.copy(shoulderL).addScaledVector(upDir, -13.5).addScaledVector(leftDir, 2.0);
    } else if (t < 16.0) {
      const k = smoothstep(12.0, 13.0, t) * (1 - smoothstep(15.0, 16.0, t));
      handTargetL.copy(shoulderL).add(new THREE.Vector3(-3.0, -13.5 + k * 2.0, 2.5));
      handTargetR.copy(shoulderR).add(new THREE.Vector3(-2.5, -13.0 + k * 2.0, -2.5));
    } else if (t < 19.3) {
      const wu = smoothstep(17.0, 18.5, t);
      const sw = smoothstep(18.5, 19.3, t);
      const restL = shoulderL.clone().add(new THREE.Vector3(-2.0, -14.0, 2.2));
      const cockedL = new THREE.Vector3(24.0, 5.5, 13.5);
      if (t < 18.5) {
        handTargetL.lerpVectors(restL, cockedL, wu);
      } else {
        const ang = lerp(1.15, -2.15, sw);
        const rad = 14.5;
        handTargetL.set(16.0 - Math.sin(ang + 1.2) * rad * 0.85, 2.0 + Math.pow(Math.abs(sw - 0.55) * 2, 2) * 2.5, Math.sin(ang) * rad);
        if (t >= 18.8 && t <= 19.2) {
          const k = 1 - Math.abs(t - 19.0) / 0.2;
          handTargetL.lerp(new THREE.Vector3(5.5, 1.9, 1.0), k * 0.9);
        }
      }
      handTargetR.copy(shoulderR).addScaledVector(upDir, -13.5).addScaledVector(fwdDir, -3.0 * wu).addScaledVector(leftDir, -2.2);
    } else if (t < 22.5) {
      const rec = smoothstep(19.3, 21.5, t);
      const endSweep = new THREE.Vector3(4.0, 4.5, -12.0);
      const guardL = shoulderL.clone().add(new THREE.Vector3(-3.0, -12.0, 2.5));
      handTargetL.lerpVectors(endSweep, guardL, rec);
      handTargetR.copy(shoulderR).add(new THREE.Vector3(-3.0, -12.5, -2.5));
    } else {
      const flinch = Math.sin(t * 2.2) * 1.4;
      handTargetL.copy(shoulderL).add(new THREE.Vector3(-4.5, -10.5 + flinch, 3.0));
      handTargetR.copy(shoulderR).add(new THREE.Vector3(-4.5, -10.5 - flinch, -3.0));
    }

    const kneeL = new THREE.Vector3();
    const ankleL = new THREE.Vector3();
    const kneeR = new THREE.Vector3();
    const ankleR = new THREE.Vector3();
    const kneeHintL = fwdDir.clone().addScaledVector(leftDir, 0.25);
    const kneeHintR = fwdDir.clone().addScaledVector(leftDir, -0.25);
    solveTwoBoneIK(hipL, footPosL, 8.8, 8.2, kneeHintL, kneeL, ankleL);
    solveTwoBoneIK(hipR, footPosR, 8.8, 8.2, kneeHintR, kneeR, ankleR);

    if (t >= 12.2 && t < 15.8) {
      const k = smoothstep(12.2, 13.0, t) * (1 - smoothstep(15.0, 15.8, t));
      const groundKnee = new THREE.Vector3(13.5, terrainHeight(13.5, 4.2) + 1.2, 4.2);
      kneeL.lerp(groundKnee, k * 0.9);
    }

    const elbowL = new THREE.Vector3();
    const wristL = new THREE.Vector3();
    const elbowR = new THREE.Vector3();
    const wristR = new THREE.Vector3();
    const armHintL = new THREE.Vector3(0.8, 0.2, 0.7).applyQuaternion(torsoQuat);
    const armHintR = new THREE.Vector3(0.8, 0.2, -0.7).applyQuaternion(torsoQuat);
    solveTwoBoneIK(shoulderL, handTargetL, 7.5, 7.2, armHintL, elbowL, wristL);
    solveTwoBoneIK(shoulderR, handTargetR, 7.5, 7.2, armHintR, elbowR, wristR);

    const fistEndL = wristL.clone().addScaledVector(_vA.subVectors(wristL, elbowL).normalize(), 2.4);
    const fistEndR = wristR.clone().addScaledVector(_vA.subVectors(wristR, elbowR).normalize(), 2.4);
    const footTipL = ankleL.clone().add(new THREE.Vector3(-2.6, -0.35, 0));
    const footTipR = ankleR.clone().add(new THREE.Vector3(-2.6, -0.35, 0));

    function setBone(idx, p0, p1, upHint, radius, charge) {
      const b = outPose.bones[idx];
      b.start.copy(p0);
      b.end.copy(p1);
      b.center.lerpVectors(p0, p1, 0.5);
      quatFromSegment(p0, p1, upHint, b.quat);
      b.radius = radius;
      b.charge = charge;
    }

    let baseCharge = 1.0;
    if (t >= 12.0 && t < 16.0) {
      baseCharge = lerp(0.4, 1.0, smoothstep(15.0, 16.0, t));
    }
    const rightArmCharge = (t >= 6.0 && t <= 7.8) ? 1.6 : baseCharge;
    const leftArmCharge = (t >= 17.0 && t <= 19.5) ? 1.6 : baseCharge;

    function boneCharge(name, nominal) {
      const rel = COLLAPSE_GROUPS[BONE_GROUP[name]];
      return t >= rel ? 0.0 : nominal;
    }

    setBone(BONE_INDEX.pelvis, pelvisPos.clone().add(new THREE.Vector3(0, -1.2, 0)), pelvisPos.clone().add(new THREE.Vector3(0, 1.4, 0)), fwdDir, 3.6, boneCharge('pelvis', baseCharge));
    setBone(BONE_INDEX.spine, spineStart, spineEnd, fwdDir, 3.3, boneCharge('spine', baseCharge));
    setBone(BONE_INDEX.chest, chestStart, chestEnd, fwdDir, 4.4, boneCharge('chest', baseCharge));
    setBone(BONE_INDEX.head, neckPos, headEnd, fwdDir, 2.4, boneCharge('head', baseCharge));

    setBone(BONE_INDEX.upperArmL, shoulderL, elbowL, upDir, 2.1, boneCharge('upperArmL', leftArmCharge));
    setBone(BONE_INDEX.forearmL, elbowL, wristL, upDir, 1.9, boneCharge('forearmL', leftArmCharge));
    setBone(BONE_INDEX.fistL, wristL, fistEndL, upDir, 2.2, boneCharge('fistL', leftArmCharge));

    setBone(BONE_INDEX.upperArmR, shoulderR, elbowR, upDir, 2.1, boneCharge('upperArmR', rightArmCharge));
    setBone(BONE_INDEX.forearmR, elbowR, wristR, upDir, 1.9, boneCharge('forearmR', rightArmCharge));
    setBone(BONE_INDEX.fistR, wristR, fistEndR, upDir, 2.2, boneCharge('fistR', rightArmCharge));

    setBone(BONE_INDEX.thighL, hipL, kneeL, fwdDir, 2.5, boneCharge('thighL', baseCharge));
    setBone(BONE_INDEX.shinL, kneeL, ankleL, fwdDir, 2.0, boneCharge('shinL', baseCharge));
    setBone(BONE_INDEX.footL, ankleL, footTipL, upDir, 1.8, boneCharge('footL', baseCharge));

    setBone(BONE_INDEX.thighR, hipR, kneeR, fwdDir, 2.5, boneCharge('thighR', baseCharge));
    setBone(BONE_INDEX.shinR, kneeR, ankleR, fwdDir, 2.0, boneCharge('shinR', baseCharge));
    setBone(BONE_INDEX.footR, ankleR, footTipR, upDir, 1.8, boneCharge('footR', baseCharge));

    outPose.weakPoints[0].copy(kneeL).addScaledVector(fwdDir, 1.15).addScaledVector(leftDir, 1.05);
    outPose.weakPoints[1].copy(shoulderR).addScaledVector(fwdDir, 1.25).addScaledVector(upDir, 1.05).addScaledVector(leftDir, -0.9);
    outPose.weakPoints[2].copy(chestStart).addScaledVector(upDir, 3.2).addScaledVector(fwdDir, 2.4);

    outPose.chestPartAmount = smoothstep(25.0, 25.45, t);
  }

  const titanPose = createPoseState();
  const titanPosePrev = createPoseState();

  const wpGroup = new THREE.Group();
  scene.add(wpGroup);
  const wpGeo = new THREE.SphereGeometry(0.6, 20, 16);
  const wpMaterials = [0, 1, 2].map(() => new THREE.MeshStandardMaterial({
    color: 0xffaa22,
    emissive: 0xff8800,
    emissiveIntensity: 3.2,
    roughness: 0.3,
    metalness: 0.1
  }));
  const wpMeshes = wpMaterials.map((mat) => {
    const m = new THREE.Mesh(wpGeo, mat);
    wpGroup.add(m);
    return m;
  });
  const wpLights = [0, 1, 2].map(() => {
    const l = new THREE.PointLight(0xff9922, 1.8, 12, 1.8);
    scene.add(l);
    return l;
  });

  const { map: boulderAlbedoMap, emissiveMap: boulderOreMap } = createBoulderTextures();

  function createBoulderMaterial() {
    const mat = new THREE.MeshStandardMaterial({
      map: boulderAlbedoMap,
      emissiveMap: boulderOreMap,
      emissive: new THREE.Color(0x2884ff),
      emissiveIntensity: 1.0,
      color: 0xffffff,
      roughness: 0.9,
      metalness: 0.08,
      envMapIntensity: 0.3
    });
    mat.onBeforeCompile = (shader) => {
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nattribute float aOreGlow;\nvarying float vOreGlow;')
        .replace('#include <begin_vertex>', '#include <begin_vertex>\nvOreGlow = aOreGlow;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying float vOreGlow;')
        .replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance *= vOreGlow;');
    };
    return mat;
  }

  function makeIrregularRockGeo(seedIdx) {
    const gRng = mulberry32(4200 + seedIdx * 97);
    const geo = new THREE.IcosahedronGeometry(0.5, 1);
    const pos = geo.attributes.position;
    const dirs = [];
    for (let k = 0; k < 6; k++) {
      dirs.push(new THREE.Vector3(gRng() * 2 - 1, gRng() * 2 - 1, gRng() * 2 - 1).normalize());
    }
    for (let i = 0; i < pos.count; i++) {
      const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
      const n = v.clone().normalize();
      let disp = 0.85;
      for (let k = 0; k < dirs.length; k++) {
        disp += 0.16 * Math.abs(n.dot(dirs[k]));
      }
      v.multiplyScalar(disp);
      v.y *= 0.88;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return geo;
  }

  const boulderVariants = [0, 1, 2, 3].map((v) => {
    const geo = makeIrregularRockGeo(v);
    const oreAttr = new THREE.InstancedBufferAttribute(new Float32Array(36).fill(1.0), 1);
    geo.setAttribute('aOreGlow', oreAttr);
    const mat = createBoulderMaterial();
    const mesh = new THREE.InstancedMesh(geo, mat, 36);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
    return { mesh, mat, oreAttr, count: 0 };
  });

  const BONE_BOULDER_COUNTS = {
    pelvis: 11, spine: 10, chest: 12, head: 8,
    upperArmL: 8, forearmL: 8, fistL: 8,
    upperArmR: 8, forearmR: 8, fistR: 8,
    thighL: 10, shinL: 10, footL: 7,
    thighR: 10, shinR: 10, footR: 8
  };

  const boulders = [];
  const restPose = createPoseState();
  evaluateTitanPose(0, restPose);

  (function initBoulders() {
    let idx = 0;
    const coverOffsets = [
      new THREE.Vector3(-3.35, 0.15, 0.0),
      new THREE.Vector3(-2.75, 1.35, -1.25),
      new THREE.Vector3(-2.75, 1.35, 1.25),
      new THREE.Vector3(-2.75, -1.15, -1.25),
      new THREE.Vector3(-2.75, -1.15, 1.25)
    ];
    for (let bi = 0; bi < BONE_NAMES.length; bi++) {
      const name = BONE_NAMES[bi];
      const count = BONE_BOULDER_COUNTS[name];
      const bone = restPose.bones[bi];
      const boneLen = bone.start.distanceTo(bone.end);
      const localPlaced = [];

      for (let k = 0; k < count; k++) {
        const variantIdx = idx % 4;
        const slotIdx = boulderVariants[variantIdx].count++;
        const isChestCover = (name === 'chest' && k < 5);

        const baseScale = isChestCover
          ? (k === 0 ? 2.15 : lerp(1.65, 2.05, rng()))
          : (name === 'pelvis' || name === 'chest' || name === 'spine' || name === 'thighL' || name === 'thighR')
            ? lerp(1.5, 3.4, rng())
            : lerp(1.1, 2.5, rng());
        const sx = baseScale * lerp(0.85, 1.20, rng());
        const sy = baseScale * lerp(0.80, 1.15, rng());
        const sz = baseScale * lerp(0.85, 1.20, rng());
        const effRadius = Math.max(sx, sy, sz) * 0.50;

        const localPos = new THREE.Vector3();
        if (isChestCover) {
          localPos.copy(coverOffsets[k]).applyQuaternion(bone.quat.clone().invert());
        } else {
          for (let attempt = 0; attempt < 60; attempt++) {
            const ang = (k / count) * Math.PI * 2 + rng() * 0.9;
            const along = lerp(-boneLen * 0.42, boneLen * 0.42, (k + rng() * 0.7) / count);
            const radial = bone.radius * lerp(0.65, 1.25, rng());
            localPos.set(Math.cos(ang) * radial, along, Math.sin(ang) * radial);
            if (name === 'chest' && localPos.z < -0.5) localPos.z = Math.abs(localPos.z);

            let ok = true;
            for (let j = 0; j < localPlaced.length; j++) {
              const other = localPlaced[j];
              if (localPos.distanceTo(other.localPos) < effRadius + other.effRadius + 0.36) {
                ok = false;
                break;
              }
            }
            if (ok) break;
          }
        }
        localPlaced.push({ localPos: localPos.clone(), effRadius });

        const quat = new THREE.Quaternion().setFromEuler(
          new THREE.Euler(rng() * Math.PI * 2, rng() * Math.PI * 2, rng() * Math.PI * 2)
        );
        const rotAxis = new THREE.Vector3(rng() * 2 - 1, rng() * 2 - 1, rng() * 2 - 1).normalize();
        const partDir = isChestCover
          ? new THREE.Vector3(k === 0 ? 1.0 : (localPos.x >= 0 ? 1 : -1), k === 0 ? 0.65 : localPos.y * 0.45 + 0.15, 0).normalize()
          : null;

        boulders.push({
          idx,
          variantIdx,
          slotIdx,
          boneIndex: bi,
          boneName: name,
          releaseTime: COLLAPSE_GROUPS[BONE_GROUP[name]],
          localPos,
          scale: new THREE.Vector3(sx, sy, sz),
          effRadius,
          baseQuat: quat,
          rotAxis,
          rotSpeed: lerp(0.15, 0.45, rng()),
          driftFreq: lerp(0.8, 1.7, rng()),
          driftPhase: rng() * Math.PI * 2,
          isChestCover,
          partDir,
          relPos: new THREE.Vector3(),
          relVel: new THREE.Vector3(),
          relQuat: new THREE.Quaternion(),
          landTime: 999,
          landPos: new THREE.Vector3()
        });
        idx++;
      }
    }

    // Global relaxation pass in rest pose so no boulder ever touches another across bones
    const wpA = new THREE.Vector3();
    const wpB = new THREE.Vector3();
    const diff = new THREE.Vector3();
    for (let iter = 0; iter < 18; iter++) {
      let moved = false;
      for (let i = 0; i < boulders.length; i++) {
        const bi = boulders[i];
        const bBone = restPose.bones[bi.boneIndex];
        wpA.copy(bi.localPos).applyQuaternion(bBone.quat).add(bBone.center);
        for (let j = i + 1; j < boulders.length; j++) {
          const bj = boulders[j];
          const jBone = restPose.bones[bj.boneIndex];
          wpB.copy(bj.localPos).applyQuaternion(jBone.quat).add(jBone.center);
          diff.subVectors(wpB, wpA);
          const dist = diff.length();
          const minDist = bi.effRadius + bj.effRadius + 0.36;
          if (dist < minDist) {
            moved = true;
            if (dist < 1e-4) diff.set(0, 1, 0);
            else diff.multiplyScalar(1 / dist);
            const push = (minDist - dist) * 0.55;
            if (!bi.isChestCover) {
              const locDelta = diff.clone().multiplyScalar(-push).applyQuaternion(bBone.quat.clone().invert());
              bi.localPos.add(locDelta);
              wpA.addScaledVector(diff, -push);
            }
            if (!bj.isChestCover) {
              const locDelta = diff.clone().multiplyScalar(push).applyQuaternion(jBone.quat.clone().invert());
              bj.localPos.add(locDelta);
            }
          }
        }
      }
      if (!moved) break;
    }
  })();

  function evalBoulderTransformAt(b, pose, t, outPos, outQuat) {
    const bone = pose.bones[b.boneIndex];
    const lp = _vA.copy(b.localPos);
    const df = b.driftPhase + t * b.driftFreq;
    lp.x += Math.sin(df) * 0.08;
    lp.y += Math.cos(df * 0.9) * 0.08;
    lp.z += Math.sin(df * 1.15 + 1.0) * 0.08;

    if (b.isChestCover && pose.chestPartAmount > 0) {
      lp.addScaledVector(b.partDir, pose.chestPartAmount * 3.1);
    }

    outPos.copy(lp).applyQuaternion(bone.quat).add(bone.center);
    _qA.setFromAxisAngle(b.rotAxis, t * b.rotSpeed);
    outQuat.copy(bone.quat).multiply(b.baseQuat).multiply(_qA);
  }

  const collapseCachePoses = {};
  (function precomputeCollapseTrajectories() {
    const uniqueRelTimes = [...new Set(Object.values(COLLAPSE_GROUPS))];
    const dtVel = 0.02;
    for (const tr of uniqueRelTimes) {
      const p0 = createPoseState();
      const p1 = createPoseState();
      evaluateTitanPose(tr, p0);
      evaluateTitanPose(tr - dtVel, p1);
      collapseCachePoses[tr] = { p0, p1 };
    }

    const pos0 = new THREE.Vector3();
    const posPrev = new THREE.Vector3();
    const q0 = new THREE.Quaternion();
    const qDummy = new THREE.Quaternion();
    const g = 9.81;
    const sortedLandings = [];

    for (let i = 0; i < boulders.length; i++) {
      const b = boulders[i];
      const tr = b.releaseTime;
      const { p0, p1 } = collapseCachePoses[tr];
      evalBoulderTransformAt(b, p0, tr, pos0, q0);
      evalBoulderTransformAt(b, p1, tr - dtVel, posPrev, qDummy);

      b.relPos.copy(pos0);
      b.relQuat.copy(q0);
      b.relVel.subVectors(pos0, posPrev).multiplyScalar(1 / dtVel);
      const boneCenter = p0.bones[b.boneIndex].center;
      const outDir = _vB.subVectors(pos0, boneCenter);
      if (outDir.lengthSq() > 1e-4) outDir.normalize();
      b.relVel.addScaledVector(outDir, 1.8 + hashInt(i * 19 + 3) * 2.2);

      const groundOffset = b.effRadius * 0.62;
      const y0 = b.relPos.y;
      const vy0 = b.relVel.y;
      let tEst = (vy0 + Math.sqrt(Math.max(0, vy0 * vy0 + 2 * g * Math.max(0.1, y0 - groundOffset)))) / g;
      for (let iter = 0; iter < 3; iter++) {
        const lx = b.relPos.x + b.relVel.x * tEst;
        const lz = b.relPos.z + b.relVel.z * tEst;
        const gy = terrainHeight(lx, lz) + groundOffset;
        tEst = (vy0 + Math.sqrt(Math.max(0, vy0 * vy0 + 2 * g * Math.max(0.05, y0 - gy)))) / g;
      }
      b.landTime = tr + tEst;
      b.landPos.set(
        b.relPos.x + b.relVel.x * tEst,
        terrainHeight(b.relPos.x + b.relVel.x * tEst, b.relPos.z + b.relVel.z * tEst) + groundOffset,
        b.relPos.z + b.relVel.z * tEst
      );
      sortedLandings.push(b);
    }

    sortedLandings.sort((a, b) => b.effRadius - a.effRadius);
    for (let i = 0; i < BOULDER_LAND_SLOTS && i < sortedLandings.length; i++) {
      const b = sortedLandings[i];
      boulderLandUniformArray[i].set(b.landPos.x, b.landPos.z, b.landTime, b.effRadius);
    }
  })();

  function getCollapseBoulderTransform(b, t, outPos, outQuat) {
    const dt = t - b.releaseTime;
    const g = 9.81;
    if (t < b.landTime) {
      outPos.set(
        b.relPos.x + b.relVel.x * dt,
        b.relPos.y + b.relVel.y * dt - 0.5 * g * dt * dt,
        b.relPos.z + b.relVel.z * dt
      );
      _qA.setFromAxisAngle(b.rotAxis, dt * 1.4);
      outQuat.copy(b.relQuat).multiply(_qA);
    } else {
      const dtB = t - b.landTime;
      const vyImpact = Math.abs(b.relVel.y - g * (b.landTime - b.releaseTime));
      const vyBounce = Math.min(4.2, vyImpact * 0.28);
      const bounceDur = (2 * vyBounce) / g;
      if (dtB < bounceDur) {
        const bx = b.landPos.x + b.relVel.x * 0.32 * dtB;
        const bz = b.landPos.z + b.relVel.z * 0.32 * dtB;
        const gy = terrainHeight(bx, bz) + b.effRadius * 0.62;
        outPos.set(bx, gy + vyBounce * dtB - 0.5 * g * dtB * dtB, bz);
        _qA.setFromAxisAngle(b.rotAxis, (b.landTime - b.releaseTime) * 1.4 + dtB * 0.7);
        outQuat.copy(b.relQuat).multiply(_qA);
      } else {
        const bx = b.landPos.x + b.relVel.x * 0.32 * bounceDur;
        const bz = b.landPos.z + b.relVel.z * 0.32 * bounceDur;
        const gy = terrainHeight(bx, bz) + b.effRadius * 0.62;
        outPos.set(bx, gy, bz);
        _qA.setFromAxisAngle(b.rotAxis, (b.landTime - b.releaseTime) * 1.4 + bounceDur * 0.7);
        outQuat.copy(b.relQuat).multiply(_qA);
      }
    }
  }

  // Binding Lightning Arcs (56 simultaneous jagged arcs rendered as crossed 3D ribbons)
  const ARC_SEGS = 9;
  const arcGeo = new THREE.BufferGeometry();
  const arcVerts = new Float32Array(COUNTS.arcs * ARC_SEGS * 8 * 3);
  const arcCols = new Float32Array(COUNTS.arcs * ARC_SEGS * 8 * 3);
  const arcIdx = new Uint16Array(COUNTS.arcs * ARC_SEGS * 12);
  for (let i = 0; i < COUNTS.arcs * ARC_SEGS; i++) {
    const v = i * 8;
    const k = i * 12;
    arcIdx[k] = v; arcIdx[k + 1] = v + 1; arcIdx[k + 2] = v + 2;
    arcIdx[k + 3] = v + 1; arcIdx[k + 4] = v + 3; arcIdx[k + 5] = v + 2;
    arcIdx[k + 6] = v + 4; arcIdx[k + 7] = v + 5; arcIdx[k + 8] = v + 6;
    arcIdx[k + 9] = v + 5; arcIdx[k + 10] = v + 7; arcIdx[k + 11] = v + 6;
  }
  const arcPosBuf = new THREE.BufferAttribute(arcVerts, 3);
  const arcColBuf = new THREE.BufferAttribute(arcCols, 3);
  arcGeo.setAttribute('position', arcPosBuf);
  arcGeo.setAttribute('color', arcColBuf);
  arcGeo.setIndex(new THREE.BufferAttribute(arcIdx, 1));

  const arcMat = new THREE.MeshBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
    toneMapped: false
  });
  const arcMesh = new THREE.Mesh(arcGeo, arcMat);
  arcMesh.frustumCulled = false;
  scene.add(arcMesh);

  const arcPairs = [];
  (function initArcPairs() {
    const byBone = BONE_NAMES.map(() => []);
    for (let i = 0; i < boulders.length; i++) byBone[boulders[i].boneIndex].push(i);

    let count = 0;
    for (let bi = 0; bi < BONE_NAMES.length && count < COUNTS.arcs; bi++) {
      const list = byBone[bi];
      const targetForBone = bi < 8 ? 4 : 3;
      for (let k = 0; k < targetForBone && count < COUNTS.arcs; k++) {
        const a = list[(k * 2) % list.length];
        const b = list[(k * 2 + 1 + Math.floor(rng() * 3)) % list.length];
        arcPairs.push({ a, b: a === b ? list[(k + 1) % list.length] : b, boneIndex: bi });
        count++;
      }
    }
    while (arcPairs.length < COUNTS.arcs) {
      const bi = arcPairs.length % BONE_NAMES.length;
      const list = byBone[bi];
      arcPairs.push({ a: list[0], b: list[list.length - 1], boneIndex: bi });
    }
  })();

  const skyBoltGroup = new THREE.Group();
  scene.add(skyBoltGroup);
  const skyBolts = SKY_STRIKES.map((st, sIdx) => {
    const sRng = mulberry32(9100 + sIdx * 131);
    const pts = [];
    const topY = 230;
    const segs = 22;
    for (let k = 0; k <= segs; k++) {
      const u = k / segs;
      pts.push(new THREE.Vector3(
        st.pos.x + (sRng() - 0.5) * 14 * Math.sin(u * Math.PI),
        lerp(topY, st.pos.y, u),
        st.pos.z + (sRng() - 0.5) * 14 * Math.sin(u * Math.PI)
      ));
    }
    const segPairs = [];
    for (let k = 0; k < segs; k++) segPairs.push([pts[k], pts[k + 1], 0.55]);
    for (let br = 0; br < 4; br++) {
      const startIdx = 4 + br * 4;
      let bCur = pts[startIdx].clone();
      const bDir = new THREE.Vector3((sRng() - 0.5) * 12, -16 - sRng() * 10, (sRng() - 0.5) * 12);
      for (let m = 0; m < 4; m++) {
        const nxt = bCur.clone().addScaledVector(bDir, 0.35).add(new THREE.Vector3((sRng() - 0.5) * 4, 0, (sRng() - 0.5) * 4));
        segPairs.push([bCur, nxt, 0.24]);
        bCur = nxt;
      }
    }
    const geo = new THREE.BufferGeometry();
    const vArr = new Float32Array(segPairs.length * 8 * 3);
    const iArr = new Uint16Array(segPairs.length * 12);
    for (let i = 0; i < segPairs.length; i++) {
      const [p0, p1, w] = segPairs[i];
      const dir = new THREE.Vector3().subVectors(p1, p0).normalize();
      const sideA = new THREE.Vector3(1, 0, 0).cross(dir);
      if (sideA.lengthSq() < 1e-4) sideA.set(0, 0, 1).cross(dir);
      sideA.normalize().multiplyScalar(w);
      const sideB = new THREE.Vector3().crossVectors(dir, sideA).normalize().multiplyScalar(w);

      const vb = i * 8;
      const setV = (o, v) => { vArr[(vb + o) * 3] = v.x; vArr[(vb + o) * 3 + 1] = v.y; vArr[(vb + o) * 3 + 2] = v.z; };
      setV(0, p0.clone().add(sideA));
      setV(1, p0.clone().sub(sideA));
      setV(2, p1.clone().add(sideA));
      setV(3, p1.clone().sub(sideA));
      setV(4, p0.clone().add(sideB));
      setV(5, p0.clone().sub(sideB));
      setV(6, p1.clone().add(sideB));
      setV(7, p1.clone().sub(sideB));

      const k = i * 12;
      iArr[k] = vb; iArr[k + 1] = vb + 1; iArr[k + 2] = vb + 2;
      iArr[k + 3] = vb + 1; iArr[k + 4] = vb + 3; iArr[k + 5] = vb + 2;
      iArr[k + 6] = vb + 4; iArr[k + 7] = vb + 5; iArr[k + 8] = vb + 6;
      iArr[k + 9] = vb + 5; iArr[k + 10] = vb + 7; iArr[k + 11] = vb + 6;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(vArr, 3));
    geo.setIndex(new THREE.BufferAttribute(iArr, 1));
    const mat = new THREE.MeshBasicMaterial({
      color: 0xd9f0ff,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;
    skyBoltGroup.add(mesh);
    return { mesh, mat, t: st.t };
  });

  // =========================================================================
  // 7. THE HUNTER (16 POSED PARTS), MOTION, VERLET RAGDOLL & SMOOTH BLEND

  const hunterMaterials = [];
  function makeHunterMat(colorHex, roughnessBase, metalness) {
    const m = new THREE.MeshStandardMaterial({
      color: colorHex,
      roughness: roughnessBase,
      metalness,
      envMapIntensity: 0.35
    });
    hunterMaterials.push({ mat: m, baseRough: roughnessBase, baseColor: new THREE.Color(colorHex) });
    return m;
  }

  const matCloth = makeHunterMat(0x1f2633, 0.90, 0.05);
  const matLeather = makeHunterMat(0x3a2a20, 0.85, 0.08);
  const matMetal = makeHunterMat(0x6e7d91, 0.55, 0.72);
  const matAccent = makeHunterMat(0xe84828, 0.82, 0.08);

  const HUNTER_PART_NAMES = [
    'pelvis', 'torso', 'head',

  const SWING1_ANG0 = -2.35;
  const SWING1_ANG_SPAN = -Math.PI * 2 * 1.15;
  const SWING1_R0 = 16.5;
  const SWING1_R1 = 2.4;
  const SWING1_START_POS = new THREE.Vector3(
    (40 - 4 * 3.3 - 1.5) + SWING1_R0 * Math.cos(SWING1_ANG0),
    1.5,
    4.0 + SWING1_R0 * Math.sin(SWING1_ANG0)
  );
  const SWING1_END_POS = new THREE.Vector3(
    (40 - 4 * 5.0 - 1.5) + SWING1_R1 * Math.cos(SWING1_ANG0 + SWING1_ANG_SPAN),
    9.5,
    4.0 + SWING1_R1 * Math.sin(SWING1_ANG0 + SWING1_ANG_SPAN)
  );

  function getHunterTrajectoryPos(t, out) {
    if (t < 3.0) {
      const u = t / 3.0;
      const sx = lerp(-40, 0, easeInOutCubic(u * 0.92 + u * 0.08));
      const sz = lerp(10, -12, smoothstep(0.0, 1.0, u));
      out.set(sx, terrainHeight(sx, sz) + 1.05, sz);
    } else if (t < 3.3) {
      const u = (t - 3.0) / 0.3;
      const x = lerp(0, SWING1_START_POS.x, u);
      const z = lerp(-12, SWING1_START_POS.z, u);
      out.set(x, lerp(terrainHeight(0, -12) + 1.05, SWING1_START_POS.y, u) + Math.sin(u * Math.PI) * 0.45, z);
    } else if (t < 5.0) {
      const u = (t - 3.3) / 1.7;
      const ang = SWING1_ANG0 + u * SWING1_ANG_SPAN;
      const r = SWING1_R0 * Math.pow(1 - u, 0.7) + SWING1_R1 * (1 - Math.pow(1 - u, 0.7));
      const cx = 40 - 4 * t - 1.5;
      out.set(cx + r * Math.cos(ang), lerp(SWING1_START_POS.y, SWING1_END_POS.y, smoothstep(0, 1, u)), 4.0 + r * Math.sin(ang));
    } else if (t < 5.6) {
      const u = (t - 5.0) / 0.6;
      out.set(lerp(SWING1_END_POS.x, 10.0, u), lerp(SWING1_END_POS.y, 6.2, u), lerp(SWING1_END_POS.z, 1.0, u));
    } else if (t < 6.5) {
      const u = (t - 5.6) / 0.9;
      const x = lerp(10.0, SLAM_TARGET.x, u);
      const z = lerp(1.0, SLAM_TARGET.z, u);
      const gy = terrainHeight(x, z) + 1.05;
      out.set(x, Math.max(gy, lerp(6.2, gy, Math.min(1, u * 1.45))), z);
    } else if (t < 7.5) {
      const u = (t - 6.5) / 1.0;
      const x = lerp(SLAM_TARGET.x, -15.0, u);
      const z = lerp(SLAM_TARGET.z, -9.0, u);
      out.set(x, terrainHeight(x, z) + 1.08, z);
    } else if (t < 9.0) {
      const u = (t - 7.5) / 1.5;
      const x = lerp(-15.0, -9.0, u);
      const z = lerp(-9.0, -2.0, u);
      out.set(x, terrainHeight(x, z) + 1.08, z);
    } else if (t < 10.5) {
      const u = (t - 9.0) / 1.5;
      const x = lerp(-9.0, -5.0, u);
      const z = lerp(-2.0, -4.0, u);
      out.set(x, terrainHeight(x, z) + 1.10, z);
    } else if (t < 12.0) {
      const u = easeInOutCubic((t - 10.5) / 1.5);
      out.set(lerp(-5.0, 13.8, u), lerp(terrainHeight(-5, -4) + 1.10, 30.8, u) + Math.sin(u * Math.PI) * 2.2, lerp(-4.0, -8.8, u));
    } else if (t < 13.5) {
      const u = (t - 12.0) / 1.5;
      const x = lerp(13.8, -4.0, u);
      const z = lerp(-8.8, -4.0, u);
      const yG = terrainHeight(x, z) + 1.05;
      out.set(x, Math.max(yG, lerp(30.8, yG, u * u) + Math.sin(u * Math.PI) * 2.5), z);
    } else if (t < 16.0) {
      const u = (t - 13.5) / 2.5;
      const x = lerp(-4.0, 3.0, u);
      const z = lerp(-4.0, 3.0, u);
      out.set(x, terrainHeight(x, z) + 1.05, z);
    } else if (t <= 19.0) {
      const u = (t - 16.0) / 3.0;
      const x = lerp(3.0, 5.5, u);
      const z = lerp(3.0, 1.0, u);
      out.set(x, terrainHeight(x, z) + 1.05, z);
    } else if (t < 22.5) {
      const dt = t - 19.0;
      const tAir = Math.min(dt, 1.83);
      const tGnd = Math.max(0, dt - 1.83);
      const x = 5.5 - 14.0 * tAir * 0.92 - 2.0 * tGnd * (1 - 0.5 * Math.min(1, tGnd / 0.6));
      const z = 1.0 - 6.0 * tAir * 0.92 - 0.8 * tGnd * (1 - 0.5 * Math.min(1, tGnd / 0.6));
      const y = Math.max(terrainHeight(x, z) + 0.5, 1.05 + 9 * dt - 4.9 * dt * dt);
      out.set(x, y, z);
    } else if (t < 23.5) {
      const u = (t - 22.5) / 1.0;
      const x = lerp(ragdollRestCenter.x, -9.0, u);
      const z = lerp(ragdollRestCenter.z, -8.5, u);
      out.set(x, terrainHeight(x, z) + 1.08, z);
    } else if (t < 27.0) {
      const u = (t - 23.5) / 3.5;
      const ease = easeInOutCubic(u);
      out.set(lerp(-9.0, 10.5, ease), lerp(terrainHeight(-9, -8.5) + 1.08, 27.2, ease) - Math.sin(u * Math.PI) * 2.5, lerp(-8.5, -2.0, ease));
    } else if (t < 29.5) {
      const u = (t - 27.0) / 2.5;
      if (u < 0.4) {
        const k = easeInOutCubic(u / 0.4);
        out.set(lerp(10.5, 9.5, k), lerp(27.2, 29.0, k), lerp(-2.0, 4.5, k));
      } else if (u < 0.7) {
        const k = easeInOutCubic((u - 0.4) / 0.3);
        out.set(lerp(9.5, 5.5, k), lerp(29.0, 24.8, k), lerp(4.5, -5.0, k));
      } else {
        const k = easeInOutCubic((u - 0.7) / 0.3);
        out.set(lerp(5.5, 11.6, k), lerp(24.8, 28.0, k), lerp(-5.0, -0.5, k));
      }
    } else if (t < 31.5) {
      const u = (t - 29.5) / 2.0;
      const x = lerp(11.6, -8.0, u);
      const z = lerp(-0.5, 2.0, u);
      const yG = terrainHeight(x, z) + 1.05;
      out.set(x, Math.max(yG, lerp(28.0, yG, u * u)), z);
    } else if (t < 33.0) {
      const u = (t - 31.5) / 1.5;
      const x = lerp(-8.0, -15.0, u);
      const z = lerp(2.0, 5.0, u);
      out.set(x, terrainHeight(x, z) + 1.05, z);
    } else {
      out.set(-15.0, terrainHeight(-15.0, 5.0) + 1.05, 5.0);
    }
    return out;
  }

  function createHunterPoseStruct() {
    const parts = {};
    for (const name of HUNTER_PART_NAMES) {
      parts[name] = { pos: new THREE.Vector3(), quat: new THREE.Quaternion() };
    }
    return {
      parts,
      chestPos: new THREE.Vector3(),
      launcherPos: new THREE.Vector3(),
      bladeTipPos: new THREE.Vector3(),
      bladeVel: new THREE.Vector3()
    };
  }

  function evaluateProceduralHunterPose(t, outStruct) {
    const chestPos = getHunterTrajectoryPos(t, new THREE.Vector3());
    const pNext = getHunterTrajectoryPos(Math.min(DURATION, t + 0.03), new THREE.Vector3());
    const pPrev = getHunterTrajectoryPos(Math.max(0, t - 0.03), new THREE.Vector3());
    const vel = new THREE.Vector3().subVectors(pNext, pPrev).multiplyScalar(1 / 0.06);
    const speed = vel.length();

    let fwd = new THREE.Vector3(vel.x, 0, vel.z);
    if (t >= 32.8) {
      fwd.set(16 - chestPos.x, 0, -chestPos.z);
    } else if (fwd.lengthSq() < 0.04) {
      fwd.set(16 - chestPos.x, 0, -chestPos.z);
    }
    fwd.normalize();

    const airborne = (t >= 3.3 && t < 5.8) || (t >= 10.5 && t < 13.5) || (t >= 23.8 && t < 31.5);
    const pitchForward = airborne ? clamp(-vel.y * 0.035, -0.5, 0.5) + 0.25 : clamp(speed * 0.03, 0.02, 0.42);
    const yaw = Math.atan2(-fwd.z, fwd.x);
    const rootQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, -pitchForward, 'YXZ'));

    let getupCrouch = 0;
    if (t >= 21.5 && t < 22.5) {
      getupCrouch = 1 - smoothstep(21.5, 22.5, t);
    }
    if (t >= 31.5 && t < 32.35) {
      const rollSpin = -((t - 31.5) / 0.85) * Math.PI * 2;
      rootQuat.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), rollSpin));
    }

    const pelvisBase = chestPos.clone().add(new THREE.Vector3(0, -0.32 - getupCrouch * 0.35, 0));
    const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(rootQuat);
    const localFwd = new THREE.Vector3(1, 0, 0).applyQuaternion(rootQuat);
    const localRight = new THREE.Vector3(0, 0, 1).applyQuaternion(rootQuat);

    const torsoPos = pelvisBase.clone().addScaledVector(localUp, 0.30);
    const headPos = pelvisBase.clone().addScaledVector(localUp, 0.68);

    const strideFreq = airborne ? 3.5 : (speed > 1.5 ? 11.5 : 1.8);
    const phase = t * strideFreq;
    const strideAmp = airborne ? 0.45 : clamp(speed / 12.0, 0.05, 1.05);

    function poseLimbPair(rootPos, upperName, lowerName, endName, upperLen, lowerLen, hipAng, kneeAng) {
      const qUpper = rootQuat.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), hipAng));
      const uDir = new THREE.Vector3(0, -1, 0).applyQuaternion(qUpper);
      const uCenter = rootPos.clone().addScaledVector(uDir, upperLen * 0.5);
      const jointPos = rootPos.clone().addScaledVector(uDir, upperLen);

      const qLower = qUpper.clone().multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), kneeAng));
      const lDir = new THREE.Vector3(0, -1, 0).applyQuaternion(qLower);
      const lCenter = jointPos.clone().addScaledVector(lDir, lowerLen * 0.5);
      const endPos = jointPos.clone().addScaledVector(lDir, lowerLen);

      outStruct.parts[upperName].pos.copy(uCenter);
      outStruct.parts[upperName].quat.copy(qUpper);
      outStruct.parts[lowerName].pos.copy(lCenter);
      outStruct.parts[lowerName].quat.copy(qLower);
      outStruct.parts[endName].pos.copy(endPos);
      outStruct.parts[endName].quat.copy(qLower);
      return { endPos };
    }

    outStruct.parts.pelvis.pos.copy(pelvisBase);
    outStruct.parts.pelvis.quat.copy(rootQuat);
    outStruct.parts.torso.pos.copy(torsoPos);
    outStruct.parts.torso.quat.copy(rootQuat);
    outStruct.parts.head.pos.copy(headPos);
    outStruct.parts.head.quat.copy(rootQuat);

    const legSwingL = Math.sin(phase) * strideAmp - getupCrouch * 0.9;
    const kneeBendL = Math.max(0.12, -Math.cos(phase) * 0.9 * strideAmp + 0.35 + getupCrouch * 1.1);
    const legSwingR = -Math.sin(phase) * strideAmp - getupCrouch * 0.6;
    const kneeBendR = Math.max(0.12, Math.cos(phase) * 0.9 * strideAmp + 0.35 + getupCrouch * 0.9);

    poseLimbPair(pelvisBase.clone().addScaledVector(localRight, -0.10), 'thighL', 'shinL', 'footL', 0.42, 0.42, legSwingL, -kneeBendL);
    poseLimbPair(pelvisBase.clone().addScaledVector(localRight, 0.10), 'thighR', 'shinR', 'footR', 0.42, 0.42, legSwingR, -kneeBendR);

    const tetherAim = (t >= 2.9 && t <= 5.6) || (t >= 8.9 && t <= 12.4) || (t >= 23.4 && t <= 31.5);
    const armAngL = tetherAim ? 1.35 : -Math.sin(phase) * 0.85 * strideAmp;
    const elbowAngL = tetherAim ? 0.25 : 0.65;
