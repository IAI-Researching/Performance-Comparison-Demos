      posArr[b * 3] = ax + _rbSide.x * halfW; posArr[b * 3 + 1] = ay + _rbSide.y * halfW; posArr[b * 3 + 2] = az + _rbSide.z * halfW;
      posArr[(b + 1) * 3] = ax - _rbSide.x * halfW; posArr[(b + 1) * 3 + 1] = ay - _rbSide.y * halfW; posArr[(b + 1) * 3 + 2] = az - _rbSide.z * halfW;
      posArr[(b + 2) * 3] = bx + _rbSide.x * halfW; posArr[(b + 2) * 3 + 1] = by + _rbSide.y * halfW; posArr[(b + 2) * 3 + 2] = bz + _rbSide.z * halfW;
      posArr[(b + 3) * 3] = bx - _rbSide.x * halfW; posArr[(b + 3) * 3 + 1] = by - _rbSide.y * halfW; posArr[(b + 3) * 3 + 2] = bz - _rbSide.z * halfW;
      alphaArr[b] = alphaArr[b + 1] = alphaArr[b + 2] = alphaArr[b + 3] = alpha;
      quadCount++;
    }

    for (let s = 0; s < SKY_STRIKES.length; s++) {
      const st = SKY_STRIKES[s];
      const age = simTime - st.t;
      if (age < 0 || age > 0.25) continue;

      const fade = (1.0 - age / 0.25) * (0.75 + 0.25 * Math.sin(age * 170.0));
      let tx = st.pos[0], ty = st.pos[1], tz = st.pos[2];
      if (st.isHead) {
        const bHead = titanPose.bones[BONE_INDEX.head];
        tx = bHead.end.x; ty = bHead.end.y; tz = bHead.end.z;
      } else {
        ty = getGroundHeight(tx, tz);
      }
      const topX = tx - 28.0 + hashSigned(st.seed) * 20.0;
      const topY = 230.0;
      const topZ = tz + hashSigned(st.seed + 7) * 25.0;

      // Main jagged trunk (24 segments)
      const segs = 24;
      let px = topX, py = topY, pz = topZ;
      for (let i = 1; i <= segs; i++) {
        const u = i / segs;
        const env = Math.sin(u * Math.PI);
        const nx = lerp(topX, tx, u) + hashSigned(st.seed * 97 + i * 13) * 14.0 * env;
        const ny = lerp(topY, ty, u);
        const nz = lerp(topZ, tz, u) + hashSigned(st.seed * 97 + i * 29) * 14.0 * env;
        pushSegment(px, py, pz, nx, ny, nz, 1.35 * (1.1 - 0.35 * u), fade * 1.6);

        // Spawn 6 branching sub-bolts!
        if (i === 5 || i === 8 || i === 11 || i === 14 || i === 17 || i === 20) {
          let bx = nx, by = ny, bz = nz;
          const bDirX = hashSigned(st.seed * 53 + i * 41) * 1.1;
          const bDirZ = hashSigned(st.seed * 53 + i * 71) * 1.1;
          for (let bStep = 1; bStep <= 6; bStep++) {
            const nbx = bx + bDirX * 7.5 + hashSigned(st.seed + i * 19 + bStep * 7) * 4.5;
            const nby = by - 9.5;
            const nbz = bz + bDirZ * 7.5 + hashSigned(st.seed + i * 23 + bStep * 11) * 4.5;
            pushSegment(bx, by, bz, nbx, nby, nbz, 0.55 * (1 - bStep / 7), fade * 1.05);
            bx = nbx; by = nby; bz = nbz;
          }
        }
        px = nx; py = ny; pz = nz;
      }
    }

    skyBoltGeo.setDrawRange(0, quadCount * 6);
    skyBoltGeo.attributes.position.needsUpdate = true;
    skyBoltGeo.attributes.aAlpha.needsUpdate = true;
    skyBoltMesh.visible = quadCount > 0;
  }

  // =========================================================================
  // 15. TETHER RIBBON RENDERER (EMISSIVE LINE FROM VERLET POINTS)
  // =========================================================================
  const tetherVerts = ROPE_POINTS * 2;
  const tetherPosArr = new Float32Array(tetherVerts * 3);
  const tetherUvArr = new Float32Array(tetherVerts * 2);
  const tetherIdx = [];
  for (let i = 0; i < ROPE_POINTS; i++) {
    tetherUvArr[i * 4]     = i / (ROPE_POINTS - 1); tetherUvArr[i * 4 + 1] = 0;
    tetherUvArr[i * 4 + 2] = i / (ROPE_POINTS - 1); tetherUvArr[i * 4 + 3] = 1;
    if (i < ROPE_POINTS - 1) {
      const b = i * 2;
      tetherIdx.push(b, b + 1, b + 2, b + 1, b + 3, b + 2);
    }
  }
  const tetherGeo = new THREE.BufferGeometry();
  tetherGeo.setAttribute('position', new THREE.BufferAttribute(tetherPosArr, 3));
  tetherGeo.setAttribute('uv', new THREE.BufferAttribute(tetherUvArr, 2));
  tetherGeo.setIndex(tetherIdx);

  const tetherMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    toneMapped: false,
    uniforms: {
      uTime: { value: 0 },
      uOpacity: { value: 0 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uOpacity;
      varying vec2 vUv;
      void main() {
        float edge = abs(vUv.y - 0.5) * 2.0;
        float core = exp(-edge * edge * 10.0);
        float pulse = 0.75 + 0.25 * sin(vUv.x * 26.0 - uTime * 22.0);
        vec3 col = mix(vec3(0.32, 0.90, 1.0), vec3(1.0, 0.97, 0.85), core);
        float a = (pow(max(0.0, 1.0 - edge), 1.8) * 0.65 + core * 0.85) * pulse * uOpacity;
        gl_FragColor = vec4(col * 1.4, a);
      }
    `
  });
  const tetherMesh = new THREE.Mesh(tetherGeo, tetherMat);
  tetherMesh.frustumCulled = false;
  scene.add(tetherMesh);

  const tetherSampleBuf = new Float32Array(ROPE_POINTS * 3);
  function updateTetherVisual(m, simTime, camPos) {
    let activeAlpha = 0;
    for (let ti = 0; ti < tetherSims.length; ti++) {
      const a = tetherSims[ti].sample(m, tetherSampleBuf);
      if (a > 0) {
        activeAlpha = a;
        break;
      }
    }
    if (activeAlpha <= 0.001) {
      tetherMesh.visible = false;
      return;
    }
    tetherMesh.visible = true;
    tetherMat.uniforms.uTime.value = simTime;
    tetherMat.uniforms.uOpacity.value = activeAlpha;

    const pArr = tetherGeo.attributes.position.array;
    const halfW = 0.11;
    for (let i = 0; i < ROPE_POINTS; i++) {
      const px = tetherSampleBuf[i * 3];
      const py = tetherSampleBuf[i * 3 + 1];
      const pz = tetherSampleBuf[i * 3 + 2];
      const prevI = Math.max(0, i - 1);
      const nextI = Math.min(ROPE_POINTS - 1, i + 1);
      _rbDir.set(
        tetherSampleBuf[nextI * 3] - tetherSampleBuf[prevI * 3],
        tetherSampleBuf[nextI * 3 + 1] - tetherSampleBuf[prevI * 3 + 1],
        tetherSampleBuf[nextI * 3 + 2] - tetherSampleBuf[prevI * 3 + 2]
      );
      if (_rbDir.lengthSq() < 1e-6) _rbDir.set(1, 0, 0);
      else _rbDir.normalize();
      _rbToCam.set(camPos.x - px, camPos.y - py, camPos.z - pz).normalize();
      _rbSide.crossVectors(_rbDir, _rbToCam);
      if (_rbSide.lengthSq() < 1e-5) _rbSide.set(0, 1, 0);
      else _rbSide.normalize();

      const v0 = i * 2;
      const v1 = v0 + 1;
      pArr[v0 * 3]     = px + _rbSide.x * halfW;
      pArr[v0 * 3 + 1] = py + _rbSide.y * halfW;
      pArr[v0 * 3 + 2] = pz + _rbSide.z * halfW;
      pArr[v1 * 3]     = px - _rbSide.x * halfW;
      pArr[v1 * 3 + 1] = py - _rbSide.y * halfW;
      pArr[v1 * 3 + 2] = pz - _rbSide.z * halfW;
    }
    tetherGeo.attributes.position.needsUpdate = true;
  }

  // =========================================================================
  // 16. 20,000 INSTANCED RAIN STREAKS (30° TOWARD +X) + 600 GROUND SPLASH RINGS
  // =========================================================================
  const rainUniforms = {
    uTime: { value: 0 },
    uCamPos: { value: new THREE.Vector3() },
    uFlash: { value: 0 },
    uRainVel: { value: new THREE.Vector3(14.5, -25.1, 0.0) } // atan(14.5/25.1) = 30.0° from vertical toward +X!
  };

  function buildRainSystem() {
    const basePos = new Float32Array([
      -0.5, -0.5, 0,
       0.5, -0.5, 0,
      -0.5,  0.5, 0,
       0.5,  0.5, 0
    ]);
    const baseUv = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
    const geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(basePos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(baseUv, 2));
    geo.setIndex([0, 1, 2, 1, 3, 2]);

    const rRng = createPRNG(4243);
    const seedPos = new Float32Array(RAIN_COUNT * 3);
    const seedParam = new Float32Array(RAIN_COUNT * 2);
    for (let i = 0; i < RAIN_COUNT; i++) {
      seedPos[i * 3]     = (rRng() - 0.5) * 90.0;
      seedPos[i * 3 + 1] = (rRng() - 0.5) * 48.0;
      seedPos[i * 3 + 2] = (rRng() - 0.5) * 90.0;
      seedParam[i * 2]     = 0.85 + 0.35 * rRng(); // speed multiplier
      seedParam[i * 2 + 1] = 1.1 + 0.85 * rRng();  // streak length
    }
    geo.setAttribute('aSeedPos', new THREE.InstancedBufferAttribute(seedPos, 3));
    geo.setAttribute('aParam', new THREE.InstancedBufferAttribute(seedParam, 2));
    geo.instanceCount = RAIN_COUNT;

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      toneMapped: false,
      uniforms: rainUniforms,
      vertexShader: `
        attribute vec3 aSeedPos;
        attribute vec2 aParam;
        uniform float uTime;
        uniform vec3 uCamPos;
        uniform vec3 uRainVel;
        varying vec2 vUv;
        varying float vFade;

        void main() {
          vUv = uv;
          vec3 boxSize = vec3(90.0, 48.0, 90.0);
          vec3 p = aSeedPos + uRainVel * (uTime * aParam.x);
          vec3 rel = mod(p - uCamPos + boxSize * 0.5, boxSize) - boxSize * 0.5;
          vec3 center = uCamPos + rel;

          // Keep rain above plateau floor
          float dist = length(rel);
          vFade = smoothstep(45.0, 14.0, dist) * smoothstep(1.2, 4.5, dist) * step(-0.2, center.y);

          vec3 streakDir = normalize(uRainVel);
          vec3 toCam = normalize(cameraPosition - center + vec3(0.0, 0.0001, 0.0));
          vec3 rightRaw = cross(streakDir, toCam);
          vec3 right = length(rightRaw) > 0.001 ? normalize(rightRaw) : vec3(0.0, 0.0, 1.0);

          vec3 wp = center + right * (position.x * 0.032) + streakDir * (position.y * aParam.y);
          gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uFlash;
        varying vec2 vUv;
        varying float vFade;
        void main() {
          float along = sin(vUv.y * 3.14159265);
          float across = 1.0 - abs(vUv.x - 0.5) * 2.0;
          float a = along * across * vFade * (0.16 + 0.24 * uFlash);
          if (a < 0.004) discard;
          vec3 col = mix(vec3(0.55, 0.70, 0.88), vec3(0.92, 0.96, 1.0), uFlash);
          gl_FragColor = vec4(col, a);
        }
      `
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    return mesh;
  }

  // 600 Ground rain splash rings hugging exact terrain height near camera
  const splashUniforms = {
    uTime: { value: 0 },
    uCamXZ: { value: new THREE.Vector2() },
    uFlash: { value: 0 }
  };

  function buildRainSplashes() {
    const basePos = new Float32Array([-0.5, 0, -0.5, 0.5, 0, -0.5, -0.5, 0, 0.5, 0.5, 0, 0.5]);
    const baseUv = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
    const geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(basePos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(baseUv, 2));
    geo.setIndex([0, 2, 1, 1, 2, 3]);

    const sRng = createPRNG(4261);
    const seedXZ = new Float32Array(SPLASH_COUNT * 3);
    for (let i = 0; i < SPLASH_COUNT; i++) {
      seedXZ[i * 3]     = (sRng() - 0.5) * 32.0;
      seedXZ[i * 3 + 1] = (sRng() - 0.5) * 32.0;
      seedXZ[i * 3 + 2] = sRng(); // phase [0, 1)
    }
    geo.setAttribute('aSeed', new THREE.InstancedBufferAttribute(seedXZ, 3));
    geo.instanceCount = SPLASH_COUNT;

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      toneMapped: false,
      uniforms: splashUniforms,
      vertexShader: `
        attribute vec3 aSeed;
        uniform float uTime;
        uniform vec2 uCamXZ;
        varying vec2 vUv;
        varying float vLife;
        varying float vVis;

        float groundH(float x, float z) {
          return 0.27 * sin(x * 0.055 + 0.7) * cos(z * 0.048 - 0.3)
               + 0.17 * sin(x * 0.11 - z * 0.09 + 1.4)
               + 0.10 * cos(x * 0.19 + z * 0.16 - 0.8);
        }

        void main() {
          vUv = uv;
          float period = 0.42;
          float cycle = floor(uTime / period + aSeed.z);
          vLife = fract(uTime / period + aSeed.z);

          // Deterministic jitter per splash cycle inside 32x32m zone around camera
          vec2 jitter = vec2(
            fract(sin(cycle * 127.1 + aSeed.x * 31.7) * 43758.5) - 0.5,
            fract(sin(cycle * 269.5 + aSeed.y * 57.3) * 43758.5) - 0.5
          ) * 32.0;
          vec2 worldXZ = uCamXZ + jitter;
          float rFromOrigin = length(worldXZ);
          vVis = step(rFromOrigin, 87.5) * smoothstep(20.0, 6.0, length(jitter));

          float rad = mix(0.05, 0.34, vLife);
          float gy = groundH(worldXZ.x, worldXZ.y) + 0.05;
          vec3 wp = vec3(worldXZ.x + position.x * rad, gy, worldXZ.y + position.z * rad);
          gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uFlash;
        varying vec2 vUv;
        varying float vLife;
        varying float vVis;
        void main() {
          float r = length(vUv - 0.5) * 2.0;
          float ring = exp(-pow((r - 0.78) * 9.0, 2.0));
          float a = ring * (1.0 - vLife) * vVis * (0.28 + 0.35 * uFlash);
          if (a < 0.01) discard;
          gl_FragColor = vec4(vec3(0.62, 0.76, 0.92), a);
        }
      `
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    return mesh;
  }

  scene.add(buildRainSystem());
  scene.add(buildRainSplashes());

  // =========================================================================
  // 17. CLOSED-FORM STRIKE SPARKS (4×80), SLAM DEBRIS (90) & IMPACT DUST (120)
  // =========================================================================
  // Precompute exact weak point 3D origins at each strike time
  const strikeOrigins = [];
  (function initStrikeOrigins() {
    const tmpT = createTitanPoseStruct();
    for (let i = 0; i < STRIKES.length; i++) {
      evalTitanPose(STRIKES[i].t, tmpT);
      strikeOrigins.push(tmpT.wpPos[STRIKES[i].wpIndex].clone());
    }
  })();

  // 320 directional sparks (80 per strike, evaluated at simTime so they spray during hit-stop!)
  const TOTAL_SPARKS = STRIKES.length * SPARKS_PER_STRIKE;
  const sparkUniforms = { uSimTime: { value: 0 } };
  function buildStrikeSparks() {
    const basePos = new Float32Array([-0.5, -0.5, 0, 0.5, -0.5, 0, -0.5, 0.5, 0, 0.5, 0.5, 0]);
    const baseUv = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
    const geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(basePos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(baseUv, 2));
    geo.setIndex([0, 1, 2, 1, 3, 2]);

    const spRng = createPRNG(4283);
    const origins = new Float32Array(TOTAL_SPARKS * 3);
    const vels = new Float32Array(TOTAL_SPARKS * 3);
    const times = new Float32Array(TOTAL_SPARKS * 2); // (startTime, lifetime)

    for (let s = 0; s < STRIKES.length; s++) {
      const st = STRIKES[s];
      const org = strikeOrigins[s];
      const dir = new THREE.Vector3(st.dir[0], st.dir[1], st.dir[2]).normalize();
      for (let k = 0; k < SPARKS_PER_STRIKE; k++) {
        const idx = s * SPARKS_PER_STRIKE + k;
        origins[idx * 3]     = org.x + (spRng() - 0.5) * 0.4;
        origins[idx * 3 + 1] = org.y + (spRng() - 0.5) * 0.4;
        origins[idx * 3 + 2] = org.z + (spRng() - 0.5) * 0.4;

        // Directional cone along blade travel velocity!
        const speed = 12.0 + 24.0 * spRng();
        const spreadX = (spRng() - 0.5) * 0.85;
        const spreadY = (spRng() - 0.35) * 0.85;
        const spreadZ = (spRng() - 0.5) * 0.85;
        const v = new THREE.Vector3(dir.x + spreadX, dir.y + spreadY, dir.z + spreadZ).normalize().multiplyScalar(speed);
        vels[idx * 3]     = v.x;
        vels[idx * 3 + 1] = v.y;
        vels[idx * 3 + 2] = v.z;

        times[idx * 2]     = st.t;
        times[idx * 2 + 1] = 0.55 + 0.45 * spRng();
      }
    }
    geo.setAttribute('aOrigin', new THREE.InstancedBufferAttribute(origins, 3));
    geo.setAttribute('aVel', new THREE.InstancedBufferAttribute(vels, 3));
    geo.setAttribute('aTime', new THREE.InstancedBufferAttribute(times, 2));
    geo.instanceCount = TOTAL_SPARKS;

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      toneMapped: false,
      uniforms: sparkUniforms,
      vertexShader: `
        attribute vec3 aOrigin;
        attribute vec3 aVel;
        attribute vec2 aTime;
        uniform float uSimTime;
        varying vec2 vUv;
        varying float vLife;

        void main() {
          vUv = uv;
          float age = uSimTime - aTime.x;
          float dur = aTime.y;
          if (age < 0.0 || age > dur) {
            vLife = -1.0;
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            return;
          }
          vLife = age / dur;
          // Closed-form ballistic trajectory with air drag
          float dragT = (1.0 - exp(-age * 1.8)) / 1.8;
          vec3 center = aOrigin + aVel * dragT + vec3(0.0, -9.0 * age * age, 0.0);
          vec3 curVel = aVel * exp(-age * 1.8) + vec3(0.0, -18.0 * age, 0.0);
          vec3 dir = normalize(curVel + vec3(0.0, 0.0001, 0.0));
          vec3 toCam = normalize(cameraPosition - center + vec3(0.0, 0.0001, 0.0));
          vec3 rightRaw = cross(dir, toCam);
          vec3 right = length(rightRaw) > 0.001 ? normalize(rightRaw) : vec3(1.0, 0.0, 0.0);
          float streakLen = clamp(length(curVel) * 0.045, 0.18, 1.15) * (1.0 - 0.5 * vLife);
          vec3 wp = center + right * (position.x * 0.085) + dir * (position.y * streakLen);
          gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }
      `,
      fragmentShader: `
        varying vec2 vUv;
        varying float vLife;
        void main() {
          if (vLife < 0.0) discard;
          float core = exp(-pow((vUv.x - 0.5) * 3.8, 2.0)) * sin(vUv.y * 3.14159265);
          vec3 hot = mix(vec3(1.0, 0.98, 0.85), vec3(1.0, 0.45, 0.08), vLife);
          float a = core * (1.0 - vLife);
          gl_FragColor = vec4(hot * 2.2, a);
        }
      `
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    return mesh;
  }
  scene.add(buildStrikeSparks());

  // 90 Fist-Slam dirt clods & torn grass tufts (parabolic arcs from SLAM_TARGET at m = 7.500)
  const DEBRIS_COUNT = 90;
  const debrisGeo = new THREE.DodecahedronBufferGeometry(0.28, 0);
  const debrisMat = new THREE.MeshStandardMaterial({ color: 0x262922, roughness: 0.92, metalness: 0.02 });
  const debrisMesh = new THREE.InstancedMesh(debrisGeo, debrisMat, DEBRIS_COUNT);
  debrisMesh.frustumCulled = false;
  scene.add(debrisMesh);

  const debrisSeeds = [];
  (function initDebris() {
    const dRng = createPRNG(4291);
    for (let i = 0; i < DEBRIS_COUNT; i++) {
      const ang = dRng() * TWO_PI;
      const rad = 1.5 + 3.8 * dRng();
      const spd = 6.0 + 13.0 * dRng();
      const vy = 7.0 + 11.5 * dRng();
      const isGrass = i >= 55;
      debrisSeeds.push({
        ox: SLAM_TARGET.x + Math.cos(ang) * rad,
        oy: SLAM_TARGET.y + 0.3,
        oz: SLAM_TARGET.z + Math.sin(ang) * rad,
        vx: Math.cos(ang) * spd + 2.5,
        vy,
        vz: Math.sin(ang) * spd,
        sx: isGrass ? 0.25 : (0.6 + 1.2 * dRng()),
        sy: isGrass ? 1.5 : (0.5 + 1.0 * dRng()),
        sz: isGrass ? 0.25 : (0.6 + 1.1 * dRng()),
        rx: dRng() * 8 - 4,
        ry: dRng() * 8 - 4,
        rz: dRng() * 8 - 4
      });
      debrisMesh.setColorAt(i, new THREE.Color(isGrass ? 0x2b4527 : 0x2a241e));
    }
    debrisMesh.instanceColor.needsUpdate = true;
  })();

  // 120 Ground-impact dust puffs (fist slam, knee hit, hunter land, and collapse boulder landings!)
  const DUST_COUNT = 120;
  const dustUniforms = {
    uTime: { value: 0 },
    uMap: { value: dustTexture }
  };
  function buildDustSystem() {
    const basePos = new Float32Array([-0.5, -0.5, 0, 0.5, -0.5, 0, -0.5, 0.5, 0, 0.5, 0.5, 0]);
    const baseUv = new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]);
    const geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(basePos, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(baseUv, 2));
    geo.setIndex([0, 1, 2, 1, 3, 2]);

    const duRng = createPRNG(4297);
    const org = new Float32Array(DUST_COUNT * 3);
    const vel = new Float32Array(DUST_COUNT * 3);
    const par = new Float32Array(DUST_COUNT * 3); // (startT, dur, maxScale)

    let idx = 0;
    function addBurst(t0, cx, cz, count, radSpread, minS, maxS, dur) {
      for (let k = 0; k < count && idx < DUST_COUNT; k++, idx++) {
        const ang = duRng() * TWO_PI;
        const r = duRng() * radSpread;
        const x = cx + Math.cos(ang) * r;
        const z = cz + Math.sin(ang) * r;
        org[idx * 3]     = x;
        org[idx * 3 + 1] = getGroundHeight(x, z) + 0.6;
        org[idx * 3 + 2] = z;
        vel[idx * 3]     = Math.cos(ang) * (2.5 + 4.5 * duRng()) + 3.5; // drifts with +X wind!
        vel[idx * 3 + 1] = 1.4 + 2.8 * duRng();
        vel[idx * 3 + 2] = Math.sin(ang) * (2.5 + 4.5 * duRng());
        par[idx * 3]     = t0 + duRng() * 0.08;
        par[idx * 3 + 1] = dur * (0.8 + 0.4 * duRng());
        par[idx * 3 + 2] = lerp(minS, maxS, duRng());
      }
    }

    addBurst(7.500, SLAM_TARGET.x, SLAM_TARGET.z, 22, 4.5, 6.0, 13.0, 2.4);
    addBurst(13.000, 17.7, 6.5, 14, 3.5, 4.5, 9.5, 2.0);
    addBurst(31.500, -8.0, 7.5, 6, 1.2, 1.8, 3.8, 1.1);
    // Distribute remaining 78 dust puffs across collapse boulder landings!
    const rem = DUST_COUNT - idx;
    for (let k = 0; k < rem; k++) {
      const ci = collapseImpacts[Math.floor((k / rem) * collapseImpacts.length)];
      if (ci) {
        addBurst(ci.t, ci.x, ci.z, 1, 1.4, 3.5, 8.5, 2.1);
      }
    }

    geo.setAttribute('aOrg', new THREE.InstancedBufferAttribute(org, 3));
    geo.setAttribute('aVel', new THREE.InstancedBufferAttribute(vel, 3));
    geo.setAttribute('aPar', new THREE.InstancedBufferAttribute(par, 3));
    geo.instanceCount = DUST_COUNT;

    const mat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      toneMapped: false,
      uniforms: dustUniforms,
      vertexShader: `
        attribute vec3 aOrg;
        attribute vec3 aVel;
        attribute vec3 aPar;
        uniform float uTime;
        varying vec2 vUv;
        varying float vAlpha;

        void main() {
          vUv = uv;
          float age = uTime - aPar.x;
          float dur = aPar.y;
          if (age < 0.0 || age > dur) {
            vAlpha = 0.0;
            gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
            return;
          }
          float u = age / dur;
          float drag = (1.0 - exp(-age * 1.4)) / 1.4;
          vec3 center = aOrg + aVel * drag;
          float sc = aPar.z * (0.28 + 0.72 * sqrt(u));
          vAlpha = smoothstep(0.0, 0.12, u) * (1.0 - smoothstep(0.35, 1.0, u)) * 0.55;

          // Billboard facing camera
          vec3 camRight = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
          vec3 camUp    = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
          vec3 wp = center + camRight * (position.x * sc) + camUp * (position.y * sc);
          gl_Position = projectionMatrix * viewMatrix * vec4(wp, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uMap;
        varying vec2 vUv;
        varying float vAlpha;
        void main() {
          if (vAlpha <= 0.004) discard;
          vec4 t = texture2D(uMap, vUv);
          gl_FragColor = vec4(t.rgb * 0.55, t.a * vAlpha);
        }
      `
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    return mesh;
  }
  scene.add(buildDustSystem());

  // =========================================================================
  // 18. WORDLESS WORLD-ANCHORED WEBGL HUD (ORTHOGRAPHIC FINAL PASS)
  // =========================================================================
  // Drawn strictly inside #stage: zero DOM nodes, zero words/labels/titles!
  function createDigitGlyphAtlas() {
    const cellW = 64, cellH = 80;
    const c = document.createElement('canvas');
    c.width = cellW * 10;
    c.height = cellH;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.font = '700 58px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let d = 0; d < 10; d++) {
      const cx = d * cellW + cellW * 0.5;
      const cy = cellH * 0.52;
      ctx.lineWidth = 7;
      ctx.strokeStyle = 'rgba(8, 10, 16, 0.85)';
      ctx.strokeText(String(d), cx, cy);
      ctx.fillStyle = '#fff5dc';
      ctx.fillText(String(d), cx, cy);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  const hudScene = new THREE.Scene();
  const hudCam = new THREE.OrthographicCamera(0, window.innerWidth, window.innerHeight, 0, -10, 10);
  const digitAtlasTex = createDigitGlyphAtlas();

  function makeHudQuad(color, opacity) {
    const geo = new THREE.PlaneBufferGeometry(1, 1);
    const mat = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    });
    const m = new THREE.Mesh(geo, mat);
    m.frustumCulled = false;
    hudScene.add(m);
    return m;
  }

  // Boss health bar + 0.6s pale trailing catch-up + border frame + tick marks
  const hudHpBg     = makeHudQuad(0x0b0e16, 0.72);
  const hudHpBorder = makeHudQuad(0x9fb2cc, 0.28);
  const hudHpTrail  = makeHudQuad(0xffdfc2, 0.85);
  const hudHpFill   = makeHudQuad(0xd9382c, 0.96);
  const hudHpTicks  = [makeHudQuad(0x0b0e16, 0.55), makeHudQuad(0x0b0e16, 0.55), makeHudQuad(0x0b0e16, 0.55)];

  // Stagger gauge directly below health bar
  const hudStagBg   = makeHudQuad(0x0b0e16, 0.68);
  const hudStagFill = makeHudQuad(0xf2b830, 0.95);

  // 3 Weak-point 4-corner brackets (each built as 8 tiny line segments = 16 vertices)
  const hudBrackets = [];
  for (let i = 0; i < 3; i++) {
    const pos = new Float32Array(16 * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const mat = new THREE.LineBasicMaterial({
      color: 0xffb845,
      transparent: true,
      opacity: 0.9,
      depthTest: false,
      depthWrite: false,
      toneMapped: false
    });
    const lines = new THREE.LineSegments(geo, mat);
    lines.frustumCulled = false;
    hudScene.add(lines);
    hudBrackets.push({ lines, geo, mat });
  }

  // Off-screen threat arrow (crisp chevron pointing toward off-screen Titan chest or attacking fist)
  const arrowShape = new THREE.BufferGeometry();
  arrowShape.setAttribute('position', new THREE.Float32BufferAttribute([
     14,  0, 0,   -10,  10, 0,   -5,  0, 0,
     14,  0, 0,    -5,   0, 0,  -10, -10, 0
  ], 3));
  const hudArrowMat = new THREE.MeshBasicMaterial({
    color: 0xff5a36,
    transparent: true,
    opacity: 0.92,
    depthTest: false,
    depthWrite: false,
    toneMapped: false
  });
  const hudArrow = new THREE.Mesh(arrowShape, hudArrowMat);
  hudArrow.frustumCulled = false;
  hudArrow.visible = false;
  hudScene.add(hudArrow);

  // Floating damage number digit pool (4 strikes × 3 digits = 12 textured quads)
  const hudDigits = [];
  for (let s = 0; s < STRIKES.length; s++) {
    const str = STRIKES[s].label;
    const quads = [];
    for (let c = 0; c < str.length; c++) {
      const digit = parseInt(str[c], 10);
      const geo = new THREE.PlaneBufferGeometry(1, 1);
      const u0 = digit / 10;
      const u1 = (digit + 1) / 10;
      geo.setAttribute('uv', new THREE.Float32BufferAttribute([u0, 1, u1, 1, u0, 0, u1, 0], 2));
      const mat = new THREE.MeshBasicMaterial({
        map: digitAtlasTex,
        transparent: true,
        opacity: 0,
        depthTest: false,
        depthWrite: false,
        toneMapped: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false;
      mesh.visible = false;
      hudScene.add(mesh);
      quads.push(mesh);
    }
    hudDigits.push(quads);
  }

  const _hudProj = new THREE.Vector3();
  const _hudCamSpace = new THREE.Vector3();

  function evalBossHealthAndStagger(simTime) {
    // Health out of 2000 + 0.6s trailing catch-up
    let hp = 2000;
    let trailHp = 2000;
    for (let i = 0; i < STRIKES.length; i++) {
      const s = STRIKES[i];
      if (simTime >= s.t) {
        hp -= s.dmg;
        const age = simTime - s.t;
        const catchU = easeOutCubic(clamp(age / 0.6, 0, 1));
        trailHp -= s.dmg * catchU;
      }
    }
    hp = Math.max(0, hp);
    trailHp = Math.max(hp, trailHp);

    // Stagger gauge [0, 1]: 0.5 at 5.0, 1.0 at 12.0 (pulses 12-16, drains 15-16 to 0), 0.5 at 27.0, 0 at 29.5
    let stagger = 0;
    let staggerPulsing = false;
    if (simTime < 5.0) {
      stagger = 0;
    } else if (simTime < 12.0) {
      stagger = 0.5;
    } else if (simTime < 15.0) {
      stagger = 1.0;
      staggerPulsing = true;
    } else if (simTime < 16.0) {
      stagger = 1.0 - (simTime - 15.0);
      staggerPulsing = true;
    } else if (simTime < 27.0) {
      stagger = 0;
    } else if (simTime < 29.5) {
      stagger = 0.5;
    } else {
      stagger = 0;
    }

    return { hpFrac: hp / 2000, trailFrac: trailHp / 2000, stagger, staggerPulsing };
  }

  function updateHUD(simTime, titanPose, isCountdown) {
    const W = window.innerWidth;
    const H = window.innerHeight;
    hudCam.left = 0; hudCam.right = W;
    hudCam.top = H; hudCam.bottom = 0;
    hudCam.updateProjectionMatrix();

    // 1. Boss Health Bar & Stagger Gauge inside top 10% of viewport
    const { hpFrac, trailFrac, stagger, staggerPulsing } = evalBossHealthAndStagger(simTime);
    const barW = Math.min(540, W * 0.48);
    const barH = 10;
    const barX = W * 0.5;
    const barY = H - Math.max(28, H * 0.045);
    const hudFade = simTime > 35.5 ? (1.0 - smoothstep((simTime - 35.5) / 2.5)) : 1.0;

    hudHpBorder.position.set(barX, barY, 0);
    hudHpBorder.scale.set(barW + 4, barH + 4, 1);
    hudHpBorder.material.opacity = 0.28 * hudFade;

    hudHpBg.position.set(barX, barY, 0.1);
    hudHpBg.scale.set(barW, barH, 1);
    hudHpBg.material.opacity = 0.72 * hudFade;

    const leftEdge = barX - barW * 0.5;
    const trailW = Math.max(0.001, barW * trailFrac);
    hudHpTrail.visible = trailFrac > 0.001 && hudFade > 0.01;
    hudHpTrail.position.set(leftEdge + trailW * 0.5, barY, 0.2);
    hudHpTrail.scale.set(trailW, barH, 1);
    hudHpTrail.material.opacity = 0.85 * hudFade;

    const fillW = Math.max(0.001, barW * hpFrac);
    hudHpFill.visible = hpFrac > 0.001 && hudFade > 0.01;
    hudHpFill.position.set(leftEdge + fillW * 0.5, barY, 0.3);
    hudHpFill.scale.set(fillW, barH, 1);
    hudHpFill.material.opacity = 0.96 * hudFade;

    for (let t = 0; t < 3; t++) {
      hudHpTicks[t].position.set(leftEdge + barW * ((t + 1) * 0.25), barY, 0.4);
      hudHpTicks[t].scale.set(1.5, barH, 1);
      hudHpTicks[t].material.opacity = 0.55 * hudFade;
    }

    // Stagger gauge directly below health bar
    const stagW = barW * 0.92;
    const stagH = 5;
    const stagY = barY - 12;
    const stagLeft = barX - stagW * 0.5;
    hudStagBg.position.set(barX, stagY, 0.1);
    hudStagBg.scale.set(stagW, stagH, 1);
    hudStagBg.material.opacity = 0.65 * hudFade;

    const sFillW = Math.max(0.001, stagW * stagger);
    hudStagFill.visible = stagger > 0.002 && hudFade > 0.01;
    hudStagFill.position.set(stagLeft + sFillW * 0.5, stagY, 0.25);
    hudStagFill.scale.set(sFillW, stagH, 1);
    if (staggerPulsing) {
      const p = 0.5 + 0.5 * Math.sin(simTime * 18.0);
      hudStagFill.material.color.setRGB(1.0, lerp(0.75, 0.98, p), lerp(0.22, 0.78, p));
      hudStagFill.material.opacity = (0.72 + 0.28 * p) * hudFade;
    } else {
      hudStagFill.material.color.setHex(0xe8b030);
      hudStagFill.material.opacity = 0.92 * hudFade;
    }

    // 2. Weak-Point Corner Brackets (intact & exposed only; brighter on active target)
    const wpVisible = [
      simTime < 5.000,
      simTime < 12.000,
      simTime >= 25.000 && simTime < 29.500
    ];
    const currentTarget = simTime < 5.000 ? 0 : (simTime < 12.000 ? 1 : (simTime >= 25.000 && simTime < 29.500 ? 2 : -1));

    for (let i = 0; i < 3; i++) {
      const br = hudBrackets[i];
      if (!wpVisible[i]) {
        br.lines.visible = false;
        continue;
      }
      const wp3 = titanPose.wpPos[i];
      _hudProj.copy(wp3).project(camera);
      const sx = (_hudProj.x * 0.5 + 0.5) * W;
      const sy = (_hudProj.y * 0.5 + 0.5) * H;
      const inFront = _hudProj.z < 1.0 && _hudProj.z > -1.0;
      const onScreen = inFront && sx > 16 && sx < W - 16 && sy > 96 && sy < H - 16;

      // Clear of center countdown during COUNTDOWN
      const nearCenterCountdown = isCountdown && Math.hypot(sx - W * 0.5, sy - H * 0.5) < 92;
      if (!onScreen || nearCenterCountdown) {
        br.lines.visible = false;
        continue;
      }

      br.lines.visible = true;
      const dist = camera.position.distanceTo(wp3);
      const isTgt = (i === currentTarget);
      const half = clamp(820 / Math.max(6, dist), 13, 44) * (isTgt ? (1.0 + 0.08 * Math.sin(simTime * 7.5)) : 0.88);
      const leg = half * 0.44;
      const arr = br.geo.attributes.position.array;

      // 4 L-shaped corners: TL, TR, BL, BR (8 segments)
      const coords = [
        // TL
        sx - half, sy + half, sx - half + leg, sy + half,
        sx - half, sy + half, sx - half, sy + half - leg,
        // TR
        sx + half, sy + half, sx + half - leg, sy + half,
        sx + half, sy + half, sx + half, sy + half - leg,
        // BL
        sx - half, sy - half, sx - half + leg, sy - half,
        sx - half, sy - half, sx - half, sy - half + leg,
        // BR
        sx + half, sy - half, sx + half - leg, sy - half,
        sx + half, sy - half, sx + half, sy - half + leg
      ];
      for (let k = 0; k < 16; k++) {
        arr[k * 3]     = coords[k * 2];
        arr[k * 3 + 1] = coords[k * 2 + 1];
        arr[k * 3 + 2] = 0.5;
      }
      br.geo.attributes.position.needsUpdate = true;
      br.mat.color.setHex(isTgt ? 0xffe28a : 0xd98e2b);
      br.mat.opacity = isTgt ? 0.96 : 0.45;
    }

    // 3. Off-Screen Threat Arrow (Titan chest or attacking fist during wind-up/strike)
    let threatPos = null;
    let isAttackUrgent = false;
    const fistSlamActive = simTime >= 6.0 && simTime <= 7.5;
    const sweepActive    = simTime >= 17.0 && simTime <= 19.3;

    function isPointOffScreen(p3) {
      _hudProj.copy(p3).project(camera);
      const sx = (_hudProj.x * 0.5 + 0.5) * W;
      const sy = (_hudProj.y * 0.5 + 0.5) * H;
      return (_hudProj.z > 1.0 || _hudProj.z < -1.0 || sx < 24 || sx > W - 24 || sy < 98 || sy > H - 24);
    }

    if (fistSlamActive && isPointOffScreen(titanPose.bones[BONE_INDEX.fistR].pos)) {
      threatPos = titanPose.bones[BONE_INDEX.fistR].pos;
      isAttackUrgent = true;
    } else if (sweepActive && isPointOffScreen(titanPose.bones[BONE_INDEX.fistL].pos)) {
      threatPos = titanPose.bones[BONE_INDEX.fistL].pos;
      isAttackUrgent = true;
    } else if (simTime < 31.0) {
      const chestC = _tVec1.lerpVectors(titanPose.bones[BONE_INDEX.chest].pos, titanPose.bones[BONE_INDEX.chest].end, 0.45);
      if (isPointOffScreen(chestC)) {
        threatPos = chestC;
      }
    }

    if (threatPos && !isCountdown) {
      // Transform into camera local space to get exact 2D edge direction even if behind camera!
      _hudCamSpace.copy(threatPos).applyMatrix4(camera.matrixWorldInverse);
      // Camera looks along -Z in camera space -> screen X = +x, screen Y = +y
      let dx = _hudCamSpace.x;
      let dy = _hudCamSpace.y;
      const len = Math.hypot(dx, dy) || 1.0;
      dx /= len; dy /= len;

      const cx = W * 0.5;
      const cy = (H + 90) * 0.5;
      const maxX = W * 0.5 - 38;
      const maxYTop = H - 38 - cy;
      const maxYBot = cy - 106; // Clear of bottom 90px dock!

      let scale = 99999;
      if (Math.abs(dx) > 1e-4) scale = Math.min(scale, maxX / Math.abs(dx));
      if (dy > 1e-4)  scale = Math.min(scale, maxYTop / dy);
      if (dy < -1e-4) scale = Math.min(scale, maxYBot / (-dy));

      hudArrow.visible = true;
      hudArrow.position.set(cx + dx * scale, cy + dy * scale, 0.8);
      hudArrow.rotation.z = Math.atan2(dy, dx);
      const pulse = isAttackUrgent ? (0.85 + 0.35 * Math.sin(simTime * 18.0)) : 0.9;
      hudArrow.scale.setScalar(pulse);
      hudArrowMat.color.setHex(isAttackUrgent ? 0xff3b28 : 0xffaa38);
      hudArrowMat.opacity = isAttackUrgent ? 0.96 : 0.78;
    } else {
      hudArrow.visible = false;
    }

    // 4. Floating Damage Numbers (anchored to 3D weak point, rises 60px & fades over 0.9s)
    for (let s = 0; s < STRIKES.length; s++) {
      const st = STRIKES[s];
      const age = simTime - st.t;
      const quads = hudDigits[s];
      if (age < 0 || age > 0.90) {
        for (let c = 0; c < quads.length; c++) quads[c].visible = false;
        continue;
      }
      const wp3 = titanPose.wpPos[st.wpIndex];
      _hudProj.copy(wp3).project(camera);
      if (_hudProj.z > 1.0 || _hudProj.z < -1.0) {
        for (let c = 0; c < quads.length; c++) quads[c].visible = false;
        continue;
      }
      const baseX = (_hudProj.x * 0.5 + 0.5) * W;
      const risePx = 60.0 * easeOutCubic(age / 0.90);
      const baseY = Math.max(106, (_hudProj.y * 0.5 + 0.5) * H + risePx);
      const popScale = age < 0.12 ? lerp(1.38, 1.0, age / 0.12) : 1.0;
      const alpha = age < 0.55 ? 1.0 : (1.0 - (age - 0.55) / 0.35);
      const charW = 24 * popScale;
      const charH = 30 * popScale;
      const totalW = charW * quads.length * 0.78;
      const startX = baseX - totalW * 0.5 + charW * 0.39;

      for (let c = 0; c < quads.length; c++) {
        const q = quads[c];
        q.visible = true;
        q.position.set(startX + c * charW * 0.78, baseY, 1.0);
        q.scale.set(charW, charH, 1);
        q.material.opacity = clamp(alpha, 0, 1);
        if (s === 3) {
          q.material.color.setHex(0xffe078); // brighter gold for killing blow
        } else {
          q.material.color.setHex(0xffffff);
        }
      }
    }
  }

  // =========================================================================
  // 19. SYNTHESIZED WEB AUDIO API ENGINE (SEED 4242, NO MUSIC, 3D SPATIAL)
  // =========================================================================
  const StormAudio = (function() {
    const aRng = createPRNG(4242); // Dedicated audio PRNG!
    let ctx = null;
    let masterGain = null;
    let compressor = null;
    let stormBedGain = null;
    let whiteBuf = null;
    let brownBuf = null;
    let ready = false;
    let isAudible = false;
    const activeOneShots = new Set();

    // Continuous nodes
    let windFilter = null, windGain = null;
    let rainFilter = null, rainGain = null;
    let grindOsc = null, grindFilter = null, grindGain = null, titanPanner = null;
    let humOsc1 = null, humOsc2 = null, humNoiseFilter = null, humGain = null;
    let reelOsc = null, reelGain = null, hunterPanner = null;
    let whooshFilter = null, whooshGain = null;

    // Precompute exact thunder arrival times delayed by distance / 340 m/s!
    const thunderEvents = [];
    const boulderAudioImpacts = [];

    function initSchedule() {
      const tmpT = createTitanPoseStruct();
      const tmpH = createHunterStateStruct();
      const tmpC = { pos: new THREE.Vector3(), target: new THREE.Vector3(), rotShake: new THREE.Quaternion() };
      for (let i = 0; i < SKY_STRIKES.length; i++) {
        const st = SKY_STRIKES[i];
        evalTitanPose(st.t, tmpT);
        evalHunterState(st.t, tmpT, tmpH);
        evalCameraState(st.t, tmpT, tmpH, tmpC);
        const strikeP = st.isHead
          ? tmpT.bones[BONE_INDEX.head].end.clone()
          : new THREE.Vector3(st.pos[0], getGroundHeight(st.pos[0], st.pos[2]), st.pos[2]);
        const dist = tmpC.pos.distanceTo(strikeP);
        const delay = dist / 340.0; // Exact speed of sound 340 m/s!
        thunderEvents.push({
          t: st.t + delay,
          pos: [strikeP.x, strikeP.y, strikeP.z],
          dist,
          intensity: st.isHead ? 1.0 : (i === 0 ? 0.78 : 0.55)
        });
      }
      // Pick 18 representative collapse boulder landing thuds
      const stride = Math.max(1, Math.floor(collapseImpacts.length / 18));
      for (let i = 0; i < collapseImpacts.length && boulderAudioImpacts.length < 18; i += stride) {
        boulderAudioImpacts.push(collapseImpacts[i]);
      }
    }

    function createNoiseBuffer(audioCtx, seconds, brown) {
      const len = Math.floor(audioCtx.sampleRate * seconds);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = aRng() * 2 - 1;
        if (brown) {
          last = (last + 0.04 * w) / 1.04;
          data[i] = clamp(last * 3.2, -1, 1);
        } else {
          data[i] = w;
        }
      }
      return buf;
    }

    function makePanner(x, y, z) {
      const p = ctx.createPanner();
      p.panningModel = 'equalpower';
      p.distanceModel = 'inverse';
      p.refDistance = 12;
      p.maxDistance = 280;
      p.rolloffFactor = 1.05;
      setPannerPos(p, x, y, z);
      return p;
    }

    function setPannerPos(p, x, y, z) {
      if (p.positionX) {
        p.positionX.setValueAtTime(x, ctx.currentTime);
        p.positionY.setValueAtTime(y, ctx.currentTime);
        p.positionZ.setValueAtTime(z, ctx.currentTime);
      } else if (p.setPosition) {
        p.setPosition(x, y, z);
      }
    }

    function setup() {
      if (ready) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
      } catch (e) {
        return;
      }
      ready = true;
      initSchedule();

      whiteBuf = createNoiseBuffer(ctx, 4.0, false);
      brownBuf = createNoiseBuffer(ctx, 4.0, true);

      // Master bus -> DynamicsCompressorNode -> destination (never clips!)
      masterGain = ctx.createGain();
      masterGain.gain.value = 0.0;
      compressor = ctx.createDynamicsCompressor();
      compressor.threshold.value = -12;
      compressor.knee.value = 18;
      compressor.ratio.value = 6;
      compressor.attack.value = 0.004;
      compressor.release.value = 0.16;
      masterGain.connect(compressor);
      compressor.connect(ctx.destination);

      // Storm bed bus (ducks -12dB during hit-stop!)
      stormBedGain = ctx.createGain();
      stormBedGain.gain.value = 1.0;
      stormBedGain.connect(masterGain);

      // 1. Continuous Wind
      const windSrc = ctx.createBufferSource();
      windSrc.buffer = brownBuf;
      windSrc.loop = true;
      windFilter = ctx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.value = 320;
      windFilter.Q.value = 1.8;
      windGain = ctx.createGain();
      windGain.gain.value = 0.22;
      windSrc.connect(windFilter);
      windFilter.connect(windGain);
      windGain.connect(stormBedGain);
      windSrc.start();

      // 2. Continuous Rain (louder & duller as wetness rises!)
      const rainSrc = ctx.createBufferSource();
      rainSrc.buffer = whiteBuf;
      rainSrc.loop = true;
      rainFilter = ctx.createBiquadFilter();
      rainFilter.type = 'bandpass';
      rainFilter.frequency.value = 3200;
      rainFilter.Q.value = 0.65;
      rainGain = ctx.createGain();
      rainGain.gain.value = 0.10;
      rainSrc.connect(rainFilter);
      rainFilter.connect(rainGain);
      rainGain.connect(stormBedGain);
      rainSrc.start();

      // 3. Titan spatial panner (stone grinding rumble + electrical crackle-hum)
      titanPanner = makePanner(40, 20, 0);
      titanPanner.connect(masterGain);

      // Stone grinding rumble
      const grindNoise = ctx.createBufferSource();
      grindNoise.buffer = brownBuf;
      grindNoise.loop = true;
      grindOsc = ctx.createOscillator();
      grindOsc.type = 'sawtooth';
      grindOsc.frequency.value = 46;
      grindFilter = ctx.createBiquadFilter();
      grindFilter.type = 'lowpass';
      grindFilter.frequency.value = 140;
      grindFilter.Q.value = 2.0;
      grindGain = ctx.createGain();
      grindGain.gain.value = 0.0;
      grindNoise.connect(grindFilter);
      grindOsc.connect(grindFilter);
      grindFilter.connect(grindGain);
      grindGain.connect(titanPanner);
      grindNoise.start();
      grindOsc.start();

      // Electrical crackle-hum
      humOsc1 = ctx.createOscillator();
      humOsc1.type = 'sawtooth';
      humOsc1.frequency.value = 108;
      humOsc2 = ctx.createOscillator();
      humOsc2.type = 'square';
      humOsc2.frequency.value = 217;
      const humNoise = ctx.createBufferSource();
      humNoise.buffer = whiteBuf;
      humNoise.loop = true;
      humNoiseFilter = ctx.createBiquadFilter();
      humNoiseFilter.type = 'bandpass';
      humNoiseFilter.frequency.value = 3200;
      humNoiseFilter.Q.value = 3.2;
      const humOscGain = ctx.createGain();
      humOscGain.gain.value = 0.18;
      const humCrackGain = ctx.createGain();
      humCrackGain.gain.value = 0.25;
      humGain = ctx.createGain();
      humGain.gain.value = 0.0;

      humOsc1.connect(humOscGain);
      humOsc2.connect(humOscGain);
      humOscGain.connect(humGain);
      humNoise.connect(humNoiseFilter);
      humNoiseFilter.connect(humCrackGain);
      humCrackGain.connect(humGain);
      humGain.connect(titanPanner);
      humOsc1.start();
      humOsc2.start();
      humNoise.start();

      // 4. Hunter spatial panner (tether reel whine + air whoosh)
      hunterPanner = makePanner(-40, 1, 10);
      hunterPanner.connect(masterGain);

      reelOsc = ctx.createOscillator();
      reelOsc.type = 'triangle';
      reelOsc.frequency.value = 420;
      const reelFilter = ctx.createBiquadFilter();
      reelFilter.type = 'bandpass';
      reelFilter.frequency.value = 1100;
      reelFilter.Q.value = 3.5;
      reelGain = ctx.createGain();
      reelGain.gain.value = 0.0;
      reelOsc.connect(reelFilter);
      reelFilter.connect(reelGain);
      reelGain.connect(hunterPanner);
      reelOsc.start();

      const whooshSrc = ctx.createBufferSource();
      whooshSrc.buffer = whiteBuf;
      whooshSrc.loop = true;
      whooshFilter = ctx.createBiquadFilter();
      whooshFilter.type = 'bandpass';
      whooshFilter.frequency.value = 600;
      whooshFilter.Q.value = 1.5;
      whooshGain = ctx.createGain();
      whooshGain.gain.value = 0.0;
      whooshSrc.connect(whooshFilter);
      whooshFilter.connect(whooshGain);
      whooshGain.connect(hunterPanner);
      whooshSrc.start();

      // Try autoplay immediately
      resume();
    }

    function resume() {
      if (!ready) setup();
      if (ctx && ctx.state === 'suspended') {
        ctx.resume().catch(() => {});
      }
    }

    function trackNode(node, endSec) {
      activeOneShots.add(node);
      node.onended = () => activeOneShots.delete(node);
      node.stop(endSec);
    }

    function stopAllOneShots() {
      activeOneShots.forEach(node => {
        try { node.stop(); } catch (e) {}
      });
      activeOneShots.clear();
    }

    function setPlayingState(playing) {
      if (!ready || !ctx) return;
      const now = ctx.currentTime;
      if (playing && !isAudible) {
        isAudible = true;
        resume();
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setTargetAtTime(0.85, now, 0.012);
      } else if (!playing && isAudible) {
        isAudible = false;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setTargetAtTime(0.0, now, 0.010); // silent well within 50ms!
        stopAllOneShots();
      }
    }

    // --- One-Shot Synthesizers ---
    function playThud(pos, f0, f1, dur, amp, noiseAmp) {
      if (!ready || !isAudible) return;
      const now = ctx.currentTime;
      const panner = makePanner(pos[0], pos[1], pos[2]);
      panner.connect(masterGain);

      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f0, now);
      osc.frequency.exponentialRampToValueAtTime(f1, now + dur);
      const g = ctx.createGain();
      g.gain.setValueAtTime(amp, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(g);
      g.connect(panner);
      osc.start(now);
      trackNode(osc, now + dur + 0.02);

      if (noiseAmp > 0) {
        const ns = ctx.createBufferSource();
        ns.buffer = brownBuf;
        const flt = ctx.createBiquadFilter();
        flt.type = 'lowpass';
        flt.frequency.setValueAtTime(420, now);
        flt.frequency.exponentialRampToValueAtTime(80, now + dur);
        const ng = ctx.createGain();
        ng.gain.setValueAtTime(noiseAmp, now);
        ng.gain.exponentialRampToValueAtTime(0.001, now + dur * 0.85);
        ns.connect(flt);
        flt.connect(ng);
        ng.connect(panner);
        ns.start(now, aRng() * 2.5);
        trackNode(ns, now + dur + 0.02);
      }
    }

    function playTetherFire(pos) {
      if (!ready || !isAudible) return;
      const now = ctx.currentTime;
      const panner = makePanner(pos.x, pos.y, pos.z);
      panner.connect(masterGain);

      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1600, now);
      osc.frequency.exponentialRampToValueAtTime(340, now + 0.11);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.32, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
      osc.connect(g); g.connect(panner);
      osc.start(now);
      trackNode(osc, now + 0.13);

      const ns = ctx.createBufferSource();
      ns.buffer = whiteBuf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'highpass'; hp.frequency.value = 1800;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.28, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      ns.connect(hp); hp.connect(ng); ng.connect(panner);
      ns.start(now, aRng() * 2.0);
      trackNode(ns, now + 0.10);
    }

    function playTetherAttach(pos) {
      if (!ready || !isAudible) return;
      const now = ctx.currentTime;
      const panner = makePanner(pos.x, pos.y, pos.z);
      panner.connect(masterGain);
      [1680, 2540].forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        const g = ctx.createGain();
        g.gain.setValueAtTime(idx === 0 ? 0.28 : 0.16, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        osc.connect(g); g.connect(panner);
        osc.start(now);
        trackNode(osc, now + 0.16);
      });
    }

    function playStrike(pos, basePitch, isKill) {
      if (!ready || !isAudible) return;
      const now = ctx.currentTime;
      const panner = makePanner(pos.x, pos.y, pos.z);
      panner.connect(masterGain);
      const dur = isKill ? 0.85 : 0.48;
      // Metallic ring with ascending pitch per strike
      [1.0, 2.13, 3.41].forEach((mult, idx) => {
        const osc = ctx.createOscillator();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(basePitch * mult, now);
        osc.frequency.exponentialRampToValueAtTime(basePitch * mult * 0.96, now + dur);
        const g = ctx.createGain();
        g.gain.setValueAtTime((idx === 0 ? 0.45 : 0.22 / idx) * (isKill ? 1.25 : 1.0), now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(panner);
        osc.start(now);
        trackNode(osc, now + dur + 0.03);
      });
      // Crisp bright metallic crunch
      const ns = ctx.createBufferSource();
      ns.buffer = whiteBuf;
      const bp = ctx.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = basePitch * 3.0; bp.Q.value = 1.5;
      const ng = ctx.createGain();
      ng.gain.setValueAtTime(0.42, now);
      ng.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
      ns.connect(bp); bp.connect(ng); ng.connect(panner);
      ns.start(now, aRng() * 2.0);
      trackNode(ns, now + 0.16);
    }

    function playThunder(ev) {
      if (!ready || !isAudible) return;
      const now = ctx.currentTime;
      const panner = makePanner(ev.pos[0], ev.pos[1], ev.pos[2]);
      panner.connect(masterGain);

      // Sharp crack
      const crack = ctx.createBufferSource();
      crack.buffer = whiteBuf;
      const hp = ctx.createBiquadFilter();
      hp.type = 'bandpass'; hp.frequency.value = 1400; hp.Q.value = 0.8;
      const cg = ctx.createGain();
      cg.gain.setValueAtTime(0.65 * ev.intensity, now);
      cg.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      crack.connect(hp); hp.connect(cg); cg.connect(panner);
      crack.start(now, aRng() * 2.0);
      trackNode(crack, now + 0.30);

      // Long low rolling rumble
      const rumb = ctx.createBufferSource();
      rumb.buffer = brownBuf;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(190, now);
      lp.frequency.exponentialRampToValueAtTime(52, now + 3.4);
      const rg = ctx.createGain();
      rg.gain.setValueAtTime(0.001, now);
      rg.gain.linearRampToValueAtTime(0.75 * ev.intensity, now + 0.12);
      rg.gain.exponentialRampToValueAtTime(0.001, now + 3.5);
      rumb.connect(lp); lp.connect(rg); rg.connect(panner);
      rumb.start(now, aRng() * 1.5);
      trackNode(rumb, now + 3.6);
    }

    function playCollapseWhine(pos) {
      if (!ready || !isAudible) return;
      const now = ctx.currentTime;
      const panner = makePanner(pos.x, pos.y, pos.z);
      panner.connect(masterGain);
      const osc = ctx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(840, now);
      osc.frequency.exponentialRampToValueAtTime(85, now + 0.42);
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 1500;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.28, now);
      g.gain.linearRampToValueAtTime(0.18, now + 0.38);
      g.gain.linearRampToValueAtTime(0.0, now + 0.42); // abrupt electrical cut-out!
      osc.connect(lp); lp.connect(g); g.connect(panner);
      osc.start(now);
      trackNode(osc, now + 0.44);
    }

    const _lFwd = new THREE.Vector3();
    const _lUp = new THREE.Vector3();

    function updateContinuous(simTime, m, titanPose, hunterState, cam) {
      if (!ready || !ctx || !isAudible) return;
      const now = ctx.currentTime;

      // Update 3D audio listener to match active camera (jumps instantaneously on camera cuts)
      const listener = ctx.listener;
      cam.getWorldDirection(_lFwd);
      _lUp.copy(cam.up).applyQuaternion(cam.quaternion).normalize();
      if (listener.positionX) {
        listener.positionX.setValueAtTime(cam.position.x, now);
        listener.positionY.setValueAtTime(cam.position.y, now);
        listener.positionZ.setValueAtTime(cam.position.z, now);
        listener.forwardX.setValueAtTime(_lFwd.x, now);
        listener.forwardY.setValueAtTime(_lFwd.y, now);
        listener.forwardZ.setValueAtTime(_lFwd.z, now);
        listener.upX.setValueAtTime(_lUp.x, now);
        listener.upY.setValueAtTime(_lUp.y, now);
        listener.upZ.setValueAtTime(_lUp.z, now);
      } else if (listener.setPosition) {
        listener.setPosition(cam.position.x, cam.position.y, cam.position.z);
        listener.setOrientation(_lFwd.x, _lFwd.y, _lFwd.z, _lUp.x, _lUp.y, _lUp.z);
      }

      // Hit-stop -12 dB storm bed ducking (gain = 0.25)
      const duck = getHitStopDuck(simTime);
      stormBedGain.gain.setTargetAtTime(lerp(1.0, 0.25, duck), now, 0.012);

      // Wind gusting
      const gust = 0.5 + 0.5 * Math.sin(simTime * 0.55) * Math.cos(simTime * 0.23 + 0.8);
      windFilter.frequency.setTargetAtTime(240 + gust * 250, now, 0.05);
      windGain.gain.setTargetAtTime(0.16 + gust * 0.14, now, 0.05);

      // Rain: slightly louder & duller as wetness rises 0 -> 1
      const wet = getWetness(simTime);
      rainFilter.frequency.setTargetAtTime(lerp(3400, 1950, wet), now, 0.05);
      rainGain.gain.setTargetAtTime(lerp(0.085, 0.155, wet), now, 0.05);

      // Titan spatial audio (stone grind follows fastest limb angular speed; hum follows average charge)
      const bChest = titanPose.bones[BONE_INDEX.chest];
      setPannerPos(titanPanner, bChest.pos.x, bChest.pos.y, bChest.pos.z);

      const limbSpd = getTitanMaxLimbAngularSpeed(m);
      const grindAmt = m < 32.8 ? clamp(limbSpd * 0.45, 0, 1) : 0;
      grindOsc.frequency.setTargetAtTime(38 + grindAmt * 34, now, 0.04);
      grindFilter.frequency.setTargetAtTime(90 + grindAmt * 140, now, 0.04);
      grindGain.gain.setTargetAtTime(grindAmt * 0.34, now, 0.04);

      const avgC = titanPose.avgCharge;
      const humLvl = clamp(avgC * 0.22, 0, 0.38);
      humNoiseFilter.frequency.setTargetAtTime(1600 + avgC * 2200, now, 0.04);
      humOsc1.frequency.setTargetAtTime(95 + avgC * 26, now, 0.04);
      humOsc2.frequency.setTargetAtTime(190 + avgC * 54, now, 0.04);
      humGain.gain.setTargetAtTime(humLvl, now, 0.04);

      // Hunter spatial audio (tether reel whine + air whoosh)
      setPannerPos(hunterPanner, hunterState.chestPos.x, hunterState.chestPos.y, hunterState.chestPos.z);
      const hSpeed = hunterState.speed;
      const tetherAttached = (m >= 3.3 && m < 5.6) || (m >= 9.3 && m < 12.4) || (m >= 23.8 && m < 30.8);
      reelOsc.frequency.setTargetAtTime(310 + clamp(hSpeed, 0, 35) * 26, now, 0.03);
      reelGain.gain.setTargetAtTime(tetherAttached ? clamp(0.06 + hSpeed * 0.008, 0.05, 0.22) : 0.0, now, 0.025);

      const whooshLvl = clamp((hSpeed - 6.0) / 24.0, 0, 1) * 0.18;
      whooshFilter.frequency.setTargetAtTime(340 + hSpeed * 30, now, 0.04);
      whooshGain.gain.setTargetAtTime(whooshLvl, now, 0.03);
    }

    // Trigger one-shots strictly when forward PLAYING crosses event time: prevT < eventT <= curT
    function triggerForwardEvents(prevT, curT, titanPose, hunterState) {
      if (!ready || !isAudible || curT <= prevT) return;
      const crossed = tEv => (prevT < tEv && curT >= tEv);

      // Footfalls
      for (let i = 0; i < FOOTFALL_POSITIONS.length; i++) {
        const f = FOOTFALL_POSITIONS[i];
        if (crossed(f.t)) playThud([f.x, 0, f.z], 76, 25, 0.46, 0.62, 0.35);
      }
      // Fist slam (7.500)
      if (crossed(7.500)) {
        playThud([SLAM_TARGET.x, SLAM_TARGET.y, SLAM_TARGET.z], 68, 18, 0.95, 1.0, 0.85);
      }
      // Left knee impact (13.000)
      if (crossed(13.000)) {
        playThud([19.0, 0, 5.2], 72, 22, 0.72, 0.88, 0.65);
      }
      // Tethers launch & attach
      for (let i = 0; i < TETHER_CONFIGS.length; i++) {
        const tc = TETHER_CONFIGS[i];
        if (crossed(tc.fireT)) playTetherFire(hunterState.launcherPos);
        if (crossed(tc.attachT)) playTetherAttach(titanPose.bones[BONE_INDEX[tc.bone]].pos);
      }
      // Strikes (ascending pitch!)
      for (let i = 0; i < STRIKES.length; i++) {
        const st = STRIKES[i];
        if (crossed(st.t)) playStrike(titanPose.wpPos[st.wpIndex], st.pitch, i === 3);
      }
      // Sweep body hit (19.000)
      if (crossed(19.000)) {
        playThud([SWEEP_HIT_POS.x, SWEEP_HIT_POS.y, SWEEP_HIT_POS.z], 130, 34, 0.34, 0.85, 0.55);
      }
      // Ragdoll tumble thumps
      ragdollSim.init();
      for (let i = 0; i < ragdollSim.impactTimes.length; i++) {
        const imp = ragdollSim.impactTimes[i];
        if (crossed(imp.t)) {
          playThud(imp.pos, 105, 42, 0.16, 0.30 * imp.intensity, 0.18 * imp.intensity);
        }
      }
      // Hunter landings (13.500, 31.500)
      if (crossed(13.500) || crossed(31.500)) {
        playThud([hunterState.rootPos.x, hunterState.rootPos.y, hunterState.rootPos.z], 115, 45, 0.18, 0.34, 0.22);
      }
      // Distance-delayed thunder (340 m/s)
      for (let i = 0; i < thunderEvents.length; i++) {
        if (crossed(thunderEvents[i].t)) playThunder(thunderEvents[i]);
      }
      // Collapse bone charge-loss falling electrical whines
      const collapseWhines = [
        [29.700, 'head'], [30.200, 'upperArmR'], [30.800, 'chest'],
        [31.400, 'spine'], [32.000, 'pelvis'], [32.600, 'thighL']
      ];
      for (let i = 0; i < collapseWhines.length; i++) {
        if (crossed(collapseWhines[i][0])) {
          playCollapseWhine(titanPose.bones[BONE_INDEX[collapseWhines[i][1]]].pos);
        }
      }
      // Scattered collapse boulder ground landing thuds
      for (let i = 0; i < boulderAudioImpacts.length; i++) {
        const bi = boulderAudioImpacts[i];
        if (crossed(bi.t)) {
          playThud([bi.x, bi.y, bi.z], 85 + (i % 5) * 8, 28, 0.28, 0.36 + 0.08 * bi.size, 0.24);
        }
      }
    }

    return { setup, resume, setPlayingState, updateContinuous, triggerForwardEvents };
  })();

  StormAudio.setup();
  window.addEventListener('pointerdown', () => StormAudio.resume(), { passive: true });
  window.addEventListener('keydown', () => StormAudio.resume(), { passive: true });

  // =========================================================================
  // 20. DETERMINISTIC FRAME EVALUATOR renderAt(simTime)
  // =========================================================================
  const _m4 = new THREE.Matrix4();
  const _bPos = new THREE.Vector3();
  const _bQuat = new THREE.Quaternion();
  const _bRotQ = new THREE.Quaternion();
  const _dScale = new THREE.Vector3();
  const _dEuler = new THREE.Euler();
  const _dQuat = new THREE.Quaternion();
  const _curFogCol = new THREE.Color();

  function renderAt(simTime, isCountdown) {
    const t = clamp(simTime, 0, DURATION);
    const m = motionTime(t);
    const wetness = getWetness(t);
    const { flash: skyFlash, activeIdx: skyIdx } = getSkyFlash(t);

    // 1. Evaluate Titan 16-bone skeleton & Hunter (active / Verlet ragdoll / blend) at motionTime
    evalTitanPose(m, titanPoseMain);
    evalHunterState(m, titanPoseMain, hunterStateMain);

    // 2. Evaluate Camera at simTime (with closed-form Hs, FOV kick & trauma^2 shake)
    evalCameraState(t, titanPoseMain, hunterStateMain, camStateMain);
    camera.position.copy(camStateMain.pos);
    camera.lookAt(camStateMain.target);
    camera.quaternion.multiply(camStateMain.rotShake);
    if (Math.abs(camera.fov - camStateMain.fov) > 1e-4) {
      camera.fov = camStateMain.fov;
      camera.updateProjectionMatrix();
    }
    camera.updateMatrixWorld();

    // Keep opaque procedural sky dome centered on camera
    skyMesh.position.copy(camera.position);

    // 3. Apply Global Wetness (0 -> 1 over 0..30s): roughness 0.90 -> 0.35, darker albedo, higher specular env reflection!
    const surfRough = lerp(0.90, 0.35, wetness);
    const envBoost = lerp(0.35, 1.95, wetness);
    const darkTint = lerp(1.0, 0.68, wetness);

    terrain.mat.roughness = surfRough;
    terrain.mat.envMapIntensity = envBoost * 0.85;
    terrain.mat.color.setRGB(darkTint, darkTint, darkTint);

    for (let v = 0; v < 3; v++) {
      boulderMats[v].roughness = surfRough;
      boulderMats[v].envMapIntensity = envBoost;
      boulderMats[v].color.setRGB(0.60 * darkTint, 0.63 * darkTint, 0.70 * darkTint);
    }

    hunterMaterials.cloth.roughness = lerp(0.90, 0.42, wetness);
    hunterMaterials.cloth.envMapIntensity = envBoost * 0.7;
    hunterMaterials.leather.roughness = surfRough;
    hunterMaterials.leather.envMapIntensity = envBoost * 0.9;
    hunterMaterials.metal.roughness = lerp(0.52, 0.22, wetness);
    hunterMaterials.metal.envMapIntensity = lerp(0.85, 2.2, wetness);
    hunterMaterials.accent.roughness = lerp(0.86, 0.40, wetness);
    hunterMaterials.accent.envMapIntensity = envBoost * 0.65;

    // 4. Update Sky, Fog & Sky-Lightning Flash Lighting
    _curFogCol.copy(baseFogColor).lerp(flashFogColor, skyFlash * 0.68);
    scene.fog.color.copy(_curFogCol);
    skyUniforms.uTime.value = m;
    skyUniforms.uFlash.value = skyFlash;
    skyUniforms.uFogColor.value.copy(_curFogCol);
    if (skyIdx >= 0) {
      const st = SKY_STRIKES[skyIdx];
      skyUniforms.uFlashDir.value.set(st.pos[0], 60, st.pos[2]).normalize();
      flashDirLight.position.set(st.pos[0], 110, st.pos[2]);
    }
    flashDirLight.intensity = skyFlash * 4.5;
    keyLight.intensity = 1.55 + skyFlash * 1.1;

    // 5. Update 152 Titan Boulders (attached drifting OR closed-form ballistic collapse!)
    for (let i = 0; i < boulders.length; i++) {
      const b = boulders[i];
      const bone = titanPoseMain.bones[b.boneIdx];
      let oreCharge = bone.charge;

      if (m < b.releaseT) {
        // Floating, drifting, slowly rotating around its bone
        evalBoulderAttachedWorld(b, m, titanPoseMain, _bPos, _bQuat);
        // Brighten blue ore veins near active arcs with subtle 20 Hz crackle
        const tick = Math.floor(t * 20);
        oreCharge *= (0.75 + 0.45 * hashFloat(tick * 89 + i * 17));
      } else {
        // Closed-form ballistic collapse with single dampened bounce onto plateau!
        oreCharge = 0.0;
        if (m < b.impactT) {
          const dt = m - b.releaseT;
          _bPos.set(
            b.relPos.x + b.relVel.x * dt,
            b.relPos.y + b.relVel.y * dt - 0.5 * GRAVITY * dt * dt,
            b.relPos.z + b.relVel.z * dt
          );
          _bRotQ.setFromAxisAngle(b.rotAxis, dt * (1.5 + Math.abs(b.rotSpeed) * 4.0));
          _bQuat.copy(b.relQuat).multiply(_bRotQ);
        } else if (m < b.impactT + b.bounceDur) {
          const dtB = m - b.impactT;
          const uB = dtB / Math.max(0.01, b.bounceDur);
          const arcY = b.bounceVelY * dtB - 0.5 * GRAVITY * dtB * dtB;
          _bPos.set(
            lerp(b.impactPos.x, b.settlePos.x, uB),
            lerp(b.impactPos.y, b.settlePos.y, uB) + Math.max(0, arcY),
            lerp(b.impactPos.z, b.settlePos.z, uB)
          );
          const dtTot = b.impactT - b.releaseT + dtB * 0.45;
          _bRotQ.setFromAxisAngle(b.rotAxis, dtTot * (1.5 + Math.abs(b.rotSpeed) * 4.0));
          _bQuat.copy(b.relQuat).multiply(_bRotQ);
        } else {
          _bPos.copy(b.settlePos);
          const dtTot = b.impactT - b.releaseT + b.bounceDur * 0.45;
          _bRotQ.setFromAxisAngle(b.rotAxis, dtTot * (1.5 + Math.abs(b.rotSpeed) * 4.0));
          _bQuat.copy(b.relQuat).multiply(_bRotQ);
          // Faint dying spark glimmer in aftermath on a handful of stones
          if (m >= 35.5 && m < 39.2 && i < 16) {
            const dec = 1.0 - smoothstep((m - 36.0) / 3.2);
            oreCharge = 0.25 * dec * hashFloat(Math.floor(t * 12) * 31 + i * 7);
          }
        }
      }

      b.worldPos.copy(_bPos);
      _m4.compose(_bPos, _bQuat, b.scale);
      boulderMeshes[b.variant].setMatrixAt(b.localIdx, _m4);
      boulderChargeAttrs[b.variant].array[b.localIdx] = oreCharge;
    }
    for (let v = 0; v < 3; v++) {
      boulderMeshes[v].instanceMatrix.needsUpdate = true;
      boulderChargeAttrs[v].needsUpdate = true;
    }

    // 6. Update Weak Points (amber intact, blinding white strike flash, dark when broken)
    const wpBreakT = [5.000, 12.000, 29.500];
    let activeWpIdx = t < 5.0 ? 0 : (t < 12.0 ? 1 : (t >= 25.0 && t < 29.5 ? 2 : -1));
    for (let i = 0; i < 3; i++) {
      const wp = wpGroup[i];
      const pos = titanPoseMain.wpPos[i];
      // After chest releases at 30.8, hide broken W3 inside collapsed rubble
      if (i === 2 && m >= COLLAPSE_TIMES.chest) {
        wp.coreMesh.visible = false;
        wp.halo.visible = false;
        continue;
      }
      if (i === 0 && m >= COLLAPSE_TIMES.shinL) { wp.coreMesh.visible = false; wp.halo.visible = false; continue; }
      if (i === 1 && m >= COLLAPSE_TIMES.chest) { wp.coreMesh.visible = false; wp.halo.visible = false; continue; }

      wp.coreMesh.visible = true;
      wp.coreMesh.position.copy(pos);
      wp.halo.position.copy(pos);

      // Check strike white flash window (uses simTime so flash pops immediately during hit-stop!)
      let flashAmt = 0;
      for (let s = 0; s < STRIKES.length; s++) {
        if (STRIKES[s].wpIndex === i) {
          const age = t - STRIKES[s].t;
          if (age >= 0 && age < 0.28) {
            flashAmt = Math.max(flashAmt, 1.0 - age / 0.28);
          }
        }
      }

      const broken = t >= wpBreakT[i] + 0.28;
      const hiddenW3 = (i === 2 && t < 25.000);

      if (flashAmt > 0.01) {
        wp.coreMat.color.setHex(0xffffff);
        wp.coreMat.emissive.setHex(0xffffff);
        wp.coreMat.emissiveIntensity = 4.5 + 4.0 * flashAmt;
        wp.halo.visible = true;
        wp.haloMat.color.setHex(0xffffff);
        wp.haloMat.opacity = 0.95 * flashAmt + 0.2;
        const sc = 5.0 + 4.5 * flashAmt;
        wp.halo.scale.set(sc, sc, 1);
      } else if (broken) {
        wp.coreMat.color.setHex(0x161820);
        wp.coreMat.emissive.setHex(0x000000);
        wp.coreMat.emissiveIntensity = 0.0;
        wp.halo.visible = false;
      } else if (hiddenW3) {
        wp.coreMat.color.setHex(0x5a3610);
        wp.coreMat.emissive.setHex(0xff8418);
        wp.coreMat.emissiveIntensity = 0.35;
        wp.halo.visible = false;
      } else {
        const pulse = 0.85 + 0.25 * Math.sin(t * 5.2 + i * 2.0);
        wp.coreMat.color.setHex(0xffb840);
        wp.coreMat.emissive.setHex(0xff9218);
        wp.coreMat.emissiveIntensity = 3.2 * pulse;
        wp.halo.visible = true;
        wp.haloMat.color.setHex(0xffa430);
        wp.haloMat.opacity = 0.72 * pulse;
        const sc = 4.4 * (0.92 + 0.14 * pulse);
        wp.halo.scale.set(sc, sc, 1);
      }
    }

    if (activeWpIdx >= 0) {
      wpLight.position.copy(titanPoseMain.wpPos[activeWpIdx]);
      wpLight.intensity = 2.6 + 0.5 * Math.sin(t * 5.2);
    } else {
      wpLight.intensity = 0;
    }

    // 7. Update Dynamic Binding Lightning Arcs, Sky Lightning & Dynamic Arc Point Lights
    updateBindingArcs(t, m, titanPoseMain, camera.position);
    updateSkyLightning(t, titanPoseMain, camera.position);

    const tick20 = Math.floor(t * 20);
    const flicker = 0.82 + 0.36 * hashFloat(tick20 * 199);
    const bChest = titanPoseMain.bones[BONE_INDEX.chest];
    const bActiveArm = (m >= 16.5 && m < 21.5) ? titanPoseMain.bones[BONE_INDEX.fistL] : titanPoseMain.bones[BONE_INDEX.fistR];
    const bShinL = titanPoseMain.bones[BONE_INDEX.shinL];

    arcLights[0].position.lerpVectors(bChest.pos, bChest.end, 0.5);
    arcLights[0].intensity = bChest.charge * 3.8 * flicker;
    arcLights[1].position.copy(bActiveArm.pos);
    arcLights[1].intensity = bActiveArm.charge * 3.0 * flicker;
    arcLights[2].position.lerpVectors(bShinL.pos, bShinL.end, 0.5);
    arcLights[2].intensity = bShinL.charge * 2.8 * flicker;

    // 8. Update Hunter 14-Part Visual Rig + Wind-Fluttering Cloak
    for (let i = 0; i < HUNTER_PART_NAMES.length; i++) {
      const name = HUNTER_PART_NAMES[i];
      const dst = hunterRig.parts[name];
      const src = hunterStateMain.parts[name];
      dst.position.copy(src.pos);
      dst.quaternion.copy(src.quat);
    }
    // Procedural deterministic cloak wave flutter (in local cloak plane)
    const cPos = hunterRig.cloakGeo.attributes.position.array;
    const cOrig = hunterRig.cloakOrigPos;
    for (let v = 0; v < cPos.length; v += 3) {
      const ox = cOrig[v], oy = cOrig[v + 1];
      const hang = clamp(-oy / 0.96, 0, 1);
      const wave = Math.sin(hang * 6.5 - m * 14.0 + ox * 4.0) * 0.085 * hang * hang;
      cPos[v] = ox * (1.0 + 0.25 * hang);
      cPos[v + 1] = oy;
      cPos[v + 2] = wave;
    }
    hunterRig.cloakGeo.attributes.position.needsUpdate = true;
    hunterMaterials.blade.emissiveIntensity = 3.2 + hunterStateMain.slashing * 4.5;

    // 9. Update Real Verlet Tether Ribbon
    updateTetherVisual(m, t, camera.position);

    // 10. Update Grass, Rain, Splashes, Sparks, Fist-Slam Debris & Dust
    grassUniforms.uTime.value = m;
    grassUniforms.uWetness.value = wetness;
    grassUniforms.uFlash.value = skyFlash;
    grassUniforms.uFogColor.value.copy(_curFogCol);
    grassUniforms.uArcPos0.value.copy(arcLights[0].position);
    grassUniforms.uArcPos1.value.copy(arcLights[1].position);
    grassUniforms.uArcPos2.value.copy(arcLights[2].position);
    grassUniforms.uArcInt.value.set(arcLights[0].intensity * 0.45, arcLights[1].intensity * 0.45, arcLights[2].intensity * 0.45);

    rainUniforms.uTime.value = m;
    rainUniforms.uCamPos.value.copy(camera.position);
    rainUniforms.uFlash.value = skyFlash;

    splashUniforms.uTime.value = m;
    splashUniforms.uCamXZ.value.set(camera.position.x, camera.position.z);
    splashUniforms.uFlash.value = skyFlash;

    // Strike sparks strictly use simTime!
    sparkUniforms.uSimTime.value = t;
    dustUniforms.uTime.value = m;

    // Fist-slam parabolic dirt clods & torn grass (active 7.500 - 10.200)
    const debrisAge = m - 7.500;
    if (debrisAge >= 0 && debrisAge < 2.7) {
      debrisMesh.visible = true;
      for (let i = 0; i < DEBRIS_COUNT; i++) {
        const ds = debrisSeeds[i];
        const px = ds.ox + ds.vx * debrisAge;
        const pz = ds.oz + ds.vz * debrisAge;
        const gy = getGroundHeight(px, pz) + 0.1;
        const py = Math.max(gy, ds.oy + ds.vy * debrisAge - 0.5 * GRAVITY * debrisAge * debrisAge);
        const fadeOut = 1.0 - smoothstep((debrisAge - 2.2) / 0.5);
        _bPos.set(px, py, pz);
        _dEuler.set(ds.rx * debrisAge, ds.ry * debrisAge, ds.rz * debrisAge);
        _dQuat.setFromEuler(_dEuler);
        _dScale.set(ds.sx * fadeOut, ds.sy * fadeOut, ds.sz * fadeOut);
        _m4.compose(_bPos, _dQuat, _dScale);
        debrisMesh.setMatrixAt(i, _m4);
      }
      debrisMesh.instanceMatrix.needsUpdate = true;
    } else {
      debrisMesh.visible = false;
    }

    // 11. Render 3D Scene (with radial RGB chromatic aberration post-pass proportional to trauma^2!)
    const chromaPx = 6.0 * camStateMain.shake;
    if (chromaPx > 0.04) {
      renderer.setRenderTarget(postRT);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);

      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      postMat.uniforms.uChromaPx.value = chromaPx;
      renderer.render(postScene, postCam);
    } else {
      renderer.setRenderTarget(null);
      renderer.clear(true, true, true);
      renderer.render(scene, camera);
    }

    // 12. Render Wordless World-Anchored HUD inside #stage (final orthographic pass)
    updateHUD(t, titanPoseMain, isCountdown);
    renderer.clearDepth();
    renderer.render(hudScene, hudCam);
  }

  // =========================================================================
  // 21. 5-STATE PLAYBACK MACHINE, DOCK UI CONTROLS & RESIZE HANDLING
  // =========================================================================
  const elCountdown = document.getElementById('countdown');
  const elBtnRefire = document.getElementById('btn-refire');
  const elBtnToggle = document.getElementById('btn-toggle');
  const elIconPause = document.getElementById('icon-pause');
  const elIconPlay  = document.getElementById('icon-play');
  const elScrubber  = document.getElementById('scrubber');
  const elSpeedPills = Array.from(document.querySelectorAll('.speed-pill'));

  let state = 'COUNTDOWN'; // COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
  let simTime = 0.0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.0;
  let holdElapsed = 0.0;
  let lastRafMs = null;

  function setToggleVisual(showPause) {
    elIconPause.style.display = showPause ? '' : 'none';
    elIconPlay.style.display = showPause ? 'none' : '';
    elBtnToggle.setAttribute('aria-label', showPause ? 'Pause' : 'Play');
  }

  function hideCountdown() {
    elCountdown.style.display = 'none';
    elCountdown.textContent = '';
  }

  function showCountdownDigit(digitStr) {
    elCountdown.style.display = 'block';
    if (elCountdown.textContent !== digitStr) {
      elCountdown.textContent = digitStr;
    }
  }

  // Play / Pause Toggle (#btn-toggle)
  elBtnToggle.addEventListener('click', () => {
    StormAudio.resume();
    if (state === 'PLAYING') {
      state = 'PAUSED';
      setToggleVisual(false);
      StormAudio.setPlayingState(false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      hideCountdown();
      simTime = 0.0;
      elScrubber.value = '0';
      state = 'PAUSED';
      setToggleVisual(false);
      StormAudio.setPlayingState(false);
      renderAt(0.0, false);
    } else if (state === 'PAUSED') {
      state = 'PLAYING';
      setToggleVisual(true);
      StormAudio.setPlayingState(true);
    } else if (state === 'ENDED') {
      hideCountdown();
      simTime = 0.0;
      elScrubber.value = '0';
      state = 'PLAYING';
      setToggleVisual(true);
      StormAudio.setPlayingState(true);
      renderAt(0.0, false);
    }
  });

  // Speed Selector Pills (.speed-pill)
  elSpeedPills.forEach(pill => {
    pill.addEventListener('click', () => {
      const spd = parseFloat(pill.dataset.speed);
      if (!isNaN(spd) && spd > 0) playbackSpeed = spd;
      elSpeedPills.forEach(p => {
        const active = (p === pill);
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  // Scrubbing Slider (#scrubber)
  elScrubber.addEventListener('input', () => {
    hideCountdown();
    simTime = clamp(parseFloat(elScrubber.value) || 0, 0, DURATION);
    state = 'PAUSED';
    setToggleVisual(false);
    StormAudio.setPlayingState(false);
    renderAt(simTime, false);
  });

  // Silent Re-fire (#btn-refire -> REFIRE_HOLD for 1.000s wall-clock)
  elBtnRefire.addEventListener('click', () => {
    StormAudio.resume();
    hideCountdown();
    simTime = 0.0;
    elScrubber.value = '0';
    holdElapsed = 0.0;
    countdownElapsed = 0.0;
    state = 'REFIRE_HOLD';
    setToggleVisual(true);
    StormAudio.setPlayingState(false);
    renderAt(0.0, false);
  });

  // Responsive Resize
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();

    if (postRT) postRT.dispose();
    postRT = createPostRT(w, h);
    postMat.uniforms.tDiffuse.value = postRT.texture;
    postMat.uniforms.uResolution.value.set(w * dpr, h * dpr);

    renderAt(simTime, state === 'COUNTDOWN');
  });

  // Pre-initialize deterministic ragdoll cache so initial frame & scrub are instant
  ragdollSim.init();

  // Render initial resting scene (simTime = 0.000) synchronously before first rAF countdown!
  elScrubber.value = '0';
  showCountdownDigit('3');
  setToggleVisual(true);
  renderAt(0.0, true);

  // Main RequestAnimationFrame Loop
  function animate(nowMs) {
    requestAnimationFrame(animate);
    const rawDt = lastRafMs === null ? 0.0 : (nowMs - lastRafMs) / 1000.0;
    lastRafMs = nowMs;
    const dt = clamp(rawDt, 0.0, 0.1); // clamped so cold start or tab switches never jump!

    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.0) {
        showCountdownDigit('3');
      } else if (countdownElapsed < 2.0) {
        showCountdownDigit('2');
      } else if (countdownElapsed < 3.0) {
        showCountdownDigit('1');
      } else {
        hideCountdown();
        state = 'PLAYING';
        StormAudio.setPlayingState(true);
      }
      simTime = 0.0;
      elScrubber.value = '0';
      renderAt(0.0, state === 'COUNTDOWN');
    } else if (state === 'REFIRE_HOLD') {
      hideCountdown();
      holdElapsed += dt;
      simTime = 0.0;
      elScrubber.value = '0';
      if (holdElapsed >= 1.0) {
        state = 'PLAYING';
        StormAudio.setPlayingState(true);
      }
      renderAt(0.0, false);
    } else if (state === 'PLAYING') {
      const prevT = simTime;
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      elScrubber.value = simTime.toFixed(3);

      renderAt(simTime, false);

      // Update continuous audio & trigger one-shots strictly on forward crossing
      const m = motionTime(simTime);
      StormAudio.updateContinuous(simTime, m, titanPoseMain, hunterStateMain, camera);
      StormAudio.triggerForwardEvents(prevT, simTime, titanPoseMain, hunterStateMain);

      if (simTime >= DURATION) {
        simTime = DURATION;
        elScrubber.value = DURATION.toFixed(3);
        state = 'ENDED';
        setToggleVisual(false);
        StormAudio.setPlayingState(false);
      }
    }
    // PAUSED and ENDED hold cleanly without re-advancing simTime
  }

  requestAnimationFrame(animate);

  // =========================================================================
  // 22. MACHINE-READABLE BENCHMARK REPORT (TRUTHFUL SELF-REPORT)
  // =========================================================================
  window.BENCH_REPORT = {
    counts: {
      grassBlades: GRASS_COUNT,
      rainStreaks: RAIN_COUNT,
      boulders: boulders.length,
      arcs: ARC_COUNT,
      ropePoints: ROPE_POINTS,
      ragdollPoints: RAGDOLL_POINTS
    },
    systems: {
      titanSkeleton: 'full',
      grass: 'full',
      rainAndWetness: 'full',
      tethers: 'full',
      combatHitStop: 'full',
      ragdollBlend: 'full',
      camera: 'full',
      hud: 'full',
      audio: 'full',
      collapse: 'full'
