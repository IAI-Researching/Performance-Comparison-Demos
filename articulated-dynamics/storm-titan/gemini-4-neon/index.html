<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storm Titan</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  // =========================================================================
  // 1. CONSTANTS, EVENT TABLE & SELF-REPORT
  // =========================================================================
  const DURATION = 40;
  const FIXED_DT = 1 / 240;
  const GRAVITY = 9.81;
  const DEG2RAD = Math.PI / 180;
  const TWO_PI = Math.PI * 2;

  const GRASS_COUNT = 100000;
  const RAIN_COUNT = 20000;
  const SPLASH_COUNT = 600;
  const ARC_COUNT = 64;
  const ROPE_POINTS = 36;
  const RAGDOLL_POINTS = 13;
  const SPARKS_PER_STRIKE = 80;

  const STRIKES = [
    { t: 5.000,  hitStop: 0.100, dmg: 400, wpIndex: 0, label: '400', pitch: 540, dir: [0.2, 0.35, -0.9] },
    { t: 12.000, hitStop: 0.100, dmg: 600, wpIndex: 1, label: '600', pitch: 660, dir: [-0.5, 0.45, -0.75] },
    { t: 27.000, hitStop: 0.100, dmg: 500, wpIndex: 2, label: '500', pitch: 790, dir: [0.15, 0.4, 0.9] },
    { t: 29.500, hitStop: 0.200, dmg: 500, wpIndex: 2, label: '500', pitch: 940, dir: [-0.25, 0.55, -0.8] }
  ];

  const TRAUMA_EVENTS = [
    { t: 1.000,  trauma: 0.25 },
    { t: 2.500,  trauma: 0.25 },
    { t: 4.000,  trauma: 0.25 },
    { t: 5.000,  trauma: 0.45 },
    { t: 5.500,  trauma: 0.25 },
    { t: 7.500,  trauma: 0.90 },
    { t: 8.200,  trauma: 0.30 },
    { t: 12.000, trauma: 0.55 },
    { t: 13.000, trauma: 0.70 },
    { t: 19.000, trauma: 0.80 },
    { t: 25.000, trauma: 0.50 },
    { t: 27.000, trauma: 0.60 },
    { t: 29.500, trauma: 1.00 },
    { t: 31.500, trauma: 0.20 },
    { t: 33.000, trauma: 0.30 }
  ];

  const COLLAPSE_TIMES = {
    head: 29.700,
    upperArmL: 30.200, forearmL: 30.200, fistL: 30.200,
    upperArmR: 30.200, forearmR: 30.200, fistR: 30.200,
    chest: 30.800,
    spine: 31.400,
    pelvis: 32.000,
    thighL: 32.600, shinL: 32.600, footL: 32.600,
    thighR: 32.600, shinR: 32.600, footR: 32.600
  };

  const BONE_NAMES = [
    'pelvis', 'spine', 'chest', 'head',
    'upperArmL', 'forearmL', 'fistL',
    'upperArmR', 'forearmR', 'fistR',
    'thighL', 'shinL', 'footL',
    'thighR', 'shinR', 'footR'
  ];

  const BONE_INDEX = {};
  for (let i = 0; i < BONE_NAMES.length; i++) BONE_INDEX[BONE_NAMES[i]] = i;

  const SKY_STRIKES = [
    { t: 8.200,  pos: [80, 0, 26],   isHead: false, seed: 101 },
    { t: 25.000, pos: [15, 38, 0],   isHead: true,  seed: 202 },
    { t: 33.000, pos: [120, -18, 95], isHead: false, seed: 303 }
  ];

  // =========================================================================
  // 2. DETERMINISTIC PRNG & CLOSED-FORM TIMELINE / TERRAIN MATH
  // =========================================================================
  function createPRNG(seed) {
    let a = seed >>> 0;
    return function() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashFloat(n) {
    let x = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b);
    x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
    return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
  }

  function hashSigned(n) {
    return hashFloat(n) * 2 - 1;
  }

  function smoothNoise1D(x, seedOffset) {
    const i = Math.floor(x);
    const f = x - i;
    const u = f * f * (3 - 2 * f);
    const a = hashSigned(i * 374761393 + seedOffset * 668265263);
    const b = hashSigned((i + 1) * 374761393 + seedOffset * 668265263);
    return a + (b - a) * u;
  }

  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(t) { const c = clamp(t, 0, 1); return c * c * (3 - 2 * c); }
  function smootherstep(t) { const c = clamp(t, 0, 1); return c * c * c * (c * (c * 6 - 15) + 10); }
  function easeOutCubic(t) { const c = 1 - clamp(t, 0, 1); return 1 - c * c * c; }
  function easeInCubic(t) { const c = clamp(t, 0, 1); return c * c * c; }

  // Hit-stop motionTime(simTime): holds at strike time for hitStop, catches up linearly over 0.300s
  function motionTime(simTime) {
    for (let i = 0; i < STRIKES.length; i++) {
      const s = STRIKES[i];
      if (simTime >= s.t) {
        const endHold = s.t + s.hitStop;
        const endCatch = endHold + 0.300;
        if (simTime <= endHold) return s.t;
        if (simTime < endCatch) {
          const u = (simTime - endHold) / 0.300;
          return s.t + u * (s.hitStop + 0.300);
        }
      }
    }
    return simTime;
  }

  function isInHitStop(simTime) {
    for (let i = 0; i < STRIKES.length; i++) {
      const s = STRIKES[i];
      if (simTime >= s.t && simTime < s.t + s.hitStop) return true;
    }
    return false;
  }

  function getHitStopDuck(simTime) {
    let duck = 0;
    for (let i = 0; i < STRIKES.length; i++) {
      const s = STRIKES[i];
      if (simTime >= s.t && simTime < s.t + s.hitStop + 0.300) {
        if (simTime < s.t + s.hitStop) {
          duck = Math.max(duck, 1.0);
        } else {
          const u = (simTime - (s.t + s.hitStop)) / 0.300;
          duck = Math.max(duck, 1.0 - u);
        }
      }
    }
    return duck;
  }

  function getTrauma(simTime) {
    let tr = 0;
    let prevT = 0;
    for (let i = 0; i < TRAUMA_EVENTS.length; i++) {
      const ev = TRAUMA_EVENTS[i];
      if (ev.t > simTime) break;
      tr = Math.max(0, tr - 0.8 * (ev.t - prevT));
      tr = Math.min(1, tr + ev.trauma);
      prevT = ev.t;
    }
    tr = Math.max(0, tr - 0.8 * (simTime - prevT));
    return tr;
  }

  function getWetness(simTime) {
    return clamp(simTime / 30.0, 0, 1);
  }

  // Plateau disc of radius 90m with ±0.6m variation and jagged cliff drop
  function getGroundHeight(x, z) {
    const r = Math.hypot(x, z);
    let h =
      0.27 * Math.sin(x * 0.055 + 0.7) * Math.cos(z * 0.048 - 0.3) +
      0.17 * Math.sin(x * 0.11 - z * 0.09 + 1.4) +
      0.10 * Math.cos(x * 0.19 + z * 0.16 - 0.8);
    if (r > 85.0) {
      const ang = Math.atan2(z, x);
      const crag = 0.65 * Math.sin(ang * 17.0 + 0.5) + 0.35 * Math.cos(ang * 37.0 - 1.1);
      if (r <= 90.0) {
        const edgeT = (r - 85.0) / 5.0;
        h += edgeT * crag * 0.35;
      } else {
        const drop = r - 90.0;
        h = h + crag * 0.75 - drop * drop * 0.16 - drop * 1.45;
      }
    }
    return h;
  }

  function getSkyFlash(simTime) {
    let flash = 0;
    let activeIdx = -1;
    for (let i = 0; i < SKY_STRIKES.length; i++) {
      const age = simTime - SKY_STRIKES[i].t;
      if (age >= 0 && age < 0.45) {
        const f = Math.exp(-age * 7.5) * (1.0 - smoothstep((age - 0.32) / 0.13));
        const flicker = age < 0.12 ? (0.82 + 0.18 * Math.sin(age * 160)) : 1.0;
        const val = f * flicker;
        if (val > flash) {
          flash = val;
          activeIdx = i;
        }
      }
    }
    return { flash, activeIdx };
  }

  // Exact analytical 2-bone IK solver
  const _ikDir = new THREE.Vector3();
  const _ikPlaneN = new THREE.Vector3();
  const _ikBendDir = new THREE.Vector3();
  function solveTwoBoneIK(rootPos, targetPos, poleHint, L1, L2, outMid, outEnd) {
    _ikDir.subVectors(targetPos, rootPos);
    let d = _ikDir.length();
    const minD = Math.abs(L1 - L2) + 0.05;
    const maxD = L1 + L2 - 0.03;
    if (d < 1e-5) {
      _ikDir.set(0, -1, 0);
      d = minD;
    } else {
      _ikDir.divideScalar(d);
    }
    const clampedD = clamp(d, minD, maxD);
    outEnd.copy(rootPos).addScaledVector(_ikDir, clampedD);

    const cosA = clamp((L1 * L1 + clampedD * clampedD - L2 * L2) / (2 * L1 * clampedD), -1, 1);
    const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));

    // Orthogonalize poleHint against _ikDir
    _ikBendDir.copy(poleHint).addScaledVector(_ikDir, -poleHint.dot(_ikDir));
    if (_ikBendDir.lengthSq() < 1e-6) {
      _ikPlaneN.set(0, 0, 1);
      _ikBendDir.crossVectors(_ikDir, _ikPlaneN);
      if (_ikBendDir.lengthSq() < 1e-6) _ikBendDir.set(1, 0, 0);
    }
    _ikBendDir.normalize();

    outMid.copy(rootPos)
      .addScaledVector(_ikDir, L1 * cosA)
      .addScaledVector(_ikBendDir, L1 * sinA);
  }

  // Build quaternion whose local -Y axis points along `dir` and local -X aligns toward `fwdHint`
  const _qY = new THREE.Vector3();
  const _qX = new THREE.Vector3();
  const _qZ = new THREE.Vector3();
  const _qM = new THREE.Matrix4();
  function quatFromDownAndFwd(downDir, fwdHint, outQuat) {
    _qY.copy(downDir).normalize().negate(); // local +Y is opposite downDir
    _qZ.crossVectors(_qY, fwdHint);
    if (_qZ.lengthSq() < 1e-6) {
      _qZ.set(0, 0, 1);
      if (Math.abs(_qY.z) > 0.95) _qZ.set(1, 0, 0);
      _qZ.crossVectors(_qY, _qZ);
    }
    _qZ.normalize();
    // Since Titan faces -X, local -X is forward -> local +X = -forward -> +X = cross(+Y, +Z)
    _qX.crossVectors(_qY, _qZ).normalize();
    _qM.makeBasis(_qX, _qY, _qZ);
    outQuat.setFromRotationMatrix(_qM);
    return outQuat;
  }

  function quatFromUpAndFwd(upDir, fwdHint, outQuat) {
    _qY.copy(upDir).normalize();
    _qZ.crossVectors(_qY, fwdHint);
    if (_qZ.lengthSq() < 1e-6) {
      _qZ.set(0, 0, 1);
      if (Math.abs(_qY.z) > 0.95) _qZ.set(1, 0, 0);
      _qZ.crossVectors(_qY, _qZ);
    }
    _qZ.normalize();
    _qX.crossVectors(_qY, _qZ).normalize();
    _qM.makeBasis(_qX, _qY, _qZ);
    outQuat.setFromRotationMatrix(_qM);
    return outQuat;
  }

  // =========================================================================
  // 3. TITAN 16-BONE HIERARCHICAL SKELETON (CLOSED-FORM IN motionTime)
  // =========================================================================
  // Standing height ~40m, pelvis rest height 18m, shoulder width 16m, arms 17m, legs 18m.
  // Titan faces -X: Left = +Z, Right = -Z.
  const SLAM_TARGET = new THREE.Vector3(2.5, getGroundHeight(2.5, -6.0), -6.0);
  const SWEEP_HIT_POS = new THREE.Vector3(7.5, getGroundHeight(7.5, 5.5) + 1.15, 5.5);

  function createTitanPoseStruct() {
    const bones = [];
    for (let i = 0; i < BONE_NAMES.length; i++) {
      bones.push({
        name: BONE_NAMES[i],
        pos: new THREE.Vector3(),
        end: new THREE.Vector3(),
        quat: new THREE.Quaternion(),
        charge: 1.0,
        radius: 2.0
      });
    }
    return {
      bones,
      pelvisGround: new THREE.Vector3(40, 0, 0),
      wpPos: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()],
      chestParting: 0,
      avgCharge: 1.0
    };
  }

  const _tVec1 = new THREE.Vector3();
  const _tVec2 = new THREE.Vector3();
  const _tVec3 = new THREE.Vector3();
  const _tVec4 = new THREE.Vector3();
  const _tVec5 = new THREE.Vector3();
  const _tQuat1 = new THREE.Quaternion();
  const _tQuat2 = new THREE.Quaternion();
  const _tEuler = new THREE.Euler(0, 0, 0, 'YXZ');
  const _tFwd = new THREE.Vector3();
  const _tPole = new THREE.Vector3();
  const _tHipL = new THREE.Vector3();
  const _tHipR = new THREE.Vector3();
  const _tShL = new THREE.Vector3();
  const _tShR = new THREE.Vector3();
  const _tFootL = new THREE.Vector3();
  const _tFootR = new THREE.Vector3();
  const _tKneeL = new THREE.Vector3();
  const _tKneeR = new THREE.Vector3();
  const _tAnkleL = new THREE.Vector3();
  const _tAnkleR = new THREE.Vector3();
  const _tElbowL = new THREE.Vector3();
  const _tElbowR = new THREE.Vector3();
  const _tWristL = new THREE.Vector3();
  const _tWristR = new THREE.Vector3();
  const _tFistTargetR = new THREE.Vector3();
  const _tFistTargetL = new THREE.Vector3();

  // Titan footfalls: L at 1.0, R at 2.5, L at 4.0, R at 5.5
  const FOOTFALL_POSITIONS = [
    { t: 1.000, side: 'L', x: 33.0, z:  4.9 },
    { t: 2.500, side: 'R', x: 27.0, z: -4.9 },
    { t: 4.000, side: 'L', x: 21.0, z:  4.9 },
    { t: 5.500, side: 'R', x: 14.8, z: -5.1 }
  ];

  function getBoneCharge(name, m) {
    let c = 1.0;
    // Attack charges (1.6)
    if (m >= 6.0 && m < 8.2) {
      const env = smoothstep((m - 6.0) / 0.5) * (1 - smoothstep((m - 7.6) / 0.6));
      if (name === 'upperArmR' || name === 'forearmR' || name === 'fistR' || name === 'chest') {
        c = lerp(c, 1.6, env);
      } else {
        c = lerp(c, 1.25, env);
      }
    }
    if (m >= 17.0 && m < 19.8) {
      const env = smoothstep((m - 17.0) / 0.5) * (1 - smoothstep((m - 19.3) / 0.5));
      if (name === 'upperArmL' || name === 'forearmL' || name === 'fistL' || name === 'chest') {
        c = lerp(c, 1.6, env);
      } else {
        c = lerp(c, 1.25, env);
      }
    }
    // Sky lightning overload on head & chest at 25.000
    if (m >= 25.0 && m < 26.2) {
      const env = Math.exp(-(m - 25.0) * 2.5);
      c += 0.7 * env;
    }
    // Stagger dim (0.4)
    if (m >= 12.0 && m < 16.0) {
      const inEnv = smoothstep((m - 12.0) / 0.25);
      const outEnv = 1 - smoothstep((m - 15.0) / 1.0);
      c = lerp(c, 0.4, inEnv * outEnv);
    }
    // Collapse bone-by-bone failure
    const rel = COLLAPSE_TIMES[name];
    if (m >= rel - 0.35) {
      const u = clamp((m - (rel - 0.35)) / 0.35, 0, 1);
      c *= (1 - u);
    }
    return clamp(c, 0, 2.2);
  }

  function evalTitanPose(m, out) {
    const t = clamp(m, 0, DURATION);

    // 1. Pelvis ground X & Z, height, sway, and gait
    let pelX = 16.0;
    let pelZ = 0.0;
    let pelYOff = 0.0;
    let pelYaw = 0.0;
    let pelPitch = 0.0; // positive leans forward (-X)
    let pelRoll = 0.0;  // positive leans left (+Z)
    let spinePitch = 0.06;
    let spineYaw = 0.0;
    let spineRoll = 0.0;
    let chestPitch = 0.08;
    let chestYaw = 0.0;
    let headPitch = 0.05;
    let headYaw = 0.0;

    // Foot world targets
    let flX = 20.6, flZ = 5.0, flLift = 0.0;
    let frX = 14.8, frZ = -5.1, frLift = 0.0;

    if (t < 6.0) {
      // Heavy walk from x=40 to x=16 at 4 m/s with weight-shift cadence (exact 40.0 at t=0, 16.0 at t=6)
      const rampIn = smoothstep(t / 0.45);
      pelX = 40.0 - 4.0 * t + 0.30 * Math.sin((t - 1.0) * TWO_PI / 1.5) * rampIn;
      if (t > 5.4) {
        const stopU = smoothstep((t - 5.4) / 0.6);
        pelX = lerp(pelX, 16.0, stopU);
      }

      // Weight shift toward planted foot & heavy vertical sink on impact
      const gaitCycle = (t - 1.0) * Math.PI / 1.5; // pi per step
      const shiftWeight = rampIn * (1.0 - smoothstep((t - 5.5) / 0.5));
      pelZ = 1.35 * Math.cos(gaitCycle) * shiftWeight;
      pelRoll = 0.065 * Math.cos(gaitCycle) * shiftWeight;
      pelYOff = (-0.95 * Math.cos(2 * gaitCycle - 0.55) - 0.35) * shiftWeight;
      pelYaw = -0.10 * Math.cos(gaitCycle) * shiftWeight;
      spineYaw = 0.14 * Math.cos(gaitCycle) * shiftWeight;
      chestYaw = 0.16 * Math.cos(gaitCycle) * shiftWeight;
      pelPitch = 0.08 * shiftWeight;

      if (t < 1.0) {
        const u = smootherstep(t / 1.0);
        flX = lerp(42.5, 33.0, u);
        flLift = 3.1 * Math.sin(u * Math.PI);
      } else if (t < 2.5) {
        flX = 33.0;
        flLift = 0.0;
      } else if (t < 4.0) {
        const u = smootherstep((t - 2.5) / 1.5);
        flX = lerp(33.0, 21.0, u);
        flLift = 3.4 * Math.sin(u * Math.PI);
      } else {
        flX = 21.0;
        flLift = 0.0;
      }
      flZ = 4.9;

      if (t < 1.0) {
        frX = 38.8;
        frLift = 0.0;
      } else if (t < 2.5) {
        const u = smootherstep((t - 1.0) / 1.5);
        frX = lerp(38.8, 27.0, u);
        frLift = 3.4 * Math.sin(u * Math.PI);
      } else if (t < 4.0) {
        frX = 27.0;
        frLift = 0.0;
      } else if (t < 5.5) {
        const u = smootherstep((t - 4.0) / 1.5);
        frX = lerp(27.0, 14.8, u);
        frLift = 3.4 * Math.sin(u * Math.PI);
      } else {
        frX = 14.8;
        frLift = 0.0;
      }
      frZ = -4.9 - 0.2 * smoothstep((t - 4.0) / 1.5);
    } else {
      flX = 20.6; flZ = 5.0;
      frX = 14.8; frZ = -5.1;
      if (t < 6.5) flX = lerp(21.0, 20.6, smoothstep((t - 6.0) / 0.5));
    }

    // Recoil from W1 strike at 5.000
    if (t >= 5.0 && t < 6.0) {
      const rec = Math.sin(clamp((t - 5.0) / 0.7, 0, 1) * Math.PI);
      pelYOff -= 0.75 * rec;
      spineRoll -= 0.10 * rec;
      headPitch += 0.14 * rec;
    }

    // 2. Slam wind-up (6.0-7.5), planted fist (7.5-10.5), lift (10.5-12.0)
    if (t >= 6.0 && t < 12.0) {
      if (t < 7.15) {
        const u = smootherstep((t - 6.0) / 1.15);
        pelYOff += 0.65 * u;
        pelPitch -= 0.14 * u;
        spinePitch -= 0.12 * u;
        chestYaw -= 0.38 * u;
        spineYaw -= 0.20 * u;
        headPitch -= 0.12 * u;
      } else if (t < 7.50) {
        const u = easeInCubic((t - 7.15) / 0.35);
        // Deep powerful forward lunge so 17.5m right arm drives fistR directly into ground SLAM_TARGET!
        pelYOff = lerp(0.65, -6.2, u);
        pelX = lerp(16.0, 13.0, u);
        pelPitch = lerp(-0.14, 0.34, u);
        spinePitch = lerp(-0.06, 0.42, u);
        chestPitch = lerp(0.08, 0.38, u);
        chestYaw = lerp(-0.38, 0.26, u);
        spineYaw = lerp(-0.20, 0.14, u);
        headPitch = lerp(-0.07, 0.30, u);
      } else if (t < 10.50) {
        const settle = Math.exp(-(t - 7.5) * 4.0) * Math.sin((t - 7.5) * 16.0);
        pelYOff = -6.2 - 0.35 * settle;
        pelX = 13.0;
        pelPitch = 0.34;
        spinePitch = 0.42;
        chestPitch = 0.38;
        chestYaw = 0.26;
        spineYaw = 0.14;
        headPitch = 0.30 + 0.06 * Math.sin((t - 7.5) * 1.4);
      } else {
        const u = smootherstep((t - 10.5) / 1.5);
        pelYOff = lerp(-6.2, 0.3, u);
        pelX = lerp(13.0, 16.0, u);
        pelPitch = lerp(0.34, -0.04, u);
        spinePitch = lerp(0.42, 0.04, u);
        chestPitch = lerp(0.38, 0.06, u);
        chestYaw = lerp(0.26, -0.22, u);
        spineYaw = lerp(0.14, -0.10, u);
        headPitch = lerp(0.30, 0.04, u);
      }
    }

    // 3. Stagger (12.0 - 16.0): reels, drops onto LEFT KNEE at 13.000, rises 15.0-16.0
    let kneelingL = 0.0;
    if (t >= 12.0 && t < 16.0) {
      if (t < 13.0) {
        const u = smootherstep((t - 12.0) / 1.0);
        const reel = Math.sin(u * Math.PI);
        kneelingL = u;
        pelX = lerp(16.0, 18.2, u) + 1.1 * reel;
        pelZ = lerp(0.0, 1.4, u);
        pelYOff = lerp(0.3, -8.35, easeInCubic(u));
        pelPitch = lerp(-0.04, 0.22, u);
        spinePitch = lerp(0.04, 0.34, u);
        chestPitch = lerp(0.06, 0.30, u);
        chestYaw = lerp(-0.22, 0.35, u);
        spineRoll = 0.16 * u;
        headPitch = 0.45 * u;
      } else if (t < 15.0) {

        const impact = Math.exp(-(t - 13.0) * 5.0) * Math.sin((t - 13.0) * 14.0);
        const breath = Math.sin((t - 13.0) * 2.8);
        pelX = 18.2;
        pelZ = 1.4;
        pelYOff = -8.35 - 0.25 * impact + 0.18 * breath;
        pelPitch = 0.22;
        spinePitch = 0.34 + 0.05 * breath;
        chestPitch = 0.30 + 0.04 * breath;
        chestYaw = 0.35;
        spineRoll = 0.16;
        headPitch = 0.50 + 0.06 * breath;
      } else {
        const u = smootherstep((t - 15.0) / 1.0);
        kneelingL = 1.0 - u;
        pelX = lerp(18.2, 16.0, u);
        pelZ = lerp(1.4, 0.0, u);
        pelYOff = lerp(-8.35, 0.0, u);
        pelPitch = lerp(0.22, 0.02, u);
        spinePitch = lerp(0.34, 0.06, u);
        chestPitch = lerp(0.30, 0.08, u);
        chestYaw = lerp(0.35, 0.0, u);
        spineRoll = lerp(0.16, 0.0, u);
        headPitch = lerp(0.50, 0.05, u);

      flZ = lerp(5.0, 5.2, kneelingL);

    }

    // 4. Left-arm sweep (17.0 - 18.5 windup, 18.5 - 19.3 low sweep across grass, 19.3 - 22.0 recover)
    if (t >= 16.8 && t < 22.2) {
      if (t < 18.5) {

        headYaw = -0.35 * u;
      } else if (t < 19.3) {
        const u = smoothstep((t - 18.5) / 0.8);
        pelYOff = -6.6;
        pelX = lerp(14.2, 12.4, u);
        pelPitch = 0.36;
        spinePitch = 0.42;
        chestPitch = 0.34;
        spineYaw = lerp(0.38, -0.45, u);
        chestYaw = lerp(0.56, -0.65, u);
        headYaw = lerp(-0.35, 0.35, u);
      } else {
        const u = smootherstep((t - 19.3) / 2.9);
        pelYOff = lerp(-6.6, 0.0, u);
        pelX = lerp(12.4, 16.0, u);
        pelPitch = lerp(0.36, 0.02, u);
        spinePitch = lerp(0.42, 0.06, u);
        chestPitch = lerp(0.34, 0.06, u);
        spineYaw = lerp(-0.45, 0.0, u);
        chestYaw = lerp(-0.65, 0.0, u);
        headYaw = lerp(0.35, 0.0, u);
      }
    }

    // 5. Phase 6 (22.5 - 29.7): Towering stance, sky lightning jolt at 25.0, W3 strike recoils at 27.0 & 29.5
    if (t >= 22.2) {
      const idle = Math.sin(t * 1.15);
      pelYOff += 0.25 * idle;
      chestPitch += 0.03 * idle;

      // Sky lightning strike on head at 25.000
      if (t >= 25.0) {
        const age = t - 25.0;
        const jolt = Math.exp(-age * 2.2) * Math.sin(Math.min(age, 1.5) * 9.0);
        const arch = smoothstep(age / 0.22) * (1 - smoothstep((age - 0.8) / 1.2));
        spinePitch -= 0.28 * arch + 0.08 * jolt;
        chestPitch -= 0.24 * arch;
        headPitch -= 0.45 * arch;
        pelYOff -= 0.8 * arch;
      }

      // First W3 strike recoil at 27.000
      if (t >= 27.0 && t < 29.5) {
        const age = t - 27.0;
        const rec = smoothstep(age / 0.18) * (1 - smoothstep((age - 0.5) / 1.4));
        spinePitch -= 0.22 * rec;
        chestYaw += 0.26 * rec;
        pelYOff -= 0.9 * rec;
      }

      // Killing strike recoil at 29.500 (chest thrown open as bones lose charge!)
      if (t >= 29.5) {
        const age = t - 29.5;
        const rec = smoothstep(age / 0.35);
        spinePitch -= 0.30 * rec;
        chestPitch -= 0.20 * rec;
        headPitch -= 0.35 * rec;
        pelYOff -= 1.2 * rec;
      }
    }

    // Ground height under pelvis
    const groundAtPelvis = getGroundHeight(pelX, pelZ);
    out.pelvisGround.set(pelX, groundAtPelvis, pelZ);
    const pelY = groundAtPelvis + 18.0 + pelYOff;

    // --- Assemble central spine hierarchy: pelvis -> spine -> chest -> head ---
    const bPelvis = out.bones[BONE_INDEX.pelvis];
    const bSpine  = out.bones[BONE_INDEX.spine];
    const bChest  = out.bones[BONE_INDEX.chest];
    const bHead   = out.bones[BONE_INDEX.head];

    // Note: Titan faces -X, so pitching forward (-X) is a positive rotation around +Z!
    // Wait: let's verify right-hand rule around +Z: (0, 1, 0) rotated by +theta around +Z becomes (-sin, cos, 0) = FORWARD (-X)!!
    // YES! +Z rotation tilts +Y toward -X (forward)!
    // Roll toward left (+Z): +X rotation tilts +Y toward +Z -> +theta around +X tilts left!
    // Yaw toward left (+Z): rotating (-1, 0, 0) around +Y by +theta gives (-cos, 0, +sin) -> +Y rotation turns toward LEFT (+Z)!
    _tEuler.set(pelRoll, pelYaw, pelPitch, 'YXZ');
    bPelvis.quat.setFromEuler(_tEuler);
    bPelvis.pos.set(pelX, pelY, pelZ);
    bPelvis.end.set(0, 3.5, 0).applyQuaternion(bPelvis.quat).add(bPelvis.pos);
    bPelvis.radius = 3.2;

    _tEuler.set(spineRoll, spineYaw, spinePitch, 'YXZ');
    _tQuat1.setFromEuler(_tEuler);
    bSpine.quat.copy(bPelvis.quat).multiply(_tQuat1);
    bSpine.pos.copy(bPelvis.end);
    bSpine.end.set(0, 5.5, 0).applyQuaternion(bSpine.quat).add(bSpine.pos);
    bSpine.radius = 2.6;

    _tEuler.set(0, chestYaw, chestPitch, 'YXZ');
    _tQuat1.setFromEuler(_tEuler);
    bChest.quat.copy(bSpine.quat).multiply(_tQuat1);
    bChest.pos.copy(bSpine.end);
    bChest.end.set(0, 7.0, 0).applyQuaternion(bChest.quat).add(bChest.pos);
    bChest.radius = 4.2;

    _tEuler.set(0, headYaw, headPitch, 'YXZ');
    _tQuat1.setFromEuler(_tEuler);
    bHead.quat.copy(bChest.quat).multiply(_tQuat1);
    bHead.pos.set(-0.6, 7.2, 0).applyQuaternion(bChest.quat).add(bChest.pos);
    bHead.end.set(0, 5.2, 0).applyQuaternion(bHead.quat).add(bHead.pos);
    bHead.radius = 2.3;

    // --- Legs via exact 2-bone IK (thigh 8.5m, shin 7.5m, foot 1.0m) ---
    _tHipL.set(0, -1.0,  4.8).applyQuaternion(bPelvis.quat).add(bPelvis.pos);
    _tHipR.set(0, -1.0, -4.8).applyQuaternion(bPelvis.quat).add(bPelvis.pos);

    const gFL = getGroundHeight(flX, flZ);
    const gFR = getGroundHeight(frX, frZ);
    _tFootL.set(flX, gFL + 1.0 + flLift, flZ);
    _tFootR.set(frX, gFR + 1.0 + frLift, frZ);

    // Knee bends forward (-X) in Titan's pelvis frame
    _tPole.set(-1, 0.15, 0.18).applyQuaternion(bPelvis.quat).normalize();
    solveTwoBoneIK(_tHipL, _tFootL, _tPole, 8.5, 7.5, _tKneeL, _tAnkleL);

    // During left knee impact (kneelingL > 0.01), force left knee smoothly onto ground at 13.000!
    if (kneelingL > 0.001) {
      const kGround = getGroundHeight(_tKneeL.x, _tKneeL.z) + 1.15;
      _tKneeL.y = lerp(_tKneeL.y, kGround, kneelingL);
      // Keep shin length 7.5m from knee back to foot
      _tVec1.subVectors(_tFootL, _tKneeL);
      const sl = _tVec1.length();
      if (sl > 0.1) _tAnkleL.copy(_tKneeL).addScaledVector(_tVec1, 7.5 / sl);
    }

    _tPole.set(-1, 0.15, -0.18).applyQuaternion(bPelvis.quat).normalize();
    solveTwoBoneIK(_tHipR, _tFootR, _tPole, 8.5, 7.5, _tKneeR, _tAnkleR);

    _tFwd.set(-1, 0, 0).applyQuaternion(bPelvis.quat);

    const bThighL = out.bones[BONE_INDEX.thighL];
    const bShinL  = out.bones[BONE_INDEX.shinL];
    const bFootL  = out.bones[BONE_INDEX.footL];
    bThighL.pos.copy(_tHipL); bThighL.end.copy(_tKneeL); bThighL.radius = 2.3;
    quatFromDownAndFwd(_tVec1.subVectors(_tKneeL, _tHipL), _tFwd, bThighL.quat);
    bShinL.pos.copy(_tKneeL); bShinL.end.copy(_tAnkleL); bShinL.radius = 1.95;
    quatFromDownAndFwd(_tVec1.subVectors(_tAnkleL, _tKneeL), _tFwd, bShinL.quat);
    bFootL.pos.copy(_tAnkleL);
    bFootL.end.set(_tAnkleL.x - 1.8, Math.max(gFL + 0.1, _tAnkleL.y - 0.9), _tAnkleL.z);
    bFootL.quat.setFromEuler(_tEuler.set(0, pelYaw, 0));
    bFootL.radius = 2.1;

    const bThighR = out.bones[BONE_INDEX.thighR];
    const bShinR  = out.bones[BONE_INDEX.shinR];
    const bFootR  = out.bones[BONE_INDEX.footR];
    bThighR.pos.copy(_tHipR); bThighR.end.copy(_tKneeR); bThighR.radius = 2.3;
    quatFromDownAndFwd(_tVec1.subVectors(_tKneeR, _tHipR), _tFwd, bThighR.quat);
    bShinR.pos.copy(_tKneeR); bShinR.end.copy(_tAnkleR); bShinR.radius = 1.95;
    quatFromDownAndFwd(_tVec1.subVectors(_tAnkleR, _tKneeR), _tFwd, bShinR.quat);
    bFootR.pos.copy(_tAnkleR);
    bFootR.end.set(_tAnkleR.x - 1.8, Math.max(gFR + 0.1, _tAnkleR.y - 0.9), _tAnkleR.z);
    bFootR.quat.setFromEuler(_tEuler.set(0, pelYaw, 0));
    bFootR.radius = 2.1;

    // --- Arms: Shoulder width 16m (±8m), upperArm 8.0m, forearm 6.5m, fist 2.5m (total 17m) ---
    _tShL.set(0, 5.0,  8.0).applyQuaternion(bChest.quat).add(bChest.pos);
    _tShR.set(0, 5.0, -8.0).applyQuaternion(bChest.quat).add(bChest.pos);

    // Default swinging arm wrist targets in world space (delayed heavy swing during walk)
    let armSwingL = 0, armSwingR = 0;
    if (t < 6.0) {
      const lagPhase = (t - 1.0) * Math.PI / 1.5 - 0.5;
      const damp = 1.0 - smoothstep((t - 5.4) / 0.6);
      armSwingL = -4.2 * Math.cos(lagPhase) * damp;
      armSwingR =  4.2 * Math.cos(lagPhase) * damp;
    }

    // Default relaxed towering wrist targets relative to shoulders
    _tFistTargetL.set(-2.5 + armSwingL, -12.8,  2.2).applyQuaternion(bChest.quat).add(_tShL);
    _tFistTargetR.set(-2.5 + armSwingR, -12.8, -2.2).applyQuaternion(bChest.quat).add(_tShR);

    // RIGHT ARM: Fist Slam (6.0-7.5), Planted (7.5-10.5), Lift (10.5-12.0)
    if (t >= 6.0 && t < 12.6) {
      const plantedWrist = _tVec2.set(SLAM_TARGET.x + 0.5, SLAM_TARGET.y + 1.05, SLAM_TARGET.z);
      const raisedWrist  = _tVec3.set(_tShR.x + 1.5, _tShR.y + 10.0, _tShR.z - 2.5);
      const liftedWrist  = _tVec4.set(_tShR.x - 8.5, _tShR.y - 3.5, _tShR.z - 5.5);

      if (t < 7.15) {
        const u = smootherstep((t - 6.0) / 1.15);
        _tFistTargetR.lerp(raisedWrist, u);
      } else if (t < 7.50) {
        const u = easeInCubic((t - 7.15) / 0.35);
        _tFistTargetR.lerpVectors(raisedWrist, plantedWrist, u);
      } else if (t < 10.50) {
        _tFistTargetR.copy(plantedWrist);
      } else if (t < 12.00) {
        const u = smootherstep((t - 10.50) / 1.50);
        _tFistTargetR.lerpVectors(plantedWrist, liftedWrist, u);
        _tFistTargetR.x -= 2.8 * Math.sin(u * Math.PI);
        _tFistTargetR.z -= 2.5 * Math.sin(u * Math.PI);
      } else {
        const u = smootherstep((t - 12.00) / 0.60);
        _tFistTargetR.lerpVectors(liftedWrist, _tFistTargetR, u);
      }
    }

    // Stagger arms hanging heavily (12.0 - 16.0)
    if (t >= 12.3 && t < 16.0) {
      const env = smoothstep((t - 12.3) / 0.7) * (1 - smoothstep((t - 15.0) / 1.0));
      const hangL = _tVec2.set(_tShL.x - 4.0, Math.max(getGroundHeight(_tShL.x - 4, _tShL.z + 3) + 3.2, _tShL.y - 12.0), _tShL.z + 3.5);
      const hangR = _tVec3.set(_tShR.x - 3.0, Math.max(getGroundHeight(_tShR.x - 3, _tShR.z - 3) + 3.5, _tShR.y - 11.5), _tShR.z - 3.5);
      _tFistTargetL.lerp(hangL, env);
      _tFistTargetR.lerp(hangR, env);
    }

    // LEFT ARM: Low Sweep (17.0-18.5 windup, 18.5-19.3 low sweep hitting SWEEP_HIT_POS at 19.000, 19.3-22.0 recover)
    if (t >= 16.8 && t < 22.0) {
      const windupWrist = _tVec2.set(20.0, getGroundHeight(20, 16) + 5.0, 16.0);
      if (t < 18.5) {
        const u = smootherstep((t - 16.8) / 1.7);
        _tFistTargetL.lerp(windupWrist, u);
      } else if (t < 19.3) {
        // Sweeping arc low across grass passing directly through SWEEP_HIT_POS at u = 0.625 (t = 19.000)!
        const u = (t - 18.5) / 0.8;
        // Exact wrist point behind fist at SWEEP_HIT_POS so fistL.end strikes hunter chest directly at t=19.000!
        const hitWX = SWEEP_HIT_POS.x + 0.35;
        const hitWZ = SWEEP_HIT_POS.z + 0.35;
        const w0 = 0.375 * 0.375, wc = 2 * 0.625 * 0.375, w2 = 0.625 * 0.625;
        const p0x = 20.0, p0y = getGroundHeight(20, 16) + 5.0, p0z = 16.0;
        const p2x = 3.0,  p2y = getGroundHeight(3, -10) + 3.2, p2z = -10.5;
        const pmy = getGroundHeight(hitWX, hitWZ) + 1.35;
        const ctrlX = (hitWX - w0 * p0x - w2 * p2x) / wc;
        const ctrlY = (pmy   - w0 * p0y - w2 * p2y) / wc;
        const ctrlZ = (hitWZ - w0 * p0z - w2 * p2z) / wc;
        const om = 1 - u;
        const wx = om * om * p0x + 2 * om * u * ctrlX + u * u * p2x;
        const wy = om * om * p0y + 2 * om * u * ctrlY + u * u * p2y;
        const wz = om * om * p0z + 2 * om * u * ctrlZ + u * u * p2z;
        _tFistTargetL.set(wx, Math.max(getGroundHeight(wx, wz) + 1.15, wy), wz);
      } else {
        const u = smootherstep((t - 19.3) / 2.7);
        const endSweep = _tVec3.set(3.0, getGroundHeight(3, -10.5) + 3.2, -10.5);
        _tFistTargetL.lerpVectors(endSweep, _tFistTargetL, u);
      }
    }

    // Phase 6: Arms flung wide during 25.000 sky lightning & 29.500 death shock
    if (t >= 24.8) {
      const shock25 = t >= 25.0 ? smoothstep((t - 25.0) / 0.2) * (1 - smoothstep((t - 25.9) / 1.4)) : 0;
      const shock29 = t >= 29.5 ? smoothstep((t - 29.5) / 0.35) : 0;
      const spread = clamp(shock25 + shock29 * 0.9, 0, 1);
      if (spread > 0.001) {
        const openL = _tVec2.set(_tShL.x + 2.5, _tShL.y - 3.5, _tShL.z + 11.5);
        const openR = _tVec3.set(_tShR.x + 2.5, _tShR.y - 3.5, _tShR.z - 11.5);
        _tFistTargetL.lerp(openL, spread);
        _tFistTargetR.lerp(openR, spread);
      }
    }

    // Solve 2-bone IK for both arms (upperArm 8.5m, forearm 7.0m, fist 2.0m -> ~17.5m arm length)
    _tPole.set(0.85, 0.15, 0.55).applyQuaternion(bChest.quat).normalize();
    solveTwoBoneIK(_tShL, _tFistTargetL, _tPole, 8.5, 7.0, _tElbowL, _tWristL);

    _tPole.set(0.85, 0.15, -0.55).applyQuaternion(bChest.quat).normalize();
    solveTwoBoneIK(_tShR, _tFistTargetR, _tPole, 8.5, 7.0, _tElbowR, _tWristR);

    _tFwd.set(-1, 0, 0).applyQuaternion(bChest.quat);

    const bUpArmL = out.bones[BONE_INDEX.upperArmL];
    const bForeL  = out.bones[BONE_INDEX.forearmL];
    const bFistL  = out.bones[BONE_INDEX.fistL];
    bUpArmL.pos.copy(_tShL); bUpArmL.end.copy(_tElbowL); bUpArmL.radius = 2.3;
    quatFromDownAndFwd(_tVec1.subVectors(_tElbowL, _tShL), _tFwd, bUpArmL.quat);
    bForeL.pos.copy(_tElbowL); bForeL.end.copy(_tWristL); bForeL.radius = 1.9;
    quatFromDownAndFwd(_tVec1.subVectors(_tWristL, _tElbowL), _tFwd, bForeL.quat);
    bFistL.pos.copy(_tWristL);
    _tVec1.subVectors(_tWristL, _tElbowL).normalize();
    bFistL.end.copy(_tWristL).addScaledVector(_tVec1, 2.0);
    bFistL.quat.copy(bForeL.quat);
    bFistL.radius = 2.4;

    const bUpArmR = out.bones[BONE_INDEX.upperArmR];
    const bForeR  = out.bones[BONE_INDEX.forearmR];
    const bFistR  = out.bones[BONE_INDEX.fistR];
    bUpArmR.pos.copy(_tShR); bUpArmR.end.copy(_tElbowR); bUpArmR.radius = 2.3;
    quatFromDownAndFwd(_tVec1.subVectors(_tElbowR, _tShR), _tFwd, bUpArmR.quat);
    bForeR.pos.copy(_tElbowR); bForeR.end.copy(_tWristR); bForeR.radius = 1.9;
    quatFromDownAndFwd(_tVec1.subVectors(_tWristR, _tElbowR), _tFwd, bForeR.quat);
    bFistR.pos.copy(_tWristR);
    _tVec1.subVectors(_tWristR, _tElbowR).normalize();
    bFistR.end.copy(_tWristR).addScaledVector(_tVec1, 2.0);
    bFistR.quat.copy(bForeR.quat);
    bFistR.radius = 2.4;

    // Charges & average charge
    let sumC = 0;
    for (let i = 0; i < BONE_NAMES.length; i++) {
      const c = getBoneCharge(BONE_NAMES[i], t);
      out.bones[i].charge = c;
      sumC += c;
    }
    out.avgCharge = sumC / BONE_NAMES.length;

    // Chest parting after sky lightning at 25.000
    out.chestParting = t < 25.0 ? 0.0 : smootherstep((t - 25.0) / 0.55);

    // Weak point 3D world positions:
    // W1: Left knee (seated on front-left of left knee joint)
    out.wpPos[0].set(-1.55, -0.35, 1.35).applyQuaternion(bShinL.quat).add(bShinL.pos);
    // W2: Right shoulder (seated among right shoulder boulders)
    out.wpPos[1].set(-1.75, 5.2, -9.0).applyQuaternion(bChest.quat).add(bChest.pos);
    // W3: Center of chest
    out.wpPos[2].set(-3.3, 3.0, 0.0).applyQuaternion(bChest.quat).add(bChest.pos);

    return out;
  }

  // Reusable Titan pose instances
  const titanPoseMain = createTitanPoseStruct();
  const titanPoseTemp = createTitanPoseStruct();
  const titanPoseVelA = createTitanPoseStruct();
  const titanPoseVelB = createTitanPoseStruct();

  function getTitanMaxLimbAngularSpeed(m) {
    if (m >= 32.8) return 0;
    const dt = 0.04;
    const m0 = Math.max(0, m - dt);
    evalTitanPose(m0, titanPoseVelA);
    evalTitanPose(m, titanPoseVelB);
    let maxSpeed = 0;
    for (let i = 0; i < BONE_NAMES.length; i++) {
      if (m >= COLLAPSE_TIMES[BONE_NAMES[i]]) continue;
      const dot = Math.min(1, Math.abs(titanPoseVelA.bones[i].quat.dot(titanPoseVelB.bones[i].quat)));
      const angSpeed = (2 * Math.acos(dot)) / Math.max(0.001, m - m0);
      if (angSpeed > maxSpeed) maxSpeed = angSpeed;
    }
    return maxSpeed;
  }

  // =========================================================================
  // 4. HUNTER CHOREOGRAPHY, 14-PART RIG & REAL 13-POINT VERLET RAGDOLL
  // =========================================================================
  const HUNTER_PART_NAMES = [
    'pelvis', 'torso', 'head',
    'upperArmL', 'lowerArmL', 'handL',
    'upperArmR', 'lowerArmR', 'handR',
    'upperLegL', 'lowerLegL',
    'upperLegR', 'lowerLegR',
    'cloak'
  ];

  function createHunterStateStruct() {
    const parts = {};
    for (let i = 0; i < HUNTER_PART_NAMES.length; i++) {
      parts[HUNTER_PART_NAMES[i]] = {
        pos: new THREE.Vector3(),
        quat: new THREE.Quaternion()
      };
    }
    return {
      rootPos: new THREE.Vector3(),
      chestPos: new THREE.Vector3(),
      launcherPos: new THREE.Vector3(),
      bladeTipPos: new THREE.Vector3(),
      vel: new THREE.Vector3(),
      facingYaw: 0,
      speed: 0,
      runPhase: 0,
      airborne: false,
      rolling: 0,
      slashing: 0,
      parts,
      joints: Array.from({ length: RAGDOLL_POINTS }, () => new THREE.Vector3())
    };
  }

  const _hPosA = new THREE.Vector3();
  const _hPosB = new THREE.Vector3();
  const _hPosC = new THREE.Vector3();
  const _hAnchor = new THREE.Vector3();
  const _hVec1 = new THREE.Vector3();
  const _hVec2 = new THREE.Vector3();
  const _hEuler = new THREE.Euler(0, 0, 0, 'YXZ');
  const _hQ1 = new THREE.Quaternion();
  const _hQ2 = new THREE.Quaternion();

  // Compute hunter's scripted active center-of-pelvis position (before ragdoll override)
  // Carefully designed so:
  // - 0.000: starts at (-40, g, 10)
  // - 3.300-5.000: orbits shinL by 1.32 full turns spiraling inward with taut rope to W1!
  // - 6.500: passes through exact SLAM_TARGET (-1.5, g, -5.5), then runs clear by 7.500!
  // - 9.300-12.000: swings on planted forearmR, lifted up with arm to slash W2 at 12.000!
  // - 13.500: lands from stagger drop
  // - 19.000: hits exact SWEEP_HIT_POS (-3.0, g+1.15, -4.0)
  // - 22.500: stands up at ragdoll resting XZ
  // - 23.800-29.500: swings & reels up to chest W3, slashes at 27.000 & 29.500!
  // - 31.500: lands on tether 3 drop, rolls clear, stands by 33.000 at (-16, g, +16) facing ruins!
  let RAGDOLL_END_XZ = { x: -33.5, z: -17.5 }; // updated cleanly once ragdoll cache initializes

  function evalHunterActivePos(m, titanPose, outPos) {
    const t = clamp(m, 0, DURATION);

    if (t < 3.0) {
      // Phase 1: Sprint from (-40, g, 10) toward Titan's approaching left leg
      const u = t / 3.0;
      const x = lerp(-40.0, 9.5, smootherstep(u * 0.96 + 0.04 * u));
      const z = lerp(10.0, 15.5, u) + 1.8 * Math.sin(u * Math.PI);
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    } else if (t < 3.3) {
      // Leap forward-left while Tether 1 flies to left shin
      const u = (t - 3.0) / 0.3;
      const bShinL = titanPose.bones[BONE_INDEX.shinL];
      _hAnchor.lerpVectors(bShinL.pos, bShinL.end, 0.5);
      const ang0 = 2.35; // (+135 deg, (-X, +Z) side of shinL)
      const endX = _hAnchor.x + Math.cos(ang0) * 17.2;
      const endZ = _hAnchor.z + Math.sin(ang0) * 17.2;
      const endY = getGroundHeight(endX, endZ) + 4.2;
      const x = lerp(9.5, endX, smoothstep(u));
      const z = lerp(15.5, endZ, smoothstep(u));
      const y = lerp(getGroundHeight(9.5, 15.5) + 0.95, endY, u) + 1.0 * Math.sin(u * Math.PI);
      outPos.set(x, y, z);
    } else if (t < 5.0) {
      // Swing 1: Exact involute spiral around shinL (1.38 full turns around r=1.65m shin -> wraps >400° with constant rope length!)
      const u = (t - 3.3) / 1.7;
      const bShinL = titanPose.bones[BONE_INDEX.shinL];
      _hAnchor.lerpVectors(bShinL.pos, bShinL.end, 0.45);
      const totalTurns = 1.38;
      const dTheta = totalTurns * TWO_PI * (0.88 * u + 0.12 * u * u);
      const ang0 = 2.35;
      // Orbit clockwise (+dTheta) so hunter sweeps across front-left while wrapping >1.3 turns!
      const ang = ang0 + dTheta;
      const rCap = 1.65;
      const rad = Math.max(2.6, 17.2 - rCap * dTheta);
      const w1 = titanPose.wpPos[0];
      const baseX = _hAnchor.x + Math.cos(ang) * rad;
      const baseZ = _hAnchor.z + Math.sin(ang) * rad;
      const baseY = lerp(4.2 + getGroundHeight(baseX, baseZ), w1.y, smoothstep(u));
      const strikeBlend = smoothstep((u - 0.88) / 0.12);
      // Fast aerial slash passing across W1 from front-left (keeps high vH and clear sightline to Titan upper body!)
      const sx = lerp(baseX, w1.x - 3.8, strikeBlend);
      const sy = lerp(baseY, w1.y + 2.6, strikeBlend);
      const sz = lerp(baseZ, w1.z + 3.6, strikeBlend);
      outPos.set(sx, Math.max(getGroundHeight(sx, sz) + 0.95, sy), sz);
    } else if (t < 6.0) {
      // Backflip off W1, Tether 1 releases at 5.6, lands on grass at 6.0
      const u = (t - 5.0) / 1.0;
      const w1 = titanPose.wpPos[0];
      const startX = w1.x - 3.8, startY = w1.y + 2.6, startZ = w1.z + 3.6;
      const landX = 8.5, landZ = 0.5, landY = getGroundHeight(landX, landZ) + 0.95;
      const x = lerp(startX, landX, u);
      const z = lerp(startZ, landZ, u);
      const y = lerp(startY, landY, easeInCubic(u)) + 3.0 * Math.sin(u * Math.PI);
      outPos.set(x, Math.max(getGroundHeight(x, z) + 0.95, y), z);
    } else if (t < 6.5) {
      // Sprint hard across front of Titan to pass through exact SLAM_TARGET at 6.500!
      const u = (t - 6.0) / 0.5;
      const x = lerp(8.5, SLAM_TARGET.x, u);
      const z = lerp(0.5, SLAM_TARGET.z, u);
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    } else if (t < 7.5) {
      // Sprint clear of the incoming fist slam!
      const u = (t - 6.5) / 1.0;
      const x = lerp(SLAM_TARGET.x, -12.5, easeOutCubic(u * 0.85 + 0.15 * u));
      const z = lerp(SLAM_TARGET.z, -12.5, u);
      const leap = u > 0.7 ? 0.5 * Math.sin(((u - 0.7) / 0.3) * Math.PI) : 0;
      outPos.set(x, getGroundHeight(x, z) + 0.95 + leap, z);
    } else if (t < 9.0) {
      // Recover from slam shockwave, sprint in to Tether 2 launch position
      const u = (t - 7.5) / 1.5;
      const x = lerp(-12.5, -7.5, smootherstep(u));
      const z = lerp(-12.5, -16.0, smootherstep(u));
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    } else if (t < 9.3) {
      // Tether 2 fired at right forearm, hunter sprints/leaps to swing start
      const u = (t - 9.0) / 0.3;
      const bForeR = titanPose.bones[BONE_INDEX.forearmR];
      _hAnchor.lerpVectors(bForeR.pos, bForeR.end, 0.5);
      const ang0 = -2.20;
      const sx = _hAnchor.x + Math.cos(ang0) * 11.8;
      const sz = _hAnchor.z + Math.sin(ang0) * 11.8;
      const sy = Math.max(getGroundHeight(sx, sz) + 1.8, _hAnchor.y - 1.2);
      const x = lerp(-7.5, sx, smoothstep(u));
      const z = lerp(-16.0, sz, smoothstep(u));
      const y = lerp(getGroundHeight(-7.5, -16.0) + 0.95, sy, smoothstep(u));
      outPos.set(x, y, z);
    } else if (t < 10.5) {
      // Taut pendulum swing around planted forearmR at constant rope length 11.8m!
      const u = (t - 9.3) / 1.2;
      const bForeR = titanPose.bones[BONE_INDEX.forearmR];
      _hAnchor.lerpVectors(bForeR.pos, bForeR.end, 0.5);
      const ang = lerp(-2.20, -1.20, smootherstep(u));
      const elev = lerp(-0.12, 0.10, smootherstep(u));
      const R = 11.8;
      const x = _hAnchor.x + Math.cos(ang) * Math.cos(elev) * R;
      const z = _hAnchor.z + Math.sin(ang) * Math.cos(elev) * R;
      const y = Math.max(getGroundHeight(x, z) + 1.4, _hAnchor.y + Math.sin(elev) * R);
      outPos.set(x, y, z);
    } else if (t < 12.0) {
      // Arm lifts hunter high up! Hunter reels smoothly up around forearmR straight to W2 (right shoulder)!
      const u = (t - 10.5) / 1.5;
      const bForeR = titanPose.bones[BONE_INDEX.forearmR];
      _hAnchor.lerpVectors(bForeR.pos, bForeR.end, 0.5);
      const w2 = titanPose.wpPos[1];
      const ang = lerp(-1.20, -2.10, smootherstep(u));
      const R = lerp(11.8, 5.8, smootherstep(u));
      const arcX = _hAnchor.x + Math.cos(ang) * R;
      const arcZ = _hAnchor.z + Math.sin(ang) * R;
      const arcY = _hAnchor.y + lerp(1.0, 5.5, smootherstep(u)) + 2.2 * Math.sin(u * Math.PI);
      const blendW2 = smoothstep((u - 0.55) / 0.45);
      const x = lerp(arcX, w2.x - 1.6, blendW2);
      const y = lerp(arcY, w2.y + 0.2, blendW2);
      const z = lerp(arcZ, w2.z - 1.4, blendW2);
      outPos.set(x, Math.max(getGroundHeight(x, z) + 1.2, y), z);
    } else if (t < 13.5) {
      // Kicks off W2 (tether 2 released at 12.4), parabolic descent to land at 13.500 inside Shot 3 frame!
      const u = (t - 12.0) / 1.5;
      const w2x = 13.8, w2y = 31.8, w2z = -10.5;
      const landX = -0.5, landZ = -10.0;
      const landY = getGroundHeight(landX, landZ) + 0.95;
      const x = lerp(w2x, landX, u);
      const z = lerp(w2z, landZ, u);
      const y = lerp(w2y, landY, u * u) + 3.0 * Math.sin(u * Math.PI) * (1 - u);
      outPos.set(x, Math.max(getGroundHeight(x, z) + 0.95, y), z);
    } else if (t < 16.0) {
      // Combat roll out of landing (13.5-14.2), then sprint across front watching stagger & recovery
      const u = (t - 13.5) / 2.5;
      const x = lerp(-0.5, -4.0, smootherstep(u));
      const z = lerp(-10.0, -7.5, smootherstep(u));
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    } else if (t <= 19.0005) {
      // Phase 5: Agile dash inward directly into left-arm sweep at SWEEP_HIT_POS at exact 19.000!
      const u = clamp((t - 16.0) / 3.0, 0, 1);
      const x = lerp(-4.0, SWEEP_HIT_POS.x, smootherstep(u));
      const z = lerp(-7.5, SWEEP_HIT_POS.z, smootherstep(u));
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    } else if (t < 22.5) {
      // Get-up target at ragdoll's resting XZ (used during 21.5-22.5 blend!)
      const rx = RAGDOLL_END_XZ.x;
      const rz = RAGDOLL_END_XZ.z;
      const u = clamp((t - 21.5) / 1.0, 0, 1);
      const crouchY = lerp(0.35, 0.95, smoothstep(u));
      outPos.set(rx, getGroundHeight(rx, rz) + crouchY, rz);
    } else if (t < 23.5) {
      // Phase 6: Sprint forward from ragdoll get-up toward Titan to fire Tether 3 at 23.500
      const u = (t - 22.5) / 1.0;
      const x = lerp(RAGDOLL_END_XZ.x, -11.5, smoothstep(u));
      const z = lerp(RAGDOLL_END_XZ.z, -5.0, smoothstep(u));
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    } else if (t < 23.8) {
      // Tether 3 fired at chest, hunter leaps forward
      const u = (t - 23.5) / 0.3;
      const x = lerp(-11.5, -8.0, u);
      const z = lerp(-5.0, -4.5, u);
      const y = getGroundHeight(x, z) + 0.95 + 1.6 * smoothstep(u);
      outPos.set(x, y, z);
    } else if (t < 27.0) {
      // Swing 3 & reel-in up toward chest W3!
      const u = (t - 23.8) / 3.2;
      const bChest = titanPose.bones[BONE_INDEX.chest];
      _hAnchor.set(-3.0, 4.6, 0).applyQuaternion(bChest.quat).add(bChest.pos);
      const w3 = titanPose.wpPos[2];
      const R = lerp(34.0, 2.5, easeOutCubic(u * 0.90 + 0.10 * u));
      const azim = lerp(Math.PI + 0.22, Math.PI + 0.08, smootherstep(u)) - 0.14 * Math.sin(u * Math.PI);
      const elev = lerp(-0.78, -0.10, smootherstep(u));
      const sx = _hAnchor.x + Math.cos(azim) * Math.cos(elev) * R;
      const sz = _hAnchor.z + Math.sin(azim) * Math.cos(elev) * R;
      const sy = _hAnchor.y + Math.sin(elev) * R;
      const strikeBlend = smoothstep((u - 0.85) / 0.15);
      const x = lerp(sx, w3.x - 2.0, strikeBlend);
      const y = lerp(sy, w3.y - 0.3, strikeBlend);
      const z = lerp(sz, w3.z - 0.8, strikeBlend);
      outPos.set(x, Math.max(getGroundHeight(x, z) + 1.6, y), z);
    } else if (t < 29.5) {
      // Sleek lateral pendulum swing around W3 on taut Tether 3 for Killing Strike at 29.500!
      // Keeps forward/lateral arc so hunter stays cleanly in front of Shot 5 camera!
      const u = (t - 27.0) / 2.5;
      const w3 = titanPose.wpPos[2];
      const swingOut = Math.sin(u * Math.PI);
      const x = w3.x - 2.0 - 7.5 * swingOut;
      const y = w3.y - 0.3 - 3.6 * Math.sin(u * Math.PI);
      const z = w3.z - 0.8 - 8.5 * Math.sin(u * Math.PI);
      outPos.set(x, Math.max(getGroundHeight(x, z) + 2.0, y), z);
    } else if (t < 31.5) {
      // Drops on Tether 3 (attached until chest releases at 30.800), landing at 31.500!
      const u = (t - 29.5) / 2.0;
      const w3 = titanPose.wpPos[2];
      const startX = w3.x - 2.0, startY = w3.y - 0.3, startZ = w3.z - 0.8;
      const landX = -8.0, landZ = 7.5;
      const landY = getGroundHeight(landX, landZ) + 0.95;
      const x = lerp(startX, landX, smootherstep(u));
      const z = lerp(startZ, landZ, smootherstep(u)) + 2.5 * Math.sin(u * Math.PI);
      const y = lerp(startY, landY, u * u * 0.65 + u * 0.35);
      outPos.set(x, Math.max(getGroundHeight(x, z) + 0.95, y), z);
    } else if (t < 33.0) {
      // Combat roll clear from (-8.0, g, 7.5) to heroic standing at (-14.0, g, +11.0) by 33.000!
      const u = (t - 31.5) / 1.5;
      const x = lerp(-8.0, -14.0, easeOutCubic(u));
      const z = lerp(7.5, 11.0, easeOutCubic(u));
      const crouch = u < 0.6 ? -0.35 * Math.sin((u / 0.6) * Math.PI) : 0;
      outPos.set(x, getGroundHeight(x, z) + 0.95 + crouch, z);
    } else {
      // Aftermath (33.0 - 40.0): Standing heroically at (-14, g, +11) facing the fallen Titan at (16, 0, 0)
      const x = -14.0, z = 11.0;
      outPos.set(x, getGroundHeight(x, z) + 0.95, z);
    }
    return outPos;
  }

  // Build articulated 14-part active hunter pose + 13 joint positions
  function buildActiveHunterParts(m, rootPos, vel, titanPose, out) {
    out.rootPos.copy(rootPos);
    out.vel.copy(vel);
    const speed = vel.length();
    out.speed = speed;

    const groundY = getGroundHeight(rootPos.x, rootPos.z);
    const heightAboveGround = rootPos.y - (groundY + 0.95);
    out.airborne = heightAboveGround > 0.35;

    // Facing yaw: generally velocity direction when moving fast, or facing Titan when stationary/striking
    let yaw;
    if (m >= 32.8) {
      // Face the fallen Titan ruins at (16, 0, 0)
      yaw = Math.atan2(0 - rootPos.z, 16 - rootPos.x);
    } else if (m >= 21.5 && m < 22.5) {
      // Face Titan while getting up
      yaw = Math.atan2(0 - rootPos.z, 16 - rootPos.x);
    } else if (Math.hypot(vel.x, vel.z) > 1.2) {
      yaw = Math.atan2(vel.z, vel.x);
    } else {
      yaw = Math.atan2(titanPose.pelvisGround.z - rootPos.z, titanPose.pelvisGround.x - rootPos.x);
    }
    out.facingYaw = yaw;

    // Note: Hunter local +X is forward, +Y is up, +Z is right (standard right-handed yaw = -atan2(dz, dx) around Y!)
    // Let's verify: rotating (+1, 0, 0) around +Y by theta gives (cos(theta), 0, -sin(theta)).
    // So to point +X toward (cos(yaw), 0, sin(yaw)), rotate around +Y by `-yaw`!
    const rotY = -yaw;

    // Detect strike slashes & rolls & get-up
    let slashAmt = 0;
    for (let i = 0; i < STRIKES.length; i++) {
      const d = Math.abs(m - STRIKES[i].t);

    const elR = _hPosC.copy(shR).addScaledVector(dirUR, 0.30);
    out.parts.lowerArmR.quat.copy(out.parts.upperArmR.quat).multiply(_hQ2.setFromEuler(_hEuler.set(0, 0, elbowRBend, 'YXZ')));
    const dirLR = _hVec2.set(0, -1, 0).applyQuaternion(out.parts.lowerArmR.quat);
    out.parts.lowerArmR.pos.copy(elR).addScaledVector(dirLR, 0.14);
    out.parts.handR.quat.copy(out.parts.lowerArmR.quat);
    out.parts.handR.pos.copy(elR).addScaledVector(dirLR, 0.28);
    // Blade tip 1.15m forward-down from handR
    out.bladeTipPos.set(0.95, -0.55, 0).applyQuaternion(out.parts.handR.quat).add(out.parts.handR.pos);
    out.joints[6].copy(shR);
    out.joints[7].copy(elR);
    out.joints[8].copy(out.parts.handR.pos);

    // Legs (L = -Z, R = +Z)
    const hipL = _hPosA.set(0, -0.05, -0.12).applyQuaternion(baseQ).add(pPelvis.pos);
    const hipR = _hPosB.set(0, -0.05,  0.12).applyQuaternion(baseQ).add(pPelvis.pos);

    } else if (getUpU < 1.0) {

    const knL = _hPosC.copy(hipL).addScaledVector(dirThL, 0.45);
    out.parts.lowerLegL.quat.copy(out.parts.upperLegL.quat).multiply(_hQ2.setFromEuler(_hEuler.set(0, 0, kneeLP, 'YXZ')));

    out.joints[10].copy(knL).addScaledVector(dirShL, 0.45);

    out.joints[12].copy(knR).addScaledVector(dirShR, 0.45);

    out.joints[2].copy(pHead.pos);

  // --- Real 13-Point Verlet Ragdoll (19.000 - 21.500 at 1/240s, deterministic cache) ---

  const RAGDOLL_END = 21.500;

    cache: new Float32Array((RAGDOLL_STEPS + 1) * RAGDOLL_POINTS * 3),
    impactTimes: [],
    endPos: new THREE.Vector3(),
    sticks: [],
    minSticks: [],

      this.initialized = true;

      const tmpT = createTitanPoseStruct();
      const tmpH = createHunterStateStruct();
      evalTitanPose(RAGDOLL_START, tmpT);
      const p0 = new THREE.Vector3();
      const pPrev = new THREE.Vector3();

        pos[i * 3 + 1] = py;
        pos[i * 3 + 2] = j.z;

        [1, 3], [3, 4], [4, 5],
        [1, 6], [6, 7], [7, 8],
        [0, 9], [9, 10],
        [0, 11], [11, 12],

        const dy = pos[b * 3 + 1] - pos[a * 3 + 1];

        return [a, b, Math.hypot(dx, dy, dz)];
      });

        [0, 2, 0.72],
        [9, 11, 0.18],
        [4, 7, 0.24]
      ];

          const vy = (y - prev[k + 1]) * 0.9985;
          const vz = (z - prev[k + 2]) * 0.9985;
          prev[k] = x; prev[k + 1] = y; prev[k + 2] = z;
          pos[k]     = x + vx + 0.8 * dt2; // mild wind drift
          pos[k + 1] = y + vy - GRAVITY * dt2;
          pos[k + 2] = z + vz;
        }

        // Stick constraints + ground collision (10 solver iterations)
        for (let iter = 0; iter < 10; iter++) {
          for (let s = 0; s < this.sticks.length; s++) {
            const a = this.sticks[s][0] * 3;
            const b = this.sticks[s][1] * 3;
            const rest = this.sticks[s][2];
            const dx = pos[b] - pos[a];
            const dy = pos[b + 1] - pos[a + 1];
            const dz = pos[b + 2] - pos[a + 2];
            const dist = Math.hypot(dx, dy, dz) || 1e-6;
            const diff = (dist - rest) / dist * 0.5;
            pos[a] += dx * diff; pos[a + 1] += dy * diff; pos[a + 2] += dz * diff;
            pos[b] -= dx * diff; pos[b + 1] -= dy * diff; pos[b + 2] -= dz * diff;
          }
          for (let s = 0; s < this.minSticks.length; s++) {
            const a = this.minSticks[s][0] * 3;
            const b = this.minSticks[s][1] * 3;
            const minD = this.minSticks[s][2];
            const dx = pos[b] - pos[a];
            const dy = pos[b + 1] - pos[a + 1];
            const dz = pos[b + 2] - pos[a + 2];
            const dist = Math.hypot(dx, dy, dz) || 1e-6;
            if (dist < minD) {
              const diff = (dist - minD) / dist * 0.5;
              pos[a] += dx * diff; pos[a + 1] += dy * diff; pos[a + 2] += dz * diff;
              pos[b] -= dx * diff; pos[b + 1] -= dy * diff; pos[b + 2] -= dz * diff;
            }
          }

          for (let i = 0; i < RAGDOLL_POINTS; i++) {
            const k = i * 3;
            const floorY = getGroundHeight(pos[k], pos[k + 2]) + this.radii[i];
            if (pos[k + 1] < floorY) {
              const vyPre = (pos[k + 1] - prev[k + 1]) / FIXED_DT;
              if (iter === 0 && (i <= 2 || i === 9 || i === 11) && vyPre < -1.8 && curT - lastImpactT > 0.14) {
                this.impactTimes.push({
                  t: curT,
                  intensity: clamp(-vyPre / 12.0, 0.2, 1.0),
                  pos: [pos[k], floorY, pos[k + 2]]
                });

              }
              pos[k + 1] = floorY;
              if (iter === 9) {

                const vz = pos[k + 2] - prev[k + 2];
                const vy = pos[k + 1] - prev[k + 1];
                prev[k]     = pos[k] - vx * 0.80;
                prev[k + 2] = pos[k + 2] - vz * 0.80;
                if (vy < 0) prev[k + 1] = pos[k + 1] + vy * 0.24;
              }
            }
          }
        }

        this.cache.set(pos, step * RAGDOLL_POINTS * 3);
      }

      const endOff = RAGDOLL_STEPS * RAGDOLL_POINTS * 3;
      this.endPos.set(this.cache[endOff], this.cache[endOff + 1], this.cache[endOff + 2]);
      RAGDOLL_END_XZ = { x: this.endPos.x, z: this.endPos.z };
    },

    sample(m, outJoints, outVel) {
      this.init();
      const clampedM = clamp(m, RAGDOLL_START, RAGDOLL_END);
      const exactStep = (clampedM - RAGDOLL_START) / FIXED_DT;
      const s0 = Math.min(RAGDOLL_STEPS - 1, Math.floor(exactStep));
      const s1 = s0 + 1;

      const off1 = s1 * RAGDOLL_POINTS * 3;

          lerp(this.cache[off0 + k],     this.cache[off1 + k],     frac),
          lerp(this.cache[off0 + k + 1], this.cache[off1 + k + 1], frac),
          lerp(this.cache[off0 + k + 2], this.cache[off1 + k + 2], frac)
        );
      }

        outVel.set(
          (this.cache[off1]     - this.cache[off0])     / FIXED_DT,
          (this.cache[off1 + 1] - this.cache[off0 + 1]) / FIXED_DT,
          (this.cache[off1 + 2] - this.cache[off0 + 2]) / FIXED_DT
        );
      }
    }
  };

  // Convert 13 ragdoll joint positions into full 14-part hunter poses
  const _rgUp = new THREE.Vector3();
  const _rgRight = new THREE.Vector3();
  const _rgFwd = new THREE.Vector3();
  const _rgDir = new THREE.Vector3();
  function buildRagdollHunterParts(m, joints, vel, out) {
    // 0:pelvis, 1:chest, 2:head, 3:shL, 4:elL, 5:handL, 6:shR, 7:elR, 8:handR, 9:knL, 10:ftL, 11:knR, 12:ftR
    _rgUp.subVectors(joints[1], joints[0]).normalize();

    out.chestPos.copy(joints[1]);
