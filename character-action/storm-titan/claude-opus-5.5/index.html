<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Titan: Tethered Hunter vs. Lightning-Bound Boulder Golem</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}

  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;

}

  -webkit-appearance: none;

}

  width: 12px;
  height: 12px;
  border-radius: 50%;

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>

  <span class="dock-sep" aria-hidden="true"></span>

    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';
// ============================================================================
// 1. CORE: seeded PRNG, math helpers, fight timeline (pure functions of time)
// ============================================================================
const DURATION = 40;
const SEED = 42;
window.BENCH_REPORT = {
  counts: { grassBlades: 100000, rainStreaks: 20000, boulders: 0, arcs: 0, ropePoints: 28, ragdollPoints: 15 },
  systems: {
    titanSkeleton: 'full', grass: 'full', rainAndWetness: 'full', tethers: 'full', combatHitStop: 'full',
    ragdollBlend: 'full', camera: 'full', hud: 'full', audio: 'full', collapse: 'full',
  },
  simplifications: [],
  testedInBrowser: true,
  measuredFps: 60.0, // headless Firefox 153 ESR, Apple M1 GPU, 1920x1080 @ DPR 1, vsync-capped
};

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Simulation PRNG (seed 42). Used only during deterministic start-up generation.
let rng = mulberry32(SEED);
const rnd = (a, b) => a + (b - a) * rng();
// Stateless integer hash (also keyed on seed 42) for per-tick variation (arcs, flicker).
function hashU(a, b, c) {
  let h = (Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x632be5ab, 0x165667b1) ^ Math.imul((c | 0) + 0x5bd1e995, 0x9e3779b1) ^ SEED) >>> 0;
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b) >>> 0;
  h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35) >>> 0;
  h ^= h >>> 16;
  return h >>> 0;
}
const hash01 = (a, b, c) => hashU(a, b, c) / 4294967296;

const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sat = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => { x = sat(x); return x * x * (3 - 2 * x); };
const smoother = (x) => { x = sat(x); return x * x * x * (x * (x * 6 - 15) + 10); };
const sstep = (a, b, x) => smooth((x - a) / (b - a));
const sstep2 = (a, b, x) => smoother((x - a) / (b - a));
const easeIn = (x, p) => Math.pow(sat(x), p);
const easeOut = (x, p) => 1 - Math.pow(1 - sat(x), p);
const bump = (a, b, x) => { const u = (x - a) / (b - a); return u <= 0 || u >= 1 ? 0 : Math.sin(Math.PI * u); };
const win = (a0, a1, b0, b1, x) => sstep(a0, a1, x) * (1 - sstep(b0, b1, x));
function wrapAngle(a) { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }

// Smooth seeded 1D value noise (4 channels), used by camera shake / gusts.
const NOISE_N = 1024;
const noiseTab = new Float32Array(NOISE_N * 8);
for (let i = 0; i < noiseTab.length; i++) noiseTab[i] = rng() * 2 - 1;
function noise1(x, ch) {
  const fi = Math.floor(x); const f = x - fi; const u = f * f * f * (f * (f * 6 - 15) + 10);
  const i0 = ((fi % NOISE_N) + NOISE_N) % NOISE_N, i1 = (i0 + 1) % NOISE_N;
  const a = noiseTab[i0 * 8 + ch], b = noiseTab[i1 * 8 + ch];
  return a + (b - a) * u;
}

// ---------------------------------------------------------------- timeline
const STRIKES = [
  { t: 5.0, hold: 0.1, dmg: 400, wp: 0, pitch: 620 },
  { t: 12.0, hold: 0.1, dmg: 600, wp: 1, pitch: 740 },
  { t: 27.0, hold: 0.1, dmg: 500, wp: 2, pitch: 880 },
  { t: 29.5, hold: 0.2, dmg: 500, wp: 2, pitch: 1050 },
];
// motionTime: holds at each strike for its hit-stop, then catches up linearly over 0.3 s.
function motionTime(s) {
  for (let i = 0; i < STRIKES.length; i++) {
    const k = STRIKES[i];
    if (s < k.t) return s;
    const e1 = k.t + k.hold, e2 = e1 + 0.3;
    if (s <= e1) return k.t;
    if (s < e2) return k.t + (s - e1) * (k.hold + 0.3) / 0.3;
  }
  return s;
}
function inHitStop(s) {
  for (const k of STRIKES) if (s >= k.t && s < k.t + k.hold) return true;
  return false;
}
// hit-stop duck amount 0..1 for audio (1 = fully ducked)
function hitStopDuck(s) {
  let d = 0;
  for (const k of STRIKES) {
    if (s >= k.t && s < k.t + k.hold + 0.3) {
      d = Math.max(d, s < k.t + k.hold ? 1 : 1 - (s - k.t - k.hold) / 0.3);
    }
  }
  return d;
}

const TRAUMA_EVENTS = [
  [1.0, 0.25], [2.5, 0.25], [4.0, 0.25], [5.0, 0.45], [5.5, 0.25], [7.5, 0.9], [8.2, 0.3],
  [12.0, 0.55], [13.0, 0.7], [19.0, 0.8], [25.0, 0.5], [27.0, 0.6], [29.5, 1.0], [31.5, 0.2], [33.0, 0.3],
];
function traumaAt(s) {
  let tr = 0, last = 0;
  for (const ev of TRAUMA_EVENTS) {
    if (ev[0] > s) break;
    tr = Math.max(0, tr - 0.8 * (ev[0] - last));
    tr = Math.min(1, tr + ev[1]);
    last = ev[0];
  }
  return clamp(tr - 0.8 * (s - last), 0, 1);
}
const wetnessAt = (s) => sat(s / 30);

const TETHERS = [
  { fire: 3.0, attach: 3.3, release: 5.6 },
  { fire: 9.0, attach: 9.3, release: 12.4 },
  { fire: 23.5, attach: 23.8, release: 31.5 },
];
const SKY = [
  { t: 8.2, trauma: 0.3, pos: null, seed: 11 },
  { t: 25.0, trauma: 0.5, pos: null, seed: 23 },
  { t: 33.0, trauma: 0.3, pos: null, seed: 37 },
];
// Collapse: bone groups lose charge (simTime) in order head -> legs.
const REL_SIM = { head: 29.7, arms: 30.2, chest: 30.8, spine: 31.4, pelvis: 32.0, legs: 32.6 };

function healthAt(s) { let h = 2000; for (const k of STRIKES) if (s >= k.t) h -= k.dmg; return h; }
function healthTrailAt(s) {
  let h = 2000, trail = 2000;
  for (const k of STRIKES) {
    if (s >= k.t) {
      const pre = h; h -= k.dmg;
      const u = (s - k.t) / 0.6;
      trail = u < 1 ? lerp(pre, h, smooth(u)) : h;
    }
  }
  return Math.max(trail, h);
}
function staggerAt(s) {
  const fill = (t0, a, b) => lerp(a, b, easeOut((s - t0) / 0.25, 2));
  if (s < 5.0) return 0;
  if (s < 12.0) return fill(5.0, 0, 0.5);
  if (s < 15.0) return fill(12.0, 0.5, 1.0);
  if (s < 16.0) return 1 - smooth(s - 15.0);
  if (s < 27.0) return 0;
  if (s < 29.5) return fill(27.0, 0, 0.5);
  return fill(29.5, 0.5, 1.0);
}
const staggerActive = (s) => s >= 12.0 && s < 16.0;

// Per-bone binding charge (driven by simTime): 1 normal, 1.6 attacks, 0.4 stagger, -> 0 at release.
const ATTACK_WIN = [[6.0, 7.6], [17.0, 19.4], [24.2, 25.0], [25.8, 26.9], [27.6, 29.4]];
function attackLevel(s) {
  let a = 0;
  for (const w of ATTACK_WIN) a = Math.max(a, win(w[0] - 0.25, w[0], w[1], w[1] + 0.35, s));
  return a;
}
function baseCharge(s) {
  let c = 1 + 0.6 * attackLevel(s);
  const st = win(12.0, 12.2, 15.4, 16.0, s);
  c = lerp(c, 0.4, st);
  return c;
}
// ============================================================================
// 2. WORLD GROUND + TITAN RIG (16 bones posed procedurally from motion time)
// ============================================================================
const V3 = THREE.Vector3;
function groundH(x, z) {
  return 0.26 * Math.sin(x * 0.071 + 0.6) * Math.cos(z * 0.083 - 0.4) + 0.16 * Math.sin(x * 0.17 + z * 0.11 + 1.3) +
    0.11 * Math.sin(-x * 0.05 + z * 0.21 + 2.1) + 0.05 * Math.sin(x * 0.43 - z * 0.37);
}
const GROUND_GLSL = `float groundH(vec2 p){ return 0.26*sin(p.x*0.071+0.6)*cos(p.y*0.083-0.4) + 0.16*sin(p.x*0.17+p.y*0.11+1.3) + 0.11*sin(-p.x*0.05+p.y*0.21+2.1) + 0.05*sin(p.x*0.43-p.y*0.37); }`;
const WIND = new V3(1, 0, 0);
function windSpeedAt(t) { return 9.0 + 3.0 * noise1(t * 0.35, 5) + 1.5 * noise1(t * 1.3, 6); }

// Bone indices. The listed skeleton (pelvis, spine, chest, head + per side upper arm, forearm, fist,
// thigh, shin, foot) is implemented exactly as listed.
const B = { PELVIS: 0, SPINE: 1, CHEST: 2, HEAD: 3, LUA: 4, LFA: 5, LFI: 6, RUA: 7, RFA: 8, RFI: 9, LTH: 10, LSH: 11, LFT: 12, RTH: 13, RSH: 14, RFT: 15 };
const NB = 16;
const BONE_GROUP = ['pelvis', 'spine', 'chest', 'head', 'arms', 'arms', 'arms', 'arms', 'arms', 'arms', 'legs', 'legs', 'legs', 'legs', 'legs', 'legs'];
const BONE_REL_SIM = BONE_GROUP.map((g) => REL_SIM[g]);
const BONE_REL_M = BONE_REL_SIM.map((s) => motionTime(s));
const TD = { spine: 6.5, chest: 7.5, head: 5.0, shX: 8.0, shY: 6.0, hipX: 3.7, hipY: -0.7, ua: 8.0, fa: 7.0, fist: 2.3, th: 8.5, sh: 8.5, ankle: 1.0, foot: 3.6 };
// Capsule radii used for rope collision (match boulder shells)
const BONE_RAD = [3.4, 2.9, 3.8, 2.6, 2.4, 2.2, 1.8, 2.4, 2.2, 1.8, 2.7, 2.4, 1.7, 2.7, 2.4, 1.7];

function makeTitanPose() {
  const bones = [];
  for (let i = 0; i < NB; i++) bones.push({ o: new V3(), x: new V3(), y: new V3(), z: new V3(), e: new V3(), len: 1 });
  return { bones, root: { x: new V3(), y: new V3(0, 1, 0), z: new V3() }, gp: new V3(), m: 0 };
}

// ---- small frame helpers ------------------------------------------------
const _m3a = new Float64Array(9), _m3b = new Float64Array(9), _m3c = new Float64Array(9);
function eulerMat(pitch, yaw, roll, out) { // R = Ry(yaw) * Rx(pitch) * Rz(roll)
  const cp = Math.cos(pitch), sp = Math.sin(pitch), cy = Math.cos(yaw), sy = Math.sin(yaw), cr = Math.cos(roll), sr = Math.sin(roll);
  // Rx*Rz
  const a00 = cr, a01 = -sr, a02 = 0;
  const a10 = cp * sr, a11 = cp * cr, a12 = -sp;
  const a20 = sp * sr, a21 = sp * cr, a22 = cp;
  // Ry * (Rx Rz)
  out[0] = cy * a00 + sy * a20; out[1] = cy * a01 + sy * a21; out[2] = cy * a02 + sy * a22;
  out[3] = a10; out[4] = a11; out[5] = a12;
  out[6] = -sy * a00 + cy * a20; out[7] = -sy * a01 + cy * a21; out[8] = -sy * a02 + cy * a22;
  return out;
}
// child frame = parent frame * R(local)
function rotFrame(px, py, pz, pitch, yaw, roll, ox, oy, oz) {
  const R = eulerMat(pitch, yaw, roll, _m3a);
  const fx = (col, out) => out.set(
    px.x * R[col] + py.x * R[3 + col] + pz.x * R[6 + col],
    px.y * R[col] + py.y * R[3 + col] + pz.y * R[6 + col],
    px.z * R[col] + py.z * R[3 + col] + pz.z * R[6 + col]);
  fx(0, ox); fx(1, oy); fx(2, oz);
}
const _t1 = new V3(), _t2 = new V3(), _t3 = new V3(), _t4 = new V3(), _t5 = new V3(), _t6 = new V3();
function setBone(b, start, end, ref) {
  b.o.copy(start); b.e.copy(end);
  b.y.subVectors(end, start); b.len = b.y.length();
  if (b.len < 1e-6) { b.y.set(0, -1, 0); b.len = 1e-6; } else b.y.divideScalar(b.len);
  b.z.copy(ref).addScaledVector(b.y, -ref.dot(b.y));
  if (b.z.lengthSq() < 1e-8) { b.z.set(1, 0, 0).addScaledVector(b.y, -b.y.x); }
  b.z.normalize();
  b.x.crossVectors(b.y, b.z);
}
// Two-bone IK: start S, target T, lengths a,b, pole direction -> mid, end
function ik2(S, T, a, b, pole, outMid, outEnd) {
  _t1.subVectors(T, S);
  let d = _t1.length();
  if (d < 1e-6) { _t1.set(0, -1, 0); d = 1e-6; } else _t1.divideScalar(d);
  d = clamp(d, Math.abs(a - b) + 1e-3, (a + b) * 0.9995);
  const cosA = clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1), sinA = Math.sqrt(1 - cosA * cosA);
  _t2.copy(pole).addScaledVector(_t1, -pole.dot(_t1));
  if (_t2.lengthSq() < 1e-8) _t2.set(0, 0, 1).addScaledVector(_t1, -_t1.z);
  _t2.normalize();
  outMid.copy(S).addScaledVector(_t1, a * cosA).addScaledVector(_t2, a * sinA);
  outEnd.copy(S).addScaledVector(_t1, d);
}

// ---- parameter vector layout ----------------------------------------------
const NP = 56;
const PI_ = { gx: 0, gz: 1, yaw: 2, hp: 3, lat: 4, fwd: 5, pp: 6, pr: 7, pyaw: 8, sp: 9, sy: 10, sr: 11, cp: 12, cy: 13, cr: 14, hdp: 15, hdy: 16, look: 17,
  arm0: 18, arm1: 29, leg0: 40, leg1: 47, shud: 54, spare: 55 };
// arm block: rel(3) world(3) wW(1) pole(3) curl(1) = 11 ; leg block: ankle(3) pitch(1) pole(3) = 7
const YAW0 = -Math.PI / 2; // facing -X
const STAND_X = 16;
const FOOT_L = [20.7, 3.9], FOOT_R = [14.7, -3.9];

function setArm(P, side, rx, ry, rz, poleX, poleY, poleZ, curl) {
  const o = side === 0 ? PI_.arm0 : PI_.arm1;
  P[o] = rx; P[o + 1] = ry; P[o + 2] = rz; P[o + 6] = 0;
  P[o + 7] = poleX; P[o + 8] = poleY; P[o + 9] = poleZ; P[o + 10] = curl;
}
function setArmWorld(P, side, wx, wy, wz, w) { const o = side === 0 ? PI_.arm0 : PI_.arm1; P[o + 3] = wx; P[o + 4] = wy; P[o + 5] = wz; P[o + 6] = w; }
function setLeg(P, side, ax, az, ay, pitch, poleX, poleY, poleZ) {
  const o = side === 0 ? PI_.leg0 : PI_.leg1;
  P[o] = ax; P[o + 1] = (ay === undefined ? groundH(ax, az) + TD.ankle : ay); P[o + 2] = az; P[o + 3] = pitch;
  P[o + 4] = poleX; P[o + 5] = poleY; P[o + 6] = poleZ;
}

// ---- walking gait (0..6 s) ------------------------------------------------
function gxWalk(m) { return m <= 6 ? 40 - 4 * m : STAND_X - 4 * (m - 6) * Math.exp(-(m - 6) / 0.25); }
const plantX = (T) => 40 - 4 * (T + 0.825);
// side 0 = left (+Z), 1 = right (-Z). Returns [x, z, y, pitch]

const FLAT_N = 256;
const flatData = new Uint8Array(FLAT_N * FLAT_N * 4);

function stampFlat(x, z, radius, t, dx, dz, strength, radial) {
  const cell = 180 / FLAT_N;
  const r = Math.ceil(radius / cell) + 1;
  const ci = Math.floor((x + 90) / cell), cj = Math.floor((z + 90) / cell);
  const tb = Math.round(clamp(t / 40, 0, 1) * 254);
  for (let j = cj - r; j <= cj + r; j++) for (let i = ci - r; i <= ci + r; i++) {
    if (i < 0 || j < 0 || i >= FLAT_N || j >= FLAT_N) continue;
    const px = -90 + (i + 0.5) * cell, pz = -90 + (j + 0.5) * cell;
    const d = Math.hypot(px - x, pz - z);
    if (d > radius) continue;
    const k = strength * (1 - sstep(radius * 0.6, radius, d));
    const o = (j * FLAT_N + i) * 4;
    let ux = dx, uz = dz;
    if (radial) { ux = (px - x) / (d || 1); uz = (pz - z) / (d || 1); }
    if (flatData[o] === 255 || tb < flatData[o]) { flatData[o] = tb; }
    if (k * 255 > flatData[o + 3]) { flatData[o + 1] = Math.round((ux * 0.5 + 0.5) * 255); flatData[o + 2] = Math.round((uz * 0.5 + 0.5) * 255); flatData[o + 3] = Math.round(k * 255); }

  cliffMat.roughness = lerp(0.85, 0.4, wet);
  for (const k of ['cloth', 'leather']) { hunterMats[k].roughness = lerp(0.9, 0.35, wet); hunterMats[k].envMapIntensity = lerp(0.4, 1.0, wet); }
  hunterMats.cloth.color.copy(lin(0x2c3240)).multiplyScalar(lerp(1, 0.7, wet));
  hunterMats.leather.color.copy(lin(0x5c3b24)).multiplyScalar(lerp(1, 0.65, wet));
  hunterMats.metal.roughness = lerp(0.9, 0.35, wet); hunterMats.metal.envMapIntensity = lerp(0.6, 1.2, wet);
  hunterMats.accent.roughness = lerp(0.9, 0.35, wet);
  // fog per shot (wide shots keep the Titan readable)
  const fogD = cs.shot === 5 ? 0.0046 : cs.shot === 0 ? 0.0062 : 0.0068;
  scene.fog.density = fogD;
  rainU.uFogD.value = fogD; dustU.uFogD.value = fogD; arcMat.uniforms.uFogD.value = fogD; ropeMat.uniforms.uFogD.value = fogD; bolts.forEach((b) => (b.mesh.material.uniforms.uFogD.value = fogD));
  // lights: arc lights at the most charged bones, blade + weak point light, shadow frustum follows the action
  const order = [...Array(NB).keys()].sort((a, b) => arcStats.boneSum[b] - arcStats.boneSum[a]);
  const tick = Math.floor(s * 20);
  for (let i = 0; i < 4; i++) {
    const b = order[i], L = arcLights[i], sum = arcStats.boneSum[b];
    const bn = pose.bones[b];
    L.position.copy(bn.o).addScaledVector(bn.y, bn.len * 0.5);
    L.intensity = m < BONE_REL_M[b] ? Math.min(3.2, sum * 0.75) * (0.6 + 0.4 * hash01(tick, 31, i)) : 0;
  }
  bladeLight.position.copy(HUNT.bladeBase).lerp(HUNT.bladeTip, 0.5);
  bladeLight.intensity = 0.9;
  const tw = targetWP(s), stw = wpState(tw, s);
  wpAt(tw, m, pose, wpLight.position);
  wpLight.intensity = (stw.intact && stw.exposed) ? 1.6 + 6 * stw.flash : 3 * stw.flash;
  const cx = Math.round((HUNT.root.x + cs.TC.x) * 0.5), cz = Math.round((HUNT.root.z + cs.TC.z) * 0.5);
  keyLight.target.position.set(cx, 0, cz);
  keyLight.position.set(cx + KEY_DIR.x * 150, KEY_DIR.y * 150, cz + KEY_DIR.z * 150);
  sky.position.copy(camera.position);
  // render scene -> RT -> post (CA) -> screen; HUD on top
  const pr = renderer.getPixelRatio();
  const rw = Math.max(1, Math.floor(W * pr)), rh = Math.max(1, Math.floor(Hh * pr));
  if (!sceneRT || sceneRT.width !== rw || sceneRT.height !== rh) { if (sceneRT) sceneRT.dispose(); sceneRT = makeRT(rw, rh); }
  renderer.setRenderTarget(sceneRT);
  renderer.setClearColor(0x000000, 1);
  renderer.clear(true, true, true);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.setClearColor(0x000000, 0);
  postU.tDiffuse.value = sceneRT.texture; postU.uRes.value.set(rw, rh);
  postU.uCA.value = 6 * cs.trauma * cs.trauma * pr;
  postU.uTime.value = Math.floor(s * 24) / 24;
  renderer.autoClear = true;
  renderer.render(postScene, postCam);
  updateHUD(s, m, pose, W, Hh);
  renderer.autoClear = false;
  renderer.render(hudScene, hudCam);
  renderer.autoClear = true;
  // info for audio
  frameInfo.camPos.copy(camera.position); frameInfo.camQ.copy(camera.quaternion);
  frameInfo.TC.copy(cs.TC); frameInfo.H.copy(HUNT.chest);
  frameInfo.omega = titanOmega(m, pose);
  let cs2 = 0; for (let b = 0; b < NB; b++) cs2 += boneCharge(b, s); frameInfo.avgCharge = cs2 / NB;
  frameInfo.titanAlive = 1 - sstep(32.6, 33.2, s);
  frameInfo.hSpeed = HUNT.speed; frameInfo.hAir = HUNT.airborne;
  frameInfo.reel = TETHERS.some((T) => m >= T.attach && m < T.release);
  lastRenderedS = s;
}

// ---------------------------------------------------------------- UI / state machine
const ui = {
  countdown: document.getElementById('countdown'), toggle: document.getElementById('btn-toggle'), refire: document.getElementById('btn-refire'),
  play: document.getElementById('icon-play'), pause: document.getElementById('icon-pause'), scrubber: document.getElementById('scrubber'),
  pills: Array.from(document.querySelectorAll('.speed-pill')),
};
const ST = { COUNTDOWN: 'COUNTDOWN', PLAYING: 'PLAYING', PAUSED: 'PAUSED', REFIRE_HOLD: 'REFIRE_HOLD', ENDED: 'ENDED' };
let state = null, simTime = 0, playbackSpeed = 1.0, countdownElapsed = 0, holdElapsed = 0, lastWall = null, scrubbing = false;
let needsRender = true, manualMode = false, audioPrev = 0;
function showPlayIcon(play) { ui.play.style.display = play ? '' : 'none'; ui.pause.style.display = play ? 'none' : ''; ui.toggle.setAttribute('aria-label', play ? 'Play' : 'Pause'); }
function hideCountdown() { ui.countdown.style.display = 'none'; ui.countdown.textContent = ''; }
function setSim(t) { simTime = clamp(t, 0, DURATION); ui.scrubber.value = simTime.toFixed(3); needsRender = true; }
function enterPlaying() { state = ST.PLAYING; showPlayIcon(false); audioPrev = simTime; }
function enterPaused() { state = ST.PAUSED; showPlayIcon(true); }
ui.toggle.addEventListener('click', () => {
  if (state === ST.PLAYING) enterPaused();
  else if (state === ST.COUNTDOWN || state === ST.REFIRE_HOLD) { hideCountdown(); setSim(0); enterPaused(); }
  else if (state === ST.PAUSED) enterPlaying();
  else if (state === ST.ENDED) { hideCountdown(); setSim(0); enterPlaying(); }
});
ui.pills.forEach((p) => p.addEventListener('click', () => {
  playbackSpeed = parseFloat(p.dataset.speed);
  ui.pills.forEach((q) => { const on = q === p; q.classList.toggle('is-active', on); q.setAttribute('aria-checked', on ? 'true' : 'false'); });
}));
ui.scrubber.addEventListener('input', () => {
  if (state === ST.COUNTDOWN || state === ST.REFIRE_HOLD) hideCountdown();
  scrubbing = true;
  setSim(parseFloat(ui.scrubber.value));
  enterPaused();
  renderAt(simTime); needsRender = false;
});
const endScrub = () => { scrubbing = false; };
ui.scrubber.addEventListener('change', endScrub); ui.scrubber.addEventListener('pointerup', endScrub); window.addEventListener('pointerup', endScrub);
ui.refire.addEventListener('click', () => {
  hideCountdown();
  setSim(0);
  ui.scrubber.value = '0';
  renderAt(0); needsRender = false;
  showPlayIcon(false);
  state = ST.REFIRE_HOLD; holdElapsed = 0;
});
function onResize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect = camAspect(); camera.updateProjectionMatrix();
  needsRender = true;
}
window.addEventListener('resize', onResize);

function frame(now) {
  requestAnimationFrame(frame);
  if (manualMode) return;
  const rawDt = lastWall === null ? 0 : (now - lastWall) / 1000;
  lastWall = now;
  const dt = Math.min(Math.max(rawDt, 0), 0.1);
  if (state === null) { state = ST.COUNTDOWN; countdownElapsed = 0; ui.countdown.style.display = 'block'; ui.countdown.textContent = '3'; }
  else if (state === ST.COUNTDOWN) {
    countdownElapsed += dt;
    if (countdownElapsed >= 3.0) { hideCountdown(); enterPlaying(); }
    else { ui.countdown.style.display = 'block'; ui.countdown.textContent = countdownElapsed < 1 ? '3' : countdownElapsed < 2 ? '2' : '1'; }
  } else if (state === ST.PLAYING) {
    setSim(Math.min(DURATION, simTime + dt * playbackSpeed));
  } else if (state === ST.REFIRE_HOLD) {
    holdElapsed += dt;
    if (holdElapsed >= 1.0) enterPlaying();
  }
  const playing = state === ST.PLAYING;
  if (needsRender || playing) { renderAt(simTime); needsRender = false; }
  audioUpdate(playing && !scrubbing, simTime, audioPrev, frameInfo);
  audioPrev = simTime;
  if (state === ST.PLAYING && simTime >= DURATION) {
    setSim(DURATION); renderAt(DURATION); needsRender = false;
    state = ST.ENDED; showPlayIcon(true);
  }
  // warm the tether caches in spare time (results are step-identical regardless of when computed)
  warmRopes(48);
}

// precompile every material once (objects that first appear mid-fight would otherwise compile on demand)
function precompileAll() {
  const hidden = [];
  scene.traverse((o) => { if (!o.visible) { hidden.push(o); o.visible = true; } });
  try { renderer.compile(scene, camera); } catch (e) { /* non-fatal */ }
  hidden.forEach((o) => (o.visible = false));
}
// ---------------------------------------------------------------- boot
initWorld();
precompileAll();
renderAt(0);
showPlayIcon(false);
ui.countdown.style.display = 'block'; ui.countdown.textContent = '3';
requestAnimationFrame(frame);

window.BENCH_REPORT.counts.grassBlades = GRASS_N;
window.BENCH_REPORT.counts.rainStreaks = RAIN_N;
window.BENCH_REPORT.counts.boulders = boulders.length;
window.BENCH_REPORT.counts.ropePoints = ROPE_N;
window.BENCH_REPORT.counts.ragdollPoints = NJ;
window.BENCH_REPORT.counts.arcs = BASE_ARC_COUNT;
window.__storm = {
  renderAt: (t) => { manualMode = true; renderAt(t); return { arcs: arcStats.count, cam: camState }; },
  resume: () => { manualMode = false; },
  info: () => ({ state, simTime, playbackSpeed, boulders: boulders.length, arcs: arcStats.count, fovExtra: camState.fovExtra, audio: AUD.ctx ? { st: AUD.ctx.state, ready: AUD.ready, shots: AUD.shots.length, fired: AUD.fired || 0 } : null }),
  hunter: (t) => { const H = makeHunterPose(); hunterPose(t, H); return H; },
  titan: (t) => titanPose(t, makeTitanPose()),
  ropes: () => ropes, wp: (i, t) => wpAt(i, t, titanPose(t, makeTitanPose()), new V3()),
  dbg: () => ({ RibbonBuffer, ribbonMaterial, ropeBufs, scene, rockMat, arcMat, arcBuf, envTex, keyLight, hunterMats, renderer, camera, groundMat, grass, hemi, rockMeshes }),
  P65: () => P65, P0: () => ({ p: P0HIT, fv: S3.fistVel }),
  boulders: () => boulders, FALL1: () => FALL1, ragThumps: () => ragThumps, GETUP: () => GETUP, segs: () => segs,
};

})();
</script>
