// Independent spatial frequencies packed into one periodic noise texture.
function makeNoise() {
  const side=256,pixels=new Uint8Array(side*side*4);
  for(let ch=0;ch<4;ch++){
    const n=[8,16,32,64][ch],grid=Float32Array.from({length:n*n},random);
    for(let y=0;y<side;y++)for(let x=0;x<side;x++){
      const gx=x*n/side,gy=y*n/side,ix=floor(gx),iy=floor(gy);
      const sx=smooth(0,1,gx-ix),sy=smooth(0,1,gy-iy);
      const g=(a,b)=>grid[(a%n)+(b%n)*n];
      pixels[(y*side+x)*4+ch]=255*lerp(lerp(g(ix,iy),g(ix+1,iy),sx),lerp(g(ix,iy+1),g(ix+1,iy+1),sx),sy);
    }
  }
  const tex=new T.DataTexture(pixels,side,side,T.RGBAFormat);
  tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.magFilter=T.LinearFilter;
  tex.minFilter=T.LinearMipmapLinearFilter;tex.generateMipmaps=true;tex.needsUpdate=true;return tex;

const noiseTex=makeNoise();
function terrainTextures() {
  const side=512,stone=new Uint8Array(side*side*4),turf=new Uint8Array(side*side*4);
  const rng=mulberry32(42),grids={};
  for(const n of [5,9,17,33,67,119])grids[n]=Float32Array.from({length:n*n},rng);
  function field(x,y,n) {
    const ix=floor(x*n),iy=floor(y*n),a=smooth(0,1,x*n-ix),b=smooth(0,1,y*n-iy);
    const X=(ix%n+n)%n,Z=(iy%n+n)%n,g=grids[n];
    return lerp(lerp(g[Z*n+X],g[Z*n+(X+1)%n],a),lerp(g[((Z+1)%n)*n+X],g[((Z+1)%n)*n+(X+1)%n],a),b);
  }
  const cells=Array.from({length:25},()=>[range(.21,.79),range(.21,.79)]);
  for(let y=0;y<side;y++)for(let x=0;x<side;x++){
    const u=x/side,v=y/side,n=field(u,v,5),m=field(u,v,17),grain=field(u,v,67),f=rng();
    const s=(u+.064*(m-.5)+.014*(grain-.5))*5,t=(v+.11*(n-.5)+.024*(m-.5))*5;
    let near=3,next=4;
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
      const i=floor(s)+a,j=floor(t)+b,c=cells[((i%5+5)%5)+5*((j%5+5)%5)];
      const d=(s-i-c[0])**2+(t-j-c[1])**2;
      if(d<near){next=near;near=d;}else if(d<next)next=d;
    }
    const gap=sqrt(next)-sqrt(near),vein=1-smooth(.008,.045,gap);
    const lamina=field(u+v*.13,v*2+n*.047,33),chip=field(u,v,119);
    const grey=.19+.28*n+.19*m+.16*grain+.13*f+.085*lamina;
    const heightMap=.33*n+.28*m+.19*grain+.12*chip+.055*f-.23*vein;
    const q=(y*side+x)*4;
    stone[q]=255*sat(grey-vein*.28+(f>.985?.22:0));stone[q+1]=255*sat(heightMap);
    stone[q+2]=255*vein;stone[q+3]=255*sat((m-.28)*1.65);
    const moss=.22+.29*n+.21*m+.17*grain+.10*f;
    turf[q]=255*sat(moss);turf[q+1]=255*sat(.39*m+.35*grain+.13*chip+.13*f);
    turf[q+2]=255*sat(.47*n+.31*m+.22*chip);turf[q+3]=255;

  for(let i=0;i<33500;i++){
    const x=range(0,side),y=range(0,side),a=range(-1,1.4),l=range(2,12),v=range(-43,39);
    for(let j=0;j<l;j++){
      const k=((floor(x+j*cos(a))+side)%side+side*((floor(y+j*sin(a))+side)%side))*4;
      turf[k]=min(255,max(0,turf[k]+v*(1-j/l)));turf[k+1]=min(255,max(0,turf[k+1]+v*.6));
    }
  }
  const texture=data=>{const tx=new T.DataTexture(data,side,side,T.RGBAFormat);tx.wrapS=tx.wrapT=T.RepeatWrapping;
    tx.magFilter=T.LinearFilter;tx.minFilter=T.LinearMipmapLinearFilter;tx.generateMipmaps=true;

const surfaces=terrainTextures();
// Integrate a seeded, three-dimensional cloud bank into a floating sky panorama.
// Sky and reflection lighting share the same cloud structure.
function buildCloudPanorama() {
  const cells=64,tile=66,side=tile*8,raw=new Uint8Array(side*side*4),rng=mulberry32(42);
  const octaves=[4,8,16,32].map(n=>({n,a:Float32Array.from({length:n*n*n},rng)}));
  function value(o,x,y,z){
    const n=o.n,X=x*n,Y=y*n,Z=z*n,ix=floor(X),iy=floor(Y),iz=floor(Z);
    const fx=smooth(0,1,X-ix),fy=smooth(0,1,Y-iy),fz=smooth(0,1,Z-iz);
    const get=(i,j,k)=>o.a[(i%n)+n*((j%n)+n*(k%n))];
    const slab=k=>lerp(lerp(get(ix,iy,k),get(ix+1,iy,k),fx),lerp(get(ix,iy+1,k),get(ix+1,iy+1,k),fx),fy);

  for(let z=0;z<cells;z++)for(let j=0;j<tile;j++)for(let i=0;i<tile;i++){
    const x=((i+cells-1)%cells)/cells,y=((j+cells-1)%cells)/cells,w=z/cells;
    const n=octaves.map(o=>value(o,x,y,w));
    const h=n[0]*.50+n[1]*.27+n[2]*.15+n[3]*.08;
    const at=4*((z%8)*tile+i+side*(floor(z/8)*tile+j));

    uniforms:{volume:U(volume)},vertexShader:`varying vec2 coord;void main(){coord=uv;gl_Position=vec4(position.xy,0.,1.);}`,

    vec2 address(vec2 xy,float layer){return (vec2(mod(layer,8.),floor(layer/8.))*66.+xy*64.+1.5)/528.;}
    vec3 field(vec3 p){vec3 P=fract(p);float z=P.z*64.,i=floor(z);

    float density(vec3 p){

    }
    void main(){
      float a=(coord.x-.5)*6.2831853,e=coord.y*1.81-.235;
      vec3 d=vec3(cos(a)*cos(e),sin(e),sin(a)*cos(e)),sun=normalize(vec3(.79,.38,-.47));
      float horizon=exp(-max(0.,d.y)*5.);

      clear+=vec3(.33,.242,.148)*lightwell;

      float start=.63/ray.y,ds=min(.34,(2.28/ray.y-start)/38.);
      float trans=1.;vec3 light=vec3(0.);

          float direct=exp(-2.8*occlusion);

          shade+=vec3(.106,.093,.075)*lightwell*direct*(.40+.60*powder);

const cloudCode=`
uniform sampler2D panorama,noiseMap;
uniform float time,flash;
vec3 storm(vec3 d) {
  vec3 advected=normalize(d-vec3(time*.00086*(.29+max(0.,d.y)),0.,time*.00009));
  vec2 uv=vec2(atan(advected.z,advected.x)/6.2831853+.5,(asin(clamp(advected.y,-1.,1.))+.235)/1.81);
  vec3 c=texture2D(panorama,uv).rgb;

function makeRange(radius,base,amplitude,seed) {
  const positions=[],normals=[],sectors=768,rows=17,verts=[];
  for(let i=0;i<=sectors;i++){

    const peaks=.29*ridge(7,seed)+.19*ridge(13,seed*.4)+.10*ridge(28,seed)+.052*ridge(57,seed*.3);
    const top=base+amplitude*(broad+peaks);
    for(let j=0;j<rows;j++){
      const u=j/(rows-1),spur=sin(a*24+u*3.5+seed)+.35*sin(a*53-u*4.3);
      const r=radius+u*43+sin(a*7+seed)*9+spur*(3.8+5.7*sin(u*PI));

  }
  const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(positions,3));
  g.setAttribute('normal',new T.Float32BufferAttribute(normals,3));
  const m=new T.ShaderMaterial({side:T.DoubleSide,uniforms:{noiseMap:U(noiseTex),talus:U(surfaces.stone),flash:flashU},

      case 'thunder':voice('white',0,0,1.12,.28,6400);voice('brown',0,0,1.37,2.95,1370,.067);
        voice('sine',59,23,.75,2.80,155,.11);voice('brown',0,0,.69,2.12,410,.48);break;
    }
  }
  let live=false;
  function state(playing) {
    live=playing;const now=audio.currentTime;
    master.gain.cancelScheduledValues(now);master.gain.setValueAtTime(master.gain.value,now);
    master.gain.linearRampToValueAtTime(playing?.57:0,now+.035);
    if(!playing)for(const item of ringing){for(const s of item.sources)try{s.stop(now+.035);}catch(_){}}
  }
  const historicRig=makeRig(),listenerForward=V(),listenerUp=V();
  function update(sim,prev,mt,sk,H,speed,avg) {
    if(!live)return;
    const now=audio.currentTime,L=audio.listener,p=camera.position;
    camera.getWorldDirection(listenerForward);listenerUp.copy(Y).applyQuaternion(camera.quaternion);
    if(L.positionX){
      for(const [prefix,v] of [['position',p],['forward',listenerForward],['up',listenerUp]]){
        L[prefix+'X'].value=v.x;L[prefix+'Y'].value=v.y;L[prefix+'Z'].value=v.z;
      }
    }else{L.setPosition(p.x,p.y,p.z);L.setOrientation(listenerForward.x,listenerForward.y,listenerForward.z,listenerUp.x,listenerUp.y,listenerUp.z);}
    place(hunterPan,H);place(titanPan,chestPos(sk));
    const wet=sat(sim/30),gust=.5+.31*sin(sim*.79)+.17*sin(sim*2.12);
    const set=(param,x)=>param.setTargetAtTime(max(.00001,x),now,.019);
    set(wind.gain,.20+.14*gust);set(wind.filter.frequency,340+280*gust);set(rainNoise.gain,.082+.032*wet);
    set(rainNoise.filter.frequency,lerp(2350,1390,wet));
    let duck=1;
    for(const s of strikes){const age=sim-s.t;if(age>=0&&age<s.stop+.15)duck=min(duck,lerp(.251,1,smooth(s.stop,s.stop+.15,age)));}
    set(bed.gain,duck);
    poseTitan(max(0,mt-.025),historicRig);
    let omega=0;sk.forEach((b,i)=>{if(mt<release[i])omega=max(omega,b.q.angleTo(historicRig[i].q)/.025);});
    const moving=min(1,omega*.30),alive=1-smooth(31.9,32.6,sim);
    set(grind.gain,alive*(.11+.45*moving));set(grind.filter.frequency,62+240*moving);
    set(stoneBass.gain,alive*(.04+.12*moving));set(stoneBass.src.frequency,32+27*moving);
    set(hum.gain,.105*avg);set(hum.src.frequency,52+13*avg);set(hum.filter.frequency,170+380*avg);
    set(crackle.gain,(.055+.035*sin(sim*39)**2)*avg);set(crackle.filter.frequency,1040+1350*avg);
    const attached=arrival.some((a,i)=>sim>=a&&sim<detach[i]);
    set(reel.gain,attached?.094:0);set(reel.src.frequency,280+min(1050,speed*25));set(reel.filter.frequency,385+speed*32);
    const airborne=smooth(.7,4.8,H.y-height(H.x,H.z))+(sim>=19&&sim<=21.5?.3:0);
    set(air.gain,min(.26,speed*.009)*airborne);set(air.filter.frequency,720+min(2400,speed*43));
    if(audio.state==='running'&&prev!==null&&sim>prev){for(const e of events)if(e.t>prev&&e.t<=sim)playEvent(e);}
  }

}
const sound=makeSound();
const wetMaterials=[rockMat,gravelMat,groundMat,...hunterMats];
const originalPaint=hunterMats.map(m=>m.color.clone());
function renderAt(sim,previous=null) {
  const t=motionTime(sim),wet=sat(sim/30),sk=poseTitan(t,rig),points=hunterPose(t,sk),H=points[1];
  const view=cameraPose(sim,t,sk,H),flash=skyFlash(sim);
  clockU.value=t;wetU.value=wet;flashU.value=flash;
  weatherCamera.value.copy(camera.position);sky.position.copy(camera.position);
  const avg=sk.reduce((sum,b,i)=>sum+chargeAt(i,t,sim),0)/sk.length;
  key.intensity=1.85+flash*4.6;scene.fog.color.copy(fogColor).lerp(new T.Color(.82,.90,.96),flash*.57);
  for(const m of wetMaterials){m.roughness=lerp(.9,.35,wet);m.envMapIntensity=.59+.61*wet;}
  hunterMats.forEach((m,i)=>m.color.copy(originalPaint[i]).multiplyScalar(1-.22*wet));
  for(let i=0;i<3;i++){const id=[2,8,11][i],l=electricLights[i];l.position.copy(sk[id].a).add(V(-1.9,1.1,.45));
    l.intensity=chargeAt(id,t,sim)*(1.2+.5*hash(42+floor(t*20)*5+i));}
  const target=sim<5?0:sim<12?1:2;weakLight.position.copy(weak(sk,target));
  weakLight.intensity=sim<29.5&&(target!==2||sim>=25)?1.1:0;
  fieldLight.value.copy(sk[8].b);meanPower.value=avg;
  attachHierarchy(sk);updateRocks(t,sk,sim);cores(t,sim,sk);updateHunter(t,sk,points);effects(t,sim,sk,points);
  updateWaves(t);composite(view.trauma);drawHUD(sim,t,sk);
  sound.update(sim,previous,t,sk,H,view.speed,avg);
}
const countdown=document.getElementById('countdown'),scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle'),pauseIcon=document.getElementById('icon-pause'),playIcon=document.getElementById('icon-play');
const States=Object.freeze({COUNTDOWN:'COUNTDOWN',PLAYING:'PLAYING',PAUSED:'PAUSED',REFIRE_HOLD:'REFIRE_HOLD',ENDED:'ENDED'});
let state=States.COUNTDOWN,simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0,lastWall=null;
function transition(next) {
  state=next;const active=next===States.PLAYING||next===States.REFIRE_HOLD||next===States.COUNTDOWN;
  pauseIcon.style.display=active?'block':'none';playIcon.style.display=active?'none':'block';
  toggle.setAttribute('aria-label',active?'Pause':'Play');
  countdown.style.display=next===States.COUNTDOWN?'block':'none';
  countdown.textContent=next===States.COUNTDOWN?'3':'';
  sound.state(next===States.PLAYING);
}
function resize() {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.getDrawingBufferSize(screenSize.value);
  mainRT.setSize(screenSize.value.x,screenSize.value.y);
  for(const rt of glowRT)rt.setSize(max(1,floor(screenSize.value.x/4)),max(1,floor(screenSize.value.y/4)));
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  hudCam.right=innerWidth;hudCam.bottom=innerHeight;hudCam.updateProjectionMatrix();
}
toggle.addEventListener('click',()=>{
  if(state===States.PLAYING||state===States.COUNTDOWN||state===States.REFIRE_HOLD)transition(States.PAUSED);
  else {if(state===States.ENDED){simTime=0;scrubber.value='0';renderAt(0);}transition(States.PLAYING);}
  lastWall=performance.now();
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  simTime=0;holdElapsed=countdownElapsed=0;scrubber.value='0';transition(States.REFIRE_HOLD);
  renderAt(0);lastWall=performance.now();
});
const pills=Array.from(document.querySelectorAll('.speed-pill'));
for(const pill of pills)pill.addEventListener('click',()=>{
  playbackSpeed=Number(pill.dataset.speed);
  for(const p of pills){p.classList.toggle('is-active',p===pill);p.setAttribute('aria-checked',String(p===pill));}
});
scrubber.addEventListener('input',()=>{
  transition(States.PAUSED);simTime=min(DURATION,max(0,parseFloat(scrubber.value)));renderAt(simTime);lastWall=performance.now();
});
scrubber.addEventListener('pointerdown',()=>{if(state!==States.PAUSED)transition(States.PAUSED);});
function frame(stamp) {
  const dt=lastWall===null?0:min(.1,max(0,(stamp-lastWall)/1000));lastWall=stamp;
  let advance=state===States.PLAYING?dt:0;
  if(state===States.COUNTDOWN) {
    countdownElapsed+=dt;
    if(countdownElapsed>=3){advance=countdownElapsed-3;transition(States.PLAYING);}
    else countdown.textContent=String(3-floor(countdownElapsed));
  }else if(state===States.REFIRE_HOLD) {
    holdElapsed+=dt;if(holdElapsed>=1){advance=holdElapsed-1;transition(States.PLAYING);}
  }
  if(state===States.PLAYING&&advance>0) {
    const previous=simTime;simTime=min(DURATION,simTime+advance*playbackSpeed);
    const millisecond=Math.round(simTime*1000)/1000;
    if(abs(simTime-millisecond)<1e-11)simTime=millisecond;
    scrubber.value=simTime.toFixed(3);
    renderAt(simTime,previous);if(simTime>=DURATION)transition(States.ENDED);
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{resize();renderAt(simTime);});
resize();transition(States.COUNTDOWN);renderAt(0);requestAnimationFrame(frame);
}
window.addEventListener('DOMContentLoaded',startEncounter,{once:true});
</script>

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
