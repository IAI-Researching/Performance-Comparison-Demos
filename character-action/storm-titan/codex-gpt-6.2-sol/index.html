<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm Titan</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#countdown { display: none; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="40" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const DURATION = 40;
const STEP = 1 / 240, SEED = 42, TAU = Math.PI * 2;
const V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const Q = () => new THREE.Quaternion();
const UP = V(0, 1, 0), DOWN = V(0, -1, 0);
const clamp = (x, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, x));
const lerp = (a, b, u) => a + (b - a) * u;
const phase = (t, a, b) => clamp((t - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
const ease = (t, a, b) => smooth(phase(t, a, b));
const turn = (x, y, z) => Q().setFromEuler(new THREE.Euler(x, y, z, 'YXZ'));
const color = hex => new THREE.Color(hex).convertSRGBToLinear();

function seeded(initial) {
  let state = initial >>> 0;
  return () => {
    let n = state = (state + 0x6d2b79f5) >>> 0;
    n = Math.imul(n ^ (n >>> 15), n | 1);
    n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
    return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
  };
}

function hash(i, j = 0) {
  let n = (Math.imul(i + SEED, 374761393) + Math.imul(j, 668265263)) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}

function noise(x, i) {
  const n = Math.floor(x);
  return lerp(hash(n, i), hash(n + 1, i), smooth(x - n)) * 2 - 1;
}

const groundY = (x, z) => .26 * Math.sin(.095 * x + .043 * z)
  + .18 * Math.cos(.087 * z - .049 * x) + .13 * Math.sin(.16 * z + .17 * x);
const groundAt = (x, z, offset = 0) => V(x, groundY(x, z) + offset, z);
const groundGLSL = `
  float groundHeight(vec2 p) {
    return .26*sin(dot(p,vec2(.095,.043))) + .18*cos(dot(p,vec2(-.049,.087)))
      + .13*sin(dot(p,vec2(.17,.16)));
  }
`;

const strikes = [
  { time: 5, core: 0, damage: 400, stop: .1, trauma: .45 },
  { time: 12, core: 1, damage: 600, stop: .1, trauma: .55 },
  { time: 27, core: 2, damage: 500, stop: .1, trauma: .6 },
  { time: 29.5, core: 2, damage: 500, stop: .2, trauma: 1 }
];
const footTimes = [1, 2.5, 4, 5.5];
const skyStrikes = [
  { time: 8.2, point: groundAt(76, 47), trauma: .3 },
  { time: 25, trauma: .5 },
  { time: 33, point: V(143, -12, 90), trauma: .3 }
];
const traumaEvents = [
  ...footTimes.map(time => ({ time, trauma: .25 })), ...strikes, ...skyStrikes,
  { time: 7.5, trauma: .9 }, { time: 13, trauma: .7 },
  { time: 19, trauma: .8 }, { time: 31.5, trauma: .2 }
].sort((a, b) => a.time - b.time);

function motionTime(t) {
  for (const s of strikes) {
    const age = t - s.time;
    if (age >= 0 && age < s.stop + .3) {
      return s.time + Math.max(0, age - s.stop) * ((.3 + s.stop) / .3);
    }
  }
  return t;
}

function traumaAt(t) {
  let amount = 0, previous = 0;
  for (const event of traumaEvents) {
    if (event.time > t) break;
    amount = clamp(Math.max(0, amount - .8 * (event.time - previous)) + event.trauma);
    previous = event.time;
  }
  return Math.max(0, amount - .8 * (t - previous));
}

const PELVIS = 0, SPINE = 1, CHEST = 2, HEAD = 3;
const LUA = 4, LFA = 5, LFIST = 6, RUA = 7, RFA = 8, RFIST = 9;
const LTHIGH = 10, LSHIN = 11, LFOOT = 12, RTHIGH = 13, RSHIN = 14, RFOOT = 15;
const parents = [-1, 0, 1, 2, 2, 4, 5, 2, 7, 8, 0, 10, 11, 0, 13, 14];
const releaseTimes = [32, 31.4, 30.8, 29.7, 30.2, 30.2, 30.2, 30.2, 30.2, 30.2, 32.6, 32.6, 32.6, 32.6, 32.6, 32.6];
const thighLength = 8.25, shinLength = 8.5, upperLength = 7.45, foreLength = 7.15;
const slamCenter = groundAt(.8, -8);
const sweepCenter = groundAt(4.3, -4.7);
const footTrack = [
  [[0, 38.3], [1, 32.9], [4, 20.7]], [[0, 39.4], [2.5, 26.8], [5.5, 14.5]]
];

function walkingFoot(t, side) {
  const track = footTrack[side];
  let x = track[0][1], lift = 0;
  for (let i = 1; i < track.length; i++) {
    const [time, goal] = track[i];
    const u = phase(t, Math.max(0, time - 1.08), time);
    if (u < 1) {
      x = lerp(x, goal, smooth(u));
      lift = Math.pow(Math.sin(Math.PI * u), 1.4) * 1.85;
      break;
    }
    x = goal;
  }
  x = lerp(x, side ? 12.9 : 18.5, ease(t, 8.9, 11.4));
  return groundAt(x, side ? -4.55 : 4.45, 1.15 + lift);
}

function solveJoint(root, end, lengthA, lengthB, pole) {
  const axis = end.clone().sub(root);
  const d = clamp(axis.length(), .001, lengthA + lengthB - .001);
  axis.normalize();
  const lateral = pole.clone().addScaledVector(axis, -pole.dot(axis));
  if (lateral.lengthSq() < 1e-7) lateral.set(0, 0, 1).addScaledVector(axis, -axis.z);
  lateral.normalize();
  const along = (lengthA * lengthA - lengthB * lengthB + d * d) / (2 * d);
  return root.clone().addScaledVector(axis, along)
    .addScaledVector(lateral, Math.sqrt(Math.max(0, lengthA * lengthA - along * along)));
}

function titanPose(t) {
  const p = [], q = [];
  const gait = 1 - ease(t, 5.5, 6);
  const stride = Math.sin(t * TAU / 3);
  const footWeight = footTimes.reduce((total, hit) => total
    + Math.exp(-Math.pow((t - hit - .05) / .17, 2)) * .58, 0);
  const windup = ease(t, 6, 7.04) * (1 - ease(t, 7.12, 7.49));
  const planted = ease(t, 7.09, 7.5) * (1 - ease(t, 10.5, 11.85));
  const reel = ease(t, 10.5, 11.95) * (1 - ease(t, 12.14, 12.95));
  const recoil = ease(t, 12, 12.37) * (1 - ease(t, 12.35, 13));
  const kneel = ease(t, 12.35, 13) * (1 - ease(t, 15, 16));
  const sweepWind = ease(t, 17, 18.5) * (1 - ease(t, 18.5, 19.12));
  const sweepDown = ease(t, 18.12, 18.65) * (1 - ease(t, 19.18, 20.6));
  const sweepTwist = ease(t, 18.53, 19.1) * (1 - ease(t, 19.32, 20.63));
  const chestRecoil = ease(t, 25, 25.18) * (1 - ease(t, 25.26, 26.35));
  const death = ease(t, 29.5, 32.55);
  const x = 40 - 4 * Math.min(t, 6);
  let height = 18 - gait * (.54 * Math.abs(stride) + footWeight) - .65 * windup
    - 12.3 * planted - 9.1 * sweepDown - 9.4 * death;
  const yaw = .1 * gait * stride - .22 * planted - .23 * sweepWind - .56 * sweepTwist
    + .16 * recoil - .22 * kneel + .07 * Math.sin(t * .8) * (1 - gait);
  const pitch = .045 + .105 * gait + .93 * planted + .84 * sweepDown
    - .19 * windup - .34 * recoil + .37 * kneel - .16 * chestRecoil + .61 * death;
  const roll = -.08 * gait * stride - .11 * planted + .32 * sweepDown + .17 * kneel;
  q[PELVIS] = turn(roll, yaw, pitch);
  p[PELVIS] = V(x + .95 * recoil - 1.3 * kneel, height, .46 * stride * gait - 1.4 * planted);
  const leftFoot = walkingFoot(t, 0), rightFoot = walkingFoot(t, 1);
  const hipLocal = V(.12, -.45, 3.15).applyQuaternion(q[PELVIS]);
  const kneeRest = leftFoot.clone().add(V(-8.47, .10, -.38));
  const dx = p[PELVIS].x + hipLocal.x - kneeRest.x;
  const dz = p[PELVIS].z + hipLocal.z - kneeRest.z;
  height = lerp(height, kneeRest.y + Math.sqrt(Math.max(1, thighLength ** 2 - dx * dx - dz * dz)) - hipLocal.y, kneel);
  p[PELVIS].y = height;

  const child = (index, offset, relative) => {
    const parent = parents[index];
    p[index] = offset.applyQuaternion(q[parent]).add(p[parent]);
    q[index] = q[parent].clone().multiply(relative);
  };
  child(SPINE, V(0, 5.4, 0), turn(-.04 * stride * gait, -.13 * stride * gait, -.07 * gait - .12 * planted));
  child(CHEST, V(0, 6.65, 0), turn(-.036 + .05 * windup, .08 * stride * gait - .19 * sweepTwist, -.025 - .08 * kneel));
  child(HEAD, V(-.15, 5.55, 0), turn(.06 * Math.sin(t * 1.3), .14 * Math.sin(t * .72) + .16 * planted,
    -.10 - .23 * planted - .24 * chestRecoil));

  function limb(i, origin, target, a, b, pole, terminal) {
    const delta = target.clone().sub(origin);
    if (delta.length() > a + b - .012) target = origin.clone().add(delta.setLength(a + b - .012));
    const joint = solveJoint(origin, target, a, b, pole);
    p[i] = origin;
    q[i] = Q().setFromUnitVectors(DOWN, joint.clone().sub(origin).normalize());
    p[i + 1] = V(0, -a, 0).applyQuaternion(q[i]).add(p[i]);
    q[i + 1] = Q().setFromUnitVectors(DOWN, target.clone().sub(p[i + 1]).normalize());
    p[i + 2] = V(0, -b, 0).applyQuaternion(q[i + 1]).add(p[i + 1]);
    q[i + 2] = terminal(q[i + 1]);
  }

  for (const side of [0, 1]) {
    const sign = side ? -1 : 1;
    const hip = V(.12, -.45, sign * 3.15).applyQuaternion(q[PELVIS]).add(p[PELVIS]);
    const front = V(-1, 0, sign * .16).lerp(kneeRest.clone().sub(hip), side ? 0 : kneel);
    limb(side ? RTHIGH : LTHIGH, hip, side ? rightFoot : leftFoot, thighLength, shinLength, front,
      () => turn(.03 * sign, yaw * .22 + sign * .13, 0));

    const shoulder = V(-.1, .05, sign * 7.25).applyQuaternion(q[CHEST]).add(p[CHEST]);
    const swing = Math.sin((t - .52) * TAU / 3);
    const hand = V(1.3 + sign * 3.45 * swing * gait, -13.45 + .45 * Math.sin(t * 1.1 + sign), sign * 2.55)
      .applyQuaternion(q[CHEST]).add(shoulder);
    if (side) {
      hand.lerp(V(13, 41.2, -10), windup);
      hand.lerp(slamCenter.clone().add(V(0, 1.65, 0)), planted);
      hand.lerp(V(5.7, 31.2, -11.6), reel);
      hand.lerp(V(10.4, 5.1, -10), kneel * .74);
    } else {
      hand.lerp(V(22, 8, 13.5), sweepWind);
      const u = phase(t, 18.5, 19.3), angle = lerp(1.36, 4.49, 1 - (1 - u) ** 1.55);
      const sweep = V(14 + 11.9 * Math.cos(angle), 2.0 + .55 * Math.pow((u - .61) / .61, 2),
        2.7 + 11.7 * Math.sin(angle));
      hand.lerp(sweep, ease(t,18.21,18.55) * (1 - ease(t,19.3,20.35)));
      hand.lerp(V(6.1, 3.4, 9.2), kneel * .9);
    }
    limb(side ? RUA : LUA, shoulder, hand, upperLength, foreLength, V(1, .26 + .55 * windup, .81 * sign),
      lower => lower.clone().slerp(turn(0, yaw, 0), .31));
  }
  return { p, q };
}

const bonePoint = (pose, bone, x, y, z) => V(x, y, z).applyQuaternion(pose.q[bone]).add(pose.p[bone]);
const coreSpecs = [[LSHIN, -1.75, -.18, -.12], [RUA, -1.78, .30, -1.38], [CHEST, -2.23, .48, .15]];
const coreAt = (pose, i) => bonePoint(pose, ...coreSpecs[i]);
skyStrikes[1].point = bonePoint(titanPose(25), HEAD, 0, 2.85, 0);

function boneCharge(t, i) {
  if (t >= releaseTimes[i]) return 0;
  if (t >= 12 && t < 16) return .4;
  if ((t >= 6 && t < 7.73) || (t >= 17 && t < 19.3)) return 1.6;
  return 1;
}

function path(a, b, va, vb, t, start, end) {
  const u = phase(t, start, end), u2 = u * u, u3 = u2 * u, duration = end - start;
  return a.clone().multiplyScalar(2 * u3 - 3 * u2 + 1).addScaledVector(b, 3 * u2 - 2 * u3)
    .addScaledVector(va, (u3 - 2 * u2 + u) * duration).addScaledVector(vb, (u3 - u2) * duration);
}

const ropeSpecs = [
  { fire: 3, attach: 3.3, end: 5.6, bone: LSHIN, local: [-1.19, -3.45, .035] },
  { fire: 9, attach: 9.3, end: 12.4, bone: RFA, local: [-1.12, -4.34, -.38] },
  { fire: 23.5, attach: 23.8, end: 31.53, bone: CHEST, local: [-2.53, 2.1, 1.15] }
];
const landingOne = groundAt(11, 6.8, .83);
const hunterSlamBait = groundAt(slamCenter.x, slamCenter.z, .83);
const launchTwo = groundAt(5.3, -12.5, .82);
const landingTwo = groundAt(-2, -13.6, .83);
const sweepVictim = groundAt(sweepCenter.x, sweepCenter.z, .83);
const landingThree = groundAt(6.3, -4.3, .82);
const aftermath = groundAt(2.6, -6.9, .82);

function firstSwing(t, pose) {
  const u = phase(t, 3.3, 5), angle = .04 + TAU * 1.015 * u;
  const y = lerp(-7.0, -.46, smooth(u) ** .80) + 2.4 * Math.sin(Math.PI * u) ** 2;
  // The surface arc and its free tangent leg share one fixed length.
  const radius = 1.13, horizontal = Math.sqrt(9.5 ** 2 - (y + 3.45) ** 2);
  let lo = radius + .025, hi = horizontal + radius;
  for (let i = 0; i < 12; i++) {
    const r = (lo + hi) * .5, tangent = Math.acos(radius / r);
    const consumed = angle < tangent
      ? Math.hypot(r - radius * Math.cos(angle), radius * Math.sin(angle))
      : Math.sqrt(r * r - radius * radius) + radius * (angle - tangent);
    if (consumed > horizontal) hi = r;
    else lo = r;
  }
  const wrist = bonePoint(pose, LSHIN, -((lo + hi) * .5) * Math.cos(angle), y, -((lo + hi) * .5) * Math.sin(angle));
  wrist.y = Math.max(wrist.y, groundY(wrist.x, wrist.z) + .95);
  const approach = coreAt(pose, 0).sub(wrist).normalize();
  return wrist.addScaledVector(approach, -.19).add(V(0, -.39, 0));
}

function secondSwing(t, pose) {
  const u = phase(t, 9.3, 12), rise = ease(t, 10.5, 12);
  const anchor = bonePoint(pose, RFA, ...ropeSpecs[1].local);
  const hanging = anchor.clone().add(V(-2.3 - .8 * Math.sin(u * Math.PI), -3.65 + .6 * Math.sin(u * TAU), -4.05));
  hanging.y = Math.max(groundY(hanging.x, hanging.z) + .83, hanging.y);
  return hanging.lerp(coreAt(pose, 1).add(V(-.9, -1.15, -.63)), rise);
}

function thirdSwing(t, pose) {
  const anchor = bonePoint(pose, CHEST, ...ropeSpecs[2].local);
  if (t < 27) {
    const length = 32.8;
    const initial = lerp(.423, .364, phase(t,23.8,24.24));
    const reel = phase(t,24.24,27);
    const reelEase = smooth(reel);
    const radius = lerp(length*Math.sin(initial),1.77,reelEase);
    const vertical = lerp(-length*Math.cos(initial),-2.53,reelEase);
    const angle = lerp(-.62,-.16,reelEase*reelEase);
    const point = anchor.add(V(-radius*Math.cos(angle),vertical,radius*Math.sin(angle)));
    return point.lerp(coreAt(pose,2).add(V(-1.77,-1.01,-.42)),ease(t,26.16,27));
  }
  const u = phase(t, 27, 29.5), dip = Math.sin(Math.PI * u) ** 2;
  return coreAt(pose, 2).add(V(lerp(-1.77,-.99,u)-.12*dip, -1.01-2.95*dip, lerp(-.42,.41,u)));
}

let ragdoll, collapseAnchorRock;
const getUpRoot = V();
const t1Attach = firstSwing(3.3, titanPose(3.3));
const t2Attach = secondSwing(9.3, titanPose(9.3));
const t3Attach = thirdSwing(23.8, titanPose(23.8));
const retreatOne = groundAt(-10.2, 1.5, .83);
const retreatSlam = groundAt(-10.4, -17.6, .83);

function hunterRoot(t, pose) {
  if (t < 3.3) return path(groundAt(-40, 10, .83), t1Attach, V(12, 0, 1), V(5, 1.1, -4), t, 0, 3.3);
  if (t < 5) return firstSwing(t, pose);
  if (t < 5.6) return firstSwing(5, titanPose(5.6)).add(V(-2.6, -2.4, 3.9).multiplyScalar(ease(t, 5, 5.6)))
    .lerp(firstSwing(5, pose).add(V(-2.6, -2.4, 3.9).multiplyScalar(ease(t, 5, 5.6))), 1 - ease(t, 5.4, 5.6));
  if (t < 6.08) {
    const takeoff = firstSwing(5, titanPose(5.6)).add(V(-2.6, -2.4, 3.9));
    return path(takeoff, landingOne, V(-4, -3, 4), V(-8, 0, -3), t, 5.6, 6.08);
  }
  if (t < 6.5) return path(landingOne, hunterSlamBait, V(-8, 0, -3), V(-12, 0, -10), t, 6.08, 6.5);
  if (t < 7.53) return path(hunterSlamBait, retreatSlam, V(-12, 0, -10), V(0, 0, -1), t, 6.5, 7.53);
  if (t < 9) return path(retreatSlam, launchTwo, V(0, 0, -1), V(7, 0, 4), t, 7.53, 9);
  if (t < 9.3) return path(launchTwo, t2Attach, V(7, 0, 4), V(0, 0, 0), t, 9, 9.3);
  if (t < 12.4) return secondSwing(t, pose);
  if (t < 13.5) return path(secondSwing(12.4, titanPose(12.4)), landingTwo, V(-5, -1.5, -2), V(-5, -21, -3), t, 12.4, 13.5);
  if (t < 15.3) return path(landingTwo, retreatOne, V(-5, 0, -3), V(-.6, 0, 5), t, 13.5, 15.3);
  if (t < 17.3) return path(retreatOne, groundAt(-7.8, 6.2, .83), V(-.6, 0, 5), V(3, 0, -1), t, 15.3, 17.3);
  if (t <= 19) return path(groundAt(-7.8, 6.2, .83), sweepVictim, V(3, 0, -1), V(7, 0, -8), t, 17.3, 19);
  if (t < 22.5) return getUpRoot.clone();
  if (t < 23.8) {
    const start = groundAt(t3Attach.x - 6.1, t3Attach.z - 2.6, .82);
    if (t < 23.5) return path(getUpRoot, start, V(.65,0,.17), V(11,.45,3.0), t, 22.5, 23.5);
    return path(start, t3Attach, V(11,.45,3.0), V(3.7,-1.8,2.5), t, 23.5, 23.8);
  }
  if (t <= 29.5) return thirdSwing(t, pose);
  if (t < 31.5) {
    const u = phase(t, 29.5, 31.5);
    const root = thirdSwing(29.5, titanPose(29.5)).lerp(landingThree, u * u * (.68 + .32 * u));
    root.z -= 1.1 * Math.sin(u * Math.PI);
    return root;
  }
  if (t < 32.94) return path(landingThree, aftermath, V(-4.6, 0, -3), V(), t, 31.5, 32.94);
  return aftermath.clone();
}

function hunterVelocity(t) {
  const a = clamp(t - .015, 0, DURATION), b = clamp(t + .015, 0, DURATION);
  return hunterRoot(b, titanPose(b)).sub(hunterRoot(a, titanPose(a))).multiplyScalar(1 / (b - a));
}

const HIPS = 0, BODY = 1, MASK = 2, LSH = 3, LEL = 4, LWR = 5, RSH = 6, REL = 7, RWR = 8;
const LHIP = 9, LKNEE = 10, LANK = 11, RHIP = 12, RKNEE = 13, RANK = 14;
const RAG_COUNT = 15;

function animatedHunter(t, pose, rising = false, velocityHint = null) {
  const root = hunterRoot(t, pose), velocity = velocityHint || hunterVelocity(t);
  const speed = Math.hypot(velocity.x, velocity.z);
  const tether = ropeSpecs.find(r => t >= r.fire - .10 && t < r.end);
  const anchor = tether && bonePoint(pose, tether.bone, ...tether.local);
  const target = coreAt(pose, t < 6 ? 0 : t < 16 ? 1 : 2);
  const heading = velocity.clone().setY(0);
  if (heading.length() < 1.5) heading.copy(rising || t > 32.8 ? V(1, 0, .23) : target.clone().sub(root).setY(0));
  heading.normalize();
  if (t>=22.5&&t<22.75) heading.lerp(V(1,0,.23).normalize(),1-ease(t,22.5,22.75)).normalize();
  const air = smooth(clamp((root.y - groundY(root.x, root.z) - 1) * 1.13));
  if (tether && t > tether.attach && air > .1) {
    heading.lerp(target.clone().sub(root).setY(0).normalize(), air * .84).normalize();
  }
  const side = V(-heading.z, 0, heading.x), cadence = TAU * (2.3 * t + .11 * Math.sin(t * .8));
  const effort = clamp(speed / 9) * (1 - air);
  const rollU = phase(t, 31.5, 32.2), rolling = Math.sin(Math.PI * rollU);
  const parts = [];
  const get = rising ? 1 - ease(t, 21.5, 22.45) : 0;
  root.y += .055 * effort * (1 - Math.cos(2 * cadence)) + .018 * Math.sin(t * 4) - .19 * rolling - .42 * get;
  const bodyUp = UP.clone().addScaledVector(heading, .42 * effort - .30 * air + get * 1.18).normalize();
  parts[HIPS] = root;
  parts[BODY] = root.clone().addScaledVector(bodyUp, .46).addScaledVector(side, .025 * Math.sin(cadence) * effort);
  parts[MASK] = parts[BODY].clone().addScaledVector(bodyUp, .30).addScaledVector(heading, .035);

  let swing = 0;
  for (const s of strikes) {
    swing = Math.max(swing, ease(t, s.time - .35, s.time - .045) * (1 - ease(t, s.time + .055, s.time + .34)));
  }
  for (const i of [0, 1]) {
    const sign = i ? -1 : 1, shoulder = i ? RSH : LSH, hip = i ? RHIP : LHIP;
    const wave = Math.sin(cadence + i * Math.PI);
    parts[shoulder] = parts[BODY].clone().addScaledVector(side, .192 * sign).addScaledVector(bodyUp, -.025);
    parts[hip] = root.clone().addScaledVector(side, .115 * sign);
    const foot = parts[hip].clone().addScaledVector(heading, .405 * wave * effort - air * (.23 + i * .20));
    foot.y = groundY(foot.x, foot.z) + .09 + Math.max(0, Math.cos(cadence + i * Math.PI)) * .33 * effort;
    foot.y = lerp(foot.y, root.y - (.47 + i * .15), air);
    if (get > 0) foot.addScaledVector(heading, -.27 * get * sign);
    const extension = foot.clone().sub(parts[hip]);
    if (extension.length() > .792) foot.copy(parts[hip]).add(extension.setLength(.792));
    parts[hip + 1] = solveJoint(parts[hip], foot, .405, .40, heading);
    parts[hip + 2] = foot;

    const hand = parts[shoulder].clone().add(V(0, -.43 + .15 * effort - .08 * get, 0))
      .addScaledVector(heading, -.35 * wave * effort + .18 * air).addScaledVector(side, sign * (.085 + .26 * air));
    if (!i && tether) {
      const aim = anchor.clone().sub(parts[shoulder]).normalize();
      const pull = parts[shoulder].clone().addScaledVector(aim, .51).addScaledVector(side, .065);
      hand.lerp(pull, .94 * ease(t, tether.fire - .1, tether.fire + .13));
    }
    if (i && swing) {
      const aim = target.clone().sub(parts[shoulder]).normalize();
      hand.lerp(parts[shoulder].clone().addScaledVector(aim, .515), swing);
    }
    const arm = hand.clone().sub(parts[shoulder]);
    if (arm.length() > .54) hand.copy(parts[shoulder]).add(arm.setLength(.54));
    parts[shoulder + 1] = solveJoint(parts[shoulder], hand, .277, .271, V(0, -1, 0).addScaledVector(side, .72 * sign));
    parts[shoulder + 2] = hand;
  }
  if (rollU > 0 && rollU < 1) {
    const q = Q().setFromAxisAngle(side, TAU * smooth(rollU));
    for (let i = 1; i < parts.length; i++) {
      parts[i].sub(root).applyQuaternion(q).add(root);
      parts[i].y = Math.max(parts[i].y, groundY(parts[i].x, parts[i].z) + .08);
    }
    heading.applyQuaternion(q);
  }
  const blade = heading.clone().multiplyScalar(.73).add(V(0, -.72 + air * .24, 0)).addScaledVector(side, -.27).normalize();
  if (swing) blade.lerp(target.clone().sub(parts[RWR]).normalize(), swing).normalize();
  return { parts, heading, blade, swing };
}

// Fixed-step poses are stored as Float32 snapshots. Sampling has no mutable cursor.
function readCache(cache, time, count, into = []) {
  const stride = count * 3, frame = clamp((time - cache.start) / STEP, 0, cache.steps);
  const a = Math.floor(frame), b = Math.min(a + 1, cache.steps), u = frame - a;
  for (let i = 0; i < count; i++) {
    const idx = i * 3, x = a * stride + idx, y = b * stride + idx;
    (into[i] ||= V()).set(lerp(cache.data[x], cache.data[y], u), lerp(cache.data[x + 1], cache.data[y + 1], u),
      lerp(cache.data[x + 2], cache.data[y + 2], u));
  }
  return into;
}

function snapshot(out, index, points) {
  let j = index * points.length * 3;
  for (const p of points) {
    out[j++] = p.x; out[j++] = p.y; out[j++] = p.z;
  }
}

function constrain(a, b, distance, wa, wb) {
  const x = b.x - a.x, y = b.y - a.y, z = b.z - a.z;
  const length = Math.sqrt(x * x + y * y + z * z);
  if (length < 1e-8) return;
  const f = (1 - distance / length) / (wa + wb), u = f * wa, v = f * wb;
  a.x += x * u; a.y += y * u; a.z += z * u;
  b.x -= x * v; b.y -= y * v; b.z -= z * v;
}

const ragSounds = [];
function makeRagdoll() {
  const start = 19, steps = Math.round((21.5 - start) / STEP);
  const h = animatedHunter(start, titanPose(start), false, V(7, 0, -8));
  const p=h.parts, throwVelocity=V(-14,9,-6);
  const inverseMass=[.44,.49,.85,.8,1.15,1.3,.8,1.15,1.3,.71,.95,1,.71,.95,1];
  const mass=inverseMass.reduce((sum,inverse)=>sum+1/inverse,0);
  const pivot=p.reduce((center,point,i)=>center.addScaledVector(point,1/inverseMass[i]),V()).divideScalar(mass);
  const perturbations=p.map((_,i)=>V(noise(i,110),noise(i,111),noise(i,112)).multiplyScalar(.24));
  const mean=perturbations.reduce((sum,offset,i)=>sum.addScaledVector(offset,1/inverseMass[i]),V()).divideScalar(mass);
  const previous = p.map((point, i) => {
    const angular=V(-4.0,1.65,4.7).cross(point.clone().sub(pivot));
    const velocity=throwVelocity.clone().add(angular).add(perturbations[i]).sub(mean);
    return point.clone().addScaledVector(velocity,-STEP);
  });
  const links = [[HIPS,BODY],[BODY,MASK],[BODY,LSH],[BODY,RSH],[LSH,RSH],[LSH,HIPS],[RSH,HIPS],
    [LSH,LEL],[LEL,LWR],[RSH,REL],[REL,RWR],[HIPS,LHIP],[HIPS,RHIP],[LHIP,RHIP],[LHIP,LSH],[RHIP,RSH],
    [LHIP,RSH],[RHIP,LSH],[LHIP,LKNEE],[LKNEE,LANK],[RHIP,RKNEE],[RKNEE,RANK]];
  const sticks = links.map(([a,b]) => [a,b,p[a].distanceTo(p[b])]);
  const stops = [[LSH,LWR,.26],[RSH,RWR,.26],[LHIP,LANK,.25],[RHIP,RANK,.25]];
  const radius = [.19,.18,.14,.125,.086,.069,.125,.086,.069,.11,.092,.09,.11,.092,.09];
  const data = new Float32Array((steps + 1) * RAG_COUNT * 3);
  snapshot(data, 0, p);
  let lastSound = start;
  for (let f = 1; f <= steps; f++) {
    const time = start + f * STEP;
    for (let i = 0; i < p.length; i++) {
      const cur = p[i], old = previous[i];
      const x = cur.x, y = cur.y, z = cur.z;
      cur.x += (x - old.x) * .997;
      cur.y += (y - old.y) * .997 - 9.81 * STEP * STEP;
      cur.z += (z - old.z) * .997;
      old.set(x,y,z);
    }
    for (let iteration = 0; iteration < 10; iteration++) {
      for (const [a,b,d] of sticks) constrain(p[a], p[b], d, inverseMass[a], inverseMass[b]);
      for (const [a,b,d] of stops) {
        if (p[a].distanceToSquared(p[b]) < d * d) constrain(p[a], p[b], d, inverseMass[a], inverseMass[b]);
      }
      for (let i = 0; i < p.length; i++) {
        const cur = p[i], old = previous[i], base = groundY(cur.x, cur.z) + radius[i];
        if (cur.y < base) {
          const speed = (old.y - cur.y) / STEP;
          if (speed > 2.5 && time - lastSound > .16) {
            ragSounds.push({ time, point: groundAt(cur.x, cur.z), power: clamp(speed / 11, .15, .58) });
            lastSound = time;
          }
          cur.y = base;
          old.y = cur.y - Math.max(0, speed) * .12 * STEP;
          old.x = lerp(cur.x, old.x, .70);
          old.z = lerp(cur.z, old.z, .70);
        }
      }
    }
    snapshot(data, f, p);
  }
  getUpRoot.copy(groundAt(p[HIPS].x, p[HIPS].z, .83));
  return { start, steps, data };
}
ragdoll = makeRagdoll();

function hunterPose(t, titan, velocityHint) {
  if (t < 19 || t >= 22.5) return animatedHunter(t, titan, false, velocityHint);
  const p = readCache(ragdoll, t, RAG_COUNT);
  const shoulders = p[LSH].clone().sub(p[RSH]).normalize();
  const torso = p[BODY].clone().sub(p[HIPS]).normalize();
  const face = torso.cross(shoulders).normalize();
  const blade = p[RWR].clone().sub(p[REL]).normalize();
  if (t >= 21.5) {
    const standing = animatedHunter(t, titan, true, V());
    const u = ease(t, 21.5, 22.5);
    p.forEach((point, i) => point.lerp(standing.parts[i], u));
    face.lerp(standing.heading, u).normalize();
    blade.lerp(standing.blade, u).normalize();
  }
  return { parts: p, heading: face, blade, swing: 0 };
}

function floatingRock(rock, t, pose, p = V(), q = Q()) {
  const { bone, a, b, c, rest, localIndex } = rock;
  p.copy(rest);
  if (bone === CHEST && (localIndex === 1 || localIndex === 2)) {
    const u = ease(t, 25, 25.68);
    p.z += (localIndex === 1 ? -1 : 1) * 1.99 * u;
    p.y += (localIndex === 1 ? .88 : .66) * u;
    p.x -= .21 * u;
  }
  p.x += .12 * Math.sin(t * .9 + a);
  p.y += .12 * Math.sin(t * 1.16 + b);
  p.z += .13 * Math.cos(t * 1.02 + c);
  p.applyQuaternion(pose.q[bone]).add(pose.p[bone]);
  q.copy(pose.q[bone]).multiply(turn(.15 * Math.sin(t * .66 + a) + .12 * Math.sin(b),
    .30 * Math.sin(t * .65 + b), .17 * Math.sin(t * .78 + c)));
  return p;
}

  const attribute=geometry.getAttribute('position');
  const hull=[], unique=new Set();
  for(let i=0;i<attribute.count;i++){
    const v=V().fromBufferAttribute(attribute,i), key=v.toArray().join(',');
    if(!unique.has(key)){hull.push(...v.toArray());unique.add(key);}
  }
  return new Float32Array(hull);
});

  for(let i=0;i<shape.length;i+=3){
    const x=shape[i]*rx,y=shape[i+1]*ry,z=shape[i+2]*rz;
    radius=Math.max(radius,x*x+y*y+z*z);
  }

function support(rock,inverse,x,y,z) {
  supportDirection.set(x,y,z).applyQuaternion(inverse).multiply(rock.scale);
  const shape=rockHulls[rock.variant], n=supportDirection;
  let furthest=-Infinity;
  for(let i=0;i<shape.length;i+=3) furthest=Math.max(furthest,shape[i]*n.x+shape[i+1]*n.y+shape[i+2]*n.z);
  return furthest;
}

function heldRocks(pose, mt, time, includeReleased=false) {
  const active=[];
  for(const r of rocks){
    if(releaseTimes[r.bone]<time || (!includeReleased&&releaseTimes[r.bone]===time))continue;
    floatingRock(r,mt,pose,r.p,r.q);
    r.inverse.copy(r.q).invert();
    active.push(r);
  }
  // A support plane between nearby convex hulls keeps their moving edges separated.
  for(let iteration=0;iteration<8;iteration++){
    let adjusted=false;
    for(let i=0;i<active.length-1;i++){
      const a=active[i], pa=a.p;
      for(let j=i+1;j<active.length;j++){
        const b=active[j], pb=b.p;
        const dx=pb.x-pa.x,dy=pb.y-pa.y,dz=pb.z-pa.z;
        const squared=dx*dx+dy*dy+dz*dz, reach=a.radius+b.radius+.078;
        if(squared>reach*reach || squared<1e-8)continue;
        const distance=Math.sqrt(squared), x=dx/distance,y=dy/distance,z=dz/distance;
        const overlap=support(a,a.inverse,x,y,z)+support(b,b.inverse,-x,-y,-z)+.078-distance;
        if(overlap<.001)continue;
        const shift=overlap*.51;
        pa.x-=x*shift;pa.y-=y*shift;pa.z-=z*shift;
        pb.x+=x*shift;pb.y+=y*shift;pb.z+=z*shift;
        adjusted=true;
      }
    }
    for(const r of active){
      if(r.p.y>1.0+r.radius)continue;
      const bottom=groundY(r.p.x,r.p.z)+support(r,r.inverse,0,-1,0)+.034;
      if(r.p.y<bottom){r.p.y=bottom;adjusted=true;}
    }
    if(!adjusted)break;
  }
}

const spinQ=Q();
function fallenRock(rock,t,p=V(),q=Q()) {
  const {rt,p:start,q:orientation,v,spinAxis,spin,impact,contact,bounce}=rock.drop;
  const elapsed=Math.max(0,t-rt), air=Math.min(elapsed,impact), after=Math.max(0,elapsed-impact);
  q.copy(orientation).multiply(spinQ.setFromAxisAngle(spinAxis,spin*(air+.24*(1-Math.exp(-after*4)))));
  if(elapsed<impact){
    p.copy(start).addScaledVector(v,air);
    p.y-=4.905*air*air;
  }else{
    const slide=(1-Math.exp(-after*3.6))*.155;
    p.copy(contact).addScaledVector(v,slide);
    p.y=groundY(p.x,p.z)+support(rock,landingInverse.copy(q).invert(),0,-1,0)
      +Math.max(0,bounce*after-4.905*after*after);
  }
  return p;
}

const ROPE_COUNT = 34;
const bonesWithCapsules = [
  [PELVIS, SPINE, 1.8], [SPINE, CHEST, 1.55], [CHEST, HEAD, 2.15], [HEAD, -1, 1.56],
  [LUA, LFA, 1.33], [LFA, LFIST, 1.10], [LFIST,-1,1.28],
  [RUA, RFA, 1.33], [RFA, RFIST, 1.09], [RFIST,-1,1.28],

function capsuleList(pose, time) {
  const result = [];
  for (const [a,b,r] of bonesWithCapsules) {
    if (time >= motionTime(releaseTimes[a])) continue;
    const one = pose.p[a];
    const two = b < 0 ? bonePoint(pose, a, a === LFOOT || a === RFOOT ? -2.5 : 0, a === HEAD ? 1.7 : -.95, 0) : pose.p[b];
    const x = two.x - one.x, y = two.y - one.y, z = two.z - one.z;
    result.push({ one, x, y, z, inv: 1 / (x*x + y*y + z*z || 1), r, r2: r*r,
      minX: Math.min(one.x,two.x)-r, maxX: Math.max(one.x,two.x)+r,
      minY: Math.min(one.y,two.y)-r, maxY: Math.max(one.y,two.y)+r,
      minZ: Math.min(one.z,two.z)-r, maxZ: Math.max(one.z,two.z)+r });
  }
  return result;
}

function collideRope(p, capsules) {
  for (const c of capsules) {
    if (p.x < c.minX || p.x > c.maxX || p.y < c.minY || p.y > c.maxY || p.z < c.minZ || p.z > c.maxZ) continue;
    const px = p.x - c.one.x, py = p.y - c.one.y, pz = p.z - c.one.z;
    const u = clamp((px*c.x + py*c.y + pz*c.z) * c.inv);
    const dx = px - c.x*u, dy = py - c.y*u, dz = pz - c.z*u;
    const d2 = dx*dx + dy*dy + dz*dz;
    if (d2 < c.r2 && d2 > 1e-10) {
      const f = c.r / Math.sqrt(d2) - 1;
      p.x += dx*f; p.y += dy*f; p.z += dz*f;
    }
  }
  p.y = Math.max(p.y, groundY(p.x,p.z) + .065);
}

function launcher(h) {
  return h.parts[LWR].clone().addScaledVector(h.parts[LWR].clone().sub(h.parts[LEL]).normalize(), .095);
}

function ropeAnchor(spec, t, pose) {
  if (spec.bone === CHEST && t >= collapseAnchorRock.drop.rt) {
    const q = Q(), p = fallenRock(collapseAnchorRock, t, V(), q);
    return p.add(collapseAnchorRock.drop.attachment.clone().applyQuaternion(q));
  }
  return bonePoint(pose, spec.bone, ...spec.local);
}

function makeRope(spec, index) {
  const start = spec.fire, steps = Math.ceil((spec.end - start) / STEP);
  const startPose = titanPose(start);
  const atAttach=titanPose(spec.attach);
  const deployed=launcher(animatedHunter(spec.attach,atAttach)).distanceTo(ropeAnchor(spec,spec.attach,atAttach))+.16;
  const origin = launcher(animatedHunter(start, startPose));
  const p = Array.from({ length: ROPE_COUNT }, () => origin.clone());
  const old = p.map(v => v.clone());
  const data = new Float32Array((steps + 1) * ROPE_COUNT * 3);
  const last = ROPE_COUNT - 1;
  snapshot(data, 0, p);
  for (let f = 1; f <= steps; f++) {
    const t = start + f * STEP, pose = titanPose(t);
    const a = launcher(animatedHunter(t, pose));
    const fixed = ropeAnchor(spec, t, pose);
    const flight = phase(t, start, spec.attach);
    const b = origin.clone().lerp(fixed, flight);
    const chord = a.distanceTo(b);
    let length = chord * (flight < 1 ? 1.012 : 1.075) + .08;
    if (index === 0 && t >= spec.attach) length = Math.max(chord * 1.008, lerp(9.5, 11.5, ease(t, 5.02, 5.6)));
    if (index === 2 && t >= spec.attach && t < 24.42) length=lerp(deployed,length,ease(t,24.24,24.42));
    if (index === 2 && t >= 29.5) length = chord * 1.12 + 1.55;
    const spacing = Math.max(.012, length / last);
    const capsules = capsuleList(pose, t);
    for (let i = 1; i < last; i++) {
      const c = p[i], prev = old[i], { x,y,z } = c;
      c.x += (x - prev.x) * .985 + (4.4 + 2.1 * Math.sin(t * 4 + i * .2)) * STEP * STEP;
      c.y += (y - prev.y) * .985 - 9.81 * STEP * STEP;
      c.z += (z - prev.z) * .985 + noise(t * 3 + i * .09, 57) * 2 * STEP * STEP;
      prev.set(x,y,z);
      if (flight < 1) c.lerp(a.clone().lerp(b, i / last), .18);
    }
    for (let iteration = 0; iteration < 18; iteration++) {
      p[0].copy(a);
      p[last].copy(b);
      const reverse = iteration % 2;
      for (let j = 0; j < last; j++) {
        const i = reverse ? last - 1 - j : j;
        constrain(p[i], p[i + 1], spacing, i === 0 ? 0 : 1, i + 1 === last ? 0 : 1);
      }
      if (flight > .63) for (let i = 1; i < last; i++) collideRope(p[i], capsules);
    }
    snapshot(data, f, p);
  }
  return { start, steps, data };
}

  m.frustumCulled=false;
  target.add(m);
  return m;
}

const wavePlacement=`
  float age=time-eventData.z;
  bool settling=eventShape.z==1.&&age>eventShape.y/30.+1.50;
  float radius=(eventShape.z==2.||settling)?0.:min(age*30.,eventShape.y);
  float edge=max(0.,radius)+eventShape.x*.60+1.;
  delta=position.xy*edge;
  vec2 ground=eventData.xy+delta;
  float reachFade=1.-smoothstep(eventShape.y*.58,eventShape.y,radius);
  float strength=(age<0. || (!settling&&age>eventShape.y/30.+1.5))?0.:eventData.w;

`;
const pushMaterial=new THREE.ShaderMaterial({
  uniforms:{time:shared.motion},depthTest:false,depthWrite:false,toneMapped:false,transparent:true,
  blending:THREE.CustomBlending,blendEquation:THREE.AddEquation,blendSrc:THREE.OneFactor,blendDst:THREE.OneFactor,
  side:THREE.DoubleSide,
  vertexShader:waveVaryings+`
    void main(){

    }`,
  fragmentShader:`
    varying vec2 delta;

    void main(){

      float dent=smoothstep(-.065,.01,age)*(1.-smoothstep(.06,1.50,age));
      if(pulse.z+.12<d && age>0.) dent=0.;
      if(pulse.w==1.)dent=max(dent,.77*(1.-smoothstep(.26,2.87,d))*smoothstep(.03,.38,pulse.x));
      if(pulse.w==2.) dent=(1.-smoothstep(.35,3.15,d))*(1.-smoothstep(.06,1.5,pulse.x));
      vec2 direction=delta/max(d,.001);

let lineCount=0;
function segment(a,b,r,g,blue,width){
  if(lineCount===SEGMENTS)return;
  lineA.setXYZ(lineCount,a.x,a.y,a.z);
  lineB.setXYZ(lineCount,b.x,b.y,b.z);
  lineColor.setXYZW(lineCount++,r,g,blue,width);
}

function bolt(a,b,steps,jitter,id,tick,r,g,blue,width){
  const axis=b.clone().sub(a).normalize();
  const normal=axis.clone().cross(UP);
  if(normal.lengthSq()<.001)normal.set(1,0,0);
  normal.normalize();
  const binormal=axis.clone().cross(normal).normalize();
  let previous=a;
  for(let k=1;k<=steps;k++){
    const u=k/steps;
    const fade=Math.sin(Math.PI*u)*jitter;
    const point=a.clone().lerp(b,u)
      .addScaledVector(normal,fade*(hash(id+k*771,tick)*2-1))
      .addScaledVector(binormal,fade*(hash(id+k*113,tick+176)*2-1));
    const energy=.79+.35*hash(id+k*91,tick+64);
    segment(previous,point,r*energy,g*energy,blue*energy,width);
    previous=point;
  }
}

const titanPose0=titanPose(0);
const arcLinks=rockClusters.map((members,i)=>{
  const candidates=[];
  members.forEach((a,ai)=>members.forEach((b,bi)=>{
    if(ai>=bi)return;
    candidates.push({a,b,d:a.rest.distanceTo(b.rest)});
  }));
  candidates.sort((a,b)=>a.d-b.d);
  const chosen=[], covered=new Set();
  for(const c of candidates) {
    if(covered.has(c.a.id)&&covered.has(c.b.id))continue;
    chosen.push(c);
    covered.add(c.a.id); covered.add(c.b.id);
    if(chosen.length===5)break;
  }
  const parent=parents[i];
  if(parent>=0){
    let nearest=Infinity,pair;
    for(const a of members)for(const b of rockClusters[parent]){
      const d=floatingRock(a,0,titanPose0).distanceToSquared(floatingRock(b,0,titanPose0));
      if(d<nearest){nearest=d;pair={a,b};}
    }
    chosen.unshift(pair);
  }
  return [...chosen,...candidates.filter(c=>!chosen.includes(c)).slice(0,4)];
});

function electricLink(a,b,tick,i,power,residual=false){
  const d=a.p.distanceTo(b.p);
  if(d>.01 && d<(residual?9:11)){
    const amount=(.59+.47*hash(i,tick))*power;
    const endpoint=a.p.clone().lerp(b.p,Math.min(.44,Math.max(.07,a.scale.length()*.37/d)));
    const end=b.p.clone().lerp(a.p,Math.min(.44,Math.max(.07,b.scale.length()*.37/d)));
    const jitter=lerp(.32,1.06,clamp(d/7))*(.53+hash(i+9,tick)*.82);
    bolt(endpoint,end,d>4?7:5,jitter,i,tick,.30*amount,1.51*amount,3.52*amount,
      (1.18+.68*hash(i+23,tick))*Math.sqrt(power));
  }
}

function buildLightning(t,mt){
  const tick=Math.floor(t*20);
  for(let i=0;i<arcLinks.length;i++){
    const amount=boneCharge(t,i);
    const count=amount===0?0:amount<.5?3:amount>1?7:5;
    for(let j=0;j<Math.min(count,arcLinks[i].length);j++){
      const {a,b}=arcLinks[i][j];
      if(boneCharge(t,b.bone)>0) electricLink(a,b,tick,331*i+j,amount);
    }
  }
  if(t>32.25&&t<37.55){
    for(let i=0;i<11;i++){
      const a=rocks[Math.floor(hash(i,102)*rocks.length)];
      if(t<a.drop.rt+a.drop.impact)continue;
      let b, nearest=8.3**2;
      for(const candidate of rocks){
        if(candidate===a||t<candidate.drop.rt+candidate.drop.impact)continue;
        const d=a.p.distanceToSquared(candidate.p);
        if(d>.42&&d<nearest){nearest=d;b=candidate;}
      }
      const faint=(1-ease(t,33.2,37.55))*(.4+.36*hash(i,tick));
      if(b && hash(i,tick>>1)>.32) electricLink(a,b,tick,2500+i,faint,true);
    }
  }
  for(let i=0;i<skyStrikes.length;i++){
    const {time,point}=skyStrikes[i], age=t-time;
    if(age<0||age>=.25)continue;
    const upper=point.clone().add(V(-10+i*11,108+i*13,-13+i*5));
    const a=point.clone().lerp(upper,.39).add(V(3.4,0,-3.1));
    const b=point.clone().lerp(upper,.72).add(V(-6.8,-1.0,7.1));
    const strength=(.54+.46*hash(tick,712+i))*(1-ease(age,.14,.25));
    const tone=[2.2*strength,4.7*strength,8.7*strength];
    bolt(point,a,15,2.4,801+i*291,tick,...tone,3.6);
    bolt(a,b,15,3.1,803+i*291,tick,...tone,3.5);
    bolt(b,upper,19,4.4,840+i*291,tick,...tone,3.2);
    for(let j=0;j<6;j++){
      const base=(j<3?a:b).clone().add(V(noise(j,34)*4,noise(j,54)*10,noise(j,15)*4));
      const fork=base.clone().add(V(noise(j+i*9,212)*24,lerp(13,34,hash(j,270)),noise(j+i*9,211)*28));
      bolt(base,fork,12,2.95,i*331+j*1018,tick,.84*strength,1.91*strength,4.3*strength,1.45);
    }
  }
  for(let i=0;i<ropeSpecs.length;i++){
    const r=ropeSpecs[i], age=mt-r.fire;
    if(age<0||mt>=r.end)continue;
    readCache(ropeCaches[i],mt,ROPE_COUNT,ropeSamples);
    for(let j=1;j<ROPE_COUNT;j++){
      const glow=.73+.24*Math.sin(j*.43-mt*17);
      segment(ropeSamples[j-1],ropeSamples[j],2.83*glow,1.47*glow,.53*glow,1.77);
    }
    const tip=ropeSamples[ROPE_COUNT-1], at=mt-r.attach;
    if(at<.20)bolt(tip,tip.clone().add(V(.34,.30,.09)),4,.18,275+i,tick,2.9,1.51,.42,1.9);
  }
}

  const side=current.clone().cross(UP).normalize();
  const axis=current.clone().multiplyScalar(.46).addScaledVector(side,i%2?.81:-.81).add(V(0,.28,0)).normalize();
  const particles=Array.from({length:96},()=>{
    const n=V(strikeRand()-.5,strikeRand()-.37,strikeRand()-.5);
    return { p:point.clone().addScaledVector(n,.87), v:axis.clone().addScaledVector(n,1.32)
      .multiplyScalar(lerp(3,22,strikeRand()**.55)), life:lerp(.22,.77,strikeRand()), key:strikeRand() };
  });
  return { ...s, point, particles };
});
const gleamTexture = (() => {
  const size=64, pixels=new Uint8Array(size*size*4);
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const r=Math.hypot((x+.5-size/2)/(size/2),(y+.5-size/2)/(size/2));
    const a=(1-smooth(phase(r,.06,1)))*Math.exp(-r*r*4.9);
    const i=(y*size+x)*4;
    pixels.set([255,255,255,Math.round(a*255)],i);
  }
  const tex=new THREE.DataTexture(pixels,size,size);
  tex.needsUpdate=true;
  tex.magFilter=tex.minFilter=THREE.LinearFilter;
  return tex;
})();
const flashSprite=new THREE.Sprite(new THREE.SpriteMaterial({

function buildCombat(t,mt, h){
  flashSprite.visible=false;
  for(const s of combatParticles){
    const age=t-s.time;
    if(age<0||age>.77)continue;
    for(const p of s.particles){
      if(age>=p.life)continue;
      const f=(1-age/p.life)**.63;
      const a=p.p.clone().addScaledVector(p.v,age).add(V(0,-8.8*age*age,0));
      if(a.y<groundY(a.x,a.z))continue;
      const tail=Math.max(0,age-lerp(.025,.067,p.key));
      const b=p.p.clone().addScaledVector(p.v,tail).add(V(0,-8.8*tail*tail,0));
      const k=p.key>.21;
      segment(a,b,k?4.8*f:1.6*f,k?2.79*f:3.35*f,k?.91*f:4.7*f,lerp(.88,2.11,p.key));
    }
    if(age<.22){

      if(indicated.z>1)v.multiplyScalar(-1);
      if(v.lengthSq()<1)v.set(1,0);
      v.normalize();
      const d=Math.min((W*.5-22)/(Math.abs(v.x)||1e-4),
        (v.y<0?H*.5-115:H*.5-25)/(Math.abs(v.y)||1e-4));
      const p=v.clone().multiplyScalar(d), a=v.clone().multiplyScalar(8), n=new THREE.Vector2(-v.y,v.x).multiplyScalar(5.8);
      hudTri(p.clone().add(a).toArray(),p.clone().sub(a).add(n).toArray(),p.clone().sub(a).sub(n).toArray(),[1,.68,.38,.89]);
    }
  }
  for(const s of strikes){
    const age=t-s.time;
    if(age<0||age>=.9)continue;
    const p=screenProject(coreAt(pose,s.core));
    if(p.z>1||p.z< -1||Math.abs(p.x)>W*.5-36||p.y< -H*.5+96)continue;
    drawDigits(s.damage,p.x,clamp(p.y+60*age/.9,H*-.5+92,H*.5-68),s.time===29.5?1.22:1,
      (1-age/.9)**.7,s.time===29.5);
  }
  hudGeo.attributes.position.needsUpdate=hudGeo.attributes.tone.needsUpdate=true;
  glyphGeo.attributes.position.needsUpdate=glyphGeo.attributes.uv.needsUpdate=glyphGeo.attributes.tone.needsUpdate=true;
  hudGeo.setDrawRange(0,hudCount);
  glyphGeo.setDrawRange(0,digitCount);
}

function makeSound(){
  const Constructor=window.AudioContext||window.webkitAudioContext;
  if(!Constructor)return { state(){}, frame(){}, forward(){} };
  let ctx;
  try {ctx=new Constructor();} catch(error) {return {state(){},frame(){},forward(){}};}
  const unlock=()=>{
    if(ctx.state!=='running')ctx.resume().catch(()=>{});
  };
  unlock();
  function gesture(){
    unlock();
    window.removeEventListener('pointerdown',gesture);
    window.removeEventListener('keydown',gesture);
  }
  window.addEventListener('pointerdown',gesture,{passive:true});
  window.addEventListener('keydown',gesture);
  const master=ctx.createGain(), compressor=ctx.createDynamicsCompressor();
  master.gain.value=0;
  compressor.threshold.value=-18;compressor.knee.value=18;compressor.ratio.value=6;
  compressor.attack.value=.003;compressor.release.value=.24;
  master.connect(compressor).connect(ctx.destination);
  const storm=ctx.createGain();
  storm.connect(master);
  const noiseGenerator=seeded(4242), noiseBuffer=ctx.createBuffer(1,Math.floor(ctx.sampleRate*3.1),ctx.sampleRate);
  const samples=noiseBuffer.getChannelData(0);
  for(let i=0;i<samples.length;i++)samples[i]=noiseGenerator()*2-1;

  function location(node,p){
    if(node.positionX){
      node.positionX.value=p.x;node.positionY.value=p.y;node.positionZ.value=p.z;
    }else if(node.setPosition)node.setPosition(p.x,p.y,p.z);
  }
  function panner(p,reference=12,falloff=.83){
    const node=ctx.createPanner();
    node.panningModel='equalpower';node.distanceModel='inverse';
    node.maxDistance=500;node.refDistance=reference;node.rolloffFactor=falloff;
    location(node,p);
    node.connect(master);
    return node;
  }
  const titanAudio=panner(V(16,25,0),18),hunterAudio=panner(V(-40,1,10),7);
  function bus({kind='noise',shape='sine',freq=95,filter='lowpass',q=.68,at=master}={}){
    const node=kind==='noise'?ctx.createBufferSource():ctx.createOscillator();
    if(kind==='noise'){node.buffer=noiseBuffer;node.loop=true;}
    else {node.frequency.value=freq;node.type=shape;}
    const tone=ctx.createBiquadFilter(),volume=ctx.createGain();
    tone.type=filter;tone.frequency.value=freq;tone.Q.value=q;volume.gain.value=0;
    node.connect(tone).connect(volume).connect(at);
    node.start();
    return { node,tone,volume };
  }
  const wind=bus({filter:'bandpass',freq:380,q:.40,at:storm});
  const rainBed=bus({filter:'highpass',freq:4250,q:.45,at:storm});
  const grind=bus({filter:'lowpass',freq:130,at:titanAudio});
  const grindTone=bus({kind:'osc',shape:'triangle',freq:34,at:titanAudio});
  const crackle=bus({filter:'bandpass',freq:1360,q:.82,at:titanAudio});
  const current=bus({kind:'osc',shape:'sawtooth',filter:'lowpass',freq:54,at:titanAudio});
  const reel=bus({kind:'osc',shape:'triangle',filter:'lowpass',freq:340,at:hunterAudio});
  const whoosh=bus({filter:'bandpass',freq:550,at:hunterAudio});
  const runningSounds=new Set();
  let playing=false;
  const aim=V(), orientationUp=V();
  const ramp=(p,value,now,decay=.022)=>{
    p.cancelScheduledValues(now);
    p.setTargetAtTime(value,now,decay);
  };
  function state(next){
    if(next===playing)return;
    playing=next;
    const now=ctx.currentTime;
    ramp(master.gain,playing?.81:0,now,.009);
    if(!playing){
      for(const voice of runningSounds){
        for(const source of voice.sources){
          try{source.stop(now+.035);}catch(error){}
        }
      }
    }
  }
  function frame(t,mt,pose,hunter,speed){
    if(!playing||ctx.state!=='running')return;
    const now=ctx.currentTime, wet=clamp(t/30);
    const listener=ctx.listener;
    location(listener,camera.position);
    camera.getWorldDirection(aim);
    orientationUp.copy(UP).applyQuaternion(camera.quaternion);
    if(listener.forwardX){
      listener.forwardX.value=aim.x;listener.forwardY.value=aim.y;listener.forwardZ.value=aim.z;
      listener.upX.value=orientationUp.x;listener.upY.value=orientationUp.y;listener.upZ.value=orientationUp.z;
    }else if(listener.setOrientation)listener.setOrientation(aim.x,aim.y,aim.z,orientationUp.x,orientationUp.y,orientationUp.z);
    location(titanAudio,pose.p[CHEST]);
    location(hunterAudio,hunter.parts[BODY]);
    const old=titanPose(Math.max(0,mt-.03)), next=titanPose(mt+.03);
    let fastest=0,charge=0;
    for(let i=0;i<parents.length;i++){
      const c=boneCharge(t,i);
      if(c>0)fastest=Math.max(fastest,old.q[i].angleTo(next.q[i])/.06);
      charge+=c/parents.length;
    }
    const gust=.49+.30*Math.sin(.84*t)+.21*Math.sin(2.13*t+.7);
    const hit=strikes.find(s=>t>=s.time&&t<s.time+s.stop+.16);
    const duck=hit?lerp(.251,1,ease(t,hit.time+hit.stop,hit.time+hit.stop+.16)):1;
    ramp(storm.gain,duck,now,.007);
    ramp(wind.volume.gain,.083+.058*gust,now);ramp(wind.tone.frequency,255+234*gust,now);
    ramp(rainBed.volume.gain,.055+.027*wet,now);ramp(rainBed.tone.frequency,4350-1100*wet,now);
    ramp(grind.volume.gain,clamp(fastest/6)*.49*clamp(charge),now);
    ramp(grind.tone.frequency,62+clamp(fastest/5)*290,now);
    ramp(grindTone.volume.gain,clamp(fastest/6)*.065*clamp(charge),now);
    ramp(grindTone.node.frequency,29+clamp(fastest/5)*22,now);
    ramp(crackle.volume.gain,charge*(.037+.021*hash(Math.floor(t*29),31)),now);
    ramp(crackle.tone.frequency,560+charge*1080,now);
    ramp(current.volume.gain,.010*charge,now);
    ramp(current.node.frequency,42+29*charge+3*Math.sin(t*7),now);
    ramp(current.tone.frequency,135+charge*219,now);
    const attached=ropeSpecs.some(r=>t>=r.attach&&t<r.end);
    ramp(reel.volume.gain,attached?.037+.003*clamp(speed,0,18):0,now);
    ramp(reel.node.frequency,178+speed*19,now);ramp(reel.tone.frequency,890+speed*12,now);
    const h=hunter.parts[BODY];
    const air=clamp((h.y-groundY(h.x,h.z)-1.55)*.92);
    ramp(whoosh.volume.gain,air*clamp(speed/18)*.16,now);
    ramp(whoosh.tone.frequency,420+speed*34,now);
  }

  function shot(point,when,reference, layers){
    if(!playing||ctx.state!=='running')return;
    const pan=panner(point,reference,.75), sources=[];
    const record={sources};runningSounds.add(record);
    for(const layer of layers){
      const {type='noise',f=300,to=f,length=.24,volume=.1,filter='lowpass',q=.7,delay=0}=layer;
      const time=when+delay;
      const gain=ctx.createGain(), tone=ctx.createBiquadFilter();
      gain.gain.value=0;
      gain.gain.setValueAtTime(.0001,time);
      gain.gain.exponentialRampToValueAtTime(Math.max(.00011,volume),time+.007);
      gain.gain.exponentialRampToValueAtTime(.0001,time+length);
      tone.type=filter;tone.Q.value=q;
      tone.frequency.setValueAtTime(f,time);tone.frequency.exponentialRampToValueAtTime(Math.max(14,to),time+length);
      const node=type==='noise'?ctx.createBufferSource():ctx.createOscillator();
      if(type==='noise'){node.buffer=noiseBuffer;node.loop=true;}
      else{
        node.type=type;
        node.frequency.setValueAtTime(f,time);
        node.frequency.exponentialRampToValueAtTime(Math.max(14,to),time+length);
        tone.frequency.setValueAtTime(Math.min(13600,Math.max(f*3,96)),time);
      }
      node.connect(tone).connect(gain).connect(pan);
      node.onended=()=>{
        node.disconnect();tone.disconnect();gain.disconnect();
        const i=sources.indexOf(node);
        if(i>=0)sources.splice(i,1);
        if(!sources.length){pan.disconnect();runningSounds.delete(record);}
      };
      sources.push(node);
      if(type==='noise')node.start(time,noiseGenerator()*2);
      else node.start(time);
      node.stop(time+length+.009);
    }
  }
  const events=[];
  for(const e of mainWaves)events.push({ kind:'impact',...e });
  for(const e of ragSounds)events.push({kind:'impact',...e});
  events.push({kind:'impact',time:19,point:sweepCenter,power:.74});
  events.push({kind:'impact',time:31.5,point:landingThree,power:.30});
  for(let i=0;i<rockImpacts.length;i++){
    const e=rockImpacts[i], prev=rockImpacts[i-1];
    if(!prev||i%3===0||e.time-prev.time>.062)events.push({kind:'impact',...e,power:e.power*.69});
  }
  for(let i=0;i<ropeSpecs.length;i++){
    const r=ropeSpecs[i], p=titanPose(r.attach);
    events.push({kind:'launch',time:r.fire,point:launcher(animatedHunter(r.fire,titanPose(r.fire)))});
    events.push({kind:'attach',time:r.attach,point:ropeAnchor(r,r.attach,p)});
  }
  for(let i=0;i<combatParticles.length;i++)events.push({kind:'strike',...combatParticles[i],i});
  for(const e of skyStrikes)events.push({kind:'thunder',...e});
  for(let i=0;i<releaseTimes.length;i++){
    const time=releaseTimes[i], point=titanPose(motionTime(time)).p[i];
    const voices=releaseTimes.filter(value=>value===time).length;
    events.push({kind:'drop',time,point,pitch:459+i*19,level:1/Math.sqrt(voices)});
  }
  events.sort((a,b)=>a.time-b.time);

  function forward(before,after,playbackSpeed){
    if(!playing||ctx.state!=='running')return;
    const now=ctx.currentTime;
    for(const e of events){
      if(e.time<=before)continue;
      if(e.time>after)break;
      const when=now+Math.max(0,(e.time-before)/playbackSpeed-(after-before)/playbackSpeed);
      const {point}=e;
      if(e.kind==='impact'){
        shot(point,when,18,[
          {type:'sine',f:61+25*(1-e.power),to:25,length:.29+e.power*.38,volume:e.power*.29},
          {f:1170,to:112,length:.16+e.power*.29,volume:e.power*.38}]);
      }else if(e.kind==='launch'){
        shot(point,when,9,[{f:3700,to:540,length:.095,volume:.49,filter:'bandpass'},
          {type:'triangle',f:780,to:253,length:.16,volume:.13}]);
      }else if(e.kind==='attach'){
        shot(point,when,10,[{type:'triangle',f:1110,to:880,length:.21,volume:.19},
          {type:'sine',f:1606,to:1588,length:.25,volume:.074}]);
      }else if(e.kind==='strike'){
        const pitch=681+e.i*207;
        shot(point,when,23,[{f:4920,to:2050,length:.19,volume:.34,filter:'bandpass'},
          {type:'triangle',f:pitch,to:pitch*.95,length:.51,volume:.17},
          {type:'sine',f:pitch*2.39,to:pitch*2.30,length:.45,volume:.088},
          {type:'sine',f:101,to:41,length:.25,volume:.12}]);
      }else if(e.kind==='thunder'){
        const lag=point.distanceTo(camera.position)/340;
        shot(point,now,63,[{delay:lag,f:1870,to:173,length:.53,volume:.51},
          {delay:lag+.054,f:357,to:57,length:2.64,volume:.65},
          {delay:lag+.11,type:'triangle',f:57,to:25,length:2.63,volume:.24}]);
      }else{
        shot(point,when,24,[{type:'sawtooth',f:e.pitch,to:53,length:.86,volume:.084*e.level},
          {f:3030,to:118,length:.56,volume:.23*e.level,filter:'bandpass'}]);
      }
    }
  }
  return {state,frame,forward};
}

function resize() {
  cssSize.set(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  camera.aspect=cssSize.x/cssSize.y;
  camera.updateProjectionMatrix();
  Object.assign(hudCamera,{left:-cssSize.x*.5,right:cssSize.x*.5,top:cssSize.y*.5,bottom:-cssSize.y*.5});
  hudCamera.updateProjectionMatrix();
  const size=renderer.getDrawingBufferSize(new THREE.Vector2());
  const gw=Math.max(1,Math.round(size.x/5)), gh=Math.max(1,Math.round(size.y/5));
  mainTarget.setSize(size.x,size.y);
  glowTarget.setSize(gw,gh);
  invDraw.set(1/size.x,1/size.y);
  invGlow.set(1/gw,1/gh);
}

const sound=makeSound();
function renderAt(time) {
  const t=clamp(time,0,DURATION), mt=motionTime(t);
  const trauma=traumaAt(t), energy=trauma*trauma;
  const pose=titanPose(mt), hunter=hunterPose(mt,pose);
  const speed=frameCamera(t,mt,pose,hunter,energy);
  const wet=clamp(t/30);
  const strike=skyStrikes.find(e=>t>=e.time&&t<e.time+.4);
  const flash=strike?Math.pow(1-(t-strike.time)/.4,1.65)*(.84+.16*hash(Math.floor(t*37),947)):0;
  shared.time.value=t;
  shared.motion.value=mt;
  shared.wet.value=wet;
  shared.flash.value=flash;
  shared.titan.value.copy(pose.p[PELVIS]);
  shared.aura.value=parents.reduce((a,_,i)=>a+boneCharge(t,i),0)/parents.length;
  aberration.value=energy;
  for(const {material,dry,reflectance} of wetMaterials) {
    material.roughness=lerp(.9,.35,wet);
    material.envMapIntensity=reflectance*(.78+.47*wet);
    material.color.copy(dry).multiplyScalar(1-.22*wet);
  }
  key.intensity=1.69+2.53*flash;
  seamLight.position.copy(pose.p[CHEST]).add(V(-2.3,-2.9,-1.0));
  seamLight.intensity=(1.03+.43*hash(Math.floor(t*20),605))*shared.aura.value;
  if(strike)skyLight.position.copy(strike.point).add(V(-1,5,1));
  skyLight.intensity=flash*32;
  setTitan(pose,t,mt);
  updateCores(pose,t,mt);
  updateHunter(hunter,mt,speed);
  lineCount=0;
  buildLightning(t,mt);
  buildCombat(t,mt,hunter);
  lineGeometry.instanceCount=lineCount;
  lineA.needsUpdate=lineB.needsUpdate=lineColor.needsUpdate=true;
  updateHUD(t,pose);

  renderer.setRenderTarget(fieldTarget);
  renderer.setClearColor(0,0);
  renderer.clear(true,false,false);
  renderer.render(fieldScene,fieldCamera);
  renderer.setRenderTarget(mainTarget);
  renderer.clear(true,true,false);
  renderer.render(scene,camera);
  renderer.setRenderTarget(glowTarget);
  renderer.render(glowPass,passCamera);
  renderer.setRenderTarget(null);
  renderer.render(finalPass,passCamera);
  renderer.clearDepth();
  renderer.render(hud,hudCamera);
  sound.frame(t,mt,pose,hunter,speed);
}

  systems: {

  },

const COUNTDOWN='COUNTDOWN', PLAYING='PLAYING', PAUSED='PAUSED', REFIRE_HOLD='REFIRE_HOLD', ENDED='ENDED';
let state=COUNTDOWN, simTime=0, playbackSpeed=1;
let countdownElapsed=0, holdElapsed=0, lastWall=null;
const countdown=document.getElementById('countdown');
const scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle');
const iconPlay=document.getElementById('icon-play');
const iconPause=document.getElementById('icon-pause');
const pills=[...document.querySelectorAll('.speed-pill')];

function hideCountdown(){
  countdown.style.display='none';
  countdown.textContent='';
}
function enter(next){
  state=next;
  const animating=next===PLAYING||next===COUNTDOWN||next===REFIRE_HOLD;
  iconPause.style.display=animating?'':'none';
  iconPlay.style.display=animating?'none':'';
  toggle.setAttribute('aria-label',animating?'Pause':'Play');
  if(next!==COUNTDOWN)hideCountdown();
  sound.state(next===PLAYING);
}
function showTime(reset=false){
  scrubber.value=reset?'0':simTime.toFixed(3);
  renderAt(simTime);
}
toggle.addEventListener('click',()=>{
  if(state===PLAYING||state===COUNTDOWN||state===REFIRE_HOLD){
    enter(PAUSED);
  }else if(state===ENDED){
    simTime=0;
    enter(PLAYING);
    showTime(true);
  }else enter(PLAYING);
  lastWall=performance.now();
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  simTime=0;
  holdElapsed=0;
  enter(REFIRE_HOLD);
  lastWall=performance.now();
  showTime(true);
});
scrubber.addEventListener('input',()=>{
  simTime=clamp(parseFloat(scrubber.value),0,DURATION);
  enter(PAUSED);
  renderAt(simTime);
});
scrubber.addEventListener('pointerdown',()=>{
  if(state===PLAYING)enter(PAUSED);
});
for(const pill of pills)pill.addEventListener('click',()=>{
  playbackSpeed=Number(pill.dataset.speed);
  for(const p of pills){
    p.classList.toggle('is-active',p===pill);
    p.setAttribute('aria-checked',String(p===pill));
  }
});
window.addEventListener('resize',()=>{
  resize();
  renderAt(simTime);
});

function update(wall){
  const dt=lastWall===null?0:Math.min(.1,Math.max(0,(wall-lastWall)/1000));
  lastWall=wall;
  if(state===COUNTDOWN){
    countdownElapsed+=dt;
    if(countdownElapsed>=3)enter(PLAYING);
    else{
      const digit=String(3-Math.floor(countdownElapsed));
      if(countdown.textContent!==digit)countdown.textContent=digit;
      countdown.style.display='block';
    }
  }else if(state===REFIRE_HOLD){
    holdElapsed+=dt;
    if(holdElapsed>=1)enter(PLAYING);
  }
  if(state===PLAYING&&dt>0){
    const previous=simTime;
    simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
    showTime();
    sound.forward(previous,simTime,playbackSpeed);
    if(simTime>=DURATION)enter(ENDED);
  }
  window.requestAnimationFrame(update);
}
hideCountdown();
resize();
showTime(true);
window.requestAnimationFrame(update);
</script>
