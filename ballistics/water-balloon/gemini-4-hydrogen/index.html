<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ballistics Water Balloon Slow-Motion Simulation</title>
  <style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
  </style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  const DURATION = 8.000;
  const SEED = 42;
  const IMPACT_Y = -0.10;
  const R_IMPACT = 1.308;
  const T_IMPACT = 1.000;
  const T_PUNCTURE = 1.180;
  const T_TEAR_END = 1.580;
  const T_EXIT = 3.800;

  // ---------------------------------------------------------------------------
  // Deterministic Seeded PRNG (Mulberry32, Seed 42)
  // ---------------------------------------------------------------------------
  function createRNG(seed) {
    let a = seed >>> 0;
    return function rand() {
      a |= 0;
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = createRNG(SEED);

  function randRange(lo, hi) {
    return lo + (hi - lo) * rng();
  }

  function clamp(x, lo, hi) {
    return x < lo ? lo : (x > hi ? hi : x);
  }

  function smoothstep(edge0, edge1, x) {
    const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
    return t * t * (3 - 2 * t);
  }

  // ---------------------------------------------------------------------------
  // Hydrostatic Teardrop Geometry Profile & Analytical Kinematics
  // ---------------------------------------------------------------------------
  function balloonProfile(theta, closeTop) {
    const s = Math.sin(theta);
    const c = Math.cos(theta);
    const neckLift = c < 0 ? 0.24 * Math.pow(-c, 2.2) : 0.0;
    const sagDrop = c > 0 ? 0.04 * Math.pow(c, 2.0) : 0.0;
    const y = -1.38 * c + neckLift - sagDrop;

    const belly = Math.exp(0.24 * c);
    const taper = c < 0 ? (1.0 - 0.56 * Math.pow(-c, 1.55)) : 1.0;
    let r = 1.29 * s * belly * taper;
    if (!closeTop) {
      const topMix = Math.pow(Math.max(0, -c), 12.0);
      r = r * (1.0 - topMix) + 0.055 * topMix;
    }
    return { r, y };
  }

  // Exact closed-form C1 bullet trajectory matching all physical milestones:
  // t=0.000: xTip = +7.808 (off-screen right even on ultrawide displays)
  // t=1.000: xTip = +1.308 (right latex surface)
  // t=3.800: xTip = -1.308 (left boundary exit puncture)
  // t=3.800..8.000: smooth low-drag supersonic exit across left frame
  const V_BULLET_AIR = 6.50;
  const K_BULLET_WATER = 6.80;
  const DT_TRAVERSE = T_EXIT - T_IMPACT;
  const EXP_TRAVERSE = Math.exp(-K_BULLET_WATER * DT_TRAVERSE);
  const INV_K_TERM = (1.0 - EXP_TRAVERSE) / K_BULLET_WATER;
  const V_WATER_FLOOR = (2.0 * R_IMPACT - V_BULLET_AIR * INV_K_TERM) / (DT_TRAVERSE - INV_K_TERM);

  function evalBullet(t) {
    const vAir = V_BULLET_AIR;
    const kWater = K_BULLET_WATER;
    const vFloor = V_WATER_FLOOR;
    let xTip, vx, yTip = IMPACT_Y, vy = 0;

    if (t <= T_IMPACT) {
      xTip = R_IMPACT + vAir * (T_IMPACT - t);
      vx = -vAir;
    } else if (t <= T_EXIT) {
      const u = t - T_IMPACT;
      const expTerm = Math.exp(-kWater * u);
      const dist = vFloor * u + ((vAir - vFloor) / kWater) * (1.0 - expTerm);
      xTip = R_IMPACT - dist;
      vx = -(vFloor + (vAir - vFloor) * expTerm);
    } else {
      const u = t - T_EXIT;
      const vExit = vFloor + (vAir - vFloor) * Math.exp(-kWater * (T_EXIT - T_IMPACT));
      const kAir = 0.032;
      const expA = Math.exp(-kAir * u);
      const distExit = (vExit / kAir) * (1.0 - expA);
      xTip = -R_IMPACT - distExit;
      vx = -vExit * expA;
      yTip = IMPACT_Y - 0.0045 * u * u;
      vy = -0.009 * u;
    }

    const roll = t * 44.0;
    const nutation = t > T_IMPACT ? smoothstep(T_IMPACT, T_EXIT, t) * 0.034 * Math.sin((t - T_IMPACT) * 4.2) : 0.0;
    return { xTip, yTip, vx, vy, roll, nutation };
  }

  // Exact closed-form trajectory with linear air drag k and gravity g
  function integrateBallistic(p0, v0, age, drag, grav) {
    if (age <= 0) return { x: p0.x, y: p0.y, z: p0.z, vx: v0.x, vy: v0.y, vz: v0.z };
    const u = drag * age;
    let e1, e2;
    if (u < 1e-4) {
      e1 = 1.0 - 0.5 * u + (u * u) / 6.0;
      e2 = 1.0 - u / 3.0 + (u * u) / 12.0;
    } else {
      const expU = Math.exp(-u);
      e1 = (1.0 - expU) / u;
      e2 = 2.0 * (1.0 - e1) / u;
    }
    const damp = Math.exp(-u);
    const x = p0.x + v0.x * age * e1;
    const z = p0.z + v0.z * age * e1;
    const y = p0.y + v0.y * age * e1 - 0.5 * grav * age * age * e2;
    const vx = v0.x * damp;
    const vz = v0.z * damp;
    const vy = v0.y * damp - grav * age * e1;
    return { x, y, z, vx, vy, vz };
  }

  // Exact knot & tether vertical recoil after rubber snaps
  function evalKnotPose(t) {
    if (t <= T_PUNCTURE) {
      const pull = t > T_IMPACT ? smoothstep(T_IMPACT, T_PUNCTURE, t) * -0.025 : 0.0;
      return { x: 0, y: 1.62 + pull, scale: 1.0 };
    }
    const u = t - T_PUNCTURE;
    const snap = smoothstep(0.0, 0.36, u);
    const osc = Math.exp(-1.25 * u) * Math.cos(8.5 * u);
    const y = 1.62 + 0.28 * snap - 0.22 * osc * snap;
    const x = -0.11 * Math.exp(-0.45 * u) * Math.sin(3.8 * u) * smoothstep(0.0, 0.25, u);
    const scale = 1.0 - 0.22 * smoothstep(0.0, 0.45, u);
    return { x, y, scale };
  }

  // Surface tear coordinate matched cleanly between GLSL and JS particle emitters
  function evalTearCoord(px, py, pz) {
    const dx = px;
    const dy = py - IMPACT_Y;
    const dz = pz;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1.0;
    const dirX = dx / len;
    const dirY = dy / len;
    const dirZ = dz / len;
    const ang = Math.acos(clamp(dirX, -1.0, 1.0)) / Math.PI;
    const jagged =
      0.036 * Math.sin(dirY * 17.0 + dirZ * 11.0 + 0.7) +
      0.022 * Math.cos(dirZ * 29.0 - dirY * 23.0 + 1.4) +
      0.012 * Math.sin(dirX * 15.0 + dirY * 19.0 - dirZ * 13.0);
    return ang + jagged;
  }

  function tearFrontAt(t) {
    if (t <= T_PUNCTURE) return -0.15;
    const p = clamp((t - T_PUNCTURE) / (T_TEAR_END - T_PUNCTURE), 0.0, 1.25);
    return -0.07 + 1.19 * Math.pow(p, 0.86);
  }

  // ---------------------------------------------------------------------------
  // Renderer, Scene & Three-Point Studio Camera
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  const scene = new THREE.Scene();

  const CAMERA_Z = 10.2;
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, CAMERA_Z);
  camera.lookAt(0, 0, 0);

  // Detached procedural studio environment cubemap (never appended to DOM)
  function createStudioEnvMap() {
    const faces = [];
    for (let f = 0; f < 6; f++) {
      const c = document.createElement("canvas");
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext("2d");
      ctx.fillStyle = "#080b12";
      ctx.fillRect(0, 0, 256, 256);

      const bg = ctx.createLinearGradient(0, 0, 0, 256);
      bg.addColorStop(0, "#192234");
      bg.addColorStop(0.5, "#0b0f18");
      bg.addColorStop(1, "#05070c");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, 256, 256);

      if (f === 2) {
        const g = ctx.createRadialGradient(128, 128, 8, 128, 128, 118);
        g.addColorStop(0, "rgba(245, 250, 255, 0.98)");
        g.addColorStop(0.38, "rgba(215, 232, 255, 0.65)");
        g.addColorStop(1, "rgba(20, 30, 48, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
      } else if (f === 0 || f === 5) {
        const g = ctx.createLinearGradient(40, 0, 216, 0);
        g.addColorStop(0, "rgba(40, 225, 255, 0)");
        g.addColorStop(0.5, f === 0 ? "rgba(70, 240, 255, 0.90)" : "rgba(180, 235, 255, 0.55)");
        g.addColorStop(1, "rgba(40, 225, 255, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 24, 256, 208);
      } else if (f === 1) {
        const g = ctx.createLinearGradient(40, 0, 216, 0);
        g.addColorStop(0, "rgba(255, 64, 196, 0)");
        g.addColorStop(0.5, "rgba(255, 72, 198, 0.85)");
        g.addColorStop(1, "rgba(255, 64, 196, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 24, 256, 208);
      } else if (f === 4) {
        const g = ctx.createRadialGradient(175, 85, 6, 175, 85, 92);
        g.addColorStop(0, "rgba(255, 252, 248, 0.65)");
        g.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
      }
      faces.push(c);
    }
    const cube = new THREE.CubeTexture(faces);
    cube.encoding = THREE.sRGBEncoding;
    cube.needsUpdate = true;
    return cube;
  }
  const studioEnvMap = createStudioEnvMap();

  // Detached 2D water droplet sprite texture (kept in memory)
  function createDropletSpriteTexture() {
    const c = document.createElement("canvas");
    c.width = 128;
    c.height = 128;
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, 128, 128);

    const body = ctx.createRadialGradient(64, 64, 6, 64, 64, 58);
    body.addColorStop(0.00, "rgba(205, 232, 255, 0.35)");
    body.addColorStop(0.45, "rgba(170, 215, 255, 0.25)");
    body.addColorStop(0.76, "rgba(215, 242, 255, 0.78)");
    body.addColorStop(0.90, "rgba(255, 255, 255, 0.92)");
    body.addColorStop(1.00, "rgba(255, 255, 255, 0.0)");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(64, 64, 58, 0, Math.PI * 2);
    ctx.fill();

    const hot = ctx.createRadialGradient(84, 42, 1, 84, 42, 18);
    hot.addColorStop(0.0, "rgba(255, 255, 255, 1.0)");
    hot.addColorStop(0.45, "rgba(240, 250, 255, 0.85)");
    hot.addColorStop(1.0, "rgba(255, 255, 255, 0.0)");
    ctx.fillStyle = hot;
    ctx.beginPath();
    ctx.arc(84, 42, 18, 0, Math.PI * 2);
    ctx.fill();

    const bounce = ctx.createRadialGradient(44, 84, 1, 44, 84, 20);
    bounce.addColorStop(0.0, "rgba(220, 248, 255, 0.65)");
    bounce.addColorStop(1.0, "rgba(220, 248, 255, 0.0)");
    ctx.fillStyle = bounce;
    ctx.beginPath();
    ctx.arc(44, 84, 20, 0, Math.PI * 2);
    ctx.fill();

    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }
  const dropletSpriteTex = createDropletSpriteTexture();

  // Studio Three-Point + Dual Cool-White & Cyan/Magenta Rim Lights
  const hemiLight = new THREE.HemisphereLight(0x465878, 0x0c1018, 0.55);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xf6f9ff, 2.3);
  keyLight.position.set(4.5, 6.2, 5.2);
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x88a8dc, 0.70);
  fillLight.position.set(-5.0, -2.5, 4.5);
  scene.add(fillLight);

  const topRimLight = new THREE.DirectionalLight(0xeef8ff, 2.7);
  topRimLight.position.set(-1.5, 6.0, -5.2);
  scene.add(topRimLight);

  const cyanRimLight = new THREE.DirectionalLight(0x36e6ff, 2.4);
  cyanRimLight.position.set(6.0, 1.8, -4.5);
  scene.add(cyanRimLight);

  const magentaRimLight = new THREE.DirectionalLight(0xff38b8, 2.1);
  magentaRimLight.position.set(-6.0, -1.6, -4.5);
  scene.add(magentaRimLight);

  // ---------------------------------------------------------------------------
  // Common GLSL Studio Lighting Snippet
  // ---------------------------------------------------------------------------
  const GLSL_STUDIO_COMMON = `
    vec3 toSRGB(vec3 c) {
      return pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
    }

    vec3 evalStudioRims(vec3 N, vec3 V, float specPower, float fresnelPow) {
      float ndv = clamp(dot(N, V), 0.0, 1.0);
      float fres = pow(max(1.0 - ndv, 0.0001), fresnelPow);

      vec3 lKey = normalize(vec3(0.50, 0.69, 0.58));
      vec3 lTopRim = normalize(vec3(-0.18, 0.74, -0.64));
      vec3 lCyan = normalize(vec3(0.77, 0.23, -0.58));
      vec3 lMag = normalize(vec3(-0.79, -0.21, -0.58));

      vec3 hKey = normalize(lKey + V);
      vec3 hTop = normalize(lTopRim + V);
      vec3 hCyan = normalize(lCyan + V);
      vec3 hMag = normalize(lMag + V);

      float sKey = pow(max(dot(N, hKey), 0.0001), specPower);
      float sTop = pow(max(dot(N, hTop), 0.0001), specPower * 0.75);
      float sCyan = pow(max(dot(N, hCyan), 0.0001), specPower * 0.55);
      float sMag = pow(max(dot(N, hMag), 0.0001), specPower * 0.55);

      float rimCyan = fres * smoothstep(-0.25, 0.85, N.x * 0.85 + N.y * 0.25);
      float rimMag  = fres * smoothstep(-0.25, 0.85, -N.x * 0.85 - N.y * 0.20);
      float rimTop  = fres * smoothstep(-0.10, 0.90, N.y);

      vec3 col = vec3(0.0);
      col += vec3(0.98, 0.99, 1.00) * (sKey * 1.45 + sTop * 0.85 + rimTop * 0.75);
      col += vec3(0.20, 0.90, 1.00) * (sCyan * 0.65 + rimCyan * 0.95);
      col += vec3(1.00, 0.24, 0.74) * (sMag * 0.60 + rimMag * 0.85);
      return col;
    }
  `;

  // ---------------------------------------------------------------------------
  // Parametric Teardrop Grid Builder
  // ---------------------------------------------------------------------------
  function buildTeardropGeometry(segsTheta, segsPhi, scale, closeTop) {
    const geom = new THREE.BufferGeometry();
    const cols = segsPhi + 1;
    const rows = segsTheta + 1;
    const vertCount = rows * cols;
    const positions = new Float32Array(vertCount * 3);
    const normals = new Float32Array(vertCount * 3);
    const params = new Float32Array(vertCount * 2);
    const indices = [];

    const eps = 1e-3;
    for (let i = 0; i <= segsTheta; i++) {
      const theta = (i / segsTheta) * Math.PI;
      const p0 = balloonProfile(theta, closeTop);
      const pM = balloonProfile(Math.max(0.0, theta - eps), closeTop);
      const pP = balloonProfile(Math.min(Math.PI, theta + eps), closeTop);
      const dr = (pP.r - pM.r) / (2 * eps);
      const dy = (pP.y - pM.y) / (2 * eps);
      const nLen = Math.hypot(dy, dr) || 1.0;
      const nr = dy / nLen;
      const ny = -dr / nLen;

      for (let j = 0; j <= segsPhi; j++) {
        const phi = (j / segsPhi) * Math.PI * 2.0;
        const cp = Math.cos(phi);
        const sp = Math.sin(phi);
        const idx = i * cols + j;

        positions[idx * 3] = p0.r * scale * cp;
        positions[idx * 3 + 1] = p0.y * scale;
        positions[idx * 3 + 2] = p0.r * scale * sp;

        normals[idx * 3] = nr * cp;
        normals[idx * 3 + 1] = ny;
        normals[idx * 3 + 2] = nr * sp;

        params[idx * 2] = theta;
        params[idx * 2 + 1] = phi;
      }
    }

    for (let i = 0; i < segsTheta; i++) {
      for (let j = 0; j < segsPhi; j++) {
        const a = i * cols + j;
        const b = (i + 1) * cols + j;
        const c = (i + 1) * cols + (j + 1);
        const d = i * cols + (j + 1);
        indices.push(a, b, d);
        indices.push(b, c, d);
      }
    }

    geom.setIndex(indices);
    geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geom.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
    geom.setAttribute("aParam", new THREE.BufferAttribute(params, 2));
    return geom;
  }

  // ---------------------------------------------------------------------------

  // ---------------------------------------------------------------------------

  const bulletGroup = new THREE.Group();

  // ---------------------------------------------------------------------------
  // 3. Internal Cavitation Vapor Tunnel (renderOrder = 1)
  // ---------------------------------------------------------------------------
  const cavSegX = 72;
  const cavSegPhi = 44;
  const cavGeom = new THREE.BufferGeometry();
  {
    const cols = cavSegPhi + 1;
    const rows = cavSegX + 1;
    const pos = new Float32Array(rows * cols * 3);
    const nrm = new Float32Array(rows * cols * 3);
    const prm = new Float32Array(rows * cols * 2);
    const idx = [];
    for (let i = 0; i <= cavSegX; i++) {
      const s = i / cavSegX;
      for (let j = 0; j <= cavSegPhi; j++) {
        const phi = (j / cavSegPhi) * Math.PI * 2.0;
        const k = i * cols + j;
        pos[k * 3] = s;
        pos[k * 3 + 1] = Math.cos(phi);
        pos[k * 3 + 2] = Math.sin(phi);
        nrm[k * 3] = 0;
        nrm[k * 3 + 1] = Math.cos(phi);
        nrm[k * 3 + 2] = Math.sin(phi);
        prm[k * 2] = s;
        prm[k * 2 + 1] = phi;
      }
    }
    for (let i = 0; i < cavSegX; i++) {
      for (let j = 0; j < cavSegPhi; j++) {
        const a = i * cols + j;
        const b = (i + 1) * cols + j;
        const c = (i + 1) * cols + (j + 1);
        const d = i * cols + (j + 1);
        idx.push(a, b, d);
        idx.push(b, c, d);
      }
    }
    cavGeom.setIndex(idx);
    cavGeom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    cavGeom.setAttribute("normal", new THREE.BufferAttribute(nrm, 3));
    cavGeom.setAttribute("aParam", new THREE.BufferAttribute(prm, 2));
  }

  const cavMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0.0 },
      uFrontX: { value: 1.31 },
      uBackX: { value: 1.31 },
      uIntensity: { value: 0.0 },
      uCollapse: { value: 0.0 }
    },
    vertexShader: `
      uniform float uTime;
      uniform float uFrontX;
      uniform float uBackX;
      uniform float uIntensity;
      uniform float uCollapse;
      attribute vec2 aParam;
      varying vec2 vParam;
      varying vec3 vNormalW;
      varying vec3 vPosW;

      float cavRadius(float s, float phi) {
        float spindle = sin(clamp(s, 0.0, 1.0) * 3.14159265);
        float tipR = mix(0.105, 0.24, smoothstep(0.0, 0.14, s));
        float entryR = 0.24 * smoothstep(0.80, 1.0, s);
        float swell = mix(0.18, 0.47, uIntensity) * pow(max(spindle, 0.001), 0.72);
        float pinch = 1.0 - 0.72 * uCollapse * pow(max(spindle, 0.001), 1.4);
        float rib = 0.042 * sin(s * 24.0 - uTime * 11.0 + phi * 2.0)
                  + 0.025 * cos(s * 42.0 + phi * 4.0 - uTime * 16.0);
        return max(0.04, (tipR + entryR + swell) * pinch * (1.0 + rib));
      }

      void main() {
        vParam = aParam;
        float s = aParam.x;
        float phi = aParam.y;
        float x = mix(uFrontX, uBackX, s);
        float r = cavRadius(s, phi);
        float rNext = cavRadius(min(1.0, s + 0.015), phi);
        float drds = (rNext - r) / (0.015 * max(0.05, uBackX - uFrontX));

        vec3 pLocal = vec3(x, ${IMPACT_Y.toFixed(3)} + r * cos(phi), r * sin(phi));
        vec3 nLocal = normalize(vec3(-drds, cos(phi), sin(phi)));

        vec4 wp = modelMatrix * vec4(pLocal, 1.0);
        vPosW = wp.xyz;
        vNormalW = normalize(mat3(modelMatrix) * nLocal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uIntensity;
      uniform float uCollapse;
      varying vec2 vParam;
      varying vec3 vNormalW;
      varying vec3 vPosW;
      ${GLSL_STUDIO_COMMON}

      void main() {
        if (uIntensity <= 0.002) discard;
        vec3 N = normalize(vNormalW);
        if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(cameraPosition - vPosW);
        float ndv = clamp(abs(dot(N, V)), 0.0, 1.0);
        float fres = pow(max(1.0 - ndv, 0.0001), 1.8);

        float froth = 0.5 + 0.5 * sin(vParam.x * 38.0 - uTime * 14.0 + sin(vParam.y * 5.0 + vParam.x * 16.0) * 2.2);
        float fine = 0.5 + 0.5 * cos(vParam.y * 14.0 + vParam.x * 65.0 - uTime * 22.0);
        float bubbleTex = mix(0.55, 1.0, froth * 0.65 + fine * 0.35);

        vec3 vaporCol = mix(vec3(0.45, 0.72, 0.90), vec3(0.90, 0.97, 1.00), bubbleTex);
        vaporCol += evalStudioRims(N, V, 85.0, 2.1) * 0.85;

        float endsFade = smoothstep(0.0, 0.06, vParam.x) * smoothstep(1.0, 0.92, vParam.x);
        float alpha = uIntensity * (1.0 - uCollapse * 0.82) * endsFade * (0.28 + 0.62 * fres + 0.22 * froth);
        gl_FragColor = vec4(toSRGB(vaporCol), clamp(alpha, 0.0, 0.90));
      }
    `
  });
  const cavMesh = new THREE.Mesh(cavGeom, cavMat);
  cavMesh.renderOrder = 1;
  cavMesh.frustumCulled = false;
  scene.add(cavMesh);

  // ---------------------------------------------------------------------------
  // 4. Translucent Free-Standing Water Mass & Perforating Sheet (renderOrder = 2)
  // ---------------------------------------------------------------------------
  const waterGeom = buildTeardropGeometry(112, 84, 0.986, true);
  const waterMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0.0 },
      uSwell: { value: 0.0 },
      uExitBulge: { value: 0.0 },
      uEntryHoleR: { value: 0.0 },
      uExitHoleR: { value: 0.0 },
      uBreakup: { value: 0.0 },
      uPerforate: { value: 0.0 },
      uGlobalAlpha: { value: 1.0 }
    },
    vertexShader: `
      uniform float uTime;
      uniform float uSwell;
      uniform float uExitBulge;
      uniform float uBreakup;
      attribute vec2 aParam;
      varying vec3 vPosW;
      varying vec3 vNormalW;
      varying vec3 vBasePos;

      vec3 deformWater(vec3 p, vec3 n) {
        vec3 outP = p;

        // 1) Acoustic entry shock ripple across water mass after t=1.00
        if (uTime > 1.0) {
          float ut = uTime - 1.0;
          float waveX = 1.31 - 5.0 * ut;
          float band = exp(-pow((p.x - waveX) * 3.8, 2.0)) * exp(-ut * 1.4);
          outP += n * band * 0.072;

          float dEntry = length(p - vec3(1.30, ${IMPACT_Y.toFixed(3)}, 0.0));
          float ring = sin(dEntry * 24.0 - ut * 32.0) * exp(-dEntry * 2.2) * exp(-ut * 0.85);
          outP += n * ring * 0.032;
        }

        // 2) Hydrostatic belly bulge from internal cavitation volume displacement
        float rXZ = length(p.xz);
        float bellyMask = smoothstep(0.05, 1.05, rXZ);
        float midMask = exp(-pow((p.y - ${IMPACT_Y.toFixed(3)}) * 0.95, 2.0));
        outP += vec3(n.x * 0.65, n.y * 1.15, n.z * 1.15) * uSwell * (0.24 * bellyMask + 0.20 * midMask);

        // 3) Left exit dome bulge right before & during puncture
        vec2 dExitVec = p.yz - vec2(${IMPACT_Y.toFixed(3)}, 0.0);
        float dExit = length(dExitVec);
        vec2 dExitDir = dExit > 1e-4 ? (dExitVec / dExit) : vec2(0.0, 1.0);
        float leftSide = smoothstep(-0.35, -1.25, p.x);
        float exitDome = leftSide * exp(-dExit * dExit * 4.5) * uExitBulge;
        outP.x -= exitDome * 0.42;
        outP.yz += dExitDir * exitDome * 0.06;

        // 4) Rayleigh-Taylor breakup billowing & gravity sag (pole-safe spatial waves)
        if (uBreakup > 0.001) {
          float lobes = sin(p.x * 3.6 + 0.5) * cos(p.z * 3.4 - 0.3) * 0.55
                      + sin(p.y * 3.1 + p.x * 2.4 + uTime * 1.1) * 0.45;
          float expand = uBreakup * (0.62 * bellyMask + 0.32 * lobes);
          outP += vec3(n.x * 1.25, n.y * 0.85, n.z * 1.15) * expand;
          outP.y -= 0.40 * uBreakup * uBreakup;
        }
        return outP;
      }

      void main() {
        vBasePos = position;
        vec3 nBase = normalize(normal);
        vec3 pDef = deformWater(position, nBase);

        vec3 upRef = abs(nBase.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 T = normalize(cross(upRef, nBase));
        vec3 B = normalize(cross(nBase, T));
        float e = 0.02;
        vec3 pT = deformWater(position + T * e, nBase);
        vec3 pB = deformWater(position + B * e, nBase);
        vec3 nDef = cross(pT - pDef, pB - pDef);
        float nLen = length(nDef);
        nDef = nLen > 1e-5 ? (nDef / nLen) : nBase;
        if (dot(nDef, nBase) < 0.0) nDef = -nDef;

        vec4 wp = modelMatrix * vec4(pDef, 1.0);
        vPosW = wp.xyz;
        vNormalW = normalize(mat3(modelMatrix) * nDef);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uEntryHoleR;
      uniform float uExitHoleR;
      uniform float uPerforate;
      uniform float uGlobalAlpha;
      varying vec3 vPosW;
      varying vec3 vNormalW;
      varying vec3 vBasePos;
      ${GLSL_STUDIO_COMMON}

      float sheetWebPattern(vec3 p) {
        float f1 = sin(p.x * 7.2 + sin(p.y * 6.5 + 0.4) * 1.3 + p.z * 5.8);
        float f2 = cos(p.y * 8.4 - sin(p.z * 7.7 + 1.1) * 1.2 + p.x * 4.9);
        float f3 = sin((p.x + p.y - p.z) * 9.5 + 2.1);
        float f4 = cos((p.x - p.y + p.z) * 11.8 - 0.8);
        return clamp(0.5 + 0.22 * f1 + 0.18 * f2 + 0.14 * f3 + 0.10 * f4, 0.0, 1.0);
      }

      void main() {
        if (uGlobalAlpha <= 0.002) discard;

        float dEntryYZ = length(vBasePos.yz - vec2(${IMPACT_Y.toFixed(3)}, 0.0));
        if (uEntryHoleR > 0.01 && vBasePos.x > 0.5 && dEntryYZ < uEntryHoleR) discard;
        if (uExitHoleR > 0.01 && vBasePos.x < -0.5 && dEntryYZ < uExitHoleR) discard;

        float meniscusRim = 0.0;
        if (uPerforate > 0.005) {
          float w = sheetWebPattern(vBasePos);
          float thr = uPerforate * 1.04;
          if (w < thr) discard;
          meniscusRim = 1.0 - smoothstep(0.0, 0.085, w - thr);
        }

        vec3 N = normalize(vNormalW);
        if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(cameraPosition - vPosW);
        float ndv = clamp(abs(dot(N, V)), 0.0, 1.0);
        float fres = pow(max(1.0 - ndv, 0.0001), 2.4);

        vec3 coreTint = mix(vec3(0.08, 0.14, 0.24), vec3(0.24, 0.42, 0.62), fres);
        float caustic = pow(max(0.0001, sin(vBasePos.y * 8.0 + vBasePos.x * 5.0 + uTime * 2.2) * 0.5 + 0.5), 3.0);
        coreTint += vec3(0.18, 0.34, 0.48) * caustic * 0.25;

        vec3 rims = evalStudioRims(N, V, 190.0, 2.3);
        vec3 col = coreTint + rims * 1.15 + vec3(0.75, 0.94, 1.0) * meniscusRim * 0.95;

        float entryLip = uEntryHoleR > 0.01 && vBasePos.x > 0.5 ? (1.0 - smoothstep(0.0, 0.09, dEntryYZ - uEntryHoleR)) : 0.0;
        float exitLip  = uExitHoleR  > 0.01 && vBasePos.x < -0.5 ? (1.0 - smoothstep(0.0, 0.09, dEntryYZ - uExitHoleR)) : 0.0;
        col += vec3(0.85, 0.96, 1.0) * (entryLip + exitLip) * 0.65;

        float alpha = (0.20 + 0.66 * fres + 0.28 * meniscusRim + 0.22 * (entryLip + exitLip)) * uGlobalAlpha;
        gl_FragColor = vec4(toSRGB(col), clamp(alpha, 0.0, 0.94));
      }
    `
  });
  const waterMesh = new THREE.Mesh(waterGeom, waterMat);
  waterMesh.renderOrder = 2;
  waterMesh.frustumCulled = false;
  scene.add(waterMesh);

  // ---------------------------------------------------------------------------
  // 5. Semi-Translucent Crimson Latex Skin & Rapid Tear Shader (Back:0, Front:3)
  // ---------------------------------------------------------------------------
  const latexGeom = buildTeardropGeometry(120, 92, 1.0, false);
  const latexUniforms = {
    uTime: { value: 0.0 },
    uIndent: { value: 0.0 },
    uTearFront: { value: -0.20 },
    uKnotY: { value: 1.62 }
  };
  const latexVertShader = `
      uniform float uTime;
      uniform float uIndent;
      uniform float uTearFront;
      uniform float uKnotY;
      attribute vec2 aParam;
      varying vec3 vPosW;
      varying vec3 vNormalW;
      varying float vTearDist;
      varying float vCurl;

      float evalTear(vec3 p) {
        vec3 d = p - vec3(0.0, ${IMPACT_Y.toFixed(3)}, 0.0);
        float len = max(length(d), 1e-4);
        vec3 dir = d / len;
        float ang = acos(clamp(dir.x, -1.0, 1.0)) / 3.14159265;
        float jagged =
          0.036 * sin(dir.y * 17.0 + dir.z * 11.0 + 0.7) +
          0.022 * cos(dir.z * 29.0 - dir.y * 23.0 + 1.4) +
          0.012 * sin(dir.x * 15.0 + dir.y * 19.0 - dir.z * 13.0);
        return ang + jagged;
      }

      vec3 deformLatex(vec3 p, vec3 n, float tearVal, float theta) {
        vec3 outP = p;

        // 1) Elastic indentation & concentric rubber ripples on impact
        vec3 pImp = vec3(${R_IMPACT.toFixed(3)}, ${IMPACT_Y.toFixed(3)}, 0.0);
        float dImp = length(p - pImp);
        if (uIndent > 0.001) {
          float cone = exp(-dImp * dImp * 3.8);
          float ring = exp(-pow((dImp - 0.62) * 3.5, 2.0));
          outP.x -= uIndent * cone * 0.62;
          outP += n * (uIndent * ring * 0.055);
          float ut = max(0.0, uTime - ${T_IMPACT.toFixed(3)});
          float wave = sin(dImp * 32.0 - ut * 58.0) * exp(-dImp * 1.4) * smoothstep(0.0, 0.05, ut);
          outP += n * wave * 0.022 * min(1.0, uIndent * 1.6);
        }

        // 2) Rapid snapping curl right along tearing petal edge
        float edgeDist = tearVal - uTearFront;
        if (uTearFront > -0.10 && edgeDist >= -0.02 && edgeDist < 0.16) {
          float c = clamp(1.0 - edgeDist / 0.16, 0.0, 1.0);
          vec3 d = p - vec3(0.0, ${IMPACT_Y.toFixed(3)}, 0.0);
          float yzLen = length(d.yz);
          float safeY = (abs(d.y) < 1e-4 && abs(d.z) < 1e-4) ? 1.0 : d.y;
          float angleYZ = atan(d.z, safeY);
          float petal = 0.075 * sin(angleYZ * 9.0 + uTearFront * 7.0) * smoothstep(0.0, 0.2, yzLen);
          outP += n * (0.28 * c * c + petal * c);
          outP.x -= 0.12 * c * c;
        }

        // 3) Subtle vertical pull of upper rubber neck with tether knot
        float topPull = smoothstep(2.4, 3.14159, theta) * (uKnotY - 1.62);
        outP.y += topPull;
        return outP;
      }

      void main() {
        float tearCenter = evalTear(position);
        float edgeDist = tearCenter - uTearFront;
        vTearDist = edgeDist;
        vCurl = (uTearFront > -0.10 && edgeDist >= -0.02 && edgeDist < 0.16)
          ? clamp(1.0 - edgeDist / 0.16, 0.0, 1.0)
          : 0.0;

        vec3 nBase = normalize(normal);
        vec3 pDef = deformLatex(position, nBase, tearCenter, aParam.x);

        vec3 upRef = abs(nBase.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 T = normalize(cross(upRef, nBase));
        vec3 B = normalize(cross(nBase, T));
        float e = 0.02;
        vec3 pT = deformLatex(position + T * e, nBase, evalTear(position + T * e), aParam.x);
        vec3 pB = deformLatex(position + B * e, nBase, evalTear(position + B * e), aParam.x);
        vec3 nDef = cross(pT - pDef, pB - pDef);
        float nLen = length(nDef);
        nDef = nLen > 1e-5 ? (nDef / nLen) : nBase;
        if (dot(nDef, nBase) < 0.0) nDef = -nDef;

        vec4 wp = modelMatrix * vec4(pDef, 1.0);
        vPosW = wp.xyz;
        vNormalW = normalize(mat3(modelMatrix) * nDef);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }
  `;
  const latexFragShader = `
      uniform float uTearFront;
      varying vec3 vPosW;
      varying vec3 vNormalW;
      varying float vTearDist;
      varying float vCurl;
      ${GLSL_STUDIO_COMMON}

      void main() {
        if (uTearFront > 1.12) discard;
        if (uTearFront > -0.10 && vTearDist < 0.0) discard;

        vec3 N = normalize(vNormalW);
        if (!gl_FrontFacing) N = -N;
        vec3 V = normalize(cameraPosition - vPosW);
        float ndv = clamp(abs(dot(N, V)), 0.0, 1.0);
        float fres = pow(max(1.0 - ndv, 0.0001), 2.2);

        // Deep crimson latex (#e61c24 -> linear ~(0.791, 0.0116, 0.0176))
        vec3 crimson = vec3(0.791, 0.012, 0.018);
        vec3 darkEdge = vec3(0.24, 0.004, 0.008);
        vec3 sssGlow = vec3(0.95, 0.06, 0.08);

        vec3 lKey = normalize(vec3(0.50, 0.69, 0.58));
        vec3 lBack = normalize(vec3(-0.20, 0.40, -0.88));
        float diff = 0.38 + 0.62 * max(dot(N, lKey), 0.0);
        float wrapBack = pow(max(0.0001, dot(-N, lBack) * 0.5 + 0.5), 2.0);

        vec3 baseCol = mix(crimson * diff, darkEdge, fres * 0.72);
        baseCol += sssGlow * (0.28 * ndv + 0.20 * wrapBack);
        baseCol = mix(baseCol, darkEdge * 1.15, vCurl * 0.45);
        if (!gl_FrontFacing) baseCol *= 0.78;

        vec3 rims = evalStudioRims(N, V, 145.0, 2.5);
        vec3 col = baseCol + rims * (0.85 + 0.55 * vCurl);

        float alpha = clamp(0.84 + 0.14 * fres + 0.12 * vCurl, 0.0, 0.99);
        gl_FragColor = vec4(toSRGB(col), alpha);
      }
  `;

  const latexMatBack = new THREE.ShaderMaterial({

  // ---------------------------------------------------------------------------
  // 7. Instanced 3D Macro Water Blobs & Ligaments (380 sculpted blobs)
  // ---------------------------------------------------------------------------
  const BLOB_COUNT = 380;
  const blobGeom = new THREE.IcosahedronGeometry(0.065, 2);

  });
  const blobMesh = new THREE.InstancedMesh(blobGeom, blobMat, BLOB_COUNT);

  const blobs = [];
  for (let i = 0; i < BLOB_COUNT; i++) {

      };

  // ---------------------------------------------------------------------------
  // 8. High-Speed Velocity-Stretched Micro-Droplet & Mist Engine (4,200 droplets)
  // ---------------------------------------------------------------------------
  const DROP_COUNT = 4200;
  const drops = [];
  for (let i = 0; i < DROP_COUNT; i++) {
    let p0, v0, birth, drag, grav, size, life, kind;
    if (i < 950) {
      // Entry splash backward cone (+X)

      const spd = randRange(1.1, 4.4);
      p0 = {
        x: R_IMPACT - 0.03 + randRange(-0.04, 0.04),
        y: IMPACT_Y + Math.cos(ang) * randRange(0.06, 0.18),

      };
      v0 = {
        x: spd * Math.cos(cone),
        y: spd * Math.sin(cone) * Math.cos(ang),

      };

      drag = randRange(0.32, 0.95);

    } else if (i < 1450) {

      const theta = randRange(0.08 * Math.PI, 0.92 * Math.PI);
      const phi = randRange(0, Math.PI * 2);
      const prof = balloonProfile(theta, true);
      p0 = {
        x: prof.r * 1.01 * Math.cos(phi),
        y: prof.y,
        z: prof.r * 1.01 * Math.sin(phi)
      };
      const tc = evalTearCoord(p0.x, p0.y, p0.z);
      birth = T_PUNCTURE + Math.pow(clamp((tc + 0.07) / 1.19, 0.0, 1.0), 1.0 / 0.86) * (T_TEAR_END - T_PUNCTURE);
      const spd = randRange(0.35, 1.35);
      v0 = {
        x: Math.cos(phi) * Math.sin(theta) * spd - 0.25,
        y: -Math.cos(theta) * spd * 0.45 + randRange(-0.15, 0.25),
        z: Math.sin(phi) * Math.sin(theta) * spd
      };
      drag = randRange(0.85, 1.85);
      grav = 0.42;
      size = randRange(0.024, 0.062);

      const ang = randRange(0, Math.PI * 2);

      p0 = {

        y: IMPACT_Y + Math.cos(ang) * rOff,
        z: Math.sin(ang) * rOff
      };
      birth = T_PUNCTURE + s * (T_EXIT - T_PUNCTURE) + randRange(0.02, 0.45);
      const burst = randRange(0.25, 1.10);
      v0 = {

      const isLeadJet = i < 2650;
      const cone = isLeadJet ? randRange(0.14, 0.56) : randRange(0.32, 0.92);
      const spd = isLeadJet ? randRange(0.95, 2.55) : randRange(0.65, 1.85);
      p0 = {
        x: -R_IMPACT + 0.02 + randRange(-0.04, 0.04),

      const prof = balloonProfile(theta, true);
      const tNorm = rng();
      birth = 4.45 + tNorm * 2.25;
      const brk = smoothstep(4.2, 6.5, birth);
      const expand = 1.0 + 0.62 * brk;
      p0 = {
        x: prof.r * expand * Math.cos(phi) + randRange(-0.08, 0.08),
        y: prof.y * (1.0 + 0.25 * brk) - 0.36 * brk * brk + randRange(-0.08, 0.08),
        z: prof.r * expand * Math.sin(phi) + randRange(-0.08, 0.08)
      };
      const spd = randRange(0.30, 1.95);
      v0 = {
        x: Math.cos(phi) * Math.sin(theta) * spd + randRange(-0.25, 0.20),
        y: -Math.cos(theta) * spd * 0.50 + randRange(-0.40, 0.25),
        z: Math.sin(phi) * Math.sin(theta) * spd
      };
      drag = randRange(0.18, 0.78);
      grav = randRange(0.68, 0.84);
      size = randRange(0.022, 0.082);

    drops.push({ p0, v0, birth, drag, grav, size, life, kind });

  const quadBase = new THREE.PlaneBufferGeometry(1, 1);
  const dropInstGeom = new THREE.InstancedBufferGeometry();
  dropInstGeom.index = quadBase.index;
  dropInstGeom.setAttribute("position", quadBase.attributes.position);
  dropInstGeom.setAttribute("uv", quadBase.attributes.uv);
  dropInstGeom.instanceCount = DROP_COUNT;

  const dropPosArr = new Float32Array(DROP_COUNT * 3);
  const dropVelArr = new Float32Array(DROP_COUNT * 3);
  const dropMetaArr = new Float32Array(DROP_COUNT * 3);

  const dropPosAttr = new THREE.InstancedBufferAttribute(dropPosArr, 3);
  const dropVelAttr = new THREE.InstancedBufferAttribute(dropVelArr, 3);
  const dropMetaAttr = new THREE.InstancedBufferAttribute(dropMetaArr, 3);
  dropPosAttr.setUsage(THREE.DynamicDrawUsage);
  dropVelAttr.setUsage(THREE.DynamicDrawUsage);
  dropMetaAttr.setUsage(THREE.DynamicDrawUsage);

  dropInstGeom.setAttribute("aInstPos", dropPosAttr);
  dropInstGeom.setAttribute("aInstVel", dropVelAttr);
  dropInstGeom.setAttribute("aInstMeta", dropMetaAttr);

  const dropMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uSprite: { value: dropletSpriteTex }
    },
    vertexShader: `
      attribute vec3 aInstPos;
      attribute vec3 aInstVel;
      attribute vec3 aInstMeta;
      varying vec2 vUv;
      varying float vAlpha;
      varying float vKind;
      varying vec3 vWorldPos;

      void main() {
        vUv = uv;
        vAlpha = aInstMeta.y;
        vKind = aInstMeta.z;
        if (vAlpha <= 0.001) {
          gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
          return;
        }

        vec3 velView = (viewMatrix * vec4(aInstVel, 0.0)).xyz;
        float speed2D = length(velView.xy);
        vec2 dir = speed2D > 0.02 ? (velView.xy / speed2D) : vec2(1.0, 0.0);
        vec2 perp = vec2(-dir.y, dir.x);

        float stretch = 1.0 + clamp(speed2D * 0.24, 0.0, 2.1);
        float invS = 1.0 / sqrt(stretch);
        float sz = aInstMeta.x;
        vec2 localOffset = (dir * (position.x * stretch) + perp * (position.y * invS)) * sz;

        vec4 mvPos = viewMatrix * vec4(aInstPos, 1.0);
        mvPos.xy += localOffset;
        vWorldPos = aInstPos;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform sampler2D uSprite;
      varying vec2 vUv;
      varying float vAlpha;
      varying float vKind;
      varying vec3 vWorldPos;
      ${GLSL_STUDIO_COMMON}

      void main() {
        if (vAlpha <= 0.001) discard;
        vec4 tex = texture2D(uSprite, vUv);
        if (tex.a < 0.02) discard;

        float sideMix = smoothstep(-2.4, 2.4, vWorldPos.x);
        vec3 rimTint = mix(vec3(1.00, 0.56, 0.88), vec3(0.48, 0.94, 1.00), sideMix);

        vec3 baseCol = mix(vec3(0.76, 0.90, 1.00), rimTint, 0.36);
        if (vKind > 1.5) {
          baseCol = vec3(0.84, 0.96, 1.00);
        } else if (vKind > 0.5) {
          baseCol = mix(baseCol, vec3(0.92, 0.98, 1.00), 0.45);
        }

        vec3 col = mix(baseCol, vec3(1.0), pow(max(tex.r * tex.a, 0.0001), 2.2) * 0.75);
        float mistSoft = vKind > 0.5 ? 0.62 : 0.92;
        float a = tex.a * vAlpha * mistSoft;
        gl_FragColor = vec4(toSRGB(col), a);
      }
    `
  });

  const dropPoints = new THREE.Mesh(dropInstGeom, dropMat);
  dropPoints.renderOrder = 5;
  dropPoints.frustumCulled = false;
  scene.add(dropPoints);

  const tmpDummy = new THREE.Object3D();
  const tmpUp = new THREE.Vector3(0, 1, 0);
  const tmpDir = new THREE.Vector3();
  const tmpQuat = new THREE.Quaternion();

  // ---------------------------------------------------------------------------
  // Pure Deterministic State Evaluation: renderAt(simTime)
  // ---------------------------------------------------------------------------
  function renderAt(t) {
    const time = clamp(t, 0.0, DURATION);

    // 1. Bullet pose & aerodynamic cone
    const b = evalBullet(time);
    bulletGroup.position.set(b.xTip, b.yTip, 0);
    bulletGroup.rotation.z = b.nutation;
    bulletSpinGroup.rotation.x = b.roll;
    const inWater = time > T_IMPACT && time < T_EXIT;
    const machAlpha = inWater
      ? 0.0
      : (time <= T_IMPACT ? 0.14 : 0.11 * smoothstep(DURATION, T_EXIT + 0.3, time));
    machConeMat.uniforms.uAlpha.value = machAlpha;
    machConeMesh.visible = machAlpha > 0.001;

    // 2. Tether & knot collar recoil
    const knot = evalKnotPose(time);
    knotGroup.position.set(knot.x, knot.y, 0);
    knotGroup.scale.setScalar(knot.scale);
    const anchorY = 5.2;
    const dxT = 0 - knot.x;
    const dyT = anchorY - knot.y;
    const lenT = Math.hypot(dxT, dyT) || 1.0;
    tetherMesh.position.set(knot.x, knot.y, 0);
    tetherMesh.scale.set(1, lenT / 4.2, 1);
    tetherMesh.rotation.z = -Math.atan2(dxT, dyT);

    // 3. Crimson latex balloon membrane & rapid tear
    let indent = 0.0;
    if (time > T_IMPACT && time < T_TEAR_END) {
      if (time <= T_PUNCTURE) {
        indent = smoothstep(T_IMPACT, T_PUNCTURE, time);
      } else {
        indent = 1.0 - smoothstep(T_PUNCTURE, T_PUNCTURE + 0.12, time);
      }
    }
    const tearFront = tearFrontAt(time);
    latexUniforms.uTime.value = time;
    latexUniforms.uIndent.value = indent;
    latexUniforms.uTearFront.value = tearFront;
    latexUniforms.uKnotY.value = knot.y;
    const latexVisible = tearFront <= 1.12;
    latexMesh.visible = latexVisible;
    latexBackMesh.visible = latexVisible;

    // 4. Internal cavitation vapor tunnel (active t = 1.12 .. 5.40)
    const cavFrontX = Math.max(-R_IMPACT + 0.02, Math.min(R_IMPACT - 0.02, b.xTip + 0.16));
    const cavBackX = R_IMPACT + 0.01;
    let cavIntensity = 0.0;
    if (time > 1.12 && time < 5.40 && cavBackX > cavFrontX + 0.04) {
      cavIntensity = smoothstep(1.12, 1.55, time) * (1.0 - smoothstep(4.85, 5.40, time));
    }
    const cavCollapse = smoothstep(4.15, 5.15, time);
    cavMat.uniforms.uTime.value = time;
    cavMat.uniforms.uFrontX.value = cavFrontX;
    cavMat.uniforms.uBackX.value = cavBackX;
    cavMat.uniforms.uIntensity.value = cavIntensity;
    cavMat.uniforms.uCollapse.value = cavCollapse;
    cavMesh.visible = cavIntensity > 0.002;

    // 5. Free-standing water volume & Rayleigh-Taylor breakup sheets
    const swell = smoothstep(2.25, 3.95, time) * (1.0 - 0.35 * smoothstep(4.40, 5.80, time));
    const exitBulge = smoothstep(3.35, 3.80, time) * (1.0 - smoothstep(3.82, 4.35, time));
    const entryHoleR = time > 1.18 ? 0.11 + 0.19 * smoothstep(1.18, 3.30, time) : 0.0;
    const exitHoleR = time > 3.80 ? 0.11 + 0.25 * smoothstep(3.80, 4.85, time) : 0.0;
    const breakup = smoothstep(4.20, 6.75, time);
    const perforate = smoothstep(4.75, 6.75, time);
    const waterAlpha = 1.0 - smoothstep(6.05, 6.78, time);

    waterMat.uniforms.uTime.value = time;
    waterMat.uniforms.uSwell.value = swell;
    waterMat.uniforms.uExitBulge.value = exitBulge;
    waterMat.uniforms.uEntryHoleR.value = entryHoleR;
    waterMat.uniforms.uExitHoleR.value = exitHoleR;
    waterMat.uniforms.uBreakup.value = breakup;
    waterMat.uniforms.uPerforate.value = perforate;
    waterMat.uniforms.uGlobalAlpha.value = waterAlpha;
    waterMesh.visible = waterAlpha > 0.002;

    // 6. Torn crimson latex shreds
    shredMesh.visible = time > T_PUNCTURE;
    if (shredMesh.visible) {
      for (let i = 0; i < SHRED_COUNT; i++) {
        const s = shreds[i];
        const age = time - s.birth;
        if (age <= 0.0) {
          tmpDummy.position.set(0, 0, 50);
          tmpDummy.scale.setScalar(0.0001);
        } else {
          const st = integrateBallistic(s.p0, s.v0, age, s.drag, s.grav);
          const fadeOut = 1.0 - smoothstep(4.5, 6.4, age);
          tmpDummy.position.set(st.x, st.y, st.z);
          tmpDummy.rotation.set(
            s.rot0.x + s.spin.x * age,
            s.rot0.y + s.spin.y * age,
            s.rot0.z + s.spin.z * age
          );
          const sc = Math.max(0.0001, fadeOut);
          tmpDummy.scale.set(s.sx * sc, s.sy * sc, sc);
        }
        tmpDummy.updateMatrix();
        shredMesh.setMatrixAt(i, tmpDummy.matrix);
      }
      shredMesh.instanceMatrix.needsUpdate = true;
    }

    // 7. Macro 3D water blobs & elongated ligaments
    blobMesh.visible = time > 1.24;
    if (blobMesh.visible) {
      for (let i = 0; i < BLOB_COUNT; i++) {
        const m = blobs[i];
        const age = time - m.birth;
        if (age <= 0.0) {
          tmpDummy.position.set(0, 0, 50);
          tmpDummy.scale.setScalar(0.0001);
        } else {
          const st = integrateBallistic(m.p0, m.v0, age, m.drag, m.grav);
          const grow = smoothstep(0.0, 0.14, age);
          const speed = Math.hypot(st.vx, st.vy, st.vz);
          const elong = 1.0 + Math.min(1.6, speed * m.stretchFactor);
          const pinch = 1.0 / Math.sqrt(elong);
          tmpDummy.position.set(st.x, st.y, st.z);
          if (speed > 1e-4) {
            tmpDir.set(st.vx / speed, st.vy / speed, st.vz / speed);
            tmpQuat.setFromUnitVectors(tmpUp, tmpDir);
            tmpDummy.quaternion.copy(tmpQuat);
          } else {
            tmpDummy.quaternion.identity();
          }
          const s = m.baseScale * grow;
          tmpDummy.scale.set(s * pinch, s * elong, s * pinch);
        }
        tmpDummy.updateMatrix();
        blobMesh.setMatrixAt(i, tmpDummy.matrix);
      }
      blobMesh.instanceMatrix.needsUpdate = true;
    }

    // 8. 4,200 micro-droplets, mist, and cavitation bubbles
    dropPoints.visible = time > 1.15;
    if (dropPoints.visible) {
      for (let i = 0; i < DROP_COUNT; i++) {
        const d = drops[i];
        const age = time - d.birth;
        const i3 = i * 3;
        if (age <= 0.0 || age >= d.life) {
          dropPosArr[i3] = 0;
          dropPosArr[i3 + 1] = 0;
          dropPosArr[i3 + 2] = 50;
          dropVelArr[i3] = 0;
          dropVelArr[i3 + 1] = 0;
          dropVelArr[i3 + 2] = 0;
          dropMetaArr[i3] = 0;
          dropMetaArr[i3 + 1] = 0;
          dropMetaArr[i3 + 2] = d.kind;
        } else {
          const st = integrateBallistic(d.p0, d.v0, age, d.drag, d.grav);
          const fadeIn = smoothstep(0.0, 0.08, age);
          const fadeOut = d.kind === 2
            ? (1.0 - smoothstep(d.life * 0.55, d.life, age))
            : (1.0 - smoothstep(d.life - 1.5, d.life, age));
          dropPosArr[i3] = st.x;
          dropPosArr[i3 + 1] = st.y;
          dropPosArr[i3 + 2] = st.z;
          dropVelArr[i3] = st.vx;
          dropVelArr[i3 + 1] = st.vy;
          dropVelArr[i3 + 2] = st.vz;
          dropMetaArr[i3] = d.size;
          dropMetaArr[i3 + 1] = fadeIn * fadeOut;
          dropMetaArr[i3 + 2] = d.kind;
        }
      }
      dropPosAttr.needsUpdate = true;
      dropVelAttr.needsUpdate = true;
      dropMetaAttr.needsUpdate = true;
    }

    renderer.render(scene, camera);
  }

  // ---------------------------------------------------------------------------
  // Resize Handling
  // ---------------------------------------------------------------------------
  function handleResize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    if (w <= 0 || h <= 0) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderAt(simTime);
  }
  window.addEventListener("resize", handleResize);

  // ---------------------------------------------------------------------------
  // 5-State Playback State Machine (COUNTDOWN, PLAYING, PAUSED, REFIRE_HOLD, ENDED)
  // ---------------------------------------------------------------------------
  const countdownEl = document.getElementById("countdown");
  const btnRefire = document.getElementById("btn-refire");
  const btnToggle = document.getElementById("btn-toggle");
  const iconPause = document.getElementById("icon-pause");
  const iconPlay = document.getElementById("icon-play");
  const speedPills = Array.prototype.slice.call(document.querySelectorAll(".speed-pill"));
  const scrubber = document.getElementById("scrubber");

  let state = "COUNTDOWN";
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.000;
  let holdElapsed = 0.000;
  let lastRafTime = null;
  let skipNextDt = true;

  function showPauseIcon() {
    iconPause.style.display = "";
    iconPlay.style.display = "none";
    btnToggle.setAttribute("aria-label", "Pause");
  }

  function showPlayIcon() {
    iconPause.style.display = "none";
    iconPlay.style.display = "";
    btnToggle.setAttribute("aria-label", "Play");
  }

  function hideCountdown() {
    countdownEl.style.display = "none";
    countdownEl.textContent = "";
  }

  function updateCountdownDisplay() {
    countdownEl.style.display = "block";
    if (countdownElapsed < 1.000) {
      countdownEl.textContent = "3";
    } else if (countdownElapsed < 2.000) {
      countdownEl.textContent = "2";
    } else {
      countdownEl.textContent = "1";
    }
  }

  btnToggle.addEventListener("click", function () {
    if (state === "PLAYING") {
      state = "PAUSED";
      showPlayIcon();
    } else if (state === "COUNTDOWN" || state === "REFIRE_HOLD") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      renderAt(0.000);
      state = "PAUSED";
      showPlayIcon();
    } else if (state === "PAUSED") {
      state = "PLAYING";
      skipNextDt = true;
      showPauseIcon();
    } else if (state === "ENDED") {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = "0";
      renderAt(0.000);
      state = "PLAYING";
      skipNextDt = true;
      showPauseIcon();
    }
  });

  speedPills.forEach(function (pill) {
    pill.addEventListener("click", function () {
      const nextSpeed = parseFloat(pill.getAttribute("data-speed"));
      if (!isNaN(nextSpeed)) {
        playbackSpeed = nextSpeed;
      }
      speedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle("is-active", active);
        p.setAttribute("aria-checked", active ? "true" : "false");
      });
    });
  });

  scrubber.addEventListener("input", function () {
    hideCountdown();
    simTime = clamp(parseFloat(scrubber.value) || 0.0, 0.0, DURATION);
    state = "PAUSED";
    showPlayIcon();
    renderAt(simTime);
  });

  btnRefire.addEventListener("click", function () {
    hideCountdown();
    simTime = 0.000;
    scrubber.value = "0";
    holdElapsed = 0.000;
    state = "REFIRE_HOLD";
    skipNextDt = true;
    showPauseIcon();
    renderAt(0.000);
  });

  // Initial resting scene render before first rAF countdown tick
  countdownEl.style.display = "block";
  countdownEl.textContent = "3";
  scrubber.value = "0";
  showPauseIcon();
  renderAt(0.000);

  function tick(now) {
    requestAnimationFrame(tick);

    let dt = 0.0;
    if (lastRafTime === null || skipNextDt) {
      lastRafTime = now;
      skipNextDt = false;
      dt = 0.0;
    } else {
      dt = Math.min(0.1, Math.max(0.0, (now - lastRafTime) / 1000.0));
      lastRafTime = now;
    }

    if (state === "COUNTDOWN") {
      countdownElapsed += dt;
      if (countdownElapsed < 3.000) {
        updateCountdownDisplay();
      } else {
        hideCountdown();
        state = "PLAYING";
        simTime = Math.min(DURATION, (countdownElapsed - 3.000) * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    } else if (state === "REFIRE_HOLD") {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.000) {
        state = "PLAYING";
        simTime = Math.min(DURATION, (holdElapsed - 1.000) * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    } else if (state === "PLAYING") {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      renderAt(simTime);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAt(DURATION);
        state = "ENDED";
        showPlayIcon();
      }
    }
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
