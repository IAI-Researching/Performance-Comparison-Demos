<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Water Balloon · Ballistics Study</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;

  -webkit-user-select: none;

}
#stage {

}

#countdown {

<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>

    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/*
 * A deterministic, analytically evaluated high-speed photographic study.
 * The 20,000-fps event is time-remapped into six observation intervals.
 * Surface-tension modes, exponential aerodynamic drag, ballistic gravity,
 * and two dissipative floor contacts are evaluated from immutable rest data.
 * No simulation integrator, accumulated vertex offsets, or frame-based noise.
 */
const DURATION = 8.000;
const CAPTURE_FPS = 20000;
const SEED = 42;
const FLOOR = -2.73;
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const mix = (a, b, t) => a + (b - a) * t;
function smooth(a, b, x) {
  const q = clamp((x - a) / (b - a));
  return q * q * (3 - 2 * q);
}
function mulberry32(seed) {
  return function () {
    let n = seed += 0x6D2B79F5;
    n = Math.imul(n ^ n >>> 15, n | 1);
    n ^= n + Math.imul(n ^ n >>> 7, n | 61);
    return ((n ^ n >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(SEED);
const range = (a, b) => mix(a, b, random());

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 80);
camera.position.set(0, 0, 11.8);
camera.lookAt(0, 0, 0);

// A studio reflected in the subject, generated into six detached canvases.
// The background remains the prescribed CSS gradient, visible through alpha.
function makeStudio() {
  const panels = [
    { d: new THREE.Vector3(-0.60, 0.63, 0.74).normalize(), w: 0.23, h: 0.49, c: [1, 0.95, 0.88] },
    { d: new THREE.Vector3(0.82, 0.24, 0.18).normalize(), w: 0.055, h: 0.81, c: [0.66, 0.92, 1] },
    { d: new THREE.Vector3(-0.78, 0.1, -0.38).normalize(), w: 0.085, h: 0.72, c: [0.78, 0.83, 1] },
    { d: new THREE.Vector3(0.12, 0.89, -0.40).normalize(), w: 0.49, h: 0.12, c: [0.92, 0.96, 1] }
  ];
  panels.forEach(p => {
    p.right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), p.d).normalize();
    p.up = new THREE.Vector3().crossVectors(p.d, p.right).normalize();
  });
  const size = 192;
  const faces = [];
  const d = new THREE.Vector3();
  for (let f = 0; f < 6; f++) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    const pixels = ctx.createImageData(size, size);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = 2 * (x + 0.5) / size - 1;
        const v = 2 * (y + 0.5) / size - 1;
        if (f === 0) d.set(1, -v, -u);
        if (f === 1) d.set(-1, -v, u);
        if (f === 2) d.set(u, 1, v);
        if (f === 3) d.set(u, -1, -v);
        if (f === 4) d.set(u, -v, 1);
        if (f === 5) d.set(-u, -v, -1);
        d.normalize();
        const sky = 0.035 + 0.022 * (d.y + 1);
        let r = sky * 0.73, g = sky * 0.86, b = sky;
        for (const p of panels) {
          const z = d.dot(p.d);
          if (z <= 0) continue;
          const px = Math.abs(d.dot(p.right) / z);
          const py = Math.abs(d.dot(p.up) / z);
          const light = (1 - smooth(p.w, p.w + 0.045, px)) * (1 - smooth(p.h, p.h + 0.08, py));
          r += p.c[0] * light;
          g += p.c[1] * light;
          b += p.c[2] * light;
        }
        const i = (y * size + x) * 4;
        pixels.data[i] = Math.min(255, 255 * r);
        pixels.data[i + 1] = Math.min(255, 255 * g);
        pixels.data[i + 2] = Math.min(255, 255 * b);
        pixels.data[i + 3] = 255;
      }
    }
    ctx.putImageData(pixels, 0, 0);
    faces.push(canvas);
  }
  const cube = new THREE.CubeTexture(faces);
  cube.encoding = THREE.sRGBEncoding;
  cube.needsUpdate = true;
  return cube;
}
const studio = makeStudio();
const pmrem = new THREE.PMREMGenerator(renderer);
const studioTarget = pmrem.fromCubemap(studio);
scene.environment = studioTarget.texture;
pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xb5d8ee, 0x20111d, 0.32));
function addLight(color, intensity, x, y, z) {
  const light = new THREE.DirectionalLight(color, intensity);
  light.position.set(x, y, z);
  scene.add(light);
}
addLight(0xfff3e8, 1.6, -3.5, 4.5, 5);
addLight(0xa9eaff, 2.5, 3, 1.5, -2.5);
addLight(0xe7c9ee, 1.3, -3, 0.5, -3);
addLight(0xe0f2ff, 0.22, 1, -1, 5);

// The hydrostatic profile is broader below its equator and tapers to a neck.
function restPoint(theta, phi, out) {
  const c = Math.cos(theta), s = Math.sin(theta);
  const r = s * (1.14 - 0.34 * c);
  out.set(r * Math.cos(phi), 1.5 * c, r * Math.sin(phi));
  return out;
}
function makeBodyGeometry() {
  const geometry = new THREE.SphereBufferGeometry(1, 112, 80);
  const p = geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const y = p.getY(i);
    const r = 1.14 - 0.34 * y;
    p.setXYZ(i, p.getX(i) * r, y * 1.5, p.getZ(i) * r);
  }
  geometry.computeVertexNormals();
  geometry.setAttribute('restPosition', new THREE.BufferAttribute(new Float32Array(p.array), 3));
  p.setUsage(THREE.DynamicDrawUsage);
  return geometry;
}

const latexMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe61c24, metalness: 0.015, roughness: 0.22,
  clearcoat: 0.85, clearcoatRoughness: 0.12,
  transmission: 0.025,
  envMapIntensity: 0.85, side: THREE.FrontSide,
  transparent: true, opacity: 0.985
});
latexMaterial.color.convertSRGBToLinear();
const tornLatexMaterial = latexMaterial.clone();
tornLatexMaterial.transmission = 0;
tornLatexMaterial.side = THREE.DoubleSide;
const latexClock = { value: 0 };
latexMaterial.onBeforeCompile = shader => {
  shader.uniforms.uSimTime = latexClock;
  shader.vertexShader = 'attribute vec3 restPosition; varying vec3 vRest;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvRest = restPosition;');
  shader.fragmentShader = 'uniform float uSimTime; varying vec3 vRest;\n' + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>', `
    #include <clipping_planes_fragment>
    float tear = max(0.0, uSimTime - 1.035) * 7.1;
    float distanceToImpact = length((vRest - vec3(1.14, 0.04, 0.0)) * vec3(1.0, 0.82, 1.0));
    float jagged = 0.026 * sin(vRest.y * 73.0 + vRest.z * 41.0) + 0.017 * sin(vRest.z * 117.0);
    if (uSimTime > 1.035 && distanceToImpact + jagged < tear) discard;
  `);
};
const latexGeometry = makeBodyGeometry();
const latex = new THREE.Mesh(latexGeometry, latexMaterial);
latex.renderOrder = 10;
latex.frustumCulled = false;
scene.add(latex);

// Neck, knot and a fine double-stranded suspension thread.
const neck = new THREE.Mesh(new THREE.LatheGeometry([
  new THREE.Vector2(0.085, 1.43), new THREE.Vector2(0.064, 1.52),
  new THREE.Vector2(0.045, 1.57), new THREE.Vector2(0.06, 1.62),
  new THREE.Vector2(0.04, 1.66), new THREE.Vector2(0.02, 1.67)
], 40), tornLatexMaterial);
neck.renderOrder = 11;
scene.add(neck);
const knot = new THREE.Mesh(new THREE.TorusGeometry(0.054, 0.022, 10, 32), tornLatexMaterial);
knot.rotation.x = Math.PI / 2;
knot.position.y = 1.58;
scene.add(knot);
const threadMaterial = new THREE.MeshStandardMaterial({ color: 0x98918a, roughness: 0.76, metalness: 0.08 });
for (let strand = 0; strand < 2; strand++) {
  const points = [];
  for (let i = 0; i <= 180; i++) {
    const y = mix(1.59, 8, i / 180);
    points.push(new THREE.Vector3(0.004 * Math.cos(y * 66 + strand * Math.PI), y, 0.004 * Math.sin(y * 66 + strand * Math.PI)));
  }
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 220, 0.004, 4, false), threadMaterial));
}

const wetVertex = `
  varying vec3 vWorld;
  varying vec3 vNormalWorld;
  varying vec3 vLocal;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vLocal = position;
    vec4 world = modelMatrix * vec4(position, 1.0);
    vWorld = world.xyz;
    vNormalWorld = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * world;
  }
`;
const wetFragment = `
  uniform samplerCube uStudio;
  uniform float uTime;
  uniform float uOpacity;
  uniform float uMode;
  uniform float uBreak;
  varying vec3 vWorld;
  varying vec3 vNormalWorld;
  varying vec3 vLocal;
  varying vec2 vUv;
  float field(vec3 p) {
    return (sin(p.x * 9.1 + sin(p.y * 7.7)) * sin(p.y * 10.3 + p.z * 6.8)
      + sin(p.z * 15.2 + p.x * 4.3) * 0.50 + sin(p.y * 23.7 - p.x * 13.1) * 0.24) / 1.74;
  }
  void main() {
    vec3 p = vLocal;
    float holes = field(p * 1.2 + vec3(0.0, uTime * 0.055, 0.0));
    if (uMode < 0.5 && uBreak > 0.01 && holes < uBreak * 1.85 - 0.97) discard;
    if (uMode > 1.5 && uMode < 2.5) {
      float cut = -0.95 + vUv.x * 1.02 + uBreak * 0.65;
      if (holes < cut) discard;
    }
    if (uMode > 2.5 && uMode < 3.5 && holes < uBreak * 1.5 - 0.92) discard;
    vec3 n = normalize(vNormalWorld);
    if (!gl_FrontFacing) n = -n;
    float ripple = smoothstep(1.05, 3.0, uTime);
    n = normalize(n + ripple * 0.012 * vec3(
      sin(p.y * 25.0 + p.z * 17.0 - uTime * 2.0),
      sin(p.z * 23.0 + p.x * 20.0 + uTime * 1.4),
      sin(p.x * 19.0 - p.y * 17.0 - uTime * 1.1)));
    vec3 viewDir = normalize(cameraPosition - vWorld);
    float facing = max(0.0, dot(n, viewDir));
    float fresnel = 0.0204 + 0.9796 * pow(1.0 - facing, 5.0);
    vec3 reflected = reflect(-viewDir, n);
    vec3 env = pow(textureCube(uStudio, reflected).rgb, vec3(2.2));
    vec3 refracted = refract(-viewDir, n, 0.7502);
    vec3 transmission = pow(textureCube(uStudio, refracted).rgb, vec3(2.2));
    float edge = pow(1.0 - facing, 2.8);
    float fine = 1.0 - abs(field(p * 1.7 + vec3(0.0, uTime * 0.025, 0.0)));
    float caustic = pow(fine, 28.0) * ripple;
    vec3 color = vec3(0.012, 0.020, 0.026) + transmission * 0.055;
    color += env * (0.14 + 1.8 * fresnel);
    color += vec3(0.32, 0.43, 0.48) * edge * 0.55;
    color += vec3(0.15, 0.23, 0.27) * caustic * ripple * 0.10;
    float hot = max(max(env.r, env.g), env.b);
    float alpha = (0.09 + edge * 0.75 + hot * 0.43 + caustic * 0.025) * uOpacity;
    if (uMode > 0.5 && uMode < 1.5) {
      color += vec3(0.15, 0.22, 0.25) * pow(1.0 - facing, 1.4);
      alpha = (0.15 + edge * 0.54 + hot * 0.4) * uOpacity;
    }
    if (uMode > 3.5) {
      float radius = length(vUv - 0.5) * 2.0;
      float rings = pow(0.5 + 0.5 * cos(radius * 74.0 - uTime * 8.0), 12.0);
      color += vec3(0.15, 0.23, 0.28) * rings * 0.22;
      alpha *= (1.0 - smoothstep(0.74, 1.0, radius)) * 0.56;
    }
    gl_FragColor = vec4(color, clamp(alpha, 0.0, 0.96));
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }
`;
const wetMaterials = [];
function wetMaterial(mode, opacity = 1, side = THREE.DoubleSide) {
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uStudio: { value: studio }, uTime: { value: 0 }, uOpacity: { value: opacity },
      uMode: { value: mode }, uBreak: { value: 0 }
    },
    vertexShader: wetVertex, fragmentShader: wetFragment,
    transparent: true, depthWrite: false, side
  });
  wetMaterials.push(material);
  return material;
}
const waterGeometry = makeBodyGeometry();
const waterBackMaterial = wetMaterial(0, 0.42, THREE.BackSide);
const waterFrontMaterial = wetMaterial(0, 1, THREE.FrontSide);
const waterBack = new THREE.Mesh(waterGeometry, waterBackMaterial);
const waterFront = new THREE.Mesh(waterGeometry, waterFrontMaterial);
waterBack.renderOrder = 1;
waterFront.renderOrder = 6;
waterBack.frustumCulled = waterFront.frustumCulled = false;
scene.add(waterBack, waterFront);

// Copper jacket with an ogive nose and fine circumferential cannelures.
const copper = new THREE.MeshStandardMaterial({ color: 0xb86a37, metalness: 0.94, roughness: 0.21, envMapIntensity: 1.5, transparent: true });
const brass = new THREE.MeshStandardMaterial({ color: 0xba9550, metalness: 0.9, roughness: 0.26, envMapIntensity: 1.3, transparent: true });
const bullet = new THREE.Group();
const bulletBody = new THREE.Mesh(new THREE.LatheGeometry([
  new THREE.Vector2(0, -0.25), new THREE.Vector2(0.056, -0.25),
  new THREE.Vector2(0.063, -0.205), new THREE.Vector2(0.063, 0.015),
  new THREE.Vector2(0.058, 0.075), new THREE.Vector2(0.043, 0.155),
  new THREE.Vector2(0.023, 0.232), new THREE.Vector2(0, 0.29)
], 48), copper);
bulletBody.renderOrder = 4;
bullet.add(bulletBody);
for (let i = 0; i < 3; i++) {
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.063, 0.003, 6, 40), brass);
  band.rotation.x = Math.PI / 2;
  band.position.y = -0.125 - i * 0.017;
  band.renderOrder = 4;
  bullet.add(band);
}
bullet.rotation.z = Math.PI / 2;
bullet.position.y = 0.04;
scene.add(bullet);
function bulletTip(t) {
  if (t <= 1) return mix(8.3, 1.14, t);
  if (t <= 1.6) return mix(1.14, 0.70, (t - 1) / 0.6);
  if (t <= 2.4) return mix(0.70, 0.26, (t - 1.6) / 0.8);
  if (t <= 3.8) return mix(0.26, -1.15, (t - 2.4) / 1.4);
  return -1.15 - (t - 3.8) * 4.9;
}

// Indexed parametric grids are rewritten from their rest parameters each time.
function gridGeometry(columns, rows) {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array((columns + 1) * (rows + 1) * 3);
  const uv = new Float32Array((columns + 1) * (rows + 1) * 2);
  const indices = [];
  for (let row = 0; row <= rows; row++) {
    for (let col = 0; col <= columns; col++) {
      const i = row * (columns + 1) + col;
      uv[i * 2] = col / columns;
      uv[i * 2 + 1] = row / rows;
      if (col < columns && row < rows) {
        const j = i + columns + 1;
        indices.push(i, j, i + 1, j, j + 1, i + 1);
      }
    }
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geometry.setIndex(indices);
  return geometry;
}
const tunnelGeometry = gridGeometry(64, 40);
const tunnelMaterial = wetMaterial(1, 1);
const tunnel = new THREE.Mesh(tunnelGeometry, tunnelMaterial);
tunnel.renderOrder = 3;
tunnel.frustumCulled = false;

function waterPosition(x, y, z, t, out) {

    (Math.sin(y * 12.8 + z * 9.7 + Math.sin(x * 8.1) * 1.3 - t * 1.9) +

  out.y = y + swelling * y * 0.5 - 0.035 * Math.pow(Math.max(0, t - 2.4), 2) - 0.30 * breakup * breakup;

    out.y += Math.sin(x * 11 + z * 6) * 0.048 * breakup;

    } else {
      dummy.position.set(dropState.x, dropState.y, dropState.z);
      direction.set(dropState.vx, dropState.vy, dropState.vz);
      const speed = direction.length();
      const flat = dropState.flat;
      if (flat > 0.1) dummy.quaternion.identity();
      else dummy.quaternion.setFromUnitVectors(up, speed > 0.0001 ? direction.divideScalar(speed) : up);
      // Volume-preserving capillary oscillation and aerodynamic elongation.
      const elongation = (1 + Math.min(0.9, speed * 0.23)) * (1 + 0.10 * Math.sin((t - p.birth) * 13 + p.phase));
      const r = p.radius * dropState.scale;
      dummy.scale.set(r / Math.sqrt(elongation) * (1 + flat), r * elongation * (1 - flat * 0.89), r / Math.sqrt(elongation) * (1 + flat));
    }
    dummy.updateMatrix();
    resolvedDrops.setMatrixAt(i, dummy.matrix);
  }
  resolvedDrops.instanceMatrix.needsUpdate = true;
}

/* The complete visual state is a function of t and the fixed seed only. */
function renderAt(time) {
  const t = clamp(time, 0, DURATION);
  wetMaterials.forEach(m => { m.uniforms.uTime.value = t; });
  updateBody(t);
  updateRibbons(t);
  updateCavity(t);
  updatePlumes(t);
  updateSheets(t);
  updateLigaments(t);
  updateDrops(t);
  bullet.position.x = bulletTip(t) + 0.29;
  bullet.visible = t < 5.5;
  const pool = smooth(4.7, 7.95, t);
  puddle.visible = pool > 0;
  puddle.scale.set(1 + 2.75 * pool, 0.38 + 0.72 * pool, 1);
  puddleMaterial.uniforms.uOpacity.value = pool;
  renderer.render(scene, camera);
}

// Exactly five playback states. Wall-clock holds and simulation time are separate.
const STATES = Object.freeze({ COUNTDOWN: 'COUNTDOWN', PLAYING: 'PLAYING', PAUSED: 'PAUSED', REFIRE_HOLD: 'REFIRE_HOLD', ENDED: 'ENDED' });
let state = STATES.COUNTDOWN;
let simTime = 0;
let playbackSpeed = 1;
let countdownElapsed = 0;
let holdElapsed = 0;
let countdownStart = null;
let holdStart = null;
let previousFrame = null;
const countdown = document.getElementById('countdown');
const scrubber = document.getElementById('scrubber');
const toggle = document.getElementById('btn-toggle');
const iconPlay = document.getElementById('icon-play');
const iconPause = document.getElementById('icon-pause');
const speedPills = Array.from(document.querySelectorAll('.speed-pill'));

function hideCountdown() {
  countdown.style.display = 'none';
  countdown.textContent = '';
}
function setState(next) {
  state = next;
  const running = next === STATES.PLAYING || next === STATES.COUNTDOWN || next === STATES.REFIRE_HOLD;
  iconPause.style.display = running ? 'block' : 'none';
  iconPlay.style.display = running ? 'none' : 'block';
  toggle.setAttribute('aria-label', running ? 'Pause' : 'Play');
}
function cancelHolds() {
  countdownStart = holdStart = null;
  countdownElapsed = holdElapsed = 0;
  hideCountdown();
}
function advance(dt) {
  simTime = Math.min(DURATION, simTime + Math.min(0.1, Math.max(0, dt)) * playbackSpeed);
  scrubber.value = simTime.toFixed(3);
  if (simTime >= DURATION) {
    simTime = DURATION;
    scrubber.value = DURATION.toFixed(3);
    setState(STATES.ENDED);
  }
}
toggle.addEventListener('click', () => {
  previousFrame = performance.now();
  if (state === STATES.PLAYING) {
    setState(STATES.PAUSED);
  } else if (state === STATES.COUNTDOWN || state === STATES.REFIRE_HOLD) {
    cancelHolds();
    simTime = 0;
    scrubber.value = '0';
    setState(STATES.PAUSED);
    renderAt(simTime);
  } else if (state === STATES.PAUSED) {
    cancelHolds();
    setState(STATES.PLAYING);
  } else if (state === STATES.ENDED) {
    cancelHolds();
    simTime = 0;
    scrubber.value = '0';
    setState(STATES.PLAYING);
    renderAt(simTime);
  }
});
document.getElementById('btn-refire').addEventListener('click', () => {
  cancelHolds();
  simTime = 0;
  scrubber.value = '0';
  holdElapsed = 0;
  holdStart = performance.now();
  previousFrame = holdStart;
  setState(STATES.REFIRE_HOLD);
  renderAt(0);
});
speedPills.forEach((pill, index) => {
  pill.addEventListener('click', () => {
    playbackSpeed = parseFloat(pill.dataset.speed);
    speedPills.forEach(other => {
      const active = other === pill;
      other.classList.toggle('is-active', active);
      other.setAttribute('aria-checked', active ? 'true' : 'false');
    });
  });
  pill.addEventListener('keydown', event => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    const delta = event.key === 'ArrowRight' || event.key === 'ArrowDown' ? 1 : -1;
    const next = speedPills[(index + delta + speedPills.length) % speedPills.length];
    next.click(); next.focus();
  });
});
scrubber.addEventListener('input', () => {
  cancelHolds();
  simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
  setState(STATES.PAUSED);
  previousFrame = performance.now();
  renderAt(simTime);
});
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  particleMaterial.uniforms.uProjection.value = window.innerHeight * renderer.getPixelRatio() / Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
  renderAt(simTime);
}
window.addEventListener('resize', resize);

function frame(timestamp) {
  const dt = previousFrame === null ? 0 : Math.max(0, (timestamp - previousFrame) / 1000);
  previousFrame = timestamp;
  let needsRender = false;
  if (state === STATES.COUNTDOWN) {
    // The first RAF after the resting render is the exact countdown origin.
    if (countdownStart === null) countdownStart = timestamp;
    countdownElapsed = Math.max(0, (timestamp - countdownStart) / 1000);
    simTime = 0;
    scrubber.value = '0';
    if (countdownElapsed < 3.000) {
      countdown.style.display = 'block';
      countdown.textContent = String(3 - Math.floor(countdownElapsed));
    } else {
      hideCountdown();
      setState(STATES.PLAYING);
      advance(countdownElapsed - 3.000);
      needsRender = true;
    }
  } else if (state === STATES.REFIRE_HOLD) {
    holdElapsed = Math.max(0, (timestamp - holdStart) / 1000);
    if (holdElapsed >= 1.000) {
      setState(STATES.PLAYING);
      advance(holdElapsed - 1.000);
      needsRender = true;
    }
  } else if (state === STATES.PLAYING) {
    advance(dt);
    needsRender = true;
  }
  if (needsRender) renderAt(simTime);
  requestAnimationFrame(frame);
}
setState(STATES.COUNTDOWN);
resize(); // Render the complete resting scene before starting the countdown.
requestAnimationFrame(frame);
</script>
</body>
