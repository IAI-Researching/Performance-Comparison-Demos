<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">

<script>
/**
 * BALLISTICS WATER BALLOON SLOW-MOTION SIMULATION (15,000+ FPS)
 * Seed: 42 Deterministic Simulation Engine
 */

// --- Deterministic Pseudo-Random Number Generator (Mulberry32) ---
function createPRNG(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = createPRNG(42);

function rnd(min, max) {
  return min + rand() * (max - min);
}

// --- Procedural Textures (Detached In-Memory Offscreen Canvases) ---
function createWaterDropletTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2;
  const cy = size / 2;
  const r = size * 0.44;

  ctx.clearRect(0, 0, size, size);

  // Outer meniscus refraction ring
  const outerGrad = ctx.createRadialGradient(cx, cy, r * 0.15, cx, cy, r);
  outerGrad.addColorStop(0, 'rgba(215, 240, 255, 0.40)');
  outerGrad.addColorStop(0.55, 'rgba(170, 218, 255, 0.25)');
  outerGrad.addColorStop(0.82, 'rgba(210, 242, 255, 0.70)');
  outerGrad.addColorStop(0.94, 'rgba(255, 255, 255, 0.55)');
  outerGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

  ctx.fillStyle = outerGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  // Primary key specular hot-spot (upper-right)
  const specX = cx + r * 0.30;
  const specY = cy - r * 0.30;
  const specR = r * 0.26;
  const specGrad = ctx.createRadialGradient(specX, specY, 0, specX, specY, specR);
  specGrad.addColorStop(0, 'rgba(255, 255, 255, 0.98)');
  specGrad.addColorStop(0.35, 'rgba(255, 255, 255, 0.82)');
  specGrad.addColorStop(0.70, 'rgba(230, 248, 255, 0.35)');
  specGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

  ctx.fillStyle = specGrad;
  ctx.beginPath();
  ctx.arc(specX, specY, specR, 0, Math.PI * 2);
  ctx.fill();

  // Secondary rim specular (lower-left)
  const rimX = cx - r * 0.32;
  const rimY = cy + r * 0.32;
  const rimR = r * 0.22;
  const rimGrad = ctx.createRadialGradient(rimX, rimY, 0, rimX, rimY, rimR);
  rimGrad.addColorStop(0, 'rgba(180, 235, 255, 0.65)');
  rimGrad.addColorStop(0.50, 'rgba(160, 215, 255, 0.22)');
  rimGrad.addColorStop(1.0, 'rgba(180, 235, 255, 0.0)');

  ctx.fillStyle = rimGrad;
  ctx.beginPath();
  ctx.arc(rimX, rimY, rimR, 0, Math.PI * 2);
  ctx.fill();

  const texture = new THREE.CanvasTexture(canvas);
  texture.generateMipmaps = true;
  return texture;
}

function createMistTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const cx = size / 2;
  const cy = size / 2;
  const r = size * 0.48;

  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, 'rgba(230, 245, 255, 0.70)');
  grad.addColorStop(0.35, 'rgba(200, 235, 255, 0.35)');
  grad.addColorStop(0.70, 'rgba(180, 220, 250, 0.12)');
  grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fill();

  const texture = new THREE.CanvasTexture(canvas);
  return texture;
}

const dropletTexture = createWaterDropletTexture();
const mistTexture = createMistTexture();

// --- Three.js Scene, Camera, Renderer Setup ---
const canvasEl = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
  canvas: canvasEl,
  antialias: true,
  alpha: true
});
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);

const scene = new THREE.Scene();

// Camera: 85mm equivalent, narrow FOV ≈ 35°, perpendicular to horizontal flight path (locked along Z)
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 9.4);
camera.lookAt(0, 0, 0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight, false);
});

// --- Studio Lighting Setup ---
// Three-point studio lighting with strong dual rim-lights (cool white/cyan and subtle magenta)
const ambientLight = new THREE.AmbientLight(0x181c26, 0.75);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(4, 5, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8ea2be, 0.6);
fillLight.position.set(-4, -1, 4);
scene.add(fillLight);

// Cool white/cyan rim light
const rimLightCool = new THREE.DirectionalLight(0x75d5ff, 2.5);
rimLightCool.position.set(6, 2, -4);
scene.add(rimLightCool);

// Subtle magenta rim light
const rimLightWarm = new THREE.DirectionalLight(0xff8ab5, 1.8);
rimLightWarm.position.set(-6, 2, -4);
scene.add(rimLightWarm);

// --- Balloon Teardrop Silhouette Geometry Generator ---
function teardropRadius(v) {
  // v in [0, 1] from bottom (0, y = -1.35) to top (1, y = 1.45)
  if (v < 0.10) {
    const s = v / 0.10;
    return Math.sqrt(Math.max(0, 1 - Math.pow(1 - s, 2))) * 0.65;
  } else if (v < 0.85) {
    const s = (v - 0.10) / 0.75; // 0 at bottom, 1 at top
    // Hydrostatic sag bulge widest near s ~ 0.28 (y ~ -0.55), max radius ~ 1.25
    return 0.65 * (1 - s) + 0.32 * s + 0.78 * Math.sin(s * Math.PI) * (1.18 - 0.52 * s);
  } else {
    const s = (v - 0.85) / 0.15;
    return 0.32 * (1 - s) + 0.16 * s;
  }
}

// Center of impact on right boundary:
const IMPACT_Y = -0.20;
const IMPACT_V = (-0.20 - (-1.35)) / 2.80;
const IMPACT_R = teardropRadius(IMPACT_V); // ~1.2385
const IMPACT_POS = new THREE.Vector3(IMPACT_R, IMPACT_Y, 0.0);
const EXIT_POS = new THREE.Vector3(-IMPACT_R, IMPACT_Y, 0.0);

function createTeardropGeometry(scaleFactor = 1.0) {
  const latBands = 72;
  const lonBands = 96;
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  const tearTimes = [];
  const anchorPoints = [];

  for (let j = 0; j <= latBands; j++) {
    const v = j / latBands;
    const y = (-1.35 + v * 2.80) * scaleFactor;
    const r = teardropRadius(v) * scaleFactor;

    for (let i = 0; i <= lonBands; i++) {
      const u = i / lonBands;
      const phi = u * Math.PI * 2;
      const x = r * Math.cos(phi);
      const z = r * Math.sin(phi);

      positions.push(x, y, z);
      uvs.push(u, v);

      // Distance from impact coordinates
      const dx = x - IMPACT_POS.x * scaleFactor;
      const dy = y - IMPACT_POS.y * scaleFactor;
      const dz = z - IMPACT_POS.z * scaleFactor;
      const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

      // Procedural jagged lightning tear pattern
      const anglePattern = Math.sin(y * 14.0 + phi * 6.0) * 0.22 + Math.cos(phi * 12.0) * 0.10;
      const effectiveDist = dist * (1.0 + anglePattern);

      // Tear reaches this vertex between 1.08s and 1.55s
      const tearTime = 1.08 + Math.min(effectiveDist / 3.4, 1.0) * 0.44;
      tearTimes.push(tearTime);

      // Anchor point for elastic retraction:
      // Upper vertices retract to tether knot (0, 1.45, 0), lower to base (0, -1.35, 0)
      if (y > 0.15 * scaleFactor) {
        anchorPoints.push(0.0, 1.45 * scaleFactor, 0.0);
      } else {
        anchorPoints.push(0.0, -1.32 * scaleFactor, 0.0);
      }

      // Approximate normal
      const nx = Math.cos(phi);
      const nz = Math.sin(phi);
      const ny = (v > 0.85) ? 0.35 : ((v < 0.20) ? -0.45 : (0.40 - v * 0.60));
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      normals.push(nx / len, ny / len, nz / len);
    }
  }

  for (let j = 0; j < latBands; j++) {
    for (let i = 0; i < lonBands; i++) {
      const a = j * (lonBands + 1) + i;
      const b = (j + 1) * (lonBands + 1) + i;
      const c = (j + 1) * (lonBands + 1) + (i + 1);
      const d = j * (lonBands + 1) + (i + 1);
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setIndex(indices);
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geom.setAttribute('aTearTime', new THREE.Float32BufferAttribute(tearTimes, 1));
  geom.setAttribute('aAnchor', new THREE.Float32BufferAttribute(anchorPoints, 3));
  geom.computeVertexNormals();
  return geom;
}

// --- Latex Balloon Shell (ShaderMaterial) ---
const balloonGeom = createTeardropGeometry(1.0);

const balloonShader = {
  uniforms: {
    uSimTime: { value: 0.0 },
    uImpactPos: { value: IMPACT_POS },
    uBulletPos: { value: new THREE.Vector3(6.2, IMPACT_Y, 0.0) },
    uColor: { value: new THREE.Color(0xe61c24) }, // Deep Crimson Red
    uLightPosKey: { value: keyLight.position },
    uLightPosCool: { value: rimLightCool.position },
    uLightPosWarm: { value: rimLightWarm.position },
    uLightColCool: { value: new THREE.Color(0x75d5ff) },
    uLightColWarm: { value: new THREE.Color(0xff8ab5) }
  },
  vertexShader: `
    uniform float uSimTime;
    uniform vec3 uImpactPos;
    uniform vec3 uBulletPos;
    attribute float aTearTime;
    attribute vec3 aAnchor;

    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying vec3 vViewDir;
    varying float vDiscard;
    varying float vEdgeGlow;

    void main() {
      vec3 p = position;
      vec3 norm = normal;
      vDiscard = 0.0;
      vEdgeGlow = 0.0;

      float distToImpact = length(position - uImpactPos);

      // Phase 2 Contact (1.000s - 1.080s): Elastic Indentation before skin puncture
      if (uSimTime >= 1.000 && uSimTime < 1.080) {
        float indentProgress = (uSimTime - 1.000) / 0.080;
        float dentRadius = 0.45;
        if (distToImpact < dentRadius) {
          float dentWeight = pow(1.0 - distToImpact / dentRadius, 2.0);
          p.x -= indentProgress * 0.22 * dentWeight;
        }
      }

      // Phase 2 Skin Tear & Elastic Retraction (1.080s - 1.600s)
      if (uSimTime >= 1.080) {
        if (uSimTime < aTearTime) {
          // Pre-tear elastic stretching at the rupture rim
          float dentRadius = 0.45;
          if (distToImpact < dentRadius) {
            float dentWeight = pow(1.0 - distToImpact / dentRadius, 2.0);
            p.x -= 0.22 * dentWeight;
          }
        } else {
          float dt = uSimTime - aTearTime;
          float retractDur = 0.16;
          float s = clamp(dt / retractDur, 0.0, 1.0);
          float snap = pow(s, 2.5);

          // Discard tearing middle region, gather at anchors
          if (s > 0.03 && s < 0.94) {
            vDiscard = 1.0;
          }

          p = mix(position, aAnchor, snap * 0.92);
          // Curled rim
          p += norm * sin(snap * 3.14159) * 0.09;
          vEdgeGlow = (1.0 - s);

          // Phase 3-6: Residual hanging latex ribbon oscillation at tether
          if (uSimTime > 1.60) {
            float tau = uSimTime - 1.60;
            float quiver = sin(tau * 26.0) * exp(-tau * 1.2) * 0.035;
            p.y += quiver;
          }
        }
      }

      vec4 worldPos = modelMatrix * vec4(p, 1.0);
      vWorldPos = worldPos.xyz;
      vNormal = normalize(mat3(modelMatrix) * norm);
      vViewDir = normalize(cameraPosition - worldPos.xyz);

      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    uniform float uSimTime;
    uniform vec3 uColor;
    uniform vec3 uLightPosKey;
    uniform vec3 uLightPosCool;
    uniform vec3 uLightPosWarm;
    uniform vec3 uLightColCool;
    uniform vec3 uLightColWarm;

    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying vec3 vViewDir;
    varying float vDiscard;
    varying float vEdgeGlow;

    void main() {
      if (vDiscard > 0.5) discard;

      vec3 N = normalize(vNormal);
      vec3 V = normalize(vViewDir);

      // Three-point Studio Lighting
      vec3 LKey = normalize(uLightPosKey - vWorldPos);
      float diffKey = max(0.0, dot(N, LKey));
      vec3 HKey = normalize(LKey + V);
      float specKey = pow(max(0.0, dot(N, HKey)), 60.0) * 1.4;

      // Strong dual rim-lights (cool white/cyan and magenta)
      vec3 LCool = normalize(uLightPosCool - vWorldPos);
      vec3 HCool = normalize(LCool + V);
      float specCool = pow(max(0.0, dot(N, HCool)), 45.0) * 1.8;

      vec3 LWarm = normalize(uLightPosWarm - vWorldPos);
      vec3 HWarm = normalize(LWarm + V);
      float specWarm = pow(max(0.0, dot(N, HWarm)), 45.0) * 1.4;

      // Fresnel edge highlights
      float fresnel = pow(1.0 - max(0.0, dot(V, N)), 2.8);
      vec3 rimCol = fresnel * (uLightColCool * 1.3 + uLightColWarm * 0.9);

      // Subtle subsurface translucency in red rubber
      float subSurface = pow(max(0.0, dot(V, -LKey)), 2.2) * 0.35;
      vec3 sssCol = vec3(1.0, 0.15, 0.08) * subSurface;

      vec3 base = uColor * (0.28 + diffKey * 0.65) + sssCol;
      vec3 finalColor = base + specKey * vec3(1.0) + specCool * uLightColCool + specWarm * uLightColWarm + rimCol;

      // Bright edge highlighting along torn micro-fringes
      finalColor += vEdgeGlow * vec3(1.0, 0.7, 0.7) * 0.8;

      gl_FragColor = vec4(finalColor, 0.96);
    }
  `
};

const balloonMat = new THREE.ShaderMaterial({
  uniforms: balloonShader.uniforms,
  vertexShader: balloonShader.vertexShader,
  fragmentShader: balloonShader.fragmentShader,
  side: THREE.DoubleSide,
  transparent: true
});

const balloonMesh = new THREE.Mesh(balloonGeom, balloonMat);
scene.add(balloonMesh);

// --- Free-Standing Water Mass (Inner Teardrop Core) ---
const waterGeom = createTeardropGeometry(0.985);

const waterShader = {
  uniforms: {
    uSimTime: { value: 0.0 },
    uBulletPos: { value: new THREE.Vector3(6.2, IMPACT_Y, 0.0) },
    uLightPosKey: { value: keyLight.position },
    uLightPosCool: { value: rimLightCool.position },
    uLightPosWarm: { value: rimLightWarm.position },
    uLightColCool: { value: new THREE.Color(0x75d5ff) },
    uLightColWarm: { value: new THREE.Color(0xff8ab5) }
  },
  vertexShader: `
    uniform float uSimTime;
    uniform vec3 uBulletPos;

    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying vec3 vViewDir;

    void main() {
      vec3 p = position;

      // Phase 3 (1.600s - 2.400s): Inertial Stasis capillary surface wavelets
      if (uSimTime >= 1.20 && uSimTime <= 5.20) {
        float wave = sin(p.y * 16.0 + uSimTime * 12.0) * cos(atan(p.z, p.x) * 9.0) * 0.016;
        p += normal * wave;
      }

      // Phase 4 & 5 (2.400s - 5.000s): Cavitation pressure outward expansion
      if (uSimTime >= 2.40 && uSimTime <= 5.40) {
        float distToTrack = length(vec2(p.y - (-0.20), p.z));
        float expandFactor = smoothstep(2.40, 4.40, uSimTime) * smoothstep(5.40, 4.40, uSimTime);
        float bulge = exp(-distToTrack * 1.6) * expandFactor * 0.32;
        p += normal * bulge;
      }

      vec4 worldPos = modelMatrix * vec4(p, 1.0);
      vWorldPos = worldPos.xyz;
      vNormal = normalize(mat3(modelMatrix) * normal);
      vViewDir = normalize(cameraPosition - worldPos.xyz);

      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: `
    uniform float uSimTime;
    uniform vec3 uLightPosKey;
    uniform vec3 uLightPosCool;
    uniform vec3 uLightPosWarm;
    uniform vec3 uLightColCool;
    uniform vec3 uLightColWarm;

    varying vec3 vWorldPos;
    varying vec3 vNormal;
    varying vec3 vViewDir;

    void main() {
      // Phase 6: Fluid Disintegration - bulk core smoothly atomizes into droplet cloud
      float alpha = 1.0;
      if (uSimTime > 3.80) {
        alpha = smoothstep(5.30, 3.80, uSimTime);

      if (alpha <= 0.005) discard;

      vec3 V = normalize(vViewDir);

      vec3 waterColor = vec3(0.86, 0.94, 1.0);

      vec3 LWarm = normalize(uLightPosWarm - vWorldPos);
      vec3 HWarm = normalize(LWarm + V);
      float specWarm = pow(max(0.0, dot(N, HWarm)), 50.0) * 1.7;

      float fresnel = pow(1.0 - max(0.0, dot(V, N)), 3.2);
      vec3 rimCol = fresnel * (uLightColCool * 1.3 + uLightColWarm * 1.0);

      vec3 col = waterColor * 0.22 + specKey * vec3(1.0) + specCool * uLightColCool + specWarm * uLightColWarm + rimCol;

      float finalAlpha = alpha * mix(0.40, 0.92, fresnel);
      gl_FragColor = vec4(col, finalAlpha);
    }
  `
};

    attribute float aLifetime;
    attribute float aSize;
    attribute float aType;
    attribute vec2 aSeed;

    varying float vAlpha;
    varying float vType;
    varying float vAge;
    varying vec2 vSeed;

    const float KD = 0.18;

    void main() {
      vType = aType;
      vSeed = aSeed;

        gl_Position = vec4(9999.0, 9999.0, 9999.0, 1.0);

      float g = (aType == 4.0) ? 0.14 : G;

      float expKd = exp(-kd * age);
      float oneMinusExp = 1.0 - expKd;

      vec3 gVec = vec3(0.0, -g, 0.0);
      vec3 gOverKd = gVec / kd;

      vec3 pos = aInitialPos + gOverKd * age + ((aVelocity - gOverKd) / kd) * oneMinusExp;

      pos.x += sin(age * 5.0 + aSeed.x * 28.0) * 0.015 * min(age, 2.0);
      pos.z += cos(age * 4.0 + aSeed.y * 28.0) * 0.015 * min(age, 2.0);

        vec2 rotUv = vec2(c * p.x - s * p.y, s * p.x + c * p.y) + 0.5;

        gl_FragColor = vec4(col, tex.a * vAlpha);

    }
  `

// --- Bullet Position Analytical Function ---
// Bullet travels along -X: enters right, exits left
function getBulletX(t) {
  if (t <= 0.0) return 6.2;
  // Phase 1 (0.000s - 1.000s): Approach from offscreen right (+X -> -X)
  if (t <= 1.0) {
    return 6.2 - (6.2 - 1.24) * t;
  }
  // Phase 2-4 (1.000s - 3.800s): Penetrating balloon and water mass
  if (t <= 3.8) {
    const s = (t - 1.0) / 2.8;
    return 1.24 - 2.48 * (1.12 * s - 0.12 * s * s);
  }
  // Phase 5 (3.800s - 5.000s): Exiting left boundary and flying offscreen
  if (t <= 5.0) {
    const s = (t - 3.8) / 1.2;
    return -1.24 - (6.2 - 1.24) * s;
  }
  return -6.2;
}

// --- Deterministic Render Function (simTime) ---
function renderAt(simTime) {
  const t = Math.max(0.0, Math.min(8.000, simTime));

  // 1. Bullet position, rotation, and Mach shockwave
  const bx = getBulletX(t);
  bulletGroup.position.set(bx, IMPACT_Y, 0.0);
  bulletGroup.rotation.x = t * 45.0; // deterministic rifling spin

  if (t < 5.0 && bx > -5.8 && bx < 6.0) {
    bulletGroup.visible = true;
    machMesh.visible = (t < 1.0 || t > 3.8);
    machMesh.material.opacity = (t < 1.0) ? 0.22 : 0.15;
  } else {
    bulletGroup.visible = false;
  }

  // 2. Suspension Tether knot recoil
  if (t >= 1.08) {
    const tau = t - 1.08;
    const recoil = Math.sin(tau * 30.0) * Math.exp(-tau * 2.2) * 0.12;
    knotGroup.position.y = 1.45 + recoil;
  } else {
    knotGroup.position.y = 1.45;
  }

  // 3. Update Shaders
  balloonShader.uniforms.uSimTime.value = t;
  balloonShader.uniforms.uBulletPos.value.copy(bulletGroup.position);

  waterShader.uniforms.uSimTime.value = t;
  waterShader.uniforms.uBulletPos.value.copy(bulletGroup.position);

  cavShader.uniforms.uSimTime.value = t;
  particleShader.uniforms.uSimTime.value = t;

  renderer.render(scene, camera);
}

    iconPlay.style.display = 'block';
    btnToggle.setAttribute('aria-label', 'Play');
  }
}

// --- Event Handlers ---

// Play / Pause Toggle
btnToggle.addEventListener('click', () => {
  if (currentState === STATE_PLAYING) {
    currentState = STATE_PAUSED;
    updatePlayPauseIcons(false);
  } else if (currentState === STATE_COUNTDOWN || currentState === STATE_REFIRE_HOLD) {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
    simTime = 0.000;
    scrubber.value = '0';
    currentState = STATE_PAUSED;
    updatePlayPauseIcons(false);
    renderAt(0.000);
  } else if (currentState === STATE_PAUSED) {
    currentState = STATE_PLAYING;
    updatePlayPauseIcons(true);
  } else if (currentState === STATE_ENDED) {
    simTime = 0.000;
    scrubber.value = '0';
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
    renderAt(0.000);
    currentState = STATE_PLAYING;
    updatePlayPauseIcons(true);
  }
});

// Re-fire Button (Silent Re-fire -> REFIRE_HOLD)
btnRefire.addEventListener('click', () => {
  countdownEl.style.display = 'none';
  countdownEl.textContent = '';
  simTime = 0.000;
  scrubber.value = '0';
  renderAt(0.000);
  updatePlayPauseIcons(true);
  currentState = STATE_REFIRE_HOLD;
  holdElapsed = 0.0;
});

// Speed Pills
speedPills.forEach((pill) => {
  pill.addEventListener('click', () => {
    speedPills.forEach((p) => {
      p.classList.remove('is-active');
      p.setAttribute('aria-checked', 'false');
    });
    pill.classList.add('is-active');
    pill.setAttribute('aria-checked', 'true');
    playbackSpeed = parseFloat(pill.getAttribute('data-speed'));
  });
});

// Scrubber Input
scrubber.addEventListener('input', () => {
  if (currentState === STATE_COUNTDOWN || currentState === STATE_REFIRE_HOLD) {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }
  simTime = parseFloat(scrubber.value);
  currentState = STATE_PAUSED;
  updatePlayPauseIcons(false);
  renderAt(simTime);
});

// --- Main Animation Loop ---
function tick(now) {
  requestAnimationFrame(tick);

  if (lastWallTime === null) {
    lastWallTime = now;
    renderAt(0.000);
    return;
  }

  const rawDt = (now - lastWallTime) / 1000.0;
  lastWallTime = now;
  const dt = Math.min(rawDt, 0.10); // clamp dt <= 0.1s

  if (currentState === STATE_COUNTDOWN) {
    countdownElapsed += dt;
    if (countdownElapsed < 1.000) {
      countdownEl.style.display = 'block';
      countdownEl.textContent = '3';
    } else if (countdownElapsed < 2.000) {
      countdownEl.style.display = 'block';
      countdownEl.textContent = '2';
    } else if (countdownElapsed < 3.000) {
      countdownEl.style.display = 'block';
      countdownEl.textContent = '1';
    } else {
      countdownEl.style.display = 'none';
      countdownEl.textContent = '';
      currentState = STATE_PLAYING;
      updatePlayPauseIcons(true);
      const extra = countdownElapsed - 3.000;
      simTime = Math.min(DURATION, extra * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      renderAt(simTime);
      return;
    }
    simTime = 0.000;
    scrubber.value = '0';
    renderAt(0.000);

  } else if (currentState === STATE_REFIRE_HOLD) {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
    holdElapsed += dt;
    if (holdElapsed >= 1.000) {
      currentState = STATE_PLAYING;
      updatePlayPauseIcons(true);
      const extra = holdElapsed - 1.000;
      simTime = Math.min(DURATION, extra * playbackSpeed);
      scrubber.value = simTime.toFixed(3);
      renderAt(simTime);
      return;
    }
    simTime = 0.000;
    scrubber.value = '0';
    renderAt(0.000);

  } else if (currentState === STATE_PLAYING) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    scrubber.value = simTime.toFixed(3);
    renderAt(simTime);

    if (simTime >= DURATION) {
      simTime = DURATION;
      scrubber.value = DURATION.toFixed(3);
      currentState = STATE_ENDED;
      updatePlayPauseIcons(false);
    }

  } else if (currentState === STATE_PAUSED || currentState === STATE_ENDED) {
    renderAt(simTime);
  }
}

// Initial resting render & kickoff
renderAt(0.000);
requestAnimationFrame(tick);
</script>
</body>
