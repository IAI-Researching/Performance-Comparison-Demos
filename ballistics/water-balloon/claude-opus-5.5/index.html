<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballistics: Water Balloon at 15,000 FPS</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ===========================================================================
   * 0. DOM references and timeline constants
   * ======================================================================== */
  const DURATION = 8.000;
  const SEED = 42;
  const canvas = document.getElementById('stage');
  const countdownEl = document.getElementById('countdown');
  const btnRefire = document.getElementById('btn-refire');
  const btnToggle = document.getElementById('btn-toggle');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const scrubber = document.getElementById('scrubber');
  const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

  /* ===========================================================================
   * 1. Deterministic PRNG (Mulberry32, seed 42). Every procedural quantity in
   *    the scene (seam jaggedness, particle initial states, noise offsets) is
   *    drawn from this generator once, in a fixed order, at start-up.
   * ======================================================================== */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let rng = mulberry32(SEED);
  function resetRng() { rng = mulberry32(SEED); }
  const rnd = () => rng();
  const rrange = (a, b) => a + (b - a) * rng();
  function rnorm() {
    let u = rng();
    if (u < 1e-12) u = 1e-12;
    const v = rng();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.283185307179586 * v);
  }

  /* ===========================================================================
   * 2. Math helpers
   * ======================================================================== */
  const TWO_PI = Math.PI * 2;
  const clamp = (x, a, b) => (x < a ? a : (x > b ? b : x));
  const mix = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const vlen = (v) => Math.hypot(v[0], v[1], v[2]);
  const vnorm = (v) => { const l = vlen(v) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };
  const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const vscale = (v, s) => [v[0] * s, v[1] * s, v[2] * s];
  const glf = (x) => (+x).toFixed(6);
  const glv3 = (v) => 'vec3(' + glf(v[0]) + ', ' + glf(v[1]) + ', ' + glf(v[2]) + ')';

  /* ===========================================================================
   * 3. Slow-motion time warp.
   *    simTime (presentation seconds) -> tau (physical "slow-mo" time).
   *    The camera speed-ramps: fast during the approach, ultra slow-mo while the
   *    bullet is inside the water (tau == simTime there), then ramps up so that
   *    gravity can visibly pull the disintegrating water down.
   *    rate k(s) is piecewise constant with smoothstep transitions, so tau(s)
   *    has a closed form (integral of smoothstep = x^3 - x^4/2).
   * ======================================================================== */
  const TW = { A0: 0.80, A1: 1.00, B0: 3.95, B1: 5.30, K1: 8.0, K3: 4.0 };
  const sInt = (x) => { x = clamp(x, 0, 1); return x * x * x - 0.5 * x * x * x * x; };
  function tauOf(s) {
    const { A0, A1, B0, B1, K1, K3 } = TW;
    if (s >= A1) {
      if (s <= B0) return s;
      if (s <= B1) return s + (K3 - 1) * (B1 - B0) * sInt((s - B0) / (B1 - B0));
      return B1 + (K3 - 1) * (B1 - B0) * 0.5 + K3 * (s - B1);
    }
    const full = (A1 - A0) * (K1 + 1) * 0.5;
    if (s >= A0) {
      const part = K1 * (s - A0) + (1 - K1) * (A1 - A0) * sInt((s - A0) / (A1 - A0));
      return A1 - (full - part);
    }
    return A1 - full - K1 * (A0 - s);
  }
  function rateOf(s) {
    const { A0, A1, B0, B1, K1, K3 } = TW;
    if (s < A0) return K1;
    if (s < A1) return K1 + (1 - K1) * smoothstep(A0, A1, s);
    if (s < B0) return 1;
    if (s < B1) return 1 + (K3 - 1) * smoothstep(B0, B1, s);
    return K3;
  }

  /* ===========================================================================
   * 4. Balloon profile: teardrop with hydrostatic bottom sag.
   *    x = A sin(th) sin(th/2)^m  (pinched upper neck, wide bottom)
   *    y = B cos(th) for the top half, flattened (|cos|^flat) for the bottom.
   *    The latex adds a tied neck tube blended in with a smooth-max fillet.
   * ======================================================================== */
  const PROF = { A: 1.28, B: 1.04, m: 1.15, sag: 0.6, neckR: 0.062, neckLen: 0.19, fillet: 0.13, capH: 0.016 };
  const WATER_INSET = 0.006;
  const NECK_TOP = PROF.B + PROF.neckLen;

  function bodyCurve(N) {
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const th = Math.PI * i / N;
      const c = Math.cos(th);
      const u = -c;   // hydrostatic sag: C1-continuous flattening of the lower half
      const y = c >= 0 ? PROF.B * c : -PROF.B * (u + PROF.sag * u * u * (1 - u));
      const r = PROF.A * Math.sin(th) * Math.pow(Math.sin(th / 2), PROF.m);
      pts.push([r, y]);
    }
    pts[0][0] = 0; pts[N][0] = 0;
    return pts;
  }
  const BODY_PTS = bodyCurve(3000);
  function bodyRhoAt(y) {
    // BODY_PTS is ordered by decreasing y
    if (y >= BODY_PTS[0][1] || y <= BODY_PTS[BODY_PTS.length - 1][1]) return 0;
    let lo = 0, hi = BODY_PTS.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (BODY_PTS[mid][1] > y) lo = mid; else hi = mid; }
    const a = BODY_PTS[lo], b = BODY_PTS[hi];
    const f = (y - a[1]) / (b[1] - a[1] || 1e-9);
    return mix(a[0], b[0], f);
  }
  function smax(a, b, k) { const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.max(a, b) + h * h * k * 0.25; }

  function latexPolyline() {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const a = (i / 10) * Math.PI / 2;
      pts.push([PROF.neckR * Math.sin(a), NECK_TOP + PROF.capH * Math.cos(a)]);
    }
    const ySwitch = 0.72, NS = 700;
    for (let i = 1; i <= NS; i++) {
      const y = NECK_TOP + (ySwitch - NECK_TOP) * (i / NS);
      pts.push([smax(bodyRhoAt(y), PROF.neckR, PROF.fillet), y]);
    }
    for (const p of BODY_PTS) if (p[1] < ySwitch - 1e-6) pts.push([p[0], p[1]]);
    return pts;
  }

  // Resample a (rho, y) polyline uniformly by arc length -> profile table.
  function resampleProfile(pts, N) {
    const n = pts.length;
    const cum = new Float64Array(n);
    for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const S = cum[n - 1];
    const nrm = pts.map((p, i) => {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
      const dr = b[0] - a[0], dy = b[1] - a[1];
      const l = Math.hypot(dr, dy) || 1;
      return [-dy / l, dr / l];
    });
    nrm[0] = [0, 1]; nrm[n - 1] = [0, -1];
    const P = { S, N, rho: new Float64Array(N), y: new Float64Array(N), nr: new Float64Array(N), ny: new Float64Array(N) };
    let j = 0;
    for (let k = 0; k < N; k++) {
      const s = S * k / (N - 1);
      while (j < n - 2 && cum[j + 1] < s) j++;
      const seg = cum[j + 1] - cum[j];
      const f = seg > 0 ? clamp((s - cum[j]) / seg, 0, 1) : 0;
      P.rho[k] = mix(pts[j][0], pts[j + 1][0], f);
      P.y[k] = mix(pts[j][1], pts[j + 1][1], f);
      const a = mix(nrm[j][0], nrm[j + 1][0], f), b = mix(nrm[j][1], nrm[j + 1][1], f);
      const l = Math.hypot(a, b) || 1;
      P.nr[k] = a / l; P.ny[k] = b / l;
    }
    P.rho[0] = 0; P.rho[N - 1] = 0;
    P.nr[0] = 0; P.ny[0] = 1; P.nr[N - 1] = 0; P.ny[N - 1] = -1;
    return P;
  }
  function sampleProfile(P, t) {
    const f = clamp(t, 0, 1) * (P.N - 1);
    const i = Math.min(Math.floor(f), P.N - 2);
    const u = f - i;
    let nr = mix(P.nr[i], P.nr[i + 1], u), ny = mix(P.ny[i], P.ny[i + 1], u);
    const l = Math.hypot(nr, ny) || 1;
    return { rho: mix(P.rho[i], P.rho[i + 1], u), y: mix(P.y[i], P.y[i + 1], u), nr: nr / l, ny: ny / l };
  }
  function findT(P, pred) { for (let k = 0; k < P.N; k++) if (pred(P.rho[k], P.y[k])) return k / (P.N - 1); return 1; }

  const LATEX_P = resampleProfile(latexPolyline(), 2048);
  const WATER_P = resampleProfile(BODY_PTS, 2048);

  // Bullet path: horizontal line through the lower, fuller part of the teardrop.
  const YB = -0.30;
  const T_B = findT(LATEX_P, (r, y) => y <= YB);          // latex seam parameter at impact height
  const XE = sampleProfile(LATEX_P, T_B).rho;                // entry (right) / exit (left) boundary x
  const TOP_T = findT(LATEX_P, (r, y) => y < PROF.B && r > 0.115); // where the upper skin gathers
  const BOT_T = 0.935;                                        // lower skin gathers into a cap
  const LOW_CENTER = [0, sampleProfile(LATEX_P, 0.975).y, 0];

  /* ===========================================================================
   * 5. Bullet kinematics (physical time tau).
   *    Air: constant speed. Water: drag ~ v^2  ->  v(d) = VE exp(-d/L).
   *    L is solved so the nose reaches the exit boundary at simTime 3.800.
   * ======================================================================== */
  const BUL = { r: 0.05, len: 0.38, VE: 0.85, VA: 7.6, TWIST: 3.3 };
  TW.K1 = BUL.VA / BUL.VE;
  const TAU_C = tauOf(1.0);                 // nose touches the latex at simTime 1.000
  const TAU_X_TARGET = tauOf(3.8);          // nose leaves the water at simTime 3.800
  const RB = BUL.r;
  const VE = BUL.VE;
  const LDRAG = (function solveDrag() {
    const chord = 2 * XE, T = TAU_X_TARGET - TAU_C;
    let lo = 0.05, hi = 2000;
    const f = (L) => (L / VE) * (Math.exp(chord / L) - 1) - T;
    for (let i = 0; i < 200; i++) { const mid = 0.5 * (lo + hi); if (f(mid) > 0) lo = mid; else hi = mid; }
    return 0.5 * (lo + hi);
  })();
  const TAU_X = TAU_C + (LDRAG / VE) * (Math.exp(2 * XE / LDRAG) - 1);
  const VX = VE * Math.exp(-2 * XE / LDRAG);
  const DP = 0.085;                                                    // elastic indentation at rupture
  const TAU_P = TAU_C + (LDRAG / VE) * (Math.exp(DP / LDRAG) - 1);   // puncture time
  const X0 = XE + VE * (TAU_C - tauOf(0));                            // nose x at simTime 0 (off-screen)

  function noseX(tau) {
    if (tau <= TAU_C) return XE + VE * (TAU_C - tau);
    if (tau <= TAU_X) return XE - LDRAG * Math.log(1 + VE * (tau - TAU_C) / LDRAG);
    return -XE - VX * (tau - TAU_X);
  }
  function noseSpeed(tau) {
    if (tau <= TAU_C) return VE;
    if (tau <= TAU_X) return VE / (1 + VE * (tau - TAU_C) / LDRAG);
    return VX;
  }

  /* ===========================================================================
   * 6. Analytic fluid model shared by JS (emitters) and GLSL (meshes/particles)
   * ======================================================================== */
  const TEAR_DUR = 0.14;      // tear front runs around the seam
  const RET_DUR = 0.36;       // each meridian's skin snaps back to its pole
  const TAU_R = TAU_P + TEAR_DUR + RET_DUR * 0.6;   // water loses its support
  const GRAV = 0.0165;        // gravity in slow-mo units
  const CAV = { R0: 0.07, R1: 0.30, TG: 0.85 };
  const EXP = { MAX: 0.42, T: 4.0 };
  const TD0 = tauOf(5.0), TD1 = tauOf(7.7);          // breakup window
  const RT_MAX = 0.13;
  const DOME_H = 0.07, DOME_W = 0.24, LIP_K = 0.45;
  const DIMW = 0.10 + 1.5 * DP;

  const fallAt = (tau) => { const d = Math.max(tau - TAU_R, 0); return 0.5 * GRAV * d * d; };
  const passT = (x) => { const D = clamp(XE - x, 0, 2 * XE + 0.3); return TAU_C + (LDRAG / VE) * (Math.exp(D / LDRAG) - 1); };
  function cavR(x, tau) {
    const D = clamp(XE - x, 0, 2 * XE + 0.3);
    const tp = TAU_C + (LDRAG / VE) * (Math.exp(D / LDRAG) - 1);
    const a = tau - tp;
    if (a <= 0) return 0;
    const v = Math.exp(-D / LDRAG);
    const rmax = CAV.R0 + CAV.R1 * v * v;
    const r = RB * 1.08 * Math.sqrt(Math.min(a / 0.06, 1)) + Math.max(rmax - RB, 0) * (1 - Math.exp(-a / CAV.TG));
    return r * smoothstep(TAU_P, TAU_P + 0.03, tau);
  }
  const expandAt = (tau) => { const d = Math.max(tau - TAU_X, 0); return EXP.MAX * (1 - Math.exp(-d / EXP.T)); };
  const domeAt = (tau) => DOME_H * smoothstep(TAU_X - 0.7, TAU_X, tau);
  function entryCenter(tau) { const rc = cavR(XE, tau); return [XE + LIP_K * rc, YB - fallAt(tau), 0]; }
  function exitCenter(tau) {
    const rc = cavR(-XE, tau);
    return [-XE - domeAt(tau) - LIP_K * rc, YB + fallAt(TAU_X) - fallAt(tau), 0];
  }

  /* ===========================================================================
   * 7. Studio lighting: key, fill and two strong rim lights (cool white +
   *    cyan/magenta tinted strip). The same rig drives the THREE lights and the
   *    procedural studio environment used for reflections / refraction.
   * ======================================================================== */
  const LIGHTS = {
    key:  { dir: vnorm([-0.55, 0.62, 0.56]), col: [1.00, 0.95, 0.88], I: 2.6 },
    fill: { dir: vnorm([0.50, -0.02, 0.86]), col: [0.76, 0.84, 1.00], I: 0.42 },
    rimA: { dir: vnorm([-0.80, 0.20, -0.56]), col: [0.86, 0.93, 1.00], I: 3.2 },
    rimB: { dir: vnorm([0.82, 0.12, -0.56]), col: [0.58, 0.90, 1.00], I: 2.6 },
  };
  const lc = (l) => vscale(l.col, l.I);
  function boxFrame(c) {
    const u = vnorm(vcross([0, 1, 0], c));
    const v = vcross(c, u);
    return { c, u, v };
  }
  const BOX_KEY = boxFrame(LIGHTS.key.dir), BOX_FILL = boxFrame(LIGHTS.fill.dir);
  const BOX_RIMA = boxFrame(LIGHTS.rimA.dir), BOX_RIMB = boxFrame(LIGHTS.rimB.dir);

  // Seeded offsets for every GLSL noise field (keeps all procedural detail tied to seed 42).
  resetRng();
  const seedVec = () => [rrange(-40, 40), rrange(-40, 40), rrange(-40, 40)];
  const SEEDS = { A: seedVec(), B: seedVec(), C: seedVec(), D: seedVec(), E: seedVec(), F: seedVec() };

  const GLSL_COMMON = `
#define PI 3.141592653589793
const vec3 L_KEY = ${glv3(LIGHTS.key.dir)};  const vec3 C_KEY = ${glv3(lc(LIGHTS.key))};

    const along = u * S.len * crown;
    const rad = S.r0 + along * S.flare + S.curl * along * along;
    return [S.base[0] + S.axis * along, S.base[1] + Math.cos(th) * rad - S.droop * u * u, S.base[2] + Math.sin(th) * rad];
  }
  function sheetDir(S, th) {

    const M = { p0: [], v0: [], t: [], k: [] };   // mist (kind 1)

      const S = entrySheet(t0);

      const p = sheetPoint(S, th, 1.0), d = sheetDir(S, th);

      const sp = rrange(0.4, 1.3) * (1 - 0.5 * al / 0.75), j = (0.03 + cavR(-XE, t0) * 0.8) * Math.sqrt(rnd());
      push(M, [c[0], c[1] + j * Math.cos(psi), c[2] + j * Math.sin(psi)], vscale(coneDir(-1, al, psi), sp),
        [t0, rrange(2.0, 4.0), rrange(0.35, 0.9), rrange(0.015, 0.04)], [1, rrange(1.0, 2.0), rrange(0.08, 0.22), rnd()]);

      push(D, p, n, [0, 60, rrange(0.004, 0.02), sizePow(0.006, 0.03, 1.6)], [3, rnd(), rnd(), rnd()]);

  }

  const DROP_VS = GLSL_NOISE + GLSL_PHYS + `
uniform float uTau;
uniform float uPixScale;
uniform vec2 uViewport;
attribute vec3 aP0;
attribute vec3 aV0;
attribute vec4 aT;
attribute vec4 aK;
varying vec2 vDir;
varying float vRatio;
varying float vAlpha;
varying float vKind;
varying float vBright;
void main() {

  vec3 vel = vec3(0.0);

  } else if (kind < 2.5) {
    age = uTau - aT.x;
    if (age < 0.0 || uTau > aT.y) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
    float x = aP0.x + aV0.x * age;
    float th = aP0.y + aV0.y * age;
    float rr = (cavR(aP0.x, uTau) + expandAt(uTau) * 0.8) * aP0.z;
    pos = vec3(x, axisYRest(aP0.x) - fallAt(uTau) + rr * cos(th), rr * sin(th));

  } else {
    float tb = breakTime(aP0) + aK.y * 0.25;
    age = uTau - tb;

  float len = min(length(dpx), diam * 3.0);
  float total = diam + len;
  gl_PointSize = min(total, 200.0);
  vDir = len > 0.01 ? normalize(dpx) : vec2(1.0, 0.0);
  vRatio = diam / total;
  vAlpha = fade * min(1.0, (diamTrue * diamTrue) / (diam * diam) + 0.25);

`;
  const DROP_FS = GLSL_COMMON + `
uniform sampler2D uSprite;
varying vec2 vDir;
varying float vRatio;
varying float vAlpha;
varying float vKind;
varying float vBright;
void main() {
  vec2 pc = gl_PointCoord * 2.0 - 1.0;
  pc.y = -pc.y;
  vec2 d = vDir;

  vec2 q = vec2(dot(pc, d), dot(pc, pd));
  vec2 e = vec2(q.x, q.y / max(vRatio, 0.05));

  if (vKind > 1.5 && vKind < 2.5) {

  const MIST_VS = GLSL_NOISE + GLSL_PHYS + `
uniform float uTau;
uniform float uPixScale;
attribute vec3 aP0;
attribute vec3 aV0;
attribute vec4 aT;
attribute vec4 aK;
varying float vA;
varying vec3 vTint;
void main() {

`;

varying float vA;
varying vec3 vTint;
void main() {

  /* ===========================================================================
   * 11. Scene assembly

  const CAM_FOV = 35, CAM_D = 9.2;
  const ANCHOR_Y = 9.0;
  const TAU_LOW = TAU_P + TEAR_DUR + RET_DUR * 0.85;
  let renderer = null, scene = null, camera = null;
  const G = {};

  function premulMat(opts) {
    return new THREE.ShaderMaterial(Object.assign({
      transparent: true, depthWrite: false, depthTest: true,
      blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
      blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
      blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
    }, opts));

  function addMesh(geo, mat, order) {

    m.renderOrder = order;
    m.frustumCulled = false;
    scene.add(m);

  }
  function pointsGeometry(A) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(A.p0, 3));
    g.setAttribute('aP0', new THREE.Float32BufferAttribute(A.p0, 3));
    g.setAttribute('aV0', new THREE.Float32BufferAttribute(A.v0, 3));
    g.setAttribute('aT', new THREE.Float32BufferAttribute(A.t, 4));
    g.setAttribute('aK', new THREE.Float32BufferAttribute(A.k, 4));
    return g;
  }

  function initGraphics() {
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.setClearColor(0x000000, 0);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(CAM_FOV, window.innerWidth / Math.max(1, window.innerHeight), 0.1, 100);

    // Three-point studio rig with dual rim lights (also mirrored inside the custom shaders).
    const mkLight = (L) => {
      const d = new THREE.DirectionalLight(new THREE.Color(L.col[0], L.col[1], L.col[2]), L.I);
      d.position.set(L.dir[0] * 10, L.dir[1] * 10, L.dir[2] * 10);
      scene.add(d);
      return d;
    };
    G.lights = { key: mkLight(LIGHTS.key), fill: mkLight(LIGHTS.fill), rimA: mkLight(LIGHTS.rimA), rimB: mkLight(LIGHTS.rimB) };
    scene.add(new THREE.HemisphereLight(0x20242e, 0x050506, 0.5));

    // Latex skin (inner wall first, outer wall last).
    const prof = [];
    for (let k = 0; k < NPROF; k++) {
      const pr = sampleProfile(LATEX_P, k / (NPROF - 1));
      prof.push(new THREE.Vector4(pr.rho, pr.y, pr.nr, pr.ny));
    }
    G.latexU = {
      uProf: { value: prof }, uTau: { value: 0 }, uDimple: { value: new THREE.Vector2(0, 0.1) },
      uKnotOff: { value: new THREE.Vector3() }, uLowOff: { value: new THREE.Vector3() }, uLowRot: { value: 0 },
    };
    const latexGeo = latexGeometry();
    G.latexBack = addMesh(latexGeo, premulMat({ uniforms: G.latexU, vertexShader: LATEX_VS, fragmentShader: LATEX_FS, side: THREE.BackSide, depthWrite: true }), 1);
    G.latexFront = addMesh(latexGeo, premulMat({ uniforms: G.latexU, vertexShader: LATEX_VS, fragmentShader: LATEX_FS, side: THREE.FrontSide, depthWrite: true }), 5);

    // Knot + tether.
    G.knot = addMesh(knotGeometry(), new THREE.ShaderMaterial({ vertexShader: KNOT_VS, fragmentShader: LATEX_FS }), 0);
    G.tether = addMesh(new THREE.CylinderGeometry(0.0065, 0.0065, 1, 8, 1, true),
      new THREE.MeshStandardMaterial({ color: 0xd9d4cb, roughness: 0.5, metalness: 0.0 }), 0);

    // Free-standing water body.
    const waterGeo = waterGeometry();
    const tauU = { value: 0 }, opU = { value: 1 };
    G.waterTau = tauU;
    G.waterBack = addMesh(waterGeo, premulMat({ uniforms: { uTau: tauU, uOpacity: opU, uBackPass: { value: 1 } }, vertexShader: WATER_VS, fragmentShader: WATER_FS, side: THREE.BackSide }), 2);
    G.waterFront = addMesh(waterGeo, premulMat({ uniforms: { uTau: tauU, uOpacity: opU, uBackPass: { value: 0 } }, vertexShader: WATER_VS, fragmentShader: WATER_FS, side: THREE.FrontSide }), 4);

    // Cavitation vapour tunnel.
    G.cavU = { uTau: { value: 0 }, uOpacity: { value: 0 } };
    G.cavity = addMesh(gridGeometry(48, 160, 'aCav'), premulMat({ uniforms: G.cavU, vertexShader: CAVITY_VS, fragmentShader: CAVITY_FS, side: THREE.BackSide }), 3);

    // Backward (entry) and forward (exit) conical fluid sheets.
    const sheetMesh = () => {
      const u = {
        uBase: { value: new THREE.Vector3() }, uAxis: { value: 1 }, uR0: { value: 0 }, uLen: { value: 0 }, uFlare: { value: 1 },
        uCurl: { value: 0 }, uDroop: { value: 0 }, uCrownN: { value: 12 }, uCrownPh: { value: 0 },
        uBreak: { value: 0 }, uOpacity: { value: 0 }, uSeed: { value: 0 },
      };
      const m = addMesh(gridGeometry(96, 28, 'aSh'), premulMat({ uniforms: u, vertexShader: SHEET_VS, fragmentShader: SHEET_FS, side: THREE.DoubleSide }), 6);

    G.sheetExit = sheetMesh();

    G.bulletU = { uWet: { value: 0 } };

    G.bulletSpin = new THREE.Group();
    const bullet = new THREE.Mesh(bulletGeometry(), new THREE.ShaderMaterial({ uniforms: G.bulletU, vertexShader: BULLET_VS, fragmentShader: BULLET_FS }));
    bullet.rotation.z = -Math.PI / 2;        // lathe +Y -> world +X (nose at the group origin, pointing -X)
    bullet.frustumCulled = false;
    G.bulletSpin.add(bullet);
    G.bulletRoot.add(G.bulletSpin);

    G.trail = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), premulMat({ uniforms: G.trailU, vertexShader: TRAIL_VS, fragmentShader: TRAIL_FS }));
    G.trail.renderOrder = 6;
    G.trail.frustumCulled = false;
    G.bulletRoot.add(G.trail);
    scene.add(G.bulletRoot);

    const parts = buildParticles(waterGeo);
    G.dropU = { uTau: { value: 0 }, uPixScale: { value: 500 }, uViewport: { value: new THREE.Vector2(1, 1) }, uSprite: { value: makeDropSprite() } };
    G.mistU = { uTau: { value: 0 }, uPixScale: { value: 500 } };
    G.mist = new THREE.Points(pointsGeometry(parts.M), premulMat({ uniforms: G.mistU, vertexShader: MIST_VS, fragmentShader: MIST_FS }));
    G.mist.renderOrder = 7; G.mist.frustumCulled = false; scene.add(G.mist);
    G.drops = new THREE.Points(pointsGeometry(parts.D), premulMat({ uniforms: G.dropU, vertexShader: DROP_VS, fragmentShader: DROP_FS }));

    G.particleCount = parts.D.t.length / 4 + parts.M.t.length / 4;

    renderer.compile(scene, camera);
  }

  function resize() {
    if (!renderer) return;
    const w = Math.max(1, window.innerWidth), h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const halfT = Math.tan(CAM_FOV * Math.PI / 360);
    camera.position.set(0, 0, Math.max(CAM_D, 2.75 / (halfT * camera.aspect)));
    camera.lookAt(0, 0, 0);
    camera.updateProjectionMatrix();
    const v = new THREE.Vector2();
    renderer.getDrawingBufferSize(v);
    const pix = v.y / (2 * halfT);
    G.dropU.uPixScale.value = pix;
    G.dropU.uViewport.value.set(v.x, v.y);
    G.mistU.uPixScale.value = pix;
  }

  /* ===========================================================================
   * 12. renderAt(simTime): pure function of simTime -> frame
   * ======================================================================== */
  function knotOffset(tau) {
    const a = Math.max(0, tau - TAU_R);
    const e = Math.exp(-0.22 * a);
    // tether + neck spring back once the water's weight is gone
    return [0.03 * e * Math.sin(1.7 * a), 0.085 * (1 - Math.exp(-0.55 * a) * Math.cos(2.4 * a)), 0.018 * e * Math.sin(1.25 * a)];
  }
  function lowerRemnant(tau) {
    const a = Math.max(0, tau - TAU_LOW);
    return { off: [-0.04 * a, -(0.5 * GRAV * a * a + 0.16 * a), 0.02 * a], rot: 0.35 * a };
  }
  function setSheet(mesh, S) {
    if (!S || S.opacity < 0.002) { mesh.visible = false; return; }
    const u = mesh.userData.u;
    mesh.visible = true;
    u.uBase.value.set(S.base[0], S.base[1], S.base[2]);
    u.uAxis.value = S.axis; u.uR0.value = S.r0; u.uLen.value = S.len; u.uFlare.value = S.flare;
    u.uCurl.value = S.curl; u.uDroop.value = S.droop; u.uCrownN.value = S.crownN; u.uCrownPh.value = S.crownPh;
    u.uBreak.value = S.brk; u.uOpacity.value = S.opacity; u.uSeed.value = S.seed;
  }

  function renderAt(simT) {
    if (!renderer) return;
    const s = clamp(+simT || 0, 0, DURATION);
    const tau = tauOf(s);

    // Bullet
    const xn = noseX(tau);
    G.bulletRoot.position.set(xn, YB, 0);
    G.bulletRoot.visible = xn > -16 && xn < 14;
    G.bulletSpin.rotation.x = TWO_PI * (X0 - xn) / BUL.TWIST;
    G.bulletU.uWet.value = smoothstep(TAU_P, TAU_P + 0.06, tau);
    const inAir = tau < TAU_P || tau > TAU_X + 0.05;
    const tlen = inAir ? clamp(noseSpeed(tau) * rateOf(s) * 0.075, 0, 0.7) : 0;
    G.trail.visible = tlen > 0.03;
    G.trail.scale.set(Math.max(tlen, 1e-3), BUL.r * 1.7, 1);
    G.trail.position.set(BUL.len + tlen * 0.5, 0, 0);
    G.trailU.uStrength.value = smoothstep(0.03, 0.25, tlen);

    // Latex: elastic indentation, rupture, tear and retraction
    G.latexU.uTau.value = tau;
    let dd = 0;
    if (tau > TAU_C && tau <= TAU_P) dd = XE - noseX(tau);
    else if (tau > TAU_P) dd = DP * Math.exp(-(tau - TAU_P) / 0.02);
    G.latexU.uDimple.value.set(dd < 1e-4 ? 0 : dd, 0.10 + 1.5 * Math.min(dd, DP));
    const ko = knotOffset(tau);
    G.latexU.uKnotOff.value.set(ko[0], ko[1], ko[2]);
    const lr = lowerRemnant(tau);
    G.latexU.uLowOff.value.set(lr.off[0], lr.off[1], lr.off[2]);
    G.latexU.uLowRot.value = lr.rot;

    // Knot + tether follow the recoiling neck
    G.knot.position.set(ko[0], NECK_TOP - 0.004 + ko[1], ko[2]);
    const tb = new THREE.Vector3(ko[0], NECK_TOP + KNOT_H - 0.02 + ko[1], ko[2]);
    const tt = new THREE.Vector3(0, ANCHOR_Y, 0);
    const dir = tt.clone().sub(tb);
    const len = dir.length();
    G.tether.position.copy(tb).addScaledVector(dir, 0.5);
    G.tether.scale.set(1, len, 1);
    G.tether.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());

    // Water body, cavity, splash sheets
    const wet = tau >= TAU_P - 0.002;
    G.waterTau.value = tau;
    G.waterBack.visible = wet;
    G.waterFront.visible = wet;
    G.cavU.uTau.value = tau;
    G.cavU.uOpacity.value = smoothstep(TAU_P, TAU_P + 0.1, tau) * (1 - smoothstep(TD0, TD0 + 2.5, tau)) * 0.9;
    G.cavity.visible = G.cavU.uOpacity.value > 0.002;
    setSheet(G.sheetEntry, entrySheet(tau));
    setSheet(G.sheetExit, exitSheet(tau));

    // Particles
    G.dropU.uTau.value = tau;
    G.mistU.uTau.value = tau;

    renderer.render(scene, camera);
  }

  /* ===========================================================================
   * 13. Playback state machine: COUNTDOWN, PLAYING, PAUSED, REFIRE_HOLD, ENDED
   * ======================================================================== */
  const ST = { COUNTDOWN: 'COUNTDOWN', PLAYING: 'PLAYING', PAUSED: 'PAUSED', REFIRE_HOLD: 'REFIRE_HOLD', ENDED: 'ENDED' };
  let state = null;              // null until the first animation frame after the initial render
  let simTime = 0;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;
  let holdElapsed = 0;
  let lastTs = null;
  let needsRender = false;

  function showCountdown(n) {
    const txt = String(n);
    if (countdownEl.style.display !== 'block') countdownEl.style.display = 'block';
    if (countdownEl.textContent !== txt) countdownEl.textContent = txt;
  }
  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }
  function setPlayingIcons(playing) {
    iconPause.style.display = playing ? 'block' : 'none';
    iconPlay.style.display = playing ? 'none' : 'block';
    btnToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  function setScrubber() { scrubber.value = simTime.toFixed(3); }
  function enterPlaying() { state = ST.PLAYING; hideCountdown(); setPlayingIcons(true); }
  function enterPaused() { state = ST.PAUSED; setPlayingIcons(false); }
  function enterEnded() { state = ST.ENDED; setPlayingIcons(false); }

  function advance(dt) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    if (simTime >= DURATION) {
      simTime = DURATION;
      scrubber.value = DURATION.toFixed(3);
      renderAt(simTime);
      needsRender = false;
      enterEnded();
      return;
    }
    setScrubber();
    needsRender = true;
  }

  function frame(ts) {
    const now = typeof ts === 'number' ? ts : performance.now();
    if (lastTs === null) lastTs = now;
    const dtWall = Math.max(0, (now - lastTs) / 1000);
    lastTs = now;

    if (state === null) {
      // first rAF after the initial resting scene was rendered
      state = ST.COUNTDOWN;
      countdownElapsed = 0;
      showCountdown(3);
      setPlayingIcons(true);
    } else if (state === ST.COUNTDOWN) {
      countdownElapsed += dtWall;                   // wall clock, independent of playbackSpeed
      if (countdownElapsed >= 3.0) {
        const over = countdownElapsed - 3.0;
        enterPlaying();
        advance(Math.min(over, 0.1));
      } else {
        showCountdown(3 - Math.floor(countdownElapsed));
      }
    } else if (state === ST.REFIRE_HOLD) {
      holdElapsed += dtWall;                        // wall clock, independent of playbackSpeed
      if (holdElapsed >= 1.0) {
        const over = holdElapsed - 1.0;
        enterPlaying();
        advance(Math.min(over, 0.1));
      }
    } else if (state === ST.PLAYING) {
      advance(Math.min(dtWall, 0.1));
    }

    if (needsRender) {
      needsRender = false;
      renderAt(simTime);
    }
    requestAnimationFrame(frame);
  }

  btnToggle.addEventListener('click', () => {
    if (state === ST.PLAYING) {
      enterPaused();
    } else if (state === ST.COUNTDOWN || state === ST.REFIRE_HOLD || state === null) {
      hideCountdown();
      simTime = 0;
      setScrubber();
      renderAt(simTime);
      enterPaused();
    } else if (state === ST.PAUSED) {
      if (simTime >= DURATION) { simTime = 0; setScrubber(); renderAt(simTime); }
      enterPlaying();
    } else if (state === ST.ENDED) {
      simTime = 0;
      setScrubber();
      renderAt(simTime);
      enterPlaying();
    }
  });

  pills.forEach((pill) => {
    pill.addEventListener('click', () => {
      playbackSpeed = parseFloat(pill.getAttribute('data-speed')) || 1.0;
      pills.forEach((p) => {
        const on = p === pill;
        p.classList.toggle('is-active', on);
        p.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
  });

  function onScrub() {
    if (state === ST.COUNTDOWN || state === ST.REFIRE_HOLD || state === null) hideCountdown();
    const v = parseFloat(scrubber.value);
    simTime = clamp(isFinite(v) ? v : 0, 0, DURATION);
    renderAt(simTime);
    needsRender = false;
    enterPaused();
  }
  scrubber.addEventListener('input', onScrub);
  scrubber.addEventListener('change', onScrub);

  btnRefire.addEventListener('click', () => {
    hideCountdown();
    simTime = 0;
    scrubber.value = '0';
    renderAt(0);
    needsRender = false;
    setPlayingIcons(true);
    holdElapsed = 0;
    state = ST.REFIRE_HOLD;
  });

  window.addEventListener('resize', () => {
    resize();
    renderAt(simTime);
  });

  /* ===========================================================================
   * 14. Boot: build, render the resting scene at simTime 0, then start the loop
   * ======================================================================== */
  try {
    initGraphics();
  } catch (err) {
    renderer = null;
    if (window.console) console.warn('WebGL initialisation failed:', err && err.message);
  }
  renderAt(0);
  requestAnimationFrame(frame);

  // Read-only hooks for inspection / automated checks.
  Object.defineProperty(window, '__balloonSim', {
    value: Object.freeze({
      renderAt,
      tauOf,
      get state() { return state; },
      get simTime() { return simTime; },
      get playbackSpeed() { return playbackSpeed; },
      get particleCount() { return G.particleCount || 0; },
    }),
  });
})();
</script>
</body>
</html>
