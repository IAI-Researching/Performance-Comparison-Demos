<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballistics: Water Balloon at 15,000 FPS</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
'use strict';

// =============================================================================
//  TIMELINE & PHYSICAL CONSTANTS
//  All state is a pure function of simTime (analytic / parametric model), so
//  forward play, reverse scrubbing and any display refresh rate agree exactly.
// =============================================================================
const DURATION = 8.000;
const SEED = 42;

const T_CONTACT = 1.000;   // bullet nose touches the latex
const T_PUNCT   = 1.150;   // latex punctures after elastic indentation
const T_SPREAD  = 0.130;   // tear runs around the circumference
const T_RUP     = 0.320;   // upper sheet retraction toward the tether
const T_RLOW    = 0.280;   // lower sheet retraction toward the base
const T_LDROP   = 1.560;   // lower latex cup detaches and falls away
const T_EXIT    = 3.800;   // bullet nose clears the left boundary
const GA = 4.30, GB = 5.60, G1 = 1.20;   // gravity ramp (camera speed-ramp)

const U_TOP = 0.955, U_BOT = 0.035;      // where retracted latex bunches up
const NECK_R = 0.07;
const Y_B_LOCAL = -0.20;                 // bullet latitude in balloon frame
const BALLOON_Y = -0.02;                 // balloon frame origin (world)
const LATEX_SCALE = 1.004, WATER_SCALE = 0.992;
const RB = 0.055, BULLET_LEN = 0.30;     // bullet radius / length
const AMAX = 0.25;                       // max cavitation tunnel radius
const X_START = 9.5, V_EXIT = 9.0;

// ---------------------------------------------------------------------------
const clamp = (x, a, b) => (x < a ? a : (x > b ? b : x));
const mix = (a, b, t) => a + (b - a) * t;
function smooth(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Deterministic PRNG (Mulberry32, seed 42) - the only randomness source.
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// =============================================================================
//  BALLOON PROFILE: teardrop curve with hydrostatic bottom sag.
//  u in [0,1]: 0 = bottom pole, 1 = tied neck.  Mirrored exactly in GLSL.
// =============================================================================
const PROF = { A: 1.0, B: 1.15, M: 0.9, TN: 0.3, SAG: 0.12 };
function profAt(th) {
  const rho = PROF.A * Math.sin(th) * Math.pow(Math.max(Math.sin(0.5 * th), 1e-4), PROF.M);
  let y = PROF.B * Math.cos(th);
  y -= PROF.SAG * Math.sin(th) * Math.sin(th) * smooth(1.0472, Math.PI, th);
  return [Math.max(rho, 0), y];
}
function profile(u) {
  return profAt(Math.PI + (PROF.TN - Math.PI) * clamp(u, 0, 1));
}
(function calibrateProfile() {
  let maxF = 0;
  for (let i = 1; i < 4000; i++) {
    const th = Math.PI * i / 4000;
    const f = Math.sin(th) * Math.pow(Math.sin(0.5 * th), PROF.M);
    if (f > maxF) maxF = f;
  }
  PROF.A = 1.0 / maxF;                     // widest radius = 1.0
  let lo = 0.01, hi = 1.5;
  for (let k = 0; k < 60; k++) {           // neck where radius = NECK_R
    const mid = 0.5 * (lo + hi);
    if (profAt(mid)[0] < NECK_R) lo = mid; else hi = mid;
  }
  PROF.TN = 0.5 * (lo + hi);
})();
const U_B = (function () {                 // material latitude of the impact
  let lo = 0, hi = 0.8;
  for (let k = 0; k < 60; k++) {
    const mid = 0.5 * (lo + hi);
    if (profile(mid)[1] < Y_B_LOCAL) lo = mid; else hi = mid;
  }
  return 0.5 * (lo + hi);
})();
const XR = profile(U_B)[0] * LATEX_SCALE;  // entry / exit boundary |x|
const NECK_Y = profile(1)[1] * LATEX_SCALE;
const BOTTOM_Y = profile(0)[1] * LATEX_SCALE;
const YB_WORLD = BALLOON_Y + Y_B_LOCAL;

function profileNormal(u) {                // outward normal in (rho, y) plane
  const a = profile(u - 0.004), b = profile(u + 0.004);
  const tx = b[0] - a[0], ty = b[1] - a[1];
  const l = Math.hypot(tx, ty) || 1;
  return [ty / l, -tx / l];
}

// =============================================================================
//  BULLET KINEMATICS (piecewise analytic): fast approach, speed-ramp into
//  slow motion at contact, decelerating transit, ramp back up after exit.
// =============================================================================
const V_W0 = (2 * XR) / 2.52;              // entry speed in water
const V_W1 = 0.8 * V_W0;                   // speed at exit
const DEC = (V_W0 - V_W1) / 2.8;
const V_A = (X_START - XR - 0.15 * V_W0) / 0.85;
const D1 = X_START - XR;
const D2 = D1 + 2 * XR;
const D3 = D2 + 0.6 * 0.5 * (V_W1 + V_EXIT);

function easeDist(a, b, T, s) {
  return a * s + (b - a) * 0.5 * (s - (T / Math.PI) * Math.sin(Math.PI * s / T));
}
function easeVel(a, b, T, s) {
  return a + (b - a) * 0.5 * (1 - Math.cos(Math.PI * s / T));
}
function bulletDist(t) {
  if (t <= 0.7) return V_A * t;
  if (t <= 1.0) return V_A * 0.7 + easeDist(V_A, V_W0, 0.3, t - 0.7);
  if (t <= 3.8) { const s = t - 1.0; return D1 + V_W0 * s - 0.5 * DEC * s * s; }
  if (t <= 4.4) return D2 + easeDist(V_W1, V_EXIT, 0.6, t - 3.8);
  return D3 + V_EXIT * (t - 4.4);
}
function bulletSpeed(t) {
  if (t <= 0.7) return V_A;
  if (t <= 1.0) return easeVel(V_A, V_W0, 0.3, t - 0.7);
  if (t <= 3.8) return V_W0 - DEC * (t - 1.0);
  if (t <= 4.4) return easeVel(V_W1, V_EXIT, 0.6, t - 3.8);
  return V_EXIT;
}
function tipX(t) { return X_START - bulletDist(t); }
function tPass(x) {                        // when the nose passed x (in water)
  const d = clamp(XR - x, 0, 2 * XR);
  const disc = Math.max(V_W0 * V_W0 - 2 * DEC * d, 0);
  return 1.0 + (V_W0 - Math.sqrt(disc)) / DEC;
}

// =============================================================================
//  GRAVITY with slow-motion speed ramp: g(t) = 0 -> G1 over [GA, GB].
//  F = integral of g, H = double integral; drop(s,t) = H(t)-H(s)-(t-s)F(s).
// =============================================================================
function R1(t) {
  if (t <= GA) return 0;
  if (t < GB) return (t - GA) * (t - GA) / (2 * (GB - GA));
  return 0.5 * (GB - GA) + (t - GB);
}
function R2(t) {
  if (t <= GA) return 0;
  const L = GB - GA;
  if (t < GB) { const d = t - GA; return d * d * d / (6 * L); }
  const d = t - GB;
  return L * L / 6 + 0.5 * L * d + 0.5 * d * d;
}
function gF(t) { return G1 * R1(t); }
function gH(t) { return G1 * R2(t); }

// =============================================================================
//  CAVITATION TUNNEL radius a(x,t) (mirrored in GLSL)
// =============================================================================
function cavGate(t) { return smooth(2.3, 3.3, t); }
function cavCollapse(t) { return 1 - smooth(4.35, 5.3, t); }
function cavityR(x, t) {
  if (t < T_PUNCT) return 0;
  const xt = tipX(t);
  if (x > XR + 0.1 || x < xt || x < -XR - 0.1) return 0;
  const xc = clamp(x, -XR, XR);
  const s = Math.max(t - tPass(xc), 0);
  const trail = RB * 1.25 * smooth(xt, xt + 0.12, x);
  const bulk = AMAX * (1 - Math.exp(-s / 0.75)) * cavGate(t) * (0.85 + 0.15 * xc / XR);
  return (trail + bulk) * cavCollapse(t);
}

// Bulk water body motion (mirrored in GLSL)
function bodyExpand(t) { return t > 4.1 ? 0.16 * Math.pow(t - 4.1, 1.25) : 0; }
function bodyDrift(t) { return t > T_EXIT ? 0.06 * (t - T_EXIT) : 0; }
function bodyFall(t) { return gH(t); }
function bodyMap(p, t) {                   // rest (local) -> deformed (local)
  let dy = p[1] - Y_B_LOCAL, dz = p[2];
  const a = cavityR(p[0], t);
  if (a > 0) {
    const r = Math.hypot(dy, dz);
    const k = Math.sqrt(r * r + a * a) / Math.max(r, 1e-4);
    dy *= k; dz *= k;
  }
  const E = bodyExpand(t);
  dy *= 1 + E; dz *= 1 + E;
  return [p[0] * (1 + 0.55 * E) - bodyDrift(t), Y_B_LOCAL + dy - bodyFall(t), dz];
}

// =============================================================================
//  SEEDED VALUE NOISE (break-up pattern) + release-time field
// =============================================================================
const rng = mulberry32(SEED);              // single stream, consumed in fixed order
const PERM = new Uint8Array(512);
(function initNoise() {
  const p = [];
  for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
  }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
})();
function hash3(x, y, z) {
  return PERM[PERM[PERM[x & 255] + (y & 255)] + (z & 255)] / 255;
}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const x00 = mix(hash3(xi, yi, zi), hash3(xi + 1, yi, zi), u);
  const x10 = mix(hash3(xi, yi + 1, zi), hash3(xi + 1, yi + 1, zi), u);
  const x01 = mix(hash3(xi, yi, zi + 1), hash3(xi + 1, yi, zi + 1), u);
  const x11 = mix(hash3(xi, yi + 1, zi + 1), hash3(xi + 1, yi + 1, zi + 1), u);
  return mix(mix(x00, x10, v), mix(x01, x11, v), w);
}
function fbm3(x, y, z) {
  return 0.62 * vnoise3(x, y, z) + 0.38 * vnoise3(x * 2.07 + 17.3, y * 2.07 - 5.1, z * 2.07 + 9.2);
}
// When a parcel of water (rest position p, local frame) atomises into drops.
function relTime(p) {
  const dy = p[1] - Y_B_LOCAL, r = Math.hypot(dy, p[2]);
  const n = fbm3(p[0] * 2.2 + 11.3, p[1] * 2.2 + 3.1, p[2] * 2.2 + 7.7);
  let tr = 4.9 + 0.8 * smooth(0.0, 1.25, r) + 1.25 * (n - 0.15) + 0.2 * smooth(0.55, 1.1, p[1]);
  const hx = Math.abs(p[0]) - XR;
  tr -= 0.3 * Math.exp(-(hx * hx + r * r) / 0.12);
  return clamp(tr, 4.75, 7.2);
}

// Latex tear helpers (mirrored in GLSL)
function openTime(a) {
  const da = Math.abs(Math.atan2(Math.sin(a), Math.cos(a)));
  return T_PUNCT + T_SPREAD * Math.pow(da / Math.PI, 1.5);
}
function easeR(s) { const q = 1 - Math.sqrt(clamp(s, 0, 1)); return 1 - q * q; }   // crack-opening sqrt snap
function memEdgeU(piece, a, t) {
  const s = t - openTime(a);
  return piece > 0 ? mix(U_B, U_TOP, easeR(s / T_RUP)) : mix(U_B, U_BOT, easeR(s / T_RLOW));
}

// =============================================================================
//  RENDERER / SCENE / CAMERA
// =============================================================================
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const FOV = 35;                             // ~85mm-style narrow lens
const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.1, 100);
function frameCamera() {
  const aspect = Math.max(window.innerWidth, 1) / Math.max(window.innerHeight, 1);
  const tanH = Math.tan(THREE.MathUtils.degToRad(FOV * 0.5));
  let dist = 9.6;
  if (tanH * aspect * dist < 3.4) dist = 3.4 / (tanH * aspect);   // keep plumes in narrow viewports
  camera.aspect = aspect;
  camera.position.set(0, 0, dist);           // locked on Z, pure lateral cross-section
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
}
frameCamera();

// ---- Three-point studio lighting with dual rim lights ----------------------
const LIGHTS = [
  { dir: [-0.55, 0.62, 0.72], col: [1.00, 0.95, 0.88], k: 1.55 },  // key
  { dir: [0.75, -0.05, 0.75], col: [0.62, 0.68, 0.80], k: 0.35 },  // fill
  { dir: [-0.82, 0.30, -0.55], col: [0.82, 0.90, 1.00], k: 2.10 }, // rim: cool white
  { dir: [0.85, 0.22, -0.50], col: [0.35, 0.92, 1.00], k: 1.70 },  // rim: cyan
  { dir: [0.15, -0.75, -0.60], col: [0.95, 0.30, 0.80], k: 0.70 }  // kicker: magenta
];
const LDIR = LIGHTS.map(L => new THREE.Vector3(L.dir[0], L.dir[1], L.dir[2]).normalize());
const LCOL = LIGHTS.map(L => new THREE.Vector3(L.col[0] * L.k, L.col[1] * L.k, L.col[2] * L.k));
LIGHTS.forEach((L, i) => {
  const dl = new THREE.DirectionalLight(new THREE.Color(L.col[0], L.col[1], L.col[2]), L.k);
  dl.position.copy(LDIR[i]).multiplyScalar(10);
  scene.add(dl);
});
scene.add(new THREE.HemisphereLight(0x30343f, 0x0a0b10, 0.35));

// ---- Procedural studio environment (PMREM) for metal / clear-coat ---------
function buildEnvMap() {
  const envScene = new THREE.Scene();
  const geo = new THREE.SphereGeometry(30, 48, 24);
  const cols = [];
  const pa = geo.attributes.position;
  for (let i = 0; i < pa.count; i++) {
    const g = smooth(-0.4, 0.9, pa.getY(i) / 30);
    cols.push(mix(0.010, 0.050, g), mix(0.011, 0.055, g), mix(0.016, 0.070, g));
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  envScene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  function panel(w, h, col, k, dir) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col[0] * k, col[1] * k, col[2] * k), side: THREE.DoubleSide }));
    m.position.set(dir[0], dir[1], dir[2]).normalize().multiplyScalar(14);
    m.lookAt(0, 0, 0);
    envScene.add(m);
  }
  panel(9, 6, [1.0, 0.95, 0.88], 4.0, [-0.55, 0.62, 0.72]);
  panel(8, 8, [0.62, 0.68, 0.80], 0.8, [0.75, -0.05, 0.75]);
  panel(2.2, 16, [0.82, 0.90, 1.00], 3.5, [-0.82, 0.30, -0.55]);
  panel(2.2, 16, [0.35, 0.92, 1.00], 3.0, [0.85, 0.22, -0.50]);
  panel(8, 4, [0.95, 0.30, 0.80], 1.2, [0.15, -0.75, -0.60]);
  panel(10, 10, [0.9, 0.92, 1.0], 0.9, [0.0, 1.0, 0.05]);
  const pmrem = new THREE.PMREMGenerator(renderer);
  const rt = pmrem.fromScene(envScene, 0.02);
  pmrem.dispose();
  return rt.texture;
}
const envTex = buildEnvMap();

// ---- Conical copper-jacketed bullet -----------------------------------------
const bulletGroup = new THREE.Group();
const bulletMesh = (function () {

const PARTICLE_VS = `
attribute float aSize;
attribute float aAlpha;
attribute vec2 aDir;

uniform float uPxScale;
varying float vAlpha; varying vec2 vDir; varying float vStretch; varying float vX; varying float vKind;

    let sz = A_SZ[i];
    const kind = A_KIND[i];
    if (kind > 1.5) {                      // haze puffs bloom and thin out
      a *= 1 - smooth(A_L[i] * 0.35, A_L[i], dt);
      sz *= 1 + 1.1 * Math.min(dt, 2.0);
    } else if (kind > 0.5) {               // mist evaporates / disperses
      a *= 1 - smooth(A_L[i] * 0.5, A_L[i], dt);
      sz *= 1 + 0.5 * Math.min(dt, 1.5);
    }
    if (y < -4.5) a = 0;
    const spd = Math.hypot(vx, vy);
    let st = 1 + spd * 0.012 / sz;
    if (A_ST[i] > 1) st *= 1 + (A_ST[i] - 1) * (1 - smooth(0, 0.45, dt));
    pPos[i3] = x; pPos[i3 + 1] = y; pPos[i3 + 2] = z;
    pSize[i] = sz; pAlpha[i] = a; pStr[i] = Math.min(st, 4.5);
    if (spd > 1e-5) { pDir[i2] = vx / spd; pDir[i2 + 1] = vy / spd; }
    else { pDir[i2] = 1; pDir[i2 + 1] = 0; }
  }
  attrPos.needsUpdate = true; attrSize.needsUpdate = true; attrAlpha.needsUpdate = true;
  attrDir.needsUpdate = true; attrStr.needsUpdate = true;
}

// =============================================================================
//  renderAt(simTime): deterministic, history-free frame evaluation
// =============================================================================
const DENT_MAX = Math.max(0, XR - tipX(T_PUNCT));
function dentDepth(t) {                    // elastic indentation of the skin
  if (t < T_CONTACT) return 0;
  if (t <= T_PUNCT) return Math.max(0, XR - tipX(t));
  return DENT_MAX * Math.exp(-(t - T_PUNCT) / 0.05);
}
function knotRecoil(t) {                   // tether springs back once unloaded
  const tau = t - 4.5;
  if (tau <= 0) return 0;
  return 0.045 * (1 - Math.exp(-tau / 0.6) * Math.cos(6.0 * tau));
}

function renderAt(t) {
  t = clamp(t, 0, DURATION);
  const xt = tipX(t);

  // Bullet (rifling spin tied to distance travelled) + faint motion streak
  bulletGroup.position.set(xt + BULLET_LEN, YB_WORLD, 0);
  bulletMesh.rotation.x = -bulletDist(t) * 6.0;
  const sp = bulletSpeed(t);
  const sl = clamp(sp * 0.055, 0.001, 0.9);
  streak.scale.set(sl, RB * 1.5, 1);
  streak.position.set(xt + BULLET_LEN + sl * 0.5, YB_WORLD, 0);
  streakMat.uniforms.uStreakA.value = 0.32 * smooth(1.5, 6.0, sp);

  // Shared shader state
  U.uTime.value = t;
  U.uTipX.value = xt;
  U.uGate.value = cavGate(t);
  U.uCollapse.value = cavCollapse(t);
  U.uDent.value = dentDepth(t);
  U.uRipple.value = 0.010 * smooth(T_PUNCT, T_PUNCT + 0.06, t) * (1 - smooth(2.2, 3.2, t));
  U.uRipT.value = Math.max(0, t - T_PUNCT);
  U.uLip.value = 0.05 * smooth(T_PUNCT, 1.5, t) * (1 - smooth(2.0, 2.6, t))
               + 0.17 * smooth(2.45, 3.3, t) * (1 - smooth(4.4, 5.3, t));
  U.uDome.value = 0.13 * smooth(3.35, 3.83, t) * (1 - smooth(3.88, 4.4, t));
  U.uCone.value = 0.24 * smooth(3.82, 4.35, t) * (1 - smooth(4.8, 5.7, t));
  U.uExpand.value = bodyExpand(t);
  U.uDrift.value = bodyDrift(t);
  U.uFall.value = bodyFall(t);
  U.uFinger.value = 0.2 * smooth(4.7, 6.8, t);
  U.uAE.value = cavityR(XR, t);
  U.uAX.value = cavityR(-XR, t);

  // Latex remnants: lower cup tumbles away, upper collar hangs at the knot
  const tl = Math.max(0, t - T_LDROP);
  U.uLowOff.value.set(0.05 * tl, -0.45 * tl - gH(t));
  U.uLowRot.value = 0.55 * tl;
  U.uUpShrink.value = 1 - 0.45 * smooth(4.5, 5.9, t);
  const kdy = knotRecoil(t);
  U.uKnotDY.value = kdy;
  knotGroup.position.y = KNOT_BASE_Y + kdy;

  const wet = t >= T_PUNCT - 1e-4 && t < 7.25;
  waterBack.visible = wet;
  waterFront.visible = wet;
  cavMesh.visible = t >= T_PUNCT && t < 5.35;

  updateParticles(t);
  renderer.render(scene, camera);
}

// =============================================================================
//  PLAYBACK STATE MACHINE: COUNTDOWN | PLAYING | PAUSED | REFIRE_HOLD | ENDED
// =============================================================================
const elCountdown = document.getElementById('countdown');
const elToggle = document.getElementById('btn-toggle');
const elRefire = document.getElementById('btn-refire');
const elIconPause = document.getElementById('icon-pause');
const elIconPlay = document.getElementById('icon-play');
const elScrub = document.getElementById('scrubber');
const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

const S_COUNTDOWN = 'COUNTDOWN', S_PLAYING = 'PLAYING', S_PAUSED = 'PAUSED',
      S_REFIRE_HOLD = 'REFIRE_HOLD', S_ENDED = 'ENDED';
let state = 'INIT';
let simTime = 0;
let playbackSpeed = 1.0;
let countdownStart = 0, countdownElapsed = 0;
let holdStart = 0, holdElapsed = 0;
let lastTs = null;

function showPauseIcon() {
  elIconPause.style.display = 'block';
  elIconPlay.style.display = 'none';
  elToggle.setAttribute('aria-label', 'Pause');
}
function showPlayIcon() {
  elIconPause.style.display = 'none';
  elIconPlay.style.display = 'block';
  elToggle.setAttribute('aria-label', 'Play');
}
function hideCountdown() {
  elCountdown.style.display = 'none';
  elCountdown.textContent = '';
}
function showCountdown(txt) {
  elCountdown.style.display = 'block';
  if (elCountdown.textContent !== txt) elCountdown.textContent = txt;
}

function frame(ts) {
  requestAnimationFrame(frame);
  if (lastTs === null) lastTs = ts;
  const dt = Math.min(Math.max(0, (ts - lastTs) / 1000), 0.1);   // clamp tab-switch jumps
  lastTs = ts;

  if (state === S_COUNTDOWN) {
    countdownElapsed = Math.max(0, (ts - countdownStart) / 1000);  // wall clock, speed-independent
    if (countdownElapsed >= 3.0) {
      hideCountdown();
      state = S_PLAYING;
      simTime = 0;
      elScrub.value = '0';
    } else {
      showCountdown(countdownElapsed < 1.0 ? '3' : (countdownElapsed < 2.0 ? '2' : '1'));
      simTime = 0;
      elScrub.value = '0';
    }
  } else if (state === S_REFIRE_HOLD) {
    holdElapsed = Math.max(0, (ts - holdStart) / 1000);            // wall clock, speed-independent
    if (holdElapsed >= 1.0) state = S_PLAYING;
  } else if (state === S_PLAYING) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    elScrub.value = simTime.toFixed(3);
    if (simTime >= DURATION) {
      simTime = DURATION;
      elScrub.value = DURATION.toFixed(3);
      state = S_ENDED;
      showPlayIcon();
    }
  }
  renderAt(simTime);
}

elToggle.addEventListener('click', function () {
  if (state === S_PLAYING) {
    state = S_PAUSED;
    showPlayIcon();
  } else if (state === S_COUNTDOWN || state === S_REFIRE_HOLD || state === 'INIT') {
    hideCountdown();
    simTime = 0;
    elScrub.value = '0';
    state = S_PAUSED;
    showPlayIcon();
    renderAt(simTime);
  } else if (state === S_PAUSED) {
    hideCountdown();
    state = S_PLAYING;
    showPauseIcon();
  } else if (state === S_ENDED) {
    hideCountdown();
    simTime = 0;
    elScrub.value = '0';
    state = S_PLAYING;
    showPauseIcon();
    renderAt(simTime);
  }
});

pills.forEach(function (pill) {
  pill.addEventListener('click', function () {
    playbackSpeed = parseFloat(pill.getAttribute('data-speed'));
    pills.forEach(function (q) {
      const on = q === pill;
      q.classList.toggle('is-active', on);
      q.setAttribute('aria-checked', on ? 'true' : 'false');
    });
  });
});

elScrub.addEventListener('input', function () {
  hideCountdown();                       // cancels COUNTDOWN / REFIRE_HOLD
  const v = parseFloat(elScrub.value);
  simTime = clamp(isFinite(v) ? v : 0, 0, DURATION);
  state = S_PAUSED;
  showPlayIcon();
  renderAt(simTime);
});

elRefire.addEventListener('click', function () {
  hideCountdown();
  simTime = 0;
  elScrub.value = '0';
  renderAt(simTime);                     // exact initial resting state
  showPauseIcon();
  state = S_REFIRE_HOLD;
  holdStart = performance.now();
  holdElapsed = 0;
});

window.addEventListener('resize', function () {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  frameCamera();
  updatePxScale();
  renderAt(simTime);
});

// Initial resting scene, then COUNTDOWN begins on the first rAF callback.
renderAt(0);
requestAnimationFrame(function (ts) {
  if (state === 'INIT') {
    state = S_COUNTDOWN;
    countdownStart = ts;
    countdownElapsed = 0;
    showCountdown('3');
    showPauseIcon();
  }
  lastTs = ts;
  renderAt(simTime);
  requestAnimationFrame(frame);
});

})();
</script>
</body>
</html>
