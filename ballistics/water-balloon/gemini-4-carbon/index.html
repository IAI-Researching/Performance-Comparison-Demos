      knotGroup: knotGroup,
      radSegs: radSegs
    };
  }

  /* =========================================================================
   * APPLICATION INITIALIZATION, SCENE SETUP & PLAYBACK STATE MACHINE
   * ========================================================================= */
  function initApplication() {
    var canvas = document.getElementById('stage');
    var countdownEl = document.getElementById('countdown');
    var btnRefire = document.getElementById('btn-refire');
    var btnToggle = document.getElementById('btn-toggle');
    var iconPause = document.getElementById('icon-pause');
    var iconPlay = document.getElementById('icon-play');
    var speedPills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));
    var scrubber = document.getElementById('scrubber');

    var renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.setClearColor(0x000000, 0);

    var scene = new THREE.Scene();
    scene.environment = createStudioEnvironment(renderer);

    // Narrow 85mm-equivalent studio perspective camera locked along +Z axis
    var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100.0);
    var baseCamZ = 12.4;

    function updateCameraAndViewport() {
      var w = Math.max(1, window.innerWidth);
      var h = Math.max(1, window.innerHeight);
      var aspect = w / h;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      camera.aspect = aspect;
      camera.position.set(0.0, -0.14, aspect < 1.55 ? baseCamZ * (1.55 / Math.max(aspect, 0.55)) : baseCamZ);
      camera.lookAt(0.0, -0.14, 0.0);
      camera.updateProjectionMatrix();
      if (mistSystem) {
        mistSystem.material.uniforms.uScaleFactor.value = h * dpr * 0.50;
        mistSystem.material.uniforms.uMaxPointSize.value = 88.0 * dpr;
      }
    }

    // Three-point studio lighting + dual cool-white / cyan / magenta rim lights
    var hemiLight = new THREE.HemisphereLight(0x2d3a56, 0x090b12, 0.62);
    scene.add(hemiLight);

    var keyLight = new THREE.DirectionalLight(0xfff9f2, 1.55);
    keyLight.position.set(-4.2, 7.2, 6.2);
    scene.add(keyLight);

    var fillLight = new THREE.DirectionalLight(0x9bb8eb, 0.65);
    fillLight.position.set(5.2, 2.4, 7.5);
    scene.add(fillLight);

    var rimCyanLight = new THREE.DirectionalLight(0x66f2ff, 2.25);
    rimCyanLight.position.set(-6.5, 4.2, -6.2);
    scene.add(rimCyanLight);

    var rimMagentaLight = new THREE.DirectionalLight(0xff6ac6, 1.75);
    rimMagentaLight.position.set(6.5, -1.8, -6.2);
    scene.add(rimMagentaLight);

    var rimTopWhite = new THREE.DirectionalLight(0xffffff, 1.95);
    rimTopWhite.position.set(0.4, 6.8, -6.8);
    scene.add(rimTopWhite);

    // Precompute deterministic physics & procedural assets (Seed 42)
    var tetherTable = precomputeTetherTimeline();
    var spriteAtlas = createFluidSpriteAtlas();

    // 1. Bullet & Mach Cone (renderOrder = 1 & 2)
    var bullet = buildBulletAssembly();
    bullet.root.renderOrder = 1;
    bullet.shockCone.renderOrder = 2;
    scene.add(bullet.root);

    // 2. Tether & Recoiling Knot
    var tetherRig = buildTetherAndKnot();
    tetherRig.tetherMesh.renderOrder = 1;
    tetherRig.knotGroup.renderOrder = 5;
    scene.add(tetherRig.tetherMesh);
    scene.add(tetherRig.knotGroup);

    // 3. Latex Membrane (BackSide behind water, FrontSide over water for true cup sorting)
    var latexGeo = buildBalloonBaseGeometry(96, 96, true);
    var latexBackMat = createLatexMaterial(true);
    var latexFrontMat = createLatexMaterial(false);
    var latexBackMesh = new THREE.Mesh(latexGeo, latexBackMat);
    var latexFrontMesh = new THREE.Mesh(latexGeo, latexFrontMat);
    latexBackMesh.frustumCulled = false;
    latexFrontMesh.frustumCulled = false;
    latexBackMesh.renderOrder = 2;
    latexFrontMesh.renderOrder = 6;
    scene.add(latexBackMesh);
    scene.add(latexFrontMesh);

    // 4. Internal Cavitation Tunnel (renderOrder = 3)
    var cavityGeo = buildCavitationTunnelGeometry();
    var cavityMat = createCavitationMaterial();
    var cavityMesh = new THREE.Mesh(cavityGeo, cavityMat);
    cavityMesh.frustumCulled = false;
    cavityMesh.renderOrder = 3;
    scene.add(cavityMesh);

    // 5. Naked Refractive Water Body (renderOrder = 4)
    var waterGeo = buildBalloonBaseGeometry(108, 108, false);
    var waterMat = createWaterBodyMaterial();
    var waterMesh = new THREE.Mesh(waterGeo, waterMat);
    waterMesh.frustumCulled = false;
    waterMesh.renderOrder = 4;
    scene.add(waterMesh);

    // 6. Entry Backward Jet (+X) & Exit Forward Cone (-X) (renderOrder = 5)
    var crownGeo = buildCavitationTunnelGeometry();
    var entryCrownMat = createCrownConeMaterial(false);
    var exitCrownMat = createCrownConeMaterial(true);
    var entryCrownMesh = new THREE.Mesh(crownGeo, entryCrownMat);
    var exitCrownMesh = new THREE.Mesh(crownGeo, exitCrownMat);
    entryCrownMesh.frustumCulled = false;
    exitCrownMesh.frustumCulled = false;
    entryCrownMesh.renderOrder = 5;
    exitCrownMesh.renderOrder = 5;
    scene.add(entryCrownMesh);
    scene.add(exitCrownMesh);

    // 7. 3,600 3D Refractive Droplets & Ligaments + Splashdown Ripples (renderOrder = 7 & 6)
    var dropletsSystem = buildDropletsSystem();
    dropletsSystem.mesh.renderOrder = 7;
    scene.add(dropletsSystem.mesh);

    var ripplesSystem = buildSplashdownRipples(dropletsSystem.splashEvents);
    ripplesSystem.mesh.renderOrder = 6;
    scene.add(ripplesSystem.mesh);

    // 8. 2,600 Fine Mist & Micro-Droplet Spray (renderOrder = 8)
    var dprInit = Math.min(window.devicePixelRatio || 1, 2);
    var mistSystem = buildMistSpraySystem(spriteAtlas, window.innerHeight * dprInit);
    mistSystem.points.renderOrder = 8;
    scene.add(mistSystem.points);

    updateCameraAndViewport();

    /* -----------------------------------------------------------------------
     * Deterministic Tether Interpolation & Tube Vertex Update
     * ----------------------------------------------------------------------- */
    var interpNodes = new Float32Array(TETHER_NODES * 3);
    var knotVec = new THREE.Vector3();

    function updateTetherAt(t) {
      var exactStep = clamp(t * SUBSTEP_HZ, 0.0, TOTAL_SUBSTEPS);
      var s0 = Math.floor(exactStep);
      var s1 = Math.min(TOTAL_SUBSTEPS, s0 + 1);
      var frac = exactStep - s0;
      var base0 = s0 * TETHER_NODES * 3;
      var base1 = s1 * TETHER_NODES * 3;

      var n;
      for (n = 0; n < TETHER_NODES * 3; n++) {
        interpNodes[n] = tetherTable[base0 + n] + (tetherTable[base1 + n] - tetherTable[base0 + n]) * frac;
      }

      var posAttr = tetherRig.tetherGeo.attributes.position;
      var normAttr = tetherRig.tetherGeo.attributes.normal;
      var posArr = posAttr.array;
      var normArr = normAttr.array;
      var radSegs = tetherRig.radSegs;
      var stringRadius = 0.017;

      for (n = 0; n < TETHER_NODES; n++) {
        var cx = interpNodes[n * 3];
        var cy = interpNodes[n * 3 + 1];
        var cz = interpNodes[n * 3 + 2];

        var nPrev = Math.max(0, n - 1);
        var nNext = Math.min(TETHER_NODES - 1, n + 1);
        var tx = interpNodes[nNext * 3] - interpNodes[nPrev * 3];
        var ty = interpNodes[nNext * 3 + 1] - interpNodes[nPrev * 3 + 1];
        var tz = interpNodes[nNext * 3 + 2] - interpNodes[nPrev * 3 + 2];
        var tLen = Math.sqrt(tx * tx + ty * ty + tz * tz) + 1e-8;
        tx /= tLen;
        ty /= tLen;
        tz /= tLen;

        // Orthonormal basis perpendicular to tangent (near-vertical string, so Z cross T is stable)
        var bx = -ty;
        var by = tx;
        var bz = 0.0;
        var bLen = Math.sqrt(bx * bx + by * by + bz * bz) + 1e-8;
        bx /= bLen;
        by /= bLen;

        var nx2 = ty * bz - tz * by;
        var ny2 = tz * bx - tx * bz;
        var nz2 = tx * by - ty * bx;

        for (var i = 0; i <= radSegs; i++) {
          var phi = (i / radSegs) * Math.PI * 2.0;
          var c = Math.cos(phi);
          var s = Math.sin(phi);
          var rx = bx * c + nx2 * s;
          var ry = by * c + ny2 * s;
          var rz = bz * c + nz2 * s;

          var vIdx = (n * (radSegs + 1) + i) * 3;
          posArr[vIdx] = cx + rx * stringRadius;
          posArr[vIdx + 1] = cy + ry * stringRadius;
          posArr[vIdx + 2] = cz + rz * stringRadius;
          normArr[vIdx] = rx;
          normArr[vIdx + 1] = ry;
          normArr[vIdx + 2] = rz;
        }
      }

      posAttr.needsUpdate = true;
      normAttr.needsUpdate = true;

      var last = (TETHER_NODES - 1) * 3;
      var prev = (TETHER_NODES - 2) * 3;
      knotVec.set(interpNodes[last], interpNodes[last + 1], interpNodes[last + 2]);
      tetherRig.knotGroup.position.copy(knotVec);

      var dxK = interpNodes[last] - interpNodes[prev];
      var dyK = interpNodes[last + 1] - interpNodes[prev + 1];
      var dzK = interpNodes[last + 2] - interpNodes[prev + 2];
      tetherRig.knotGroup.rotation.set(
        Math.atan2(dzK, -dyK) * 0.65,
        0.0,
        Math.atan2(dxK, -dyK) * 0.65
      );
    }

    /* -----------------------------------------------------------------------
     * PURE DETERMINISTIC SCENE EVALUATION: renderAt(simTime)
     * ----------------------------------------------------------------------- */
    function renderAt(rawTime) {
      var t = clamp(rawTime, 0.000, DURATION);

      // 1. Tether & recoiling knot
      updateTetherAt(t);

      // 2. Bullet position, rifling spin, yaw/pitch & aerodynamic Mach bow wave
      var bState = getBulletState(t);
      bullet.root.position.set(bState.x, bState.y, bState.z);
      bullet.root.rotation.set(0.0, bState.pitchY, bState.yawZ);
      bullet.spinGroup.rotation.x = bState.spin;

      var machOpacity = 1.0 - smoothstep(0.985, 1.075, t);
      bullet.shockCone.visible = machOpacity > 0.005;
      bullet.shockMat.uniforms.uOpacity.value = machOpacity;

      // 3. Latex skin uniforms
      latexBackMat.uniforms.uSimTime.value = t;
      latexBackMat.uniforms.uBulletX.value = bState.x;
      latexBackMat.uniforms.uKnotPos.value.copy(knotVec);

      latexFrontMat.uniforms.uSimTime.value = t;
      latexFrontMat.uniforms.uBulletX.value = bState.x;
      latexFrontMat.uniforms.uKnotPos.value.copy(knotVec);

      // 4. Water mass, cavitation tunnel, entry & exit cones
      waterMesh.visible = (t < 6.520);
      waterMat.uniforms.uSimTime.value = t;

      cavityMesh.visible = (t >= 1.075 && t <= 5.750);
      cavityMat.uniforms.uSimTime.value = t;
      cavityMat.uniforms.uBulletX.value = bState.x;

      entryCrownMesh.visible = (t >= 2.220 && t <= 5.250);
      entryCrownMat.uniforms.uSimTime.value = t;

      exitCrownMesh.visible = (t >= 3.800 && t <= 5.750);
      exitCrownMat.uniforms.uSimTime.value = t;

      // 5. 3D Droplets/Ligaments, Mist Spray & Splashdown Ripples
      dropletsSystem.mesh.visible = (t >= 1.060);
      dropletsSystem.material.uniforms.uSimTime.value = t;

      mistSystem.points.visible = (t >= 1.050);
      mistSystem.material.uniforms.uSimTime.value = t;

      ripplesSystem.mesh.visible = (t >= 5.100);
      ripplesSystem.material.uniforms.uSimTime.value = t;

      renderer.render(scene, camera);
    }

    /* -----------------------------------------------------------------------
     * 5-STATE PLAYBACK STATE MACHINE
     * States: 'COUNTDOWN', 'PLAYING', 'PAUSED', 'REFIRE_HOLD', 'ENDED'
     * ----------------------------------------------------------------------- */
    var playbackState = 'COUNTDOWN';
    var simTime = 0.000;
    var playbackSpeed = 1.0;
    var countdownElapsed = 0.000;
    var holdElapsed = 0.000;
    var lastFrameTime = null;

    function showPauseIcon(showingPause) {
      if (showingPause) {
        iconPause.style.display = '';
        iconPlay.style.display = 'none';
        btnToggle.setAttribute('aria-label', 'Pause');
      } else {
        iconPause.style.display = 'none';
        iconPlay.style.display = '';
        btnToggle.setAttribute('aria-label', 'Play');
      }
    }

    function hideCountdown() {
      countdownEl.style.display = 'none';
      countdownEl.textContent = '';
    }

    function updateCountdownDisplay(elapsed) {
      countdownEl.style.display = 'block';
      if (elapsed < 1.000) {
        countdownEl.textContent = '3';
      } else if (elapsed < 2.000) {
        countdownEl.textContent = '2';
      } else {
        countdownEl.textContent = '1';
      }
    }

    // Play / Pause Toggle (#btn-toggle)
    btnToggle.addEventListener('click', function () {
      if (playbackState === 'PLAYING') {
        playbackState = 'PAUSED';
        showPauseIcon(false);
      } else if (playbackState === 'COUNTDOWN' || playbackState === 'REFIRE_HOLD') {
        hideCountdown();
        simTime = 0.000;
        scrubber.value = '0';
        playbackState = 'PAUSED';
        showPauseIcon(false);
        renderAt(0.000);
      } else if (playbackState === 'PAUSED') {
        playbackState = 'PLAYING';
        showPauseIcon(true);
      } else if (playbackState === 'ENDED') {
        hideCountdown();
        simTime = 0.000;
        scrubber.value = '0';
        playbackState = 'PLAYING';
        showPauseIcon(true);
        renderAt(0.000);
      }
    });

    // Silent Re-fire (#btn-refire -> REFIRE_HOLD)
    btnRefire.addEventListener('click', function () {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0';
      holdElapsed = 0.000;
      playbackState = 'REFIRE_HOLD';
      showPauseIcon(true);
      renderAt(0.000);
    });

    // Speed Selector Pills (.speed-pill)
    speedPills.forEach(function (pill) {
      pill.addEventListener('click', function () {
        var spd = parseFloat(pill.getAttribute('data-speed'));
        if (!isNaN(spd) && spd > 0) {
          playbackSpeed = spd;
        }
        speedPills.forEach(function (other) {
          var active = (other === pill);
          other.classList.toggle('is-active', active);
          other.setAttribute('aria-checked', active ? 'true' : 'false');
        });
      });
    });

    // Scrubbing Slider (#scrubber)
    scrubber.addEventListener('input', function () {
      hideCountdown();
      var val = parseFloat(scrubber.value);
      simTime = clamp(isNaN(val) ? 0.000 : val, 0.000, DURATION);
      playbackState = 'PAUSED';
      showPauseIcon(false);
      renderAt(simTime);
    });

    // Window Resize
    window.addEventListener('resize', function () {
      updateCameraAndViewport();
      renderAt(simTime);
    });

    // Render initial resting scene (simTime = 0.000) before first rAF starts COUNTDOWN
    simTime = 0.000;
    scrubber.value = '0';
    updateCountdownDisplay(0.000);
    showPauseIcon(true);
    renderAt(0.000);

    function onAnimationFrame(now) {
      if (lastFrameTime === null) {
        // First rAF callback after initial resting render: start wall-clock timer at 0
        lastFrameTime = now;
        countdownElapsed = 0.000;
        requestAnimationFrame(onAnimationFrame);
        return;
      }

      var rawWallDt = Math.max(0.0, (now - lastFrameTime) / 1000.0);
      lastFrameTime = now;

      if (playbackState === 'COUNTDOWN') {
        countdownElapsed += rawWallDt;
        if (countdownElapsed < 3.000) {
          updateCountdownDisplay(countdownElapsed);
          simTime = 0.000;
          scrubber.value = '0';
        } else {
          var overflowC = Math.min(countdownElapsed - 3.000, 0.1);
          hideCountdown();
          playbackState = 'PLAYING';
          showPauseIcon(true);
          simTime = Math.min(DURATION, overflowC * playbackSpeed);
          scrubber.value = simTime.toFixed(3);
          renderAt(simTime);
          if (simTime >= DURATION) {
            simTime = DURATION;
            scrubber.value = DURATION.toFixed(3);
            playbackState = 'ENDED';
            showPauseIcon(false);
          }
        }
      } else if (playbackState === 'REFIRE_HOLD') {
        // #countdown remains strictly hidden during 1.000s wall-clock hold
        holdElapsed += rawWallDt;
        if (holdElapsed >= 1.000) {
          var overflowH = Math.min(holdElapsed - 1.000, 0.1);
          playbackState = 'PLAYING';
          showPauseIcon(true);
          simTime = Math.min(DURATION, overflowH * playbackSpeed);
          scrubber.value = simTime.toFixed(3);
          renderAt(simTime);
          if (simTime >= DURATION) {
            simTime = DURATION;
            scrubber.value = DURATION.toFixed(3);
            playbackState = 'ENDED';
            showPauseIcon(false);
          }
        }
      } else if (playbackState === 'PLAYING') {
        var clampedDt = Math.min(rawWallDt, 0.1);
        simTime = Math.min(DURATION, simTime + clampedDt * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
        if (simTime >= DURATION) {
          simTime = DURATION;
          scrubber.value = DURATION.toFixed(3);
          playbackState = 'ENDED';
          showPauseIcon(false);
        }
      }

      requestAnimationFrame(onAnimationFrame);
    }

    requestAnimationFrame(onAnimationFrame);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApplication);
  } else {
    initApplication();
  }
})();
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
</body>
</html>
