<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ballistics Water Balloon Slow-Motion Simulation</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  function boot() {
    const DURATION = 8.000;
    const SEED = 42;
    const FLOOR_Y = -2.32;

    // Deterministic Mulberry32 PRNG initialized strictly with seed 42
    function createPRNG(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const prng = createPRNG(SEED);
    function randRange(min, max) {
      return min + (max - min) * prng();
    }
    function randGauss() {
      const u1 = Math.max(1e-7, prng());
      const u2 = prng();
      return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(6.28318530718 * u2);
    }
    function clamp(x, lo, hi) {
      return x < lo ? lo : (x > hi ? hi : x);
    }
    function smoothstepJS(e0, e1, x) {
      const t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
      return t * t * (3.0 - 2.0 * t);
    }
    function hermite(t, t0, t1, p0, v0, p1, v1) {
      const dt = t1 - t0;
      const u = clamp((t - t0) / dt, 0.0, 1.0);
      const u2 = u * u;
      const u3 = u2 * u;
      const h00 = 2.0 * u3 - 3.0 * u2 + 1.0;
      const h10 = u3 - 2.0 * u2 + u;
      const h01 = -2.0 * u3 + 3.0 * u2;
      const h11 = u3 - u2;
      return h00 * p0 + h10 * (v0 * dt) + h01 * p1 + h11 * (v1 * dt);
    }

    // Shared hydrostatic teardrop profile (JS mirror of GLSL evalBalloonBase)
    // s in [0, 1] (0 = bottom pole y=-1.08, 1 = top neck y=+1.30), phi in [0, 2*PI]
    function evalBalloonBaseJS(s, phi) {
      const theta = s * Math.PI;
      const u = 0.5 * (1.0 - Math.cos(theta));
      const y = -1.08 + 2.38 * (0.78 * u + 0.22 * s * u);
      const sag = Math.sin(theta) * (1.26 - 0.58 * s - 0.25 * s * s);
      const neck = 0.102 * s * s * s;
      const blend = smoothstepJS(0.84, 1.0, s);
      const r = sag * (1.0 - blend) + neck * blend + neck * (1.0 - blend) * 0.35;
      return {
        x: r * Math.cos(phi),
        y: y,
        z: r * Math.sin(phi),
        r: r
      };
    }

    // Exact deterministic bullet kinematics across [0.000, 8.000]
    function getBulletState(simTime) {
      let tipX, vx, tipY = 0.0, pitchZ = 0.0, yawY = 0.0;
      if (simTime <= 1.000) {
        // Phase 1: High-velocity horizontal approach (+5.95 -> +0.918 right latex contact at 1.000s)
        vx = -5.032;
        tipX = 5.950 + vx * simTime;
      } else if (simTime <= 1.120) {
        // Phase 2a: Elastic indentation into right latex boundary (+0.918 -> +0.760)
        tipX = hermite(simTime, 1.000, 1.120, 0.918, -2.10, 0.760, -0.86);
        vx = -1.32;
      } else if (simTime <= 3.800) {
        // Phases 2b, 3, 4: Hydrodynamic penetration through water core (+0.760 -> -1.045 left wall at 3.800s)
        tipX = hermite(simTime, 1.120, 3.800, 0.760, -0.82, -1.045, -0.66);
        const u = (simTime - 1.120) / 2.680;
        vx = -0.82 * (1.0 - u) - 0.66 * u;
        pitchZ = -0.018 * Math.sin((simTime - 1.12) * 2.1);
      } else {
        // Phases 5 & 6: Exit puncture at 3.800s and post-exit ballistic flight (-X)
        const dtExit = simTime - 3.800;
        vx = -0.72;
        tipX = -1.045 + vx * dtExit;
        tipY = -0.022 * dtExit - 0.042 * dtExit * dtExit;
        // Subtle post-penetration gyroscopic nutation
        pitchZ = -0.045 * Math.sin(dtExit * 3.4 + 0.35) - 0.032 * dtExit;
        yawY = 0.035 * Math.cos(dtExit * 3.1);
      }
      const rollX = -simTime * 38.0;
      return { tipX: tipX, tipY: tipY, vx: vx, rollX: rollX, pitchZ: pitchZ, yawY: yawY };
    }

    // DOM References
    const canvas = document.getElementById('stage');
    const countdownEl = document.getElementById('countdown');
    const btnRefire = document.getElementById('btn-refire');
    const btnToggle = document.getElementById('btn-toggle');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    const speedPills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));
    const scrubber = document.getElementById('scrubber');

    // WebGL Renderer Setup (r128 canonical contract)
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: true
    });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.physicallyCorrectLights = true;
    renderer.setClearColor(0x000000, 0);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);

    const scene = new THREE.Scene();

    // Narrow perspective camera (85mm equivalent, FOV = 35 deg), locked along +Z perpendicular to flight path
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100.0);
    function updateCameraFraming() {
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);
      const zDist = aspect < 1.6 ? 9.45 * Math.min(1.85, 1.6 / aspect) : 9.45;
      camera.position.set(0.0, -0.14, zDist);
      camera.lookAt(0.0, -0.14, 0.0);
    }
    updateCameraFraming();

    // Three-point studio lighting + strong dual rim lights (cool white + cyan & magenta tint)
    const keyLight = new THREE.DirectionalLight(0xf5f8ff, 2.5);
    keyLight.position.set(-2.2, 5.6, 4.8);
    scene.add(keyLight);

    const cyanRimLight = new THREE.DirectionalLight(0x6ae8ff, 3.4);
    cyanRimLight.position.set(-6.2, 2.3, -4.6);
    scene.add(cyanRimLight);

    const magentaRimLight = new THREE.DirectionalLight(0xf794ea, 2.9);
    magentaRimLight.position.set(6.2, 1.8, -4.6);
    scene.add(magentaRimLight);

    const topRimLight = new THREE.DirectionalLight(0xeaf4ff, 1.8);
    topRimLight.position.set(0.0, 6.2, -3.0);
    scene.add(topRimLight);

    const hemiLight = new THREE.HemisphereLight(0xd2e2ff, 0x121622, 0.75);
    scene.add(hemiLight);

    // Procedural Studio Environment Cubemap (detached 2D canvases in memory only)
    function createStudioCubemap() {
      const size = 256;
      // Order: +X, -X, +Y, -Y, +Z, -Z
      const faces = [];
      for (let f = 0; f < 6; f++) {
        const c = document.createElement('canvas');
        c.width = size;
        c.height = size;
        const ctx = c.getContext('2d');

        // Deep dark studio cyclorama gradient
        const bgGrad = ctx.createLinearGradient(0, 0, 0, size);
        bgGrad.addColorStop(0.0, '#131826');
        bgGrad.addColorStop(0.55, '#0c0f18');
        bgGrad.addColorStop(1.0, '#07090e');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, size, size);

        const paintSoftbox = function(cx, cy, rx, ry, innerCol, midCol, outerCol) {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.scale(rx, ry);
          const g = ctx.createRadialGradient(0, 0, 0.05, 0, 0, 1.0);
          g.addColorStop(0.0, innerCol);
          g.addColorStop(0.45, midCol);
          g.addColorStop(1.0, outerCol);
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(0, 0, 1.0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        };

        if (f === 0) {
          // +X (Right studio wall: warm-white + magenta rim strip)
          paintSoftbox(size * 0.62, size * 0.40, size * 0.28, size * 0.48,
            'rgba(255, 240, 252, 0.98)', 'rgba(246, 138, 232, 0.58)', 'rgba(246, 138, 232, 0.0)');
          paintSoftbox(size * 0.28, size * 0.34, size * 0.16, size * 0.36,
            'rgba(255, 250, 255, 0.85)', 'rgba(220, 195, 255, 0.30)', 'rgba(220, 195, 255, 0.0)');
        } else if (f === 1) {
          // -X (Left studio wall: crisp cool-white + cyan rim strip)
          paintSoftbox(size * 0.38, size * 0.38, size * 0.30, size * 0.50,
            'rgba(240, 253, 255, 0.99)', 'rgba(95, 228, 255, 0.62)', 'rgba(95, 228, 255, 0.0)');
          paintSoftbox(size * 0.72, size * 0.32, size * 0.16, size * 0.36,
            'rgba(245, 252, 255, 0.85)', 'rgba(155, 235, 255, 0.30)', 'rgba(155, 235, 255, 0.0)');
        } else if (f === 2) {
          // +Y (Ceiling: overhead studio key strip bank)
          paintSoftbox(size * 0.44, size * 0.54, size * 0.44, size * 0.26,
            'rgba(255, 255, 255, 0.99)', 'rgba(218, 232, 255, 0.60)', 'rgba(180, 205, 255, 0.0)');
        } else if (f === 3) {
          // -Y (Floor bounce: subtle dark wet acrylic reflection)
          paintSoftbox(size * 0.50, size * 0.50, size * 0.46, size * 0.46,
            'rgba(34, 44, 66, 0.55)', 'rgba(20, 26, 40, 0.25)', 'rgba(10, 12, 18, 0.0)');
        } else if (f === 4) {
          // +Z (Camera side: key fill softbox upper-left)
          paintSoftbox(size * 0.32, size * 0.24, size * 0.26, size * 0.22,
            'rgba(252, 254, 255, 0.94)', 'rgba(205, 222, 250, 0.42)', 'rgba(180, 205, 250, 0.0)');
        } else if (f === 5) {
          // -Z (Backdrop behind subject: dual grazing rim glow)
          paintSoftbox(size * 0.16, size * 0.36, size * 0.22, size * 0.42,
            'rgba(215, 250, 255, 0.82)', 'rgba(90, 220, 255, 0.32)', 'rgba(90, 220, 255, 0.0)');
          paintSoftbox(size * 0.84, size * 0.38, size * 0.22, size * 0.42,
            'rgba(255, 222, 250, 0.78)', 'rgba(245, 130, 225, 0.30)', 'rgba(245, 130, 225, 0.0)');
        }
        faces.push(c);
      }

      const cubeTex = new THREE.CubeTexture(faces);
      cubeTex.needsUpdate = true;
      return cubeTex;
    }

    const studioCubeTex = createStudioCubemap();

    // Generate PMREM environment for built-in PBR metallic materials (bullet & tether)
    const pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileCubemapShader();
    const envCubeForPBR = createStudioCubemap();
    envCubeForPBR.encoding = THREE.sRGBEncoding;
    const pmremRT = pmremGen.fromCubemap(envCubeForPBR);
    scene.environment = pmremRT.texture;
    pmremGen.dispose();

    // Procedural Offscreen Droplet & Mist Sprite Texture (detached canvas in memory)
    function createDropletSpriteTexture() {
      const size = 128;
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, size, size);

      const half = size * 0.5;
      // Soft outer refractive/mist falloff
      const baseGrad = ctx.createRadialGradient(half, half, 0, half, half, half);
      baseGrad.addColorStop(0.0, 'rgba(225, 244, 255, 0.92)');
      baseGrad.addColorStop(0.45, 'rgba(195, 232, 255, 0.68)');
      baseGrad.addColorStop(0.72, 'rgba(170, 220, 255, 0.28)');
      baseGrad.addColorStop(1.0, 'rgba(150, 210, 255, 0.0)');
      ctx.fillStyle = baseGrad;
      ctx.beginPath();
      ctx.arc(half, half, half, 0, Math.PI * 2);
      ctx.fill();

      // Lower-right internal refraction caustic crescent
      const causticGrad = ctx.createRadialGradient(size * 0.60, size * 0.62, 1, size * 0.56, size * 0.58, size * 0.28);
      causticGrad.addColorStop(0.0, 'rgba(255, 255, 255, 0.85)');
      causticGrad.addColorStop(0.5, 'rgba(180, 242, 255, 0.35)');
      causticGrad.addColorStop(1.0, 'rgba(180, 242, 255, 0.0)');
      ctx.fillStyle = causticGrad;
      ctx.beginPath();
      ctx.arc(size * 0.58, size * 0.60, size * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // Crisp upper-left studio specular hot-spot
      const specGrad = ctx.createRadialGradient(size * 0.36, size * 0.34, 0, size * 0.36, size * 0.34, size * 0.16);
      specGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      specGrad.addColorStop(0.45, 'rgba(255, 255, 255, 0.72)');
      specGrad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
      ctx.fillStyle = specGrad;
      ctx.beginPath();
      ctx.arc(size * 0.36, size * 0.34, size * 0.16, 0, Math.PI * 2);
      ctx.fill();

      const tex = new THREE.CanvasTexture(c);
      tex.needsUpdate = true;
      return tex;
    }

    const dropletSpriteTex = createDropletSpriteTexture();

    // Procedural Rifling & Braided Cord Bump Maps (detached canvases in memory)
    function createBulletBumpTexture() {
      const c = document.createElement('canvas');
      c.width = 256;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#808080';
      ctx.fillRect(0, 0, 256, 256);

      // Spiral rifling engraving grooves + fine lathe machining lines
      for (let y = 0; y < 256; y += 2) {
        const shade = 124 + Math.floor(8 * Math.sin(y * 0.45));
        ctx.fillStyle = 'rgb(' + shade + ',' + shade + ',' + shade + ')';
        ctx.fillRect(0, y, 256, 2);
      }
      ctx.strokeStyle = 'rgba(45, 45, 45, 0.78)';
      ctx.lineWidth = 7;
      for (let i = -6; i < 12; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 32, 88);
        ctx.lineTo(i * 32 + 95, 225);
        ctx.stroke();
      }
      // Knurled cannelure band
      for (let x = 0; x < 256; x += 6) {
        ctx.fillStyle = (x % 12 === 0) ? '#3c3c3c' : '#b5b5b5';
        ctx.fillRect(x, 152, 3, 14);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.needsUpdate = true;
      return tex;
    }

    function createCordTexture() {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#b9bfcc';
      ctx.fillRect(0, 0, 64, 256);
      ctx.strokeStyle = '#6f7686';
      ctx.lineWidth = 6;
      for (let y = -64; y < 320; y += 18) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(64, y + 26);
        ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 22);
      tex.encoding = THREE.sRGBEncoding;
      tex.needsUpdate = true;
      return tex;
    }

    // Shared GLSL Color Finishing & Teardrop Math Snippets
    const GLSL_COMMON = [
      'vec3 finishHDR(vec3 col) {',
      '  col *= 1.12;',
      '  vec3 a = col * (col + 0.0245786) - 0.000090537;',
      '  vec3 b = col * (0.983729 * col + 0.4329510) + 0.238081;',
      '  vec3 mapped = clamp(a / b, 0.0, 1.0);',
      '  return pow(mapped, vec3(1.0 / 2.2));',
      '}',
      'vec3 sampleEnvLinear(samplerCube env, vec3 dir) {',
      '  vec3 raw = textureCube(env, dir).rgb;',
      '  vec3 lin = pow(max(raw, vec3(0.0)), vec3(2.2));',
      '  float peak = max(raw.r, max(raw.g, raw.b));',
      '  return lin * (1.0 + 3.2 * smoothstep(0.72, 0.99, peak));',
      '}',
      'vec3 evalBalloonBase(float s, float phi) {',
      '  float sc = clamp(s, 0.0, 1.0);',
      '  float theta = sc * 3.14159265;',
      '  float u = 0.5 * (1.0 - cos(theta));',
      '  float y = -1.08 + 2.38 * (0.78 * u + 0.22 * sc * u);',
      '  float sag = sin(theta) * (1.26 - 0.58 * sc - 0.25 * sc * sc);',
      '  float neck = 0.102 * sc * sc * sc;',
      '  float blend = smoothstep(0.84, 1.0, sc);',
      '  float r = mix(sag, neck, blend) + neck * (1.0 - blend) * 0.35;',
      '  return vec3(r * cos(phi), y, r * sin(phi));',
      '}'
    ].join('\n');

    // =========================================================================
    // 1. TETHER CORD, BALLOON KNOT & RETRACTED CRIMSON COLLAR
    // =========================================================================
    const tetherPivot = new THREE.Group();
    // Anchor high off-screen at y = +4.80 so recoil & sway pivot naturally from above
    tetherPivot.position.set(0.0, 4.80, 0.0);
    scene.add(tetherPivot);

    const cordTex = createCordTexture();
    const cordGeo = new THREE.CylinderBufferGeometry(0.014, 0.015, 3.52, 16, 24);
    cordGeo.translate(0.0, -1.76, 0.0);
    const cordMat = new THREE.MeshStandardMaterial({
      map: cordTex,
      bumpMap: cordTex,
      bumpScale: 0.004,
      color: 0xd8dde8,
      roughness: 0.68,
      metalness: 0.05
    });
    const cordMesh = new THREE.Mesh(cordGeo, cordMat);
    cordMesh.renderOrder = 2;
    tetherPivot.add(cordMesh);

    // Tied knot & flared crimson nozzle lip positioned at bottom of cord (local y = -3.50 -> world y = +1.30)
    const knotGroup = new THREE.Group();
    knotGroup.position.set(0.0, -3.50, 0.0);
    tetherPivot.add(knotGroup);

    const crimsonKnotMat = new THREE.MeshPhysicalMaterial({
      color: 0xd9161f,
      emissive: 0x260205,
      roughness: 0.20,
      metalness: 0.0,
      clearcoat: 0.65,
      clearcoatRoughness: 0.16,
      side: THREE.DoubleSide
    });

    // Tied cord cinch ring
    const cinchGeo = new THREE.TorusBufferGeometry(0.096, 0.016, 12, 32);
    cinchGeo.rotateX(Math.PI * 0.5);
    const cinchMesh = new THREE.Mesh(cinchGeo, cordMat);
    cinchMesh.position.y = 0.015;
    cinchMesh.renderOrder = 2;
    knotGroup.add(cinchMesh);

    // Rolled crimson latex knot torus + side knot ear
    const knotTorusGeo = new THREE.TorusBufferGeometry(0.098, 0.035, 18, 36);
    knotTorusGeo.rotateX(Math.PI * 0.5);
    const knotTorusMesh = new THREE.Mesh(knotTorusGeo, crimsonKnotMat);
    knotTorusMesh.renderOrder = 2;
    knotGroup.add(knotTorusMesh);

    const knotEarGeo = new THREE.TorusBufferGeometry(0.048, 0.022, 14, 24);
    const knotEarMesh = new THREE.Mesh(knotEarGeo, crimsonKnotMat);
    knotEarMesh.position.set(0.085, -0.005, 0.025);
    knotEarMesh.rotation.set(0.5, 0.4, -0.7);
    knotEarMesh.renderOrder = 2;
    knotGroup.add(knotEarMesh);

    // Flared nozzle lip above the knot
    const nozzlePts = [];
    for (let i = 0; i <= 12; i++) {
      const t = i / 12;
      const r = 0.078 + 0.072 * Math.pow(t, 1.45) + (i === 12 ? 0.014 : 0.0);
      const y = 0.018 + 0.135 * t;
      nozzlePts.push(new THREE.Vector2(r, y));
    }
    const nozzleGeo = new THREE.LatheBufferGeometry(nozzlePts, 36);
    const nozzleMesh = new THREE.Mesh(nozzleGeo, crimsonKnotMat);
    nozzleMesh.renderOrder = 2;
    knotGroup.add(nozzleMesh);

    // Ruffled retracted crimson latex collar (unfurls right as torn skin snaps into the knot at 1.25s..1.60s)
    function createRemnantCollarGeometry() {
      const segU = 56;
      const segV = 14;
      const geo = new THREE.BufferGeometry();
      const pos = [];
      const uvs = [];
      const idx = [];
      const petalPhases = [];
      for (let k = 0; k < 7; k++) {
        petalPhases.push(prng() * Math.PI * 2.0);
      }
      for (let j = 0; j <= segV; j++) {
        const v = j / segV;
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          const phi = u * Math.PI * 2.0;
          const wave = 0.35 * Math.sin(phi * 5.0 + petalPhases[0])
                     + 0.28 * Math.sin(phi * 9.0 + petalPhases[1])
                     + 0.18 * Math.cos(phi * 14.0 + petalPhases[2]);
          const len = 0.18 + 0.14 * (0.5 + 0.5 * wave);
          const r = 0.088 + v * (0.14 + 0.09 * wave) + 0.025 * Math.sin(v * 9.0 + phi * 4.0);
          const y = -0.01 - v * len;
          pos.push(r * Math.cos(phi), y, r * Math.sin(phi));
          uvs.push(u, v);
        }
      }
      for (let j = 0; j < segV; j++) {
        for (let i = 0; i < segU; i++) {
          const a = j * (segU + 1) + i;
          const b = a + 1;
          const c = a + (segU + 1);
          const d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      }
      geo.setIndex(idx);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();
      return geo;
    }

    const remnantCollarMesh = new THREE.Mesh(createRemnantCollarGeometry(), crimsonKnotMat);
    remnantCollarMesh.renderOrder = 2;
    remnantCollarMesh.visible = false;
    knotGroup.add(remnantCollarMesh);

    // =========================================================================
    // 2. CONICAL COPPER / BRASS RIFLED PROJECTILE & MACH BOW WAVE
    // =========================================================================
    const bulletGroup = new THREE.Group();
    scene.add(bulletGroup);

    const bulletSpinGroup = new THREE.Group();
    bulletGroup.add(bulletSpinGroup);

    const bulletBumpTex = createBulletBumpTexture();

    // Copper secant-ogive nose (tip at x = 0 pointing -X, extending to x = +0.345)
    const copperPts = [];
    const ogiveSteps = 28;
    for (let i = 0; i <= ogiveSteps; i++) {
      const t = i / ogiveSteps;
      const x = 0.345 * t;
      // Secant ogive profile from small meplat r=0.008 up to caliber r=0.084
      const r = i === 0 ? 0.006 : (0.008 + 0.076 * Math.pow(Math.sin(t * Math.PI * 0.5), 0.74));
      copperPts.push(new THREE.Vector2(r, x));
    }
    const copperGeo = new THREE.LatheBufferGeometry(copperPts, 48);
    // Lathe builds along +Y; rotate -90 deg around Z so y->+X (tip at 0, body along +X)
    copperGeo.rotateZ(-Math.PI * 0.5);

    const copperMat = new THREE.MeshStandardMaterial({
      color: 0xe27a49,
      metalness: 0.93,
      roughness: 0.18,
      bumpMap: bulletBumpTex,
      bumpScale: 0.0035
    });
    const copperNoseMesh = new THREE.Mesh(copperGeo, copperMat);
    copperNoseMesh.renderOrder = 3;
    bulletSpinGroup.add(copperNoseMesh);

    // Brass cannelure groove + driving band + tapered boat-tail (x = +0.345 to +0.565)
    const brassPts = [
      new THREE.Vector2(0.084, 0.345),
      new THREE.Vector2(0.075, 0.355),
      new THREE.Vector2(0.075, 0.378),
      new THREE.Vector2(0.084, 0.388),
      new THREE.Vector2(0.084, 0.475),
      new THREE.Vector2(0.066, 0.562),
      new THREE.Vector2(0.052, 0.565),
      new THREE.Vector2(0.000, 0.556)
    ];
    const brassGeo = new THREE.LatheBufferGeometry(brassPts, 48);
    brassGeo.rotateZ(-Math.PI * 0.5);

    const brassMat = new THREE.MeshStandardMaterial({
      color: 0xe3ba54,
      metalness: 0.91,
      roughness: 0.21,
      bumpMap: bulletBumpTex,
      bumpScale: 0.004
    });
    const brassTailMesh = new THREE.Mesh(brassGeo, brassMat);
    brassTailMesh.renderOrder = 3;
    bulletSpinGroup.add(brassTailMesh);

    // Subtle supersonic Mach air-compression cone & wake shimmer around bullet in air
    const machPts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const x = -0.02 + 1.55 * t;
      const r = 0.018 + 0.52 * Math.pow(t, 0.72);
      machPts.push(new THREE.Vector2(r, x));
    }
    const machGeo = new THREE.LatheBufferGeometry(machPts, 40);
    machGeo.rotateZ(-Math.PI * 0.5);

    const machMat = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uOpacity: { value: 0.0 },
        uSimTime: { value: 0.0 }
      },
      vertexShader: [
        'varying vec3 vNormalW;',
        'varying vec3 vViewDir;',
        'varying vec2 vUv;',
        'void main() {',
        '  vUv = uv;',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vNormalW = normalize(mat3(modelMatrix) * normal);',
        '  vViewDir = normalize(cameraPosition - wp.xyz);',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uOpacity;',
        'uniform float uSimTime;',
        'varying vec3 vNormalW;',
        'varying vec3 vViewDir;',
        'varying vec2 vUv;',
        'void main() {',
        '  float ndv = abs(dot(normalize(vNormalW), normalize(vViewDir)));',
        '  float rim = pow(clamp(1.0 - ndv, 0.0, 1.0), 3.2);',
        '  float fadeTail = (1.0 - smoothstep(0.18, 1.0, vUv.y)) * smoothstep(0.0, 0.08, vUv.y);',
        '  float wave = 0.85 + 0.15 * sin(vUv.y * 28.0 - uSimTime * 24.0);',
        '  float a = uOpacity * rim * fadeTail * wave;',
        '  vec3 col = mix(vec3(0.62, 0.88, 1.0), vec3(0.95, 0.82, 1.0), vUv.y);',
        '  gl_FragColor = vec4(col * a, a);',
        '}'
      ].join('\n')
    });
    const machConeMesh = new THREE.Mesh(machGeo, machMat);
    machConeMesh.renderOrder = 4;
    bulletGroup.add(machConeMesh);

    // =========================================================================
    // 3. SHARED PARAMETRIC GRID BUILDER FOR LATEX & WATER CORE (128 x 96)
    // =========================================================================
    function createParametricBalloonGrid(segPhi, segS) {
      const geo = new THREE.BufferGeometry();
      const verts = [];
      const uvs = [];
      const indices = [];
      for (let j = 0; j <= segS; j++) {
        const s = j / segS;
        for (let i = 0; i <= segPhi; i++) {
          const u = i / segPhi;
          const phi = u * Math.PI * 2.0;
          const p = evalBalloonBaseJS(s, phi);
          verts.push(p.x, p.y, p.z);
          uvs.push(u, s);
        }
      }
      for (let j = 0; j < segS; j++) {
        for (let i = 0; i < segPhi; i++) {
          const a = j * (segPhi + 1) + i;
          const b = a + 1;
          const c = a + (segPhi + 1);
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }
      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geo;
    }

    const sharedBalloonGrid = createParametricBalloonGrid(128, 96);

    // =========================================================================
    // 4. DEEP CRIMSON ELASTIC LATEX MEMBRANE (#e61c24) WITH DYNAMIC RETRACTION
    // =========================================================================
    const latexUniforms = {
      uSimTime: { value: 0.0 },
      uBulletTipX: { value: 5.95 },
      uTearFront: { value: -0.1 },
      uEnvMap: { value: studioCubeTex }
    };

    const latexVertexShader = [
      'uniform float uSimTime;',
      'uniform float uBulletTipX;',
      'uniform float uTearFront;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying float vTearMargin;',
      'varying float vStrain;',
      'varying float vElevS;',
      GLSL_COMMON,
      'vec3 evalLatexSurface(float s, float phi, out float outMargin, out float outStrain) {',
      '  vec3 p0 = evalBalloonBase(s, phi);',
      '  p0.xz *= 1.015;',
      '  p0.y = mix(p0.y, p0.y * 1.008, 1.0 - s);',
      '  outStrain = 0.0;',
      '  // Angle/distance from right impact point (+0.918, 0, 0)',
      '  vec3 impVec = normalize(vec3(p0.x, p0.y * 0.80, p0.z) + vec3(1e-5, 0.0, 0.0));',
      '  float angFromImp = acos(clamp(impVec.x, -1.0, 1.0)) / 3.14159265;',
      '  float az = atan(p0.y, p0.z);',
      '  float teeth = 0.044 * sin(az * 7.0 + 0.65) + 0.027 * sin(az * 13.0 - 1.35) + 0.015 * cos(az * 21.0 + 2.2);',
      '  float tearCoord = angFromImp + teeth * smoothstep(0.025, 0.22, angFromImp);',
      '  outMargin = tearCoord - uTearFront;',
      '  vec3 p = p0;',
      '  // Elastic contact indentation & concentric ripples (1.000s - 1.180s)',
      '  if (uSimTime > 0.985) {',
      '    float rYZ = length(p0.yz);',
      '    if (p0.x > 0.15) {',
      '      float indentAmt = clamp(0.918 - uBulletTipX, 0.0, 0.22) * (1.0 - smoothstep(1.13, 1.24, uSimTime));',
      '      float cone = exp(-rYZ * rYZ / 0.095) * smoothstep(0.15, 0.65, p0.x);',
      '      p.x -= indentAmt * cone * 1.12;',
      '      p.yz *= 1.0 - 0.07 * indentAmt * cone;',
      '      outStrain += cone * indentAmt * 4.5;',
      '    }',
      '    float dtImp = max(0.0, uSimTime - 1.000);',
      '    float waveFront = angFromImp * 1.85 - dtImp * 4.2;',
      '    float ripple = 0.013 * sin(waveFront * 36.0) * exp(-abs(waveFront) * 5.2) * smoothstep(1.000, 1.020, uSimTime) * (1.0 - smoothstep(1.15, 1.48, uSimTime));',
      '    vec3 radN = normalize(vec3(p0.x, (p0.y - 0.05) * 0.55, p0.z) + vec3(0.0, 1e-4, 0.0));',
      '    p += radN * ripple;',
      '  }',
      '  // Rapid elastic retraction toward top tether & lower base (3-5x faster than fluid)',
      '  if (uSimTime > 1.120) {',
      '    float retract = clamp((uSimTime - 1.120) / 0.460, 0.0, 1.0);',
      '    float localEdge = smoothstep(0.38, 0.0, max(outMargin, 0.0)) * smoothstep(1.120, 1.160, uSimTime);',
      '    float splitLine = -0.58 + 0.14 * cos(az * 3.0 + 0.4);',
      '    if (p0.y > splitLine) {',
      '      vec3 knotTarget = vec3(p0.x * 0.14, 1.31 - (1.31 - p0.y) * 0.16, p0.z * 0.14);',
      '      float pull = clamp(0.76 * retract * retract + 0.30 * localEdge, 0.0, 0.96);',
      '      p = mix(p, knotTarget, pull);',
      '    } else {',
      '      vec3 baseTarget = vec3(p0.x * 0.28 - 0.12, -1.06 + (p0.y + 1.06) * 0.22, p0.z * 0.28);',
      '      float pull = clamp(0.72 * retract * retract + 0.30 * localEdge, 0.0, 0.95);',
      '      p = mix(p, baseTarget, pull);',
      '    }',
      '    // Rolled free recoil rim along the tearing fracture front',
      '    float rimBand = clamp(1.0 - max(outMargin, 0.0) / 0.085, 0.0, 1.0);',
      '    float roll = sin(rimBand * 3.14159265) * smoothstep(1.120, 1.145, uSimTime);',
      '    vec3 outDir = normalize(vec3(p.x, (p.y - 0.05) * 0.45, p.z) + vec3(0.0, 1e-4, 0.0));',
      '    p += outDir * (0.044 * roll);',
      '    outStrain += rimBand * 0.85;',
      '  }',
      '  return p;',
      '}',
      'void main() {',
      '  float phi = uv.x * 6.2831853;',
      '  float s = clamp(uv.y, 0.003, 0.992);',
      '  vElevS = s;',
      '  float m0, st0, m1, st1, m2, st2;',
      '  vec3 p = evalLatexSurface(s, phi, m0, st0);',
      '  float eps = 0.005;',
      '  vec3 pPhi = evalLatexSurface(s, phi + eps * 6.2831853, m1, st1);',
      '  vec3 pS = evalLatexSurface(s + eps, phi, m2, st2);',
      '  vec3 n = normalize(cross(pS - p, pPhi - p) + vec3(0.0, 1e-6, 0.0));',
      '  vTearMargin = m0;',
      '  vStrain = st0;',
      '  vec4 wp = modelMatrix * vec4(p, 1.0);',
      '  vWorldPos = wp.xyz;',
      '  vWorldNormal = normalize(mat3(modelMatrix) * n);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    const latexFragmentShader = [
      'uniform float uSimTime;',
      'uniform samplerCube uEnvMap;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying float vTearMargin;',
      'varying float vStrain;',
      'varying float vElevS;',
      GLSL_COMMON,
      'void main() {',
      '  if (uSimTime > 1.120 && vTearMargin < 0.0) discard;',
      '  vec3 N = normalize(vWorldNormal) * (gl_FrontFacing ? 1.0 : -1.0);',
      '  vec3 V = normalize(cameraPosition - vWorldPos);',
      '  float ndv = max(dot(N, V), 0.0);',
      '  // Deep crimson red (#e61c24 -> linear ~ (0.791, 0.0116, 0.0176))',
      '  vec3 baseCrimson = vec3(0.791, 0.012, 0.018);',
      '  float stretchBelly = sin(vElevS * 3.14159265);',
      '  vec3 stretchedCrimson = mix(vec3(0.58, 0.007, 0.011), vec3(0.92, 0.022, 0.028), stretchBelly);',
      '  stretchedCrimson = mix(stretchedCrimson, vec3(1.05, 0.09, 0.08), clamp(vStrain * 0.45, 0.0, 0.65));',
      '  // 3-point studio + dual rim lights + subsurface latex wrap scattering',
      '  vec3 Lkey = normalize(vec3(-2.2, 5.6, 4.8));',
      '  vec3 Lcyan = normalize(vec3(-6.2, 2.3, -4.6));',
      '  vec3 Lmag = normalize(vec3(6.2, 1.8, -4.6));',
      '  float diffKey = max(0.0, (dot(N, Lkey) + 0.38) / 1.38);',
      '  float sssCyan = pow(clamp(dot(-N, Lcyan) * 0.5 + 0.5, 0.0, 1.0), 2.2) * (0.45 + 0.55 * stretchBelly);',
      '  float sssMag = pow(clamp(dot(-N, Lmag) * 0.5 + 0.5, 0.0, 1.0), 2.2) * (0.45 + 0.55 * stretchBelly);',
      '  float sssBack = pow(1.0 - ndv, 1.8) * stretchBelly;',
      '  vec3 diffuse = stretchedCrimson * (0.14 + 0.95 * diffKey)',
      '               + vec3(0.95, 0.06, 0.05) * (0.42 * sssCyan + 0.38 * sssMag + 0.28 * sssBack);',
      '  // Fresnel + glossy clearcoat studio reflections',
      '  float fresnel = 0.045 + 0.955 * pow(clamp(1.0 - ndv, 0.0, 1.0), 4.4);',
      '  vec3 R = reflect(-V, N);',
      '  vec3 envSpec = sampleEnvLinear(uEnvMap, R);',
      '  vec3 Hkey = normalize(Lkey + V);',
      '  float specKey = pow(max(dot(N, Hkey), 0.0), 140.0) * 2.1 + pow(max(dot(N, Hkey), 0.0), 24.0) * 0.22;',
      '  float rimCyan = pow(clamp(1.0 - ndv, 0.0, 1.0), 3.2) * max(0.0, dot(N, normalize(vec3(-1.0, 0.35, -0.35))));',
      '  float rimMag = pow(clamp(1.0 - ndv, 0.0, 1.0), 3.2) * max(0.0, dot(N, normalize(vec3(1.0, 0.25, -0.35))));',
      '  vec3 rimGlow = vec3(0.45, 0.92, 1.0) * rimCyan * 0.85 + vec3(1.0, 0.58, 0.92) * rimMag * 0.78;',
      '  // Extra rolled recoil lip gleam along tear edge',
      '  float tearRim = (uSimTime > 1.120) ? smoothstep(0.075, 0.0, max(vTearMargin, 0.0)) : 0.0;',
      '  vec3 linearCol = diffuse * (1.0 - 0.35 * fresnel) + envSpec * (0.18 + 0.82 * fresnel) + vec3(specKey) + rimGlow + vec3(0.85, 0.12, 0.14) * tearRim * 0.65;',
      '  float alpha = gl_FrontFacing ? mix(0.91, 0.985, fresnel + tearRim * 0.2) : 0.62;',
      '  gl_FragColor = vec4(finishHDR(linearCol), clamp(alpha, 0.0, 1.0));',
      '}'
    ].join('\n');

    const latexBackMat = new THREE.ShaderMaterial({
      uniforms: latexUniforms,
      vertexShader: latexVertexShader,
      fragmentShader: latexFragmentShader,
      transparent: true,
      depthWrite: false,
      side: THREE.BackSide
    });
    const latexFrontMat = new THREE.ShaderMaterial({
      uniforms: latexUniforms,
      vertexShader: latexVertexShader,
      fragmentShader: latexFragmentShader,
      transparent: true,
      depthWrite: true,
      side: THREE.FrontSide
    });

    const latexBackMesh = new THREE.Mesh(sharedBalloonGrid, latexBackMat);
    latexBackMesh.renderOrder = 7;
    scene.add(latexBackMesh);

    const latexFrontMesh = new THREE.Mesh(sharedBalloonGrid, latexFrontMat);
    latexFrontMesh.renderOrder = 8;
    scene.add(latexFrontMesh);

    // =========================================================================
    // 5. COHESIVE REFRACTIVE WATER MASS (INERTIAL STASIS -> CAVITATION -> RUPTURE)
    // =========================================================================
    const waterUniforms = {
      uSimTime: { value: 0.0 },
      uBulletTipX: { value: 5.95 },
      uEnvMap: { value: studioCubeTex }
    };

    const waterVertexShader = [
      'uniform float uSimTime;',
      'uniform float uBulletTipX;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying vec3 vBasePos;',
      'varying float vHoleMask;',
      'varying float vEntryDist;',
      'varying float vExitDist;',
      GLSL_COMMON,
      'vec3 evalWaterSurface(float s, float phi, out float eDist, out float xDist) {',
      '  vec3 p0 = evalBalloonBase(s, phi);',
      '  vec3 p = p0;',
      '  float rYZ = length(p0.yz);',
      '  eDist = (p0.x > 0.0) ? rYZ : 9.0;',
      '  xDist = (p0.x < 0.0) ? rYZ : 9.0;',
      '  // 1. Subtle capillary shear ripples left by peeling crimson latex (1.14s - 3.20s)',
      '  float capEnv = smoothstep(1.12, 1.35, uSimTime) * (1.0 - smoothstep(2.80, 4.40, uSimTime));',
      '  float capWave = 0.0085 * sin(s * 52.0 - uSimTime * 16.0 + phi * 4.0) + 0.0055 * cos(s * 34.0 + phi * 9.0 - uSimTime * 12.0);',
      '  vec3 outN = normalize(vec3(p0.x, (p0.y - 0.04) * 0.48, p0.z) + vec3(0.0, 1e-4, 0.0));',
      '  p += outN * (capWave * capEnv);',
      '  // 2. Inertial Stasis (1.60s - 2.40s) holds exact teardrop shape; radial cavitation bulge grows 2.35s - 4.60s',
      '  float cavExpand = smoothstep(2.25, 3.85, uSimTime) + 0.38 * smoothstep(3.85, 5.40, uSimTime);',
      '  float eqWeight = exp(-p0.y * p0.y * 1.45);',
      '  float rtLobes = 1.0 + 0.14 * smoothstep(3.90, 5.40, uSimTime) * (sin(phi * 11.0 + 0.5) * 0.65 + cos(phi * 17.0 - 1.1) * 0.35);',
      '  p.xz *= 1.0 + cavExpand * (0.14 + 0.20 * eqWeight) * rtLobes;',
      '  // 3. Right entry crater collar flare (+X hole venting backward cavitation splash)',
      '  if (p0.x > 0.15 && uSimTime > 1.12) {',
      '    float craterGrow = smoothstep(1.14, 2.60, uSimTime) + 0.45 * smoothstep(2.60, 4.20, uSimTime);',
      '    float rHole = 0.085 + 0.19 * craterGrow;',
      '    float collar = exp(-pow((rYZ - rHole) / 0.16, 2.0)) * smoothstep(0.25, 0.70, p0.x);',
      '    p.x += 0.24 * craterGrow * collar;',
      '    p.yz += normalize(p0.yz + vec2(1e-5)) * (0.095 * craterGrow * collar);',
      '  }',
      '  // 4. Left exit blister dome (3.45s - 3.80s) & forward exit puncture collar (3.80s+)',
      '  if (p0.x < -0.15 && uSimTime > 3.35) {',
      '    float preBulge = smoothstep(3.35, 3.80, uSimTime);',
      '    float postFlare = smoothstep(3.80, 4.55, uSimTime);',
      '    float dome = exp(-rYZ * rYZ / (0.11 + 0.14 * postFlare)) * smoothstep(-0.20, -0.68, p0.x);',
      '    p.x -= (0.18 * preBulge + 0.22 * postFlare) * dome;',
      '    p.yz += normalize(p0.yz + vec2(1e-5)) * (0.11 * postFlare * dome);',
      '  }',
      '  // 5. Gravitational acceleration after inertial stasis (very slight 2.2-3.4s, strong cascade 3.8-5.7s)',
      '  float dtStasis = max(0.0, uSimTime - 2.15);',
      '  float dtCascade = max(0.0, uSimTime - 3.75);',
      '  float gravDrop = 0.022 * dtStasis * dtStasis + 0.56 * dtCascade * dtCascade;',
      '  p.y -= gravDrop * (0.82 + 0.36 * (1.0 - s));',
      '  return p;',
      '}',
      'void main() {',
      '  float phi = uv.x * 6.2831853;',
      '  float s = clamp(uv.y, 0.003, 0.992);',
      '  vBasePos = evalBalloonBase(s, phi);',
      '  float e0, x0, e1, x1, e2, x2;',
      '  vec3 p = evalWaterSurface(s, phi, e0, x0);',
      '  float eps = 0.005;',
      '  vec3 pPhi = evalWaterSurface(s, phi + eps * 6.2831853, e1, x1);',
      '  vec3 pS = evalWaterSurface(s + eps, phi, e2, x2);',
      '  vec3 n = normalize(cross(pS - p, pPhi - p) + vec3(0.0, 1e-6, 0.0));',
      '  vEntryDist = e0;',
      '  vExitDist = x0;',
      '  vHoleMask = s;',
      '  vec4 wp = modelMatrix * vec4(p, 1.0);',
      '  vWorldPos = wp.xyz;',
      '  vWorldNormal = normalize(mat3(modelMatrix) * n);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    const waterFragmentShader = [
      'uniform float uSimTime;',
      'uniform samplerCube uEnvMap;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying vec3 vBasePos;',
      'varying float vHoleMask;',
      'varying float vEntryDist;',
      'varying float vExitDist;',
      GLSL_COMMON,
      'float sheetBreakupField(vec3 bp) {',
      '  float phi = atan(bp.z, bp.x);',
      '  float f1 = 0.5 + 0.5 * sin(phi * 11.0 + bp.y * 7.5 + 0.4);',
      '  float f2 = 0.5 + 0.5 * cos(phi * 17.0 - bp.y * 11.2 - 1.1);',
      '  float f3 = 0.5 + 0.5 * sin(bp.x * 14.0 + bp.y * 15.5 - bp.z * 13.0);',
      '  return 0.44 * f1 + 0.34 * f2 + 0.22 * f3;',
      '}',
      'void main() {',
      '  // Open right entry hole throat & left exit puncture throat',
      '  float entryR = 0.075 * smoothstep(1.12, 1.25, uSimTime) + 0.145 * smoothstep(2.20, 3.80, uSimTime);',
      '  if (vEntryDist < entryR) discard;',
      '  float exitR = 0.205 * smoothstep(3.79, 4.15, uSimTime);',
      '  if (uSimTime >= 3.795 && vExitDist < exitR) discard;',
      '  // Taylor-Culick / Plateau-Rayleigh sheet perforation (4.35s -> 5.65s)',
      '  float breakupProg = smoothstep(4.30, 5.62, uSimTime);',
      '  float hField = sheetBreakupField(vBasePos);',
      '  // Equatorial thinned belt perforates slightly earlier than denser bottom/top',
      '  float eqBias = 0.14 * exp(-vBasePos.y * vBasePos.y * 1.8);',
      '  float holeMargin = (hField - eqBias) - (breakupProg * 1.16 - 0.06);',
      '  if (breakupProg > 0.001 && holeMargin < 0.0) discard;',
      '  vec3 N = normalize(vWorldNormal) * (gl_FrontFacing ? 1.0 : -1.0);',
      '  // Thickened rounded liquid meniscus rim around opening sheet holes & crater lips',
      '  float meniscus = 0.0;',
      '  if (breakupProg > 0.001 && holeMargin < 0.095) {',
      '    meniscus = 1.0 - holeMargin / 0.095;',
      '    vec3 tang = normalize(cross(N, vec3(0.35, 0.91, 0.22)) + vec3(1e-4));',
      '    N = normalize(N + tang * (meniscus * 0.65));',
      '  }',
      '  float entryLip = smoothstep(entryR + 0.09, entryR, vEntryDist) * step(1.13, uSimTime);',
      '  float exitLip = smoothstep(exitR + 0.10, exitR, vExitDist) * step(3.80, uSimTime);',
      '  meniscus = max(meniscus, max(entryLip, exitLip) * 0.85);',
      '  vec3 V = normalize(cameraPosition - vWorldPos);',
      '  float ndv = max(dot(N, V), 0.0);',
      '  // Schlick Fresnel for clean water (IOR = 1.333 -> F0 = 0.0204)',
      '  float fresnel = 0.021 + 0.979 * pow(clamp(1.0 - ndv, 0.0, 1.0), 4.6);',
      '  vec3 R = reflect(-V, N);',
      '  vec3 reflCol = sampleEnvLinear(uEnvMap, R);',
      '  // Chromatic dispersion Snell refraction',
      '  float eta = gl_FrontFacing ? (1.0 / 1.333) : 1.12;',
      '  vec3 refrR = refract(-V, N, eta * 0.992);',
      '  vec3 refrG = refract(-V, N, eta);',
      '  vec3 refrB = refract(-V, N, eta * 1.008);',
      '  vec3 refrCol;',
      '  refrCol.r = sampleEnvLinear(uEnvMap, refrR).r;',
      '  refrCol.g = sampleEnvLinear(uEnvMap, refrG).g;',
      '  refrCol.b = sampleEnvLinear(uEnvMap, refrB).b;',
      '  // Subtle crystal-clear water absorption + dual rim forward scattering',
      '  refrCol *= vec3(0.84, 0.95, 1.02);',
      '  vec3 Lkey = normalize(vec3(-2.2, 5.6, 4.8));',
      '  vec3 Lcyan = normalize(vec3(-6.2, 2.3, -4.6));',
      '  vec3 Lmag = normalize(vec3(6.2, 1.8, -4.6));',
      '  vec3 Hkey = normalize(Lkey + V);',
      '  float specKey = pow(max(dot(N, Hkey), 0.0), 260.0) * 3.4 + pow(max(dot(N, Hkey), 0.0), 42.0) * 0.18;',
      '  float scatterCyan = pow(max(0.0, dot(-V, Lcyan) * 0.45 + 0.55 * (1.0 - ndv)), 3.0);',
      '  float scatterMag = pow(max(0.0, dot(-V, Lmag) * 0.45 + 0.55 * (1.0 - ndv)), 3.0);',
      '  vec3 rimCaustic = vec3(0.36, 0.90, 1.0) * scatterCyan * 0.72 + vec3(0.98, 0.54, 0.90) * scatterMag * 0.62;',
      '  vec3 meniscusGlow = vec3(0.82, 0.95, 1.0) * meniscus * 0.55;',
      '  vec3 col = mix(refrCol + rimCaustic * 0.55, reflCol + rimCaustic, fresnel) + vec3(specKey) + meniscusGlow;',
      '  float alpha;',
      '  if (gl_FrontFacing) {',
      '    alpha = clamp(0.15 + 0.83 * fresnel + 0.42 * meniscus + 0.25 * clamp(specKey, 0.0, 1.0), 0.15, 0.97);',
      '  } else {',
      '    alpha = clamp(0.24 + 0.58 * fresnel + 0.30 * meniscus, 0.22, 0.88);',
      '  }',
      '  alpha *= (1.0 - smoothstep(5.42, 5.66, uSimTime));',
      '  gl_FragColor = vec4(finishHDR(col), alpha);',
      '}'
    ].join('\n');

    const waterBackMat = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      vertexShader: waterVertexShader,
      fragmentShader: waterFragmentShader,
      transparent: true,
      depthWrite: false,
      side: THREE.BackSide
    });
    const waterFrontMat = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      vertexShader: waterVertexShader,
      fragmentShader: waterFragmentShader,
      transparent: true,
      depthWrite: false,
      side: THREE.FrontSide
    });

    const waterBackMesh = new THREE.Mesh(sharedBalloonGrid, waterBackMat);
    waterBackMesh.renderOrder = 2;
    scene.add(waterBackMesh);

    const waterFrontMesh = new THREE.Mesh(sharedBalloonGrid, waterFrontMat);
    waterFrontMesh.renderOrder = 6;
    scene.add(waterFrontMesh);

    // =========================================================================
    // 6. INTERNAL HYDRODYNAMIC CAVITATION VAPOR TUNNEL (1.14s - 5.30s)
    // =========================================================================
    function createCavitationGrid(segX, segPhi) {
      const geo = new THREE.BufferGeometry();
      const verts = [];
      const uvs = [];
      const indices = [];
      for (let j = 0; j <= segX; j++) {
        const u = j / segX;
        for (let i = 0; i <= segPhi; i++) {
          const v = i / segPhi;
          verts.push(u, v, 0.0);
          uvs.push(u, v);
        }
      }
      for (let j = 0; j < segX; j++) {
        for (let i = 0; i < segPhi; i++) {
          const a = j * (segPhi + 1) + i;
          const b = a + 1;
          const c = a + (segPhi + 1);
          const d = c + 1;
          indices.push(a, b, c, b, d, c);
        }
      }
      geo.setIndex(indices);
      geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      return geo;
    }

    const cavUniforms = {
      uSimTime: { value: 0.0 },
      uBulletTipX: { value: 5.95 },
      uEnvMap: { value: studioCubeTex }
    };

    const cavVertexShader = [
      'uniform float uSimTime;',
      'uniform float uBulletTipX;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying vec2 vCavUv;',
      'vec3 evalCavPoint(float u, float v) {',
      '  float xRight = 0.90 + 0.14 * smoothstep(2.20, 3.90, uSimTime);',
      '  float xLeft = max(-1.16, uBulletTipX + 0.42);',
      '  float x = mix(xLeft, xRight, u);',
      '  float phi = v * 6.2831853;',
      '  // Parabolic Rayleigh-Plesset vapor cavity envelope with helical rifling striations',
      '  float phaseGrow = smoothstep(1.14, 2.35, uSimTime) * 0.36 + smoothstep(2.35, 3.80, uSimTime) * 0.64;',
      '  float collapse = 1.0 - 0.72 * smoothstep(4.05, 5.25, uSimTime);',
      '  float noseTaper = pow(clamp(u, 0.0, 1.0), 0.42);',
      '  float entryBell = 1.0 + 0.32 * pow(u, 3.0) * smoothstep(2.30, 3.80, uSimTime);',
      '  float baseR = (0.068 + 0.32 * phaseGrow * sin(clamp(u * 0.88 + 0.08, 0.0, 1.0) * 3.14159265)) * noseTaper * entryBell * collapse;',
      '  float ribs = 1.0 + 0.085 * sin(x * 26.0 + phi * 3.0 + uSimTime * 18.0) + 0.055 * cos(x * 44.0 - phi * 5.0);',
      '  float r = max(0.015, baseR * ribs);',
      '  float dtFall = max(0.0, uSimTime - 3.75);',
      '  float yOff = -0.52 * dtFall * dtFall;',
      '  return vec3(x, yOff + r * cos(phi), r * sin(phi));',
      '}',
      'void main() {',
      '  vCavUv = uv;',
      '  float u = clamp(uv.x, 0.003, 0.990);',
      '  float v = uv.y;',
      '  vec3 p = evalCavPoint(u, v);',
      '  vec3 pu = evalCavPoint(u + 0.008, v);',
      '  vec3 pv = evalCavPoint(u, v + 0.008);',
      '  vec3 n = normalize(cross(pv - p, pu - p) + vec3(0.0, 1e-6, 0.0));',
      '  vec4 wp = modelMatrix * vec4(p, 1.0);',
      '  vWorldPos = wp.xyz;',
      '  vWorldNormal = normalize(mat3(modelMatrix) * n);',
      '  gl_Position = projectionMatrix * viewMatrix * wp;',
      '}'
    ].join('\n');

    const cavFragmentShader = [
      'uniform float uSimTime;',
      'uniform samplerCube uEnvMap;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying vec2 vCavUv;',
      GLSL_COMMON,
      'void main() {',
      '  float breakup = smoothstep(4.35, 5.28, uSimTime);',
      '  float froth = 0.5 + 0.5 * sin(vCavUv.x * 46.0 + vCavUv.y * 18.84955 + uSimTime * 10.0)',
      '                    * cos(vCavUv.x * 29.0 - vCavUv.y * 31.41592);',
      '  if (breakup > 0.01 && froth < breakup * 1.05) discard;',
      '  vec3 N = normalize(vWorldNormal) * (gl_FrontFacing ? 1.0 : -1.0);',
      '  vec3 V = normalize(cameraPosition - vWorldPos);',
      '  float ndv = abs(dot(N, V));',
      '  float rim = pow(clamp(1.0 - ndv, 0.0, 1.0), 2.1);',
      '  vec3 envCol = sampleEnvLinear(uEnvMap, reflect(-V, N));',
      '  // Luminous aerated vapor & micro-bubble backscatter inside water',
      '  vec3 vaporCore = mix(vec3(0.52, 0.78, 0.95), vec3(0.92, 0.97, 1.0), froth);',
      '  vec3 rimTint = mix(vec3(0.45, 0.90, 1.0), vec3(0.98, 0.68, 0.95), vCavUv.x);',
      '  vec3 col = vaporCore * (0.45 + 0.65 * froth) + envCol * (0.35 + 0.55 * rim) + rimTint * rim * 0.75;',
      '  float endFade = smoothstep(0.0, 0.06, vCavUv.x) * (1.0 - 0.35 * smoothstep(0.92, 1.0, vCavUv.x));',
      '  float alpha = clamp((0.34 + 0.54 * rim + 0.18 * froth) * endFade * (1.0 - smoothstep(4.85, 5.30, uSimTime)), 0.0, 0.92);',
      '  gl_FragColor = vec4(finishHDR(col), alpha);',
      '}'
    ].join('\n');

    const cavitationMesh = new THREE.Mesh(
      createCavitationGrid(84, 42),
      new THREE.ShaderMaterial({
        uniforms: cavUniforms,
        vertexShader: cavVertexShader,
        fragmentShader: cavFragmentShader,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    cavitationMesh.renderOrder = 4;
    scene.add(cavitationMesh);

    // =========================================================================
    // 7. GPU-EVALUATED 3D DROPLETS, LIGAMENTS, FLUID SHEETS & LATEX SHREDS
    // =========================================================================
    // Solve floor impact dt analytically: y0 + (vy0/k)*ln(1+k*dt) - 0.5*g*dt^2 = FLOOR_Y
    // Using 8 steps of Newton/bisection at startup so every 3D droplet hits FLOOR_Y seamlessly!
    function solveFloorHitDt(y0, vy0, dragK, gAcc) {
      if (gAcc <= 0.001) return 99.0;
      const evalY = function(dt) {
        const dragTerm = dragK > 1e-4 ? (vy0 / dragK) * Math.log(1.0 + dragK * dt) : vy0 * dt;
        return y0 + dragTerm - 0.5 * gAcc * dt * dt - FLOOR_Y;
      };
      let lo = 0.02;
      let hi = 8.5;
      if (evalY(hi) > 0.0) return 99.0;
      for (let iter = 0; iter < 18; iter++) {
        const mid = 0.5 * (lo + hi);
        if (evalY(mid) > 0.0) lo = mid;
        else hi = mid;
      }
      return 0.5 * (lo + hi);
    }

    const NUM_3D_ELEMENTS = 2900;
    // Per-instance attributes:
    // aPos0 (vec4): x0, y0, z0, tSpawn
    // aVel0 (vec4): vx0, vy0, vz0, dragK
    // aPhys (vec4): radius, gAcc, tHitDt, kind (0=droplet/ligament, 1=fluidSheet, 2=crimsonShred)
    // aMisc (vec4): seedPhase, stretchMult, bounceAng, lifeMax
    const instPos0 = new Float32Array(NUM_3D_ELEMENTS * 4);
    const instVel0 = new Float32Array(NUM_3D_ELEMENTS * 4);
    const instPhys = new Float32Array(NUM_3D_ELEMENTS * 4);
    const instMisc = new Float32Array(NUM_3D_ELEMENTS * 4);

    let instCursor = 0;
    function pushInstance(x0, y0, z0, tSpawn, vx0, vy0, vz0, dragK, radius, gAcc, kind, stretchMult, lifeMax) {
      if (instCursor >= NUM_3D_ELEMENTS) return;
      const i4 = instCursor * 4;
      const hitDt = solveFloorHitDt(y0, vy0, dragK, gAcc);
      instPos0[i4 + 0] = x0;
      instPos0[i4 + 1] = y0;
      instPos0[i4 + 2] = z0;
      instPos0[i4 + 3] = tSpawn;

      instVel0[i4 + 0] = vx0;
      instVel0[i4 + 1] = vy0;
      instVel0[i4 + 2] = vz0;
      instVel0[i4 + 3] = dragK;

      instPhys[i4 + 0] = radius;
      instPhys[i4 + 1] = gAcc;
      instPhys[i4 + 2] = hitDt;
      instPhys[i4 + 3] = kind;

      instMisc[i4 + 0] = prng() * 6.2831853;
      instMisc[i4 + 1] = stretchMult;
      instMisc[i4 + 2] = prng() * 6.2831853;
      instMisc[i4 + 3] = lifeMax;
      instCursor++;
    }

    // 7A. 36 Crimson Latex Micro-Shreds snapping off during skin tear (1.16s - 1.54s)
    for (let i = 0; i < 36; i++) {
      const s = randRange(0.06, 0.62);
      const phi = randRange(-Math.PI, Math.PI);
      const p = evalBalloonBaseJS(s, phi);
      const impAng = Math.acos(clamp(p.x / Math.max(0.01, Math.hypot(p.x, p.y * 0.8, p.z)), -1.0, 1.0)) / Math.PI;
      const tSpawn = 1.13 + impAng * 0.40 + randRange(0.0, 0.04);
      const outScale = randRange(0.9, 2.2);
      pushInstance(
        p.x * 1.02, p.y, p.z * 1.02, tSpawn,
        p.x * outScale - randRange(0.3, 1.2),
        randRange(-1.8, 1.4),
        p.z * outScale + randRange(-0.5, 0.5),
        2.4,
        randRange(0.016, 0.030),
        1.15,
        2.0, // crimson latex shred
        2.6,
        7.0
      );
    }

    // 7B. 610 Backward Entry Cavitation Splash Crown & Worthington Jet (+X from right entry hole, 2.10s - 3.92s)
    for (let i = 0; i < 610; i++) {
      const isAxialJet = i < 150;
      const tSpawn = isAxialJet ? randRange(2.32, 3.78) : randRange(2.08, 3.88);
      const coneAng = isAxialJet ? randRange(0.0, 0.14) : randRange(0.20, 0.62);
      const az = prng() * Math.PI * 2.0;
      const speed = isAxialJet ? randRange(2.2, 4.9) : randRange(1.1, 3.7);
      const rRing = 0.04 + 0.14 * smoothstepJS(2.1, 3.7, tSpawn);
      const y0 = rRing * Math.cos(az);
      const z0 = rRing * Math.sin(az);
      const vx0 = speed * Math.cos(coneAng);
      const vr = speed * Math.sin(coneAng);
      const rad = isAxialJet ? randRange(0.014, 0.036) : randRange(0.012, 0.032);
      pushInstance(
        0.90 + randRange(-0.03, 0.06), y0, z0, tSpawn,
        vx0, vr * Math.cos(az) + randRange(-0.12, 0.22), vr * Math.sin(az),
        randRange(0.65, 1.55),
        rad,
        randRange(1.25, 1.55),
        0.0,
        isAxialJet ? 1.85 : 1.45,
        8.5
      );
    }

    // 7C. 540 Forward Exit Puncture Cone High-Velocity Droplets & Needles (-X from left wall, 3.80s - 4.90s)
    for (let i = 0; i < 540; i++) {
      const isCore = i < 200;
      const tSpawn = isCore ? randRange(3.800, 4.350) : randRange(3.805, 4.880);
      const coneAng = isCore ? randRange(0.02, 0.22) : randRange(0.20, 0.66);
      const az = prng() * Math.PI * 2.0;
      const speed = isCore ? randRange(2.8, 6.4) : randRange(1.4, 4.4);
      const rExit = 0.03 + 0.16 * smoothstepJS(3.80, 4.50, tSpawn);
      const y0 = -0.02 + rExit * Math.cos(az);
      const z0 = rExit * Math.sin(az);
      const vx0 = -speed * Math.cos(coneAng);
      const vr = speed * Math.sin(coneAng);
      const rad = isCore ? randRange(0.011, 0.026) : randRange(0.013, 0.034);
      pushInstance(
        -1.02 + randRange(-0.06, 0.04), y0, z0, tSpawn,
        vx0, vr * Math.cos(az) + randRange(-0.15, 0.18), vr * Math.sin(az),
        randRange(0.85, 2.10),
        rad,
        randRange(1.20, 1.52),
        0.0,
        2.10,
        8.5
      );
    }

    // 7D. 360 Coherent 3D Fluid Sheets & Ribbons (Rayleigh-Taylor lobes breaking apart 4.35s - 6.30s)
    for (let i = 0; i < 360; i++) {
      const lobeIdx = i % 16;
      const phi = (lobeIdx / 16.0) * Math.PI * 2.0 + randRange(-0.14, 0.14);
      const s = randRange(0.10, 0.90);
      const p0 = evalBalloonBaseJS(s, phi);
      const tSpawn = randRange(4.32, 5.38) - 0.18 * Math.exp(-p0.y * p0.y * 1.5);
      const dtBulge = Math.max(0.0, tSpawn - 3.75);
      const radScale = 1.24 + 0.12 * Math.exp(-p0.y * p0.y * 1.4);
      const x0 = p0.x * radScale;
      const z0 = p0.z * radScale;
      const y0 = p0.y - (0.09 + 0.54 * dtBulge * dtBulge);
      const outSpeed = randRange(0.28, 0.92);
      pushInstance(
        x0, y0, z0, tSpawn,
        Math.cos(phi) * outSpeed - 0.16,
        -0.95 * dtBulge + randRange(-0.25, 0.15),
        Math.sin(phi) * outSpeed,
        0.55,
        randRange(0.042, 0.078),
        randRange(1.38, 1.62),
        1.0, // flattened fluid sheet that thins & breaks into drops
        1.5,
        randRange(1.05, 1.95)
      );
    }

    // 7E. Remaining (~1,354) Plateau-Rayleigh Cascading Filaments (Alternating Primary Drops & Satellite Beads!)
    const numFilaments = 68;
    const dropsPerFilament = Math.ceil((NUM_3D_ELEMENTS - instCursor) / numFilaments);
    for (let f = 0; f < numFilaments; f++) {
      const basePhi = (f / numFilaments) * Math.PI * 2.0 + randRange(-0.04, 0.04);
      const sStart = randRange(0.05, 0.35);
      const sSpan = randRange(0.45, 0.62);
      const filOutSpeed = randRange(0.22, 0.88);
      const filSpawnBase = randRange(4.42, 5.42);

      for (let k = 0; k < dropsPerFilament && instCursor < NUM_3D_ELEMENTS; k++) {
        const frac = k / Math.max(1, dropsPerFilament - 1);
        const s = clamp(sStart + frac * sSpan + randRange(-0.015, 0.015), 0.03, 0.97);
        const phi = basePhi + 0.10 * Math.sin(frac * 6.0) + randRange(-0.035, 0.035);
        const p0 = evalBalloonBaseJS(s, phi);
        const eqFactor = Math.exp(-p0.y * p0.y * 1.4);
        const tSpawn = filSpawnBase - 0.16 * eqFactor + randRange(-0.08, 0.12);
        const dtPre = Math.max(0.0, tSpawn - 3.75);
        const radScale = 1.22 + 0.14 * eqFactor;
        const x0 = p0.x * radScale;
        const z0 = p0.z * radScale;
        const y0 = p0.y - (0.09 + 0.54 * dtPre * dtPre);

        // Plateau-Rayleigh signature: alternating large primary drops and tiny capillary satellite beads!
        const isSatellite = (k % 2 === 1);
        const radius = isSatellite ? randRange(0.012, 0.021) : randRange(0.030, 0.054);
        const outVel = filOutSpeed * (0.7 + 0.5 * Math.sin(s * Math.PI)) + randRange(-0.09, 0.09);
        const vyInit = -1.02 * dtPre + (s - 0.5) * 0.22 + randRange(-0.16, 0.16);
        pushInstance(
          x0, y0, z0, tSpawn,
          Math.cos(phi) * outVel - 0.14,
          vyInit,
          Math.sin(phi) * outVel,
          isSatellite ? 0.62 : 0.34,
          radius,
          randRange(1.36, 1.65),
          0.0,
          isSatellite ? 1.25 : 1.55,
          8.5
        );
      }
    }

    const baseDropSphere = new THREE.IcosahedronBufferGeometry(1.0, 2);
    const instDropGeo = new THREE.InstancedBufferGeometry();
    instDropGeo.index = baseDropSphere.index;
    instDropGeo.attributes.position = baseDropSphere.attributes.position;
    instDropGeo.attributes.normal = baseDropSphere.attributes.normal;
    instDropGeo.setAttribute('aPos0', new THREE.InstancedBufferAttribute(instPos0, 4));
    instDropGeo.setAttribute('aVel0', new THREE.InstancedBufferAttribute(instVel0, 4));
    instDropGeo.setAttribute('aPhys', new THREE.InstancedBufferAttribute(instPhys, 4));
    instDropGeo.setAttribute('aMisc', new THREE.InstancedBufferAttribute(instMisc, 4));
    instDropGeo.instanceCount = instCursor;

    const dropUniforms = {
      uSimTime: { value: 0.0 },
      uEnvMap: { value: studioCubeTex }
    };

    const dropVertexShader = [
      'attribute vec4 aPos0;',
      'attribute vec4 aVel0;',
      'attribute vec4 aPhys;',
      'attribute vec4 aMisc;',
      'uniform float uSimTime;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying float vKind;',
      'varying float vAlpha;',
      'void main() {',
      '  float tSpawn = aPos0.w;',
      '  float dt = uSimTime - tSpawn;',
      '  float lifeMax = aMisc.w;',
      '  vKind = aPhys.w;',
      '  if (dt < 0.0 || dt > lifeMax) {',
      '    vAlpha = 0.0;',
      '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
      '    return;',
      '  }',
      '  float dragK = max(0.02, aVel0.w);',
      '  float gAcc = aPhys.y;',
      '  float hitDt = aPhys.z;',
      '  float radius = aPhys.x;',
      '  float phase = aMisc.x;',
      '  float stretchMult = aMisc.y;',
      '  float bounceAng = aMisc.z;',
      '  vec3 center;',
      '  vec3 vel;',
      '  float puddleFlatten = 0.0;',
      '  if (dt <= hitDt) {',
      '    float logTerm = log(1.0 + dragK * dt) / dragK;',
      '    center = aPos0.xyz + aVel0.xyz * logTerm + vec3(0.0, -0.5 * gAcc * dt * dt, 0.0);',
      '    vel = aVel0.xyz / (1.0 + dragK * dt) + vec3(0.0, -gAcc * dt, 0.0);',
      '  } else {',
      '    // Floor splashdown bounce & settling puddle lens on FLOOR_Y = -2.32',
      '    float logHit = log(1.0 + dragK * hitDt) / dragK;',
      '    vec3 hitPos = aPos0.xyz + aVel0.xyz * logHit + vec3(0.0, -0.5 * gAcc * hitDt * hitDt, 0.0);',
      '    hitPos.y = -2.32 + radius * 0.35;',
      '    vec3 hitVel = aVel0.xyz / (1.0 + dragK * hitDt) + vec3(0.0, -gAcc * hitDt, 0.0);',
      '    float postDt = dt - hitDt;',
      '    float vyBounce = min(1.35, abs(hitVel.y) * 0.28);',
      '    float bounceDur = (2.0 * vyBounce) / max(0.5, gAcc * 1.5);',
      '    vec2 spreadDir = vec2(cos(bounceAng), sin(bounceAng)) * (0.28 + 0.32 * fract(phase));',
      '    if (postDt < bounceDur) {',
      '      center.xz = hitPos.xz + (hitVel.xz * 0.35 + spreadDir) * postDt;',
      '      center.y = hitPos.y + vyBounce * postDt - 0.5 * (gAcc * 1.5) * postDt * postDt;',
      '      vel = vec3(hitVel.x * 0.35 + spreadDir.x, vyBounce - (gAcc * 1.5) * postDt, hitVel.z * 0.35 + spreadDir.y);',
      '      radius *= 0.82;',
      '    } else {',
      '      float settleDt = postDt - bounceDur;',
      '      center.xz = hitPos.xz + (hitVel.xz * 0.35 + spreadDir) * bounceDur + spreadDir * 0.12 * (1.0 - exp(-2.5 * settleDt));',
      '      center.y = -2.318;',
      '      vel = vec3(0.0, 1.0, 0.0);',
      '      puddleFlatten = clamp(settleDt * 3.5, 0.0, 1.0);',
      '    }',
      '  }',
      '  float growIn = smoothstep(0.0, 0.055, dt);',
      '  float fadeOut = (vKind > 0.5 && vKind < 1.5) ? (1.0 - smoothstep(lifeMax * 0.55, lifeMax, dt)) : 1.0;',
      '  vAlpha = growIn * fadeOut;',
      '  // Velocity-aligned orthonormal basis + Rayleigh capillary oscillation',
      '  float speed = length(vel);',
      '  vec3 T = (speed > 1e-3 && puddleFlatten < 0.01) ? (vel / speed) : vec3(0.0, 1.0, 0.0);',
      '  vec3 refUp = abs(T.z) < 0.9 ? vec3(0.0, 0.0, 1.0) : vec3(1.0, 0.0, 0.0);',
      '  vec3 B = normalize(cross(T, refUp));',
      '  vec3 N2 = cross(T, B);',
      '  float osc = 1.0 + 0.15 * sin(uSimTime * 19.0 + phase * 3.0) * (1.0 - puddleFlatten);',
      '  float sx, sy, sz;',
      '  if (vKind > 0.5 && vKind < 1.5) {',
      '    // 3D tumbling fluid sheet ribbon',
      '    float stretchSheet = 1.55 + 0.55 * dt;',
      '    sx = radius * stretchSheet * growIn * fadeOut;',
      '    sy = radius * 1.15 * growIn * fadeOut;',
      '    sz = radius * 0.22 * growIn * fadeOut;',
      '  } else if (vKind > 1.5) {',
      '    // Curled crimson rubber micro-shred',
      '    float spin = uSimTime * 11.0 + phase;',
      '    T = normalize(vec3(cos(spin), sin(spin * 0.8), sin(spin * 0.5)));',
      '    B = normalize(cross(T, vec3(0.0, 1.0, 0.1)));',
      '    N2 = cross(T, B);',
      '    sx = radius * 1.9 * growIn;',
      '    sy = radius * 0.85 * growIn;',
      '    sz = radius * 0.24 * growIn;',
      '  } else if (puddleFlatten > 0.01) {',
      '    // Flattened glistening water bead on dark studio catch-surface',
      '    T = vec3(0.0, 1.0, 0.0);',
      '    B = vec3(0.0, 0.0, 1.0);',
      '    N2 = vec3(1.0, 0.0, 0.0);',
      '    float spread = mix(1.0, 1.85, puddleFlatten);',
      '    sx = radius * mix(0.8, 0.22, puddleFlatten);',
      '    sy = radius * spread;',
      '    sz = radius * spread;',
      '  } else {',
      '    float elong = clamp((1.0 + speed * 0.34 * stretchMult) * osc, 0.78, 3.6);',
      '    float invSqrt = 1.0 / sqrt(elong);',
      '    sx = radius * elong * growIn;',
      '    sy = radius * invSqrt * growIn;',
      '    sz = radius * invSqrt * growIn;',
      '  }',
      '  sx = max(sx, 1e-4); sy = max(sy, 1e-4); sz = max(sz, 1e-4);',
      '  vec3 localOffset = T * (position.x * sx) + B * (position.y * sy) + N2 * (position.z * sz);',
      '  vec3 worldN = normalize(T * (normal.x / sx) + B * (normal.y / sy) + N2 * (normal.z / sz));',
      '  vWorldPos = center + localOffset;',
      '  vWorldNormal = worldN;',
      '  gl_Position = projectionMatrix * viewMatrix * vec4(vWorldPos, 1.0);',
      '}'
    ].join('\n');

    const dropFragmentShader = [
      'uniform samplerCube uEnvMap;',
      'varying vec3 vWorldPos;',
      'varying vec3 vWorldNormal;',
      'varying float vKind;',
      'varying float vAlpha;',
      GLSL_COMMON,
      'void main() {',
      '  if (vAlpha <= 0.01) discard;',
      '  vec3 N = normalize(vWorldNormal);',
      '  vec3 V = normalize(cameraPosition - vWorldPos);',
      '  float ndv = max(dot(N, V), 0.0);',
      '  if (vKind > 1.5) {',
      '    // Crimson latex micro-shred (#e61c24)',
      '    vec3 Lkey = normalize(vec3(-2.2, 5.6, 4.8));',
      '    float diff = 0.25 + 0.85 * abs(dot(N, Lkey));',
      '    float spec = pow(max(dot(N, normalize(Lkey + V)), 0.0), 64.0) * 0.8;',
      '    vec3 col = vec3(0.791, 0.012, 0.018) * diff + vec3(spec);',
      '    gl_FragColor = vec4(finishHDR(col), 0.96);',
      '    return;',
      '  }',
      '  // Refractive glossy 3D water droplet / ligament / fluid sheet',
      '  float fresnel = 0.025 + 0.975 * pow(clamp(1.0 - ndv, 0.0, 1.0), 4.2);',
      '  vec3 reflCol = sampleEnvLinear(uEnvMap, reflect(-V, N));',
      '  vec3 refrCol = sampleEnvLinear(uEnvMap, refract(-V, N, 1.0 / 1.333)) * vec3(0.86, 0.96, 1.04);',
      '  vec3 Lkey = normalize(vec3(-2.2, 5.6, 4.8));',
      '  vec3 Lcyan = normalize(vec3(-6.2, 2.3, -4.6));',
      '  vec3 Lmag = normalize(vec3(6.2, 1.8, -4.6));',
      '  float specKey = pow(max(dot(N, normalize(Lkey + V)), 0.0), 180.0) * 3.2;',
      '  // Internal droplet focal caustic opposite studio rim lights',
      '  float causticCyan = pow(max(0.0, dot(-N, Lcyan)), 5.0) * 1.15;',
      '  float causticMag = pow(max(0.0, dot(-N, Lmag)), 5.0) * 0.95;',
      '  vec3 caustics = vec3(0.42, 0.92, 1.0) * causticCyan + vec3(1.0, 0.56, 0.92) * causticMag;',
      '  vec3 col = mix(refrCol + caustics, reflCol + caustics * 0.45, fresnel) + vec3(specKey);',
      '  float alpha = clamp((0.52 + 0.46 * fresnel + 0.35 * clamp(specKey + causticCyan, 0.0, 1.0)) * vAlpha, 0.0, 0.97);',
      '  gl_FragColor = vec4(finishHDR(col), alpha);',
      '}'
    ].join('\n');

    const instDropMesh = new THREE.Mesh(
      instDropGeo,
      new THREE.ShaderMaterial({
        uniforms: dropUniforms,
        vertexShader: dropVertexShader,
        fragmentShader: dropFragmentShader,
        transparent: true,
        depthWrite: true
      })
    );
    instDropMesh.frustumCulled = false;
    instDropMesh.renderOrder = 9;
    scene.add(instDropMesh);

    // =========================================================================
    // 8. FINE ATOMIZED MIST PLUME & MICRO-DROPLET SPRAY (5,400 POINT SPRITES)
    // =========================================================================
    const NUM_MIST = 5400;
    // aMistPos0: x0, y0, z0, tSpawn
    // aMistVel0: vx0, vy0, vz0, dragK
    // aMistAttr: sizePx, gAcc, mistSoftness (0=crisp micro-drop, 1=vapor cloud), lifeDur
    // aMistSeed: phase, swirlAmp, tintBias, floorHitDt
    const mistPos0 = new Float32Array(NUM_MIST * 4);
    const mistVel0 = new Float32Array(NUM_MIST * 4);
    const mistAttr = new Float32Array(NUM_MIST * 4);
    const mistSeed = new Float32Array(NUM_MIST * 4);
    const mistDummyPos = new Float32Array(NUM_MIST * 3);

    let mistCursor = 0;
    function pushMist(x0, y0, z0, tSpawn, vx0, vy0, vz0, dragK, sizePx, gAcc, softness, lifeDur, swirlAmp, tintBias) {
      if (mistCursor >= NUM_MIST) return;
      const i4 = mistCursor * 4;
      mistPos0[i4 + 0] = x0;
      mistPos0[i4 + 1] = y0;
      mistPos0[i4 + 2] = z0;
      mistPos0[i4 + 3] = tSpawn;

      mistVel0[i4 + 0] = vx0;
      mistVel0[i4 + 1] = vy0;
      mistVel0[i4 + 2] = vz0;
      mistVel0[i4 + 3] = dragK;

      mistAttr[i4 + 0] = sizePx;
      mistAttr[i4 + 1] = gAcc;
      mistAttr[i4 + 2] = softness;
      mistAttr[i4 + 3] = lifeDur;

      mistSeed[i4 + 0] = prng() * 6.2831853;
      mistSeed[i4 + 1] = swirlAmp;
      mistSeed[i4 + 2] = tintBias;
      mistSeed[i4 + 3] = solveFloorHitDt(y0, vy0, dragK, gAcc);
      mistCursor++;
    }

    // 8A. 650 Latex Peel Shear Halo Mist (stripped off water surface as rubber zips across 1.13s - 1.58s)
    for (let i = 0; i < 650; i++) {
      const s = randRange(0.05, 0.94);
      const phi = prng() * Math.PI * 2.0;
      const p = evalBalloonBaseJS(s, phi);
      const impAng = Math.acos(clamp(p.x / Math.max(0.01, Math.hypot(p.x, p.y * 0.8, p.z)), -1.0, 1.0)) / Math.PI;
      const tSpawn = 1.125 + impAng * 0.43 + randRange(-0.015, 0.025);
      const outV = randRange(0.08, 0.42);
      pushMist(
        p.x * 1.01, p.y, p.z * 1.01, tSpawn,
        Math.cos(phi) * outV - 0.08,
        randRange(0.04, 0.45),
        Math.sin(phi) * outV,
        2.8,
        randRange(4.0, 11.5),
        randRange(0.32, 0.65),
        randRange(0.45, 0.90),
        randRange(1.4, 2.8),
        0.04,
        0.5
      );
    }

    // 8B. 1,050 Backward Entry Cavitation Aerosol & Fine Spray (+X from right entry hole, 2.15s - 3.95s)
    for (let i = 0; i < 1050; i++) {
      const tSpawn = randRange(2.12, 3.92);
      const coneAng = randRange(0.06, 0.68);
      const az = prng() * Math.PI * 2.0;
      const speed = randRange(1.2, 5.4);
      const isVapor = prng() < 0.48;
      const r0 = randRange(0.01, 0.16);
      pushMist(
        0.90 + randRange(-0.02, 0.05), r0 * Math.cos(az), r0 * Math.sin(az), tSpawn,
        speed * Math.cos(coneAng),
        speed * Math.sin(coneAng) * Math.cos(az) + randRange(-0.1, 0.2),
        speed * Math.sin(coneAng) * Math.sin(az),
        isVapor ? randRange(2.2, 4.5) : randRange(0.9, 2.0),
        isVapor ? randRange(12.0, 30.0) : randRange(3.8, 8.5),
        isVapor ? randRange(0.25, 0.55) : randRange(1.10, 1.45),
        isVapor ? 0.92 : 0.15,
        isVapor ? randRange(1.3, 2.6) : 6.0,
        isVapor ? 0.11 : 0.02,
        0.82 // subtle warm/magenta right rim bias
      );
    }

    // 8C. 2,250 Forward Exit Conical Plume — Atomized Vapor & High-Speed Micro-Droplets (-X at 3.80s+)
    for (let i = 0; i < 2250; i++) {
      const isFineMist = i < 1150;
      const tSpawn = isFineMist ? randRange(3.800, 4.650) : randRange(3.800, 4.950);
      const coneAng = isFineMist ? Math.pow(prng(), 0.75) * 0.48 : Math.pow(prng(), 0.65) * 0.64;
      const az = prng() * Math.PI * 2.0;
      const speed = isFineMist ? randRange(2.6, 8.2) : randRange(1.8, 6.8);
      const r0 = randRange(0.01, 0.15);
      pushMist(
        -1.03 + randRange(-0.05, 0.03), -0.02 + r0 * Math.cos(az), r0 * Math.sin(az), tSpawn,
        -speed * Math.cos(coneAng),
        speed * Math.sin(coneAng) * Math.cos(az) + randRange(-0.12, 0.15),
        speed * Math.sin(coneAng) * Math.sin(az),
        isFineMist ? randRange(2.1, 4.8) : randRange(0.95, 2.2),
        isFineMist ? randRange(14.0, 38.0) : randRange(3.5, 8.2),
        isFineMist ? randRange(0.20, 0.52) : randRange(1.05, 1.48),
        isFineMist ? randRange(0.75, 1.0) : randRange(0.05, 0.25),
        isFineMist ? randRange(1.5, 3.2) : 6.0,
        isFineMist ? 0.16 : 0.03,
        0.15 // crisp ice-cyan left rim bias
      );
    }

    // 8D. Remaining (~1,450) Disintegration Fine Spray & Floor Splashdown Secondary Mist (4.45s - 8.00s)
    while (mistCursor < NUM_MIST) {
      const isFloorCrown = (mistCursor % 3 === 0);
      if (isFloorCrown) {
        const tSpawn = randRange(5.58, 7.65);
        const x0 = randRange(-2.25, 1.65) + randGauss() * 0.25;
        const z0 = randRange(-1.10, 1.10);
        const az = prng() * Math.PI * 2.0;
        const vr = randRange(0.25, 1.25);
        pushMist(
          x0, FLOOR_Y + 0.02, z0, tSpawn,
          vr * Math.cos(az),
          randRange(0.55, 1.65),
          vr * Math.sin(az),
          1.4,
          randRange(4.0, 12.0),
          1.65,
          randRange(0.20, 0.70),
          randRange(0.65, 1.45),
          0.03,
          0.45
        );
      } else {
        const s = randRange(0.05, 0.95);
        const phi = prng() * Math.PI * 2.0;
        const p0 = evalBalloonBaseJS(s, phi);
        const tSpawn = randRange(4.38, 5.58);
        const dtPre = Math.max(0.0, tSpawn - 3.75);
        const outV = randRange(0.20, 1.15);
        pushMist(
          p0.x * 1.24, p0.y - (0.09 + 0.54 * dtPre * dtPre), p0.z * 1.24, tSpawn,
          Math.cos(phi) * outV - 0.15,
          -1.0 * dtPre + randRange(-0.25, 0.25),
          Math.sin(phi) * outV,
          randRange(0.75, 2.2),
          randRange(3.5, 9.5),
          randRange(1.20, 1.60),
          randRange(0.10, 0.45),
          5.0,
          0.04,
          0.45
        );
      }
    }

    const mistGeo = new THREE.BufferGeometry();
    mistGeo.setAttribute('position', new THREE.BufferAttribute(mistDummyPos, 3));
    mistGeo.setAttribute('aPos0', new THREE.BufferAttribute(mistPos0, 4));
    mistGeo.setAttribute('aVel0', new THREE.BufferAttribute(mistVel0, 4));
    mistGeo.setAttribute('aAttr', new THREE.BufferAttribute(mistAttr, 4));
    mistGeo.setAttribute('aSeed', new THREE.BufferAttribute(mistSeed, 4));

    const mistUniforms = {
      uSimTime: { value: 0.0 },
      uDpr: { value: Math.min(window.devicePixelRatio || 1, 2) },
      uViewHeight: { value: window.innerHeight },
      uSprite: { value: dropletSpriteTex }
    };

    const mistVertexShader = [
      'attribute vec4 aPos0;',
      'attribute vec4 aVel0;',
      'attribute vec4 aAttr;',
      'attribute vec4 aSeed;',
      'uniform float uSimTime;',
      'uniform float uDpr;',
      'uniform float uViewHeight;',
      'varying float vAlpha;',
      'varying float vSoftness;',
      'varying float vTint;',
      'varying float vPhase;',
      'void main() {',
      '  float dt = uSimTime - aPos0.w;',
      '  float lifeDur = aAttr.w;',
      '  if (dt < 0.0 || dt > lifeDur) {',
      '    vAlpha = 0.0;',
      '    gl_PointSize = 0.0;',
      '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
      '    return;',
      '  }',
      '  float dragK = max(0.05, aVel0.w);',
      '  float gAcc = aAttr.y;',
      '  float hitDt = aSeed.w;',
      '  float useDt = min(dt, hitDt);',
      '  float logTerm = log(1.0 + dragK * useDt) / dragK;',
      '  vec3 pos = aPos0.xyz + aVel0.xyz * logTerm + vec3(0.0, -0.5 * gAcc * useDt * useDt, 0.0);',
      '  float phase = aSeed.x;',
      '  float swirl = aSeed.y * (1.0 - exp(-1.6 * useDt));',
      '  pos.y += swirl * sin(useDt * 3.8 + phase);',
      '  pos.z += swirl * cos(useDt * 3.4 + phase * 1.3);',
      '  if (dt > hitDt) {',
      '    pos.y = -2.315;',
      '  }',
      '  vSoftness = aAttr.z;',
      '  vTint = aSeed.z;',
      '  vPhase = phase + dt * 1.4;',
      '  float fadeIn = smoothstep(0.0, 0.04, dt);',
      '  float fadeLife = 1.0 - smoothstep(lifeDur * 0.42, lifeDur, dt);',
      '  float postFloorFade = (dt > hitDt) ? exp(-3.5 * (dt - hitDt)) : 1.0;',
      '  vAlpha = fadeIn * fadeLife * postFloorFade * mix(0.86, 0.24, vSoftness);',
      '  vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);',
      '  float growMist = 1.0 + vSoftness * dt * 0.85;',
      '  float scaleScreen = (uViewHeight / 1080.0) * uDpr;',
      '  gl_PointSize = clamp(aAttr.x * growMist * scaleScreen * (9.45 / max(1.0, -mvPos.z)), 1.5, 96.0);',
      '  gl_Position = projectionMatrix * mvPos;',
      '}'
    ].join('\n');

    const mistFragmentShader = [
      'uniform sampler2D uSprite;',
      'varying float vAlpha;',
      'varying float vSoftness;',
      'varying float vTint;',
      'varying float vPhase;',
      GLSL_COMMON,
      'void main() {',
      '  if (vAlpha <= 0.004) discard;',
      '  vec2 p = gl_PointCoord - 0.5;',
      '  float r2 = dot(p, p);',
      '  if (r2 > 0.25) discard;',
      '  float c = cos(vPhase);',
      '  float s = sin(vPhase);',
      '  vec2 rp = vec2(c * p.x - s * p.y, s * p.x + c * p.y) + 0.5;',
      '  vec4 tex = texture2D(uSprite, gl_PointCoord);',
      '  vec4 rotTex = texture2D(uSprite, rp);',
      '  float mistMask = exp(-r2 * 10.5) * (0.75 + 0.25 * rotTex.a);',
      '  float dropMask = tex.a;',
      '  float mask = mix(dropMask, mistMask, vSoftness);',
      '  float alpha = vAlpha * mask;',
      '  if (alpha <= 0.004) discard;',
      '  vec3 cyanTint = vec3(0.70, 0.94, 1.05);',
      '  vec3 magTint = vec3(1.02, 0.82, 0.98);',
      '  vec3 rimCol = mix(cyanTint, magTint, vTint);',
      '  vec3 dropCol = pow(max(tex.rgb, vec3(0.0)), vec3(1.8)) * rimCol * 1.45;',
      '  vec3 mistCol = rimCol * (0.62 + 0.35 * (1.0 - r2 * 3.2));',
      '  vec3 col = mix(dropCol, mistCol, vSoftness);',
      '  gl_FragColor = vec4(finishHDR(col), clamp(alpha, 0.0, 0.92));',
      '}'
    ].join('\n');

    const mistPoints = new THREE.Points(
      mistGeo,
      new THREE.ShaderMaterial({
        uniforms: mistUniforms,
        vertexShader: mistVertexShader,
        fragmentShader: mistFragmentShader,
        transparent: true,
        depthWrite: false
      })
    );
    mistPoints.frustumCulled = false;
    mistPoints.renderOrder = 10;
    scene.add(mistPoints);

    // =========================================================================
    // 9. STUDIO CATCH-STAGE SPLASHDOWN RIPPLE PLANE (y = -2.32, above #dock)
