    // =========================================================================
    const NUM_RIPPLE_CENTERS = 28;
    const rippleCenters = [];
    for (let i = 0; i < NUM_RIPPLE_CENTERS; i++) {
      const rx = randRange(-1.85, 1.35) + randGauss() * 0.25;
      const rz = randRange(-0.95, 0.95);
      const rt = 5.54 + (i / NUM_RIPPLE_CENTERS) * 1.85 + randRange(-0.04, 0.04);
      const rAmp = randRange(0.65, 1.25);
      rippleCenters.push(new THREE.Vector4(rx, rz, rt, rAmp));
    }

    const floorGeo = new THREE.PlaneBufferGeometry(11.5, 5.5, 1, 1);
    floorGeo.rotateX(-Math.PI * 0.5);
    floorGeo.translate(0.0, FLOOR_Y, 0.0);

    const floorUniforms = {
      uSimTime: { value: 0.0 },
      uEnvMap: { value: studioCubeTex },
      uRipples: { value: rippleCenters }
    };

    const floorMat = new THREE.ShaderMaterial({
      uniforms: floorUniforms,
      transparent: true,
      depthWrite: false,
      vertexShader: [
        'varying vec3 vWorldPos;',
        'void main() {',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vWorldPos = wp.xyz;',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform float uSimTime;',
        'uniform samplerCube uEnvMap;',
        'uniform vec4 uRipples[28];',
        'varying vec3 vWorldPos;',
        GLSL_COMMON,
        'void main() {',
        '  if (uSimTime < 5.45) discard;',
        '  vec2 xz = vWorldPos.xz;',
        '  vec2 grad = vec2(0.0);',
        '  float wetMask = 0.0;',
        '  for (int i = 0; i < 28; i++) {',
        '    vec4 rp = uRipples[i];',
        '    float dt = uSimTime - rp.z;',
        '    if (dt > 0.0) {',
        '      vec2 d = xz - rp.xy;',
        '      float dist = length(d) + 1e-4;',
        '      float front = dt * 1.32;',
        '      float env = exp(-abs(dist - front) * 5.2) * exp(-dt * 0.88) * rp.w;',
        '      float dWave = cos((dist - front) * 34.0) * env;',
        '      grad += (d / dist) * dWave * 0.24;',
        '      float puddleR = min(0.85, 0.14 + dt * 0.36) * rp.w;',
        '      wetMask += smoothstep(puddleR, puddleR * 0.25, dist) * smoothstep(0.0, 0.18, dt);',
        '    }',
        '  }',
        '  wetMask = clamp(wetMask * 0.42, 0.0, 1.0);',
        '  float rippleEnergy = clamp(length(grad) * 2.4, 0.0, 1.0);',
        '  float edgeFade = (1.0 - smoothstep(2.4, 4.8, abs(xz.x))) * (1.0 - smoothstep(1.1, 2.3, abs(xz.y)));',
        '  float vis = clamp((wetMask * 0.72 + rippleEnergy * 0.95) * edgeFade, 0.0, 1.0);',
        '  if (vis < 0.005) discard;',
        '  vec3 N = normalize(vec3(-grad.x, 1.0, -grad.y));',
        '  vec3 V = normalize(cameraPosition - vWorldPos);',
        '  float ndv = max(dot(N, V), 0.0);',
        '  float fresnel = 0.03 + 0.97 * pow(clamp(1.0 - ndv, 0.0, 1.0), 4.2);',
        '  vec3 refl = sampleEnvLinear(uEnvMap, reflect(-V, N));',
        '  vec3 rimTint = mix(vec3(0.45, 0.90, 1.0), vec3(0.95, 0.62, 0.92), smoothstep(-2.0, 2.0, xz.x));',
        '  vec3 col = refl * (0.45 + 0.85 * fresnel) + rimTint * rippleEnergy * 0.48;',
        '  float alpha = clamp(vis * (0.28 + 0.62 * fresnel + 0.40 * rippleEnergy), 0.0, 0.86);',
        '  gl_FragColor = vec4(finishHDR(col), alpha);',
        '}'
      ].join('\n')
    });

    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.renderOrder = 1;
    scene.add(floorMesh);

    // =========================================================================
    // 10. PURE DETERMINISTIC SCENE EVALUATOR: renderAt(simTime)
    // =========================================================================
    function renderAt(tRaw) {
      const t = clamp(tRaw, 0.000, DURATION);
      const bState = getBulletState(t);

      // Update Bullet Position, Spin, Nutation & Supersonic Bow Wave
      bulletGroup.position.set(bState.tipX, bState.tipY, 0.0);
      bulletGroup.rotation.set(0.0, bState.yawY, bState.pitchZ);
      bulletSpinGroup.rotation.x = bState.rollX;
      bulletGroup.visible = (bState.tipX < 6.2 && bState.tipX > -6.4);

      const approachShock = (1.0 - smoothstepJS(0.96, 1.06, t)) * smoothstepJS(0.02, 0.16, t);
      const exitShock = smoothstepJS(3.82, 4.05, t) * (1.0 - smoothstepJS(5.20, 6.40, t)) * 0.55;
      const shockOpacity = 0.24 * approachShock + 0.14 * exitShock;
      machMat.uniforms.uOpacity.value = shockOpacity;
      machMat.uniforms.uSimTime.value = t;
      machConeMesh.visible = shockOpacity > 0.003;

      // Update Tether Recoil, Sway & Retracted Crimson Collar
      if (t <= 1.120) {
        tetherPivot.position.set(0.0, 4.80, 0.0);
        tetherPivot.rotation.set(0.0, 0.0, 0.0);
        remnantCollarMesh.visible = false;
      } else {
        const dtBurst = t - 1.120;
        const recoilY = 0.18 * (1.0 - Math.exp(-8.5 * dtBurst)) * (0.62 + 0.38 * Math.cos(19.0 * dtBurst) * Math.exp(-1.5 * dtBurst));
        const swayAngleZ = -0.024 * Math.sin(7.2 * dtBurst) * Math.exp(-0.65 * dtBurst);
        tetherPivot.position.set(0.0, 4.80 + recoilY, 0.0);
        tetherPivot.rotation.set(0.0, 0.0, swayAngleZ);

        if (t >= 1.240) {
          remnantCollarMesh.visible = true;
          const unfurl = smoothstepJS(1.240, 1.580, t);
          const flutter = 1.0 + 0.08 * Math.sin(dtBurst * 21.0) * Math.exp(-0.7 * dtBurst);
          remnantCollarMesh.scale.set(unfurl * flutter, 0.35 + 0.65 * unfurl, unfurl * flutter);
          remnantCollarMesh.rotation.y = 0.15 * Math.sin(dtBurst * 9.5) * Math.exp(-0.4 * dtBurst);
        } else {
          remnantCollarMesh.visible = false;
        }
      }

      // Update Crimson Latex Membrane (visible 0.000s -> 1.620s)
      const tearProg = clamp((t - 1.120) / 0.460, 0.0, 1.0);
      const tearFront = t <= 1.120 ? -0.10 : (-0.02 + 1.16 * Math.pow(tearProg, 0.86));
      latexUniforms.uSimTime.value = t;
      latexUniforms.uBulletTipX.value = bState.tipX;
      latexUniforms.uTearFront.value = tearFront;
      const showLatex = t < 1.610;
      latexBackMesh.visible = showLatex;
      latexFrontMesh.visible = showLatex;

      // Update Cohesive Refractive Water Core (visible 1.060s -> 5.660s)
      waterUniforms.uSimTime.value = t;
      waterUniforms.uBulletTipX.value = bState.tipX;
      const showWater = (t >= 1.060 && t <= 5.660);
      waterBackMesh.visible = showWater;
      waterFrontMesh.visible = showWater;

      // Update Internal Cavitation Vapor Tunnel (visible 1.140s -> 5.300s)
      cavUniforms.uSimTime.value = t;
      cavUniforms.uBulletTipX.value = bState.tipX;
      cavitationMesh.visible = (t >= 1.140 && t <= 5.300);

      // Update GPU 3D Droplets/Sheets/Shreds, Point Mist & Splashdown Ripple Floor
      dropUniforms.uSimTime.value = t;
      instDropMesh.visible = (t >= 1.120);

      mistUniforms.uSimTime.value = t;
      mistPoints.visible = (t >= 1.120);

      floorUniforms.uSimTime.value = t;
      floorMesh.visible = (t >= 5.450);

      renderer.render(scene, camera);
    }

    // =========================================================================
    // 11. 5-STATE TIMELINE & PLAYBACK CONTROLS STATE MACHINE
    // States: 'COUNTDOWN' | 'PLAYING' | 'PAUSED' | 'REFIRE_HOLD' | 'ENDED'
    // =========================================================================
    let state = 'COUNTDOWN';
    let simTime = 0.000;
    let playbackSpeed = 1.0;
    let countdownElapsed = 0.0;
    let holdElapsed = 0.0;
    let countdownStarted = false;
    let lastRafTime = null;
    let resetDeltaNextFrame = false;

    function setToggleUI(mode) {
      if (mode === 'pause') {
        iconPause.style.display = '';
        iconPlay.style.display = 'none';
        btnToggle.setAttribute('aria-label', 'Pause');
      } else {
        iconPause.style.display = 'none';
        iconPlay.style.display = '';
        btnToggle.setAttribute('aria-label', 'Play');
      }
    }

    function hideCountdown() {
      countdownEl.style.display = 'none';
      countdownEl.textContent = '';
    }

    // Play / Pause Toggle (#btn-toggle)
    btnToggle.addEventListener('click', function() {
      if (state === 'PLAYING') {
        state = 'PAUSED';
        setToggleUI('play');
      } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
        hideCountdown();
        simTime = 0.000;
        state = 'PAUSED';
        setToggleUI('play');
        renderAt(0.000);
      } else if (state === 'PAUSED') {
        state = 'PLAYING';
        resetDeltaNextFrame = true;
        setToggleUI('pause');
      } else if (state === 'ENDED') {
        hideCountdown();
        simTime = 0.000;
        scrubber.value = simTime.toFixed(3);
        state = 'PLAYING';
        resetDeltaNextFrame = true;
        setToggleUI('pause');
        renderAt(0.000);
      }
    });

    // Silent Re-Fire (#btn-refire -> REFIRE_HOLD)
    btnRefire.addEventListener('click', function() {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0';
      holdElapsed = 0.0;
      state = 'REFIRE_HOLD';
      resetDeltaNextFrame = true;
      setToggleUI('pause');
      renderAt(0.000);
    });

    // Speed Selector Pills (.speed-pill)
    speedPills.forEach(function(pill) {
      pill.addEventListener('click', function() {
        const spd = parseFloat(pill.getAttribute('data-speed'));
        if (!isNaN(spd) && spd > 0) {
          playbackSpeed = spd;
        }
        speedPills.forEach(function(other) {
          const active = (other === pill);
          if (active) {
            other.classList.add('is-active');
            other.setAttribute('aria-checked', 'true');
          } else {
            other.classList.remove('is-active');
            other.setAttribute('aria-checked', 'false');
          }
        });
      });
    });

    // Scrubbing Slider (#scrubber)
    scrubber.addEventListener('input', function() {
      hideCountdown();
      const val = parseFloat(scrubber.value);
      simTime = clamp(isNaN(val) ? 0.000 : val, 0.000, DURATION);
      state = 'PAUSED';
      setToggleUI('play');
      renderAt(simTime);
    });

    // Window Resize Handler
    window.addEventListener('resize', function() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
      updateCameraFraming();
      camera.updateProjectionMatrix();
      mistUniforms.uDpr.value = dpr;
      mistUniforms.uViewHeight.value = window.innerHeight;
      renderAt(simTime);
    });

    // Render initial resting scene (simTime = 0.000) before starting COUNTDOWN on first RAF
    countdownEl.style.display = 'block';
    countdownEl.textContent = '3';
    scrubber.value = '0';
    setToggleUI('pause');
    renderAt(0.000);

    function onFrame(now) {
      let rawDt = 0.0;
      if (lastRafTime === null || resetDeltaNextFrame) {
        lastRafTime = now;
        resetDeltaNextFrame = false;
        rawDt = 0.0;
      } else {
        rawDt = Math.max(0.0, (now - lastRafTime) / 1000.0);
        lastRafTime = now;
      }

      if (state === 'COUNTDOWN') {
        if (!countdownStarted) {
          countdownStarted = true;
          countdownElapsed = 0.0;
          rawDt = 0.0;
        } else {
          countdownElapsed += rawDt;
        }

        if (countdownElapsed < 1.000) {
          countdownEl.style.display = 'block';
          countdownEl.textContent = '3';
          simTime = 0.000;
          scrubber.value = '0';
        } else if (countdownElapsed < 2.000) {
          countdownEl.style.display = 'block';
          countdownEl.textContent = '2';
          simTime = 0.000;
          scrubber.value = '0';
        } else if (countdownElapsed < 3.000) {
          countdownEl.style.display = 'block';
          countdownEl.textContent = '1';
          simTime = 0.000;
          scrubber.value = '0';
        } else {
          hideCountdown();
          state = 'PLAYING';
          setToggleUI('pause');
          const overDt = Math.min(countdownElapsed - 3.000, 0.1);
          simTime = Math.min(DURATION, overDt * playbackSpeed);
          if (simTime >= DURATION) {
            simTime = DURATION;
            scrubber.value = DURATION.toFixed(3);
            renderAt(simTime);
            state = 'ENDED';
            setToggleUI('play');
          } else {
            scrubber.value = simTime.toFixed(3);
            renderAt(simTime);
          }
        }
      } else if (state === 'REFIRE_HOLD') {
        hideCountdown();
        holdElapsed += rawDt;
        if (holdElapsed >= 1.000) {
          state = 'PLAYING';
          setToggleUI('pause');
          const overDt = Math.min(holdElapsed - 1.000, 0.1);
          simTime = Math.min(DURATION, overDt * playbackSpeed);
          if (simTime >= DURATION) {
            simTime = DURATION;
            scrubber.value = DURATION.toFixed(3);
            renderAt(simTime);
            state = 'ENDED';
            setToggleUI('play');
          } else {
            scrubber.value = simTime.toFixed(3);
            renderAt(simTime);
          }
        }
      } else if (state === 'PLAYING') {
        const dt = Math.min(rawDt, 0.1);
        simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
        if (simTime >= DURATION) {
          simTime = DURATION;
          scrubber.value = DURATION.toFixed(3);
          renderAt(simTime);
          state = 'ENDED';
          setToggleUI('play');
        } else {
          scrubber.value = simTime.toFixed(3);
          renderAt(simTime);
        }
      }

      requestAnimationFrame(onFrame);
    }

    requestAnimationFrame(onFrame);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
</body>
</html>
