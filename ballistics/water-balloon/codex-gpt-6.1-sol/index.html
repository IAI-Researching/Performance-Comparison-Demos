<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0f">
<title>Water Balloon · 15,000 FPS</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#dock button:focus-visible, #scrubber:focus-visible {
  outline: 2px solid rgba(211, 238, 255, 0.85);
  outline-offset: 4px;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const DURATION = 8.000;
const SEED = 42;
const TAU = Math.PI * 2;
const FLOOR = -2.68;
const GRAVITY = 1.12;
const VIEW_HEIGHT = 7.55;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => a + (b - a) * t;
function smooth(a, b, t) {
  const x = clamp((t - a) / (b - a), 0, 1);
  return x * x * (3 - 2 * x);
}
function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
// This generator is consumed only during construction. renderAt never consumes it.
const random = mulberry32(SEED);
const range = (a, b) => mix(a, b, random());

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
renderer.setClearColor(0x090a0f, 0);
const scene = new THREE.Scene();
const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(-VIEW_HEIGHT * aspect / 2, VIEW_HEIGHT * aspect / 2, VIEW_HEIGHT / 2, -VIEW_HEIGHT / 2, 0.1, 80);
camera.position.set(0, 0, 18);
camera.lookAt(0, 0, 0);

// A studio reflection environment, painted into six detached canvases. No assets.
function makeStudioEnvironment() {
  const panels = [
    { n: new THREE.Vector3(-0.62, 0.55, 0.85).normalize(), w: 0.16, h: 0.63, c: [0.96, 0.98, 1.00] },
    { n: new THREE.Vector3(0.9, 0.22, 0.3).normalize(), w: 0.075, h: 0.78, c: [0.48, 0.83, 0.95] },
    { n: new THREE.Vector3(-0.6, 0.38, -1).normalize(), w: 0.20, h: 0.65, c: [0.77, 0.84, 0.95] },
    { n: new THREE.Vector3(0.25, 0.85, -0.35).normalize(), w: 0.43, h: 0.12, c: [0.72, 0.61, 0.65] }
  ];
  panels.forEach(p => {
    p.u = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), p.n).normalize();
    p.v = new THREE.Vector3().crossVectors(p.n, p.u).normalize();
  });
  const size = 256;
  const faces = [];
  const d = new THREE.Vector3();
  for (let face = 0; face < 6; face++) {
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    const pixels = ctx.createImageData(size, size);
    for (let j = 0; j < size; j++) {
      for (let i = 0; i < size; i++) {
        const u = 2 * (i + 0.5) / size - 1;
        const v = 2 * (j + 0.5) / size - 1;
        if (face === 0) d.set(1, -v, -u);
        else if (face === 1) d.set(-1, -v, u);
        else if (face === 2) d.set(u, 1, v);
        else if (face === 3) d.set(u, -1, -v);
        else if (face === 4) d.set(u, -v, 1);
        else d.set(-u, -v, -1);
        d.normalize();
        let r = 0.034 + 0.024 * Math.max(d.y, 0);
        let g = 0.043 + 0.028 * Math.max(d.y, 0);
        let b = 0.061 + 0.038 * Math.max(d.y, 0);
        for (const p of panels) {
          const facing = d.dot(p.n);
          if (facing <= 0) continue;
          const x = Math.abs(d.dot(p.u) / facing) / p.w;
          const y = Math.abs(d.dot(p.v) / facing) / p.h;
          const light = Math.exp(-Math.pow(x, 8) - Math.pow(y, 8));
          r += light * p.c[0]; g += light * p.c[1]; b += light * p.c[2];
        }
        const k = (j * size + i) * 4;
        pixels.data[k] = Math.min(255, r * 255);
        pixels.data[k + 1] = Math.min(255, g * 255);
        pixels.data[k + 2] = Math.min(255, b * 255);
        pixels.data[k + 3] = 255;
      }
    }
    ctx.putImageData(pixels, 0, 0);
    faces.push(canvas);
  }
  const cube = new THREE.CubeTexture(faces);
  cube.encoding = THREE.sRGBEncoding;
  cube.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(renderer);
  const result = pmrem.fromCubemap(cube);
  pmrem.dispose();
  cube.dispose();
  return result.texture;
}
scene.environment = makeStudioEnvironment();
scene.add(new THREE.HemisphereLight(0xc9dff8, 0x21111d, 0.55));
function studioLight(color, intensity, x, y, z) {
  const light = new THREE.DirectionalLight(color, intensity);
  light.position.set(x, y, z);
  scene.add(light);
}
studioLight(0xfff4e9, 1.25, -3, 5, 6);
studioLight(0xdaf3ff, 3.2, -4, 2, -3);
studioLight(0x8bdfe9, 2.2, 4, 1, -2);
studioLight(0xe5a3bd, 0.42, 2, -2, 4);

// Hydrostatic pear profile: a narrow shoulder and a broad, heavy lower lobe.
function bodyPoint(theta, phi, out) {
  const c = Math.cos(theta);
  const radius = 1.14 * Math.sin(theta) * (1 - 0.30 * c) * (1 - 0.17 * Math.exp(-theta * theta / 0.13));
  out[0] = radius * Math.cos(phi);
  out[1] = 1.63 * c + 0.045 * Math.cos(2 * theta) - 0.045;
  out[2] = radius * Math.sin(phi);
  return out;
}
function makeGrid(rows, columns) {
  const p = new Float32Array((rows + 1) * (columns + 1) * 3);
  const uv = new Float32Array((rows + 1) * (columns + 1) * 2);
  const indices = [];
  for (let i = 0; i <= rows; i++) {
    for (let j = 0; j <= columns; j++) {
      const n = i * (columns + 1) + j;
      uv[n * 2] = j / columns; uv[n * 2 + 1] = i / rows;
      if (i < rows && j < columns) {
        const a = n, b = n + columns + 1;
        indices.push(a, a + 1, b, b, a + 1, b + 1);
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(p, 3).setUsage(THREE.DynamicDrawUsage));
  geometry.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geometry.setIndex(indices);
  return geometry;
}
function makeBody() {
  const rows = 88, columns = 112;
  const geometry = makeGrid(rows, columns);
  const p = geometry.attributes.position.array;
  const point = [0, 0, 0];
  for (let i = 0; i <= rows; i++) {
    for (let j = 0; j <= columns; j++) {
      bodyPoint(Math.max(0.0001, Math.min(Math.PI - 0.0001, i / rows * Math.PI)), j / columns * TAU, point);
      p.set(point, (i * (columns + 1) + j) * 3);
    }
  }
  geometry.setAttribute('aRest', new THREE.BufferAttribute(p.slice(), 3));
  geometry.computeVertexNormals();
  return geometry;
}

const latexMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe61c24, roughness: 0.185, metalness: 0.0,
  clearcoat: 1, clearcoatRoughness: 0.085, reflectivity: 0.56,
  transmission: 0.075, ior: 1.46,
  transparent: true, opacity: 0.985, envMapIntensity: 0.85
});
latexMaterial.color.convertSRGBToLinear();
const skinUniforms = { uTear: { value: 0 } };
latexMaterial.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, skinUniforms);
  shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nattribute vec3 aRest; varying vec3 vRest;');
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvRest = aRest;');
  shader.fragmentShader = shader.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vRest; uniform float uTear;');
  shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>', [
    '#include <clipping_planes_fragment>',
    'vec3 q = normalize(vec3(vRest.x / 1.2, vRest.y / 1.63, vRest.z / 1.2));',
    'float tearAngle = acos(clamp(q.x, -1.0, 1.0));',
    'float jagged = 0.045 * sin(vRest.y * 81.0 + vRest.z * 47.0) + 0.026 * sin(vRest.z * 113.0);',
    'if (uTear > 0.0 && tearAngle < uTear * 3.35 + jagged) discard;'
  ].join('\n'));
};
const skinGeometry = makeBody();
const skin = new THREE.Mesh(skinGeometry, latexMaterial);
skin.renderOrder = 3;
skin.frustumCulled = false;
scene.add(skin);

const waterMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xc7e6ed, metalness: 0, roughness: 0.047,
  transmission: 0.98, ior: 1.333,
  clearcoat: 1, clearcoatRoughness: 0.035, reflectivity: 0.62,
  transparent: true, opacity: 0.86, depthWrite: false,
  envMapIntensity: 1.65, side: THREE.DoubleSide
});
const waterUniforms = { uBreak: { value: 0 }, uHole: { value: 0 }, uWaterTime: { value: 0 } };
waterMaterial.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, waterUniforms);
  shader.vertexShader = shader.vertexShader.replace('#include <common>', '#include <common>\nattribute vec3 aRest; varying vec3 vRest;');
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvRest = aRest;');
  shader.fragmentShader = shader.fragmentShader.replace('#include <common>', [
    '#include <common>',
    'varying vec3 vRest; uniform float uBreak; uniform float uHole; uniform float uWaterTime;',
    'float waterNoise(vec3 p) {',
    '  return 0.50 + 0.23 * sin(p.x * 13.0 + sin(p.y * 8.0)) * sin(p.y * 11.0 + p.z * 7.0)',
    '    + 0.15 * sin(p.z * 22.0 + p.y * 17.0) * cos(p.x * 19.0 - p.z * 9.0);',
    '}'
  ].join('\n'));
  shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>', [
    '#include <clipping_planes_fragment>',
    'float channelRadius = length(vec2(vRest.y - 0.10, vRest.z));',
    'if (channelRadius < uHole && (vRest.x > 0.0 || uWaterTime > 3.8)) discard;',
    'if (uBreak > 0.0 && waterNoise(vRest) < uBreak) discard;'
  ].join('\n'));
};
const waterGeometry = makeBody();
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.renderOrder = 1;
water.frustumCulled = false;
scene.add(water);

const redScrapMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xc80b19, roughness: 0.23, clearcoat: 1, clearcoatRoughness: 0.12,
  metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.8
});
redScrapMaterial.color.convertSRGBToLinear();
const neck = new THREE.Group();
const neckStem = new THREE.Mesh(new THREE.CylinderGeometry(0.041, 0.084, 0.22, 24), redScrapMaterial);
neckStem.position.y = 1.68;
neck.add(neckStem);
const knot = new THREE.Mesh(new THREE.TorusGeometry(0.065, 0.025, 12, 32), redScrapMaterial);
knot.rotation.x = Math.PI / 2;
knot.position.y = 1.795;
neck.add(knot);
const lip = new THREE.Mesh(new THREE.ConeGeometry(0.094, 0.12, 20, 1, true), redScrapMaterial);
lip.position.set(0.015, 1.87, 0);
lip.rotation.z = -0.14;
neck.add(lip);
scene.add(neck);
const tether = new THREE.Mesh(
  new THREE.CylinderGeometry(0.0045, 0.0045, 5, 8),
  new THREE.MeshStandardMaterial({ color: 0xa2a6b0, roughness: 0.8, metalness: 0.1 })
);
tether.position.set(0, 4.31, 0);
scene.add(tether);

// Ragged elastic strips recoil in ~0.45 s, much faster than the fluid moves.
const scraps = [];
for (let i = 0; i < 18; i++) {
  const geometry = makeGrid(22, 3);
  const mesh = new THREE.Mesh(geometry, redScrapMaterial);
  mesh.frustumCulled = false;
  mesh.renderOrder = 4;
  const item = {
    mesh, geometry, phi: i / 18 * TAU + range(-0.12, 0.12),
    top: i % 3 !== 0, phase: range(0, TAU),
    width: range(0.075, 0.17), delay: range(0, 0.06), drift: range(-0.4, 0.4)
  };
  scraps.push(item); scene.add(mesh);
}

// Copper jacket, pointed ogive and turned brass cannelures, oriented +X to -X.
const bullet = new THREE.Group();
const profile = [
  new THREE.Vector2(0, -0.255), new THREE.Vector2(0.069, -0.255),
  new THREE.Vector2(0.075, -0.235), new THREE.Vector2(0.075, 0.015),
  new THREE.Vector2(0.069, 0.09), new THREE.Vector2(0.054, 0.17),
  new THREE.Vector2(0.034, 0.245), new THREE.Vector2(0.012, 0.30),
  new THREE.Vector2(0, 0.322)
];
const copper = new THREE.MeshPhysicalMaterial({ color: 0xb87a46, metalness: 0.93, roughness: 0.23, clearcoat: 0.3, envMapIntensity: 1.6 });
bullet.add(new THREE.Mesh(new THREE.LatheGeometry(profile, 48), copper));
const brass = new THREE.MeshStandardMaterial({ color: 0x9c7135, metalness: 0.95, roughness: 0.26, envMapIntensity: 1.4 });
for (let i = 0; i < 3; i++) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.0036, 6, 40), brass);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = -0.15 + i * 0.021;
  bullet.add(ring);
}
bullet.rotation.z = Math.PI / 2;
bullet.renderOrder = 2;
scene.add(bullet);
const flightKeys = [
  [0, 9.8, -10], [1, 1.425, -0.7], [1.6, 1.12, -0.48],
  [2.4, 0.76, -0.70], [3.8, -0.99, -2.0], [5, -5.4, -4.5], [8, -18.9, -4.5]
];
function bulletX(t) {
  for (let i = 0; i < flightKeys.length - 1; i++) {
    const a = flightKeys[i], b = flightKeys[i + 1];
    if (t <= b[0]) {
      const d = b[0] - a[0], u = clamp((t - a[0]) / d, 0, 1);
      const u2 = u * u, u3 = u2 * u;
      return (2 * u3 - 3 * u2 + 1) * a[1] + (u3 - 2 * u2 + u) * d * a[2]
        + (-2 * u3 + 3 * u2) * b[1] + (u3 - u2) * d * b[2];
    }
  }
  return flightKeys[flightKeys.length - 1][1];
}

const cavityGeometry = makeGrid(64, 28);
const cavityMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe1f5fa, roughness: 0.15, metalness: 0, transmission: 0.75,
  transparent: true, opacity: 0.24, depthWrite: false,
  side: THREE.DoubleSide, envMapIntensity: 1.45, clearcoat: 1
});
const cavity = new THREE.Mesh(cavityGeometry, cavityMaterial);
cavity.frustumCulled = false; cavity.renderOrder = 2; scene.add(cavity);
const bubbleCount = 180;
const bubbleSeeds = [];
for (let i = 0; i < bubbleCount; i++) bubbleSeeds.push({ u: random(), a: range(0, TAU), r: range(0.007, 0.027), p: range(0, TAU) });
const bubbleMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe9fbff, roughness: 0.08, metalness: 0.1,
  transparent: true, opacity: 0.50, depthWrite: false, envMapIntensity: 2.6
});
const bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 7, 5), bubbleMaterial, bubbleCount);
bubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
bubbles.frustumCulled = false; bubbles.renderOrder = 3; scene.add(bubbles);

// Two scales of spray: 1,600 refractive drops and 2,700 sub-pixel/mist drops.
// Birth states are immutable; gravity and the first splash collision are analytical.
function volumeSample() {
  const c = range(-1, 1), phi = range(0, TAU), radius = Math.cbrt(random());
  const point = bodyPoint(Math.acos(c), phi, [0, 0, 0]);
  return [point[0] * radius, point[1] * radius, point[2] * radius];
}
function makeParticle(family, small) {
  let x, y, z, vx, vy, vz, birth;
  const angle = range(0, TAU);
  if (family === 0 || family === 1) {
    const forward = family === 1;
    const sign = forward ? -1 : 1;

    cancelTimers(); state = PAUSED; simTime = 0; scrubber.value = '0';
    renderAt(0);
  } else if (state === ENDED) {
    cancelTimers(); simTime = 0; scrubber.value = '0'; state = PLAYING;
    renderAt(0);
  } else {
    state = PLAYING;
  }
  lastFrame = performance.now();
  syncToggle();
});
document.getElementById('btn-refire').addEventListener('click', () => {
  cancelTimers();
  simTime = 0.000; scrubber.value = '0';
  state = REFIRE_HOLD; holdElapsed = 0;
  holdStart = performance.now(); lastFrame = holdStart;
  syncToggle(); renderAt(0);
});
for (const pill of pills) {
  pill.addEventListener('click', () => {
    playbackSpeed = parseFloat(pill.dataset.speed);
    for (const item of pills) {
      const active = item === pill;
      item.classList.toggle('is-active', active);
      item.setAttribute('aria-checked', active ? 'true' : 'false');
    }
  });
}
scrubber.addEventListener('input', () => {
  cancelTimers();
  simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
  state = PAUSED; lastFrame = performance.now();
  syncToggle(); renderAt(simTime);
});
function frame(now) {
  let dt = lastFrame === null ? 0 : clamp((now - lastFrame) / 1000, 0, 0.1);
  lastFrame = now;
  if (state === COUNTDOWN) {
    if (countdownStart === null) countdownStart = now;
    countdownElapsed = (now - countdownStart) / 1000;
    simTime = 0; scrubber.value = '0';
    if (countdownElapsed < 3.000) {
      countdown.style.display = 'block';
      countdown.textContent = String(3 - Math.floor(countdownElapsed));
    } else {
      // Only the fraction after the exact 3 s boundary belongs to playback.
      dt = Math.min(0.1, Math.max(0, countdownElapsed - 3.000));
      state = PLAYING; hideCountdown(); syncToggle();
    }
  } else if (state === REFIRE_HOLD) {
    holdElapsed = (now - holdStart) / 1000;
    if (holdElapsed >= 1.000) {
      dt = Math.min(0.1, Math.max(0, holdElapsed - 1.000));
      state = PLAYING; syncToggle();
    }
  }
  if (state === PLAYING) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    if (simTime >= DURATION) {
      simTime = DURATION; state = ENDED; syncToggle();
    }
    scrubber.value = simTime.toFixed(3);
    renderAt(simTime);
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', () => {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left = -VIEW_HEIGHT * aspect / 2;
  camera.right = VIEW_HEIGHT * aspect / 2;
  camera.top = VIEW_HEIGHT / 2; camera.bottom = -VIEW_HEIGHT / 2;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  mistMaterial.uniforms.uPixelScale.value = window.innerHeight * renderer.getPixelRatio() / VIEW_HEIGHT;
  renderAt(simTime);
});

// Resting frame first; COUNTDOWN starts on the following animation callback.
renderAt(0.000);
requestAnimationFrame(frame);
</script>
