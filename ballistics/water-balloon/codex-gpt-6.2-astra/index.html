<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water balloon in slow motion</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script>
(() => {
  'use strict';

  const DURATION = 8.000;
  const TAU = 2 * Math.PI;
  const FLIGHT_Y = -0.23;
  const FLOOR_Y = -2.16;
  const captureFPS = 18000, projectionFPS = 30;
  const exposure = (60 / 360) / captureFPS;
  function mulberry32(seed) {
    return () => {
      let n = seed += 0x6D2B79F5;
      n = Math.imul(n ^ n >>> 15, n | 1);
      n ^= n + Math.imul(n ^ n >>> 7, n | 61);
      return ((n ^ n >>> 14) >>> 0) / 4294967296;
    };
  }
  const random = mulberry32(42);
  const range = (a, b) => a + (b - a) * random();
  const smooth = (a, b, x) => {
    const k = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return k * k * (3 - 2 * k);
  };
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.setClearColor(0x000000, 0);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 90);
  const scene = new THREE.Scene();

  // Render the interior separately so the fluid can refract the moving projectile and wake.
  const interior = new THREE.WebGLRenderTarget(1, 1, {
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
    format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false
  });
  interior.texture.generateMipmaps = false;
  const uniforms = {
    uTime: { value: 0 }, uTip: { value: 9 }, uInterior: { value: interior.texture },
    uInvViewport: { value: new THREE.Vector2() }, uUseInterior: { value: 0 },
    uDye: { value: new THREE.Color('#e61c24').convertSRGBToLinear() },
    uShutter: { value: exposure * captureFPS / projectionFPS }
  };
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
  function addLight(color, intensity, position) {
    const light = new THREE.DirectionalLight(color, intensity);
    light.position.copy(position);
    scene.add(light);
  }
  scene.add(new THREE.HemisphereLight(0xe4e9f2, 0x55505d, 0.72));
  addLight(0xfff4e9, 1.65, v3(-4, 6, 5));
  addLight(0xd1f3ff, 1.4, v3(4, 2, -3));
  addLight(0xffdae7, 0.9, v3(-3, -1, -2));

  // Immutable rest coordinates drive both forward motion and arbitrary timeline seeks.
  const field = `
    uniform float uTime;
    uniform float uTip;
    const float tau = 6.28318530718;
    const float shotY = -0.23;
    const float floorY = -2.16;
    float sq(float x) { return x*x; }
    float sat(float x) { return clamp(x, 0.0, 1.0); }
    float waves(vec3 p) {
      return sin(p.x*1.37+p.z)*sin(p.y*1.61-p.z*.83)
           + .48*sin(dot(p,vec3(-2.17,1.31,2.61))+.6)
           + .22*sin(dot(p,vec3(4.71,-3.17,2.29)));
    }
    vec3 fluid(vec3 p, float t) {
      if (t <= 1.0) return p;
      float d = length(p-vec3(1.25,shotY,0.0));
      float indent = smoothstep(1.0,1.22,t)*(1.0-smoothstep(1.23,1.60,t));
      vec3 q = p;
      q.x -= .245*indent*exp(-9.0*d*d);
      float front = d-1.16*(t-1.06);
      float ring = .038*sin(21.0*front)*exp(-3.6*abs(front))*smoothstep(1.03,1.33,t);
      float release=smoothstep(1.16,1.74,t);
      ring+=.0085*release*waves(p*5.5+vec3(.28*t,-.32*t,.51));
      q += normalize(p-vec3(0.0,-.23,0.0)+vec3(.0001))*ring;
      float wake = smoothstep(2.40,3.72,t);
      float yr = p.y-shotY;
      float belt = exp(-2.1*yr*yr);
      float az = atan(p.z,p.x+.00001);
      float exitWave = smoothstep(3.80,4.52,t)*exp(-sq((p.x+.92)*1.65));
      float breakup = smoothstep(5.00,6.68,t);
      float age = max(0.0,t-5.00);
      float corrugation = .018*wake+.058*wake*belt+.072*exitWave+.095*breakup;
      q += normalize(p-vec3(0.0,-.23,0.0)+vec3(.0001))*
        corrugation*waves(p*(2.8+breakup)+vec3(-.74*t,.32*t,.16*t));
      q.x *= 1.0+belt*(.072*wake+.22*exitWave+.16*breakup);
      q.x += .07*breakup*sin(3.6*p.y+2.0*p.z);
      q.y -= .045*smoothstep(1.58,3.8,t)+.052*sq(max(0.0,t-2.55));
      q.y -= age*age*(.39+.082*sin(6.0*az+.7)+.057*sin(5.1*p.y-2.4*az));
      q.y += .10*breakup*sin(7.0*az+3.7*p.y);
      q.z += .08*breakup*sin(3.8*p.x+2.0*p.y);
      float neckRelease=smoothstep(1.37,2.55,t);
      q.y-=neckRelease*(.054+.405*smoothstep(.70,1.64,p.y));
      float landing = max(0.0,floorY+.055-q.y);
      q.x += .41*landing*(p.x+.16);
      q.z += .38*landing*p.z;
      q.y += landing;
      return q;
    }
    float tearStart(vec3 p) {
      float a = acos(clamp(p.x/max(.001,length(p.xz)),-1.0,1.0));
      return 1.115+.19*a/3.14159+.011*sin(5.0*a);
    }
  `;
  const panels = `
    // Finite softboxes produce both broad reflections and narrow rim highlights.
    float panel(vec3 r, vec3 axis, vec2 extent, float softness, float tilt) {
      vec3 h = normalize(vec3(axis.z,0.0,-axis.x));
      vec3 v = cross(axis,h);
      float front = dot(r,axis);
      vec2 p = vec2(dot(r,h),dot(r,v))/max(.09,front);
      p = mat2(cos(tilt),sin(tilt),-sin(tilt),cos(tilt))*p;
      vec2 d = abs(p)-extent;
      float sd = length(max(d,0.0))+min(max(d.x,d.y),0.0);
      float diffuser=.54+.46*exp(-1.25*dot(p/extent,p/extent));
      return diffuser*(1.0-smoothstep(-softness,softness,sd))*smoothstep(.02,.25,front);
    }
  `;
  const emitters = panels+`
    vec3 radiance(vec3 r, float blur) {
      vec3 light=mix(vec3(.0015,.0025,.0040),vec3(.12,.15,.18),pow(.5+.5*r.y,2.6));
      vec3 key=normalize(vec3(-.70,.75,.35));
      light+=vec3(.41,.38,.36)*pow(sat(dot(r,key)),4.0);
      light+=vec3(7.9,7.6,7.2)*panel(r,key,vec2(.285,.47),.12+blur,-.24);
      light+=vec3(2.1,1.73,1.90)*panel(r,normalize(vec3(-.92,.14,-.29)),vec2(.07,.64),.037+blur,-.16);
      light+=vec3(3.0,3.65,4.1)*panel(r,normalize(vec3(.82,.19,-.61)),vec2(.078,.81),.049+blur,.085);
      light+=vec3(1.48,1.42,1.47)*panel(r,normalize(vec3(.32,.84,-.63)),vec2(.66,.12),.13+blur,.20);
      light+=vec3(.48,.56,.65)*panel(r,normalize(vec3(-.19,-.89,-.61)),vec2(.88,.19),.13+blur,-.16);
      return light;
    }
  `;
  // Bake both sharp and rough reflections once. RGBM preserves the intensity of the emitters
  // in an ordinary RGBA8 texture, including on WebGL implementations without float targets.
  const lightAtlas=new THREE.WebGLRenderTarget(1024,512,{
    minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false,stencilBuffer:false
  });
  {
    const bakeScene=new THREE.Scene(),tile=new THREE.PlaneGeometry(2,2);
    const bake=new THREE.ShaderMaterial({
      vertexShader:'varying vec2 st;void main(){st=uv;gl_Position=vec4(position.xy,0.,1.);}',
      fragmentShader:field+emitters+`
        varying vec2 st;
        void main() {
          vec2 p=vec2(fract(st.x*2.0),st.y)*2.0-1.0;
          vec3 d=vec3(p,1.0-abs(p.x)-abs(p.y));
          float hem=clamp(-d.z,0.0,1.0);
          d.xy-=sign(d.xy)*hem;
          vec3 l=radiance(normalize(d),st.x<.5 ? .006 : .15);
          float m=clamp(ceil(max(max(l.r,l.g),l.b)*255.0/12.0)/255.0,1.0/255.0,1.0);
          gl_FragColor=vec4(l/(m*12.0),m);
        }`,
      depthTest:false,depthWrite:false
    });
    const quad=new THREE.Mesh(tile,bake);
    quad.frustumCulled=false;
    bakeScene.add(quad);
    renderer.setRenderTarget(lightAtlas);
    renderer.render(bakeScene,new THREE.Camera());
    renderer.setRenderTarget(null);
    tile.dispose();
    bake.dispose();
  }
  uniforms.uStudio={value:lightAtlas.texture};
  const studio = panels+`
    uniform sampler2D uStudio;
    vec3 studioLight(vec3 r,float blur) {
      vec2 p=r.xy/max(.0001,abs(r.x)+abs(r.y)+abs(r.z));
      if (r.z<0.0) p=(1.0-abs(p.yx))*mix(vec2(-1.0),vec2(1.0),step(vec2(0.0),p));
      vec2 uv=clamp(p*.5+.5,vec2(.00098),vec2(.99902));
      vec4 sharp=texture2D(uStudio,vec2(uv.x*.5,uv.y));
      vec4 soft=texture2D(uStudio,vec2(uv.x*.5+.5,uv.y));
      return 12.0*mix(sharp.rgb*sharp.a,soft.rgb*soft.a,sat((blur-.006)/.144));
    }
    vec3 glass(vec3 n, vec3 view, vec3 p, float thin) {
      float facing = sat(dot(n,view));
      float fr = .021+.979*pow(1.0-facing,5.0);
      vec3 incident = refract(-view,n,.7502);
      // Intersect the internal ray with the opposing osculating sphere, then apply Snell again.
      vec3 rear=normalize(n-2.0*dot(n,incident)*incident);
      vec3 outgoing=refract(incident,-rear,1.333);
      if(dot(outgoing,outgoing)<.01) outgoing=reflect(incident,-rear);
      vec3 backRay=normalize(mix(outgoing,-view,.22*thin));
      vec3 optical=studioLight(backRay,.026);
      optical+=vec3(2.05,2.18,2.24)*panel(backRay,normalize(vec3(-.61,.08,-.86)),vec2(.16,.76),.075,.15);
      optical+=vec3(.70,.92,1.07)*panel(backRay,normalize(vec3(.59,-.26,-.83)),vec2(.17,.56),.11,-.29);
      float shading=.20+.80*pow(.5+.5*backRay.y,1.4);
      vec3 through=vec3(.003,.006,.009)+optical*vec3(.49,.61,.65)*mix(.76,.51,thin);
      through+=vec3(.006,.013,.017)*shading;
      vec3 innerRay=reflect(incident,-rear);
      float inner=.021+.95*pow(1.0-abs(dot(incident,rear)),3.0);
      through+=studioLight(innerRay,.051)*(inner+.027)*(1.0-.55*thin);
      vec3 refl = studioLight(reflect(-view,n),.005);
      vec3 result=through*(1.0-fr)+refl*(fr+.041);
      result+=vec3(.042,.068,.078)*pow(1.0-facing,2.0);
      return result;
    }
    uniform vec3 uDye;
    vec3 rubber(vec3 n, vec3 view, vec3 p, float film) {
      float nv = sat(dot(n,view));
      vec3 key=normalize(vec3(-.67,.59,.47));
      float diffuse=pow(sat(.065+.935*dot(n,key)),1.65);
      float thickness=(.51+1.37*nv)*(.96-.12*p.y+.024*waves(p*3.1));
      vec3 transmission=exp(-vec3(.91,3.82,3.12)*thickness);
      float backLight=pow(sat(.52+.48*dot(n,normalize(vec3(-.65,-.41,-.65)))),1.35);
      vec3 color=uDye*(.024+1.04*diffuse);
      color+=vec3(.58,.062,.052)*transmission*(.16+1.16*backLight);
      color+=vec3(.20,.003,.010)*sat(.56-.37*p.y)*pow(nv,1.44);
      color+=vec3(.044,.003,.013)*sq(sat(dot(n,normalize(vec3(.7,-.49,.51)))));
      vec3 r = reflect(-view,n);
      float fresnel=.035+.88*pow(1.0-nv,4.6);
      color+=studioLight(r,.082)*fresnel;
      color+=vec3(.12,.078,.083)*pow(sat(dot(r,key)),9.0);
      color+=vec3(.24,.018,.021)*pow(1.0-nv,4.0)*sat(.6-.4*n.y);
      return mix(color,color*vec3(.74,.68,.72),film*.34);
    }
  `;
  const surfaceVaryings = `
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying vec3 vRest;
    varying vec2 vUV;
  `;
  const finishVertex = `
    vWorld = (modelMatrix*vec4(p,1.0)).xyz;
    vNormal = normalize(mat3(modelMatrix)*n);
    vRest = position;
    vUV = uv;
    gl_Position = projectionMatrix*viewMatrix*vec4(vWorld,1.0);
  `;
  const encode = '\n#include <encodings_fragment>\n';
  function material(vertexShader,fragmentShader,settings = {}) {
    return new THREE.ShaderMaterial({
      uniforms, vertexShader, fragmentShader,
      extensions: { derivatives: true }, ...settings
    });
  }
  function mesh(geometry,surface,order = 0) {
    const object = new THREE.Mesh(geometry,surface);
    object.frustumCulled = false;
    object.renderOrder = order;
    scene.add(object);
    return object;
  }
  // Arc-length sampling keeps successive rings even through the pinched neck.
  const profile = new THREE.CatmullRomCurve3([
    [0,-1.495],[.25,-1.476],[.53,-1.405],[.79,-1.267],
    [1.015,-1.057],[1.175,-.791],[1.244,-.484],[1.242,-.203],
    [1.17,.102],[1.028,.412],[.818,.700],[.566,.954],
    [.350,1.165],[.193,1.350],[.101,1.493],[.073,1.570],[.070,1.626]
  ].map(([r,y]) => v3(r,y,0)));
  profile.arcLengthDivisions = 640;
  function shellPoint(u,a) {
    const q = profile.getPointAt(Math.min(1,Math.max(0,u)));
    const gather = smooth(1.06,1.59,q.y);
    const radius = q.x*(1+.066*gather*Math.cos(11*a+q.y*5.1)
      +.008*Math.cos(3*a+.6)*(1-gather));
    return v3(radius*Math.cos(a)+.019*Math.sin((q.y+1.49)*1.43),
              q.y,radius*Math.sin(a)*.975);
  }
  function shellNormal(u,a) {
    if (u < .0001) return v3(0,-1,0);
    const along = shellPoint(u+.00025,a).sub(shellPoint(u-.00025,a));
    const around = shellPoint(u,a+.001).sub(shellPoint(u,a-.001));
    return along.cross(around).normalize();
  }
  function bufferGeometry(positions,normals,uvs,indices) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
    if (normals) g.setAttribute('normal',new THREE.Float32BufferAttribute(normals,3));
    if (uvs) g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
    g.setIndex(indices);
    return g;
  }
  function shellGeometry(part) {
    const points=[], normals=[], uvs=[], indices=[];
    const columns=128, rows=part ? 44 : 88;
    for (let j=0; j<=rows; j++) {
      for (let i=0; i<=columns; i++) {
        const a=TAU*i/columns, row=j/rows;
        const seam=.452+.017*Math.sin(3*a+.9)+.012*Math.sin(7*a)+.004*Math.sin(17*a+.6);
        const u=part>0 ? seam+(1-seam)*row : part<0 ? seam*row : row;
        const point=shellPoint(u,a), normal=shellNormal(u,a);
        if (part===0 && u>.976) {
          const cap=smooth(.976,1,u);
          point.x*=1-cap;
          point.z*=1-cap;
          point.y+=.011*cap;
          normal.lerp(v3(0,1,0),cap).normalize();
        }
        points.push(point.x,point.y,point.z);
        normals.push(normal.x,normal.y,normal.z);
        uvs.push(i/columns,row);
        if (i<columns && j<rows) {
          const k=j*(columns+1)+i;
          indices.push(k,k+columns+1,k+1,k+1,k+columns+1,k+columns+2);
        }
      }
    }
    return bufferGeometry(points,normals,uvs,indices);
  }

  // Encode the radius and height of the profile at 16-bit precision in a small lookup texture.
  // The torn latex slides along this same surface as it gathers at the two poles.
  const samples=256, profileBytes=new Uint8Array(samples*4);

    ['aParams',threads.params,4],['aStyle',threads.style,2]

  const filamentVertex=field+jetField+surfaceVaryings+`
    attribute vec3 aRoot,aVelocity;
    attribute vec4 aParams;
    attribute vec2 aStyle;

    vec3 strandCenter(float u,float age) {

      float jet=abs(aStyle.x);
      vLife=smoothstep(0.0,.22,age)*(1.0-smoothstep(1.05+jet*.24,2.34+jet*.62,age));
      float pinch=.61+.39*cos(u*(19.0+4.0*sin(aParams.w))-2.6*age+aParams.w);
      float radius=aParams.y*(.39+.81*pinch)*pow(max(0.0,sin(u*3.14159)),.31)*vLife;
      vec3 c=strandCenter(u,age);
      vec3 axis=normalize(strandCenter(u+.002,age)-strandCenter(u-.002,age)+vec3(.000001,0,0));
      vec3 h=normalize(cross(axis,abs(axis.z)<.90?vec3(0,0,1):vec3(0,1,0)));

  const filaments=mesh(filamentGeometry,material(filamentVertex,field+studio+surfaceVaryings+`
    varying float vLife;
    void main() {
      if (vWorld.y<floorY+.032 || vLife<.015) discard;

      if (dot(n,view)<0.0) n=-n;

  // Small sessile drops use a flattened spherical cap aligned with the local latex normal.
  const dewRoots=[],dewNormals=[],dewSizes=[];
  function dewDrop(u,a,size,elongation) {
    const p=shellPoint(u,a),n=shellNormal(u,a);
    dewRoots.push(...p.toArray());
    dewNormals.push(...n.toArray());
    dewSizes.push(size,size*elongation,size*range(.39,.74));
  }
  for (let i=0;i<233;i++) {
    const u=range(.06,.95),a=range(-.52,Math.PI+.56);
    const size=.006+Math.pow(random(),3.1)*.039;
    dewDrop(u,a,size,range(1.0,1.54));
    if (size>.022 && random()<.68) {
      dewDrop(u+size*range(.53,1.06),a+range(-.018,.018),size*range(.17,.40),1.18);
    }
  }
  for (let i=0;i<14;i++) {
    const u=range(.28,.69),a=range(.60,2.62),size=range(.022,.045);
    dewDrop(u,a,size,range(1.06,1.46));
    dewDrop(u+.026,a+range(-.012,.015),size*.24,1.07);
  }
  const dewGeometry=instances(new THREE.SphereGeometry(1,16,8,0,TAU,0,Math.PI*.51),[
    ['aRoot',dewRoots,3],['aSurfaceN',dewNormals,3],['aSize',dewSizes,3]
  ],dewSizes.length/3);
  const dew=mesh(dewGeometry,material(field+`
    attribute vec3 aRoot,aSurfaceN,aSize;
    varying vec3 vDropN,vBaseN,vPoint;
    varying float vHeight;
    void main() {
      vec3 h=normalize(cross(vec3(0,1,0),aSurfaceN));
      vec3 v=cross(aSurfaceN,h);
      float shrink=1.0-smoothstep(tearStart(aRoot),tearStart(aRoot)+.12,uTime);
      if(shrink<.01){gl_Position=vec4(2,2,2,1);return;}
      vec3 local=h*position.x*aSize.x-v*position.z*aSize.y+aSurfaceN*position.y*aSize.z;
      vec3 p=fluid(aRoot,uTime)+aSurfaceN*.0092+local*shrink;
      vDropN=normalize(h*normal.x/aSize.x-v*normal.z/aSize.y+aSurfaceN*normal.y/aSize.z);
      vBaseN=aSurfaceN;
      vPoint=p;
      vHeight=position.y;
      gl_Position=projectionMatrix*viewMatrix*vec4(p,1);
    }`,field+studio+`
    varying vec3 vDropN,vBaseN,vPoint;
    varying float vHeight;
    void main() {
      vec3 n=normalize(vDropN),v=normalize(cameraPosition-vPoint);
      vec3 base=rubber(normalize(vBaseN),v,vPoint,0.0);
      float fr=.031+.68*pow(1.0-sat(dot(n,v)),3.8);
      float contact=smoothstep(0.0,.36,vHeight);
      vec3 c=base*(.27+.51*contact+.38*sat(-n.y));
      c+=vec3(.16,.012,.016)*pow(sat(dot(n,normalize(vec3(.52,-.78,.19)))),4.0);
      vec3 r=reflect(-v,n);
      c+=studioLight(r,.024)*(fr+.072);
      c+=vec3(.47,.42,.40)*pow(sat(dot(r,normalize(vec3(-.57,.65,.55)))),36.0);
      gl_FragColor=vec4(c,1);

  // One detached, antialiased lens sprite stores highlight, caustic and edge coverage.
  function makeDropSprite() {
    const size=96;
    const canvas=document.createElement('canvas');
    canvas.width=canvas.height=size;
    const ctx=canvas.getContext('2d');
    const pixels=ctx.createImageData(size,size);
    for (let y=0;y<size;y++) {
      for (let x=0;x<size;x++) {
        const dx=(x+.5)/size*2-1, dy=1-(y+.5)/size*2;
        const r=Math.sqrt(dx*dx+dy*dy);
        const nz=Math.sqrt(Math.max(0,1-r*r));
        const key=Math.exp(-((dx+.35)**2/.050+(dy-.44)**2/.025));
        const strip=Math.exp(-((dx-.72)**2/.012+(dy-.12)**2/.18));
        const caustic=Math.exp(-((r-.77)**2/.011))*Math.max(0,-dy*.86+dx*.45);
        const rim=(1-nz)**1.6;
        const ix=(y*size+x)*4;
        pixels.data[ix]=255*Math.min(1,key+.62*strip);
        pixels.data[ix+1]=255*Math.min(1,caustic+.52*rim);
        pixels.data[ix+2]=255*(.16+.52*nz+.28*Math.max(0,dy));
        pixels.data[ix+3]=255*(1-smooth(.965,1,r));
      }
    }
    ctx.putImageData(pixels,0,0);
    const texture=new THREE.CanvasTexture(canvas);
    texture.minFilter=THREE.LinearMipmapLinearFilter;
    return texture;
  }
  uniforms.uDrop={value:makeDropSprite()};
  uniforms.uPixelHeight={value:1080};
  function particleSet() { return {origin:[],velocity:[],launch:[],optics:[]}; }
  const sprayData=particleSet(),bubbleData=particleSet();
  function drop(set,origin,velocity,birth,radius,drag,gravity,kind,life) {
    set.origin.push(...origin.toArray());
    set.velocity.push(...velocity.toArray());
    set.launch.push(birth,radius,drag,gravity);
    set.optics.push(kind,range(0,TAU),range(.62,1.17),life);
  }
  // Spray is emitted in correlated families from the edges of each moving sheet.
  for (const side of [1,-1]) {
    const start=side>0?2.40:3.80;
    for (let family=0;family<(side>0?29:37);family++) {
      const angle=range(0,TAU),delay=range(.055,.79),speed=range(.72,2.46);
      const spread=range(.28,.82),u=range(.44,1.09);
      for (let j=0;j<26;j++) {
        const a=angle+range(-.12,.12),s=speed*range(.76,1.28);
        const radius=.0046+Math.pow(random(),3.7)*.044;
        const origin=v3(u+range(-.071,.09),a,side);
        const vel=v3(side*s,spread*Math.sin(a)*s+range(-.12,.18),spread*Math.cos(a)*s);
        drop(sprayData,origin,vel,start+delay+range(0,.50),radius,range(.32,1.08),
          range(.67,1.30),1,range(1.65,3.65));
      }
    }
  }
  for (let i=0;i<66;i++) {
    const a=range(0,TAU),r=range(.014,.14);
    drop(sprayData,v3(1.18,FLIGHT_Y+r*Math.sin(a),r*Math.cos(a)),
      v3(range(.28,1.19),range(-.25,.48),range(-.42,.42)),range(1.17,1.49),
      range(.004,.021),.82,.57,0,range(.38,.97));
  }
  for (let family=0;family<72;family++) {
    const a=range(0,TAU),u=range(.05,.94),birth=range(5.03,6.62);
    const baseVelocity=range(.22,1.17),rise=range(-.42,.53);
    for (let j=0;j<18;j++) {
      const az=a+range(-.13,.13);
      const origin=shellPoint(Math.max(.001,Math.min(.998,u+range(-.039,.039))),az);
      const radius=.006+Math.pow(random(),3.9)*.071;
      const vel=v3(Math.cos(az)*baseVelocity+range(-.25,.25),
        rise+range(-.28,.25),Math.sin(az)*baseVelocity+range(-.14,.14));
      drop(sprayData,origin,vel,birth+range(0,.34),radius,range(.22,.72),range(1.29,2.21),2,3.2);

  }
  for (let i=0;i<788;i++) {
    const source=i%3, a=range(0,TAU),r=range(.17,.62);
    const cx=[-.32,.68,-1.12][source],cz=[.02,-.17,.19][source];
    const start=[5.98,6.81,7.44][source], s=range(.55,2.48);
    const birth=start+range(.045,.62);
    const p=v3(cx+r*Math.cos(a),FLOOR_Y+range(.06,.25),cz+r*Math.sin(a));
    const velocity=v3(Math.cos(a)*s,range(.81,2.34),Math.sin(a)*s*.74);
    drop(sprayData,p,velocity,birth,.006+Math.pow(random(),3.3)*.053,range(.33,.73),range(2.5,3.6),0,2.1);
  }
  for (let i=0;i<15;i++) {
    drop(sprayData,v3(range(-.10,.12),range(1.21,1.34),range(-.11,.11)),
      v3(range(-.09,.09),-.015,range(-.04,.04)),range(3.52,7.91),
      range(.012,.040),.31,1.52,0,3.0);
  }
  for (let i=0;i<335;i++) {
    const early=i<31;
    const birth=early?range(1.38,2.28):range(2.40,4.51);
    const a=range(0,TAU),r=range(.040,.21)*(early?.65:1);
    const x=range(Math.max(-1.18,tipAt(birth)+.035),1.22);
    drop(bubbleData,v3(x,FLIGHT_Y+r*Math.sin(a),r*Math.cos(a)),
      v3(range(-.050,.15),range(.012,.16),range(-.036,.036)),birth,
      .004+Math.pow(random(),3.2)*.027,.71,-.028,3,range(.62,1.67));
  }
  for (let family=0;family<64;family++) {
    const a=range(0,TAU),u=range(.08,.91),depth=range(.43,.97);

      drop(bubbleData,p,v3(.0,range(.006,.025),.0),1.117,
        .0035+Math.pow(random(),4.2)*.023,.48,0,4,range(3.98,4.76));
    }
  }
  function particleMesh(set,inside) {
    const g=instances(new THREE.PlaneGeometry(2,2),[
      ['aOrigin',set.origin,3],['aVelocity',set.velocity,3],
      ['aLaunch',set.launch,4],['aOptics',set.optics,4]
    ],set.launch.length/4);
    const vertex=field+jetField+`
      attribute vec3 aOrigin,aVelocity;
      attribute vec4 aLaunch,aOptics;
      uniform float uPixelHeight,uShutter;
      varying vec2 vTex,vLocal,vLens;
      varying vec3 vDrop;
      void main() {
        float age=uTime-aLaunch.x,life=aOptics.w;
        if (age<=0.0 || age>=life) {gl_Position=vec4(2,2,2,1);return;}

        if (aOptics.x==1.0) origin=jetPointAt(aOrigin.x,aOrigin.y,aOrigin.z,aLaunch.x);
        if (aOptics.x==2.0) origin=fluid(aOrigin,aLaunch.x);
        if (aOptics.x==4.0) origin=fluid(aOrigin,uTime);

      }`;
    const frag=field+studio+`
      uniform sampler2D uDrop;
      varying vec2 vTex,vLocal,vLens;
      varying vec3 vDrop;
      void main() {
        float r2=dot(vLocal,vLocal);
        float footprint=clamp(fwidth(r2),.018,.58);
        float coverage=1.0-smoothstep(1.0-footprint,1.0,r2);
        vec4 lens=texture2D(uDrop,vTex);
        float a=lens.a*vDrop.y*coverage;
        if (a<.025) discard;
        vec3 c=vec3(.018,.030,.041)+lens.b*vec3(.09,.12,.14);
        c+=lens.g*vec3(.58,.70,.75)+lens.r*vec3(1.33,1.37,1.36);
        if(vLens.x>1.8) {
          vec2 xy=2.0*vTex-1.0;
          vec3 n=normalize(vec3(xy,sqrt(max(.001,1.0-r2))));
          n.xy+=.026*sin(xy.yx*7.0+vLens.y);
          vec3 optical=glass(normalize(n),vec3(0,0,1),vec3(0),.37);
          optical+=lens.r*vec3(.62,.68,.72)+lens.g*vec3(.13,.16,.18);
          c=mix(c,optical,smoothstep(1.8,4.4,vLens.x)*.91);
        }
        if(vDrop.z>=3.0) c=mix(c,c*1.35+vec3(.055,.072,.08),.65);

    const object=mesh(g,material(vertex,frag,{transparent:true,depthWrite:false}),7);
    if (inside) object.layers.set(1);
    return object;
  }
  const spray=particleMesh(sprayData,false), bubbles=particleMesh(bubbleData,true);

  function renderAt(t) {
    uniforms.uTime.value=t;
    uniforms.uTip.value=tipAt(t);
    for (const skin of skins) skin.object.material=t<1.60?skin.stretched:skin.folded;
    projectile.position.set(uniforms.uTip.value,FLIGHT_Y,0);
    projectile.visible=t>0 && projectile.position.x> -22;
    water.visible=t>=1.116 && t<7.32;
    dew.visible=t<1.48;
    cavity.visible=t>2.40 && t<5.62;
    bubbles.visible=t>1.38 && t<6.14;
    spray.visible=t>1.17;
    filaments.visible=t>2.4;
    pool.visible=t>5.61;
    for (const item of jets) item.object.visible=t>item.start && t<item.end;
    for (const item of crowns) item.object.visible=t>item.start && t<item.end;

    const refractInterior=water.visible && t<6.14;
    uniforms.uUseInterior.value=refractInterior?1:0;
    if (refractInterior) {
      camera.layers.set(1);
      renderer.setRenderTarget(interior);
      renderer.render(scene,camera);
    }
    camera.layers.set(0);
    camera.layers.enable(1);
    renderer.setRenderTarget(null);
    renderer.render(scene,camera);
  }

  const countdown=document.getElementById('countdown');
  const scrubber=document.getElementById('scrubber');
  const toggle=document.getElementById('btn-toggle');
  const pauseIcon=document.getElementById('icon-pause');
  const playIcon=document.getElementById('icon-play');
  const pills=Array.from(document.querySelectorAll('.speed-pill'));
  const State=Object.freeze({
    COUNTDOWN:'COUNTDOWN',PLAYING:'PLAYING',PAUSED:'PAUSED',REFIRE_HOLD:'REFIRE_HOLD',ENDED:'ENDED'
  });
  let state=State.COUNTDOWN,simTime=0,playbackSpeed=1.0;
  let countdownStart=null,holdStart=null,lastWall=null;

  function setState(next) {
    state=next;
    if (next!==State.COUNTDOWN) {
      countdown.style.display='none';
      countdown.textContent='';
      countdownStart=null;
    }
    if (next!==State.REFIRE_HOLD) holdStart=null;
    const running=next===State.PLAYING || next===State.COUNTDOWN || next===State.REFIRE_HOLD;
    pauseIcon.style.display=running?'block':'none';
    playIcon.style.display=running?'none':'block';
    toggle.setAttribute('aria-label',running?'Pause':'Play');
  }
  function resetFrame() {
    simTime=0;
    scrubber.value='0';
    renderAt(0);
  }
  function advance(wallSeconds) {
    simTime=Math.min(DURATION,simTime+Math.min(.1,Math.max(0,wallSeconds))*playbackSpeed);
    scrubber.value=simTime.toFixed(3);
    renderAt(simTime);
    if (simTime>=DURATION) setState(State.ENDED);
  }
  function tick(now) {
    const dt=lastWall===null?0:(now-lastWall)/1000;
    lastWall=now;
    if (state===State.COUNTDOWN) {
      if (countdownStart===null) countdownStart=now;
      const countdownElapsed=(now-countdownStart)/1000;
      if (countdownElapsed<3.000) {
        countdown.style.display='block';
        countdown.textContent=String(3-Math.floor(countdownElapsed));
      } else {
        setState(State.PLAYING);
        advance(countdownElapsed-3.000);
      }
    } else if (state===State.REFIRE_HOLD) {
      const holdElapsed=(now-holdStart)/1000;
      if (holdElapsed>=1.000) {
        setState(State.PLAYING);
        advance(holdElapsed-1.000);
      }
    } else if (state===State.PLAYING) {
      advance(dt);
    }
    requestAnimationFrame(tick);
  }
  toggle.addEventListener('click',()=>{
    if (state===State.PLAYING || state===State.COUNTDOWN || state===State.REFIRE_HOLD) {
      setState(State.PAUSED);
    } else {
      if (state===State.ENDED) resetFrame();
      setState(State.PLAYING);
      lastWall=performance.now();
    }
  });
  document.getElementById('btn-refire').addEventListener('click',()=>{
    setState(State.REFIRE_HOLD);
    holdStart=performance.now();
    lastWall=holdStart;
    resetFrame();
  });
  for (const pill of pills) {
    pill.addEventListener('click',()=>{
      playbackSpeed=Number(pill.dataset.speed);
      for (const item of pills) {
        const selected=item===pill;
        item.classList.toggle('is-active',selected);
        item.setAttribute('aria-checked',String(selected));
      }
    });
  }
  scrubber.addEventListener('input',()=>{
    setState(State.PAUSED);
    simTime=parseFloat(scrubber.value);
    renderAt(simTime);
  });
  function resize() {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.position.set(0,0,Math.max(9.7,5.9/camera.aspect));
    camera.updateProjectionMatrix();
    camera.updateMatrixWorld();
    const size=renderer.getDrawingBufferSize(new THREE.Vector2());
    uniforms.uInvViewport.value.set(1/size.x,1/size.y);
    uniforms.uPixelHeight.value=size.y;
    interior.setSize(Math.max(1,Math.ceil(size.x*.72)),Math.max(1,Math.ceil(size.y*.72)));
    renderAt(simTime);
  }
  countdown.style.display='none';
  camera.layers.enable(1);
  window.addEventListener('resize',resize);
  resize();
  requestAnimationFrame(tick);
})();
</script>
</body>
