<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Balloon · Ballistics Study</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#dock button:focus-visible {
  outline: 2px solid rgba(205, 231, 255, 0.85);
  outline-offset: 3px;
}
#scrubber:focus-visible {
  outline: 2px solid rgba(205, 231, 255, 0.85);
  outline-offset: 5px;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// All event times are presentation seconds. The underlying ballistic event is
// time-expanded, like a 20,000 FPS capture. No integrator or random work runs in
// renderAt: every frame is a closed-form evaluation of the same seeded shot.
const DURATION = 8.000;
const SEED = 42;
const FLOOR = -2.46;
const VIEW_HEIGHT = 6.8;
const TAU = Math.PI * 2;
const srgb = hex => new THREE.Color(hex).convertSRGBToLinear();
function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(SEED);
const between = (a, b) => a + (b - a) * random();
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
function smooth(a, b, x) {
  const s = clamp((x - a) / (b - a), 0, 1);
  return s * s * (3 - 2 * s);
}

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(-VIEW_HEIGHT * aspect / 2, VIEW_HEIGHT * aspect / 2, VIEW_HEIGHT / 2, -VIEW_HEIGHT / 2, 0.1, 80);
camera.position.set(0, 0, 18);
camera.lookAt(0, 0, 0);
const timeUniform = { value: 0 };

// A studio light rig also supplies a generated HDR reflection environment.
// PMREM is rendered in memory; there are no image or environment downloads.
const studio = new THREE.Scene();
studio.background = srgb(0x10151e);
const room = new THREE.Mesh(new THREE.BoxGeometry(30, 30, 30), new THREE.MeshBasicMaterial({ color: srgb(0x141c28), side: THREE.BackSide }));
studio.add(room);
function softbox(x, y, z, w, h, rgb) {
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color().setRGB(...rgb), side: THREE.DoubleSide, toneMapped: false }));
  panel.position.set(x, y, z);
  panel.lookAt(0, 0, 0);
  studio.add(panel);
}
softbox(-4.0, 3.5, 6, 2.1, 6.0, [2.8, 3.0, 3.3]);
softbox(5, 1.3, 3, 0.65, 6.5, [1.3, 1.8, 2.2]);
softbox(0, 7, 1, 6, 1.5, [1.5, 1.65, 1.8]);
softbox(-4, -0.5, -4, 2.3, 5.0, [0.3, 1.2, 1.5]);
softbox(4, 0.5, -4, 1.3, 5.0, [0.7, 0.25, 0.5]);
softbox(0, -5, 4, 5, 0.7, [0.6, 0.8, 1.0]);
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileCubemapShader();
const environment = pmrem.fromScene(studio, 0.035, 0.1, 60);
scene.environment = environment.texture;
pmrem.dispose();
studio.traverse(o => {
  if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); }
});

scene.add(new THREE.HemisphereLight(0xc9ddf5, 0x251a2b, 0.55));
function light(color, intensity, x, y, z) {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.set(x, y, z);
  scene.add(l);
}
light(0xffefdd, 1.6, -3, 5, 5);
light(0xcce7ff, 0.3, 4, 0.5, 5);
light(0xa9f1ff, 1.8, -4, 2, -2);
light(0xf2f4ff, 2.1, 4, 3, -2);
light(0xc486a4, 0.45, 3, -2, -3);

// A continuous hydrostatic pear profile, including the narrow gathered neck.
const profile = [
  [0, -1.58], [0.36, -1.53], [0.70, -1.37], [0.98, -1.09],
  [1.15, -0.73], [1.205, -0.32], [1.12, 0.10], [0.94, 0.50],
  [0.69, 0.86], [0.43, 1.12], [0.23, 1.34], [0.105, 1.51], [0.063, 1.66]
];
const profileCurve = new THREE.SplineCurve(profile.map(p => new THREE.Vector2(p[0], p[1])));
const profilePoints = profileCurve.getPoints(112);
profilePoints.forEach(p => p.x = Math.max(0.0001, p.x));
const balloonGeometry = new THREE.LatheGeometry(profilePoints, 112);

const latex = new THREE.MeshPhysicalMaterial({
  color: srgb(0xe61c24), roughness: 0.205, metalness: 0.02,
  clearcoat: 0.65, clearcoatRoughness: 0.12,
  transmission: 0.055, thickness: 0.065, ior: 1.46,
  transparent: true, opacity: 0.985, envMapIntensity: 0.8,
  side: THREE.DoubleSide
});
latex.onBeforeCompile = shader => {
  shader.uniforms.uSimTime = timeUniform;
  shader.vertexShader = shader.vertexShader.replace('#include <common>', `
    #include <common>
    uniform float uSimTime;
    varying vec3 vLatexOriginal;
  `).replace('#include <begin_vertex>', `
    vec3 transformed = vec3(position);
    vLatexOriginal = position;
    float contact = smoothstep(1.0, 1.125, uSimTime) * (1.0 - smoothstep(1.15, 1.39, uSimTime));
    float dent = exp(-45.0 * (pow(position.y - 0.045, 2.0) + position.z * position.z));
    transformed.x -= 0.19 * contact * dent * smoothstep(0.6, 1.05, position.x);
    float delay = (1.0 - position.x / 1.21) * 0.025;
    float peel = smoothstep(1.145 + delay, 1.585, uSimTime);
    float pole = position.y > -0.10 ? 1.64 : -1.52;
    transformed.xz *= 1.0 - 0.973 * peel;
    transformed.y = mix(transformed.y, pole, peel * 0.98);
    float fold = sin(atan(position.z, position.x) * 16.0 + position.y * 11.0);
    transformed.z += fold * 0.065 * sin(peel * 3.14159265);
    transformed.x += sin(position.y * 23.0) * 0.055 * sin(peel * 3.14159265);
  `);
  shader.fragmentShader = shader.fragmentShader.replace('#include <common>', `
    #include <common>
    uniform float uSimTime;
    varying vec3 vLatexOriginal;
  `).replace('#include <clipping_planes_fragment>', `
    #include <clipping_planes_fragment>
    float tear = smoothstep(1.145, 1.575, uSimTime);
    // Separate the two retracting hemispheres so no equatorial triangles
    // stretch between their poles as the skin recoils.
    if (tear > 0.005 && abs(vLatexOriginal.y + 0.10) < 0.12) discard;
    vec3 entryDistance = vLatexOriginal - vec3(1.11, 0.045, 0.0);
    entryDistance.x *= 0.76;
    float ragged = 0.94 + 0.045 * sin(vLatexOriginal.y * 39.0 + vLatexOriginal.z * 31.0)
                         + 0.025 * sin(vLatexOriginal.z * 63.0);
    if (length(entryDistance) < tear * 3.4 * ragged) discard;
  `);
};
const membrane = new THREE.Mesh(balloonGeometry, latex);
membrane.renderOrder = 8;
scene.add(membrane);

const knotMaterial = new THREE.MeshPhysicalMaterial({ color: srgb(0xb70b19), metalness: 0, roughness: 0.3, clearcoat: 0.65, envMapIntensity: 0.8 });
const neck = new THREE.Mesh(new THREE.SphereGeometry(0.079, 24, 16), knotMaterial);
neck.position.set(0, 1.685, 0);
neck.scale.set(1, 0.7, 0.9);
scene.add(neck);
const neckRing = new THREE.Mesh(new THREE.TorusGeometry(0.053, 0.017, 10, 32), knotMaterial);
neckRing.position.set(0, 1.72, 0);
neckRing.rotation.x = Math.PI / 2;
scene.add(neckRing);
const nozzle = new THREE.Mesh(new THREE.ConeGeometry(0.074, 0.105, 24, 1, true), knotMaterial);
nozzle.position.set(0.012, 1.779, 0);
nozzle.rotation.z = -0.16;
scene.add(nozzle);
const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 4.5, 8), new THREE.MeshStandardMaterial({ color: srgb(0x7f858c), roughness: 0.85, metalness: 0.1 }));
cord.position.set(0, 3.97, -0.015);
scene.add(cord);

// Detached, recoiling strips of latex. Their curls, spin and gravity are
// evaluated from age; no positions or velocities accumulate between frames.
const scraps = [];
for (let i = 0; i < 18; i++) {
  const upper = i < 9;
  const vertices = [], indices = [];
  const width = between(0.035, 0.11);
  const length = between(0.25, 0.62);
  const phase = between(0, TAU);
  for (let j = 0; j <= 20; j++) {
    const s = j / 20;
    const curl = s * 5.5 + phase;
    const cx = Math.sin(curl) * 0.07 * s;
    const z = (1 - Math.cos(curl)) * 0.075 * s;
    const w = width * (1 - s * 0.84);
    vertices.push(cx - w / 2, -s * length, z, cx + w / 2, -s * length, z);
    if (j < 20) {
      const a = j * 2;
      indices.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, knotMaterial);
  mesh.renderOrder = 7;
  scene.add(mesh);
  scraps.push({ mesh, upper, phase, x: between(-0.14, 0.14), z: between(-0.12, 0.12),
    vx: between(-0.55, 0.55), vy: between(0.12, 0.65), spin: between(-3, 3),
    release: between(1.23, 1.43), attached: upper && i % 3 !== 0 });
}

const liquidFragment = `
  uniform float uSimTime;
  uniform float uMode;
  varying vec3 vWorldPosition;
  varying vec3 vSmoothNormal;
  varying vec3 vRest;
  varying vec2 vSurfaceUV;
  varying float vLife;

  float hash31(vec3 p) {
    p = fract(p * 0.1031 + vec3(0.042, 0.042, 0.042));
    p += dot(p, p.yzx + 33.33);
    return fract((p.x + p.y) * p.z);
  }
  float noise3(vec3 p) {
    vec3 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash31(i), hash31(i + vec3(1,0,0)), f.x),
                   mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
                   mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  void main() {
    if (vLife < 0.005) discard;
    float foam = 0.0;
    if (uMode < 0.5) {
      float holeRadius = length(vec2(vRest.y - 0.045, vRest.z));
      if (uSimTime > 2.4 && vRest.x > 0.88 && holeRadius < 0.13 * smoothstep(2.4, 2.65, uSimTime)) discard;
      if (uSimTime > 3.8 && vRest.x < -0.88 && holeRadius < 0.19 * smoothstep(3.8, 4.08, uSimTime)) discard;
      float field = noise3(vRest * 5.0) * 0.67 + noise3(vRest * 12.0) * 0.33;
      float breakup = smoothstep(4.95, 6.25, uSimTime);
      if (field < breakup) discard;
      foam = (1.0 - smoothstep(0.0, 0.055, field - breakup)) * smoothstep(4.9, 5.45, uSimTime);
    } else if (uMode < 1.5) {
      if (vWorldPosition.y < -2.46) discard;
      float breaks = smoothstep(0.5, 1.0, vSurfaceUV.x) * (1.0 - vLife);
      float lace = noise3(vRest * 19.0);
      if (lace < breaks * 0.72) discard;
      foam = pow(max(0.0, sin(vSurfaceUV.x * 72.0)), 18.0) * 0.12;
    }
    vec3 N = normalize(vSmoothNormal);
    vec3 V = normalize(cameraPosition - vWorldPosition);
    if (dot(N, V) < 0.0) N = -N;
    vec3 R = reflect(-V, N);
    float ndv = max(0.0, dot(N, V));
    float fresnel = 0.025 + 0.975 * pow(1.0 - ndv, 4.2);
    float front = smoothstep(-0.1, 0.25, R.z);
    float box1 = exp(-pow(abs((R.x + 0.43) / 0.145), 6.0)
                     -pow(abs((R.y - 0.38) / 0.56), 6.0)) * front;
    float box2 = exp(-pow(abs((R.x - 0.69) / 0.052), 4.0)
                     -pow(abs((R.y - 0.1) / 0.75), 6.0)) * front;
    float overhead = pow(max(0.0, dot(R, normalize(vec3(-0.2, 0.95, 0.1)))), 28.0);
    float edge = pow(1.0 - ndv, 2.2);
    vec3 color = vec3(0.025, 0.065, 0.082);
    color += vec3(0.18, 0.32, 0.37) * edge;
    color += vec3(0.65, 0.89, 1.0) * fresnel * 1.3;
    color += vec3(1.20, 1.36, 1.43) * box1 * (0.25 + 0.75 * fresnel);
    color += vec3(0.55, 0.89, 1.1) * box2 * 1.8;
    color += vec3(0.50, 0.77, 0.83) * overhead * 0.65;
    color += vec3(0.45, 0.68, 0.72) * foam;
    float alpha = 0.19 + fresnel * 0.66 + box1 * 0.50 + box2 * 0.38 + foam * 0.2;
    if (uMode > 0.5) { color *= 1.30; alpha += 0.15; }
    if (uMode > 1.5) {
      vec3 halfLight = normalize(V + normalize(vec3(-0.55, 0.8, 1.4)));
      float glint = pow(max(0.0, dot(N, halfLight)), 85.0);
      float fill = max(0.0, dot(N, normalize(vec3(-0.6, 0.8, 0.4))));
      color = vec3(0.055, 0.12, 0.15) + vec3(0.07, 0.13, 0.16) * fill;
      color += vec3(0.45, 0.69, 0.77) * fresnel;
      color += vec3(1.7, 1.95, 2.1) * (box1 * 0.45 + box2 * 0.65 + glint);
      alpha = min(0.96, 0.38 + edge * 0.48 + box1 * 0.5 + box2 * 0.5 + glint);
    }
    gl_FragColor = vec4(color, min(0.95, alpha) * vLife);
    #include <tonemapping_fragment>
    #include <encodings_fragment>
  }
`;
const waterMaterial = new THREE.ShaderMaterial({
  uniforms: { uSimTime: timeUniform, uMode: { value: 0 } },
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  extensions: { derivatives: true },
  vertexShader: `
    uniform float uSimTime;
    varying vec3 vWorldPosition;
    varying vec3 vSmoothNormal;
    varying vec3 vRest;
    varying vec2 vSurfaceUV;
    varying float vLife;
    vec3 fluidPosition(vec3 source, vec3 sourceNormal) {
      vec3 p = source;
      float agitation = smoothstep(1.35, 4.8, uSimTime);
      float theta = atan(source.z, source.x);
      float wave = sin(source.y * 13.0 + theta * 5.0 - uSimTime * 4.0)
                 + 0.45 * sin(source.y * 25.0 - theta * 9.0 + uSimTime * 5.0);
      p += sourceNormal * wave * (0.002 + agitation * 0.014);
      float contact = smoothstep(1.0, 1.18, uSimTime) * (1.0 - smoothstep(1.5, 1.9, uSimTime));
      p.x -= 0.085 * contact * exp(-35.0 * (pow(source.y - 0.045, 2.0) + source.z * source.z)) * smoothstep(0.7, 1.05, source.x);
      float late = max(0.0, uSimTime - 4.85);
      float release = smoothstep(4.7, 5.8, uSimTime);
      p.x *= 1.0 + 0.10 * late;
      p.x += sin(source.y * 8.0 + theta * 4.0) * 0.075 * release;
      p.y -= 0.60 * late * late;
      p.y += sin(theta * 9.0 + source.y * 7.0) * 0.11 * release;
      p.z *= 1.0 + 0.04 * late;
      return p;
    }
    void main() {
      vec3 p = fluidPosition(position, normal);
      vec3 tangent = vec3(normal.z, 0.0, -normal.x);
      if (length(tangent) < 0.01) tangent = vec3(1.0, 0.0, 0.0);
      tangent = normalize(tangent);
      vec3 bitangent = normalize(cross(normal, tangent));
      vec3 dx = fluidPosition(position + tangent * 0.002, normal) - p;

  puddle.visible = t > 5.95;
  updateDrops(t);
  for (const s of scraps) {
    const age = Math.max(0, t - s.release);
    s.mesh.visible = t > s.release && (s.attached || age < 2.8);
    const recoil = smooth(0, 0.25, age);
    if (s.attached) {
      const flutter = Math.sin(age * 9 + s.phase) * Math.exp(-age * 0.9);
      s.mesh.position.set(s.x * recoil, 1.63 - 0.025 * recoil, s.z);
      s.mesh.rotation.set(flutter * 0.3, s.phase + flutter * 0.2, s.x * 2 + flutter * 0.25);
      s.mesh.scale.setScalar(recoil * (0.70 + 0.3 * Math.exp(-age * 2)));
    } else {
      const y = (s.upper ? 1.55 : -1.45) + s.vy * age - 0.9 * age * age;
      s.mesh.position.set(s.x + s.vx * age, y, s.z);
      s.mesh.rotation.set(s.phase + age * s.spin, s.phase * 0.4, age * s.spin * 0.6);
      s.mesh.scale.setScalar(recoil * (1 - smooth(2.1, 2.8, age)));
    }
  }
  for (let i = 0; i < BUBBLE_COUNT; i++) {
    const b = bubbles[i];
    const growth = smooth(2.4, 2.8, t) * (1 - smooth(4.5, 5.15, t));
    const x = Math.max(-1.1, nose + 0.16) + (1.1 - Math.max(-1.1, nose + 0.16)) * b.s;
    const a = b.angle + t * 0.15;
    const r = 0.07 + Math.sin(b.s * 43 + t * 4) * 0.02;
    dropMatrix.makeScale(b.r * growth, b.r * growth, b.r * growth);
    dropMatrix.setPosition(x, 0.045 + Math.cos(a) * r, Math.sin(a) * r);
    bubbleMesh.setMatrixAt(i, dropMatrix);
  }
  bubbleMesh.instanceMatrix.needsUpdate = true;
  renderer.render(scene, camera);
}

// Exact five-state playback machine. RAF timestamps drive the wall-clock
// gates; only active physics playback uses the 0.1 s maximum frame delta.
const STATES = Object.freeze({ COUNTDOWN: 'COUNTDOWN', PLAYING: 'PLAYING', PAUSED: 'PAUSED', REFIRE_HOLD: 'REFIRE_HOLD', ENDED: 'ENDED' });
let state = STATES.COUNTDOWN;
let simTime = 0.000;
let playbackSpeed = 1.0;
let countdownElapsed = 0;
let holdElapsed = 0;
let countdownStart = null;
let holdStart = null;
let lastFrame = null;
const countdown = document.getElementById('countdown');
const scrubber = document.getElementById('scrubber');
const toggle = document.getElementById('btn-toggle');
const pauseIcon = document.getElementById('icon-pause');
const playIcon = document.getElementById('icon-play');
const speedPills = Array.from(document.querySelectorAll('.speed-pill'));
function hideCountdown() {
  countdown.style.display = 'none';
  countdown.textContent = '';
}
function updateToggle() {
  const paused = state === STATES.PAUSED || state === STATES.ENDED;
  pauseIcon.style.display = paused ? 'none' : 'block';
  playIcon.style.display = paused ? 'block' : 'none';
  toggle.setAttribute('aria-label', paused ? 'Play' : 'Pause');
}
function cancelGates() {
  countdownStart = null;
  holdStart = null;
  countdownElapsed = 0;
  holdElapsed = 0;
  hideCountdown();
}
function advance(dt) {
  simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
  if (simTime >= DURATION) {
    simTime = DURATION;
    state = STATES.ENDED;
    updateToggle();
  }
  scrubber.value = simTime.toFixed(3);
}
toggle.addEventListener('click', () => {
  if (state === STATES.PLAYING) {
    state = STATES.PAUSED;
  } else if (state === STATES.COUNTDOWN || state === STATES.REFIRE_HOLD) {
    cancelGates();
    simTime = 0;
    scrubber.value = '0';
    state = STATES.PAUSED;
    renderAt(0);
  } else {
    if (state === STATES.ENDED) {
      simTime = 0;
      scrubber.value = '0';
      renderAt(0);
    }
    cancelGates();
    state = STATES.PLAYING;
  }
  lastFrame = performance.now();
  updateToggle();
});
document.getElementById('btn-refire').addEventListener('click', () => {
  cancelGates();
  simTime = 0.000;
  scrubber.value = '0';
  state = STATES.REFIRE_HOLD;
  holdElapsed = 0;
  holdStart = performance.now();
  lastFrame = holdStart;
  updateToggle();
  renderAt(0);
});
speedPills.forEach(pill => pill.addEventListener('click', () => {
  playbackSpeed = parseFloat(pill.dataset.speed);
  speedPills.forEach(other => {
    const active = other === pill;
    other.classList.toggle('is-active', active);
    other.setAttribute('aria-checked', String(active));
  });
}));
scrubber.addEventListener('input', () => {
  cancelGates();
  simTime = clamp(parseFloat(scrubber.value), 0, DURATION);
  state = STATES.PAUSED;
  lastFrame = performance.now();
  updateToggle();
  renderAt(simTime);
});

window.addEventListener('resize', () => {
  const a = window.innerWidth / window.innerHeight;
  camera.left = -VIEW_HEIGHT * a / 2;
  camera.right = VIEW_HEIGHT * a / 2;
  camera.top = VIEW_HEIGHT / 2;
  camera.bottom = -VIEW_HEIGHT / 2;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  mistMaterial.uniforms.uPointScale.value = window.innerHeight * renderer.getPixelRatio() / VIEW_HEIGHT;
  renderAt(simTime);
});

function frame(now) {
  if (lastFrame === null) lastFrame = now;
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (state === STATES.COUNTDOWN) {
    if (countdownStart === null) countdownStart = now;
    countdownElapsed = Math.max(0, (now - countdownStart) / 1000);
    if (countdownElapsed < 3.000) {
      countdown.style.display = 'block';
      countdown.textContent = String(3 - Math.floor(countdownElapsed));
      simTime = 0;
      scrubber.value = '0';
    } else {
      hideCountdown();
      state = STATES.PLAYING;
      updateToggle();
      advance(Math.min(0.1, Math.max(0, (now - countdownStart - 3000) / 1000)));
    }
  } else if (state === STATES.REFIRE_HOLD) {
    hideCountdown();
    holdElapsed = Math.max(0, (now - holdStart) / 1000);
    if (holdElapsed >= 1.000) {
      state = STATES.PLAYING;
      updateToggle();
      advance(Math.min(0.1, Math.max(0, (now - holdStart - 1000) / 1000)));
    }
  } else if (state === STATES.PLAYING) {
    advance(dt);
  }
  renderAt(simTime);
  requestAnimationFrame(frame);
}

hideCountdown();
updateToggle();
renderAt(0); // Render the resting scene before the countdown's first RAF.
requestAnimationFrame(frame);
</script>
