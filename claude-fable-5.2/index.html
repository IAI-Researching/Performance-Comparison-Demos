      }
      function sampleBody() {                          // area-uniform point on the rest surface
        const u = sampleAreaU(rng()), phi = rnd(0, TAU), r = bodyRadius(u), n2 = bodyNormal2D(u);
        const c = Math.cos(phi), s = Math.sin(phi), dr = bodyRadiusDu(u), tl = Math.hypot(dr, BODY_H);
        return {
          q: [r * c, Y_BOT + u * BODY_H, r * s], n: [n2[0] * c, n2[1], n2[0] * s],
          eu: [dr / tl * c, BODY_H / tl, dr / tl * s], ephi: [-s, 0, c], u: u, phi: phi, r: r
        };
      }
      function polarPoint(pole, dist, th) {            // point near the entry (+1) / exit (-1) hole
        const al = Math.asin(Math.min(dist / X_EW, 0.99)), ca = Math.cos(al), sa = Math.sin(al);
        const ct = Math.cos(th), st = Math.sin(th);
        const s = surfaceDist(pole * ca, sa * ct, sa * st);
        return { q: [pole * ca * s, sa * ct * s, sa * st * s], er: [0, ct, st], tA: [-pole * sa, ca * ct, ca * st] };
      }
      const v3 = function (a, ka, b, kb, c, kc) {
        return [a[0] * ka + (b ? b[0] * kb : 0) + (c ? c[0] * kc : 0),
                a[1] * ka + (b ? b[1] * kb : 0) + (c ? c[1] * kc : 0),
                a[2] * ka + (b ? b[2] * kb : 0) + (c ? c[2] * kc : 0)];
      };
      const jit = function (k) { return [rnd(-k, k), rnd(-k, k), rnd(-k, k)]; };

      // ---- (A) latex shear: mist + specks flicked off the water by the retracting skin
      function shearDir(s) {                           // direction the tear front travels at this point
        const phiS = s.phi > Math.PI ? s.phi - TAU : s.phi;
        const gh = TEAR_KH * TEAR_KH * s.r * phiS, gv = arcAt(s.u) - ARC_IW, l = Math.hypot(gh, gv) || 1;
        return v3(s.ephi, gh / l, s.eu, gv / l);
      }
      for (let i = 0; i < 520; i++) {
        const s = sampleBody(), g = shearDir(s), speck = rng() < 0.7;
        const t0 = T_PUNCT + tearMetric(s.q[0], s.q[1], s.q[2]) / SKIN_SPEED + rnd(0, 0.03);
        add({
          q: s.q, dev: v3(v3(g, rnd(0.25, 0.85), s.n, speck ? rnd(0.10, 0.38) : rnd(0.35, 0.80)), 1, jit(0.08), 1),
          t0: t0, fade: 0.04, life: rnd(0.7, 1.6), drag: speck ? rnd(3.5, 6.0) : rnd(2.6, 3.6),
          size: speck ? rnd(0.030, 0.060) : rnd(0.06, 0.12), type: speck ? SPECK : MIST, grav: 0.15,
          alpha: speck ? rnd(0.5, 0.9) : rnd(0.025, 0.05), grow: rnd(0.8, 1.6)
        });
      }
      for (let i = 0; i < 140; i++) {
        const s = sampleBody(), g = shearDir(s);
        const t0 = T_PUNCT + tearMetric(s.q[0], s.q[1], s.q[2]) / SKIN_SPEED + rnd(0, 0.03);
        add({
          q: s.q, dev: v3(v3(g, rnd(0.4, 1.1), s.n, rnd(0.15, 0.45)), 1, jit(0.1), 1), t0: t0, fade: 0.03,
          drag: rnd(0.9, 1.8), size: rnd(0.006, 0.013), type: DROP
        });
      }

      // ---- ligament chains: beads leave one rest point with increasing speed, so the
      //      filament stretches, necks down and pinches off (Plateau-Rayleigh beading)
      function addChain(q, dir, t0, lip, devBase, sizeBase, dv, taper) {
        const nb = 3 + Math.floor(rng() * 4), drag = rnd(0.45, 0.85);
        const grav = clamp(0.80 + sizeBase * 7.0 + rnd(-0.06, 0.06), 0.8, 1.2);   // heavier filaments fall faster
        for (let j = 0; j < nb; j++) {
          const sz = sizeBase * (1 - taper * j / nb) * (j % 2 ? rnd(0.5, 0.7) : rnd(0.9, 1.1));
          add({
            q: q, dev: v3(devBase, 1, dir, dv * j, jit(0.012), 1), t0: t0, fade: 0.09, drag: drag,
            size: sz, type: DROP, lip: lip, chain: v3(dir, dv), grav: grav
          });
        }
      }

      // ---- (B) entry hole: backward crown, rim spray, vented cavitation mist
      let mark = n;
      while (n - mark < 360) {
        const s = polarPoint(1, LIPE_W * Math.sqrt(-Math.log(rnd(0.30, 0.97))), rnd(0, TAU));
        const dir = v3([1, 0, 0], 0.8, s.er, 0.6);       // along the flaring crown sheet
        addChain(s.q, dir, Math.max(T_CAV + 0.15, breakTimeJS(s.q[0], s.q[1], s.q[2]) - rnd(0.1, 0.4)), 1,
          v3(dir, rnd(0.10, 0.40), jit(0.04), 1), rnd(0.016, 0.030), rnd(0.05, 0.13), 0.5);
      }
      for (let i = 0; i < 380; i++) {
        const s = polarPoint(1, rnd(0.01, 0.10), rnd(0, TAU)), speck = i >= 300;
        const sp = FLUID_SPEED * rnd(0.55, 1.45), cone = rnd(0.12, 0.62);
        add({
          q: s.q, dev: v3([1, 0, 0], sp, s.er, sp * cone, jit(0.05), 1), t0: T_CAV + 1.6 * Math.pow(rng(), 1.6),
          fade: 0.05, drag: rnd(0.5, 1.0), size: speck ? rnd(0.04, 0.09) : rnd(0.008, 0.020),
          type: speck ? SPECK : DROP, lip: rnd(0.5, 1.0), alpha: speck ? rnd(0.5, 0.8) : 1,
          grow: speck ? rnd(0.5, 1.0) : 0, life: speck ? rnd(1.6, 2.6) : 1000, grav: speck ? 0.4 : 1
        });
      }
      for (let i = 0; i < 150; i++) {
        const t0 = T_CAV + 0.05 + 1.9 * rng(), rr = (0.10 + 0.30 * clamp((t0 - T_CAV) / 1.4, 0, 1)) * Math.sqrt(rng());
        const th = rnd(0, TAU), er = [0, Math.cos(th), Math.sin(th)];
        add({
          q: [X_E + rnd(0.0, 0.14), er[1] * rr, er[2] * rr], free: true, t0: t0, fade: 0.15,
          dev: v3([1, 0, 0], rnd(0.35, 1.6), er, rnd(0.1, 0.65)), drag: rnd(1.1, 2.2), size: rnd(0.06, 0.13),
          type: MIST, grow: rnd(0.5, 0.9), alpha: rnd(0.028, 0.055), life: rnd(1.4, 2.4), grav: 0.25
        });
      }

      // ---- (C) exit hole: forward conical plume of mist and micro-droplets
      const V_PLUME = 0.85 * V_EXIT;                   // never outruns the bullet
      mark = n;
      while (n - mark < 400) {
        const s = polarPoint(-1, LIPX_W * Math.sqrt(-Math.log(rnd(0.30, 0.97))), rnd(0, TAU));
        const dir = v3([-1, 0, 0], 0.92, s.er, 0.39);    // along the forward cone sheet
        addChain(s.q, dir, Math.max(T_EXIT + 0.12, breakTimeJS(s.q[0], s.q[1], s.q[2]) - rnd(0.1, 0.4)), 1,
          v3(dir, rnd(0.15, 0.55), jit(0.04), 1), rnd(0.014, 0.028), rnd(0.06, 0.15), 0.5);
      }
      for (let i = 0; i < 850; i++) {
        const s = polarPoint(-1, rnd(0.01, 0.12), rnd(0, TAU)), speck = i >= 560;
        const sp = V_PLUME * rnd(0.40, 1.0), cone = Math.abs(rnd(-0.44, 0.44) + rnd(-0.1, 0.1));
        add({
          q: s.q, dev: v3([-1, 0, 0], sp, s.er, sp * cone, jit(0.05), 1), t0: T_EXIT + 0.9 * rng() * rng(),
          fade: 0.05, drag: rnd(0.4, 1.1), size: speck ? rnd(0.04, 0.10) : rnd(0.006, 0.018),
          type: speck ? SPECK : DROP, lip: rnd(0.0, 0.6), alpha: speck ? rnd(0.5, 0.85) : 1,
          grow: speck ? rnd(0.6, 1.1) : 0, life: speck ? rnd(1.8, 3.0) : 1000, grav: speck ? 0.4 : 1
        });
      }
      for (let i = 0; i < 210; i++) {
        const t0 = T_EXIT + 0.02 + Math.pow(rng(), 1.5), th = rnd(0, TAU), rr = rnd(0.0, 0.12);
        const er = [0, Math.cos(th), Math.sin(th)];
        add({
          q: [X_OUT - rnd(0.02, 0.17), er[1] * rr, er[2] * rr], free: true, t0: t0, fade: 0.12,
          dev: v3([-1, 0, 0], V_PLUME * rnd(0.30, 0.95), er, rnd(0.05, 0.60)), drag: rnd(0.8, 1.8),
          size: rnd(0.07, 0.15), type: MIST, grow: rnd(0.5, 0.9), alpha: rnd(0.028, 0.055), life: rnd(1.8, 3.0), grav: 0.3
        });
      }

      // ---- (E) late drips from the shrivelled latex on the tether
      for (let i = 0; i < 10; i++) {
        add({
          q: [rnd(-0.04, 0.04), Y_NECK_TOP - RAG_LEN + rnd(-0.02, 0.06), rnd(-0.02, 0.02)], free: true,
          t0: 4.4 + 3.5 * Math.pow((i + rng()) / 10, 0.8), fade: 0.15, dev: [rnd(-0.03, 0.03), -0.05, 0], drag: 0.3,
          size: rnd(0.014, 0.024), type: DROP
        });
      }

      // ---- (D) main mass: sheets rupture into ligament chains, droplets and a few heavy globs
      mark = n;
      const dBudget = N - n;
      // Rayleigh-Taylor spikes: jets that grow out of the expanding mass before it ruptures
      while (n - mark < dBudget * 0.30) {
        const s = sampleBody();
        const dir = v3(s.n, 1, jit(0.55), 1);
        const tb = breakTimeJS(s.q[0], s.q[1], s.q[2]);
        addChain(s.q, dir, Math.max(T_BURST + 0.15, tb - rnd(0.25, 0.95)), 1,
          v3(s.n, rnd(0.02, 0.12), jit(0.03), 1), rnd(0.024, 0.050), rnd(0.03, 0.085), 0.55);
      }
      // rims of the opening holes: tangential ligaments
      while (n - mark < dBudget * 0.54) {
        const s = sampleBody(), ang = rnd(0, TAU), depth = 0.2 * rng() * rng();
        const dir = v3(s.eu, Math.cos(ang), s.ephi, Math.sin(ang));
        addChain(v3(s.q, 1 - depth), dir, breakTimeJS(s.q[0], s.q[1], s.q[2]) + rnd(-0.05, 0.12), 1,
          v3(s.n, rnd(0.0, 0.2), jit(0.06), 1), rnd(0.018, 0.034), rnd(0.03, 0.09), 0.2);
      }
      for (let i = 0; i < 120 && n < N; i++) {
        const s = sampleBody(), depth = 0.3 * rng();
        add({
          q: v3(s.q, 1 - depth), dev: v3(s.n, rnd(0.0, 0.15), jit(0.05), 1),
          t0: breakTimeJS(s.q[0], s.q[1], s.q[2]) + 0.25 * depth + rnd(0, 0.15), fade: 0.10, drag: rnd(0.3, 0.6),
          size: rnd(0.050, 0.095), type: DROP, lip: 1, grav: rnd(1.08, 1.22)
        });
      }
      while (n < N) {
        const s = sampleBody(), depth = 0.3 * rng() * rng(), size = 0.012 + 0.045 * Math.pow(rng(), 2.2);
        add({
          q: v3(s.q, 1 - depth), dev: v3(s.n, rnd(0.0, 0.35), jit(0.10), 1),
          t0: breakTimeJS(s.q[0], s.q[1], s.q[2]) + 0.25 * depth + rnd(0, 0.15), fade: 0.07, drag: rnd(0.4, 0.9),
          size: size, type: DROP, lip: 1, grav: clamp(0.78 + size * 7.0 + rnd(-0.06, 0.06), 0.75, 1.2)
        });
      }

      // Instances are stored in birth order, so renderAt() can simply draw the first k of them
      // (everything not yet born at simTime is skipped without touching the GPU).
      list.sort(function (a, b) { return a.t0 - b.t0 || a.order - b.order; });
      const birth = new Float32Array(N);
      for (let i = 0; i < N; i++) {
        const o = list[i];
        Q.set(o.q, i * 3);
        if (o.dev) DEV.set(o.dev, i * 3);
        TIME.set([o.t0, o.fade || 0.06, o.life || 1000, o.drag || 0.6], i * 4);
        MISC.set([o.size, o.type + (o.free ? 4 : 0), o.grav === undefined ? 1 : o.grav, o.seed], i * 4);
        AUX.set([o.lip || 0, o.alpha === undefined ? 1 : o.alpha, o.grow || 0, burstSJS(o.q[0], o.q[1], o.q[2])], i * 4);
        if (o.chain) CHAIN.set(o.chain, i * 3);
        birth[i] = o.t0;
      }

      const quad = new THREE.PlaneGeometry(1, 1);
      quad.setAttribute('aQ', new THREE.InstancedBufferAttribute(Q, 3));
      quad.setAttribute('aDev', new THREE.InstancedBufferAttribute(DEV, 3));
      quad.setAttribute('aTime', new THREE.InstancedBufferAttribute(TIME, 4));
      quad.setAttribute('aMisc', new THREE.InstancedBufferAttribute(MISC, 4));
      quad.setAttribute('aAux', new THREE.InstancedBufferAttribute(AUX, 4));
      quad.setAttribute('aChain', new THREE.InstancedBufferAttribute(CHAIN, 3));
      const R0 = LIGHT_RIG[0].rad, R2 = LIGHT_RIG[2].rad, R3 = LIGHT_RIG[3].rad;
      const mat = new THREE.ShaderMaterial({
        uniforms: withShared({
          uAtlas: { value: atlasTex },
          uRadKey: { value: new THREE.Vector3(R0[0], R0[1], R0[2]).multiplyScalar(DROP_GAIN) },
          uRadA: { value: new THREE.Vector3(R2[0], R2[1], R2[2]).multiplyScalar(DROP_GAIN) },
          uRadB: { value: new THREE.Vector3(R3[0], R3[1], R3[2]).multiplyScalar(DROP_GAIN) }
        }),
        vertexShader: VS_COMMON + PARTICLE_VS, fragmentShader: FS_COMMON + PARTICLE_FS,
        transparent: true, depthWrite: false
      });
      const mesh = new THREE.InstancedMesh(quad, mat, N);
      mesh.frustumCulled = false;
      mesh.renderOrder = 7;
      mesh.userData.birth = birth;
      return mesh;
    })();
    scene.add(particles);

    /* ---------------- camera / resize ---------------- */
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(w, h, false);
      camera.aspect = Math.max(w, 1) / Math.max(h, 1);
      const dist = Math.max(VIEW_HALF_H / TAN_HALF, VIEW_MIN_HALF_W / (TAN_HALF * camera.aspect));
      camera.position.set(0, 0, dist);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
      U.uPxK.value = (h * renderer.getPixelRatio() * 0.5) / TAN_HALF;
    }

    /* ---------------- renderAt(simTime): the whole show as a pure function ---------------- */
    const SPIN = 2.1;                                   // rad of rifling spin per unit travelled
    function packTime(T, A, t) {
      T.set(t, tipX(t), fallDist(t), dimpleAmt(t));
      const kb = 1 - Math.exp(-Math.max(t - T_BURST, 0) / TAU_BURST);
      A.set(LIP_E * (1 - Math.exp(-Math.max(t - T_CAV, 0) / TAU_LE)),        // entry crown length
            LIP_X * (1 - Math.exp(-Math.max(t - T_EXIT, 0) / TAU_LX)),       // exit cone length
            E_MAX * kb * kb,                                                 // burst expansion
            BULGE * smoothstep(T_EXIT - 0.60, T_EXIT - 0.02, t));            // water pushed ahead of the tip
    }
    const prevT = new THREE.Vector4(), prevA = new THREE.Vector4();
    function renderAt(simTime) {
      const t = clamp(simTime, 0, DURATION);
      packTime(prevT, prevA, t - DT_VEL);
      packTime(U.uT0.value, U.uA0.value, t);
      const A = U.uA0.value;                              // analytic rates of the crown / burst / fall terms
      U.uAd.value.set((A.x - prevA.x) / DT_VEL, (A.y - prevA.y) / DT_VEL, (A.z - prevA.z) / DT_VEL,
                      (U.uT0.value.z - prevT.z) / DT_VEL);
      U.uFront.value = SKIN_SPEED * Math.max(t - T_PUNCT, 0);
      U.uTubeFade.value = 1 - smoothstep(4.5, 5.6, t);
      const tw = Math.max(t - T_PUNCT, 0), tc = Math.max(t - T_CAV, 0);
      U.uRipple.value.set(0.010 * smoothstep(0, 0.2, tw) * Math.exp(-tw / 1.4), tw,
                          0.016 * smoothstep(0, 0.4, tc) * Math.exp(-tc / 1.6), tc);
      // the water only needs drawing once the latex starts to give way (it is hidden before)
      U.uBodyFade.value = smoothstep(T_CONTACT, T_PUNCT, t);
      bodyFront.visible = bodyBack.visible = t > T_CONTACT && t < T_BODY_GONE;
      // particles are stored in birth order: draw only those already born at this instant
      const birth = particles.userData.birth;
      let born = 0, hi = PARTICLE_COUNT;
      while (born < hi) { const m = (born + hi) >> 1; if (birth[m] <= t) born = m + 1; else hi = m; }
      particles.count = born;
      particles.visible = born > 0;

      const tx = tipX(t);
      bullet.position.set(tx, 0, 0);
      bullet.rotation.x = SPIN * (X_START - tx);
      const speed = (tipX(t - 0.005) - tipX(t + 0.005)) / 0.01;
      streak.position.set(tx, 0, 0);
      streak.visible = speed > 2.6;
      streakU.uStreak.value.set(Math.min(speed * 0.05, 0.9), 0.40 * smoothstep(2.6, 10.0, speed));

      skinFront.visible = t < T_SKIN_END + 0.05;
      skinBack.visible = skinFront.visible && t > T_CONTACT;     // inner far wall only shows through the tear
      tube.visible = t > T_PUNCT && U.uTubeFade.value > 0.001;

      // tether recoil once the membrane lets go; shrivelled latex snaps up to the knot
      const tr = t - T_RELEASE;
      let bounce = 0, sway = 0, swing = 0, ragScale = 0;
      if (tr > 0) {
        bounce = 0.060 * (1 - Math.exp(-tr / 0.05)) + 0.030 * Math.exp(-tr / 0.7) * Math.sin(11.0 * tr);
        sway = 0.0055 * Math.exp(-tr / 3.0) * Math.sin(2.6 * tr);
        swing = 0.55 * Math.exp(-tr / 1.1) * Math.sin(6.0 * tr + 1.2) + 0.05 * Math.exp(-tr / 6.0) * Math.sin(1.9 * tr);
        const k = clamp(tr / 0.13, 0, 1), c1 = 1.70158, c3 = c1 + 1;
        ragScale = 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);      // ease-out-back snap
      }
      rig.position.y = Y_ANCHOR + bounce;
      rig.rotation.z = sway;
      ragPivot.visible = ragScale > 0.001;
      ragPivot.scale.set(0.55 + 0.45 * ragScale, Math.max(ragScale, 0.001), 0.55 + 0.45 * ragScale);
      ragPivot.rotation.z = swing;

      // base scrap: flung downward by its own retraction momentum, tumbling
      const ts = t - T_SCRAP;
      scrap.visible = ts > 0;
      if (ts > 0) {
        const travel = 0.62 * SKIN_SPEED * (1 - Math.exp(-1.3 * ts)) / 1.3 + 0.8 * ts;
        scrap.position.set(0.10 * travel, Y_SKIN_BOT - 0.02 - travel - fallDist(t), 0.06 * travel);
        scrap.rotation.set(5.2 * ts, 3.1 * ts, 1.2 + 7.3 * ts);
        scrap.scale.setScalar(smoothstep(0, 0.06, ts));
        if (scrap.position.y < -7) scrap.visible = false;
      }

      renderer.render(scene, camera);
    }

    resize();
    window.addEventListener('resize', function () { resize(); renderAt(currentSimTime()); });
    renderer.compile(scene, camera);
    return renderAt;
  }

  /* ==========================================================================
   * 8. PLAYBACK STATE MACHINE & DOCK
   * ======================================================================== */
  const dom = {
    countdown: document.getElementById('countdown'),
    refire: document.getElementById('btn-refire'),
    toggle: document.getElementById('btn-toggle'),
    iconPause: document.getElementById('icon-pause'),
    iconPlay: document.getElementById('icon-play'),
    scrubber: document.getElementById('scrubber'),
    pills: Array.prototype.slice.call(document.querySelectorAll('.speed-pill'))
  };

  const COUNTDOWN = 'COUNTDOWN', PLAYING = 'PLAYING', PAUSED = 'PAUSED', REFIRE_HOLD = 'REFIRE_HOLD', ENDED = 'ENDED';
  let state = null;                 // null until the first animation frame after the resting render
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0;         // wall-clock seconds, unaffected by playbackSpeed
  let holdElapsed = 0;              // wall-clock seconds, unaffected by playbackSpeed
  let phaseStart = null;            // frame timestamp (ms) at which COUNTDOWN / REFIRE_HOLD began
  let lastStamp = null;
  let shownDigit = null;
  function currentSimTime() { return simTime; }

  // renderAt(simTime) draws the complete scene for one instant. If WebGL / Three.js is
  // unavailable the dock and the state machine keep working on their own.
  let renderAt = function () {};
  try {
    renderAt = buildSimulation();
  } catch (err) {
    if (window.console && console.error) console.error('WebGL scene could not be created:', err);
  }
  function draw() {
    try {
      renderAt(simTime);
    } catch (err) {
      renderAt = function () {};
      if (window.console && console.error) console.error('Rendering stopped:', err);
    }
  }

  function setToggleIcon(showPause) {
    dom.iconPause.style.display = showPause ? '' : 'none';
    dom.iconPlay.style.display = showPause ? 'none' : '';
    dom.toggle.setAttribute('aria-label', showPause ? 'Pause' : 'Play');
  }
  function showCountdown(digit) {
    if (shownDigit === digit) return;
    shownDigit = digit;
    dom.countdown.textContent = String(digit);
    dom.countdown.style.display = 'block';
  }
  function hideCountdown() {
    shownDigit = null;
    dom.countdown.style.display = 'none';
    dom.countdown.textContent = '';
  }
  function resetToStart() {
    simTime = 0.000;
    dom.scrubber.value = '0';
  }
  function advance(dt) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    dom.scrubber.value = simTime.toFixed(3);
    if (simTime >= DURATION) {
      simTime = DURATION;
      dom.scrubber.value = DURATION.toFixed(3);
      state = ENDED;
      setToggleIcon(false);
    }
  }

  function frame(stamp) {
    requestAnimationFrame(frame);
    if (lastStamp === null) lastStamp = stamp;
    const dt = Math.min(Math.max((stamp - lastStamp) / 1000, 0), MAX_FRAME_DT);
    lastStamp = stamp;

    if (state === null) {                                   // first frame after the resting scene rendered
      state = COUNTDOWN;
      phaseStart = stamp;
      countdownElapsed = 0;
      setToggleIcon(true);
    }
    if (state === COUNTDOWN) {
      countdownElapsed = Math.max(0, (stamp - phaseStart) / 1000);
      if (countdownElapsed >= COUNTDOWN_SECONDS) {
        hideCountdown();
        state = PLAYING;
        advance(Math.min(countdownElapsed - COUNTDOWN_SECONDS, MAX_FRAME_DT));
      } else {
        showCountdown(3 - Math.floor(countdownElapsed));    // "3", "2", "1"
      }
    } else if (state === REFIRE_HOLD) {
      if (phaseStart === null) phaseStart = stamp;          // hold clock starts on the first frame after the click
      holdElapsed = Math.max(0, (stamp - phaseStart) / 1000);
      if (holdElapsed >= REFIRE_HOLD_SECONDS) {
        state = PLAYING;
        advance(Math.min(holdElapsed - REFIRE_HOLD_SECONDS, MAX_FRAME_DT));
      }
    } else if (state === PLAYING) {
      advance(dt);
    }
    draw();
  }

  dom.toggle.addEventListener('click', function () {
    if (state === PLAYING) {
      state = PAUSED;
      setToggleIcon(false);
    } else if (state === COUNTDOWN || state === REFIRE_HOLD || state === null) {
      hideCountdown();
      resetToStart();
      state = PAUSED;
      setToggleIcon(false);
      draw();
    } else if (state === PAUSED) {
      state = PLAYING;
      setToggleIcon(true);
    } else if (state === ENDED) {
      hideCountdown();
      resetToStart();
      state = PLAYING;
      setToggleIcon(true);
      draw();
    }
  });

  dom.refire.addEventListener('click', function () {
    hideCountdown();
    resetToStart();
    draw();                                      // exact resting state, immediately
    setToggleIcon(true);
    state = REFIRE_HOLD;
    holdElapsed = 0;
    phaseStart = null;
  });

  dom.pills.forEach(function (pill) {
    pill.addEventListener('click', function () {
      playbackSpeed = parseFloat(pill.getAttribute('data-speed'));
      dom.pills.forEach(function (other) {
        const on = other === pill;
        other.classList.toggle('is-active', on);
        other.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
  });

  dom.scrubber.addEventListener('input', function () {
    hideCountdown();
    const v = parseFloat(dom.scrubber.value);
    simTime = clamp(isFinite(v) ? v : 0, 0, DURATION);
    state = PAUSED;
    setToggleIcon(false);
    draw();
  });

  draw();                 // initial resting scene (simTime = 0.000)
  requestAnimationFrame(frame);      // COUNTDOWN starts on the first frame after it
})();
</script>
</body>
</html>
