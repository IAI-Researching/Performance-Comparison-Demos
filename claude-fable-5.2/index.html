<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ballistics Water Balloon — 15,000 FPS Slow-Motion</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8.000" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* ==========================================================================
   * 1. TIMELINE
   *    Everything on screen is a pure function of `simTime` (seconds, 0..8).
   *    There is no integrator and no hidden state: renderAt(simTime) evaluates
   *    closed-form kinematics on the CPU (bullet, tether, latex scraps) and on
   *    the GPU (membrane, water body, vapor tunnel, 6,000 droplets). Scrubbing
   *    backwards, re-firing, or running on 60 Hz / 120 Hz displays therefore
   *    produces bit-identical frames for a given simTime.
   * ======================================================================== */
  const DURATION = 8.000;
  const SEED = 42;
  const COUNTDOWN_SECONDS = 3.000;
  const REFIRE_HOLD_SECONDS = 1.000;
  const MAX_FRAME_DT = 0.1;

  const T_CONTACT  = 1.000;   // bullet tip touches the latex
  const T_PUNCT    = 1.150;   // elastic limit reached: puncture, tear starts
  const T_SKIN_END = 1.600;   // latex fully retracted (tether + base)
  const T_CAV      = 2.400;   // cavitation tunnel onset (end of inertial stasis)
  const T_EXIT     = 3.800;   // tip emerges from the left boundary
  const T_BREAK    = 5.000;   // sheet / ligament disintegration onset

  /* ==========================================================================
   * 2. DETERMINISTIC PRNG (Mulberry32, fixed seed 42) — the only entropy source.
   *    Every random number (geometry, sprites, particle states, perturbations)
   *    is drawn once, in a fixed order, while the scene is built from seed 42;
   *    nothing is re-rolled at runtime, so simTime = 0 always restarts identically.
   * ======================================================================== */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const TAU = Math.PI * 2;

  /* ==========================================================================
   * 3. REST GEOMETRY OF THE BALLOON (teardrop with hydrostatic sag)
   *    r(u) = K * u^0.5 * (1-u)^0.9 ,  u = normalised height.
   *    The widest station sits at u = 0.357 (heavy, wide bottom); the top
   *    tapers into the neck. The bullet axis is the world X axis (y = z = 0).
   * ======================================================================== */
  const BODY_R = 1.15, BODY_H = 2.75, Y_BOT = -1.18;
  const PROF_A = 0.5, PROF_B = 0.9;
  const U_WIDE = PROF_A / (PROF_A + PROF_B);
  const PROF_K = BODY_R / (Math.pow(U_WIDE, PROF_A) * Math.pow(1 - U_WIDE, PROF_B));
  const SKIN_GAP = 0.014, R_NECK = 0.068, NECK_LEN = 0.13;

  function bodyRadius(u) {
    u = clamp(u, 0, 1);
    return PROF_K * Math.pow(u, PROF_A) * Math.pow(1 - u, PROF_B);
  }
  function bodyRadiusDu(u) {
    u = clamp(u, 1e-5, 1 - 1e-5);
    return bodyRadius(u) * (PROF_A / u - PROF_B / (1 - u));
  }
  function bodyNormal2D(u) {            // outward normal in the (r, y) meridian plane
    const dr = bodyRadiusDu(u), l = Math.hypot(BODY_H, dr);
    return [BODY_H / l, -dr / l];
  }
  function bodyNormalAt(x, y, z) {
    const u = (y - Y_BOT) / BODY_H, n = bodyNormal2D(u), h = Math.hypot(x, z) || 1;
    return [n[0] * x / h, n[1], n[0] * z / h];
  }
  function insideBody(x, y, z) {
    const u = (y - Y_BOT) / BODY_H;
    if (u <= 0 || u >= 1) return false;
    return Math.hypot(x, z) < bodyRadius(u);
  }
  function surfaceDist(dx, dy, dz) {    // the teardrop is star-shaped about the origin
    let lo = 0, hi = 3.4;
    for (let i = 0; i < 46; i++) {
      const m = 0.5 * (lo + hi);
      if (insideBody(dx * m, dy * m, dz * m)) lo = m; else hi = m;
    }
    return 0.5 * (lo + hi);
  }

  // Meridian arc-length + surface-area tables (cosine-spaced in u)
  const TAB_N = 640;
  const tabU = new Float64Array(TAB_N + 1), tabArc = new Float64Array(TAB_N + 1), tabArea = new Float64Array(TAB_N + 1);
  for (let i = 0; i <= TAB_N; i++) {
    tabU[i] = 0.5 - 0.5 * Math.cos(Math.PI * i / TAB_N);
    if (i > 0) {
      const r0 = bodyRadius(tabU[i - 1]), r1 = bodyRadius(tabU[i]);
      const ds = Math.hypot(r1 - r0, (tabU[i] - tabU[i - 1]) * BODY_H);
      tabArc[i] = tabArc[i - 1] + ds;
      tabArea[i] = tabArea[i - 1] + ds * 0.5 * (r0 + r1);
    }
  }
  function arcAt(u) {
    const f = Math.acos(clamp(1 - 2 * u, -1, 1)) / Math.PI * TAB_N;
    const i = Math.min(TAB_N - 1, Math.floor(f));
    return lerp(tabArc[i], tabArc[i + 1], f - i);
  }
  function sampleAreaU(r) {             // area-uniform height sample
    const target = r * tabArea[TAB_N];
    let lo = 0, hi = TAB_N;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tabArea[m] <= target) lo = m; else hi = m; }
    const span = tabArea[hi] - tabArea[lo] || 1;
    return lerp(tabU[lo], tabU[hi], (target - tabArea[lo]) / span);
  }

  const U_IMPACT = -Y_BOT / BODY_H;                 // bullet axis height on the profile
  const X_EW = bodyRadius(U_IMPACT);                // water boundary on the axis
  const X_E = X_EW + SKIN_GAP * bodyNormal2D(U_IMPACT)[0];   // latex boundary on the axis
  const ARC_IW = arcAt(U_IMPACT);

  /* ==========================================================================
   * 4. KINEMATICS (closed form)
   * ======================================================================== */
  // --- bullet -----------------------------------------------------------
  const R_BUL = 0.095, NOSE_L = 0.40, BT_S = 0.66, BULLET_L = 0.76, CAN_S = 0.50;
  const X_START = 16.0;            // tip position at simTime 0 (off-screen right, even on 32:9 displays)
  const APPROACH_A8 = 6.0;         // far-field term: only matters while the bullet is still out of frame
  const V_CONTACT = 1.70;          // tip speed at first touch (speed-ramped approach)
  const V_SLOW = 0.30;             // crawl during burst + inertial stasis
  const TAU_V = 0.12;
  const BULGE = 0.13, BULGE_W = 0.30;      // water pushed ahead of the tip before exit
  const T_BW = T_EXIT - T_CAV;
  const X_OUT = -X_E - BULGE;              // where the tip breaks through on the left

  function noseR(s) {                       // nose radius fraction, s = 0 (tip) .. 1 (shoulder)
    s = clamp(s, 0, 1);
    return 0.4 * s + 0.6 * Math.pow(Math.sin(1.5707963 * s), 0.85);
  }
  function penA(t) {                        // penetration depth during 1.0 .. 2.4 s
    const s = t - T_CONTACT;
    return V_SLOW * s + (V_CONTACT - V_SLOW) * TAU_V * (1 - Math.exp(-s / TAU_V));
  }
  const D_A = penA(T_CAV);
  const V_A = V_SLOW + (V_CONTACT - V_SLOW) * Math.exp(-(T_CAV - T_CONTACT) / TAU_V);
  const D_W = X_E - X_OUT;                  // total in-water path of the tip
  const B_Q = V_A * T_BW;
  const C_Q = D_W - D_A - B_Q;              // constant acceleration through the tunnel
  const V_EXIT = (B_Q + 2 * C_Q) / T_BW;    // tip speed when it emerges (u/s)

  function tipX(t) {
    if (t < T_CONTACT) {                    // speed-ramped approach: blisteringly fast, easing to V_CONTACT
      const s = T_CONTACT - t, s2 = s * s, s8 = s2 * s2 * s2 * s2;
      return X_E + V_CONTACT * s + (X_START - X_E - V_CONTACT - APPROACH_A8) * s2 * s + APPROACH_A8 * s8;
    }
    if (t < T_CAV) return X_E - penA(t);
    const s = (t - T_CAV) / T_BW;
    return X_E - (D_A + B_Q * s + C_Q * s * s);
  }
  const DIMPLE_MAX = penA(T_PUNCT);
  function dimpleAmt(t) {                   // elastic indentation of latex + water surface
    if (t <= T_CONTACT) return 0;
    if (t <= T_PUNCT) return penA(t);
    return DIMPLE_MAX * Math.exp(-(t - T_PUNCT) / 0.04);
  }

  // --- gravity: one global, smoothly ramped free-fall frame ---------------
  const T_GRAV = 3.90, TAU_GRAV = 1.20, G_ACC = 0.85;
  function fallDist(t) {
    const u = Math.max(t - T_GRAV, 0);
    return G_ACC * (0.5 * u * u - TAU_GRAV * u + TAU_GRAV * TAU_GRAV * (1 - Math.exp(-u / TAU_GRAV)));
  }

  // --- characteristic speeds ----------------------------------------------
  const FLUID_SPEED = 1.30;                 // characteristic splash / bulk fluid speed (u/s)
  const TEAR_KH = 0.42;                     // tear runs ~2.4x faster around the equator
  let SKIN_SPEED = 4.0 * FLUID_SPEED;       // latex retraction front (refined below, kept 3-5x)
  let ARC_I = ARC_IW;                       // arc length of the impact point on the skin

  // --- fluid deformation field parameters --------------------------------
  const DIMPLE_W = 0.17, DIMPLE_D = 0.62;   // indentation half-widths: in the picture plane / along the view axis
  const K_CAV = 0.115, GROW2 = 0.10;        // vapor tunnel growth  Rc^2 = hug^2 + 2K tau (1 + g tau)
  const LIP_E = 0.85, TAU_LE = 0.90, LIPE_W = 0.24;    // entry (backward) crown
  const LIP_X = 1.25, TAU_LX = 0.75, LIPX_W = 0.24;    // exit (forward) cone sheet
  const T_BURST = 4.00, TAU_BURST = 1.50, E_MAX = 1.10, R_REF = 1.15, BURST_AX = 0.60, DRIFT = 0.28;
  const T_BRK0 = T_BREAK + 0.15, T_BRK1 = 2.75;   // sheet rupture window (first holes just after 5.0 s)
  const DT_VEL = 0.02;                      // step used to differentiate the closed-form time terms
  const RHO_MIN = 0.004;                    // pin-hole radius of the polar grid on the bullet axis
  const PARTICLE_COUNT = 6000;
  const DROP_K = 0.94;                      // sphere radius inside the droplet sprite

  // Break-up fields. sn() / burstSJS() are mirrored 1:1 in GLSL (see GLSL_UTIL / GLSL_FIELD).
  function sn(x, y, z) {
    return Math.sin(x + 1.7 * Math.sin(y * 0.6)) * Math.sin(y + 1.3 * Math.sin(z * 0.7)) * Math.sin(z + 1.9 * Math.sin(x * 0.5));
  }
  function burstSJS(x, y, z) {               // Rayleigh-Taylor speed field (fingers run ahead, films lag)
    return 1.0 + 0.42 * sn(x * 4.3 + 0.3, y * 4.3 + 1.1, z * 4.3 + 2.4) + 0.22 * sn(z * 8.7 + 1.7, x * 8.7 + 0.2, y * 8.7 + 0.9);
  }
  function breakTimeJS(x, y, z) {
    const rho2 = y * y + z * z;
    const wE = Math.exp(-((x - X_E) * (x - X_E) + rho2) / (LIPE_W * LIPE_W));
    const wX = Math.exp(-((x + X_E) * (x + X_E) + rho2) / (LIPX_W * LIPX_W));
    const n1 = 0.5 + 0.5 * sn(x * 3.1 + 4.2, y * 3.1 + 0.7, z * 3.1 + 1.9);
    const n2 = 0.5 + 0.5 * sn(y * 6.9 + 0.4, z * 6.9 + 2.2, x * 6.9 + 5.1);
    let tb = T_BRK0 + T_BRK1 * (0.62 * n1 + 0.38 * n2);
    tb = lerp(tb, T_CAV + 0.60 + 1.5 * (1 - wE), smoothstep(0.06, 0.55, wE));
    tb = lerp(tb, T_EXIT + 0.35 + 1.2 * (1 - wX), smoothstep(0.06, 0.55, wX));
    return tb;
  }
  function tearMetric(x, y, z) {            // "distance" the tear front must travel to reach a point
    const u = clamp((y - Y_BOT) / BODY_H, 0, 1);
    const phi = Math.abs(Math.atan2(z, x));
    return Math.hypot(TEAR_KH * bodyRadius(u) * phi, arcAt(u) - ARC_IW);
  }

  /* ==========================================================================
   * 5. STUDIO LIGHT RIG — key + fill + dual rim strips.
   *    The same rig drives the real THREE lights and the analytic soft-box
   *    environment used by every custom shader and by the baked droplet sprite.
   * ======================================================================== */
  const LIGHT_RIG = [
    { name: 'key',        dir: [-0.52, 0.56, 0.64],  color: [1.00, 0.95, 0.88], power: 1.00, size: [0.34, 0.27], soft: 0.05 },
    { name: 'fill',       dir: [0.74, -0.10, 0.66],  color: [0.60, 0.72, 1.00], power: 0.09, size: [0.50, 0.40], soft: 0.80 },
    { name: 'rimCyan',    dir: [-0.66, 0.22, -0.72], color: [0.42, 0.86, 1.00], power: 1.25, size: [0.13, 0.80], soft: 0.05 },  // cool white, cyan tint
    { name: 'rimMagenta', dir: [0.68, 0.06, -0.73],  color: [1.00, 0.45, 0.86], power: 1.10, size: [0.13, 0.80], soft: 0.05 }   // cool white, magenta tint
  ];
  LIGHT_RIG.forEach(function (L) {
    const l = Math.hypot(L.dir[0], L.dir[1], L.dir[2]);
    L.dir = [L.dir[0] / l, L.dir[1] / l, L.dir[2] / l];
    // soft-box frame: right = up x dir, up = dir x right
    let rx = L.dir[2], ry = 0, rz = -L.dir[0];
    const rl = Math.hypot(rx, ry, rz) || 1; rx /= rl; rz /= rl;
    L.right = [rx, ry, rz];
    L.up = [L.dir[1] * rz - L.dir[2] * ry, L.dir[2] * rx - L.dir[0] * rz, L.dir[0] * ry - L.dir[1] * rx];
    L.rad = [L.color[0] * L.power, L.color[1] * L.power, L.color[2] * L.power];
  });
  // Soft-box radiance gains. Reflections off water / latex carry only the Fresnel
  // fraction (2-5 %), so they get a high gain; transmitted rim light is kept low
  // enough that the cyan / magenta tints survive the filmic curve.
  const WATER_REFL = 14.0, WATER_TRANS = 1.5, SKIN_GAIN = 30.0, BULLET_GAIN = 4.5, TUBE_GAIN = 4.0;
  const DROP_GAIN = 14.0, DROP_TRANS = 0.11;

  function boxMaskJS(d, L, extraSoft) {     // JS twin of studioEnv()'s soft-box mask
    const soft = L.soft + extraSoft;
    const f = d[0] * L.dir[0] + d[1] * L.dir[1] + d[2] * L.dir[2];
    if (f <= 0.001) return 0;
    const gx = (d[0] * L.right[0] + d[1] * L.right[1] + d[2] * L.right[2]) / f;
    const gy = (d[0] * L.up[0] + d[1] * L.up[1] + d[2] * L.up[2]) / f;
    return (1 - smoothstep(-soft, soft, Math.abs(gx) - L.size[0])) * (1 - smoothstep(-soft, soft, Math.abs(gy) - L.size[1]));
  }

  /* ==========================================================================
   * 6. GLSL
   * ======================================================================== */
  const glf = function (v) { return (Math.round(v * 1e6) / 1e6).toFixed(6); };
  function glslDefines() {
    const D = {
      X_E: X_E, R_BUL: R_BUL, NOSE_L: NOSE_L, BULLET_L: BULLET_L, BT_S: BT_S, CAN_S: CAN_S,
      T_PUNCT: T_PUNCT, T_CAV: T_CAV, T_EXIT: T_EXIT, T_BW: T_BW, D_A: D_A, B_Q: B_Q, C_Q: C_Q,
      DIMPLE_W: DIMPLE_W, DIMPLE_D: DIMPLE_D, BULGE: BULGE, BULGE_W: BULGE_W, K_CAV: K_CAV, GROW2: GROW2,
      LIP_E: LIP_E, TAU_LE: TAU_LE, LIPE_W: LIPE_W, LIP_X: LIP_X, TAU_LX: TAU_LX, LIPX_W: LIPX_W,
      T_BURST: T_BURST, TAU_BURST: TAU_BURST, E_MAX: E_MAX, R_REF: R_REF, BURST_AX: BURST_AX, DRIFT: DRIFT,
      T_GRAV: T_GRAV, TAU_GRAV: TAU_GRAV, G_ACC: G_ACC, T_BRK0: T_BRK0, T_BRK1: T_BRK1,
      TEAR_KH: TEAR_KH, ARC_I: ARC_I, SKIN_SPEED: SKIN_SPEED, DT_VEL: DT_VEL,
      Y_BOT: Y_BOT, BODY_H: BODY_H, DROP_K: DROP_K,
      WATER_REFL: WATER_REFL, WATER_TRANS: WATER_TRANS, SKIN_GAIN: SKIN_GAIN, BULLET_GAIN: BULLET_GAIN, TUBE_GAIN: TUBE_GAIN
    };
    return Object.keys(D).map(function (k) { return '#define ' + k + ' ' + glf(D[k]); }).join('\n') + '\n' +
      // sprite atlas layout (uv): drop cell, fx cell, half cell size
      '#define ATLAS_DROP vec2(0.125, 0.75)\n#define ATLAS_FX vec2(0.625, 0.75)\n#define ATLAS_CELL vec2(0.125, 0.25)\n';
  }

  const GLSL_UTIL = `
    float sat(float x) { return clamp(x, 0.0, 1.0); }
    float hash13(vec3 p) {
      p = fract(p * 0.1031);
      p += dot(p, p.zyx + 31.32);
      return fract((p.x + p.y) * p.z);
    }
    float vnoise(vec3 p) {
      vec3 i = floor(p);
      vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash13(i);
      float b = hash13(i + vec3(1.0, 0.0, 0.0));
      float c = hash13(i + vec3(0.0, 1.0, 0.0));
      float d = hash13(i + vec3(1.0, 1.0, 0.0));
      float e = hash13(i + vec3(0.0, 0.0, 1.0));
      float g = hash13(i + vec3(1.0, 0.0, 1.0));
      float h = hash13(i + vec3(0.0, 1.0, 1.0));
      float k = hash13(i + vec3(1.0, 1.0, 1.0));
      return mix(mix(mix(a, b, f.x), mix(c, d, f.x), f.y), mix(mix(e, g, f.x), mix(h, k, f.x), f.y), f.z);
    }
    float sn(vec3 p) {
      return sin(p.x + 1.7 * sin(p.y * 0.6)) * sin(p.y + 1.3 * sin(p.z * 0.7)) * sin(p.z + 1.9 * sin(p.x * 0.5));
    }
    vec3 swirl(vec3 p) {                   // smooth pseudo-random vector field in [-1, 1]
      return vec3(sin(p.y * 1.7 + 1.3 * sin(p.z * 1.1 + p.x * 0.7)),
                  sin(p.z * 1.9 + 1.3 * sin(p.x * 1.3 + p.y * 0.6)),
                  sin(p.x * 1.6 + 1.3 * sin(p.y * 1.2 + p.z * 0.8)));
    }
  `;

  // Rayleigh-Taylor speed field: where the expanding mass runs ahead (fingers) or lags (thin film)
  const GLSL_FIELD = `
    float burstS(vec3 q) {
      return 1.0 + 0.42 * sn(q * 4.3 + vec3(0.3, 1.1, 2.4)) + 0.22 * sn(q.zxy * 8.7 + vec3(1.7, 0.2, 0.9));
    }
  `;

  /* The fluid deformation field. q is a rest-space point of the water mass,
   * T = (simTime, bulletTipX, gravityFall, dimpleDepth) and
   * A = (entryCrownLength, exitConeLength, burstExpansion, exitBulge) — all closed-form
   * functions of simTime evaluated on the CPU. The same function moves the water surface,
   * the vapor tunnel wall and every tracer droplet, so they stay glued together by construction. */
  const GLSL_DEFORM = `
    uniform vec4 uT0;
    uniform vec4 uA0;
    uniform vec4 uAd;      // d/dt of (A.x, A.y, A.z, gravityFall): gives analytic droplet velocities

    float noseR(float s) {
      s = clamp(s, 0.0, 1.0);
      return 0.4 * s + 0.6 * pow(sin(1.5707963 * s) + 1e-5, 0.85);
    }
    float tPass(float x) {                 // cavitation clock: when did the tip pass station x
      float dd = max((X_E - x) - D_A, 0.0);
      float s = (-B_Q + sqrt(B_Q * B_Q + 4.0 * C_Q * dd)) / (2.0 * C_Q);
      return T_CAV + T_BW * s;
    }
    float fallOf(float t) {
      float u = max(t - T_GRAV, 0.0);
      return G_ACC * (0.5 * u * u - TAU_GRAV * u + TAU_GRAV * TAU_GRAV * (1.0 - exp(-u / TAU_GRAV)));
    }
    float fallVel(float t) {
      float u = max(t - T_GRAV, 0.0);
      return G_ACC * (u - TAU_GRAV * (1.0 - exp(-u / TAU_GRAV)));
    }
    // elastic indentation under the bullet tip: a crease elongated along the line of sight,
    // so the lateral camera sees the nose sitting in a clean V-notch of the silhouette
    float dimple(vec3 q, float depth) {
      float dx = q.x - X_E;
      float dq2 = (dx * dx + q.y * q.y) / (DIMPLE_W * DIMPLE_W) + q.z * q.z / (DIMPLE_D * DIMPLE_D);
      return depth / pow(1.0 + dq2, 0.9);
    }

    // Position of rest point q, plus its velocity (the crown, burst and free-fall terms are
    // linear in A and T.z, so their time derivative comes for free from uAd).
    // sBurst: pre-baked burstS(q) (droplets) or a negative value to evaluate it here (surfaces).
    vec3 deformPV(vec3 q, float lipK, float sBurst, vec4 T, vec4 A, out vec3 vel) {
      float t = T.x;
      float rho2 = dot(q.yz, q.yz);
      float dE2 = (q.x - X_E) * (q.x - X_E) + rho2;
      float dX2 = (q.x + X_E) * (q.x + X_E) + rho2;
      float th = atan(q.z, q.y);
      float vx = 0.0;
      float vr = 0.0;

      // (1) elastic dimple under the tip; water pushed ahead of the tip before it exits
      float x1 = q.x;
      if (T.w > 0.0) x1 -= dimple(q, T.w);
      if (A.w > 0.0) x1 -= A.w * exp(-dX2 / (BULGE_W * BULGE_W));

      // (2) cavity: the hole hugs the bullet, then the low-pressure vapor tunnel grows
      //     behind it. Incompressible radial push: rho' = sqrt(rho^2 + Rc^2).
      float rc2 = 0.0;
      float b = x1 - T.y;
      if (b > 0.0 && t > T_PUNCT) {
        float hug = 1.10 * R_BUL * noseR(b / NOSE_L) * smoothstep(T_PUNCT, T_PUNCT + 0.05, t);
        float tau = max(t - tPass(x1), 0.0);
        float rgh = 1.0 + 0.24 * sin(q.x * 17.0 + 2.0 * sin(th * 3.0 + q.x * 5.0) + t * 1.3) * sin(th * 5.0 + q.x * 7.0 + 1.3);
        float taper = smoothstep(0.0, 0.75, b);                 // the cavity closes conically onto the nose
        rc2 = hug * hug + 2.0 * K_CAV * tau * (1.0 + GROW2 * tau) * rgh * taper * taper;
      }
      vec2 er = q.yz / max(sqrt(rho2), 1e-6);
      float rho1 = sqrt(rho2 + rc2);

      // (3) crown sheets: backward splash at the entry hole, forward cone at the exit hole
      float kE = lipK * exp(-dE2 / (LIPE_W * LIPE_W));
      if (kE * A.x > 1e-4) {
        kE *= 0.72 + 0.20 * sin(7.0 * th + 0.8) + 0.16 * sin(13.0 * th + 2.9) + 0.10 * sin(23.0 * th + 5.1);
        x1 += kE * A.x * 0.80;
        rho1 += kE * A.x * 0.60;
        vx += kE * uAd.x * 0.80;
        vr += kE * uAd.x * 0.60;
      }
      float kX = lipK * exp(-dX2 / (LIPX_W * LIPX_W));
      if (kX * A.y > 1e-4) {
        kX *= 0.75 + 0.18 * sin(9.0 * th + 1.9) + 0.15 * sin(17.0 * th + 0.4) + 0.10 * sin(29.0 * th + 3.3);
        x1 -= kX * A.y * 0.92;
        rho1 += kX * A.y * 0.39;
        vx -= kX * uAd.y * 0.92;
        vr += kX * uAd.y * 0.39;
      }
      vec3 p = vec3(x1, er * rho1);
      vec3 v = vec3(vx, er * vr);

      // (4) burst: homologous expansion modulated by the Rayleigh-Taylor finger field
      if (A.z > 0.0) {
        float S = sBurst < 0.0 ? burstS(q) : sBurst;
        vec3 dirv = vec3(q.x * BURST_AX, q.y, q.z) * (S / ((1.0 + 0.35 * rho2 / (R_REF * R_REF)) * R_REF));
        p += dirv * A.z;
        p.x -= DRIFT * A.z;
        v += dirv * uAd.z;
        v.x -= DRIFT * uAd.z;
      }

      // (5) global free-fall frame
      p.y -= T.z;
      v.y -= uAd.w;
      vel = v;
      return p;
    }
    vec3 deform(vec3 q, float lipK, vec4 T, vec4 A) {
      vec3 unusedVel;
      return deformPV(q, lipK, -1.0, T, A, unusedVel);
    }
  `;

  const GLSL_ENV = `
    uniform vec3 uLDir[4];
    uniform vec3 uLRgt[4];
    uniform vec3 uLUp[4];
    uniform vec3 uLCol[4];
    uniform vec2 uLSize[4];
    uniform float uLSoft[4];
    uniform vec2 uBoxScale;
    uniform vec3 uAmbTop;
    uniform vec3 uAmbBot;
    uniform float uExposure;

    // Analytic studio: four rectangular soft-boxes (key, fill, two rim strips)
    vec3 studioEnv(vec3 d, float rough) {
      vec3 c = vec3(0.0);
      for (int i = 0; i < 4; i++) {
        float soft = uLSoft[i] + 1.5 * rough;
        float f = dot(d, uLDir[i]);
        vec2 g = vec2(dot(d, uLRgt[i]), dot(d, uLUp[i])) / max(f, 0.001);
        vec2 e = abs(g) - uLSize[i] * uBoxScale;
        float m = (1.0 - smoothstep(-soft, soft, e.x)) * (1.0 - smoothstep(-soft, soft, e.y)) * step(0.001, f);
        vec2 gn = g / (uLSize[i] * uBoxScale);
        m *= 1.0 - 0.45 * sat(dot(gn, gn) * 0.5);            // diffuser hot-spot falloff
        c += uLCol[i] * (m / (1.0 + 5.0 * rough));
      }
      return c;
    }
    // Same studio, but the key / fill boxes are looked up along dA and the rim strips along dB
    // (lets a surface keep a clean window reflection while its micro-roughness sparkles in the rims)
    vec3 studioEnvSplit(vec3 dA, vec3 dB, float roughA, float roughB) {
      vec3 c = vec3(0.0);
      for (int i = 0; i < 4; i++) {
        vec3 d = i < 2 ? dA : dB;
        float rough = i < 2 ? roughA : roughB;
        float soft = uLSoft[i] + 1.5 * rough;
        float f = dot(d, uLDir[i]);
        vec2 g = vec2(dot(d, uLRgt[i]), dot(d, uLUp[i])) / max(f, 0.001);
        vec2 e = abs(g) - uLSize[i];
        float m = (1.0 - smoothstep(-soft, soft, e.x)) * (1.0 - smoothstep(-soft, soft, e.y)) * step(0.001, f);
        vec2 gn = g / uLSize[i];
        m *= 1.0 - 0.45 * sat(dot(gn, gn) * 0.5);
        c += uLCol[i] * (m / (1.0 + 5.0 * rough));
      }
      return c;
    }
    vec3 studioAmb(vec3 d) { return mix(uAmbBot, uAmbTop, 0.5 + 0.5 * d.y); }
    vec3 studioDiffuse(vec3 n, float wrap) {
      vec3 c = vec3(0.0);
      for (int i = 0; i < 4; i++) c += uLCol[i] * sat((dot(n, uLDir[i]) + wrap) / (1.0 + wrap));
      return c;
    }
    float lum(vec3 c) { return dot(c, vec3(0.2126, 0.7152, 0.0722)); }
    vec3 filmic(vec3 x) {
      x *= uExposure;
      return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
    }
    vec4 outColor(vec3 lin, float a) { return linearToOutputTexel(vec4(filmic(lin), sat(a))); }
  `;

  /* ---- water body (free-standing mass, then sheets) & vapor tunnel -------- */
  const SURFACE_VS_HEAD = `
    varying vec3 vRest;
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec3 vInfo;
    varying vec3 vNr;
  `;
  const SURFACE_VS_MAIN = `
    void main() {
      vec3 q = position;
      vec3 n = normalize(normal);
      vec3 hlp = abs(n.x) > 0.8 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
      vec3 t1 = normalize(cross(hlp, n));
      vec3 t2 = cross(n, t1);
      float eps = min(0.012, 0.12 * length(q.yz));
      vec3 p0 = surf(q, n);
      vec3 p1 = surf(q + t1 * eps, n);
      vec3 p2 = surf(q + t2 * eps, n);
      vec3 nn = cross(p1 - p0, p2 - p0);
      float l = length(nn);
      vNrm = l > 1e-12 ? nn / l : n;
      vRest = q;
      vWorld = p0;
      vNr = n;
      vInfo = surfInfo(q, p0);
      gl_Position = projectionMatrix * viewMatrix * vec4(p0, 1.0);
    }
  `;
  const BODY_VS_SURF = `
    attribute vec2 aInfo;                  // (sheet rupture time, time the latex uncovers this point)
    uniform vec4 uRipple;                  // capillary shimmer: (amp1, phase1, amp2, phase2)
    vec3 surf(vec3 q, vec3 n) {
      vec3 p = deform(q, 1.0, uT0, uA0);
      // capillary shimmer radiating from the puncture, then from the venting hole
      if (uRipple.x + uRipple.z > 1e-5) {
        float dE = length(q - vec3(X_E, 0.0, 0.0));
        float w1 = sin(24.0 * dE - 13.0 * uRipple.y) * exp(-1.2 * dE) * smoothstep(0.0, 0.3, 0.6 * uRipple.y + 0.15 - dE);
        float w2 = sin(17.0 * dE - 10.0 * uRipple.w) * exp(-0.8 * dE);
        p += n * (uRipple.x * w1 + uRipple.z * w2);
      }
      return p;
    }
    vec3 surfInfo(vec3 q, vec3 p) { return vec3(aInfo, 0.0); }
  `;
  const TUBE_VS_SURF = `
    vec3 surf(vec3 q, vec3 n) { return deform(q, 1.0, uT0, uA0); }
    vec3 surfInfo(vec3 q, vec3 p) {
      return vec3(0.0, 0.0, length(vec2(p.y + uT0.z, p.z)));
    }
  `;

  const BODY_FS = `
    uniform vec4 uT0;
    uniform float uSide;
    uniform float uBodyFade;
    varying vec3 vRest;
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec3 vInfo;
    void main() {
      float t = uT0.x;
      // Sheet rupture: holes nucleate where the film is thinnest and spread
      float hole = vInfo.x - t;
      if (hole < 0.30) {                 // (only films about to rupture pay for the edge noise)
        hole += (vnoise(vRest * 8.0) - 0.5) * 0.34 + (vnoise(vRest * 19.0) - 0.5) * 0.08;
        if (hole < 0.0) discard;
      }

      vec3 N0 = normalize(vNrm) * uSide;
      vec3 V = normalize(cameraPosition - vWorld);
      float nv0 = dot(N0, V);
      if (nv0 < 0.03) N0 = normalize(N0 + V * (0.03 - nv0));
    #ifdef FAR_WALL
      // far wall of the mass seen through the water: a lean glint-only shade
      float nvb = sat(dot(N0, V));
      float Fb = 0.02 + 0.98 * pow(1.0 - nvb, 5.0);
      vec3 glowb = vec3(0.0);
      for (int i = 2; i < 4; i++) {
        float w = sat(dot(N0, uLDir[i]) * 0.5 + 0.5);
        glowb += uLCol[i] * w * w;
      }
      float limbb = pow(1.0 - nvb, 2.5);
      vec3 colb = studioEnv(reflect(-V, N0), 0.05) * WATER_REFL * Fb + glowb * limbb * 0.42
                + vec3(0.014, 0.036, 0.054) * (0.7 + 1.3 * (1.0 - nvb));
      float alphab = (0.15 + 0.50 * limbb + 0.5 * Fb + lum(colb) * 0.9) * smoothstep(0.0, 0.016, hole);
      gl_FragColor = outColor(colb * 0.55, alphab * 0.55 * uBodyFade);
    #else
      // "frosted" capillary roughness left behind by the retracting latex
      float ex = t - vInfo.y;
      float frost = smoothstep(0.0, 0.05, ex) * (0.20 + 0.80 * exp(-max(ex, 0.0) / 0.9));
      vec3 N = normalize(N0 + (swirl(vRest * 38.0) * 0.6 + swirl(vRest.zxy * 83.0 + 3.0) * 0.4) * (0.010 + 0.085 * frost));
      float nv = dot(N, V);
      if (nv < 0.03) N = normalize(N + V * (0.03 - nv));
      nv = sat(dot(N, V));

      float F = 0.02 + 0.98 * pow(1.0 - nv, 5.0);
      vec3 I = -V;
      vec3 R = reflect(I, N);
      float rgh = 0.012 + 0.035 * frost;
      // clean (slightly blurred) window reflection of the key box, sparkling rim strips
      vec3 refl = studioEnvSplit(reflect(I, N0), R, 0.02 + 0.10 * frost, rgh) * WATER_REFL + studioAmb(R) * 4.0;
      // ball-lens transmission: refract in, cross the mass, refract out (inverted rim glints)
      vec3 T1 = refract(I, N, 0.752);
      vec3 N2 = normalize(N + T1 * (-2.0 * dot(T1, N)));
      vec3 T2 = refract(T1, -N2, 1.33);
      if (dot(T2, T2) < 0.25) T2 = reflect(T1, -N2);
      vec3 trans = studioEnv(T2, rgh + 0.08) * WATER_TRANS * vec3(0.86, 0.96, 1.0);
      // rim light scattered through the limb: cyan on its side, magenta on the other
      vec3 glow = vec3(0.0);
      for (int i = 2; i < 4; i++) {
        float w = sat(dot(N, uLDir[i]) * 0.5 + 0.5);
        glow += uLCol[i] * w * w;
      }
      float limb = pow(1.0 - nv, 2.5);
      // internal caustic: key light focused onto the far side of the mass
      float caus = pow(sat(dot(N.xy, -normalize(uLDir[0].xy))), 2.0) * pow(1.0 - nv, 1.2);
      vec3 col = refl * F + trans * (1.0 - F) * (1.0 - F) + glow * limb * 0.42 + uLCol[0] * caus * 0.30;
      col += vec3(0.014, 0.036, 0.054) * (0.7 + 1.3 * (1.0 - nv)) + studioDiffuse(N, 0.6) * frost * 0.030;
      float rim = 1.0 - smoothstep(0.0, 0.05, hole);          // thickened rim of each opening hole
      col += (glow * 0.05 + vec3(0.012, 0.024, 0.030)) * rim;
      float alpha = 0.15 + 0.50 * limb + 0.5 * F + lum(col) * 0.9 + rim * 0.12 + frost * 0.08;
      alpha *= smoothstep(0.0, 0.016, hole);
      gl_FragColor = outColor(col, alpha * uBodyFade);
    #endif
    }
  `;

  const TUBE_FS = `
    uniform vec4 uT0;
    uniform float uTubeFade;
    varying vec3 vRest;
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec3 vInfo;
    varying vec3 vNr;
    void main() {
      vec3 N = normalize(vNrm);
      vec3 V = normalize(cameraPosition - vWorld);
      float nv = dot(N, V);
      if (nv < 0.03) N = normalize(N + V * (0.03 - nv));
      nv = sat(dot(N, V));
      float t = uT0.x;
      vec3 pc = vec3(vRest.x * 8.0 - t * 0.7, vNr.y * 2.4, vNr.z * 2.4);
      float fr = 0.62 * vnoise(pc) + 0.38 * vnoise(pc * 2.7 + vec3(0.0, 0.0, t * 1.3));
      vec3 R = reflect(-V, N);
      float F = 0.22 + 0.78 * pow(1.0 - nv, 3.0);
      // frothy liquid/vapor interface + the milky vapor filling the low-pressure tunnel
      float fog = 1.0 - exp(-2.2 * vInfo.z * nv);
      vec3 vapor = (uLCol[2] + uLCol[3]) * 0.16 + uLCol[0] * 0.10;
      vec3 col = studioDiffuse(N, 0.5) * (0.05 + 0.22 * fr) * vec3(0.82, 0.93, 1.0)
               + (studioEnv(R, 0.16) * TUBE_GAIN + studioAmb(R) * 2.0) * F
               + vapor * fog * (0.55 + 0.9 * fr);
      float thin = 1.0 - 0.6 * smoothstep(0.35, 1.1, vInfo.z);
      float sheath = smoothstep(0.10, 0.24, vInfo.z);            // nearly clear where it only hugs the bullet
      float alpha = (0.22 + 0.50 * fr + 0.35 * F + 0.45 * fog) * thin * uTubeFade * (0.12 + 0.88 * sheath)
                  * smoothstep(0.0, 0.02, vInfo.z);
      gl_FragColor = outColor(col, alpha);
    }
  `;

  /* ---- latex membrane ---------------------------------------------------- */
  const SKIN_VS = `
    attribute float aArc;
    uniform float uFront;
    varying vec3 vRest;
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec3 vTear;
    varying float vHs;
    void main() {
      vec3 q = position;
      vec3 n = normalize(normal);
      float phi = uv.x * 6.2831853;
      if (phi > 3.14159265) phi -= 6.2831853;
      float r = length(q.xz);
      vTear = vec3(r * abs(phi), aArc - ARC_I, (q.y - (Y_BOT)) / BODY_H);
      vHs = r * phi;
      // the membrane only ever feels the elastic dimple (it is gone before the water moves)
      vec3 p0 = q;
      vec3 N = n;
      if (uT0.w > 0.0) {
        vec3 hlp = abs(n.x) > 0.8 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
        vec3 t1 = normalize(cross(hlp, n));
        vec3 t2 = cross(n, t1);
        vec3 p1 = q + t1 * 0.012;
        vec3 p2 = q + t2 * 0.012;
        p0.x -= dimple(q, uT0.w);
        p1.x -= dimple(p1, uT0.w);
        p2.x -= dimple(p2, uT0.w);
        vec3 nn = cross(p1 - p0, p2 - p0);
        float l = length(nn);
        if (l > 1e-10) N = nn / l;
      }
      // relaxed latex right behind the tear front peels off the water and flutters
      float m = length(vec2(TEAR_KH * vTear.x, vTear.y));
      float peel = (1.0 - smoothstep(0.0, 0.16, m - uFront)) * step(1e-4, uFront);
      p0 += N * peel * (0.030 + 0.022 * sin(aArc * 37.0 + phi * 11.0 + uFront * 9.0));
      vNrm = N;
      vRest = q;
      vWorld = p0;
      gl_Position = projectionMatrix * viewMatrix * vec4(p0, 1.0);
    }
  `;
  const SOLID_VS = `
    varying vec3 vRest;
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec3 vTear;
    varying float vHs;
    varying vec2 vUv;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      vRest = position;
      vNrm = normalize(mat3(modelMatrix) * normal);
      vTear = vec3(9.0, 9.0, 1.0);
      vHs = 0.0;
      vUv = uv;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `;
  const LATEX_FS = `
    uniform float uFront;
    uniform float uSide;
    uniform float uSolid;
    uniform vec3 uLatex;
    uniform vec3 uLatexDeep;
    uniform vec3 uLatexGlow;
    varying vec3 vRest;
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec3 vTear;
    varying float vHs;
    void main() {
      float thick = 1.0;
      float edge = 1.0;
      float band = 0.0;
      vec3 N = normalize(vNrm) * uSide;
      if (uSolid < 0.5) {
        // stretched-thin belly, thick neck and nipple
        float u = vTear.z;
        thick = sat(0.10 + 0.9 * smoothstep(0.78, 1.0, u) + 0.75 * (1.0 - smoothstep(0.0, 0.035, u)));
        if (uFront > 0.0) {
          // tear front: star-shaped cracks at the puncture, ragged retreating edge
          float m = length(vec2(TEAR_KH * vTear.x, vTear.y));
          float ang = atan(vTear.y, TEAR_KH * vHs + 1e-5);
          float star = 0.5 * sin(ang * 5.0 + 0.9) + 0.3 * sin(ang * 8.0 + 2.3) + 0.2 * sin(ang * 13.0 + 4.1);
          float jag = (vnoise(vRest * 5.0) - 0.5) * 0.16 + (vnoise(vRest * 13.0) - 0.5) * 0.04;
          float mm = m * (1.0 + 0.40 * star * exp(-m * 2.0)) + jag * smoothstep(0.0, 0.3, m);
          float e = mm - uFront;
          if (e < 0.0) discard;
          // bunched-up, wrinkled rim that collects the retracted rubber
          float bw = 0.030 + 0.06 * sat(uFront / 2.0);
          band = 1.0 - smoothstep(0.0, bw, e);
          N = normalize(N + swirl(vRest * 64.0) * (band * 0.30));
          thick = max(thick, band);
          edge = smoothstep(0.0, 0.006, e);
        }
      }
      vec3 V = normalize(cameraPosition - vWorld);
      float nv = dot(N, V);
      if (nv < 0.03) N = normalize(N + V * (0.03 - nv));
      nv = sat(dot(N, V));
      float F = 0.045 + 0.955 * pow(1.0 - nv, 5.0);
      vec3 base = mix(uLatex, uLatexDeep, thick * 0.8);
      vec3 dif = studioDiffuse(N, 0.5) + studioAmb(N) * 2.0;
      // subsurface transmission: light leaking through the thin stretched wall
      vec3 tr = vec3(0.0);
      vec3 rimc = vec3(0.0);
      for (int i = 0; i < 4; i++) {
        float nl = dot(N, uLDir[i]);
        float b = sat(-nl * 0.8 + 0.2);
        tr += uLCol[i] * b * b;
        if (i > 1) { float w = sat(nl * 0.5 + 0.5); rimc += uLCol[i] * w * w; }
      }
      float alpha = max(mix(0.90, 1.0, thick), sat(F * 2.0)) * edge;
    #ifdef FAR_WALL
      // inner face of the far wall, seen through the water once the near wall is gone: back-lit glow
      gl_FragColor = outColor(base * dif * 0.22 + uLatexGlow * tr * 0.55 + studioAmb(reflect(-V, N)) * F, alpha);
    #else
      vec3 R = reflect(-V, N);
      // high-gloss latex: crisp soft-box mirror + broad sheen (the bunched rim is rougher)
      vec3 spec = studioEnv(R, mix(0.035, 0.22, band)) * SKIN_GAIN + studioEnv(R, 0.35) * 1.2 + studioAmb(R);
      vec3 col = base * dif * 0.50 + uLatexGlow * tr * (1.0 - 0.85 * thick) * 0.26 + spec * F
               + rimc * pow(1.0 - nv, 3.0) * 0.45;                       // Fresnel edge highlight
      gl_FragColor = outColor(col, alpha);
    #endif
    }
  `;

  /* ---- copper / brass projectile ----------------------------------------- */
  const BULLET_FS = `
    varying vec3 vWorld;
    varying vec3 vNrm;
    varying vec2 vUv;
    void main() {
      vec3 N = normalize(vNrm);
      vec3 V = normalize(cameraPosition - vWorld);
      float nv = dot(N, V);
      if (nv < 0.02) N = normalize(N + V * (0.02 - nv));
      nv = sat(dot(N, V));
      float s = vUv.x * BULLET_L;
      float th = vUv.y * 6.2831853;
      // rifling engraving on the bearing surface (rotates with the spin)
      float bearing = smoothstep(NOSE_L - 0.03, NOSE_L + 0.02, s) * (1.0 - smoothstep(BT_S - 0.01, BT_S + 0.02, s));
      float land = smoothstep(0.35, 0.6, sin(6.0 * th + s * 7.0));
      float rough = 0.05 + 0.07 * bearing * land;
      vec3 copper = vec3(0.96, 0.47, 0.27);
      vec3 brass = vec3(0.93, 0.72, 0.33);
      vec3 F0 = mix(copper, brass, 0.25 + 0.30 * bearing * land);
      vec3 F = F0 + (1.0 - F0) * pow(1.0 - nv, 5.0);
      vec3 R = reflect(-V, N);
      // strip soft-boxes run along the barrel axis (uBoxScale), as in a product shot
      vec3 env = studioEnv(R, rough) * BULLET_GAIN + studioEnv(R, 0.40) * 2.2
               + mix(vec3(0.05, 0.045, 0.04), vec3(0.42, 0.44, 0.50), smoothstep(-0.5, 0.9, R.y));
      vec3 col = env * F + F0 * studioDiffuse(N, 0.2) * 0.07;
      float cz = (s - CAN_S) / 0.014;
      col *= 1.0 - 0.55 * exp(-cz * cz);                                          // cannelure groove
      col *= 0.92 + 0.08 * vnoise(vec3(s * 170.0, cos(th) * 1.5, sin(th) * 1.5)); // lathe-turned micro lines
      gl_FragColor = outColor(col, 1.0);
    }
  `;

  /* ---- droplets / mist / micro-droplet clusters (InstancedMesh) ---------- */
  const PARTICLE_VS = `
    attribute vec3 aQ;
    attribute vec3 aDev;
    attribute vec4 aTime;
    attribute vec4 aMisc;
    attribute vec4 aAux;
    attribute vec3 aChain;
    uniform float uPxK;
    varying vec2 vUv;
    varying vec2 vAxis;
    varying vec4 vInfo;
    varying vec4 vTex;
    varying vec3 vTexS;

    // Closed-form trajectory (position + velocity). Tracers ride the deforming water and are
    // released with a drag-limited deviation velocity; free particles are purely ballistic.
    vec3 particleAt(vec3 q, float a, out vec3 vel) {
      float t0 = aTime.x;
      float k = aTime.w;
      float ek = exp(-k * a);
      float gs = aMisc.z;
      vec3 p;
      vec3 v;
      if (aMisc.y < 3.5) {
        p = deformPV(q, aAux.x, aAux.w, uT0, uA0, v);
        p.y += (1.0 - gs) * max(uT0.z - fallOf(t0), 0.0);       // mist sinks slower than the free-fall frame
        v.y += (1.0 - gs) * uAd.w;
      } else {
        p = q;
        v = vec3(0.0);
        p.y -= gs * max(uT0.z - fallOf(t0) - fallVel(t0) * a, 0.0);
        v.y -= gs * max(uAd.w - fallVel(t0), 0.0);
      }
      vel = v + aDev * ek;
      return p + aDev * ((1.0 - ek) / k);
    }

    void main() {
      float t = uT0.x;
      float age = t - aTime.x;
      float life = aTime.z;
      float vis = smoothstep(0.0, aTime.y, age) * (1.0 - smoothstep(life * 0.55, life, age));
      if (vis < 0.002) {
        gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
        vUv = vec2(0.0); vAxis = vec2(1.0, 0.0); vInfo = vec4(0.0); vTex = vec4(0.0); vTexS = vec3(0.0);
        return;
      }
      float kind = mod(aMisc.y, 4.0);
      float seed = aMisc.w;
      bool chain = dot(aChain, aChain) > 1e-9;
      float a = max(age, 0.0);
      vec3 vel;
      vec3 P = particleAt(aQ, a, vel);
      vec4 mv = viewMatrix * vec4(P, 1.0);
      // long axis: towards the next bead of the ligament (chains) or along the velocity
      vec3 dv = (viewMatrix * vec4(chain ? aChain : vel, 0.0)).xyz;
      float dl = length(dv.xy);
      vec2 axis = dl > 1e-6 ? dv.xy / dl : vec2(1.0, 0.0);
      float r = aMisc.x * (1.0 + aAux.z * a);
      float halfL;
      float halfW;
      if (kind < 0.5) {
        if (chain) {
          // Plateau-Rayleigh: the stretching ligament necks down between beads and
          // pinches off once the bead spacing exceeds ~pi diameters
          float Dk = (1.0 - exp(-aTime.w * a)) / aTime.w;
          float gap = length(aChain) * Dk;
          float fill = 1.0 - smoothstep(2.6, 5.2, gap / r);
          halfL = r + 0.55 * min(dl * Dk, 5.2 * r) * fill;
          halfW = r * mix(1.0, 0.64, fill);
        } else {
          float st = 1.0 + min(dl * 0.55, 1.8) * exp(-a / 0.45);
          st *= 1.0 + 0.20 * exp(-a / 0.9) * sin(a * (7.0 + 5.0 * seed) + seed * 40.0);   // shape oscillation
          halfL = r * st;
          halfW = r / sqrt(st);
        }
      } else {
        halfL = r * (1.0 + min(dl * 0.25, 1.2));
        halfW = r;
      }
      // keep sub-pixel droplets at least ~1.5 px wide, trading size for opacity
      float pxPerUnit = uPxK / max(-mv.z, 0.1);
      float minW = 0.75 / pxPerUnit;
      float fix = 1.0;
      if (halfW < minW) { fix = halfW / minW; halfW = minW; }
      halfL = max(halfL, halfW);

      vec2 corner = position.xy * 2.0;
      mv.xy += axis * (corner.x * halfL) + vec2(-axis.y, axis.x) * (corner.y * halfW);
      gl_Position = projectionMatrix * mv;
      vUv = corner;
      vAxis = axis;
      vInfo = vec4(vis * aAux.y * fix, kind, smoothstep(-3.5, 3.5, P.x), 1.0 + 1.2 * sat(1.0 - halfW * pxPerUnit / 5.0));

      // one atlas lookup per fragment: (centre, rotation) + (scale) of this sprite's window
      if (kind < 0.5) {
        vTex = vec4(ATLAS_DROP, 1.0, 0.0);
        vTexS = vec3(ATLAS_CELL * DROP_K, 0.0);
      } else {
        // mist and micro-droplet clusters each show their own random, rotated window of the fx cell
        float ang = seed * 40.0;
        vec2 jitter = fract(vec2(seed * 7.3, seed * 3.1)) - 0.5;
        vTex = vec4(ATLAS_FX + jitter * ATLAS_CELL, cos(ang), sin(ang));
        vTexS = vec3(ATLAS_CELL * 0.42, 0.0);
      }
    }
  `;
  const PARTICLE_FS = `
    uniform sampler2D uAtlas;
    uniform vec3 uRadKey;
    uniform vec3 uRadA;
    uniform vec3 uRadB;
    varying vec2 vUv;
    varying vec2 vAxis;
    varying vec4 vInfo;
    varying vec4 vTex;
    varying vec3 vTexS;
    void main() {
      float r2 = dot(vUv, vUv);
      // rotate the sprite lookup back to screen space so highlights keep facing the lights
      vec2 s = vec2(vUv.x * vAxis.x - vUv.y * vAxis.y, vUv.x * vAxis.y + vUv.y * vAxis.x);
      vec2 lu = vec2(s.x * vTex.z - s.y * vTex.w, s.x * vTex.w + s.y * vTex.z);
      vec3 tex = texture2D(uAtlas, vTex.xy + lu * vTexS.xy).rgb;
      if (r2 > 1.0) discard;
      float w = vInfo.z;
      vec3 radA = uRadA * (1.25 - 0.5 * w);
      vec3 radB = uRadB * (0.75 + 0.5 * w);
      vec3 col;
      float alpha;
      if (vInfo.y < 0.5) {
        // glassy droplet: baked light-response map (R = key, G = cyan rim, B = magenta rim)
        vec3 resp = tex * tex;
        col = (resp.r * uRadKey + resp.g * radA + resp.b * radB) * vInfo.w + vec3(0.016, 0.040, 0.058);
        alpha = sat(0.16 + 0.10 * r2 + lum(col) * 1.5) * (1.0 - smoothstep(0.86, 1.0, sqrt(r2)));
      } else if (vInfo.y < 1.5) {
        // back-lit wisp of vapor / mist (G = tileable vapor noise)
        col = ((radA + radB) * 0.030 + uRadKey * 0.014) * (0.7 + 0.6 * tex.g);
        alpha = exp(-3.0 * r2) * (1.0 - r2) * smoothstep(0.24, 0.74, tex.g) * 2.0;
      } else {
        // cluster of micro-droplets (R = dots)
        col = (radA + radB) * 0.030 + uRadKey * 0.012;
        alpha = tex.r * (1.0 - r2) * (1.0 - r2) * 1.6;
      }
      gl_FragColor = outColor(col, alpha * vInfo.x);
    }
  `;

  /* ==========================================================================
   * 7. SCENE CONSTRUCTION
   * ======================================================================== */
  function buildSimulation() {
    const rng = mulberry32(SEED);          // seed 42 — the only entropy source
    const rnd = function (a, b) { return a + (b - a) * rng(); };

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setClearColor(0x000000, 0);

    // Tessellation level: full detail on any GPU; a lighter grid when WebGL is being rasterised
    // on the CPU (software renderer), where triangle count is the bottleneck. Decided once from
    // the renderer name, so a given machine always produces the same frames.
    let LOD = 1.0;
    try {
      const glc = renderer.getContext();
      let who = String(glc.getParameter(glc.RENDERER) || '');
      if (!/firefox/i.test(navigator.userAgent)) {       // (Firefox already reports it via RENDERER)
        const ext = glc.getExtension('WEBGL_debug_renderer_info');
        if (ext) who += ' ' + String(glc.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '');
      }
      if (/swiftshader|llvmpipe|softpipe|software|basic render/i.test(who)) LOD = 0.6;
    } catch (e) { LOD = 1.0; }
    const lod = function (n) { return Math.max(8, 2 * Math.round(n * LOD / 2)); };   // even segment counts

    const scene = new THREE.Scene();
    const FOV = 35;                                    // ~85 mm equivalent, pure lateral view
    const camera = new THREE.PerspectiveCamera(FOV, window.innerWidth / window.innerHeight, 0.5, 60);
    const TAN_HALF = Math.tan(FOV * Math.PI / 360);
    const VIEW_HALF_H = 2.85, VIEW_MIN_HALF_W = 3.9;

    /* ---------------- lights ---------------- */
    LIGHT_RIG.forEach(function (L) {
      const light = new THREE.DirectionalLight(new THREE.Color(L.color[0], L.color[1], L.color[2]), L.power * 1.35);
      light.position.set(L.dir[0] * 12, L.dir[1] * 12, L.dir[2] * 12);
      light.name = L.name;
      scene.add(light);
    });
    scene.add(new THREE.AmbientLight(new THREE.Color(0.10, 0.12, 0.16), 1.0));

    /* ---------------- shared uniforms ---------------- */
    const U = {
      uT0: { value: new THREE.Vector4() },
      uA0: { value: new THREE.Vector4() },
      uAd: { value: new THREE.Vector4() },
      uRipple: { value: new THREE.Vector4() },
      uFront: { value: 0 },
      uTubeFade: { value: 1 },
      uBodyFade: { value: 1 },
      uPxK: { value: 1 },
      uExposure: { value: 1.0 },
      uLDir: { value: LIGHT_RIG.map(function (L) { return new THREE.Vector3().fromArray(L.dir); }) },
      uLRgt: { value: LIGHT_RIG.map(function (L) { return new THREE.Vector3().fromArray(L.right); }) },
      uLUp: { value: LIGHT_RIG.map(function (L) { return new THREE.Vector3().fromArray(L.up); }) },
      uLCol: { value: LIGHT_RIG.map(function (L) { return new THREE.Vector3().fromArray(L.rad); }) },
      uLSize: { value: LIGHT_RIG.map(function (L) { return new THREE.Vector2(L.size[0], L.size[1]); }) },
      uLSoft: { value: LIGHT_RIG.map(function (L) { return L.soft; }) },
      uBoxScale: { value: new THREE.Vector2(1, 1) },
      uAmbTop: { value: new THREE.Vector3(0.035, 0.042, 0.055) },
      uAmbBot: { value: new THREE.Vector3(0.012, 0.012, 0.016) }
    };
    const withShared = function (extra) { return Object.assign({}, U, extra || {}); };

    /* ---------------- latex membrane (Y-lathe) ---------------- */
    const skinPts = [];
    (function () {
      // rows: cosine-spaced, with extra resolution around the impact height
      const NB = lod(190), M = 2400, cdf = new Float64Array(M + 1);
      const uOf = function (s) { return 0.5 - 0.5 * Math.cos(Math.PI * s); };
      for (let i = 1; i <= M; i++) {
        const u = uOf((i - 0.5) / M);
        cdf[i] = cdf[i - 1] + 1 + 2.4 * Math.exp(-Math.pow((u - U_IMPACT) / 0.065, 2));
      }
      for (let j = 0; j <= NB; j++) {
        const target = cdf[M] * j / NB;
        let lo = 0, hi = M;
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cdf[m] <= target) lo = m; else hi = m; }
        const u = uOf((lo + (target - cdf[lo]) / (cdf[hi] - cdf[lo])) / M);
        const n = bodyNormal2D(u);
        let r = bodyRadius(u) + SKIN_GAP * n[0];
        const y = Y_BOT + u * BODY_H + SKIN_GAP * n[1];
        r = Math.hypot(r, R_NECK * smoothstep(0.80, 0.985, u));
        skinPts.push({ r: j === 0 ? 0 : r, y: y });
      }
      const yTop = skinPts[skinPts.length - 1].y;
      for (let j = 1; j <= 6; j++) skinPts.push({ r: R_NECK, y: yTop + NECK_LEN * j / 6 });
    })();
    const Y_NECK_TOP = skinPts[skinPts.length - 1].y;
    const Y_SKIN_BOT = skinPts[0].y;

    function buildLatheY(pts, segs, dense) {
      // dense > 0 packs meridians towards phi = 0 (the impact side): phi(s) = 2pi s - dense sin(2pi s)
      const rows = pts.length, cols = segs + 1, count = rows * cols;
      const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3);
      const uv = new Float32Array(count * 2), arc = new Float32Array(count);
      const arcs = [0];
      for (let j = 1; j < rows; j++) arcs[j] = arcs[j - 1] + Math.hypot(pts[j].r - pts[j - 1].r, pts[j].y - pts[j - 1].y);
      for (let j = 0; j < rows; j++) {
        const a = pts[Math.max(j - 1, 0)], b = pts[Math.min(j + 1, rows - 1)];
        const tr = b.r - a.r, ty = b.y - a.y, l = Math.hypot(tr, ty) || 1;
        const nr = ty / l, ny = -tr / l;
        for (let k = 0; k < cols; k++) {
          const phi = TAU * k / segs - (dense || 0) * Math.sin(TAU * k / segs);
          const c = Math.cos(phi), s = Math.sin(phi), i = j * cols + k;
          pos[i * 3] = pts[j].r * c; pos[i * 3 + 1] = pts[j].y; pos[i * 3 + 2] = pts[j].r * s;
          nor[i * 3] = nr * c; nor[i * 3 + 1] = ny; nor[i * 3 + 2] = nr * s;
          uv[i * 2] = phi / TAU; uv[i * 2 + 1] = j / (rows - 1);
          arc[i] = arcs[j];
        }
      }
      const idx = new (count > 65535 ? Uint32Array : Uint16Array)((rows - 1) * segs * 6);
      let p = 0;
      for (let j = 0; j < rows - 1; j++) for (let k = 0; k < segs; k++) {
        const a = j * cols + k, b = (j + 1) * cols + k, c = a + 1, d = b + 1;
        idx[p++] = a; idx[p++] = b; idx[p++] = c; idx[p++] = b; idx[p++] = d; idx[p++] = c;
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
      g.setAttribute('aArc', new THREE.BufferAttribute(arc, 1));
      g.setIndex(new THREE.BufferAttribute(idx, 1));
      g.userData.arcs = arcs;
      return g;
    }
    const skinGeo = buildLatheY(skinPts, lod(224), 0.72);
    // inner face of the far wall (only glimpsed through the tear and the water): coarse grid
    const skinFarGeo = buildLatheY(skinPts.filter(function (p, j) {
      return j % 3 === 0 || j >= skinPts.length - 7;
    }), lod(84), 0.3);

    // impact station on the skin + retraction speed (must clear the whole membrane by T_SKIN_END)
    (function () {
      const arcs = skinGeo.userData.arcs;
      let mMax = 0;
      for (let j = 1; j < skinPts.length; j++) {
        if (skinPts[j - 1].y <= 0 && skinPts[j].y > 0) {
          ARC_I = lerp(arcs[j - 1], arcs[j], (0 - skinPts[j - 1].y) / (skinPts[j].y - skinPts[j - 1].y));
        }
      }
      for (let j = 0; j < skinPts.length; j++) {
        mMax = Math.max(mMax, Math.hypot(TEAR_KH * skinPts[j].r * Math.PI, arcs[j] - ARC_I));
      }
      // 0.12 covers the ragged-edge noise so nothing is left over; kept at 3-5x the fluid speed
      SKIN_SPEED = clamp((mMax + 0.12) / (T_SKIN_END - T_PUNCT - 0.02), 3.0 * FLUID_SPEED, 5.0 * FLUID_SPEED);
    })();
    const T_SCRAP = T_PUNCT + ARC_I / SKIN_SPEED;       // lower tear front reaches the nipple
    const T_RELEASE = T_SKIN_END - 0.07;                // upper tear front reaches the tether knot
    const T_BODY_GONE = T_BRK0 + T_BRK1 + 0.25;         // every sheet has ruptured into droplets

    const DEFS = glslDefines();
    const VS_COMMON = DEFS + GLSL_UTIL + GLSL_FIELD + GLSL_DEFORM;
    const FS_COMMON = DEFS + GLSL_UTIL + GLSL_ENV;

    const LATEX = new THREE.Color('#e61c24').convertSRGBToLinear();      // deep crimson
    const latexUniforms = function (side, solid) {
      return withShared({
        uSide: { value: side },
        uSolid: { value: solid },
        uLatex: { value: new THREE.Vector3(LATEX.r, LATEX.g, LATEX.b) },
        uLatexDeep: { value: new THREE.Vector3(LATEX.r * 0.42, LATEX.g * 0.30, LATEX.b * 0.40) },
        uLatexGlow: { value: new THREE.Vector3(1.0, 0.020, 0.026) }
      });
    };
    const skinFront = new THREE.Mesh(skinGeo, new THREE.ShaderMaterial({
      uniforms: latexUniforms(1, 0), vertexShader: VS_COMMON + SKIN_VS, fragmentShader: FS_COMMON + LATEX_FS,
      transparent: true, depthWrite: false, side: THREE.FrontSide
    }));
    const skinBack = new THREE.Mesh(skinFarGeo, new THREE.ShaderMaterial({

    /* ---------------- procedural sprites (detached 2D canvases) ---------------- */
    function dropletOptics(nx, ny, nz) {               // light response of a water sphere, view along -Z
      const F = 0.02 + 0.98 * Math.pow(1 - nz, 5);
      const R = [2 * nz * nx, 2 * nz * ny, 2 * nz * nz - 1];
      const eta = 1 / 1.33;

      const k2 = Math.max(0, 1 - 1.33 * 1.33 * (1 - ci * ci));
      const b = Math.sqrt(k2) - 1.33 * ci;

      const mg = 0.050 * Math.pow(clamp(nx * 1.2 + ny * 0.10 - 0.12, 0, 1), 2.2) * band;
      return [out[0] + amb + caus, out[2] + amb + cy, out[3] + amb + mg];
    }
    // One detached 2D canvas holds every sprite (never appended to the DOM):

    function makeSpriteAtlas() {

      const img = ctx.createImageData(S, S), d = img.data;
      for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {

        for (let sy = 0; sy < SS; sy++) for (let sx = 0; sx < SS; sx++) {

        d[o] = 255 * Math.sqrt(Math.min(1, rr * k));
        d[o + 1] = 255 * Math.sqrt(Math.min(1, gg * k));
        d[o + 2] = 255 * Math.sqrt(Math.min(1, bb * k));
        d[o + 3] = 255;

      });

          v += amp * lerp(lerp(g[y0 * m + x0], g[y0 * m + x1], sx), lerp(g[y1 * m + x0], g[y1 * m + x1], sx), sy);
          tot += amp;
          amp *= 0.5;
        }
        const o = (y * S + x) * 4;
        f[o] = 0; f[o + 1] = 255 * clamp(v / tot, 0, 1); f[o + 2] = 0; f[o + 3] = 255;

      ctx.rect(FX0, 0, S, S);
      ctx.clip();

        g.addColorStop(0, 'rgba(255,0,0,' + b.toFixed(3) + ')');
        g.addColorStop(0.55, 'rgba(255,0,0,' + (b * 0.6).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,0,0,0)');

        ctx.beginPath();
        ctx.arc(x, y, rad, 0, TAU);
        ctx.fill();

      ctx.restore();
