  // 12. TIMELINE, 5-STATE MACHINE & PLAYBACK CONTROLS
  // ============================================================================
  const DURATION = 8.000;
  const STATES = {
    COUNTDOWN: 'COUNTDOWN',
    PLAYING: 'PLAYING',
    PAUSED: 'PAUSED',
    REFIRE_HOLD: 'REFIRE_HOLD',
    ENDED: 'ENDED'
  };

  const countdownEl = document.getElementById('countdown');
  const btnRefire = document.getElementById('btn-refire');
  const btnToggle = document.getElementById('btn-toggle');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const speedPills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));
  const scrubber = document.getElementById('scrubber');

  let state = STATES.COUNTDOWN;
  let simTime = 0.000;
  let playbackSpeed = 1.0;
  let countdownElapsed = 0.000;
  let holdElapsed = 0.000;
  let lastWallTime = null;

  function setToggleIconState(isPauseIcon) {
    if (isPauseIcon) {
      iconPause.style.display = '';
      iconPlay.style.display = 'none';
      btnToggle.setAttribute('aria-label', 'Pause');
    } else {
      iconPause.style.display = 'none';
      iconPlay.style.display = '';
      btnToggle.setAttribute('aria-label', 'Play');
    }
  }

  function hideCountdown() {
    countdownEl.style.display = 'none';
    countdownEl.textContent = '';
  }

  // 1. Render initial resting scene (simTime = 0.000) before starting COUNTDOWN on first rAF
  simTime = 0.000;
  scrubber.value = '0';
  countdownEl.style.display = 'block';
  countdownEl.textContent = '3';
  setToggleIconState(true);
  renderAt(0.000);

  // 3. Play / Pause Toggle (#btn-toggle)
  btnToggle.addEventListener('click', function () {
    if (state === STATES.PLAYING) {
      state = STATES.PAUSED;
      setToggleIconState(false);
    } else if (state === STATES.COUNTDOWN || state === STATES.REFIRE_HOLD) {
      countdownElapsed = 0.000;
      holdElapsed = 0.000;
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0';
      state = STATES.PAUSED;
      setToggleIconState(false);
      renderAt(0.000);
    } else if (state === STATES.PAUSED) {
      state = STATES.PLAYING;
      setToggleIconState(true);
    } else if (state === STATES.ENDED) {
      hideCountdown();
      simTime = 0.000;
      scrubber.value = '0';
      state = STATES.PLAYING;
      setToggleIconState(true);
      renderAt(0.000);
    }
  });

  // 4. Speed Selector Pills (.speed-pill)
  speedPills.forEach(function (pill) {
    pill.addEventListener('click', function () {
      const spd = parseFloat(pill.getAttribute('data-speed'));
      if (!isNaN(spd)) {
        playbackSpeed = spd;
      }
      speedPills.forEach(function (p) {
        const active = p === pill;
        p.classList.toggle('is-active', active);
        p.setAttribute('aria-checked', active ? 'true' : 'false');
      });
    });
  });

  // 5. Scrubbing Slider (#scrubber)
  scrubber.addEventListener('input', function () {
    if (state === STATES.COUNTDOWN || state === STATES.REFIRE_HOLD) {
      countdownElapsed = 0.000;
      holdElapsed = 0.000;
    }
    hideCountdown();
    simTime = clamp(parseFloat(scrubber.value) || 0.000, 0.000, DURATION);
    state = STATES.PAUSED;
    setToggleIconState(false);
    renderAt(simTime);
  });

  // 6. Silent Re-Fire (#btn-refire -> REFIRE_HOLD State)
  btnRefire.addEventListener('click', function () {
    countdownElapsed = 0.000;
    holdElapsed = 0.000;
    hideCountdown();
    simTime = 0.000;
    scrubber.value = '0';
    state = STATES.REFIRE_HOLD;
    setToggleIconState(true);
    renderAt(0.000);
  });

  // Main Animation Loop
  function onAnimationFrame(now) {
    requestAnimationFrame(onAnimationFrame);

    if (lastWallTime === null) {
      // First requestAnimationFrame callback after initial resting scene has rendered
      lastWallTime = now;
      countdownElapsed = 0.000;
      return;
    }

    const EPS = 1e-7;
    const rawDt = Math.max(0.000, (now - lastWallTime) * 0.001);
    lastWallTime = now;
    const dt = clamp(rawDt, 0.000, 0.100);

    if (state === STATES.COUNTDOWN) {
      countdownElapsed += rawDt;
      if (countdownElapsed < 1.000 - EPS) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '3';
        simTime = 0.000;
        scrubber.value = '0';
      } else if (countdownElapsed < 2.000 - EPS) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '2';
        simTime = 0.000;
        scrubber.value = '0';
      } else if (countdownElapsed < 3.000 - EPS) {
        countdownEl.style.display = 'block';
        countdownEl.textContent = '1';
        simTime = 0.000;
        scrubber.value = '0';
      } else {
        const overflow = clamp(countdownElapsed - 3.000, 0.000, dt);
        hideCountdown();
        state = STATES.PLAYING;
        setToggleIconState(true);
        simTime = Math.min(DURATION, overflow * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    } else if (state === STATES.REFIRE_HOLD) {
      hideCountdown();
      holdElapsed += rawDt;
      if (holdElapsed >= 1.000 - EPS) {
        const overflow = clamp(holdElapsed - 1.000, 0.000, dt);
        state = STATES.PLAYING;
        setToggleIconState(true);
        simTime = Math.min(DURATION, overflow * playbackSpeed);
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    } else if (state === STATES.PLAYING) {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION - EPS) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAt(simTime);
        state = STATES.ENDED;
        setToggleIconState(false);
      } else {
        scrubber.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    }
  }

  requestAnimationFrame(onAnimationFrame);
})();
</script>
</body>
