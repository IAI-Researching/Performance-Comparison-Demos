  // Deformable Bullet Analytical Update Function
  function restorePristineBullet() {
    if (!bulletMesh.userData.wasDeformed) return;
    var posAttr = bulletGeo.attributes.position;
    var colAttr = bulletGeo.attributes.color;
    var posArr = posAttr.array;
    for (var i = 0; i < bulletVertCount; i++) {
      var u0 = bulletBaseU[i];
      var th0 = bulletBaseTheta[i];
      var r0 = bulletBaseRad[i];
      posArr[i * 3 + 0] = u0 * BULLET_LEN;
      posArr[i * 3 + 1] = Math.cos(th0) * r0;
      posArr[i * 3 + 2] = Math.sin(th0) * r0;
    }
    colAttr.array.set(bulletBaseColors);
    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    bulletGeo.computeVertexNormals();
    bulletMesh.userData.wasDeformed = false;
  }

  function updateBulletAt(simTime) {
    var posAttr = bulletGeo.attributes.position;
    var colAttr = bulletGeo.attributes.color;
    var posArr = posAttr.array;
    var colArr = colAttr.array;

    if (simTime < 1.200) {
      bulletMesh.visible = true;
      var frac = clamp(simTime / 1.200, 0.0, 1.0);
      var noseX = lerp(BULLET_START_X, BULLET_IMPACT_X, frac);
      var spin = simTime * 92.0;

      restorePristineBullet();
      bulletMesh.position.set(noseX, BULLET_Y, BULLET_Z);
      bulletMesh.rotation.set(spin, 0, 0);

      machConeMesh.visible = true;
      machConeMesh.position.set(noseX + 0.08, BULLET_Y, BULLET_Z);
      machConeMat.uniforms.uOpacity.value = 0.24 * smoothstep(0.02, 0.18, simTime);
      return;
    }

    machConeMesh.visible = false;
    machConeMesh.position.set(BULLET_IMPACT_X + 0.08, BULLET_Y, BULLET_Z);
    machConeMat.uniforms.uOpacity.value = 0.0;
    var dt = simTime - 1.200;

    // Hide once well off-screen below viewport (with canonical transform & pristine buffer reset)
    if (dt > 2.55) {
      restorePristineBullet();
      bulletMesh.visible = false;
      bulletMesh.position.set(BULLET_IMPACT_X, -12.0, BULLET_Z);
      bulletMesh.rotation.set(0, 0, 0);
      return;
    }
    bulletMesh.visible = true;
    bulletMesh.userData.wasDeformed = true;

    // Plastic crushing & mushrooming occurs rapidly between 1.200s and 1.480s
    var crushLin = clamp(dt / 0.280, 0.0, 1.0);
    var crush = 1.0 - Math.pow(1.0 - crushLin, 2.6);

    // Glancing rebound + gravitational drop after crush arrest
    var dtReb = Math.max(0.0, dt - 0.200);
    var slugOffsetX = 0.56 * dtReb;
    var slugOffsetY = -0.48 * dtReb - 1.65 * dtReb * dtReb;
    var slugOffsetZ = 0.16 * dtReb;

    var spinBase = 1.200 * 92.0 + 18.0 * (1.0 - Math.exp(-dt * 5.0));
    var tumblePitch = dtReb * 2.8;
    var tumbleYaw = -dtReb * 1.9;

    // World center of the bulb at impact time (including drop elastic flex!)
    var flexBulb = getDropFlexOffset(S_BULB_EQ, simTime, new THREE.Vector3());
    var bx = bulbCenter.x + flexBulb.x;
    var by = bulbCenter.y + flexBulb.y;
    var bz = bulbCenter.z + flexBulb.z;
    var minSafeR = R_BULB_MAX + 0.008;

    for (var k = 0; k < bulletVertCount; k++) {
      var u = bulletBaseU[k];
      var th = bulletBaseTheta[k] + spinBase * (1.0 - 0.65 * crush);
      var rOrig = bulletBaseRad[k];
      var petal = bulletPetalNoise[k];

      // Axial crushing: front nose flattens completely, rear compresses to ~34% length
      var frontWeight = Math.pow(1.0 - u, 1.55);
      var xLocal = u * BULLET_LEN * (1.0 - 0.67 * crush);

      // Radial plastic extrusion into jagged curled mushroom skirt
      var mushroomBell = Math.exp(-Math.pow(u / 0.58, 1.8));
      var rDeformed = rOrig + crush * 0.40 * mushroomBell * petal;

      // Outer mushroom petals curl backward (+X) around the convex bulb surface
      var curlBack = crush * 0.16 * Math.pow(mushroomBell, 1.4) * Math.max(0.0, petal - 0.72);
      xLocal += curlBack;

      var yLocal = Math.cos(th) * rDeformed;
      var zLocal = Math.sin(th) * rDeformed;

      // While in contact with bulb (dt < 0.30s), mold front surface strictly outside glass bulb sphere
      if (dt < 0.34) {
        var wx = BULLET_IMPACT_X + slugOffsetX + xLocal - bx;
        var wy = BULLET_Y + slugOffsetY + yLocal - by;
        var wz = BULLET_Z + slugOffsetZ + zLocal - bz;
        var distSq = wx * wx + wy * wy + wz * wz;
        if (distSq < minSafeR * minSafeR) {
          var dist = Math.sqrt(Math.max(1e-6, distSq));
          var push = minSafeR / dist;
          xLocal = (bx + wx * push) - (BULLET_IMPACT_X + slugOffsetX);
          yLocal = (by + wy * push) - (BULLET_Y + slugOffsetY);
          zLocal = (bz + wz * push) - (BULLET_Z + slugOffsetZ);
        }
      }

      posArr[k * 3 + 0] = xLocal;
      posArr[k * 3 + 1] = yLocal;
      posArr[k * 3 + 2] = zLocal;

      // Freshly sheared lead on mushroom skirt brightens metallically
      if (u < 0.72) {
        var gleam = crush * mushroomBell * 0.34;
        colArr[k * 3 + 0] = bulletBaseColors[k * 3 + 0] + gleam;
        colArr[k * 3 + 1] = bulletBaseColors[k * 3 + 1] + gleam * 1.02;
        colArr[k * 3 + 2] = bulletBaseColors[k * 3 + 2] + gleam * 1.06;
      }
    }

    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    bulletGeo.computeVertexNormals();

    bulletMesh.position.set(BULLET_IMPACT_X + slugOffsetX, BULLET_Y + slugOffsetY, BULLET_Z + slugOffsetZ);
    bulletMesh.rotation.set(0.35 * dtReb, tumbleYaw, tumblePitch);
  }

  // Radial Metallic Lead/Copper Spall Droplets & Fragments (GPU Analytical InstancedMesh)
  var SPALL_COUNT = 560;
  var spallUniforms = {
    uEnvCube: { value: studioEnv.cubeTexture },
    uSimTime: { value: 0.0 },
    uBulbCenter: { value: bulbCenter.clone() },
    uBulbRad: { value: R_BULB_MAX + 0.025 }
  };

  var spallMesh = (function buildSpallSystem() {
    var baseGeo = new THREE.OctahedronGeometry(1.0, 0);
    baseGeo.scale(1.5, 0.55, 0.95);
    var instGeo = baseGeo.toNonIndexed();
    instGeo.computeVertexNormals();
    baseGeo.dispose();

    var aBirth = new Float32Array(SPALL_COUNT);
    var aOrigin = new Float32Array(SPALL_COUNT * 3);
    var aVel = new Float32Array(SPALL_COUNT * 3);
    var aSpin = new Float32Array(SPALL_COUNT * 4);
    var aScale = new Float32Array(SPALL_COUNT * 3);
    var aTint = new Float32Array(SPALL_COUNT * 3);

    for (var i = 0; i < SPALL_COUNT; i++) {
      var birth = 1.202 + Math.pow(rng(), 1.4) * 0.235;
      aBirth[i] = birth;

      var phi = rng() * Math.PI * 2.0;
      var ringR = 0.06 + rng() * 0.24;
      var oy = BULLET_Y + Math.cos(phi) * ringR;
      var oz = BULLET_Z + Math.sin(phi) * ringR;
      var ox = BULLET_IMPACT_X + 0.03 + rng() * 0.06;
      aOrigin[i * 3 + 0] = ox;
      aOrigin[i * 3 + 1] = oy;
      aOrigin[i * 3 + 2] = oz;

      // Splash crown tangent to the spherical glass bulb
      var speed = 2.1 + Math.pow(rng(), 0.7) * 5.8;
      var coneAngle = -0.22 + rng() * 0.68; // Slightly glancing past/away from bulb
      var vx = Math.sin(coneAngle) * speed;
      var vr = Math.cos(coneAngle) * speed;
      aVel[i * 3 + 0] = vx;
      aVel[i * 3 + 1] = Math.cos(phi) * vr;
      aVel[i * 3 + 2] = Math.sin(phi) * vr;

      var ax = rng() - 0.5, ay = rng() - 0.5, az = rng() - 0.5;
      var alen = Math.sqrt(ax * ax + ay * ay + az * az) || 1.0;
      aSpin[i * 4 + 0] = ax / alen;
      aSpin[i * 4 + 1] = ay / alen;
      aSpin[i * 4 + 2] = az / alen;
      aSpin[i * 4 + 3] = (8.0 + rng() * 26.0) * (rng() < 0.5 ? 1.0 : -1.0);

      var sz = 0.012 + Math.pow(rng(), 2.2) * 0.042;
      aScale[i * 3 + 0] = sz * (0.8 + rng() * 1.4);
      aScale[i * 3 + 1] = sz * (0.4 + rng() * 0.6);
      aScale[i * 3 + 2] = sz * (0.7 + rng() * 0.9);

      var isCopper = (rng() < 0.18);
      if (isCopper) {
        aTint[i * 3 + 0] = 0.88;
        aTint[i * 3 + 1] = 0.50;
        aTint[i * 3 + 2] = 0.28;
      } else {
        var b = 0.68 + rng() * 0.26;
        aTint[i * 3 + 0] = b * 0.95;
        aTint[i * 3 + 1] = b * 0.99;
        aTint[i * 3 + 2] = b * 1.06;
      }
    }

    instGeo.setAttribute('aBirth', new THREE.InstancedBufferAttribute(aBirth, 1));
    instGeo.setAttribute('aOrigin', new THREE.InstancedBufferAttribute(aOrigin, 3));
    instGeo.setAttribute('aVel', new THREE.InstancedBufferAttribute(aVel, 3));
    instGeo.setAttribute('aSpin', new THREE.InstancedBufferAttribute(aSpin, 4));
    instGeo.setAttribute('aScale', new THREE.InstancedBufferAttribute(aScale, 3));
    instGeo.setAttribute('aTint', new THREE.InstancedBufferAttribute(aTint, 3));

    var mat = new THREE.ShaderMaterial({
      uniforms: spallUniforms,
      vertexShader: [
        'attribute float aBirth;',
        'attribute vec3 aOrigin;',
        'attribute vec3 aVel;',
        'attribute vec4 aSpin;',
        'attribute vec3 aScale;',
        'attribute vec3 aTint;',
        'uniform float uSimTime;',
        'uniform vec3 uBulbCenter;',
        'uniform float uBulbRad;',
        'varying vec3 vWorldNormal;',
        'varying vec3 vWorldPos;',
        'varying vec3 vTint;',
        'varying float vHeat;',
        '',
        'vec3 rotateAxis(vec3 v, vec3 axis, float ang) {',
        '  float c = cos(ang);',
        '  float s = sin(ang);',
        '  return v * c + cross(axis, v) * s + axis * dot(axis, v) * (1.0 - c);',
        '}',
        '',
        'void main() {',
        '  float age = uSimTime - aBirth;',
        '  if (age < 0.0 || age > 2.2) {',
        '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
        '    return;',
        '  }',
        '  float drag = 1.35;',
        '  float dFactor = (1.0 - exp(-drag * age)) / drag;',
        '  vec3 center = aOrigin + aVel * dFactor + vec3(0.0, -1.55 * age * age, 0.0);',
        '',
        '  // Analytical sphere deflection so spall skims cleanly around the intact glass bulb',
        '  vec3 rel = center - uBulbCenter;',
        '  float dist = length(rel);',
        '  if (dist < uBulbRad) {',
        '    center = uBulbCenter + (rel / max(dist, 1e-4)) * uBulbRad;',
        '  }',
        '',
        '  float shrink = 1.0 - smoothstep(1.6, 2.2, age);',
        '  vec3 localP = position * aScale * shrink;',
        '  float ang = age * aSpin.w;',
        '  vec3 rotP = rotateAxis(localP, aSpin.xyz, ang);',
        '  vec3 rotN = rotateAxis(normal, aSpin.xyz, ang);',
        '',
        '  vec4 wp = modelMatrix * vec4(center + rotP, 1.0);',
        '  vWorldPos = wp.xyz;',
        '  vWorldNormal = normalize((modelMatrix * vec4(rotN, 0.0)).xyz);',
        '  vTint = aTint;',
        '  vHeat = exp(-age * 9.0);',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform samplerCube uEnvCube;',
        'varying vec3 vWorldNormal;',
        'varying vec3 vWorldPos;',
        'varying vec3 vTint;',
        'varying float vHeat;',
        'void main() {',
        '  vec3 N = normalize(vWorldNormal);',
        '  vec3 V = normalize(cameraPosition - vWorldPos);',
        '  vec3 R = reflect(-V, N);',
        '  vec3 env = textureCube(uEnvCube, R, 1.2).rgb;',
        '  float diff = max(dot(N, normalize(vec3(-0.5, 0.7, 0.6))), 0.0) * 0.65 + 0.25;',
        '  vec3 col = vTint * (env * 1.25 + diff * 0.45);',
        '  col += vec3(1.0, 0.62, 0.22) * vHeat * 0.55;',
        '  col = clamp(col, 0.0, 1.0);',
        '  col = pow(col, vec3(1.0 / 2.2));',
        '  gl_FragColor = vec4(col, 1.0);',
        '}'
      ].join('\n')
    });

    var mesh = new THREE.InstancedMesh(instGeo, mat, SPALL_COUNT);
    var idMat = new THREE.Matrix4();
    for (var m = 0; m < SPALL_COUNT; m++) {
      mesh.setMatrixAt(m, idMat);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    scene.add(mesh);
    return mesh;
  })();

  // Kinetic Friction & Triboluminescence Micro-Spark Streaks (GPU Analytical InstancedMesh)
  var SPARK_COUNT = 260; // 0..159 = bullet impact sparks, 160..259 = tail snip triboluminescence sparks
  var sparkUniforms = {
    uSimTime: { value: 0.0 }
  };

  (function buildMicroSparks() {
    var instGeo = new THREE.PlaneGeometry(1.0, 1.0);

    var aBirth = new Float32Array(SPARK_COUNT);
    var aLife = new Float32Array(SPARK_COUNT);
    var aOrigin = new Float32Array(SPARK_COUNT * 3);
    var aVel = new Float32Array(SPARK_COUNT * 3);
    var aColor = new Float32Array(SPARK_COUNT * 3);

    for (var i = 0; i < SPARK_COUNT; i++) {
      var isSnip = (i >= 160);
      if (!isSnip) {
        aBirth[i] = 1.200 + rng() * 0.14;
        aLife[i] = 0.18 + rng() * 0.34;
        aOrigin[i * 3 + 0] = impactPoint.x + 0.02;
        aOrigin[i * 3 + 1] = impactPoint.y + (rng() - 0.5) * 0.12;
        aOrigin[i * 3 + 2] = impactPoint.z + (rng() - 0.5) * 0.12;
        var ang = rng() * Math.PI * 2.0;
        var spd = 3.2 + rng() * 6.5;
        aVel[i * 3 + 0] = (0.15 + rng() * 0.75) * spd;
        aVel[i * 3 + 1] = Math.cos(ang) * spd;
        aVel[i * 3 + 2] = Math.sin(ang) * spd * 0.7;
        aColor[i * 3 + 0] = 1.0;
        aColor[i * 3 + 1] = 0.76 + rng() * 0.22;
        aColor[i * 3 + 2] = 0.45 + rng() * 0.35;
      } else {
        aBirth[i] = T_SNIP_BITE + rng() * 0.08;
        aLife[i] = 0.16 + rng() * 0.28;
        aOrigin[i * 3 + 0] = cutPoint.x + (rng() - 0.5) * 0.04;
        aOrigin[i * 3 + 1] = cutPoint.y + (rng() - 0.5) * 0.04;
        aOrigin[i * 3 + 2] = cutPoint.z + (rng() - 0.5) * 0.04;
        var uAng = rng() * Math.PI * 2.0;
        var zAng = (rng() - 0.5) * 2.0;
        var rHoriz = Math.sqrt(Math.max(0.0, 1.0 - zAng * zAng));
        var sSpd = 1.4 + rng() * 3.8;
        aVel[i * 3 + 0] = Math.cos(uAng) * rHoriz * sSpd;
        aVel[i * 3 + 1] = Math.sin(uAng) * rHoriz * sSpd;
        aVel[i * 3 + 2] = zAng * sSpd;
        aColor[i * 3 + 0] = 0.68 + rng() * 0.32;
        aColor[i * 3 + 1] = 0.88 + rng() * 0.12;
        aColor[i * 3 + 2] = 1.0;
      }
    }

    instGeo.setAttribute('aBirth', new THREE.InstancedBufferAttribute(aBirth, 1));
    instGeo.setAttribute('aLife', new THREE.InstancedBufferAttribute(aLife, 1));
    instGeo.setAttribute('aOrigin', new THREE.InstancedBufferAttribute(aOrigin, 3));
    instGeo.setAttribute('aVel', new THREE.InstancedBufferAttribute(aVel, 3));
    instGeo.setAttribute('aColor', new THREE.InstancedBufferAttribute(aColor, 3));

    var mat = configureAdditiveBlend(new THREE.ShaderMaterial({
      uniforms: sparkUniforms,
      vertexShader: [
        'attribute float aBirth;',
        'attribute float aLife;',
        'attribute vec3 aOrigin;',
        'attribute vec3 aVel;',
        'attribute vec3 aColor;',
        'uniform float uSimTime;',
        'varying vec2 vUv;',
        'varying vec3 vColor;',
        'varying float vAlpha;',
        'void main() {',
        '  float age = uSimTime - aBirth;',
        '  if (age < 0.0 || age > aLife) {',
        '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
        '    return;',
        '  }',
        '  float u = age / aLife;',
        '  vAlpha = (1.0 - u) * (1.0 - u);',
        '  vColor = aColor;',
        '  vUv = uv;',
        '  float drag = 3.2;',
        '  vec3 pNow = aOrigin + aVel * ((1.0 - exp(-drag * age)) / drag) + vec3(0.0, -1.2 * age * age, 0.0);',
        '  vec3 vNow = aVel * exp(-drag * age) + vec3(0.0, -2.4 * age, 0.0);',
        '  vec3 dir = normalize(vec3(vNow.xy, 0.0) + vec3(1e-4, 0.0, 0.0));',
        '  vec3 perp = vec3(-dir.y, dir.x, 0.0);',
        '  float len = clamp(length(vNow) * 0.032, 0.02, 0.18);',
        '  float wid = 0.011;',
        '  vec3 worldP = pNow + dir * (position.x * len) + perp * (position.y * wid);',
        '  gl_Position = projectionMatrix * viewMatrix * vec4(worldP, 1.0);',
        '}'
      ].join('\n'),
      fragmentShader: [
        'varying vec2 vUv;',
        'varying vec3 vColor;',
        'varying float vAlpha;',
        'void main() {',
        '  float d = length((vUv - 0.5) * 2.0);',
        '  float core = smoothstep(1.0, 0.0, d);',
        '  gl_FragColor = vec4(vColor * (1.2 + core), core * core * vAlpha);',
        '}'
      ].join('\n'),
      side: THREE.DoubleSide
    }));

    var mesh = new THREE.InstancedMesh(instGeo, mat, SPARK_COUNT);
    var idMat = new THREE.Matrix4();
    for (var m = 0; m < SPARK_COUNT; m++) {
      mesh.setMatrixAt(m, idMat);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    mesh.renderOrder = 8;
    scene.add(mesh);
  })();

  // =========================================================================
  // 10. ARTICULATED BRUSHED TOOL-STEEL NIPPERS AT UPPER TAIL TIP (s = 0.895)
  // =========================================================================
  var nippersRoot = new THREE.Group();
  var nipperPivotGroup = new THREE.Group();
  var leftJawGroup = new THREE.Group();
  var rightJawGroup = new THREE.Group();
  var nippersApproachDir = new THREE.Vector3();
  var PIVOT_DIST = 0.36; // Distance from cutting tip to rivet pivot

  (function buildArticulatedNippers() {
    // Construct exact 3D orthonormal basis around P_cut so BOTH X_nip (handles) and Y_nip (jaw pinch)
    // are strictly perpendicular to cutTangent (wire passes cleanly through jaw V-gap!) while presenting
    // a clear 3/4 view to the Z-axis camera inside the central 70% frame.
    var zNip = cutTangent.clone().normalize();
    var rawApproach = new THREE.Vector3(0.58, 0.46, -0.67);
    nippersApproachDir.copy(rawApproach).addScaledVector(zNip, -rawApproach.dot(zNip)).normalize();
    var yNip = new THREE.Vector3().crossVectors(zNip, nippersApproachDir).normalize();
    var basisMat = new THREE.Matrix4().makeBasis(nippersApproachDir, yNip, zNip);
    nippersRoot.position.copy(cutPoint);
    nippersRoot.quaternion.setFromRotationMatrix(basisMat);

    // Pivot sits at +X = PIVOT_DIST in nippersRoot local space (cutting edge meets at local origin 0,0,0)
    nipperPivotGroup.position.set(PIVOT_DIST, 0, 0);
    nippersRoot.add(nipperPivotGroup);
    nipperPivotGroup.add(leftJawGroup);
    nipperPivotGroup.add(rightJawGroup);

    var steelMat = new THREE.MeshStandardMaterial({
      color: 0xaab4c4,
      metalness: 0.91,
      roughness: 0.27,
      envMapIntensity: 1.5
    });
    var bevelMat = new THREE.MeshStandardMaterial({
      color: 0xdbe4f0,
      metalness: 0.96,
      roughness: 0.14,
      envMapIntensity: 1.85
    });
    var gripMat = new THREE.MeshStandardMaterial({
      color: 0x1e2432,
      metalness: 0.25,
      roughness: 0.72,
      envMapIntensity: 0.8
    });
    var rivetMat = new THREE.MeshStandardMaterial({
      color: 0x6c7586,
      metalness: 0.92,
      roughness: 0.24,
      envMapIntensity: 1.4
    });

    // Helper to build one curved pincer jaw + handle lever around pivot (0,0,0)
    // Cutting edge tip meets cleanly at (-PIVOT_DIST, 0, 0) when jaw rotation = 0!
    function populateJaw(jawGrp, signY) {
      // 1) Curved steel cheek from pivot (0,0) arching out to ( -0.18, signY*0.13 ) then inward to (-PIVOT_DIST, 0)
      var cheekArch = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.068, 0.085), steelMat);
      cheekArch.position.set(-0.13, signY * 0.088, signY * 0.012);
      cheekArch.rotation.z = -signY * 0.42;
      jawGrp.add(cheekArch);

      // 2) Hardened curved beak tapering inward to the precision cutting edge
      var beak = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.056, 0.078), steelMat);
      beak.position.set(-0.275, signY * 0.064, 0.0);
      beak.rotation.z = signY * 0.56;
      jawGrp.add(beak);

      // 3) Ground 45-degree tool-steel cutting wedge meeting right at (-PIVOT_DIST, 0, 0)
      var bladeGeo = new THREE.ConeGeometry(0.042, 0.095, 4);
      bladeGeo.rotateY(Math.PI * 0.25);
      bladeGeo.scale(0.65, 1.0, 1.25);
      // Tip of ConeGeometry(r, h) is at +Y = +h/2; rotate so tip points to -signY at x = -PIVOT_DIST
      bladeGeo.rotateZ(signY > 0 ? Math.PI : 0.0);
      var blade = new THREE.Mesh(bladeGeo, bevelMat);
      blade.position.set(-PIVOT_DIST, signY * 0.0475, 0.0);
      jawGrp.add(blade);

      // 4) Brushed handle tang extending toward +X (crosses over pivot scissor-style: -signY side!)
      var tang = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.055, 0.068), steelMat);
      tang.position.set(0.16, -signY * 0.052, signY * 0.014);
      tang.rotation.z = -signY * 0.28;
      jawGrp.add(tang);

      // 5) Matte dark insulated ergonomic grip sleeve (compact so entire tool stays inside 70% frame)
      var sleeveGeo = new THREE.CylinderGeometry(0.036, 0.042, 0.52, 16);
      sleeveGeo.rotateZ(Math.PI * 0.5);
      var sleeve = new THREE.Mesh(sleeveGeo, gripMat);
      sleeve.position.set(0.52, -signY * 0.145, signY * 0.014);
      sleeve.rotation.z = -signY * 0.22;
      jawGrp.add(sleeve);
    }

    populateJaw(leftJawGroup, 1.0);
    populateJaw(rightJawGroup, -1.0);

    // Central lap-joint circular boss & machined pivot screw
    var lapDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.098, 0.098, 0.105, 28), steelMat);
    lapDisc.rotation.x = Math.PI * 0.5;
    nipperPivotGroup.add(lapDisc);

    var screwHead = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.125, 24), rivetMat);
    screwHead.rotation.x = Math.PI * 0.5;
    nipperPivotGroup.add(screwHead);

    var screwSlot = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.014, 0.132), gripMat);
    screwSlot.rotation.z = 0.45;
    nipperPivotGroup.add(screwSlot);

    scene.add(nippersRoot);
  })();

  function updateNippersAt(simTime) {
    // Phase 1 & 2 (0.000s - 2.600s): Poised slightly retracted with jaws open 24 deg
    // Phase 3     (2.600s - 3.800s): Glides onto tail tip and closes jaws down to glass contact (4.5 deg)
    // Phase 4     (3.800s - 4.400s): Squeezes flush shut (0.0 deg at 4.050s), severing the tail!
    // Phase 5 & 6 (4.400s - 8.000s): Subtle post-cut recoil & slight jaw relaxation
    var approachT = smootherstep(2.600, 3.550, simTime);
    var postCutRecoil = smootherstep(4.120, 4.950, simTime);
    var retractDist = 0.24 * (1.0 - approachT) + 0.14 * postCutRecoil;

    var jawHalfAngle;
    if (simTime < 2.600) {
      jawHalfAngle = 0.36;
    } else if (simTime < 3.800) {
      var close1 = smootherstep(2.650, 3.800, simTime);
      jawHalfAngle = lerp(0.36, 0.078, close1); // Contacts thin glass tail at 3.800s
    } else if (simTime < T_SNIP_BITE) {
      var bite = smootherstep(3.800, T_SNIP_BITE, simTime);
      jawHalfAngle = lerp(0.078, 0.0, bite); // Flush sever at 4.050s!
    } else if (simTime < 4.350) {
      jawHalfAngle = 0.0;
    } else {
      jawHalfAngle = 0.09 * smootherstep(4.350, 5.100, simTime);
    }

    // Offset along nippersApproachDir (+X_local away from cutPoint)
    nippersRoot.position.copy(cutPoint).addScaledVector(nippersApproachDir, retractDist);

    // Rotating (-PIVOT_DIST, 0) by -angle moves y to +PIVOT_DIST*sin(angle) (+Y = open)
    leftJawGroup.rotation.z = -jawHalfAngle;
    rightJawGroup.rotation.z = jawHalfAngle;
  }

  // =========================================================================
  // 11. PRE-SEEDED CRYSTALLINE GLASS NEEDLES, SHELL PRISMS & SILICA DUST
  // =========================================================================
  var shardUniforms = {
    uEnvCube: { value: studioEnv.cubeTexture },
    uSimTime: { value: 0.0 },
    uWaveEndTime: { value: T_WAVE_END }
  };

  // Shared GLSL for analytical supersonic birth + Phase 6 catastrophic burst + gravitational drift
  var shardVertShader = [
    'attribute float aBirth;',
    'attribute vec3 aOrigin;',
    'attribute vec3 aVelWave;',
    'attribute vec3 aVelBurst;',
    'attribute vec4 aQuat0;',
    'attribute vec4 aSpin;',
    'attribute vec3 aScale;',
    'attribute vec3 aOptical;', // x = birefringent hue phase, y = gravity scale, z = white flash duration
    '',
    'uniform float uSimTime;',
    'uniform float uWaveEndTime;',
    '',
    'varying vec3 vWorldPos;',
    'varying vec3 vWorldNormal;',
    'varying float vAge;',
    'varying vec3 vOptical;',
    '',
    'vec3 quatRotate(vec4 q, vec3 v) {',
    '  return v + 2.0 * cross(q.xyz, cross(q.xyz, v) + q.w * v);',
    '}',
    '',
    'vec3 axisRotate(vec3 v, vec3 axis, float ang) {',
    '  float c = cos(ang);',
    '  float s = sin(ang);',
    '  return v * c + cross(axis, v) * s + axis * dot(axis, v) * (1.0 - c);',
    '}',
    '',
    'void main() {',
    '  float age = uSimTime - aBirth;',
    '  if (age < 0.0) {',
    '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
    '    return;',
    '  }',
    '  vAge = age;',
    '  vOptical = aOptical;',
    '',
    '  // Stage 1: Supersonic fracture wavefront radial crystal expansion behind s_front',
    '  float drag1 = 1.15;',
    '  vec3 dispWave = aVelWave * ((1.0 - exp(-drag1 * age)) / drag1);',
    '',
    '  // Stage 2: Catastrophic radial strain release once wavefront completes at 5.800s',
    '  float ageBurst = max(0.0, uSimTime - max(uWaveEndTime, aBirth));',
    '  float drag2 = 0.82;',
    '  vec3 dispBurst = aVelBurst * ((1.0 - exp(-drag2 * ageBurst)) / drag2);',
    '',
    '  // Slow-motion gravitational downward drift across Phases 5 & 6',
    '  float gravY = -(0.16 * age * age + 0.25 * ageBurst * ageBurst) * aOptical.y;',
    '',
    '  vec3 center = aOrigin + dispWave + dispBurst + vec3(0.0, gravY, 0.0);',
    '',
    '  // Rapid micro-growth in first 4ms so shards emerge cleanly at crack plane',
    '  float popIn = smoothstep(0.0, 0.008, age);',
    '  vec3 scaledP = position * aScale * popIn;',
    '',
    '  // Initial orientation inside glass + tumbling rotation',
    '  vec3 p0 = quatRotate(aQuat0, scaledP);',
    '  vec3 n0 = quatRotate(aQuat0, normal);',
    '  float spinAng = (age * 0.65 + ageBurst * 0.85) * aSpin.w;',
    '  vec3 rotP = axisRotate(p0, aSpin.xyz, spinAng);',
    '  vec3 rotN = axisRotate(n0, aSpin.xyz, spinAng);',
    '',
    '  vec4 wp = modelMatrix * vec4(center + rotP, 1.0);',
    '  vWorldPos = wp.xyz;',
    '  vWorldNormal = normalize((modelMatrix * vec4(rotN, 0.0)).xyz);',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n');

  var shardFragShader = [
    'uniform samplerCube uEnvCube;',
    'varying vec3 vWorldPos;',
    'varying vec3 vWorldNormal;',
    'varying float vAge;',
    'varying vec3 vOptical;',
    '',
    'vec3 acesToneMap(vec3 x) {',
    '  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);',
    '}',
    '',
    'void main() {',
    '  vec3 N = normalize(vWorldNormal);',
    '  if (!gl_FrontFacing) N = -N;',
    '  vec3 V = normalize(cameraPosition - vWorldPos);',
    '  float ndv = clamp(dot(N, V), 0.0, 1.0);',
    '',
    '  float fresnel = 0.06 + 0.94 * pow(1.0 - ndv, 3.8);',
    '  vec3 R = reflect(-V, N);',
    '  vec3 T = refract(-V, N, 1.0 / 1.52);',
    '  vec3 envRefl = textureCube(uEnvCube, R, 0.0).rgb;',
    '  vec3 envRefr = textureCube(uEnvCube, T, 0.8).rgb;',
    '',
    '  // Subtle residual birefringent tint on crystal facets',
    '  vec3 irid = 0.5 - 0.5 * cos(vec3(1.0, 1.22, 1.48) * (vOptical.x + ndv * 4.5));',
    '',
    '  // Razor-sharp studio diamond facet glints (key + cyan + magenta)',
    '  vec3 L1 = normalize(vec3(-0.52, 0.72, 0.68));',
    '  vec3 L2 = normalize(vec3(-0.78, 0.28, -0.56));',
    '  vec3 L3 = normalize(vec3(0.78, -0.28, -0.56));',
    '  float glint1 = pow(max(dot(N, normalize(L1 + V)), 0.0), 110.0) * 3.4;',
    '  float glint2 = pow(max(dot(N, normalize(L2 + V)), 0.0), 64.0) * 1.6;',
    '  float glint3 = pow(max(dot(N, normalize(L3 + V)), 0.0), 64.0) * 1.4;',
    '',
    '  vec3 crystal = mix(envRefr * 0.95 + irid * 0.18, envRefl * 1.35, fresnel);',
    '  crystal += vec3(1.0, 0.99, 0.98) * glint1;',
    '  crystal += vec3(0.18, 0.90, 1.0) * glint2;',
    '  crystal += vec3(1.0, 0.25, 0.74) * glint3;',
    '',
    '  // Newly fractured shards scatter chalk-white light for the first ~85ms behind wavefront',
    '  float whiteScatter = exp(-vAge / max(0.03, vOptical.z));',
    '  vec3 col = mix(crystal, vec3(1.35, 1.46, 1.62), whiteScatter * 0.88);',
    '',
    '  col = acesToneMap(col * 1.12);',
    '  col = pow(col, vec3(1.0 / 2.2));',
    '  float alpha = mix(0.86 + 0.14 * fresnel, 0.98, whiteScatter);',
    '  gl_FragColor = vec4(col, alpha);',
    '}'
  ].join('\n');

  // Helper: create flat-faceted acicular glass needle geometry (16 triangles, sharp cleavage faces)
  function createAcicularNeedleGeometry() {
    var verts = [
      new THREE.Vector3( 0.00,  1.00,  0.00), // 0: top sharp tip
      new THREE.Vector3( 0.00, -1.00,  0.00), // 1: bottom sharp tip
      // Upper waist ring (y = +0.24)
      new THREE.Vector3( 1.00,  0.24,  0.15), // 2
      new THREE.Vector3(-0.15,  0.24,  0.95), // 3
      new THREE.Vector3(-0.95,  0.24, -0.20), // 4
      new THREE.Vector3( 0.20,  0.24, -0.88), // 5
      // Lower waist ring (y = -0.32)
      new THREE.Vector3( 0.78, -0.32,  0.32), // 6
      new THREE.Vector3(-0.35, -0.32,  0.76), // 7
      new THREE.Vector3(-0.74, -0.32, -0.30), // 8
      new THREE.Vector3( 0.30, -0.32, -0.72)  // 9
    ];
    var faces = [
      // Top pyramid facets
      0, 2, 3,  0, 3, 4,  0, 4, 5,  0, 5, 2,
      // Middle prism cleavage facets
      2, 6, 7,  2, 7, 3,
      3, 7, 8,  3, 8, 4,
      4, 8, 9,  4, 9, 5,
      5, 9, 6,  5, 6, 2,
      // Bottom splinter facets
      1, 7, 6,  1, 8, 7,  1, 9, 8,  1, 6, 9
    ];
    var posArr = new Float32Array(faces.length * 3);
    for (var i = 0; i < faces.length; i++) {
      var v = verts[faces[i]];
      posArr[i * 3 + 0] = v.x;
      posArr[i * 3 + 1] = v.y;
      posArr[i * 3 + 2] = v.z;
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    g.computeVertexNormals(); // Flat per-face normals since non-indexed!
    return g;
  }

  // Helper: create asymmetric flat-faceted outer compressive shell glass prism
  function createShellPrismGeometry() {
    var base = new THREE.CylinderGeometry(0.68, 1.0, 1.15, 5, 1, false);
    var pos = base.attributes.position;
    for (var i = 0; i < pos.count; i++) {
      var x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      pos.setXYZ(i, x * (1.0 + 0.18 * y), y, z * (0.85 - 0.12 * y));
    }
    var nonIdx = base.toNonIndexed();
    nonIdx.computeVertexNormals();
    base.dispose();
    return nonIdx;
  }

  function populateShardInstancedMesh(baseGeo, count, isOuterShell) {
    var instGeo = baseGeo.clone();

    var aBirth = new Float32Array(count);
    var aOrigin = new Float32Array(count * 3);
    var aVelWave = new Float32Array(count * 3);
    var aVelBurst = new Float32Array(count * 3);
    var aQuat0 = new Float32Array(count * 4);
    var aSpin = new Float32Array(count * 4);
    var aScale = new Float32Array(count * 3);
    var aOptical = new Float32Array(count * 3);

    var qTmp = new THREE.Quaternion();
    var upY = new THREE.Vector3(0, 1, 0);
    var dirTmp = new THREE.Vector3();
    var radDir = new THREE.Vector3();

    for (var i = 0; i < count; i++) {
      // Sample spine s weighted by cross-sectional glass volume R(s)^1.45 so bulb & neck are densely packed
      // while ensuring rich representation all the way up the slender tail!
      var uRand = rng();
      var s;
      if (uRand < 0.14) {
        // Dedicated upper tail & severed curl shards (s in [0.65, 0.998])
        s = 0.65 + rng() * 0.348;
      } else if (uRand < 0.42) {
        // Mid/upper neck shards (s in [0.28, 0.72])
        s = 0.28 + Math.pow(rng(), 1.15) * 0.44;
      } else {
        // Thick bulbous head & shoulder shards (s in [0.004, 0.32])
        s = 0.004 + Math.pow(rng(), 1.25) * 0.316;
      }

      sampleSpine(s, tmpSample);
      var R = tmpSample.radius;

      var theta = rng() * Math.PI * 2.0;
      var cosT = Math.cos(theta);
      var sinT = Math.sin(theta);
      radDir.set(
        cosT * tmpSample.norm.x + sinT * tmpSample.binorm.x,
        cosT * tmpSample.norm.y + sinT * tmpSample.binorm.y,
        cosT * tmpSample.norm.z + sinT * tmpSample.binorm.z
      ).normalize();

      // Radial coordinate inside glass cross-section
      var rFrac = isOuterShell ? (0.78 + 0.21 * rng()) : (0.08 + 0.78 * Math.sqrt(rng()));
      var rActual = R * rFrac;

      aOrigin[i * 3 + 0] = tmpSample.pos.x + radDir.x * rActual;
      aOrigin[i * 3 + 1] = tmpSample.pos.y + radDir.y * rActual;
      aOrigin[i * 3 + 2] = tmpSample.pos.z + radDir.z * rActual;

      // Exact analytical birth time matching s_front(simTime)
      aBirth[i] = getBirthTimeForS(s, rng() - 0.5);

      // Stored elastic energy scales strongly with local bulb radius R(s)
      var energyScale = 0.32 + 1.55 * Math.pow(R / R_BULB_MAX, 0.80);

      if (s >= S_CUT) {
        // Severed upper tail splinters snap upward/outward on nipper bite
        var snapSpd = 0.45 + rng() * 0.95;
        aVelWave[i * 3 + 0] = radDir.x * snapSpd + tmpSample.tan.x * 0.35;
        aVelWave[i * 3 + 1] = radDir.y * snapSpd + 0.45 * rng();
        aVelWave[i * 3 + 2] = radDir.z * snapSpd;
        aVelBurst[i * 3 + 0] = radDir.x * 0.25;
        aVelBurst[i * 3 + 1] = -0.15;
        aVelBurst[i * 3 + 2] = radDir.z * 0.25;
      } else {
        // Stage 1 wavefront plume expansion + Stage 2 catastrophic radial disintegration
        var v1Mag = energyScale * (0.48 + rng() * 0.88) * (0.55 + 0.65 * rFrac);
        var axialKick1 = (rng() - 0.62) * 0.38 * energyScale;
        aVelWave[i * 3 + 0] = radDir.x * v1Mag + tmpSample.tan.x * axialKick1;
        aVelWave[i * 3 + 1] = radDir.y * v1Mag + tmpSample.tan.y * axialKick1;
        aVelWave[i * 3 + 2] = radDir.z * v1Mag + tmpSample.tan.z * axialKick1;

        var v2Mag = energyScale * (0.75 + Math.pow(rng(), 0.8) * 1.85);
        var axialKick2 = (s < 0.14 ? -0.55 * (1.0 - s / 0.14) : (rng() - 0.5) * 0.45) * energyScale;
        aVelBurst[i * 3 + 0] = radDir.x * v2Mag + tmpSample.tan.x * axialKick2 + (rng() - 0.5) * 0.35;
        aVelBurst[i * 3 + 1] = radDir.y * v2Mag + tmpSample.tan.y * axialKick2 + (rng() - 0.42) * 0.35;
        aVelBurst[i * 3 + 2] = radDir.z * v2Mag + tmpSample.tan.z * axialKick2 + (rng() - 0.5) * 0.35;
      }

      // Align acicular needles radially/diagonally like real Prince Rupert's Drop cleavage cones
      if (isOuterShell) {
        dirTmp.copy(radDir).lerp(tmpSample.tan, (rng() - 0.5) * 0.5).normalize();
      } else {
        dirTmp.copy(radDir).multiplyScalar(0.78).addScaledVector(tmpSample.tan, (rng() - 0.5) * 0.85).normalize();
      }
      qTmp.setFromUnitVectors(upY, dirTmp);
      aQuat0[i * 4 + 0] = qTmp.x;
      aQuat0[i * 4 + 1] = qTmp.y;
      aQuat0[i * 4 + 2] = qTmp.z;
      aQuat0[i * 4 + 3] = qTmp.w;

      var sx = rng() - 0.5, sy = rng() - 0.5, sz = rng() - 0.5;
      var slen = Math.sqrt(sx * sx + sy * sy + sz * sz) || 1.0;
      aSpin[i * 4 + 0] = sx / slen;
      aSpin[i * 4 + 1] = sy / slen;
      aSpin[i * 4 + 2] = sz / slen;
      aSpin[i * 4 + 3] = (2.8 + rng() * 11.5) * (rng() < 0.5 ? 1.0 : -1.0);

      var sizeBase = clamp(R * 0.32, 0.014, 0.16);
      if (isOuterShell) {
        var ps = sizeBase * (0.22 + rng() * 0.34);
        aScale[i * 3 + 0] = ps * (0.8 + rng() * 0.7);
        aScale[i * 3 + 1] = ps * (0.45 + rng() * 0.45);
        aScale[i * 3 + 2] = ps * (0.8 + rng() * 0.7);
      } else {
        // Elongated interlocking glass needles!
        var nLen = (0.028 + sizeBase * 0.68) * (0.65 + rng() * 1.05);
        var nWid = (0.0045 + sizeBase * 0.075) * (0.7 + rng() * 0.75);
        aScale[i * 3 + 0] = nWid;
        aScale[i * 3 + 1] = nLen;
        aScale[i * 3 + 2] = nWid * (0.7 + rng() * 0.6);
      }

      aOptical[i * 3 + 0] = rng() * Math.PI * 2.0; // Birefringent phase
      aOptical[i * 3 + 1] = 0.72 + rng() * 0.62;   // Gravitational fall factor
      aOptical[i * 3 + 2] = 0.065 + rng() * 0.075; // Opaque-white wavefront scatter decay
    }

    instGeo.setAttribute('aBirth', new THREE.InstancedBufferAttribute(aBirth, 1));
    instGeo.setAttribute('aOrigin', new THREE.InstancedBufferAttribute(aOrigin, 3));
    instGeo.setAttribute('aVelWave', new THREE.InstancedBufferAttribute(aVelWave, 3));
    instGeo.setAttribute('aVelBurst', new THREE.InstancedBufferAttribute(aVelBurst, 3));
    instGeo.setAttribute('aQuat0', new THREE.InstancedBufferAttribute(aQuat0, 4));
    instGeo.setAttribute('aSpin', new THREE.InstancedBufferAttribute(aSpin, 4));
    instGeo.setAttribute('aScale', new THREE.InstancedBufferAttribute(aScale, 3));
    instGeo.setAttribute('aOptical', new THREE.InstancedBufferAttribute(aOptical, 3));

    var mat = new THREE.ShaderMaterial({
      uniforms: shardUniforms,
      vertexShader: shardVertShader,
      fragmentShader: shardFragShader,
      transparent: true,
      depthWrite: true,
      side: THREE.DoubleSide
    });

    var mesh = new THREE.InstancedMesh(instGeo, mat, count);
    var idMat = new THREE.Matrix4();
    for (var m = 0; m < count; m++) {
      mesh.setMatrixAt(m, idMat);
    }
    mesh.instanceMatrix.needsUpdate = true;
    mesh.frustumCulled = false;
    mesh.renderOrder = 3;
    scene.add(mesh);
    return mesh;
  }

  var needleBaseGeo = createAcicularNeedleGeometry();
  var prismBaseGeo = createShellPrismGeometry();

  // 5,200 Interlocking Core Glass Needles + 1,250 Faceted Outer-Shell Prisms = 6,450 3D Crystal Shards
  var needleShardMesh = populateShardInstancedMesh(needleBaseGeo, 5200, false);
  var prismShardMesh = populateShardInstancedMesh(prismBaseGeo, 1250, true);

  // 5,200 Fine Silica Micro-Dust & Sparkling Micro-Crystal Particles Drifting Under Gravity
  var DUST_COUNT = 5200;
  var dustUniforms = {
    uDustTex: { value: dustTexture },
    uSimTime: { value: 0.0 },
    uWaveEndTime: { value: T_WAVE_END },
    uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, 2) }
  };

  (function buildSilicaDustCloud() {
    var geo = new THREE.BufferGeometry();
    var pos = new Float32Array(DUST_COUNT * 3);
    var aBirth = new Float32Array(DUST_COUNT);
    var aVel = new Float32Array(DUST_COUNT * 3);
    var aBurst = new Float32Array(DUST_COUNT * 3);
    var aMeta = new Float32Array(DUST_COUNT * 4); // x: size, y: gravScale, z: twinklePhase, w: isGlitter

    var radDir = new THREE.Vector3();
    for (var i = 0; i < DUST_COUNT; i++) {
      var u = rng();
      var s = (u < 0.22) ? (0.55 + rng() * 0.445) : Math.pow(rng(), 1.18) * 0.62;
      sampleSpine(s, tmpSample);
      var R = tmpSample.radius;

      var th = rng() * Math.PI * 2.0;
      radDir.set(
        Math.cos(th) * tmpSample.norm.x + Math.sin(th) * tmpSample.binorm.x,
        Math.cos(th) * tmpSample.norm.y + Math.sin(th) * tmpSample.binorm.y,
        Math.cos(th) * tmpSample.norm.z + Math.sin(th) * tmpSample.binorm.z
      ).normalize();

      var rPos = R * Math.sqrt(rng());
      pos[i * 3 + 0] = tmpSample.pos.x + radDir.x * rPos;
      pos[i * 3 + 1] = tmpSample.pos.y + radDir.y * rPos;
      pos[i * 3 + 2] = tmpSample.pos.z + radDir.z * rPos;

      aBirth[i] = getBirthTimeForS(s, rng() - 0.5);

      var eScale = 0.26 + 1.35 * Math.pow(R / R_BULB_MAX, 0.75);
      var spd1 = eScale * (0.22 + rng() * 0.85);
      aVel[i * 3 + 0] = radDir.x * spd1 + (rng() - 0.5) * 0.18;
      aVel[i * 3 + 1] = radDir.y * spd1 + (rng() - 0.5) * 0.18;
      aVel[i * 3 + 2] = radDir.z * spd1 + (rng() - 0.5) * 0.18;

      var spd2 = eScale * (0.35 + rng() * 1.45);
      aBurst[i * 3 + 0] = radDir.x * spd2 + (rng() - 0.5) * 0.42;
      aBurst[i * 3 + 1] = radDir.y * spd2 + (rng() - 0.45) * 0.38;
      aBurst[i * 3 + 2] = radDir.z * spd2 + (rng() - 0.5) * 0.42;

      var isGlitter = (rng() < 0.34) ? 1.0 : 0.0;
      aMeta[i * 4 + 0] = isGlitter > 0.5 ? (3.5 + rng() * 5.5) : (8.0 + rng() * 18.0);
      aMeta[i * 4 + 1] = isGlitter > 0.5 ? (0.62 + rng() * 0.55) : (0.28 + rng() * 0.44);
      aMeta[i * 4 + 2] = rng() * 100.0;
      aMeta[i * 4 + 3] = isGlitter;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aBirth', new THREE.BufferAttribute(aBirth, 1));
    geo.setAttribute('aVel', new THREE.BufferAttribute(aVel, 3));
    geo.setAttribute('aBurst', new THREE.BufferAttribute(aBurst, 3));
    geo.setAttribute('aMeta', new THREE.BufferAttribute(aMeta, 4));

    var mat = configureAdditiveBlend(new THREE.ShaderMaterial({
      uniforms: dustUniforms,
      vertexShader: [
        'attribute float aBirth;',
        'attribute vec3 aVel;',
        'attribute vec3 aBurst;',
        'attribute vec4 aMeta;',
        'uniform float uSimTime;',
        'uniform float uWaveEndTime;',
        'uniform float uPixelRatio;',
        'varying float vAlpha;',
        'varying vec3 vColor;',
        'void main() {',
        '  float age = uSimTime - aBirth;',
        '  if (age < 0.0) {',
        '    gl_Position = vec4(2.0, 2.0, 2.0, 1.0);',
        '    gl_PointSize = 0.0;',
        '    return;',
        '  }',
        '  float drag1 = 1.85;',
        '  vec3 d1 = aVel * ((1.0 - exp(-drag1 * age)) / drag1);',
        '  float ageBurst = max(0.0, uSimTime - max(uWaveEndTime, aBirth));',
        '  float drag2 = 1.35;',
        '  vec3 d2 = aBurst * ((1.0 - exp(-drag2 * ageBurst)) / drag2);',
        '',
        '  // Gentle studio air curl + downward gravitational settling',
        '  float ph = aMeta.z;',
        '  vec3 curl = vec3(sin(age * 1.7 + ph), cos(age * 1.3 + ph * 1.3) * 0.4, cos(age * 1.5 + ph)) * (0.06 * age);',
        '  float gravY = -(0.12 * age * age + 0.21 * ageBurst * ageBurst) * aMeta.y;',
        '',
        '  vec3 wp = position + d1 + d2 + curl + vec3(0.0, gravY, 0.0);',
        '  vec4 mv = modelViewMatrix * vec4(wp, 1.0);',
        '  gl_Position = projectionMatrix * mv;',
        '',
        '  float isGlitter = aMeta.w;',
        '  if (isGlitter > 0.5) {',
        '    float twinkle = pow(0.5 + 0.5 * sin(uSimTime * 24.0 + ph), 5.0);',
        '    vAlpha = (0.28 + 0.72 * twinkle) * smoothstep(0.0, 0.02, age);',
        '    float hueMix = fract(ph * 0.17);',
        '    vColor = mix(vec3(0.85, 0.96, 1.0), mix(vec3(0.35, 0.92, 1.0), vec3(1.0, 0.55, 0.88), hueMix), 0.42);',
        '    gl_PointSize = aMeta.x * uPixelRatio * (10.0 / max(1.0, -mv.z));',
        '  } else {',
        '    float puff = exp(-age * 4.5) * 0.45 + 0.11 * (1.0 - smoothstep(1.8, 3.8, age));',
        '    vAlpha = puff;',
        '    vColor = vec3(0.76, 0.88, 1.0);',
        '    gl_PointSize = aMeta.x * (1.0 + 0.55 * smoothstep(0.0, 1.6, age)) * uPixelRatio * (10.0 / max(1.0, -mv.z));',
        '  }',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D uDustTex;',
        'varying float vAlpha;',
        'varying vec3 vColor;',
        'void main() {',
        '  vec4 tex = texture2D(uDustTex, gl_PointCoord);',
        '  gl_FragColor = vec4(vColor, tex.a * vAlpha);',
        '}'
      ].join('\n')
    }));

    var pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    pts.renderOrder = 6;
    scene.add(pts);
  })();

  // =========================================================================
  // 12. PURE ANALYTICAL SIMULATION EVALUATOR: renderAt(simTime)
  // =========================================================================
  var tmpFlexVec = new THREE.Vector3();
  var tmpClampBasePos = spineCurve.getPointAt(S_CLAMP).clone();

  function renderAt(rawTime) {
    var t = clamp(rawTime, 0.0, DURATION);

    // 1) Fracture wavefront spine coordinate s_front(t)
    var fracS = getFractureS(t);
    var isTipSevered = (t >= T_SNIP_BITE) ? 1.0 : 0.0;
    var waveActive = (t >= T_SNIP_BITE && t < T_WAVE_END) ? 1.0 : 0.0;

    // 2) Photoelastic stress shock (Phase 2: 1.200s - 2.600s) & stress pulse (Phase 3: 2.600s - 3.800s)
    var impactShock = 0.0;
    if (t >= 1.200 && t < 2.850) {
      var dtImp = t - 1.200;
      impactShock = Math.exp(-dtImp * 2.4) * (1.0 - smoothstep(2.45, 2.85, t));
    }
    var stressPulse = 0.0;
    if (t >= 2.550 && t < 4.100) {
      var pulseEnv = smoothstep(2.550, 2.850, t) * (1.0 - smoothstep(3.750, 4.100, t));
      stressPulse = pulseEnv * (0.65 + 0.35 * Math.sin((t - 2.600) * 9.5));
    }

    // 3) Tail-snip incandescent triboluminescence flash (Phase 4: 4.050s - 4.400s)
    var triboInt = 0.0;
    if (t >= T_SNIP_BITE && t < 4.460) {
      var dtSnip = t - T_SNIP_BITE;
      triboInt = Math.exp(-dtSnip * 8.5) * (0.85 + 0.25 * Math.sin(dtSnip * 95.0));
    }

    // Update intact quenched glass uniforms & visibility
    var dropVisible = (fracS > 0.0);
    dropMesh.visible = dropVisible;
    dropBackMesh.visible = dropVisible;
    dropUniforms.uSimTime.value = t;
    dropUniforms.uFractureS.value = fracS;
    dropUniforms.uSeverTip.value = isTipSevered;
    dropUniforms.uWaveActive.value = waveActive;
    dropUniforms.uImpactShock.value = impactShock;
    dropUniforms.uStressPulse.value = stressPulse;
    dropUniforms.uTriboFlash.value = triboInt;

    // Update internal vacuum shrinkage micro-bubbles inside the bulb
    for (var b = 0; b < internalBubbles.length; b++) {
      var bub = internalBubbles[b];
      if (bub.s < fracS - 0.015) {
        bub.mesh.visible = true;
        getDropFlexOffset(bub.s, t, tmpFlexVec);
        bub.mesh.position.copy(bub.basePos).add(tmpFlexVec);
      } else {
        bub.mesh.visible = false;
        bub.mesh.position.copy(bub.basePos);
      }
    }

    // Update volumetric supersonic fracture cone & traveling wavefront light
    if (t >= T_SNIP_BITE && t < T_WAVE_END && fracS > 0.004 && fracS < 0.92) {
      sampleSpine(fracS, tmpSample);
      fractureConeMesh.visible = true;
      fractureConeMesh.position.copy(tmpSample.pos);
      fractureConeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tmpSample.tan);
      var rCone = Math.max(0.015, tmpSample.radius * 0.94);
      fractureConeMesh.scale.set(rCone, rCone, Math.max(0.06, rCone * 1.65));

      wavefrontLight.position.copy(tmpSample.pos).add(new THREE.Vector3(0, 0, 0.32));
      wavefrontLight.intensity = 2.6 + 2.4 * (tmpSample.radius / R_BULB_MAX);
    } else if (t >= T_WAVE_END && t < 6.35) {
      fractureConeMesh.visible = false;
      fractureConeMesh.position.set(0, 0, 0);
      fractureConeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 1));
      fractureConeMesh.scale.set(1, 1, 1);
      wavefrontLight.position.copy(bulbCenter).add(new THREE.Vector3(0, 0, 0.45));
      wavefrontLight.intensity = 4.8 * Math.exp(-(t - T_WAVE_END) * 6.5);
    } else {
      fractureConeMesh.visible = false;
      fractureConeMesh.position.set(0, 0, 0);
      fractureConeMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, 1));
      fractureConeMesh.scale.set(1, 1, 1);
      wavefrontLight.position.set(0, 0, 0);
      wavefrontLight.intensity = 0.0;
    }

    // Subtle mechanical micro-recoil on the dark anodized clamp during bullet impact
    if (t >= 1.200 && t < 2.500) {
      var dtC = t - 1.200;
      var cOsc = -0.008 * Math.exp(-dtC * 6.0) * Math.sin(dtC * 75.0);
      clampGroup.position.set(tmpClampBasePos.x + cOsc, tmpClampBasePos.y, tmpClampBasePos.z);
    } else {
      clampGroup.position.copy(tmpClampBasePos);
    }

    // 4) Update Conical Lead Bullet, Mushrooming, Spall & Impact Shock Ring
    updateBulletAt(t);
    spallUniforms.uSimTime.value = t;
    sparkUniforms.uSimTime.value = t;

    if (t >= 1.200 && t < 1.520) {
      var dtS = t - 1.200;
      var sProg = dtS / 0.320;
      impactShockRing.visible = true;
      var sRad = 0.25 + sProg * 3.8;
      impactShockRing.scale.set(sRad, sRad, 1.0);
      shockRingMat.opacity = 0.38 * Math.pow(1.0 - sProg, 2.0);

      var impFlash = Math.exp(-dtS * 18.0);
      impactFlareMat.opacity = impFlash * 0.92;
      var fScale = 0.35 + 1.35 * impFlash;
      impactFlare.scale.set(fScale, fScale, 1.0);
      impactFlashLight.position.copy(impactPoint).add(new THREE.Vector3(0.18, 0, 0.35));
      impactFlashLight.intensity = impFlash * 5.2;
    } else {
      impactShockRing.visible = false;
      impactShockRing.scale.set(1, 1, 1);
      shockRingMat.opacity = 0.0;
      impactFlareMat.opacity = 0.0;
      impactFlare.scale.set(1, 1, 1);
      impactFlashLight.position.copy(impactPoint);
      impactFlashLight.intensity = 0.0;
    }

    // 5) Update Articulated Steel Nippers & Tail-Snip Triboluminescence Flash
    updateNippersAt(t);
    if (triboInt > 0.002) {
      triboFlareMat.opacity = clamp(triboInt * 1.15, 0.0, 1.0);
      var tScale = 0.42 + 1.45 * triboInt;
      triboFlare.scale.set(tScale, tScale, 1.0);
      triboFlashLight.position.copy(cutPoint).add(new THREE.Vector3(0, 0, 0.30));
      triboFlashLight.intensity = triboInt * 6.5;
    } else {
      triboFlareMat.opacity = 0.0;
      triboFlare.scale.set(1, 1, 1);
      triboFlashLight.position.copy(cutPoint);
      triboFlashLight.intensity = 0.0;
    }

    // 6) Terminal Bulb Disintegration Acoustic Ring (5.800s - 6.280s)
    if (t >= T_WAVE_END && t < 6.280) {
      var bProg = (t - T_WAVE_END) / 0.480;
      burstShockRing.visible = true;
      var bRad = 0.52 + bProg * 4.2;
      burstShockRing.scale.set(bRad, bRad, 1.0);
      burstShockMat.opacity = 0.30 * Math.pow(1.0 - bProg, 2.1);
    } else {
      burstShockRing.visible = false;
      burstShockRing.scale.set(1, 1, 1);
      burstShockMat.opacity = 0.0;
    }

    // 7) Update Crystalline Glass Shards & Silica Dust GPU Uniforms
    var shardsActive = (t >= T_SNIP_BITE);
    needleShardMesh.visible = shardsActive;
    prismShardMesh.visible = shardsActive;
    shardUniforms.uSimTime.value = t;
    dustUniforms.uSimTime.value = t;
    dustUniforms.uPixelRatio.value = Math.min(window.devicePixelRatio || 1, 2);

    renderer.render(scene, camera);
  }

  // =========================================================================

  var countdownEl = document.getElementById('countdown');

      iconPause.style.display = 'none';

    countdownEl.style.display = 'none';

    countdownEl.style.display = 'block';
    if (countdownEl.textContent !== digitStr) {
      countdownEl.textContent = digitStr;
    }

    if (state === 'PLAYING') {
      state = 'PAUSED';
      setToggleButtonMode(false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD') {
      countdownElapsed = 0.0;
      holdElapsed = 0.0;
      hideCountdown();
      simTime = 0.0;
      scrubberEl.value = '0';
      state = 'PAUSED';
      setToggleButtonMode(false);
      renderAt(0.0);
    } else if (state === 'PAUSED') {
      hideCountdown();
      state = 'PLAYING';
      setToggleButtonMode(true);
    } else if (state === 'ENDED') {
      hideCountdown();
      simTime = 0.0;
      scrubberEl.value = '0';
      state = 'PLAYING';
      setToggleButtonMode(true);
      renderAt(0.0);

            speedPills[j].classList.add('is-active');
            speedPills[j].setAttribute('aria-checked', 'true');
          } else {
            speedPills[j].classList.remove('is-active');
            speedPills[j].setAttribute('aria-checked', 'false');
          }
        }
      });
    })(speedPills[pIdx]);
  }

  // Scrubbing Slider (#scrubber)
  scrubberEl.addEventListener('input', function() {
    countdownElapsed = 0.0;
    holdElapsed = 0.0;
    hideCountdown();
    var val = parseFloat(scrubberEl.value);
    simTime = isNaN(val) ? 0.0 : clamp(val, 0.0, DURATION);
    state = 'PAUSED';
    setToggleButtonMode(false);
    renderAt(simTime);
  });

  // Responsive Viewport Resize
  window.addEventListener('resize', function() {
    updateCameraFraming();
    renderAt(simTime);
  });

  // Pre-compile all shaders and render initial resting scene (simTime = 0.000) BEFORE starting COUNTDOWN rAF
  renderer.compile(scene, camera);
  showCountdownDigit('3');
  scrubberEl.value = '0';
  setToggleButtonMode(true);
  renderAt(0.0);

  // Main Animation Loop (COUNTDOWN starts on the first requestAnimationFrame callback after initial render)
  function onAnimationFrame(nowMs) {
    requestAnimationFrame(onAnimationFrame);

    if (lastFrameTime === null) {
      lastFrameTime = nowMs;
      // First rAF callback after resting scene rendered: countdownElapsed = 0 -> displays "3"
      if (state === 'COUNTDOWN') {
        countdownElapsed = 0.0;
        showCountdownDigit('3');
      }
      return;
    }

    var rawDt = Math.max(0.0, (nowMs - lastFrameTime) * 0.001);
    lastFrameTime = nowMs;
    var dt = Math.min(rawDt, 0.1);
    var TIME_EPS = 1e-7;

    if (state === 'COUNTDOWN') {
      countdownElapsed += dt;
      if (countdownElapsed < 1.000 - TIME_EPS) {
        showCountdownDigit('3');
        simTime = 0.0;
        scrubberEl.value = '0';
      } else if (countdownElapsed < 2.000 - TIME_EPS) {
        showCountdownDigit('2');
        simTime = 0.0;
        scrubberEl.value = '0';
      } else if (countdownElapsed < 3.000 - TIME_EPS) {
        showCountdownDigit('1');
        simTime = 0.0;
        scrubberEl.value = '0';
      } else {
        var overflowDt = Math.max(0.0, countdownElapsed - 3.000);
        hideCountdown();
        state = 'PLAYING';
        setToggleButtonMode(true);
        simTime = Math.min(DURATION, overflowDt * playbackSpeed);
        scrubberEl.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    } else if (state === 'REFIRE_HOLD') {
      hideCountdown();
      holdElapsed += dt;
      if (holdElapsed >= 1.000 - TIME_EPS) {
        var holdOverflow = Math.max(0.0, holdElapsed - 1.000);
        state = 'PLAYING';
        setToggleButtonMode(true);
        simTime = Math.min(DURATION, holdOverflow * playbackSpeed);
        scrubberEl.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    } else if (state === 'PLAYING') {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION - TIME_EPS) {
        simTime = DURATION;
        scrubberEl.value = DURATION.toFixed(3);
        renderAt(DURATION);
        state = 'ENDED';
        setToggleButtonMode(false);
      } else {
        scrubberEl.value = simTime.toFixed(3);
        renderAt(simTime);
      }
    }
  }

  requestAnimationFrame(onAnimationFrame);
})();
</script>
</body>
</html>
