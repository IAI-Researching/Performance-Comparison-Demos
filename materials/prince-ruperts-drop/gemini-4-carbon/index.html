<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prince Rupert's Drop: Bullet Impact vs. Tail Snip</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  'use strict';

  // =========================================================================
  // 1. CONSTANTS & DETERMINISTIC SEEDED PRNG (MULBERRY32, SEED = 42)
  // =========================================================================
  var DURATION = 8;
  var SEED = 42;

  function createMulberry32(seed) {
    var a = seed >>> 0;
    return function() {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var rng = createMulberry32(SEED);

  function clamp(v, lo, hi) {
    return v < lo ? lo : (v > hi ? hi : v);
  }
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }
  function smoothstep(e0, e1, x) {
    var t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
    return t * t * (3.0 - 2.0 * t);
  }
  function smootherstep(e0, e1, x) {
    var t = clamp((x - e0) / (e1 - e0), 0.0, 1.0);
    return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
  }

  // Helper for premultiplied-alpha safe additive glow over transparent canvas
  function configureAdditiveBlend(mat) {
    mat.transparent = true;
    mat.depthWrite = false;
    mat.blending = THREE.CustomBlending;
    mat.blendEquation = THREE.AddEquation;
    mat.blendSrc = THREE.SrcAlphaFactor;
    mat.blendDst = THREE.OneFactor;
    mat.blendEquationAlpha = THREE.AddEquation;
    mat.blendSrcAlpha = THREE.ZeroFactor;
    mat.blendDstAlpha = THREE.OneFactor;
    return mat;
  }

  // =========================================================================
  // 2. RENDERER, SCENE & NARROW 85MM EQUIVALENT CAMERA SETUP
  // =========================================================================
  var stageCanvas = document.getElementById('stage');
  var renderer = new THREE.WebGLRenderer({
    canvas: stageCanvas,
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();

  // Fixed narrow perspective camera (85mm equivalent, FOV = 35 deg) locked along Z-axis
  var BASE_CAM_Z = 15.0;
  var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0.08, BASE_CAM_Z);
  camera.lookAt(0, 0.08, 0);

  function updateCameraFraming() {
    var w = window.innerWidth || 1;
    var h = window.innerHeight || 1;
    var aspect = w / h;
    camera.aspect = aspect;
    // Frame entire centerpiece cleanly inside central 70% for both 16:9 (1.778) and 1280x1340 (0.955)
    var zDist = BASE_CAM_Z;
    if (aspect < 0.90) {
      zDist = BASE_CAM_Z * (0.90 / Math.max(aspect, 0.35));
    }
    camera.position.set(0, 0.08, zDist);
    camera.lookAt(0, 0.08, 0);
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
  }
  updateCameraFraming();

  // =========================================================================
  // 3. PROCEDURAL STUDIO REFLECTION ENVIRONMENT (PMREMGenerator + CubeCamera)
  // =========================================================================
  function buildStudioEnvironment() {
    var envScene = new THREE.Scene();

    // Studio dark enclosure dome
    var domeGeo = new THREE.SphereGeometry(40, 32, 24);
    var domePos = domeGeo.attributes.position;
    var domeCols = new Float32Array(domePos.count * 3);
    for (var i = 0; i < domePos.count; i++) {
      var ny = clamp(domePos.getY(i) / 40.0, -1.0, 1.0);
      var grad = smoothstep(-0.8, 0.9, ny);
      domeCols[i * 3 + 0] = lerp(0.03, 0.09, grad);
      domeCols[i * 3 + 1] = lerp(0.04, 0.11, grad);
      domeCols[i * 3 + 2] = lerp(0.06, 0.16, grad);
    }
    domeGeo.setAttribute('color', new THREE.BufferAttribute(domeCols, 3));
    var domeMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide });
    var domeMesh = new THREE.Mesh(domeGeo, domeMat);
    envScene.add(domeMesh);

    function addPanel(w, h, colorHex, intensity, pos, lookTarget) {
      var pGeo = new THREE.PlaneGeometry(w, h);
      var c = new THREE.Color(colorHex).multiplyScalar(intensity);
      var pMat = new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide });
      var m = new THREE.Mesh(pGeo, pMat);
      m.position.copy(pos);
      m.lookAt(lookTarget);
      envScene.add(m);
      return { geo: pGeo, mat: pMat };
    }

    var origin = new THREE.Vector3(0, 0, 0);
    var panels = [
      // Tall cool-white key softbox (front-left-top) for long glass specular ribbon
      addPanel(9.5, 22.0, 0xf2f7ff, 3.8, new THREE.Vector3(-11.0, 8.5, 13.0), origin),
      // Crisp narrow specular kicker strip
      addPanel(2.4, 24.0, 0xffffff, 5.5, new THREE.Vector3(-5.5, 11.0, 15.5), origin),
      // Front-right soft fill diffuser
      addPanel(10.0, 16.0, 0xcad8f4, 1.5, new THREE.Vector3(13.5, -1.5, 12.0), origin),
      // Electric cyan back-left rim strip
      addPanel(4.8, 24.0, 0x2ce8ff, 4.4, new THREE.Vector3(-14.5, 3.5, -9.5), origin),
      // Magenta-violet back-right rim strip
      addPanel(4.8, 24.0, 0xff3cb8, 3.9, new THREE.Vector3(14.5, -2.5, -9.5), origin),
      // Overhead softbox crown
      addPanel(14.0, 8.0, 0xe8f2ff, 2.8, new THREE.Vector3(0.0, 18.5, 2.0), origin),
      // Subtle floor bounce
      addPanel(20.0, 14.0, 0x26324a, 0.9, new THREE.Vector3(0.0, -17.0, 2.0), origin)
    ];

    // 1) PMREMGenerator for PBR Standard/Physical materials (lead, copper, tool steel, clamp)
    var pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileCubemapShader();
    var pmremRT = pmremGen.fromScene(envScene, 0.03);
    scene.environment = pmremRT.texture;
    pmremGen.dispose();

    // 2) True Mipmapped Cubemap for custom GLSL glass chromatic dispersion & crystal facets
    var cubeRT = new THREE.WebGLCubeRenderTarget(256, {
      format: THREE.RGBAFormat,
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter,
      magFilter: THREE.LinearFilter
    });
    var cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
    cubeCam.update(renderer, envScene);

    // Dispose temporary studio geometry/materials
    domeGeo.dispose();
    domeMat.dispose();
    for (var p = 0; p < panels.length; p++) {
      panels[p].geo.dispose();
      panels[p].mat.dispose();
    }

    return {
      pmremTexture: pmremRT.texture,
      cubeTexture: cubeRT.texture
    };
  }

  var studioEnv = buildStudioEnvironment();

  // Studio Three-Point + Dual Rim Direct Lights
  var keyLight = new THREE.DirectionalLight(0xf0f6ff, 2.1);
  keyLight.position.set(-5.0, 6.5, 7.5);
  scene.add(keyLight);

  var fillLight = new THREE.DirectionalLight(0x9fb8e8, 0.85);
  fillLight.position.set(6.0, -1.5, 6.5);
  scene.add(fillLight);

  var cyanRimLight = new THREE.DirectionalLight(0x2ce8ff, 2.2);
  cyanRimLight.position.set(-7.5, 2.5, -5.5);
  scene.add(cyanRimLight);

  var magentaRimLight = new THREE.DirectionalLight(0xff42b8, 1.9);
  magentaRimLight.position.set(7.5, -2.5, -5.5);
  scene.add(magentaRimLight);

  var topRimLight = new THREE.DirectionalLight(0xffffff, 1.35);
  topRimLight.position.set(0.5, 8.5, -3.5);
  scene.add(topRimLight);

  var ambientLight = new THREE.AmbientLight(0x242c3d, 0.55);
  scene.add(ambientLight);

  // Dynamic physical event lights
  var impactFlashLight = new THREE.PointLight(0xffe8c2, 0.0, 7.0, 2.0);
  scene.add(impactFlashLight);

  var triboFlashLight = new THREE.PointLight(0x8ae2ff, 0.0, 8.0, 2.0);
  scene.add(triboFlashLight);

  var wavefrontLight = new THREE.PointLight(0xc8ecff, 0.0, 6.5, 1.8);
  scene.add(wavefrontLight);

  // =========================================================================
  // 4. PROCEDURAL IN-MEMORY SPRITE TEXTURES (DETACHED CANVASES ONLY)
  // =========================================================================
  function createFlareTexture() {
    var cnv = document.createElement('canvas');
    cnv.width = 128;
    cnv.height = 128;
    var ctx = cnv.getContext('2d');
    var cx = 64, cy = 64;

    var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 62);
    grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
    grad.addColorStop(0.16, 'rgba(215, 240, 255, 0.85)');
    grad.addColorStop(0.42, 'rgba(110, 195, 255, 0.28)');
    grad.addColorStop(1.0, 'rgba(0, 0, 0, 0.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 128, 128);

    // Subtle crisp optical cross-spikes
    ctx.save();
    ctx.translate(cx, cy);
    for (var k = 0; k < 4; k++) {
      ctx.rotate(Math.PI * 0.25);
      var spikeLen = (k % 2 === 0) ? 60 : 38;
      var spikeW = (k % 2 === 0) ? 2.4 : 1.4;
      var sg = ctx.createLinearGradient(-spikeLen, 0, spikeLen, 0);
      sg.addColorStop(0.0, 'rgba(255,255,255,0)');
      sg.addColorStop(0.5, 'rgba(255,255,255,0.75)');
      sg.addColorStop(1.0, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(-spikeLen, -spikeW * 0.5, spikeLen * 2, spikeW);
    }
    ctx.restore();

    var tex = new THREE.CanvasTexture(cnv);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function createDustSpriteTexture() {
    var cnv = document.createElement('canvas');
    cnv.width = 64;
    cnv.height = 64;
    var ctx = cnv.getContext('2d');
    var grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 30);
    grad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
    grad.addColorStop(0.28, 'rgba(235, 245, 255, 0.72)');
    grad.addColorStop(0.65, 'rgba(185, 215, 250, 0.20)');
    grad.addColorStop(1.0, 'rgba(255, 255, 255, 0.0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    var tex = new THREE.CanvasTexture(cnv);
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  var flareTexture = createFlareTexture();
  var dustTexture = createDustSpriteTexture();

  // =========================================================================
  // 5. PRINCE RUPERT'S DROP SPINE CURVE, BISHOP FRAMES & RADIUS PROFILE
  // =========================================================================
  // Centered vertically/diagonally from lower bulbous head (s = 0) to curled tail tip (s = 1)
  var SPINE_POINTS = [
    new THREE.Vector3(-0.52, -2.52,  0.00), // s = 0.000: bottom bulb pole
    new THREE.Vector3(-0.45, -1.95,  0.00), // s ~ 0.104: bulb equator (bullet target!)
    new THREE.Vector3(-0.31, -1.22,  0.02), // s ~ 0.240: bulb upper shoulder
    new THREE.Vector3(-0.07, -0.35,  0.05), // lower neck
    new THREE.Vector3( 0.24,  0.52,  0.04), // mid neck
    new THREE.Vector3( 0.51,  1.32, -0.02), // upper neck (clamp zone s ~ 0.71)
    new THREE.Vector3( 0.59,  1.90, -0.04), // lower tail
    new THREE.Vector3( 0.45,  2.22,  0.02), // s ~ 0.895: tail snip point!
    new THREE.Vector3( 0.19,  2.42,  0.09), // upper tail curl
    new THREE.Vector3( 0.01,  2.31,  0.14)  // s = 1.000: helical tail tip
  ];

  var spineCurve = new THREE.CatmullRomCurve3(SPINE_POINTS, false, 'centripetal');
  spineCurve.arcLengthDivisions = 800;
  spineCurve.updateArcLengths();

  var S_BULB_EQ = 0.104;
  var S_CLAMP = 0.715;
  var S_CUT = 0.895;
  var S_NUCLEATE_END = 0.855;
  var R_BULB_MAX = 0.55;

  function dropRadius(s) {
    if (s <= 0.0) return 0.0;
    if (s >= 1.0) return 0.0;
    if (s < S_BULB_EQ) {
      var d = s / S_BULB_EQ;
      return R_BULB_MAX * Math.sqrt(Math.max(0.0, 2.0 * d - d * d));
    }
    var w = (s - S_BULB_EQ) / (1.0 - S_BULB_EQ);
    var bulbTaper = 1.0 / Math.pow(1.0 + 11.5 * Math.pow(w, 2.10), 1.38);
    var tailFilament = 0.015 * (1.0 - 0.32 * w);
    var r = R_BULB_MAX * bulbTaper + tailFilament * Math.pow(w, 0.65);
    if (s > 0.992) {
      var tipT = (1.0 - s) / 0.008;
      r *= Math.sqrt(Math.max(0.0, 2.0 * tipT - tipT * tipT));
    }
    return r;
  }

  // Precompute twist-free parallel-transport (Bishop) frames along normalized arc-length s in [0, 1]
  var N_LUT = 512;
  var lutPos = new Array(N_LUT + 1);
  var lutTan = new Array(N_LUT + 1);
  var lutNorm = new Array(N_LUT + 1);
  var lutBinorm = new Array(N_LUT + 1);
  var lutRad = new Float32Array(N_LUT + 1);

  (function buildSpineLUT() {
    for (var i = 0; i <= N_LUT; i++) {
      var s = i / N_LUT;
      lutPos[i] = spineCurve.getPointAt(s);
      lutTan[i] = spineCurve.getTangentAt(s).normalize();
      lutRad[i] = dropRadius(s);
    }
    // Initial frame at s = 0 with N pointing roughly +X, B roughly +Z
    var t0 = lutTan[0];
    var refZ = new THREE.Vector3(0, 0, 1);
    var n0 = new THREE.Vector3().crossVectors(t0, refZ).normalize();
    if (n0.x < 0) n0.negate();
    var b0 = new THREE.Vector3().crossVectors(t0, n0).normalize();
    lutNorm[0] = n0;
    lutBinorm[0] = b0;

    var axis = new THREE.Vector3();
    var quat = new THREE.Quaternion();
    for (var j = 1; j <= N_LUT; j++) {
      var prevT = lutTan[j - 1];
      var currT = lutTan[j];
      var nPrev = lutNorm[j - 1].clone();
      axis.crossVectors(prevT, currT);
      var sinA = axis.length();
      if (sinA > 1e-6) {
        axis.divideScalar(sinA);
        var cosA = clamp(prevT.dot(currT), -1.0, 1.0);
        var ang = Math.atan2(sinA, cosA);
        quat.setFromAxisAngle(axis, ang);
        nPrev.applyQuaternion(quat);
      }
      // Gram-Schmidt orthogonalize
      nPrev.addScaledVector(currT, -nPrev.dot(currT)).normalize();
      lutNorm[j] = nPrev;
      lutBinorm[j] = new THREE.Vector3().crossVectors(currT, nPrev).normalize();
    }
  })();

  function sampleSpine(s, outObj) {
    var sc = clamp(s, 0.0, 1.0) * N_LUT;
    var idx = Math.min(N_LUT - 1, Math.floor(sc));
    var f = sc - idx;
    outObj.pos.copy(lutPos[idx]).lerp(lutPos[idx + 1], f);
    outObj.tan.copy(lutTan[idx]).lerp(lutTan[idx + 1], f).normalize();
    outObj.norm.copy(lutNorm[idx]).lerp(lutNorm[idx + 1], f).normalize();
    outObj.binorm.copy(lutBinorm[idx]).lerp(lutBinorm[idx + 1], f).normalize();
    outObj.radius = lerp(lutRad[idx], lutRad[idx + 1], f);
    return outObj;
  }

  var tmpSample = {
    pos: new THREE.Vector3(),
    tan: new THREE.Vector3(),
    norm: new THREE.Vector3(),
    binorm: new THREE.Vector3(),
    radius: 0
  };

  // Key World Landmarks on the Drop
  var bulbCenter = spineCurve.getPointAt(S_BULB_EQ).clone(); // (-0.45, -1.95, 0.00)
  var impactPoint = new THREE.Vector3(bulbCenter.x + R_BULB_MAX, bulbCenter.y - 0.015, bulbCenter.z);
  var cutPoint = spineCurve.getPointAt(S_CUT).clone();
  var cutTangent = spineCurve.getTangentAt(S_CUT).normalize();
  var clampPoint = spineCurve.getPointAt(S_CLAMP).clone();

  // =========================================================================
  // 6. EXACT SUPERSONIC FRACTURE WAVEFRONT TIMELINE & INVERSE BIRTH MAPPING
  // =========================================================================
  // Tail Snip & Nucleation: 3.800s - 4.400s (bite sever at 4.050s, nucleation s: 0.895 -> 0.855)
  // Supersonic Wavefront:   4.400s - 5.800s (constant arc-length speed s: 0.855 -> 0.000)
  // Catastrophic Burst:     5.800s - 8.000s (s < 0, full radial crystalline disintegration + gravity)
  var T_SNIP_BITE = 4.050;
  var T_WAVE_START = 4.400;
  var T_WAVE_END = 5.800;

  function getFractureS(simTime) {
    if (simTime < T_SNIP_BITE) {
      return 1.05; // 100% intact
    }
    if (simTime < T_WAVE_START) {
      var u = (simTime - T_SNIP_BITE) / (T_WAVE_START - T_SNIP_BITE);
      return S_CUT - (S_CUT - S_NUCLEATE_END) * (u * u);
    }
    if (simTime < T_WAVE_END) {
      var w = (simTime - T_WAVE_START) / (T_WAVE_END - T_WAVE_START);
      return S_NUCLEATE_END * (1.0 - w);
    }
    return -0.06; // 100% fractured
  }

  function getBirthTimeForS(s, jitter) {
    var jit = (jitter || 0) * 0.006;
    if (s >= S_CUT) {
      var tipFrac = (s - S_CUT) / Math.max(1e-4, 1.0 - S_CUT);
      return T_SNIP_BITE + 0.095 * tipFrac + jit;
    }
    if (s >= S_NUCLEATE_END) {
      var nucFrac = (S_CUT - s) / (S_CUT - S_NUCLEATE_END);
      return T_SNIP_BITE + (T_WAVE_START - T_SNIP_BITE) * Math.sqrt(Math.max(0.0, nucFrac)) + jit;
    }
    var waveFrac = (S_NUCLEATE_END - s) / S_NUCLEATE_END;
    return T_WAVE_START + (T_WAVE_END - T_WAVE_START) * waveFrac + jit;
  }

  // Elastic flexural vibration of the intact drop when struck by bullet (1.200s - 2.900s)
  function getDropFlexOffset(s, simTime, outVec) {
    if (simTime <= 1.200 || simTime >= 3.100) {
      outVec.set(0, 0, 0);
      return outVec;
    }
    var dt = simTime - 1.200;
    var fade = 1.0 - smoothstep(2.45, 3.05, simTime);
    var env = (1.0 - Math.exp(-dt * 45.0)) * Math.exp(-dt * 4.6) * fade;
    // Cantilevered around the anodized clamp at s = S_CLAMP
    var arm = Math.abs(s - S_CLAMP);
    var signArm = (s < S_CLAMP) ? 1.0 : -0.45;
    var mode1 = Math.sin(dt * 58.0 - arm * 3.5);
    var mode2 = 0.35 * Math.sin(dt * 142.0 + s * 9.0);
    var dx = -0.036 * env * signArm * Math.pow(arm / S_CLAMP, 1.25) * (0.65 * mode1 + 0.35 + mode2);
    var dy = -0.010 * env * arm * mode1;
    outVec.set(dx, dy, 0.005 * env * mode2);
    return outVec;
  }

  // =========================================================================
  // 7. QUENCHED GLASS PRINCE RUPERT'S DROP MESH & BIREFRINGENCE SHADER
  // =========================================================================
  var dropUniforms = {
    uEnvCube: { value: studioEnv.cubeTexture },
    uSimTime: { value: 0.0 },
    uFractureS: { value: 1.05 },
    uSeverTip: { value: 0.0 },
    uWaveActive: { value: 0.0 },
    uStressPulse: { value: 0.0 },
    uImpactShock: { value: 0.0 },
    uImpactPos: { value: impactPoint.clone() },
    uTriboFlash: { value: 0.0 },
    uCutPos: { value: cutPoint.clone() },
    uClampS: { value: S_CLAMP }
  };

  function buildDropGeometry() {
    var rings = 272;
    var radialSegs = 64;
    var vertCount = (rings + 1) * (radialSegs + 1);

    var positions = new Float32Array(vertCount * 3);
    var normals = new Float32Array(vertCount * 3);
    var uvs = new Float32Array(vertCount * 2);
    var spineAttr = new Float32Array(vertCount);
    var indices = [];

    // Cluster rings smoothly near s = 0 (hemispherical bulb pole) and s = 1 (tail tip)
    var sValues = new Float32Array(rings + 1);
    for (var i = 0; i <= rings; i++) {
      var u = i / rings;
      // Smooth sine-blended pole clustering
      var sCluster = 0.5 - 0.5 * Math.cos(Math.PI * u);
      sValues[i] = lerp(u, sCluster, 0.42);
    }

    var gridPos = new Array(rings + 1);
    for (var r = 0; r <= rings; r++) {
      var s = sValues[r];
      sampleSpine(s, tmpSample);
      gridPos[r] = new Array(radialSegs + 1);
      for (var c = 0; c <= radialSegs; c++) {
        var theta = (c / radialSegs) * Math.PI * 2.0;
        var cosT = Math.cos(theta);
        var sinT = Math.sin(theta);
        var px = tmpSample.pos.x + tmpSample.radius * (cosT * tmpSample.norm.x + sinT * tmpSample.binorm.x);
        var py = tmpSample.pos.y + tmpSample.radius * (cosT * tmpSample.norm.y + sinT * tmpSample.binorm.y);
        var pz = tmpSample.pos.z + tmpSample.radius * (cosT * tmpSample.norm.z + sinT * tmpSample.binorm.z);
        gridPos[r][c] = new THREE.Vector3(px, py, pz);
      }
    }

    var dU = new THREE.Vector3();
    var dV = new THREE.Vector3();
    var nrm = new THREE.Vector3();
    var ptr = 0;

    for (var r2 = 0; r2 <= rings; r2++) {
      var sVal = sValues[r2];
      sampleSpine(sVal, tmpSample);
      for (var c2 = 0; c2 <= radialSegs; c2++) {
        var p = gridPos[r2][c2];
        positions[ptr * 3 + 0] = p.x;
        positions[ptr * 3 + 1] = p.y;
        positions[ptr * 3 + 2] = p.z;

        if (r2 === 0) {
          nrm.copy(tmpSample.tan).negate();
        } else if (r2 === rings) {
          nrm.copy(tmpSample.tan);
        } else {
          var cPrev = (c2 === 0) ? radialSegs - 1 : c2 - 1;
          var cNext = (c2 === radialSegs) ? 1 : c2 + 1;
          dU.subVectors(gridPos[r2 + 1][c2], gridPos[r2 - 1][c2]);
          dV.subVectors(gridPos[r2][cNext], gridPos[r2][cPrev]);
          nrm.crossVectors(dV, dU);
          if (nrm.lengthSq() < 1e-10) {
            nrm.subVectors(p, tmpSample.pos);
          }
          nrm.normalize();
          // Ensure outward orientation
          var radialCheck = dU.subVectors(p, tmpSample.pos);
          if (nrm.dot(radialCheck) < 0) nrm.negate();
        }

        normals[ptr * 3 + 0] = nrm.x;
        normals[ptr * 3 + 1] = nrm.y;
        normals[ptr * 3 + 2] = nrm.z;

        uvs[ptr * 2 + 0] = c2 / radialSegs;
        uvs[ptr * 2 + 1] = sVal;
        spineAttr[ptr] = sVal;
        ptr++;
      }
    }

    for (var r3 = 0; r3 < rings; r3++) {
      for (var c3 = 0; c3 < radialSegs; c3++) {
        var a = r3 * (radialSegs + 1) + c3;
        var b = (r3 + 1) * (radialSegs + 1) + c3;
        var d = (r3 + 1) * (radialSegs + 1) + (c3 + 1);
        var e = r3 * (radialSegs + 1) + (c3 + 1);
        indices.push(a, e, b);
        indices.push(e, d, b);
      }
    }

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    geo.setAttribute('aSpineS', new THREE.BufferAttribute(spineAttr, 1));
    geo.setIndex(indices);
    return geo;
  }

  var dropVertShader = [
    'attribute float aSpineS;',
    'uniform float uSimTime;',
    'uniform float uClampS;',
    'varying vec3 vWorldPos;',
    'varying vec3 vLocalPos;',
    'varying vec3 vWorldNormal;',
    'varying float vSpineS;',
    '',
    'vec3 computeFlexOffset(float s, float t) {',
    '  if (t <= 1.200 || t >= 3.100) return vec3(0.0);',
    '  float dt = t - 1.200;',
    '  float fade = 1.0 - smoothstep(2.45, 3.05, t);',
    '  float env = (1.0 - exp(-dt * 45.0)) * exp(-dt * 4.6) * fade;',
    '  float arm = abs(s - uClampS);',
    '  float signArm = (s < uClampS) ? 1.0 : -0.45;',
    '  float mode1 = sin(dt * 58.0 - arm * 3.5);',
    '  float mode2 = 0.35 * sin(dt * 142.0 + s * 9.0);',
    '  float dx = -0.036 * env * signArm * pow(arm / uClampS, 1.25) * (0.65 * mode1 + 0.35 + mode2);',
    '  float dy = -0.010 * env * arm * mode1;',
    '  return vec3(dx, dy, 0.005 * env * mode2);',
    '}',
    '',
    'void main() {',
    '  vSpineS = aSpineS;',
    '  vLocalPos = position;',
    '  vec3 flex = computeFlexOffset(aSpineS, uSimTime);',
    '  vec4 wp = modelMatrix * vec4(position + flex, 1.0);',
    '  vWorldPos = wp.xyz;',
    '  vWorldNormal = normalize((modelMatrix * vec4(normal, 0.0)).xyz);',
    '  gl_Position = projectionMatrix * viewMatrix * wp;',
    '}'
  ].join('\n');

  var dropFragShader = [
    'uniform samplerCube uEnvCube;',
    'uniform float uSimTime;',
    'uniform float uFractureS;',
    'uniform float uSeverTip;',
    'uniform float uWaveActive;',
    'uniform float uStressPulse;',
    'uniform float uImpactShock;',
    'uniform vec3 uImpactPos;',
    'uniform float uTriboFlash;',
    'uniform vec3 uCutPos;',
    '',
    'varying vec3 vWorldPos;',
    'varying vec3 vLocalPos;',
    'varying vec3 vWorldNormal;',
    'varying float vSpineS;',
    '',
    'float hash31(vec3 p) {',
    '  p = fract(p * 0.1031);',
    '  p += dot(p, p.yzx + 33.33);',
    '  return fract((p.x + p.y) * p.z);',
    '}',
    '',
    'float valueNoise3D(vec3 x) {',
    '  vec3 i = floor(x);',
    '  vec3 f = fract(x);',
    '  f = f * f * (3.0 - 2.0 * f);',
    '  return mix(',
    '    mix(mix(hash31(i + vec3(0.0, 0.0, 0.0)), hash31(i + vec3(1.0, 0.0, 0.0)), f.x),',
    '        mix(hash31(i + vec3(0.0, 1.0, 0.0)), hash31(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),',
    '    mix(mix(hash31(i + vec3(0.0, 0.0, 1.0)), hash31(i + vec3(1.0, 0.0, 1.0)), f.x),',
    '        mix(hash31(i + vec3(0.0, 1.0, 1.0)), hash31(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z);',
    '}',
    '',
    'vec3 acesToneMap(vec3 x) {',
    '  float a = 2.51;',
    '  float b = 0.03;',
    '  float c = 2.43;',
    '  float d = 0.59;',
    '  float e = 0.14;',
    '  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);',
    '}',
    '',
    'void main() {',
    '  // Severed upper curl clip once nippers snip at s = 0.895',
    '  if (uSeverTip > 0.5 && vSpineS >= 0.895) discard;',
    '',
    '  // Jagged 3D cellular crack perturbation at supersonic fracture wavefront',
    '  float n1 = valueNoise3D(vLocalPos * 26.0);',
    '  float n2 = valueNoise3D(vLocalPos * 68.0 + vec3(4.2));',
    '  float jag = (n1 - 0.5) * 0.022 + (n2 - 0.5) * 0.009;',
    '  float frontS = uFractureS + jag;',
    '  if (vSpineS > frontS) discard;',
    '',
    '  vec3 N = normalize(vWorldNormal);',
    '  if (!gl_FrontFacing) N = -N;',
    '  vec3 V = normalize(cameraPosition - vWorldPos);',
    '  float ndv = clamp(dot(N, V), 0.0, 1.0);',
    '',
    '  // Schlick Fresnel for high-index quenched soda-lime glass (n ~ 1.525)',
    '  float F0 = 0.044;',
    '  float fresnel = F0 + (1.0 - F0) * pow(1.0 - ndv, 4.6);',
    '',
    '  // 3-channel RGB chromatic dispersion refraction through convex glass volume',
    '  vec3 I = -V;',
    '  vec3 Nlens = normalize(mix(N, vec3(N.xy * 1.35, N.z * 0.65), 0.35));',
    '  vec3 refR = refract(I, Nlens, 1.0 / 1.504);',
    '  vec3 refG = refract(I, Nlens, 1.0 / 1.522);',
    '  vec3 refB = refract(I, Nlens, 1.0 / 1.544);',
    '  float colR = textureCube(uEnvCube, refR, 0.5).r;',
    '  float colG = textureCube(uEnvCube, refG, 0.5).g;',
    '  float colB = textureCube(uEnvCube, refB, 0.5).b;',
    '  vec3 refracted = vec3(colR, colG, colB) * vec3(0.96, 0.99, 1.03);',
    '',
    '  // Crisp studio cubemap reflection',
    '  vec3 R = reflect(I, N);',
    '  vec3 reflected = textureCube(uEnvCube, R, 0.0).rgb;',
    '',
    '  // Cross-polarized photoelastic birefringence (Michelson-Levy interference fringes)',
    '  // Core-to-surface compression/tension optical retardation gradient',
    '  float thicknessFactor = mix(1.85, 0.32, smoothstep(0.06, 0.85, vSpineS));',
    '  float radialGradient = sin(ndv * 3.14159265) * (0.55 + 0.85 * pow(ndv, 1.4));',
    '  float stressRetardation = radialGradient * thicknessFactor * 11.5 + vSpineS * 5.2;',
    '',
    '  // Phase 2: Acoustic compressive shock fringes radiating from bullet impact',
    '  if (uImpactShock > 0.001) {',
    '    float distImp = length(vWorldPos - uImpactPos);',
    '    float dtImp = max(0.0, uSimTime - 1.200);',
    '    float shockWave = sin(distImp * 18.0 - dtImp * 46.0) * exp(-distImp * 0.65);',
    '    stressRetardation += shockWave * 4.5 * uImpactShock;',
    '  }',
    '',
    '  // Phase 3: Cross-polarized stress pulse sweeping along spine (2.600s - 3.800s)',
    '  if (uStressPulse > 0.001) {',
    '    float pulseWave = sin(vSpineS * 12.0 - (uSimTime - 2.6) * 8.5) * 0.5 + 0.5;',
    '    stressRetardation += uStressPulse * (1.8 + 2.4 * pulseWave);',
    '  }',
    '',
    '  // Spectral interference colors (wavelength-dependent phase shift)',
    '  vec3 lambdaInv = vec3(1.00, 1.19, 1.44);',
    '  vec3 fringe = 0.5 - 0.5 * cos(stressRetardation * lambdaInv);',
    '  // Polarizer isoclinic dark neutral band between outer compression & inner tension',
    '  float neutralZone = smoothstep(0.20, 0.34, ndv) * (1.0 - smoothstep(0.34, 0.48, ndv));',
    '  fringe *= (1.0 - 0.52 * neutralZone);',
    '  float fringeStrength = (0.20 + 0.24 * uStressPulse + 0.22 * uImpactShock) * smoothstep(0.06, 0.35, ndv);',
    '',
    '  // Combine crystal-clear refracted glass, photoelastic fringes, and Fresnel reflection',
    '  vec3 glassBody = refracted * (0.65 + 0.55 * ndv) + fringe * fringeStrength;',
    '',
    '  // Dual cyan/magenta rim-light Fresnel accents & cool-white studio specular highlights',
    '  vec3 Lkey = normalize(vec3(-0.55, 0.68, 0.72));',
    '  vec3 Lcyan = normalize(vec3(-0.78, 0.28, -0.56));',
    '  vec3 Lmag = normalize(vec3(0.78, -0.28, -0.56));',
    '  float specKey = pow(max(dot(N, normalize(Lkey + V)), 0.0), 140.0) * 2.4;',
    '  float rimCyan = pow(1.0 - ndv, 3.2) * pow(max(dot(N, Lcyan), 0.0) * 0.5 + 0.5, 2.0) * 0.55;',
    '  float rimMag  = pow(1.0 - ndv, 3.2) * pow(max(dot(N, Lmag), 0.0) * 0.5 + 0.5, 2.0) * 0.48;',
    '',
    '  vec3 color = mix(glassBody, reflected * 1.18, clamp(fresnel * 1.45, 0.0, 0.94));',
    '  color += vec3(0.95, 0.98, 1.0) * specKey;',
    '  color += vec3(0.16, 0.88, 1.0) * rimCyan;',
    '  color += vec3(1.0, 0.24, 0.72) * rimMag;',
    '',
    '  // Internal waveguide glow during tail-snip triboluminescence flash',
    '  if (uTriboFlash > 0.001) {',
    '    float dCut = length(vWorldPos - uCutPos);',
    '    color += vec3(0.55, 0.85, 1.0) * uTriboFlash * exp(-dCut * 2.4) * 2.2;',
    '  }',
    '',
    '  // Phase 4/5: Opaque chalk-white supersonic bifurcation crack front ahead of s_front',
    '  float distToFront = frontS - vSpineS;',
    '  float alpha = clamp(0.84 + 0.16 * fresnel, 0.0, 1.0);',
    '  if (uWaveActive > 0.01 && distToFront < 0.068) {',
    '    float crackBand = 1.0 - clamp(distToFront / 0.068, 0.0, 1.0);',
    '    float branchPattern = abs(valueNoise3D(vLocalPos * vec3(55.0, 28.0, 55.0)) - 0.5) * 2.0;',
    '    float veins = smoothstep(0.32, 0.04, branchPattern) * smoothstep(0.0, 0.35, crackBand);',
    '    float opaqueCore = smoothstep(0.42, 0.96, crackBand);',
    '    float shatterMask = clamp(veins * 0.85 + opaqueCore, 0.0, 1.0) * uWaveActive;',
    '    vec3 crackGlow = mix(vec3(0.88, 0.95, 1.0), vec3(1.65, 1.78, 1.95), opaqueCore);',
    '    color = mix(color, crackGlow, shatterMask);',
    '    alpha = mix(alpha, 0.99, shatterMask);',
    '  }',
    '',
    '  color = acesToneMap(color * 1.08);',
    '  color = pow(color, vec3(1.0 / 2.2));',
    '  gl_FragColor = vec4(color, alpha);',
    '}'
  ].join('\n');

  var dropGeo = buildDropGeometry();
  var dropMat = new THREE.ShaderMaterial({
    uniforms: dropUniforms,
    vertexShader: dropVertShader,
    fragmentShader: dropFragShader,
    transparent: true,
    depthWrite: true,

  var dropMesh = new THREE.Mesh(dropGeo, dropMat);
  dropMesh.renderOrder = 2;
  scene.add(dropMesh);

  // Back-face subtle internal glass reflection shell (renders behind front glass wall)
  var dropBackMat = new THREE.ShaderMaterial({

  // Volumetric Opaque-White Supersonic Fracture Front Cone riding inside P(s_front)
  var fractureConeGeo = new THREE.ConeGeometry(1.0, 1.8, 32, 1, false);
  fractureConeGeo.rotateX(Math.PI * 0.5); // Tip points +Z (aligned to spine tangent)

  // Authentic Internal Vacuum Shrinkage Micro-Bubbles inside the Quenched Bulb & Lower Neck
  var internalBubbles = [];

      { s: 0.088, rOff: 0.14, ang: 0.8, rx: 0.042, ry: 0.056 },

  // =========================================================================
  // 8. SUBTLE DARK ANODIZED LABORATORY V-CLAMP FIXTURE (RECESSED AT s = 0.715)
  // =========================================================================
  var clampGroup = new THREE.Group();
  scene.add(clampGroup);

  (function buildAnodizedClamp() {
    sampleSpine(S_CLAMP, tmpSample);
    var rNeck = tmpSample.radius; // ~0.072

    var anodMat = new THREE.MeshStandardMaterial({
      color: 0x1b202b,
      metalness: 0.82,

    });
    var screwMat = new THREE.MeshStandardMaterial({

    });
    var padMat = new THREE.MeshStandardMaterial({

    });

    clampGroup.position.copy(tmpSample.pos);

    // Recessed C-collar behind the glass neck (-Z and -X) so front view (+Z) is 100% unobstructed
    var collarBack = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.22, 0.16), anodMat);

    clampGroup.add(collarBack);

    // Subtle upper & lower dark Viton V-pads cradling the rear/left (-X, -Z) of the glass neck
    var padGeo = new THREE.CylinderGeometry(0.036, 0.036, 0.18, 16);
    var pad1 = new THREE.Mesh(padGeo, padMat);

    var rodGeo = new THREE.CylinderGeometry(0.052, 0.058, 3.6, 20);
    rodGeo.rotateZ(Math.PI * 0.5);
    var rod = new THREE.Mesh(rodGeo, anodMat);
    rod.position.set(-1.92, 0.22, -rNeck - 0.15);

    // Knurled locking collar & hex cap screw
    var boss = new THREE.Mesh(new THREE.CylinderGeometry(0.088, 0.088, 0.16, 24), anodMat);
    boss.rotation.z = Math.PI * 0.5 - 0.12;

  })();

  // =========================================================================
  // 9. CONICAL LEAD BULLET, PLASTIC MUSHROOMING & RADIAL METALLIC SPALL
  // =========================================================================
  var BULLET_START_X = 8.85;
  var BULLET_IMPACT_X = impactPoint.x; // ~ +0.100
  var BULLET_Y = impactPoint.y;        // ~ -1.965
  var BULLET_Z = impactPoint.z;
  var BULLET_LEN = 0.64;
  var BULLET_RAD = 0.132;

  var bulletRings = 28;
  var bulletSegs = 36;
  var bulletVertCount = (bulletRings + 1) * (bulletSegs + 1);
  var bulletBaseU = new Float32Array(bulletVertCount);
  var bulletBaseTheta = new Float32Array(bulletVertCount);
  var bulletBaseRad = new Float32Array(bulletVertCount);
  var bulletPetalNoise = new Float32Array(bulletVertCount);

  var bulletGeo = (function createDeformableBulletGeometry() {
    var pos = new Float32Array(bulletVertCount * 3);
    var col = new Float32Array(bulletVertCount * 3);
    var indices = [];

    // Precompute deterministic petal asymmetry per angular sector
    var sectorJitter = new Float32Array(bulletSegs + 1);
    for (var s = 0; s < bulletSegs; s++) {
      var ang = (s / bulletSegs) * Math.PI * 2.0;
      sectorJitter[s] = 1.0 + 0.26 * Math.sin(ang * 8.0 + 0.7) + 0.15 * Math.cos(ang * 5.0 - 1.4) + (rng() - 0.5) * 0.12;
    }
    sectorJitter[bulletSegs] = sectorJitter[0];

    var ptr = 0;
    for (var r = 0; r <= bulletRings; r++) {
      var u = r / bulletRings; // 0 = nose tip (-X side), 1 = flat base (+X side)
      var rad;
      if (u < 0.54) {
        // Conical / secant-ogive lead projectile nose
        var nu = u / 0.54;
        rad = BULLET_RAD * Math.pow(Math.sin(nu * Math.PI * 0.5), 0.76);
      } else if (u < 0.96) {
        rad = BULLET_RAD;
        // Subtle lubrication / crimping cannelure grooves
        if (Math.abs(u - 0.66) < 0.025 || Math.abs(u - 0.78) < 0.025) {
          rad *= 0.91;
        }
      } else {
        // Closed base cap
        var bu = (1.0 - u) / 0.04;
        rad = BULLET_RAD * Math.sqrt(Math.max(0.0, bu));
      }

      var isCopperBand = (u >= 0.73);
      for (var c = 0; c <= bulletSegs; c++) {
        var th = (c / bulletSegs) * Math.PI * 2.0;
        // Subtle helical rifling land engravings along cylindrical bearing surface
        var rifling = (u > 0.48 && u < 0.94) ? (1.0 + 0.018 * Math.sin(th * 6.0 + u * 4.2)) : 1.0;
        var rFinal = rad * rifling;

        bulletBaseU[ptr] = u;
        bulletBaseTheta[ptr] = th;
        bulletBaseRad[ptr] = rFinal;
        bulletPetalNoise[ptr] = sectorJitter[c];

        pos[ptr * 3 + 0] = u * BULLET_LEN;
        pos[ptr * 3 + 1] = Math.cos(th) * rFinal;
        pos[ptr * 3 + 2] = Math.sin(th) * rFinal;

        if (isCopperBand) {
          // Gilded copper driving band / heel
          col[ptr * 3 + 0] = 0.78;
          col[ptr * 3 + 1] = 0.44;
          col[ptr * 3 + 2] = 0.25;
        } else {
          // Satin dark-pewter soft lead
          var shade = 0.42 + 0.05 * Math.sin(th * 6.0 + u * 4.2);
          col[ptr * 3 + 0] = shade * 0.96;
          col[ptr * 3 + 1] = shade * 1.00;
          col[ptr * 3 + 2] = shade * 1.08;
        }
        ptr++;
      }
    }

    for (var r2 = 0; r2 < bulletRings; r2++) {
      for (var c2 = 0; c2 < bulletSegs; c2++) {
        var a = r2 * (bulletSegs + 1) + c2;
        var b = (r2 + 1) * (bulletSegs + 1) + c2;
        var d = (r2 + 1) * (bulletSegs + 1) + (c2 + 1);
        var e = r2 * (bulletSegs + 1) + (c2 + 1);
        indices.push(a, b, e);
        indices.push(e, b, d);
      }
    }

    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setIndex(indices);
    g.computeVertexNormals();
    return g;
  })();

  var bulletBaseColors = new Float32Array(bulletGeo.attributes.color.array);

  var bulletMat = new THREE.MeshStandardMaterial({
    vertexColors: true,

    roughness: 0.30,

  var bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
  scene.add(bulletMesh);

  // Supersonic Aerodynamic Mach Wake Cone trailing incoming bullet (0.000s - 1.215s)
  var machConeGeo = new THREE.ConeGeometry(0.46, 2.2, 32, 1, true);
  machConeGeo.rotateZ(Math.PI * 0.5); // Tip at -X, flaring toward +X
  machConeGeo.translate(1.1, 0, 0);
  var machConeMat = configureAdditiveBlend(new THREE.ShaderMaterial({
    uniforms: {
      uOpacity: { value: 0.0 }
    },
    vertexShader: [
      'varying vec2 vUv;',
      'varying vec3 vNormal;',
      'varying vec3 vViewPos;',
      'void main() {',
      '  vUv = uv;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  vViewPos = -mv.xyz;',
      '  vNormal = normalize(normalMatrix * normal);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uOpacity;',
      'varying vec2 vUv;',
      'varying vec3 vNormal;',
      'varying vec3 vViewPos;',
      'void main() {',
      '  vec3 V = normalize(vViewPos);',
      '  float rim = 1.0 - abs(dot(normalize(vNormal), V));',
      '  float axial = smoothstep(0.0, 0.25, vUv.y) * (1.0 - smoothstep(0.35, 1.0, vUv.y));',
      '  float a = pow(rim, 2.2) * axial * uOpacity;',
      '  gl_FragColor = vec4(vec3(0.68, 0.84, 1.0), a);',
      '}'
    ].join('\n'),
    side: THREE.DoubleSide
  }));
  var machConeMesh = new THREE.Mesh(machConeGeo, machConeMat);
  scene.add(machConeMesh);

  // Acoustic Shockwave Ring Sprite / Shell on Bulb Impact (1.200s - 1.520s) and Terminal Burst (5.800s - 6.300s)
  var shockRingGeo = new THREE.RingGeometry(0.84, 1.0, 64);
  var shockRingMat = configureAdditiveBlend(new THREE.MeshBasicMaterial({
