<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Rupert’s Drop</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#dock button:focus-visible, #scrubber:focus-visible {
  outline: 2px solid rgba(177, 223, 240, 0.8);
  outline-offset: 3px;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

const DURATION = 8;
const FRACTURE_SPEED = 1600; // metres per physical second, along the spine.
const CAPTURE_FPS = 100000; // Interpolated ultra-high-speed photography.
const METRES_PER_UNIT = 0.028;
const BULLET_VELOCITY = 380; // m/s before plastic deformation.
const STATE = Object.freeze({
  COUNTDOWN: 'COUNTDOWN', PLAYING: 'PLAYING', PAUSED: 'PAUSED',
  REFIRE_HOLD: 'REFIRE_HOLD', ENDED: 'ENDED'
});

// The only source of procedural randomness. No random numbers are drawn in
// renderAt: the entire scene is a closed-form function of logical time.
function mulberry32(seed) {
  return function () {
    let n = seed += 0x6D2B79F5;
    n = Math.imul(n ^ n >>> 15, n | 1);
    n ^= n + Math.imul(n ^ n >>> 7, n | 61);
    return ((n ^ n >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(42);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
function smooth(a, b, x) {
  const q = clamp((x - a) / (b - a));
  return q * q * (3 - 2 * q);
}
const TAU = Math.PI * 2;
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.98;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.36, 0.05, 10);
// The camera never rotates: its optical axis is strictly perpendicular to XY.
camera.lookAt(0.36, 0.05, 0);

// A small, entirely in-memory photography studio. PMREM convolves its softboxes
// once; no image, cubemap, or other texture is downloaded.
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x10151e);
function softbox(x, y, z, w, h, color, intensity) {
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide }));
  panel.position.set(x, y, z);
  panel.lookAt(0, 0, 0);
  studio.add(panel);
}
softbox(-3.8, 1.8, 3.2, 1.1, 7, 0xe6f6ff, 4.5);
softbox(3.6, 0.1, 2.4, 0.42, 6, 0xe9faff, 4.0);
softbox(0, 5, 0, 5, 2.6, 0xf3f7ff, 3.2);
softbox(-2.7, -1.4, -3, 1.2, 4.5, 0x5bd9ed, 2.3);
softbox(3, 2.5, -2.6, 0.6, 4.2, 0xe9a7d3, 1.7);
softbox(0.2, -4, 1, 4, 0.5, 0xaac5dc, 1.1);
const pmrem = new THREE.PMREMGenerator(renderer);
const environment = pmrem.fromScene(studio, 0.035, 0.1, 30);
scene.environment = environment.texture;
pmrem.dispose();
studio.traverse(o => {
  if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); }
});
scene.add(new THREE.HemisphereLight(0xe1f6ff, 0x171620, 0.32));
function light(color, power, x, y, z) {
  const l = new THREE.DirectionalLight(color, power);
  l.position.set(x, y, z); scene.add(l); return l;
}
light(0xecf8ff, 1.65, -3, 5, 5);
light(0x8eeaff, 1.15, -3, 0.4, -2);
light(0xd899c1, 0.7, 3, 2.5, -1.8);
light(0xcad7e3, 0.35, 1, -4, 3);

// Arc-length parameterization is shared by the surface, fracture, and fragments.
const spine = new THREE.CatmullRomCurve3([
  V(-0.13, -2.10), V(-0.12, -1.75), V(-0.07, -1.25),
  V(0.035, -0.65), V(0.12, -0.05), V(0.09, 0.55),
  V(0.045, 1.02, 0.01), V(0.13, 1.49, 0.025),
  V(0.40, 1.89, 0.055), V(0.79, 2.045, 0.015),
  V(1.015, 1.89, -0.07), V(0.97, 1.66, -0.10),
  V(0.77, 1.62, -0.035), V(0.66, 1.79, 0.03),
  V(0.78, 1.93, 0.06)
], false, 'centripetal');
spine.arcLengthDivisions = 1200;
spine.updateArcLengths();
const SPINE_LENGTH = spine.getLength();
const FRACTURE_SECONDS = SPINE_LENGTH * METRES_PER_UNIT / FRACTURE_SPEED;
const FRACTURE_CAPTURE_FRAMES = FRACTURE_SECONDS * CAPTURE_FPS;
const profile = [
  [0, 0.002], [0.022, 0.28], [0.065, 0.51], [0.12, 0.645],
  [0.17, 0.66], [0.225, 0.55], [0.29, 0.375], [0.365, 0.205],
  [0.44, 0.105], [0.52, 0.062], [0.63, 0.039], [0.74, 0.025],
  [0.84, 0.017], [0.94, 0.010], [1, 0.0015]
];
function radiusAt(s) {
  if(s<0.022)return Math.max(0.0015,0.28*Math.sqrt(Math.max(0,s)/0.022));
  let i = 0;
  while (i < profile.length - 2 && s > profile[i + 1][0]) i++;
  const a = profile[i], b = profile[i + 1];
  const p = profile[Math.max(0, i - 1)], n = profile[Math.min(profile.length - 1, i + 2)];
  const d = b[0] - a[0], t = clamp((s - a[0]) / d), t2 = t * t, t3 = t2 * t;
  const m0 = (b[1] - p[1]) / (b[0] - p[0]);
  const m1 = (n[1] - a[1]) / (n[0] - a[0]);
  return Math.max(0.001, (2*t3-3*t2+1)*a[1] + (t3-2*t2+t)*m0*d +
    (-2*t3+3*t2)*b[1] + (t3-t2)*m1*d);
}
function frameAt(s) {
  const center = spine.getPointAt(clamp(s));
  const tangent = spine.getTangentAt(clamp(s)).normalize();
  const side = V(tangent.y, -tangent.x, 0).normalize();
  const binormal = new THREE.Vector3().crossVectors(tangent, side).normalize();
  return { center, side, binormal, radius: radiusAt(s) };
}
function surfacePoint(s, angle, radial = 1) {
  const f = frameAt(s);
  return f.center.addScaledVector(f.side, Math.cos(angle) * f.radius * radial)
    .addScaledVector(f.binormal, Math.sin(angle) * f.radius * radial);
}
function dropGeometry(start = 0, end = 1, scale = 1, rings = 360, sides = 64) {
  const positions = [], parameters = [], radii = [], angles = [], indices = [];
  for (let i = 0; i <= rings; i++) {
    const s = start + (end - start) * i / rings, f = frameAt(s);
    for (let j = 0; j <= sides; j++) {
      const a = TAU * j / sides;
      const p = f.center.clone().addScaledVector(f.side, Math.cos(a)*f.radius*scale)
        .addScaledVector(f.binormal, Math.sin(a)*f.radius*scale);
      positions.push(p.x, p.y, p.z); parameters.push(s); radii.push(f.radius); angles.push(a);
      if (i < rings && j < sides) {
        const k = i * (sides + 1) + j;
        indices.push(k, k + 1, k + sides + 1, k + 1, k + sides + 2, k + sides + 1);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('aSpine', new THREE.Float32BufferAttribute(parameters, 1));
  g.setAttribute('aRadius', new THREE.Float32BufferAttribute(radii, 1));
  g.setAttribute('aAngle', new THREE.Float32BufferAttribute(angles, 1));
  g.setIndex(indices); g.computeVertexNormals(); return g;
}

const timeUniform = { value: 0 };
const frontUniform = { value: 1.01 };
const cutUniform = { value: 1.01 };
const pulseUniform = { value: 0 };
const glassGroup = new THREE.Group(); scene.add(glassGroup);
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe4f7f9, metalness: 0, roughness: 0.058,
  transmission: 0.93, reflectivity: 0.5, clearcoat: 1,
  clearcoatRoughness: 0.045, envMap: environment.texture,
  envMapIntensity: 1.65, transparent: true, opacity: 0.91,
  side: THREE.DoubleSide, depthWrite: false
});
glassMaterial.onBeforeCompile = shader => {
  Object.assign(shader.uniforms, {
    uTime: timeUniform, uFront: frontUniform, uCut: cutUniform, uPulse: pulseUniform
  });
  shader.vertexShader = 'attribute float aSpine; attribute float aRadius; attribute float aAngle;\n' +
    'varying float vSpine; varying float vRadius; varying float vAngle;\n' + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>',
    '#include <begin_vertex>\nvSpine=aSpine; vRadius=aRadius; vAngle=aAngle;');
  shader.fragmentShader = 'uniform float uTime; uniform float uFront; uniform float uCut; uniform float uPulse;\n' +
    'varying float vSpine; varying float vRadius; varying float vAngle;\n' + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>',
    '#include <clipping_planes_fragment>\nif(vSpine > min(uFront,uCut)) discard;');
  shader.fragmentShader = shader.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );', `
    float facing = abs(dot(normal, normalize(vViewPosition)));
    float thickness = vRadius * sqrt(max(0.0, 1.0 - pow(cos(vAngle), 2.0)));
    float retardation = thickness * 26.0 + vSpine * 9.0 + uPulse * 0.7;
    vec3 spectrum = 0.5 + 0.5*cos(retardation + vec3(0.0,2.094,4.189));
    float extinction = pow(sin(retardation*0.56), 2.0);
    outgoingLight += spectrum * extinction * (0.11+uPulse*0.15) * facing;
    outgoingLight += vec3(0.045,0.19,0.25) * pow(1.0-facing, 3.5);
    #ifdef ENVMAP_TYPE_CUBE_UV
      vec3 worldNormal=inverseTransformDirection(normal,viewMatrix);
      vec3 incident=inverseTransformDirection(-normalize(vViewPosition),viewMatrix);
      vec3 refracted=refract(incident,worldNormal,1.0/1.52);
      outgoingLight+=textureCubeUV(envMap,refracted,0.08).rgb*0.09*facing;
    #endif
    float fracture = exp(-pow((vSpine-uFront)*190.0, 2.0));
    outgoingLight += vec3(0.7,0.92,1.0)*fracture*3.0;
    gl_FragColor = vec4( outgoingLight, diffuseColor.a );
  `);
};
const glass = new THREE.Mesh(dropGeometry(), glassMaterial);
glass.renderOrder = 2;
glassGroup.add(glass);

// Photoelastic extinction bands: optical path retardance varies through the
// tensile core and compressive shell; crossed polarizers reveal isochromatics.
const stressMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: timeUniform, uFront: frontUniform, uCut: cutUniform, uPulse: pulseUniform },
  vertexShader: `
    attribute float aSpine; attribute float aRadius; attribute float aAngle;
    varying float vS; varying float vR; varying float vA;
    varying vec3 vNormal; varying vec3 vEye;
    void main(){
      vS=aSpine; vR=aRadius; vA=aAngle;
      vec4 p=modelViewMatrix*vec4(position,1.0);
      vNormal=normalize(normalMatrix*normal); vEye=-p.xyz;
      gl_Position=projectionMatrix*p;
    }`,
  fragmentShader: `
    uniform float uTime; uniform float uFront; uniform float uCut; uniform float uPulse;
    varying float vS; varying float vR; varying float vA;
    varying vec3 vNormal; varying vec3 vEye;
    void main(){
      if(vS>min(uFront,uCut)) discard;
      float facing=abs(dot(normalize(vNormal),normalize(vEye)));
      float chord=sqrt(max(0.0,1.0-pow(cos(vA),2.0)));
      float radialStress=chord*(1.0-0.44*chord*chord);
      float phase=vR*radialStress*65.0+vS*11.0;
      phase+=uPulse*1.4*exp(-pow((vS-0.24)*3.0,2.0));
      float band=pow(0.5+0.5*cos(phase*2.0),5.0);
      vec3 tint=0.5+0.5*cos(phase+vec3(0.0,2.094,4.189));
      float pol=pow(sin(vA*2.0+0.55),2.0);
      float a=(0.095+uPulse*0.11)*band*pol*pow(facing,0.4);
      gl_FragColor=vec4(mix(vec3(0.52,0.84,0.91),tint,0.65),a);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending
});
const stress = new THREE.Mesh(dropGeometry(0, 1, 0.87, 220, 48), stressMaterial);
stress.renderOrder = 3; glassGroup.add(stress);

// Dark suspension hardware, deliberately fine enough to leave the glass clear.
const anodized = new THREE.MeshStandardMaterial({ color: 0x20272e, metalness: 0.82, roughness: 0.37 });
const steel = new THREE.MeshStandardMaterial({ color: 0x9caab5, metalness: 1, roughness: 0.26, envMapIntensity: 0.72 });
const bevelSteel = new THREE.MeshStandardMaterial({ color: 0xd0d7dd, metalness: 1, roughness: 0.19, envMapIntensity: 0.95 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x28313b, metalness: 0.95, roughness: 0.3, envMapIntensity: 0.45 });
const gripMaterial = new THREE.MeshStandardMaterial({ color: 0x090d12, metalness: 0, roughness: 0.73, envMapIntensity: 0.08 });
// Parallel micro-grooves modulate the steel's roughness in object coordinates.
for(const material of [steel,bevelSteel,darkSteel]){
  material.onBeforeCompile=shader=>{
    shader.vertexShader='varying vec3 vBrushed;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\nvBrushed=position;');
    shader.fragmentShader='varying vec3 vBrushed;\n'+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace('#include <roughnessmap_fragment>',`
      #include <roughnessmap_fragment>
      float grain=sin(vBrushed.y*420.0+sin(vBrushed.x*43.0)*0.6);
      roughnessFactor=clamp(roughnessFactor+grain*0.008,0.08,0.85);
    `);
  };
}
const hangerS = 0.47, hangerFrame = frameAt(hangerS);
const collar = new THREE.Mesh(new THREE.TorusGeometry(hangerFrame.radius+0.012,0.009,8,64), anodized);
collar.position.copy(hangerFrame.center);
collar.quaternion.setFromUnitVectors(V(0,0,1), spine.getTangentAt(hangerS));
scene.add(collar);
const hangerCurve = new THREE.CatmullRomCurve3([
  V(-0.30,4.5,-0.08), V(-0.30,1.5,-0.08),
  hangerFrame.center.clone().add(V(-0.09,0.09,-0.025)),
  hangerFrame.center.clone().add(V(-0.035,0.025,-0.035))
]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(hangerCurve,70,0.0032,5,false),anodized));

// Two mirrored, independently articulated forged-steel cutter halves.
const CUT_S = 0.967;
const cutPoint = spine.getPointAt(CUT_S);
const nippers = new THREE.Group(); scene.add(nippers);
const toolScale = 0.72, toolAngle = 0.15;
const toolEuler=new THREE.Euler(0.16,-0.26,toolAngle);
const toolRest=cutPoint.clone().add(V(toolScale,0,0).applyEuler(toolEuler)).add(V(0,0,0.045));
nippers.position.copy(toolRest);nippers.scale.setScalar(toolScale);nippers.rotation.copy(toolEuler);
function extrude(shape, depth, material, bevel = 0.02) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevel,
    bevelSize: bevel, bevelSegments: 3, curveSegments: 18, steps: 1
  });
  g.translate(0,0,-depth/2);
  return new THREE.Mesh(g,material);
}
function cutterHalf(mirror) {
  const g = new THREE.Group(); nippers.add(g);
  const jaw = new THREE.Shape();
  jaw.moveTo(-1.015,0.007); jaw.lineTo(-0.79,0.225);
  jaw.bezierCurveTo(-0.57,0.40,-0.28,0.32,-0.05,0.15);
  jaw.lineTo(0.19,0.095); jaw.lineTo(0.20,-0.10); jaw.lineTo(-0.12,-0.13);
  jaw.bezierCurveTo(-0.35,0.045,-0.57,0.15,-0.75,0.095);
  jaw.lineTo(-0.96,-0.009); jaw.closePath();
  const head = extrude(jaw,0.13,steel,0.022); head.scale.y=mirror; g.add(head);
  const edge = new THREE.Shape();

  edge.lineTo(-0.97,-0.009);edge.closePath();

  severedTip.visible=t>=4.045&&t<5.1;
  severedTip.position.copy(cutPoint).add(V(-tipAge*0.22,-tipAge*tipAge*0.7,tipAge*0.10));
  severedTip.rotation.set(tipAge*1.4,tipAge*0.8,tipAge*1.8);

  shards.visible=t>=4.4;dust.visible=t>=4.4;cracks.visible=t>=4.4&&t<5.8;
  renderer.render(scene,camera);
}

const countdown=document.getElementById('countdown');
const scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle');
const pauseIcon=document.getElementById('icon-pause');
const playIcon=document.getElementById('icon-play');
let state=STATE.COUNTDOWN;
let simTime=0,playbackSpeed=1,countdownElapsed=0,holdElapsed=0;
let countdownStart=null,holdStart=null,lastTimestamp=null;

function hideCountdown(){countdown.style.display='none';countdown.textContent='';}
function setState(next){
  state=next;
  const paused=next===STATE.PAUSED||next===STATE.ENDED;
  pauseIcon.style.display=paused?'none':'block';playIcon.style.display=paused?'block':'none';
  toggle.setAttribute('aria-label',paused?'Play':'Pause');
  if(next!==STATE.COUNTDOWN)hideCountdown();
}
function cancelWait(){countdownStart=null;holdStart=null;countdownElapsed=0;holdElapsed=0;hideCountdown();}
toggle.addEventListener('click',()=>{
  if(state===STATE.PLAYING){setState(STATE.PAUSED);}
  else if(state===STATE.COUNTDOWN||state===STATE.REFIRE_HOLD){
    cancelWait();simTime=0;scrubber.value='0';setState(STATE.PAUSED);renderAt(0);
  }else{
    if(state===STATE.ENDED){simTime=0;scrubber.value='0';renderAt(0);}
    cancelWait();lastTimestamp=performance.now();setState(STATE.PLAYING);
  }
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  cancelWait();simTime=0;scrubber.value='0';renderAt(0);
  holdElapsed=0;holdStart=performance.now();setState(STATE.REFIRE_HOLD);
});
const speedPills=Array.from(document.querySelectorAll('.speed-pill'));
speedPills.forEach(pill=>pill.addEventListener('click',()=>{
  playbackSpeed=parseFloat(pill.dataset.speed);
  speedPills.forEach(p=>{
    const active=p===pill;p.classList.toggle('is-active',active);
    p.setAttribute('aria-checked',active?'true':'false');
  });
}));
scrubber.addEventListener('input',()=>{
  cancelWait();simTime=clamp(parseFloat(scrubber.value),0,DURATION);
  setState(STATE.PAUSED);renderAt(simTime);
});
function resize(){
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.position.z=Math.max(10,2.8/(camera.aspect*Math.tan(35*Math.PI/360)));
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  pixelUniform.value=Math.min(window.devicePixelRatio||1,2);
  renderAt(simTime);
}
window.addEventListener('resize',resize);

function frame(timestamp){
  const dt=lastTimestamp===null?0:Math.min(0.1,Math.max(0,(timestamp-lastTimestamp)/1000));
  lastTimestamp=timestamp;
  if(state===STATE.COUNTDOWN){
    if(countdownStart===null)countdownStart=timestamp;
    countdownElapsed=(timestamp-countdownStart)/1000;
    simTime=0;scrubber.value='0';
    if(countdownElapsed<3){
      countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed));
    }else{setState(STATE.PLAYING);simTime=Math.min(DURATION,dt*playbackSpeed);}
  }else if(state===STATE.REFIRE_HOLD){
    holdElapsed=(timestamp-holdStart)/1000;
    if(holdElapsed>=1){setState(STATE.PLAYING);simTime=Math.min(DURATION,dt*playbackSpeed);}
  }else if(state===STATE.PLAYING){
    simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
  }
  if(state===STATE.PLAYING){
    scrubber.value=simTime.toFixed(3);
    if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);setState(STATE.ENDED);}
  }
  renderAt(simTime);
  requestAnimationFrame(frame);
}

// Render the resting scene before the first callback starts the real-time clock.
hideCountdown();resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
