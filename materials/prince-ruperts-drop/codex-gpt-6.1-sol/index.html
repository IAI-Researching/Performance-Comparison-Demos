<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0f">
<title>Prince Rupert’s Drop — Bullet Impact / Tail Fracture</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#dock button:focus-visible, #scrubber:focus-visible {
  outline: 2px solid rgba(183, 229, 247, 0.85);
  outline-offset: 3px;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(() => {
  const DURATION = 8;
  const SEED = 42;
  const FRACTURE_SPEED_MPS = 1600;
  const CAPTURE_FPS = 100000;
  const METERS_PER_UNIT = 0.025;
  const WAVE_START = 4.4, WAVE_END = 5.8, SNIP_TIME = 4.05;
  const TAU = Math.PI * 2;
  const clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  const smooth = (a, b, x) => { const f = clamp((x - a) / (b - a)); return f * f * (3 - 2 * f); };

  // All randomness is consumed ONCE, at construction. renderAt has no RNG or integrator state.
  function mulberry32(seed) {
    return function () {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const random = mulberry32(SEED);
  const range = (a, b) => a + (b - a) * random();

  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.13;
  renderer.setClearColor(0x090a0f, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 80);
  camera.position.set(0.25, 0.13, 12.25);
  camera.lookAt(0.25, 0.13, 0);

  // An in-memory, high-dynamic-range photographic light tent. No images or network textures.
  function studioEnvironment() {
    const studio = new THREE.Scene();
    studio.background = new THREE.Color(0x1a202a);
    const panels = [];
    function panel(w, h, x, y, z, color, power) {
      const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(power), side: THREE.DoubleSide });
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
      p.position.set(x, y, z); p.lookAt(0, 0, 0); studio.add(p); panels.push(p);
    }
    panel(1.25, 6.5, -3.8, 1.4, 3, 0xf1f7ff, 5);
    panel(0.23, 6, 3.2, 0.5, 2.5, 0xd7f8ff, 6);
    panel(3.8, 0.65, -0.6, 4, 1.8, 0xe6edff, 3.8);
    panel(0.8, 4, -2.7, 0.1, -3, 0x72d5ef, 2.5);
    panel(0.5, 4.8, 3.3, 1, -2, 0xd8a4db, 2.2);
    panel(2, 0.5, 0.5, -3, 3, 0x9daabe, 1.5);
    const pmrem = new THREE.PMREMGenerator(renderer);
    const target = pmrem.fromScene(studio, 0.025, 0.1, 30);
    panels.forEach(p => { p.geometry.dispose(); p.material.dispose(); });
    pmrem.dispose();
    return target.texture;
  }
  const environment = studioEnvironment();
  scene.environment = environment;
  scene.add(new THREE.HemisphereLight(0xd6ecff, 0x22212d, 0.45));
  function light(color, intensity, x, y, z) {
    const l = new THREE.DirectionalLight(color, intensity); l.position.set(x, y, z); scene.add(l);
  }
  light(0xe5f1ff, 2.4, -3, 4, 5);
  light(0x83e9ff, 1.8, -4, 1, -3);
  light(0xd6a2db, 1.35, 4, 2, -2);
  light(0xffffff, 0.6, 3, -2, 4);

  // Centerline, followed at true normalized arc length (not spline parameter).
  const controls = [
    [-0.46,-2.22,0], [-0.47,-1.94,0], [-0.45,-1.39,0],
    [-0.36,-0.86,0], [-0.22,-0.30,0], [-0.02,0.32,0],
    [0.21,0.96,0.01], [0.44,1.56,0.02], [0.60,2.09,0.055],
    [0.57,2.48,0.12], [0.33,2.67,0.21], [0.08,2.56,0.27],
    [0.07,2.34,0.25], [0.24,2.29,0.20]
  ];
  const radii = [0.004,0.58,0.815,0.665,0.31,0.135,0.065,0.038,0.026,0.021,0.016,0.012,0.008,0.002];
  const spine = new THREE.CatmullRomCurve3(controls.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  spine.arcLengthDivisions = 1600;
  spine.updateArcLengths();
  const spineLength = spine.getLength();
  const physicalLength = spineLength * METERS_PER_UNIT;
  const physicalWaveDuration = physicalLength / FRACTURE_SPEED_MPS;
  // The microsecond event is stretched into the specified 1.4 s observation window.
  // At 60 display Hz this exceeds 50,000 effective captured frames/physical second.
  const observationStretch = (WAVE_END - WAVE_START) / physicalWaveDuration;
  function fractureFront(t) {
    if (t < SNIP_TIME) return 1.01;
    if (t < WAVE_START) return 0.984;
    const physicalElapsed = (t - WAVE_START) / observationStretch;
    return Math.min(0.984, 1 - FRACTURE_SPEED_MPS * physicalElapsed / physicalLength);
  }
  function radiusAt(s) {
    const u = spine.getUtoTmapping(clamp(s));
    const k = u * (radii.length - 1), i = Math.min(radii.length - 2, Math.floor(k));
    const f = k - i, a = radii[i], b = radii[i + 1];
    if(i===0) return a+(b-a)*Math.sqrt(f)*(1.2-0.2*f);
    const m0 = i === 0 ? b - a : (b - radii[i - 1]) * 0.5;
    const m1 = i + 2 >= radii.length ? b - a : (radii[i + 2] - a) * 0.5;
    return Math.max(0.001, (2*f*f*f-3*f*f+1)*a + (f*f*f-2*f*f+f)*m0 + (-2*f*f*f+3*f*f)*b + (f*f*f-f*f)*m1);
  }
  const SAMPLE_COUNT = 640;
  const frames = spine.computeFrenetFrames(SAMPLE_COUNT, false);
  const samples = Array.from({length: SAMPLE_COUNT + 1}, (_, i) => ({
    p: spine.getPointAt(i / SAMPLE_COUNT), n: frames.normals[i], b: frames.binormals[i], r: radiusAt(i / SAMPLE_COUNT)
  }));
  function sample(s) {
    const k = clamp(s) * SAMPLE_COUNT, i = Math.min(SAMPLE_COUNT - 1, Math.floor(k)), f = k - i;
    const a = samples[i], b = samples[i + 1];
    return {p: a.p.clone().lerp(b.p, f), n: a.n.clone().lerp(b.n, f).normalize(), b: a.b.clone().lerp(b.b, f).normalize(), r: a.r + (b.r - a.r) * f};
  }
  function surfacePoint(s, theta, radial = 1) {
    const f = sample(s);
    return f.p.addScaledVector(f.n, Math.cos(theta) * f.r * radial).addScaledVector(f.b, Math.sin(theta) * f.r * radial);
  }
  function dropGeometry(s0 = 0, s1 = 1, rows = 280, sides = 64) {
    const pos = [], uv = [], arc = [], indices = [];
    for (let i = 0; i <= rows; i++) {
      const s = s0 + (s1 - s0) * i / rows, f = sample(s);
      for (let j = 0; j <= sides; j++) {
        const theta = TAU * j / sides;
        const p = f.p.clone().addScaledVector(f.n, f.r * Math.cos(theta)).addScaledVector(f.b, f.r * Math.sin(theta));
        pos.push(p.x, p.y, p.z); uv.push(j / sides, s); arc.push(s);
        if (i < rows && j < sides) {
          const a = i*(sides+1)+j, b = a+sides+1;
          indices.push(a,a+1,b, b,a+1,b+1);
        }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute('aSpine', new THREE.Float32BufferAttribute(arc, 1));
    g.setIndex(indices); g.computeVertexNormals();
    return g;
  }
  const uniforms = {
    uTime: { value: 0 }, uFront: { value: 1.01 }, uRing: {value: 0},
    uPulse: {value: 0}, uFracturing: {value: 0}
  };

  const glass = new THREE.MeshPhysicalMaterial({
    color: 0xdceff2, metalness: 0, roughness: 0.045,
    transmission: 0.87, transparent: true, opacity: 0.93,
    clearcoat: 1, clearcoatRoughness: 0.035,
    reflectivity: 0.8, envMap: environment, envMapIntensity: 1.32,
    side: THREE.DoubleSide, depthWrite: false
  });
  // Photoelastic optical retardation: crossed polarizers turn principal-stress
  // differences into wavelength-dependent sin² transmission, strongest near the skin.
  glass.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, uniforms);
    shader.vertexShader = `attribute float aSpine;
      varying float vArc; varying vec3 vGlassObject; varying vec3 vGlassNormal;
      uniform float uRing; uniform float uTime;
      ${shader.vertexShader}`;
    shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vArc = aSpine; vGlassObject = position; vGlassNormal = normal;
      transformed += normal * uRing * sin(aSpine * 34.0 - (uTime-1.2)*38.0);
    `);
    shader.fragmentShader = `varying float vArc; varying vec3 vGlassObject; varying vec3 vGlassNormal;
      uniform float uTime; uniform float uFront; uniform float uPulse; uniform float uFracturing;
      ${shader.fragmentShader}`;
    shader.fragmentShader = shader.fragmentShader.replace('#include <clipping_planes_fragment>', `
      #include <clipping_planes_fragment>
      if (vArc > uFront) discard;
    `);
    shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `
      #include <color_fragment>
      float opticalDepth = pow(max(0.0, 1.0-abs(normalize(vGlassNormal).z)), 0.62);
      float retardation = 5.4*opticalDepth + 0.46*sin(vArc*29.0) + uPulse*sin(vArc*27.0-uTime*7.0);
      vec3 wavelengths = vec3(0.650,0.510,0.440);
      vec3 spectrum = sin(retardation / wavelengths + vec3(0.13,0.32,0.47));
      vec3 fringes = spectrum * spectrum;
      diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.22)+fringes*0.78, (0.11+uPulse*0.035)*opticalDepth);
    `);
    shader.fragmentShader = shader.fragmentShader.replace('#include <emissivemap_fragment>', `
      #include <emissivemap_fragment>
      float frontGlow = exp(-pow((vArc-uFront)/0.008,2.0))*uFracturing;
      totalEmissiveRadiance += vec3(0.76,0.9,1.0)*frontGlow*2.4;
    `);
  };
  glass.customProgramCacheKey = () => 'quenched-glass-v1';
  const bodyGeometry = dropGeometry();
  const drop = new THREE.Mesh(bodyGeometry, glass);
  drop.renderOrder = 3; scene.add(drop);

  // A restrained inner optical field adds the visible core/surface stress gradient.
  const stressMaterial = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `attribute float aSpine; varying float vS; varying vec3 vN; varying vec3 vP;
      uniform float uRing; uniform float uTime;
      void main(){
        vS=aSpine; vP=position; vN=normalize(normalMatrix*normal);
        vec3 p=position+normal*uRing*sin(aSpine*34.0-(uTime-1.2)*38.0);
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
      }`,
    fragmentShader: `varying float vS; varying vec3 vN; varying vec3 vP;
      uniform float uTime; uniform float uFront; uniform float uPulse;
      void main(){
        if(vS>uFront) discard;
        float rim=pow(1.0-abs(normalize(vN).z),1.8);
        float core=pow(max(0.0,1.0-abs(vP.x+0.40)*1.20),1.4);
        float stress=5.6*rim+0.75*sin(vS*19.0)+uPulse*0.23*sin(vS*30.0-uTime*7.0);
        vec3 c=0.5+0.5*cos(stress*vec3(2.25,2.9,3.7)+vec3(0.2,1.2,2.3));
        c=mix(vec3(0.28,0.57,0.65),c,0.72);
        float band=pow(0.5+0.5*cos(stress*3.1),4.0);
        gl_FragColor=vec4(c,(0.045+rim*0.115+band*0.09)*core*(1.0+uPulse*0.3));
      }`,
    transparent: true, depthWrite: false, side: THREE.FrontSide,
    blending: THREE.AdditiveBlending
  });
  const stress = new THREE.Mesh(bodyGeometry, stressMaterial); stress.renderOrder = 4; scene.add(stress);

  // Fine, dark suspension stays in the scene after the specimen has disappeared.
  const neck = sample(0.47);
  const loop = new THREE.Mesh(new THREE.TorusGeometry(neck.r+0.024,0.012,8,64), new THREE.MeshStandardMaterial({color:0x252d35,metalness:0.85,roughness:0.31}));
  loop.position.copy(neck.p); loop.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),spine.getTangentAt(0.47)); scene.add(loop);
  const wireGeometry = new THREE.BufferGeometry().setFromPoints([
    neck.p.clone().add(new THREE.Vector3(-neck.r,0,-0.03)), new THREE.Vector3(-1.62,3.95,-0.28)
  ]);
  scene.add(new THREE.Line(wireGeometry,new THREE.LineBasicMaterial({color:0x79818b,transparent:true,opacity:0.27})));

  // Machined side cutters, with two independently pivoting jaws and crossed handles.
  const tip = spine.getPointAt(0.989);
  const nippers = new THREE.Group();
  nippers.position.set(tip.x+0.88,tip.y+0.05,tip.z+0.08);
  nippers.rotation.z=0.06; scene.add(nippers);
  const steel = new THREE.MeshStandardMaterial({color:0x566778,metalness:0.97,roughness:0.26,envMapIntensity:1.05});
  const steelEdge = new THREE.MeshStandardMaterial({color:0xb9c7d3,metalness:1,roughness:0.13,envMapIntensity:1.4});
  const graphite = new THREE.MeshStandardMaterial({color:0x030609,metalness:0,roughness:0.78,envMapIntensity:0.12});
  const gripInset = new THREE.MeshStandardMaterial({color:0x0c151b,metalness:0.08,roughness:0.64,envMapIntensity:0.2});
  const halves = [];
  function tube(points, radius, material) {
    const c = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
    return new THREE.Mesh(new THREE.TubeGeometry(c,40,radius,12,false),material);
  }
  for (const sign of [1,-1]) {
    const half = new THREE.Group(); nippers.add(half); halves.push(half);
    const outline = new THREE.Shape();
    outline.moveTo(-0.90,sign*0.013);
    outline.bezierCurveTo(-0.72,sign*0.19,-0.40,sign*0.31,-0.12,sign*0.27);
    outline.bezierCurveTo(0.20,sign*0.26,0.28,sign*0.04,0.10,sign*-0.13);
    outline.lineTo(-0.14,sign*-0.13); outline.lineTo(-0.48,sign*0.015); outline.closePath();
    const jaw = new THREE.Mesh(new THREE.ExtrudeGeometry(outline,{depth:0.14,bevelEnabled:true,bevelThickness:0.023,bevelSize:0.025,bevelSegments:3,curveSegments:20}),steel);
    jaw.position.z=-0.07; half.add(jaw);
    const bevel = new THREE.Shape();
    bevel.moveTo(-0.90,sign*0.013); bevel.lineTo(-0.48,sign*0.015); bevel.lineTo(-0.25,sign*0.12); bevel.lineTo(-0.57,sign*0.11); bevel.closePath();
    const edge = new THREE.Mesh(new THREE.ShapeGeometry(bevel),steelEdge); edge.position.z=0.097; half.add(edge);
    half.add(tube([[0,0,0],[0.38,-sign*0.17,0],[0.75,-sign*0.30,0],[1.23,-sign*0.43,0],[1.75,-sign*0.47,0]],0.068,steel));
    half.add(tube([[0.56,-sign*0.25,0],[0.90,-sign*0.36,0],[1.32,-sign*0.44,0],[1.78,-sign*0.47,0]],0.112,graphite));
    half.add(tube([[0.66,-sign*0.24,0.093],[1.02,-sign*0.35,0.093],[1.43,-sign*0.40,0.093],[1.71,-sign*0.42,0.093]],0.018,gripInset));
    // Brushed, parallel machining marks, modeled rather than image-mapped.
    const marks = [];
    for(let j=0;j<17;j++) {
      const x=-0.45+j*0.026;
      marks.push(x,sign*0.17,0.098,x+0.08,sign*0.22,0.098);
    }
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(marks,3));
    half.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:0x293540,transparent:true,opacity:0.22})));

  // Native buttons work with Space/Enter; radio arrows follow the ARIA radiogroup pattern.
  document.getElementById('speed-group').addEventListener('keydown',event=>{
    if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(event.key))return;
    event.preventDefault();const i=pills.indexOf(document.activeElement);
    const next=event.key==='Home'?0:event.key==='End'?3:(i+(event.key==='ArrowLeft'||event.key==='ArrowUp'?-1:1)+4)%4;
    pills[next].focus();pills[next].click();
  });

  function frame(timestamp){
    // Initial resting scene was rendered synchronously below. The first RAF starts
    // the three-second clock at ZERO, so shader compilation can never swallow "3".
    const dt=lastWall===null?0:Math.min(Math.max(0,(timestamp-lastWall)/1000),0.1);
    lastWall=timestamp;
    if(state===State.COUNTDOWN){
      // Decimal thresholds must not slip a frame through floating-point summation.
      countdownElapsed=Math.round((countdownElapsed+dt)*1e12)/1e12;simTime=0;scrubber.value='0';
      if(countdownElapsed<3){countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed));}
      else{hideCountdown();setState(State.PLAYING);}
    }else if(state===State.REFIRE_HOLD){
      holdElapsed=Math.round((holdElapsed+dt)*1e12)/1e12;hideCountdown();simTime=0;scrubber.value='0';
      if(holdElapsed>=1)setState(State.PLAYING);
    }
    if(state===State.PLAYING){
      simTime=Math.min(DURATION,simTime+dt*playbackSpeed);
      if(DURATION-simTime<1e-10)simTime=DURATION;
      scrubber.value=simTime.toFixed(3);
      if(simTime>=DURATION){simTime=DURATION;scrubber.value=DURATION.toFixed(3);setState(State.ENDED);}
    }
    renderAt(simTime);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize',resize);
  // Read-only diagnostics expose the physical scale without adding visible HUD elements.
  window.renderAt=renderAt;
  window.simulation=Object.freeze({
    get state(){return state;},get simTime(){return simTime;},get playbackSpeed(){return playbackSpeed;},
    seed:SEED,duration:DURATION,fractureSpeed:FRACTURE_SPEED_MPS,captureFPS:CAPTURE_FPS,
    physicalWaveDuration,observationStretch
  });
  syncToggle();resize();
  requestAnimationFrame(frame);
})();
</script>
