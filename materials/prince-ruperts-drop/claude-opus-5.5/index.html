<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Rupert's Drop: Bullet Impact vs. Tail Snip</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  /* =====================================================================
     Timeline (simulation seconds). 1 sim-second ~ 50,000+ FPS slow motion.
     ===================================================================== */
  const DURATION = 8;
  const SEED = 42;
  const T_HIT = 1.2;      // lead bullet strikes the bulb
  const T_REB = 1.72;     // flattened lead slug rebounds off the head
  const T_CLEAR = 2.6;    // bullet debris has cleared
  const T_SNIP = 3.8;     // nippers sever the tail tip
  const T_FRONT0 = 4.4;   // fracture front begins racing toward the bulb
  const T_FRONT1 = 5.8;   // front reaches the bulb -> catastrophic disintegration

  /* ---------- deterministic PRNG (Mulberry32, seed 42) ---------- */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = mulberry32(SEED);

  /* ---------- math helpers ---------- */
  const V3 = THREE.Vector3;
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const clamp01 = (x) => clamp(x, 0, 1);
  const lerp = (a, b, t) => a + (b - a) * t;
  const smooth = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  const easeInOut = (t) => { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
  const rr = (a, b) => a + (b - a) * rand();
  function randUnit(v) {
    const z = rr(-1, 1), th = rr(0, Math.PI * 2), s = Math.sqrt(1 - z * z);
    return v.set(s * Math.cos(th), s * Math.sin(th), z);
  }

  /* =====================================================================
     Renderer, scene, camera
     ===================================================================== */
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 200);

  /* ---------- in-memory studio lightbox -> PMREM ---------- */
  function buildStudioEnv() {
    const s = new THREE.Scene();
    const room = new THREE.Mesh(new THREE.SphereGeometry(40, 48, 24), new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
      fragmentShader: 'varying vec3 vD; void main(){ float y = vD.y; vec3 c = mix(vec3(0.004,0.005,0.008), vec3(0.026,0.030,0.042), smoothstep(-0.55, 0.75, y)); c += vec3(0.04,0.05,0.07) * pow(max(y, 0.0), 4.0); gl_FragColor = vec4(c, 1.0);\n#include <encodings_fragment>\n}'
    }));
    s.add(room);
    const panel = (w, h, x, y, z, hex, k) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({
        color: new THREE.Color(hex).multiplyScalar(k), side: THREE.DoubleSide
      }));
      m.position.set(x, y, z);
      m.lookAt(0, 0, 0);
      s.add(m);
    };
    panel(26, 8, 0, 22, 3, 0xffffff, 2.6);        // overhead softbox
    panel(10, 15, -20, 7, 12, 0xeef3ff, 3.0);     // key softbox, front-left (cool white)
    panel(3.2, 22, 20, 1, 7, 0xffffff, 3.0);      // right strip
    panel(2.6, 20, -18, 3, -15, 0x37d9ff, 3.6);   // cyan rim strip, back-left
    panel(2.6, 20, 18, 4, -15, 0xff47d1, 3.2);    // magenta rim strip, back-right
    panel(30, 30, 0, -24, 0, 0x22252d, 0.5);      // dim floor bounce
    panel(3, 3, 7, 11, 21, 0xffffff, 3.5);        // small front-top spot
    return s;
  }
  const pmrem = new THREE.PMREMGenerator(renderer);
  const envScene = buildStudioEnv();
  const ENV_RT = pmrem.fromScene(envScene, 0.015);
  const ENV_TEX = ENV_RT.texture;
  scene.environment = ENV_TEX;
  pmrem.dispose();
  envScene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });

  /* ---------- three-point studio lights (also fed to the custom shaders) ---------- */
  const LIGHTS = [
    { dir: new V3(-0.55, 0.62, 0.78).normalize(), col: new THREE.Color(1.0, 0.98, 1.05), k: 2.5 },  // key, cool white
    { dir: new V3(0.85, 0.05, 0.55).normalize(), col: new THREE.Color(0.62, 0.68, 0.86), k: 0.55 }, // fill
    { dir: new V3(-0.78, 0.30, -0.70).normalize(), col: new THREE.Color(0.20, 0.85, 1.0), k: 1.9 },  // cyan rim
    { dir: new V3(0.80, 0.42, -0.62).normalize(), col: new THREE.Color(1.0, 0.25, 0.80), k: 1.7 }   // magenta rim
  ];
  LIGHTS.forEach((l) => {
    const d = new THREE.DirectionalLight(l.col, l.k * 0.6);
    d.position.copy(l.dir).multiplyScalar(10);
    scene.add(d);
  });
  scene.add(new THREE.HemisphereLight(0x8090b0, 0x101014, 0.3));
  const fxLight = new THREE.PointLight(0xffffff, 0, 7, 2);
  scene.add(fxLight);
  const U_LDIR = LIGHTS.map((l) => l.dir.clone());
  const U_LCOL = LIGHTS.map((l) => new V3(l.col.r * l.k, l.col.g * l.k, l.col.b * l.k));

  /* =====================================================================
     Drop spine: Frenet-Serret integration of curvature/torsion along
     arc-length a in [0, L]  (bulb tip a = 0  ->  tail tip a = L, s = a / L)
     ===================================================================== */
  const L_TOTAL = 7.9;
  const R_HEAD = 0.62;    // bulb radius
  const R_FRONT = 0.70;   // front half-length of the (slightly prolate) bulb
  const DA = 0.004;
  const NSP = Math.ceil(L_TOTAL / DA) + 2;
  const SP = new Float32Array(NSP * 3), ST = new Float32Array(NSP * 3), SN = new Float32Array(NSP * 3), SB = new Float32Array(NSP * 3);

  function kappaAt(a) {
    const sweep = 0.66 * smooth(1.2, 2.5, a) * (1 - 0.25 * smooth(4.6, 5.4, a));
    const wav = 0.10 * Math.sin(a * 1.9 + 0.4) * smooth(2.4, 3.2, a) * (1 - smooth(4.4, 5.0, a));
    const curl = 2.6 * smooth(5.75, 6.4, a) + 2.0 * smooth(6.4, 7.9, a);
    return sweep + wav + curl;
  }
  function tauAt(a) {
    return 0.35 * smooth(3.6, 4.8, a) + 1.3 * smooth(5.8, 6.5, a);
  }
  (function integrateSpine() {
    const P = new V3(0, 0, 0), T = new V3(-1, 0, 0), N = new V3(0, 1, 0), B = new V3().crossVectors(T, N);
    const D = new V3(), Th = new V3(), q = new THREE.Quaternion(), qh = new THREE.Quaternion();
    for (let i = 0; i < NSP; i++) {
      P.toArray(SP, i * 3); T.toArray(ST, i * 3); N.toArray(SN, i * 3); B.toArray(SB, i * 3);
      const a = (i + 0.5) * DA;
      const k = kappaAt(a), tq = tauAt(a);
      D.copy(T).multiplyScalar(tq).addScaledVector(B, k);   // Darboux vector
      const w = D.length();
      if (w > 1e-9) {
        D.multiplyScalar(1 / w);
        qh.setFromAxisAngle(D, w * DA * 0.5);
        q.setFromAxisAngle(D, w * DA);
        Th.copy(T).applyQuaternion(qh);
        P.addScaledVector(Th, DA);
        T.applyQuaternion(q); N.applyQuaternion(q);
        T.normalize(); N.addScaledVector(T, -N.dot(T)).normalize(); B.crossVectors(T, N);
      } else {
        P.addScaledVector(T, DA);
      }
    }
  })();
  function spineSample(a, P, T, N, B) {
    const f = clamp(a / DA, 0, NSP - 1.001);
    const i = Math.floor(f), t = f - i, j = i * 3, k = j + 3;
    if (P) P.set(lerp(SP[j], SP[k], t), lerp(SP[j + 1], SP[k + 1], t), lerp(SP[j + 2], SP[k + 2], t));
    if (T) T.set(lerp(ST[j], ST[k], t), lerp(ST[j + 1], ST[k + 1], t), lerp(ST[j + 2], ST[k + 2], t)).normalize();
    if (N) N.set(lerp(SN[j], SN[k], t), lerp(SN[j + 1], SN[k + 1], t), lerp(SN[j + 2], SN[k + 2], t)).normalize();
    if (B) B.set(lerp(SB[j], SB[k], t), lerp(SB[j + 1], SB[k + 1], t), lerp(SB[j + 2], SB[k + 2], t)).normalize();
  }

  /* ---------- radius profile: prolate bulb -> gaussian neck taper -> exponential tail ---------- */
  const TAIL_R0 = 0.095, TAIL_DECAY = 0.27, NECK_W = 0.84, TIP_CAP = 0.025;
  function radiusAt(a) {
    if (a <= 0 || a >= L_TOTAL) return 0;
    let r;
    if (a < R_FRONT) {
      const u = (R_FRONT - a) / R_FRONT;
      r = R_HEAD * Math.sqrt(Math.max(0, 1 - u * u));
    } else {
      const tail = TAIL_R0 * Math.exp(-TAIL_DECAY * (a - R_FRONT));
      const u = (a - R_FRONT) / NECK_W;
      r = tail + (R_HEAD - tail) * Math.exp(-u * u);
    }
    const c0 = L_TOTAL - TIP_CAP;
    if (a > c0) { const u = (a - c0) / TIP_CAP; r *= Math.sqrt(Math.max(0, 1 - u * u)); }
    return r;
  }

  /* ---------- key stations ---------- */
  const A_CUT = 5.6;                // nipper cut position (arc length)
  const CREEP = 0.16;               // nucleation creep before the front races
  const A0 = A_CUT - CREEP;
  const A_CLAMP = 1.95;
  const HEAD_ZONE = 2.05;

  /* ---------- placement: centre the drop's bounding box on the origin ---------- */
  const BBOX = new THREE.Box3();
  (function () {
    const P = new V3(), e = new V3();
    for (let a = 0; a <= L_TOTAL; a += 0.01) {
      spineSample(a, P);
      const r = radiusAt(a);
      e.set(r, r, r);
      BBOX.expandByPoint(P.clone().sub(e));
      BBOX.expandByPoint(P.clone().add(e));
    }
  })();
  const BB_SIZE = BBOX.getSize(new V3());
  const DROP_OFFSET = BBOX.getCenter(new V3()).negate();

  /* fracture-front kinematics (arc length), shared with GLSL */
  function frontAt(t) {
    if (t < T_SNIP) return A_CUT;
    if (t < T_FRONT0) { const q = (t - T_SNIP) / (T_FRONT0 - T_SNIP); return A_CUT - CREEP * q * q; }
    return A0 * (1 - (t - T_FRONT0) / (T_FRONT1 - T_FRONT0));
  }
  function tFrontOf(a) {
    if (a >= A_CUT) return T_SNIP;
    if (a >= A0) return T_SNIP + Math.sqrt(Math.max(0, A_CUT - a) / CREEP) * (T_FRONT0 - T_SNIP);
    return T_FRONT0 + (1 - a / A0) * (T_FRONT1 - T_FRONT0);
  }
  function releaseOf(a, j) {
    const tf = tFrontOf(a);
    const tl = tf + 0.045 + 0.06 * j;
    const w = 1 - smooth(1.05, 1.85, a);
    const th = T_FRONT1 + 0.05 * j;
    return Math.max(tf + 0.02, lerp(tl, th, w));
  }

  /* =====================================================================
     Shared GLSL
     ===================================================================== */
  const GLSL_COMMON = `
    float h13( vec3 p ) {
      p = fract( p * 0.1031 );
      p += dot( p, p.zyx + 31.32 );
      return fract( ( p.x + p.y ) * p.z );
    }
    vec3 h33( vec3 p ) {
      p = fract( p * vec3( 0.1031, 0.1030, 0.0973 ) );
      p += dot( p, p.yxz + 33.33 );
      return fract( ( p.xxy + p.yxx ) * p.zyx );
    }
    float vnoise3( vec3 p ) {
      vec3 i = floor( p );
      vec3 f = fract( p );
      vec3 u = f * f * ( 3.0 - 2.0 * f );
      float a000 = h13( i );
      float a100 = h13( i + vec3( 1.0, 0.0, 0.0 ) );
      float a010 = h13( i + vec3( 0.0, 1.0, 0.0 ) );
      float a110 = h13( i + vec3( 1.0, 1.0, 0.0 ) );
      float a001 = h13( i + vec3( 0.0, 0.0, 1.0 ) );
      float a101 = h13( i + vec3( 1.0, 0.0, 1.0 ) );
      float a011 = h13( i + vec3( 0.0, 1.0, 1.0 ) );
      float a111 = h13( i + vec3( 1.0, 1.0, 1.0 ) );
      return mix( mix( mix( a000, a100, u.x ), mix( a010, a110, u.x ), u.y ),
                  mix( mix( a001, a101, u.x ), mix( a011, a111, u.x ), u.y ), u.z );
    }
    vec3 worley3( vec3 p ) {
      vec3 ip = floor( p );
      vec3 fp = fract( p );
      float f1 = 9.0;
      float f2 = 9.0;
      float id = 0.0;
      for ( int k = -1; k <= 1; k++ ) {
        for ( int j = -1; j <= 1; j++ ) {
          for ( int i = -1; i <= 1; i++ ) {
            vec3 g = vec3( float( i ), float( j ), float( k ) );
            vec3 dd = g + h33( ip + g ) - fp;
            float q = dot( dd, dd );
            if ( q < f1 ) { f2 = f1; f1 = q; id = h13( ip + g + 17.17 ); }
            else if ( q < f2 ) { f2 = q; }
          }
        }
      }
      return vec3( sqrt( f1 ), sqrt( f2 ), id );
    }
    vec3 hue3( float h ) {
      return clamp( abs( fract( h + vec3( 0.0, 2.0 / 3.0, 1.0 / 3.0 ) ) * 6.0 - 3.0 ) - 1.0, 0.0, 1.0 );
    }
    vec3 rotAA( vec3 v, vec3 k, float ang ) {
      float c = cos( ang );
      float s = sin( ang );
      return v * c + cross( k, v ) * s + k * dot( k, v ) * ( 1.0 - c );
    }
  `;

  // PMREM (CubeUV) sampling inside custom shaders: decode matches the generated texture encoding.
  const ENV_DECODE = ENV_TEX.encoding === THREE.RGBEEncoding ? 'return RGBEToLinear( value );'
    : (ENV_TEX.encoding === THREE.sRGBEncoding ? 'return sRGBToLinear( value );' : 'return value;');
  const GLSL_ENV = `
    uniform sampler2D envMap;
    vec4 envMapTexelToLinear( vec4 value ) { ${ENV_DECODE} }
    #define ENVMAP_TYPE_CUBE_UV
    #include <cube_uv_reflection_fragment>
    vec3 envS( vec3 dir, float rough ) { return textureCubeUV( envMap, normalize( dir ), rough ).rgb; }
  `;

  const GLSL_LIGHTS = `
    uniform vec3 uLDir[ 4 ];
    uniform vec3 uLCol[ 4 ];
    uniform vec3 uFxPos;
    uniform vec3 uFxCol;
  `;

  // Michel-Levy interference colour for crossed polarisers, retardation g in nm.
  const GLSL_SPECTRAL = `
    vec3 michelLevy( float g ) {
      vec3 acc = vec3( 0.0 );
      vec3 nrm = vec3( 0.0 );
      for ( int i = 0; i < 12; i++ ) {
        float lam = 400.0 + float( i ) * 27.0;
        vec3 w = vec3(
          exp( -pow( ( lam - 602.0 ) / 46.0, 2.0 ) ) + 0.10 * exp( -pow( ( lam - 425.0 ) / 20.0, 2.0 ) ),
          exp( -pow( ( lam - 545.0 ) / 42.0, 2.0 ) ),
          exp( -pow( ( lam - 450.0 ) / 30.0, 2.0 ) ) );
        float sn = sin( PI * g / lam );
        acc += w * sn * sn;
        nrm += w;
      }
      return acc / nrm;
    }
  `;

  const GLSL_FRONT = `
    uniform vec4 uRel;   // T_SNIP, T_FRONT0, T_FRONT1, CREEP
    uniform vec2 uAcut;  // A_CUT, A0
    float tFrontOf( float a ) {

    }
    // disintegration burst
    const db = t - T_FRONT1;
    _w.copy(BULB_C_L).add(dropRoot.position);
    setGlow(gBurst, db >= 0 && db < 0.8, _w.x, _w.y, _w.z, 1.2 + 4.0 * clamp01(db / 0.25), 1.2 + 4.0 * clamp01(db / 0.25), db >= 0 ? Math.exp(-db / 0.12) : 0);
  }

  function renderAt(simT) {
    const t = clamp(Number.isFinite(simT) ? simT : 0, 0, DURATION);
    updateDrop(t);
    updateBullet(t);
    updateSpall(t);
    updateNippers(t);
    updateFx(t);
    shardUniforms.uTime.value = t;
    dustUniforms.uTime.value = t;
    sparkUniforms.uTime.value = t;
    renderer.render(scene, camera);
  }
  window.renderAt = renderAt;

  /* ---------- camera: fixed 35deg (85mm-equivalent), locked on the Z axis ---------- */
  function fitCamera() {
    const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    const FILL = 0.62;
    const dH = (BB_SIZE.y / 2) / (FILL * tanH);
    const dW = (BB_SIZE.x / 2) / (FILL * tanH * camera.aspect);
    const d = Math.max(dH, dW) + BB_SIZE.z / 2;
    camera.position.set(0, 0, d);
    camera.lookAt(0, 0, 0);
  }
  const _db = new THREE.Vector2();
  function onResize() {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
    fitCamera();
    camera.updateProjectionMatrix();
    renderer.getDrawingBufferSize(_db);
    pointScale.value = _db.y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  }
  onResize();
  window.addEventListener('resize', () => { onResize(); renderAt(simTime); });

  /* =====================================================================
     Playback state machine: COUNTDOWN, PLAYING, PAUSED, REFIRE_HOLD, ENDED
     ===================================================================== */
  const elCountdown = document.getElementById('countdown');
  const btnToggle = document.getElementById('btn-toggle');
  const btnRefire = document.getElementById('btn-refire');
  const iconPause = document.getElementById('icon-pause');
  const iconPlay = document.getElementById('icon-play');
  const scrubber = document.getElementById('scrubber');
  const pills = Array.prototype.slice.call(document.querySelectorAll('.speed-pill'));

  let state = 'INIT';
  let simTime = 0;
  let playbackSpeed = 1.0;
  let countdownStart = 0;
  let holdStart = 0;
  let lastNow = 0;

  function setPlayingIcons(playing) {
    iconPause.style.display = playing ? 'block' : 'none';
    iconPlay.style.display = playing ? 'none' : 'block';
    btnToggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
  }
  function hideCountdown() {
    elCountdown.style.display = 'none';
    elCountdown.textContent = '';
  }
  function showCountdown(txt) {
    if (elCountdown.style.display !== 'block') elCountdown.style.display = 'block';
    if (elCountdown.textContent !== txt) elCountdown.textContent = txt;
  }

  btnToggle.addEventListener('click', () => {
    if (state === 'PLAYING') {
      state = 'PAUSED';
      setPlayingIcons(false);
    } else if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD' || state === 'INIT') {
      hideCountdown();
      simTime = 0;
      scrubber.value = '0';
      state = 'PAUSED';
      setPlayingIcons(false);
      renderAt(simTime);
    } else if (state === 'PAUSED') {
      state = 'PLAYING';
      setPlayingIcons(true);
    } else if (state === 'ENDED') {
      hideCountdown();
      simTime = 0;
      scrubber.value = '0';
      state = 'PLAYING';
      setPlayingIcons(true);
      renderAt(simTime);
    }
  });

  btnRefire.addEventListener('click', () => {
    hideCountdown();
    simTime = 0;
    scrubber.value = '0';
    renderAt(simTime);
    setPlayingIcons(true);
    state = 'REFIRE_HOLD';
    holdStart = performance.now();
  });

  pills.forEach((pill) => {
    pill.addEventListener('click', () => {
      playbackSpeed = parseFloat(pill.getAttribute('data-speed'));
      pills.forEach((p) => {
        const on = p === pill;
        p.classList.toggle('is-active', on);
        p.setAttribute('aria-checked', on ? 'true' : 'false');
      });
    });
  });

  scrubber.addEventListener('input', () => {
    if (state === 'COUNTDOWN' || state === 'REFIRE_HOLD' || state === 'INIT') hideCountdown();
    const v = parseFloat(scrubber.value);
    simTime = clamp(Number.isFinite(v) ? v : 0, 0, DURATION);
    state = 'PAUSED';
    setPlayingIcons(false);
    renderAt(simTime);
  });

  function frame() {
    requestAnimationFrame(frame);
    const now = performance.now();
    let dt = (now - lastNow) / 1000;
    lastNow = now;
    if (!(dt > 0)) dt = 0;
    if (dt > 0.1) dt = 0.1;

    if (state === 'COUNTDOWN') {
      const ce = Math.max(0, (now - countdownStart) / 1000);
      if (ce < 3) { showCountdown(String(3 - Math.floor(ce))); return; }
      hideCountdown();
      state = 'PLAYING';
      setPlayingIcons(true);
      simTime = 0;
      dt = Math.min(ce - 3, 0.1);
    } else if (state === 'REFIRE_HOLD') {
      const he = Math.max(0, (now - holdStart) / 1000);
      if (he < 1) return;
      state = 'PLAYING';
      simTime = 0;
      dt = Math.min(he - 1, 0.1);
    }
    if (state === 'PLAYING') {
      simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
      if (simTime >= DURATION) {
        simTime = DURATION;
        scrubber.value = DURATION.toFixed(3);
        renderAt(simTime);
        state = 'ENDED';
        setPlayingIcons(false);
        return;
      }
      scrubber.value = simTime.toFixed(3);
      renderAt(simTime);
    }
  }

  /* ---------- boot: compile, render the resting scene, start the countdown ---------- */
  renderer.compile(scene, camera);
  renderAt(0);
  requestAnimationFrame(() => {
    lastNow = performance.now();
    if (state === 'INIT') {
      state = 'COUNTDOWN';
      countdownStart = lastNow;
      showCountdown('3');
    }
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
