<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Rupert's Drop</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#dock button:focus-visible { outline: 2px solid #a8d8eb; outline-offset: 3px; }
#scrubber:focus-visible { outline: 2px solid #a8d8eb; outline-offset: 5px; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// All geometry and initial conditions are generated once from this stream.
// renderAt(t) has no integrator, random draws, wall-clock reads, or history.
const DURATION = 8;
const SEED = 42;
function mulberry32(seed) {
  return function () {
    let a = seed += 0x6D2B79F5;
    a = Math.imul(a ^ a >>> 15, a | 1);
    a ^= a + Math.imul(a ^ a >>> 7, a | 61);
    return ((a ^ a >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(SEED);
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const q = clamp((v-a)/(b-a)); return q*q*(3-2*q); };
const mix = (a, b, t) => a+(b-a)*t;
const v3 = (x=0,y=0,z=0) => new THREE.Vector3(x,y,z);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth/window.innerHeight, .1, 100);

// A photographed studio is synthesized as luminous planes in a separate scene.
// Only its prefiltered radiance is used; no light-panel geometry enters the stage.
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x161d2b);
function lightbox(x,y,z,w,h,color,power) {
  const material = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  material.color.multiplyScalar(power);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w,h), material);
  panel.position.set(x,y,z); panel.lookAt(0,0,0); studio.add(panel);
}
lightbox(-3.8,2.2,4,1.15,7.5,0xe2efff,3.2);
lightbox(3.6,.4,2.7,.45,6,0xc4f9ff,2.8);
lightbox(.7,5,1,5,.9,0xffffff,3.4);
lightbox(-2.5,.8,-3.7,1.1,5,0x428da2,1.5);
lightbox(3,1.5,-3,1,4.6,0x957baf,1.1);
lightbox(.8,-3,3,3,.35,0x7991a7,.7);
const pmrem = new THREE.PMREMGenerator(renderer);
const environment = pmrem.fromScene(studio, .025, .1, 100);
scene.environment = environment.texture;
studio.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
pmrem.dispose();
scene.add(new THREE.HemisphereLight(0xb3d4ec,0x202539,.7));
function directional(color,intensity,x,y,z) {
  const light = new THREE.DirectionalLight(color,intensity);
  light.position.set(x,y,z); scene.add(light); return light;
}
directional(0xeaf3ff,2.2,-3,5,5);
directional(0x81dcff,1.7,-4,1,-2);
directional(0xc594d7,1.15,3,3,-3);
directional(0xd5e2eb,.45,2,-1,4);
const cutLight = new THREE.PointLight(0x9cdeff,0,2.4,2);
scene.add(cutLight);

// A 6–7 cm specimen. The cached curve uses TRUE normalized arc length, not
// spline parameter, so the crack travels at a constant physical 1,600 m/s.
const spine = new THREE.CatmullRomCurve3([
  v3(-.54,-2.12,0), v3(-.59,-1.82,0), v3(-.60,-1.31,0),
  v3(-.48,-.76,0), v3(-.27,-.20,.01), v3(-.03,.40,.025),
  v3(-.03,.99,.055), v3(-.23,1.52,.11), v3(-.25,1.96,.12),
  v3(.04,2.34,.08), v3(.46,2.45,-.04), v3(.77,2.25,-.14),
  v3(.75,1.99,-.04), v3(.62,1.93,.06)
], false, 'centripetal');
spine.arcLengthDivisions = 1600;
spine.updateArcLengths();
const SPINE_LENGTH = spine.getLength();
const METERS_PER_UNIT = .012;
const FRACTURE_SPEED = 1600;
const FRACTURE_START = 4.4;
const FRACTURE_END = 5.8;
const PHYSICAL_TRANSIT = SPINE_LENGTH * METERS_PER_UNIT / FRACTURE_SPEED;
const FRACTURE_SLOWDOWN = (FRACTURE_END-FRACTURE_START)/PHYSICAL_TRANSIT;
// At a 60 Hz presentation this is > 1,800,000 equivalent captured FPS,
// comfortably above the requested 50,000 FPS slow-motion observation rate.
const EQUIVALENT_CAPTURE_FPS = 60 * FRACTURE_SLOWDOWN;
const CUT_S = .958;
const FRAGMENT_TIME_SCALE = .028;
const GRAVITY = 9.81 * FRAGMENT_TIME_SCALE**2 / METERS_PER_UNIT;
const radiusKeys = [
  [0,.004],[.012,.28],[.035,.49],[.075,.665],[.12,.73],
  [.17,.67],[.22,.49],[.28,.30],[.34,.168],[.40,.103],
  [.48,.070],[.58,.049],[.70,.036],[.81,.028],[.92,.020],[1,.007]
];
// Monotone cubic Hermite interpolation keeps the quenched silhouette smooth.
const slopes = radiusKeys.map((p,i) => {
  if (!i) return (radiusKeys[1][1]-p[1])/(radiusKeys[1][0]-p[0]);
  if (i===radiusKeys.length-1) return (p[1]-radiusKeys[i-1][1])/(p[0]-radiusKeys[i-1][0]);
  const a=(p[1]-radiusKeys[i-1][1])/(p[0]-radiusKeys[i-1][0]);
  const b=(radiusKeys[i+1][1]-p[1])/(radiusKeys[i+1][0]-p[0]);
  return a*b<=0 ? 0 : 2*a*b/(a+b);
});
function radiusAt(s) {
  for(let i=0;i<radiusKeys.length-1;i++) {
    const a=radiusKeys[i],b=radiusKeys[i+1];
    if(s<=b[0]) {
      const d=b[0]-a[0],t=clamp((s-a[0])/d),t2=t*t,t3=t2*t;
      return Math.max(.002,(2*t3-3*t2+1)*a[1]+(t3-2*t2+t)*d*slopes[i]+(-2*t3+3*t2)*b[1]+(t3-t2)*d*slopes[i+1]);
    }
  }
  return .007;
}
const TABLE_N = 1000;
const samples = [];
for(let i=0;i<=TABLE_N;i++) {
  const s=i/TABLE_N,p=spine.getPointAt(s),t=spine.getTangentAt(s).normalize();
  const n=v3(t.y,-t.x,0).normalize(), b=new THREE.Vector3().crossVectors(t,n).normalize();
  samples.push({p,t,n,b,r:radiusAt(s)});
}
function section(s) {
  const x=clamp(s)*TABLE_N,i=Math.min(TABLE_N-1,Math.floor(x)),q=x-i;
  const a=samples[i],b=samples[i+1];
  return {p:a.p.clone().lerp(b.p,q),t:a.t.clone().lerp(b.t,q).normalize(),
    n:a.n.clone().lerp(b.n,q).normalize(),b:a.b.clone().lerp(b.b,q).normalize(),r:radiusAt(s)};
}
function surface(s,theta,radial=1) {
  const f=section(s);
  return f.p.clone().addScaledVector(f.n,Math.cos(theta)*f.r*radial).addScaledVector(f.b,Math.sin(theta)*f.r*radial*.88);
}
function dropGeometry(from=0,to=1,rows=280,columns=72,origin=v3()) {
  const positions=[],uvs=[],arc=[],radials=[],indices=[];
  for(let i=0;i<=rows;i++) {
    const s=mix(from,to,i/rows),f=section(s);
    for(let j=0;j<=columns;j++) {
      const theta=j/columns*TAU;
      const p=f.p.clone().addScaledVector(f.n,Math.cos(theta)*f.r).addScaledVector(f.b,Math.sin(theta)*f.r*.88).sub(origin);
      positions.push(p.x,p.y,p.z); uvs.push(j/columns,s); arc.push(s);
      radials.push(Math.cos(theta),Math.sin(theta));
      if(i<rows && j<columns) {
        const a=i*(columns+1)+j,b=a+columns+1;
        indices.push(a,a+1,b,b,a+1,b+1);

    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));
  g.setAttribute('aSpine',new THREE.Float32BufferAttribute(arc,1));
  g.setAttribute('aRadial',new THREE.Float32BufferAttribute(radials,2));
  g.setIndex(indices); g.computeVertexNormals(); return g;
}
const glassUniforms={
  uTime:{value:0},uFront:{value:1.01},uCut:{value:1.01},uLow:{value:-1},
  uRinging:{value:0},uWave:{value:0}
};
function glassMaterial(uniforms) {
  const material = new THREE.MeshPhysicalMaterial({
    color:0xdcecf0,metalness:0,roughness:.045,transmission:.94,
    ior:1.52,clearcoat:1,clearcoatRoughness:.035,
    envMapIntensity:1.8,transparent:true,opacity:.96,depthWrite:false,
    side:THREE.FrontSide
  });
  material.onBeforeCompile=shader=>{
    Object.assign(shader.uniforms,uniforms);
    shader.vertexShader=`attribute float aSpine; attribute vec2 aRadial;
      varying float vSpine; varying vec2 vRadial;
      uniform float uRinging;\n`+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',`
      #include <begin_vertex>
      vSpine=aSpine; vRadial=aRadial;
      float elastic=exp(-aSpine*8.0)*uRinging;
      transformed.x+=elastic*.010*aRadial.x;
      transformed.y-=elastic*.006*aRadial.y;
    `);
    shader.fragmentShader=`varying float vSpine; varying vec2 vRadial;
      uniform float uTime,uFront,uCut,uLow,uWave,uRinging;\n`+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace('#include <clipping_planes_fragment>',`
      #include <clipping_planes_fragment>
      if(vSpine>uFront || vSpine>uCut || vSpine<uLow) discard;
    `);
    shader.fragmentShader=shader.fragmentShader.replace('gl_FragColor = vec4( outgoingLight, diffuseColor.a );',`
      // r128 transmission models background visibility through alpha. Clear
      // glass has negligible Lambertian scattering: keep dielectric specular
      // radiance, then add the light transmitted by the crossed polarizers.
      outgoingLight=reflectedLight.directSpecular+reflectedLight.indirectSpecular+vec3(.013,.018,.025);
      // Optical path difference through a compressed shell and tensile core.
      // Two crossed polarizers turn retardation into colored isochromatic bands.
      float pathDepth=sqrt(max(0.0,1.0-vRadial.x*vRadial.x));
      float core=1.0-smoothstep(.26,.65,vSpine);
      float pulse=sin(vSpine*29.0-uTime*7.0)*.12*
        smoothstep(2.6,2.9,uTime)*(1.0-smoothstep(3.55,3.8,uTime));
      float retardation=5.6*pow(pathDepth,.68)*(1.0-.35*vSpine)+pulse+uRinging*.15;
      vec3 spectral=.5+.5*cos(6.2831853*(retardation+vec3(.08,.39,.69)));
      float interference=sin(retardation*3.14159265);
      float fringe=interference*interference;
      float polarizer=sin(2.0*atan(vRadial.x,pathDepth+.001)+.45);
      float crossed=.40+.60*polarizer*polarizer;
      float fresnel=pow(clamp(1.0-abs(dot(normal,normalize(vViewPosition))),0.0,1.0),3.0);
      outgoingLight+=spectral*fringe*crossed*(.27*core+.025)*(1.0-fresnel*.65);
      outgoingLight+=vec3(.024,.045,.054)*fresnel;
      float impactAge=max(0.0,uTime-1.2);
      float shock=exp(-pow((vSpine-impactAge*.62-.12)/.025,2.0))*
        exp(-impactAge*3.0)*step(1.2,uTime);
      outgoingLight+=vec3(.11,.23,.25)*shock;
      float angle=atan(vRadial.y,vRadial.x);
      float frontDistance=uFront-vSpine;
      float whiteFront=exp(-pow(frontDistance/.006,2.0))*uWave;
      float branches=pow(max(0.0,cos(angle*19.0+sin(vSpine*380.0)*1.8)),48.0);
      float crack=branches*exp(-frontDistance*65.0)*step(0.0,frontDistance)*uWave;
      outgoingLight+=vec3(1.5,1.9,2.2)*(whiteFront+crack*.75);
      // Transmission's alpha only measures reflection. Retardation contributes
      // additional light through the analyzer, so it must contribute coverage.
      float opticalAlpha=max(diffuseColor.a,.32+.60*fresnel+.16*fringe*crossed*core);
      opticalAlpha=max(opticalAlpha,(whiteFront+crack)*.85);
      gl_FragColor=vec4(outgoingLight,clamp(opticalAlpha,0.0,1.0));
    `);
  };
  material.customProgramCacheKey=()=> 'quenched-photoelastic-r128';
  return material;
}
const glass = new THREE.Mesh(dropGeometry(),glassMaterial(glassUniforms));
glass.renderOrder=2;
scene.add(glass);

const cutPoint=spine.getPointAt(CUT_S);
const tipUniforms={...glassUniforms,uFront:{value:1.01},uCut:{value:1.01},uLow:{value:CUT_S},uWave:{value:0}};
const severedTip=new THREE.Mesh(dropGeometry(CUT_S,1,18,24,cutPoint),glassMaterial(tipUniforms));
severedTip.renderOrder=2; scene.add(severedTip);
cutLight.position.copy(cutPoint);

// Fine suspension wires and a small anodized saddle around the shoulder.
const darkMetal=new THREE.MeshStandardMaterial({color:0x242a32,metalness:.88,roughness:.31});
const wireMaterial=new THREE.MeshStandardMaterial({color:0x475363,metalness:.9,roughness:.25});
darkMetal.color.convertSRGBToLinear();wireMaterial.color.convertSRGBToLinear();
function tube(points,radius,material,segments=40) {
  const c=new THREE.CatmullRomCurve3(points);
  return new THREE.Mesh(new THREE.TubeGeometry(c,segments,radius,6,false),material);
}
const mount=section(.335);
const collar=new THREE.Mesh(new THREE.TorusGeometry(mount.r+.012,.013,6,64),darkMetal);
collar.position.copy(mount.p);
collar.quaternion.setFromUnitVectors(v3(0,0,1),mount.t);
scene.add(collar);
scene.add(tube([mount.p.clone().add(v3(-mount.r,0,0)),v3(-.94,.88,-.1),v3(-1.12,3.8,-.2),v3(-1.12,5,-.2)],.004,wireMaterial));
scene.add(tube([mount.p.clone().add(v3(mount.r,0,-.07)),v3(-.63,.9,-.24),v3(-.77,3.8,-.25),v3(-.77,5,-.25)],.003,wireMaterial));

// Articulated, bevel-ground steel nippers. The two complete halves rotate
// about one physical pivot; their cutting edges meet exactly at CUT_S.
const tool=new THREE.Group(); scene.add(tool);
const steel=new THREE.MeshStandardMaterial({color:0x43515e,metalness:.96,roughness:.28,envMapIntensity:.75});
steel.color.convertSRGBToLinear();
steel.onBeforeCompile=shader=>{
  shader.fragmentShader=shader.fragmentShader.replace('#include <roughnessmap_fragment>',`
    #include <roughnessmap_fragment>
    float brushing=.5+.5*sin(vViewPosition.y*4200.0+sin(vViewPosition.x*80.0)*.3);
    roughnessFactor=clamp(roughnessFactor+brushing*.012,.1,1.0);
  `);
};
const cuttingSteel=new THREE.MeshStandardMaterial({color:0xd6e1e8,metalness:1,roughness:.13});
const grip=new THREE.MeshStandardMaterial({color:0x080d13,metalness:.04,roughness:.72,envMapIntensity:.25});
grip.color.convertSRGBToLinear();
function extruded(points,depth,mat,bevel=.018) {
  const shape=new THREE.Shape();
  points.forEach((p,i)=>i?shape.lineTo(p[0],p[1]):shape.moveTo(p[0],p[1]));
  shape.closePath();
  const geo=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:bevel,bevelThickness:bevel,curveSegments:8});
  geo.translate(0,0,-depth/2); return new THREE.Mesh(geo,mat);
}
const jawHalves=[];
for(const sign of [1,-1]) {
  const half=new THREE.Group(); tool.add(half); jawHalves.push(half);
  const reflect=p=>p.map(([x,y])=>[x,y*sign]);
  half.add(extruded(reflect([[-.69,.009],[-.63,.13],[-.31,.23],[.04,.15],[.20,.06],[.10,-.10],[-.20,-.09],[-.43,.018]]),.095,steel,.014));
  const edge=extruded(reflect([[-.697,.008],[-.43,.018],[-.36,.045],[-.63,.072]]),.104,cuttingSteel,.004);
  half.add(edge);
  half.add(extruded(reflect([[.02,.1],[.26,.07],[.59,-.18],[1.25,-.39],[1.31,-.50],[1.18,-.57],[.54,-.32],[.21,-.12],[.02,-.09]]),.075,steel,.02));

}
const pivot=new THREE.Mesh(new THREE.CylinderGeometry(.116,.116,.19,40),cuttingSteel);

const pivotCore=new THREE.Mesh(new THREE.CylinderGeometry(.070,.070,.196,32),darkMetal);
pivotCore.rotation.x=Math.PI/2; pivotCore.position.z=.02; tool.add(pivotCore);
const slot=new THREE.Mesh(new THREE.BoxGeometry(.087,.013,.008),steel);
slot.position.z=.122; slot.rotation.z=.55; tool.add(slot);
const spring=tube([v3(.12,-.06,-.06),v3(.31,-.12,-.06),v3(.43,0,-.06),v3(.31,.12,-.06),v3(.12,.06,-.06)],.009,wireMaterial,28);
tool.add(spring);
const TOOL_ANGLE=-.20;
const toolOrientation=new THREE.Euler(.12,-.23,TOOL_ANGLE);
const closedPivot=cutPoint.clone().sub(v3(-.69,0,0).applyEuler(toolOrientation));

// A conical lead projectile with an analytically morphed mushroom nose.
const IMPACT_Y=-1.32;
const IMPACT_X=.125;
const BULLET_SPEED=380; // m/s, slowed to a 1.2-second observed approach.
const BULLET_TRAVEL_UNITS=11.4;
const BULLET_SLOWDOWN=BULLET_SPEED*1.2/(BULLET_TRAVEL_UNITS*METERS_PER_UNIT);
function projectileGeometry(mushroom) {
  const profile=mushroom ? [[.003,.006],[.008,.16],[.035,.31],[.085,.37],[.14,.33],[.19,.22],[.27,.15],[.32,.145]] :
    [[0,.004],[.08,.037],[.18,.080],[.32,.128],[.42,.15],[.55,.153],[.68,.153],[.78,.148]];
  const g=new THREE.LatheGeometry(profile.map(p=>new THREE.Vector2(p[1],p[0])),64);
  g.rotateZ(-Math.PI/2); g.computeVertexNormals(); return g;
}
const bulletGeometry=projectileGeometry(false),mushroomGeometry=projectileGeometry(true);
bulletGeometry.morphAttributes.position=[mushroomGeometry.attributes.position];
bulletGeometry.morphAttributes.normal=[mushroomGeometry.attributes.normal];
const lead=new THREE.MeshStandardMaterial({color:0x77797e,metalness:.94,roughness:.24,morphTargets:true,morphNormals:true,envMapIntensity:1.05});
const bullet=new THREE.Mesh(bulletGeometry,lead); scene.add(bullet);
const copper=new THREE.MeshStandardMaterial({color:0x9c6550,metalness:.98,roughness:.25});
const bulletBand=new THREE.Mesh(new THREE.TorusGeometry(.154,.012,6,48),copper);

// Every flying solid is an instanced convex crystal, with fixed seeded birth,
// velocity and angular momentum. Linear drag has a closed-form solution.
const flightUniforms={uTime:{value:0},uGravity:{value:GRAVITY}};
function flightMaterial(params,drag) {
  const mat=new THREE.MeshStandardMaterial(params);
  mat.onBeforeCompile=shader=>{
    Object.assign(shader.uniforms,flightUniforms);
    shader.vertexShader=`attribute float aBirth; attribute vec3 aVelocity; attribute vec3 aSpin;
      uniform float uTime,uGravity; varying float vAlive;
      mat3 spinMatrix(vec3 a) {
        vec3 c=cos(a),s=sin(a);
        return mat3(c.y*c.z,c.y*s.z,-s.y,
          s.x*s.y*c.z-c.x*s.z,s.x*s.y*s.z+c.x*c.z,s.x*c.y,
          c.x*s.y*c.z+s.x*s.z,c.x*s.y*s.z-s.x*c.z,c.x*c.y);
      }\n`+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <beginnormal_vertex>',`
      float age=max(0.0,uTime-aBirth);
      vAlive=step(aBirth,uTime);
      mat3 spin=spinMatrix(aSpin*age);
      #include <beginnormal_vertex>
      objectNormal=spin*objectNormal;
    `).replace('#include <begin_vertex>',`
      #include <begin_vertex>
      transformed=spin*transformed;
    `).replace('#include <project_vertex>',`
      vec4 mvPosition=instanceMatrix*vec4(transformed,1.0);
      float flight=(1.0-exp(-${drag.toFixed(3)}*age))/${drag.toFixed(3)};
      mvPosition.xyz+=aVelocity*flight;
      mvPosition.y-=.5*uGravity*age*age;
      mvPosition=modelViewMatrix*mvPosition;
      gl_Position=projectionMatrix*mvPosition;
    `);
    shader.fragmentShader='varying float vAlive;\n'+shader.fragmentShader;
    shader.fragmentShader=shader.fragmentShader.replace('#include <clipping_planes_fragment>',`
      #include <clipping_planes_fragment>
      if(vAlive<.5) discard;
    `);
  };
  mat.customProgramCacheKey=()=> 'ballistic-'+drag;
  return mat;
}
// Asymmetric triangular bipyramids have sharp fracture edges and planar facets.
function needleGeometry() {
  const p=[v3(-.75,-.35,-.40),v3(.65,-.22,-.31),v3(.10,-.25,.59),v3(.12,1.25,.02),v3(-.16,-.95,-.02)];
  const faces=[[0,1,3],[1,2,3],[2,0,3],[1,0,4],[2,1,4],[0,2,4]],a=[];
  for(const f of faces) for(const i of f) a.push(p[i].x,p[i].y,p[i].z);
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));g.computeVertexNormals();return g;
}
const crystalMaterial=flightMaterial({color:0x6b9cac,metalness:.58,roughness:.14,envMapIntensity:1.45,flatShading:true,transparent:true,opacity:.68,depthWrite:false},.32);
const crystalCount=4600;
const crystals=new THREE.InstancedMesh(needleGeometry(),crystalMaterial,crystalCount);
crystals.frustumCulled=false; scene.add(crystals);
const births=new Float32Array(crystalCount),velocities=new Float32Array(crystalCount*3),spins=new Float32Array(crystalCount*3);
const debrisRecords=[],dummy=new THREE.Object3D(),color=new THREE.Color();
function sampleVolumeS() {
  let s;
  do { s=random()*.48; } while(random()>.015+(radiusAt(s)/.73)**2);
  return s;
}
for(let i=0;i<crystalCount;i++) {
  const s=i<850?mix(.28,.998,random()):sampleVolumeS();
  const f=section(s),theta=random()*TAU,radial=Math.sqrt(random());
  const pos=surface(s,theta,radial);
  const birth=s>=CUT_S?3.8+random()*.06:FRACTURE_START+(1-s)*(FRACTURE_END-FRACTURE_START);
  const radialDirection=f.n.clone().multiplyScalar(Math.cos(theta)).addScaledVector(f.b,Math.sin(theta));
  const speed=(.42+random()*1.65)*(.52+Math.sqrt(f.r)*.65);
  const velocity=radialDirection.multiplyScalar(speed).addScaledVector(f.t,(random()-.5)*1.2);
  velocity.z+=(random()-.5)*.7;
  const scale=(.012+random()*.037)*(.25+Math.sqrt(f.r));
  dummy.position.copy(pos);dummy.rotation.set(random()*TAU,random()*TAU,random()*TAU);
  dummy.scale.set(scale*(.48+random()*.7),scale*(1.0+random()*2.3),scale*(.4+random()*.65));
  dummy.updateMatrix();crystals.setMatrixAt(i,dummy.matrix);
  color.setHSL(.53+random()*.07,.09+random()*.19,.48+random()*.37);crystals.setColorAt(i,color);
  births[i]=birth;velocity.toArray(velocities,i*3);
  spins.set([(random()-.5)*6,(random()-.5)*6,(random()-.5)*6],i*3);
  debrisRecords.push({pos,velocity,birth,s,scale});
}
crystals.geometry.setAttribute('aBirth',new THREE.InstancedBufferAttribute(births,1));
crystals.geometry.setAttribute('aVelocity',new THREE.InstancedBufferAttribute(velocities,3));
crystals.geometry.setAttribute('aSpin',new THREE.InstancedBufferAttribute(spins,3));
crystals.instanceMatrix.needsUpdate=true;

const spallCount=260;
const spall=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),flightMaterial({color:0x777b83,metalness:.98,roughness:.24,envMapIntensity:1.1,transparent:true},.25),spallCount);
spall.frustumCulled=false;scene.add(spall);
const sb=[],sv=[],ss=[];
for(let i=0;i<spallCount;i++) {
  const a=random()*TAU,r=random()*.20,birth=1.23+random()*.35;
  dummy.position.set(IMPACT_X+.06+random()*.12,IMPACT_Y+Math.cos(a)*r,Math.sin(a)*r);
  const size=.008+Math.pow(random(),2)*.060;
  dummy.scale.set(size*.7,size*(.65+random()),size*(1+random()*1.8));
  dummy.rotation.set(random()*TAU,random()*TAU,random()*TAU);dummy.updateMatrix();spall.setMatrixAt(i,dummy.matrix);
  sb.push(birth);const eject=.65+random()*2.1;
  sv.push(.5+random()*2.3,Math.cos(a)*eject,Math.sin(a)*eject);
  ss.push((random()-.5)*13,(random()-.5)*13,(random()-.5)*13);
  color.setHSL(.075,random()*.15,.35+random()*.37);spall.setColorAt(i,color);
}
spall.geometry.setAttribute('aBirth',new THREE.InstancedBufferAttribute(new Float32Array(sb),1));
spall.geometry.setAttribute('aVelocity',new THREE.InstancedBufferAttribute(new Float32Array(sv),3));

// Silica dust and subpixel scintillation use procedural point sprites. No
// textures, DOM helper canvases, or post-processing frame history are needed.
const pointUniforms={uTime:flightUniforms.uTime,uGravity:flightUniforms.uGravity,uPixelScale:{value:1}};
function dustCloud(count,glints) {
  const positions=[],velocity=[],birth=[],seed=[],size=[];
  for(let i=0;i<count;i++) {
    const record=debrisRecords[Math.floor(random()*debrisRecords.length)];
    positions.push(record.pos.x,record.pos.y,record.pos.z);
    const spread=glints?.96:.9+random()*.55;
    velocity.push(record.velocity.x*spread,record.velocity.y*spread,record.velocity.z*spread);
    birth.push(record.birth);seed.push(random());size.push(glints?.012+random()*.020:.006+random()*.018);
  }
  const g=new THREE.BufferGeometry();
  for(const [name,data,n] of [['position',positions,3],['aVelocity',velocity,3],['aBirth',birth,1],['aSeed',seed,1],['aSize',size,1]])
    g.setAttribute(name,new THREE.Float32BufferAttribute(data,n));
  const mat=new THREE.ShaderMaterial({
    uniforms:pointUniforms,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:`attribute vec3 aVelocity; attribute float aBirth,aSeed,aSize;
      uniform float uTime,uGravity,uPixelScale; varying float vAlpha,vSeed;
      void main(){
        float age=max(0.0,uTime-aBirth),flight=(1.0-exp(-.4*age))/.4;
        vec3 p=position+aVelocity*flight;p.y-=.5*uGravity*age*age;
        vec4 mv=modelViewMatrix*vec4(p,1.0);gl_Position=projectionMatrix*mv;
        gl_PointSize=clamp(aSize*uPixelScale/-mv.z,1.0,${glints?'9.0':'4.5'});
        vAlpha=step(aBirth,uTime)*(1.0-exp(-age*30.0))*exp(-age*.24);
        ${glints?'vAlpha*=pow(max(0.0,sin(aSeed*120.0+age*(3.0+aSeed*8.0))),18.0);':'vAlpha*=.23;'}
        vSeed=aSeed;
      }`,
    fragmentShader:`varying float vAlpha,vSeed;
      void main(){
        vec2 p=gl_PointCoord-.5;float r=length(p);
        float alpha=exp(-r*r*20.0)*(1.0-smoothstep(.35,.5,r));
        ${glints?'alpha+=exp(-abs(p.x)*70.0-abs(p.y)*9.0)*.55+exp(-abs(p.y)*70.0-abs(p.x)*9.0)*.55;':''}
        gl_FragColor=vec4(mix(vec3(.58,.77,.88),vec3(.94,.96,1.0),vSeed),alpha*vAlpha);
      }`
  });
  const points=new THREE.Points(g,mat);points.frustumCulled=false;points.renderOrder=4;scene.add(points);return points;
}
const dust=dustCloud(5800,false),glints=dustCloud(1900,true);

// Pre-seeded bifurcating cracks appear only in the narrow process zone ahead
// of the front. Their positions and illumination are reproducible at any t.
const crackPositions=[],crackS=[];
function crackSegment(s0,a0,s1,a1) {
  for(const [s,a] of [[s0,a0],[s1,a1]]) {
    const p=surface(clamp(s),a,1.004);crackPositions.push(p.x,p.y,p.z);crackS.push(s);
  }
}
for(let i=0;i<340;i++) {
  let s=.025+random()*.94,a=random()*TAU;
  for(let j=0;j<5;j++) {
    const ns=s-(.003+random()*.008),na=a+(random()-.5)*.65;
    crackSegment(s,a,ns,na);
    if(j===2) crackSegment(s,a,s-.015,a+(random()<.5?-1:1)*.60);
    s=ns;a=na;
  }
}
const crackGeometry=new THREE.BufferGeometry();
crackGeometry.setAttribute('position',new THREE.Float32BufferAttribute(crackPositions,3));
crackGeometry.setAttribute('aSpine',new THREE.Float32BufferAttribute(crackS,1));
const cracks=new THREE.LineSegments(crackGeometry,new THREE.ShaderMaterial({
  uniforms:glassUniforms,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
  vertexShader:'attribute float aSpine; varying float vS; void main(){vS=aSpine;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying float vS; uniform float uFront,uWave; void main(){float d=uFront-vS;if(d<-.002||d>.065)discard;gl_FragColor=vec4(.72,.88,1.0,exp(-abs(d)*52.0)*uWave*.85);}'
}));
cracks.renderOrder=3;scene.add(cracks);

function flash(color) {
  const uniforms={uStrength:{value:0},uColor:{value:new THREE.Color(color)}};
  const material=new THREE.ShaderMaterial({uniforms,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
    vertexShader:'varying vec2 vUV;void main(){vUV=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`varying vec2 vUV;uniform float uStrength;uniform vec3 uColor;
      void main(){vec2 p=(vUV-.5)*2.0;float r=length(p);
      float glow=exp(-r*r*9.0)*.42+exp(-r*r*120.0);
      glow+=exp(-abs(p.x)*90.0-abs(p.y)*5.0)*.35+exp(-abs(p.y)*100.0-abs(p.x)*6.0)*.35;
      gl_FragColor=vec4(uColor,glow*uStrength*(1.0-smoothstep(.65,1.0,r)));}`
  });
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(1,1),material);mesh.renderOrder=5;scene.add(mesh);return mesh;
}
const snipFlash=flash(0xd5f3ff);snipFlash.position.copy(cutPoint).add(v3(0,0,.16));snipFlash.scale.setScalar(.85);
const impactFlash=flash(0xc6dce9);impactFlash.position.set(IMPACT_X,IMPACT_Y,.22);impactFlash.scale.setScalar(.65);

function fractureFront(t) {
  if(t<FRACTURE_START)return 1.01;
  if(t>=FRACTURE_END)return -.01;
  const physicalTime=(t-FRACTURE_START)/FRACTURE_SLOWDOWN;
  return clamp(1-FRACTURE_SPEED*physicalTime/(SPINE_LENGTH*METERS_PER_UNIT));
}

// Pure evaluation: all animation, including tool motion, optical fringes,
// elastic vibration, flashes, deformation, drag and gravity, depends ONLY on t.
function renderAt(time) {
  const t=clamp(Number(time)||0,0,DURATION);
  flightUniforms.uTime.value=t;
  glassUniforms.uTime.value=t;
  glassUniforms.uFront.value=fractureFront(t);
  glassUniforms.uCut.value=t>=3.8?CUT_S:1.01;
  glassUniforms.uWave.value=t>=4.4&&t<5.8?1:0;
  const impactAge=Math.max(0,t-1.2);
  glassUniforms.uRinging.value=t>=1.2?Math.exp(-impactAge*4.6)*Math.sin(impactAge*62):0;
  glass.visible=t<5.8;
  crystals.visible=t>=3.8;dust.visible=t>=3.8;glints.visible=t>=3.8;
  cracks.visible=t>=4.4&&t<5.8;

  const tipAge=Math.max(0,t-3.8);
  severedTip.visible=t>=3.8&&t<4.65;
  severedTip.position.copy(cutPoint).add(v3(-tipAge*.21,-.5*GRAVITY*tipAge*tipAge,.12*tipAge));
  severedTip.rotation.set(tipAge*1.7,tipAge*-.65,tipAge*-1.25);

  const approach=smooth(2.6,3.48,t),closure=smooth(3.08,3.8,t);
  const retreat=smooth(4.12,5.10,t);
  tool.position.copy(closedPivot).add(v3((1-approach)*.49+retreat*.22,(1-approach)*.13+retreat*.13,.035));
  tool.rotation.set(toolOrientation.x,toolOrientation.y,TOOL_ANGLE+retreat*.06);
  const opening=mix(.235,.006,closure)+smooth(4.15,4.85,t)*.065;
  jawHalves[0].rotation.z=-opening;jawHalves[1].rotation.z=opening;

  bullet.visible=t<2.60;
  const deformation=smooth(1.2,1.70,t);
  bullet.morphTargetInfluences[0]=deformation;
  const rebound=Math.max(0,t-1.68);
  const bulletPhysicalTimeToImpact=Math.max(0,1.2-t)/BULLET_SLOWDOWN;
  bullet.position.set(t<1.2?IMPACT_X+BULLET_SPEED*bulletPhysicalTimeToImpact/METERS_PER_UNIT:IMPACT_X+.04*smooth(1.2,1.68,t)+rebound*1.65,
    IMPACT_Y-.5*.95*rebound*rebound,.10*rebound);
  bullet.rotation.set(rebound*.7,rebound*-.9,rebound*.72);
  bullet.scale.setScalar(1-smooth(2.05,2.6,t));
  bulletBand.position.x=mix(.64,.26,deformation);
  bulletBand.scale.setScalar(1+deformation*.025);
  spall.visible=t>=1.23&&t<3.6;
  spall.material.opacity=1-smooth(2.7,3.6,t);

  const snipAge=Math.max(0,t-3.8);
  const snipStrength=t>=3.8?Math.exp(-snipAge*17)*(1+.25*Math.sin(snipAge*130)):0;
  snipFlash.material.uniforms.uStrength.value=snipStrength;
  snipFlash.visible=snipStrength>.0001;
  cutLight.intensity=snipStrength*2.1;
  const impactStrength=t>=1.2?Math.exp(-impactAge*18)*.42:0;
  impactFlash.material.uniforms.uStrength.value=impactStrength;
  impactFlash.visible=impactStrength>.0001;
  renderer.render(scene,camera);
}

function resize() {
  const w=window.innerWidth,h=window.innerHeight;
  camera.aspect=w/h;
  const visibleHeight=Math.max(7.65,7.1/camera.aspect);
  camera.position.set(.15,.05,visibleHeight/(2*Math.tan(THREE.MathUtils.degToRad(35/2))));
  camera.lookAt(.15,.05,0);camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  pointUniforms.uPixelScale.value=h*renderer.getPixelRatio()/(2*Math.tan(THREE.MathUtils.degToRad(35/2)));
}

// Five-state transport. Wall time is used ONLY by the transport; the renderer
// never reads it. Countdown and re-fire have independent, unclamped clocks.
const STATES=Object.freeze({COUNTDOWN:'COUNTDOWN',PLAYING:'PLAYING',PAUSED:'PAUSED',REFIRE_HOLD:'REFIRE_HOLD',ENDED:'ENDED'});
let state=STATES.COUNTDOWN,simTime=0,playbackSpeed=1;
let countdownElapsed=0,holdElapsed=0,countdownStart=null,holdStart=null,lastTimestamp=null;
const countdown=document.getElementById('countdown');
const scrubber=document.getElementById('scrubber');
const toggle=document.getElementById('btn-toggle');
const pauseIcon=document.getElementById('icon-pause'),playIcon=document.getElementById('icon-play');
function hideCountdown() { countdown.style.display='none';countdown.textContent=''; }
function setState(next) {
  state=next;
  const running=state===STATES.PLAYING||state===STATES.COUNTDOWN||state===STATES.REFIRE_HOLD;
  pauseIcon.style.display=running?'block':'none';playIcon.style.display=running?'none':'block';
  toggle.setAttribute('aria-label',running?'Pause':'Play');
}
function cancelWaits() { countdownStart=null;holdStart=null;countdownElapsed=0;holdElapsed=0;hideCountdown(); }
function advance(dt) {
  simTime=Math.min(DURATION,simTime+Math.min(.1,Math.max(0,dt))*playbackSpeed);
  scrubber.value=simTime.toFixed(3);
  if(simTime>=DURATION) { simTime=DURATION;scrubber.value=DURATION.toFixed(3);setState(STATES.ENDED); }
  renderAt(simTime);
}
toggle.addEventListener('click',()=>{
  if(state===STATES.PLAYING) setState(STATES.PAUSED);
  else if(state===STATES.COUNTDOWN||state===STATES.REFIRE_HOLD) {
    cancelWaits();simTime=0;scrubber.value='0';setState(STATES.PAUSED);renderAt(0);
  } else if(state===STATES.ENDED) {
    cancelWaits();simTime=0;scrubber.value='0';setState(STATES.PLAYING);renderAt(0);
  } else { hideCountdown();setState(STATES.PLAYING); }
  lastTimestamp=performance.now();
});
document.getElementById('btn-refire').addEventListener('click',()=>{
  cancelWaits();simTime=0;scrubber.value='0';renderAt(0);
  holdElapsed=0;holdStart=performance.now();lastTimestamp=holdStart;setState(STATES.REFIRE_HOLD);
});
const pills=Array.from(document.querySelectorAll('.speed-pill'));
pills.forEach((pill,index)=>{
  pill.addEventListener('click',()=>{
    playbackSpeed=parseFloat(pill.dataset.speed);
    pills.forEach(p=>{const active=p===pill;p.classList.toggle('is-active',active);p.setAttribute('aria-checked',String(active));});
  });
  pill.addEventListener('keydown',event=>{
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) {
      event.preventDefault();const direction=event.key==='ArrowLeft'||event.key==='ArrowUp'?-1:1;
      const next=pills[(index+direction+pills.length)%pills.length];next.click();next.focus();
    }
  });
});
scrubber.addEventListener('input',()=>{
  cancelWaits();simTime=clamp(parseFloat(scrubber.value)||0,0,DURATION);
  setState(STATES.PAUSED);renderAt(simTime);lastTimestamp=performance.now();
});
window.addEventListener('resize',()=>{resize();renderAt(simTime);});

function frame(timestamp) {
  const dt=lastTimestamp===null?0:Math.min(.1,Math.max(0,(timestamp-lastTimestamp)/1000));
  lastTimestamp=timestamp;
  if(state===STATES.COUNTDOWN) {
    if(countdownStart===null)countdownStart=timestamp;
    countdownElapsed=Math.max(0,(timestamp-countdownStart)/1000);
    if(countdownElapsed>=3) {
      hideCountdown();setState(STATES.PLAYING);advance(Math.min(.1,countdownElapsed-3));
    } else {
      countdown.style.display='block';countdown.textContent=String(3-Math.floor(countdownElapsed));
      simTime=0;scrubber.value='0';
    }
  } else if(state===STATES.REFIRE_HOLD) {
    holdElapsed=Math.max(0,(timestamp-holdStart)/1000);
    if(holdElapsed>=1) { hideCountdown();setState(STATES.PLAYING);advance(Math.min(.1,holdElapsed-1)); }
  } else if(state===STATES.PLAYING) advance(dt);
  requestAnimationFrame(frame);
}
resize();
setState(STATES.COUNTDOWN);
renderAt(0);
// The first callback starts the three-second clock AFTER the resting render.
requestAnimationFrame(frame);
</script>
