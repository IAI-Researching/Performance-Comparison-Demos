<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prince Rupert's Drop</title>
<style>
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at center, #161922 0%, #090a0f 100%);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none;
  user-select: none;
}
#stage {
  display: block;
  width: 100vw;
  height: 100vh;
}

#countdown {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 50;
  pointer-events: none;
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
  color: rgba(255, 255, 255, 0.35);
  font-variant-numeric: tabular-nums;
}

#dock {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  width: 536px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 0 14px;
  background: rgba(15, 17, 23, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
}

#dock button {
  font-family: inherit;
  line-height: 1;
  margin: 0;
  flex-shrink: 0;
  white-space: nowrap;
  appearance: none;
  -webkit-appearance: none;
}

.dock-sep {
  width: 1px;
  height: 18px;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.12);
}

#btn-refire {
  width: 78px;
  height: 28px;
  padding: 0 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
}
#btn-refire:hover {
  background: rgba(255, 255, 255, 0.16);
}

#btn-toggle {
  width: 28px;
  height: 28px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  color: #ffffff;
  cursor: pointer;
}
#btn-toggle:hover {
  background: rgba(255, 255, 255, 0.16);
}

#speed-group {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.speed-pill {
  width: 42px;
  height: 24px;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9999px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 11px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.speed-pill:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.06);
}
.speed-pill.is-active {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.18);
  border-color: rgba(255, 255, 255, 0.2);
}

#scrubber {
  width: 157px;
  height: 4px;
  margin: 0;
  padding: 0;
  flex-shrink: 0;
  appearance: none;
  -webkit-appearance: none;
  background: rgba(255, 255, 255, 0.22);
  border-radius: 9999px;
  outline: none;
  cursor: pointer;
}
#scrubber::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
#scrubber::-moz-range-thumb {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ffffff;
  border: none;
  cursor: pointer;
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="countdown" aria-hidden="true">3</div>

<div id="dock" role="toolbar" aria-label="Simulation Controls">
  <button id="btn-refire" type="button" aria-label="Re-fire" title="Re-fire">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
    </svg>
    <span>Re-fire</span>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <button id="btn-toggle" type="button" aria-label="Pause" title="Play / Pause">
    <svg id="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
      <rect x="6" y="4" width="4" height="16" rx="1"/>
      <rect x="14" y="4" width="4" height="16" rx="1"/>
    </svg>
    <svg id="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true" style="display:none;">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>
  <span class="dock-sep" aria-hidden="true"></span>
  <div id="speed-group" role="radiogroup" aria-label="Playback Speed">
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.25">0.25×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="0.5">0.5×</button>
    <button class="speed-pill is-active" type="button" role="radio" aria-checked="true" data-speed="1.0">1.0×</button>
    <button class="speed-pill" type="button" role="radio" aria-checked="false" data-speed="2.0">2.0×</button>
  </div>
  <span class="dock-sep" aria-hidden="true"></span>
  <input id="scrubber" type="range" min="0" max="8" step="0.001" value="0" aria-label="Timeline Scrubber">
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// All scene data are generated once with seed 42. There is no integrated state:
// renderAt(t) is a pure evaluation of geometry, uniforms and analytic trajectories.
const DURATION = 8;
const PHYSICS = Object.freeze({
  metresPerUnit: 0.01,
  bulletSpeed: 360,
  fractureSpeed: 1600,
  captureFPS: 1000000,
  density: 2500,
  youngsModulus: 72e9,
  coreTension: 200e6,
  gravity: 9.81
});
function mulberry32(seed) {
  return function () {
    let x = seed += 0x6D2B79F5;
    x = Math.imul(x ^ x >>> 15, x | 1);
    x ^= x + Math.imul(x ^ x >>> 7, x | 61);
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const random = mulberry32(42);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
function smooth(a, b, x) { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); }
const mix = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const v3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
function frameCamera() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.position.set(0, 0.35, Math.max(16.4, 15.0 / camera.aspect));
  camera.lookAt(0, 0.35, 0);
  camera.updateProjectionMatrix();
}
frameCamera();

// A real PMREM studio environment: only in-memory geometry and emissive panels.
const studio = new THREE.Scene();
studio.background = new THREE.Color(0x090d17);
function lightbox(w, h, position, color, intensity) {
  const material = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  material.color.multiplyScalar(intensity);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(w, h), material);
  panel.position.copy(position);
  panel.lookAt(0, 0, 0);
  studio.add(panel);
}
lightbox(1.6, 7.5, v3(-4, 1.7, 3.5), 0xe9f4ff, 4.5);
lightbox(0.38, 6.0, v3(-2.7, 0.5, 4.0), 0xffffff, 5.0);
lightbox(1.2, 6.0, v3(4.5, 1, 1.4), 0xa5edff, 3.2);
lightbox(3.0, 1.4, v3(0, 5.5, 1.0), 0xf5f4ff, 3.0);
lightbox(2.4, 4.2, v3(0.5, 0, -4.0), 0xb9d8e9, 0.7);
lightbox(0.55, 4.5, v3(-3.7, -1.5, -2.5), 0xc19bd9, 1.6);
const pmrem = new THREE.PMREMGenerator(renderer);
const environment = pmrem.fromScene(studio, 0.025, 0.1, 40);
scene.environment = environment.texture;
pmrem.dispose();
studio.traverse(o => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
scene.add(new THREE.HemisphereLight(0xb9d6eb, 0x171020, 0.58));
function light(color, intensity, x, y, z) {
  const l = new THREE.DirectionalLight(color, intensity);
  l.position.set(x, y, z); scene.add(l);
}
light(0xe5efff, 2.5, -3, 5, 6);
light(0x88eaff, 1.5, 4, 1, -3);
light(0xbe92da, 0.8, -4, -1, -2);

// Arc-length coordinates, in centimetre scene units. The tail is a shallow helix.
const spine = new THREE.CatmullRomCurve3([
  v3(-0.60, -2.55), v3(-0.59, -1.70), v3(-0.49, -0.74),
  v3(-0.27, 0.22, 0.01), v3(0.11, 1.10, 0.035),
  v3(0.52, 1.94, 0.07), v3(0.94, 2.63, 0.11),
  v3(1.40, 3.02, 0.18), v3(1.58, 3.35, 0.10),
  v3(1.35, 3.58, -0.07), v3(1.08, 3.39, -0.14),
  v3(1.15, 3.13, 0.02)
], false, 'centripetal');
spine.arcLengthDivisions = 1800;
spine.updateArcLengths();
const spineLength = spine.getLength();
const fractureSeconds = spineLength * PHYSICS.metresPerUnit / PHYSICS.fractureSpeed;
const capturedFractureFrames = fractureSeconds * PHYSICS.captureFPS;
const CUT_S = 0.982;
function radiusAt(s) {
  if (s <= 0.135) return Math.max(0.0004, 1.035 * Math.sqrt(Math.max(0, 1 - Math.pow((s - 0.135) / 0.135, 2))));
  return 1.035 * Math.exp(-Math.pow((s - 0.135) / 0.154, 1.55)) + 0.024 * smooth(0.22, 0.49, s) * (1 - 0.60 * smooth(0.60, 1, s));
}
function section(s) {
  const p = spine.getPointAt(clamp(s));
  const t = spine.getTangentAt(clamp(s)).normalize();
  const u = v3(t.y, -t.x, 0).normalize();
  const v = new THREE.Vector3().crossVectors(u, t).normalize();
  return { p, t, u, v, r: radiusAt(s) };
}
const sections = Array.from({ length: 401 }, (_, i) => section(i / 400));
function surfacePoint(s, angle, radial = 1) {
  const f = section(s);
  return f.p.addScaledVector(f.u, Math.cos(angle) * f.r * radial).addScaledVector(f.v, Math.sin(angle) * f.r * radial);
}
const positions = [], coordinates = [], indices = [];
const ROWS = 400, SIDES = 64;
for (let i = 0; i <= ROWS; i++) {
  const f = sections[i];
  for (let j = 0; j <= SIDES; j++) {
    const a = j / SIDES * TAU;
    const p = f.p.clone().addScaledVector(f.u, f.r * Math.cos(a)).addScaledVector(f.v, f.r * Math.sin(a));
    positions.push(p.x, p.y, p.z); coordinates.push(i / ROWS);
    if (i < ROWS && j < SIDES) {
      const k = i * (SIDES + 1) + j;
      indices.push(k, k + SIDES + 1, k + 1, k + 1, k + SIDES + 1, k + SIDES + 2);
    }
  }
}
const glassGeometry = new THREE.BufferGeometry();
glassGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
glassGeometry.setAttribute('aSpine', new THREE.Float32BufferAttribute(coordinates, 1));
glassGeometry.setIndex(indices);
glassGeometry.computeVertexNormals();

const glassUniforms = {
  uTime: { value: 0 }, uFront: { value: 1.01 }, uCut: { value: 1.01 },
  uPulse: { value: 0 }, uWave: { value: 0 }
};
function makeGlass(isTip) {
  const material = new THREE.MeshPhysicalMaterial({
    color: 0xc5dfeb, metalness: 0.035, roughness: 0.045,
    transmission: 0.92, ior: 1.52,
    clearcoat: 1, clearcoatRoughness: 0.035,
    envMapIntensity: 1.05, transparent: true, opacity: 0.88,
    depthWrite: false, side: THREE.FrontSide
  });
  material.onBeforeCompile = shader => {
    Object.assign(shader.uniforms, glassUniforms);
    shader.vertexShader = shader.vertexShader.replace('#include <common>', `
      #include <common>
      attribute float aSpine;
      varying float vSpine;
      varying vec3 vObject;
    `).replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vSpine = aSpine; vObject = position;
    `);
    shader.fragmentShader = shader.fragmentShader.replace('#include <common>', `
      #include <common>
      varying float vSpine;
      varying vec3 vObject;
      uniform float uTime, uFront, uCut, uPulse, uWave;
    `).replace('#include <clipping_planes_fragment>', `
      #include <clipping_planes_fragment>
      ${isTip ? 'if (vSpine < 0.982) discard;' : 'if (vSpine > min(uFront, uCut)) discard;'}
    `).replace('#include <tonemapping_fragment>', `
      // Crossed polarizers: stress-optic retardation through a tensile core
      // and compressive skin. Three wavelength samples approximate white light.
      float mu = clamp(abs(dot(normalize(normal), normalize(vViewPosition))), 0.0, 1.0);
      float fresnel = pow(1.0 - mu, 3.0);
      float core = pow(mu, 0.68);
      float retardance = (20.6 * core - 6.9 * pow(core, 4.0)) * (0.70 + 0.30 * exp(-vSpine * 7.0));
      retardance += uPulse * sin(vSpine * 43.0 - uTime * 19.0) * (0.3 + 0.7 * core);
      vec3 spectralPhase = sin(retardance * vec3(1.0, 1.28, 1.52));
      vec3 fringes = spectralPhase * spectralPhase;
      float polarizer = 0.4 + 0.6 * pow(sin(atan(normal.y, normal.x) * 2.0 + 0.45), 2.0);
      vec3 stress = fringes * polarizer * (0.075 + uPulse * 0.075) * smoothstep(0.025, 0.22, mu);
      vec3 specularLight = reflectedLight.directSpecular + reflectedLight.indirectSpecular;
      vec3 internalReflection = vec3(0.0);
      #ifdef ENVMAP_TYPE_CUBE_UV
        vec3 transmittedRay = refract(-normalize(vViewPosition), normal, 1.0 / 1.52);
        vec3 backNormal = normalize(vec3(-normal.xy, normal.z));
        vec3 exitRay = inverseTransformDirection(reflect(transmittedRay, backNormal), viewMatrix);
        internalReflection = textureCubeUV(envMap, exitRay, 0.04).rgb * 0.055 * pow(1.0-mu,0.4);
      #endif
      // Clear glass has specular and transmitted light, with no chalky diffuse lobe.
      gl_FragColor.rgb = specularLight * 1.65 + internalReflection + stress + vec3(0.004,0.009,0.014);
      gl_FragColor.a = clamp(0.66 + 0.32 * fresnel, 0.0, 0.98);
      float frontBand = (1.0 - smoothstep(0.0, 0.035, uFront - vSpine)) * uWave;
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.8, 2.15, 2.45), frontBand * 0.94);
      gl_FragColor.a = mix(gl_FragColor.a, 1.0, frontBand);
      #include <tonemapping_fragment>
    `);
  };
  material.customProgramCacheKey = () => isTip ? 'severed-glass-v1' : 'quenched-glass-v1';
  return material;
}
const drop = new THREE.Mesh(glassGeometry, makeGlass(false));
drop.renderOrder = 3;
scene.add(drop);
const tailTip = new THREE.Mesh(glassGeometry, makeGlass(true));
tailTip.visible = false;
tailTip.renderOrder = 3;
scene.add(tailTip);

// Fine wire and an unobtrusive, anodized suspension collar around the neck.
const anodized = new THREE.MeshStandardMaterial({ color: 0x161c25, metalness: 0.85, roughness: 0.32 });
const steel = new THREE.MeshStandardMaterial({ color: 0xa0acb8, metalness: 0.94, roughness: 0.24 });
const bevelSteel = new THREE.MeshStandardMaterial({ color: 0xd0d7df, metalness: 0.98, roughness: 0.15 });
const gripMaterial = new THREE.MeshStandardMaterial({ color: 0x18242b, metalness: 0.0, roughness: 0.72, envMapIntensity: 0.24 });
const brushPixels = new Uint8Array(128 * 128 * 4);
for (let y = 0; y < 128; y++) {
  const groove = 142 + Math.floor(random() * 78);
  for (let x = 0; x < 128; x++) {
    const k = (y * 128 + x) * 4, value = clamp(groove + (random() - 0.5) * 16, 0, 255);
    brushPixels[k] = brushPixels[k + 1] = brushPixels[k + 2] = value;
    brushPixels[k + 3] = 255;
  }
}
const brushedTexture = new THREE.DataTexture(brushPixels, 128, 128, THREE.RGBAFormat);
brushedTexture.wrapS = brushedTexture.wrapT = THREE.RepeatWrapping;
brushedTexture.magFilter = THREE.LinearFilter;
brushedTexture.minFilter = THREE.LinearMipmapLinearFilter;
brushedTexture.generateMipmaps = true;
brushedTexture.repeat.set(3, 3);
brushedTexture.needsUpdate = true;
steel.roughnessMap = brushedTexture;
steel.roughness = 0.38;
steel.bumpMap = brushedTexture;
steel.bumpScale = 0.0018;
const holder = section(0.445);
const suspensionCurve = new THREE.CatmullRomCurve3([
  v3(-1.68, 5.8, -0.35), v3(-1.37, 3.8, -0.27),
  v3(-0.78, 1.55, -0.11), holder.p.clone().add(v3(-0.06, 0.03, -0.04))
]);
scene.add(new THREE.Mesh(new THREE.TubeGeometry(suspensionCurve, 70, 0.005, 5, false), anodized));
const collar = new THREE.Mesh(new THREE.TorusGeometry(holder.r + 0.013, 0.013, 8, 36), anodized);
collar.position.copy(holder.p);
collar.quaternion.setFromUnitVectors(v3(0, 0, 1), holder.t);
scene.add(collar);

// Forged cutter arms, separate cutting bevels, pivot and textured grips.
function extrudedPolygon(points, depth, material, bevel = 0.018) {
  const shape = new THREE.Shape();
  points.forEach((p, i) => i ? shape.lineTo(p[0], p[1]) : shape.moveTo(p[0], p[1]));
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: bevel, bevelThickness: bevel });
  g.translate(0, 0, -depth / 2);
  return new THREE.Mesh(g, material);
}
const cutter = new THREE.Group();
const cutPoint = spine.getPointAt(CUT_S);
cutter.rotation.set(-0.16, -0.21, 0.035);
cutter.position.copy(cutPoint).add(v3(0.76, 0, 0.015));
scene.add(cutter);
const arms = [];
for (const sign of [1, -1]) {
  const arm = new THREE.Group();
  const outline = [[-0.76, 0.008], [-0.64, 0.15], [-0.32, 0.235], [0.03, 0.19], [0.22, 0.08], [0.15, -0.10], [-0.22, -0.04], [-0.62, 0.006]];
  arm.add(extrudedPolygon(outline.map(p => [p[0], p[1] * sign]), 0.16, steel));
  const blade = extrudedPolygon([[-0.765, 0], [-0.65, 0.075 * sign], [-0.40, 0.075 * sign], [-0.61, 0.005 * sign]], 0.178, bevelSteel, 0.005);
  arm.add(blade);
  const handle = [[-0.04, -0.02], [0.14, 0.11], [0.43, -0.13], [1.39, -0.39], [1.46, -0.53], [1.32, -0.61], [0.38, -0.31]];
  arm.add(extrudedPolygon(handle.map(p => [p[0], p[1] * sign]), 0.13, steel, 0.035));
  const grip = [[0.44, -0.16], [1.37, -0.39], [1.50, -0.48], [1.46, -0.62], [1.31, -0.67], [0.41, -0.36]];
  arm.add(extrudedPolygon(grip.map(p => [p[0], p[1] * sign]), 0.21, gripMaterial, 0.055));
  for (let j = 0; j < 10; j++) {
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.17, 0.008), anodized);
    rib.position.set(0.54 + j * 0.075, sign * (-0.275 - j * 0.021), 0.14);
    rib.rotation.z = sign * -0.26;
    arm.add(rib);
  }
  arm.position.z = sign * 0.025;
  cutter.add(arm); arms.push(arm);
}
const pivot = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.115, 0.255, 40), bevelSteel);
pivot.rotation.x = Math.PI / 2;
pivot.position.z = 0.075;
cutter.add(pivot);
const pivotInner = new THREE.Mesh(new THREE.CylinderGeometry(0.071, 0.071, 0.015, 6), anodized);
pivotInner.rotation.x = Math.PI / 2;
pivotInner.position.z = 0.215;
cutter.add(pivotInner);
const pivotSlot = new THREE.Mesh(new THREE.BoxGeometry(0.077, 0.013, 0.006), steel);
pivotSlot.position.set(0, 0, 0.226);
pivotSlot.rotation.z = 0.35;
cutter.add(pivotSlot);

// The incoming projectile is soft lead with a thin copper driving band.
const impactSection = section(0.135);
const impactPoint = impactSection.p.clone().addScaledVector(impactSection.u, impactSection.r);
const bullet = new THREE.Group(); scene.add(bullet);
const lead = new THREE.MeshStandardMaterial({ color: 0xa4aab3, metalness: 0.91, roughness: 0.24 });
const copper = new THREE.MeshStandardMaterial({ color: 0xc58d5e, metalness: 0.91, roughness: 0.23 });
const profile = [[0, 0], [0.035, 0.015], [0.085, 0.075], [0.135, 0.19], [0.180, 0.34], [0.185, 0.58], [0.179, 0.70], [0.145, 0.72], [0, 0.72]];
const bulletGeometry = new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), 64);
const bulletBase = new Float32Array(bulletGeometry.attributes.position.array);
const bulletMesh = new THREE.Mesh(bulletGeometry, lead);
bulletMesh.rotation.z = -Math.PI / 2;

scrubber.addEventListener('input', () => {
  hideCountdown(); countdownElapsed = 0; holdElapsed = 0; previousTimestamp = performance.now();
  simTime = clamp(parseFloat(scrubber.value) || 0, 0, DURATION);
  setState(STATES.PAUSED); renderAt(simTime);
});
window.addEventListener('resize', () => {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  frameCamera();
  dustMaterial.uniforms.uHeight.value = window.innerHeight * renderer.getPixelRatio();
  renderAt(simTime);
});

// Warm every phase before presenting the resting scene and starting the clock.
// No first-use shader compilation can skip a countdown number or fracture frame.
const colorManagedMaterials = new Set();
scene.traverse(object => {
  if (object.material && object.material.isMeshStandardMaterial && !colorManagedMaterials.has(object.material)) {
    object.material.color.convertSRGBToLinear();
    colorManagedMaterials.add(object.material);
  }
});
renderer.compile(scene, camera);
renderAt(0);
countdown.style.display = 'block';
countdown.textContent = '3';
function frame(timestamp) {
  requestAnimationFrame(frame);
  if (previousTimestamp === null) {
    previousTimestamp = timestamp; countdownElapsed = 0;
    return;
  }
  const rawDt = Math.max(0, (timestamp - previousTimestamp) / 1000);
  previousTimestamp = timestamp;
  const dt = Math.min(rawDt, 0.1);
  if (state === STATES.COUNTDOWN) {
    countdownElapsed += dt;
    if (countdownElapsed + 1e-9 < 3) {
      countdown.style.display = 'block';
      countdown.textContent = String(3 - Math.floor(countdownElapsed + 1e-9));
      simTime = 0; scrubber.value = '0';
      return;
    }
    hideCountdown(); setState(STATES.PLAYING);
  } else if (state === STATES.REFIRE_HOLD) {
    holdElapsed += dt;
    if (holdElapsed + 1e-9 < 1) return;
    setState(STATES.PLAYING);
  }
  if (state === STATES.PLAYING) {
    simTime = Math.min(DURATION, simTime + dt * playbackSpeed);
    if (simTime >= DURATION - 1e-9) { simTime = DURATION; setState(STATES.ENDED); }
    showTime();
  }
}
requestAnimationFrame(frame);
</script>
